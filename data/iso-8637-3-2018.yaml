abstract:
- language: en
  script: Latn
  content: This document specifies requirements and acceptance criteria (including
    test methods) for safety related parameters for plasmafilters. Only those requirements
    that are specific to plasmafilters have been included. It specifies requirements
    for sterile, single-use plasmafilters, intended for use on humans. This document
    does not cover matters related to toxicity. Such issues are covered in relevant
    parts of ISO 10993. It does not apply to the extracorporeal circuits that can
    be used for plasmapheresis vascular access devices, oxygenators or active medical
    devices. This document does not address the replacement fluid.
