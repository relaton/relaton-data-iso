abstract:
- language: en
  script: Latn
  content: This document specifies terms and associated definitions that are typically
    used for fine ceramics (advanced ceramic, advanced technical ceramic) materials,
    products, applications, properties and processes. This document also includes
    abbreviated terms that have found general acceptance in scientific and technical
    literature; each abbreviation is given with the corresponding full term and definition
    or description. In this document, terms are defined using the term ‘fine ceramic’.
    The definitions apply equally to ‘advanced ceramics’ and ‘advanced technical
    ceramics’, which are considered to be equivalent. This document does not include
    terms which, though used in the field of fine ceramics, are of a more general
    nature and are also well known in other fields of technology. NOTE           
    Terms and definitions of a more general nature are available in ASTM C 1145, EN
    14232 and JIS R 1600.
