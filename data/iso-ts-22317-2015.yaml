abstract:
- language: en
  script: Latn
  content: ISO/TS 22317:2015 provides guidance for an organization to establish, implement,
    and maintain a formal and documented business impact analysis (BIA) process. This
    Technical Specification does not prescribe a uniform process for performing a
    BIA, but will assist an organization to design a BIA process that is appropriate
    to its needs. ISO/TS 22317:2015 is applicable to all organizations regardless
    of type, size, and nature, whether in the private, public, or not-for-profit sectors.
    The guidance can be adapted to the needs, objectives, resources, and constraints
    of the organization. It is intended for use by those responsible for the BIA process.
