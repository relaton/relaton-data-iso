abstract:
- language: en
  script: Latn
  content: This document describes tools and gives guidance concerning interlaboratory
    trials related to fire effluent analyses. It explains the relative contributions
    from the physical fire model and analytical techniques to evaluate trueness and
    fidelity. It also explains the difficulties involved with the interpretation of
    round-robin data and with the evaluation of trueness in fire effluent analyses.
    This document complements ISO 12828-1, which deals with limits of quantification
    and detection and ISO 12828-2, which deals with interlaboratory validation of
    analytical methods. It is a toolbox useful in the framework of ISO/IEC 17025 assessment
    of any fire laboratory. Examples of existing standards where the information contained
    in this document can be used are the analytical chemical methods in ISO 19701[2],
    ISO 19702[3], ISO 5660-1[4], and the chemical measurements in the methods discussed
    in ISO/TR 16312-2, ISO 16405[6], ISO/TS 19021[7], or their application to fire
    toxicity assessment using ISO 13571[1] and ISO 13344[8].
