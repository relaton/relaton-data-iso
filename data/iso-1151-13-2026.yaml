  content: This document defines terms used in the field of pilot training with the use of technical equipment, called flight simulators, enhancing safety by allowing pilots to practice various scenarios in a controlled environments, without the need of an actual aircraft. This document establishes the terms and definitions of the basic concepts applied in science, engineering and manufacturing in the field of flight simulation training devices (airplane and helicopter).
