abstract:
- language: en
  script: Latn
  content: ISO 21347:2005 establishes general requirements for the application of
    fracture control technology to fracture critical items (FCIs) fabricated by metallic,
    non-metallic or composite materials. It also establishes mechanical damage control
    requirements for mechanical damage critical items (MDCIs) fabricated by composite
    materials. These requirements, when implemented on a particular space system,
    may assure a high level of confidence in achieving safe operation and mission
    success. The requirements set forth in ISO 21347:2005 are the minimum fracture
    control and mechanical damage control requirements for FCIs and MDCIs in general
    space systems, including launch vehicles and spacecraft. With necessary modifications,
    these requirements may also be applicable to reusable launch vehicles (RLVs).
    ISO 21347:2005 is not applicable to the NASA Space Shuttle and its payloads or
    the International Space Station and its equipment since they already have a set
    of specific requirements suitable for their special applications. ISO 21347:2005
    is not applicable in processing detected defects.
