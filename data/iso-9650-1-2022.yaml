abstract:
- language: en
  script: Latn
  content: 'This document specifies the minimum requirements for design, performance
    and marking, and gives the test methods for inflatable liferafts of type 1 and
    type 2: —    having a carrying capacity of 4 persons to 16 persons; —    intended
    for small craft of a hull length of up to 24 m; —    intended for launching overboard
    from a height not exceeding 6 m. NOTE      Type 1 and type 2 liferafts are defined
    in 4.2.'
