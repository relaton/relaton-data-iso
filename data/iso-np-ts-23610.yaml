abstract:
- language: en
  script: Latn
  content: This Technical Report describes the metering challenges and approaches
    to the measurement of wet gas flows as required by renewable energy applications,
    e.g.. hydrogen with entrained water flow, gas / liquid carbon dioxide flow, wet
    biogas flow, and geothermal saturated steam flow. The energy industry that developed
    and used wet natural gas flow meters has broadened its interest and activity into
    renewable energy related wet gas flows, e.g. hydrogen storage, geothermal steam,
    carbon capture and storage, biogas wet gas flows. Hydrogen extracted from storage
    has entrained water, carbon capture flows are often processed close to the phase
    boundary producing wet gas flow, biogas is often wet, some solar field designs
    have wet saturated steam flows, and geothermal power plants receive wet saturated
    steam from the geothermal wells. All applications lie outside of the scope of
    wet natural gas metering standards documents yet are analogous. There is dearth
    of information in the literature on how to approach such wet gas metering. However,
    some of the wet gas metering technology developed by the hydrocarbon production
    industry is applicable. This technical report discusses the wet natural gas metering
    technology applicable to such applications, inclusive of discussing the similarities
    and differences, and the pros and cons of different methods.
