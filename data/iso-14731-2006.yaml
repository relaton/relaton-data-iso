- language: en
  script: Latn
  content: ISO 14731:2006 identifies the quality-related responsibilities and tasks
    included in the coordination of welding-related activities. In any manufacturing
    organization, welding coordination can be undertaken by one or a number of persons.
    Welding coordination requirements can be specified by a manufacturer, a contract
    or an application standard.
