abstract:
- language: en
  script: Latn
  content: This document specifies the practical use of the fundamental concepts in
    ISO 11843 in case of the background noise predominance in instrumental analysis.
    This document specifies basic methods to —     extract the stochastic properties
    of the background noise, —     use the stochastic properties to estimate the SD
    or CV of the response variable, and —     calculate the minimum detectable value
    based on the SD or CV obtained above. The methods described in this document are
    useful for checking the detection of a certain substance by various types of measurement
    equipment in which the background noise of the instrumental output predominates
    over the other sources of measurement uncertainty. Feasible choices are visible
    and ultraviolet absorption spectrometry, atomic absorption spectrometry, atomic
    fluorescence spectrometry, luminescence spectrometry, liquid chromatography and
    gas chromatography.
