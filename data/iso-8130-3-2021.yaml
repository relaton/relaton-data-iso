- language: en
  script: Latn
  content: This document specifies a liquid displacement pycnometer method for the
    determination of the density of coating powders. The method is based on a determination
    of the mass and the volume of a test portion. Coating powders with density <1 g/cm3,
    can be measured in accordance with ISO 1183-1 and the appropriate method, by agreement.
