abstract:
- language: en
  script: Latn
  content: This document provides principles, service elements, service process and
    good practices for Professional Congress Organizers (PCOs) when delivering services
    related to the organization of congresses, conferences, conventions and other
    business events. It applies to PCOs offering full-service event management as
    well as those providing modular or partial services. This document is intended
    for independent PCO companies, event management agencies, and other service providers
    involved in the organization of professional events. It may also be used by clients—including
    associations, public institutions, corporations and international organizations—for
    selecting, contracting, monitoring and evaluating PCO services. This document
    does not apply to the organization of private events, weddings or other non-professional
    gatherings.
