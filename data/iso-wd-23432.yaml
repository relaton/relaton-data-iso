abstract:
- language: en
  script: Latn
  content: This document provides the insight of a non-destructive technique (NDT),
    Gamma Topography which is a higher sensitive and reliable NDT method that avoids
    larger exposures while testing the integrity of various shielding structures.
    This standard details its advantages over other methods and provides procedure
    to carry out Gamma Topography detailing all the requirements. Testing of integrity
    of a variety of shielding structures from liquid level to in-situ testing of reactor
    components, testing of shielding structures comprising of layers of different
    materials, testing of mockup structures to qualify a concrete or lead pouring
    technique is possible using Gamma Topography. The principle of the technique,
    equipment, pre examination and personnel requirements, examination method and
    measurement procedure, data interpretation and presentation, field problems, quality
    control for system performance/sensitivity and caution to be followed are the
    scope of this document.
