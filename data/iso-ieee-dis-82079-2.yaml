abstract:
- language: en
  script: Latn
  content: 'This is a New Work ballot to re-activate a cancelled project. This document
    specifies principles, requirements, recommendations and other provisions for preparing
    and presenting instructions for the assembly of self-assembly products intended
    for a non-skilled target audience assembling a product without help from a trainer
    or supervisor. This document is applicable to instructions for: — supporting the
    assembly of a product that is supplied as a kit of components designed to be assembled
    into a specific item, which can have alternative assembly configurations (often
    described as “flatpack products”); — installing products supplied with components
    (e.g. screws) intended for attachment to existing products (e.g. a vehicle) or
    fixtures (e.g. a wall); — erecting or configuring products that incorporate structural
    elements requiring folding, locking or tensioning (e.g. child pushchairs, camping
    equipment); — supporting the assembly of a specific product intended to be assembled
    by a non-skilled assembler for their own use or for use by another individual
    (e.g. assembly of a toy by a parent for subsequent use by a child). This document
    does not apply to: — components or constructional material supplied in combinations
    and numbers specified by the customer; — multiple identical kits supplied in batches
    for professional assembly and commercial sale as an assembled product; — products
    intended for professional assembly only by someone skilled or trained in assembling
    such products or by a skilled person whose relevant technical education, training
    or experience enables them to perceive risks and avoid hazards in the assembly
    and use of a category of products (e.g. electrician, vehicle mechanic). This document
    is applicable to all parties involved in the preparation of instructions for self-assembly,
    including: — product suppliers; — hardware and software product and information
    designers; — technical communicators and technical illustrators; — testers and
    evaluators; — managers; — safety authorities. This document is supplementary to
    IEC/IEEE 82079-1, which specifies provisions applicable to the preparation of
    all information for use of products – including self-assembly and all other phases
    (such as operation, maintenance and disposal).'
