abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for flexible thermoplastic polyurethane
    and polyamide tubing conveying compressed air, in sizes from 3 mm to 16 mm (1/8
    inch to 1/2 inch) outside diameter. Polyurethane tubings are dedicated for use
    in the temperature range from –20 °C to 60 °C, while polyamide tubings are dedicated
    for use in the temperature range from −20 °C to 80 °C. Working pressure depends
    on the tube size, the service temperature (see Table 13 and Table 14) and tubing
    material (see Table 15 and Table 16).
