abstract:
- language: en
  script: Latn
  content: This document establishes a classification of low corrosivity of indoor
    atmospheres. It specifies the reference metals for which a corrosion attack after
    a defined exposure period is used for determining corrosivity categories of indoor
    atmospheres of low corrosivity. It defines corrosivity categories of indoor atmospheres
    according to corrosion attack on standard specimens. It indicates important parameters
    of indoor atmospheres that can serve as a basis for an estimation of indoor corrosivity.
    The selection of a method for the determination of corrosion attack, description
    of standard specimens, exposure conditions and evaluation are given in ISO 11844-2.
    The measurement of environmental parameters affecting indoor corrosivity is given
    in ISO 11844-3.
