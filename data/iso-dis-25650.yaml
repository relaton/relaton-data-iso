abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and test methods for evaluation of
    the permanence and durability of self-adhesive labels intended for labelling of
    archive boxes (paper board) and other storage materials (such as metal or plastic)
    stored in libraries, archives, and other protected environments for long periods
    of time. The labels must retain their adhesion capability, and the permanence
    of images on them must be equivalent to that of images on permanent paper. It
    is applicable to: — labels stored in archival conditions (dry, cool, dark and
    no contact with water) — labels made of permanent paper (ISO 9706) or archival
    paper (ISO 11108) in combination with acrylate-based adhesive — written or printed
    images obtained from pens, copying machines and printers that meets the requirements
    in ISO 11798 — the substrate of intended use (sample substrate used for testing)
    It does not apply to: — labels stored under harmful conditions, such as high humidity
    that promotes microbiological attack, excessive heat, radiation (e.g. light),
    high levels of pollutants, or the risk of water damage (or water contact). — labels
    with non-permanent paper or other adhesive than acrylate-based — other substrates
    than intended use'
