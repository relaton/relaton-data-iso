abstract:
- language: en
  script: Latn
  content: This document provides guidance for manufacturers, service providers, and
    purchase managers of kiosks. This document specifies requirements and recommendations
    for designing, manufacturing, installing, and operating accessible kiosks to support
    diverse users. The requirements and recommendations describe information, functions,
    and operation methods of the kiosks. They are applied to hardware, software, and
    content of the kiosks as well as their installation environment.
