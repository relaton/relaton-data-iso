abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the installation of permanently
    installed liquefied petroleum gas (LPG) systems and LPG-burning appliances on
    small craft. This document is applicable to portable cooking appliances with internal
    LPG cartridges, with a capacity of 225 g or less (see Annex D). This document
    is applicable to the storage of all LPG cylinders. NOTE 1        National regulations
    can apply to the technical requirements of LPG cylinders. This document does not
    contain procedures for commissioning new LPG installations or system maintenance
    or upgrades. This document does not apply to LPG-fuelled propulsion engines or
    LPG-driven generators. NOTE 2        National codes and procedures appropriate
    to the country concerned can be available.
