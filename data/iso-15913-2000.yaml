abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for the determination of
    phenoxyalkanoic acids in ground and drinking water in mass concentrations W 50
    ng/l (detailed information is given in Table A.1 of annex A). Examples of phenoxyalkanoic
    acids which can be determined by this method are given in Table 1. This method
    may be applicable to compounds not mentioned in Table 1 or to other types of water.
    However, it is necessary to verify the applicability of this method for these
    special cases (see annex B). Table 1 — Plant treatment agents determined by this
    method
