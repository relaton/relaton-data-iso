abstract:
- language: en
  script: Latn
  content: This document specifies test requirements for the laboratory measurement
    of the sound insulation of building elements and products, including detailed
    requirements for the preparation and mounting of the test elements, and for the
    operating and test conditions. It also specifies the applicable quantities, and
    provides additional test information for reporting. The general procedures for
    airborne and impact sound insulation measurements are given in ISO 10140‑2 and
    ISO 10140-3, respectively.
