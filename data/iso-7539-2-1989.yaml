abstract:
- language: en
  script: Latn
  content: Covers procedures for designing, preparing and using bent-beam test specimens.
    These specimens may be used to test a variety of product forms (i. e. sheet, plate,
    flat extruded material, wire or rod). They are espesially suitable for multiple
    testing and for atmospheric stress corrosion tests; they are usually tested under
    nominally constant strain conditions. Bent-beam specimens made from high strength
    materials may fracture rapidly and can be dangerous.
