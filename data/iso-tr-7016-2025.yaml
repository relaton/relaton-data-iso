abstract:
- language: en
  script: Latn
  content: This document shows the relationship between the indicators in EN 17472
    and ISO 21928-2, used to assess the environmental, social, and economic performance
    of civil engineering works (CEW), and the Sustainable Development Goals (SDGs),
    which can serve as a tool to communicate the results of the assessment carried
    out with the methodology established in EN 17472 and ISO 21928-2. This document
    does not provide any criteria or rules for performing any kind of assessment.
    This document also provides information about how the SDGs are influenced by the
    performance of several CEW, based on the results of the assessment done according
    to either EN 17472 or ISO 21928-2, or both, and demonstrate their contributions
    to achieving the SDGs targets. The links provided can also be applied to address
    efforts towards satisfying specific SDGs.
