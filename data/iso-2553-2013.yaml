abstract:
- language: en
  script: Latn
  content: 'ISO 2553:2013 defines the rules to be applied for symbolic representation
    of welded joints on technical drawings. This may include information about the
    geometry, manufacture, quality and testing of the welds. The principles of this
    standard may also be applied to soldered and brazed joints. It is recognized that
    there are two different approaches in the global market to designate the arrow
    side and other side on drawings. In ISO 2553:2013: sections, tables and figures
    which carry the suffix letter "A" are applicable only to the symbolic representation
    system based on a dual reference line; sections, tables and figures which carry
    the suffix letter "B" are applicable only to the symbolic representation system
    based on a single reference line; sections, tables and figures which do not have
    the suffix letter "A" or "B" are applicable to both systems. The symbols shown
    may be combined with other symbols used on technical drawings, for example to
    show surface finish requirements. An alternative designation method is presented
    which may be used to represent welded joints on drawings by specifying essential
    design information such as weld dimensions, quality level, etc. The joint preparation
    and welding process(es) are then determined by the production unit in order to
    meet the specified requirements.'
