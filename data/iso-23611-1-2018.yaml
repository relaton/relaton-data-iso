abstract:
- language: en
  script: Latn
  content: This document specifies a method for sampling and handling earthworms from
    field soils as a prerequisite for using these animals as bioindicators (e.g. to
    assess the quality of a soil as a habitat for organisms). This document applies
    to all terrestrial biotopes in which earthworms occur. The sampling design of
    field studies in general is given in ISO 18400‑101 and guidance on the determination
    of effects of pollutants on earthworms in field situations is given in ISO 11268‑3.
    These aspects can vary according to the national requirements or the climatic/regional
    conditions of the site to be sampled (see also Annex C). This document is not
    applicable for semi-terrestrial soils and it can be difficult to use under extreme
    climatic or geographical conditions (e.g. in high mountains). Methods for some
    other soil organism groups, such as collembolans, are covered in other parts of
    ISO 23611.
