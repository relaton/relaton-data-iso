abstract:
- language: en
  script: Latn
  content: This International Standard specifies a procedure for radiation protection
    monitoring in nuclear installations for external exposure to weakly penetrating
    radiation, especially to beta radiation and describes the procedure in radiation
    protection monitoring for external exposure to weakly penetrating radiation in
    nuclear installations. This radiation comprises beta-minus radiation, beta-plus
    radiation and conversion electron radiation as well as photon radiation with energies
    below 15 keV. This International Standard describes the procedure in radiation
    protection planning and monitoring as well as the measurement and analysis to
    be applied. It applies to regular nuclear power plant operation including maintenance,
    waste handling and decommissioning. The recommendations of this International
    Standard may also be transferred to other nuclear fields including reprocessing,
    if the area-specific issues are considered. This International Standard may also
    be applied to radiation protection at accelerator facilities and in nuclear medicine,
    biology and research facilities.
