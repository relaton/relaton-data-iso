abstract:
- language: en
  script: Latn
  content: This document specifies a method for determination of the drainability
    of water from a pulp suspension in terms of the “Canadian Standard” freeness method
    in millilitres. In principle, this method is applicable to all kinds of pulp in
    aqueous suspension. NOTE            Treatments of pulp suspensions which produce
    a large proportion of fines can induce an anomalous rise in freeness (false freeness),
    as a rule at values below 100 ml.
