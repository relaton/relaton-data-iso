abstract:
- language: en
  script: Latn
  content: This document specifies the classification of and requirements for waxes
    used for dental casting (including products intended for CAD/CAM milling) using
    the lost-wax technique and dental baseplate preparation together with the test
    methods to be employed to determine compliance with these requirements. Solid
    polymer products (such as acrylics) for CAD/CAM work, and thermoplastic or photo-curing
    resins used in additive processes, are not covered by this document. This document
    does not include specific and quantitative requirements for freedom from biological
    hazards.
