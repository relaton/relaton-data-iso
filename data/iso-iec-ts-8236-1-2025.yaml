abstract:
- language: en
  script: Latn
  content: 'This document specifies a standardized method of optimizing IT provisioning
    within data centres by utilizing KPIs that enable the development of IT profiles
    for individual systems or platforms. The combination of the system and platform
    KPIs are used to establish an IT provisioning profile, establishing standard forecasting
    methods to optimize data centre resource effectiveness. This document: a)      
    defines a method for identifying benchmarks and trends in IT provisioning; b)      
    provides capability assessment/indicators of IT equipment over infrastructure
    life cycle, including preparatory, commissioning, expansion/contraction and/or
    retirement of IT equipment; c)        provides a framework to establish IT provisioning
    forecast; d)       provides a framework for IT provisioning output to be used
    as input to facility provisioning of space, power and cooling capacity requirements
    (see ISO/IEC TS 8236-2).'
