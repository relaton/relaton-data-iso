abstract:
- language: en
  script: Latn
  content: This document provides requirements for a biometric comparison methodology
    suitable for the on-card environment. In particular, it establishes the work-sharing
    on-card biometric comparison techniques that require an intensity exceeding the
    capabilities of integrated circuit cards (ICCs). This document does not establish
    —    architectures of biometric comparison using an ICC, —    on-card biometric
    comparison, both in sensor-off-card systems and as part of biometric system-on-card,
    —    security policies for on-card biometric comparison, —    requirements for
    off-card biometric comparison, —    requirements for biometric system-on-card
    (defined in the ISO/IEC 17839 series), or —    modality-specific requirements
    for storage and comparison.
