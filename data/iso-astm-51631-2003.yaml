abstract:
- language: en
  script: Latn
  content: ISO/ASTM 51631:2003 covers the preparation and use of semi-adiabatic calorimeters
    for measurement of absorbed dose and routine dosimeter calibration when irradiated
    with electrons for radiation processing applications. The calorimeters are either
    transported by a conveyor past a scanned electron beam or are stationary in a
    broadened beam. ISO/ASTM 51631:2003 applies to electron beams in the energy range
    from 1,5 to 12 MeV.
