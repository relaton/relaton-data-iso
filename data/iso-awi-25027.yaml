abstract:
- language: en
  script: Latn
  content: This document specifies the carbon footprint calculation methodology for
    measuring greenhouse gases generated during the use stage of lithium-ion batteries
    of electrically propelled road vehicles. It does not provide the carbon footprint
    calculation methodology for raw material acquisition stage, production stage,
    distribution stage and end-of-life stage. NOTE) For the carbon footprint calculation
    methodology for raw material acquisition stage, production stage, distribution
    stage and end-of-life stage, see IEC 63369.
