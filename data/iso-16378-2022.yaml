abstract:
- language: en
  script: Latn
  content: This document specifies the multiple measurement methods, instruments,
    equipment, and samples used to calculate the thermo-optical properties of thermal
    control materials. This document compares their features, indicates their limitations
    and biases, and guides the applications. This document also defines requirements
    for calibration and reference materials to ensure data quality. This document
    specifies the following test methods, including the configuration of samples and
    calculations. a) Solar absorptance using a spectrophotometer (αs) — Annex A. b)
    Solar absorptance using the comparative test method (αp) — Annex B. c) Hemispherical
    infrared emittance using the thermal test method (εh-t) — Annex C. d) Normal infrared
    emittance using an IR spectrometer (εn-s) — Annex D. e) Normal infrared emittance
    using ellipsoid collector optics (εn-e) — Annex E. f) Normal infrared emittance
    using two rotating cavities (εn-c) — Annex F.
