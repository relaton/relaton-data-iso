  content: ISO 17881-2:2016 specifies a test method for determining some phosphorous
    flame retardants in textiles by high performance liquid chromatography ? tandem
    mass spectrometry (HPLC-MS/MS). The method is applicable to all kinds of textile
    products. NOTE For tris (1-aziridinyl) phosphineoxide (TEPA), only unbonded TEPA
