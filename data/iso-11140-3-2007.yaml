abstract:
- language: en
  script: Latn
  content: ISO 11140-3:2007 specifies the requirements for chemical indicators to
    be used in the steam penetration test for steam sterilizers for wrapped goods,
    e.g. instruments and porous materials. The indicator for this purpose is a Class
    2 indicator as described in ISO 11140-1. Indicators complying with ISO 11140-3:2007
    are intended for use in combination with the standard test pack as described in
    EN 285. ISO 11140-3:2007 does not consider the performance of the standard test
    pack, but does specify the performance of the indicators.
