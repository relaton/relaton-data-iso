abstract:
- language: en
  script: Latn
  content: 'This document specifies a framework for building systems for the classification
    of requirements. Such systems can be used to indicate requirements of special
    importance, and communicate them for production set-up, verification, audit, etc.
    This document: —     gives background information why such systems are useful
    in many areas of manufacturing; —     can be referred to for the concept of classification
    of requirements; —     functions as a framework for applying such systems in technical
    product documentation (TPD); —     indicates the needed elements for a classification
    system; —     supports with aspects in the choice of symbols for a classification
    system. As a framework, this document does not give the details of a specific
    classification system. Instead, it functions as a basis for an organization-specific
    system which contains details such as notations and symbols, classification levels,
    assessment procedures, etc., including usage and interpretation in the TPD. This
    document does not specify the contractual consequences of a classification (e.g.
    needed actions such as choice of tools, reliability index or process capability
    for a classification level) nor other references to standards or documents for
    handling classifications and nonconformity to requirements.'
