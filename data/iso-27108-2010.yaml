abstract:
- language: en
  script: Latn
  content: ISO 27108:2010 specifies a method for the determination of the dissolved
    amount of selected plant treatment agents and biocide products in drinking water,
    ground water and surface water by solid‑phase microextraction (SPME) followed
    by gas chromatography-mass spectrometry (GC‑MS). The limit of determination depends
    on the matrix, on the specific compound to be analysed and on the sensitivity
    of the mass spectrometer. For most plant treatment agents and biocides to which
    ISO 27108:2010 applies, it is at least 0,05 µg/l. Validation data related to a
    concentration range between 0,05 µg/l and 0,3 µg/l have been demonstrated in an
    interlaboratory trial. This method may be applicable to other compounds not explicitly
    covered by ISO 27108:2010 or to other types of water. However, it is necessary
    to verify the applicability of this method for these special cases.
