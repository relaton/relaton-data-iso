abstract:
- language: en
  script: Latn
  content: ISO 11297-1:2013 specifies the requirements and test methods for plastics
    piping systems intended to be used for the renovation of underground drainage
    and sewerage networks under pressure. It is applicable to pipes and fittings,
    as manufactured, as well as to the installed lining system. It is not applicable
    to cover sprayed coatings, the existing pipeline or any annular filler. ISO 11297-1:2013
    gives the general requirements common to all relevant renovation techniques.
