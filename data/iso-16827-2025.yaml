abstract:
- language: en
  script: Latn
  content: This document specifies the general principles and techniques for the characterization
    and sizing of previously detected discontinuities in order to ensure their evaluation
    against applicable acceptance criteria. This document is applicable, in general
    terms, to discontinuities in those materials and applications covered by ISO 16810.
    Phased array techniques can also be applied but additional steps or verifications
    can be needed.
