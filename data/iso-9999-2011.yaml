abstract:
- language: en
  script: Latn
  content: 'ISO 9999:2011 establishes a classification of assistive products, especially
    produced or generally available, for persons with disability. Assistive products
    used by a person with disability, but which require the assistance of another
    person for their operation, are included in the classification. The following
    items are specifically excluded from ISO 9999:2011: items used for the installation
    of assistive products; solutions obtained by combinations of assistive products
    that are individually classified in ISO 9999:2011; medicines; assistive products
    and instruments used exclusively by healthcare professionals; non-technical solutions,
    such as personal assistance, guide dogs or lip-reading; implanted devices; and
    financial support.'
