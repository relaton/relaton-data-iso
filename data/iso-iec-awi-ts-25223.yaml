abstract:
- language: en
  script: Latn
  content: This document specifies general and technical guidance and requirements
    for the development and use of methods for the quantification of uncertainties
    in AI systems. This document defines fundamental terminology for uncertainty quantification
    in AI systems along with the characteristics of selected approaches to uncertainty
    quantification. The characteristics and approaches are then described through
    selected applications. This document describes aspects of quantification of uncertainties
    for all stages of the AI system life cycle.
