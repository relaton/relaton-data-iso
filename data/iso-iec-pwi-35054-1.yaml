abstract:
- language: en
  script: Latn
  content: This proposed standard will provide a guideline for measuring the quality
    of distributed ledger technology (DLT) systems based on ISO/IEC 25023. It focuses
    on selected quality measures that are particularly relevant to, or require reinterpretation
    for DLT systems due to their technical characteristics. The guideline includes
    key considerations, required input data, measurement procedures, and expected
    results for each selected measure to support the effective application of ISO/IEC
    25023 to DLT systems. This standard targets DLT systems and does not cover DLT-based
    services.
