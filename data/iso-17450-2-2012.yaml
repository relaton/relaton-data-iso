abstract:
- language: en
  script: Latn
  content: 1 Scope This part of ISO 17450 defines terms related to specifications,
    operators (and operations) and uncertainties used in geometrical product specifications
    (GPS) standards. It presents the basic tenets of the GPS philosophy while discussing
    the impact of uncertainty on those tenets, and examines the processes of specification
    and verification as they apply to GPS.
