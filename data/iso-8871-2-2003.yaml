abstract:
- language: en
  script: Latn
  content: ISO 8871-2:2003 specifies evaluation procedures applicable to elastomeric
    parts used for drug containers and medical devices in order to guarantee the product
    identity between the samples evaluated in the (suitability test) acceptance process
    and the current supplies. The physical and chemical test procedures specified
    in this part of ISO 8871 permit the determination of the typical characteristics
    of rubber materials, and may serve as a basis for agreements between manufacturer
    and user regarding the product consistency in subsequent supplies. An appropriate
    set of tests is selected, depending upon the type of rubber and its application.
    This part of ISO 8871 does not specify other requirements for rubber materials.
    These are laid down in the relevant product standards.
