abstract:
- language: en
  script: Latn
  content: ISO 7142:2007 specifies general methods of test for epoxy resins for use
    in paints, varnishes and similar products. It is also applicable to those solutions
    made from epoxy resins that are intended for use as binders for paints and varnishes.
    The test methods described are not intended for epoxy esters.
