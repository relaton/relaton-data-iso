abstract:
- language: en
  script: Latn
  content: 'This document specifies two test methods for the determination of water
    content of raw rubber and compounded rubber using a coulometric Karl Fischer titration
    method: —     method A uses an evaporator of heating tube type oven; —     method
    B uses an evaporator of vial type oven. It applies to the water content range
    between 0,01 % and 1 %. In case of dispute, method B is the preferred method.'
