abstract:
- language: en
  script: Latn
  content: This document specifies provisions for the use of a conceptual schema language
    within the context of modelling geographic information. The chosen conceptual
    schema language is a subset of the Unified Modeling Language (UML). This document
    specifies a UML profile for modelling geographic information. This document specifies
    a set of core data types for use in conceptual schemas. The standardization target
    type of this document is conceptual schemas describing geographic information.
