abstract:
- language: en
  script: Latn
  content: Web Content Accessibility Guidelines (WCAG) 2.2 defines how to make Web
    content more accessible to people with disabilities. Accessibility involves a
    wide range of disabilities, including visual, auditory, physical, speech, cognitive,
    language, learning, and neurological disabilities. Although these guidelines cover
    a wide range of issues, they are not able to address the needs of people with
    all types, degrees, and combinations of disability. These guidelines also make
    Web content more usable by older individuals with changing abilities due to aging
    and often improve usability for users in general. WCAG 2.2 success criteria are
    written as testable statements that are not technology-specific. Guidance about
    satisfying the success criteria in specific technologies, as well as general information
    about interpreting the success criteria, is provided in separate documents. The
    WCAG 2.2 standard, technical and educational material supporting implementation
    of WCAG 2.2, and translations of WCAG 2.2 are available from the Web Content Accessibility
    Guidelines (WCAG) Overview.
