abstract:
- language: en
  script: Latn
  content: This document specifies a spectrophotometric method by using 4-(2-pyridylazo)-resorcinol (PAR) for the determination of niobium in steel. The method is applicable to all types of steel with niobium contents between 0,005 % (mass fraction) and 1,3 % (mass fraction).
