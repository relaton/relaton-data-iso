abstract:
- language: en
  script: Latn
  content: ISO 7439:2002 is applicable to single-use copper-bearing intra-uterine
    contraceptive devices and their insertion instruments. ISO 7439:2002 is not applicable
    to intra-uterine contraceptive devices consisting only of a plastics body and
    intra-uterine contraceptive devices whose primary purpose is to release progestogens.
    Some aspects of ISO 7439:2002 are applicable to medicated intra-uterine devices
    and intra-uterine devices that do not contain copper.
