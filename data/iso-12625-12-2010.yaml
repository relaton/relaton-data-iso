abstract:
- language: en
  script: Latn
  content: ISO 12625-12:2010 specifies a test method for the determination of the
    tensile strength of perforated lines of tissue paper. It uses a tensile-testing
    apparatus operating with a constant rate of elongation. This method is only used
    for measuring machine-direction tensile strength, that is for cross-direction
    perforations on tissue paper. The calculation of perforation efficiency is also
    specified in ISO 12625-12:2010.
