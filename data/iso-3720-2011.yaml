abstract:
- language: en
  script: Latn
  content: ISO 3720:2011 specifies the parts of a named plant that are suitable for
    making black tea for consumption as a beverage and the chemical requirements for
    black tea that are used to indicate that tea from that source has been produced
    in accordance with good production practice. ISO 3720:2011 also specifies the
    packing and marking requirements for black tea in containers. ISO 3720:2011 is
    not applicable to scented or decaffeinated black tea.
