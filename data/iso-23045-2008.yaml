abstract:
- language: en
  script: Latn
  content: ISO 23045:2008 gives guidelines related to energy efficiency in buildings
    as introduced in ISO 16813. The objectives of ISO 23045:2008 are to assist designers
    and practitioners when collecting and providing the useful data that are required
    at different stages of the design process and to fulfil the definitions of the
    building as prepared by building designers. This International Standard applies
    to new buildings and is applicable to space air-conditioning equipment and the
    heating plant in new buildings.
