abstract:
- language: en
  script: Latn
  content: This document specifies the atmosphere for the conditioning and testing
    of samples of tobacco and tobacco products. It is primarily applicable to cigarettes;
    however, if not specified differently in other ISO standards, it can also be applied
    to tobacco, other tobacco products, and materials used in the manufacture of tobacco
    products for which prior conditioning is necessary. Standards for the conditioning
    and testing of other forms of tobacco, tobacco products, and materials can refer
    to all or part of this document.
