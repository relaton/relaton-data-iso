abstract:
- language: en
  script: Latn
  content: This part of ISO 2884 is one of a series dealing with the sampling and
    testing of paints, varnishes and related products. It supplements ISO 2431:1993,
    Paints and varnishes — Determination of flow time by use of flow cups. It specifies
    the general procedure to be followed in determining the dynamic viscosity of paints,
    varnishes and related products at a rate of shear between 9 000 s?1 and 12 000
    s?1. The value obtained gives information about the resistance offered by the
    material to brushing, spraying and roller coating during application. The method
    specified in this part of ISO 2884 is suitable for all paints and varnishes whether
    they are Newtonian in behaviour or not. Materials containing dispersions of large
    particles will produce spurious results.
