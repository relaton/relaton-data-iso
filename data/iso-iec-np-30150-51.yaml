abstract:
- language: en
  script: Latn
  content: This document specifies the design guideline for in-cabin services of affective
    computing user interfaces (AUIs), including data collection, recognition, strategy,
    and presentation of affects. This document is applicable to designers and developers
    of in-cabin system and software to meet the affective needs of users. The actions
    and controls to the power system, for example the control of driving system and
    manipulation system, are not in the scope of this document.
