  content: 1.1 Scope This standard identiÞes terms and concepts pertinent to the resolution
    of the Year 2000 issue, including the rollover from the year 1999 to 2000, incorrect
    recognition of leap years, and values in date Þelds used for non-date purposes,
    and provides deÞnitions of these terms and descriptions of these concepts. This
    standard does not speciÞcally address operating system anomalies such as might
    occur in the year 2038. 1.2 Purpose This standard provides a common lexicon with
    descriptions and deÞnitions for the Year 2000 issue. These descriptions and deÞnitions
    may be applied in whole or in part depending on the requirement. This standard
    is composed of a DeÞnitions Clause (3), a Concepts Clause (4), and two Annexes
    (A and B). 1.2.1 Concepts A concept is a set of interrelated ideas pertaining
    to the Year 2000 issue. This standard offers a description of these concepts.
    This is not an exhaustive list. 1.2.2 DeÞnitions These are focused meanings of
    terms fundamental to the resolution of the Year 2000 issue. 1.2.3 Annex A This
    annex outlines remediation techniques currently being used to make system elements
    Year 2000 compliant. This list of techniques is not exhaustive. It presents only
    those techniques acknowledged as having gained a signiÞcant amount of industry
    consensus. Along with the techniques is a list of supporting terms and their explanation.
    In addition, the annex brießy explains the role of special dates in the development
    of solutions for the Year 2000 problem. This annex is informative. 1.2.4 Annex
    B This is a bibliography listing other related publications. 1.3 Conformance Vendors
    who claim that their products conform to this standard declare that their use
    of the term ÒYear 2000 CompliantÓ is in accordance with the deÞnition in this
    standard.
