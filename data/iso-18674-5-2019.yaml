abstract:
- language: en
  script: Latn
  content: 'This document specifies the measurement of stress changes by means of
    total pressure cells (TPC). General rules of performance monitoring of the ground,
    of structures interacting with the ground, of geotechnical fills and of geotechnical
    works are presented in ISO 18674‑1. If applied in conjunction with ISO 18674‑4,
    this document allows the determination of effective stress acting in the ground.
    This document is applicable to: — monitoring changes of the state of stress in
    the ground and in geo-engineered structures (e.g. in earth fill dams or tunnel
    lining); — monitoring contact pressures at the interface between two media (e.g.
    earth pressure on retaining wall; contact pressure at the base of a foundation);
    — checking geotechnical designs and adjustment of construction in connection with
    the Observational Design procedure; — evaluating stability during or after construction.
    Guidelines for the application of TPC in geotechnical engineering are presented
    in Annex B. NOTE This document fulfils the requirements for the performance monitoring
    of the ground, of structures interacting with the ground and of geotechnical works
    by the means of total pressure cells as part of the geotechnical investigation
    and testing according to EN 1997-1[1] and EN 1997-2[2].'
