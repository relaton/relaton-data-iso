abstract:
- language: en
  script: Latn
  content: This document specifies a method of determining the urease activity of
    products derived from soya beans. The method allows inadequate cooking of these
    products to be detected. It is applicable to products having a urease activity
    of less than 1 mg of nitrogen per gram of product as received, under the conditions
    specified. For more active products, the method is applicable provided that the
    mass of the test portion is reduced (see 9.1).
