abstract:
- language: en
  script: Latn
  content: This document specifies the performance requirements, methods of testing
    and test results of wave‑measurement‑based anti-parametric roll decision support
    system to supplement the requirement on simplified operational guidance of IMO
    MSC. 1/Circ.1627. A wave‑measurement‑based anti-parametric roll decision support
    system is a system that automatically provides an operational guide for selecting
    both ship speed and course to avoid severe parametric rolling of the ship in waves
    based on the instantaneous loading and wave conditions. It is intended to support
    the decision-making process onboard to avoid cargo loss accidents at sea. The
    wave‑measurement‑based anti-parametric roll decision support system is mainly
    composed of a wave sensor, an electric inclinometer, draught gauges, a computer,
    a display, an input device and an interface to other systems. It does not apply
    to the wave‑measurement‑based anti-parametric roll decision support system installed
    for purposes which are outside the scope of this document, e.g. preventing broaching.
