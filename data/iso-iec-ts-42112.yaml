abstract:
- language: en
  script: Latn
  content: This document describes the characteristics that impact machine learning
    model training efficiency and then provides the optimization approaches that apply
    to these characteristics. This document provides AI providers and AI producers
    with a set of characteristics and the related optimizations that they can use
    to enhance their machine learning model training efficiency. AI providers and
    AI producers can also use this information to evaluate different machine learning
    model training approaches. This document does not specify any training accelerating
    mechanisms provided and implemented within machine learning computing device defined
    in ISO /IEC TR 17903 and its library.
