abstract:
- language: en
  script: Latn
  content: ISO 18388:2016 specifies a series of relief grooves for shafts and holes,
    intended for general use in mechanical engineering. It also intends to avoid unnecessary
    multiplicity of tools by a restricted selection of groove-types and dimensional
    versions. NOTE The shape and the dimensions of the relief grooves type G and H
    correspond with the "Indexable hard material inserts" according to ISO 6987.
