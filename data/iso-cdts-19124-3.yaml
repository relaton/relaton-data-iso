abstract:
- language: en
  script: Latn
  content: This Technical Specification defines the calibration and validation of
    Earth observing data acquired by optical sensors and products derived from optical
    data. Addressing both traditional and newly emerging applications, it introduces
    new working modes for existing optical satellites, which leverage the potential
    of massive amounts of data and address the evolving requirements for remote sensing
    data and derived data standards. Additionally, this specification extends the
    types of products specifically to include both numerical and categorical products,
    as well as stereoscopical and video products. In this specification, the term
    calibration refers to the process to correct the data, not only geometrically,
    radiometrically and spectrally, but also characteristically for qualitative and
    quantitative applications. The term validation refers to the process of evaluating
    the quality and accuracy of the calibrated data and derived products. The term
    derived products refer to the products that are not directly measured by sensors
    but derived from direct sensor measurements by algorithms or models. This Technical
    Specification also addresses the associated metadata related to calibration and
    validation that has not been defined in other ISO geographic information standards.
    This technical specification does not address the calibration of optical sensors
    and validation of optical sensor calibration, which are covered by ISO 19159-1.
