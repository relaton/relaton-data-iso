abstract:
- language: en
  script: Latn
  content: This document specifies fundamental requirements for non-invasive, active
    and non-active ophthalmic instruments and to devices for enhancing low vision.
    This document is also applicable to tonometers, but not to other ophthalmic instruments
    which are used in contact with the globe of the eye. This document is not applicable
    to operation microscopes, endoscopes and devices intended for laser investigation
    or laser treatment of the eye.
