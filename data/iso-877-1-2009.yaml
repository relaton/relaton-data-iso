abstract:
- language: en
  script: Latn
  content: ISO 877-1:2009 provides information and general guidance on the selection
    and use of the methods of exposure to solar radiation described in detail in subsequent
    parts of ISO 877. These methods of exposure to solar radiation are applicable
    to plastics materials of all kinds as well as to products and portions of products.
    It also specifies methods for determining radiant exposure. It does not include
    direct weathering using black-box test fixtures, which simulate higher end-use
    temperatures in some applications.
