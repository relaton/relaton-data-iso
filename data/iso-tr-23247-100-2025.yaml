abstract:
- language: en
  script: Latn
  content: This document describes a digital twin for monitoring and controlling the
    semiconductor ingot growth process. The use case is analysed and designed using
    the ISO 23247 series. The result is a systematic view of the use case implementation
    and a high-level design of the digital twins, which can be directly implemented
    using the readily available tools and languages, including those supported by
    the relevant standards.
