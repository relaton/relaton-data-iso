abstract:
- language: en
  script: Latn
  content: This document describes best practices for processing and management of
    pathogen reference genome data. This document provides data models for reference
    genomes and information models for their metadata description. This document specifies
    the requirements for the construction and quality control of pathogen genome reference
    databases, including the data sources for the reference database, data quality
    control, accuracy assessment, achievement of a unified data format and validation
    of the performance of the database. This document is applicable to the reference
    databases required for comparison of products that utilize pathogen genome and
    metagenomic next-generation sequencing technologies for the analysis of human
    samples, such as blood infection samples, central nervous system infection samples,
    and samples with lower respiratory infections.
