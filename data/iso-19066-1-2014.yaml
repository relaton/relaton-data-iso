abstract:
- language: en
  script: Latn
  content: ISO 19066-1:2014 establishes a system of designation for methyl methacrylate-acrylonitrile-butadiene-styrene
    (MABS) moulding and extrusion materials, which can be used as the basis for specifications.
    The types of MABS plastic are differentiated from each other by a classification
    system based on appropriate levels of the designatory properties a) Vicat softening
    temperature, b) melt volume-flow rate, c) Charpy notched impact strength, and
    d) tensile modulus, and on information about composition, intended application
    and/or method of processing, important properties, additives, colorants, fillers,
    and reinforcing materials.
