abstract:
- language: en
  script: Latn
  content: 'ISO 683-18:2014 specifies the technical delivery requirements for bright
    steel bars in the drawn or peeled/turned condition and they are intended for mechanical
    purposes, for example for machine parts. The bright bars are subdivided into the
    following steel types: a) non-alloy general engineering steels; b) non-alloy free-cutting
    steels; c) non-alloy and alloy case-hardening steels; d) non-alloy and alloy steels
    for quenching and tempering; e) stainless steels. In addition ISO 683-18:2014,
    the general technical delivery requirements of ISO 404 are applicable.'
