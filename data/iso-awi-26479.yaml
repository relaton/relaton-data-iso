abstract:
- language: en
  script: Latn
  content: This document specifies a method to identify and quantify trace chemicals
    potentially present in single-use AHPs. It is applicable for the investigation
    of single-use baby diapers, single-use menstrual products and single-use adult
    incontinence products. The results of this method are dependent on the prescribed
    extraction conditions, in which simulated body fluids are used exclusively.
