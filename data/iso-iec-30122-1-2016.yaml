abstract:
- language: en
  script: Latn
  content: ISO/IEC 30122-1:2016 defines a framework and general guidance for essential
    voice commands. It provides a limited number of commands which could be memorized
    to facilitate the use of the information/communication technology (ICT) devices
    including computers, personal digital assistants (PDAs), tablets, mobile devices,
    car navigation systems and business machines. It does not include the natural
    sentence recognition by using natural language processing technology.
