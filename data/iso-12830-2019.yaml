abstract:
- language: en
  script: Latn
  content: This document specifies the procedure for the determination of acid-soluble
    magnesium, calcium, manganese, iron, copper, sodium and potassium by atomic absorption
    spectrometry (AAS) or by inductively coupled plasma emission spectrometry (ICP/ES).
    The acid-soluble element comprises the acid-soluble part of the incineration residue,
    i.e. that part of the ignition residue obtained after incineration which is soluble
    in hydrochloric acid or nitric acid. In cases where the residue is completely
    soluble, the result obtained by the procedure specified in this document is a
    measure of the total amount of each element in the sample. This document is applicable
    to all types of paper, board, pulps and cellulose nanomaterials. The limit of
    determination depends on the element and on the instrument used.
