abstract:
- language: en
  script: Latn
  content: ISO 9142:2003 describes laboratory ageing conditions under which adhesive
    joints may be exposed to various environmental influences -- climatic or chemical
    -- for the purpose of assessing the effects of such influences on certain properties.
    The ageing conditions are applicable to bonded assemblies and may be used to constitute
    a set of tests for the evaluation of an adhesive. The results obtained using the
    procedures described in this International Standard are not necessarily applicable
    to the determination of the service life of a bonded assembly because there is
    no direct relation between the test results and the behaviour of a bonded assembly
    over a period of time under service conditions. However, for certain specific
    applications, experience with the procedures may enable a correlation to be established.
