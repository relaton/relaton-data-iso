abstract:
- language: en
  script: Latn
  content: This document specifies dimensions of tapered shanks for modular taper interfaces with ball track system with four locking elements for automatic and manual tool exchange to be applied on machine tools (e.g. lathe machines, drilling machines, milling machines and turn/milling machine centres). A range of shank sizes is specified. Details of the coolant sealing coolant tube and coolant sealing O-ring shall be specified according to Annex A and Annex B. The shank incorporates a flange with a groove to enable automatic tool exchange. The tools can also be exchanged manually. The clamping of the shank can be realized using locking balls of a standard size and by a variety of mechanisms.
