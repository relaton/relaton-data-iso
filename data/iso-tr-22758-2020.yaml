abstract:
- language: en
  script: Latn
  content: This document provides guidance to biobanks on how to implement the quality
    management, management, and technical requirements of ISO 20387. It expands on
    aspects of ISO 20387 and provides examples for illustration purposes. The aim
    of this document is to assist biobanks to address competency of personnel and
    appropriate quality of biological material and data collections. This document
    is equally applicable to newly established and existing biobanks. This document
    is applicable to all organizations performing biobanking, including biobanking
    of biological material from multicellular organisms (e.g., human, animal, fungus
    and plant) and microorganisms for research and development. This document does
    not apply to biological material intended for feed/food production, laboratories
    undertaking analysis for food/feed production and/or therapeutic use.
