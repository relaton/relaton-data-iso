abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the resistance
    of fabrics coated with rubber or plastics to ozone cracking under static conditions.
    The test is designed to determine the relative resistance to cracking of fabric
    coated with rubber or plastics when exposed under static strain to air containing
    ozone in the absence of direct sunlight. Like all ageing tests, it should be considered
    as a means of comparing articles of the same composition and destined for the
    same application, but not as an absolute criterion. It is preferable to limit
    the significance of the test by considering it only as a means of control when
    a fabric attains a resistance superior to a threshold given in comparison with
    a certain type of degradation. Taking these remarks into account, the results
    obtained at the time of test cannot be taken as a prediction of the length of
    life of the product.
