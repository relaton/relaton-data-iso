abstract:
- language: en
  script: Latn
  content: ISO 21952:2007 specifies requirements for classification of wire electrodes,
    wires and rods for gas-shielded metal arc welding and tungsten inert-gas welding
    of creep-resisting steels, and for their deposits in the as-welded or post-weld
    heat-treated condition. One wire electrode can be tested and classified with different
    shielding gases. ISO 21952:2007 is a combined specification providing for classification
    utilizing a system based upon the chemical composition of wire electrodes, wires
    and rods with requirements for yield strength and average impact energy of 47
    J of all-weld metal, or utilizing a system based upon the tensile strength of
    the all-weld metal deposits and the chemical composition of wire electrodes, wires
    and rods.
