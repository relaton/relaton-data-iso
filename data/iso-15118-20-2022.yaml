abstract:
- language: en
  script: Latn
  content: This document specifies the communication between the electric vehicle
    (EV), including battery electric vehicle (BEV) and plug-in hybrid electric vehicle
    (PHEV), and the electric vehicle supply equipment (EVSE). The application layer
    messages defined in this document are designed to support the electricity power
    transfer between an EV and an EVSE. This document defines the communication messages
    and sequence requirements for bidirectional power transfer. This document furthermore
    defines requirements of wireless communication for both conductive charging and
    wireless charging as well as communication requirements for automatic connection
    device and information services about charging and control status. The purpose
    of this document is to detail the communication between an electric vehicle communication
    controller (EVCC) and a supply equipment communication controller (SECC). Aspects
    are specified to detect a vehicle in a communication network and enable an Internet
    Protocol (IP) based communication between the EVCC and the SECC. 
