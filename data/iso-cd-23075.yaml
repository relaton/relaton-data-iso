abstract:
- language: en
  script: Latn
  content: 'This document describes a procedure for the determination of the following
    antidegradants in vulcanized rubbers: —    aminoketone group; —    naphthylamine
    group; —    diphenylamine group; —    p-phenylenediamine; —    monophenol group.
    The groups of antidegradants are summarized in Table A.1 with the chemical names,
    the abbreviated terms and the CAS registry numbers. Extender oils, when present,
    can interfere. For poly-2,2,4-trimethyl-1,2-dihydroquinoline, the method provides
    only an approximation because of its polymeric nature.'
