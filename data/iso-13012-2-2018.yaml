abstract:
- language: en
  script: Latn
  content: 'This document specifies the boundary dimensions, other relevant dimensions
    and the corresponding tolerances of accessories for sleeve type linear ball bearings
    which are specified in ISO 10285. This document applies to: — the following housings:
    — closed and adjustable flangeless housings for series 5 sleeve type linear ball
    bearings, — open and open adjustable flangeless housings for series 5 sleeve type
    linear ball bearings; — standard height shaft support rails for series 5 sleeve
    type linear ball bearings; — flanged shaft support blocks for series 5 sleeve
    type linear ball bearings; — solid and tubular shafts for series 5 sleeve type
    linear ball bearings.'
