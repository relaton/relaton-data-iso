abstract:
- language: en
  script: Latn
  content: This document describes a procedure for the evaluation of the uncertainty
    of measurements made with tactile Cartesian coordinate measuring machines (CMM).
    The measurement uncertainty evaluated in accordance with this document indicates
    the performance of the individual measurement operation, which is not the measuring
    capability nor test uncertainty when verifying the performance of the CMM against
    its maximum permissible errors (MPE).
