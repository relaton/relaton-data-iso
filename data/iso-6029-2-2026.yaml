abstract:
- language: en
  script: Latn
  content: 'This document specifies the sensor data fusion applicable to the use cases
    of indoor and outdoor seamless positioning solutions for a mobile user (multimodal
    transportation) in intelligent transport system (ITS) stations. This document
    provides technical requirements for data fusion between three domains: nomadic
    device [e.g. personal intelligent transport system station (P-ITS-S)], mobility
    [e.g. vehicle intelligent transport system station (V-ITS-S)], and infrastructure
    [e.g. roadside intelligent transport system station (R-ITS-S)]. The data exchange
    between these domains is based on a standardized message and data format and this
    document identifies use cases for each different case of communication between
    domains.'
