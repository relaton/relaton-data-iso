abstract:
- language: en
  script: Latn
  content: ISO 8178-1:2006 specifies the measurement and evaluation methods for gaseous
    and particulate exhaust emissions from reciprocating internal combustion (RIC)
    engines under steady-state conditions on a test bed, necessary for determining
    one weighted value for each exhaust gas pollutant. Various combinations of engine
    load and speed reflect different engine applications (see ISO 8178-4). ISO 8178-1:2006
    is applicable to RIC engines for mobile, transportable and stationary use, excluding
    engines for motor vehicles primarily designed for road use. ISO 8178-1:2006 may
    be applied to engines used, for example, for earth-moving machines, generating
    sets and for other applications. In limited instances, the engine can be tested
    on the test bed in accordance with ISO 8178-2, the field test document. This can
    only occur with the agreement of the parties involved. It should be recognised
    that data obtained under these circumstances may not agree completely with previous
    or future data obtained under the auspices of ISO 8178-1:2006. Therefore, it is
    recommended that this option be exercised only with engines built in very limited
    quantities such as very large marine or generating set engines. For engines used
    in machinery covered by additional requirements (e.g. occupational health and
    safety regulations, regulations for powerplants), additional test conditions and
    special evaluation methods may apply. Where it is not possible to use a test bed
    or where information is required on the actual emissions produced by an in-service
    engine, the site test procedures and calculation methods specified in ISO 8178-2
    are appropriate.
