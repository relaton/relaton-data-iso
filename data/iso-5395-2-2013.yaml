abstract:
- language: en
  script: Latn
  content: 'ISO 5395-2:2013 specifies safety requirements and their verification for
    combustion-engine-powered pedestrian-controlled (with or without sulky) rotary
    lawnmowers and cylinder lawnmowers (hereafter named "lawnmower"), and equipped
    with: metallic cutting means; and/or non-metallic cutting means with one or more
    cutting elements pivotally mounted on a generally circular drive unit, where these
    cutting elements rely on centrifugal force to achieve cutting, and have a kinetic
    energy for each single cutting element of 10 J or more. It does not apply to:
    robotic and remote-controlled lawnmowers, flail mowers, grassland mowers, sickle
    bar mowers, towed/semi-mounted grass-cutting machines, and scrub-clearing machines;
    electrically powered and battery-powered lawnmowers; pedestrian-controlled lawnmowers
    with a swing-over handle. Note that IEC 60335-1 together with IEC 60335-2-77 give
    requirements for pedestrian-controlled walk-behind electrically powered lawnmowers.
    ISO 5395-2:2013 deals with all significant hazards, hazardous situations or events
    relevant to lawnmowers when used as intended and under the conditions of misuse
    which are reasonably foreseeable by the manufacturer. It is not applicable to
    lawnmowers which are manufactured before the date of publication of this document.'
