abstract:
- language: en
  script: Latn
  content: ISO 3834-1:2005 provides criteria to be taken into account for the selection
    of the appropriate level of quality requirements for fusion welding of metallic
    materials, among the three levels specified in ISO 3834-2:2005 ISO 3834-3:2005
    and ISO 3834-4:2005. It applies to manufacturing, both in workshops and at field
    installation sites. ISO 3834-1:2005 does not specify requirements for a total
    quality management system. However, quality management system elements where their
    inclusion will complement ISO 3834 are defined.
