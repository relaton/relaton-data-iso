abstract:
- language: en
  script: Latn
  content: 'This document specifies a set of key indicators for assessing the quality
    of museums: — for the purpose of strategic planning and internal management of
    museums; — for reporting to stakeholders such as funding institutions, policy
    makers, or the public; — to promote the museums'' role and value for learning
    and research, education and culture, social and economic life; — for comparing
    results over time and between museums. The aim of this document is to provide
    a selection of key indicators applicable to a wide range of museums. It is recognized
    that not all indicators are pertinent for each individual museum category or each
    individual museum. Limitations on the applicability of individual indicators are
    listed in the scope clause of the description of each indicator (see Annex A).
    This document is not intended to exclude the use of other indicators not specified
    in it.'
