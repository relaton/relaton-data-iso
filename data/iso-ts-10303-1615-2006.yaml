abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1615:2006 specifies the application module for AP210 functional
    requirement allocation. ISO/TS 10303-1615:2006 deals with the representation of
    functional requirement allocation. Functional requirement allocation includes
    allocation of customer, regulatory agency or enterprise requirements to a functional
    element, or to a functional specification, for various phases and purposes of
    a design process. Configuration management information and design change management
    information is provided. The following is within the scope of ISO/TS 10303-1615:2006:
    requirement allocation to a functional unit in a nodal representation.'
