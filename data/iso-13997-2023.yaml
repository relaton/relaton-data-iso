abstract:
- language: en
  script: Latn
  content: This document specifies a tomodynamometer cut test method and related calculations,
    for use on materials and assemblies designed for protective clothing, including
    gloves. The test determines resistance to cutting by sharp edges, such as knives,
    sheet metal parts, swarf, glass, bladed tools and castings. When this document
    is cited as a test method in a material or product requirement standard, that
    standard contains the necessary information to permit the application of this
    document to the particular product. This test does not provide data on the resistance
    to penetration by pointed objects such as needles and thorns, or the point of
    sharp-edged blades. The test described in this document is not considered suitable
    for testing materials made from chain mail and metal plates. The text of this
    document does not include provisions for the safeguard of the operator.
