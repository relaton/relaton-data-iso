abstract:
- language: en
  script: Latn
  content: ISO 15800:2003 gives guidelines on the kind and extent of soil characterization
    necessary for the evaluation of human exposure to substances that can cause adverse
    effects. The possibilities of standardizing the calculations used for the assessment
    of human exposure are not included in ISO 15800:2003. The information needed for
    evaluation of human exposure to contaminants leached from soil to surface and/or
    groundwater or transferred by runoff is not included in ISO 15800:2003. Aspects
    related to radioactivity and pathogens in soil and potential human exposure hereto
    are also not included in ISO 15800:2003.
