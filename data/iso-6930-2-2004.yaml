abstract:
- language: en
  script: Latn
  content: ISO 6930-2:2004 specifies the requirements for weldable high yield strength
    steels for cold forming. It applies to plates and wide-flats, hot-rolled on reversing
    mills, both having a thickness between 4 mm and 50 mm (inclusive) and supplied
    in the normalized, normalized rolled and as-rolled delivery condition. It does
    not apply to weldable structural steels, whether or not of special quality, which
    are covered by other International Standards, namely high yield strength steel
    products for cold forming delivered in thermomechanically rolled condition (ISO
    6930-1); structural steels (ISO 630); high yield strength flat steel products
    (ISO 4950-1, ISO 4950-2 and ISO 4950-3); hot-rolled steel sheet of higher yield
    strength with improved formability (ISO 5951).
