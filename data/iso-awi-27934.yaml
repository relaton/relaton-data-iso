abstract:
- language: en
  script: Latn
  content: This document provides the methodology to evaluate the suitability of an
    existing emission resource (usually be installed fossil fuel facilities) to be
    retrofitted by CO2 capture technology. For potential CCS retrofit projects on
    existing fossil fuel facilities, this methodology will cover key technical dimensions
    such as source-sink matching, technical compatibility between emission source
    and capture unit, and site conditions for engineering practice. Then, the most
    common and priority technical factors include expected capture and storage quantities,
    source-sink distances and transportation conditions, process integration complexity,
    energy consumption, water requirements, site requirements for capture equipment,
    potential engineering challenges, and the effectiveness of emission reduction
    and lifespan extension after retrofitting, will be identified. On the basis of
    these factors, an evaluation index system will be established to provide a standardized
    method for assessing the suitability of emission sources for CCS retrofitting.
    The method enables key stakeholders, including project owner, investor, approver
    and technology provider, to evaluate the suitability of existing fossil fuel facilities
    for CCS retrofitting, prioritize candidate projects, avoid potential technical
    difficulties, and offer early-stage references to ensure smooth project implementation.
    This document supports the implementation of CCS projects, and the technology
    promotion.
