abstract:
- language: en
  script: Latn
  content: This work item proposes a revision of ISO 7708 (Air quality — Particle
    size fraction definitions for health-related sampling) to update and clarify size-fraction
    conventions in light of recent research showing different inhalation behavior
    in calm versus moving air. The revised standard will provide normative definitions
    and mathematical forms for inhalable, thoracic and respirable fractions (and any
    revised or additional conventions), reference conditions for inhalability/penetration
    curves, and guidance for interpreting these fractions in measurement and reporting.
    Development will be coordinated with the ongoing CEN work on EN 481 to promote
    alignment of major technical aspects; the revision will not include detailed instrument
    design or test methods beyond what is necessary to define and apply the size-fraction
    conventions.
