abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the Charpy impact strength
    of plastics under defined conditions. It defines a number of different types of
    specimen and test configurations. It also specifies different test parameters
    according to the type of material, the type of test specimen and the type of notch.
    The method described in this document can be used to investigate the behaviour
    of specified types of specimen under the impact conditions defined and for estimating
    the brittleness or toughness of specimens within the limitations inherent in the
    test conditions. It can also be used for the determination of comparative data
    from similar types of material.
