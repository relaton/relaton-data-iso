abstract:
- language: en
  script: Latn
  content: ISO 17769-1:2012 specifies terms, letter symbols and units related to the
    flow of liquids through rotodynamic and positive displacement liquid pumps and
    associated installations. It serves as a means of clarifying communications between
    the installation designer, manufacturer, operator and plant constructor. It identifies
    the units in common usage, but all additional legal units can be used. ISO 17769-1:2012
    deals solely with conditions described by positive values for the rate of flow
    and pump head.
