abstract:
- language: en
  script: Latn
  content: 'ISO 13338:2017 provides: - for pure gases and some liquids, a complete
    list indicating their corrosiveness; - for gas mixtures, a calculation method,
    in the absence of experimental data, relating to the corrosiveness of each of
    their components; in order to determine the corrosiveness of gases and gas mixtures
    on tissue so that a suitable outlet connection can be assigned to each of them.'
