abstract:
- language: en
  script: Latn
  content: ISO 14171:2010 specifies requirements for the classification of electrode/flux
    combinations and weld metal in the as-welded condition and in the post-weld heat-treated
    condition for submerged arc welding of non alloy and fine grain steels with a
    minimum yield strength of up to 500 MPa or a minimum tensile strength of up to
    570 MPa. One flux can be classified with different solid wire electrodes and tubular
    cored electrodes. The solid wire electrode is also classified separately based
    on chemical composition. ISO 14171:2010 is a combined specification providing
    for classification utilizing a system based upon the yield strength and the average
    impact energy for weld metal of 47 J, or utilizing a system based upon the tensile
    strength and the average impact energy for weld metal of 27 J.
