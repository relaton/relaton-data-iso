abstract:
- language: en
  script: Latn
  content: This document specifies laboratory test methods for verifying the capabilities
    of truck and bus tyres. Of the test methods presented, only some will be required,
    depending on the type of tyre to be tested. This document applies to all truck
    and bus tyres. The test methods presented in this document do not apply to the
    gradation of tyre performance or quality levels.
