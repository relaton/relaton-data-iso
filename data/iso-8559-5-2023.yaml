abstract:
- language: en
  script: Latn
  content: This document provides a description of anthropometric measurements for
    the head and face that can be used as a basis for creating physical and digital
    anthropometric databases. The list of measurements specified in this document
    is intended to help practitioners in the field of clothing who need to apply their
    knowledge to select population market segments and to create size and shape profiles
    for the development of all headwear garment types that extend from the torso and
    shoulder to the neck and head and their equivalent fitness. The list provides
    guidance for taking anthropometric measurements and gives information on the principles
    of measurement and their underlying anatomical and anthropometrical bases relevant
    to clothing product development teams and head and face wear manufacturers.
