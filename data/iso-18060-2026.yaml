abstract:
- language: en
  script: Latn
  content: 'This document defines and establishes methodologies for a set of indicators
    to steer and measure the performance of organizations in terms of sustainability.
    The requirements and guidance in this document can be used to implement these
    tourism sustainability indicators. This document is applicable to any organization
    in the tourism value chain that wishes to: a)       monitor, measure, analyse
    and evaluate the sustainability performance of the organization; b)       ensure
    its conformity with its defined sustainability policy; c)        measure, evaluate
    and monitor the results of sustainable practices implemented at the organization;
    d)       evaluate the fulfilment of the established sustainability objectives;
    e)       monitor compliance with applicable legislation.'
