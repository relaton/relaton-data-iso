abstract:
- language: en
  script: Latn
  content: ISO 19103:2015 provides rules and guidelines for the use of a conceptual
    schema language within the context of geographic information. The chosen conceptual
    schema language is the Unified Modeling Language (UML). ISO 19103.2015 provides
    a profile of the Unified Modelling Language (UML). The standardization target
    type of this standard is UML schemas describing geographic information.
