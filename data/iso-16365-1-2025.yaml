abstract:
- language: en
  script: Latn
  content: This document establishes a system of designation for thermoplastic polyurethane
    elastomers. The designation system can be used as the basis for specifications.
    The designation system is applicable to all thermoplastic polyurethane elastomers.
    It applies to materials ready for normal use in the form of powder, granules or
    pellets, unmodified or modified by colourants, fillers or other additives, etc.
    This document does not intend to imply that materials having the same designation
    give necessarily the same performance. This document does not provide engineering
    data, performance data, or data on processing conditions which might be required
    to specify a material for a particular application and/or method of processing.
    NOTE            If such additional properties are required, they can be determined
    according to the test methods specified in ISO 16365-2, if suitable.
