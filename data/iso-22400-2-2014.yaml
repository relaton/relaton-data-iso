abstract:
- language: en
  script: Latn
  content: ISO 22400 defines key performance indicators (KPIs) used in manufacturing
    operations management. ISO 22400-2:2014 specifies a selected number of KPIs in
    current practice. The KPIs are presented by means of their formula and corresponding
    elements, their time behaviour, their unit/dimension and other characteristics.
    ISO 22400-2:2014 also indicates the user group where the KPIs are used, and the
    production methodology to which they correspond. With reference to equipment,
    the KPIs in ISO 22400-2:2014 relate to work units, as specified in IEC 62264.
