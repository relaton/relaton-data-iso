abstract:
- language: en
  script: Latn
  content: ISO/TS 20460:2015 establishes guidelines to link and, where applicable,
    calibrate the online gauge, following laboratory measurement for a given paper
    and board property. Paper and board online measuring equipment is mostly based
    on different technology to that of laboratory equipment. Therefore, this Technical
    Specification specifies the International Standards to be chosen for the determination
    of physical properties of paper and board when measured online. It is applicable
    to all kind of paper and board. In case of dispute, the usual reference is the
    laboratory testing but the parties may decide that the online measurements are
    valid based on the application of this International Standard.
