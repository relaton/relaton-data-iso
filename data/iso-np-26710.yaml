abstract:
- language: en
  script: Latn
  content: This document is a part of the series of standards on seismic protection
    of cultural heritage collections under ISO/TC 349. It provides comprehensive principles
    for seismic testing and monitoring of cultural heritage collections, clarifies
    the inherent interdependence between the two complementary activities of testing
    and monitoring objects in cultural heritage collections, and specifies technical
    requirements such as laboratory and in-situ testing, together with in-situ monitoring,
    application of testing and monitoring data, as well as the content and format
    of outcome reports. This document is applicable to, but not limited to, the seismic
    damage mitigation for cultural objects in exhibition and storage within buildings,
    as well as exhibition/storage facilities. It is not applicable to the seismic
    damage mitigation of those buildings.
