abstract:
- language: en
  script: Latn
  content: 'This document specifies the transport and network layer conformance test
    plan, which tests the transportation of diagnostic communication, node configuration
    data and network layer services using the service interface parameters reported
    by the lower OSI layers and submitted to the higher OSI layers. The transport
    layer and network layer conformance test plan contain the following descriptions:
    — concept of operation conformance test plan; — transport layer protocol conformance
    test plan; — network layer services conformance test plan; and — error detection
    conformance test plan.'
