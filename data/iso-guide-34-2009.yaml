abstract:
- language: en
  script: Latn
  content: Guide 34:2009 specifies general requirements in accordance with which a
    reference material producer has to demonstrate that it operates, if it is to be
    recognized as competent to carry out the production of reference materials. Guide
    34:2009 is intended for the use by reference material producers in the development
    and implementation of their management system for quality, administrative and
    technical operations. Reference material customers, regulatory authorities and
    accreditation bodies may also use it in confirming and recognizing the competence
    of reference material producers. Guide 34:2009 is not intended to be used as the
    basis for conformity assessment by certification bodies. Guide 34:2009 sets out
    the management system requirements in accordance with which reference materials
    shall be produced. It is intended to be used as part of a reference material producer's
    general quality assurance (QA) procedures. Guide 34:2009 covers the production
    of certified and non-certified reference materials. For non-certified reference
    materials, the production requirements are less stringent than for certified reference
    materials. The minimum requirements for the production of non-certified reference
    materials are specified throughout the Guide.
