abstract:
- language: en
  script: Latn
  content: 'This document, within the context of methods’ and tools’ capability for
    supporting adoption, construction, operation, and management of product line verification
    and validation, defines: - processes for adopting, managing, operationalizing,
    and supporting product line verification and validation; those processes are described
    in terms of purpose, inputs, tasks, and outcomes; - method capabilities to support
    the defined tasks of each process; - tool capabilities that automate or semi-automate
    tasks and methods.'
