abstract:
- language: en
  script: Latn
  content: ISO 14470:2011 specifies requirements for the development, validation and
    routine control of the process of irradiation using ionizing radiation for the
    treatment of food, and establishes guidelines for meeting the requirements. ISO
    14470:2011 covers irradiation processes using the radionuclides 60Co or 137Cs,
    electron beams or X-ray generators. The requirements given in ISO 14470:2011 are
    the minimum necessary to control the food irradiation process. ISO 14470:2011
    does not specify requirements for the primary production and/or harvesting, post-harvest
    treatment, storage and shipment, and packaging for foods that are to be irradiated.
    Only those aspects of the food production directly related to the irradiation
    process that may affect the safety or quality of the irradiated food are addressed.
    ISO 14470:2011 does not specify requirements for occupational safety associated
    with the design and operation of irradiation facilities. ISO 14470:2011 does not
    cover measuring or inspection devices that utilize ionizing radiation. The application
    of ISO 14470:2011 does not exempt the user from compliance with current and applicable
    legislation.
