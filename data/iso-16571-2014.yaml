abstract:
- language: en
  script: Latn
  content: ISO 16571:2014 specifies requirements and guidelines for the design, manufacture,
    installation, function, performance, maintenance, servicing, documentation, testing,
    and commissioning of equipment for evacuation of plume generated by medical devices.
    ISO 16571:2014 is applicable to a) portable and mobile plume evacuation systems,
    b) local stationary plume evacuation systems, c) dedicated central pipeline systems
    for plume evacuation systems, and d) plume evacuation systems integrated into
    other equipment (e.g. laser equipment).
