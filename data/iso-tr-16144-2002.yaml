abstract:
- language: en
  script: Latn
  content: ISO/TR 16144:2002 describes the procedures used by the United States National
    Institute of Standards and Technology (NIST) for the certification of the calibration
    material SRM 2806, which is used in the primary calibration of liquid automatic
    particle counters. SRM 2806 is a suspension of ISO MTD in hydraulic fluid with
    a number size distribution certified using a scanning electron microscope (SEM)
    and image analysis techniques.
