abstract:
- language: en
  script: Latn
  content: Requirements for how any type of organization can demonstrate that their
    net zero strategy, including their targets and delivery to these targets, are
    compatible with reaching net zero, and that they are making credible and verifiable
    progress towards contributing to global net zero in line with the Paris Agreement.
    The scope would be limited to organizations, not including their products, in
    line with the scope of IWA 42 (See Annex for full scope).
