abstract:
- language: en
  script: Latn
  content: This document specifies methods for the measurement of the flow of water
    in open channels under steady flow conditions using triangular profile weirs.
    The flow conditions considered are steady flows which are uniquely dependent on
    the upstream head and non-modular (drowned) flows which depend on downstream as
    well as upstream levels.
