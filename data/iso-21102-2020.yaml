abstract:
- language: en
  script: Latn
  content: This document establishes the requirements and recommendations of competencies
    and the related expected results of competencies for adventure tourism activity
    leaders common to any adventure tourism activity, which can affect the quality
    and safety of the services provided. It can be used by all types and sizes of
    providers operating in different geographic, cultural and social environments.
    This document does not apply to diving leaders, for whom References [1], [2] and
    [4] to [9] apply.
