abstract:
- language: en
  script: Latn
  content: ISO 9917-1:2007 specifies requirements and test methods for powder/liquid
    acid-base dental cements intended for permanent cementation, lining and restoration.
    ISO 9917-1:2007 is applicable to both hand-mixed and capsulated cements for mechanical
    mixing. ISO 9917-1:2007 specifies limits for each of the properties according
    to whether the cement is intended for use as a luting agent, a base or liner or
    as a restorative material. ISO 9917-1:2007 is not intended to address resin-modified
    water-based cements.
