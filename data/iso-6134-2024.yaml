abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for hoses and hose assemblies made
    of rubber and hose fittings made of metal, which are designed to convey saturated
    steam and hot water condensate. This document applies to the following two types
    of hoses and hose assemblies: —     low pressure, with a maximum working pressure
    of 0,6 MPa (6 bar); —     high pressure, with a maximum working pressure of 1,8 MPa
    (18 bar). Each type is divided into two classes, having either an oil resistant
    or non-oil resistant cover.'
