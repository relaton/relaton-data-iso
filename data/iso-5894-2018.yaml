abstract:
- language: en
  script: Latn
  content: This document specifies requirements for watertight and oiltight manholes
    of the current types with bolted covers, for general shipboard use other than
    for pressure vessels. It specifies the dimensions for the holes in the plating
    and the number, size and position of the fasteners. It is applicable to manholes
    of raised coaming, surface mounted or recessed cover types. The details of the
    manholes are at the discretion of the manufacturer.
