abstract:
- language: en
  script: Latn
  content: This document describes the introduction of radiated immunity testing for
    the components and vehicles equipped with V2X communications. The link communication
    connection and V2X scenario simulation are considered to make the V2X functions
    and their communications operate normally during the immunity testing. Examples
    of monitoring are also discussed to show the electromagnetic interference reactions
    of the device with V2X under test. In addition, test hints are described to provide
    information on radiated immunity for V2X. Technical specifications are not within
    the scope of this document.
