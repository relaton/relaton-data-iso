abstract:
- language: en
  script: Latn
  content: This International Standard specifies technical requirements for windows,
    portlights, hatches, deadlights and doors on small craft of hull length up to
    24 m, taking into account the type of craft, its design category, and the location
    of the appliance. The appliances considered in this International Standard are
    only those that are critical for the craft's watertightness, i.e. those that could
    lead to flooding in case of rupture of the plate. This International Standard
    is mostly intended to be used for recreational craft, but it may be used for non-recrational
    small craft of hull length up to 24 m, excluding lifeboats. However, it is not
    applicable to commercial or work boats used in severe conditions.
