abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 9797-3:2011 specifies the following Message Authentication Code
    (MAC) algorithms that use a secret key and a universal hash-function with an n-bit
    result to calculate an m-bit MAC based on the block ciphers specified in ISO/IEC
    18033-3 and the stream ciphers specified in ISO/IEC 18033-4: UMAC; Badger; Poly1305-AES;
    GMAC.'
