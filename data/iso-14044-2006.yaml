abstract:
- language: en
  script: Latn
  content: 'ISO 14044:2006 specifies requirements and provides guidelines for life
    cycle assessment (LCA) including: definition of the goal and scope of the LCA,
    the life cycle inventory analysis (LCI) phase, the life cycle impact assessment
    (LCIA) phase, the life cycle interpretation phase, reporting and critical review
    of the LCA, limitations of the LCA, relationship between the LCA phases, and conditions
    for use of value choices and optional elements. ISO 14044:2006 covers life cycle
    assessment (LCA) studies and life cycle inventory (LCI) studies.'
