abstract:
- language: en
  script: Latn
  content: This document gives the determination of aggregate crushing value (ACV)
    of aggregates. This gives a relative measure of the resistance of the aggregate
    crushing under the gradually applied compressive load. The method is applicable
    to aggregates passing a 14,0 mm test sieve and retained on a 10,0 mm test sieve.
    For other size fractions, a recommended method is described in Annex A. The aggregate
    size fraction taken for this test can also be as per the relevant national standards.
    NOTE Minor variations in grading divisions can be allowed in respective national
    standards. The method is not suitable for testing aggregates with an aggregate
    crushing value higher than 30. In such cases, the method described in ISO 20290-4
    is applicable.
