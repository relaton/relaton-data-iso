abstract:
- language: en
  script: Latn
  content: ISO 19069-1:2015 establishes a system of designation for polypropylene
    (PP) thermoplastic material, which can be used as the basis for specifications.
    The types of polypropylene plastics are differentiated from each other by a classification
    system based on appropriate levels of the designatory properties a) tensile modulus
    of elasticity, b) impact strength, and c) melt mass-flow rate (MFR), and on information
    about basic polymer parameters, intended application and/or method of processing,
    important properties, additives, colorants, fillers, and reinforcing materials.
    ISO 19069-1:2015 is applicable to all polypropylene homopolymers and to copolymers
    of propylene with a content of other 1-olefinic of less than 50 % (m/m), as well
    as blends of polymers containing at least 50 % (m/m) of aforementioned polymers.
    It applies to materials ready for normal use in the form of powder, granules,
    or pellets and to materials unmodified or modified by colorants, additives, fillers,
    etc. ISO 19069-1:2015 does not apply to propylene-based rubber.
