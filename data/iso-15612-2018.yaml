abstract:
- language: en
  script: Latn
  content: 'This document: — specifies how a user can follow a standard welding procedure
    specification (SWPS) based on welding procedure qualification tests performed
    by a different organization; — specifies the range for the use of SWPSs in accordance
    with ISO 15607; — specifies the requirements for qualification of welding procedures
    to be issued as SWPSs; and — specifies the requirements for organizations adopting
    SWPSs. The use of this document can be restricted by an application standard or
    a specification. This document is applicable to welding of steels and aluminium
    and its alloys (see 4.1). All new standard welding procedure qualifications are
    to be carried out in accordance with this document from the date of its issue.
    However, this document does not invalidate previous standard welding procedure
    qualifications made to former standards, specifications or previous editions of
    this document'
