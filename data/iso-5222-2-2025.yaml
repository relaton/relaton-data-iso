abstract:
- language: en
  script: Latn
  content: This document specifies the testing and calculating methods for sensible
    cooling recovery seasonal performance factor of heat recovery ventilators (HRV)
    covered by ISO 16494-1. This document also specifies the test conditions and the
    corresponding test procedures for determining the sensible cooling recovery seasonal
    performance factor of HRVs. The rating conditions are those specified in Annex B
    and in ISO 16494-1. The procedures of this document can be used for other temperature
    conditions.
