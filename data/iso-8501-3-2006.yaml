abstract:
- language: en
  script: Latn
  content: ISO 8501-3:2006 describes preparation grades of welds, cut edges and other
    areas, on steel surfaces with imperfections. Such imperfections can become visible
    before and/or after an abrasive blast-cleaning process. The preparation grades
    given are to make steel surfaces with imperfections, including welded and fabricated
    surfaces, suitable for the application of paints and related products.
