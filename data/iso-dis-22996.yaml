abstract:
- language: en
  script: Latn
  content: This document specifies the basic compartments to consider when building
    the technically comprehensive design characteristics and operational parameters
    for current and new fission research reactors. These compartments are limited
    in scope to consider basic value-added areas of an organization framework detailing
    lines of authority and synergistic organizational project management activities.
    Fundamental control and procurement principles will be outlined to better enhance
    the technical evaluations and safety assessments for new research reactor design
    technologies where historical knowledge is limited or emerging. Enhancement of
    Safety culture and competencies for non-expansive organizational structures and
    significant student research turnover is a critical scope for consideration. This
    document also includes needs-based security pathways and their implementation
    specific to high trafficked and unobstructed public campus locations or research
    centers. Specific safety and protection considerations include both Administrative
    and Operational activities, and changes or modifications to the research reactor
    during the operation phases until time of decommissioning relevant to the restricted
    areas of non-restricted public access and right of way campus or research center
    environments.
