abstract:
- language: en
  script: Latn
  content: ISO 6972:2002 specifies the characteristics of cranked-link mill chains
    of welded construction suitable for conveying bulk materials, together with associated
    attachments and chain sprockets. The chain dimensions specified in ISO 6972:2002
    ensure interchangeability of both complete chains and individual links for repair
    purposes. ISO 6972:2002 is applicable to sprockets with between 5 and 36 teeth.
    Specifications are also given for eight types of attachment for use with the conveyor
    chains conforming to ISO 6972:2002.
