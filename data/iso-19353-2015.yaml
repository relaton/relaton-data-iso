abstract:
- language: en
  script: Latn
  content: ISO 19353:2015 specifies methods for identifying fire hazards resulting
    from machinery and for performing a risk assessment. It gives the basic concepts
    and methodology of protective measures for fire prevention and protection to be
    taken during the design and construction of machinery. The measures consider the
    intended use and reasonably foreseeable misuse of the machine. It provides guidelines
    for consideration in reducing the risk of machinery fires to acceptable levels
    through machine design, risk assessment and operator instructions. This International
    Standard is not applicable to - mobile machinery, - machinery designed to contain
    controlled combustion processes (e.g. internal combustion engines, furnaces),
    unless these processes can constitute the ignition source of a fire in other parts
    of the machinery or outside of this, - machinery used in potentially explosive
    atmospheres and explosion prevention and protection, and - fire detection and
    suppression systems that are integrated in building fire safety systems. It is
    also not applicable to machinery or machinery components manufactured before the
    date of its publication.
