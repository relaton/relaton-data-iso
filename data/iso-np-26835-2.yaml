abstract:
- language: en
  script: Latn
  content: 'This document specifies general requirements and considerations for the production, culture, characterization, and quality control of human pluripotent stem cell (hPSC)-derived cardiac organoids (hCOs) intended for use in toxicity research and development, including: a) requirements for source hPSCs and manufacturing processes; b) specifications for cardiac organoid differentiation, maturity, and functionality; c) characterization methods for identity, purity, and functional competence; d) quality control criteria for use in specific toxicity applications. This document does not apply to cardiac organoids intended for clinical therapy or transplantation.'
