abstract:
- language: en
  script: Latn
  content: This technical specification provides guidance, minimum technical requirements, and recommended practices for assessing and describing the risks associated with legacy wells within the area of review of a geological CO2 storage project. The legacy wells to be considered include all identified wells, or group of wells, regardless of their age, location (including onshore, subsea and offshore wells), total depth, type (e.g. naturally flowing, artificial lift, injection wells), or status (under construction, operating, suspended or abandoned) that exist within the area of review prior to the start of the storage project. This technical specification may also be used for evaluating the legacy well risk for a CO2 EOR project.
