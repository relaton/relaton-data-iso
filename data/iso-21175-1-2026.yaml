abstract:
- language: en
  script: Latn
  content: 'This document specifies a reference model and process for Collaborative
    Modeling and Simulation Environment (CMSE), which establishes a general framework
    of CMSE to provide guidance for implementation of joint simulation projects. The
    CMSE which is based on the reference process and the reference model including
    neutral interfaces and meta-models can enable service-oriented share-use of the
    infrastructure, integration of the software and collaboration of the business
    to improve collaboration among all kinds of stakeholders involved in a joint simulation
    project which needs on-demand simulation at any time and any place upon different
    manufacturing platforms owned by different enterprises or by different departments
    within an enterprise. This document can not only be applied to manufacturing enterprises
    but also be applied to other kinds of enterprises. It is intended for use by stakeholders
    who are concerned with developing and deploying solutions of the joint simulation
    project based on information and communication technology. It focuses on simulation
    activities related cross-platform simulation collaboration capability supporting
    business planning and logistics, manufacturing operations management and production
    control within or among enterprises, which can cover the levels from 2 to 4 of
    the functional hierarchy of manufacturing systems in IEC 62264-3[27]. This document
    specifies the following: the general framework of CMSE; the methodology of the
    joint simulation project analysis and realization by CMSE. This document does
    not relate to the simulation irrelevant collaboration environment, and does not
    specify the specific approach to implement CMSE in the solution formulation of
    joint simulation projects.'
