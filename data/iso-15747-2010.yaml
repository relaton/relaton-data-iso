abstract:
- language: en
  script: Latn
  content: ISO 15747:2010 contains requirements that relate to the safe handling and
    the physical, chemical and biological testing of plastic containers for parenterals.
    ISO 15747:2010 is applicable to plastic containers for parenterals having one
    or more chambers and having a total nominal capacity in the range of 50 ml to
    5 000 ml such as film bags or blow-moulded plastic bottles for direct administration
    of infusion (injection) solutions.
