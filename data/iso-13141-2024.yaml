abstract:
- language: en
  script: Latn
  content: 'This document establishes requirements for short-range communication for
    the purposes of augmenting the localization in autonomous electronic fee collection
    (EFC) systems. Localization augmentation serves to inform on-board equipment (OBE)
    about geographical location and the identification of a charge object. This document
    specifies the provision of location and heading information and security means
    to protect against the manipulation of the OBE with false RSE. The localization
    augmentation communication (LAC) takes place between an OBE in a vehicle and fixed
    RSE. This document is applicable to OBE in an autonomous mode of operation. This
    document specifies attributes and functions for the purpose of localization augmentation,
    by making use of the dedicated short-range communications (DSRC) communication
    services provided by DSRC Layer 7, and makes these LAC attributes and functions
    available to the LAC applications at the RSE and the OBE. Attributes and functions
    are specified on the level of application data units (ADUs; see Figure 1). As
    depicted in Figure 1, this document is applicable to: —     the application interface
    definition between OBE and RSE; —     the interface to the DSRC application layer,
    as specified in ISO 15628 and EN 12834; —     the use of the DSRC stack. The LAC
    is suitable for a range of short-range communication media. This document provides
    specific definitions regarding the CEN-DSRC stack as specified in EN 15509. Annexes C,
    D, E and H provide for the use of the Italian DSRC as specified in ETSI/ES 200
    674-1, ISO CALM IR ARIB DSRC and WAVE DSRC. This document contains a protocol
    implementation conformance statement (PICS) proforma in Annex B and transaction
    examples in Annex F. Annex G highlights how to use this document for the European
    Electronic Toll Service (EETS). Test specifications are not within the scope of
    this document.'
