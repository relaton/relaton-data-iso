abstract:
- language: en
  script: Latn
  content: 'This document provides an overview of city knowledge trustworthiness and
    its evaluation in the context of smart cities, including the following:  concepts
    relevant to city knowledge trustworthiness and its evaluation;  characteristics
    of trustworthiness of city knowledge; and  methodology for the evaluation of
    city knowledge trustworthiness. This document also provides some use cases for
    city knowledge use in smart cities and some cases for city knowledge trustworthiness
    evaluation.'
