abstract:
- language: en
  script: Latn
  content: This document gives guidelines for organizations to design, organize, conduct,
    receive feedback from and learn from a peer review of their disaster risk reduction
    (DRR) policies and practices. It is also applicable to other community resilience
    activities. It is intended for use by organizations with the responsibility for,
    or involvement in, managing such activities including policy and preparedness,
    response and recovery operations, and designing preventative measures (e.g. for
    the effects of environmental changes such as those from climate change). It is
    applicable to all types, structures and sizes of organizations, such as local,
    regional and national governments, statutory bodies, non-governmental organizations,
    businesses, and public and community groups. It is applicable before or after
    an incident or exercise.
