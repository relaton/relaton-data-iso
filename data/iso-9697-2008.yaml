abstract:
- language: en
  script: Latn
  content: ISO 9697:2008 specifies a method for the determination of gross beta activity
    in non-saline waters. The method covers non-volatile radionuclides with maximum
    beta energies > 0,3 MeV. Measurement of very low energy beta emitters, such as
    3H; 14C, 35S and 241Pu, is not included in ISO 9697:2008. The method is applicable
    to the analysis of raw and potable waters.
