abstract:
- language: en
  script: Latn
  content: 'This document specifies safety and environmental requirements for shot
    blasting machinery. Shot blasting machinery includes: —     wheel blasting machinery;
    —     air blasting machinery for dry and wet blasting; —     combined wheel and
    air blasting machinery. NOTE            Annex A illustrates examples of shot blasting
    machinery. This document is applicable to: —     all significant hazards, hazardous
    situations and hazardous events relevant to shot blasting machinery, when used
    as intended and under the conditions foreseen by the manufacturer, including reasonably
    foreseeable misuse; —     measures for minimization of environmental impact and
    energy usage of shot blasting machinery. Interfaces between shot blasting machinery
    and other equipment used in shot blasting but not in the scope of this document
    are: —     mechanical and electrical interface to external workpiece transport
    system; —     connector to electrical energy supply; —     connector to fresh
    air supply ducting; —     connector to exhaust air ducting; —     connector to
    pressurized air supply; —     connector to water supply; —     connector to waste
    water system; —     interface for safe exchange of control signals; —     connector
    for fresh air supply for respiratory protection device (in blast rooms). NOTE           
    Annex C gives an illustration of interfaces between shot blasting machinery and
    other equipment used in shot blasting but not in the scope of this document. The
    specific significant risks related to mobile and movable shot blasting machinery
    (e.g. shot blasting machines designed for operation at changing locations) are
    not dealt with in this document. This document does not apply to: —     high pressure
    water jet machinery; —     dry-ice blasting machinery. This document does not
    apply to shot blasting machines manufactured before the date of its publication
    as an ISO standard. NOTE            The requirements specified in this document
    can serve as a guideline for a risk assessment of shot blasting machines manufactured
    before the date of its publication as an ISO standard.'
