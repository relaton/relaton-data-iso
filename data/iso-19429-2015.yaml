abstract:
- language: en
  script: Latn
  content: ISO 19429:2015 provides a system for designating the location of an implant
    body within a jaw, and is intended for use with the scheme described in ISO 3950.
    It does not in itself indicate whether the device is visible within the oral cavity
    or the presence of transmucosal components or implant restorations. Since the
    system describes location but not restoration form, it is not necessary to use
    the quadrant designation numbers 5 to 8 which are employed when indicating a primary
    tooth. This information should be recorded by the responsible clinician in the
    patient's file and made available to the patient by the clinician(s) who provided
    the care.
