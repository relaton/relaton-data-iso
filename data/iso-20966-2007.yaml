abstract:
- language: en
  script: Latn
  content: ISO 20966:2007 specifies requirements for the construction of automatic
    milking installations (AMI), including specific safety and hygiene aspects and
    minimum performance requirements and testing, in addition to those described in
    ISO 5707 and ISO 6690. It does not contain requirements for the design of the
    building in which the milking installation is installed.
