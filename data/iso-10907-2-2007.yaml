abstract:
- language: en
  script: Latn
  content: ISO 10907-2:2007 specifies the basic dimensions and tolerances, in millimetres,
    of locating rings, for the mounting of moulds with thermal insulating sheets,
    suitable for injection moulding machines up to size E12, in accordance with EUROMAP
    2, types C (with bore) and D (without bore). ISO 10907-2:2007 also gives material
    guidelines and hardness requirements, and specifies the designation of the locating
    rings that conform to it.
