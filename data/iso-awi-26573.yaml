abstract:
- language: en
  script: Latn
  content: This standard describes the procedures assessing noise annoyance through
    listening tests, the methods establishing prediction models of perceived annoyance,
    psychoacoustic annoyance and their conversion model. The scope of this standard
    is restricted to the assessment and prediction of annoyance from outdoor environmental
    noise. The assessment and prediction of annoyance from other noise, such as indoor
    environmental noise affected by outdoorenvironmental noise can refer to this document.
