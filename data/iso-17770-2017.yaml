abstract:
- language: en
  script: Latn
  content: ISO 17770:2017 addresses CubeSats, CubeSat Deployer and related verification
    of assurance/quality terms and metrics. ISO 17770:2017 defines a unique class
    of picosatellite, the CubeSat. CubeSats are ideal as space development projects
    for universities around the world. In addition to their significant role in educating
    space scientists and engineers, CubeSats provide a low-cost platform for testing
    and space qualification of the next generation of small payloads in space. A key
    component of the project is the development of a standard CubeSat Deployer. This
    Deployer is capable of releasing a number of CubeSats as secondary payloads on
    a wide range of launchers. The standard Deployer requires all CubeSats to conform
    to common physical requirements, and share a standard Deployer interface. CubeSat
    development time and cost can be significantly reduced by the development of standards
    that are shared by a large number of spacecraft. Normative control of the CubeSat
    design, qualification and acceptance testing is generally applied from other small
    satellite specific standards with the exception of CubeSat/Deployer launch environment
    test.
