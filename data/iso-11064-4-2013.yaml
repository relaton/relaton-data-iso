abstract:
- language: en
  script: Latn
  content: ISO 11064-4:2013 specifies ergonomic principles, recommendations and requirements
    for the design of workstations found in control centres. It covers control workstation
    design with particular emphasis on layout and dimensions. It is applicable primarily
    to seated, visual-display-based workstations, although control workstations at
    which operators stand are also addressed. These different types of control workstation
    are to be found in applications such as transportation control, process control
    and security installations. Most of these workstations now incorporate flat-display
    screens for the presentation of information.
