abstract:
- language: en
  script: Latn
  content: ISO 11664-2:2007 comprises ISO 10526:2007 and ISO 10526:2007/Cor.1:2008.
    Its technical content is identical to that of ISO 10526:2007. ISO 10526:2007/Cor.1:2008
    changes the reference number of the standard from 10526 to 11664-2. ISO 11664-2:2007
    specifies two illuminants for use in colorimetry. The illuminants are the CIE
    standard illuminant A and the CIE standard illuminant D65.
