abstract:
- language: en
  script: Latn
  content: This International Standard specifies criteria for the selection of sampling
    methods and devices (operation and performance characteristics) used to evaluate
    benthic macroinvertebrate populations in fresh waters (rivers, canals, lakes,
    and reservoirs). The methods and devices considered in this International Standard
    are suitable for sampling all major components of the benthic assemblage. They
    are not suitable for sampling meiofauna.
