abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1251:2010-03 specifies the application module for Interface.
    The following are within the scope of ISO/TS 10303-1251:2010-03: the identification
    of the interface specification; the identification of a version of an interface
    specification; the representation of an interaction or connection between two
    or more products; the identification of the interface connector, the part of a
    product with which one or more other products or the environment will interact.'
