abstract:
- language: en
  script: Latn
  content: ISO 4666-3:2010 specifies the flexometer test with constant-strain amplitude
    for the determination of the temperature rise and resistance to fatigue of vulcanized
    rubber. The flexometer specified is known as the Goodrich flexometer, but any
    other apparatus giving equivalent performance can be used. ISO 4666-3:2010 gives
    directions for carrying out measurements which make possible predictions regarding
    the durability of rubbers in finished articles subject to dynamic flexing in service
    such as tyres, bearings, supports, V-belts, and cable-pulley insert rings. However,
    owing to the wide variations in service conditions, no simple correlation between
    the accelerated tests described in the various parts of ISO 4666 and service performance
    can be assumed. The method is not recommended for rubber having a hardness greater
    than 85 IRHD.
