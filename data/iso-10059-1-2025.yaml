abstract:
- language: en
  script: Latn
  content: This document specifies a method for determination of the cold compressive
    strength of dense shaped refractory products. Shaped refractories are those which
    have fixed geometry and dimensions when delivered to the user. This document is
    accordingly applicable to standard shape refractory bricks, but also special shapes
    refractory products and pre-cast products.
