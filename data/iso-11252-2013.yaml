abstract:
- language: en
  script: Latn
  content: ISO 11252:2013 specifies the minimum documentation, marking and labelling
    for all laser products classified in accordance with IEC 60825-1 including laser
    diodes and all laser devices defined in ISO 11145. It is applicable to laser systems
    being integrated in a laser product in accordance with IEC 60825-1 and laser devices
    being integrated in a laser unit or processing machine in accordance with ISO
    11553-1 and ISO 11553-2. ISO 11252:2013 specifies requirements for technical data
    sheets and information for the user. The requirements in ISO 11252:2013 augment
    but do not supersede any of the requirements in IEC 60825-1.
