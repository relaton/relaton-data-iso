abstract:
- language: en
  script: Latn
  content: 'ISO 10537:2016 defines the Encapsulation Service in terms of: a) the service
    primitives provided to the users of this service; b) the protocol data units employed
    by the service provider; and c) the procedures performed by the service provider.
    It does not specify: a) individual implementations or products; b) the implementation
    of service interfaces within real systems; c) the methods or technologies required
    to perform the procedures; or d) the management activities required to configure
    and control the service.'
