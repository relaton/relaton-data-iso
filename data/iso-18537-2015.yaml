abstract:
- language: en
  script: Latn
  content: 'ISO 18537:2015 specifies the information to be recorded in wild-caught
    crustacean supply chains in order to establish the traceability of products originating
    from wild-caught crustacean. It specifies how crustacean products traded are to
    be identified and the information to be generated and held on those products by
    each of the food businesses that physically trade them through the distribution
    chains. It is specific to the distribution for human consumption of crustacean
    and their products, from wild-caught through to retailers or caterers. The types
    of businesses identified in this International Standard for wild-caught crustacean
    distribution chains are: - capture operators; - landing businesses and first sale;
    - processors; - transporters and store operators; - traders and wholesalers; -
    retailers and caterers; - logistics including materials brought from other domains.
    Any given crustacean distribution chain may be made up of some or all of the above
    components but not necessarily in the sequence listed.'
