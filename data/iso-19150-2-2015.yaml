abstract:
- language: en
  script: Latn
  content: ISO 19150-2:2015 defines rules and guidelines for the development of ontologies
    to support better the interoperability of geographic information over the Semantic
    Web. The Web Ontology Language (OWL) is the language adopted for ontologies. It
    defines the conversion of the UML static view modeling elements used in the ISO
    geographic information standards into OWL. It further defines conversion rules
    for describing application schemas based on the General Feature Model defined
    in ISO 19109 into OWL. It does not define semantics operators, rules for service
    ontologies, and does not develop any ontology.
