abstract:
- language: en
  script: Latn
  content: This part of ISO/IEC 16500 describes an Abstract System Reference Model
    (ASRM) at the highest level first and then creates a specific instance of this
    abstract model to define the DAVIC System Reference Model (DSRM). The ASRM and
    DSRM are not intended to indicate preferred implementations of the DAVIC System;
    but are to be used as a tool to guide the definition of DAVIC specifications.
    Additionally, as DAVIC specifications are issued, the reference models can be
    used to aid the development and implementation of DAVIC-compliant systems and
    products.
