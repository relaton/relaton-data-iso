abstract:
- language: en
  script: Latn
  content: The proposed standard systematically establishes the requirement production,
    trade, application and maintenance of managed pressure drilling equipment, which
    is applicable to the design, manufacturing, quality control and safe use of managed
    pressure drilling equipment, assisting the standardization of MPD operation. This
    document Standardizes the terminology and definitions of managed pressure drilling
    equipment in the field of oil and gas drilling, as well as the design, performance,
    quality control, testing, inspection, and transportation requirements of MPD equipment.
