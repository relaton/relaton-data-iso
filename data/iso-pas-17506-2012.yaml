abstract:
- language: en
  script: Latn
  content: ISO/PAS 17506:2012 describes the COLLADA schema. COLLADA is a COLLAborative
    Design Activity that defines an XML-based schema to enable 3D authoring applications
    to freely exchange digital assets without loss of information, enabling multiple
    software packages to be combined into extremely powerful tool chains. The purpose
    of ISO/PAS 17506:2012 is to provide a specification for the COLLADA schema in
    sufficient detail to enable software developers to create tools to process COLLADA
    resources. In particular, it is relevant to those who import to or export from
    digital content creation (DCC) applications, 3D interactive applications and tool
    chains, prototyping tools, real-time visualization applications such as those
    used in the video game and movie industries, and CAD tools. ISO/PAS 17506:2012
    covers the initial design and specifications of the COLLADA schema, as well as
    a minimal set of requirements for COLLADA exporters.
