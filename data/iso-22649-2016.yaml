abstract:
- language: en
  script: Latn
  content: 'ISO 22649:2016 specifies two test methods for determining the water absorption
    and desorption of insoles and insocks, irrespective of the material. These methods
    are as follows. - Method A: Determination of the static water absorption and desorption
    of insoles and insocks. - Method B: Determination of the dynamic water absorption
    and desorption of insoles and insocks.'
