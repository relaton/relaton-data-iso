- language: en
  script: Latn
  content: ISO 3160-2:2015 specifies methods to determine fineness, thickness, corrosion
    resistance and adhesion for gold alloy coverings on watch-cases and accessories,
    including bracelets when they are permanently attached to the case. The tests
    apply only to significant surfaces. ISO 3160-2:2015 applies to all gold alloy
    coverings specified in ISO 3160‑1.
