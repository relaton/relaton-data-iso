abstract:
- language: en
  script: Latn
  content: This document specifies requirements for classification of rods, wires
    and deposits in the as-welded condition and in the post-weld heat-treated condition
    for tungsten inert gas welding of non-alloy and fine-grain steels with a minimum
    yield strength of up to 500 MPa or a minimum tensile strength of up to 570 MPa.
    This document is a combined specification providing classification utilizing a
    system based upon the yield strength and the average impact energy of 47 J of
    all-weld metal or utilizing a system based upon the tensile strength and the average
    impact energy of 27 J of all-weld metal. a)       Components which carry the suffix
    “system A” are applicable only to rods, wires and deposits classified to the system
    based upon the yield strength and the average impact energy of 47 J of all-weld
    metal in accordance with this document. b)       Components which carry the suffix
    “system B” are applicable only to rods, wires and deposits classified to the system
    based upon the tensile strength and the average impact energy of 27 J of all-weld
    metal in accordance with this document. c)        Components which have neither
    the suffix “system A” nor the suffix “system B” are applicable to all rods, wires
    and deposits classified in accordance with this document.
