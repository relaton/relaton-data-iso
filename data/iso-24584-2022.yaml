abstract:
- language: en
  script: Latn
  content: This document describes the measurement for the determination of the sheet
    resistance of conductive textile structures or conductive structures by using
    eddy current technology in reflection mode setup/ arrangement. It is applicable
    to conductive textile structures or conductive structures intended for application
    in/to textiles in the form of sheets (woven fabric, knitted fabric, nonwoven,
    coated fabric) where the area is formed by intersecting surfaces having conductive
    textile material. It is also applicable to multilayer structures containing both
    insulating and conductive layers.
