abstract:
- language: en
  script: Latn
  content: This document specifies a test method for determining the chemical resistance
    of engineered stone with resin and cement binders or combinations used in countertops
    and vanities (furniture in general), floor and wall coverings, and interior and
    exterior (constructions in general). To find any change in colour and appearance,
    two tests are specified for determining the chemical durability of engineered
    stones at normal room temperature. The tests are appropriate for all varieties
    of engineered stones that possess a polished surface and may come into contact
    with chemical substances for an extended period of time.
