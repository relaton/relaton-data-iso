abstract:
- language: en
  script: Latn
  content: 'This standard method specifies the method of measuring 241Am in urine
    by alpha spectrometry. This standard is applicable to the determination of 241Am
    in urine during routine monitoring, accident situation, and the excretion promotion
    process. This method covers the measurement of 241Am in urine in activity concentration
    between around: 1×10-5 Bq•l-1 to 1×10-2 Bq•l-1. The detection limit depends on
    the sample volume, chemical separation, detection efficiency of alpha spectrometry,
    the background count rate, measuring time, etc'
