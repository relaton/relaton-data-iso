abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of the free radon
    exhalation rate of a batch of mineral based building materials. This document
    only refers to 222Rn exhalation determination using two test methods: liquid Scintillation
    Counting (LSC) and gamma ray spectrometry (see Annex A and Annex B). The exhalation
    of thoron (220Rn) does not affect the test result when applying the determination
    methods described in this document.'
