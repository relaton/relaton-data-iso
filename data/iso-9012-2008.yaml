abstract:
- language: en
  script: Latn
  content: 'ISO 9012:2008 specifies requirements and test methods for air-aspirated
    hand blowpipes. ISO 9012:2008 applies to blowpipes for brazing, soldering, heating,
    fusion and other allied thermal processes, which use a fuel gas and aspirated
    air (injector-type blowpipes), and are intended for manual use. ISO 9012:2008
    is applicable to: air-aspirated hand blowpipes which are fed with a fuel gas in
    the gaseous phase, at a controlled pressure by a regulator, through a gas supply
    hose; air-aspirated hand blowpipes which are fed with a liquefied fuel gas in
    the gaseous phase at the container pressure, through a gas supply hose; so-called
    liquid-phase blowpipes which are fed with a fuel gas in the liquid phase, and
    where thermal evaporation takes place within the blowpipe.'
