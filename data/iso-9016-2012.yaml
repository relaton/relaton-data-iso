abstract:
- language: en
  script: Latn
  content: ISO 9016:2012 specifies mainly the method to be used when describing test
    specimen location and notch orientation for the testing and reporting of impact
    tests on welded butt joints. ISO 9016:2012 applies to impact tests on metallic
    materials in all forms of product made by any fusion welding process. It is used
    in addition to ISO 148 (all parts) and includes test specimen denomination and
    additional reporting requirements.
