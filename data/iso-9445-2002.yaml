abstract:
- language: en
  script: Latn
  content: ISO 9445 specifies the tolerances on dimensions and form for continuously
    cold-rolled stainless steel narrow strip, in thicknesses of up to and including
    3 mm and in rolling widths of less than 600 mm. It also applies to cut lengths
    taken from such strip. This International Standard also specifies the tolerances
    on dimensions and form for continuously cold-rolled stainless steel wide strip
    and plate/sheet, in thicknesses from 0,3 mm to 8,0 mm manufactured from wide strip
    by longitudinal slitting and to cut lengths manufactured from such strip.
