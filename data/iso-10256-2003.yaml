abstract:
- language: en
  script: Latn
  content: 'ISO 10256:2003 specifies performance requirements and test methods for
    head and face protection for use in ice hockey. Perfarmance requirements and test
    methods, where appropriate, are given for the following: construction; shock absorption;
    puck-impact resistance; penetration; retention-system properties; field of vision;
    marking and information. The head and face protection is intended for use by players,
    goalkeepers and certain functionaries (e.g. referees).'
