abstract:
- language: en
  script: Latn
  content: 'This document gives guidelines for methods for analysing changes in energy
    efficiency and energy consumption, and for measuring energy efficiency progress,
    for countries, regions and cities. It is composed of three different calculation
    methods: — evaluation of structure effects in the variation of energy intensity;
    — calculation of energy efficiency indices; — decomposition analysis of energy
    consumption variation. This document is applicable to providing an aggregated
    statistical evaluation for a country, region or city. It does not apply to calculating
    changes in the energy consumption or in energy efficiency at the individual consumer''s
    level (e.g. households, organizations, companies).'
