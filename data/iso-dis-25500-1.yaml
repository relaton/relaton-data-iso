abstract:
- language: en
  script: Latn
  content: 'This document provides an overview of the standards developed in the ISO
    25500 series for supply chain interoperability and integration. The following
    are within the scope of this document: — stating the scope of the ISO 25500 series
    as a whole; — establishing the principles of supply chain interoperability and
    integration; — describing the path to supply chain interoperability and integration;
    — describing the structure of the supply chain interoperability and integration
    series; — providing a summary of the content of each part in the supply chain
    interoperability and integration series; — establishing the relationship of the
    supply chain interoperability and integration series to other international standards.
    The following are outside the scope of this document: — the interoperability and
    integration of the physical objects or services exchanged'
