abstract:
- language: en
  script: Latn
  content: 'ISO 12952-1:2010 specifies test methods for assessing the ignitability
    of all bedding items, when subjected to a smouldering cigarette. ISO 12952-1:2010
    applies to bedding items, which can normally be placed on a mattress, for example:
    mattress covers; underlays; incontinence sheets and pads; sheets; blankets; electric
    blankets; quilts (duvets) and covers; pillows (whatever the filling) and bolsters;
    pillowcases. ISO 12952-1:2010 does not apply to mattresses, bed bases and mattress
    pads.'
