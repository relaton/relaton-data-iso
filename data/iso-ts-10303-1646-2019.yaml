abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1646:2019 specifies the application module for Footprint
    definition. The following are within the scope of ISO/TS 10303-1646:2019: the
    representation of a footprint, including functional and geometric; and representation
    of a breakout pattern associated with a footprint. Also provided is support to
    reference a part feature that an aspect of a footprint is dependent upon. the
    hierarchical footprint definition providing support for complex arrangements and
    patterns. footprints, optionally linking the features of a part with corresponding
    padstacks;geometric models of footprint and breakout patterns;layer specific features
    of footprints.'
