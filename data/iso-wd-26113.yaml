abstract:
- language: en
  script: Latn
  content: 'This International Standard is applicable to the design and construction
    of reinforced concrete box culverts under the following conditions: (1) Top slab
    of the culvert only bears highway vehicle loads, excluding heavy-duty traffic
    loads such as railway; (2) The culvert is a inlet unsubmerged culvert, which means
    the water flow maintains a free surface state throughout the culvert, and there
    is no water pressure act on the culvert’s top slab; (3) The single span of the
    box culvert does not exceed 5 meters. The standard contains a complete technical
    regulations for box culvert engineering, including: standard configurations of
    box culverts, loads, material requirements, structural analysis model, bearing
    capacities, structural requirements, construction process and quality inspections.
    Through systematic technical regulations, this standard provides comprehensive
    technical guidance for box culvert projects meeting the above conditions throughout
    their entire life cycle.'
