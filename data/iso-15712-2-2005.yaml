abstract:
- language: en
  script: Latn
  content: ISO 15712-2:2005 specifies calculation models designed to estimate the
    impact sound insulation between rooms in buildings, primarily on the bases of
    measured data which characterizes direct or indirect flanking transmission by
    the participating building elements and theoretically derived methods of sound
    propagation in structural elements. A detailed model is described for calculation
    in frequency bands; the single number rating of buildings can be determined from
    the calculation results. A simplified model with a restricted field of application
    is deduced from this, calculating directly the single number rating, using the
    single number ratings of the elements. ISO 15712-2:2005 describes the principles
    of the calculation scheme, lists the relevant quantities and defines its applications
    and restrictions. It is intended for acoustical experts and provides the framework
    for the development of application documents and tools for other users in the
    field of building construction, taking into account local circumstances. The calculation
    models described use the most general approach for engineering purposes, with
    a clear link to measurable quantities that specify the performance of building
    elements. The known limitations of these calculation models are described in this
    standard. Users should, however, be aware that other calculation models also exist,
    each with their own applicability and restrictions. The models are based on experience
    with prediction for dwellings; they could also be used for other types of buildings
    provided the construction systems and dimensions of elements are not too different
    from those in dwellings.
