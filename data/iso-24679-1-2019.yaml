abstract:
- language: en
  script: Latn
  content: This document provides a methodology for assessing the performance of structures
    in the built environment when exposed to a real fire. This document, which follows
    the principles outlined in ISO 23932-1, provides a performance-based methodology
    for engineers to assess the level of fire safety of new or existing structures.
    NOTE The fire safety of structures is evaluated through an engineering approach
    based on the quantification of the behaviour of a structure for the purpose of
    meeting fire safety objectives and can cover the entire time history of a real
    fire (including the cooling phase), and its consequences related to fire safety
    objectives such as life safety, property protection and/or environmental protection.
