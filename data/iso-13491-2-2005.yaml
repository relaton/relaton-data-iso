abstract:
- language: en
  script: Latn
  content: ISO 13491-2:2005 specifies checklists to be used to evaluate secure cryptographic
    devices (SCDs) incorporating cryptographic processes, as specified in parts 1
    and 2 of ISO 9564, ISO 16609 and parts 1 to 6 of ISO 11568, in the financial services
    environment. IC payment cards are subject to the requirements identified in this
    part of ISO 13491 up until the time of issue, after which they are to be regarded
    as a "personal" device and outside of the scope of this document. ISO 13491-2:2005
    does not address issues arising from the denial of service of an SCD.
