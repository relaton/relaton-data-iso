abstract:
- language: en
  script: Latn
  content: This document specifies test methods and procedures for assessing the accuracy
    of a three dimensional numerical description of intra-oral surfaces acquired directly
    from a patient with a hand-held scanning device. The test methods are not applicable
    to ultrasonic, radiographic or magnetic resonance imaging methods. NOTE ISO 12836
    specifies the test methods for the assessment of accuracy of digitizing devices
    that use a fixed or a mechanically guided scanning device.
