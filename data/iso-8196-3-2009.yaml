abstract:
- language: en
  script: Latn
  content: ISO 8196-3¦IDF 128-3:2009 specifies a protocol for the evaluation and validation
    of alternative quantitative methods of milk analysis. The protocol is applicable
    to all milk components including somatic cells. For microbiological parameters
    other standards, such as ISO 16140, apply. ISO 8196-3¦IDF 128-3:2009 is also applicable
    to the validation of new alternative methods where a limited number of analysts
    does not allow the organization of an interlaboratory study and ISO 8196-1¦IDF
    128-1, therefore, does not apply. ISO 8196-3¦IDF 128-3:2009 also establishes general
    principles of a procedure for granting international approvals of these alternative
    methods. These principles are based on the validation protocol defined in ISO
    8196-3¦IDF 128-3:2009.
