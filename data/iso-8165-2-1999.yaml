abstract:
- language: en
  script: Latn
  content: This part of ISO 8165 specifies a method for the determination of phenols
    by gas chromatography, following pentafluorobenzoyl chloride (PFBC) derivatization.
    It may in particular be applied to the examination of drinking water, ground water
    and moderately contaminated surface water. With this method, lower limits of detection
    may be obtained compared with extraction procedures. Since other reactive compounds
    such as amines and in some cases alcohols may also react, this method is not applicable
    in all cases to the examination of waste water. The applicability to the examination
    of waste water should be investigated for each individual case. This method allows
    the determination of the phenols listed in Table 1 in a concentration range >
    0,1 mg/l. Other monovalent phenols may also be analysed using this method, but
    the applicability needs to be checked for each individual case.
