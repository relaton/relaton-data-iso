abstract:
- language: en
  script: Latn
  content: ISO 14137:2015, with reference to ISO 230‑1, ISO 230‑2, and ISO 230‑4,
    geometric tests, tests of accuracy and repeatability of numerically controlled
    positioning axes, machining test and circular test for general purpose and normal-accuracy
    wire electro-discharge machines (wire EDM). It also specifies the applicable tolerances,
    corresponding to the above-mentioned tests. ISO 14137:2015 is applicable to cross-slide
    table type machines and double-column type machines. ISO 14137:2015 deals only
    with the verification of accuracy of the machine. It does not apply to the testing
    of the machine operation (vibrations, abnormal noises, stick-slip motion of components,
    etc.) nor to the checking of its characteristics (such as speeds, feeds, etc.),
    which should generally be checked before the testing of the accuracy. ISO 14137:2015
    provides the terminology used for the principal components of the machine and
    the designation of the axes with reference to ISO 841.
