abstract:
- language: en
  script: Latn
  content: This document specifies requirements for single use, gravity feed infusion
    sets for medical use in order to ensure their compatibility with containers for
    infusion solutions and intravenous equipment. Secondary aims of this document
    are to provide guidance on specifications relating to the quality and performance
    of materials used in infusion sets and to present designations for infusion set
    components.
