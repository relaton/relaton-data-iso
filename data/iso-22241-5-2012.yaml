abstract:
- language: en
  script: Latn
  content: ISO 22241-5:2012 applies to diesel engine powered road vehicles using selective
    catalytic reduction (SCR) technology. It is primarily intended for use by passenger
    cars and light commercial vehicles including buses with a gross vehicle mass of
    not more than 3.5 t, but may also be used by vehicles with a gross vehicle mass
    of over 3,5 t. ISO 22241-5:2012 specifies the refilling interface for the NOX
    reduction agent AUS 32 in compliance with ISO 22241-1, which is needed to operate
    converters with the selective catalytic reduction (SCR) exhaust treatment system.
    It specifies the essential functional and geometric requirements of the refilling
    system in order to ensure compatibility between the on-board refilling system
    and the off-board refilling system.
