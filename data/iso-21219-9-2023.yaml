abstract:
- language: en
  script: Latn
  content: This document specifies the method for delivering service and network information
    within a TPEG service. The TPEG-SNI application is designed to allow the efficient,
    language-independent delivery of information about the availability of the same
    service on another bearer channel, or similar service data from another service
    provider, directly from service provider to end-users. A number of tables of information
    are described in this document which provide comprehensive options for describing
    services, their timing, content, geographical coverage, etc. In all TPEG streams,
    it is mandatory to deliver the so-called guide to the service table (GST). Additionally,
    it is possible to signal linkage of content between different bearers and services.
