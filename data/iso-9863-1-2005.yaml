abstract:
- language: en
  script: Latn
  content: ISO 9863-1:2005 specifies a method for the determination of the thickness
    of geosynthetics at specified pressures and defines the pressure at which the
    nominal thickness is determined. The test results are intended for identification
    purposes and for use in technical data sheets and/or as part of other test methods,
    e.g. tests of hydraulic properties. The method is applicable to all geosynthetics.
