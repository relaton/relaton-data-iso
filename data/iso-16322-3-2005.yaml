abstract:
- language: en
  script: Latn
  content: ISO 16322-3:2005 specifies procedures to measure the spirality or torque
    of woven and knitted garments after laundering. The results obtained from different
    procedures may not be comparable. ISO 16322-3:2005 is not intended to measure
    the spirality of garments as manufactured, but rather the spirality after laundering.
    Note that some fabric constructions, such as denim, may have spirality intentionally
    introduced during manufacturing. Garments made of fabrics from circular knitting
    machines may have inherent nonverticality of wale alignment.
