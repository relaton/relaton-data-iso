abstract:
- language: en
  script: Latn
  content: Specify requirements for face masks intended to be manually applied by
    a clinician over the patient’s nose and mouth, to provide non-invasive artificial
    ventilation to patients whose breathing is absent or inadequate. The face mask
    size designation method of this standard may be used as indicative guidance for
    mask selection to fit the patient demographic. Not applicable to face masks intended
    for sleep apnea. Not applicable to nasal masks and non-sealing face masks.
