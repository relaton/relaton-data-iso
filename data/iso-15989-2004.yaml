abstract:
- language: en
  script: Latn
  content: ISO 15989:2004 specifies a method of measuring the contact angle of water
    droplets on corona-treated polymer film surfaces and subsequently determining
    the wetting tension of the film. The method is applicable to practically any polymer
    film. It is not applicable, however, if the surface of the film exhibits a chemical
    affinity for water.
