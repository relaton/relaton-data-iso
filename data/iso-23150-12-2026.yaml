abstract:
- language: en
  script: Latn
  content: 'This document is applicable to road vehicles with automated driving (AD)
    functions and specifies the technology-specific logical interfaces for lidar sensors
    or sensor clusters: feature level interface (FLI); advanced detection level interface
    (ADLI); detection level interface (DLI). This document does not provide electrical
    and mechanical interface specifications. Raw data interfaces are also excluded.'
