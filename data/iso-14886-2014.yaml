abstract:
- language: en
  script: Latn
  content: ISO 14886:2014 applies to the structural fire protection of large FRP yachts
    of 24 m in length and over, and carrying up to 12 passengers. ISO 14886:2014 is
    not applicable to vessels subject to SOLAS. By using the heat transfer Fourier
    Number, ISO 14886:2014 determines the equivalency of any proposed insulated FRP
    sandwich laminate to the model insulated sandwich laminate based on a fire tested
    insulated laminate approved in accordance with IMO FTP Code as a fire-resisting
    division. The method considers the relevant mechanical, thermal, and physical
    properties of the insulation and the FRP laminate. The technology of the elements
    of the insulation and FRP resistance to heat, smoke, and fire used in ISO 14886:2014
    and the effectiveness of the insulation are applicable in general to insulated
    FRP as a fire-resistant material.
