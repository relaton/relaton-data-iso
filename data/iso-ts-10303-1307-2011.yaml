abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1307:2011-10 specifies the application module for AP239 work
    definition. The following are within the scope of ISO/TS 10303-1307:2011-10: the
    plans and schedules for work to be performed; the association of task specifications
    with plans and schedules; the association of meta data with plans and schedules;
    the association of resources and outputs with plans and schedules; the location
    and quantification of planned and actual resources within a supply chain.'
