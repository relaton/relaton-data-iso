abstract:
- language: en
  script: Latn
  content: 'The scope of ISO 21082:2016 is the specification of the binding in terms
    of technology mapping to the Space Packet Protocol of: a) MAL message; b) MAL
    Transport Interface. The MAL Blue Book (reference [2]) specifies the MAL protocol
    in an abstract way, i.e., without defining the concrete protocol data units. The
    MAL Space Packet Transport Binding and Binary Encoding specifies: a) a complete
    and unambiguous mapping of the MAL message to the Space Packet; b) a complete
    and unambiguous mapping of the MAL transport interface to the Space Packet Protocol
    interface; c) a complete and unambiguous mapping of the MAL data types to fixed
    and variable length binary encoding formats. This Recommended Standard does not
    specify: a) individual implementations or products; b) the implementation of entities
    or interfaces within real systems. MO services defined in terms of MAL using the
    Space Packet Transport Binding as defined in this Recommended Standard are fully
    interoperable.'
