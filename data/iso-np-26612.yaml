abstract:
- language: en
  script: Latn
  content: This document specifies the test method for determining the viscosity-average
    degree of polymerization (DP) of cellulose in natural cellulosic fibres by viscometry
    measurements of solutions of cellulose in the mixture of 1-butyl-3-methylimidazolium
    acetate (BMIMOAc) and dimethyl sulfoxide (DMSO). This document is primarily applicable
    to natural cellulosic fibres and pure spun cellulosic yarns and fabrics.
