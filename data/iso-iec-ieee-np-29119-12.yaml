abstract:
- language: en
  script: Latn
  content: This document provides guidance and requirements on the software testing of complex systems (CS) by refining the test activities defined in the ISO/IEC/IEEE 29119 series of standards and adding test activities specific to CS. It requires the use of a risk-based approach to the testing, identifies risks associated with system complexity, and suggests suitable treatments. This document is applicable to the testing of any complex system across the full lifecycle, from inception to release, maintenance, support and decommissioning, in both traditional and agile lifecycles. The intended audience is primarily software test managers, test architects, senior testers, programme managers and project managers. This document is intended to complement domain-specific testing standards, where they exist.
