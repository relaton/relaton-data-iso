abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and test methods for pipes and fittings
    which are part of piping systems for the rehabilitation by means of renovation
    and trenchless replacement of underground gas supply networks. It is applicable
    to unplasticized polyamide (PA-U) pipes, fittings and assemblies, as manufactured
    and as installed. It is not applicable to the existing pipeline. It is applicable
    to technique families for renovation: — lining with continuous pipes; — lining
    with close-fit pipes; and technique families for trenchless replacement: — pipe
    bursting and pipe extraction; — horizontal directional drilling and impact molding.
    and intended to be used at an operating temperature of 20 °C as the reference
    temperature. NOTE For applications operating at constant temperatures greater
    than 20 °C and up to 40 °C, see ISO 16486-5:2021, Annex C. This document is applicable
    to: — PA-U solid wall single layered pipes (nominal outside diameter, d n ), including
    any identification stripes; When used with lining with close-fit lining pipes,
    the lining pipe is reduced on site to provide a close-fitting independent or interactive
    pressure pipe liner. NOTE: Paper [13] provides a case study for interactive pressure
    pipe lining. This document is applicable to jointing by means of butt fusion and
    electrofusion and to fabricated and injection-moulded fittings and mechanical
    connections of PA-U. This document is not applicable to push-fit jointed discrete
    pipes assembled as part of the trenchless installation process.'
