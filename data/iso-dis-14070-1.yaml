abstract:
- language: en
  script: Latn
  content: Quantification of GHG emission rates from urban environments, where a wide
    range of GHG emission sources and sinks are located, requires atmospheric measurements
    to assess the background concentrations of GHGs that represent the incoming air
    stream and the GHG concentrations in the outgoing stream; the difference represents
    the “enhancement” of GHG concentrations due to emission sources and sinks within
    the control volume representing the urban dome. This document represents the first
    in a series of standards that establish requirements for accurate measurement
    of GHG emissions in urban environments.
