abstract:
- language: en
  script: Latn
  content: ISO 4254-7:2008, intended to be used together with ISO 4254-1, specifies
    the safety requirements and their verification for the design and construction
    of combine harvesters, forage harvesters and cotton harvesters. It describes methods
    for the elimination or reduction of hazards arising from the intended use of these
    machines by one person (the operator) in the course of normal operation and service.
    In addition, it specifies the type of information on safe working practices to
    be provided by the manufacturer. Taken together with ISO 4254-1, ISO 4254-7:2008
    deals with all the significant hazards, hazardous situations and events relevant
    to combine harvesters, forage harvesters and cotton harvesters, when they are
    used as intended and under the conditions foreseen by the manufacturer. It is
    not applicable to hazards arising from the presence of persons other than the
    operator, cleaning of the grain tank, and hazards related to vibrations and moving
    parts for power transmission, except for strength requirements for guards and
    barriers. In respect of braking and steering, it is applicable only to the ergonomic
    aspects (e.g. location of brake pedal and steering wheel); no other aspects related
    to braking and steering are covered. In the case of trailed harvesters, it is
    applicable only to hazards related to the working process.
