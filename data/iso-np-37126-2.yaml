abstract:
- language: en
  script: Latn
  content: This document specifies a set of indicators, additional to and complementary with the indicators consolidated in ISO 37126-1, to assess the performance and progress of cities toward achieving net zero greenhouse gas emissions. It establishes an outcome-based framework covering net zero governance and strategy, carbon emission reduction performance, sectoral transitions, and climate finance and investment. This document does not specify detailed technical requirements or performance criteria, and it does not address energy management practices within individual organizations.
