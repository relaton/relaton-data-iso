abstract:
- language: en
  script: Latn
  content: 'The primary purpose of this document is to provide minimum acceptable
    criteria required to establish a procedure for retrospective dosimetry by electron
    paramagnetic resonance spectroscopy and to report the results. The second purpose
    is to facilitate the comparison of measurements related to absorbed dose estimation
    obtained in different laboratories. This document covers the determination of
    absorbed dose in the measured material. It does not cover the calculation of dose
    to organs or to the body. It covers measurements in both biological and inanimate
    samples, and specifically: a) based on inanimate environmental materials like
    glass, plastics, clothing fabrics, saccharides, etc., usually made at X-band microwave
    frequencies (8 GHz to 12 GHz); b) in vitro tooth enamel using concentrated enamel
    in a sample tube, usually employing X-band frequency, but higher frequencies are
    also being considered; c) in vivo tooth dosimetry, currently using L-band (1 GHz
    to 2 GHz), but higher frequencies are also being considered; d) in vitro nail
    dosimetry using nail clippings measured principally at X-band, but higher frequencies
    are also being considered; e) in vivo nail dosimetry with the measurements made
    at X-band on the intact finger or toe; f) in vitro measurements of bone, usually
    employing X-band frequency, but higher frequencies are also being considered.
    For biological samples, in vitro measurements are carried out in samples after
    their removal from the person or animal and under laboratory conditions, whereas
    the measurements in vivo are carried out without sample removal and may take place
    under field conditions. NOTE The dose referred to in this document is the absorbed
    dose of ionizing radiation in the measured materials.'
