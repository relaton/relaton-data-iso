- language: en
  script: Latn
  content: This document specifies procedures for gene expression-based similarity calculation between human pluripotent stem cell (hPSC)-derived organoids and a pre-defined data set of gene expression profiles in normal tissues. This document covers situations where the gene expression in the organoids have been quantified in a way functionally similar to the samples in the pre-defined dataset, and it is not intended for medical decisions.
