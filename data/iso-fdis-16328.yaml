abstract:
- language: en
  script: Latn
  content: This International Standard specifies the construction, performance, and
    type testing for gyro-compass for high-speed craft required by chapter X, SOLAS
    1974 (as amended). NOTE All requirements that are extracted from the recommendations
    of IMO Resolutions [Resolution A.821(19) on performance standards for gyro-compasses
    for high-speed craft and A.694(17)] are printed in italics. The main changes compared
    to the present edition are as follows; — Requirements related to bridge alert
    management (BAM) will be added to the clause of requirements and type test. —
    IEC 61162-450 will be added to the clause of interface as an option. — The normative
    references and bibliography will be updated. — Editorial revision of the standard
    in general according to the ISO/IEC Directives, Part 2 — Additionally, Annex will
    be added as alert definitions and IEC 61162 interface overviews for further explanation
    of the above.
