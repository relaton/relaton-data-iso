abstract:
- language: en
  script: Latn
  content: ISO 22669:2003 specifies a return-all-frames (RAF) service for a space
    link extension (SLE) service. The RAF service is an SLE transfer service that
    delivers all telemetry frames to a mission user from one space link physical channel.
    ISO 22669:2003 defines, in an abstract manner, the RAF service in terms of the
    operations necessary to provide the service; the parameter data associated with
    each operation; the behaviors that result from the invocation of each operation;
    and the relationship between, and the valid sequence of, the operations and resulting
    behaviors.
