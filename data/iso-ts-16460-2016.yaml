abstract:
- language: en
  script: Latn
  content: 'ISO/TS 16460:2016 specifies the following: - the Localized Message (LM)
    format: an NPDU of a networking and transport layer protocol that does not support
    routing of a packet through a network; - the Service Advertisement Message (SAM):
    an APDU to be transported in for example, an LM; - the Service Response Message
    (SRM): an APDU acknowledging a SAM that offered a service based on an ITS application
    class[8] to be transported in for example, an LM; - the related basic requirements
    for procedures. Specifications are partly done by normative references to IEEE
    1609.3TM-2016.'
