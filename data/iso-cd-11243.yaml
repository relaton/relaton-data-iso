abstract:
- language: en
  script: Latn
  content: This document specifies safety and performance requirements for the design
    and testing of permanently attached luggage carriers, both non cycle specific
    luggage carriers intended for mounting and cycle specific luggage carriers mounted
    on complete cycles. It applies to luggage carriers intended to be positioned above
    and adjacent to the wheels of cycles. This document provides guidelines for instructions
    on the use and care of such luggage carriers. This document does not apply to
    removable luggage (for example, handlebar bags or baskets that are not permanently
    attached). Toy luggage carriers are not covered by this document.
