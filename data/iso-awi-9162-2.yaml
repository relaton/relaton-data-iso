abstract:
- language: en
  script: Latn
  content: ISO 9162:2013 specifies required characteristics and additional information to be supplied to the purchaser by the vendor of those products commonly referred to as liquefied petroleum gases (see ISO 8216‑3) and is intended to apply to international transfers of commercial propane and commercial butane. ISO 9162:2013 is neither intended nor expected to replace or encroach upon national standards of any country since each country is subject to different regulations, codes, industry practices and market utilization.
