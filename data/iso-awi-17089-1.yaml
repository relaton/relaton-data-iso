abstract:
- language: en
  script: Latn
  content: This document specifies requirements and recommendations for ultrasonic
    gas flowmeters (USMs), which utilize the transit time of acoustic signals to measure
    the flow of single phase homogenous gases in closed conduits. This document applies
    to transit time ultrasonic gas flowmeters used for custody transfer and allocation
    metering, such as full-bore, reduced-area, high-pressure, and low-pressure meters
    or any combination of these. There are no limits on the minimum or maximum sizes
    of the meter. This document can be applied to the measurement of almost any type
    of gas, such as air, natural gas, and ethane. Included are flow measurement performance
    requirements for meters of two accuracy classes suitable for applications such
    as custody transfer and allocation measurement. This document specifies construction,
    performance, calibration, diagnostics for meter verification, and output characteristics
    of ultrasonic meters for gas flow measurement and deals with installation conditions.
    NOTE It is possible that national or other regulations apply which can be more
    stringent than those in this document.
