abstract:
- language: en
  script: Latn
  content: Sets out principles and conventions for use in preparation of basic process
    and equipment flowsheets for the design of a coal preparation plant. In order
    to cover the various stages leading to the final design of a plant, two basic
    flowsheets are needed, one bases on the process and the other on the equipment.
    Examples of process and equipment flowsheets are shown in figures.
