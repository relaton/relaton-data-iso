abstract:
- language: en
  script: Latn
  content: This document describes a core set of cloud service agreements for customer-oriented
    health cloud services. This document covers a customer-oriented cloud service
    agreement that can be used in healthcare organizations and public health centers
    that use health cloud services. This document defines key characteristics in the
    health cloud service agreement that are indispensable in providing optimal health/healthcare
    management functionalities. Privacy and security features are considered outside
    the scope of this document and are covered in ISO/TR 21332. The purpose of this
    document is to present matters to be considered (e.g., cloud type, components,
    key characteristics) by stakeholders involved in the implementation of cloud computing
    in hospitals or healthcare organizations. The potential users of this document
    are mainly 1) IT managers of hospitals, 2) hospital management, and 3) cloud service
    providers and cloud partners that provide services to healthcare institutions.
