abstract:
- language: en
  script: Latn
  content: This document specifies three methods for the determination of the ash
    of poly(vinyl chloride). The general procedures given in ISO 3451-1 are followed.
    For ash, method A is used. For sulfated ash, methods B and C are used. All three
    methods are applicable to resins, compounds and finished products. Methods B and
    C are applicable when lead-containing compounds are present.
