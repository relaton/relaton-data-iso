abstract:
- language: en
  script: Latn
  content: ISO 12297-2:2018 specifies dimensional and geometrical characteristics,
    nominal boundary dimensions and tolerance values for finished silicon nitride
    cylindrical rollers for rolling bearings. Annexes A and B give the sorting principles
    for roller diameter and roller length tolerances and gauges, respectively. Annex
    C gives examples of imperfection types and methods of inspection.
