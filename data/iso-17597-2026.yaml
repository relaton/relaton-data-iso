abstract:
- language: en
  script: Latn
  content: This document specifies a method that evaluates inactivation/removal effectiveness
    against airborne microorganisms in air cleaning devices. This method includes
    detailed requirements for the test rig, and simulates the air flowrate of the
    devices. The method also covers data acquisition, analysis, and reporting of results.
    Additionally, this document provides a normative procedure (see Annex A) for
    determining the effect of dust loading on the inactivation and removal effectiveness.
    This document is applicable to in-duct air cleaning devices, such as air filters
    set up in a heating, ventilation and air-conditioning (HVAC) system in commercial,
    institutional and office buildings, also in-duct air-purifying systems, or air
    sterilizers in these buildings. It applies to testing conducted under controlled
    laboratory conditions using specific surrogate test microorganisms (bacteria,
    moulds and viruses). This document does not apply to air cleaning devices intended
    for portable or standalone room use, which are addressed by ISO 16000-36 and
    the IEC 63086 series, devices evaluated solely for the physical removal of non-biological
    particulate matter, which are covered by the ISO 16890 series, and clinical,
    medical or industrial cleanroom applications requiring specific pathogenic testing.
    Furthermore, it does not cover the detailed assessment of ultraviolet (UV) dose
    evaluation exclusively for in-duct ultraviolet germicidal irradiation (UVGI) devices,
    which is covered by ISO 15714 and ASHRAE 185.1.
