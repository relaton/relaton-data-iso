abstract:
- language: en
  script: Latn
  content: This document establishes the minimum performance requirements and tests for multi-point seat-belt assemblies and seat-belt anchorages on earth-moving machinery, necessary to restrain an occupant within a roll-over protective structure (ROPS) in the event of a machine roll-over (see ISO 3471:2008, ISO 12117-2:2008/Amd 1:2016, and ISO 13459:2012/Amd 1:2022), or within a tip-over protection structure (TOPS) in the event of a machine tip-over (see ISO 12117:1997). Lap-type seat-belt covered by ISO 6683:2025 are excluded.
