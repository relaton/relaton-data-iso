abstract:
- language: en
  script: Latn
  content: This document specifies fire safety requirements for railway vehicle design
    to cover the objectives specified in ISO 9828-1. The measures and requirements
    specified in this document aim to protect passengers and staff in railway vehicles
    in the event of a fire on board by minimizing the risk of a fire starting, delaying
    the fire development and controlling the spread of fire products through the railway
    vehicle, thus aiding evacuation. It is not within the scope of this document to
    describe measures which ensure the preservation of the railway vehicles in the
    event of a fire.
