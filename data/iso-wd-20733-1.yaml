abstract:
- language: en
  script: Latn
  content: Develop Test and Rating Methods for Seasonal Performance of Water Source
    Heat Pump equipment covered by current ISO 13256-1, ISO 13256-2 standards. Details
    related to full and part load testing shall be included or aligned with updates
    to the current ISO 13256 standards. Rating methods and applicable calculations
    shall be included or referenced. The intent is for all of the seasonal calculations
    of these standards be based upon the ISO 13256-1 or -2 performance maps of source
    and load temperatures so that additional testing beyond 13256 will be reduced
    or even eliminated.
