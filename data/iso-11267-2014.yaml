abstract:
- language: en
  script: Latn
  content: ISO 11267:2014 specifies one of the methods for evaluating the habitat
    function of soils and determining effects of soil contaminants and substances
    on the reproduction of Folsomia candida Willem by dermal and alimentary uptake.
    This chronic test is applicable to soils and soil materials of unknown quality,
    e.g. from contaminated sites, amended soils, soils after remediation, industrial,
    agricultural or other sites of concern and waste materials. Effects of substances
    are assessed using a standard soil, preferably a defined artificial soil substrate.
    For contaminated soils, the effects are determined in the soil to be tested and
    in a control soil. According to the objective of the study, the control and dilution
    substrate (dilution series of contaminated soil) are either an uncontaminated
    soil comparable to the soil to be tested (reference soil) or a standard soil (e.g.
    artificial soil). ISO 11267:2014 provides information on how to use this method
    for testing substances under temperate conditions. The method is not applicable
    to volatile substances, i.e. substances for which H (Henry's constant) or the
    air/water partition coefficient is greater than 1, or for which the vapour pressure
    exceeds 0,013 3 Pa at 25 °C.
