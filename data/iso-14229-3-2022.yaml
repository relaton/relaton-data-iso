abstract:
- language: en
  script: Latn
  content: This document specifies an application profile for the implementation of
    unified diagnostic services (UDS) on controller area network (CAN) in road vehicles.
    UDSonCAN references ISO 14229-1 and ISO 14229-2 and specifies implementation requirements
    of the diagnostic services to be used for diagnostic communication on CAN. This
    document specifies —    additional requirements specific to the implementation
    of UDS on the CAN network, and; —    specific restrictions in the implementation
    of UDS on the CAN network.
