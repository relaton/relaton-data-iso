abstract:
- language: en
  script: Latn
  content: ISO 18400-105:2017 establishes general principles for packing, preservation,
    transport and delivery of samples of soil and related materials with an emphasis
    on requirements for when chemical analysis of the samples is required, but with
    the intention that the general procedures are to be adapted as appropriate when
    other forms of testing are required (e.g. biological testing, physical tests on
    disturbed or undisturbed samples). Special procedures for specific sampling purposes
    are given in other parts of ISO 18400 (see also 7.2). ISO 18400-105:2017 is intended
    to be read in conjunction with ISO 18512.
