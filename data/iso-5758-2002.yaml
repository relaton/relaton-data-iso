abstract:
- language: en
  script: Latn
  content: ISO 5758:2002 specifies the information to be included on the label and/or
    accompanying documents, for identifying the contents of containers for processed
    motion-picture film and magnetic sound records. It specifies the minimum information
    necessary for the exchange of materials. NOTE It does not apply to the labelling
    of containers of unexposed motion-picture films and magnetic materials specified
    in ISO 3042.
