abstract:
- language: en
  script: Latn
  content: 'This document specifies dimensional requirements relating to test specimens
    prepared from plastics materials intended for processing by moulding, as well
    as to test specimens prepared by machining from sheets or shaped articles. It
    compiles the designations and dimensions of test specimens used for the acquisition
    of comparable data and of other frequently used specimens. The following types
    of test specimen are specified: A            Tensile specimen, multipurpose or
    reduced-scale B            Bar specimen C            Small tensile specimen D           
    Square plate specimen F            Rectangular plate specimen NOTE    If a particular
    type of test specimen is not mentioned in this document, this does not mean that
    there is any intention to exclude the use of the specimen. Additional specimen
    types can be added in future if they are commonly used.  '
