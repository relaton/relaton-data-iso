abstract:
- language: en
  script: Latn
  content: This document outlines quality models for AI systems and services and is
    an applicationspecific extension to the standards on SQuaRE. The characteristics
    and sub-characteristics detailed in the models provide consistent terminology
    for specifying, measuring and evaluating AI system and service quality. The characteristics
    and sub-characteristics detailed in the models also provide a set of quality characteristics
    against which stated quality requirements can be compared for completeness.
