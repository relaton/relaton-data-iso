abstract:
- language: en
  script: Latn
  content: 'This document introduces and describes the concept of the application
    programming interface (API) to security devices with the intention to simplify
    the usage of commands and mechanisms defined by the ISO/IEC 7816 series. This
    document gives guidelines on: —    the system overview and description of the
    system of the programming interface; —    the architecture description; —    the
    data model in general, used by the API; —    the use cases and the usage model
    of the API.'
