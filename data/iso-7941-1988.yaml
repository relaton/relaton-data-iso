abstract:
- language: en
  script: Latn
  content: The method specified applies to the quantitative determination of hydrocarbons
    in liquefied petroleum gas, excluding components whose concentrations are below
    O,1 % (m/m). It is applicable to the analysis of propane, butane and their commercial
    mixtures which may include saturated and unsaturated C2, C3, C4 and C5 hydrocarbons.
    It does not apply to "on-line" chromatography.
