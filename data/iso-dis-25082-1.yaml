abstract:
- language: en
  script: Latn
  content: 'This project addresses the assessment of the positioning system performances
    equipped with a given GNSS-based positioning terminal completed with or without
    external augmentation data (SBAS, RTK, PPP, …). This project also addresses the
    identification and the definition of the positioning performance features and
    metrics required for Positioning System assessment. This project gives definitions
    of the various items to be considered when specifying an Operational scenario
    and provides a method enabling fine comparison between two environments with respect
    to their effects on GNSS positioning performance. This project gives definition
    of the most important terms used all along the document and describes the architecture
    of a positioning system based on GNSS as it is intended in this standard. Clarification
    of the scope of this document: — Values of performance metrics to be used for
    any specific application certification (such as autonomous guidance system, road
    user charging application, etc…) is not given. However, the template to be used
    by industries, SME, or any entities willing to certify a specific GNSS based positioning
    system in a specific use case, is provided in the standard. — Detailed tests description
    that are needed to be performed to assess Positioning System performances are
    not included in this standard. This is the topic of Part2 and Part3, which will
    be launched as a NWIP at a later timeline.'
