abstract:
- language: en
  script: Latn
  content: ISO 513:2012 specifies the classification and application of hard cutting
    materials, including hardmetals, ceramics, diamond and boron nitride, for machining
    by chip removal, and establishes their application. It is not applicable to other
    uses (mining and other percussion tools, wire drawing dies, tools operating by
    deformation of the metal and comparator contact tips, etc.).
