abstract:
- language: en
  script: Latn
  content: ISO 10019:2005 provides guidance for the selection of quality management
    system consultants and the use of their services. It is intended to assist organizations
    when selecting a quality management system consultant. It gives guidance on the
    process for evaluating the competence of a quality management system consultant
    and provides confidence that the organization's needs and expectations for the
    consultant's services will be met.
