abstract:
- language: en
  script: Latn
  content: ISO/TR 10828:2015, thread profiles of the five most common types of worms
    at the date of publication are described and formulae of their axial profiles
    are given. The five worm types covered in this technical report are designated
    by the letters A, C, I, K and N. The formulae to calculate the path of contact,
    the conjugate profile of the worm wheel, the lines of contact, the radius of curvature
    and the velocities at points of contact are provided. At the end the application
    of those formulae to calculate parameters used in load capacity calculations are
    provided.
