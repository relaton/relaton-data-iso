abstract:
- language: en
  script: Latn
  content: This document provides guidance on the planning, establishment, monitoring,
    maintenance and improvement of an interoperable regional socioeconomic platform
    intended to enhance resilience to issues, incidents, crisis and potential catastrophes
    at the regional level, where similar or shared disaster effects are anticipated.
    This document provides guidance to support collaborative information sharing and
    coordinated decision-making among stakeholders within the region. It further provides
    a basis for engaging all relevant stakeholders—particularly those contributing
    to or influencing local employment, infrastructure, assets, financial resources,
    and access to supply chains — which constitute core economic elements of recovery
    and the resumption of services following a disaster. By promoting coordinated
    and interoperable approaches that strengthen regional socioeconomic resilience
    this document also contributes, in an aggregated manner, to enhancing resilience
    across the global community, where regions are increasingly interconnected and
    exposed to diverse risks. This document does not prescribe or replace individual
    organizational business continuity plans (BCPs), emergency response plans, or
    crisis management procedures. Responsibility for organization-specific planning,
    decision-making, and operational execution remains with each respective entity.
