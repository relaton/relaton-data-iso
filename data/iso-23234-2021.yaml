abstract:
- language: en
  script: Latn
  content: This document provides requirements and recommendations for effective planning
    and design of security measures in the built environment. The purpose of the document
    is to achieve optimal protection of assets against all kinds of malicious acts,
    while ensuring functional, financial, and aesthetic aspects. The document describes
    which methods and routines need to be implemented in various stages of a building
    or civil engineering works project, as well as the competencies needed to achieve
    a good result. This document is applicable to new builds, refurbishments and development
    projects by government and private entities, for various environments, buildings
    and infrastructure.
