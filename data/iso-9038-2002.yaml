abstract:
- language: en
  script: Latn
  content: Many national and international regulations classify liquids as presenting
    a flammable hazard on the basis of their flash point, as determined by a recognized
    method. Some of these regulations allow a derogation if the substance cannot "sustain
    combustion" at some specified temperature or temperatures. This International
    Standard specifies a pass/fail procedure to determine whether or not a liquid
    product, that would be classified as "flammable" by virtue of its flash point,
    has the ability to sustain combustion at the temperature or temperatures specified
    in the appropriate regulations. The procedure is applicable to paints (including
    water-borne paints), varnishes, paint binders, solvents, petroleum or related
    products and adhesives, which have a flash point. It is not applicable to painted
    surfaces in respect of assessing their potential fire hazards.
