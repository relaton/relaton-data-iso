abstract:
- language: en
  script: Latn
  content: 'This document defines detailed space debris mitigation requirements and
    recommendations for the design and operation of unmanned spacecraft in Earth orbit.
    This document defines detailed requirements that are applicable to: a) avoiding
    the intentional release of space debris into Earth orbit during normal operations;
    b) avoiding break-ups in Earth orbit; c) disposal of a spacecraft after the end
    of mission; d) estimating the mass of the remaining usable propellant; e) developing
    and maintaining the space debris mitigation plan. NOTE       This document does
    not cover nuclear power sources on spacecraft.'
