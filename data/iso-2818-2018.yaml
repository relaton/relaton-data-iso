abstract:
- language: en
  script: Latn
  content: This document establishes the general principles and procedures to be followed
    when machining and notching test specimens from compression-moulded and injection-moulded
    plastics, extruded sheets, plates and partially finished or wholly finished products.
    In order to establish a basis for reproducible machining and notching conditions,
    the following general standardized conditions are applied. It is assumed, however,
    that the exact procedures used are selected or specified by the relevant material
    specification or by the standards on the particular test methods. If sufficiently
    detailed procedures are not thus specified, the interested parties agree upon
    the conditions to be used.
