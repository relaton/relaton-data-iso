abstract:
- language: en
  script: Latn
  content: ISO/TR 24679-6:2017 provides an example of fire safety engineering design
    in the application of ISO 24679‑1 to an office building. In ISO/TR 24679-6:2017,
    an overall structural analysis of a building is undertaken. It consists in a numerical
    assessment of the structural performance of an eight-storey concrete building
    when subjected to a fire. This analysis is performed in order to demonstrate that
    the fire safety objectives, for the relevant design fire scenarios, due to structural
    behaviour of building in the event of fire, are met with the trial plan for the
    safety of structure. With regards to this, a fully developed fire was studied.
    The purpose of this document is to assess the performance of an office building
    which is fully accessible to public in case of fire, using ISO 24679‑1. In this
    respect, a critical design fire was identified and analysed using detailed fire
    modelling. A more detailed analysis was then performed for critical design fire
    using the finite element model. The advanced model provided all the comprehensive
    information necessary for analysing the given built environment with respect to
    fire safety. It is to be noted that this document only addresses the fire safety
    objectives related to the structural performance during fire. The analysis within
    this document is therefore only part of the overall building fire safety strategy.
