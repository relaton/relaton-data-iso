abstract:
- language: en
  script: Latn
  content: ISO 22301:2012 specifies requirements to plan, establish, implement, operate,
    monitor, review, maintain and continually improve a documented management system
    to protect against, reduce the likelihood of occurrence, prepare for, respond
    to, and recover from disruptive incidents when they arise. The requirements specified
    in ISO 22301:2012 are generic and intended to be applicable to all organizations,
    or parts thereof, regardless of type, size and nature of the organization. The
    extent of application of these requirements depends on the organization's operating
    environment and complexity.
