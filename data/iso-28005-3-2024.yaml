abstract:
- language: en
  script: Latn
  content: This document provides technical specifications to facilitate an efficient
    exchange of electronic information between ships and shore, for coastal transit
    and port calls, with a specific focus on the operational data exchange. It specifies
    requirements to enhance the safety, security and efficiency of information exchanges.
    This document describes core data elements for use in electronic port clearance
    (EPC) messages. It does not define any structuring of messages, but rather gives
    general details on safety-, security- and operation-related maritime information
    in the context of EPC messages. Details about message formats and applications
    are found in ISO 28005-1.
