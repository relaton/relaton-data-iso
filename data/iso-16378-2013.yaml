abstract:
- language: en
  script: Latn
  content: 'ISO 16378:2013 specifies the multiple measurement methods, instruments,
    equipment, and samples used to calculate the thermo-optical properties of thermal
    control materials. It compares their features, indicates their limitations and
    biases, and guides the applications. These measurements will be performed at ground
    test facilities with the purpose of obtaining material properties. The measured
    properties will be used for material selection, thermal design of spacecraft,
    process control, quality control, etc. Also, on-orbit temperature data in the
    beginning of life can be assessed using the data obtained by ground measurement.
    Requirements for calibration and reference materials to ensure data quality are
    also defined. The following test methods are detailed in the annexes of ISO 16378:2013
    including the configuration of samples and calculations: Solar absorptance using
    a spectrophotometer: (αs); Solar absorptance using the comparative test method:
    (αp); Hemispherical infrared emittance using the thermal test method: (εh-t);
    Normal infrared emittance using an IR spectrometer: (εn-s); Normal infrared emittance
    using ellipsoid collector optics (εn-e); Normal infrared emittance using two rotating
    cavities: (εn-c).'
