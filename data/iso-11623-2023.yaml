abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for periodic inspection and testing
    to verify the integrity for further service of hoop-wrapped and fully-wrapped
    composite transportable gas cylinders and tubes, with aluminium-alloy, steel or
    non-metallic liners or of linerless construction (Types 2, 3, 4, and 5), intended
    for compressed, liquefied or dissolved gases under pressure, of water capacity
    from 0,5 l up to 3 000 l. This document addresses the periodic inspection and
    testing of composite cylinders and tubes constructed according to ISO 11119-1,
    ISO 11119-2, ISO 11119-3, ISO 11119-4 or ISO 11515. It can be applied to other
    composite cylinders and tubes designed to comparable standards when authorized
    by the competent authority. As far as practicable, this document can also be applied
    to cylinders of less than 0,5 l water capacity when authorized by the manufacturer.
    NOTE    Unless noted by exception, the use of the word “cylinder” in this document
    refers to both cylinders and tubes.
