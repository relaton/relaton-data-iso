abstract:
- language: en
  script: Latn
  content: ISO 5145:2014 establishes practical criteria for determining valve outlet
    connections for gas cylinders. It applies to the selection of gas cylinder valve
    outlet connections and specifies the dimensions for a number of them. It does
    not apply to connections used for cryogenic gas withdrawal or gases for breathing
    equipment, which are the subjects of other International Standards.
