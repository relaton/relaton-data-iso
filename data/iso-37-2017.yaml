abstract:
- language: en
  script: Latn
  content: ISO 37:2017 specifies a method for the determination of the tensile stress-strain
    properties of vulcanized and thermoplastic rubbers. The properties which can be
    determined are tensile strength, elongation at break, stress at a given elongation,
    elongation at a given stress, stress at yield and elongation at yield. The measurement
    of stress and strain at yield applies only to some thermoplastic rubbers and certain
    other compounds.
