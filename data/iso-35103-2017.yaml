abstract:
- language: en
  script: Latn
  content: ISO 35103:2017 gives requirements, specifications and guidelines to ensure
    that environmental monitoring in the offshore Arctic region is fit for purpose.
    The Arctic region includes the territory lying to the North of the Arctic Circle
    (Latitude 66°33′45.8″). This document can be applied to sub-Arctic locations which
    experience Arctic-like conditions and contain relevant components of a cold-climate
    ecosystem. ISO 35103:2017 is applicable to all Arctic oil and gas operations from
    licence block acquisition through exploration, engineering design, construction,
    commissioning, operation, decommissioning and restoration. It covers the offshore
    or maritime environment, including for the purposes of this document, the fully
    marine and estuarine waters of the Arctic, whether frozen or ice-free. The environment
    includes all relevant physical, chemical and biological components. Monitoring
    methods for onshore (terrestrial) environments are not covered in this document,
    although onshore environments are included where monitoring is required at onshore
    locations in relation to an offshore development. ISO 35103:2017 covers both monitoring
    of environmental aspects for normal, abnormal and emergency conditions, and monitoring
    of environmental impacts. It includes monitoring in near-field, far-field, transboundary
    and regional scales, but does not include global environmental monitoring.
