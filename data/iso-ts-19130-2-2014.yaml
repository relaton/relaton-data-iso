abstract:
- language: en
  script: Latn
  content: ISO/TS 19130-2:2014 supports exploitation of remotely sensed images. It
    specifies the sensor models and metadata for geopositioning images remotely sensed
    by Synthetic Aperture Radar (SAR), Interferometric Synthetic Aperture Radar (InSAR),
    LIght Detection And Ranging (lidar), and SOund Navigation And Ranging (sonar)
    sensors. The specification also defines the metadata needed for the aerial triangulation
    of airborne and spaceborne images. ISO/TS 19130-2:2014 specifies the detailed
    information that shall be provided for a sensor description of SAR, InSAR, lidar,
    and sonar sensors with the associated physical and geometric information necessary
    to rigorously construct a physical sensor model. For the case where precise geoposition
    information is needed, this Technical Specification identifies the mathematical
    formulae for rigorously constructing physical sensor models that relate two-dimensional
    image space to three-dimensional ground space and the calculation of the associated
    propagated error. ISO/TS 19130-2:2014 does not specify either how users derive
    geoposition data or the format or content of the data the users generate.
