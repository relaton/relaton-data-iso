abstract:
- language: en
  script: Latn
  content: 'This International Standard provides parameters based on values for hand/arm
    and approach speeds and the methodology to determine the minimum distances from
    sensing or actuating devices of protective equipment to a danger zone. These specific
    devices are: trip devices as defined in EN 292-1:1991, 3.23.5 (specifically electro-sensitive
    protective equipment, pressure sensitive mats), including those used additionally
    to initiate operation;two-hand control devices as defined in EN 292-1:1991, 3.23.4
    and covered by ISO 13851. NOTE For the purposes of this International Standard,
    hold-to-run controls, which are designed to be actuated with one hand, are not
    considered to be protective equipment. This International Standard does not apply
    to protective equipment which is intended to be moved, without tools, nearer to
    the danger zone than the calculated distance, e.g. pendant two-hand control devices.
    The minimum distances derived from this standard do not apply to protective equipment
    used to detect the presence of persons within an area already protected by a guard
    or electro-sensitive protective equipment.'
