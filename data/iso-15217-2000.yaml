abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies the following characteristics and
    requirements for a general-purpose, electrical-plug connector with two or three
    contacts plus earth, for use with solenoids: _ the electrical characteristics
    of the connector; _ the dimensions of the contacts; _ the means of fixing the
    plug to the socket; _ the sealing procedure between the plug and the socket; _
    usage requirements. The electrical-plug connector specified in this International
    Standard is intended to be used under working conditions such that the connector
    cannot be damaged by external action (for example, shock or excessive loading).'
