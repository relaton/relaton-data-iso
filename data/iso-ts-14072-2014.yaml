abstract:
- language: en
  script: Latn
  content: ISO/TS 14072:2014 provides additional requirements and guidelines for an
    effective application of ISO 14040 and ISO 14044 to organizations. This Technical
    Specification details ? the application of Life Cycle Assessment (LCA) principles
    and methodology to organizations, ? the benefits that LCA can bring to organizations
    by using LCA methodology at organizational level, ? the system boundary, ? specific
    considerations when dealing with LCI, LCIA, and interpretation, and ? the limitations
    regarding reporting, environmental declarations, and comparative assertions. This
    Technical Specification applies to any organization that has interest in applying
    LCA. It is not intended for the interpretation of ISO 14001 and specifically covers
    the goals of ISO 14040 and ISO 14044.
