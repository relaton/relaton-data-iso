abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1330:2008 specifies the application module for Presentation
    hierarchy. The following are within the scope of ISO/TS 10303-1330:2008: association
    between product data defined by other application modules of ISO 10303 and presentation
    data; hierarchical structuring of presentation data in sets, areas and view; nesting
    of presentation areas; items within the scope of application module Appearance
    assignment, ISO/TS 10303-1001; items within the scope of application module Contextual
    shape positioning, ISO/TS 10303-1027.'
