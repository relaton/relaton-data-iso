abstract:
- language: en
  script: Latn
  content: This part of ISO/IEC 14598 defines the structure and content of the documentation
    to be used to describe an Evaluation Module. Evaluation modules are intended to
    be used within the context of the ISO/IEC 9126 and the ISO/IEC 14598 multipart
