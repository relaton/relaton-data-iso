abstract:
- language: en
  script: Latn
  content: 'This document applies to elastomer-mechanical parts, as defined in ISO 22749-1.
    This document specifies: —    approval procedure to be implemented by the customer;
    —    guidelines for qualification of the product with specified requirements;
    —    quality monitoring of rubber and rubber to metal parts in manufacture. This
    document does not apply to: —    rubber diaphragms for pneumatic suspension springs;
    —    elastic parts of buffing and drawgear springs; —    diaphragms, bellows and
    seals; —    hoses and tubings; —    transmission belts.'
