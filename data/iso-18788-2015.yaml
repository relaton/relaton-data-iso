abstract:
- language: en
  script: Latn
  content: 'ISO 18788:2015 provides a framework for establishing, implementing, operating,
    monitoring, reviewing, maintaining and improving the management of security operations.
    It provides the principles and requirements for a security operations management
    system (SOMS). ISO 18788:2015 provides a business and risk management framework
    for organizations conducting or contracting security operations and related activities
    and functions while demonstrating: a) conduct of professional security operations
    to meet the requirements of clients and other stakeholders; b) accountability
    to law and respect for human rights; c) consistency with voluntary commitments
    to which it subscribes. ISO 18788:2015 is applicable to any organization that
    needs to: a) establish, implement, maintain and improve an SOMS; b) assess its
    conformity with its stated security operations management policy; c) demonstrate
    its ability to consistently provide services that meet client needs and are in
    conformance with applicable laws and human rights requirements.'
