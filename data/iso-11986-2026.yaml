abstract:
- language: en
  script: Latn
  content: This document provides general procedures for the selection of methods,
    preparation of samples, and the conduct of testing for the uptake and release
    of preservatives from contact lenses. Preservative uptake and release testing
    is not intended as a routine test of production contact lenses or contact lens
    care products nor are testing results meant to establish finished goods specifications
    in any way. Such testing is carried out when developing new contact lens materials
    and/or contact lens care products. NOTE 1        Due to the manifest difficulties
    of reproducibility when coating contact lenses with mineral and organic deposits
    encountered during lens wear, these methods are only applicable to new and unused
    contact lenses. NOTE 2        Preservative depletion by a contact lens in the
    limited volume of a lens case could compromise disinfection performance. This
    document does not measure disinfection performance.
