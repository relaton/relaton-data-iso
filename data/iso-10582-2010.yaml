abstract:
- language: en
  script: Latn
  content: ISO 10582:2010 specifies the characteristics of non-cushioned, heterogeneous
    floor coverings, based on poly(vinyl chloride) (PVC), supplied in either tile
    or roll form. Products may contain a transparent, non-PVC factory finish. To encourage
    the consumer to make an informed choice, ISO 10582:2010 includes a classification
    system (see ISO 10874) based on the intensity of use, which shows where these
    floor coverings give satisfactory service. It also specifies requirements for
    marking.
