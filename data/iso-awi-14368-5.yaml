abstract:
- language: en
  script: Latn
  content: This standard specifies the terms and definitions of watch-glasses with
    anti-fingerprint treatments, as well as the test methods and the evaluation of
    results for optical characterization, water contact angle, abrasion resistance,
    high-low temperature storage, thermal shock, high temperature and humidity, sunlight
    resistance, salt spray, synthetic sweat and adhesive force. This standard is applicable
    to mineral and sapphire watch-glasses with anti-fingerprint treatments.
