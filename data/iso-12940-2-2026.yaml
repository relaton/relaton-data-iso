abstract:
- language: en
  script: Latn
  content: This document specifies a method for evaluating the change of consistency,
    as measured by cone penetration, of lubricating grease when worked in the roll
    stability test apparatus, in the presence of water. The method described in this
    document only applies to greases with cone penetration in the range of 175 × 0,1
    mm to 385 × 0,1 mm as measured using ISO 2137.
