  content: This document provides telehealth cybersecurity controls of the overall security framework for systems and services applied to telehealth, specifically addressing cybersecurity controls uniquely applicable to telehealth, while general elements relevant to health delivery organizations (HDOs) can be referenced from ISO 27799. It also includes Annex A, which, for informative purposes, provides a mapping of the controls in 4.2 to 4.5 of this document to the security controls in ISO 27799:2025.
