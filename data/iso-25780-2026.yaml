abstract:
- language: en
  script: Latn
  content: This document specifies the properties of the piping system and its components
    made from glass-reinforced thermosetting plastics (GRP) based on unsaturated polyester
    (UP) resin. It is suited for all types of water supply, drainage and sewerage
    with or without pressure. Types of water supply include, but are not limited to,
    raw water, irrigation, cooling water, potable water, salt water, sea water, penstocks
    in power plants, processing plants and other water-based applications. This document
    is applicable to GRP-UP piping systems, with flexible joints, intended to be installed
    using jacking techniques. It specifies the characteristics of pipes made from
    GRP-UP, with or without aggregates or fillers. It also specifies the test parameters
    for the test methods referred to in this document. This document is applicable
    to circular pipes and joints with a size range from DN 100 to DN 4 000 at normal
    service conditions. This document covers requirements to demonstrate the adequacy
    of the design of the joint and specifies type test performance requirements for
    the joints as a function of the declared nominal pressure rating of the pipeline
    system and the required joint deflection capability of the system. The determination
    of longitudinal compressive properties of a pipe are given in Annex A and Annex B.
    The procedure for the calculation of the design jacking load on a GRP (UP) pipe
    is given in Annex C. Requirements for GRP-fittings, used between pipe systems
    covered by this document, are given in ISO 23856.
