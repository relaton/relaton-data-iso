abstract:
- language: en
  script: Latn
  content: ISO 17739 is a series defining roadside infrastructure-supported location-based
    services. Its purpose is to specify general information and use-cases for providing
    road safety support services that facilitate status and/or intent sharing on nomadic
    and mobile devices between vulnerable road users (VRUs) and various types of vehicles.
    These services are intended for use in specific urban localized areas, such as
    un-signalized intersections, T-intersections, roundabouts, low-speed zones, school
    zones, weaving areas, and more. Part 1 is general information and use cases definition.
    Part 2 is data structure and message set definition. Part 3 is No turn on red
    (NTOR) at junctions with traffic signals. Part 4 is Unprotected turn at T-junctions.
    This document, as a part of this series, specifies the service requirements and
    test procedures of roadside infrastructure supported location-based services for
    ensuring vehicle and VRU safety on a terminating road at three-way intersections.
    This is achieved by providing road safety support services with sharing of status
    and/or intent of nomadic and mobile devices between VRUs and vehicles, including
    non-automated vehicles, automated vehicles and connected vehicles.
