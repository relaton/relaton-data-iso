abstract:
- language: en
  script: Latn
  content: ISO 4892-1:2016 provides information and general guidance relevant to the
    selection and operation of the methods of exposure described in detail in subsequent
    parts. It also describes general performance requirements for devices used for
    exposing plastics to laboratory light sources. Information regarding performance
    requirements is for producers of artificial accelerated weathering or artificial
    accelerated irradiation devices. NOTE In this part of ISO 4892, the term "light
    source" refers to radiation sources that emit UV radiation, visible radiation,
    infrared radiation or any combination of these types of radiation. ISO 4892-1:2016
    also provides information on the interpretation of data from artificial accelerated
    weathering or artificial accelerated irradiation exposures. More specific information
    about methods for determining the change in the properties of plastics after exposure
    and reporting these results is given in ISO 4582.
