abstract:
- language: en
  script: Latn
  content: This document defines a data set of ink value combinations that can be
    used to characterize four-colour process printing. This data set is not optimized
    for any printing process or application area but is robust enough for all general
    applications. While it is primarily aimed at process colour printing with CMYK
    inks, it can also be used with any combination of three chromatic inks and a dark
    ink. This document is an alternative to the ISO 12642‑2 data set where more neutral
    scale data are desired. It is not designed as a replacement for ISO 12642-2.
