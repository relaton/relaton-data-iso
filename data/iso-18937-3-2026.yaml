abstract:
- language: en
  script: Latn
  content: This document describes test methods for measuring the light stability
    of photographic prints when subjected to LED illumination sources under conditions
    that simulate indoor display. This document is applicable to all types of colour
    and monochrome photographic reflection prints. This document does not include
    test procedures for determining the effects of light exposure on the physical
    stability of images, supports  or binder materials. NOTE 1        It is recognized
    that in some instances, physical degradation such as support embrittlement, image
    layer cracking, or delamination of an image layer from its support, rather than
    the stability of the image itself, will determine the useful life of a print material.
    NOTE 2        General guidance and requirements are given in ISO 18937-1. NOTE
    3        Tables 1 and 3 of LED lamp relative spectral irradiance were created
    using spectra from phosphor-converted blue LED lamps. Other types of LED lamps
    that meet the criteria of Tables 1 and 3 are also in the scope of this document.
