abstract:
- language: en
  script: Latn
  content: This document describes continuous measurement methods for radon-222. It
    gives indications for continuous measuring of the temporal variations of radon
    activity concentration in open or confined atmospheres. This document is intended
    for assessing temporal changes in radon activity concentration in the environment,
    in public buildings, in homes and in work places, as a function of influence quantities
    such as ventilation and/or meteorological conditions. The measurement method described
    is applicable to air samples with radon activity concentration greater than 5
    Bq/m3.
