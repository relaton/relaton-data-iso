abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the design, construction, operation,
    maintenance and inspection of stations for fuelling compressed natural gas (CNG)
    to vehicles, including equipment, safety and control devices up to the fuelling
    nozzle to the vehicle. This document applies to fuelling stations supplied with
    natural gas as defined in local applicable gas composition regulations or ISO
    13686. It also applies to other gases meeting these requirements. This document
    also applies to portions of a fuelling station where natural gas is in a gaseous
    state and dispensing CNG derived from liquefied natural gas (LCNG) according to
    ISO 16924. This document covers all equipment for downstream gas supply connection
    (i.e. point of separation between the CNG fuelling station piping and the pipeline
    network). Fuelling station nozzle are not defined in this document. This document
    covers fuelling stations with the following characteristics: —     slow fill;
    —     fast fill; —     private access; —     public access (self-service or assisted);
    —     fuelling stations with fixed storage; —     fuelling stations with mobile
    storage (daughter station); —     multi-fuel stations. This document is not applicable
    to vehicle to vehicle transfer or vehicle refuelling appliances (VRA). NOTE           
    This document is based on the condition that the gas entering the fuelling station
    is odorized. For unodorized gas fuelling stations, additional safety requirements
    are included in Clause 10.'
