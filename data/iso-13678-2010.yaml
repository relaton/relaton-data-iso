abstract:
- language: en
  script: Latn
  content: ISO 13678:2010 provides requirements, recommendations and methods for the
    testing of thread compounds intended for use on threaded casing, tubing, and line
    pipe connections; and for thread compounds intended for use on rotary shouldered
    connections. The tests outlined are used to evaluate the critical performance
    properties and physical and chemical characteristics of thread compounds under
    laboratory conditions. These test methods are primarily intended for thread compounds
    formulated with a lubricating base grease and are not applicable to some materials
    used for lubricating and/or sealing thread connections. It is recognized that
    many areas can have environmental requirements for products of this type. ISO
    13678:2010 does not include requirements for environmental compliance. It is the
    responsibility of the end user to investigate these requirements and to select,
    use and dispose of the thread compounds and related waste materials accordingly.
