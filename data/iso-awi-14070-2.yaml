abstract:
- language: en
  script: Latn
  content: Atmospheric measurements and analyses combined with spatially explicit
    anthropogenic and biogenic emissions modelling results are the basis for management
    of efforts to improve confidence in emissions quantification in the urban domain
    of cities and their immediately surrounding regions. The standards effort under
    development, 14070, addresses the need for robustly accurate quantification of
    GHG emission rates from urban environments, the location of a wide range of GHG
    emission sources and sinks estimated to be the source of 60% - 80% of global emissions.
    The approach taken is the description and management of a system combining 4 measurement
    and modelling elements, 14070 parts 1 – 4, that takes advantage of the strengths
    of each element. The standard on atmospheric measurement methods, (ISO 14070-1)
    now at the committee draft stage of development, is combined with those of emissions
    modelling of both anthropogenic (14070-2), and biogenic (14070-3), sources and
    sinks in urban settings. The last component (14070-4), will address the analysis
    methods necessary to combine parts 1 - 3 into a functional emissions quantification
    system. The proposed standard ISO 14070-2, represents the second part in the series.
    This proposal for a new work item is a continuation of the work of TC207/SC7 WG
    17.
