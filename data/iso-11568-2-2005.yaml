abstract:
- language: en
  script: Latn
  content: ISO 11568-2:2005 specifies techniques for the protection of symmetric and
    asymmetric cryptographic keys in a retail banking environment using symmetric
    ciphers and the life-cycle management of the associated symmetric keys. The techniques
    described enable compliance with the principles described in ISO 11568-1. The
    techniques described are applicable to any symmetric key management operation.
