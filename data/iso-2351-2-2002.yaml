abstract:
- language: en
  script: Latn
  content: ISO 2351-2 prescribes the technical specifications for machine-operated
    screwdriver bits for cross-recessed head screws. It applies to bits with male
    hexagon drive or with cylindrical flat end drive as defined in ISO 1173, and to
    tips for screwdrivers as defined in ISO 8764-1. It also gives recommended combinations
    between tips and bits.
