abstract:
- language: en
  script: Latn
  content: This document specifies graphical symbols for air conditioning, including
    household and commercial air conditioning equipment, multi-split units, dedicated
    precision air conditioners, etc.. It is intended that the symbols are to be used
    on the appropriate part of air conditioning equipment and in documents pertaining
    to the equipment, for example in instructions for use, marking and labeling. They
    cover operations, controls and displays, ensuring clear and consistent communication
    of information related to the operation, control and monitoring of air conditioning
    systems. This document is applicable to the use of general graphical symbols in
    designing air conditioning equipment. This document is not applicable to the use
    of graphical symbols conveying safety information, which developed by IEC/TC 61/SC
    61D. NOTE 1 ISO 7000 and IEC 60417 can be consulted for additional internationally
    standardized graphical symbols of potential relevance to air conditioning equipment.
    NOTE 2 The symbols in this document are selected specifically for all kinds of
    air conditioning equipment. Most of the symbols are taken from relevant ISO, IEC
    documents. New symbols will be formally submitted and registered by ISO/TC 145/SC
    3 in due course.
