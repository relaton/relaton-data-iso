abstract:
- language: en
  script: Latn
  content: ISO 13284:2002 specifies technical characteristics and strength requirements
    for fork-arm extensions and telescopic fork arms. It applies to fork-arm extensions
    and telescopic fork arms designed for use on stacking lift trucks, as defined
    in ISO 5053, having fork-arm carriers conforming to ISO 2328 and, in the case
    of fork-arm extensions, hook-on fork arms conforming to ISO 2330. ISO 13284:2002
    does not apply to integral transverse telescopic fork devices or scissor-action
    reach devices.
