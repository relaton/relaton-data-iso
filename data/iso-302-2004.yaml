abstract:
- language: en
  script: Latn
  content: ISO 302:2004 specifies a method for the determination of the Kappa number
    of pulp. The Kappa number is an indication of the lignin content or bleachability
    of pulp. ISO 302:2004 is applicable to all kinds of chemical pulps and semi-chemical
    pulps within the Kappa number range 1 to 100. For pulps with a Kappa number exceeding
    100, use the chlorine-consumption procedure (ISO 3260) to describe the degree
    of delignification.
