- language: en
  script: Latn
  content: ISO 6707-3:2017 establishes preferred terms and definitions for concepts
    applicable to sustainability and sustainable development related to buildings
    and civil engineering works. NOTE It focuses on concepts that have been standardized
    and/or applied through publication of individual International Standards within
    ISO/TC 59/SC 17 and on terms and definitions of concepts frequently encountered
    in the literature of buildings and other types of construction works that relate
