abstract:
- language: en
  script: Latn
  content: This document provides a basis for exchange of information about reliability,
    availability and maintainability between gas turbine manufacturers, users, consultants,
    regulatory bodies, insurance companies and others. It defines terms and definitions
    and also describes component life expectancy, repairs and criteria for determining
    overhaul intervals. This document is applicable to all elements of the gas turbine
    and auxiliaries.
