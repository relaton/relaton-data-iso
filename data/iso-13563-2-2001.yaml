abstract:
- language: en
  script: Latn
  content: This part of ISO 13563 specifies additional tests to verify the stability
    of single side loading fork-lift trucks when handling empty or laden freight containers
    of 6 m length and above. This part of ISO 13563 specifies tests in addition to
    those specified in ISO 13563-11). The stability tests contained in this part of
    ISO 13563 ensure that single side loading fork-lift trucks handling freight containers
    have satisfactory stability when operating the truck stacking in conditions where
    wind speed, v, is up to 12,2 m/s (Beaufort Scale 6). Alternative ratings may be
    used in higher wind speeds with higher values for v in the equation in 3.4.3.
    This part of ISO 13563 is not applicable to trucks when a) they are handling suspended
    loads that may swing freely, or b) they are handling a container with a mobile
    centre of gravity (see ISO 3874). The tests in this part of ISO 13563 take into
    account the normal degree of eccentric loading of containers as defined in ISO
    3874. When handling empty refrigerated containers, as specified in ISO 1496-2,
    with integral refrigeration unit (reefers), account should be taken of the offset
    of the load.
