abstract:
- language: en
  script: Latn
  content: ISO 11078:2007 defines the requirements for non Newtonian ISO types II,
    III and IV fluids used in the removal and prevention of ice, snow, or frost on
    exterior surfaces of main line and regional civil transport airplanes on the ground.
    ISO 11078:2007 is applicable to de-icing/anti-icing fluids for use on airplanes
    in general. However, the applicability may have limitations for particular airplane
    types. It is the airplane operator's responsibility to consult the aircraft operations
    manual, the aircraft maintenance manual and the service letters of the airplane
    manufacturer, to determine any limitations/restrictions relating to the use of
    de-icing/anti-icing fluids that conform to ISO 11078:2007 for the type and model
    of airplane to be treated.
