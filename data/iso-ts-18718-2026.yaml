abstract:
- language: en
  script: Latn
  content: This document provides definitions, descriptions and a framework for the
    assessment of ecological soil functions and of related ecosystem services, based
    on a review of existing documents. It describes the main characteristics of key
    ecological soil functions and how they relate to soil characteristics and to ecosystem
    services. This document does not cover non-ecological soil functions, e.g. the
    support of infrastructures and archives, the provision of raw material.
