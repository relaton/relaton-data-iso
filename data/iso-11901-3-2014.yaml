abstract:
- language: en
  script: Latn
  content: ISO 11901-3:2014 specifies the dimensions (in millimetres), nominal initial
    forces and types of gas springs. It is applicable to gas springs with increased
    spring force and compact built height of type 1 700 to 200 000, pressurized with
    nitrogen with a nominal initial force of between 1 700 N ± 5 % and 200 000 N ±
    5 %, for use in press tools. It also specifies marking, technical delivery conditions
    and designation.
