abstract:
- language: en
  script: Latn
  content: This document applies to arc stud welding of metallic materials subject
    to static and fatigue loading. This document specifies requirements that are particular
    to stud welding, in relation to welding knowledge, quality requirements, welding
    procedure specification, welding procedure qualification, qualification testing
    of operators and testing of production welds. This document is applicable where
    it is necessary to demonstrate the capability of a manufacturer to produce welded
    construction of a specified quality. NOTE            General quality requirements
    for fusion welding of metallic materials are given in ISO 3834-1, ISO 3834-2,
    ISO 3834-3, ISO 3834-4 and ISO 3834-5. This document has been prepared in a comprehensive
    manner, with a view to it being used as a reference in contracts. The requirements
    contained within it can be adopted in full, or partially, if certain requirements
    are not relevant to a particular construction (see Annex A). For the working range
    of stud welding, see Annex B.
