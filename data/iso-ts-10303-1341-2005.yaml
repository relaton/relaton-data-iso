abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1341:2005 specifies the application module for Generic expression.
    The following are within the scope of ISO/TS 10303-1341:2005: the definition of
    the complexity of the expression referring the number of terms, number of variable
    and number of operands; the exchange of expressions that involve both constants
    and variables; the computation of the variables used in an expression; the semantic
    definition of the variables giving the correct environment.'
