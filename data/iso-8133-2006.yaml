abstract:
- language: en
  script: Latn
  content: 'ISO 8133:2006 specifies the mounting dimensions required for interchangeability
    of accessories for 16 MPa (160 bar) compact cylinders conforming to ISO 6020-2.
    The accessories have been designed specifically for use with cylinders manufactured
    in accordance with ISO 6020-2, but this does not limit their application. ISO
    8133:2006 covers the following accessories, identified in accordance with ISO
    6099: AP 6: rod eye spherical, female thread; AB 5: clevis bracket, spherical
    eye, in angle; AA 7: pivot pin, spherical bearing, locking plate; AL 7: locking
    plate for pivot pin; AP 2: rod clevis, female thread; AP 4: rod eye plain, female
    thread; AB 2: eye bracket; AB 4: clevis bracket, straight; AA 4: pivot pin, plain
    (cotter pin or snap ring type); and AT 4: trunnion bracket. These accessories
    are used on hydraulic cylinders for mechanically transmitting the cylinder force.
    The design of these accessories is based on the maximum forces resulting from
    the specified internal diameters of the cylinders and pressures according to ISO
    3320 and ISO 3322. ISO 8133:2006 only applies to the dimensional criteria of products
    manufactured in conformity with ISO 8133:2006; it does not apply to their functional
    characteristics.'
