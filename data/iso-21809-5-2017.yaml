abstract:
- language: en
  script: Latn
  content: ISO 21809-5:2017 specifies the requirements for qualification, application,
    testing and handling of materials required for the application of reinforced concrete
    coating externally to either bare pipe or pre-coated pipe for use in pipeline
    transportation systems for the petroleum and natural gas industries as defined
    in ISO 13623. The external application of concrete is primarily used for the negative
    buoyancy of pipes used in buried or submerged pipeline systems and/or for the
    mechanical protection of the pipe and its pre-coating. ISO 21809-5:2017 is applicable
    to concrete thicknesses of 25 mm or greater.
