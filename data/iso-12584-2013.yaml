abstract:
- language: en
  script: Latn
  content: ISO 12584:2013 defines the method of reporting and communicating the contamination
    (or cleanliness) level of components used in aerospace fluid systems. It also
    presents a coding system which allows cleanliness data to be reported, both in
    a shortened manner and in a complete manner, when communicating for reporting
    contamination level measurement results and for specifying cleanliness requirements.
