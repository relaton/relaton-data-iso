abstract:
- language: en
  script: Latn
  content: 'ISO 13769 specifies stamp marking of refillable transportable gas cylinders
    and tubes of volume greater than 0,5 l and less than or equal to 3 000 l including:
    steel and aluminium gas cylinders;composite gas cylinders;acetylene cylinders.
    It is intended to be applied at the time of cylinder manufacture; however, it
    could be applied by the cylinder user during use operations, e.g., the stamping
    of empty weight on to cylinders not so marked at time of manufacture. Stamp marking
    of LPG cylinders is not covered by this International Standard.'
