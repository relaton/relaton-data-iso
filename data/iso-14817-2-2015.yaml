abstract:
- language: en
  script: Latn
  content: ISO 14817-2:2015 specifies the registration process to enter data concepts
    into the Central ITS Data Concept Registry (CIDCR). The CIDCR is designed to include
    data concepts that conform to ISO 14817-1. These data concepts may be derived
    from the system architecture defined in ISO 14813, but may also support data concepts
    using alternative International, Regional or National System Architecture methodologies
    or techniques.
