abstract:
- language: en
  script: Latn
  content: In order to carry out measurements given above with satisfactory accuracy
    (of the order of 2 % for example), it is usually necessary to choose a measuring
    plane where the velocity distribution approaches that of fully developed flow
    (see ISO 3354 and ISO 3966). Specifies the measurements required, the precautions
    to be taken, the corrections to apply, and describes the additional uncertainties
    which are introduced when a measurement in asymmetric or swirling flow has to
    be made.
