abstract:
- language: en
  script: Latn
  content: ISO 815-2:2014 specifies two methods for the determination of the compression
    set characteristics of vulcanized and thermoplastic rubbers at low temperatures.
    Method 1 derives from the methodology used in ISO 815‑1. Method 2 uses a specified
    testing device, allowing to measure and record the test piece thickness during
    recovery. Due to the load applied during recovery in method 2, no correlation
    can be established between the results given by both methods.
