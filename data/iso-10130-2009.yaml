abstract:
- language: en
  script: Latn
  content: ISO 10130:2009 describes a method for the detection and quantification
    of N‑nitrosodiethanolamine (NDELA) in cosmetics and raw materials used in cosmetics
    by High Performance Liquid Chromatography (HPLC) coupled with post-column photolysis
    and derivatization. This method is not applicable to the detection and/or quantification
    of nitrosamines other than NDELA, nor to the detection and/or quantification of
    NDELA in products other than cosmetics or raw materials used in cosmetics. If
    a product has the possibility of either NDELA contamination from the ingredients
    or NDELA formation by the composition of ingredients, the method will be applied
    for the testing of cosmetic products and is an alternative to ISO 15819. This
    method is not applicable to matrices containing oxidation dyes.
