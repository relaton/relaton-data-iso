abstract:
- language: en
  script: Latn
  content: 'The intention of this specification is to present the general RF requirements
    and test methodologies for physical layer communication channel and its components
    according to Figure 1 to enable 1000 Class 2/2.5/5/10GBASE-T1 technology using
    fully shielded cables and connectors for Automotive Ethernet applications. The
    requirements and test methods are described additionally for 1000BASE-T1 applications
    on fully shielded cabling to allow backward compatibility of components to class
    2 requirements: This provides the possibility to qualify components, cable assemblies
    and channels for any of the speed grades defined in Chapter 3.1 with only one
    set of test groups. A single measurement result can be compared to the requirements
    of a multiple number of speed grades if the maximum frequency settings correspond
    to the fastest speed grade. The requirements for class 2 and for speed grade 1G
    in this document are the same. Thus, re-qualifications of 1G components, cable
    assemblies and channels are not necessary. Unshielded and shielded class 1 channels
    and components for 1000BASE-T1 are not in scope of this document since these topics
    are covered in ISO 21111-12. These requirements are related to signal integrity
    and EMC behaviour of the communication channel. The link segment requirements
    for 1000BASE-T1 according to [1] apart from mode conversion requirements and 2.5G/5G/10GBASE-T1
    according [2] shall be met. The fully shielded differential cable is not limited
    to a specific construction, as no specific mechanical requirements are defined.
    Common types of shielded differential cables are STP, SDP, SPP, STQ, twin-axial
    cables or others. The qualification of shielded cabling systems and components
    shall be done under well-defined setup to make results comparable. This document
    defines electrical parameters to be tested for the complete communication channel
    between two Ethernet nodes, for cable assemblies and cables and connectors as
    a single component of this communication channel. It contains test procedures,
    measurement setups and electrical requirements and shall be used as a standardized
    common scale for the evaluation of complete channels, cable assemblies and cables
    and connectors. Electrical requirements on the communication channel are also
    stated. Other functional requirements such as mechanical and climatic stress as
    well as application dependent EMC relevant parameters may also be required but
    would be specified by the customer (OEM) and are not the focus of this document
    See the full scope in Annex (includes a graph)'
