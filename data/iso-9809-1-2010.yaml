abstract:
- language: en
  script: Latn
  content: ISO 9809-1:2010 specifies minimum requirements for the material, design,
    construction and workmanship, manufacturing processes, examination and testing
    at manufacture of refillable quenched and tempered seamless steel gas cylinders
    of water capacities from 0,5 l up to and including 150 l for compressed, liquefied
    and dissolved gases. ISO 9809-1:2010 is applicable to cylinders with a maximum
    actual tensile strength Rma of less than 1 100 MPa. If desired, cylinders of water
    capacity less than 0,5 l and between 150 l and 500 l can be manufactured and certified
    to be in compliance with ISO 9809-1:2010.
