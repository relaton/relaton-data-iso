abstract:
- language: en
  script: Latn
  content: This document describes communication protocols for the physical and data
    link layer of shared communication, which is a wireless distributed communication
    network for units related with UAs in level II. Physical layer includes frame
    structure, encoding procedure, physical layer procedure and coexistence operations.
    Data link layer includes channel and slot, resource management, broadcast and
    exchange of data, synchronization, security, and interface with upper layer and
    other communication layers.
