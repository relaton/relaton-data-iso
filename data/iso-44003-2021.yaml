abstract:
- language: en
  script: Latn
  content: This document gives guidelines for micro, small and medium-sized enterprises
    (MSMEs) to use the twelve principles of collaborative business relationships given
    in ISO/TR 44000 to improve their collaborative capability. This document is applicable
    to MSMEs regardless of what they do, where they are, their operating environment,
    culture, social capital and objectives. NOTE      The definition of an MSME varies
    widely. This document is intended for the use of any organization that identifies
    or is identified as an MSME.
