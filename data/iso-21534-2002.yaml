abstract:
- language: en
  script: Latn
  content: This International Standard specifies particular requirements for total
    and partial joint replacement implants, artificial ligaments and bone cement,
    hereafter referred to as implants. For the purposes of this International Standard,
    artificial ligaments and their associated fixing devices are included in the term
    implant, hereinafter referred to as implants. It specifies requirements for intended
    performance, design attributes, materials, design evaluation, manufacturing, sterilization,
    packaging and information to be supplied by the manufacturer. Some tests required
    to demonstrate compliance with this International Standard are contained in or
    referenced in level 3 standards.
