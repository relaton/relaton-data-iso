abstract:
- language: en
  script: Latn
  content: This document specifies performance requirements for surrogate standing
    scooter target used to assess the system detection and activation performance
    of active safety systems and Automated Driving Systems (ADS). The document addresses
    the detection requirements for the targets in terms of sensing technologies commonly
    in use at the time of publication of this document, and where possible, anticipated
    future sensing technologies. It also addresses methodologies to verify the target
    response properties to these sensors. This document does not address the test
    procedures in terms of speeds, positions, or timing of events. Performance criteria
    for the active safety system being evaluated are also not addressed. This document
    focuses on the development of standing scooter targets. Other micro mobility devices
    are excluded in this document, such as hoverboards, segways, electric skateboards.
