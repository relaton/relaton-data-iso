abstract:
- language: en
  script: Latn
  content: This part of ISO 11748 gives guidelines for the content and structure of
    technical documentation for on-board electronic control systems used in road vehicles.
    It provides a checklist of technical data elements to be considered when creating
    technical documentation. The actual set of technical data elements to be exchanged
    between project partners is settled by the documentation agreement described in
    ISO 11748-2. Any decision on which information is relevant, mandatory or optional
    will be specific to a given project, and will thus be documented in that agreement.
