abstract:
- language: en
  script: Latn
  content: This document defines the measuring principles used for measuring piston
    pins. It applies to piston pins with a nominal outer diameter from 8 mm up to
    and including 100 mm, for reciprocating internal combustion engines for road vehicles
    and other applications. In certain applications, except road vehicles, and provided
    that the purchaser and the manufacturer agree, this document can be used with
    suitable modifications.
