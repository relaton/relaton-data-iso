abstract:
- language: en
  script: Latn
  content: ISO 22476-7:2012 specifies the equipment requirements, execution of and
    reporting on borehole jack tests. It specifies the procedure for conducting a
    borehole jack test in ground stiff enough not to be adversely affected by the
    drilling operation. Two diametral cylindrical steel loading plates are placed
    in the ground and opened by pressure. Pressure applied to, and associated opening
    of, the probe are measured and recorded so as to obtain a stress-displacement
    relationship of the ground for the range of the expected design stress. ISO 22476-7:2012
    applies to test depths of < 100 m and to testing either on land or off-shore.
