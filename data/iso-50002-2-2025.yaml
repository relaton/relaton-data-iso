abstract:
- language: en
  script: Latn
  content: This document gives guidance on how to apply ISO 50002-1 to carry out energy
    audits of a building or group of buildings (new or existing). It is intended to
    be used in conjunction with, and is supplementary to, ISO 50002-1. This document
    does not apply to other areas such as process audits (see ISO 50002-3), specific
    energy systems (e.g. compressed air) or transport. This document is applicable
    to buildings and can be used independently or in conjunction with ISO 50002-3.
