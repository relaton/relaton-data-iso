abstract:
- language: en
  script: Latn
  content: ISO 16750-5:2003 specifies chemical loads and corresponding tests and requirements
    for the mounting of electric and electronic systems and components on road vehicles.
    It is applicable to environmental conditions and tests affecting electrical and
    electronic equipment mounted directly on or in the vehicle. It does not cover
    electromagnetic compatibility (EMC).
