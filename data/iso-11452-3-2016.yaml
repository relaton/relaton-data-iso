abstract:
- language: en
  script: Latn
  content: ISO 11452-3:2016 specifies transverse electromagnetic (TEM) cell tests
    for determining the immunity of electronic components of passenger cars and commercial
    vehicles to electrical disturbances from narrowband radiated electromagnetic energy,
    regardless of the vehicle propulsion system (e.g. spark-ignition engine, diesel
    engine, electric motor). The electromagnetic disturbances considered are limited
    to continuous narrowband electromagnetic fields.
