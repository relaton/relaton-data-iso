abstract:
- language: en
  script: Latn
  content: ISO 10382:2002 specifies a method for quantitative determination of seven
    polychlorinated biphenyls and seventeen organochlorine pesticides in soil. ISO
    10382:2002 is applicable to all types of soil. Under the conditions specified
    in ISO 10382:2002, limits of detection of 0,1 micrograms per kilogram to 4 micrograms
    per kilogram (expressed as dry matter) can be achieved.
