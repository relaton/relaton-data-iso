abstract:
- language: en
  script: Latn
  content: This document defines terms and establishes a classification (see Annex A)
    for open-top metal cans and metal ends. This document is applicable to open-top
    metal cans and metal ends for food and beverages made of metal plates such as
    tin or chromium-coated steel plates or aluminium alloy plates with a thickness
    of no more than 0,49 mm.
