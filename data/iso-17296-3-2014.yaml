abstract:
- language: en
  script: Latn
  content: ISO 17296-3:2014 covers the principal requirements applied to testing of
    parts manufactured by additive manufacturing processes. It specifies main quality
    characteristics of parts, specifies appropriate test procedures, and recommends
    the scope and content of test and supply agreements. ISO 17296-3:2014 is aimed
    at machine manufacturers, feedstock suppliers, machine users, part providers,
    and customers to facilitate the communication on main quality characteristics.
    It applies wherever additive manufacturing processes are used.
