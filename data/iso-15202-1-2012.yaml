abstract:
- language: en
  script: Latn
  content: ISO 15202-1:2012 specifies a method for collecting samples of airborne
    particulate matter for subsequent determination of metals and metalloids using
    inductively coupled plasma ? atomic emission spectrometry (ICP-AES). Samples obtained
    using the method described herein can also be subsequently analysed for elemental
    composition by other instrumental methods, such as atomic absorption spectrometry
    (AAS) or inductively coupled plasma mass spectrometry (ICP-MS). The method is
    not applicable to the sampling of mercury, which is present in air in the vapour
    phase at ambient temperatures; inorganic compounds of metals and metalloids that
    are permanent gases, e.g. arsine (AsH3); or inorganic compounds of metals and
    metalloids that are present in the vapour phase at ambient temperatures, e.g.
    arsenic trioxide (As2O3). The method is applicable to personal sampling of the
    inhalable or respirable fraction of airborne particles, as defined in ISO 7708,
    and to static sampling.
