abstract:
- language: en
  script: Latn
  content: ISO 17142:2014 specifies the conditions for the determination of properties
    at constant-amplitude of load or strain in uniaxial tension/tension or in uniaxial
    tension/compression cyclic fatigue of ceramic matrix composite materials (CMCs)
    with fibre reinforcement for temperature up to 1 700 °C in air at atmospheric
    pressure. It applies to all ceramic matrix composites with fibre reinforcement,
    unidirectional (1D), bi-directional (2D), and tri-directional (xD, where 2 < x
    ≤ 3). Its purpose is to determine the behaviour of CMC when subjected to mechanical
    fatigue and oxidation simultaneously. Tests for the determination of fatigue properties
    at high temperature in inert atmospheres differ from those in oxidative atmospheres.
    Contrary to an inert atmosphere, damage in an oxidative atmosphere accumulates
    due to the influence of purely mechanical fatigue and to chemical effects of the
    material's oxidation.
