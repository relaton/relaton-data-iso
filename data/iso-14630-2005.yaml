abstract:
- language: en
  script: Latn
  content: ISO 14630:2005 specifies general requirements for non-active surgical implants,
    hereafter referred to as implants. It is not applicable to dental implants, dental
    restorative materials, transendodontic and transradicular implants and intra-ocular
    lenses. With regard to safety, ISO 14630:2005 gives requirements for intended
    performance, design attributes, materials, design evaluation, manufacture, sterilization,
    packaging and information supplied by the manufacturer, and tests required to
    demonstrate compliance with these requirements. Additional tests are given or
    referred to in Level 2 and Level 3 Standards.
