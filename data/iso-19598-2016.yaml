abstract:
- language: en
  script: Latn
  content: ISO 19598:2016 applies to electrodeposited zinc and zinc-alloy coatings
    on iron and steel with Cr(VI)-free passivation. The zinc-alloy coatings contain
    nickel or iron as alloying elements (referred to as zinc/nickel and zinc/iron
    coatings, respectively). The main purpose of the coatings or coating systems is
    protecting iron and steel components against corrosion. ISO 19598:2016 specifies
    - the designations to be used for the above coating systems, - the minimum corrosion
    resistance to be achieved in specified test procedures, and - the minimum coating
    thicknesses required.
