abstract:
- language: en
  script: Latn
  content: This document establishes required practices for the safe use of bridge
    and gantry cranes through implementing a safe system of work consisting of tasks
    planning, selection, erection and dismantling, operation and maintenance of cranes,
    and the selection of operators, slingers and signallers. This document applies
