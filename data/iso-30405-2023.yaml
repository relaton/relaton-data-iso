abstract:
- language: en
  script: Latn
  content: 'This document provides guidance on how to attract, source, assess and
    employ people with the goal of meeting the organizational needs while fostering
    a positive candidate experience. It focuses on key processes and practices, including:
    —     preparing and planning; —     managing the different phases and stakeholders;
    —     reviewing and learning. This document can be used by any organization, regardless
    of type or size. NOTE            This document can be used by anyone managing
    or performing the recruitment function, whether this is a dedicated role within
    the organization or an additional task for someone with another role, as well
    as those who evaluate, teach or consult in recruitment.'
