abstract:
- language: en
  script: Latn
  content: ISO 14171:2002 specifies requirements for the classification of wire-flux
    combinations and all-weld metal in the as-welded condition and in the post weld
    heat-treated condition for submerged arc welding of non alloy and fine grain steels
    with a minimum yield strength of up to 500 N/mm2 or a minimum tensile strength
    of up to 570 N/mm2. One flux may be classified with different wire electrodes.
    The wire electrode is also classified separately based on its chemical composition.
    This document constitutes a combined specification providing classification utilizing
    a system based upon the yield strength and the average impact energy for all-weld
    metal of 47 J, or utilizing a system based upon the tensile strength and the average
    impact energy for all-weld metal of 27 J.
