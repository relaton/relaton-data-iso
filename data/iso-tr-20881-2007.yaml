abstract:
- language: en
  script: Latn
  content: ISO/TR 20881:2007 establishes the performance requirements for insoles
    components for footwear (not for the finished footwear), irrespective of the material,
    in order to assess the suitability for the end use and/or fitness for purpose.
    It also establishes the test methods to be used to evaluate the compliance with
    the requirements. This Technical Report applies to insoles for various kinds of
    footwear. ISO/TR 20881:2007 is intended to be used as a reference between the
    manufacturer and the supplier. It is not intended for third party certification.
