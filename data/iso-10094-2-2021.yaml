abstract:
- language: en
  script: Latn
  content: 'This document specifies the test procedures and a method of presenting
    results concerning the parameters which define the main characteristics to be
    included in the supplier''s literature of the electro-pneumatic continuous pressure
    control valves, conforming to ISO 10094-1. The purpose of this document is: —   
    to facilitate comparison by standardizing the test methods and the presentation
    of the test results, and —    to assist in the proper application of these components
    in compressed air systems. The specified tests are intended to allow comparison
    between the different types of continuous pressure control valves; these are not
    production tests to be carried out on each manufactured product. The tests described
    in this document are for components with an exhaust port vented to the atmosphere.
    NOTE 1   The tests related to non-electrically modulated pneumatic continuous
    pressure control valves are specified in ISO 6953-2. NOTE 2   The tests related
    to electro-pneumatic continuous flow control valves are specified in ISO 10041-2.
    NOTE 3   ISO 6953-3 provides an alternate dynamic test method for flow-rate characteristics
    using an isothermal tank instead of a flow meter. However, this method measures
    only the decreasing flow rate part of the hysteresis curve of the forward flow
    and relief flow characteristics.'
