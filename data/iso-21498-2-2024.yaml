abstract:
- language: en
  script: Latn
  content: This document applies to voltage class B electric propulsion systems and
    connected auxiliary electric systems of electrically propelled road vehicles.
    It applies to electric circuits and components in these systems. This document
    focuses on the characteristics at the DC voltage class B terminals of these components
    as specified in ISO 21498-1. It describes testing methods, test conditions and
    test requirements for components exposed to electrical behaviour caused by the
    operation of electric loads and power sources. This document does not cover electrical
    safety (see ISO 6469-3 and the ISO 5474 series).
