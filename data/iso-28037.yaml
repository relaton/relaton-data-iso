abstract:
- language: en
  script: Latn
  content: ISO/TS 28037:2010 is concerned with linear, that is, straight-line, calibration
    functions that describe the relationship between two variables X and Y, namely,
    functions of the form Y = A + BX. Although many of the principles apply to more
    general types of calibration function, the approaches described exploit the simple
    form of the straight-line calibration function wherever possible. Values of the
    parameters A and B are determined on the basis of measured data points (xi, yi),
    i = 1, ... , m. Various cases are considered relating to the nature of the uncertainties
    associated with these data. No assumption is made that the errors relating to
    the yi are homoscedastic (having equal variance), and similarly for the xi when
    the errors are not negligible. Estimates of the parameters A and B are determined
    using least squares methods. The emphasis is on choosing the least squares method
    most appropriate for the type of measurement data, in particular methods that
    reflect the associated uncertainties. The most general type of covariance matrix
    associated with the measurement data is treated, but important special cases that
    lead to simpler calculations are described in detail. For all cases considered,
    methods for validating the use of the straight-line calibration functions and
    for evaluating the uncertainties and covariance associated with the parameter
    estimates are given. ISO/TS 28037:2010 also describes the use of the calibration
    function parameter estimates and their associated uncertainties and covariance
    to predict a value of X and its associated standard uncertainty given a measured
    value of Y and its associated standard uncertainty.
