abstract:
- language: en
  script: Latn
  content: ISO 20495:2018 specifies performance and test methods for skin electrical
    resistance measurement devices. ISO 20495:2018 is applicable to skin electrical
    resistance measurement devices through which an electrical signal is applied on
    acupuncture points of the human body or specific points of the body surface in
    a non-invasive way so as to detect the resistance of the body. ISO 20495:2018
    is not applicable to software or functions for medical analysis of the test results.
    Additional guidance and rationale are given in Annex A.
