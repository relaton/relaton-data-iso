abstract:
- language: en
  script: Latn
  content: This document applies to attachments for hand-operated square drive socket
    wrenches. NOTE 1 The attachments for hand-operated square drive socket wrenches
    covered by this standard are the ones identified in ISO 1703:2018 under reference
    No. 5 1 00 03 0, 5 1 00 04 0, 5 1 00 04 1 and 5 1 00 05 0. It specifies a) the
    overall dimensions; b) the minimum Rockwell hardness value for their driving squares;
    c) the method of torque testing; d) the minimum torsional strength values; e)
    the designation; and f) the marking. NOTE 2 For the specification of square adaptors
    with a hexagon or cylindrical flat drive, for power socket wrenches, see ISO 3317.
