abstract:
- language: en
  script: Latn
  content: ISO 24156-1:2014 gives guidelines for using a subset of UML symbols independent
    of their normal UML meaning, to represent concepts in concept models that result
    from concept analysis. It describes how UML symbols can be used for that. A UML
    profile designed for this purpose is used to represent concepts and concept relations
    in terminology work. ISO 24156-1:2014 does not describe UML and its general use
    in depth. These matters are covered in ISO/IEC 19505‑1 and ISO/IEC 19505‑2. ISO
    24156-1:2014 does not describe the principles and methods of terminology work.
    This is covered in ISO 704. ISO 24156-1:2014 does not define the fundamental concepts
    of terminology work. This is covered in ISO 1087‑1.
