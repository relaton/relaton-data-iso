abstract:
- language: en
  script: Latn
  content: 'This document determines the fuel quality classes and specifications of
    graded firewood. This document covers only firewood produced from the following
    raw materials (see ISO 17725‑1:2021, Table 1): —    1.1.1 Whole trees without
    roots; —    1.1.3 Stem wood; —    1.1.4 Logging residues (thick branches, tops
    etc.); —    1.2.1 Chemically untreated by-products and residues from wood processing
    industry.'
