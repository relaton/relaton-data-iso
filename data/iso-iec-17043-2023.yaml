abstract:
- language: en
  script: Latn
  content: This document specifies general requirements for the competence and impartiality
    of proficiency testing (PT) providers and consistent operation of all proficiency
    testing schemes. This document can be used as a basis for specific technical requirements
    for particular fields of application. Users of proficiency testing schemes, regulatory
    authorities, organizations and schemes using peer-assessment, accreditation bodies
    and others can use these requirements in confirming or recognizing the competence
    of proficiency testing providers.
