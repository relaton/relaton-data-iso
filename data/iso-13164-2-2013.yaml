abstract:
- language: en
  script: Latn
  content: ISO 13164-2:2013 specifies a test method for the determination of radon-222
    activity concentration in a sample of water following the measurement of its short-lived
    decay products by direct gamma-spectrometry of the water sample. The radon-222
    activity concentrations, which can be measured by this test method utilizing currently
    available gamma-ray instruments, range from a few becquerels per litre to several
    hundred thousand becquerels per litre for a 1 l test sample. This test method
    can be used successfully with drinking water samples. The laboratory is responsible
    for ensuring the validity of this test method for water samples of untested matrices.
    An annex gives indications on the necessary counting conditions to meet the required
    sensitivity for drinking water monitoring.
