abstract:
- language: en
  script: Latn
  content: ISO 11206:2011 specifies a method for the determination of dissolved bromate
    in water (e.g. drinking water, mineral water, raw water, surface water, partially
    treated water or swimming pool water). Appropriate pretreatment of the sample
    (e.g. dilution) allows determination of bromate at concentrations ³0,5 µg/l. The
    working range is restricted by the ion‑exchange capacity of the separator column.
    Dilution of the sample to the bromate working range can be necessary.
