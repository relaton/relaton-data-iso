abstract:
- language: en
  script: Latn
  content: 'This document describes a basic role model of smart city mobility monitoring
    and services by data sharing platform as a common platform for smart city instantiation.
    It provides a paradigm describing: a)       a framework architecture for the provision
    of a mobility monitoring service; b)       a description of the concept of operations
    and the role models; c)        a conceptual architecture between actors involved
    in the provision or receipt of mobility monitoring service applications; d)      
    references for the key documents on which the architecture is based; e)      
    a taxonomy of the organization of generic procedures. It defines the basic role
    and functional model of service for the introduction of mobility monitoring services
    including infrastructure facilities to support mobility in urban and rural areas.
    In-vehicle control system is not within the scope of this document. This document
    is limited to the mobility monitoring services using physical and digital infrastructure.'
