abstract:
- language: en
  script: Latn
  content: ISO 294-1:2017 specifies the general principles to be followed when injection
    moulding test specimens of thermoplastic materials and gives details of mould
    designs for preparing two types of specimen for use in acquiring reference data,
    i.e. type A1 and type B1 test specimens as specified in ISO 20753, and provides
    a basis for establishing reproducible moulding conditions. Its purpose is to provide
    consistent descriptions of the main parameters of the moulding process and to
    establish a uniform practice in reporting moulding conditions. The particular
    conditions required for the reproducible preparation of test specimens will vary
    for each material used and are given in the International Standard for the relevant
    material or are to be agreed upon between the interested parties. NOTE Interlaboratory
    tests with acrylonitrile/butadiene/styrene (ABS), styrene/butadiene (SB) and poly(methyl
    methacrylate) (PMMA) have shown that mould design is an important factor in the
    reproducible preparation of test specimens.
