abstract:
- language: en
  script: Latn
  content: This document specifies procedures for quantitative analysis of austenite
    in steel using electron backscatter diffraction (EBSD). This document is mainly
    applied in low and medium carbon steels, low and medium carbon alloy steels. This
    document is used to analyse austenite with grain size larger than 50 nm. This
    method is not used to quantify austenite with grain size smaller than 50 nm, which
    can significantly affect the accuracy of the analysis results. NOTE 1   The size
    limit is strongly dependent both on the instrument and the instrument operating
    parameters. NOTE 2   The size limit is the minimum grain size of the detectable
    austenite.
