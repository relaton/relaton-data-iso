abstract:
- language: en
  script: Latn
  content: 'This document specifies test methods to measure the amount of test liquid
    (simulated urine) which runs down a nonwoven test specimen when a specified mass
    of test liquid is poured on the nonwoven test specimen superimposed on a standard
    absorbent medium and placed on an inclined plane. This document is designed to
    compare run-off of nonwovens. It is not intended to simulate in use conditions
    for finished products. The three methods are: a)       Option A - basic method
    for testing hydrophilic nonwovens, see Annex A. b)       Option B - repeated test,
    with the same test parameters as the basic method with additional information
    in Option A, see Annex B. c)        Option C - modified method for testing hydrophobic
    nonwovens specifying another degree of incline, see Annex C. The test method is
    designed to measure the repellency of hydrophobic nonwovens. At the standard inclination
    angle, Option A isn’t able to distinguish between different levels of hydrophobicity.
    By decreasing the inclination of the table, one can assess the difference in repellence
    of hydrophobic nonwovens. For R&D purposes, other characteristics can be measured
    according to Annex D.'
