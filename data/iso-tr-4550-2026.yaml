abstract:
- language: en
  script: Latn
  content: This document gives an overview of a variety of physical and analytical
    methods by which bacteria, biofilms, and the interaction of those with antimicrobial
    compounds can be analysed. For each technique a general overview is given and
    its current state of the art. The strengths and limitations of each technique
    to measure microbial samples are given alongside suggestions for future developments.
    This document is intended as a guide and a starting point to more specific activities
    of ISO/TC 201, Surface chemical analysis, in the future, which end in standardized
    procedures for measurements.
