abstract:
- language: en
  script: Latn
  content: This document is applicable to small floating working machines used for
    work in, over, or on, inland waters. This document specifies safety-related requirements
    and test methods. This document specifies minimum requirements for small floating
    working machines with a length of < 10 m and a product of length, width and depth
    of less than 30 m3, with temporarily or permanently installed work equipment or
    machines used on inland waters. These small floating working machines can be used
    for activities such as extraction work, lifting work, sampling, mowing and clearing
    work or comparable tasks.
