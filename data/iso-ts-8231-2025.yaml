abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and recommendations regarding performance
    criteria for display systems in vehicles as a guideline for suppliers and manufacturers
    under normal operating conditions. This document applies to in-vehicle display
    systems designed to provide vital information to the driver and passenger. This
    document applies to the system as a whole as well as its relevant components,
    such as cover lenses, coatings, and properties of the device itself. This document
    covers display systems in passenger vehicles (including sport utility vehicles
    and light trucks) and commercial vehicles (including heavy trucks and buses).
    NOTE            Static and dynamic laboratory testing and dynamic field operational
    assessment to measure display and cover glass attributes are also included, where
    available, in the scope of this document. This document is not applicable for:
    —     technology and type of display device (e.g. LED, LCD, OLED); —     manufacturing
    and handling of components in production; —     electrical setup and integration
    into the vehicle; —     EMC requirements for electrical subassemblies; —     head-up
    display (HUD) and e-mirror displays [e.g. camera monitoring system (CMS)]; —    
    behaviour in accidents besides the regulatory head impact test (HIT).'
