abstract:
- language: en
  script: Latn
  content: ISO 11040-8:2016 is applicable to aseptically filled or terminally sterilized
    finished prefilled syringes (intended for single use only) based on ISO 11040‑4
    or ISO 11040‑6, together with ISO 11040‑5, for parenteral injection preparations
    with focus on quality, functional performance and safety requirements, as well
    as relevant test methods. Finished prefilled syringes which have undergone an
    additional preparation step by the user before injection (e.g. diluent syringes
    that have been emptied for reconstitution and in which the reconstituted drug
    solution has been aspirated after reconstitution) are excluded from the scope
    of ISO 11040-8:2016.
