abstract:
- language: en
  script: Latn
  content: ISO 22264:2006 specifies the dimensions and characteristics of the interface,
    requirements, test methods and marking of Telemark ski-boots with flexible sole
    which are used with current systems of telemark ski-bindings with attachment at
    the boot toe and boot heel, the proper function of which depends on the dimensions
    and design of the interfaces. For Telemark ski-binding systems that function irrespective
    of the sole shape or that have different requirements for the sole dimensions,
    it is not always necessary for the Telemark ski-boot soles to comply with this
    International Standard in order to achieve the desired degree of safety. ISO 22264:2006
    applies to Telemark ski-boots of sizes 15,0 and larger in the mondopoint system.
