abstract:
- language: en
  script: Latn
  content: ISO 19097-1:2018 specifies accelerated life test method of mixed metal
    oxide anodes for impressed current cathodic protection used in concrete. The accelerated
    life test results can be used to compare the durability of the anodes and to evaluate
    whether the anodes can comply with required specifications of design life expectancy
    at rated current output. ISO 19097-1:2018 is also applicable to other anode systems
    that are used as impressed current anodes embedded in concrete with suitably modified
    apparatus to hold anodes of different geometry.
