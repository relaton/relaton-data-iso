abstract:
- language: en
  script: Latn
  content: This document gives guidance regarding how organizations can establish
    monitoring, measurement, analysis and evaluation processes, including the development
    of relevant indicators for the assessment of occupational health and safety (OH&S)
    performance. It enables organizations to determine if intended results are being
    achieved, including continual improvement of OH&S performance. This document is
    applicable to all organizations regardless of type, industry sector, level of
    risk, size or location. It can be used independently or as part of OH&S management
    systems, including those based on ISO 45001:2018, or other standards or guidelines.
