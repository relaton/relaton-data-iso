abstract:
- language: en
  script: Latn
  content: 'This document provides the general guidelines for processing of multiple
    - use (reusable) healthcare textiles being processed under hospital laundry whether
    in-house or outsourced laundry services. The processing guidelines are applicable
    to hospital laundry in the following areas: i) Hospitals – private, public and
    any extended healthcare facilities ii) Clinics iii) Dental Services iv) Nursing
    homes v) Mental health institutions vi) Diagnostics sector vii) General healthcare
    centres etc. 1.2 This document generally covers reusable healthcare textiles for
    general ward linens and operating theatre textiles such as i) General purpose
    linen — Patient care like curtains, drapes, table clothes and similar items commonly
    used in all parts of the hospital. ii) Patient linen — Patient clothing such as
    pajamas, shirts, gowns, coats etc. worn by patients. iii) Bed linen — Bed clothing
    such as bed sheets, pillow covers, blankets used by the patient. iv) Operation
    theatre (OT), labour room, procedure room linen —Items such as pajamas, kurtas,
    gowns, coats, shirts, surgical gowns, caps, masks etc. worn by healthcare personnel
    and also trolley covers, towels required in operation theatre, labour room and
    procedure room. 1.3 This document does not cover the following: - i) Design, specification
    or construction criteria for machine and equipment used to process reusable healthcare
    textiles; ii) Criteria for staff qualification who handles the processing of healthcare
    textiles. iii) Role of infection control committee in healthcare facility and
    the application of any sterilization technology or sterility assurance practices;
    iv) Selection of reusable healthcare textiles; v) Special laundry situations such
    as neonatal intensive, burn care, Hepatitis, HIV. vi) Performance standards for
    reusable healthcare textiles vii)Other laundry service purpose like commercial,
    hotel, industrial and institutional laundry, etc.'
