abstract:
- language: en
  script: Latn
  content: This document, when used together with ISO 4254-1:2013 and ISO 4254-1:2013/AMD1:2021,
    specifies the safety requirements and their verification for the design and construction
    of trailed and self-propelled harvesters for grapes, olives and coffee. It describes
    methods for the elimination or reduction of hazards arising from the intended
    use of these machines by one person (the operator) in the course of normal operation
    and service. In addition, it specifies the type of information on safe working
    practices to be provided by the manufacturer. When provisions of this document
    are different from those which are stated in ISO 4254-1:2013 and ISO 4254-1:2013/AMD1:2021,
    the provisions of this document take precedence over the provisions of ISO 4254-1:2013
    and ISO 4254-1:2013/AMD1:2021 for machines that have been designed and built according
    to the provisions of this document. This document, taken together with ISO 4254-1:2013
    and ISO 4254-1:2013/AMD1:2021, deals with all the significant hazards, hazardous
    situations and events relevant to trailed and self-propelled harvesters for grapes,
    olives and coffee, when they are used as intended and under the conditions of
    misuse that are reasonably foreseeable by the manufacturer. It is not applicable
    to hazards arising from the presence of persons other than the operator, hazards
    related to lack of visibility, except lighting, hazards related to vibrations
    and moving parts for power transmission, except for strength requirements for
    guards and barriers. This document does not deal with environmental hazards, except
    noise. In respect of steering of self-propelled machines, it is applicable only
    to the ergonomic aspects (for example, location of the steering wheel); no other
    aspects related to steering are covered. NOTE            Specific requirements
    related to road traffic regulations are not taken into account in this document.
    This document is not applicable to machines manufactured before the date of its
    publication.
