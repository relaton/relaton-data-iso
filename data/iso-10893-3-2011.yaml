abstract:
- language: en
  script: Latn
  content: ISO 10893-3:2011 specifies requirements for automated full peripheral magnetic
    flux leakage testing of seamless and welded ferromagnetic steel tubes, with the
    exception of submerged arc-welded (SAW) tubes, for the detection of imperfections.
    Unless otherwise specified in the purchase order, ISO 10893-3:2010 is applicable
    to the detection of predominantly longitudinal imperfections. ISO 10893-3:2010
    is applicable to the inspection of tubes with an outside diameter equal to or
    greater than 10 mm. It can also be applicable to the testing of hollow sections.
