abstract:
- language: en
  script: Latn
  content: 'This standard provides requirements and guidelines on applying model-based
    testing (MBT) in accordance with the test processes defined in ISO/IEC/IEEE 29119-2.
    This document covers the following areas: a) Definitions for MBT b) Implementing
    ISO/IEC/IEEE 29119-2 for MBT c) Implementing ISO/IEC/IEEE 29119-3 for MBT Using
    MBT, the generation of testware is automated. This standard assumes that test
    execution is also automated. The implementation of the generation algorithm is
    tool dependent and therefore is out of the scope for this document. MBT tool selection
    is also out of the scope for this document. The MBT models and the information
    generated by the supporting MBT tools can be used, in part or whole, to satisfy
    the documentation requirements of ISO/IEC/IEEE 29119-3. Many MBT tools implement
    one or more of the test techniques and associated measures defined in ISO/IEC/IEEE
    29119-4. These techniques are associated with individual tool implementation and
    are outside the scope of this document. This standard is applicable to model-based
    testing in all development lifecycle models.'
