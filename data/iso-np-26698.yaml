abstract:
- language: en
  script: Latn
  content: This document specifies the main requirements concerning the need to secure
    cargo of all forms to prevent the cargo from moving under the dynamic conditions
    of ship motion. This standard will lay the framework and specify the minimum requirements
    for Securing Cargo. There will be multiple sections required to ensure proper
    coverage of liquid, bulk, containerized and other types of cargo needing securing
    aboard ship, including calculations of accelerations and loads.
