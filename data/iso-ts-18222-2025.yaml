abstract:
- language: en
  script: Latn
  content: 'This document describes how to establish the correlation between odorant
    concentration in air and odour intensity, usually presented in the form of odour
    intensity curves, following the odour intensity scale presented in Clause 5. This
    document does not fix a required level of odour intensity in the natural gas:
    this prescription is specified by local/national regulation.'
