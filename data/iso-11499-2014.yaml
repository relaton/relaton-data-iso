abstract:
- language: en
  script: Latn
  content: ISO 11499:2014 gives specific performance requirements for single-use dental
    cartridges of 1,0 ml, 1,7 ml, 1,8 ml and 2,2 ml nominal capacity for use with
    local anaesthetics. ISO 11499:2014 specifies tests for leakage, plunger movement,
    extractable volume and underfilling, and lists general overall dimensions to ensure
    that the cartridge will fit dental cartridge syringes. Labelling requirements
    are also specified.
