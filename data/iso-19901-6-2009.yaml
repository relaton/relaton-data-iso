abstract:
- language: en
  script: Latn
  content: 'ISO 19901-6:2009 provides requirements and guidance for the planning and
    engineering of marine operations, encompassing the design and analysis of the
    components, systems, equipment and procedures required to perform marine operations,
    as well as the methods or procedures developed to carry them out safely. This
    part of ISO 19901 is applicable to marine operations for offshore structures,
    including steel and concrete gravity-base structures (GBS); piled steel structures
    and compliant towers; tension leg platforms (TLP); deep-draught floaters (DDF),
    including spars or deep-draught caisson vessels (DDCV); floating production semi-submersibles
    (FPSS); floating production, storage and offloading vessels (FPSO); other types
    of floating production systems (FPS); mobile offshore units (MOU); topsides and
    components of any of the above; subsea templates and similar structures; gravity,
    piled, drag-embedded and suction or other anchors; tendon foundations; and associated
    mooring systems. This document is also applicable to modifications of existing
    structures, e.g. installation of additional topsides modules. This part of ISO
    19901 is not applicable to the following marine operations: — construction activities,
    e.g. in a fabrication yard onshore, where there is no exposure to the marine —
    environment; — drilling, processing and petrochemical activities; — routine marine
    activities during the service life of the structure; — drilling from mobile offshore
    drilling units (MODU); — installation of pipelines, flowlines, risers and umbilicals;
    — diving.'
