abstract:
- language: en
  script: Latn
  content: ISO 15706-2:2007 establishes a voluntary system for the identification
    of versions of audiovisual works and other content derived from or closely related
    to an audiovisual work. It is based on the International Standard Audiovisual
    Number (ISAN) system defined in ISO 15706:2002. An ISAN combined with the version
    segment, as specified in ISO 15706-2:2007 constitutes an ISAN version identifier,
    is referred to as a V-ISAN. A V-ISAN is a registered, globally unique identifier
    for versions of an audiovisual work and related content. A V-ISAN identifies a
    specific version or other content related to an audiovisual work throughout its
    life. It is intended for use wherever precise and unique identification of a specific
    version or other content related to an audiovisual work would be desirable, such
    as in audiovisual production and distribution systems, broadcasting applications
    and electronic program guides. A V-ISAN identifies a specific version or other
    content related to an audiovisual work as the unique compound of its component
    elements (e.g. its artistic content, languages, editing and technical format)
    throughout its life and independent of any physical form in which that version
    or related content is distributed. The assignment of a V-ISAN to a version or
    other content related to an audiovisual work does not constitute evidence of the
    ownership of rights to either that version or related content or to the audiovisual
    work itself. ISO 15706-2:2007 specifies the basic systems and procedures to support
    the issuance and administration of V-ISANs.
