abstract:
- language: en
  script: Latn
  content: This document specifies the quality assessment criteria and methods for
    human intestinal organoids (hIOs), derived from pluripotent stem cells (PSCs)
    and tissue-derived stem cells (TSCs). It addresses quality attributes relevant
    to intestinal organoid performance in endpoint assays. These include structural
    fidelity, functional relevance, basic genetic stability and reproducibility. This
    document is applicable to hIOs used in drug screening, safety assessment, disease
    modelling and other non-clinical research applications.  This document aims to
    support the use of hIOs in drug screening, disease modeling, and non-clinical
    research applications by providing a comprehensive framework for assessing their
    quality and suitability for various life science purposes. This document does
    not include tumour-derived organoids or organoids directly derived from pathological
    tissues.  This document does not apply to hIOs intended for in vivo human application,
    clinical use, diagnostic use, or therapeutic purposes.
