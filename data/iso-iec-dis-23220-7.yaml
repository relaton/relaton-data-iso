abstract:
- language: en
  script: Latn
  content: The proposed standard establishes an ISO/IEC Registration Authority (RA)
    that hosts a list of registered mdoc types and namespaces in a machine- and human-readable
    format. It establishes a Registration Management Group (RMG) of experts with agreed
    on review functions for mdoc types and namespaces registrations. The Registration
    authority maintains a repository of mdoc profiles and mdoc namespaces. and provides
    an opportunity for the Registration Management Group of experts to provide feedback
    to the mDoc type and mDoc namespaces creators.
