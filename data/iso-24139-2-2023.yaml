abstract:
- language: en
  script: Latn
  content: This document specifies the technical delivery conditions regarding design,
    geometric dimensions, materials, manufacturing procedures, inspection methods,
    non-destructive testing, marking, package and storage for factory-made, seamless
    and welded, corrosion resistant alloy (CRA) clad fittings for use in pipeline
    transportation systems for the petroleum and natural gas industries as defined
    in ISO 13623. This document is applicable to CRA clad fittings for use in transportation
    or process pipelines transporting corrosive media-containing single-phase or multi-phase
    fluid such as oil, gas and water for the petroleum and natural gas industries.
    It can also be used as reference in other fields. The clad fittings specified
    in this document include clad elbows, clad reducers, clad tees and clad caps.
    Two technical delivery conditions classes for clad fittings are designated. Class
    B provides a standard quality level for clad fittings and Class S provides technical
    requirements for sour-service conditions. Fabricated laterals, fabricated lap
    joint stub ends and other fittings employing circumferential or intersection welds
    are considered as pipe fabrication and are outside the scope of this document.
