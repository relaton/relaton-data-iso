abstract:
- language: en
  script: Latn
  content: This part of International Standard 82045 specifies principles and methods
    to define metadata for the management of documents associated with objects throughout
    their life cycle; This cycle generally covers a range from the conceptual idea
    of a document to its deletion. The established principles and methods are basic
    for all document management systems.This part is intended as a general basic standard
    in all application fields and provides the framework applicable for part 2.International
    Standard 82045 is primarily intended as a resource for the use in computerised
    systems such as Electronic Document Management Systems (EDMS) or Product Data
    Management Systems (PDMS) for the management, retrieval, storage and selection
    and archiving of documents, and as a basis for the exchange of documents. NOTE
    – Part 2 of International Standard 82045 provides the collection of data element
    types associated with aninformation reference model, which may be used in conjunction
    with the presentation of metadata on documents.
