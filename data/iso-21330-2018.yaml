abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the quantification of selected volatile
    organic compounds (VOCs: 1,3-butadiene, isoprene, acrylonitrile, benzene and toluene)
    by GC-MS in mainstream cigarette smoke using ISO 3308 smoking parameters. This
    method is applicable to cigarettes with nicotine-free dry particulate matter (NFDPM)
    yields between 1 mg/cigarette and 15 mg/cigarette.'
