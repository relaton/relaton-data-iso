abstract:
- language: en
  script: Latn
  content: Provides a system for general application for the identification and presentation
    of information about freight containers. Specifies a identification system with
    mandatory marks for visual interpretation and optional features for automatic
    identification and electronic data interchange and a coding system for data on
    container size and type. Replaces the second edition, which has been technically
    revised.
