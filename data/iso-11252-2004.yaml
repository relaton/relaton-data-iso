abstract:
- language: en
  script: Latn
  content: 'ISO 11252:2004 specifies the minimum documentation and information for
    marking and labelling, to be provided with laser devices (including laser diodes).
    The documentation is presented on two levels: as a technical data sheet and as
    an instruction manual. The standard does not apply to laser products which incorporate
    laser devices. It also does not apply to laser devices manufactured before the
    date of publication of the standard. Requirements on noise are not included in
    the standard. These requirements will be included in a subsequent amendment.'
