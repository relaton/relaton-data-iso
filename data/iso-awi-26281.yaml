abstract:
- language: en
  script: Latn
  content: This International Standard provides a guide on the methods of radiation
    shielding design analysis of pressurized water reactor (PWR) nuclear power station
    cavity radiation streaming. This standard specifies the general design requirements,
    cross-section, calculation scope, design input data parameters and results uncertainty
    analysis, etc. Guidance and recommendations are given on the methods proposed
    in standard for different shielding design applications. The several variance
    reduction methods for Monte Carlo transport calculation, advanced particle transport
    methods and cavity radiation streaming design methods can also be applied in the
    design of Boiling Water Reactor, CANDU, ITER, Research Reactor, Particle Accelerators,
    etc which may also face the deep-penetration shielding problem and long-distance
    guide particle transport problem.
