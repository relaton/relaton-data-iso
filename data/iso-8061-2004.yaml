abstract:
- language: en
  script: Latn
  content: ISO 8061:2004 specifies methods for the selection of the release torques
    for alpine ski-bindings in current use, and gives information necessary to determine
    the release torques. It applies to torque-measuring binding-test machines. It
    may be inappropriate for non-mechanical bindings or bindings used with boots which
    reach more than half-way up the lower leg.
