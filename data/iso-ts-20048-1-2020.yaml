abstract:
- language: en
  script: Latn
  content: This document defines a method for determination of off-gassing (permanent
    gases) and oxygen depletion from woody as well as non-woody biomass, including
    densified materials such as pellets and briquettes, as well as non-densified materials
    such as chips. The method is also applicable for thermally treated materials,
    including torrefied and carbonized materials. The emission and depletion factor
    and emission and depletion rate for various gas species emitted from sample within
    a closed test container is determined by means of gas chromatography. The emission
    and depletion factor and emission and depletion rate provide guidance for ventilation
    requirements to keep gas concentrations below Permissible Exposure Levels (PEL)
    in spaces where workers can be exposed to the enclosed atmosphere.
