abstract:
- language: en
  script: Latn
  content: The purpose of the document is to describe the definitions applicable to
    all standards developed by ISO/TC 330 committee and to provide requirements, recommendations
    and guidance for demonstrating antimicrobial surfaces efficacy claims in use condition.
    This document details the risk assessment to be performed by the antimicrobial/active
    surface manufacturer and the risk analysis and evaluation to be performed by the
    users in order to successfully implemented antimicrobial surface in a defined
    environment. It does not provide the efficacy, toxicological or ecotoxicological
    test methods, who are detailed in the corresponding standards mentioned in this
    document. This document relies on several standards and existing test methods
    but do not supersede them
