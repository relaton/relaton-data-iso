abstract:
- language: en
  script: Latn
  content: Basic terms and parameters related to macro- and megatexture measurement
    will be described in the document, as well as a classification of profilometers
    with respect to their precision, bandwidth and measurement speed. Further the
    new standard will describe a series of performance requirements which should be
    met and a number of tests which should be carried out by the users of laser profilometers
    on a regular basis in order to verify the proper function of their apparatus.
    The new standard will also include an informative annex describing how an enveloped
    profile can be calculated, as well as annexes describing how to deal with invalid
    readings and how to detect and eliminate erroneous spikes in the profile. Part
    6 is a PAS and must be converted to at least a TS 2028. The merging of Part 2,
    3 and 6 will therefore also handle the necessary changes required to make former
    Part 6 more usable with limits and requirements.
