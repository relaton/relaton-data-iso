abstract:
- language: en
  script: Latn
  content: ISO 16784-2:2006 applies to corrosion and fouling in industrial cooling
    water systems ISO 16784-2:2006 describes a method for preliminary evaluation of
    the performance of treatment programmes for open recirculating cooling water systems.
    It is based primarily on laboratory testing but the heat exchanger testing facility
    can also be used for on-site evaluation. ISO 16784-2:2006 does not include heat
    exchangers with cooling water on the shell-side (i.e. external to the tubes).
