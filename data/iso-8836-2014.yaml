abstract:
- language: en
  script: Latn
  content: ISO 8836:2014 specifies requirements for suction catheters, including closed
    suction catheters, made of flexible materials and intended for use in suctioning
    of the respiratory tract. Angled-tip suction catheters (e.g. Coudé catheters)
    and suction catheters with aspirator collectors are not considered to be specialized
    and are therefore included in the scope of ISO 8836:2014.
