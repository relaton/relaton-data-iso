abstract:
- language: en
  script: Latn
  content: This document specifies the instrumentation and procedure to be used for
    primary vibration calibration of rectilinear accelerometers (with or without amplifier)
    to obtain the low-frequency complex sensitivity by rotation in earth’s gravitational
    field. It is applicable to a frequency range from DC (0 Hz) to 10 Hz and a dynamic
    range (amplitude) from 0,001 of local Earth's gravitation to the local Earth's
    gravitation (gl).
