abstract:
- language: en
  script: Latn
  content: This document specifies the quality and safety requirements and test methods
    of Prunella vulgaris fruit-spike, which is derived from the fruit-spike of Prunella
    vulgaris L. (Fam. Labiatae). This document is applicable to Prunella vulgaris
