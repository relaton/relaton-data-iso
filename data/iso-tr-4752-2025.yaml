abstract:
- language: en
  script: Latn
  content: This document provides an inventory of methods for the detection of microbiological
    contamination in mammalian cell culture. This document includes considerations
    for the selection of methods to test the presence of common contaminants such
    as bacteria, fungi, viruses and mycoplasma. This document is not applicable to
    prions and protists. This document is intended for use by biomedical researchers,
    biobank operators and others performing mammalian cell culture.
