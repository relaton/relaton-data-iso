abstract:
- language: en
  script: Latn
  content: ISO 14273:2016 specifies specimen dimensions and a testing procedure for
    tensile shear testing of spot and embossed projection welds, in overlapping sheets,
    in any metallic material of thickness 0,5 mm to 10 mm, where the welds have a
    maximum diameter of 7√t (where t is the sheet thickness in mm). The object of
    tensile shear testing is to determine the tensile shear force that the test specimen
    can sustain.
