abstract:
- language: en
  script: Latn
  content: This document specifies the test suite structure (TSS) and test purposes
    (TP) to evaluate the conformity of on-board equipment (OBE) and roadside equipment
    (RSE) to ISO 13141. It provides a basis for conformance tests for dedicated short-range
    communication (DSRC) equipment to support interoperability between different equipment
    supplied by different manufacturers. ISO 13141 specifies requirements for the
    localization augmentation communication (LAC) interface level, but not for the
    OBE or RSE internal functional behaviour. Consequently, tests regarding OBE and
    RSE functional behaviour remain outside the scope of this document.
