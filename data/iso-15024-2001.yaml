abstract:
- language: en
  script: Latn
  content: 1.1 This International Standard specifies a method for the determination
    of mode I interlaminar fracture toughness (critical energy release rate), GIC,
    of unidirectional fibre-reinforced plastic composites using a double cantilever
    beam (DCB) specimen. 1.2 It is applicable to carbon-fibre-reinforced and glass-fibre-reinforced
    thermosets and thermoplastics.
