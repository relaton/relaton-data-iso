abstract:
- language: en
  script: Latn
  content: 'ISO 14362-1:2017 describes a method to detect the use of certain azo colorants
    that may not be used in the manufacture or treatment of certain commodities made
    of textile fibres and that are accessible to reducing agent with and without extraction.
    Azo colorants accessible to reducing agent without extraction are those used to
    colour with pigments or to dye - cellulosic fibres (e.g. cotton, viscose), - protein
    fibres (e.g. wool, silk), and - synthetic fibres (e.g. polyamide, acrylic). Azo
    colorants accessible with extraction are those used to dye man-made fibres with
    disperse dyes. The following man-made fibres can be dyed with disperse dyes: polyester,
    polyamide, acetate, triacetate, acrylic and chlorofibre. The method is relevant
    for all coloured textiles, e.g. dyed, printed and coated textiles.'
