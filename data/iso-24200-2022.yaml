abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for design including shape and
    dimensions, material as well as strength for pipe support. Applicable pipe size
    range varies depending on support types. This document covers topside systems
    for fixed or floating offshore oil and gas projects. This document is applicable
    to design temperature of support within the range between –46 °C up to 200 °C.
    This document is limited to metallic pipes, covering the following pipe supports:
    —    clamped shoe; —    welded shoe; —    U-bolt; —    U-strap; —    bracing for
    branch connection; —    trunnion and stanchion; —    guide support (guide, hold-down,
    guide and hold-down, line stop).'
