abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the width of
    strands of cut tobacco. This method is only applicable on samples of strands of
    cut tobacco with a uniform cut width. NOTE There are other ways of measuring the
    width of the strands of cut tobacco. A system with the same accuracy can be used,
    for example a microscope with an internal fitted ruler or a camera with image
    processing system.
