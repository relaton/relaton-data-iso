abstract:
- language: en
  script: Latn
  content: 'This document/standard will specify a method for determining the water
    resistance performance of sunscreen products by using Hybrid Diffuse Reflectance
    Spectroscopy (HDRS) ISO 23698 monochromatic and polychromatic systems following
    controlled water immersion cycles. The method: • Extends ISO 23698 static SPF/UVA-PF
    determination, • Incorporates immersion procedures consistent with ISO 16217 and/or
    ISO 18861 • Utilizes HDRS instrumentation compliant with ISO 23698: Monochromatic
    and Polychromatic • Determines post-immersion SPF values • Expresses water resistance
    performance as absolute post-immersion SPF and/or percentage SPF retention relative
    to initial static SPF. This document will specify measurement principles and calculation
    procedures for assessing post-immersion UV attenuation performance. It does not
    define regional regulatory labelling requirements.'
