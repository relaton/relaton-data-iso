abstract:
- language: en
  script: Latn
  content: ISO 18854:2015 specifies the measurement and evaluation methods for gaseous
    and particulate exhaust emissions from reciprocating internal combustion (RIC)
    engines under steady-state conditions on a test bed, necessary for determining
    one weighted value for each exhaust gas pollutant. Various combinations of engine
    load and speed reflect different engine applications. It is applicable to RIC
    marine engines intended to be installed in small craft up to 24 m length of hull.
