abstract:
- language: en
  script: Latn
  content: ISO 3107:2011 specifies requirements for non-water-based zinc oxide/eugenol
    cements suitable for use in restorative dentistry for temporary cementation, for
    bases and as temporary restorations. ISO 3107:2011 also specifies requirements
    for non-eugenol cements containing zinc oxide and aromatic oils suitable for temporary
    cementation.
