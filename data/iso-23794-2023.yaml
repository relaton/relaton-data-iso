abstract:
- language: en
  script: Latn
  content: This document provides guidance on the determination of the abrasion resistance
    of vulcanized and thermoplastic rubbers. It covers both solid and loose abrasives.
    The guidelines given are intended to assist in the selection of an appropriate
    test method and appropriate test conditions for evaluating a material and assessing
    its suitability for a product subject to abrasion. Factors influencing the correlation
    between laboratory abrasion testing and product performance are considered, but,
    for example this document is not concerned with wear tests developed for specific
    finished rubber products, for example, trailer tests for tyres.
