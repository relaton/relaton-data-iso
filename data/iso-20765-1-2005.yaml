abstract:
- language: en
  script: Latn
  content: This part of ISO 20765 specifies a method of calculation for the volumetric
    and caloric properties of natural gases, natural gases containing synthetic admixture
    and similar mixtures, at conditions where the mixture can exist only as a gas.
    The method is applicable to pipeline-quality gases within the ranges of pressure
    and temperature at which transmission and distribution operations normally take
    place. For volumetric properties (compression factor and density), the uncertainty
    of calculation is about ± 0,1 % (95 % confidence interval). For caloric properties
    (for example enthalpy, heat capacity, Joule-Thomson coefficient, speed of sound),
    the uncertainty of calculation is usually greater.
