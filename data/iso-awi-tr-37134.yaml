abstract:
- language: en
  script: Latn
  content: This document provides an inventory of existing guidelines, toolkits, reports, policies, and planning approaches that support the integration of climate-resilient elements into urban planning. The document compiles and classifies existing international, regional, national, and local approaches related to climate-resilient cities and communities, including planning guidance, governance approaches, implementation frameworks, and supporting resources. The inventory is intended to support municipalities, urban planners, policy makers, researchers, and related stakeholders in identifying and applying relevant approaches for integrating climate resilience into urban and spatial planning processes. This document does not specify technical requirements, performance criteria, or certification systems for climate resilience.
