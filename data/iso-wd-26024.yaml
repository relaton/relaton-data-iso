abstract:
- language: en
  script: Latn
  content: This document specifies a method for the rapid detection of mycotoxins
    content such as aflatoxin B1, total aflatoxin, deoxynivalenol, zearalenone, and
    ochratoxin A in cereals by lateral flow immunoassay. The limits of detection of
    the method are (1,0 -100,0) μg/kg, and the limits of quantification of the method
    are (3,0 - 300,0) μg/kg.
