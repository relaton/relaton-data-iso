abstract:
- language: en
  script: Latn
  content: This document specifies a general information model for provenance of data
    generation. This document covers all types of data generation. The requirements
    defined here are applicable to organizations, authorities and industries conducting
    or being involved in activities related to data generation (e.g., sequencing,
    imaging, measuring, recording), manufacturing devices or software for the data
    generation, or providing related services. This document defines a provenance
    information model suitable for describing sources of the data generation (e.g.,
    originating sample or data generation device), the data generation process itself,
    and the generated data. NOTE International, national or regional regulations or
    requirements can also apply to specific topics covered in this document.
