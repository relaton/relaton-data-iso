abstract:
- language: en
  script: Latn
  content: This document specifies the terms and definitions for switches and crossings.
    With the assistance of diagrams, the various components are given definitions,
    and these specific names are regarded as obligatory. The terms and definitions
    cover the constituent parts, design geometry and kinematics of switches and crossings,
    as well as the movement of switches. This standard is applicable to the design,
    manufacturing, laying, and maintenance of railway switches and crossings.
