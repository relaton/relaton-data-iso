abstract:
- language: en
  script: Latn
  content: 'This document specifies technical procedures and work items for space
    science payloads that support the unknown and uncertain space scientific exploration
    to perform a re-flight mission, designed to stimulate the output of space scientific
    research, reduce potential risks, and ensure safety and reliability. This document
    establishes a set of requirements for re-flight space science payloads in three
    phases: (1) re-flight design and validation phase (Phase A), (2) engineering implementation
    and verification phase (Phase B), and (3) re-flight evaluation and release phase
    (Phase C). Oriented by the philosophy of inherently unknown and uncertainty in
    space scientific research, the procedures and items defined in this document will
    be performed through a three-phase iterative strategy of “Phases A/B/C” to balance
    scientific goals, configuration status, environmental profile, and the re-flight
    mission. This document is applicable to the re-flight space science payload’s
    ground segment. Spacecraft that integrate re-flight space science payloads could
    be a retrievable satellite, space lab, space station, or space probe.'
