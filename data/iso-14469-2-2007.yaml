abstract:
- language: en
  script: Latn
  content: 'ISO 14469-2:2007 applies to compressed natural gas (CNG) vehicle nozzles
    and receptacles, constructed entirely of new, unused parts and materials for which
    there is a demand, in particular for large CNG urban buses of refuelling times
    equivalent to those of urban buses driven by conventional diesel engines. The
    proposed connector, size 2, offers a larger cross section than the connector in
    accordance with ISO 14469-1 and, therefore, permits refuelling of the vehicles
    within significantly shorter time periods. Studies have shown that the proposed
    connector, size 2, offers more than twice the mass flow of the connectors specified
    in ISO 14469-1. CNG fuelling connection nozzles consist of the following components,
    as applicable: receptacle and protective cap (mounted on vehicle); nozzle. ISO
    14469-2:2007 applies only to devices which have a service pressure of 20 MPa.
    ISO 14469-2:2007 applies to devices with standardized mating components. ISO 14469-2:2007
    applies to connectors which prevent natural gas vehicles from being fuelled by
    dispenser stations with service pressures higher than the vehicle, and allow natural
    gas vehicles to be fuelled by dispenser stations with service pressures equal
    to or lower than the vehicle fuel system service pressure. ISO 14469-2:2007 is
    applicable to compressed natural gas in accordance with ISO 15403.'
