abstract:
- language: en
  script: Latn
  content: 'This document: —     defines the parameters and specifies the standard
    conditions for the routine analytical generation and collection of aerosol from
    electrically heated tobacco products (eHTPs); —     specifies technical requirements
    for the routine analytical puffing machine for eHTP generation and collection
    of aerosol, termed as “machine” in this document, conforming with the standard
    conditions stated within Clause 4. This document does not specify aerosol trapping
    nor subsequent sample preparation and analytical method of components in the trapped
    aerosol or the gas phase. This document is also applicable to products other than
    those defined in 3.15 if a specific method references this document.'
