abstract:
- language: en
  script: Latn
  content: This document establishes a system of designation for polyolefin elastomers
    thermoplastic material, which may be used as the basis for specifications. The
    types of polyolefin elastomers plastics are differentiated from each other by
    a classification system based on appropriate levels of the designatory properties
    a) density b) melt mass-flow rate and on information about the intended application
    and/or method of processing, important properties, additives, colorants, fillers
    and reinforcing materials. This designation system is applicable to polyolefin
    elastomers having a density from 850 kg/m3 to 910 kg/m3, vinyl thermoplastics
    elastomers having a content of butene , octene or hexene monomers from 20% to
    50% by mass and propylene thermoplastics elastomers having a content of ethylene
    monomer of from 4% to 16 % by mass. It applies to materials ready for normal use
    in the form of powder, granules or pellets, unmodified or modified by colorants,
    additives, fillers, etc. This document does not apply to PE-VLD(reference to ISO
    17855-1 for PE-VLD).
