abstract:
- language: en
  script: Latn
  content: ISO 10303-107:2019 specifies the integrated resource constructs for Finite
    element analysis definition relationships. ISO 10303-107:2019 specifies the association
    between idealised concepts within a finite element analysis and the design definitions
    of those concepts. The concepts that are idealised within a finite element analysis
    include the action that is simulated, the states of the product, and the section
    properties. ISO 10303-107:2019 also specifies the association between a representation
    of a field that is calculated by a finite element analysis and a property of a
    defined state of a product.
