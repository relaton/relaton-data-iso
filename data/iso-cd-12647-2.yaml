abstract:
- language: en
  script: Latn
  content: 'ISO 12647-2:2013 specifies a number of process parameters and their values
    to be applied when producing colour separations, printing formes and print production
    for four-colour sheet-fed and web-fed offset printing presses excluding coldset
    offset lithography on newsprint. The parameters and values are chosen in view
    of the typical process covering the process stages "colour separation", "proof
    production", "making of the printing forme", "OK print" and "production printing"
    on all kinds of commercially available production substrates. ISO 12647-2:2013:
    is directly applicable to press proof prints and printing processes that use colour
    separation printing formes as input; is applicable to press proof prints and printing
    processes with more than four process colours as long as direct analogies to four-colour
    printing are maintained, such as for data and screening, for print substrates
    and printing parameters; is applicable to printing on cardboard material for packaging;
    is applicable for all kinds of drying methods such as heat-set, infrared, and
    ultraviolet; provides references for quality assurance and quality management.'
