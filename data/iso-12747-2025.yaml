abstract:
- language: en
  script: Latn
  content: 'This document presents assessment requirements and associated guidance
    for extending the service life of a pipeline system, as defined in ISO 13623,
    beyond its specified design life. It applies to both onshore and offshore rigid
    metallic pipelines and risers [including steel catenary risers (SCRs)]. This document
    is not directly applicable to the following: —     flexible pipelines; —     pipelines
    constructed from other materials, such as glass reinforced plastics or polymers;
    —     umbilicals (control or chemical conveyance service, or both); —     topsides
    equipment and piping (outside of pipeline system limits defined in accordance
    with local regulatory requirements); —     pipeline protection and support structures
    and components. However, the assessment process defined herein can be applied
    in the lifetime extension assessment of the above at the discretion of the user.
    This document addresses life extension, which is a change to the original design
    premise. It is also applicable to other changes to the design premise, such as
    maximum allowable operating pressure (MAOP) re-ratings or a change to the conveyed
    fluids, at the discretion of the user.'
