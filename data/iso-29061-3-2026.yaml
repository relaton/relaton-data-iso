abstract:
- language: en
  script: Latn
  content: 'This document specifies the criteria for judgement of usability of child
    restraint systems (CRSs) when installing them with vehicle seat belts. This document
    provides criteria for judgement of: ease of availability of instructions; clarity
    of instruction manual and labelling; and ease of use of design related features
    of the CRS related to the installation in a vehicle. NOTE 1        CRS includes
    enhanced child restraint systems (ECRS) according to UN Regulation No. 129. NOTE
    2        This procedure can also be used for evaluation of vehicle integrated
    CRS. NOTE 3        Booster system usability evaluation is covered by ISO 29061-5.'
