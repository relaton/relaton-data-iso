abstract:
- language: en
  script: Latn
  content: This document specifies a software framework to ensure the safe operation
    of software used in safety-related shipboard systems. It applies to both traditional
    rule-based software and AI-enabled functionalities. The model covers the entire
    software lifecycle, including concept, design, implementation, verification, validation,
    deployment, operation, and disposal. It also provides guidance on key software
    safety management activities such as risk analysis, safety planning, data quality
    assurance, interactions with external environments, and the assignment of shipboard
    safety integrity levels. The standard is intended for use by software developers,
    system integrators, shipbuilders, equipment manufacturers, and regulatory bodies.
