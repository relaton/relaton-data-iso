abstract:
- language: en
  script: Latn
  content: ISO 15690:2013 provides recommendations for dealing with discrepancies
    between dosimeter systems used in parallel, in order to comply with established
    criteria and national regulations. ISO 15690:2013 gives guidelines for investigating
    and analysing the discrepancies between the results of personal dosimetry systems,
    using two or more dosimeters (often one passive dosimeter and one active dosimeter),
    worn in parallel by the same worker. ISO 15690:2013 identifies when the difference
    between measurements made by personal dosimetry systems used in parallel is considered
    significant and, hence, needs to be investigated. It specifies the treatment of
    this difference. In ISO 15690:2013, only the personal dose equivalent, Hp(10),
    from photon radiation is considered. Exposure to beta particles and neutrons might
    need to be taken into account when identified discrepancies are investigated.
    ISO 15690:2013 applies to situations where the period of wearing can be integrated
    to the same period of time for both systems.
