abstract:
- language: en
  script: Latn
  content: This part of ISO 15170 specifies those items, principally dimensions and
    classes of application of electrical connectors with up to four pins and twist
    lock coupling, necessary for assuring the interchangeability of both parts of
    electrical connections according to ISO 15170. This type of connection is intended
    for electrical connections in truck, bus and trailer applications (e.g. for components
    directly mounted on the engine).
