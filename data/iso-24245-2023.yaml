abstract:
- language: en
  script: Latn
  content: 'This document specifies class codes to classify global navigation satellite
    system (GNSS) receivers. The class codes represent how signals transmitted from
    radionavigation satellites are processed. This document applies to all types of
    GNSS receiver devices. The class codes in this document are not applicable to
    the following items: —     condition of radionavigation satellites; —     radio
    propagation environment including multipath, masking and obstacle; —     additional
    antenna of a receiver device; —     additional application software in a receiver
    device.'
