abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the design and performance evaluation of the ECCS strainer, since the performance of the strainer is important for the maintenance of nuclear safety during DBA, DBE and DEC. This document is applicable to the design and performance evaluation of the ECCS strainer in PWR NPPs, particularly those with primary design philosophies that rely on ECCS pumps. Its relevance for some PWR designs could nevertheless need some adaptations. Moreover, although tailored to PWR NPPs, it can also serve as a valuable reference for other reactor types, providing insight into the design and effectiveness of filtration systems in various nuclear power applications. Additional information and insights on national practice can be found in References  [1] [2] [3] [4].
