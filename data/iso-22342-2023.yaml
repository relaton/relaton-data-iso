abstract:
- language: en
  script: Latn
  content: This document gives guidance on developing and maintaining security plans.
    The security plan describes how an organization establishes effective security
    planning and how it can integrate security within organizational risk management
    practices. This document is applicable to all organizations regardless of type,
    size and nature, whether in the private, public or not-for-profit sectors, that
    wish to develop effective security plans in a consistent manner. This document
    is applicable to any organization intending to implement measures designed to
    protect their assets against malicious acts and mitigate their associated risks.
    This document does not provide specific criteria for identifying the need to implement
    or enhance prevention and protection measures against malicious acts. It does
    not apply to services and operations delivered by private security companies.
