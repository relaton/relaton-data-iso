abstract:
- language: en
  script: Latn
  content: ISO 13007-5:2015 gives terminology concerning the products, and specifies
    test methods (see Annex A) and values of performance requirements, for liquid-applied
    waterproofing products associated with tile adhesives. It specifies the evaluation
    of conformity and the classification and designation of liquid-applied waterproofing
    products beneath ceramic tiling. It is applicable to all liquid-applied waterproofing
    membranes ? including polymer modified cementitious coatings, dispersions and
    reaction resin coatings ? used beneath ceramic tiling for internal and external
    tile installations on walls and floors. NOTE Liquid-applied waterproofing products
    can also be used beneath other types of tiles (natural and agglomerated stones,
    etc.), as long as an adverse reaction does not occur between the membrane and
    the alternative tile.
