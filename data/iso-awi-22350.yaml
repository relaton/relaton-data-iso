abstract:
- language: en
  script: Latn
  content: The document establishes a functionally-based emergency management framework.
    This may serve as a basis for a systemic approach to emergency management standardization.
    This document can be used to sustain an organization’s continuity of functions
    and processes across the entire organization. It is intended to support building
    a holistic system of emergency management, identifying gaps and promote continual
    improvement. This document can be applied by government and non-government organizations
    of any size involved in emergency management. This document gives guidance on
    where various emergency management standards can be applied.
