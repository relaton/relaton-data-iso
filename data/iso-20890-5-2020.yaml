abstract:
- language: en
  script: Latn
  content: This document gives guidelines for pre-service inspection (PSI) and in-service
    inspections (ISI) by eddy current tests on non-ferromagnetic steam generator heating
    tubes of light water reactors, whereby the test is carried out using mechanised
    test equipment outwards from the tube inner side. An in-service eddy current test
    of steam generator heating tube plugs as a component of the primary circuit is
    not an object of this document. Owing to the different embodiments of steam generator
    heating tube plugs, the use of specially adapted test systems to be qualified
    is necessary. Test systems for the localisation of inhomogeneities (surface) and
    requirements for test personnel, test devices, the preparation of test and device
    systems, the implementation of the testing as well as the recording are defined.
    NOTE Data concerning the test section, test extent, inspection period, inspection
    interval and evaluation of indications is defined in the nuclear safety standards.
    It is recommended that the technical specifications are based on experience on
    U-tube bends with even bend radius (similar to the S/KWU design). To test other
    kind of tube bends (e.g. U-tube bends with two 90° bends) further qualifications
    will be provided.
