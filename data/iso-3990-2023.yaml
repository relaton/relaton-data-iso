abstract:
- language: en
  script: Latn
  content: This document specifies test methods for the evaluation of dental restorative
    materials, luting materials, fissure sealants and orthodontic bonding or luting
    materials that are claimed by their respective manufacturers to exert “antibacterial”
    effects. NOTE       Materials for pulp capping (e.g. calcium hydroxide formulations),
    endodontic filling materials, dental implants or implant systems, nightguards
    and additive manufactured (e.g. 3D-printed) materials are not covered in this
    document. This document does not cover tests on the effectiveness of sterilization
    or disinfection procedures. This document cannot be used to demonstrate a lack
    of microbial contamination of medical devices used in dentistry.
