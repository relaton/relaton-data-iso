abstract:
- language: en
  script: Latn
  content: This document specifies requirements for soft type denture lining materials
    suitable for long-term use and the test methods to determine compliance with these
    requirements. This document also specifies requirements for packaging, marking
    the products and for the instructions for use to be supplied by the manufacturer.
    These materials may also be used for maxillofacial prostheses. This document is
    not applicable to hard type denture lining materials or soft type denture lining
    materials for short-term use.
