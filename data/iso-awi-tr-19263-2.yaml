abstract:
- language: en
  script: Latn
  content: While ISO 19264-2 describes a method to determinate image quality performance
    of imaging systems (flatbed scanners, digital cameras) used for digitization of
    two-dimensional transmissive cultural heritage materials. The aim of ISO 19264-2
    is to enable cultural heritage institutions to set up, evaluate and control their
    imaging systems in a standardized way. This ISO TR 19263-2 gives practical guidance
    on how to use the above standard in digitization workflows to produce accurate
    digital copies of transmissive heritage objects in a consistent manner. Furthermore,
    the report gives an overview of the nature and typical characteristics of the
    originals to be digitized. It provides practical advice on how to digitize such
    materials and proposes classification into different quality levels of digitization
    in terms of aims and tolerances for the characteristics given in ISO 19264-2.
    For the purposes of this document, we define transmissive materials as objects
    that are two-dimensional and whose primary original use required light to pass
    through the object. The bulk of such materials found in heritage collections were
    objects used as the recording media in a photographic still image camera – such
    as, photographic negatives, transparencies, glass plate negatives, lantern slides,
    aerial film, roll film, micrographic, or radiographic materials, or other transmissive
    photographic materials. However, an original's suitability for this document is
    based on the intention to light it from behind; this is the primary factor that
    determines the hardware, software, and workflow that is required for proper digitization.  
    This document refers mainly to transparent originals with a photographic emulsion
    on a support material used to create images. Non-photographic media that are considered
    transmissive materials are not in the scope of this document. These include e.g.
    overhead transparencies used in schools, stained glass windows, diaphanous textiles
    intended to be displayed in front of a window or light source, and microscope
    slides.
