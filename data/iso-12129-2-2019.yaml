abstract:
- language: en
  script: Latn
  content: This document specifies tolerances on form and position as well as the
    surface roughness of shafts, flanges and thrust collars as used in plain bearing
    units. It is applicable to journal or thrust plain bearing units or to a combination
    of both, installed either horizontally or vertically. This document is not applicable
    to crankshaft bearing units in combustion engines.
