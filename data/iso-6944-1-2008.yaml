abstract:
- language: en
  script: Latn
  content: ISO 6944-1:2008 specifies a method for determining the fire resistance
    of vertical and horizontal ventilation ducts under standardized fire conditions.
    The test examines the behaviour of ducts exposed to fire from the outside (duct
    A) and fire inside the duct (duct B). It is intended that ISO 6944-1:2008 be used
    in conjunction with ISO 834-1. ISO 6944-1:2008 is not applicable to ducts whose
    fire resistance depends on the fire resistance performance of a ceiling, ducts
    containing fire dampers at points where they pass through fire separations, doors
    of inspection openings, unless included in the duct to be tested, two- or three-sided
    ducts, or the fixing of suspension devices to floors or walls. General guidance
    and background information are provided.
