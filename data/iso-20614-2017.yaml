abstract:
- language: en
  script: Latn
  content: DEPIP specifies a standardized framework for the various data (including
    both data and related metadata) exchange transactions between an archive and its
    producers and consumers. Interchanges between archives (including archives integrated
    in organizations, public archives, storage service suppliers) are also considered.
    ISO 20614:2017 defines five transactions (Transfer, Deliver, Dispose, Modify and
    Restitute), which the partners can use to exchange Data Objects. It also specifies
    the syntax and semantics of the messages that are exchanged during these transactions.
    Internal organization of the information systems of the partners is excluded.
    Information received in conformance with the data exchange model is intended to
    be handled by various software components. These applications, however, are not
    the object of ISO 20614:2017. The impacts of major risks (for instance, disappearance
    or incapacitation of the producer of the data) are also excluded.
