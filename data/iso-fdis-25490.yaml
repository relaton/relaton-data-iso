abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements and test methods for C.
    reticulata pericarp, which is the dried pericarp of the ripe fruit of C. reticulata
    Blanco or its cultivars(Fam. Rutaceae), C. unshiu Marcowicz, C. unshiu Markovich,
    C. reticulata 'Chachi', C. reticulata 'Dahongpao', C. reticulata 'Unshiu', C.
    reticulata 'Tangerina'. It is applicable to C. reticulata pericarp that is sold
    and used as herbal raw materials in the international trade, including Chinese
    materia medica (whole medicinal materials) and decoction pieces derived from this
    plant.
