abstract:
- language: en
  script: Latn
  content: Defines single-number quantities for airborne sound insulation in buildings
    and of building elements such as walls, floors, doors and windows. Takes into
    consideration the different sound level spectra of various noise sources. Gives
    rules for determining these quantities from the results of measurements carried
    out in one-third-octave or octave bands in accordance with ISO 140-3 to ISO 140-5,
    ISO-140-9 and ISO 140-10.
