abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the specification and qualification of brazing procedures for brazing of metallic materials. This document specifies requirements for brazing of the test piece, testing of the test specimen, essential variables and their range of qualification, acceptance criteria, brazing procedure qualification record (BPQR) and brazing procedure specification (BPS). This document does not cover testing of residual stresses, corrosion resistance and impact properties. This document applies to the following brazing processes according to ISO 4063:2023 with local and global heating: 911 Infrared brazing; 912 Flame brazing, torch brazing; 913 Laser beam brazing; 914 Electron beam brazing; 916 Induction brazing; 918 Resistance brazing; 919 Diffusion brazing; 921 Furnace brazing; 922 Vacuum brazing; 923 Dip-bath brazing; 924 Salt-bath brazing; 925 Flux bath brazing; 926 Immersion brazing; 972 Arc weld brazing. This document does not apply to brazing for aerospace applications covered by ISO 11745.'
