abstract:
- language: en
  script: Latn
  content: The scope of this standard is limited to Luer activated valves (LAVs) for
    intravascular applications, which open and permit access to the fluid conduit
    when a male Luer connector is inserted. This standard applies only to the valve
    end of LAVs. This standard applies to LAVs as stand-alone devices or as components
    of a medical device. This standard does not address valves that are opened by
    a female Luer connector. This standard does not address the connection features
    of the non-valve end of LAVs and/or other integrated features (e.g., stopcock
    handles)
