abstract:
- language: en
  script: Latn
  content: This document specifies an in vitro procedure to characterize the UVA protection
    of sunscreen products. Specifications are given to enable determination of the
    spectral absorbance characteristics of UVA protection in a reproducible manner.
    In order to determine relevant UVA protection parameters, the method has been
    created to provide an UV spectral absorbance curve from which a number of calculations
    and evaluations can be undertaken. These include calculation of the Ultraviolet-A
    protection factor (UVA-PF) [correlating with in vivo UVA-PF from the persistent
    pigment darkening (PPD) testing procedure], critical wavelength and UVA absorbance
    proportionality. These computations are optional and relate to local sunscreen
    product labelling requirements. This method relies on the use of static in vivo
    SPF results for scaling the UV absorbance curve. This document is not applicable
    to powder products such as pressed powder and loose powder products.
