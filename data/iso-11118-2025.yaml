abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the material, design, inspections,
    construction and workmanship, manufacturing processes, and tests at manufacture
    of non-refillable metallic gas cylinders of welded, brazed, or seamless construction.
    This document also specifies the requirements for the non-refillable sealing devices
    and their methods of testing. It is applicable to non-refillable metallic gas
    cylinders for compressed and liquefied gases. NOTE            The specific gases
    permitted in cylinders constructed to this document can be limited by national
    or international requirements. This document is applicable to cylinders where:
    a)       the test pressure does not exceed 250 bar1) (i.e. ph ≤ 250 bar) for liquefied
    gases and 450 bar for compressed gases; or b)       the product of the test pressure
    and the water capacity does not exceed 1 000 bar·litres (i.e. ph V ≤ 1 000 bar
    l); or c)        the test pressure exceeds 45 bar and the water capacity does
    not exceed 5 l (i.e. for ph > 45 bar, then V ≤ 5 l). 1) 1 bar = 0,1 MPa = 105 Pa;
    1 MPa = 1 N/mm2'
