abstract:
- language: en
  script: Latn
  content: ISO 13736:2013 specifies a method for the determination of the manual and
    automated closed-cup flash point of combustible liquids having flash points between
    −30,0 °C to 75,0 °C . However, the precision given for this method is only valid
    for flash points in the range −8,5 °C to 75,0 °C. ISO 13736:2013 is not applicable
    to water-borne paints.
