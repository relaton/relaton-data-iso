abstract:
- language: en
  script: Latn
  content: This document specifies the terms and definitions, technical requirements,
    test methods and inspection rules for telescopic ladders made of fibre-reinforced
    plastics. This document applies to the manufacture, selection, inspection and
    use of telescopic ladders made of fibre-reinforced plastics. NOTE 1       Annex
    A provides guidance for inspection rules of the telescopic ladders. NOTE 2      
    Annex B classifies all the tests covered in this document into 8 test blocks and
    specifies the sequence of tests within the same test block. It does not apply
    to ladders with a length over 5 m. NOTE 2       Ladders with a length over 5 m
    can use this document as a reference. The scope of this document does not relate
    to the “live working” and “explosive atmospheres”.
