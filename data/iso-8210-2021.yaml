abstract:
- language: en
  script: Latn
  content: This document specifies a test procedure for the measurement and testing
    of combine harvesters. It applies to either self-propelled or trailed type, either
    directly cutting the crop or picking it up from a windrow, for use in several
    crops. This document specifies the terminology and methods to be used for measuring
    important characteristics of combine harvesters. It includes both functional and
    capacity tests, in other words, those conducted over an extended period when ease
    of operation, ease of adjustment, rate of work and general operating characteristics
    can be assessed, and those carried out on specific occasions for the determination
    of grain loss and capacity characteristics. It applies to all types of combine
    harvesters.
