abstract:
- language: en
  script: Latn
  content: 'ISO 13856-3:2013 establishes general principles and specifies requirements
    for the design and testing of those pressure-sensitive protective devices, with
    or without an external reset facility, that are not specified in either ISO 13856‑1
    or ISO 13856‑2, and the majority of which are produced for specific applications
    and are not available as "off-the-shelf" items. ISO 13856-3:2013 also gives specific
    requirements for the following pressure-sensitive protective devices: pressure-sensitive
    bumpers; pressure-sensitive plates; pressure-sensitive wires (trip wires). It
    deals with the design of a pressure-sensitive device with regard to safety and
    reliability rather than its suitability for particular applications. It is not
    applicable to specifying the dimensions of pressure-sensitive protective devices
    in relation to any particular application, or stopping devices according to IEC
    60204‑1 used for the normal operation, including emergency stopping of machinery.
    While requirements are given for the immunity of the device to electromagnetic
    disturbances, these are not intended to cover all aspects of electromagnetic compatibility
    (EMC).'
