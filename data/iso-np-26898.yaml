abstract:
- language: en
  script: Latn
  content: 'This document sets out performance, functional requirements and provide
    guidance for luggage stowage design on all types of passenger rolling stock. This
    document applies to newly developed luggage stowage design in new and refurbished
    passenger rolling stock. This document does not specify: —the requirements for
    the installation of luggage stowage equipments to the carbody structure; —the
    requirements for the aesthetics for luggage stowage; —the fatigue performance
    of luggage stowage equipments; —the requirements for natural frequencies and resonance;
    —the requirements dynamic structural integrity for luggage stowage equipments;
    —the material of luggage stowage equipments.'
