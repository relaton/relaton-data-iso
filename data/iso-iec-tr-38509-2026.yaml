abstract:
- language: en
  script: Latn
  content: This document describes the governance implications of digital inclusion.
    It is intended for governing bodies and policy makers of all types of organizations
    (whether large or small) in the private, public and non-profit sectors. It provides
    perspectives on digital inclusion considerations, the role of governing bodies
    in ensuring organisations address these considerations, as well as governance
    practices. It is not intended or appropriate for certification purposes or for
