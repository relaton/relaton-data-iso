abstract:
- language: en
  script: Latn
  content: This document specifies the relevant terms and definitions of prawn enhancement
    release. It specifies the principles of prawn enhancement release and the requirements
    for selection of species, baseline survey, construction of foundation seed farm,
    species quality, offspring breeding, wild domestication, inspection and quarantine,
    packaging and transportation, release and effect assessment. This document is
    applicable to the prawn enhancement release in marine areas.
