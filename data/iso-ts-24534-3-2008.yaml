abstract:
- language: en
  script: Latn
  content: 'ISO TS 24534-3:2008 provides the requirements for an Electronic Registration
    Identification (ERI) that is based on an identifier assigned to a vehicle (e.g.
    for recognition by national authorities) suitable to be used for : electronic
    identification of local and foreign vehicles by national authorities, vehicle
    manufacturing, in-life-maintenance and end-of-life identification (vehicle life
    cycle management), adaptation of vehicle data, e.g. in case of international re-sales,
    safety-related purposes, crime reduction, and commercial services. It adheres
    to privacy and data protection regulations. ISO TS 24534-3:2008 defines the vehicle
    identification data. This data is called the ERI data and includes the vehicle
    identifier and possible additional vehicle related information (as typically included
    in a vehicle registration certificate).'
