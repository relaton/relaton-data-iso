abstract:
- language: en
  script: Latn
  content: ISO/TS 20273:2017 provides guidance for setting appropriate weld quality
    requirements in relation to fatigue. ISO/TS 20273:2017 is applicable to fusion
    (arc and/or beam welding) welded steel plate-type structures having a thickness
    of >3 mm, which are subjected to cyclic loading. Due to lack of experimental data
    for aluminium welds and ultra-high strength steels, the fatigue strength (or S-N)
    curves apply only to structural steel up to a maximum specified yield strength
    of 960 MPa. The acceptance criteria in this document may be applied to higher
    strength steels, stainless steels and certain concepts to 5000 and 6000 series
    of aluminium alloys which are commonly used in welded structures. In the absence
    of relevant published data, it is recommended that this be quantified by special
    testing.
