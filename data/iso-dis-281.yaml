abstract:
- language: en
  script: Latn
  content: ISO 281:2007 specifies methods of calculating the basic dynamic load rating
    of rolling bearings within the size ranges shown in the relevant ISO publications,
    manufactured from contemporary, commonly used, high quality hardened bearing steel,
    in accordance with good manufacturing practice and basically of conventional design
    as regards the shape of rolling contact surfaces. ISO 281:2007 also specifies
    methods of calculating the basic rating life, which is the life associated with
    90 % reliability, with commonly used high quality material, good manufacturing
    quality and with conventional operating conditions. In addition, it specifies
    methods of calculating the modified rating life, in which various reliabilities,
    lubrication condition, contaminated lubricant and fatigue load of the bearing
    are taken into account. ISO 281:2007 does not cover the influence of wear, corrosion
    and electrical erosion on bearing life. ISO 281:2007 is not applicable to designs
    where the rolling elements operate directly on a shaft or housing surface, unless
    that surface is equivalent in all respects to the bearing ring (or washer) raceway
    it replaces.
