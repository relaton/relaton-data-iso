abstract:
- language: en
  script: Latn
  content: This document specifies the test method for determining the amount of heat
    transferred through clothing fabrics by the combined dry and evaporative heat
    emission under simulated and specified conditions. This test method can be used
    for fabrics, films, coatings, foams and leathers including multilayer assemblies
    used in hot environment or in activities. The application of this measurement
    technique is restricted to a maximum amount of total heat transfer which depend
    on the dimensions and construction of the apparatus used (e.g. about 1 200 W/m2
    for the maximum specifications of the equipment according to ISO 11092).
