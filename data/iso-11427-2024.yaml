abstract:
- language: en
  script: Latn
  content: This document specifies a volumetric method for the determination of silver
    on a material considered homogeneous. The silver content of the sample lies preferably
    between (100 and 999,0) parts per thousand (‰) by mass. Fineness above 999,0 ‰
    can be determined using a spectroscopy method by difference (e.g. ISO 15096).
    This method is intended to be used as the reference method for the determination
    of fineness in alloys covered by ISO 9202.
