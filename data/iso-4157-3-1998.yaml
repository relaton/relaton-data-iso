abstract:
- language: en
  script: Latn
  content: This part of ISO 4157 establishes requirements for designation systems
    for rooms, areas, spaces, and voids in buildings by room identifiers. It introduces
    a new designation concept intended for identification of rooms in a project throughout
    its life cycle, i.e. the conception, programming, planning, erection, maintenance,
    remodelling and demolition phases.
