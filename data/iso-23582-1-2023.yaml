abstract:
- language: en
  script: Latn
  content: This document specifies the essential safety requirements for the design,
    the construction and the integration of magnetic clamping systems (MCS) for plastics
    and rubber machines (e.g. injection moulding machines, compression moulding machines)
    and provides operational limits and information for their safe use. This document
    deals with the basic hazards, hazardous situations or hazardous events that are
    listed in Annex A, when an MCS is used utilizing magnetic force to affix a mould
    to the platen of a machine in which it is integrated, and provides requirements
    to eliminate or adequately reduce the risks associated with these hazards taking
    into consideration conditions of misuse that are reasonably foreseeable by the
    manufacturer. This document also specifies requirements for the MCS when integrated
    into a machine. This document does not deal specifically with hazards associated
    with production processes or other processes (e.g. horizontal or vertical injection
    moulding processes). Other standards can be applicable to these process hazards.
    This document does not cover hydraulic, pneumatic or mechanical clamping systems.
    This document is not applicable to MCS manufactured before the date of its publication.
