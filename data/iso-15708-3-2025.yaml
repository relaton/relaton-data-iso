abstract:
- language: en
  script: Latn
  content: This document provides an overview of the operation of a computed tomography
    (CT) system. This document specifies steps for interpretation of CT results with
    the aim of providing the operator with technical information to enable selection
    of suitable parameters. This document is applicable to industrial imaging (i.e.
    non-medical applications) and specifies a consistent set of definitions of CT
    performance parameters, including how these performance parameters relate to CT
    system specifications. This document is applicable to computed axial tomography.
    This document does not apply to other types of tomography such as translational
    tomography and tomosynthesis.
