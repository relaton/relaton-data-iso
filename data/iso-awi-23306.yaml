abstract:
- language: en
  script: Latn
  content: This document specifies the quality requirements for Liquefied Natural Gas (LNG) used as a fuel for marine applications. It defines the relevant parameters to measure as well as the required values and the test reference methods for all those parameters. This document applies to LNG from any source, e.g. gas from conventional reservoirs, shale gas, coalbed methane, biomethane, synthetic methane. LNG described in this document can come from synthesis process out of fossil fuels or renewable sources. This document identifies the required specifications for fuels delivered at the time and place of custody transfer (at the delivery point).
