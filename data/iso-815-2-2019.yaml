abstract:
- language: en
  script: Latn
  content: This document specifies two methods for the determination of the compression
    set characteristics of vulcanized and thermoplastic rubbers at low temperatures.
    Method 1 derives from the methodology used in ISO 815-1. Method 2 uses a specified
    testing device, allowing to measure and record the test piece thickness during
    recovery. Due to the load applied during recovery in method 2, no correlation
    can be established between the results given by both methods. NOTE When rubber
    is held under compression, physical or chemical changes that prevent the rubber
    returning to its original dimensions after release of the deforming force can
    occur. The result is a set, where the magnitude of which depends on the time and
    temperature of compression as well as on the time, temperature, and conditions
    of recovery. At low temperatures, changes resulting from the effects of glass
    hardening or crystallization become predominant and, since these effects are reversed
    by raising the temperature, therefore, the measurements are always taken at the
    test temperature.
