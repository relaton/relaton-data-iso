abstract:
- language: en
  script: Latn
  content: ISO 738:2015 specifies permissible deviations, due to inaccuracies in sawing,
    from nominal thicknesses, widths and lengths, for coniferous sawn timber. It also
    gives, for information, average values for shrinkage for some wood species. It
    is applicable to unplanned square-edged and unedged coniferous sawn timber having
    thicknesses or widths in the range10 mm to 310 mm.
