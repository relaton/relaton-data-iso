abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1690:2018-11 specifies the application module for Interconnect
    placement requirements. The following are within the scope of ISO/TS 10303-1690:2018-11:
    layout item category based spacing requirement;layout item grouping based spacing
    requirement;layer specific layout item category spacing requirement;layer specific
    layout item grouping spacing requirement;embedded component to layout item category
    spacing requirement;constraint regions in the substrate;configuration management
    of constraint regions;the spacing classification;the spacing tolerance;non conforming
    design items.'
