abstract:
- language: en
  script: Latn
  content: 'This document specifies the technical requirements, test methods, and
    performance evaluation indicators of inorganic heat-resistant coatings used in
    electrochemical energy storage battery systems, and is suitable for thermal runaway
    protection of coatings in battery cells, modules, and system-level applications.
    Note: This document does not specify the types of battery systems or substrates
    suitable for heat-resistant coatings, nor does it define detailed requirements
    for coating appearance or application methods. Instead, it defines the core performance
    metrics essential for ensuring safety and functionality under operational conditions.'
