abstract:
- language: en
  script: Latn
  content: ISO 17078-2:2007 provides requirements for subsurface flow-control devices
    used in side-pocket mandrels (hereafter called flow-control devices) intended
    for use in the worldwide petroleum and natural gas industry. This includes requirements
    for specifying, selecting, designing, manufacturing, quality-control, testing
    and preparation for shipping of flow-control devices. Additionally, it includes
    information regarding performance testing and calibration procedures. The installation
    and retrieval of flow-control devices is outside the scope of ISO 17078-2:2007.
    Additionally, ISO 17078-2:2007 is not applicable to flow-control devices used
    in centre-set mandrels or with tubing-retrievable applications. ISO 17078-2:2007
    does not include requirements for side-pocket mandrels, running, pulling, and
    kick-over tools, and latches that might or might not be covered in other ISO specifications.
    Reconditioning of used flow-control devices is outside of the scope of ISO 17078-2:2007.
