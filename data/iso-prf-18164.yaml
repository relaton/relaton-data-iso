abstract:
- language: en
  script: Latn
  content: ISO 18164 specifies methods for measuring rolling resistance, under controlled
    laboratory conditions, for new pneumatic tyres designed primarily for use on motorcycles.
    The relationship between values obtained and the fuel economy of the vehicle is
    undetermined, and such values are not intended to be used to indicate levels of
    performance or quality.  
