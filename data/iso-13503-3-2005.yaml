abstract:
- language: en
  script: Latn
  content: ISO 13503-3:2005 covers the physical properties, potential contaminants
    and test procedures for heavy brine fluids manufactured for use in oil and gas
    well drilling, completion and workover fluids. ISO 13503-3:2005 provides methods
    for assessing the performance and physical characteristics of heavy brines for
    use in field operations. It includes procedures for evaluating the density or
    specific gravity, the clarity or amount of particulate matter carried in the brine,
    the crystallization point or the temperature (both ambient and under pressure)
    at which the brines make the transition between liquid and solid, the pH, and
    iron contamination. It also contains a discussion of gas hydrate formation and
    mitigation, brine viscosity, corrosion testing, buffering capacity and a standardised
    reporting form. ISO 13503-3:2005 is intended for the use of manufacturers, service
    companies and end-users of heavy brines.
