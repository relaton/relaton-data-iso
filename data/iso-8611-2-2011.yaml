abstract:
- language: en
  script: Latn
  content: ISO 8611-2:2011 specifies the performance requirements to establish nominal
    loads for new flat pallets. It also specifies the tests required for new flat
    pallets in various handling environments and the performance requirements for
    tests with payloads. It is not intended to apply to pallets with a fixed superstructure
    or a rigid, self-supporting container that can be mechanically attached to the
    pallet and which contributes to the strength of the pallet.
