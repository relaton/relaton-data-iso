abstract:
- language: en
  script: Latn
  content: This document specifies a method of classifying the microstructure of graphite
    in cast irons by comparative visual analysis. The purpose of this document is
    to provide information about the method of graphite classification. It is not
    intended to give information on the suitability of cast-iron types and grades
    for any particular application. The particular material grades are specified mainly
    by mechanical properties and, in the case of austenitic and abrasion resistant
    cast irons, by their chemical composition. The interpretation of graphite form
    and size does not allow a statistically valid statement on the fulfilment of the
    requirements specified in the relevant material standard.
