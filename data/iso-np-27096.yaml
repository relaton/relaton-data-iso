abstract:
- language: en
  script: Latn
  content: 'This document specifies methods for the qualitative identification and quantitative analysis of plastics and related materials using Fourier Transform Infrared (FTIR) spectroscopy. It primarily covers two testing techniques: Attenuated Total Reflectance (ATR) FTIR spectroscopy and Transmission FTIR spectroscopy. This document is applicable to the qualitative identification of solid, film, and powder-form plastic materials, as well as the quantitative determination of polymer matrix or specific additive contents in plastics.'
