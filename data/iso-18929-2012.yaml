abstract:
- language: en
  script: Latn
  content: ISO 18929:2012 establishes the specifications for silver-gelatin photographic
    reflection prints intended for dark storage. It covers silver-gelatin print types
    of all weights. ISO 18929:2012 applies to wet-processed black-and-white silver-gelatin
    photographic prints, including those that have been chemically treated (with a
    gold, selenium, sulfur, or other chemical treatment bath) to improve the permanence
    of the silver image. It also applies to silver-gelatin prints processed by a monobath,
    which includes thiosulfate as a fixing agent followed by a conventional wash.
