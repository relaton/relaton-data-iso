abstract:
- language: en
  script: Latn
  content: This document specifies a static test method for measuring the strength
    of a conveyor belt mechanical fastening; the mechanical joints can be either of
    the type employing a connecting rod or of a type which does not employ a connecting
    rod. This document does not cover vulcanized joints. This document is neither
    applicable to nor valid for light conveyor belts, as described in ISO 21183-1.
    NOTE            The purpose of the test specified in this document is to eliminate
    mechanical fastenings of insufficient static strength. It is intended to establish
    a dynamic test at a later date.
