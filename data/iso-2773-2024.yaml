abstract:
- language: en
  script: Latn
  content: This document specifies, with reference to ISO 230-1, geometrical tests
    on general purpose and normal accuracy pillar type vertical drilling machines.
    This document also specifies the applicable tolerances corresponding to the above‐mentioned
    tests. This document covers only the verification of accuracy of the machine.
    This document does not apply to the testing of the machine operation (vibrations,
    abnormal noises, stick-slip motion of components, etc.) or to machine characteristics
    (such as speeds and feeds), which are generally checked before testing of machine
    accuracy.
