abstract:
- language: en
  script: Latn
  content: This document specifies methods for testing the resistance to sustained
    longitudinal tensile loading (longitudinal stress-rupture) of uniaxial plastic
    pipe/pipe or pipe/fitting or fitting/fitting assemblies using hydraulic pressure
    at a given temperature. This document is applicable to pipe assemblies with electrofusion
    or butt fusion joints. The methods accommodate water-in-water, water-in-air, and
    liquid-in-liquid tests. Method A uses no external hoop expansion restraint (specifically
    designed test piece). Method B uses external hoop expansion restraint (metal end
    caps or circumferential (ring) clamps).
