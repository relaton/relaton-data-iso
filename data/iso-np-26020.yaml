abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies the requirements and methods for
    the removal of coating layers from sintered neodymium iron boron (NdFeB) permanent
    magnets intended for recycling. The coating layers covered include: – metallic
    coatings (e.g. nickel, zinc, Ni–Cu–Ni multilayers), – organic coatings (e.g. epoxy
    resin, parylene), – oxide films, and – adhesive residues originating from sintering
    or assembly processes. This document defines the position of coating removal within
    the overall short-loop recycling process, as described in ISO/CD 24457, and establishes
    principles for selecting and applying removal methods. This document does not
    cover demagnetization, sorting, or downstream processes such as pulverizing, sintering,
    or regeneration of NdFeB magnets.'
