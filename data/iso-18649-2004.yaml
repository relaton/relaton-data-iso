abstract:
- language: en
  script: Latn
  content: ISO 18649:2004 provides methodology for the evaluation of results from
    dynamic tests and investigations on bridges and viaducts. It complements the procedure
    for conducting the tests as given in ISO 14963 and considers -- the objectives
    of the dynamic tests, -- the techniques for data analysis and system identification,
    -- the modelling of the bridge, and -- evaluation of the measured data. The dynamic
    tests considered in ISO 18649:2004 do not replace static tests. ISO 18649:2004
    gives guidance on the assessment of measurements carried out over the life cycle
    of the bridge. The stages of the life cycle that are considered are -- during
    construction and prior to commissioning, -- during commissioning trials, -- during
    specified periods throughout the life of the bridge, and -- immediately prior
    to decommissioning the bridge. ISO 18649:2004 is applicable to road, rail and
    pedestrian bridges and viaducts (both during construction and operation) and also
    to other works, provided that they justify its application. The application of
    this International Standard to special structures (cable-stayed or suspension
    bridges) requires specific tests that take into account the particular characteristics
    of the work.
