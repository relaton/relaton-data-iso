abstract:
- language: en
  script: Latn
  content: ISO 5832-1:2016 specifies the characteristics of, and corresponding test
    methods for, wrought stainless steel for use in the manufacture of surgical implants.
    NOTE 1 The mechanical properties of a sample obtained from a finished product
    made of this alloy can differ from those specified in this part of ISO 5832. NOTE
    2 The alloy described in this part of ISO 5832 corresponds to UNS S31673 referred
    to in ASTM F138/ASTM F139 and to alloy code 1.4441 given in the withdrawn DIN
    17443.
