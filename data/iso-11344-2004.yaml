abstract:
- language: en
  script: Latn
  content: ISO 11344:2004 describes a method for the determination of the molecular
    mass, expressed as polystyrene, and the molecular-mass distribution of polymers
    produced in solution which are completely soluble in tetrahydrofuran (THF) and
    which have a molecular-mass range from 5 000 to 1 000 000. It is not the purpose
    of the standard to explain the theory of gel permeation chromatography.
