abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for treatment of high-salinity wastewater
    generated during the water reuse process in thermal power plants. The key contents
    are as follows: types and properties of high-salinity wastewater; technical essentials
    of pretreatment, concentration, solidification, and typical process combinations;
    technical requirements for operation of high-salinity wastewater treatment systems;
    technical requirements for resource recovery and waste disposal. The Guidelines
    provide technical guidance for selecting treatment processes for high-salinity
    wastewater associated with water reuse in thermal power plants. This document
    applies to treatment of various high-salinity wastewater such as reverse osmosis
    concentrate, ion exchange regeneration wastewater, and desulfurization wastewater
    associated with water reuse in thermal power plants.'
