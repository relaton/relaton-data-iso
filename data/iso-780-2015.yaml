abstract:
- language: en
  script: Latn
  content: ISO 780:2015 specifies a set of graphical symbols conventionally used for
    marking of distribution packages in their physical distribution chain to convey
    handling instructions. The graphical symbols should be used only when necessary.
    ISO 780:2015 is applicable to packages containing any kind of goods, but does
    not include instructions specific to handling of dangerous goods.
