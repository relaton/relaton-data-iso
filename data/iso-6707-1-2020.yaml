abstract:
- language: en
  script: Latn
  content: 'This document contains the terms and definitions of general concepts to
    establish a vocabulary applicable to buildings and civil engineering works. It
    comprises: a) fundamental concepts, which can be the starting point for other,
    more specific, definitions; b) more specific concepts, used in several areas of
    construction and frequently used in standards, regulations and contracts.'
