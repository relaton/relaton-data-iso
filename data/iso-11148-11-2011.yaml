abstract:
- language: en
  script: Latn
  content: ISO 11148-11:2011 specifies safety requirements for hand-held non-electric
    power tools (hereinafter "nibblers and shears") with a reciprocating movement
    for nibbling and shearing. The nibblers and shears can be powered by compressed
    air or hydraulic fluid and are intended to be used by one operator and supported
    by the operator's hand or hands, with or without a suspension, e.g. a balancer.
    ISO 11148-11:2011 is applicable to nibblers and shears. ISO 11148-11:2011 is not
    applicable to special requirements and modifications of nibblers and shears for
    the purpose of mounting them in a fixture. ISO 11148-11:2011 deals with all significant
    hazards, hazardous situations or hazardous events relevant to nibblers and shears
    when they are used as intended and under conditions of misuse which are reasonably
    foreseeable by the manufacturer, with the exception of the use of nibblers and
    shears in potentially explosive atmospheres.
