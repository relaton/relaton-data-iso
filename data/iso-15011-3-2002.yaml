abstract:
- language: en
  script: Latn
  content: ISO 15011-3 defines a laboratory method for evaluating ozone emissions
    generated during arc welding by measuring ozone concentrations at fixed points
    around a stationary welding arc. The results may be used to compare the effect
    of welding parameters, processes, etc. on ozone generation and hence to predict
    changes in workplace exposure under similar working conditions.
