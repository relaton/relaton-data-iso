abstract:
- language: en
  script: Latn
  content: ISO 7671:2003 specifies the requirements for solid-wall polypropylene (PP)
    pipes and fittings for soil and waste discharge (low and high temperature) inside
    buildings, as well as the system itself. It does not include buried pipework.
    It is applicable to pipes and fittings for jointing by means of elastomeric sealing
    rings or by butt fusion.
