abstract:
- language: en
  script: Latn
  content: ISO 14895:2016 specifies the design, construction and installation of permanently
    installed galley stoves and heating appliances using fuels which are liquid at
    atmospheric pressure on small craft up to 24 m length of hull (LH according to
    ISO 8666). It includes open flame galley stoves, ceramic hobs, blown air heaters
    and water heating appliances. Cooking and heating appliances solely designed or
    intended as portable self-contained camping stoves or heaters are not covered.
    Other permanently installed cooking and heating appliances (such as solid-fuelled
    and liquid-fuelled natural draft stoves) are outside the scope of this International
    Standard and therefore covered by ISO 9094.
