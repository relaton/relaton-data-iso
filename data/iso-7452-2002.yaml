abstract:
- language: en
  script: Latn
  content: 'ISO 7452:2002 specifies requirements for tolerances for hot-rolled steel
    plates made on a reversing mill (excluding stainless steels) with the following
    characteristics: nominal thickness not less than 4 mm but no greater than 400
    mm;nominal width not less than 600 mm;specified minimum yield strength not less
    than 700 N/mm2.'
