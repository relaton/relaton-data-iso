abstract:
- language: en
  script: Latn
  content: ISO 513:2004 specifies the classification and application of hard cutting
    materials including hard metals (carbides), ceramics, diamond and boron nitride,
    for machining by chip removal, and establishes their application. It is not applicable
    for other uses (e.g., mining and other percussion tools, wire-drawing dies, tools
    operating by deformation of the metal, comparator contact tips, etc.).
