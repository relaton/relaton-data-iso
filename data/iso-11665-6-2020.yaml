abstract:
- language: en
  script: Latn
  content: This document describes radon-222 spot measurement methods. It gives indications
    for carrying out spot measurements, at the scale of a few minutes at a given place,
    of the radon activity concentration in open and confined atmospheres. This measurement
    method is intended for rapid assessment of the radon activity concentration in
    the air. The result cannot be extrapolated to an annual estimate of the radon
    activity concentration. This type of measurement is therefore not applicable for
    assessment of the annual exposure or for determining whether or not to mitigate
    citizen exposures to radon or radon decay products. The measurement method described
    is applicable to air samples with radon activity concentration greater than 50
    Bq·m−3. NOTE For example, using an appropriate device, the radon activity concentration
    can be spot measured in the soil and at the interface of a material with the atmosphere
    (see also ISO 11665-7[8]).
