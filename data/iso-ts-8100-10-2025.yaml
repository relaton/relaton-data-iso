abstract:
- language: en
  script: Latn
  content: This document defines minimum specific elements required for BIM process
    with new lifts. It does not define the BIM process itself. This document specifies
    a minimum set of information for lifts following the structure of ISO 7817-1,
    for the purpose of building planning during pre-design stage, schematic design
    stage and detailed design stage of a building. It covers the geometrical information
    and the alphanumerical information. NOTE            The BIM processes are defined
    in ISO/TC 59/SC 13 standards. This document does not cover requirements during
    other stages (information delivery milestones) and the documentation. This document
    does not cover definition of actors, which are project specific. The definitions
    are for a single lift. This document does not describe the structures required
    for multiple lifts in the same building. This document describes the information
    of a lift and its interfaces to the building which are relevant for the planning
    of the building. The structural forces are out of the scope of this document.
    This document is not applicable to lifts, which are installed before the date
    of its publication.
