abstract:
- language: en
  script: Latn
  content: ISO/IEC TR 20000-10:2015 describes the core concepts of ISO/IEC 20000,
    identifying how the different parts support ISO/IEC 20000‑1:2011 as well as the
    relationships between ISO/IEC 20000 and other International Standards and Technical
    Reports. This part of ISO/IEC 20000 also explains the terminology used in ISO/IEC
    20000, so that organisations and individuals can interpret the concepts correctly.
    ISO/IEC TR 20000-10:2015 is for a) service providers considering using any part
    of ISO/IEC 20000 and looking for guidance on how to use the different parts of
    ISO/IEC 20000 to achieve their goal, b) service providers that wish to understand
    how ISO/IEC 20000 can be used in combination with other International Standards,
    and c) practitioners, auditors, and other parties who wish to gain an understanding
    of ISO/IEC 20000.
