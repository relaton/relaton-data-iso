abstract:
- language: en
  script: Latn
  content: This document specifies a test procedure for determining the performance
    of the internal cleaning system fitted onto a sprayer. This document is applicable
    to mounted, trailed and self-propelled agricultural sprayers used for crop protection
    and liquid fertilizer applications. It is not applicable to sprayers with direct
    injection systems, manually operated knapsack sprayers, aircraft sprayers and
    uncrewed aerial spraying system (UASS).
