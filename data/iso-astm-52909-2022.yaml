abstract:
- language: en
  script: Latn
  content: This document covers supplementary guidelines for evaluation of mechanical
    properties including static/quasi-static and dynamic testing of metals made by
    additive manufacturing (AM) to provide guidance toward reporting when results
    from testing of as-build specimen or those excised from printed parts made by
    this technique or both. This document is provided to leverage already existing
    standards. Guidelines are provided for mechanical properties measurements and
    reporting for additively manufactured metallic specimen as well as those excised
    from parts. This document does not purport to address all of the safety concerns,
    if any, associated with its use. It is the responsibility of the user of this
    standard to establish appropriate safety, health and environmental practices and
    determine the applicability of regulatory limitations prior to use. This document
    expands upon the nomenclature of ISO/ASTM 52900 and principles of ISO/ASTM 52921
    and extends them specifically to metal additive manufacturing. The application
    of this document is primarily intended to provide guidance on orientation designations
    in cases where meaningful orientation/direction for AM cannot be obtained from
    available test methods.
