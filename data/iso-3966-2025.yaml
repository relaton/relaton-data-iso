abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination in a closed conduit
    of the volume rate of flow of a regular flow a)       of a fluid of substantially
    constant density or corresponding to a Mach number not exceeding 0,25, b)      
    with substantially uniform stagnation temperature across the measuring cross-section,
    c)        running full in the conduit, and d)       under steady flow conditions.
    In particular, it deals with the technology and maintenance of Pitot static tubes,
    with the calculation of local velocities from measured differential pressures
    and with the computation of the flow rate by velocity integration.
