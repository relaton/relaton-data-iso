abstract:
- language: en
  script: Latn
  content: This document provides test methods to determine the properties and performance
    of target carriers, in combination with specified targets. This document specifies
    how to validate the target carrier with target regarding the dynamic performance
    versus the requirements and tolerances specified in test protocols. The main characteristics
    validated in this document are the speed, yaw rate and lateral deviation. This
    document does not address the test synchronization between the vehicle under test
    (VUT) and the target carrier with target. This document does not address the detection
    characteristics of the target carrier with target. NOTE            Performance
    requirements of targets and properties related to detection by sensor systems
    are covered by other parts of the ISO 19206 series.
