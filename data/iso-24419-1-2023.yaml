abstract:
- language: en
  script: Latn
  content: This document establishes requirements and recommendations for managing
    mining legacies. It can be used by any public, private or community enterprise,
    or group, but is deemed particularly relevant to government and the mining industry
    who have a legal right or obligation to manage mining legacies. This document
    encompasses a range of activities that are relevant to planning, implementing
    and stewardship, performance and reporting when managing mining legacies while
    engaging stakeholders throughout the process. It is applicable to all mining legacies
    from large complex sites to medium and small mines. It is also applicable to mining
    legacies in a range of climates, land uses and social contexts. Managing mining
    legacies can pose complex challenges that require high level support and clear
    responsibilities to ensure delivery of acceptable outcomes. The process of managing
    mine closure and reclamation for active mines is addressed in ISO 21795 series.
