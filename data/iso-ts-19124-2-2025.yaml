abstract:
- language: en
  script: Latn
  content: This document defines the calibration and validation of Earth observing
    (EO) data acquired by synthetic aperture radar (SAR) sensors and products derived
    from SAR data. The specified SAR sensors include general working modes and advanced
    working modes. In this document, calibration addresses the process to correct
    the data, not only geometrically and radiometrically, but also characteristically
    for qualitative and quantitative applications. Validation addresses an evaluation
    of the quality and accuracy of the calibrated data and derived products. This
    document also addresses the associated metadata related to calibration and validation
    that has not been defined in other geographic information International Standards.
    This document does not apply to the calibration of SAR sensors and validation
    of SAR sensor calibration, which are covered by ISO/TS 19159-3. However, the calibration
    and validation procedure can be also applied and referenced among others.
