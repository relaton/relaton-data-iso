abstract:
- language: en
  script: Latn
  content: ISO 9073-14:2006 specifies a test method to examine the ability of diaper
    coverstock to resist the transport back onto the skin of a liquid which has already
    penetrated the coverstock. This test corresponds with the repeated liquid strike-through
    time described in ISO 9073-13. This test method is intended for quality control
    and is designed for comparison of wetback for different nonwoven coverstocks and
    treatments. It does not simulate in-use conditions for finished products.
