abstract:
- language: en
  script: Latn
  content: A general definition of initialization is that it begins at separation
    of the spacecraft (SC) from the launcher. In some cases, a more exact definition
    will be that initialization begins in flight, upon planned change in mode or state
    of the SC from the launch configuration. Commissioning is completed when the SC,
    including its payload, is certified for initial mission operations. Prior to certification
    for mission operations, the SC is described as a test article in the three parts
    of ISO 10784. ISO 10784 does not include a requirement for contingency plans,
    but does include a statement of the need for contingency planning. ISO 10784-2:2011
    provides SC manufacturers and operators with a specific form and format to write
    spacecraft initialization plans required to configure and verify the SC to perform
    normal mission operations. Since the SC is considered a test article at this phase
    of its operational life, ISO 17566 is used as a normative reference in constructing
    the initialization plan. It provides SC manufacturers, operators and other stakeholders
    with a common language and form to verify and document spacecraft initialization
    prior to normal SC mission operations.
