abstract:
- language: en
  script: Latn
  content: The aim of the present standard is to evaluate recyclability of paper packaging
    producst by determining the recovery pulp yield(%) of cellulose fibers, known
    as pulp, recovered from their waste products. The recovery pulp yield(%) is determined
    by measuring the cellulose content recovered after a waste product is disintegrated
    in water under specified mechanical conditions.
