abstract:
- language: en
  script: Latn
  content: ISO 22935-2|IDF 99-2:2009 specifies recommended methods for the sensory
    evaluation of specific milk and milk products. It specifies criteria for the sampling
    and preparation of samples and the assessment of the samples. ISO 22935-2|IDF
    99-2:2009 is suitable for application in conjunction with the sensory methodologies
    outlined in ISO 22935-1|IDF 99-1 and other ISO or IDF sensory methodologies for
    specific situations and products.
