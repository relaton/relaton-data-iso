abstract:
- language: en
  script: Latn
  content: 'ISO 10605:2008 specifies the electrostatic discharge (ESD) test methods
    necessary to evaluate electronic modules intended for vehicle use. It applies
    to discharges in the following cases: ESD in assembly; ESD caused by service staff;
    ESD caused by occupants. ESD applied to the device under test (DUT) can directly
    influence the DUT. ESD applied to neighbouring parts can couple into supply and
    signal lines of the DUT in the vehicle and/or directly into the DUT. ISO 10605:2008
    describes test procedures for evaluating both electronic modules on the bench
    and complete vehicles. It also describes a test procedure that classifies the
    ESD sensitivity of modules for packaging and handling. ISO 10605:2008 applies
    to all types of road vehicles regardless of the propulsion system (e.g. spark-ignition
    engine, diesel engine, electric motor). ISO 10605:2008 is based in part on IEC
    61000-4-2 and describes vehicle-specific requirements. ISO 10605:2008 does not
    apply to pyrotechnic modules.'
