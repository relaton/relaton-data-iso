abstract:
- language: en
  script: Latn
  content: ISO 15223-1:2007 identifies requirements for the development and use of
    symbols that may be used to convey information on the safe and effective use of
    medical devices. It also lists symbols that satisfy the requirements of ISO 15223-1:2007.
    ISO 15223-1:2007 is limited to symbols applicable to a broad spectrum of devices
    that may be marketed globally. These symbols may be used on the device itself
    or its package or in the associated documentation.
