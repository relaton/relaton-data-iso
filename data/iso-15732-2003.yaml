abstract:
- language: en
  script: Latn
  content: ISO 15732:2003 describes a test method for the determination of fracture
    toughness of monolithic ceramic materials at room temperature by the Single-Edge-Precracked-Beam
    (SEPB) method. This International Standard is intended for use with monolithic
    ceramics and whisker- or particulate-reinforced ceramics which are regarded as
    macroscopically homogeneous. It does not include continuous-fiber-reinforced ceramic
    composites. ISO 15732:2003 is for material development, material comparison, quality
    assurance, characterization, reliability and design data generation. Fracture
    toughness values determined with other test methods cannot be interchanged with
    KIpb as defined in this International Standard, and may not be interchangeable
    with each other.
