abstract:
- language: en
  script: Latn
  content: ISO 11120:2015 specifies minimum requirements for the material, design,
    construction and workmanship, manufacturing processes, examinations and tests
    at manufacture of refillable quenched and tempered seamless steel tubes of water
    capacities exceeding 150 l up to and including 3 000 l for compressed and liquefied
    gases exposed to extreme world-wide ambient temperatures, normally between ?50
    °C and 65 °C. ISO 11120:2015 is applicable to tubes with a maximum tensile strength,
    Rma, of less than 1 100 MPa. These tubes can be used alone or in batteries to
    equip trailers or multiple element gas containers (ISO modules or skids) for the
    transportation and distribution of compressed gases. ISO 11120:2015 is applicable
    to tubes having an opening at each end.
