abstract:
- language: en
  script: Latn
  content: 'This document provides guidance on applying ISO 38200 for the chain of
    custody certification of deforestation free wood-based products with special reference
    to the European Union Deforestation Regulation (EUDR). The document adresses in
    particular the following aspects: • Definition of input material • Due Diligence
    System • Oganizational Requirements The document does not adress the EUDR reporting
    requirements in their entirety.'
