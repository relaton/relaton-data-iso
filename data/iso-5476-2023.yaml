abstract:
- language: en
  script: Latn
  content: This document provides general provisions and minimum criteria for using
    virtual reality and simulator equipment and systems instead of live training and
    drills with lifesaving appliances and arrangements, such as those required by
    SOLAS and MODU Code. This document is not intended to provide a generic training
    programme for the purposes of meeting International Convention on Standards of
    Training, Certification and Watchkeeping for Seafarers (STCW) requirements. This
    document serves to support the use of training devices (TD) onboard vessels that
    can deliver training and drills required by regulation, as well as additional
    non-obligatory training to crew. It is understood that training devices described
    in this document are used as an alternative to actual participation with and operations
    of lifesaving appliances (LSA) products during drills to meet mandatory training
    requirements.
