abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1694:2006 specifies the application module for Layered 3D
    shape. The following are within the scope of ISO/TS 10303-1694:2006: identification
    of the relationship between two and three dimensional geometrical models using
    projection and intersection; items within the scope of application module Advanced
    boundary representation, ISO/TS 10303-1514; items within the scope of application
    module Curve swept solid, ISO/TS 10303-1659; items within the scope of application
    module Faceted boundary representation, ISO/TS 10303-1512; items within the scope
    of application module Geometrically bounded surface, ISO/TS 10303-1507; items
    within the scope of application module Layered 2d shape, ISO/TS 10303-1693; items
    within the scope of application module Physical unit 3d shape, ISO/TS 10303-1727.'
