abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for formatting request types
    (verify, resolve, and search) and replies to those requests, in order to verify
    trading entity identity data with the authoritative source. The following are
    within the scope of this document: the syntax requirements and application protocol
    interface (API) for a request and response to a request for the verification of
    an international business identifiers (IBID) to verify trading entity identity
    data (verify); the syntax requirements and API for a request and reply to the
    request for resolution of an IBID or international business registration number
    (IBRN) to other data associated with the trading entity (resolve); the syntax
    requirements and API for a request and response to a request to search for an
    IBID, IBRN, or authoritative legal entity identifier (ALEI) given a legal name
    (search). The following are outside the scope of this document: the methods used
    for the resolution of IBIDs and IBRNs by the register that issued the ALEI.'
