abstract:
- language: en
  script: Latn
  content: This document specifies an index test method to determine the friction
    characteristics of geosynthetics in contact with a standard sand as described
    in EN 196-1, i.e. with a specified density and moisture content, under a normal
    stress and at a constant rate of displacement, using a direct shear apparatus.
    The same testing procedure can be used with any type of soil with the density
    and moisture content that are required to evaluate the performance under specific
    conditions or with another geosynthetic under a normal stress and at a constant
    rate of displacement, using a direct shear apparatus. The procedure can also be
    used for testing geosynthetic barriers.
