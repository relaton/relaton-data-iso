abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and provides guidance for establishing,
    implementing, maintaining, reviewing and improving an anti-bribery management
    system. The system can be stand-alone or can be integrated into an overall management
    system. This document addresses the following in relation to the organization''s
    activities: —     bribery in the public, private and not-for-profit sectors; —    
    bribery by the organization; —     bribery by the organization''s personnel acting
    on the organization''s behalf or for its benefit; —     bribery by the organization''s
    business associates acting on the organization''s behalf or for its benefit; —    
    bribery of the organization; —     bribery of the organization''s personnel in
    relation to the organization’s activities; —     bribery of the organization''s
    business associates in relation to the organization’s activities; —     direct
    and indirect bribery (e.g. a bribe offered or accepted through or by a third party).
    This document is applicable only to bribery. It sets out requirements and provides
    guidance for a management system designed to help an organization to prevent,
    detect and respond to bribery and comply with anti-bribery laws and voluntary
    commitments applicable to its activities. The requirements of this document are
    generic and are intended to be applicable to all organizations (or parts of an
    organization), regardless of type, size and nature of activity, and whether in
    the public, private or not-for-profit sectors. The extent of application of these
    requirements depends on the factors specified in 4.1, 4.2 and 4.5. NOTE 1       
    See Clause A.2 for guidance. NOTE 2        The measures necessary to prevent,
    detect and mitigate the risk of bribery by the organization can be different from
    the measures used to prevent, detect and respond to bribery of the organization
    (or its personnel or business associates acting on the organization''s behalf).
    See A.8 for guidance.'
