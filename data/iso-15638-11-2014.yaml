abstract:
- language: en
  script: Latn
  content: ISO 15638-11:2014 addresses the provision of Driver Work Records (DWR)
    and specifies the form and content of such data required to support such systems,
    and access methods to that data. ISO 15638-11:2014 provides specifications for
    common communications and data exchange aspects of the application service driver
    work records that a regulator can elect to require or support as an option, including
    a) high-level definition of the service that a service provider has to provide,
    [The service definition describes common service elements; but does not define
    the detail of how such an application service is instantiated, nor the acceptable
    value ranges of the data concepts defined.], b) means to realize the service,
    and c) application data, naming content, and quality that an IVS has to deliver.
