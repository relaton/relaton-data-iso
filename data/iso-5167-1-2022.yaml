abstract:
- language: en
  script: Latn
  content: This document defines terms and symbols and establishes the general principles
    for methods of measurement and computation of the flow rate of fluid flowing in
    a conduit by means of pressure differential devices (orifice plates, nozzles,
    Venturi tubes, cone meters, and wedge meters) when they are inserted into a circular
    cross-section conduit running full. This document also specifies the general requirements
    for methods of measurement, installation and determination of the uncertainty
    of the measurement of flow rate. ISO 5167 (all parts) is applicable only to flow
    that remains subsonic throughout the measuring section and where the fluid can
    be considered as single-phase. It is not applicable to the measurement of pulsating
    flow.
