abstract:
- language: en
  script: Latn
  content: 'This document deals with principles of sampling of soil, rock and groundwater
    as part of the programme of geotechnical investigation and testing. NOTE 1   
    This document fulfils the requirements for sampling of soil, rock and groundwater,
    and groundwater measurements as part of the programme of geotechnical investigation
    and testing according to EN 1997-1 and EN 1997-2. The aims of such ground investigations
    are: a) to recover soil, rock and water samples of a quality appropriate to assess
    the general suitability of a site for geotechnical engineering purposes and to
    determine the required ground characteristics in the laboratory; b) to obtain
    information on the sequence, thickness and orientation of strata and discontinuities;
    c) to establish the type, composition and condition of strata; d) to obtain information
    on groundwater conditions and recover water samples for assessment of the interaction
    of groundwater, soil, rock and construction material. Soil sampling for the purposes
    of agricultural and environmental soil investigation is not covered. NOTE 2   
    Guidance on soil sampling for these purposes including of contaminated or potentially
    contaminated sites is provided in the ISO 18400 series. ISO 18400-204 provides
    in addition guidance on sampling and measurement of soil (ground) gas. NOTE 3   
    The sampling methods, presented in this document may not be suitable for all types
    of soil e.g. peat with strong fibrous structure. NOTE 4    Some of the sampling
    methods presented in this document are suitable for both soil and rock. Water
    sampling for the purposes of quality control, quality characterisation and identification
    of sources of pollution of water, including bottom deposits and sludges, is not
    covered. NOTE 5    Water sampling for these purposes can be found in the ISO 5667
    series.'
