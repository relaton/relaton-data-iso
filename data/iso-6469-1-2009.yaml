abstract:
- language: en
  script: Latn
  content: ISO 6469-1:2009 specifies requirements for the on-board rechargeable energy
    storage systems (RESS) of electrically propelled road vehicles, including battery-electric
    vehicles (BEVs), fuel-cell vehicles (FCVs) and hybrid electric vehicles (HEVs),
    for the protection of persons inside and outside the vehicle and the vehicle environment.
    Flywheels are not included in the scope of ISO 6469-1:2009. ISO 6469-1:2009 does
    not apply to RESS in motorcycles and vehicles not primarily intended as road vehicles,
    such as material handling trucks or fork-lift trucks. ISO 6469-1:2009 applies
    only to RESS in on-board voltage class B electric circuits for vehicle propulsion.
    ISO 6469-1:2009 does not provide comprehensive safety information for manufacturing,
    maintenance and repair personnel.
