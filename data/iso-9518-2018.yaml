abstract:
- language: en
  script: Latn
  content: This document specifies the methodology for determining the kickback potential
    of gasoline-powered and electric-powered (including battery powered) chain-saws,
    complete with guide bar and saw-chain. This document has been demonstrated to
    be an accurate method of measurement for evaluating computed kickback angles and
    energy associated with chain-saw kickback for electric-powered chain-saws (including
    battery powered) and gasoline-powered chain-saws with engine capacity up to 80
    cm3. It is not intended to evaluate chain-saws with an engine capacity of above
    80 cm3. Furthermore, because of physical size limitations of the kickback machine,
    it is not intended for testing of units with guide bar cutting length in excess
    of 63 cm. Modifications to the methodology for determining the kickback potential
    introduced in this edition are aimed to have a better reproducibility of the results;
    test results obtained according to the previous methodology still maintain their
    validity.
