abstract:
- language: en
  script: Latn
  content: This document provides policy makers in governments, administration, non-profit
    and profit organizations with guidelines and a methodology for the development
    and implementation of a comprehensive policy concerning the planning and management
    of terminology. This document defines key concepts and describes scenarios and
    environments that can require different kinds of terminology policies. It also
    places terminology policies in the broader context of institutional strategic
    frameworks.
