abstract:
- language: en
  script: Latn
  content: 'This document specifies general requirements and guidance for metagenomics-dedicated
    sample preparation, and generating and analysing metagenomics sequence data obtained
    from massive parallel sequencing platforms. The specified metagenomics process
    includes the following stages: a)       sampling strategy and process, including
    type, storage, transportation, extraction, quality; b)       nucleic acid library
    preparation c)        design and review process including sequencing strategy
    and assessment; d)       database construction; e)       bioinformatics analysis
    and report f)         validation and verification for bioinformatics pipeline,
    and database This document applies to laboratories and research organizations.'
