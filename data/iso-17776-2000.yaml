abstract:
- language: en
  script: Latn
  content: La présente Norme internationale décrit quelques-uns des principaux outils
    et techniques qui sont d'un usage commun pour l'identification et l'évaluation
    des dangers associés aux activités d'exploration et de production en mer du pétrole
    et de gaz, comprenant les campagnes topographiques et sismiques, les opérations
    de forage et sur puits, le développement des champs, l'exploitation, le démantèlement
    et la mise au rebut des installations ainsi que le support logistique nécessaire
    à la réalisation de ces activités. Elle fournit des indications sur la manière
    dont on peut utiliser ces outils et techniques comme une aide au développement
    de stratégies, à la fois pour la prévention des événements dangereux et pour le
    contrôle et l'atténuation de tout événement qui peut survenir. La présente Norme
    internationale s'applique - aux structures fixes en mer ; - aux systèmes flottants
    de production, de stockage et de chargement - dans les industries du pétrole et
    du gaz naturel. La présente Norme internationale ne s'applique pas à la conception
    et à la construction des unités navales mobiles qui tombent sous la juridiction
    de l'Organisation Maritime Internationale. La présente Norme internationale n'a
    pas vocation à être utilisée comme élément des critères de certification et il
    convient de ne pas conclure à une faille dans le système de gestion des risques
    si aucun des outils et techniques couverts par la présente Norme internationale
    n'est appliqué à une installation.
