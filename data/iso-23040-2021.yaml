abstract:
- language: en
  script: Latn
  content: This document provides requirements and recommendations for conducting
    marine surveys of interstitial biota in marine sediments. It includes the specification
    of technical methods for the investigation of marine sediments, foraminifera,
    ostracoda, radiolaria, diatoms, coccoliths, sedimentary sporopollen, benthic viruses,
    benthic microbes (including bacteria, archaea and fungi), benthic microalgae,
    benthic protozoa and metazoan meiobenthos. This document is applicable to marine
    surveys in diverse benthic habitats at any seabed, such as benthic sediments of
    coastal zones, shallow seas, or deep-sea waters.
