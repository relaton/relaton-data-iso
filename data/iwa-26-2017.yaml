  content: IWA 26:2017 provides guidance on using ISO 26000:2010 to organizations
    that have implemented one or more ISO management system standards (MSS). It also
    provides guidance on how to apply a management system approach when using ISO
    26000:2010. It can be used in full or in part by an organization that has implemented
