abstract:
- language: en
  script: Latn
  content: ISO 13935-2:2014 specifies methods for the determination of seam maximum
    force of sewn seams when the force is applied perpendicularly to the seam. ISO
    13935-2:2014 describes the method known as the grab test. The method is mainly
    applicable to woven textile fabrics, including fabrics which exhibit stretch characteristics
    imparted by the presence of an elastomeric fibre, mechanical or chemical treatment.
    It may be applicable to fabrics produced by other techniques. It is not normally
    applicable to geotextiles, nonwovens, coated fabrics, textile-glass woven fabrics
    and fabrics made from carbon fibres or polyolefin tape yarns. The sewn fabrics
    may be obtained from previously sewn articles or may be prepared from fabric samples,
    as agreed by the parties interested in the results. This method is applicable
    to straight seams only and not to curved seams. The method is restricted to the
    use of constant rate of extension (CRE) testing machines.
