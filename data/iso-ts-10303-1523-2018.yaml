abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1523:2018-11 specifies the application module for Shape data
    quality criteria. The following are within the scope of ISO/TS 10303-1523:2018-11:
    representation of quality criteria for three dimensional product shape data coupled
    with measurement requirements for the evaluation of quality criteria and association
    with the pertinent assessment specifications. Quality criteria can be used for
    the representation of requirement, declaration of, or assurance of, product shape
    data quality. The target shape data models are equivalent to those defined in
    ISO 10303-42. NOTE 1   Detailed requirements for product shape data quality are
    application context-dependent. This part of ISO 10303 provides a means to select
    appropriate criteria with required thresholds.'
