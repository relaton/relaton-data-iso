abstract:
- language: en
  script: Latn
  content: This document specifies test procedures for the basic characteristics of
    performance, reliability and electrical functionality for the battery packs and
    systems for either high-power or high-energy application. Unless otherwise stated,
    the test applies to both applications. NOTE 1 Typical applications for high-power
    battery packs and systems are hybrid electric vehicles (HEVs) and some type of
    fuel cell vehicles (FCVs). NOTE 2 Typical applications for high-energy battery
    packs and systems are battery electric vehicles (BEVs), plug-in hybrid electric
    vehicles (PHEVs) and some type of fuel cell vehicles (FCVs). NOTE 3 Testing on
    cell level is specified in IEC 62660 series.
