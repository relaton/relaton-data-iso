abstract:
- language: en
  script: Latn
  content: This document specifies the CANopen-based interfaces for the fire-fighting
    equipment host controller and dedicated fire-fighting equipment units. Additionally,
    this document specifies process data mapped. The communication interfaces specified
    in this document are based on ISO 11898-1 and ISO 11898-2 (Controller Area Network)
    as well as the CANopen1 application layer as specified in DIN EN 50325-4 respectively
    CiA 301. Additionally, this document specifies process data mapped into PDO (process
    data object) messages as well as an optional mapping into the CANopen Object Dictionary.
    This document does not apply to the host controller gateway functionality to the
    in-vehicle network.
