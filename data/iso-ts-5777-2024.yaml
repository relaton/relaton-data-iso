abstract:
- language: en
  script: Latn
  content: 'This document provides the architecture of internet healthcare service
    network, including: —     overview of internet healthcare service network; —    
    infrastructure and deployment scheme of internet healthcare service network; —    
    security of internet healthcare service network. This document mainly focuses
    on the engineering architecture and infrastructure deployment of healthcare information
    transmission among various healthcare organizations through services, as shown
    in Figure 1. The implementation of information systems and healthcare services
    within organizations is demonstrated in Annex A. This document applies to the
    construction and application of internet healthcare service network.'
