abstract:
- language: en
  script: Latn
  content: This document specifies alternative measurement procedures for the determination
    of  volume of piston-operated volumetric apparatus. The procedures are applicable
    to complete systems comprising the basic apparatus and all parts selected for
    use with the apparatus, disposable or reusable, involved in the measurement by
    delivery process (Ex). Methods described in this document are suitable for various
    maximum nominal volumes of piston-operated volumetric apparatus. It is the responsibility
    of the user to select the appropriate method.
