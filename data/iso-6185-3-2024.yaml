abstract:
- language: en
  script: Latn
  content: 'This document specifies the minimum safety characteristics required for
    the design, materials, manufacture and testing of inflatable boats and rigid inflatable
    boats with a length of the hull LH in accordance with ISO 8666 less than 8 m with
    a motor power rating of 15 kW and greater. This document is applicable to the
    following types of boats intended for use within the operating temperatures of
    –20 °C to +60 °C: —     Type VII: Powered boats, fitted with a buoyancy tube on
    the port and starboard sides, suitable for navigation in conditions of design
    categories C and D. —     Type VIII: Powered boats, fitted with a buoyancy tube
    on the port and starboard sides, suitable for navigation in conditions of design
    category B. This document excludes single-chambered boats and boats with tubes
    made from unsupported materials, and does not apply to aquatic toys and inflatable
    liferafts. Boats with tubes made from aluminium, roto-moulded polyethylene, fibre
    reinforced plastic or other rigid materials are excluded from this document.'
