abstract:
- language: en
  script: Latn
  content: ISO 1874-2:2006 specifies the methods of preparation of test specimens
    and the test methods to be used in determining the properties of polyamide moulding
    and extrusion materials. Requirements for handling test material and for conditioning
    both the test material before moulding and the specimens before testing are given.
    Procedures and conditions for the preparation of test specimens and procedures
    for measuring properties of the materials from which these specimens are made
    are given. Properties and test methods that are suitable and necessary to characterize
    polyamide moulding and extrusion materials are listed.
