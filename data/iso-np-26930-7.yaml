abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the acceptance inspection of thermal spraying equipment in the case of powder feed units used in spray jobs to produce thermally sprayed coatings of reproducible quality. This part should be used in conjunction with ISO/NP 26930-1, which includes general requirements and explanations of procedures. This part should be used in addition to ISO/NP 26930-2 when carrying out acceptance inspection for flame and/or HVOF (high velocity oxygen-fuel) spraying equipment, or ISO/NP 26930-4 when carrying out acceptance inspection for plasma spraying equipment.
