abstract:
- language: en
  script: Latn
  content: 'The purpose of this document is to provide organizations with requirements
    to deliver high-quality healthcare and specifies requirements for management systems
    for quality in healthcare organizations when an organization desires to: a)      
    demonstrate its ability to consistently meet service user, stakeholder, and applicable
    statutory and regulatory requirements; b)       enhance service user experience
    during the continuum of care and continually improve healthcare quality; and c)       
    create and maintain processes that ensure timely, safe, effective, efficient,
    equitable, and people-centred care. The requirements of this document are based
    on recognized best practices and are intended to be applicable to any organization
    providing healthcare services, regardless of its type, size, or the services it
    provides.'
