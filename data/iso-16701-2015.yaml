abstract:
- language: en
  script: Latn
  content: ISO 16071:2015 specifies the test method, the reagents, and the procedure
    to be used in an accelerated atmospheric corrosion test constituting a 6 h exposure
    to a slightly acidified solution of 1 % NaCl twice weekly, followed by a condition
    of controlled humidity cycling between 95 % RH and 50 % RH at a constant temperature
    of 35 °C. It does not specify the dimensions of the tests specimens, the exposure
    period to be used for a particular product, or the interpretation of the results.
    Such details are provided in the appropriate product specifications. The accelerated
    laboratory corrosion test applies to metals and their alloys, metallic coatings
    (anodic or cathodic), chemical conversion coatings, and organic coatings on metallic
    materials.
