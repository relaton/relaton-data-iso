abstract:
- language: en
  script: Latn
  content: 'This document specifies two methods for the determination of the total
    sulfur in all types of carbon black for use in the rubber industry: —    Method A,
    using a combustion furnace; —    Method B, using an automatic analyser. With respect
    to safety aspects and test precision, it is preferable to use automatic systems.
    Method B is therefore the preferred method. Classical chemical analysis (Method A)
    is acceptable if automatic equipment is not available.'
