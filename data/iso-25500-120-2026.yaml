abstract:
- language: en
  script: Latn
  content: 'To verify data in support of local purchasing, this document specifies
    the requirements for formatting request types (resolve and search) and replies
    to those requests. The following are within the scope of this document: the syntax
    requirements and application protocol interface (API) for a request and response
    to a request for a harmonized system (HS) code formatted in accordance with ISO 8000-115
    and the dataset of an item that includes the characteristic data necessary to
    verify the HS code assigned to the item (resolve); the syntax requirements and
    API for a request and response to a request to verify the international facility
    identifier(s) for the origin of an item given an item identifier formatted in
    accordance with ISO 8000-115 (search); the methods used to capture the data required
    to determine the location of manufacturer or provision of services. The following
    are outside the scope of this document: the methods used for the resolution of
    ISO 8000-115 identifier to the ISO 8000-114 data set.'
