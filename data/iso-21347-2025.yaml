abstract:
- language: en
  script: Latn
  content: This document establishes general requirements for the application of fracture
    control technology to fracture-critical items (FCIs) fabricated from metallic,
    non-metallic or composite materials. It also establishes mechanical damage control
    requirements for mechanical-damage-critical items (MDCIs) fabricated from composite
    materials. These requirements, when implemented on a particular space system,
    can assure a high level of confidence in achieving safe operation and mission
    success. This document provides the minimum fracture control and mechanical damage
    control requirements for FCIs and MDCIs in general space systems, including launch
    vehicles, spacecraft and ground support equipment. With modifications, these requirements
    can also be applicable to reusable launch vehicles (RLVs). This document is not
    applicable to projects which already have a set of specific fracture and damage
    control requirements suitable for their special applications. This document is
    not applicable to processing detected defects.
