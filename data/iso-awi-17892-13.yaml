abstract:
- language: en
  script: Latn
  content: This document will specify methods for the determination of the swelling
    characteristics of soft rocks or hard soils in an oedometric cell, i.e. constraint
    lateral deformation with axial loading. This document is applicable to the laboratory
    determination of swelling pressure and strain within the scope of geotechnical
    investigations. Swelling test results are used for the design of rock and soil
    support and lining for excavation and tunneling in swelling rocks to prevent major
    unexpected damages due to swelling The swelling test is performed on an undisturbed
    cylindrical specimen of natural soil. The specimen is first loaded in the dry
    state to the in situ stress condition, unloaded and reloaded to the design stress
    of interest. The specimen is immersed under constant stress conditions and then
    unloaded. Several procedures adapted to different loading conditions are proposed.
