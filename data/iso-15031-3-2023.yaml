abstract:
- language: en
  script: Latn
  content: This document references the latest publication of SAE J1962. On-board
    diagnostic (OBD) regulations require road vehicles to be equipped with a standardized
    connector for purposes of access to OBD information by external test equipment.
    This document describes the requirements for the physical connection and associated
    pin usage to allow for standard access to the OBD data. This document is technically
    equivalent to SAE J1962 with the exception of the specific requirements identified
    and the specification of additional requirements related to right hand driven
    (RHD) vehicles.
