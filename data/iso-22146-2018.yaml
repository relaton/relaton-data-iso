abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the reactivity of calcium
    carbonate and calcium magnesium carbonate liming materials. It assesses the speed
    and effectiveness of their neutralising potential by automatic titration with
    citric acid. This method is applicable only to liming materials with a maximum
    particle size of 6,3 mm determined in accordance with ISO 20977. NOTE For marble
    dolomite (BET procedure as defined in ISO 9277 below 500 m2/kg), see EN 14984.
