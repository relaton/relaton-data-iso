abstract:
- language: en
  script: Latn
  content: This standard specifies the methods for testing and evaluating the performance
    of self-sealing flat-face couplings used in the fields of aerospace and data centers
    under pressures ranging from 0 to 300 psi, including test conditions, test equipment,
    test procedures and assessment of test results. Although this standard is mainly
    intended for such applications, if necessary, similar application scenarios in
    other fields, such as self-sealing flat-face couplings used in air circuit systems,
    fuel systems and water systems whose working pressures can be covered, can refer
    to and implement it accordingly.
