abstract:
- language: en
  script: Latn
  content: This document applies to the operation guideline for the collection and
    transportation of used traction batteries, including assessment, collection, packaging,
    transportation, loading, unloading and handling, temporary storage and other operations.
    Traction batteries refer to batteries that provide energy for power systems such
    as electric vehicles and machineries. This document is applicable to electric
    vehicles and industrial batteries, but not to portable batteries.
