abstract:
- language: en
  script: Latn
  content: ISO/TS 24530-4:2006 establishes the XML encoding of the method of the Public
    Transport Information application. The Public Transport Information application
    is intended to cover all modes of public (i.e. collective) transport as well as
    inter-urban and intra-urban travel. The application itself is designed to allow
    the efficient and language-independent transmission of public transport information
    either directly to an end-user, be it the public or another service provider,
    such as broadcasters, service operators or other information disseminating points,
    or to centres for onward transmission.
