abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for sampling airborne particles in
    the breathing zone of a person who performs welding and allied processes (the
    operator). It also provides details of relevant standards that specify required
    characteristics, performance requirements and test methods for workplace air measurement,
    and augments guidance provided in EN 689 on assessment strategy and measurement
    strategy. This document also specifies a procedure for making gravimetric measurements
    of personal exposure to airborne particles generated by welding and allied processes
    (welding fumes) and other airborne particles generated by welding-related operations.
    Additionally, it provides references to suitable methods of chemical analysis
    specified in other standards to determine personal exposure to specific chemical
    agents present in welding fumes and other airborne particles generated by welding-related
    operations.
