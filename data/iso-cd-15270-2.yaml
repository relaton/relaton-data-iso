abstract:
- language: en
  script: Latn
  content: This document specifies guidance for the recovery and recycling of plastics
    waste, focused on mechanical recycling technologies. The document establishes
    the different options for the recovery of plastics waste arising from pre-consumer
    and post-consumer sources. The document gives guidance on quality requirements
    for a recycled plastic material, but also for every single step in the mechanical
    recycling process. This document defines key performance indicators (KPI) to provide
    opportunities for the description and improvement of recycling technologies as
    well as to ensure efficient communication mainly between different recyclers and
    within the recycling industry, but also with their suppliers and customers. Descriptions
    of technologies and definitions are intended to be of general applicability.
