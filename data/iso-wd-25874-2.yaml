abstract:
- language: en
  script: Latn
  content: 'Type B1 Standard stating: Safety requirements that are common to service
    and industrial robotics. For the purpose of this document, industrial robotics
    are those used in an "industrial environment" which is a workplace where the public
    is excluded or restricted from access. Service robotics can be used with any age
    or ability and not limited to industrial environments. Exclusions: The following
    robotic applications and uses are out of scope of this document: • medical which
    are considered to be medical devices or components of medical devices; • industrial
    robotics covered by the ISO 10218 series; • service robotics covered by ISO 13482;
    • defence and military; • airborne robotics; • commercial and industrial floor-cleaning
    robots; • transportation or lifting of (a) person(s). The following hazards are
    not covered in this document: • severe conditions (e.g. extreme climates, freezer
    applications, strong magnetic fields); • corrosive or potentially explosive environments
    (dust, liquid, vapour or gas); • those related to use that is waterborne, underwater,
    or climbing; • nuclear environments; • those needing specific hygienic requirements;
    • ionizing and hazardous non-ionizing radiation; • when handling loads the nature
    of which can lead to dangerous situations (e.g., molten metals, acids/bases, radiating
    materials); • acoustic emissions.'
