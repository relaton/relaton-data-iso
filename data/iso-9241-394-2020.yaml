abstract:
- language: en
  script: Latn
  content: This document establishes the requirements and recommendations for image
    contents and electronic display systems to reduce visually induced motion sickness
    (VIMS), while viewing images on electronic displays. This document is applicable
    to electronic display systems, including flat panel displays, projectors with
    a screen, and virtual reality (VR) type of head mounted displays (HMDs), but not
    including HMDs that present electronic images on/with real-world scenes. NOTE
    1 This document assumes the images are viewed under appropriate defined conditions.
    See Annex B for the appropriate viewing conditions. NOTE 2 This document is useful
    for the design, development, and supply of image contents, as well as electronic
    displays for reducing VIMS. NOTE 3 ISO 9241‑392[3] provides guidelines for stereoscopic
    3D displays, of which the methods are also used in HMDs. NOTE 4 The International
    Telecommunication Union (ITU) generally sets the standards for broadcasting.
