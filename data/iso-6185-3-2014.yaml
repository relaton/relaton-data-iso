abstract:
- language: en
  script: Latn
  content: 'ISO 6185-3:2014 specifies the minimum safety characteristics required
    for the design, materials to use, manufacture and testing of inflatable boats
    and rigid inflatable boats with a hull length in accordance with ISO 8666 less
    than 8 m with a motor power rating of 15 kW and greater. ISO 6185:2014 is applicable
    to the following types of boats intended for use within the operating temperatures
    of -20 °C to +60 °C: Type VII: Powered Boats (with power ≥ 15 kW) fitted with
    a buoyancy tube attached to the port and starboard sides, suitable for navigation
    in conditions of Design Categories C and D and capable of installing motor power
    rating of 15 kW and greater. Type VIII: Powered Boats (with power > 75 kW) fitted
    with a buoyancy tube attached to the port and starboard sides, suitable for navigation
    in conditions of Design Category B capable of installing motor power rating of
    75 kW and greater. ISO 6185:2014 excludes single-chambered boats and boats made
    from unsupported materials, and is not applicable to aquatic toys and inflatable
    liferafts.'
