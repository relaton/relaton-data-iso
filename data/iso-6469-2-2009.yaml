abstract:
- language: en
  script: Latn
  content: ISO 6469-2:2009 specifies requirements for operational safety means and
    protection against failures related to hazards specific to electrically propelled
    road vehicles, including battery-electric vehicles (BEVs), fuel-cell vehicles
    (FCVs) and hybrid electric vehicles (HEVs), for the protection of persons inside
    and outside the vehicle and the vehicle environment. ISO 6469-2:2009 does not
    apply to motorcycles and vehicles not primarily intended as road vehicles, such
    as material handling trucks or fork-lift trucks. Requirements related to internal
    combustion engine (ICE) systems of HEVs are not covered in ISO 6469-2:2009. ISO
    6469-2:2009 applies only if the maximum working voltage of the on-board electrical
    propulsion system is lower than the upper voltage class B limit. ISO 6469-2:2009
    does not provide comprehensive safety information for manufacturing, maintenance
    and repair personnel.
