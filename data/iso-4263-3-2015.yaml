abstract:
- language: en
  script: Latn
  content: ISO 4263-3:2015 specifies a method for the determination of the ageing
    behaviour of synthetic hydraulic fluids of categories HFDU, HEES, HEPG and HETG
    as defined, for example, in ISO 12922[1] and ISO 15380[2]. The ageing is accelerated
    by the presence of oxygen and metal catalysts at elevated temperature, and the
    degradation of the fluid is followed by changes in acid number. Other parts of
    ISO 4263 specify similar procedures for the determination of ageing behaviour
    of mineral oils and specified categories of fire-resistant fluids used in hydraulic
    and other applications. NOTE Other signs of fluid deterioration, such as the formation
    of insoluble sludge, catalyst coil corrosion or change in viscosity, can occur
    which indicate oxidation of the fluid, but are not reflected in the calculated
    oxidation lifetime. The correlation of these occurrences with field service is
    under investigation. This test method may be used to compare the oxidation stability
    of fluids that are not prone to contamination with water. However, because of
    the large number of individual field-service applications, the correlation between
    the results of this test and actual service performance can vary markedly, and
    is best judged on experience. The precision of this test method for synthetic
    hydraulic fluids is not known because interlaboratory data are not available.
    This method might not be suitable for use in specifications or in the event of
    disputed results as long as these data are not available.
