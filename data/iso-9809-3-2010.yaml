abstract:
- language: en
  script: Latn
  content: ISO 9809-3:2010 specifies minimum requirements for the material, design,
    construction and workmanship, manufacturing processes, examination and testing
    at manufacture of refillable normalized or normalized and tempered seamless steel
    gas cylinders of water capacities from 0,5 l up to and including 150 l for compressed,
    liquefied and dissolved gases. If desired, cylinders of water capacity less than
    0,5 l can be manufactured and certified to be in compliance with ISO 9809-3:2010.
