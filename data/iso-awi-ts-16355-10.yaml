abstract:
- language: en
  script: Latn
  content: The proposed scope of this part of the ISO 16355 Series is to include descriptions
    of examples of how the methods and processes for both systems thinking and systems
    engineering (design, development, deployment, operation, upgrade, decommissioning)
    of complex systems i.e. those integrating products, software, services, communications,
    human activity and business models, can synergistically strengthen the QFD methods
    described in Parts 1 to 9 of ISO16355. This will include the way that these synergies
    can enhance each phase of the systems lifecycle, including conception, development,
    production, utilization, support and retirement of systems, and to the acquisition
    and supply of systems, whether performed internally or externally to an organization.
