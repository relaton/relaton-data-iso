abstract:
- language: en
  script: Latn
  content: 'This document gives the terminology and basic concepts of association,
    including objective functions and association constraints and material offset.
    This document is not intended to specify association defaults and GPS syntax which
    are introduced in other (ISO GPS) International Standards. NOTE            The
    association can be used to establish for example: —      a datum; —      a reference
    feature for a geometrical specification or for a surface texture specification;
    —      an associated toleranced feature; —      any dimensional characteristic;
    —      an intersection plane, an orientation plane, a collection plane or a direction
    feature.'
