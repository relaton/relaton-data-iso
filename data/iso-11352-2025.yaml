abstract:
- language: en
  script: Latn
  content: This document specifies approaches for the estimation of measurement uncertainty
    of chemical and physicochemical methods in single laboratories based on validation
    data and quality control data obtained within the field of water analysis. However,
    this approach can also be used in many other areas of chemical analysis. NOTE 1       
    The principles of the estimation of uncertainty specified in this document are
    consistent with the principles described in ISO/IEC Guide 98-3. In this document,
    the quantification of measurement uncertainty relies on performance characteristics
    of a measurement procedure obtained from validation and the results of internal
    and external quality control. NOTE 2        The approaches specified in this document
    are mainly based on Nordtest TR 537[3], but also QUAM[4], and Eurolab TR 1/2007[2].
    NOTE 3        This document only addresses the evaluation of measurement uncertainty
    for results obtained from quantitative measurement procedures. The uncertainties
    associated with results obtained from qualitative procedures are not considered.
