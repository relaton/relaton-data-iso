abstract:
- language: en
  script: Latn
  content: This document gives guidelines for the design of sampling programmes, techniques
    and the handling and preservation of samples of water, from natural and man-made
    lakes during open-water and ice-covered conditions. This document is applicable
    to lakes with and without aquatic vegetation. Guidance on sampling for microbiological
    examination is not included. For specific guidance on the sampling for microplastics,
    see ISO 5667-27.
