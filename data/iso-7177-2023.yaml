abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements and test methods for Coptis
    rhizome (the dried rhizome of Coptis chinensis Franch. and Coptis japonica Makino.).
    This document applies to Coptis rhizome sold and used as Chinese materia medica
    (whole medicinal materials) and decoction pieces derived from these plants. This
    document does not apply to the processed Coptis rhizome, including products traditionally
    processed with different methods, or its processing methods.
