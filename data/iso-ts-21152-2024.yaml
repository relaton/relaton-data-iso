abstract:
- language: en
  script: Latn
  content: This document provides technical and management guidance for water conservation
    of indirect open recirculating cooling water systems in thermal power plants.
    It is applicable to circulating cooling systems that use surface water, underground
    water, reclaimed water, and treated domestic sewage from thermal power plant as
    the make-up water and use physicochemical treatment methods to increase cycles
    of concentration, thus realizing water conservation and increasing water use efficiency.
    This document is applicable to recirculating cooling in thermal power plants fuelled
    by coal, oil, natural gas, and biomass.
