abstract:
- language: en
  script: Latn
  content: ISO 11563:2003 establishes procedures to achieve the fullness of a pipeline
    system. ISO 11563:2003 is applicable to crude oils and petroleum products which
    are liquid at atmospheric pressure and at the observed temperature. It can be
    applied to loading, discharges and movements between local storage tanks. It is
    not the intention of this standard to recommend practices for transcontinental
    movements.
