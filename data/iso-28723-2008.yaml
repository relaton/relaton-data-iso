abstract:
- language: en
  script: Latn
  content: ISO 28723:2008 specifies a test method for the determination of the covering
    of the edge of enamelled steel plate to be used in heat exchangers. This method
    is applicable to all enamelling processes. It is applicable to plates with a thickness
    between 0,5 mm and 1,5 mm. The method is not applicable where the current flow
    generated in the test exceeds 3 A.
