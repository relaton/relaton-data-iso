abstract:
- language: en
  script: Latn
  content: Micro-cathode arc propulsion module (μCAPM) is a miniature electric propulsion
    system that generates impulse for satellite attitude and orbit control. This document
    provides the specification of micro-cathode arc propulsion module (μCAPM) for
    cubesats utilizations. It defines the requirements of the product, including the
    function, interface, performance indication, etc. It provides testing items and
    requirements of the products. It also provides suggestions for product delivery,
    transportation and storage, and related activities.
