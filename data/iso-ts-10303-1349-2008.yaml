abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1349:2008 specifies the application module for Incomplete
    data reference mechanism. The following are within the scope of ISO/TS 10303-1349:2008:
    marking of product data, indicating that they are partially provided in the data
    exchange structure; items within the scope of application module Classification
    assignment, ISO/TS 10303-1114; items within the scope of application module Document
    definition, ISO/TS 10303-1123; items within the scope of application module Part
    view definition, ISO/TS 10303-1023.'
