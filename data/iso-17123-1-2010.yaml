abstract:
- language: en
  script: Latn
  content: ISO 17123-1:2010 gives guidance to provide general rules for evaluating
    and expressing uncertainty in measurement for use in the specifications of the
    test procedures of ISO 17123-2, ISO 17123-3, ISO 17123-4, ISO 17123-5, ISO 17123-6,
    ISO 17123-7 and ISO 17123-8. ISO 17123-2, ISO 17123-3, ISO 17123-4, ISO 17123-5,
    ISO 17123-6, ISO 17123-7 and ISO 17123-8 specify only field test procedures for
    geodetic instruments without ensuring traceability in accordance with ISO/IEC
    Guide 99. For the purpose of ensuring traceability, it is intended that the instrument
    be calibrated in the testing laboratory in advance. ISO 17123-1:2010 is a simplified
    version based on ISO/IEC Guide 98‑3 and deals with the problems related to the
    specific field of geodetic test measurements.
