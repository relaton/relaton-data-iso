abstract:
- language: en
  script: Latn
  content: ISO 10498:2004 describes an ultraviolet fluorescence method for sampling
    and determining sulfur dioxide (SO2) concentrations in the ambient air using automatic
    analysers. ISO 10498:2004 is applicable to the determination of sulfur dioxide
    mass concentrations of a few micrograms per cubic metre to a few milligrams per
    cubic metre or, expressed in terms of volume fraction, from a few microlitres
    per cubic metre to a few millilitres per cubic metre.
