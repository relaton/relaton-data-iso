abstract:
- language: en
  script: Latn
  content: This document specifies in-vehicle Ethernet application layer, presentation
    layer, and session layer conformance test plans (CTP) for electronic control units
    (ECUs). This document is a collection of all conformance test cases which are
    recommended to be considered for automotive use and should be referred by car
    manufacturers within their quality control processes. The document specifies the
    scalable Service-Oriented MiddlewarE over Internet Protocol (SOME/IP) and Dynamic
    Host Configuration Protocol (DHCP) version 4 conformance test cases.
