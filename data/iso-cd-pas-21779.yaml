abstract:
- language: en
  script: Latn
  content: 'This document specifies test methods to evaluate the behavior of a vehicle
    equipped with acceleration control pedal error system ACPE according to ISO PAS
    19486. Those forward and reverse accidents occur during a straight-line acceleration
    when the vehicle under test (VUT) accelerates due to driver misapplication of
    accelerator pedal instead of intended brake pedal. This standard is limited to
    ACPE Systems of light vehicles only classified in UN-ECE (TRANS/WP.29/1045) Vehicle:
    “Category 1-1 vehicle” and does not apply to such devices installed in vehicles
    of other categories, such as heavy vehicles or motorcycles. The most important
    part of the vehicle behavior during these collision scenarios is the capacity
    to avoid or mitigate the collision especially to the other vehicle in this standard.'
