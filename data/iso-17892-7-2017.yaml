abstract:
- language: en
  script: Latn
  content: ISO 17892-7:2017 specifies a method for the unconfined compression test.
    ISO 17892-7:2017 is applicable to the determination of the unconfined compressive
    strength for a homogeneous specimen of undisturbed, re-compacted, remoulded or
    reconstituted soil under compression loading within the scope of geotechnical
    investigations. This test method is useful to estimate the undrained shear strength
    of soil. It is noted that drainage is not prevented during this test. The estimated
    value for undrained shear strength is, therefore, only valid for soils of low
    permeability, which behave sufficiently undrained during the test. NOTE This document
    fulfils the requirements of unconfined compression tests for geotechnical investigation
    and testing in accordance with EN 1997‑1 and EN 1997‑2.
