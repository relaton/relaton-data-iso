abstract:
- language: en
  script: Latn
  content: ISO 2178:2016 specifies a method for non-destructive measurements of the
    thickness of non-magnetizable coatings on magnetizable base metals. The measurements
    are tactile and non-destructive on typical coatings. The probe or an instrument
    with integrated probe is placed directly on the coating to be measured. The coating
    thickness is displayed on the instrument. In ISO 2178:2016 the term "coating"
    is used for material such as, for example, paints and varnishes, electroplated
    coatings, enamel coatings, plastic coatings, powder coatings, claddings. NOTE
    This method can also be applied to the measurement of magnetizable coatings on
    non-magnetizable base metals or other materials (see ISO 2361).
