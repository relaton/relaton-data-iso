abstract:
- language: en
  script: Latn
  content: This international standard specifies requirments relating to chromate
    conversion coatings on zinc and cadmium intended to give protection against corrosion
    and to provide alkaline-resistant,dark stain-resistant, heat-resistant, etc. It
    also includes test methods for measuring the trivalent or hexavalent chromium
    coating weight and the total Cromium coating weight. Finishes for giving particular
    colours only or specifically to improve paint adhesion are not covered by this
    international standard.
