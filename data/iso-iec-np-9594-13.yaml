abstract:
- language: en
  script: Latn
  content: The proposed standard is intended to be a new part of the ISO/IEC 9594
    series. It will be developed as collaborative work with ITU-T Study Group 17.
    It is intended to be developed as common text and is expected also to be part
    of the ITU-T X.500 series of Recommendations. The scope is to develop a specification
    for a Decentralized Public-Key Infrastructure (DPKI) based on the blockchain technology
    allowing a worldwide PKI where trust is established by consensus.
