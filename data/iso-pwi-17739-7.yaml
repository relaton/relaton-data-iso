abstract:
- language: en
  script: Latn
  content: This document specifies the functional requirements and data exchange procedures
    of roadside infrastructure supported location-based safety services for ensuring
    vehicle and VRU safety while approaching to the poor visible sections of roads
    and/or streets of entering and exiting to building, parking garage, underpass,
    tunnel, bridge, etc. by providing the status conditions in advance, which include
    not only physically limited visibility areas, but also the areas of sudden changes
    of visibility due to the weather conditions.
