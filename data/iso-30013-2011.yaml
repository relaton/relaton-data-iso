abstract:
- language: en
  script: Latn
  content: ISO 30013:2011 specifies methods for the exposure of rubber and plastics
    hoses to three types of laboratory light source (xenon-arc, fluorescent UV and
    open-flame carbon-arc lamps). These methods are designed to simulate the exposure
    of hoses used in an outdoor environment or in an indoor environment. Four types
    of test piece (two strained and two unstrained upon exposure) are specified. Results
    from the three light sources and the different sets of exposure conditions specified
    are not comparable.
