abstract:
- language: en
  script: Latn
  content: Specifies a procedure for water. Sea water and waters containing bromides
    and iodides comprise a group for which special procedures are required. The procedure
    is applicable to concentrations, in terms of chlorine, from 0,000 4 to 0,07 mmol/l
    total chlorine and at higher concentrations by dilution of samples. Several compounds
    influencing the procedure are noted.
