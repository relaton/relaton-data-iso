abstract:
- language: en
  script: Latn
  content: 'This document specifies two methods for the determination of ceramic fibre
    density. These methods are applicable to both continuous and discontinuous ceramic
    fibre, including oxide and non-oxide ceramic fibre. Two methods are proposed for
    the determination of ceramic fibre density, as follows: — Method A: buoyancy method.
    — Method B: helium pycnometer method.'
