abstract:
- language: en
  script: Latn
  content: 'This document specifies a fundamental principle on grid square statistics
    and includes the following: —     To define or specify a set of methods that can
    be recommended as the standard method to enable policy decisions based on common
    recognition from grid statistics produced with different grid square reference
    system standards in different countries and areas that can have different geographic
    coding systems with different geometric shapes. —     To standardize methods to
    accommodate the conversion calculation among grid statistics with different grid
    square reference systems having different geometric shapes by employing prorating
    method based on the grid areas as well as the method to calculate the approximation
    errors, for exchanging the converted grid statistics. Spatial expressions other
    than grid square also exist, but this document does not apply to the spatial expressions
    other than grid square. NOTE            Clause 4 and Clause 5 define grid square
    statistics and specify some methods to generate grid square statistics. Clause 6
    recommends conversion methods between grid square statistics generated based on
    different grid square reference systems.'
