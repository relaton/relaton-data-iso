abstract:
- language: en
  script: Latn
  content: ISO 15636:2003 specifies the design and dimensions of back-up pads intended
    for the fixing or clamping of vulcanized fibre discs in accordance with ISO 16057,
    or comparable grinding tools on hand-held grinding machines, e.g. angle grinders.
    The connecting dimensions of support discs and clamping units are matched for
    spindle ends with the common practice of this kind of hand-held machine.
