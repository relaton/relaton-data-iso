abstract:
- language: en
  script: Latn
  content: This standard establishes requirements and recommendations on methods for
    measuring linear accelerations lasting 0.2 seconds or more, acting on passengers
    of mechanized rides. The general provisions of this standard contain requirements
    for measuring instruments, a description of measurement procedures. This standard
    can be used to measure the accelerations of some non-mechanized water attractions
    (for example, water slides).
