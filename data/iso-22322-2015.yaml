abstract:
- language: en
  script: Latn
  content: ISO 22322:2015 provides guidelines for developing, managing, and implementing
    public warning before, during, and after incidents. This International Standard
    is applicable to any organization responsible for public warning. It is applicable
    at all levels, from local up to international. Before planning and implementing
    the public warning system, risks and consequences of potential hazards are assessed.
    This process is not part of this International Standard.
