abstract:
- language: en
  script: Latn
  content: This document specifies the operational and maintenance requirements for
    self-elevating unit jacking systems under various working conditions. This document
    applies to the hydraulic yoke and pin jacking systems, hydraulic rack-and-pinion
    jacking systems, and electric rack-and-pinion jacking systems. For other types
    of offshore Unit jacking systems not explicitly covered in this document, reference
    may still be made to the provisions herein.
