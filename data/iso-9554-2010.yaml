abstract:
- language: en
  script: Latn
  content: ISO 9554:2010 specifies the general characteristics of fibre ropes and
    their constituent materials. It is intended to be used in conjunction with the
    standards for the individual types of fibre rope, which cover the physical properties
    and specific requirements for that particular product type. ISO 9554:2010 also
    gives some information on the use of fibre ropes and also on their inspection
    and retirement criteria. ISO 9554:2010 does not intend to address all of the safety
    matters associated with its use. It is the responsibility of the user to select
    a rope type of the size and with the physical properties to meet the requirements
    of the application and to determine the applicability of regulatory limitations
    prior to its use.
