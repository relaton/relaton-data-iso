abstract:
- language: en
  script: Latn
  content: 'This document is Part 1 of a series of standards, defining the roles,
    role architecture, functional models, emergency handling mechanisms, and typical
    scenarios involved in the application of artificial intelligence (AI) and big
    data technologies for urban mobility services. The following content were included
    in the scope of this document: a) Basic role models, operation layer role models,
    support layer role models , and booking and payment layer role and function model
    in AI and big data application services; b) The role architecture of various stakeholders
    involved in providing AI and big data application services, along with their respective
    responsibilities and obligations; c) Typical scenarios for providing AI and big
    data application services.'
