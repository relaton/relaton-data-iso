abstract:
- language: en
  script: Latn
  content: ISO 21438-3:2010 specifies a method for the determination of the time-weighted
    average mass concentration of soluble particulate fluorides and hydrofluoric acid
    (HF) in workplace air by collection of the particulate fluorides on a pre-filter
    and HF on an alkali-impregnated filter and analysis by ion chromatography. The
    method is only applicable to determination of particulate fluorides that are soluble
    using the sample preparation procedure specified. For aerosol sampling, the method
    is applicable to the personal sampling of the inhalable fraction of airborne particles,
    as defined in ISO 7708, and to static (area) sampling. The method is applicable
    to the determination of masses of 0,005 mg to at least 1,25 mg of particulate
    fluorides per sample and 0,012 5 mg to at least 1,2 mg of HF per sample. The concentration
    range of particulate fluorides and HF in air for which the measuring procedure
    is applicable is determined by the sampling method selected by the user. For a
    120 l air sample, the working range is approximately 0,04 mg m-3 to at least 10
    mg m-3 for particulate fluorides and approximately 0,13 mg m-3 to at least 10
    mg m-3 for HF. HF can react with co-sampled particulate matter on the pre-filter,
    causing an interference on the measured concentration.
