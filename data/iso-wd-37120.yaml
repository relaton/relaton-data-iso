abstract:
- language: en
  script: Latn
  content: This document defines and establishes methodologies for a set of indicators
    to steer and measure the performance of city services and quality of life. It
    follows the principles set out in ISO 37101 and can be used in conjunction with
    ISO 37101 and other strategic frameworks. This document is applicable to any city,
    municipality or local government that undertakes to measure its performance in
    a comparable and verifiable manner, irrespective of size and location.
