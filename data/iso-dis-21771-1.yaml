abstract:
- language: en
  script: Latn
  content: This document specifies the geometric concepts and parameters for cylindrical
    gears with involute helicoid tooth flanks. Flank modifications are included. The
    formulae in this document apply to all pressure angles. It also covers the concepts
    and parameters for involute cylindrical gear pairs with parallel or crossed axes,
    and a constant gear ratio. Gear and mating gear in these gear pairs have the same
    basic rack tooth profile.
