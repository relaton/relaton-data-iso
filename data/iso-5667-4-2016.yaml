abstract:
- language: en
  script: Latn
  content: ISO 5667-4:2016 gives guidelines for the design of sampling programmes,
    techniques and the handling and preservation of samples of water, from natural
    and man-made lakes during open-water and ice-covered conditions. It is applicable
    to lakes with and without aquatic vegetation. Guidance on sampling for microbiological
    examination is not included.
