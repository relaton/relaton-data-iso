abstract:
- language: en
  script: Latn
  content: 'This document establishes the steps of the overall process of pipeline
    rehabilitation, comprising: strategic and tactical activities: investigation and
    condition assessment of the existing pipeline; pipeline rehabilitation planning;
    operational activities: project specification; applications of techniques; documentation
    of the design and application process. This document defines general terms of
    pipeline rehabilitation and establishes the classification of families of renovation
    and trenchless replacement techniques, with description of their respective features.
    This document is applicable to underground drains and sewers and underground water
    and gas supply networks. This document does not apply to: new construction provided
    as network extensions; calculation methods to determine, for each viable technique,
    the characteristics of lining or replacement pipe material needed to secure the
    desired performance of the rehabilitated pipeline; techniques providing non-structural
    pipe liners; techniques for repair.'
