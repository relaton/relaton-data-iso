abstract:
- language: en
  script: Latn
  content: ISO 23537-1:2016 specifies the requirements and test methods as well as
    provisions for labelling of adult sized sleeping bags for use in sports and leisure
    time activities. ISO 23537-1:2016 does not apply to sleeping bags intended for
    specific purpose such as military use and extreme climate zone expedition. It
    does not apply to sleeping bags for children or babies. NOTE 1 No prediction model
    exists for the determination of the limiting temperatures based on the thermal
    resistance of the sleeping bag for children and babies. Moreover, such a model
    for testing cannot be developed because the necessary controlled sleep trials
    with children or babies in climatic chambers are, out of ethical reasons, not
    permitted. NOTE 2 The limit temperature for extreme climate conditions is seen
    to be −20 °C. ISO 23537-1:2016 describes the method for the assessment of the
    performance in steady-state conditions of a sleeping bag with regard to the protection
    against cold. NOTE 3 Sleeping bags without homogeneous fillings designed to provide
    local extra insulation in certain parts pose issues with the calibration and/or
    test procedure. Ongoing work continues to provide suitable means of establishing
    temperature ratings.
