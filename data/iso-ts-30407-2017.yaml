abstract:
- language: en
  script: Latn
  content: The purpose of Cost-Per-Hire (CPH) is to measure the economic value of
    the effort taken to fill an open position in an organization. ISO/TS 30407:2017
    describes actions to be taken when calculating CPH to maintain quality and transparency,
    including creating a representative data set, using a transparent source of data,
    minimizing data errors and ensuring that periodic audits of processes occur on
    data input. Central to CPH as described in ISO/TS 30407:2017 are the features
    of the visual display of the metric, emphasizing transparency of data inputs,
    processes and the formula used within the metric.
