abstract:
- language: en
  script: Latn
  content: ISO 11898-3:2006 specifies characteristics of setting up an interchange
    of digital information between electronic control units of road vehicles equipped
    with the controller area network (CAN) at transmission rates above 40 kBit/s up
    to 125 kBit/s. The CAN is a serial communication protocol which supports distributed
    control and multiplexing.
