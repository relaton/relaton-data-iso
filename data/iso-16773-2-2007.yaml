abstract:
- language: en
  script: Latn
  content: 'ISO 16773-2:2007 provides guidance on optimizing the collection of EIS
    data from high-impedance systems. High impedance in the context of intact coatings
    refers to systems with an impedance greater than 109 ohm·cm2. This does not preclude
    measurements on systems with lower impedance. ISO 16773-2:2007 deals with instrumental
    set-up: requirements and pit-falls; data validation: checking the measurement
    range and the accuracy of the data; performing an EIS measurement: specimen considerations
    and instrumental parameters; the experimental results: different methods of presenting
    EIS data. It does not give guidelines for the interpretation of the data.'
