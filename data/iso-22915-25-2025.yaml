abstract:
- language: en
  script: Latn
  content: 'This document specifies static tests for verifying the stability of non-slewing
    rough-terrain variable-reach trucks (hereafter referred to as non-slewing trucks)
    and slewing rough-terrain variable-reach trucks (hereafter referred to as slewing
    trucks) as defined in ISO 5053-1, operating in the special condition of handling
    freely suspended loads. Both non-slewing trucks and slewing trucks are hereafter
    referred to as trucks. This document applies to trucks fitted with a lifting attachment
    or lifting point when used in the following applications: —     picking and placing
    loads (stationary operation) on substantially firm, smooth, level, and prepared
    surfaces; —     travelling with load on unimproved natural terrain and disturbed-terrain
    with slopes not exceeding limits determined by the manufacturer, at travel speeds
    not exceeding 4 km/h and with boom angle and extension not exceeding the manufacturer''s
    limits. This document does not deal with hazards that can occur due to the action
    of the wind on loads. It is not applicable to those trucks: —     designed for
    handling freight containers; —     with an articulating chassis; —     equipped
    with integrated or non-integrated personnel work platforms; —     with a work
    platform suspended from the extending structure.'
