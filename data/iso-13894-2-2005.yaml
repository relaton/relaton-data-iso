abstract:
- language: en
  script: Latn
  content: ISO 13894-2:2005 describes the general properties of composite elements
    surfaced, and possibly edged, with high-pressure decorative laminate (HPDL). The
    composite elements specified consist of HPDL sheet material adhesively bonded
    to one or both sides of a wood-based substrate, and are intended for normal interior
    use. Requirements for special applications, e.g. where the product is subjected
    to extreme conditions of heat or moisture, are not specified.
