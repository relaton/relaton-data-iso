abstract:
- language: en
  script: Latn
  content: This document specifies testing procedures for the instrumental determination
    of brightness and colour of tissue paper and tissue products viewed under outdoor
    daylight conditions. It also gives specific instructions for the preparation of
    test pieces (single-ply, multi-ply products) and for the optical measurements
    of products, where special precautions can be necessary. NOTE       The properties
    called ISO brightness and colour with C/2° (indoor daylight) are measured with
    an instrument adjusted to a much lower UV content than that specified in this
    document. The measurements of ISO brightness and colour with C/2° (indoor daylight)
    are described in ISO 12625-15.
