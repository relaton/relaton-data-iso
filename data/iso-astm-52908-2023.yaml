abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the qualification, quality assurance
    and post processing for metal parts made by powder bed fusion. This document specifies
    methods and procedures for testing and qualification of various characteristics
    of metallic parts made by additive manufacturing powder bed fusion processes,
    in accordance with ISO/ASTM 52927, categories H and M. This document is intended
    to be used by part providers and/or customers of parts. This document specifies
    qualification procedures where appropriate to meet defined quality levels.
