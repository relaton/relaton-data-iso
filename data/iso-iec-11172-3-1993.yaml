- language: en
  script: Latn
  content: Specifies the coded representation of high quality audio for storage media
    and the method for decoding of high quality audio signals. Is intended for application
    to digital storage media providing a total continuous transfer rate of about 1,5
    Mbit/s for both audio and video bitstreams, such as CD, DAT and magnetic hard
    disc, and for sampling rates of 32 kHz, 44,1 kHz, and 48 kHz.
