abstract:
- language: en
  script: Latn
  content: 'This document is part of a series and defines general rules including
    role and function models for guiding and to introduce, build and evaluate smart
    operation and maintenance in various types of urban mobility and transportation.
    This document mainly describes some basic requirements of smart operation and
    maintenance of urban transportation system for sustainable development. Mainly
    includes: a) Terms and definitions b) Basic function settings c) Basic support
    conditions d) Roles and function models The basic requirements specified in this
    document are applicable to sustainable cities that urgently need to improve the
    operation and maintenance efficiency of transportation systems, especially super-large
    cities and cities with limited compact land resources and high requirements for
    efficiency'
