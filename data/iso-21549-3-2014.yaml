abstract:
- language: en
  script: Latn
  content: ISO 21549-3:2014 is applicable to situations in which limited clinical
    data are recorded on or transported by patient healthcards compliant with the
    physical dimensions of ID-1 cards defined by ISO/IEC 7810. ISO 21549-3:2014 describes
    and defines the limited clinical data objects used in or referenced by patient
    healthcards using UML, plain text and abstract syntax notation (ASN.1). ISO 21549-3:2014
    specifies the basic structure of the data contained within the data object limited
    clinical data, but does not specify or mandate particular data sets for storage
    on devices.
