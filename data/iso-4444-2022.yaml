abstract:
- language: en
  script: Latn
  content: 'This document defines requirements on the electronic measurements (during
    spray operation) and recording of operator-controlled application parameters that
    influence spray drift, when specified for certain drift reduction technologies
    (DRT). The values measured and recorded can be used to compare the setting of
    the sprayer with the provisions authorized for the specific DRT. The document
    is applicable for sprayers for both field and tree and bush crops. It does not
    apply to hand held and portable sprayers. The following parameters are covered
    in this document: a) spray pressure (pressure of the spray liquid and air in case
    of twin-fluid nozzles); b) nozzle height (field crop sprayers); c) fan rotational
    speed (for air assisted sprayers); d) sprayer forward speed. This document does
    not specify: —    the exact length of the recording period; —    the verification
    of the measured and recorded parameters; —    the requirements for data format
    and exchange because they are covered by other ISO standards. This document does
    not specify which of the four parameters needs to be monitored.'
