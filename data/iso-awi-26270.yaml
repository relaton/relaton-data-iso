abstract:
- language: en
  script: Latn
  content: This document specifies minimum design, performance, testing and labelling
    requirements for tool container, tool attachment, tool tether and tool anchor
    attachment that reduce dropped objects incidents in industrial and occupational
    settings. Dropped objects include hand tools, instrumentation and other items
    that have to be transferred and used at heights. These objects have the opportunity
    of becoming dropped objects potentially resulting in struck-by injury or fatality
    or damage to equipment. This document is not used for the regulation of harness
    that used to protect workers from falling from a height.
