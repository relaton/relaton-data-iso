abstract:
- language: en
  script: Latn
  content: The management of electronic traffic regulations (METR) provides trustworthy,
    authoritative, machine-interpretable, transport-related rules for using the road
    network. This document defines the requirements for each of the component systems
    that make up the METR system of systems (SoS), including the METR regulation system,
    METR distribution system, METR consumer system, and METR discrepancy handling
