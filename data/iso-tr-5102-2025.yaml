abstract:
- language: en
  script: Latn
  content: This document presents the main differences between the standards for working
    towers made of prefabricated elements in some regions and countries. It provides
    an analysis of different aspects, including product title, material performance,
    grade division, dimension requirements, product structure and design, test methods
    and fall prevention measures. This document gives guidance for the discussion
    of relevant technologies of working towers made of fibre-reinforced plastics,
    and also prepares for further development of applicable global technical standards
    for working towers.
