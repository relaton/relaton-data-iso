abstract:
- language: en
  script: Latn
  content: ISO 21813 specifies methods for the chemical analysis of fine high purity
    barium titanate powders used as the raw material for fine ceramics. ISO 21813
    stipulates the determination methods of the barium, titanium, aluminium, cadmium,
    calcium, cobalt, dysprosium, iron, lead, magnesium, manganese, nickel, niobium,
    potassium, silicon, sodium, strontium, vanadium, zirconium, carbon, oxygen and
    nitrogen contents in high purity barium titanate powders. The barium and titanium
    contents, the major elements, are determined by using an acid decomposition-gravimetric
    method or an acid decomposition-inductively coupled plasma-optical emission spectrometry
    (ICP-OES) method. The aluminium, cadmium, calcium, chromium, cobalt, dysprosium,
    iron, lead, magnesium, manganese, nickel, niobium, potassium, silicon, strontium,
    vanadium and zirconium contents are simultaneously determined via an acid digestion-ICP-OES
    method. The nitrogen content is determined by using an inert gas fusion-thermal
    conductivity method, while that of oxygen is determined via an inert gas fusion-IR
    absorption spectrometry method. Finally, the carbon content is determined using
    a combustion-IR absorption spectrometry method or a combustion-conductometry method.
