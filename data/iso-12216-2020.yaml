abstract:
- language: en
  script: Latn
  content: This document specifies technical requirements and test methods for windows,
    portlights, hatches, deadlights and doors on small craft with a length of hull,
    LH, as defined in ISO 8666:2016, of up to 24 m. It takes into account the type
    of craft, its design category, and the location of the appliance. The appliances
    considered in this document are only those that are critical for the craft's watertightness.
    Openings and non-opening devices fitted below area I (see 3.5.2) are excluded
    from the scope of this document.
