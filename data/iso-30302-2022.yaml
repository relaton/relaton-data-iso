abstract:
- language: en
  script: Latn
  content: This document gives guidance for the implementation of an MSR in accordance
    with ISO 30301. This document is intended to be used in conjunction with ISO 30301.
    It describes the activities to be undertaken when designing, implementing and
    monitoring an MSR. This document is intended to be used by any organization, or
    across organizations, implementing an MSR. It is applicable to all types of organization
    (e.g. commercial enterprises, government agencies, non-profit organizations) of
    all sizes. This document is intended to be used by those responsible for leading
    the implementation and maintenance of the MSR. It can also help top management
    in making decisions on the establishment, scope and implementation of management
    systems in their organization.
