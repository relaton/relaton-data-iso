abstract:
- language: en
  script: Latn
  content: The aim of the standard is to provide the assessments of external doses
    in case of radiological or nuclear emergencies This document advises how to obtain
    and assess the exposure data measured by using dosimeters and by calculating simulations.
    It does not specify the parties or individuals who are responsible for undertaking
    the actions. It is intended to give guidance to those in charge of monitoring
    and assessing doses received by populations and workers in emergency exposure
    situations. The monitoring and assessment of the body surfaces are not included
    in this standard.
