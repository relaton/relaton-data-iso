abstract:
- language: en
  script: Latn
  content: 'This document addresses quality considerations that apply to marine fuels
    in view of the implementation of maximum 0,50 mass % S in 2020 and the range of
    marine fuels that will be placed on the market in response to the international
    statutory requirements to reduce exhaust gas emissions. It defines general requirements
    that apply to all 0,50 mass % sulfur (S) fuels and confirms the applicability
    of ISO 8217 for those fuels. It gives technical considerations which might apply
    to particular fuels for the following characteristics: — kinematic viscosity;
    — cold flow properties; — stability; — ignition characteristics; — catalyst fines.
    Additionally, it provides considerations on the compatibility between fuels and
    additional information on ISO 8217:2017, Annex B (see Annexes B and D). NOTE 1
    For the purposes of this document, 0,50 mass % S fuels refers to distillate and
    residual fuels with a sulfur content up to 0,50 mass %. NOTE 2 For the purposes
    of this document, "mass %" and "volume %" are used to represent the mass and volume
    fractions respectively. NOTE 3 This document can also be used in conjunction with
    earlier editions of ISO 8217 in the event an earlier edition is referenced in
    the commercial agreement between parties.'
