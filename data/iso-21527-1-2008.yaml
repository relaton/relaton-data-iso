abstract:
- language: en
  script: Latn
  content: ISO 21527-1:2008 specifies a horizontal method for the enumeration of viable
    yeasts and moulds in products, intended for human consumption or feeding of animals,
    having a water activity greater than 0,95 [eggs, meat, dairy products (except
    milk powder), fruits, vegetables, fresh pastes, etc.], by means of the colony
    count technique at 25 °C plus or minus 1 °C. ISO 21527-1:2008 does not allow the
    enumeration of mould spores. Neither the identification of fungal flora nor the
    examination of foods for mycotoxins lie within the scope of ISO 21527-1:2008.
    The method specified in ISO 21527-1:2008 is not suitable for enumeration of heat-resistant
    fungi, such as Byssochlamys fulva or Byssochlamys nivea, in canned or bottled
    fruit and vegetables.
