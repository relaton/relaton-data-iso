abstract:
- language: en
  script: Latn
  content: ISO 12836:2015 specifies test methods for the assessment of the accuracy
    of digitizing devices for computer-aided design/computer-aided manufacturing (CAD/CAM)
    systems for indirect dental restorations. The methods described in ISO 12836:2015
    require a digitizing device in which the object is mounted relative to the optical
    or mechanical-contact system and therefore do not apply to hand-held scanning
    devices. These test methods are not applicable to digitization by radiographic
    (X-ray) methods or by magnetic resonance imaging (MRI) methods.
