abstract:
- language: en
  script: Latn
  content: This document specifies the relevant terms and definitions of the enhancement
    release of fish. It specifies the principles of the enhancement release of fish,
    selection of species, baseline survey, construction of foundation seed farm, species
    quality, offspring breeding, feralization training, inspection and quarantine,
    packaging and transportation, release, tracking survey and effect assessment.
    This document is applicable to the enhancement release of fish both in fresh waters
    and marine.
