abstract:
- language: en
  script: Latn
  content: This document specifies the features of laser-based powder bed fusion of
    polymers (LB-PBF/P) and provides detailed design recommendations. Some of the
    fundamental principles are also applicable to other additive manufacturing (AM)
    processes, provided that due consideration is given to process-specific features.
    This document also provides a state-of-the-art review of design guidelines associated
    with the use of powder bed fusion (PBF) by bringing together relevant knowledge
    about this process and by extending the scope of ISO/ASTM 52910.
