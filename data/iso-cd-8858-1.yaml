abstract:
- language: en
  script: Latn
  content: This document sets out a laboratory procedure for the froth flotation testing
    of fine coal, e.g. coal of particle size less than 0,5 mm. The procedure provides
    a means of evaluating the general flotation characteristics of a coal under a
    set of specified standard conditions, and will not necessarily indicate the full
    flotation potential of that coal. The flotation characteristics of coals are sensitive
    to changes in flotation conditions. These conditions can be changed by varying
    basic parameters such as flotation time, reagent and dosage rate. Separate flotation
    tests are used to assess the effect of varying these parameters to determine the
    best flotation conditions for a particular coal. A method of evaluating flotation
    response will be given in a separate standard.
