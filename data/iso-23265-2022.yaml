abstract:
- language: en
  script: Latn
  content: This document specifies a test procedure for the evaluation of the habitat
    function of soils by determining effects of soil contaminants and substances on
    organic matter decomposition. This test is applicable to natural soils and soil
    materials of unknown quality (e.g. contaminated sites, amended soils, soils after
    remediation, agricultural or other sites under concern). This document also specifies
    how to use this method for testing substances under temperate conditions. This
    document is not applicable to substances for which the air/soil partition coefficient
    is greater than 1. It is not applicable to substances with vapour pressure exceeding
    300 Pa at 25 °C. NOTE      The stability of the test substance cannot be ensured
    over the test period. No provision is made in the test method for monitoring the
    persistence of the substance under test.
