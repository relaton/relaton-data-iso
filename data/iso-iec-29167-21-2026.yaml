abstract:
- language: en
  script: Latn
  content: This document specifies the crypto suite for SIMON for the ISO/IEC 18000
    air interface standards for radio frequency identification (RFID) devices. SIMON
    is a symmetric block cipher that is parameterized in both its block length and
    key length. The block/key length options supported in this crypto suite (in bits)
    are 64/96, 96/96, 64/128, 128/128 and 128/256. In this document, a Tag and an
    Interrogator can support one, a subset or all of the specified options, clearly
    stating what is supported.
