abstract:
- language: en
  script: Latn
  content: This document specifies a general method for evaluation of compliance with
    product specifications for sensory properties based on sensory scoring and the
    use of a common nomenclature of terms. The method is especially applicable in
    process and quality control performed regularly on a larger number of samples
    and/or with some time pressure and/or with a limited number of expert assessors
    available. The results from the method can be part of product classification systems
    for domestic and international trade. This document does not apply to classification
    systems.
