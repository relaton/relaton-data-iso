abstract:
- language: en
  script: Latn
  content: This document specifies a method for the direct exposure of plastics to
    solar radiation (method A) and a method for the exposure of plastics to glass-filtered
    solar radiation (exposure behind window glass) (method B). The purpose is to assess
    property changes produced after specified stages of such exposures. General guidance
    concerning the scope of the ISO 877 series[1] is given in ISO 877-1.
