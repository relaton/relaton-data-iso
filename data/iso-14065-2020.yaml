abstract:
- language: en
  script: Latn
  content: This document specifies principles and requirements for bodies performing
    validation and verification of environmental information statements. Any programme
    requirements related to bodies are additional to the requirements of this document.
    This document is a sector application of ISO/IEC 17029:2019, which contains general
    principles and requirements for the competence, consistent operation and impartiality
    of bodies performing validation/verification as conformity assessment activities.
    This document includes sector-specific requirements in addition to the requirements
    of ISO/IEC 17029:2019.
