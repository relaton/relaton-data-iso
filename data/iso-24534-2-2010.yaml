abstract:
- language: en
  script: Latn
  content: 'ISO 24534-2:2010 provides requirements for electronic registration identification
    (ERI) that are based on an identifier assigned to a vehicle (e.g. for recognition
    by national authorities) suitable to be used for: electronic identification of
    local and foreign vehicles by national authorities; vehicle manufacturing, in-life
    maintenance and end-of-life identification (vehicle life cycle management); adaptation
    of vehicle data (e.g. for international resales); safety-related purposes; crime
    reduction; commercial services. It adheres to privacy and data protection regulations.
    ISO 24534-2:2010 defines the operational requirements for the remaining parts
    of ISO 24534 and the more limited but relevant provisions of ISO 24535. Whilst
    the definition of the organizational framework required to implement, operate
    and maintain an ERI system is outside the scope of ISO 24534-2:2010, a list of
    potential stakeholders in the public and private sector has been included.'
