abstract:
- language: en
  script: Latn
  content: ISO 5983-1:2005 specifies a method for the determination of the nitrogen
    content of animal feeding stuffs by the Kjeldahl process, and a method for the
    calculation of the crude protein content. The method does not measure oxidized
    forms of nitrogen or heterocyclic nitrogen compounds. This method does not distinguish
    between protein nitrogen and non-protein nitrogen. If it is important to determine
    the content of non-protein nitrogen, an appropriate method should be used.
