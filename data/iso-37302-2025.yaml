abstract:
- language: en
  script: Latn
  content: This document establishes principles and an evaluation indicator framework
    for assessing the effectiveness of a compliance management system. This includes
    evaluation criteria for specified indicators. This document also provides guidance
    as well as suggestions on the evaluation model. The guidance provided in this
    document aims to support the monitoring, measurement, analysis and evaluation
    of a compliance management system. It aims to support management review of the
    compliance management system to foster continual improvement. It does not add
    to, change or otherwise modify requirements for compliance management systems
    or any other standards. This document is applicable to the activities for evaluating
    the effectiveness of the compliance management system in all organizations, regardless
    of the type, size and nature, including organizations from the public, private
    or non-profit sector.
