abstract:
- language: en
  script: Latn
  content: 'This document gives guidance on how to secure physical documents for specifying
    entities of physical documents. It establishes a procedure for security design,
    which includes: —     risk assessment; —     determination of document classes;
    —     introduction of security features; —     security evaluation; —     document
    risk mitigation. This document is applicable to secure physical documents that
    are used for important actions such as validating value transactions, providing
    access, demonstrating compliance and securing products. This document does not
    apply to banknotes, machine-readable travel documents, driving licences, postage
    stamps, tax stamps, health cards or national identity cards covered by existing
    standards and regulations.'
