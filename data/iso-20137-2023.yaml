abstract:
- language: en
  script: Latn
  content: This document provides lists of chemicals that have already been detected
    in leather and guidelines for applying the available chemical test methods for
    leather. This information can be used by those involved in setting specifications
    for leather, especially for those parameters relating to restricted chemical substances.
    Generic lists of restricted chemicals used on the market contain many substances
    that are not relevant to the leather industry. Those chemical substances that
    are not mentioned in this document do not need to be determined, thus avoiding
    unnecessary analytical costs. NOTE            Due to the constantly changing legal
    requirements and toxicological evaluation of chemical substances, this document
    cannot address all potentially critical substances.
