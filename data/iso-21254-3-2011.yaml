abstract:
- language: en
  script: Latn
  content: ISO 21254-3:2011 specifies two methods of verifying the power density (energy
    density) handling capability of optical surfaces. The first method provides a
    rigorous test that fulfils the requirements at a specified confidence level in
    the knowledge of potential defects. The second method provides a simple, and hence
    inexpensive, test for an empirically derived test level.
