abstract:
- language: en
  script: Latn
  content: ISO 12625-9:2015 specifies a test method for the determination of the resistance
    to mechanical penetration (ball burst strength procedure) of tissue paper and
    tissue products. Currently, two types of clamping devices are available on the
    market with two different diameters, one is with 50 mm and one is with 89 mm.
    ISO 12625-9:2015 applies for a 50 mm clamping device to be able to measure all
    sample sizes of tissue paper and tissue products and to be consistent with ISO
    12625-11.
