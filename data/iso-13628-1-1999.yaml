abstract:
- language: en
  script: Latn
  content: La présente partie de l'ISO 13628 constitue un document de base régissant
    d'autres normes de sous-systèmes qui font partie d'un système de production immergé.Le
    système de production immergé complet comprend plusieurs sous-systèmes nécessaires
    pour produire des hydrocarbures provenant d'un ou de plusieurs puits sous-marins
    à une installation de traitement en mer (fixe, flottante ou sous-marine) ou à
    terre, ou pour injecter de l'eau / du gaz dans des puits sous-marins. La présente
    partie de l'ISO 13628 ainsi que les normes de sous-systèmes correspondantes s'appliquent
    dans les limites des interfaces décrites dans l'article 4.Les équipements spécialisés
    tels que arbres démontables, arbres de Noël et manifolds dans des enceintes atmosphériques,
    ne sont pas traités de manière spécifique du fait de leur utilisation limitée,
    mais les informations fournies s'appliquent à ces types d'équipement.
