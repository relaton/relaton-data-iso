abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the definition, type, materials,
    design, coating and corrosion protection, use and maintenance of mooring tensioner
    intended for floating offshore wind turbine.The tensioner is an important component
    for mooring system of floating wind turbine with low cost and small footprint.
    It provides pre-tensioning and self locking for the mooring lines. The tensioner
    can be installed at the top or in the middle of the mooring leg. The parts of
    tensioner are made by casting, welding or forging as specified in this standard.
    The pre-tension load during installation and breaking load of the mooring line
    shall be considered for different parts of the tensioner during design. Additionally,
    the tensioner shall be tested and inspected for mechanical properties, proof load,
    surface quality and functions. The requirements on coating, installation and maintenance
    are also specified in the standard.
