abstract:
- language: en
  script: Latn
  content: This proposal specifies a method for determining sulfite(sulphite) content
    in meat, fish and their products by acid-base titration. It is applicable to livestock
    meat, poultry meat, fish and other meat products. In our standard, the sample
    is treated by nitrogen-filled distillation method. After acidification, sulfite
    and other substances release sulfur dioxide under heating conditions. Hydrogen
    peroxide solution is used to absorb the distillate. The sulfur dioxide is dissolved
    in the absorption solution and oxidized to produce sulfuric acid. Titrate with
    sodium hydroxide standard solution. The content of sulfur dioxide in the sample
    was calculated according to the consumption of sodium hydroxide standard solution.
