abstract:
- language: en
  script: Latn
  content: 'This document establishes a system of classification for fertilizers,
    soil conditioners and beneficial substances. The system of classification is in
    accordance with: —    the nutrient contents of the fertilizer; —    the effect
    of the fertilizer; —    the type of product; and —    the acidity and alkalinity
    of the product as a supplement. It is applicable to fertilizers, soil conditioners
    and beneficial substances. The classification scheme for fertilizers, soil conditioners
    and beneficial substances (in accordance with nutrient contents) is shown in Annex A.'
