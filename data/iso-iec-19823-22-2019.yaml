abstract:
- language: en
  script: Latn
  content: 'This document describes methods for determining conformance to the security
    crypto suite defined in ISO/IEC 29167‑22. This document contains conformance tests
    for all mandatory functions. The conformance parameters are the following: — parameters
    that apply directly affecting system functionality and inter-operability; — protocol
    including commands and replies; — nominal values and tolerances. Unless otherwise
    specified, the tests in this document are intended to be applied exclusively to
    RFID tags and interrogators defined in the ISO/IEC 18000‑ series using ISO/IEC
    29167‑22.'
