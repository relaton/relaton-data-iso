abstract:
- language: en
  script: Latn
  content: 'This document specifies safety, constructional and performance requirements
    and testing of automatic, semi-automatic shut-off valves and general purpose valves
    for gas burners, gas appliances and appliances of similar use, hereinafter referred
    to as valves. This document applies to normally closed valves and general purpose
    valves mounted upstream to gas burners and gas appliances with declared maximum
    operating pressures up to and including 500 kPa, for use on burners or in appliances
    using fuel gases such as natural gas, manufactured gas or liquefied petroleum
    gas (LPG). It is not applicable to corrosive and waste gases. This document applies
    to: —     valves directly or indirectly actuated, electrically or by mechanical
    means; —     valves actuated by hydraulic or pneumatic means; —     valves where
    the flow rate is controlled by external electrical signals, either in discrete
    steps or proportional to the applied signal; and —     valves fitted with closed
    position indicator switches. This document covers type testing only.'
