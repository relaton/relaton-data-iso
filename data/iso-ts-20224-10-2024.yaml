abstract:
- language: en
  script: Latn
  content: This document specifies a real-time polymerase chain reaction (real-time
    PCR) method for the qualitative detection of duck-specific DNA derived from food
    and feed. It requires the extraction of an adequate amount of PCR amplifiable
    DNA from the relevant matrix and can be applied to the detection of duck material
    derived from mallard duck (Anas platyrhynchos) and spot-billed duck (Anas zonorhyncha).
    Cross detection of white-winged duck (Asarcornis scutulata), tufted duck (Aythya
    fuligula), muscovy duck (Cairina moschata) and Mandarin duck (Aix galericulata)
    is observed. Mallard duck and muscovy duck are domesticated poultry for food,
    while spot-billed duck, white-winged duck, tufted duck and Mandarin duck are wild
    avian. The target sequence is a partial fragment of the Anas platyrhynchos breed
    pekin duck isolate CAU_Pekin_2.0 Chr1, whole genome shotgun sequence (i.e. GenBank
    accession number JACEUM010000001.1),[1] which is present as a single copy per
    haploid genome. The provided PCR assay for this target has an absolute limit of
    detection of five copies per reaction, with ≥ 95 % confidence at this concentration
    (LOD95 %).
