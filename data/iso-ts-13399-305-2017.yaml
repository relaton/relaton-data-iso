abstract:
- language: en
  script: Latn
  content: 'ISO/TS 13399-305:2017 specifies a concept for the design of tool items,
    for all kinds of modular tooling systems with adjustable cartridges for boring,
    together with the usage of the related properties and domains of values. ISO/TS
    13399-305:2017 specifies a common way of designing simplified models that contain
    the following: - definitions and identifications of the design features of modular
    tooling systems with adjustable cartridges for boring, with an association to
    the used properties; - definitions and identifications of the internal structure
    of the 3D model that represents the features and the properties of modular tooling
    systems with adjustable cartridges for boring. The following are outside the scope
    of this document: a) applications where these standard data may be stored or referenced;
    b) concept of 3D models for cutting tools; c) concept of 3D models for cutting
    items; d) concept of 3D models for other tool items not being described in the
    scope of this document; e) concept of 3D models for adaptive items; f) concept
    of 3D models for assembly items and auxiliary items.'
