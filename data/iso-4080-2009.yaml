abstract:
- language: en
  script: Latn
  content: 'ISO 4080:2009 specifies three methods for the determination of the volume
    of gas diffusing through a rubber or plastics hose or length of tubing in a specified
    time. Method 1: For determining the permeability of the complete hose or length
    of tubing, excluding end-fittings, to the test gas. The permeability is calculated
    with respect to the length of the hose or tubing. Method 2: For determining the
    permeability at the hose/fitting interface. This method is used when determining
    the permeability characteristics of hoses with an unpricked cover, when the gas
    usually issues from the textile reinforcement at the cut ends. The permeability
    is calculated with respect to the length of the hose. Method 3: For determining
    precisely the permeability of a hose or hose assembly to the test gas. The permeability
    is calculated with respect to the surface area of the hose lining. The methods
    are applicable only to gases which are insoluble in water.'
