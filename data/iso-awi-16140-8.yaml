abstract:
- language: en
  script: Latn
  content: 'This document is applicable to the validation of alternative (proprietary
    and non-proprietary) qualitative or quantitative methods against a reference method
    for viruses and parasites in: — products intended for human consumption; — products
    for feeding animals; — environmental samples in the area of food and feed production
    and handling. Validation studies according to this document are intended to be
    performed by organizations involved in method validation. This document is applicable
    to common and emerging foodborne viruses (e.g. human norovirus, hepatitis A virus)
    and parasites (e.g. Cryptosporidium, Cyclospora) which have a reference method.'
