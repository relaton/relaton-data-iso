abstract:
- language: en
  script: Latn
  content: This document specifies the terms and definitions of residual stress measurement
    using bulk acoustic wave (BAW), as well as the requirements for measurement personnel,
    key points, measurement system, calibration of P-wave and S-wave acoustoelastic
    coefficients, measurement procedure, calibration of measurement instruments, and
    test report preparation. This document is applicable to the measurement of residual
    stress in materials by using ultrasonic bulk wave.
