abstract:
- language: en
  script: Latn
  content: ISO 11979-10:2006 is applicable to any intraocular lens (IOL) whose primary
    indication is the modification of the refractive power of a phakic eye but excludes
    phakic IOLs (PIOLs) that utilize multifocal or other simultaneous vision optics
    to address presbyopic loss of accommodation and PIOLs that correct astigmatism.
    ISO 11979-10:2006 addresses specific requirements for PIOLs not addressed in the
    other parts of ISO 11979.
