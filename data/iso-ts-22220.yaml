abstract:
- language: en
  script: Latn
  content: This document specifies procedures and data elements needed to accurately
    identify persons including subjects of care and individual care providers. It
    is applicable to the positive, consistent identification of persons in health
    and social care settings. It provides guidance on its application in both manual
    and automated systems and makes recommendations about the nature and form of identifiers
    and the management of identification processes. It does not apply to the collection
    and processing of data for purposes other than the identification of persons and
    their associated records, even though some of the data elements collected for
    identification may be used for other purposes such as the determination and delivery
    of care, the compilation of statistics, contact tracing and reimbursement.
