abstract:
- language: en
  script: Latn
  content: Specifies the test solution, the apparatus and the procedure for a saline
    droplets corrosion test. Is suitable for detecting defests and discontinuities.
    It is also suitable for chemical or electrochemical conversion coatings. Is not
    suitable for testing coatings intended for the more severe types of service. The
    type and number of test specimens, the exposure periods to be used for a particular
    product and the interpretaiton of results are not specified.
