abstract:
- language: en
  script: Latn
  content: This document specifies a test method using the high-frequency reciprocating
    rig (HFRR) with a digital camera, for assessing the lubricating property of petroleum-based
    middle distillate fuels, paraffinic diesel fuels, and biodiesel blends, with or
    without lubricity enhancing additives, and with HFRR wear scar diameters (WSDs)
    of 350 μm to 700 μm. This test method applies to fuels used in diesel engines.
    NOTE       It is not known if this test method can predict the performance of
    all additive/fuel combinations.
