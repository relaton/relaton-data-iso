abstract:
- language: en
  script: Latn
  content: This International Standard specifies requirements for the components and
    method of installation of pressurized irrigation system control heads, referred
    to hereinafter as irrigation control heads, with a nominal size of up to and including
    200 mm. This International Standard is applicable only to the above-ground components
    of irrigation control heads for sprinkler irrigation and micro-irrigation (mini-sprinklers,
    drip irrigation, etc.). It is applicable to the basic irrigation control head,
    on which other irrigation control and command components (electrical, electronic
    and hydraulic) may be assembled, but does not deal with these additional components.
    This International Standard is not applicable to systems and/or components that
    may be required to prevent the water from freezing in the irrigation control head,
    such as dry-barrel hydrants or other types of hydrants. This International Standard
    does not specify construction or operating requirements for the individual components
    that make up the irrigation control head. These requirements are specified in
    the relevant standards for each component. Systems whose irrigation control heads
    contain components for the injection of agricultural chemicals should be protected
    by backflow prevention system interlocks, injection line check valves and other
    safety devices in accordance with local standards or regulations. This International
    Standard does not cover such equipment.
