abstract:
- language: en
  script: Latn
  content: This document specifies the technical requirements and guidelines for seafloor
    mapping with uncrewed marine vehicles, including uncrewed surface vehicles (USVs)
    and uncrewed underwater vehicles (UUVs). This document covers navigation and positioning,
    uncrewed vehicle assembly, survey parameter setting, single-beam and multi-beam
    echo sounding, and data processing. This document is applicable to uncrewed marine
    vehicles in estuaries, offshore and open sea areas.
