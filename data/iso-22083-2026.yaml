abstract:
- language: en
  script: Latn
  content: This document specifies general and basic requirements for planning railway
    operation during predictable natural hazards, with a focus on heavy rainfall and
    strong wind, to reduce their impact on railway operation. This document does not
    apply to regions where the consequences of the addressed predictable natural hazards
    for railway operation are low or non-existent. This document includes measures
    directly related to railway operation to reduce the impact in the event of predictable
    natural hazards. However, this document does not include specific measures which
    ensure passenger safety or which provide protection against railway-operational
    damage caused by the predictable natural hazards. Therefore, residual risk can
    remain.
