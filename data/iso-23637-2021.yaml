abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of cadmium (Cd)
    in cereals. It is applicable to rice, brown rice, wheat and maize by graphite
    furnace atomic absorption spectrometry (GFAAS) after extraction with diluted nitric
    acid (HNO3). The limit of quantification is 0,002 mg/kg; it is approximate and
    dependent on the sample matrix as well as on the instrument conditions.
