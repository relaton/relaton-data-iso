abstract:
- language: en
  script: Latn
  content: This document addresses the safety of persons and premises when using devices
    and appliances ("products") with interfaces to a communications network in a home
    or building ("premises"). Such products are called "networked appliances" and
    "networked products." This document specifies basic requirements for safer operation
    of products that can be controlled remotely via a connection to a communications
    network. The network can enable such products to form integrated applications.
    These products can interact via the premises network and can be controlled remotely
    from within the premises and from a wide area network outside connected to the
    premises network via a communications gateway. Recommendations and methods for
    remote-control message screening and guidelines for selecting messages to minimize
    risk are specified. These specifications can enhance safety in a home control
    system (hcs). The safety requirements specified in this document apply together
    with any relevant product safety standards. NOTE 1 ISO/IEC HES standards are identified
    by HES or "Home Electronic System" in the title. NOTE 2 This document addresses
    conditions of normal use and fault conditions throughout the lifetime of a product.
    Sabotage, force majeure, and intentional damage are not addressed in this document.
    NOTE 3 This document is not intended for safety-related equipment such a fire-detection
    and suppression system. NOTE 4 "Networked applications" and "networked products"
    describe the same category of devices and are used interchangeably in this document.
