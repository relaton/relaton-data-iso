abstract:
- language: en
  script: Latn
  content: ISO 22600 defines principles and specifies services needed for managing
    privileges and access control to data and/or functions. It focuses on communication
    and use of health information distributed across policy domain boundaries. This
    includes healthcare information sharing across unaffiliated providers of healthcare,
    healthcare organizations, health insurance companies, their patients, staff members,
    and trading partners by both individuals and application systems ranging from
    a local situation to a regional or even national situation. It specifies the necessary
    component-based concepts and is intended to support their technical implementation.
    It will not specify the use of these concepts in particular clinical process pathways.
    ISO 22600-1:2014 proposes a template for the policy agreement. It enables the
    comparable documentation from all parties involved in the information exchange.
