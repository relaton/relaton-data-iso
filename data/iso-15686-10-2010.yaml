abstract:
- language: en
  script: Latn
  content: ISO 15686-10:2010 establishes when to specify or verify functional performance
    requirements during the service life of buildings and building-related facilities,
    and when to check the capability of buildings and facilities to meet identified
    requirements. ISO 15686-10:2010 is applicable to any scope of holdings, whether
    a set (or portfolio) of buildings, a single building (large or small) or a facility
    which is part of a building (such as one group of spaces, one floor or several
    floors). It is applicable to the range of roles from the owners and managers to
    the occupants, tenants, or other users or stakeholders.
