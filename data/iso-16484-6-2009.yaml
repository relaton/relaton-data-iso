abstract:
- language: en
  script: Latn
  content: ISO 16484-6:2009 defines a standard method for verifying that an implementation
    of the BACnet protocol provides each capability claimed in its Protocol Implementation
    Conformance Statement (PICS) in conformance with the BACnet standard. ISO 16484-6:2009
    provides a comprehensive set of procedures for verifying the correct implementation
    of each capability claimed on a BACnet PICS, including upport of each claimed
    BACnet service, either as an initiator, executor, or both, support of each claimed
    BACnet object-type, including both required properties and each claimed optional
    property, support of the BACnet network layer protocol, support of each claimed
    data link option, and support of all claimed special functionality.
