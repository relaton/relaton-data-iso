abstract:
- language: en
  script: Latn
  content: This document specifies the general strategies for determining the concentration
    of airborne particles indoors and covers the size range from approximately 1 nm
    to 100 µm. In addition, this document describes methods for identifying typical
    indoor particle sources and gives general recommendations for obtaining a representative
    sample. The main sources of indoor particulate matter are described in this document,
    together with indoor particle dynamics. Various measurement methods are described,
    along with their advantages, disadvantages and areas of application, as well as
    some general sampling recommendations. Measurement strategies for determining
    airborne particles indoors are discussed, including reference case studies with
    more specific sampling recommendations. Additional documents in the ISO 16000
    series will focus on each fraction of airborne particulate matter and give specific
    recommendations for these measurements. The determination of measurement uncertainty
    and minimum reporting requirements are also part of this document. This document
    does not apply to the determination of bioaerosols or the chemical characterization
    of particles. For the measurement and assessment of dust composition, see the
    relevant part in the ISO 16000 series. This document does not apply to the measurement
    of airborne particles in vehicle passenger compartments and public transport systems.
