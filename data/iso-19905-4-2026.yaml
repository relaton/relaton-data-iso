abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and guidance for the installation on and removal from site of independent leg jack‑ups for use in the oil and gas industries including lower carbon energy. It addresses the assessment of: the installation operation from when the jack-up enters the defined safety zone of the host platform or the intended site to when it is elevated to the operating hull elevation above LAT and is ready for operations; the removal operation from when the jack-up is ready to jack-down to when it departs the defined safety zone. NOTE 1        Whilst this document is for independent leg jack-ups, many of the provisions can be applied to mat-supported jack-ups. When the jack-up has propulsion assist or is self-propelled, the provisions of this document related to positioning can be replaced or supplemented as appropriate. This document excludes the move of the jack-up between sites and elevated operations, which are covered respectively by IMO/Class and ISO 19905-1. NOTE 2        Whilst this document addresses the installation and removal of a jack-up at a site, RMPs normally include the move of the jack-up between sites (see example RMP in Annex E).'
