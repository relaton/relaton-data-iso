abstract:
- language: en
  script: Latn
  content: 'ISO 12357-2:2007 lays down test conditions and strength requirements to
    be met by: drawbar couplings and corresponding drawbar eyes for rigid drawbars
    which are provided for use on rigid drawbar trailers with a maximum design total
    mass exceeding 3,5 tonnes anda vertical static load exceeding 10 % of their design
    total mass, and/ora vertical static load greater than 1 000 kg and up to 2 000
    kg;drawbar couplings and corresponding drawbar eyes for use on vehicle transport
    combinations, provided for a technical mass exceeding 3,5 tonnes.'
