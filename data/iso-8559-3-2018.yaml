abstract:
- language: en
  script: Latn
  content: This document describes the principles of the establishment of tables for
    body measurements, defines the categories of tables (related to intervals), and
    lists the population groups (infants, girls, boys, children, women, men) and sub-groups
    to be used for developing ready-to-wear garments. The body measurement tables
    and intervals are mainly used by the clothing sector to make the development of
    well-fitting products easier and more accurate. The described methodology is mainly
    based on the application of statistical analysis, using body dimension data. The
    statistical level has deliberately been kept to a low level in order for the content
    to be made readily comprehensible to the widest possible readership. This methodology
    is applicable to various sets of body dimensions. It can be useful to determine
    intervals for the size designation as described in ISO 8559-2. Values in the tables
    in this document are examples. Garment dimensions are not included in this document.
    It is necessary to use a general approach providing inbuilt flexibility, in order
    to keep the whole sizing system capable of adapting to changes (e.g. demographic
    criteria), because body shape and proportions for any one targeted population
    group differ significantly. NOTE ISO 15535 can be convenient for recording and
    organizing the population data.
