abstract:
- language: en
  script: Latn
  content: 'This document specifies the technical delivery requirements for bright
    steel products in the drawn, peeled/turned or additional ground condition and
    they are intended for mechanical purposes, for example for machine parts. The
    bright steel products are subdivided into the following steel types: a)      
    non-alloy general engineering steels; b)       non-alloy free-cutting steels;
    c)        non-alloy and alloy case-hardening steels; d)       non-alloy and alloy
    steels for quenching and tempering. Bright products of stainless steels are not
    part of this document, they are covered by ISO 16143-4.'
