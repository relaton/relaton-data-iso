abstract:
- language: en
  script: Latn
  content: ISO/TR 14411-1:2017 describes the preparation of polydisperse spherical
    particles based on a picket fence of quasi-monodisperse reference materials, the
    characterization of its monodisperse components with acceptable uncertainty and
    the estimation of the uncertainty of the mixture of these particles. This type
    of material is normally suitable for all particle characterization methods within
    the appropriate limits of the techniques. An example of using these reference
    materials in a reliability calculation for a mass-based cumulative size distribution
    is provided. ISO/TR 14411-1:2017 itself to the technical specificities of preparation
    beyond the general requirements for certified and non-certified reference materials
    as described in ISO Guide 30, ISO Guide 31, ISO Guide 35 and ISO 17034.
