abstract:
- language: en
  script: Latn
  content: This document specifies an inspection procedure to be used by the purchaser
    where no prior agreement exists. It also specifies a reference acceptance procedure
    for acceptance or rejection of an inspection lot, when no agreement can be reached
    between the purchaser and the supplier, or where conformance to specification
    is disputed. It applies to inspection lots of bolts, screws, studs, nuts, pins,
    washers, rivets and other related fasteners. This document applies to fasteners
    not intended for high volume machine assembly, special-purpose applications or
    specially engineered applications requiring more advanced in-process control and
    lot traceability. For in-process control or final inspection by the manufacture
    and sorting, see ISO 16426.
