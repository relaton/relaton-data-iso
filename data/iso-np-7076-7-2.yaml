abstract:
- language: en
  script: Latn
  content: 'This proposal specifies the minimum requirements for design, installation, testing and maintenance of low, medium, and high expansion foam fire extinguishing systems, foam sprinkler and deluge systems. The purpose of this proposal is to ensure the rational design of foam fire extinguishing systems, ensure construction quality and functional performance, reduce fire hazards, and protect personal safety and property. Nothing in this proposal is intended to restrict new technologies or alternative arrangements, provided that the level of foam system performance prescribed in this standard is not lowered, and supported by documented evidence/test reports. All foam systems are generally unsuitable for the following: — chemicals, such as cellulose nitrate, that release sufficient oxygen or other oxidizing agents which can sustain combustion; — energized unenclosed electrical equipment; — metals such as sodium, potassium and sodium-potassium alloys which are reactive to water; — hazardous, water–reactive materials such as triethyl-aluminium and phosphorous pentoxide; — combustible metals such as aluminium and magnesium.'
