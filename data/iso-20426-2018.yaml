abstract:
- language: en
  script: Latn
  content: This document aims to serve as technical guidelines for the assessment
    and management of the health risks associated with pathogens contained in reclaimed
    water, which are expected to be caused by the use of reclaimed water, and/or by
    the production, storage, and transportation of reclaimed water. This document
    is applicable to the use of reclaimed water made from any source water (i.e. raw
    sanitary sewage; treated municipal wastewater; industrial wastewater; stormwater
    potentially influenced by sewage) and for non-potable water reuse. NOTE The approach
    described in this document can be applied to chemical contaminant, if applicable.
