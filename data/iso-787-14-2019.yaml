abstract:
- language: en
  script: Latn
  content: This document specifies a general method of test for determining the electric
    resistivity (specific electric resistance) or the specific electric conductivity,
    respectively, of the aqueous extract of a pigment. The method is applicable to
    all pigments and extenders, except pigments that are soluble in water. The resistivity
    of the aqueous extract of a pigment is considered as a property independent of
    the amount of water-soluble matter. If agreed, a cold extraction method can be
    used.
