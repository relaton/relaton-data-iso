abstract:
- language: en
  script: Latn
  content: 'This document describes laser radiation hazards arising in laser processing
    machines, as defined in 3.7. It also specifies the safety requirements relating
    to laser radiation hazards, as well as the information to be supplied by the manufacturers
    of such equipment (in addition to that prescribed by IEC 60825). Requirements
    dealing with noise as a hazard from laser processing machines are included in
    ISO 11553‑3:2013. This document is applicable to machines using laser radiation
    to process materials. It is not applicable to laser products, or equipment containing
    such products, which are manufactured solely and expressly for the following applications:
    — photolithography; — stereolithography; — holography; — medical applications
    (per IEC 60601-2-22); — data storage.'
