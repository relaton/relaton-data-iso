abstract:
- language: en
  script: Latn
  content: ISO 4254-7:2017, when used together with ISO 4254‑1, specifies the safety
    requirements and their verification for the design and construction of combine
    harvesters, forage harvesters, cotton harvesters and sugar cane harvesters. It
    describes methods for the elimination or reduction of hazards arising from the
    intended use of these machines by one person (the operator) in the course of normal
    operation and service. In addition, it specifies the type of information on safe
    working practices to be provided by the manufacturer. When provisions of ISO 4254-7:2017
    are different from those which are stated in ISO 4254‑1, the provisions of ISO
    4254-7:2017 take precedence over the provisions of ISO 4254‑1 for machines that
    have been designed and built according to the provisions of ISO 4254-7:2017. ISO
    4254-7:2017, taken together with ISO 4254‑1, deals with all the significant hazards
    (as listed in Table A.1), hazardous situations and events relevant to combine
    harvesters, forage harvesters, cotton harvesters and sugar cane harvesters, when
    they are used as intended and under the conditions of misuse that are reasonably
    foreseeable by the manufacturer (see Annex A). It is not applicable to hazards
    arising from the presence of persons other than the operator, cleaning of the
    grain tank, and hazards related to vibrations and moving parts for power transmission,
    except for strength requirements for guards and barriers. In respect of braking
    and steering, it is applicable only to the ergonomic aspects (e.g. location of
    brake pedal and steering wheel); no other aspects related to braking and steering
    are covered. In the case of trailed harvesters, it is applicable only to hazards
    related to the working process. Design requirements for roll-over protective structures
    (if applicable) are not specified in ISO 4254-7:2017. Performance levels (or categories)
    for safety-related parts of control systems in accordance with ISO 25119 or ISO
    13849 are not given in ISO 4254-7:2017. NOTE Specific requirements related to
    road traffic regulations are not taken into account in ISO 4254-7:2017. ISO 4254-7:2017
    is not applicable to machines manufactured before the date of its publication.
