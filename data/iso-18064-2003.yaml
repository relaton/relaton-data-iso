abstract:
- language: en
  script: Latn
  content: ISO 18064:2003 establishes a nomenclature system for thermoplastic elastomers
    based on the chemical composition of the polymer or polymers involved. It defines
    symbols and abbreviated terms used to identify thermoplastic elastomers in industry,
    commerce and government. It is not intended to conflict with, but to supplement,
    existing trade names and trademarks. Thermoplastic-elastomer abbreviated terms
    that have been used in the past are given in an Annex.
