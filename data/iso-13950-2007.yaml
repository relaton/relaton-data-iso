abstract:
- language: en
  script: Latn
  content: ISO 13950:2006 specifies the characteristics of automatic recognition systems
    (numerical recognition by means of bar codes or magnetic cards, electromechanical
    recognition using implanted-resistor connectors and self-regulation systems) that
    enable the energy supply to be delivered automatically to the thermoplastic electrofusion
    fittings used in pipe jointing. It is applicable to electrofusion fittings intended
    to be used for plastics piping systems for the conveyance of gaseous fuels, water
    for human consumption (including raw water prior to treatment) and for general
    purposes, or of other fluids.
