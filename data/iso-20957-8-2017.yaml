abstract:
- language: en
  script: Latn
  content: ISO 20957-8.2017 specifies safety requirements for stepper, stairclimber
    and climber machines (hereafter called training equipment) performed from either
    a standing or sitting position. The requirements are in addition to the general
    safety requirements of ISO 20957‑1, with which ISO 20957-8.2017 is intended to
    be read in conjunction. ISO 20957-8.2017 is applicable to stationary training
    equipment type stepper, stairclimber and climber training equipment, within classes
    S and H. Additional requirements are provided for accuracy class A.
