abstract:
- language: en
  script: Latn
  content: 'This document specifies all end-of-life activation of in-vehicle pyrotechnical
    devices identifiers, data identifiers, routine identifiers, data types, computations,
    and units. This document is based on: —    new safety-relevant system technology
    designed into the vehicles, —    new or more effective end-of-life activation
    of in-vehicle pyrotechnical devices, which requires additional test data, and
    routine controls. This document describes the end-of-life activation of in-vehicle
    pyrotechnical devices data definitions and associated technical requirements.
    This document specifies: —    identifiers for end-of-life activation of in-vehicle
    pyrotechnical devices data definitions and associated technical requirements,
    —    data identifiers applicable to end-of-life activation of in-vehicle pyrotechnical
    devices data definitions and associated technical requirements, —    routine identifiers
    applicable to end-of-life activation of in-vehicle pyrotechnical devices data
    definitions and associated technical requirements.'
