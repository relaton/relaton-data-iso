abstract:
- language: en
  script: Latn
  content: This document specifies the methods of preparation of test specimens and
    the standard test methods to be used in determining the properties of thermoplastic
    polyketone moulding and extrusion materials. Requirements for handling test material
    and/or conditioning both the test material before moulding and the specimens before
    testing are given. The properties have been selected from the general test methods
    in ISO 10350‑1. Other test methods in wide use for or of particular significance
    to these moulding and extrusion materials are also included in this document,
    as are the designatory properties specified in ISO 21970-1. It is intended that
    the methods of preparation and conditioning, the specimen dimensions and the test
    procedures specified in this document be used in order to obtain reproducible
    and comparable test results. Values determined will not necessarily be identical
    to those obtained using specimens of different dimensions or prepared using different
    procedures.
