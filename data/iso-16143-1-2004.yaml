- language: en
  script: Latn
  content: ISO 16143-1:2004 specifies the technical delivery conditions for hot or
    cold rolled sheet/plate and strip for general purposes made of the most important
    corrosion resistant stainless steel grades. In addition to this part of ISO 16143,
    the general technical delivery requirements of ISO 404 are applicable. ISO 16143-1:2004
    does not apply to components manufactured by further processing of the product
    forms listed in paragraph 1 where quality characteristics are altered as a result
