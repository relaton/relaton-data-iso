- language: en
  script: Latn
  content: This proposed standard specifies the definitions and classifications of
    Refrigerant Compressor for refrigeration, air-conditioning, heat pump and dehumidifying
    applications as well as other devices, components and equipment that use refrigerant
    compressors and is not covered by other ISO technical committees. Non-refrigerant
    compressors, such as air compressors, are not within the scope of application
