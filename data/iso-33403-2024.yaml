abstract:
- language: en
  script: Latn
  content: 'This document describes good practice in using reference materials (RMs),
    and certified reference materials (CRMs) in particular, in measurement processes.
    These uses include: —           the assessment of precision and trueness of measurement
    methods; —           quality control; —           assigning values to materials;
    —           calibration; —           establishing conventional scales. This document
    also relates key characteristics of various types of RMs to the different applications.
    The preparation of RMs for calibration is also part of the scope of ISO 17034
    and ISO 33405. The treatment in this document is limited to the fundamentals of
    small-scale preparation of RMs and the value assignment, as used by laboratories
    to calibrate their equipment. Larger scale production of such RMs, with the possible
    aim of distribution, is beyond the scope of this document. This type of activity
    is covered in ISO 17034 and ISO 33405.'
