abstract:
- language: en
  script: Latn
  content: ISO 10302-2:2011 covers vibration levels from small air moving devices
    (AMDs) with mounting footprints of less than 0,48 m × 0,90 m for the full-size
    test plenum defined in ISO 10302‑1 and less than 0,18 m × 0,3 m for the half-size
    plenum. It covers all types of AMDs which can be mounted on, and are self-supported
    at, the discharge or inlet plane of a test plenum box as specified in ISO 10302‑1.
    The procedures defined in ISO 10302-2:2011 specify methods for determining the
    vibration levels that a small AMD would induce in an average structure used in
    information technology and telecommunications equipment. The methods specified
    in ISO 10302-2:2011 allow the determination of induced vibration levels for the
    individual AMD that is tested. These data can be used to determine the statistical
    values of vibration levels for a production series if levels are measured for
    several units of that series.
