abstract:
- language: en
  script: Latn
  content: ISO 9516-1:2003 sets out a wavelength dispersive X-ray fluorescence procedure
    for the determination of iron, silicon, calcium, manganese, aluminium, titanium,
    magnesium, phosphorus, sulfur, potassium, tin, vanadium, chromium, cobalt, nickel,
    copper, zinc, arsenic, lead and barium in iron ores. The method has been designed
    to cope with iron ores having high ignition losses. The method is applicable to
    iron ores regardless of mineralogical type.
