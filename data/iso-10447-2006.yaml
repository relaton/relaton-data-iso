abstract:
- language: en
  script: Latn
  content: 'ISO 10447:2006 specifies the procedure and recommended tooling to be used
    for testing resistance spot and projection welds by means of peel and chisel tests.
    ISO 10447:2006 applies to welds made in two or more sheets in the thickness range
    of 0,5 mm to 3,0 mm. The aim of these tests is to determine: weld size and failure
    type when the tests are used as destructive tests, andverification of welds when
    the tests are used as non-destructive tests.'
