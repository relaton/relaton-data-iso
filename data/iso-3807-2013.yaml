abstract:
- language: en
  script: Latn
  content: ISO 3807:2013 specifies the basic and type testing requirements for acetylene
    cylinders with and without fusible plugs with a maximum nominal water capacity
    of 150 l and requirements regarding production/batch test procedures for manufacturing
    of acetylene cylinders with porous material. It does not include details of the
    design of the cylinder shell; these are specified, for example, in ISO 9809 1,
    ISO 9809 3, ISO 4706 and ISO 7866.
