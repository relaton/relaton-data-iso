abstract:
- language: en
  script: Latn
  content: 'This document provides a method for the measurement of the surface of
    leather or leather parts by the use of electronic measuring machines. It applies
    to the measurement of leather (or leather parts) fulfilling the following requirements:
    —    flexible leather, finished or unfinished dry leather; —    flexible wet leather
    (see Annex E); —    flexibility, such as to allow full distension on the measuring
    line or surface.'
