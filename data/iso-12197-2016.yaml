abstract:
- language: en
  script: Latn
  content: 'ISO 12197:2016 specifies the dimensions of milling cutters intended for
    manufacturing woodruff keyseats in accordance with ISO 3912. Two types of woodruff
    keyseat cutters with cylindrical shank are specified: - woodruff keyseat cutters
    with cylindrical shank, in accordance with ISO 3338‑1; - woodruff keyseat cutters
    with flatted cylindrical shank, in accordance with ISO 3338‑2.'
