abstract:
- language: en
  script: Latn
  content: This standard specifies the TPEG application Driving Restriction Regulations
    (DRR), which provides information about regulatory restrictions regarding the
    access of vehicles for specific areas and times to TPEG receiver or client devices.
    Driving restrictions are, for example, established in cities across the world
    to alleviate traffic congestion, reduce air pollution and improve the accessibility
    of urban areas. This is realized by strategically limiting vehicle access, especially
    in peak hours using specific policy schemes, which may considerably vary from
    country to country, even from city to city in the same country. The information
    received via TPEG2-DRR can be used advantageously by drivers or client device
    applications such as navigation systems, firstly before driving to check the current
    and upcoming restrictions in order to plan trips or routes, and secondly, while
    driving, to enable the driver or the navigation system to avoid the restricted
    roads or areas.
