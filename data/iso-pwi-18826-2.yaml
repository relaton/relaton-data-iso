abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of four fractions
    contents in petroleum heavy distillate using middle pressure liquid-phase chromatography.
    This document is applicable to petroleum heavy distillate, including atmosphere
    residue, vacuum distillate, vacuum residue and other petroleum products with initial
    boiling point (IBP) higher than 350 °C. This document does not apply to petroleum
    products that cannot disperse in n-heptane, such as some slurry and asphalt.
