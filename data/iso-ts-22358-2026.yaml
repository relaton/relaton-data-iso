abstract:
- language: en
  script: Latn
  content: This document aims to provide a procedure for reporting indoor air quality when combusting moxibustion devices. It is intended for use in business-to-business (B to B) transactions, subject to mutual agreement between parties. This document specifies the steps for preparing reports that compare indoor concentration values of target pollutants generated when combusting moxibustion device with international, regional, or national ambient and indoor air quality regulations, standards, or guideline values. This document does not apply to moxibustion devices that do not involve combustion of moxibustion material, such as electric heating moxibustion equipment covered in ISO 21292:2020 and infrared moxibustion-like instruments covered in ISO 20493:2018.
