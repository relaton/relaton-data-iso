abstract:
- language: en
  script: Latn
  content: This document specifies design recommendations for the production of single-alloy
    metal parts using a Binder Jetting Technology, a Multi-Step Additive Manufacturing
    Process (BJT-MSt/M). The process category is binder jetting (BJT), a multi-step
    process (-MSt), for metallic materials (/M). As such, this document is extending
    the scope of ISO/ASTM 52910 for this technology in particular. The main characteristics
    of the process are also discussed. Some of the fundamental design principles are
    also applicable to other AM processes, provided that due consideration is given
    to process-specific features. This document also provides a review of the state
    of the art of design guidelines associated with the use of BJT-MSt/M by bringing
    together relevant knowledge about this process.
