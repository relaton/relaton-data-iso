abstract:
- language: en
  script: Latn
  content: ISO 6780:2003 specifies the principal dimensions and tolerances for new
    single-deck and double-deck, reversible and non-reversible flat pallets, of all
    entry types and made of any material, related to their transportation and handling
    by pallet trucks, fork-lift trucks and other appropriate equipment. The requirements
    for features such as openings, clearances, chamfers and wings that are required
    for efficient handling are also included. The applicability of ISO 6780:2003 to
    reversible pallets can be affected by their use in field conditions.
