abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of extractable metals
    in leather using extraction with an acid artificial-perspiration solution and
    subsequent determination with inductively coupled plasma optical emission spectrometry
    (ICP-OES), inductively coupled plasma mass spectrometry (ICP-MS), atomic absorption
    spectrometry (AAS) or spectrometry of atomic fluorescence (SFA). This method determines
    extractable metals in leather; it is not compound-specific or specific to the
    oxidation state of the metals. This method is especially suitable for determining
    the extractable chromium in chromium-tanned leathers.
