abstract:
- language: en
  script: Latn
  content: This document specifies the dimensions and characteristics of the interface,
    requirements, test methods and marking of ski-boots with a rigid ski boot sole
    that are used with current systems of touring ski-bindings with attachment at
    the boot toe and boot heel, the proper release function of which depends on the
    dimensions and design of the interfaces. This document is not necessarily applicable
    to touring ski boots that function independent of the sole shape with certain
    ski-binding systems. This document is applicable to ski-boots of sizes 15,0 and
    larger in the Mondopoint system (see Annex A). It is applicable to rigid touring
    boots. Boots with softer shells such as Telemark boots are excluded as they do
    not have the necessary shell stability to act as part of the release systems.
