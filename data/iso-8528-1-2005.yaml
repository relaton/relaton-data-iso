abstract:
- language: en
  script: Latn
  content: ISO 8528-1:2005 defines various classifications for the application, rating
    and performance of generating sets consisting of a Reciprocating Internal Combustion
    (RIC) engine, Alternating Current (a.c.) generator and any associated controlgear,
    switchgear and auxiliary equipment. It applies to a.c. generating sets driven
    by RIC engines for land and marine use excluding generating sets used on aircraft
    or to propel land vehicles and Iocomotives. For some specific applications (e.g.
    essential hospital supplies, high-rise buildings), supplementary requirements
    may be necessary. The provisions of ISO 8528-1:2005 should be regarded as the
    basis for establishing any supplementary requirements. For other reciprocating-type
    prime movers (e.g. sewage-gas engines, steam engines), the provisions of ISO 8528-1:2005
    should be used as a basis for establishing these requirements. Generating sets
    meeting the requirements of ISO 8528-1:2005 are used to generate electrical power
    for continuous, peak-load and standby applications. The classifications laid down
    in ISO 8528-1:2005 are intended to help understanding between manufacturer and
    customer.
