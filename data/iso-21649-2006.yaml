abstract:
- language: en
  script: Latn
  content: ISO 21649:2006 applies to safety and performance and testing requirements
    for single-use and multiple-use needle-free injection systems intended for human
    use in clinics and other medical settings and for personal use by patients. The
    dose chamber of the injection system is often disposable and intended to be replaced
    after either a single use or a limited number of uses. It is sometimes separable
    from the injection mechanism and often termed a "cartridge", "ampoule", "syringe",
    "capsule" or "disc". In contrast, the dose chamber also may be a permanent internal
    chamber designed to last through the claimed life of the device.
