abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and gives guidance for conducting
    a critical review of any type of life cycle assessment (LCA) study and the competencies
    required for the review. It provides additional requirements and guidance to ISO 14040
    and ISO 14044. This document provides: —     details of a critical review process,
    including clarification with regard to ISO 14044; —     guidance to deliver the
    required critical review process, linked to the goal of the LCA and its intended
    use; —     content and deliverables of the critical review process; —     guidance
    to improve the consistency, transparency, efficiency and credibility of the critical
    review process; —     the required competencies for the reviewer(s) (internal,
    external and panel member); —     the required competencies to be represented
    by the panel as a whole. This document can be applicable to other standards that
    require independent review of LCA-based procedures and information (e.g. ISO 14045,
    ISO 14046, ISO 14025, ISO 14067), and can be adapted to the specific fields of
    application. Other reference standards can be included in the critical review
    process. This document does not apply to a)       critical reviews performed prior
    to its publication, and b)       the applications of LCA (as illustrated in ISO 14040:2006,
    Figure 1).'
