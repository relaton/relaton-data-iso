abstract:
- language: en
  script: Latn
  content: The ISO/IEC 15946 series specifies public-key cryptographic techniques
    based on elliptic curves described in ISO/IEC 15946-1. This document defines elliptic
    curve generation techniques useful for implementing the elliptic curve based mechanisms
    defined in ISO/IEC 29192‑4, ISO/IEC 9796‑3, ISO/IEC 11770‑3, ISO/IEC 14888‑3,
    ISO/IEC 18033‑2 and ISO/IEC 18033‑5. This document is applicable to cryptographic
    techniques based on elliptic curves defined over finite fields of prime power
    order (including the special cases of prime order and characteristic two). This
    document is not applicable to the representation of elements of the underlying
    finite field (i.e. which basis is used).
