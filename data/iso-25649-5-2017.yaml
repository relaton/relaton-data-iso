abstract:
- language: en
  script: Latn
  content: 'ISO 25649-5:2017 is applicable for CLASS C classified floating leisure
    articles for use on and in water according to ISO 25649‑1 regardless of whether
    the buoyancy is achieved by inflation or inherent buoyant material. ISO 25649-5:2017
    is to be applied with ISO 25649‑1 and ISO 25649‑2. NOTE 1 Typical products forming
    class C (see Annex B): - tube riders towable with interior holding facility and
    closed cockpit; - raft riders towable; - board riders towable; - banana type towable.
    NOTE 2 Typical places for application: - distant from bathing areas and other
    frequented water surfaces, wide empty spaces, dedicated racetracks (parcours);
    - no to little waves; - no strong currents.'
