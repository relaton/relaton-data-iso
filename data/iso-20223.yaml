abstract:
- language: en
  script: Latn
  content: This document defines how to represent and uniquely identify by an alpha-numerical
    label the situation features of an integral surface or a collection of integral
    surfaces of a part, and how to indicate it in a technical product documentation
    (drawing), if needed to improve human readability. The proportions and dimensions
    of the graphical symbols to be used are also specified.
