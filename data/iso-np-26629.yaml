abstract:
- language: en
  script: Latn
  content: This standard describes a quantitative method for determining nanometre-scale
    roughness using atomic force microscopy. It describes procedures for quantitatively
    determining actual roughness using multiple probes with different tip curvatures.
    This method targets the roughness ranging from ca 100 pm to 50 nm, which can be
    measured with conventional probes commonly used in atomic force microscopes. It
    also describes how the lower measurement limit is determined due to instrument
    noise.
