abstract:
- language: en
  script: Latn
  content: 'This document establishes the means to achieve an electronic representation
    of rolling bearing data by providing a reference dictionary needed to describe
    various data about rolling bearings together with their descriptive properties
    and domains of values in various International Standards relevant to rolling bearings.
    This document is intended to facilitate the use, manipulation and exchange of
    rolling bearing data, for example, manufacturing, distribution and usage. This
    document specifies a reference dictionary that contains: —    a definition of
    a general class of bearings intended to be further extended by reference dictionaries
    specifying bearings in other International Standards; —    definitions and identifications
    of the classes of rolling bearings as they are described in the various International
    Standards relevant to rolling bearings, with associated classification scheme;
    —    definitions and identifications of data element types that represent properties
    of rolling bearings; —    definitions and identifications of domains of values
    that prove useful for describing the above-mentioned data element types. Each
    class, property or domain of values of this application domain constitutes an
    entry of the reference dictionary defined in this document. It is associated with
    a computer-sensible and a human-readable definition, and with a computer-sensible
    identification. Identification of a dictionary entry allows for unambiguous reference
    from any application. Definitions and identifications of dictionary entries are
    defined by means of standard data, which consist of instances of the EXPRESS entity
    data types defined in the common dictionary schema and in their extensions defined
    in ISO 13584-25. Identification dictionary is given in Annex A. The following
    are within the scope of this document: —    standard data that represent the classes
    of rolling bearings; —    standard data that represent the properties of rolling
    bearings; —    standard data that represent domains of values used for properties
    of rolling bearings. The following are outside of the scope of this document:
    —    methodology for structuring parts families used for specifying standard data
    defined in this document; —    an implementation method by which the standard
    data defined in this document can be exchanged. NOTE 1    The structure of the
    physical file used for exchanging the standard data defined in this document is
    specified in ISO 10303‑21. NOTE 2    The physical file used for exchanging the
    standard data is compliant with ISO 13584-42:2010. NOTE 3    It is intended to
    provide an OntoML-based (XML) representation of the standard data when ISO 13584-32
    (OntoML) is published. This document does not establish the reference dictionaries
    for linear motion rolling bearings and spherical plain bearings.'
