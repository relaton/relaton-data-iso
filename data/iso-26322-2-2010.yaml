abstract:
- language: en
  script: Latn
  content: ISO 26322-2:2010 specifies the general safety requirements and their verification
    for the design and construction of narrow-track and small tractors used in agriculture
    and forestry. It also specifies the type of information on safe working practices,
    including residual risks, to be provided by the manufacturer. It provides technical
    means for improving the level of personal safety of operators and others involved
    in the course of the normal operation, maintenance and use of these tractors.
    It is applicable to narrow-track tractors having at least two axles for pneumatic-tyred
    wheels, or having tracks instead of wheels with a smallest fixed or adjustable
    track width of not more than 1 150 mm, and to small tractors having an unladen
    mass not greater than 600 kg. It is not applicable to vibration or braking.
