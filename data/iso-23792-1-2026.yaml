abstract:
- language: en
  script: Latn
  content: Motorway chauffeur systems (MCS) perform Level 3 automated driving on limited
    access motorways with the presence of a fallback-ready user (FRU). This document
    describes a framework of MCS including system characteristics, system states and
    transition conditions and system functions. This document specifies requirements
    for the basic set of functionalities of a MCS, and test procedures to verify these
    requirements. The requirements include vehicle operation to perform the entire
    dynamic driving task (DDT) within the current lane of travel, to issue a request
    to intervene (RTI) before disengaging, and to extend operation and temporarily
    continue to perform the DDT after issuing an RTI. Requirements and test procedures
    for additional functionalities (such as lane changing) are provided in other parts
    of the ISO 23792 series. Means related to setting a destination and selecting
    a route to reach the destination are not within the scope of this document. This
    document applies to MCS installed in light vehicles[9].
