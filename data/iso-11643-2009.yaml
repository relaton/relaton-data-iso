abstract:
- language: en
  script: Latn
  content: ISO 11643:2009 specifies a method for determining the resistance to solvent
    solutions of the colour and finish of unused, and not yet cleaned, leather. It
    does not cover composite materials or complete leather garments. It is not intended
    to be used to give any guidance on the process to be employed for cleaning garments.
    During the test, the colour of the leather can change and the adjacent fabric
    used can become stained. Additionally, the finish of the leather can be damaged.
    The presence of absorbed water in the leather, adjacent fabric or solvent has
    not been found to be a critical factor in assessing the colour fastness.
