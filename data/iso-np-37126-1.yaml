abstract:
- language: en
  script: Latn
  content: This document specifies a consolidated set of existing indicators from ISO 37120, ISO 37122, ISO 37123, and ISO 37125 that are relevant to the achievement of net zero greenhouse gas emissions by cities and communities. The document identifies and organizes indicators related to greenhouse gas emissions reduction, low-carbon sectoral transition, resilience, and enabling institutional and financial conditions, in accordance with the thematic structure of the ISO 37120 series. This document does not specify detailed technical requirements or performance criteria, and it does not address energy management practices within individual organizations.
