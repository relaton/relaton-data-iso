abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines to prevent cross-infections within a
    hospital, with a specific focus on the separate operation of wards dedicated to
    highly contagious respiratory infectious diseases, transportation of confirmed
    cases of highly contagious respiratory infectious diseases, disinfection, waste
    management, etc. This document applies to the following: a)       separate operation
    of wards dedicated to highly contagious respiratory infectious diseases; b)      
    transportation of confirmed cases of highly contagious respiratory infectious
    diseases and roles of the dedicated healthcare team in a ward dedicated to highly
    contagious respiratory infectious diseases; c)        cleaning, disinfection,
    and waste management.'
