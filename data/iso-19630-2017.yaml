abstract:
- language: en
  script: Latn
  content: ISO 19630:2017 specifies the conditions for the determination of tensile
    properties of single filaments of ceramic fibre such as tensile strength, Young
    modulus and fracture strain. The method applies to continuous ceramic filaments
    taken from tows, yarns, braids and knittings, which have strain to fracture less
    than or equal to 5 %. The method does not apply to carbon fibres that exhibit
    nonlinear stress-strain curve. The method does not apply to checking the homogeneity
    of strength properties of fibres, nor to assessing the effects of volume under
    stress. Statistical aspects of filament failure are not included.
