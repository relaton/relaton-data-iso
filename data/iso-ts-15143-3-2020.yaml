abstract:
- language: en
  script: Latn
  content: This document specifies the communication schema designed to provide mobile
    machinery status data from a telematics provider's server to customer applications
    via the Internet. The data is collected from a mobile machine using telematics
    data-logging equipment and stored on a telematics provider's server. This document
    describes the communications records used to request data from the server and
    the responses from the server containing specified data elements to be used in
    the analysis of machine performance and machine management status related with
    operation and/or maintenance. It is applicable to self-propelled earth-moving
    machinery as defined in ISO 6165 and mobile road construction machinery as defined
    in ISO 22242 equipped with location and time instrumentation. It is not applicable
    to the on-board data collection, on-board communication protocol (e.g. CANbus)
    or wireless transmission of the mobile machinery data to the telematics provider's
    server after the data have been collected at the data logger. See Figure 1.
