abstract:
- language: en
  script: Latn
  content: This document specifies limit deviations and limits of sizes for the pitch
    and crest diameters of the hot-dip galvanized metric external screw threads conforming
    to the coarse thread series of ISO 262 (from M8 to M64) having a basic profile
    according to ISO 68-1. This document is applicable to the hot-dip galvanized metric
    external screw threads to mate with the internal screw threads tapped with tolerance
    position H or G after galvanizing.
