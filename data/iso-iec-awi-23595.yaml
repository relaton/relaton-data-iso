abstract:
- language: en
  script: Latn
  content: 'This document specifies the general user experience design requirements
    for AR/MR/VR from the user''s perspective. It covers six aspects: overall experience,
    virtual environment reminders, enhancement of immersion effects, accessibility,
    kids’ mode, and user experience evaluation. The goal is to ensure users can safely
    use AR/MR/VR equipment and experience AR/MR/VR content in an immersive way. This
    document applies to the production of AR/MR/VR content as well as outlining the
    intended user experience to assist in the design and manufacturing of AR/MR/VR
    equipment.'
