abstract:
- language: en
  script: Latn
  content: The rate of heat release is determined by measuring the oxygen consumption
    derived from the oxygen concentration and the flow rate in the combustion product
    stream. The time to ignition (sustained flaming) is also measured. Products with
    surface irregularities may be tested according to specific requirements.
