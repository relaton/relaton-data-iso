abstract:
- language: en
  script: Latn
  content: For carrying out a project in rock, various properties of the rock mass
    – such as mechanical, hydrological, geometry and discontinuities patterns – must
    be determined. It is particularly important to define the abrasiveness of a rock
    through standardized laboratory test as this property will strongly influence
    the project’s cost-effectiveness due to equipment wear.
