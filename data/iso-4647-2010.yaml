abstract:
- language: en
  script: Latn
  content: ISO 4647:2010 specifies a method for the determination of the static adhesion
    of textile cord to vulcanized rubber using the H‑pull test. It is applicable to
    cords made from natural or man-made fibres. The property levels obtained with
    this method are affected considerably by the history of the cord and the rubber
    compound. The method yields data, however, on which a judgement as to the service
    quality of the material can be based. The method is primarily intended for use
    with tyre cord. However, it can be applied, if desired, to similar cords for use
    in other rubber products, but it is limited to cords of linear density not exceeding
    800 mg/m (tex).
