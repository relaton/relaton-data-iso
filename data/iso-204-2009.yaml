abstract:
- language: en
  script: Latn
  content: ISO 204:2009 specifies the method for the uninterrupted and interrupted
    creep tests and defines the properties of metallic materials which can be determined
    from these tests, in particular the creep elongation and the time of creep rupture,
    at a specified temperature. The stress rupture test is also covered, as is the
    testing of notched test pieces.
