abstract:
- language: en
  script: Latn
  content: ISO 17090-4:2014 supports interchangeability of digital signatures and
    the prevention of incorrect or illegal digital signatures by providing minimum
    requirements and formats for generating and verifying digital signatures and related
    certificates. Furthermore, it defines the provable compliance with a PKI policy
    necessary in the domain of healthcare. This part of ISO 17090 adopts long-term
    signature formats to ensure integrity and non-repudiation in long-term electronic
    preservation of healthcare information. This part of ISO 17090 conforms to ISO/ETSI
    standards for long-term signature formats to improve and guarantee interoperability
    in the healthcare field. There is no limitation regarding the data format and
    the subject for which the signature is created.
