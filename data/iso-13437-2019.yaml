abstract:
- language: en
  script: Latn
  content: This document specifies a method for the on-site installation and retrieval
    of geosynthetic samples, irrespective of the particular degradation mechanisms
    to which they are exposed. The method is also appropriate to test for mechanical
    damage, much of which occurs during installation, and to provide an owner with
    information about the state of the geosynthetic product in their structure.
