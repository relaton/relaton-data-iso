abstract:
- language: en
  script: Latn
  content: 'ISO 10256-3:2016 specifies performance requirements and test methods for
    face protectors (including visors) for use in ice hockey and is intended to be
    used in conjunction with ISO 10256‑1. Requirements and the corresponding test
    methods, where appropriate, are given for the following: a) construction and area
    of coverage; b) resistance to puck impact; c) penetration; d) field of vision;
    e) geometric (visual) optics and acuity; f) transmittance and haze; g) marking
    and information. ISO 10256-3:2016 applies to face protectors worn by - players
    other than goalkeepers, and - certain functionaries (e.g. referees). NOTE 1 The
    requirements of a Clause take precedent over a figure. NOTE 2 The intent is to
    reduce the risk of injury to the face without compromising the form or appeal
    of the game.'
