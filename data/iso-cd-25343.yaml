abstract:
- language: en
  script: Latn
  content: This International Standard develops response sensitivity analysis for
    groundwater monitoring wells using water injection test method. Procedures and
    accuracy requirements for the response sensitivity analysis before measuring water
    levels in a flowing well are also included. This International Standard discusses
    the advantages and limitations of response sensitivity analysis and requirements
    for recording the data. This International Standard suggests the practice of response
    sensitivity analysis for engineers shall be carried out at least once a year for
    long-term groundwater monitoring wells. This International Standard states groundwater
    monitoring wells shall be redeveloped using the same techniques that are used
    for developing newly-installed monitoring wells in order to make sure all long-term
    groundwater monitoring wells function well.
