abstract:
- language: en
  script: Latn
  content: This document specifies general terms and definitions relating to conformity
    assessment (including the accreditation of conformity assessment bodies) and to
    the use of conformity assessment to facilitate trade. The general principles of
    conformity assessment and a description of the functional approach to conformity
    assessment are provided in Annex A. Conformity assessment interacts with other
    fields such as management systems, metrology, standardization and statistics.
    The boundaries of conformity assessment are not defined in this document.
