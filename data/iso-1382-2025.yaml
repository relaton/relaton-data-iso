abstract:
- language: en
  script: Latn
  content: This document establishes a vocabulary of, and is limited to, terms in
    general use throughout the rubber industry. It does not define terms intended
    for particular rubber products. NOTE 1        Refer to the Bibliography for a
    list of example vocabulary standards intended for particular rubber products.
    It does not define terms that are generally understood or adequately defined in
    other readily available sources, such as general dictionaries. NOTE 2        The
    terms are listed in the alphabetical order of the English terms, with an index
    to the corresponding English terms attached.
