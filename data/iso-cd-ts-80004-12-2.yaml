abstract:
- language: en
  script: Latn
  content: ISO/TS 80004-12:2016 lists terms and definitions relevant to quantum phenomena
    in nanotechnologies. All of these terms are important for nanotechnologies, but
    it is to be noted that many of them are not exclusively relevant to the nanoscale
    and can also be used to some extent to refer to larger scales. The list of terms
    presented does not claim to provide exhaustive coverage of the whole spectrum
    of quantum concepts and phenomena in nanotechnology. It covers important phenomena
    as acknowledged by many stakeholders from academia, industry, etc. ISO/TS 80004-12:2016
    is intended to facilitate communication between organizations and individuals
    in industry and those who interact with them.
