abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for stationary, electrically
    powered central suction source equipment, including centrally located amalgam
    separators and air water separators. It also specifies requirements for information
    to be supplied by the manufacturer on the performance, installation, operation
    and maintenance of the central suction source equipment as part of the complete
    dental suction system. This document specifies requirements for central suction
    source equipment used to provide vacuum pressure and flow at the facility pipeline
    connection point. This document does not apply to portable suction source equipment,
    air/water venturi suction source equipment, or to suction source equipment located
    in the treatment room. It also does not apply to suction source equipment used
    for life support or for scavenging halogenated anaesthetic gases. This document
    does not include requirements for facility and exhaust piping systems or treatment
    room equipment.
