abstract:
- language: en
  script: Latn
  content: This document specifies the test method for the determination of the resistance
    of protective glove materials to degradation by dangerous chemicals with continuous
    contact. NOTE Annex A gives information on interlaboratory test results on this
    method. It is preferable that other tests used in addition to the evaluation of
    chemical resistance such as permeation resistance and penetration, as the chemical
    test do not provide sufficient information on the physical property changes affecting
    a glove during exposure to a chemical. It is necessary that the outside surface
    of the glove be exposed to the chemical.
