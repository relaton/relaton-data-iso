abstract:
- language: en
  script: Latn
  content: ISO 11963:2012 specifies the requirements for solid, flat extruded sheets
    of polycarbonate (PC) for general applications. It applies specifically to sheets
    made of poly(p,p′-isopropylidenediphenyl carbonate). The sheets may be coloured
    or colourless, and they may be transparent, translucent or opaque. The sheets
    may also have a special weather-protective layer on one or both surfaces. ISO
    11963:2012 applies only to thicknesses equal to or greater than 1,5 mm.
