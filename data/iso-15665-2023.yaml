abstract:
- language: en
  script: Latn
  content: This document defines the acoustic performance of four classes (Classes A,
    B, C and D) of pipe insulation. It also defines a standardized test method for
    measuring the acoustic performance of any type of material system construction,
    thereby allowing existing and new insulation constructions to be rated against
    the four classes. Furthermore, this document presents some typical types of construction
    that would be expected to meet these acoustic performance classes. This document
    is applicable to the acoustic insulation of cylindrical steel pipes and to their
    piping components. It is valid for pipes up to 1 m in diameter and a minimum wall
    thickness of 4,2 mm for diameters below 300 mm, and 6,3 mm for diameters from
    300 mm and above. It is not applicable to the acoustic insulation of rectangular
    ducting and vessels or machinery. This document covers both design and installation
    aspects of acoustic insulation and provides guidance to assist noise control engineers
    in determining the required class and extent of insulation needed for a particular
    application. It gives typical examples of construction methods, but the examples
    are for information only and not meant to be prescriptive. This document emphasises
    the aspects of acoustic insulation that are different from those of thermal insulation,
    serving to guide both the installer and the noise control engineer. Details of
    thermal insulation are beyond the scope of this document.
