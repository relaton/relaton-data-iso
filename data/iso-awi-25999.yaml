abstract:
- language: en
  script: Latn
  content: This document provides API (Application Programming Interface) specifications
    and specific examples for searching human biological material and associated data
    across biobank networks managed on a regional and national basis. This document
    is applicable to systems for searching across international networks of biobanks
    for human biological material and associated data. This document sets minimum
    requirements for a cross search of the international biobank network. This document
    does not apply to cross searches within a regional and national network of biobanks.
    For the purpose of this document, "human samples" include microbiome, derivatives
    and other relevant biological material.
