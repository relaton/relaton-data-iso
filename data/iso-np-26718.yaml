abstract:
- language: en
  script: Latn
  content: This document provides a method for separation, collection, and determination
    of trace magnetic impurities in oxide ceramic powders. This document applies to
    the determination of the total content of magnetic impurities (iron, cobalt, chromium,
    nickel, and zinc) between 0,005 and 20 mg/kg which can be attracted by magnet.
    This document is applicable to oxide ceramic powders such as zirconia (ZrO2) and
    alumina (Al2O3). It can also serve as a reference for the separation and determination
    of trace magnetic impurities in other non-oxide ceramic powders.
