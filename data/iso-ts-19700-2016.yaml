abstract:
- language: en
  script: Latn
  content: ISO/TS 19700:2016 describes a steady-state tube furnace (SSTF) method for
    the generation of fire effluent for the identification and measurement of its
    constituent combustion products, in particular, the yields of toxicants under
    a range of fire decomposition conditions. It uses a moving test specimen and a
    tube furnace at different temperatures and airflow rates as the fire model. The
    interlaboratory reproducibility has been assessed with selected homogenous thermoplastic
    materials and this document is therefore limited in applicability to such materials.
    The method is validated for testing homogeneous thermoplastic materials that produce
    yields of a defined consistency. See limitations in Clause 12.
