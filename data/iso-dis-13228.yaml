abstract:
- language: en
  script: Latn
  content: 'This standard applies to lidars installed on road vehicles to measure
    or detect the surroundings of the vehicle. This standard applies to lidars used
    on all types of road vehicles regardless of vehicle classifications, including
    passenger cars, buses, commercial vehicles, trailers, etc. This standard describes
    a series of test methods to assist in evaluating the performance of lidars. The
    tests should cover the following: 1. The common performance specifications (e.g.
    Range capability, Range precision). 2. The common performance characteristics
    (e.g. Anti-interference, Ghost points). 3. Possible alteration of performance
    test caused by environmental conditions. 4. Lidar performance for the union of
    both ADAS/AD application scenarios. This standard does not address test methods
    for reliability, functional safety, and cybersecurity. Note: The definition of
    “Road Vehicles” includes M1~M3, N1~N3, and L6~L7 according to consolidated resolution
    on the construction of vehicles (R.E.3).'
