abstract:
- language: en
  script: Latn
  content: This document is applicable to the radiation shielding design and evaluation
    work for medical proton accelerators of proton energies ranging from 70 MeV to
    250 MeV, with subsystems such as beam transport system and nozzle components.
    The radiation protection recommendations given in this document cover the aspects
    relating to regulations, shielding design goals and other design criteria, role
    of the manufacturers, of the radiation protection officer or qualified expert,
    the medical physicist, the licensee and interactions between them, sources and
    radiations around a proton accelerator, shielding for accelerators and its subsystems
    (including shielding materials and transmission values, calculations for various
    room configurations, duct impact on radiation protection) and the radiological
    measurements. FLASH proton therapy is not covered by this document. NOTE 1       
    Annex A provides a list of the most used Monte-Carlo codes for shielding calculation.
    NOTE 2        Annex B provides the analytical methods and the corresponding necessary
    data for shielding calculation. NOTE 3        Annex C provides a set of examples
    on shielding calculation of barriers, maze and skyshine problems. NOTE 4       
    Annex D provides radiation shielding consideration on special topics.
