abstract:
- language: en
  script: Latn
  content: ISO 19220:2004 specifies the requirements for solid-wall styrene copolymer
    blend (SAN + PVC) pipes and fittings for soil and waste discharge (low and high
    temperature) above ground inside buildings, as well as the system itself. It does
    not include buried pipework. It is applicable to pipes and fittings designed for
    jointing by means of elastomeric sealing rings, solvent cementing or integral
    dual-purpose sockets, i.e. for elastomeric ring seal joints and/or for solvent
    cement joints.
