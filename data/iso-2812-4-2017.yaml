abstract:
- language: en
  script: Latn
  content: ISO 2812-4:2017 specifies spotting methods for determining the resistance
    of an individual-layer or multi-layer system of coating materials to the effects
    of liquids or paste-like products. These methods enable the testers to determine
    the effects of the test substance on the coating and, if necessary, to assess
    the damage to the substrate.
