abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies safety requirements in design of onshore maritime terminal for storing liquid hydrogen (LH2) and loading/unloading them between ship and shore. The designated boundary limits are the ship’s manifold for loading/unloading and the truck loading/unloading connection. The boundary with the piping system is decided through negotiation between parties. Note1: The new standard focuses on general requirements for the LH2 terminal, utilizing a comprehensive risk assessment approach to offer guidance on mitigation barriers, safety distances, and the terminal''s overall layout. Note2: This standard will not establish prescriptive general requirements for equipment installed within the terminal, such as liquefaction units, storage tanks, or vaporizers etc. Only specific requirements directly pertaining to the terminal''s safety and operational integrity will be incorporated. Note3: Furthermore, this standard is not applicable to industrial installations other than LH2 terminals. Supplement; the safety requirements include material compatible with hydrogen or cryogenic temperature, insulation against cryogenic, hydrogen leakage or diffusion, hydrogen explosion or combustion and so on.'
