abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1111:2018-11 specifies the application module for Classification
    with attributes. The following are within the scope of ISO/TS 10303-1111:2018-11:
    assignment of classification information to product or activity data; definition
    of a classification with valued attributes; association of a classification with
    its identification in an external library; definition of a hierarchical relationship
    between two classes; characterization of the fact that a part or material was
    specified selecting particular values of parameters in a parameterized classification;
    identification of a classification system; items within the scope of application
    module Classification assignment, ISO/TS 10303-1114; items within the scope of
    application module Extended measure representation, ISO/TS 10303-1106; items within
    the scope of application module Identification assignment, ISO/TS 10303-1021;
    items within the scope of application module Independent property, ISO/TS 10303-1036;
    items within the scope of application module Plib class reference, ISO/TS 10303-1291;
    items within the scope of application module Product view definition, ISO/TS 10303-1019.'
