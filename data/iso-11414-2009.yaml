abstract:
- language: en
  script: Latn
  content: ISO 11414:2009 specifies a method for preparing butt-fusion-jointed test
    piece assemblies between polyethylene (PE) pipes and spigot-ended fittings. ISO
    11414:2009 specifies the assembly parameters involved, such as the ambient temperature,
    joint geometry and fusion parameters, taking into account the service condition
    limits specified in the relevant product standards, as well as the type of pipe
    to be used. ISO 11414:2009 is intended to enable the effect of site assembly variables
    on joint performance to be determined. The fusion-jointing procedures and parameters
    used in the field can differ from those in ISO 11414:2009, depending on the manufacturer's
    written procedures and/or local standards.
