abstract:
- language: en
  script: Latn
  content: 'This document defines detailed use cases, requirements, and message specifications for central ITS station (C-ITS-S) based guidance, in which a personal or vehicle ITS station (P/V-ITS-S) provides a destination and reports its position to a C-ITS-S, and the C-ITS-S returns continuous turn-by-turn guidance instructions and hazard notifications to the P/V-ITS-S. This document defines: — a set of detailed use cases for the establishment of a guidance session, periodic position reporting and guidance delivery, and hazard and event notification between a P/V-ITS-S and a C-ITS-S; — requirements for server-based guidance that support the use cases above; — message specifications, including data models and ASN.1 encoding, for the messages exchanged between a P/V-ITS-S and a C-ITS-S to perform server-based guidance. The message specifications include mandatory, conditional, and optional elements.'
