abstract:
- language: en
  script: Latn
  content: The proposed international standard specifies a method for determining
    desorbed shale gas content at drilling sites. The principle of this method is
    to heat the core after being extracted from the drilling site to the temperature
    of the formation fluid and the bottom of the well, obtain the desorbed gas volume
    using a measuring device, regress the loss gas volume of the core from the bottom
    of the well to the wellhead through the relationship curve between desorption
    gas volume and time, then crush the sample to obtain the residual gas volume at
    the bottom of the well temperature, and finally add up the loss gas volume, desorption
    gas volume, and residual gas volume to obtain the shale gas content of the reservoir.
