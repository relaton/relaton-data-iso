abstract:
- language: en
  script: Latn
  content: This document specifies the general technical requirements for the flight control system (FCS) of uncrewed electric vertical take-off and landing aircraft (eVTOL) with the maximum take-off mass (MTOM) greater than 150 kilograms, suitable for manned flight. The eVTOL aircraft defined herein fall under Class VI unmanned aircraft systems (UAS) as classified in ISO 21895, and include configurations such as multirotor, compound wing, tiltrotor, etc. The functional scope of the FCS in this document encompasses flight control, flight management, integrated navigation, ground control interaction, and flight recording. This standard is applicable to the design and development of uncrewed eVTOL FCSs, subsystems, and related equipments.
