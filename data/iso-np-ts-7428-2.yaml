abstract:
- language: en
  script: Latn
  content: This document specifies a method for characterizing and declaring fine bubble generation performance of showerheads and faucets under specified inlet water pressure and hydraulic loss conditions. This document applies to domestic showerheads and faucets that are intended to generate fine bubbles using the pressure and flow of supplied water. This document specifies reportable parameters including inlet water pressure, flow rate with and without the fine bubble product or reference outlet, flow-rate loss ratio, hydraulic loss, and the size and number concentration of generated microbubbles and/or ultrafine bubbles measured in accordance with relevant fine bubble measurement standards. This document does not specify requirements for cleaning, washing, health, comfort, water-saving, durability, mechanical safety or sanitary tapware performance. Such functions, when claimed, should be evaluated using the relevant application-specific standards. This document does not establish pass/fail criteria or performance grades unless such criteria are specified separately by the manufacturer, purchaser, regulator or another applicable standard.
