abstract:
- language: en
  script: Latn
  content: ISO 17287:2003 specifies a procedure for assessing whether specific TICS,
    or a combination of TICS with other in-vehicle systems, are suitable for use by
    drivers while driving. It addresses user-oriented TICS description and context
    of use, TICS task description and analysis, assessment process, and documentation.
    The TICS description and context of use includes consideration of improper use,
    reasonably foreseeable misuse and TICS failure. The TICS description, analysis
    and assessment include a process for identifying and addressing suitability issues.
    ISO 17287:2003 does not recommend specific variables for assessing suitability
    nor does it define criteria for establishing the suitability of use of a TICS
    Table while driving.
