abstract:
- language: en
  script: Latn
  content: 'This document establishes content for commercial specifications for sweepers
    that are self-propelled (see Annex A) with an integrated chassis, chassis-mounted,
    pedestrian-controlled or towed behind a vehicle. This document applies to road
    surface cleaning machines used in outdoor improved surface applications for cleaning
    debris from public areas, roads, airports and industrial plants. This document
    does not specifically cover the carrier vehicle or towing vehicle (e.g. lorry).
    This document does not apply to: —     cleaning machines for winter maintenance;
    —     cleaning machines for indoor applications; —     rotary road brush attachments
    which can be coupled to tractors and other machinery; —     machines or components
    that are specifically designed for cleaning tram lines and rail tracks; —    
    industrial sweepers.  '
