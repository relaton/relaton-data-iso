abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the estimation of the short chain
    branching distribution of semicrystalline ethylene 1-olefin copolymers by successive
    self-nucleation and annealing (SSA) with conventional, high performance and fast
    differential scanning calorimetry. This document is applicable to the estimation
    of the short chain branching distribution of raw materials of semicrystalline
    ethylene 1-olefin copolymers and its products. Quantitative calculation of short
    chain branching content, degree of crystallinity and short chain branching distribution
    is applicable to ethylene/1-butene copolymers, ethylene/1-hexene copolymers and
    ethylene/1-octene copolymers.
