abstract:
- language: en
  script: Latn
  content: This document specifies the International Standard Recording Code (ISRC)
    for the unique identification of recordings. The ISRC is applicable to the identification
    of audio recordings and music video recordings whether they are in analogue or
    digital form. The ISRC is not applicable to the numbering of audio or audiovisual
    products or carriers. Neither is it applicable to the numbering of packages of
    audio recordings or music video recordings with other media items. The ISRC is
    applicable to music video recordings even if they have been assigned an International
    Standard Audiovisual Number (ISAN) in accordance with ISO 15706 (all parts), or
    a Digital Object Identifier (DOI) in accordance with ISO 26324, but it is not
    applicable to other forms of audiovisual recording.
