abstract:
- language: en
  script: Latn
  content: 'ISO 10683:2014 specifies requirements for non-electrolytically applied
    zinc flake coatings for steel fasteners. It applies to coatings: with or without
    hexavalent chromium; with or without top coat; with or without lubricant (integral
    lubricant and/or subsequently added lubricant). It applies to bolts, screws, studs
    and nuts with ISO metric thread, to fasteners with non-ISO metric thread, and
    to non-threaded fasteners such as washers, pins, clips, etc. ISO 10683:2014 does
    not specify requirements for such fastener properties as weldability or paintability.
    It does not apply to mechanically applied zinc coatings.'
