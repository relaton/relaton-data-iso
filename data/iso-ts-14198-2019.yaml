abstract:
- language: en
  script: Latn
  content: This document provides procedures that can be used as a secondary task
    in a dual task setting to determine whether that evaluation setting is standardized
    and valid for purposes of assessing driver attentional demand due to the use of
    an in-vehicle system. This document does not define calibration procedures for
    other evaluation activities that a laboratory might undertake. This document provides
    guidance on selecting a calibration task given a specific primary task. The primary
    tasks of interest include those that would be used in the evaluation of attentional
    demand. Such primary tasks are defined in other documents. The description of
    a calibration task includes its application, experimental setup, data collection,
    and procedures for analysis of results. The purpose of this document is not to
    define a reference criterion as to whether a given secondary task is suitable
    for use while driving. Although specific settings of parameters of a calibration
    task might be used to realize such a predefined pass/fail criterion, this document
    does not provide such a criterion for a given level of attentional demand.
