abstract:
- language: en
  script: Latn
  content: 'This document provides recommendations regarding: —    monitoring the
    quality of treated wastewater (TWW) for irrigation; —    monitoring irrigated
    plants; —    monitoring the soil with regard to salinity; —    monitoring natural
    water sources in neighbouring environments; —    monitoring the quality of water
    in storage reservoirs. It puts emphasis on sampling methods and their frequency.
    Regarding the methods of analysis, this document refers to standard methods or,
    where not available, to other bibliographical references. NOTE       In cases
    where a monitoring plan already exists, these recommendations can be integrated
    into this plan. This is notably the case when a broader approach of risk management
    is implemented, such as the water safety plans (serving as a model for sanitation
    safety plans) developed by WHO[16].'
