abstract:
- language: en
  script: Latn
  content: ISO 9117-1:2009 specifies a test method for determining under standard
    conditions whether a single coat or a multi-coat system of paint, varnish or related
    material has reached the through-dry state after a specified drying period. The
    test procedure may also be used to determine the time taken to achieve that state.
