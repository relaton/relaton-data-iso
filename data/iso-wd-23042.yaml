abstract:
- language: en
  script: Latn
  content: 'This document defines a reference architecture for DLT-based decentralized
    identity systems. This includes: - The lifecycle management of digital identities
    and associated attributes and credentials in a decentralized identity system including
    migration of individual digital identities into another system - The lifecycle
    management of the relevant actors and entities, including digital wallets, within
    a decentralized identity system - The use of trust anchors through a decentralized
    identity system - The entire lifecycle management of the decentralized identity
    system'
