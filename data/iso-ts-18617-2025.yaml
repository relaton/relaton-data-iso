abstract:
- language: en
  script: Latn
  content: This document describes the ergonomic design criteria and test evaluation
    methods for the hand holes of handheld packages that are handled by human operators
    during the distribution and logistics process. This document is applicable to
    handheld packages with a maximum weight of up to 23 kg. This document does not
    cover all issues of safety, health, and the environment related to the handling
    of packages.
