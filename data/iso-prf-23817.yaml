abstract:
- language: en
  script: Latn
  content: This document provides the guidance to perform commissioning testing for
    ballast water management system (BWMS) using electrolytic methods following the
    installation on board a ship. It specifies the procedures for installation inspection,
    commissioning to test the BWMS, biological efficacy verification and training
    of crews, in order to verify the BWMS functions and operates properly.
