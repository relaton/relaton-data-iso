abstract:
- language: en
  script: Latn
  content: ISO 10342:2010 together with ISO 15004‑1, specifies requirements and test methods for eye refractometers using an objective measuring principle. It is limited to the measurement of spherocylindrical refractive error. ISO 10342:2010 takes precedence over ISO 15004‑1, if differences exist.
