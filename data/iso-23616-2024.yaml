abstract:
- language: en
  script: Latn
  content: 'This document provides requirements, guidance and recommendations for
    the cleaning, inspection, and repair of PPE for use by firefighters. This document
    is intended to be used by those responsible for the cleaning, inspections, and
    repair of firefighters PPE, however, it will also provide vital guidance to those
    who are responsible for establishing such a program including fire and rescue
    services. This document does not cover the following at this time: a)       chemical
    protective clothing; b)       PPE required for protection against chemical, biological,
    radiological and nuclear (CBRN) materials. The selection and use of personal protective
    equipment (PPE) for firefighters are covered by ISO/TR 21808.'
