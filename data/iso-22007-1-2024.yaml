abstract:
- language: en
  script: Latn
  content: This document describes the background to methods for the determination
    of the thermal conductivity and thermal diffusivity of polymeric materials. Different
    techniques are available for these measurements and some can be better suited
    than others for a particular type, state and form of material. This document provides
    a broad overview of these techniques. Standards specific to these techniques,
    as referenced in this document, are used to carry out the actual test method.
