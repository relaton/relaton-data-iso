abstract:
- language: en
  script: Latn
  content: 'ISO 10360-7:2011 specifies the acceptance tests for verifying the performance
    of a coordinate measuring machine (CMM) used for measuring linear dimensions as
    stated by the manufacturer. It also specifies the reverification tests that enable
    the user to periodically reverify the performance of the CMM. The acceptance and
    reverification tests given in ISO 10360-7:2011 are applicable only to Cartesian
    CMMs using imaging probing systems of any type operating in the discrete-point
    probing mode. ISO 10360-7:2011 does not explicitly apply to: non-Cartesian CMMs,
    although parties may apply it to non-Cartesian CMMs by mutual agreement; CMMs
    using other types of optical probing, although parties may apply this approach
    to other optical CMMs by mutual agreement; CMMs using contact probing systems
    (see ISO 10360-2 for contact probing systems). ISO 10360-7:2011 specifies performance
    requirements that can be assigned by the manufacturer or the user of a CMM, the
    manner of execution of the acceptance and reverification tests to demonstrate
    the stated requirements, rules for proving conformance, and applications for which
    the acceptance and reverification tests can be used.'
