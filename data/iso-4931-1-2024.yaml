abstract:
- language: en
  script: Latn
  content: 'The document provides principles, framework, and guidance for resilience
    design adaptive to climate change (RDACC) in buildings and civil engineering works.
    RDACC is applicable to both new construction and retrofits. RDACC does not address:
    —     adaptation to climate change in the production and procurement of building
    materials, components and devices; —     adaptation to climate change in construction
    processes; —     climate change mitigation in buildings and civil engineering
    works; —     emergency management related to climate change in buildings and civil
    engineering works.'
