abstract:
- language: en
  script: Latn
  content: This standard addresses spacecraft utilizing continuous low-thrust propulsion systems and, considering the particularities of their attitude and orbit control operations, defines the classification of executable in-orbit tasks. It specifies the associated operational modes, control strategies, critical mission phases, and operational requirements for each task type, with a particular focus on coordination between onboard autonomy and ground segment support. Additionally, this standard identifies the specific constraints and supplementary requirements applicable to the use of continuous low-thrust propulsion as an operational means for attitude and orbit control. This standard is primarily applicable to spacecraft employing continuous low-thrust propulsion technologies—such as electric propulsion—for performing in-orbit attitude and orbit control operations
