abstract:
- language: en
  script: Latn
  content: 'This document specifies two methods for the determination of the specific
    heat capacity of ceramic matrix composites with continuous reinforcements (1D,
    2D, 3D). Unidirectional (1D), bi-directional (2D) and tridirectional (XD, with
    2 < X ≤ 3). The two methods are: —    method A: drop calorimetry; —    method
    B: differential scanning calorimetry. The two methods are applicable from ambient
    temperature up to a maximum temperature that is method dependent: method A can
    be used up to 3 000 K, while method B is limited to 1 900 K.'
