abstract:
- language: en
  script: Latn
  content: This standard establishes the principles for estimating RBE-weighted absorbed
    dose for acute exposure and describes the estimation methods, including acute
    exposure pathways, RBE values for evaluating deterministic effects, and dose coefficients
    related to the estimation of internal and external exposure doses. It provides
    technical support for dose assessment and emergency protective actions in nuclear
    and radiation accidents. This standard is applicable to the estimation of acute
    exposure doses in the emergency management of nuclear and radiation accidents
