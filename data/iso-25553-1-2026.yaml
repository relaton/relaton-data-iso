abstract:
- language: en
  script: Latn
  content: This document provides requirements and guidance for the planning, development,
    implementation and evaluation of smart multigenerational neighbourhoods. It establishes
    a framework for neighbourhoods to deploy enabling systems that actively support,
    adapt to and care for people of different ages and abilities as their needs change
    across the life course, enhancing wellbeing and addressing long-term pressures
    related to ageing, health, care and community resilience. This document applies
    to both new developments and the enhancement, regeneration and retrofitting of
    existing neighbourhoods and real estate. It is intended for use by public authorities,
    investors, planners, developers, designers, service and technology providers,
    systems integrators, and community and civic organisations involved in neighbourhood
    planning, delivery and long-term stewardship.
