abstract:
- language: en
  script: Latn
  content: This document specifies requirements for and guidance on the implementation
    and operation of processes and systems to manage, store and provide access to
    electronically stored information (ESI) in a trustworthy and reliable manner.
    Such ESI can be of any type, including “page based” information, information in
    databases and audio/video information. This document is intended for any organization
    that uses processes and systems to store trustworthy ESI over time. Such processes
    and systems incorporate policies, procedures, technology and audit requirements
    that ensure that trustworthiness of the ESI is maintained. This document does
    not cover processes and systems used to evaluate whether ESI can be considered
    trustworthy before it is stored or imported into the system. However, it can be
    used to demonstrate that, once the electronic information is stored, output from
    the system will be a true and accurate reproduction of the ESI.
