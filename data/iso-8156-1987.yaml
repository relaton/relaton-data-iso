abstract:
- language: en
  script: Latn
  content: The index determined by the method specified provides a means of assessing
    the solubility of dried whole milk, dried partly skimmed milk and dried skimmed
    milk. The method is also applicable to dried whey, dried buttermilk and dried
    milk-based baby food as well as to any dried products in which milk fat have been
    replaced by another fat or which have been roller-dried instead of spray-dried.
