abstract:
- language: en
  script: Latn
  content: ISO 845:2006 specifies a method for determining the apparent overall density
    and the apparent core density of cellular plastics and rubbers. If the material
    to be tested includes skins formed during a moulding/extrusion, the apparent overall
    density or the apparent core density, or both, can be determined. If the material
    does not have skins formed during moulding, the term "overall density" is not
    applicable.
