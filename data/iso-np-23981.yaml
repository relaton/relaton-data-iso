abstract:
- language: en
  script: Latn
  content: 'This document defines two levels of quality requirements, comprehensive
    and elementary, and selection criteria for mechanical joining of sheet materials.
    It applies to manufacturing, both in workshops and at field installation sites.
    This document specifies requirements for the demonstration of the capability to
    fulfil specified quality requirements, in one or more of the following: — a contract
    between involved parties; — an application standard; — a regulatory requirement.
    This document is applicable to automated and semi-automatic processes for mechanical
    joining of sheet materials for mass production that can be applied up to a single
    sheet thickness of 4,5 mm. The term “sheet”, as used in this document, includes
    extrusions, cast and moulded materials. This document can be applicable to: —
    combinations of metallic materials; — metallic and non-metallic materials; — combinations
    of non-metallic materials. This can also include the use of adhesives applied
    to the sheets in combination with mechanical joining. The application of adhesives
    is not addressed by this document. This document: — is independent of the type
    of mechanically joined construction to be manufactured; — defines quality requirements
    for mechanical joining both in production plants and on site; — provides guidance
    for describing the capability of a manufacturer to produce mechanical joined constructions
    to meet specified requirements; — can also be used as a basis for assessing the
    manufacturer in respect to his mechanical joining capability; Joint design and
    lifecycle of completed joints are outside the scope of this document and are determined
    by reference to other standards. This document does not apply to building fasteners
    or structural bolting for civil engineering applications and aerospace applications
    which are covered by other standards.'
