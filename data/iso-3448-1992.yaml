abstract:
- language: en
  script: Latn
  content: Establishes a system of viscosity classification for industrial liquid
    lubricants and related fluids including mineral oils used as lubricants, hydraulic
    fluids, electrical oils and for other applications. The usual method for kinematic-viscosity
    determination is that specified in ISO 3104. There may be some pure chemicals
    and naturally occurring products, used as lubricants, which will not fall within
    the classification.
