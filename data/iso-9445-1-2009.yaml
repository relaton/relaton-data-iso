abstract:
- language: en
  script: Latn
  content: ISO 9445-1:2009 specifies the tolerances on dimensions and form for continuously
    cold-rolled stainless steel narrow strip, in thicknesses of up to and including
    3 mm and in rolling widths of less than 600 mm. It also applies to cut lengths
    taken from such strip. Narrow strip and cut lengths with widths of less than 600
    mm, which are manufactured from wide strip by longitudinal slitting, are covered
    in ISO 9445-2.
