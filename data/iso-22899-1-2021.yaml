abstract:
- language: en
  script: Latn
  content: This document describes a method of determining the resistance to jet fires
    of passive fire protection materials and systems. It gives an indication of how
    passive fire protection materials behave in a jet fire and provides performance
    data under the specified conditions. It does not include an assessment of other
    properties of the passive fire protection material such as weathering, ageing,
    shock resistance, impact or explosion resistance, or smoke production. Complete
    I-beams and columns cannot be tested to this document due to disruption of the
    characteristics of the jet.
