abstract:
- language: en
  script: Latn
  content: This document provides general requirements, recommendations and examples
    of safety methods to ensure the safety of operation of manual and rear-loaded
    refuse collection vehicles (RCVs). This document applies to manual and rear-loaded
    RCVs with rotating plate loading systems, compression plate loading systems and
    rotating drum loading systems, and covers methods for ensuring safety with regard
    to the loading systems and discharge systems. This document applies to the design
    and manufacture of manual and rear-loaded RCVs to ensure that they can be operated,
    adjusted and maintained such that they function properly. This document is not
    applicable to the handling of loads the nature of which can lead to dangerous
    situations (e.g. hot refuse, acids and bases, radioactive materials, contaminated
    refuse, especially fragile loads, explosives).
