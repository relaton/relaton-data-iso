abstract:
- language: en
  script: Latn
  content: EMV is the payment technology used by all credit cards and debit cards
    that have an embedded chip (and wallet equivalents), which lets the cardholder
    more securely make a transaction. "EMV" stands for Europay, Mastercard and Visa,
    the companies that developed EMV payment technology in 1994. Now, EMV technology
    is managed by EMVCo, an organisation whose members include Mastercard, Visa, American
    Express, Discover, JCB and UnionPay. The scope of this international standard
    is the development of a method of tokenisation for contactless EMV (cEMV) cards
    (both physical and wallet emulations) for purposes of transport ticketing, when
    used for Pay-As-You-Go ticketing and when used as a proof of ID/travel entitlement
    when travelling.
