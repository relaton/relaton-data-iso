abstract:
- language: en
  script: Latn
  content: This document specifies the properties and acceptable tolerances for bonded
    man-made mineral wool thermal insulating mats (batts and rolls). The mats specified
    in this document are for use within ventilated spaces of buildings where the essential
    ventilation of the space can be restricted if the thickness recovery of the insulation
    is excessive. See ISO 9774:2004, Figure 1, for typical locations. They can be
    supplied flat, folded, or in the form of a roll. This document specifies the properties
    to be declared by the manufacturer at the time of delivery, as well as some test
    methods for the determination of these properties. This document provides limiting
    values for most of the properties. These limiting values are for specification
    purposes only. Mats can be supplied with a factory-applied facing, but facings
    are not covered by this document. Because mats are not generally designed to support
    any applied load, only the mechanical properties required for adequate handling
    during application are specified.
