abstract:
- language: en
  script: Latn
  content: 'This document provides a graphic symbol (pictogram) for each UA configuration
    to the DAA, allowing remote pilots to visually identify it at their station or
    by the personnel indication of the traffic management unit, facilitating compatible
    use and identification between the relevant systems. The extensive document provides
    graphic symbols to facilitate understanding of nonverbal information related to
    the UAS, including, but not limited to, the following: a) For example, public
    information on paper or commercial materials on the web, as well as informing
    or restricting or prohibiting the existence of UA along the streets of parks or
    other areas. b) a safety sign. c) Technical product documents, including manuals,
    user guides, web-based technical instructions, or documents supporting declarations
    of conformity. d) Used in equipment including the display portion of the remote
    pilot station (RPS), the position of the fleet manager''s work, or any display
    used in the ATM or UTM e) Print or display the type of UA that the remote pilot
    can operate with a graphic symbol on the UAS license ISO 22460-1.'
