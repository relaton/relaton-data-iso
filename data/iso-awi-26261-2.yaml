abstract:
- language: en
  script: Latn
  content: 'ISO 26261-2:2017 specifies requirements for the construction, performance
    and protective packaging of Category 4 fireworks, as listed in ISO 26261‑1. ISO
    26261-2:2017 does not apply for articles containing pyrotechnic compositions that
    include any of the following substances: - arsenic or arsenic compounds; - polychlorobenzenes;
    - lead or lead compounds (except for igniters); - mercury compounds; - white phosphorus;
    - picrates or picric acid. ISO 26261-2:2017 does not apply for theatrical pyrotechnic
    articles which are designed for indoor or outdoor stage use, including film and
    television productions or similar use.'
