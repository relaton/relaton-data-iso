abstract:
- language: en
  script: Latn
  content: ISO 230-2-2:2006 specifies methods for testing and evaluating the accuracy
    and repeatability of the positioning of numerically controlled machine tool axes
    by direct measurement of individual axes on the machine. These methods apply equally
    to linear and rotary axes. When several axes are simultaneously under test, the
    methods do not apply. ISO 230-2:2006 can be used for type testing, acceptance
    tests, comparison testing, periodic verification, machine compensation, etc. The
    methods involve repeat measurements at each position. The related parameters of
    the test are defined and calculated. Their uncertainties are estimated as described
    in of ISO/TR 230-9:2005, Annex C.
