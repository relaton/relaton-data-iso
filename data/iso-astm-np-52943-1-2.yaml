abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the additive manufacturing of metallic parts with directed energy deposition in the aerospace industry. Within the application scope of this document, wire is used as feedstock, and laser beam is used as the main energy source, i.e. L-DED-w. Note This process (L-DED-w) of directed energy deposition is also called “Laser Wire Deposition“, “Laser Metal Deposition with Wire (LMD-W)“, “Wire Laser Additive Manufacturing (WLAM)“. This document is to be used in conjunction with the engineering documents, if required by the engineering authority. This document does not address health and safety issues.
