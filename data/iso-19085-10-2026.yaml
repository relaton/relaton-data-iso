abstract:
- language: en
  script: Latn
  content: 'This document gives the safety requirements and measures for building
    site saws, designed to cut wood and materials with similar physical characteristics
    to wood, capable of continuous production use, hereinafter referred to also as
    “machines”. This document deals with all significant hazards, hazardous situations
    or hazardous events, listed in Annex A, relevant to the machines, when it is used
    as intended and under conditions of misuse which are reasonably foreseeable by
    the manufacturer. This document is also applicable to the other life cycle phases
    of the machines: transport, assembly, adjustment, maintenance, dismantling and
    scrapping. This document applies to a machine that can also be fitted with a device
    for the saw blade to be manually raised and lowered through the table, whose hazards
    have been dealt with. This document applies to a machine designed to cut against
    the feed only. This document does not apply to: machines with a maximum saw blade
    diameter smaller than 350 mm or greater than 500 mm; hand-held motor-operated
    electric tools, including any adaptation permitting their use in a different mode,
    i.e. bench mounting; transportable motor-operated electric tools; machines with
    a device to tilt the saw blade for angle cutting, machines with more than one
    saw blade rotational speed and machines equipped with a sliding table. NOTE 1       
    Hand-held motor-operated electric tools are covered by IEC 62841-1 together with
    IEC 62841-2-5. NOTE 2        Transportable motor-operated electric tools are covered
    by IEC 62841-1 together with IEC 62841-3-1. NOTE 3        Machines with the device
    to tilt the saw blade for angle cutting, machines with more than one saw blade
    rotational speed and machines equipped with a sliding table are considered as
    table saws, covered by ISO 19085-9. This document is not applicable to machines
    intended for use in potentially explosive atmospheres or to machines manufactured
    prior to the date of its publication.'
