abstract:
- language: en
  script: Latn
  content: 'ISO 28594:2017 provides a set of accept‑zero sampling systems and procedures
    for planning and conducting inspections to assess quality and conformance to specified
    requirements. In addition, this International Standard provides requirements for
    alternative acceptance methods proposed by the supplier. Such alternative methods
    would be based upon establishing and implementing an internal prevention‑based
    quality management system as a means of ensuring that all products conform to
    requirements specified by the contract and associated specifications and standards.
    ISO 28594:2017, when cited in contract, is applicable to the supplier and extends
    to subcontractors or vendors. The quality plans are to be applied as specified
    in the contract documents, and deliverables may be submitted for acceptance if
    the requirements of this International Standard have been met. Sampling systems
    and procedures in this International Standard are applicable, when appropriate,
    to assess conformance to requirements of the following: a) end items; b) components
    or basic materials; c) operations or services; d) materials in process; e) supplies
    in storage; f) maintenance operations; g) data or records; h) administrative procedures.
    NOTE Use of the word "product" throughout this International Standard also refers
    to services and other deliverables. The sampling systems and procedures of this
    International Standard are not intended for use with destructive tests or where
    product screening is not feasible or desirable. In such cases, the sampling systems
    to be used will be specified in the contract or product specifications.'
