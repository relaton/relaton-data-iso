abstract:
- language: en
  script: Latn
  content: This document describes a procedure for determining the content of residual
    alkali in Kraft black liquors having a dry matter content up to 40 %. The method
    is based on a potentiometric titration with hydrochloric acid and is intended
    for black liquor samples with an initial pH ≥ 11,0. The lower limit of determination
    is 0,1 g/l of eq. NaOH.
