abstract:
- language: en
  script: Latn
  content: ISO 8619:2003 specifies a method for the determination of the flow distance
    of powdered heat-setting phenolic resins for production and control. With reference
    to tablet formation, test temperature and angle of inclination of the glass plate,
    measurement of the flow distance involves arbitrarily defined conditions. The
    flow distance is dependent on the reactivity and melt viscosity of the resins.
    Rapid solidification and high melt viscosity shorten the flow distance.
