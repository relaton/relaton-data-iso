abstract:
- language: en
  script: Latn
  content: This document establishes a laboratory test method and performance requirements
    for thrown object guards (TOG) that provide operator protection against thrown
    objects. This applies to mobile and self-propelled machinery used in forestry
    and related operations including, but not limited to, those defined in ISO 6814.
    The TOG is intended to provide reasonable protection for the operator on the host
    machine from powered rotating cutting or grinding elements and residual matter
    thrown by an attachment on the host machine. As the tests in the document are
    dependent upon the mass, velocity, and the cutting or grinding element profile,
    the TOG meeting the requirements of this document are specific to each cutting
    or grinding attachment and the host machine model. This document does not address
    protection from saw chain shot. NOTE A separate standard ISO 21876 addresses saw
    chain shot hazards.
