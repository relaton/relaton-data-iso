abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of grooved pins with countersunk
    head and full-length diamond grooves and pilot or chamfer point, in steel and
    stainless steel, and with nominal diameter 2 mm to 20 mm. These grooved pins are
    designed to fulfil the main following function: locking together two or more parts,
    with the easiest installation (due to the pilot or chamfer point) and a highest
    level of pull-out resistance (due to the elastic fit behaviour of the pin). The
    general requirements (including functional principles for grooved pins and assembly)
    are specified in ISO 13669.'
