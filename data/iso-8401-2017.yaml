abstract:
- language: en
  script: Latn
  content: 'ISO 8401:2017 specifies general methods for measuring the ductility of
    metallic coatings of thickness below 200 μm prepared by electroplating, autocatalytic
    deposition or other processes. It is applicable to the following methods: - tests
    on unsupported foils (separated from the substrate); - tests of coatings on substrates.
    It does not apply to International Standards that include specific methods of
    testing for individual coatings. In these cases, the methods specified are used
    in preference to the methods described in this document and are agreed upon beforehand
    by the supplier and the purchaser.'
