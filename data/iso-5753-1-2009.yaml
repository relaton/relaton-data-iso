abstract:
- language: en
  script: Latn
  content: 'ISO 5753-1:2009 specifies values of radial internal clearance for: - radial
    contact groove ball bearings, except those for insert bearings; - double-row self-aligning
    ball bearings; - cylindrical roller bearings; - needle roller bearings, except
    drawn cup needle roller bearings; - toroidal roller bearings; - double-row self-aligning
    roller bearings. It gives clearance values for all six types of bearing with cylindrical
    bore and also for double-row self-aligning ball bearings, cylindrical roller bearings,
    toroidal roller bearings and double-row self-aligning roller bearings with tapered
    bore.'
