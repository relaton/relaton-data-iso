abstract:
- language: en
  script: Latn
  content: ISO 14184-1:2011 specifies a method for determining the amount of free
    formaldehyde and formaldehyde extracted partly through hydrolysis by means of
    a water extraction method. The method can be applied to the testing of textile
    samples in any form. The procedure is intended for use in the range of free and
    hydrolysed formaldehyde on the fabric between 16 mg/kg and 3 500 mg/kg when determined
    by this method. The lower limit is 16 mg/kg. Below this limit, the result is reported
    as "not detectable". A method for determination of released formaldehyde is given
    in ISO 14184-2:2011.
