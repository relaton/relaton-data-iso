abstract:
- language: en
  script: Latn
  content: 'ISO/TS 16975-2:2016 provides brief guidance to assist persons responsible
    for establishing and implementing a programme for respiratory protective devices
    (RPD) that meet the performance requirements. There are special applications where
    the selection of suitable RPD using this guide is not appropriate. These are:
    a) Fire Fighting ? structural and wildland firefighting, hazardous materials and
    rescue applications; b) CBRN (Chemical, Biological, Radiological and Nuclear agents);
    c) Marine ? shipboard or off-shore firefighting or hazardous materials applications;
    d) Mining ? underground mining or firefighting and rescue applications; and e)
    Escape ? general, fire, CBRN, marine and mining. NOTE 1 For more detailed information
    relating to the special applications, refer to ISO/TS 16975‑1. This guidance does
    not apply to selecting RPD against bio aerosols. NOTE 2 Reference [3] addresses
    selection of RPD for bio aerosols that are capable of causing infection or adverse
    or allergic response but for which no occupational exposure limits have been established.
    This guidance does not apply to RPD programmes for RPD used exclusively under
    water, in aircraft, and medical life support respirators and resuscitators.'
