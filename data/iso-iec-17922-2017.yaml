abstract:
- language: en
  script: Latn
  content: 'To prove ownership of an ITU-T X.509 certificate registered individually
    with the registration authority (RA), a biometric hardware security module has
    been considered to provide a high-level biometric authentication. ISO/IEC 17922:2017
    provides a framework for telebiometric authentication using BHSM. Within the scope
    of ISO/IEC 17922:2017, the following issues are addressed: - telebiometric authentication
    mechanisms using BHSM in telecommunication network environments; and - abstract
    syntax notation one (ASN.1) format and protocols for implementing the mechanisms
    in the ITU‑T X.509 framework.'
