abstract:
- language: en
  script: Latn
  content: ISO 20902-1:2018 specifies a test procedure for determining the fire resistance
    of divisional elements with a fire protection system, when exposed to cellulosic
    or hydrocarbon-pool type fire conditions. It is applicable to divisional elements
    intended for non-marine applications but suitable for offshore fixed and mobile
    installations. The test data obtained, when used in conjunction with published
    fire test standards, permit subsequent classification of the divisional elements
    based on the duration of their performance against specified criteria.
