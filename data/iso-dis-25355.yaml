abstract:
- language: en
  script: Latn
  content: 'This document specifies the test method and performance metrics to evaluate
    the behaviour of a vehicle equipped with rear cross traffic alerting system during
    several collision scenarios. These collisions occur during straight-line reverse
    manoeuvres when the vehicle under test (VUT) approaches other vehicles or traffic
    participants. This document applies to M1 category vehicles. Note: Depending on
    accidentology, only a part of the scenarios can be used for an evaluation of performance.'
