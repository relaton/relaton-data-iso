abstract:
- language: en
  script: Latn
  content: ISO 13366-1|IDF 148-1:2008 specifies a microscopic method (reference method)
    for the counting of somatic cells in both raw and chemically preserved milk. ISO
    13366-1|IDF 148-1:2008 is applicable for the counting of somatic cells in cows'
    milk, provided that the eventually mentioned prerequisites are met. This method
    is suitable for preparing standard test samples and determining reference method
    values that are required for calibrating mechanized and automated cell-counting
    methods.
