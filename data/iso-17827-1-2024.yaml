abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the size distribution
    of particulate biofuels by the horizontally oscillating screen method. It applies
    to particulate uncompressed fuels with a nominal top size of 3,15 mm and above,
    e.g. wood chips, hog fuel, olive stones. The method is intended to characterize
    material up to a particle size class (P) of P63. For larger P-classes and PL-classes,
    the characterization is mainly done by hand sorting. NOTE            The definitions
    and specifications of P- and PL-classes are given in ISO 17225-1, ISO 17225-4
    and ISO 17225-9.
