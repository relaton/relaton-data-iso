abstract:
- language: en
  script: Latn
  content: ISO 10383:2012 specifies a universal method of identifying exchanges, trading
    platforms, regulated or non-regulated markets and trade reporting facilities as
    sources of prices and related information in order to facilitate automated processing.
    It is intended for use in any application and communication for identification
    of places where a financial instrument is listed (place of official listing),
    where a related trade is executed (place of trade), and where trade details are
    reported (trade reporting facility).
