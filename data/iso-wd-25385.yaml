abstract:
- language: en
  script: Latn
  content: 'This document specifies technical requirements and tolerances for the
    acceptance of works on ballasted track situated on: — plain line; — switches and
    crossings; and — rail expansion devices as part of the track for 1 435 mm and
    wider track gauge railways. The works on ballasted track, hereafter referred to
    as track works, concern construction of new track, track renewal and track maintenance.
    This document specifies the requirements for substructure works, track geometry,
    absolute track position, working parameters of on track machines, track components,
    ballast cross section, structure gauge, stressing works, specific measurements
    and quality checks for switches and crossings and rail expansion devices, and
    for the measuring systems used to perform measurements, verifications and checks
    for the scope of acceptance. Requirements for responsibilities and documentation
    necessary for the acceptance of track works are specified. This document also
    requires compliance of all track materials with the customer’s relevant acceptance
    criteria and specifications provided by the supplier. Platform reconstruction
    works and level crossing works are not covered by this document. This document
    does not apply to urban rail systems or ballastless track.'
