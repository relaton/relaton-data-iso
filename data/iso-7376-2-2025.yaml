abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for electrically powered video laryngoscopes
    that comprise a handle, a rigid blade, a light source, a camera and an image display
    that provides a clear view of the larynx to assist tracheal intubation. This document
    specifies requirements for accessories that are essential to the function of the
    video laryngoscope. This document is not applicable to the following: —     laryngoscopes
    without a camera or image display (see ISO 7376); —     endoscopes (see ISO 8600-1);
    —     laryngoscopes designed for surgery; —     image quality requirement for
    third party display screens, for example a phone or computer monitor, and which
    are not supplied by the video laryngoscope manufacturer as part of the video laryngoscope
    system.'
