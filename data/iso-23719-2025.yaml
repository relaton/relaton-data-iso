abstract:
- language: en
  script: Latn
  content: This document specifies a method for the quantitative determination of
    17 mycotoxins in cereals and cereal products (e.g. wheat, maize, husked rice,
    rice and their products) using ultra-high-performance liquid chromatography and
    tandem mass spectrometry method (UHPLC-MS/MS). The 17 mycotoxins are aflatoxin
    B1, aflatoxin B2, aflatoxin G1, aflatoxin G2, deoxynivalenol, nivalenol, deoxynivalenol-3-glucoside,
    3-acetyl-deoxynivalenol, 15-acetyl-deoxynivalenol, zearalenone, ochratoxin A,
    fumonisin B1, fumonisin B2, fumonisin B3, T-2 toxin, HT-2 toxin and sterigmatocystin.
    This document does not apply to foods for infants and young children. This document
    is applicable to other products (e.g. nuts) provided that the method is validated
    for each individual case. The calibration range of the method and the validated
    range during the interlaboratory study for each mycotoxin are listed in Table A.1.
