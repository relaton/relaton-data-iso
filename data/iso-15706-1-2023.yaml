abstract:
- language: en
  script: Latn
  content: This document establishes and defines a voluntary standard numbering system
    for the unique and international identification of audiovisual works (as defined
    in 3.1). An International Standard Audiovisual Number (ISAN) identifies an audiovisual
    work throughout its life and is intended for use wherever precise and unique identification
    of an audiovisual work would be desirable. As an identifier, it can be used for
    various purposes, such as to assist allocation of royalties among right holders,
    to track the use of audiovisual works, for information retrieval and for anti-piracy
    purposes, such as verifying title registrations. The ISAN can also provide a basis
    for supplementary identification systems when version or product information is
    required (e.g. for applications such as broadcast automation and automated storage
    and retrieval systems). An ISAN is applied to the audiovisual work itself. It
    is not related to the physical medium of such an audiovisual work, or the identification
    of that medium. Annex A specifies examples of audiovisual works for which an ISAN
    can be issued and examples of works for which ISAN are not issued. The issuance
    of an ISAN is in no way related to any process of copyright registration, nor
    does the issuance of an ISAN provide evidence of the ownership of rights in an
    audiovisual work.
