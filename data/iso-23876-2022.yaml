abstract:
- language: en
  script: Latn
  content: This document specifies the use of acoustic emission examination (AT) during
    periodic inspection and testing of hoop wrapped (Type 2) and fully wrapped (Types
    3 and 4) composite transportable gas cylinders and tubes of water capacity up
    to 3 000 l, with aluminium-alloy, steel or non-metallic liner or of linerless
    construction (Type 5), intended for compressed and liquefied gases under pressure.
    It is applicable to only the verification of the composite material. Additional
    inspection such as internal visual inspection of the liner does not apply to this
    document (see ISO 11623). NOTE      Unless noted by exception, the use of the
    word “cylinder” in this document refers to both cylinders and tubes.
