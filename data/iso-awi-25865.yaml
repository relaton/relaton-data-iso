abstract:
- language: en
  script: Latn
  content: This standard specifies a test method to determine the coefficient of friction
    and the amount of wear of polymer-based materials in a hydrogen atmosphere with
    a pin-on-disc or ball-on-disc setup under reciprocating and unidirectional sliding.
    Based on existing tribological test methods this standard mainly focuses on the
    specific adaptation resulting from the application of hydrogen atmospheres, especially
    the sample preparation and conditioning, preparation of the autoclave, requirements
    of hydrogen atmosphere, specify the filling procedure, saturation or ageing of
    the specimen prior testing as well as offline measurements of wear quantities.
    Emphasis is placed on the control of humidity and impurities of the hydrogen atmosphere
    and other factors which affect the tribological quantities. This standard applies
    for tribological tests of polymer-based materials against metallic or ceramic
    surfaces without interfacial media (dry friction) such as oils and greases.
