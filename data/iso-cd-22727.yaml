abstract:
- language: en
  script: Latn
  content: ISO 22727:2007 specifies requirements for the creation and design of public
    information symbols. It specifies requirements for the design of public information
    symbols for submission for registration as approved public information symbols,
    including line width, the use of graphical symbol elements and how to indicate
    negation. It also specifies templates to be used in the design of public information
    symbols. ISO 22727:2007 is for use by all those involved in the commissioning
    and the creation and design of public information symbols. It is not applicable
    to safety signs, including fire safety signs, or to traffic signs for use on the
    public highway. Examples are given for illustrative purposes only and do not constitute
    requirements for particular public information symbols.
