abstract:
- language: en
  script: Latn
  content: ISO 10083:2006 specifies requirements for the design and installation of
    an oxygen concentrator supply system for use with a medical gas pipeline distribution
    system that complies with ISO 7396-1. The standard applies only to oxygen concentrator
    supply systems that produce oxygen-enriched air with an oxygen concentration not
    less than 90 %. Oxygen concentrators for domiciliary use are excluded from the
    scope of the standard (they are specified in ISO 8359).
