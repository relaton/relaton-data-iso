abstract:
- language: en
  script: Latn
  content: ISO 6789-1:2017 specifies the conformance testing and marking requirements
    for hand torque tools used for controlled tightening of screws and nuts. It also
    specifies the minimum requirements for declaration of conformance for hand torque
    tools. ISO 6789-1:2017 applies to hand torque tools which are classified as indicating
    torque tools (Type I) and setting torque tools (Type II). NOTE Hand torque tools
    covered by this document are those identified in ISO 1703:2005 by reference numbers
    6 1 00 11 0, 6 1 00 11 1 and 6 1 00 12 0, 6 1 00 12 1 and 6 1 00 14 0, 6 1 00
    15 0. ISO 1703 is currently under revision. In the next edition, torque tools
    will be moved to an own clause, and with this change the reference numbers will
    also change and additional reference numbers will be added. ISO 6789-1:2017 does
    not specify requirements of calibration certificates for hand torque tools. These
    are described in ISO 6789‑2.
