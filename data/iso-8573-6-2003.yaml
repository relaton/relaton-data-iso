abstract:
- language: en
  script: Latn
  content: ISO 8573-6:2003 provides a selection of suitable test methods for the measurement
    of contamination gases in compressed air. It specifies sampling technique, measurement
    and evaluation, uncertainty considerations and reporting for the applicable gaseous
    contaminants carbon monoxide, carbon dioxide, sulphur dioxide, nitric oxide, nitrogen
    dioxide, and hydrocarbons in the range C1 to C5 (see ISO 8573-5 for C6 and above).
    The methods given are also suitable for other gases.
