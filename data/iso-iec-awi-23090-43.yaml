abstract:
- language: en
  script: Latn
  content: 'The conformance and reference software of ISO/IEC 23090-39 serves following
    main purposes: - Validation of the written specification of the parts of ISO/IEC
    23090-39; - Clarification of the written specification of the parts of ISO/IEC
    23090-39; - Conformance testing for checking interoperability for the various
    applications against the reference software which aims to be complaint with ISO/IEC
    23090-39. The scope of the work of this specification is fully aligned with the
    MPEG-I requirements and scope of the MPEG Immersive project.'
