abstract:
- language: en
  script: Latn
  content: ISO 10271:2011 provides test methods and procedures to determine the corrosion
    behaviour of metallic materials used in the oral cavity. It is intended that the
    test methods and procedures in ISO 10271:2011 be referred to in the individual
    International Standards specifying such metallic materials. ISO 10271:2011 is
    not applicable to instruments and dental amalgam and appliances for orthodontics.
