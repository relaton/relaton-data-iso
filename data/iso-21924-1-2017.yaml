abstract:
- language: en
  script: Latn
  content: ISO 21924-1:2017 specifies the general requirements and test methods for
    innocuousness, ergonomics, restraint, zone of protection, impact performance,
    as well as provisions for marking and the information supplied by the manufacturer
    for protective equipment used in martial arts. The protectors covered by this
    document are mainly designed for use in unarmed martial arts such as taekwondo,
    karate, kick-boxing and similar disciplines. Additional requirements and test
    methods for components of protectors for specific kinds of martial arts are specified
    in further parts of this document.
