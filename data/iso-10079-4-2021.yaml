abstract:
- language: en
  script: Latn
  content: 'This document specifies general requirements for medical suction equipment
    that are common to all parts of the ISO 10079 series. This document is not applicable
    to the following: a) end-pieces such as suction catheters, drains, curettes, Yankauer
    suckers and suction tips; b) syringes; c) dental suction equipment; d) anaesthetic
    gas scavenging systems; e) laboratory suction; f) autotransfusion systems; g)
    mucus extractors including neonatal mucus extractors; h) suction equipment where
    the collection container is downstream of the vacuum pump; i) ventouse (obstetric)
    equipment; j) suction equipment marked for endoscopic use only; and k) plume evacuation
    systems.'
