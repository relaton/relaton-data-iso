abstract:
- language: en
  script: Latn
  content: ISO 3092:2009 specifies the determination of the alpha-amylase activity
    of cereals by the falling number (FN) method according to Hagberg-Perten. This
    method is applicable to cereal grains, in particular to wheat and rye and their
    flours, durum wheat and its semolina. This method is not applicable to the determination
    of low levels of alpha-amylase activity. By converting the FN into a liquefaction
    number (LN), it is possible to use this method to estimate the composition of
    mixtures of grain, flour or semolina with known FNs necessary to produce a sample
    of a required FN.
