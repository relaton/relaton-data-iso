abstract:
- language: en
  script: Latn
  content: 'This document specifies: — protocols and commands; — other parameters
    required to initialize communications between a vicinity integrated circuit card
    and a vicinity coupling device; — methods to detect and communicate with one card
    among several cards ("anticollision"); — optional means to ease and speed up the
    selection of one among several cards based on application criteria. This document
    does not preclude the incorporation of other standard technologies on the card
    as described in Annex A.'
