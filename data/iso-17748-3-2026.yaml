abstract:
- language: en
  script: Latn
  content: 'This document specifies the data exchange requirements between related systems within the smart city for electric vehicle (EV)-based demand response (DR) services utilizing nomadic devices as follows: EV-based DR service for demand reduction, called “demand response” during the shortage of reserve on electric grid or in response to a fine dust warning issued according to an air quality forecast; EV-based DR for demand increase, called “reverse demand response”, instead of curtailment during excess electricity generation by renewable energy sources such as the sun and wind. This document defines the requirements of main actors such as the EV, nomadic device, smart city cloud, charging station and service provider to support EV-based DR services. This document also defines the data set and data processing procedure requirements for EV-based DR services.'
