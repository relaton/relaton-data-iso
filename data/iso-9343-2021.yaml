abstract:
- language: en
  script: Latn
  content: This document specifies the principal dimensions of slip joint pliers,
    designated as No. 206 in ISO 5742, and the test values, in order to verify their
    aptitude to function in conformity with ISO 5744. The general technical requirements
    are given in ISO 5743. The slip joint pliers illustrated in this document are
