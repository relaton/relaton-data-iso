abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and guidelines for cold chain logistics service providers, who offer temperature-controlled land logistics services from the shipper to the consignee at the designated destination, to lower environmental impacts and achieve sustainable cold chain logistics. This document includes: - requirements for cold chain logistics service providers to implement environmentally conscious services; - recommendations for utilizing refrigeration and thermal insulation functions with environmental considerations; - guidelines for calculating greenhouse gas (GHG) emissions generated through the provision of these services. Note 1: This document primarily applies to service providers as defined in ISO 23412 (refrigerated transport involving intermediate transfer) and ISO 31512 (B to B cold chain logistics services), but is not limited to these. Note 2: While this document specifies environmental considerations in the transport and delivery process, it is not limited to transport using four-wheeled vehicles.'
