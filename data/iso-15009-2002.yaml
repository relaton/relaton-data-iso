abstract:
- language: en
  script: Latn
  content: 'ISO 15009:2002 specifies a method for quantitative gas-chromatographic
    determination of volatile hydrocarbons, naphthalene and volatile halogenated hydrocarbons
    in soil. ISO 15009:2002 is applicable to all types of soil. Under the conditions
    specified in ISO 15009:2002, the following limits of determinations apply (expressed
    on basis of dry matter): volatile hydrocarbons and naphthalene: 0,1 mg/kg;volatile
    halogenated hydrocarbons: 0,01 mg/kg. The lower limit of determination is dependent
    on the equipment used and the quality of the methanol grade used for the extraction
    of the soil sample.'
