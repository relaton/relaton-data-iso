abstract:
- language: en
  script: Latn
  content: 'This document is intended to serve as a best practice for the identification
    and “seeding” of nondestructively detectable flaw replicas of metal alloy PBF
    and DED processes. Three seeding categories are described: a) process flaws through
    CAD design; b) build parameter manipulation; c) subtractive manufacturing. These
    include flaws present within as-deposited materials, post heat-treated or HIP
    processed material, and those flaws made detectable because of post-processing
    operations. Geometrical aspects or measurement are not the subjects of this document.
    WARNING — This document does not purport to address all of the safety concerns,
    if any, associated with its use. It is the responsibility of the user of this
    document to establish appropriate safety and health practices and determine the
    applicability of regulatory limitations prior to use.'
