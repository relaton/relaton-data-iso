abstract:
- language: en
  script: Latn
  content: 'ISO 16230-1:2015 is applicable to tractors and self-propelled ride-on
    machines, mounted implements, and towed implements used in agriculture and forestry.
    This part of ISO 16230 specifies general requirements that relate to the protection
    and safety of operators and bystanders on machines with on-board voltages in the
    range of 50 V AC to 1000 V AC and 75 V DC to 1500 V DC. This part of ISO 16230
    applies to electrical equipment and parts of the electrical equipment on such
    machines and includes general requirements related to the protection and safety
    of operators, bystanders, and first responders. ISO 16230-1:2015 deals with significant
    hazards, hazardous situations, and events, as listed in Annex A, relevant to this
    agricultural machinery when used as intended and under the conditions of misuse
    foreseeable by the manufacturer during normal operation and service. ISO 16230-1:2015
    is not applicable to the following: - specific design elements of external interfaces
    (e.g. the interface between a tractor and implement); - externally powered equipment
    (e.g. line powered equipment, equipment without on-board power generation); -
    purpose built forestry machines; - stationary electrical generators. ISO 16230-1:2015
    is not applicable to machines which are manufactured before the date of its publication.'
