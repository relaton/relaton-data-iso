abstract:
- language: en
  script: Latn
  content: ISO/TS 15216-2:2013 describes a method for qualitative detection of HAV
    and NoV genogroups I (GI) and II (GII), from test samples of foodstuffs or food
    surfaces. Following liberation of viruses from the test sample, viral RNA is then
    extracted by lysis with guanidine thiocyanate and adsorption on silica. Target
    sequences within the viral RNA are amplified and detected by real-time RT-PCR.
    This approach is also relevant for detection of the target viruses on fomites,
    or of other human viruses in foodstuffs, on food surfaces or on fomites following
    appropriate validation and using target-specific primer and probe sets.
