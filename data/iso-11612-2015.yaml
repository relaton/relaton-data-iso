abstract:
- language: en
  script: Latn
  content: ISO 11612:2015 specifies performance requirements for protective clothing
    made from flexible materials, which are designed to protect the wearer's body,
    except the hands, from heat and/or flame. For protection of the wearer's head
    and feet, the only items of protective clothing falling within the scope of ISO
    11612:2015 are gaiters, hoods, and overboots. However, concerning hoods, requirements
    for visors and respiratory equipment are not given. The performance requirements
    set out in ISO 11612:2015 are applicable to protective clothing which could be
    worn for a wide range of end uses, where there is a need for clothing with limited
    flame spread properties and where the user can be exposed to radiant or convective
    or contact heat or to molten metal splashes.
