abstract:
- language: en
  script: Latn
  content: ISO 11833-1:2012 specifies the requirements for flat extruded sheets and
    pressed sheets of unplasticized poly(vinyl chloride) (PVC‑U) and the test methods
    to be used to measure the required values. It applies only to sheets of thickness
    not less than 1,0 mm. It does not cover biaxially stretched PVC‑U sheets.
