abstract:
- language: en
  script: Latn
  content: 'Scope of the technical specification is to define a minimum level of information
    need (LOIN) for escalators and moving walks and to describe impact of ISO 19650-1:2018
    and current building industry market trends to the building information modelling
    (BIM) related to escalators and moving walks. The technical specification contains:
    • alphanumeric and geometrical information for escalators and moving walks • the
    minimum level of information need to cover pre-design, schematic design and detailed
    design stages.'
