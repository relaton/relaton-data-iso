abstract:
- language: en
  script: Latn
  content: This document specifies the most important requirements of telescopic tripods
    for surveying instruments and the connection between instrument and tripod. The
    requirements in this document enable instruments and tripods of different manufacturers
    to be joined to one another, without prejudicing their performance and their usefulness.
    This document is applicable to tripods which are used for levels, theodolites,
    tacheometers, GPS equipment, EDM instruments and in combination with targets,
    reflectors, antennae, etc.
