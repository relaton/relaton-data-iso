abstract:
- language: en
  script: Latn
  content: ISO 14903:2017 provides the qualification procedure for type approval of
    the tightness of hermetically sealed and closed components, joints and parts used
    in refrigerating systems and heat pumps as described in relevant parts of ISO
    5149. The sealed and closed components, joints and parts concerned are, in particular,
    fittings, bursting discs, flanged or fitted assemblies. The tightness of flexible
    piping made from non-metallic materials is dealt with in ISO 13971. Metal flexible
    piping are covered by this document. The requirements contained in this document
    are applicable to joints of maximum DN 50 and components of internal volume of
    maximum 5 l and maximum weight of 50 kg. ISO 14903:2017 is intended to characterize
    their tightness stresses met during their operations, following the fitting procedure
    specified by the manufacturer, and to specify the minimal list of necessary information
    to be provided by the supplier of a component to the person in charge of carrying
    out this procedure. It specifies the level of tightness of the component, as a
    whole, and its assembly as specified by its manufacturer. It applies to the hermetically
    sealed and closed components, joints and parts used in the refrigerating installations,
    including those with seals, whatever their material and their design are. ISO
    14903:2017 specifies additional requirements for mechanical joints that can be
    recognized as hermetically sealed joints.
