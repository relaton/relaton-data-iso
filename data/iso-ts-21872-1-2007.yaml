abstract:
- language: en
  script: Latn
  content: 'ISO/TS 21872-1:2007 specifies a horizontal method for the detection of
    the two main pathogenic Vibrio species causing intestinal illness in humans: V.
    parahaemolyticus and V. cholerae. It is applicable to products intended for human
    consumption and the feeding of animals, and environmental samples in the area
    of food production and food handling.'
