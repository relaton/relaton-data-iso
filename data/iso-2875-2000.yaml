abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for testing the resistance
    of a complete, filled transport package or a unit load to water spray or the protection
    it gives to its contents from water spray. It may also be used to precondition
    a complete, filled transport package or a unit load prior to another test to investigate
    reduction in strength caused by exposure to water. The test is performed on the
    test specimen as prepared for transport and may form part of a test sequence.
