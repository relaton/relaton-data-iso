abstract:
- language: en
  script: Latn
  content: A Technical Specification to provide guidance to users, engineers and specifiers
    on the test methods for durability of GCCs and GCC-Bs. Current durability testing
    for geosynthetics is based on retention of tensile strength; this is not a relevant
    characteristic for GCCs and GCC-Bs. Several test methods for these geosynthetics
    have been developed and the purpose of this TS is to explain how these test methods
    can be used as an indicator of long-term performance.
