abstract:
- language: en
  script: Latn
  content: ISO 20282-2:2006 specifies a test method for measuring the ease of operation
    of "walk-up-and-use" products. The purpose of the test is to provide a basis for
    predicting the ease of operation of a walk-up-and-use product, including measures
    of its effectiveness and efficiency of operation, and the satisfaction of the
    intended user population in its expected context of use. The intended users of
    ISO 20282-2:2006 are people with human factors expertise in the design and management
    of appropriate tests, including manufacturers, suppliers, purchasing organizations
    or third parties (such as consumer organizations).
