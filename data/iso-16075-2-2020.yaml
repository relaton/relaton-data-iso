abstract:
- language: en
  script: Latn
  content: 'This document covers the following issues: — guideline for the design
    of treated wastewater (TWW) irrigation projects intended to prevent public health
    risks within the population that has been in direct or indirect contact with the
    TWW or with any product that has come in contact with the TWW; — specifications
    of the following: i) TWW quality for irrigation purposes; ii) types of crops for
    TWW irrigated; iii) TWW and crops qualities integration; iv) use of barriers to
    reduce risks arising from TWW irrigation; v) correlation between the quality of
    the TWW, irrigated crops, and the types of barriers that can be used; vi) distance
    between TWW irrigated areas and residential areas. None of the documents of ISO
    16075 are intended to be used for certification purposes.'
