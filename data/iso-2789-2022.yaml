- language: en
  script: Latn
  content: 'This document specifies rules for the library and information services
    community on the collection and reporting of statistics: —    for the purposes
    of international reporting; —    to ensure conformity between countries for those
    statistical measures that are frequently used by library managers, but do not
    qualify for international reporting; —    to encourage good practice in the use
    of statistics for the management of library and information services.'
