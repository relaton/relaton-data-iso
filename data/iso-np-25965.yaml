abstract:
- language: en
  script: Latn
  content: "​​Current international practices for liquid launch vehicle testing at
    launch sites exhibit significant divergence in test items, content, acceptance
    criteria, and safety boundaries. Presently, no dedicated International Standard
    exists to define the minimum mandatory requirements for this specific phase. This
    fragmentation creates technical barriers to cross-border commercial launch cooperation
    and elevates the risk of accidents resulting from insufficient testing. ​This
    International Standard establishes a generic, effective, economical, and safe
    framework of minimum requirements​ for liquid launch vehicle testing activities
    conducted at the launch site. The scope is strictly limited to defining the test
    items and status confirmation principles for functional parts, subsystems, and
    the overall system following transportation and final assembly. It does not​ prescribe
    specific test methods, procedures, or instrumentation. By unifying the baseline
    for launch site testing, this document fills the current regulatory gap, supports
    the development of low-cost rapid launch capabilities and reusable launch vehicles,
    mitigates launch failure risks, and promotes the healthy growth of global commercial
    space activities."
