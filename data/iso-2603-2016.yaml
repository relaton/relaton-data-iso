abstract:
- language: en
  script: Latn
  content: ISO 2603:2016 provides requirements and recommendations for building and
    renovating permanent booths for simultaneous interpreting in new and existing
    buildings. This document also ensures the usability and accessibility of booths
    for all interpreters, including those with special needs. It is applicable to
    all types of permanent booths, using built-in or portable equipment. In conjunction
    with either this document or ISO 4043, ISO 20108 and ISO 20109 provide the relevant
    requirements both for the quality and transmission of sound and image provided
    to interpreters and for the equipment needed in the booths.
