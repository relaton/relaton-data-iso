abstract:
- language: en
  script: Latn
  content: This part of 1S0/IEC 7811 specifies the location of embossed characters
    on identification cards of ID-1 size, the dimensions of which are specified in
    ISO/IEC 7810. The embossed characters are intended for transfer of data either
    by use of imprinters or by visual or machine reading. IS0/IEC 10373 specifies
    the test procedures used to check cards against the parameters specified in this
    part of IS0/IEC 7811.  This part of ISO/IEC 7811 specifies the requirements for
    cards used for identification. It takes into consider­ation both human and machine
    aspects and states minimum requirements.  NOTE - Numeric values in the SI and/or
    Imperial measure­ment system in this part of ISO/IEC 7811 may have been rounded
    off and therefore are consistent with, but not exactly equal to, each other. Either
    system may be used, but the two should not be intermixed or reconverted. The original
    design was made using the Imperial measurement system. 
