abstract:
- language: en
  script: Latn
  content: ISO 17512-2:2011 specifies a rapid screening method for evaluating the
    habitat function of soils based on the avoidance behaviour of springtails. The
    test is a rapid method that reflects the bioavailability of contaminants in natural
    soils and substances spiked into soils to Folsomia candida. In both cases, it
    is possible to establish a dose-response-relationship. The avoidance behaviour
    of the springtails is the measurement endpoint of the test. This test is not intended
    to replace the Collembola reproduction test.
