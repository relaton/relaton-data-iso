abstract:
- language: en
  script: Latn
  content: 'This document will provide guidance on how to determine the relevant vehicle
    configuration information for software update engineering, according to ISO 24089:2023.
    This guidance will contain definitions of elements of vehicle configuration information,
    relationships between such elements, and examples of usage. ■ Out of Scope: •
