abstract:
- language: en
  script: Latn
  content: This document specifies a test method based on a FZG four-square test machine
    for determining the relative load-carrying capacity of semi-fluid gear greases
    defined by the gear surface damage known as scuffing. This method is useful for
    evaluating the scuffing load capacity potential of semi-fluid gear greases of
    NLGI classes 0 to 000, typically used with highly stressed gearing for enclosed
    gear drives. It can only be applied to greases giving a sufficient lubricant flow
    in the test gear box of the FZG test machine. NOTE            The test method
    is technically equivalent to DIN Fachbericht 74.
