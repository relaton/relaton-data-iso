abstract:
- language: en
  script: Latn
  content: Biometric web services support interoperable machine-to-machine interaction
    over a network to accomplish the tasks of biometric systems or subsystems. The
    server side is responsible for implementing the specific biometric workflow and
    the communication with biometric capture devices, if any are involved. The client
    side is responsible for displaying feedback and enabling user interaction with
    the service. This document defines high-level web services for – executing customizable
    biometric web services, – visualizing status feedback from customizable biometric
    web services and – sending user commands to customizable biometric web services
    based on the Representational State Transfer (REST) paradigm.
