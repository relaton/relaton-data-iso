abstract:
- language: en
  script: Latn
  content: ISO 17852:2006 specifies a method for the determination of mercury in drinking,
    surface, ground and rain water using atomic fluorescence spectrometry. It may
    be applied to industrial and municipal waste water after an additional digestion
    step under appropriate conditions. The potential linear dynamic range is approximately
    1 nanogram per litre to 100 micrograms per litre. In practice, the working range
    is often from 10 nanograms per litre to 10 micrograms per litre. Samples containing
    mercury at concentrations higher than the working range can be analysed following
    appropriate dilution of the sample. The method detection limit will be dependent
    on the selected operating conditions and calibration range. With high purity reagents,
    a method detection limit of less than 1 nanogram per litre is obtainable.The relative
    standard deviation is typically less than 5 % for concentrations greater than
    twenty times the method detection limit. The sensitivity of this method is dependent
    on the selected operating conditions.
