abstract:
- language: en
  script: Latn
  content: This document specifies a framework and integration guidelines for applying
    federated learning (FL) to the secondary use of clinical genomic data. It addresses
    the harmonization of clinical genomic data across participating sites, the procedural
    framework for federated analysis on genomic data, and the integration of FL outputs
    into clinical and research workflows. The document also identifies considerations
    specific to clinical genomic data, including high dimensionality, institutional
    heterogeneity in data representation, and the implications of rare variant distribution
    across sites. This document does not define federated learning algorithms, cryptographic
    methods for secure aggregation, or machine learning evaluation methodologies,
    which are addressed by other International Standards.
