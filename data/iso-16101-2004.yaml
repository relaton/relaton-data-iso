abstract:
- language: en
  script: Latn
  content: ISO 16101:2004 specifies the requirements and test methods for compatibility
    testing of polyethylene based plastics packagings and composite packagings with
    plastic inners containing liquids. The testing involves storage with the packaged
    substance, or with a standard liquid as defined in Annex A. Annex B describes
    small scale laboratory tests which may be used to determine the assimilation of
    those products to be carried with the standard liquids.
