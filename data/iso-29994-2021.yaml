abstract:
- language: en
  script: Latn
  content: This document specifies requirements for distance learning services not
    specified in ISO 29993. It is applicable to any distance learning services that
    are addressed to learners themselves as well as to sponsors who are acquiring
    the services on behalf of the learners. In cases where the distance learning services
    are provided by an organization that delivers other methods of learning services,
    this document only applies to distance learning services.
