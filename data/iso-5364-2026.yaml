abstract:
- language: en
  script: Latn
  content: This document specifies requirements for oropharyngeal airways. This document
    is not applicable to metal oropharyngeal airways, nor to requirements concerning
    flammability of oropharyngeal airways. This document is not applicable to supralaryngeal
    airways, which are covered by ISO 11712[1]. The requirements that are also applicable
    to other airway devices have been removed from this document as they now appear
    in the general airway device standard (ISO 18190). The requirements in this device-specific
    standard take precedence over any conflicting requirements in the general standard
    for airway devices (ISO 18190).
