abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and recommendations to laboratories
    that perform extraction of polymerase chain reaction (PCR) quality deoxyribonucleic
    acid (DNA) from cottonseed, cotton leaf and raw material derived therefrom, that
    is sufficient for the purpose of PCR analysis. This document is applicable to:
    a)       identifying cotton raw material from which PCR quality DNA can be extracted;
    b)       specifying a method for effective DNA extraction from cotton and cotton-derived
    raw materials; c)        specifying the cotton-specific marker(s) to be used as
    controls for PCR amplification of DNA. A PCR result obtained from analysis of
    cottonseed, cotton leaf and to some extant raw materials derived therefrom can
    only indicate that it is not derived from pure genetically modified organism (GMO)-derived
    cotton. Admixtures of GMO-derived cotton cannot be detected for cotton fibre and
    cotton fibre-derived materials. This document does not apply to bulk sampling
    of the seed, bale or processed fabric and yarn. A recommended sampling method
    is given in ISO 6497. General guidance for the sampling of bulk materials or for
    cotton-based products is available in standards such as ASTM D1441-12 and CEN/TS 15568.'
