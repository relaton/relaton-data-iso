abstract:
- language: en
  script: Latn
  content: This document establishes general principles for the sampling of geosynthetics
    delivered to construction sites, and for the preparation of test specimens from
    the samples. The sampling principles are applicable to geosynthetics supplied
    in rolls or expandable panels. NOTE            ISO 186 can be used for products
    supplied in sheet form. The specimen-preparation principles are applicable to
    all geosynthetics.
