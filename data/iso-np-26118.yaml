abstract:
- language: en
  script: Latn
  content: 'This document specifies the relevant terms, definitions, principles, sampling
    methods, sample pretreatment methods and inspection record standards for the detection
    and evaluation of odor pollution in the process of water treatment and reuse.
    This document fully considers the testing needs of different environments, different
    samples and different components, and comprehensively considers the possibility
    of odor pollution in all aspects of water treatment and reuse. The purpose of
    preparing the evaluation method is to give a quantitative evaluation method for
    the odor gas in the whole process scientifically and reasonably, to facilitate
    the screening and comparison of technologies in the industry, to facilitate the
    horizontal comparison of various pollution removal methods, and to facilitate
    the supervision and law enforcement of the national regulatory authorities. Specific
    work content and main responsibilities are as follows: scope of application, terms
    and definitions, sampling point and sampling frequency of odor gas, sampling method
    of odor gas, sample pretreatment and analysis method, monitoring results and records,
    quality assurance and quality control.'
