abstract:
- language: en
  script: Latn
  content: This document specifies the burial operating instruction of standard specimens
    (carbon steel plates etc.) and testing methods of soil corrosivity. This document
    only applies to the burial of standard metallic specimens. Non-metallic materials
    such as polyethylene encasement are not included in this standard. This document
    does not apply to the assessment of corrosivity in special soil environments,
    such as soil environments with strong AC and DC interference, local soil environments
    with significant regional inhomogeneity soil environments and other chemical pollution.
