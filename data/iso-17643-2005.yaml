abstract:
- language: en
  script: Latn
  content: ISO 17643:2005 defines eddy current testing techniques for detection of
    surface breaking and near surface planar discontinuities, mainly in ferritic materials
    (weld material, heat-affected zones, parent materials). Eddy current testing can
    also be specified for use with non-ferritic materials, for example in an application
    standard. The techniques can be applied to coated and uncoated objects during
    fabrication and in service, both onshore and offshore. Eddy current testing can
    be carried out on all accessible surfaces and on welds of almost any configuration.
