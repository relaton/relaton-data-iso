abstract:
- language: en
  script: Latn
  content: This document specifies the data elements, their structure, and associated
    data types for comprehensive cognitive function test results, including neuropsychological(questionnaire-based)
    and EEG-based tests, in order to enable their interoperability across healthcare
    systems. This document — defines the composition of a structured cognitive function
    test results, — defines the required and optional data elements, — specifies the
    types and permissible values for each data element.
