abstract:
- language: en
  script: Latn
  content: This part of ISO 11452 specifies stripline tests for determining the immunity
    of electronic components for passenger cars and commercial vehicles to electrical
    distrubances from narrowband electromagnetic energy, regardless of the vehicle
    propulsion system (e.g. spark-ignition engine, diesel engine, electric motor).
    As the performance of these tests depends on the exposure of the equipment harness
    to a disturbance field, the applicability of this part of ISO 11452 is limited
    to equipment harnesses, which have a maximum diameter of one-third the stripline
    height or less. The electromagnetic disturbances considered are limited to continuous
    narrowband electromagnetic fields.
