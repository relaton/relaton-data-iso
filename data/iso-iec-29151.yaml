abstract:
- language: en
  script: Latn
  content: This document specifies controls, purpose, and guidance for implementing
    controls, to meet the requirements identified by a risk and impact assessment
    related to the protection of personally identifiable information (PII). In particular,
    this document specifies requirements and guidance based on ISO/IEC 27002, taking
    into consideration the controls for processing PII that can be applicable within
    the context of an organization's information security risk environment(s). This
    document is applicable to all types and sizes of organizations acting as PII controllers
    (as defined in ISO/IEC 29100), including public and private companies, government
    entities and not-for-profit organizations that process PII, in particular, organizations
    that do not establish or operate a privacy information management system.
