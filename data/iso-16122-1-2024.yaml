abstract:
- language: en
  script: Latn
  content: This document defines the general requirements to be fulfilled for the
    inspection of all types of sprayers for plant protection products used in agriculture,
    horticulture, forestry and other areas, except knapsack sprayers. NOTE           
    For knapsack sprayers, see ISO/FDIS 19932–3:—. The specific requirements for the
    different types of sprayers are defined in the relevant specific parts of the
    ISO 16122 series. When used in conjunction with the relevant sprayer specific
    part (see Annex A), this document specifies the requirements and test methods
    for the inspection of sprayers in use. The requirements relate mainly to the condition
    of the sprayer with respect to potential risks for the environment and its performance
    to achieve a good application. This document also includes minimum requirements
    for the preparation of the sprayer for the inspection and the minimum safety requirements
    with respect to the safety of the inspector (test operator) during the inspection.
