abstract:
- language: en
  script: Latn
  content: 'ISO 286-1:2010 establishes the ISO code system for tolerances to be used
    for linear sizes of features of the following types: a) cylinder; b) two parallel
    opposite surfaces. ISO 286-1:2010 defines the basic concepts and the related terminology
    for this code system. It provides a standardized selection of tolerance classes
    for general purposes from amongst the numerous possibilities. Additionally, it
    defines the basic terminology for fits between two features of size without constraints
    of orientation and location and explains the principles of “basic hole” and “basic
    shaft”.'
