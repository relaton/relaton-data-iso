abstract:
- language: en
  script: Latn
  content: This document specifies the operational and service requirements for cold chain logistics in the post-harvest segment of the fresh produce supply chain, covering activities from the farmgate packhouse to cold storage units —where most temperature-sensitive losses occur globally. This document does not cover primary production practices at farm level or long-distance export logistics beyond cold storage units.
