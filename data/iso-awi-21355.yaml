abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for the construction (including
    specific safety and hygiene aspects), the minimum performance requirements, and
    information requirements for satisfactory functioning of milking machines and
    automatic milking installations (AMI) for milking and cleaning. This document
    also deals with specified tests for testing new milking installations and for
    periodic checking of installations for efficiency of operation. It also stipulates
    the accuracy requirements for the measuring instruments. This document specifies
    mechanical tests for milking machine installations to verify compliance of an
    installation or component according to the specifications from the manufacturer.
    For a complete evaluation of milking performance this document refer to Bulletin
    of the International Dairy Federation 396/2005. This document is applicable for
    testing new installations and for periodic checking of installations for efficiency
    of operation. Alternative test methods may be applicable if they can be shown
    to achieve comparable results. The document is applicable to milking machines
    for milking cows, water buffaloes, sheep, goats, horses, donkeys, camels, where
    animals are milked with pulsation created by vacuum, and where milk is, at least
    partly, transported with the help of airflow. Some clauses in this document are
    not applicable to all types of milking machines. The qualitative requirements
    apply to installations for milking all mammals used for milk production. This
    document does not apply to: - requirements for the design of the building in which
    the milking installation is installed.'
