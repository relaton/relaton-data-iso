abstract:
- language: en
  script: Latn
  content: ISO 15609-5:2011 specifies requirements for the content of welding procedure
    specifications for resistance spot, seam, butt and projection welding processes.
    It is necessary to establish the acceptability of applying the principles of ISO
    15609-5:2011 to other resistance and related welding processes before any qualification
    is undertaken. Variables listed in ISO 15609-5:2011 are those influencing either
    weld dimensions (quality), weld nugget dimension, weld pattern positioning, mechanical
    properties or geometry of the welded joint.
