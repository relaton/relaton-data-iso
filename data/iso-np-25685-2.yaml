abstract:
- language: en
  script: Latn
  content: This document specifies a shear test method for determining the agglomerate properties of ceramic powders by measuring the unconfined yield strength. The method is applicable to cohesive ceramic powders that can be consolidated under an applied normal stress and sheared to determine a yield locus.
