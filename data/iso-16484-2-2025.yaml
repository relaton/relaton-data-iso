abstract:
- language: en
  script: Latn
  content: 'This document specifies the hardware requirements needed to carry out
    building automation tasks. This document is applicable to physical devices, i.e.:
    —     devices that require human interaction, such as management stations or operator
    panels; —     devices for data storage and analysis, such as edge or cloud servers;
    —     devices for control applications, such as automation stations; —     devices
    for physical quantities acquisition, such as sensors and actuators. This document
    provides a generic system topology based on a building network infrastructure,
    which includes both the devices inside the building envelope and those outside
    the building envelope.'
