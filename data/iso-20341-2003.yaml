abstract:
- language: en
  script: Latn
  content: ISO 20341:2003 specifies procedures for estimating three depth resolution
    parameters, viz the leading-edge decay length, the trailing-edge decay length
    and the Gaussian broadening, in SIMS depth profiling using multiple delta-layer
    reference materials. It is not applicable to delta-layers where the chemical and
    physical state of the near-surface region, modified by the incident primary ions,
    is not in the steady state.
