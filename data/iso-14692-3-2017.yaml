abstract:
- language: en
  script: Latn
  content: ISO 14692-3:2017 gives guidelines for the design of GRP piping systems.
    The requirements and recommendations apply to layout dimensions, hydraulic design,
    structural design, detailing, fire endurance, spread of fire and emissions and
    control of electrostatic discharge. This document is intended to be read in conjunction
    with ISO 14692‑1.
