abstract:
- language: en
  script: Latn
  content: 'ISO/TS 11133-1:2009 provides the general terminology related to quality
    assurance and specifies the minimum requirements for the preparation of culture
    media to be used for the microbiological analysis of products intended for human
    consumption or animal feeding. It is also applicable to culture media to be used
    for the microbiological analysis of all kinds of water. These requirements are
    applicable to four categories of culture media used in laboratories that prepare
    and/or use culture media for performing microbiological analyses: commercially
    manufactured ready-to-use media; media to be remelted, supplemented and distributed;
    media prepared from commercially available dehydrated formulations; and media
    prepared from their individual components.'
