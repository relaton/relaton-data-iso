abstract:
- language: en
  script: Latn
  content: This document describes a method to assess the soil quality by soluble
    contaminants and substances contained in natural or artificial contaminated soil
    samples. The method is applicable for contaminants and substances that are easily
    soluble in soil, and it is based on the biomass using chlorophyll a production
    of soil alga species grown on paper-disc soil.
