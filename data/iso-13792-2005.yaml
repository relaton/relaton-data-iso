abstract:
- language: en
  script: Latn
  content: ISO 13792:2005 specifies the required input data for simplified calculation
    methods for determining the maximum, average and minimum daily values of the operative
    temperature of a room in the warm period to define the characteristics of a room
    in order to avoid overheating in summer at the design stage, and to define whether
    the installation of a cooling system is necessary or not. The criteria to be met
    by a calculation method in order to satisfy this standard are also given.
