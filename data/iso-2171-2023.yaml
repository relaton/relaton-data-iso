abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for determining the ash yield by cereals,
    pulses and their milled products intended for human consumption. The source materials
    and products covered are: a)    grains of cereals; b)    flours and semolinas;
    c)     other milling products (bran and high bran content products, shorts); d)   
    mixed cereal flours (mixes); e)    cereal by-products other than c) (such as wheat
    gluten, maize grits, broken rice kernels); f)     pulses and their by-products
    (flour). This document does not apply to starches and starch derivatives (see
    ISO 3593), to products intended for animal feeding stuffs (see ISO 5984) or to
    seeds.'
