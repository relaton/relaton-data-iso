abstract:
- language: en
  script: Latn
  content: This document specifies a flame atomic absorption spectrometric method
    (FAAS) for the determination of the vanadium content in steel. The method is applicable
    to vanadium contents between 0,01 % (mass fraction) and 0,80 % (mass fraction),
    provided that the tungsten content in a 1,0 g test portion is not higher than
    1,0 % and/or the titanium content is not higher than 0,5 %.
