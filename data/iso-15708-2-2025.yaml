abstract:
- language: en
  script: Latn
  content: This document specifies the general principles of X-ray computed tomography
    (CT), the equipment used and basic considerations of sample, materials and geometry.
    This document is applicable only to industrial imaging (i.e. non-medical applications)
    and provides a consistent set of definitions of CT performance parameters, including
    the relationship between these performance parameters and CT system specifications.
    This document is applicable to industrial computed tomography. This document does
    not apply to other techniques of tomography, such as translational tomography
    and tomosynthesis.
