abstract:
- language: en
  script: Latn
  content: ISO 10846-2:2008 specifies a method for determining the dynamic transfer
    stiffness for translations of resilient supports, under specified preload. The
    method concerns the laboratory measurement of vibrations on the input side and
    blocking output forces and is called “the direct method.” The method is applicable
    to test elements with parallel flanges (see Figure 1). Resilient elements, which
    are the subject of ISO 10846-2:2008, are those which are used to reduce the transmission
    of vibration in the lower part of the audible frequency range (typically 20 Hz
    to 500 Hz) to a structure which may, for example, radiate unwanted fluid-borne
    sound (airborne, waterborne or others), and the transmission of low-frequency
    vibrations (typically 1 Hz to 80 Hz), which may, for example, act upon human subjects
    or cause damage to structures of any size when vibration is too severe.
