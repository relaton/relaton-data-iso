abstract:
- language: en
  script: Latn
  content: ISO 10815:2016 establishes the basic principles for measuring, processing
    and evaluating vibration generated internally in railway tunnels by the passage
    of trains. By establishing a standard procedure, comparative data may be obtained
    on response of the tunnel elements from time to time, provided that the excitation
    source is the same. Data obtained in different tunnels may also be compared. The
    measurements considered in ISO 10815:2016 concern the response of the structure
    and secondary elements mounted in the tunnel. They do not concern the response
    of persons in the tunnel or in its vicinity, or of passengers on trains running
    through the tunnel.
