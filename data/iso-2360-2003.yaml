abstract:
- language: en
  script: Latn
  content: ISO 2360:2003 describes a method for non-destructive measurements of the
    thickness of non-conductive coatings on non-magnetic, electrically conductive
    (generally metallic) basis materials, using amplitude-sensitive eddy current instruments.
    The method described can also be used to measure non-magnetic metallic coatings
    on non-conductive basis materials and is particularly applicable to measurements
    of the thickness of most oxide coatings produced by anodizing, but is not applicable
    to all conversion coatings, some of which are too thin to be measured by this
    method. Although theoretically, the method can be used for measurements of the
    thickness of coatings on magnetic basis materials, its use for this application
    is not recommended.
