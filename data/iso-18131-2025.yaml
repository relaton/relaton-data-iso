abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements on publish-subscribe architecture
    on ship-shore data communication. It is intended for use by system providers and
    users, including software vendors, platform developers, fleet managers, application
    users in the field of the shipbuilding industry, shipping companies, equipment
    manufacturers, and port and on-shore service providers, to communicate in the
    publish-subscribe architecture between ship and shore. This document focuses on
    enabling interoperability of shipboard and shore-based systems for the exchange
    of operational data using publish-subscribe methods. This document describes:
    —          the role of a broker, publisher and subscriber; —          the multitenancy-based
    data management system in the cloud environment; —          general requirements
    for publish-subscribe architecture; —          security requirements for ensuring
    data confidentiality, integrity and availability; —          the message format
    for client id and topic name, and data model; —          functional requirements
    for data management.'
