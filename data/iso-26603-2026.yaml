abstract:
- language: en
  script: Latn
  content: This document specifies the determination of the total chlorine content
    of aromatic isocyanates used in the preparation of polyurethanes. The difference
    between the total chlorine content and the hydrolyzable chlorine content (see
    ISO 15028) is a measure of the process solvents left in the product. All the test
    methods are applicable to a variety of organic compounds, including aliphatic
    isocyanates, but the amount of sample used might need to be adjusted. These test
    methods can be used for research or for quality control.
