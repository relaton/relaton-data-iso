abstract:
- language: en
  script: Latn
  content: 'This document provides guidance on how four complementary international
    standards can be used in combination by developers of health ICT systems and infrastructures.
    These standards, three published by CEN and ISO and one by HL7, are —     ISO 13940:2015,
    —     ISO 13606-1:2019, —     ISO 13606-3:2019, and —     HL7 Fast Health Interoperability
    Resources (FHIR) Release 4. This document defines mappings between these standards:
    between ISO 13940 and HL7 FHIR in both directions, between ISO 13606 and HL7 FHIR
    in both directions, it proposes the content of an HL7 FHIR profile corresponding
    to the ISO 13606-1:2019 “COMPOSITION” class. It also provides guidance and worked
    examples of the mapping between ISO 13606-3 Reference Archetypes corresponding
    to ISO 13940 and HL7 FHIR. This document also summarizes the extent to which the
    source concept is broader than or narrower than the best fit target concept. It
    also highlights mapping issues that adopters will need to be mindful of, where
    the representation capability of the standards differs.'
