abstract:
- language: en
  script: Latn
  content: 'The Geography Markup Language (GML) is an XML encoding in accordance with
    ISO 19118 for the transport and storage of geographic information modelled in
    accordance with the conceptual modelling framework used in the ISO 19100 series
    of International Standards and including both the spatial and non-spatial properties
    of geographic features. This document defines the XML Schema syntax, mechanisms
    and conventions that: — provide an open, vendor-neutral framework for the description
    of geospatial application schemas for the transport and storage of geographic
    information in XML; — allow profiles that support proper subsets of GML framework
    descriptive capabilities; — support the description of geospatial application
    schemas for specialized domains and information communities; — enable the creation
    and maintenance of linked geographic application schemas and datasets; — support
    the storage and transport of application schemas and datasets; — increase the
    ability of organizations to share geographic application schemas and the information
    they describe. Implementers can decide to store geographic application schemas
    and information in GML, or they can decide to convert from some other storage
    format on demand and use GML only for schema and data transport. NOTE If an ISO
    19109 conformant application schema described in UML is used as the basis for
    the storage and transportation of geographic information, this document provides
    normative rules for the mapping of such an application schema to a GML application
    schema in XML Schema and, as such, to an XML encoding for data with a logical
    structure in accordance with the ISO 19109 conformant application schema.'
