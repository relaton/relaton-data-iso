abstract:
- language: en
  script: Latn
  content: This document specifies test methods for verifying the capabilities of
    tyres for motorcycles. Of the test methods presented, only some can be required
    depending on the type of tyre to be tested. The tests are carried out in the laboratory
    under controlled conditions. This document includes a strength test for assessing
    the capability of the tyre structure, with respect to breaking energy. A second
    test, the endurance test, assesses the resistance of the tyre with respect to
    service at full load and moderate speed over long distances. The third test, the
    high-speed test, assesses the capability of the tyre as related to service at
    the maximum speed capability of the tyre. The centrifugal growth test assesses
    the maximum growth of the tyre under the influence of centrifugal forces at the
    maximum speed capability of the tyre. The test methods presented in this document
    are not intended for gradation of tyre performance or quality levels. This document
    is applicable to all motorcycle tyres.
