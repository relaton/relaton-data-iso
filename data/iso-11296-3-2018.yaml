abstract:
- language: en
  script: Latn
  content: This document, in conjunction with ISO 11296‑1, specifies requirements
    and test methods for close-fit lining systems used for the renovation of underground
    non-pressure drainage and sewerage networks. It applies to pipes and fittings
    made of polyethylene (PE) or unplasticized poly(vinyl chloride) (PVC‑U) as manufactured,
    as well to the installed lining system with its associated joints.
