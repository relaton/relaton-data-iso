abstract:
- language: en
  script: Latn
  content: The ISO 9211 seriesidentifies surface treatments of components and substrates
    excluding ophthalmic optics (spectacles) by the application of optical coatings
    and gives a standard form for their specification. It defines the general characteristics
    and the test and measurement methods whenever necessary, but is not intended to
    define the process method. ISO 9211‑2:2010 indicates how to specify optical properties
    of coatings and to represent their spectral characterization graphically.
