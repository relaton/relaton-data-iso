abstract:
- language: en
  script: Latn
  content: ISO 18201:2013 defines a Mission Operations (MO) reference model which
    provides a common basis for coordinating the development of CCSDS Recommended
    Standards for MO service specifications and serves as a reference to maintain
    the consistency of these Recommended Standards. The scope of ISO 18201:2013 is
    the definition of all concepts and terms that establish a common basis for coordinating
    the development of CCSDS Recommended Standards for MO service specifications.
