abstract:
- language: en
  script: Latn
  content: This document specifies a flow analysis method with spectrometric detection
    for the determination of the urea content of milk in mass concentrations ranging
    from 0 mg/l to 800 mg/l, all in the undiluted sample. Other mass concentration
    ranges are possible, provided they cover exactly one decade of concentration (e.g.
    100 mg/l to 1 000 mg/l). The range of application may be changed by varying the
    operating conditions.
