abstract:
- language: en
  script: Latn
  content: ISO/TS 22239-1:2009 specifies a child seat presence detection system that
    enables child seats placed on any passenger seats to be automatically detected
    where a child is at risk from an active airbag. The system provides the option
    of using additional information about the orientation of the child seat. ISO/TS
    22239-1:2009 describes the main system functionality, and provides design recommendations
    and requirements, compatibility measurements and labelling requirements. Compliance
    with the requirements of ISO/TS 22239-1:2009 ensures compatibility between child
    seat presence and orientation detection system (CPOD) child seats and CPOD passenger
    seats. ISO/TS 22239 applies only to child restraint systems in which the child
    is orientated in the forward or rearward driving direction.
