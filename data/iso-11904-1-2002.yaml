abstract:
- language: en
  script: Latn
  content: ISO 11904-1:2002 specifies basic framework measurement methods for sound
    immissions from sound sources placed close to the ear. These measurements are
    carried out with miniature or probe microphones inserted in the ear canals of
    human subjects. The measured values are subsequently converted into corresponding
    free-field or diffuse-field levels. The results can be given as free-field related
    or diffuse-field related equivalent continuous A-weighted sound pressure levels.
    The technique is denoted the microphone-in-real-ear technique (MIRE technique).
    ISO 11904-1:2002 is applicable to exposure from sources close to the ear, for
    example during equipment tests or at the workplace by earphones or hearing protectors
    with audio communication facilities. ISO 11904-1:2002 is applicable in the frequency
    range from 20 Hz to 16 000 Hz.
