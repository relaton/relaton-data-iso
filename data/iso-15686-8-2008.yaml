abstract:
- language: en
  script: Latn
  content: ISO 15686-8:2008 provides guidance on the provision, selection and formatting
    of reference service-life data and on the application of these data for the purposes
    of calculating estimated service life using the factor method. ISO 15686-8:2008
    does not give guidance on how to estimate the modification part or the values
    of factors A to G, using given reference in-use conditions and the object-specific
    in-use conditions.
