abstract:
- language: en
  script: Latn
  content: 'ISO/TR 17641-3:2005 outlines the test methods and procedures for carrying
    out externally loaded tests to assess susceptibility to hot cracking. The following
    tests are described: Hot tensile testsVarestraint and Transvarestraint testFlat
    tensile test. The above tests can provide information about the hot cracking sensitivity
    of parent materials, weld metals and weldments. Assessment is based upon the measurement
    of the "brittle temperature range" (BTR) where hot cracks occur. This document
    applies primarily to austenitic stainless steels, nickel-, nickel-base and nickel-copper
    alloys, weldments and welding consumables. However, the principles can be extended
    to other materials such as aluminium alloys and high-strength steels.'
