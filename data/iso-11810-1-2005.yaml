abstract:
- language: en
  script: Latn
  content: ISO 11810-1:2005 is applicable to disposable and reusable, as well as woven
    and non-woven materials used as surgical drapes and other patient protective covers
    which claim to be laser resistant. The purpose of ISO 11810-1:2005 is to provide
    a standardized method for testing and classifying surgical drapes and other patient
    protective covers with respect to laser-induced hazards. An appropriate classification
    system is given. It is not the purpose of ISO 11810-1:2005 to serve as a general
    fire safety specification, and as such, this standard does not cover other sources
    of ignition. It also does not cover the issue of laser-induced secondary ignition.
    All materials reflect portions of the beam and it is necessary for the user to
    decide whether specular reflectance may be a hazard. This measurement, however,
    is not covered in ISO 11810-1:2005.
