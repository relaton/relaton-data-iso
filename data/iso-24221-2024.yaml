abstract:
- language: en
  script: Latn
  content: This document specifies the general requirements for brake systems. This
    document focuses on general principles and general requirements of brake systems.
    This document is applicable for all types of rolling stock during design and whole
    lifetime. This document does not specify the braking performance criteria. This
    document can be applied to all rolling stock with metal to metal wheel/rail contact
    irrespective of speed classification.
