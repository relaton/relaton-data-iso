abstract:
- language: en
  script: Latn
  content: 'ISO/TS 27790:2009 specifies a general purpose document registry framework
    for transmitting, storing and utilizing documents in clinical and personalized
    health environments. It is quite broad in its applicability to realise the goal
    of sharing health related documents spanning a broad spectrum of health domains
    such as healthcare specialities covering laboratory, cardiology, eye care, etc
    and the many areas of personalized health. ISO/TS 27790:2009 also references a
    number of companion standards-based specifications that offer optional extensions
    to enhance the basic capabilities offered by IHE XDS. It references the support
    of the following. An XDS extension supporting the fragmentation of the content
    of the documents into two parts: a header fragment and a body fragment. This separation
    scheme enhances confidentiality because the gathering both of header and body
    and their relational information involves cracking into multiple repository servers.
    This has been developed as an IHE Korean Extension on the IHE XDS Profile. A series
    of security- and privacy-related IHE profiles, such as Patient Identification
    Cross-Referencing (PIX), Patient Demographics Query (PDQ), Basic Patient Privacy
    Consent (BPPC), Cross-Enterprise User Assertion (XUA).'
