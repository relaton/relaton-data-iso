  script: Latn
  content: 'ISO/TS 10303-1752:2010-07 specifies the application module for Thermal
    network definition. The following are within the scope of ISO/TS 10303-1752:2010-07:
    networks whose network nodal formulation is a representation of heat flow; items
    within the scope of application module Component feature, ISO/TS 10303-1657; items
    within the scope of application module Network functional design view, ISO/TS
    10303-1704; items within the scope of application module Non feature shape element,
    ISO/TS 10303-1706.'
