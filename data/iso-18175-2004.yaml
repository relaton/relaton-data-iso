abstract:
- language: en
  script: Latn
  content: 'ISO 18175:2004 describes procedures for evaluating the following performance
    characteristics of ultrasonic pulse-echo examination instruments: horizontal limit
    and linearity; vertical limit and linearity; resolution-entry surface and far
    surface; sensitivity and noise; accuracy of calibrated gain controls. ISO 18175:2004
    may be used for the evaluation of a complete examination system, including transducer,
    instrument, interconnections, fixtures and connected alarm and auxiliary devices,
    primarily in cases where such a system is used repeatedly without change or substitution.
    This International Standard is not intended to be used as a substitute for calibration
    of a system to inspect any given material.'
