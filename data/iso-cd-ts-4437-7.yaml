abstract:
- language: en
  script: Latn
  content: 'This document gives guidance and requirements for the assessment of conformity
    of compounds, products, joints and assemblies in accordance with the applicable
    part(s) of ISO 4437 intended to be included in the manufacturer’s quality plan
    as part of the quality management system and for the establishment of certification
    procedures. NOTE 1 A test matrix provides an overview of the testing scheme in
    Annex C, Table C.1. NOTE 2 If certification is involved, the certification body
    operating in accordance with ISO/IEC 17065 and ISO/IEC 17020 is considered to
    be competent. In conjunction with ISO 4437-2, ISO 4437-3, ISO 4437-4 and ISO 4437-5,
    this document is applicable to PE pipes, fittings and valves, their joints, and
    joints with components of PE and other materials intended to be used under the
    following conditions: a) a maximum operating pressure (MOP), up to and including
    10 bar , at a design reference temperature of 20 °C; b) an operating temperature
    between −20 °C and 40 °C. For operating temperatures between 20 °C and 40 °C,
    derating coefficients are defined in ISO 4437-5. The ISO 4437 series covers a
    range of MOPs and gives requirements concerning colours. It is the responsibility
    of the purchaser or specifier to make the appropriate selections from these aspects,
    taking into account their particular requirements and any relevant national guidance
    or regulations and installation practices or codes.'
