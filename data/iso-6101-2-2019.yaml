abstract:
- language: en
  script: Latn
  content: This document specifies an atomic absorption spectrometric method for the
    determination of the lead content of rubbers. The method is applicable to raw
    rubber and rubber products. There is no limit to the concentration of lead that
    can be determined. High or low concentrations can be determined, provided that
    suitable adjustments are made to the mass of the test portion and/or the concentration
    of the solutions used. The use of the standard-additions method might lower the
    bottom limit of detection.
