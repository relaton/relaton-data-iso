abstract:
- language: en
  script: Latn
  content: This part of ISO 15792 specifies the preparation of butt weld test pieces
    and specimens. The purpose is to define test methods in order to determine strength
    and impact strength of the welded joint when testing welding consumables with
    single-run and two-run technique, not suitable for electro-slag or electro-gas
    welding. This part of ISO 15792 is applicable to welding consumables for arc welding
    of steel.
