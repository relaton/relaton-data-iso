abstract:
- language: en
  script: Latn
  content: ISO 9349:2004 specifies the requirements and test methods applicable to
    preinsulated ductile iron pipes, fittings, accessories and their joints for the
    construction of pipelines (or parts thereof) to convey water (e.g. potable water),
    wastewater and other liquids, to be operated with or without pressure, to be installed
    below or above ground, to limit temperature variations of the conveyed fluids.
    ISO 9349:2004 gives, in addition to the specifications of the existing ISO standards
    for the conveying ductile iron pipes and fittings, specifications for materials,
    dimensions and tolerances, mechanical and thermal properties of the thermal insulation
    layer and external casing of preinsulated ductile iron pipes, fittings and accessories.
    ISO 9349:2004 covers preinsulated ductile iron pipes, fittings and accessories
    of a size range extending from DN 60 to DN 600 inclusive, which are manufactured
    with socketed, flanged or spigot ends for jointing by means of various types of
    gaskets which are not within the scope of this International Standard; preinsulated
    in the works (excluding on-site application of the insulation layer and/or the
    casing); normally delivered internally and externally coated; intended for fluid
    temperatures from 0 °C to 50 °C, excluding frost.
