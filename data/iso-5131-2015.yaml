abstract:
- language: en
  script: Latn
  content: ISO 5131:2015 specifies a method for the measuring and reporting of the
    noise at the operator(s) position of a tractor used in agriculture and forestry.
    The measured noise relates only to the basic machine and applies to tractors with
    machine-carried operators. The results provide information to the operator(s)
    in order to avoid exposing themselves to noise levels that could put their hearing
    at risk. The conditions specified for the operation of the machines during the
    measurements are defined to provide a realistic and repeatable assessment of the
    maximum noise an operator should be subjected to when operating a machine. The
    test procedures specified in this International Standard are survey methods as
    defined in ISO 12001.
