abstract:
- language: en
  script: Latn
  content: 'ISO 10052:2004 specifies field survey methods for measuring: a) airborne
    sound insulation between rooms; b) impact sound insulation of floors; c) airborne
    sound insulation of facades; and d) sound pressure levels in rooms caused by service
    equipment. The methods described in ISO 10052:2004 are applicable to measurements
    in rooms of dwellings or in rooms of comparable size with a maximum of 150 m 3
    .'
