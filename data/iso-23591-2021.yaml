abstract:
- language: en
  script: Latn
  content: 'This document specifies differentiated criteria for acoustic conditions
    and characteristics for rooms and spaces used for music rehearsal. The criteria
    are specified for different types of music, regardless of the type of building
    in which the spaces are located. The document provides criteria for room acoustics
    in spaces used for music rehearsal, whether this is the primary use of the spaces
    or they are multi-purpose spaces. Together with the acoustic criteria, requirements
    are given for net room height, net room volume and net area. Criteria for acoustic
    conditions are differentiated on the basis of three music types: amplified music,
    quiet acoustic music, and loud acoustic music. This document is applicable to
    the planning of new buildings and the refurbishment of existing ones. The document
    can also be used to assess the suitability of existing spaces for different musical
    purposes. The document can be used for the adjustment of rooms and spaces whose
    primary purpose is not music rehearsal such as sports halls, classrooms, assembly
    halls, multi-purpose rooms, etc. Flexible acoustic solutions can be used in order
    to cover several purposes of use. The criteria in this document do not apply to
    large, specialized concert halls, opera venues and similar spaces which are basically
    designed for concerts and performances, or specialized music recording studios.
    The document does not deal with the need for logistics, storage rooms for instruments
    and other key support functions relating to music rehearsal. Sound insulation
    criteria are not included in this document.'
