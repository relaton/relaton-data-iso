abstract:
- language: en
  script: Latn
  content: ISO 28941-1:2008 establishes a system of designation for PPE thermoplastic
    materials, which may be used as the basis for specifications. The types of PPE
    plastic are differentiated from each other by a classification system based on
    appropriate levels of the designatory properties temperature of deflection under
    load melt volume-flow rate Charpy notched impact strength flammability and on
    information about basic polymer parameters, intended application and/or method
    of processing, important properties, additives, colorants, fillers and reinforcing
    materials. ISO 28941-1 is applicable to all PPE materials, including those modified
    with polystyrene or polyamide or other materials. It applies to materials ready
    for normal use in the form of powder, granules or pellets and to materials unmodified
    or modified by colorants, additives, fillers, etc.
