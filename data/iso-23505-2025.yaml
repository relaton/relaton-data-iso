abstract:
- language: en
  script: Latn
  content: This document specifies a method for the calibration of spherical tanks
    with a radius greater than 1 m by means of external measurements using an electro-optical
    distance-ranging instrument (EODR). It also specifies the subsequent calculation
    and the compilation of tank capacity tables. This document applies to spherical
    tanks built above ground, that are non-insulated, single-shell and with a radial
    variation up to 1 %. The method specified in this document can also apply to spherical
    tanks built above the deck when the carrying ship is in the dock. This document
    does not apply to the calibration of spheroidal tanks.
