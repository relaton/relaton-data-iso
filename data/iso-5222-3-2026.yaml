abstract:
- language: en
  script: Latn
  content: This document specifies the testing and calculating methods for annual
    sensible heating and cooling recovery performance factors of heat recovery ventilators
    (HRVs) covered by ISO 16494-1. This document also specifies the test conditions
    and the corresponding test procedures for determining the annual sensible heating
    and cooling recovery seasonal performance factors of HRVs. It is intended for
    use in marking and comparison. The procedures of this document can be used for
    other temperature conditions.
