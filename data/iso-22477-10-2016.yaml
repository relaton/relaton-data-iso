abstract:
- language: en
  script: Latn
  content: 'ISO 22477-10:2016 establishes the specifications for the execution of
    rapid load pile tests in which a single pile is subject to an axial load in compression
    to measure its load-displacement behaviour under rapid loading and to allow an
    assessment of its measured compressive resistance (Rc,m) and corresponding load-displacement
    behaviour. ISO 22477-10:2016 is applicable to piles loaded axially in compression.
    All pile types mentioned in EN 1536, EN 12699 and EN 14199 are covered by this
    part of ISO 22477. The tests in this part of ISO 22477 are limited to rapid load
    pile tests only. NOTE 1 This part of ISO 22477 can be used in conjunction with
    EN 1997?1. Numerical values of partial factors for limit states from pile load
    tests to be taken into account in design are provided in EN 1997?1. For design
    to EN 1997?1, the results from rapid load pile testing will be considered equivalent
    to the measured compressive resistance, Rc,m, after being subject to appropriate
    analysis. NOTE 2 Guidance on analysis of the rapid load testing results to determine
    measured compressive resistance and corresponding load-displacement behaviour
    is given in Annex A. ISO 22477-10:2016 provides specifications for the following:
    a) investigation tests, whereby a sacrificial test pile is loaded up to ultimate
    limit state; b) control tests, whereby the pile is loaded up to a specified load
    in excess of the serviceability limit state. NOTE 3 Generally, an investigation
    test focuses on general knowledge of a pile type; a control test focuses on one
    specific application of a pile.'
