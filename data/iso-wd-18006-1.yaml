abstract:
- language: en
  script: Latn
  content: This document specifies necessary information on the battery pack for the
    electrically propelled vehicles and how to install the information. The information
    is related to the traceability of battery pack and includes the manufacturer,
    specification, safe handling, EOL, recycling, battery sustainability, and charge
    / discharge performance. Installation methods include labels, engraved marking,
    QR codes, and barcodes
