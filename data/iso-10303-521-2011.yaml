abstract:
- language: en
  script: Latn
  content: "  ISO 10303-521:2011 specifies the integrated resource constructs for
    Manifold subsurface. The following are within the scope of ISO 10303-521:2011:
    3D geometry; advanced faces; connected face sub sets; mappings and geometric transformations;
    open shells; relationships between domains of topological objects; subedges; subfaces;
    unbounded geometry with associated topological boundaries; use of topology to
    bound geometric entities."
