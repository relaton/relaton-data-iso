abstract:
- language: en
  script: Latn
  content: 'This part of ISO 16119 specifies requirements and the means for their
    verification for the design and performance of horizontal boom sprayers, as defined
    in 3.1, with regard to minimizing the potential risk of environmental contamination
    during use, including misuse foreseeable by the manufacturer. It is intended to
    be used with ISO 16119 1, which gives general requirements common to all the sprayer
    types covered by ISO 16119. When requirements of this part of ISO 16119 are different
    from those which are stated in ISO 16119 1, the requirements of this part of ISO
    16119 take precedence over the requirements of ISO 16119 1 for machines within
    the scope of this part of ISO 16119. It does not cover safety aspects (see ISO
    4254 6). • Define and specify requirements for ‘Modules’ • Filling -Total tank
    extra volume • Quick coupler for CTS + mandatory provision of inductor hopper
    or CTS • Filters drain valve • Digital level indicator + accuracy • Boom automatic
    section control (>24 m) + ISOBUS task controller • Boom nozzle spacing equal location
    • Pump requirements as per ISO 12908: 2020 • Residue concentration only one method
    for system rinsing • Direct injection definition, requirements, test method'
