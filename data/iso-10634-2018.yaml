abstract:
- language: en
  script: Latn
  content: This document specifies techniques for preparing poorly water-soluble organic
    compounds (i.e. liquid and solid compounds) with a solubility in water of less
    than approximately 100 mg/l and introducing them into test vessels for a subsequent
    biodegradability test in an aqueous medium using standard methods. The subsequent
    tests on biodegradability are primarily methods using the analysis of the released
    carbon dioxide described in ISO 9439 and the determination of the oxygen described
    in ISO 9408 and following the usual precautions for ISO 10707. Thus, one can notice
    that the methods measuring the removal of dissolved organic carbon (DOC) are not
    appropriate. This document does not specify the biodegradation test methods. It
    is restricted to describing techniques for introducing the test compounds into
    the test medium and to keeping them in a dispersed state[4]. These techniques
    are implemented while observing the experimental conditions described in the standardized
    methods for evaluating biodegradability. ISO 9439, based on CO2 evolution, is
    not suitable for testing volatile compounds. Some of the preparation methods described
    in this document might not be accepted by regulators for making conclusions on
    the ready biodegradability of tested compounds. Examples of biodegradability curves
    are given in Annex A.
