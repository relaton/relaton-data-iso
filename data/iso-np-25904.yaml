abstract:
- language: en
  script: Latn
  content: 'This document specifies the fundamental concepts, reference architecture,
    and main functions of Blockchain as a Service (BaaS). It provides a technical
    specification for the design, deployment, and operation of BaaS platforms. The
    main contents include: (1)the reference architecture of BaaS, including infrastructure
    layer, Distributed ledger technologies (DLT) layer, service layer, and smart contract
    layer, (2)the main functional requirements of BaaS, including DLT network management,
    resource allocation, security, privacy, interoperability, and compliance, (3)
    smart contract support in BaaS environments, including lifecycle management, execution
    environments, cross-platform interoperability, and auditing, (4) general requirements
    for BaaS platforms, including performance, reliability, and scalability, (5) illustrative
    examples of BaaS that has been put into production and applications across different
    industry domains.'
