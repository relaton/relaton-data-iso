abstract:
- language: en
  script: Latn
  content: ISO 8178-10 specifies the measurement procedures and test cycles for the
    evaluation of smoke emissions from compression ignition engines under field conditions.
    It is intended for use primarily as a support for in-use smoke testing programmes
    on engines that have been "certified" or "type approved" in accordance with the
    provisions of ISO 8178-9. For transient smoke test cycles, smoke testing is conducted
    using smokemeters that operate on the light extinction principle. The purpose
    of this part of ISO 8178 is to define the smoke test cycles and the methods used
    to measure and analyse smoke. The test procedures and measurement techniques described
    in this part of ISO 8178 are applicable to reciprocating internal combustion (RIC)
    engines in general. However, an engine application can only be evaluated using
    this part of ISO 8178 once the appropriate test cycle has been developed.
