abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the commissioning of lighting
    systems in buildings to meet design specifications. This document presents details
    of the commissioning of lighting systems without focusing on the technical characteristics
    of specific components. This document can be applied to new installations of non-residential
    buildings and public spaces of multi-residence buildings. This document does not
    cover the commissioning of lighting systems concerning the electrical power connection
    aspects which are deemed to be in compliance with relevant legislation or standards.
    This document is not applicable to the commissioning of emergency lighting.
