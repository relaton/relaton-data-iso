abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1345:2008 specifies the application module for Item definition
    structure. The following are within the scope of ISO/TS 10303-1345:2008: definition
    of structures for part definitions, part occurrences and between part definitions
    and part occurrences; relationships between an assembly and its constituents;
    items within the scope of application module Effectivity application, ISO/TS 10303-1059;
    items within the scope of application module Part occurrence, ISO/TS 10303-1715;
    items within the scope of application module Product structure, ISO/TS 10303-1134.'
