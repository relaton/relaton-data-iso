abstract:
- language: en
  script: Latn
  content: ISO 22369-2:2010 specifies the drift classification procedure for field
    crop sprayers by field measurements of spray drift sedimentation in conformity
    with ISO 22866, including the test methods and evaluation criteria needed. It
    also allows the allocation of the spray drift reduction classes specified by ISO
    22369-1. ISO 22369-2:2010 is intended to determine the drift reducing performance
    of field crop sprayers by comparison with a reference spraying system, in order
    to rate (classify) the field crop sprayers. It is applicable to mounted, trailed
    and self-propelled field crop sprayers used in field crops.
