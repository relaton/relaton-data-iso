abstract:
- language: en
  script: Latn
  content: 'This part of ISO 4190 specifies the necessary dimensions to permit the
    installation of Class IV lifts, as defined in 3.2.4, generally used for the transport
    of goods (freight). It deals with electric and hydraulic lifts. The horizontal
    dimensions of the wells (US: hoistways) are generally defined by the entrance
    and drive configurations. It covers lifts with either horizontal or vertical power-operated
    sliding doors [see Figures 1 a) and 1 b)]. For other characteristics, the manufacturers
    should be consulted. This part of ISO 4190 is applicable to new lift installations,
    with a car with one or two entrances, to be installed in a new building. Where
    relevant, it may be used as a basis for an installation in an existing building.
    Two types of loading (load per unit area) are addressed: Series A: passenger and
    goods (freight) lifts with loading conforming to EN 81-1 or EN 81-2; Series B:
    lifts for goods (freight) only, which have a different floor loading in countries
    which allow this by virtue of their safety codes.'
