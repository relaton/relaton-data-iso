abstract:
- language: en
  script: Latn
  content: This document gives guidelines for an organization to implement and maintain
    a formal and documented business impact analysis (BIA) process appropriate to
    its needs. It does not prescribe a uniform process for performing a BIA. This
    document is applicable to all organizations regardless of type, size and nature,
    whether in the private, public or not-for-profit sectors. The guidance can be
    adapted to the needs, objectives, resources and constraints of the organization.
