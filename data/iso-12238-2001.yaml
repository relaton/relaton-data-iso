abstract:
- language: en
  script: Latn
  content: This International Standard — specifies test procedures for measuring the
    shifting times of electrically- or pneumatically-operated directional control
    valves and moving-part logic elements, — establishes a definition for shifting
    time, and — is intended to improve the application of pneumatic fluid power by
    providing users and manufacturers of pneumatic valves with a standardized test
    procedure for measuring the shifting time it defines.
