abstract:
- language: en
  script: Latn
  content: This document specifies requirements, test methods and performance criteria
    for multi-sensor point fire detectors that incorporate a smoke sensor, a carbon
    monoxide (CO) sensor and, optionally, one or more heat sensors, for use in fire
    detection and alarm systems installed in buildings (see ISO 7240‑1). For the testing
    of other types of fire detectors using smoke, CO and, optionally, heat sensors
    working on different principles, this document can be used only for guidance.
    This document is not applicable to fire detectors using smoke, CO and, optionally
    heat sensors, which have special characteristics and which have been developed
    for specific risks.
