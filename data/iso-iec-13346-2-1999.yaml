abstract:
- language: en
  script: Latn
  content: 'This part of ISO/IEC 13346 specifies a format and associated system requirements
    for volume and boot block recognition by specifying: volume recognition; boot
    descriptors intended for use to bring a system to a known state; levels of medium
    interchange; requirements for the processes which are provided within information
    processing systems, to enable information to be interchanged between different
    systems; for this purpose, this part of ISO/IEC 13346 specifies the functions
    to be provided within systems which are intended to originate or receive media
    which conform to this part of ISO/IEC 13346.'
