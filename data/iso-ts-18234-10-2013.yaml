abstract:
- language: en
  script: Latn
  content: 'ISO 18234-10:2013 contains the definition of the TPEG Conditional Access
    Information (CAI) application. It enables dedicated conditional access data, such
    as management messages (e.g. Control Words and Entitlement Control Messages) to
    be delivered to recipient client devices. This TPEG application is designed for
    a service provider to: establish setup, prolongation or revocation of services
    to a specific client device, using a limited capacity unidirectional broadcast
    channel and without recourse to service-client handshaking. This TPEG application
    defines: the logical channel, for the transmission of the additional CA information
    (CAI); how the CAI is linked and synchronized to the scrambled content.'
