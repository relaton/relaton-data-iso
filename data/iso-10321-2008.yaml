abstract:
- language: en
  script: Latn
  content: ISO 10321:2008 specifies an index test method for determination of the
    tensile properties of joints and seams in geosynthetics, using a wide-width strip.
    The method is applicable to most geosynthetics. It is also applicable to geogrids,
    but the specimen dimensions may need to be altered. This test is not applicable
    to polymeric or bituminous geosynthetic barriers. The method specified in ISO
    10321:2008 quantifies the tensile strength of a joint or seam between geosynthetics.
    It can provide data to indicate the joint or seam tensile strength which can be
    achieved. Procedures for measuring the tensile properties of both conditioned
    and wet specimens are included.
