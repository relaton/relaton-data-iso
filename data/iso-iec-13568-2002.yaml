abstract:
- language: en
  script: Latn
  content: 'The following are within the scope of this International Standard: _ the
    syntax of the Z notation; _ the type system of the Z notation; _ the semantics
    of the Z notation; _ a toolkit of widely used mathematical operators; _ LATEX
    [10] and e-mail mark-ups of the Z notation. The following are outside the scope
    of this International Standard: _ any method of using Z, though an informative
    annex (E) describes one widely-used convention.'
