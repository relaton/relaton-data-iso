abstract:
- language: en
  script: Latn
  content: This Technical Report presents information on volumetric practices used
    to estimate ethanol and hydrocarbon content in blends of fuel ethanol and gasoline.
    The practices are based on phase separation induced by a sodium chloride (NaCl)
    solution, allowing approximate observation of hydrocarbon fraction and aqueous
    fraction. The approaches described are intended for informational purposes only.
