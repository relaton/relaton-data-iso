abstract:
- language: en
  script: Latn
  content: This document specifies techniques of digital radiography with the object
    of enabling satisfactory and repeatable results. The techniques are based on generally
    recognized practice and fundamental theory of the subject. This document applies
    to the digital radiographic testing of fusion welded joints in metallic materials.
    It applies to the joints of plates and pipes. Besides its conventional meaning,
    “pipe”, as used in this document, covers other cylindrical bodies such as tubes,
    penstocks, boiler drums and pressure vessels. This document specifies the requirements
    for digital radiographic X- and gamma-ray testing by either computed radiography
    (CR) or radiography with digital detector arrays (DDAs) of the welded joints of
    metallic plates and tubes for the detection of imperfections. It includes manual
    and automated inspection with DDAs. Digital detectors provide a digital grey value
    image which can be viewed and evaluated using a computer (Annex E). This document
    specifies the recommended procedure for detector selection and radiographic practice.
    Selection of computer, software, monitor, printer and viewing conditions are important,
    but are not the main focus of this document. The procedure specified in this document
    provides the minimum requirements for radiographic practice which permits exposure
    and acquisition of digital radiographs with equivalent sensitivity for the detection
    of imperfections as film radiography (specified in ISO 17636-1). This document
    does not specify acceptance levels for any of the indications found on the digital
    radiographs. ISO 10675 provides information on acceptance levels for weld inspection.
    If contracting parties apply lower test criteria, it is possible that the quality
    achieved will be significantly lower than when this document is strictly applied.
