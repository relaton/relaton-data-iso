abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the general performance, materials,
    stowage, marking and testing of recovery devices and systems, including specific
    appliances. It also specifies requirements for the manufacturer concerning production,
    type approvals, instructions for use and accompanying documentation. It is intended
    to assist in the selection of ship-specific recovery devices suitable for the
    purpose of safely recovering persons from the water or from survival craft.
