abstract:
- language: en
  script: Latn
  content: ISO/TS 17575‑2:2010 defines how to convey all or parts of the data element
    structure defined in ISO/TS 17575‑1 over any communication stack and media suitable
    for this application. It is focussed on mobile communication links. However, wired
    links shall use the same methodology. The communication interface shall be implemented
    as an API in the programming environment of choice for the Front End (FE) system.
    The definition of this API in concrete terms is outside of the scope of ISO/TS
    17575‑2:2010. ISO/TS 17575‑2:2010 specifies an abstract API that defines the semantics
    of the concrete API. An example concrete API is presented in Annex C. Where no
    distinction is made between the abstract and concrete communications APIs the
    term "communications API" or just "API", can be used.
