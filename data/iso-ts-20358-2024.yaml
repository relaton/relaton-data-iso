abstract:
- language: en
  script: Latn
  content: This document establishes the performance requirements for accessories
    (laces and eyelets, metal components, touch and close fasteners, zippers and trims)
    for footwear, in order to assess the suitability for the end use. It also establishes
    the test methods to be used to evaluate the compliance with the requirements.
    This document applies to accessories (laces and eyelets, metal components, touch
    and close fasteners, zippers and trims) for all kinds of footwear as defined in
    Table 1. This document can be used as a reference by the manufacturer and the
    supplier.
