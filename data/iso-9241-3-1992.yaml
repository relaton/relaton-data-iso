abstract:
- language: en
  script: Latn
  content: Establishes image quality requirements (performance specifications) for
    the design and evaluation of single- and multi-colour VDTs. At present, the recommendations
    are based on Latin, Cyrillic, and Greek origin alphabetic characters, and Arabic
    numerals. Office tasks include such activities as data entry, text processing,
    and interactive inquiry. Annex A describes analytical techniques for predicting
    screen flicker, Annex B an empirical method for assessing temporal and spatial
    instability (flicker and jitter) on screen, Annex C a comparative user performance
    test method.
