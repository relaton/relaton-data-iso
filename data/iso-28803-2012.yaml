abstract:
- language: en
  script: Latn
  content: This International Standard describes how International Standards concerned
    with the ergonomics of the physical environment can be applied for people with
    special requirements, who would otherwise be considered to be beyond the scope
    of those standards. It has been produced according to the principles of accessible
    design provided in ISO/IEC Guide 71 and using the data provided in ISO/TR 22411.
    It is not restricted to any specific environment but provides the general principles
    that allow assessment and evaluation, and can contribute to the development of
    standards concerned with specific environments. It is applicable to built environments
    as well as to other indoor, vehicle and outdoor environments. Nor is it restricted
    to specific environmental components; it includes assessment of acoustic environments,
    thermal environments, lighting, air quality and other environmental factors that
    could be considered to influence the health, comfort and performance of people
    with special requirements in an environment. It is applicable to all occupants
    of such environments who can be considered to have special requirements. NOTE
    This will depend upon context and can, for example, include babies, infants, men
    or women, people with disabilities, older or ill people. A person could have a
    special requirement in one type of environment but not in another.
