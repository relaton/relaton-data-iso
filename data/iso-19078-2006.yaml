abstract:
- language: en
  script: Latn
  content: ISO 19078:2006 specifies the requirements for the inspection of the cylinder
    installation and the requalification of high pressure cylinders, designed and
    manufactured in accordance with ISO 11439, for the on-board storage of natural
    gas as a fuel for automotive vehicles. The purpose of ISO 19078:2006 is to provide
    guidance for the inspection of these cylinders in accordance with the manufacturer's
    recommendations, and to provide criteria for acceptance or rejection in the absence
    of guidance from the manufacturer, with subsequent disposition as necessary.
