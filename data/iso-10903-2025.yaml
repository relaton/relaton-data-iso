abstract:
- language: en
  script: Latn
  content: 'This document provides requirements and guidance on planning, selecting,
    and implementing methods and strategies for monitoring geohazards that can interact
    with pipelines. This document specifies requirements and recommendations for users
    regarding the development and initiation of monitoring processes throughout the
    pipeline life cycle, including the following stages: a)       preliminary engineering
    and route selection phase; b)       detailed design phase; c)        construction
    phase; d)       operation and maintenance phase. This document also describes
    the processes and steps for developing a suitable geohazard monitoring program
    (GHMP). This document applies to geohazard monitoring of new and existing onshore
    gathering and transportation pipelines and the right-of-way (RoW). This document
    does not apply to monitoring geohazards that are temporary, such as the stability
    of spoil piles, temporary cut slopes to facilitate pipeline construction, stability
    of excavation or trench wall, and access roads.'
