abstract:
- language: en
  script: Latn
  content: This document provides requirements for subsurface flow-control devices
    used in side-pocket mandrels intended for use in the worldwide petroleum and natural
    gas industry. This document addresses injection-pressure-operated (IPO), production-pressure-operated
    (PPO), pilot, orifice, tubing-retrievable, and dummy flow-control devices. It
    includes requirements for selecting, designing, manufacturing, quality control,
    testing, and preparation for the shipping of flow-control devices. Additionally,
    it includes information regarding performance testing and calibration requirements.
    The installation and retrieval of flow-control devices is outside the scope of
    this document. Additionally, this document is not applicable to flow-control devices
    with concentric axes. This document does not include requirements for side-pocket
    mandrels, running, pulling, kick-over tools, or latches. Reconditioning of used
    flow-control devices is outside the scope of this document. This document supplements
    API Spec 19G2, 2nd edition (2020), the requirements of which are applicable with
    the exceptions specified in this document.
