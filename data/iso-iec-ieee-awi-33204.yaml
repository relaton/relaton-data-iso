abstract:
- language: en
  script: Latn
  content: DevOps Maturity Model defines the DevOps Practice wise Maturity levels.
    The Maturity Model Framework is aligned to meet the objectives of the principles.
    The model is structured around the practices of Continuous Planning, Configuration
    Management, Continuous Integration, Continuous Testing, Continuous Delivery, Continuous
    Deployment, Continuous Monitoring and Continuous Experimentation. The model also
    includes a set of key success factors which help a team to accelerate the implementation
    of these practices towards achieving the maturity goals. This will also include
    guardrails which are the rules or practices for development to deployment and
    constraints e.g. security, system driven enablers for automation and analytics
    at different maturity levels. DevOps Maturity Model will be used by organizations
    to self-assess, plan and monitor their improvement journey towards higher DevOps
    maturity.
