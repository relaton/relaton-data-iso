abstract:
- language: en
  script: Latn
  content: This document provides guidance for organizations to address privacy risks
    in artificial intelligence (AI) systems and machine learning (ML) models. The
    guidance in this document helps organizations identify privacy risks throughout
    the AI system lifecycle, and establishes mechanisms to evaluate the consequences
    of and treat such risks. This document is applicable to all types and sizes of
    organizations, including public and private companies, government entities, and
    not-for-profit organizations that develop or use AI systems.
