abstract:
- language: en
  script: Latn
  content: 'ISO/IEC TS 20027:2015 is to give guidelines to follow during the acquisition
    process of slap tenprints in order to obtain fingerprints with the best quality
    possible within acceptable time constraints. Non-cooperative users are out of
    the scope of this Technical Specification. When using ten-fingerprint sensors,
    it is fundamental to know how to use them and how to proceed during the acquisition.
    This Technical Specification describes how to capture fingerprints correctly by
    specifying best practices for slap tenprint captures. It gives guidance on the
    following topics: 1) recommendations on the hardware of the fingerprint sensor
    and its deployment; 2) recommendations on user guidance; 3) recommendations on
    the enrolment process including a sample workflow; 4) recommendations for developers
    and system integrators on application software; 5) recommendations on processing,
    compression and coding of the acquired fingerprint images; 6) recommendations
    on operational issues and data logging; 7) recommendations on the evaluation of
    a solution and its components. Although this Technical Specification primarily
    focuses on reaching optimal data quality for enrolment purposes, the recommendations
    given here are applicable for other purposes. All processes which rely on good
    quality tenprint slaps can take advantage of the best practices reported here.'
