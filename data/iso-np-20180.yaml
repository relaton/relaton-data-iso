abstract:
- language: en
  script: Latn
  content: This standard is intended to provide guidelines for product quality data
    interchange based on product risk assessment for consumer product safety in E-commerce.
    This standard identifies major risk factors for consumer product safety in E-commerce
    and describes types of product quality data to be interchanged based on it. This
    document also describes the generic process for product quality data interchange
    among E-commerce stakeholders.
