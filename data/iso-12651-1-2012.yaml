abstract:
- language: en
  script: Latn
  content: ISO 12651-1:2012 defines terms and concepts relevant to electronic document
    management. It is intended to facilitate communication in the field of electronic
    document management and translation of the terms it contains into other languages.
    The term "electronic document management" used throughout ISO 12651-1:2012 is
    intended as an all-encompassing term referring to inputting technologies, management
    technologies and storage technologies.
