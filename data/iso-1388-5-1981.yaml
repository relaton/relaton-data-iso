abstract:
- language: en
  script: Latn
  content: The method is applicable to products having aldehyde contents in the range
    0.00025 % (m/m) to 0.00125 % (m/m). The principle is based on the reaction of
    the aldehydes present in a test portion with Schiff reagent. Visual comparison
    of the colour obtained with the colours of standard colorimetric solutions containing
    known quantities of acetaldehyde. - International Standards ISO 1388/1 to ISO
    1377/12 cancel and replace ISO Recommendation R 1388-1970 of which they constitute
    a technical revision.
