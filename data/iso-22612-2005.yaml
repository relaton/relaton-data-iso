- language: en
  script: Latn
  content: ISO 22612:2005 specifies a test method for assessing the resistance to
    penetration through barrier materials of bacteria-carrying particles. Due to its
    complexity, this ISO 22612:2005 cannot be considered as a useful method for routine
    quality control but may suit the needs when a material is assessed for compliance
    with the requirements of current regulations such as EU Directive 93/42/EEC.
