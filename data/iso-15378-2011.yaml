abstract:
- language: en
  script: Latn
  content: ISO 15378:2011 specifies requirements for a quality management system where
    an organization needs to demonstrate its ability to provide primary packaging
    materials for medicinal products, which consistently meet customer requirements,
    including regulatory requirements and International Standards applicable to primary
    packaging materials. ISO 15378:2011 is an application standard for the design,
    manufacture and supply of primary packaging materials for medicinal products.
    It is also applicable for certification purposes.
