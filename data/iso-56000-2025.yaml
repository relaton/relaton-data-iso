abstract:
- language: en
  script: Latn
  content: 'This document defines terms for and establishes the fundamental concepts
    and principles of innovation management. This document is applicable to: a)      
    all types of organizations, regardless of type, sector, maturity-level or size;
    b)       all types of innovations (e.g. product, service, process, model, method);
    c)        all forms of innovation (e.g. incremental to radical, disruptive); d)      
    all types of approaches (e.g. internal and open innovation, user-, market-, design-
    and technology-driven innovation activities).'
