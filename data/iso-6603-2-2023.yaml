abstract:
- language: en
  script: Latn
  content: 'This document specifies a test method for the determination of puncture
    impact properties of rigid plastics, in the form of flat specimens, using instruments
    for measuring force and deflection. It is applicable if a force-deflection or
    force-time diagram, recorded at nominal constant striker velocity, is necessary
    for detailed characterization of the impact behaviour. The test method is applicable
    to specimens with a thickness between 1 mm to 4 mm. The method is suitable for
    use with the following types of material: —    rigid thermoplastic moulding and
    extrusion materials, including filled, unfilled and reinforced compounds and sheets;
    —    rigid thermosetting moulding and extrusion materials, including filled and
    reinforced compounds, sheets and laminates; —    fibre-reinforced thermoset and
    thermoplastic composites incorporating unidirectional or multi-directional reinforcements
    such as mats, woven fabrics, woven rovings, chopped strands, combination and hybrid
    reinforcements, rovings, milled fibres and sheets made from pre-impregnated materials
    (prepregs). The method is also applicable to specimens which are either moulded
    or machined from finished products, laminates and extruded or cast sheet. The
    test results are comparable only if the conditions of preparation of the specimens,
    their dimensions and surfaces as well as the test conditions are the same. In
    particular, results determined on specimens of different thickness cannot be compared
    with one another (see Annex E). Comprehensive evaluation of the reaction to impact
    stress can be obtained by determinations made as a function of impact velocity
    and temperature for different material variables, such as crystallinity and moisture
    content. The impact behaviour of finished products cannot be predicted directly
    from this test, but specimens may be taken from finished products (see above)
    for tests by this method. Test data developed by this method is not intended to
    be used for design calculations. However, information on the typical behaviour
    of the material can be obtained by testing at different temperatures and impact
    velocities (see Annex D) by varying the thickness (see Annex E) and by testing
    specimens prepared under different conditions. It is not the purpose of this document
    to give an interpretation of the mechanism occurring on every particular point
    of the force-deflection diagram. These interpretations are a task for scientific
    research.'
