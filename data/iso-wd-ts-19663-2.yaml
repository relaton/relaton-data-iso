abstract:
- language: en
  script: Latn
  content: This document describes the use of dispersed particles (including on purpose
    added small amounts of tracer particles) to determine rheological properties of
    dispersed phase, continuous phase or suspensions and emulsions to assess theirs
    rheological behaviour. The main measurand is the terminal sedimentation velocity
    of particles that can be determined by gravitational photosedimentation and X-ray
    sedimentation techniques as well as by analytical centrifugation of high multiples
    of gravity acceleration . This document does not cover alternative techniques
    nor provide a clarification of particle size analysis nor microrheology. Sedimentation
    techniques such as differential centrifugal liquid sedimentation, balance-based,
    or pipette-based sedimentation techniques are not covered by the scope of this
    Technical Specification. NOTE This document does not purport to address all the
    safety problems associated with its use.
