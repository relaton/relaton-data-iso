abstract:
- language: en
  script: Latn
  content: This document specifies requirements for establishing, implementing and
    maintaining prerequisite programmes (PRPs) for transport and storage in the food
    chain to assist in controlling food safety hazards. This document is applicable
    to all organizations, regardless of size or complexity, that are involved in transport
    and storage activities across the food supply chain and that wish to implement
    PRPs in such a way as to address the requirements specified in ISO 22000. This
    document is neither designed nor intended for use in other parts of the food supply
    chain or in isolation. In this document, transport and storage is aligned with
    ISO/TS 22003:2013, Annex A, Category G. This document includes all food and feed
    products and food packaging and packaging materials. Live animals are excluded
    from the scope of this document except when intended for direct consumption, e.g.
    molluscs, crustaceans and live fish.
