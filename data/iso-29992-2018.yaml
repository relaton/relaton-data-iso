abstract:
- language: en
  script: Latn
  content: This document provides guidance on the planning, development, implementation
    and review of assessments of the outcomes [knowledge, competence, performance]
    of learning services. It is intended for use by organizations providing learning
    services and organizations selecting, using or developing assessments. This document
    is applicable to the development and use of assessments for the measurement of
    individual learners' outcomes and the use of assessments for determinations of
    learner progress. The document does not apply to the direct evaluation of programs
    of instruction or the evaluation of learning service providers. It also excludes
    the technology requirements for the delivery of assessments.
