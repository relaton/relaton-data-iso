abstract:
- language: en
  script: Latn
  content: ISO 13944:2012 specifies a method for the determination of the lubricant
    content of a powder mix. The method is also suitable for preparing samples for
    measuring the content of elements, e.g. graphite and oxygen, the determination
    of which is interfered with by the presence of a lubricant. A condition of the
    application of the method is that a suitable solvent for the lubricant concerned
    is known and available.
