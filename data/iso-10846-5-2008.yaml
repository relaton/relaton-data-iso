abstract:
- language: en
  script: Latn
  content: ISO 10846-5:2008 specifies a driving point method for determining the low-frequency
    transfer stiffness for translations of resilient supports, under a specified preload.
    The method concerns the laboratory measurement of vibrations and forces on the
    input side with the output side blocked, and is called the “driving point method”.
    The stiffness resulting from measuring the input displacement (velocity, acceleration)
    and input force is the dynamic driving point stiffness. Only at low frequencies,
    where the driving point stiffness and the transfer stiffness are equal, can this
    method be used for determination of the dynamic transfer stiffness. The method
    is applicable to test elements with parallel flanges.
