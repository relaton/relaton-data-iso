abstract:
- language: en
  script: Latn
  content: ISO 16000-25:2011 specifies a test method for determination of the area
    specific emission rate of semi-volatile organic compounds (SVOCs) from newly produced
    building products or furnishings under defined climate conditions using a micro-chamber.
    The method can in principle also be applied to aged products. This measurement
    method is applicable to products and materials, such as board materials, wallpapers,
    flooring materials, insulation materials, adhesives, paints, and their combinations.
    Sampling, transport and storage of materials to be tested, and preparation of
    test specimens are specified in ISO 16000-11. Air sampling and analytical methods
    for the determination of SVOCs are specified in ISO 16000-6 and ISO 16017-1. An
    example of a micro-chamber is described in an annex.
