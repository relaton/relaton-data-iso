abstract:
- language: en
  script: Latn
  content: ISO 16872:2014 specifies the requirements for fine-tolerance hoist chains
    of grade VH for use as load chains in hand operated chain hoists for lifting purposes.
    They are round steel short link chains, electrically welded, heat treated, and
    tested; they comply with the general conditions of acceptance of ISO 1834. NOTE
    1 The letter "V" expresses the grade in accordance with ISO 1834. NOTE 2 The letter
    "H" expresses that these hoist chains are for hand operated hoists only. NOTE
    3 Resistance butt welding and flash welding are listed in ISO 4063. The range
    of nominal sizes covered by this International Standard is from 3 mm to 13 mm.
    Fine-tolerance hoist chains, according to this International Standard, are for
    use in the temperature range −10 °C to 150 °C.
