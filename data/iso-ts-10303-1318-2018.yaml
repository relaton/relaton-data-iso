- language: en
  script: Latn
  content: 'ISO/TS 10303-1318:2018-11 specifies the application module for Procedural
    solid model. The following are within the scope of ISO/TS 10303-1318:2018-11:
    3D geometry; 3D solid models; procedural solid models defined by their construction
    history; sequence of shape modification operations; modified solid models resulting
    from the application of local shape operations; items within the scope of application
