abstract:
- language: en
  script: Latn
  content: 'ISO/IEC TR 11801:2014(E) covers the following channel descriptions constructed
    from components with a nominal impedance of 100: - Class I: 30 m channel based
    on upcoming Category 8.1 components. This channel provides increased margin compared
    to ISO/IEC 11801, Class EA channels, and an upper frequency limit of 1 600 MHz
    (2 000 MHz (ffs); - Class II: 30 m channel based on upcoming Category 8.2 components.
    This channel provides increased margin compared to ISO/IEC 11801, Class FA channels,
    and an upper frequency limit of 1 600 MHz (2 000 MHz ffs); - Channels based on
    Category 6A components of ISO/IEC 11801, length corrected to 30 m; - Channels
    based on Category 7A components of ISO/IEC 11801, length corrected to 30 m; -
    Channels based on Category 6A components of ISO/IEC 11801, length corrected to
    30 m, characterized beyond the current upper frequency; - Channels based on Category
    7A components of ISO/IEC 11801, length corrected to 30 m, characterized beyond
    the current upper frequency.'
