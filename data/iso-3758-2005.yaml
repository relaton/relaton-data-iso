abstract:
- language: en
  script: Latn
  content: 'ISO 3758:2005 establishes a system of graphic symbols, intended for use
    in the marking of textile articles, providing information to prevent irreversible
    damage to the article during the textile care process;specifies the use of these
    symbols in care labelling. The following domestic treatments are covered: washing,
    bleaching, drying, ironing, and drying after washing. Professional textile care
    treatments in dry and wet cleaning, but excluding industrial laundering, are also
    covered. However, it is recognized that information imparted by the four domestic
    symbols will also be of assistance to the professional cleaner and launderer.
    The standard applies to all textile articles in the form in which they are supplied
    to the end user.'
