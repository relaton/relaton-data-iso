abstract:
- language: en
  script: Latn
  content: This document specifies the methodology for evaluating the energy performance
    of lighting systems for providing general illumination inside non-residential
    buildings and for calculating or measuring the amount of energy required or used
    for lighting inside buildings. This document does not cover lighting requirements,
    the design of lighting systems, the planning of lighting installations, the characteristics
    of lighting equipment (lamps, control gear and luminaires) and systems used for
    display lighting, desk lighting or luminaires built into furniture. This document
    does not provide any procedure for the dynamic simulation of lighting scene setting.
