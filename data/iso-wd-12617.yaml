abstract:
- language: en
  script: Latn
  content: ISO 12617:2015 specifies liquefied natural gas (LNG) refuelling nozzles
    and receptacles constructed entirely of new and unused parts and materials for
    road vehicles powered by LNG. An LNG refuelling connector consists of, as applicable,
    the receptacle and its protective cap (mounted on the vehicle) and the nozzle.
    This International standard is applicable only to such devices designed for a
    maximum working pressure of 3,4 MPa (34 bar) to those using LNG as vehicle fuel
    and having standardized mating components. NOTE All references to pressures given
    in megapascals and bar (1 bar = 0,1 MPa = 105 Pa; 1 MPa = 1 N/mm2) are to be considered
    gauge pressures, unless otherwise specified.
