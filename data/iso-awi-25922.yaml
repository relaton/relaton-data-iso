abstract:
- language: en
  script: Latn
  content: The proposed standard specifies a method for describing the capabilities
    and responsibilities of a MASS and its human operators. This is based on certain
    assumptions for the functionality of automation systems and organization of the
    operators. The main assumptions are that for automation, it needs to have a deterministic
    performance and can be trusted to control ship functions without human supervision,
    under specified constraints. For operators, they need to be alerted to take over
    control sufficiently early enough to regain situational awareness before actions
    are required. The organization of the operators must also provide a deterministic
    worst case response time for the operator from being alerted to be able to safely
    take actions. Given these assumptions, this document provides guidance on how
    the specifications can be created effectively and in a standardized way. The reason
    for using standards in system descriptions is for ease of understanding between
    the different parties to MASS operations, system operator, ship owner, system
    designer, authorities and class societies.
