abstract:
- language: en
  script: Latn
  content: This International Standard specifies test methods for components and assemblies
    of hip disarticulation prostheses which are arranged at hip and thigh level. It
    does not apply to other components of lower limb prostheses for which test methods
    are given in ISO 10328. This International Standard specifies procedures for simplified
    static and cyclic strength tests in which the anteroposterior (A-P) and medio-lateral
    (M-L) components of loading are produced in separate tests by the application
    of test forces in two different test planes. The components of loading produced
    in the test sample relate to the peak values of the components of loading which
    normally occur at different instants during the stance phase of walking.
