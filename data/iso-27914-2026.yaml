abstract:
- language: en
  script: Latn
  content: 'This document: establishes requirements for the geological storage of
    CO2 streams in a way that minimizes risk of CO2 losses; is applicable for both
    onshore and offshore geological storage within permeable and porous geological
    strata including hydrocarbon reservoirs where a CO2 stream is not being injected
    for the purpose of enhancing hydrocarbon production; includes activities associated
    with site screening and feasibility investigation, characterization, design and
    development, operation of storage projects, and preparation for project termination;
    recognizes that the geological characteristics, physical boundaries, management,
    intrinsic technical risk and uncertainties, of each site are likely to be unique
    for each project and that intrinsic technical risk and uncertainty will be dealt
    with on a site-specific basis;  provides requirements for integrated project management,
    including elements of risk management unique to the geological storage of CO2
    streams; and establishes a methodology for quantifying the net mass of CO2 that
    geological storage projects store in storage unit(s). Figure 1 illustrates the
    limits of this document. This document does not apply to: temporary storage in
    tanks or by other means; the post-termination phase; injection of CO2 for enhancing
    production of hydrocarbons or for storage associated with CO2-EOR; disposal of
    other acid gases except as considered part of the CO2 stream; disposal of waste
    and other matter added for purpose of disposal; or underground storage using any
    form of buried container. If production of hydrocarbons in commercial quantities
    occurs from the storage unit(s), the storage project is outside of the scope of
    this document and ISO 27916 applies to CO2 storage. A CO2-EOR project that has
    stored CO2 in association with CO2-EOR can transition to operate under this document
    after all production of hydrocarbons from the storage unit(s) has ceased.'
