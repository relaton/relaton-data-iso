abstract:
- language: en
  script: Latn
  content: This document specifies methods and formulae for evaluating the risk of
    scuffing, based on Blok's contact temperature concept. The fundamental concept
    is applicable to all machine elements with moving contact zones. The flash temperature
    formulae are valid for a band-shaped or approximately band-shaped Hertzian contact
    zone and working conditions characterized by sufficiently high Péclet numbers.
