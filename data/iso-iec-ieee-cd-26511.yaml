abstract:
- language: en
  script: Latn
  content: 'This International Standard provides requirements for information-development
    managers. The standard applies to managing information for users of systems, software,
    and services. The requirements provide for the development of a comprehensive
    content strategy for the development and dissemination of information for users.
    The requirements define the activities for planning and controlling information
    development and dissemination and for monitoring information effectiveness and
    customer satisfaction. The standard also includes requirements for the planning
    for the management of information through its life cycle. The main changes are
    as follows: • Additions of the role of management in the use of Artificial Intelligence,
    particularly to facilitate translation. • Updating of the roles and processes
    of management in information-development projects. • Editorial changes. Note:
    Review 15288 for the information management pieces of the systems and software
    management standard.'
