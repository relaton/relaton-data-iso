abstract:
- language: en
  script: Latn
  content: 'This document specifies a test method for determining the bulk electrical conductivity and volume resistivity of compressed rCF specimens prepared from milled recycled carbon fibres (rCF) using a four-probe powder resistivity measurement system. This document also provides procedures for determining appropriate sample preparation conditions, including sample amount and thermal pretreatment, for recycled carbon fibre products. This document specifies: a) the apparatus required for preparing compressed rCF specimens; b) procedures for determining appropriate sample preparation conditions, including sample amount, thermal pretreatment and specimen preparation; c) the measurement procedure for determining electrical conductivity and volume resistivity; and d) the calculation and reporting of the test results.'
