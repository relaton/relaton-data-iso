abstract:
- language: en
  script: Latn
  content: This document specifies the design of earthquake-resistant and subsidence-resistant
    ductile iron pipelines suitable for use in areas where seismic activity and land
    subsidence can be expected. It provides a means of determining and checking the
    resistance of buried pipelines and gives example calculations. It is applicable
    to ductile iron pipes and fittings with joints as specified in ISO 2531, ISO 7186
    and ISO 16631 that have expansion/contraction and deflection capabilities, used
    in pipelines buried underground. NOTE Subsidence is not the effects of an earthquake
    or a sinkhole.
