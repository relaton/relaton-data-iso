abstract:
- language: en
  script: Latn
  content: This document specifies methods for the determination of the modulus in
    shear and the strength of bonds of rubber to metal or other rigid plates, using
    rubber bonded between four parallel plates. Method A describes the determination
    of the modulus in shear. Method B describes the determination of the strength
    of the bonds. The methods are applicable primarily to test pieces prepared in
    the laboratory under standard conditions, such can be used to provide data for
    the development and control of rubber compounds and methods of manufacture of
    bonded shear units.
