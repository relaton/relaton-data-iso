abstract:
- language: en
  script: Latn
  content: This document defines the principal terms used to describe the various
    forms into which textile fibres can be assembled, up to and including cabled yarns.
    It contains only terms of general application. Terms and definitions which are
    specific to particular fibres (such as hemp, silk, textile glass fibre, metal
    fibre, carbon fibre, etc.) are excluded. A morphological scheme as shown in Annex A
    is included which illustrates the relationship among various terms from a production
    point of view. This document does not include terms which describe the manufacturing
    or processing methods, or terms used to quantify fibre and yarn properties.
