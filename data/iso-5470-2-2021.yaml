abstract:
- language: en
  script: Latn
  content: This document specifies two separate methods for determining the resistance
    of a material to wet and dry abrasion. It is applicable to the coated surface
    or surfaces of coated fabrics. It does not apply to determining the abrasion behaviour
    of an uncoated surface of a coated fabric, for which the methods for uncoated
    textiles described in the ISO 12947 series apply.
