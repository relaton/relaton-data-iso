- language: en
  script: Latn
  content: ISO 2085:2010 specifies a method for checking the continuity of thin anodic
    oxidation coatings on aluminium and its alloys by a copper sulfate contact test.
    The use of this method is limited to anodic oxidation coatings of thickness less
    than 5 μm, or coatings that have been deformed.
