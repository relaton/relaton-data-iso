abstract:
- language: en
  script: Latn
  content: 'The proposed standard will encompass the inspection and maintenance of
    underground mine structures, including; • mine shafts and, • associated underground
    mine installations. (it is not intended that this standard be applied to surface
    structures such as the headframe). It is intended to provide practical guidelines
    to assist plant maintenance personnel with the following in respect of the mine
    structures: i. What should be inspected and monitored? ii. How should inspection
    and monitoring be accomplished? iii. At what intervals should inspections and
    monitoring be done? iv. What should be recorded and when? v. What should be expected
    in an inspection report? vi. What follow-up is required? It is not intended that
    the proposed standard be used for certification purposes. No guidance is provided
    for the design or construction of plant structures. In addition, it is not intended
    to provide guidance as for pressure vessel or similar systems.'
