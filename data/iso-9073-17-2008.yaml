abstract:
- language: en
  script: Latn
  content: ISO 9073-17:2008 specifies a method for measuring the resistance of fabrics
    to the penetration of water by impact. The water penetration (spray impact) test
    is applicable to fabrics that are expected to exhibit a degree of water resistance
    or water repellency. The results obtained with this method depend on the water
    repellency of the fibres or the treatment applied to the finished material, as
    well as on the construction of the material.
