abstract:
- language: en
  script: Latn
  content: ISO/TR 16806:2003 describes how to calculate the loading limits for a pneumatic
    slide based upon external forces applied in the three principle planes of a tool
    plate, and applied at any point; external torque applied in the three principle
    planes of a tool plate; and bearing limits determined by the slide manufacturer
    in conjunction with the bearing supplier. It also describes how to calculate tool
    plate deflections due to the loads. ISO/TR 16806:2003 describes how to present
    the rating information in technical documentation for application by a user.
