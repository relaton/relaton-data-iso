abstract:
- language: en
  script: Latn
  content: ISO 26431-1:2008 specifies the absolute luminance level, white point chromaticity
    and luminance uniformity of the reflected screen light for the presentation of
    motion pictures by projectors with digital light engines in review rooms and commercial
    cinemas. It is the purpose of ISO 26431-1:2008 to achieve the tone scale and contrast
    in the projected image that will correspond to that intended during the mastering
    process.
