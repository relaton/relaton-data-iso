abstract:
- language: en
  script: Latn
  content: This document provides specifications of a communication interface (CI)
    named "ITS-M5". The name "ITS-M5" indicates microwave frequency bands in the range
    of 5 GHz. ITS-M5 CIs are based on the wireless LAN technology standardized at
    IEEE. This document specifies the additions to and deviations from IEEE Std 802.11?-2016
    required to make ITS-M5 CIs compatible with the ITS station and communication
    architecture specified in ISO 21217.
