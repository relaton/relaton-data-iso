abstract:
- language: en
  script: Latn
  content: ISO 8362-1:2009 specifies the form, dimensions and capacities of glass
    vials for injectable preparations. It also specifies the material from which such
    containers shall be made and the performance requirements of those containers.
    ISO 8362-1:2009 applies to colourless or amber glass containers made from borosilicate
    or soda-lime glass, made from glass tubing, whether internally surface-treated
    or not, and intended to be used in the packaging, storage or transportation of
    products intended for injection.
