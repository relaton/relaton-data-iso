abstract:
- language: en
  script: Latn
  content: ISO 3271:2007 specifies a method to provide a relative measure for evaluating
    the resistance of iron ores to size degradation by impact and abrasion. It covers
    the determination of the tumble and abrasion indices. ISO 3271:2007 is applicable
    to lump ores, sinters and hot-bonded pellets.
