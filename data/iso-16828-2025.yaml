abstract:
- language: en
  script: Latn
  content: 'This document specifies the general principles for the application of
    the time-of-flight diffraction (TOFD) technique for both detection and sizing
    of discontinuities in low-alloyed carbon steel components. This document also
    applies to other types of materials, provided the application of the TOFD technique
    is performed with necessary consideration of geometry, acoustical properties of
    the materials, and the test sensitivity. Although this document is applicable,
    in general terms, for discontinuities in materials and applications covered by
    ISO 16810, it contains references to the application on welds. This approach has
    been chosen for reasons of clarity as to the probe positions and directions of
    scanning. Unless otherwise specified in the referencing documents, the minimum
    requirements specified in this document apply. Unless explicitly stated otherwise,
    this document is applicable to the following categories of test objects as specified
    in ISO 16811: —     category 1, without restrictions; —     categories 2 and 3,
    specified restrictions apply (see Clause 10); —     categories 4 and 5 require
    special procedures, which are also addressed (see Clause 10). NOTE           
    Techniques for the use of TOFD for weld testing are described in ISO 10863 and
    the related acceptance criteria are given in ISO 15626.'
