abstract:
- language: en
  script: Latn
  content: This document describes a framework for human-machine teaming. This document
    provides concepts, terms and definitions applicable to describe the relationships
    between humans and machines in human-machine teaming, which refers to integration
    of human interaction with machine intelligence capabilities to enable problem
    solving and successful task completion. This document also describes a set of
    technical characteristics of human-machine teaming. This document provides a set
    of design principles for human-machine teaming. This document provides guidance
    based on ISO/IEC 5339 for developing and applying AI applications in human-machine
    teaming.
