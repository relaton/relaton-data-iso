abstract:
- language: en
  script: Latn
  content: This document specifies the evaluation of natural language processing systems,
    in the sense of measuring the quality of a system’s results to assess its functional
    suitability. It provides a definition of evaluation methods for those systems,
    together with guidance on how to select, implement and interpret those evaluation
    methods. This document covers quantitative metrics as well as other evaluation methods.
    It includes requirements on the implementation of the described metrics, and further requirements
    on the technical resources involved in the evaluation process.
