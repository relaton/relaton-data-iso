abstract:
- language: en
  script: Latn
  content: This document specifies a protocol to measure the low-light performance
    of a camera including the simulation of human hand-shake by using a camera shaker.
    It is applicable to the measurement of digital cameras including camera phones
    and other mobile devices. The performance aspects defined in this document are
    intended to all be tested. Picking one or some of them by the tester is out of
    scope of the usage of this document.
