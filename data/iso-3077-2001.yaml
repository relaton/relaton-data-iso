abstract:
- language: en
  script: Latn
  content: This International Standard specifies requirements for fine-tolerance hoist
    chain of Grade T (types T, DAT and DT) for use with manually operated or power-driven
    chain hoists1). It is applicable to electrically welded, round, steel short-link
    chain, heat-treated and tested in accordance with the general conditions of acceptance
    of ISO 1834, in the nominal chain size range from 3 mm to 22 mm. NOTE Type T chain,
    but not type DAT or DT, may be used in lifting equipment other than chain hoists.
    Chain of grades TH and VH, intended specifically for use in hand-operated hoists,
    will be the subject of future International Standards.
