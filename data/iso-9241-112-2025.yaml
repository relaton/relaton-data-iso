abstract:
- language: en
  script: Latn
  content: This document establishes ergonomic design principles for interactive systems
    related to the software-controlled presentation of information by user interfaces.
    It applies to the three main modalities (visual, auditory, tactile or haptic)
    typically used in information and communication technology (ICT). These principles
    apply to the perception and understanding of presented information. These principles
    are applicable in the analysis, design and evaluation of interactive systems.
    This document also provides recommendations corresponding to the principles. The
    recommendations for each of the principles are not exhaustive and are not necessarily
    independent from one another. While this document is applicable to all types of
    interactive systems, it does not cover the specifics of particular application
    domains which require context-specific recommendations. This document also applies
    to outputs from interactive systems (such as printed documents and document exports
    in common computer formats, e.g. pdf, text and tabular formats).
