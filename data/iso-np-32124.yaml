abstract:
- language: en
  script: Latn
  content: This document provides guidance for e-stores and e-shops, particularly
    small and medium-sized enterprises (SMEs) seeking to rapidly adopt live commerce,
    on implementing live commerce to enhance online sales, with a focus on ensuring
    secure and streamlined transaction processes. This document includes requirements
    for the setup, operation, management, and quality assurance of live commerce-related
    activities, ensuring alignment with framework provided in ISO 32111. This document
    serves as a reference for all key stakeholders involved in live commerce, including
    influencers, operators of e-stores and e-shops, support teams, product suppliers,
    and communication providers, who collaborate to promote products through livestream
    sales initiatives.
