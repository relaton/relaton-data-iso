abstract:
- language: en
  script: Latn
  content: This document specifies a non-waxed edge method for the determination of
    the edgewise crush resistance of corrugated fibreboard. The force is applied in
    the direction of the flute axis. This method is applicable to single-wall (double-faced),
    double-wall, and triple-wall corrugated fibreboard. It is applicable to all corrugated
    fibreboard flute types if no buckling and/or tipping occurs during measurement.
    This method is also applicable to test samples taken from corrugated cases and
    other converted products.
