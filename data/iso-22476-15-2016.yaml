abstract:
- language: en
  script: Latn
  content: ISO 22476-15:2016 specifies the technical principles for measuring equipment
    requirements, the execution and reporting on the parameters of the investigation
    drilling process for geotechnical purposes. It is applicable to top-driven, destructive
    drilling methods performed by a fully hydraulically powered drill rig and driving
    device. It is commonly used with destructive drilling techniques but can also
    be used with core drilling. The recording of the drilling parameters during soil
    grouting, drilling of nails, anchors or piles are beyond the scope of ISO 22476-15:2016.
