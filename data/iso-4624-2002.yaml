abstract:
- language: en
  script: Latn
  content: This International Standard describes methods for determining the adhesion
    by carrying out a pull-off test on a single coating or a multi-coat system of
    paint, varnish or related product. These test methods have been found useful in
    comparing the adhesion behaviour of different coatings. It is most useful in providing
    relative ratings for a series of coated panels exhibiting significant differences
    in adhesion. The test may be applied using a wide range of substrates. Different
    procedures are given according to whether the substrate is deformable, for example
    thin metal, plastics and wood, or rigid, for example thick concrete and metal
    plates. For special purposes, the coating may be applied directly to the face
    of a test dolly.
