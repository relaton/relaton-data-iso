abstract:
- language: en
  script: Latn
  content: 'This document specifies the types of functions and components of a tapping
    point, necessary to ensure a practical, safe and efficient use of equipment for
    welding, cutting and allied processes connected to a gas pipeline system. This
    document specifies requirements for tapping point to be connected to industrial
    gas distribution pipelines of: ― compressed gases and carbon dioxide up to 6 MPa
    (60 bar); ― acetylene up to 0,15 MPa (1,5 bar); ― liquefied petroleum gases (LPG);
    ― methylacetylene-propadiene mixtures (MPS); for use in welding, cutting and allied
    processes. This document does not cover stand-alone line pressure regulators covered
    by ISO 22073-1. NOTE Where there is no risk of ambiguity, both line pressure regulators
    and line pressure regulators with flowmetering devices are addressed with the
    collective term ‘pressure regulators’.'
