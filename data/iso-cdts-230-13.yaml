abstract:
- language: en
  script: Latn
  content: 'This document provides information and guidelines related to the determination
    of the measuring performance of machine tools used as Coordinate Measuring Machines
    (CMMs). It includes consideration of different use cases, guidance on the selection
    of suitable test methods, information about the application of the test methods,
    and the environmental and metrological conditions. This document addresses machine
    tools with at least two orthogonal linear axes using only contacting probing systems
    of any type operating in the discrete-point probing mode for measuring movements
    only with linear axes. This document does not explicitly address: ─ parallel kinematic
    machine tools ─ machine tools using probing systems used in scanning mode or non-contacting
    probing systems.'
