abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the laboratory testing of
    the volume resistivity of specially prepared test pieces of vulcanized or thermoplastic
    rubber compounds rendered conducting or dissipative by the inclusion of carbon
    black or ionizable materials. The tests are suitable for materials with a resistivity
    of less than about 108 Ω⋅m. Method 1 is the preferred method when test pieces
    with bonded electrodes are not available. Method 2 is the preferred method when
    test pieces are moulded with the inclusion of bonded electrodes. Method 3 is another
    method that can be used if the apparatus for method 1 or 2 is not available, but
    it has lower accuracy. If a reference to this document is made without specifying
    the method, method 1 is used.
