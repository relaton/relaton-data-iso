abstract:
- language: en
  script: Latn
  content: The scope of proposed standard is to suggest safety guidelines for engine
    rooms of ammonia fuelled vessels, excluding the fuel containment system, and fuel
    consumers related to ammonia fuel systems for ships in accordance with “Guidelines
    for ships using ammonia as fuel” developed by the Carriage of Cargoes and Containers
    (CCC), which is a Sub-Committee of the International Maritime Organization (IMO).
    This standard focuses on application to ammonia-fuelled ships, but not ammonia
    carrier ships.
