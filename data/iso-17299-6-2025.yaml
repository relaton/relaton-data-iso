abstract:
- language: en
  script: Latn
  content: This document specifies gas chromatography (GC) test methods for the deodorant
    testing of all textile products. These methods apply to odour component chemicals,
    such as indole, isovaleric acid and nonenal. Two methods are described in this
    document. —    Method A (single analysis) where an odour chemical is applied in
    a container avoiding contact with a test specimen. —    Method B (auto-regeneration)
    where an odour chemical is applied in a container avoiding contact with a test
    specimen multiple times to repeatedly challenge a test specimen.
