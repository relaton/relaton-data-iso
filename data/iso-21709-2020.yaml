abstract:
- language: en
  script: Latn
  content: This document specifies process and quality requirements for the biobanking
    of mammalian (including human) cell lines. It describes requirements for the fundamental
    procedures of the biobank handling cell lines, such as establishment, reception,
    identification, propagation, preservation, storage, quality control, and distribution
    of cell lines. This document can be used by organizations performing biobanking
    activities with mammalian cell lines used for research and development, biobank
    users, organizations and schemes using peer-assessment and accreditation bodies.
    This document does not apply to biological material intended for therapeutic use.
    NOTE International, national or regional regulations or requirements can also
    apply to specific topics covered in this document.
