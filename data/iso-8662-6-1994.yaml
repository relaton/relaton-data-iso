abstract:
- language: en
  script: Latn
  content: Specifies a laboratory method of measuring the vibrations occurring at
    the handles of hand-held power driven impact drills. It is a type test procedure
    for establishing the magnitude of vibrations at the handles of impact drills operating
    under a specified load. It is intended that the results can be used to compare
    different power tools or different models of the same type of power tool.
