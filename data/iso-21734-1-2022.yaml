abstract:
- language: en
  script: Latn
  content: 'This document specifies the general framework and the automated driving
    bus (ADB) system components for operating ADBs in public transport networks, including:
    a) the general framework and the operation scheme for public transport systems
    in cooperation with ADBs; b) definitions of system components for operating ADBs;
    and c) definitions of functions and requirements of each system component for
    providing transport services with ADBs. This document is applicable to bodies
    in public transport systems and services including transportation operators, public
    transport governing authorities and relevant industries.'
