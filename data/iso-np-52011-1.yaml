abstract:
- language: en
  script: Latn
  content: 'This standard will provide a calculation method for the economic issues
    related to the building envelope and technical building systems that are influencing
    the energy demand and energy consumption of the building. This standard applies
    to all types of buildings. The fundamental principles and terminology will be
    explained in the standard. The main items of the standard are: - definitions and
    structure of the types of costs, which shall be considered for the calculation
    of the economic efficiency of saving options in buildings, - data needed for the
    definition of costs related to systems under consideration, - expression of the
    result of the economic calculation, - informative annexes indicating default values
    of e.g., lifetime, costs for repair, costs for maintenance, in order to introduce
    default values for calculations. This standard is applicable to the calculation
    of the economic performance of energy saving and efficiency options in buildings
    (e.g., insulation, better performing generators and distribution systems, efficient
    lighting, renewable sources, combined heat and power).'
