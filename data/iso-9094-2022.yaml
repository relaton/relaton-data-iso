abstract:
- language: en
  script: Latn
  content: 'This document defines a practical degree of fire prevention and protection
    intended to provide enough time for occupants to escape a fire on board small
    craft. It applies to small craft having a length of the hull (LH) of up to 24 m
    except for personal watercraft. This document does not cover: —    the design
    and installation of permanently installed galley stoves and heating appliances
    (including components used to distribute the heat) using fuels that are liquid
    at atmospheric pressure on small craft, which are covered by ISO 14895:2016; —   
    carbon monoxide detecting systems, which are covered by ISO 12133.'
