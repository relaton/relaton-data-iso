abstract:
- language: en
  script: Latn
  content: This International Standard specifies a guide for the selective quantitative
    analysis by immunoassays of environmental chemicals such as pesticides (including
    insecticides) or their metabolites in drinking, ground and surface water. The
    application range of the procedure for the analysis of pesticides in drinking
    water applies to mass concentrations W 0,05 _g/l. Therefore, the determination
    limit should be in this case u 0,05 _g/l.
