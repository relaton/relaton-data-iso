abstract:
- language: en
  script: Latn
  content: This document defines technical criteria and control procedures which need
    to be satisfied by the constituent materials and the finished concrete sleepers
    and bearers, i.e. precast concrete sleepers, twin-block reinforced sleepers, bearers
    for switches and crossings, and special elements for railway tracks. This document
    defines mechanical tests which provide assurance of the capability of sleepers
    or bearers to resist repetitive loading and provide sufficient durability. In
    addition, it places controls on manufacturing processes and tests to ensure that
    the concrete will not suffer degradation in service through chemical reaction
    and frost damage.
