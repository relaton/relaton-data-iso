abstract:
- language: en
  script: Latn
  content: ISO 11223:2004 gives guidance on the selection, installation, commissioning,
    maintenance, validation and calibration of hydrostatic tank-gauging (HTG) systems
    for the direct measurement of static mass in petroleum storage tanks. It is intended
    to cover custody transfer applications, although details of other, less accurate,
    measurements are included for information. It also gives guidance on calculations
    of standard volume from measured mass and independently measured reference density.
    Information is also included on measurements of observed and standard volume using
    density measured by the HTG system itself. ISO 11223:2004 is applicable to hydrostatic
    tank-gauging systems which use pressure sensors with one port open to the atmosphere.
    It is applicable to the use of hydrostatic tank gauging on vertical, cylindrical,
    atmospheric storage tanks with either fixed or floating roofs. ISO 11223:2004
    is not applicable to the use of hydrostatic tank gauging on pressurized tanks.
