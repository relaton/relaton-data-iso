abstract:
- language: en
  script: Latn
  content: ISO 7700-1:2008 specifies a method of checking the performance of moisture
    meters in service for measuring the moisture content of cereal grains. ISO 7700-1:2008
    is not applicable for pattern approval, nor for the initial calibration of moisture
    meters. The results of the checking described in ISO 7700-1:2008 are used to decide
    whether to perform a revision or a repair of the moisture meter.
