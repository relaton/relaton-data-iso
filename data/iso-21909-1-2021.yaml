abstract:
- language: en
  script: Latn
  content: 'This document applies to all passive neutron detectors that can be used
    within a personal dosemeter in part or in all of the above-mentioned neutron energy
    range. No distinction between the different techniques available in the marketplace
    is made in the description of the tests. Only generic distinctions, for instance,
    as disposable or reusable dosemeters, are considered. This document describes
    type tests only. Type tests are made to assess the basic characteristics of the
    dosimetry systems and are often ensured by recognized national laboratories This
    document does not present performance tests for characterizing the degradation
    induced by the following: —    intrinsic temporal variability of the quality of
    the dosemeter supplied by the manufacturer; —    intrinsic temporal variability
    of preparation treatments (before irradiation and/or before reading), if existing;
    —    intrinsic temporal variability of reading process; —    degradation due to
    environmental effects on the preparation treatments, if existing; —    degradation
    due to environmental effects on the reading process. This document gives information
    for extremity dosimetry in the Annex C, based on recommendations given by ICRU
    Report 66. This document addresses only neutron personal monitoring and not criticality
    accident conditions. The links between this document and ISO 21909-2 are given
    in Annex A.'
