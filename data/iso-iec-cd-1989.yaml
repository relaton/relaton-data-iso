abstract:
- language: en
  script: Latn
  content: 'This document specifies the syntax and semantics of COBOL. Its purpose
    is to promote a high degree of machine independence to permit the use of COBOL
    on a variety of data processing systems. This document specifies: The form of
    a compilation group written in COBOL. The effect of compiling a compilation group.
     The effect of executing run units. The elements of the language for which a conforming
    implementation is required to supply  a definition. The elements of the language
    for which meaning is explicitly undefined. The elements of the language that are
    dependent on the capabilities of the processor. This document does not specify:
    The means whereby a compilation group written in COBOL is compiled into code executable
    by a processor. The time at which method, function, or program runtime modules
    are linked or bound to an activating statement, except that runtime binding occurs
    of necessity when the identification of the appropriate program or method is not
    known at compile time. The time at which parameterized classes and interfaces
    are expanded. The mechanism by which locales are defined and made available on
    a processor. The form or content of error, flagging, or warning messages. The
    form and content of listings produced during compilation, if any. The form of
    documentation produced by an implementor of products conforming to this document.
    The sharing of objects and resources other than files among run units.'
