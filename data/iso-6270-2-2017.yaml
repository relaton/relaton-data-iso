abstract:
- language: en
  script: Latn
  content: ISO 6270-2:2017 specifies the general conditions and procedures which need
    to be observed when testing coated test specimens in constant condensation-water
    atmospheres or in alternating condensation-water atmospheres, in order to ensure
    that the results of tests carried out in different laboratories are reproducible.
    NOTE The shape and preparation of the test specimens, the duration of the test
    and the assessment of the test results are not covered in this document.
