abstract:
- language: en
  script: Latn
  content: ISO/TS 15926-11:2015 defines a methodology for simplified industrial usage
    of reference data as defined in ISO/TS 15926-4 and is applicable to the plant
    life cycle phases in the process industry supply chain. The methodology is based
    on RDF triples, RDF Named Graphs and a standardized set of natural engineering
    language relationships resulting in a table that can be exchanged and shared easily
    in industry. ISO/TS 15926-11:2015 conforms to the ISO 15926-2 data model and is
    appropriate for use with ISO 15926 reference data libraries
