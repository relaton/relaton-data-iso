abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and associated test methods for assistive products for toileting, bathing and showering (from herein referred to as ‘assistive product’ within this document). NOTE 1              Some of the assistive products can be classified as medical devices. This document specifies safety, functional and ergonomic requirements for both persons with disability and assistants that apply during normal use and foreseeable misuse and failure. This document specifies requirements and test methods for assistive products within the following divisions of ISO 9999:2022. 09 12 03           Commode chairs; chairs, with or without castors, with a collection receptacle used for toileting away from the bathroom. 09 12 06           Toilets;1) included are, e.g. raised or height adjustable toilets, toilets with built-in douche and air dryers. 09 12 09           Toilet seats;1) devices attached to the toilet bowl or toilet chair for a person to sit on, which can provide stability and comfort. 09 12 10           Toilet splash guards;1) devices to keep bodily substances from splashing outside the toilet bowl. 09 12 12           Raised toilet seats, free-standing; raised toilet seats (separate) standing on floor, where the seat can easily be removed from the toilet bowl;included are, e.g. over toilet frames. 09 12 15           Raised toilet seats, detachable; raised toilet seats (loose attachments) placed directly on the toilet bowl/toilet seat where the seat insert can easily be removed from the toilet bowl/toilet seat. 09 12 18           Raised toilet seats fixed to toilet; devices permanently fixed on to a toilet bowl to increase the height of the seat and to facilitate sitting down upon, and standing up from, the toilet; included are, e.g. plinths. 09 12 21           Toilet seats with built-in raising mechanism to help standing up and sitting down; toilet seats that have a built-in lifting mechanism to assist a person to sit down on and get up from the toilet. 09 12 24           Toilet arm supports and toilet back supports mounted on toilet; devices mounted on the toilet that provide support getting on or off the toilet. 09 12 25           Toilet arm supports and toilet back supports, free standing. 09 12 36           Douches and air dryers for attachment to a toilet;1) devices attached to a toilet to provide a water spray with or without air blowing afterwards to wash, and possibly dry, a person’s bottom while sitting on the toilet; included are, e.g. toilet seats with that function. 09 33 04           Bath boards; seats without back support placed on the rim across the bathtub. 09 33 05           Bath seats; seats hung from the rim of or placed in the bathtub; included are e.g. bath seats with or without backrest. 09 33 07           Shower chairs with and without wheels; devices for supporting sitting during showering; included are, e.g. shower stools. 09 33 08           Back supports for bath or shower; excluded are, e.g. back support cushions. 09 33 12           Bathing stretchers, shower tables and diaper-changing tables; stationary or portable tables, with or without castors, on which a person lies during bathing, showering or changing. NOTE 2 Mainstream diaper-changing tables for babies/toddlers are excluded. They are covered by EN 12221-1. 09 33 15           Wash basins;1) stationary or portable basins for water used when washing parts of the body. 09 33 18           Bidets;1) stationary or portable basins primarily intended for washing genitals and bottom. 09 33 36           Assistive products for drying oneself;1) devices and materials for enabling a person to dry their own body. 18 15 06           Height adjustable plinths and brackets; height-adjustable surfaces or brackets on which furniture (e.g. wash basins) can be mounted. 18 18 03           Handrails and support rails; bars, usually cylindrical, attached to a wall, floor or other stable structure that provide the means for a person to support or stabilize themselves using hands or arms while walking, e.g. up and down stairs or ramps or moving along corridors. 18 18 06           Fixed grab bars and handgrips; devices, usually straight or angled bars, that are permanently attached to a wall, a wall and a floor, or a wall, ceiling and floor to provide support to a person while standing or changing position. 18 18 10           Removable grab rails and handgrips; devices, usually straight or angled bars, that can be temporarily attached to walls, floors, ceilings or furniture using, e.g. clamps or suction pads and removed without tools providing support to a person while changing position. 18 18 11           Hinged rails and arm supports; devices that provide support to a person when changing their position; they can be fixed to a wall or floor and can be folded up or sideways or lowered down to allow access or when they are not needed. This document does not apply for: safe mounting in building structures; fixed building installations e.g. water, electricity, drainage and sewerage, requirements in relation to excretion-disposal and wrapping systems; bathtub hoists that are covered by ISO 10535:2021, namely 12 36 06 Mobile hoists for transferring a person in sitting position with solid seats; 12 36 09 Mobile hoists for transferring a person in lying position; 12 36 12 Stationary hoists fixed to walls, floor or ceiling; 12 36 15 Stationary hoists fixed to, or mounted in or on, another product; 09 33 21 Bathtubs; stability and friction issues in relation to slippery surfaces due to soap; products that have been customised or custom-made for an individual user. 1)There are no specific requirements and test methods for these products. Only the relevant general requirements apply when these products are considered to be assistive products.'
