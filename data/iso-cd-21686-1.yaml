abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of the thyroid
    activity of water and waste water by means of a reporter gene assay with genetically
    modified Xenopus laevis eleutheroembryos. This method is applicable to: - fresh
    water; - waste water; - aqueous extracts and leachates; - eluates of sediments
    (fresh water); - pore water; - aqueous solutions of single substances or of chemical
    mixtures; - drinking water. The organism preparation methods (freeze-drying, extraction,
    mineralization) and quantification of the chemical substances do not fall within
    the scope of this document.'
