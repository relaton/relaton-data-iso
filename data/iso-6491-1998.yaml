abstract:
- language: en
  script: Latn
  content: This International Standard specifies a spectrometric method for the determination
    of the phosphorus content of animal feeding stuffs. The method is applicable to
    animal feeding stuffs with a phosphorus content less than 50 g/kg. It is particularly
    appropriate for the analysis of products with low phosphorus content. For products
    with higher phosphorus content, application of a gravimetric method is advised,
    using for instance quinoline phosphomolybdate.
