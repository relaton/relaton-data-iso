abstract:
- language: en
  script: Latn
  content: This document specifies the sizes of test specimens and the test procedure
    for carrying out longitudinal tensile tests on cylindrical test specimens in order
    to determine the mechanical properties of weld metal in a fusion welded joint.
    This document applies to metallic materials in all forms of product with joints
    made by any fusion welding process, having joint sizes that are sufficient to
    obtain cylindrical test specimens with dimensions in accordance with ISO 6892‑1.
    Unless specified otherwise for specific points in this document, the general principles
    of ISO 6892‑1 apply.
