abstract:
- language: en
  script: Latn
  content: ISO 22448:2010 specifies, and classifies at seven levels, systems for the
    protection against theft of earth-moving machinery as defined in ISO 6165, and
    gives performance criteria for each level. It also gives recommendations for managing
    critical documentation and theft-sensitive spare parts in protection against theft.
    It is not applicable to tracking systems that monitor the location of a machine.
