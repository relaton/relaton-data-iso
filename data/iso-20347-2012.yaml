abstract:
- language: en
  script: Latn
  content: ISO 20347:2011 specifies basic and additional (optional) requirements for
    occupational footwear that is not exposed to any mechanical risks (impact or compression).
    Special risks are covered by complementary job-related standards (e.g. footwear
    for firefighters, electrical insulating footwear, protection against chain saw
    injuries, protection against chemicals and against molten metal splash, protection
    for motor cycle riders).
