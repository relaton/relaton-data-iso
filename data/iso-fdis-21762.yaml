abstract:
- language: en
  script: Latn
  content: 'This document provides additional requirements and guidance for the evaluation of medical devices manufactured utilizing human tissues or derivatives which are non-viable or rendered non-viable. This document is applicable to materials of human origin (homo sapiens) such as: —    heart valves, bones, ligaments, amniotic membranes, cornea; —    derivatives of human tissues, such as collagen obtained from human tissue such as skin or tendons; —    materials produced in vivo such as enzymes and coagulation factors. This document does not apply to materials of animal origin. This document specifies, in conjunction with ISO 14971, a procedure to identify the hazards and hazardous situations associated with medical devices, to estimate and evaluate the resulting risks, to control these risks, and to monitor the effectiveness of that control. This document outlines the decision process for determining the acceptability of residual risks, taking into account the risk profile and expected benefit as compared to available alternatives, in line with ISO 14971. This document is intended to provide requirements and guidance on risk management related to the hazards typical of medical devices manufactured utilizing human materials such as: a)    contamination by bacteria, moulds, yeasts or parasites; b)    contamination by viruses; c)    contamination by agents causing transmissible spongiform encephalopathies (TSEs) and other transmissible agents; d)    material responsible for undesired pyrogenic, immunological or toxicological reactions. NOTE 1   It is not a requirement of this document to have a full quality management system during manufacture. However, attention is drawn to international standards for quality management systems (see ISO 13485) that control all stages of production or reprocessing of medical devices. NOTE 2   For guidance on the application of this document, see Annex A. This document does not address requirements for consent to donation of human materials. This document applies to medical devices other than in vitro diagnostic medical devices manufactured utilizing human materials which are non-viable or have been rendered non-viable.'
