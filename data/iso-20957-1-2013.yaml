abstract:
- language: en
  script: Latn
  content: ISO 20957-1:2013 specifies general safety requirements and test methods
    for stationary training equipment. ISO 20957-1:2013 also covers environmental
    aspects. It also specifies a classification system. ISO 20957-1:2013 is applicable
    to all stationary training equipment. This includes equipment for use in training
    areas of organizations such as sport associations, educational establishments,
    hotels, sport halls, clubs, rehabilitation centres and studios where access and
    control is specifically regulated by the owner, equipment for domestic use and
    other types of equipment including motor driven equipment.
