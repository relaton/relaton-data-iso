abstract:
- language: en
  script: Latn
  content: This European Standard specifies requirements for the qualification testing
    of welding procedures for the arc welding of tube to tube-plate joints in metallic
    materials by manual, partly mechanized, mechanized or automatic processes. This
    standard is a part of a series of standards. Details of this series are given
    in prEN ISO 15607, Annex A. Qualification by tube to tube-plate joint tests can
    be used for all joints even if they are fully loaded or only seal welded as required
    in application standards. In such cases, one or more special test pieces should
    be made to simulate the production joint in all essential features, e.g. dimensions,
    restraint, heat sink effects. The test should be carried out prior to and under
    the conditions to be used in production. This standard applies to fusion welding
    of metallic materials for tube to tube-plate joints with gap. This standard does
    not apply to tube-sheets with forged end connections with welded tubes (external/internal
    bore welds). For welding of tube to tube-plate joints without gap welding procedure
    test should be defined in the specification. For other applications and/or requirements
    the standard can be used if required by the specification. Repair welding should
    be considered in the welding procedure test.
