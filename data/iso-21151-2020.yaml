abstract:
- language: en
  script: Latn
  content: This document specifies requirements for a protocol implemented by an international
    body to achieve equivalent results among two or more IVD MDs for the same measurand
    for cases where there are no reference measurement procedures and no fit-for-purpose
    certified reference materials or international conventional calibrators. In this
    case, the harmonisation protocol defines the highest level of metrological traceability
    for the stated measurand. This document can be applied in cases when certified
    reference materials or international conventional calibrators exist but are not
    fit-for-purpose because, for example, they are not commutable with human samples.
    NOTE This document addresses one case of traceability of assigned and measured
    values described in 5.6 in ISO 17511:2020.
