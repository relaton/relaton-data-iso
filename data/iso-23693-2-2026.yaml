abstract:
- language: en
  script: Latn
  content: This document describes methods for simulating the mechanical loads that
    can be imparted to passive fire protection (PFP) materials and systems by explosions
    resulting from releases of flammable gas, pressurized liquefied gas, flashing
    liquid fuels, or dust that can precede a fire. These methods can be used to determine
    the resistance of passive fire protection materials to such events. This document
    considers PFP materials applied to panels, plates, etc. that can be used as divisional
    elements. The loading on this type of element predominantly results from explosion
    overpressure applied and drag loadings are typically minimal.
