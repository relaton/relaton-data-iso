abstract:
- language: en
  script: Latn
  content: ISO 9013:2017 presents geometrical product specifications and quality tolerances
    for the classification of thermal cuts in materials suitable for oxyfuel flame
    cutting, plasma cutting and laser cutting. It is applicable to flame cuts from
    3 mm to 300 mm, plasma cuts from 0,5 mm to 150 mm and laser cuts from 0,5 mm to
    32 mm. The geometrical product specifications are applicable if reference to this
    document is made in drawings or pertinent documents, e.g. delivery conditions.
    If this document were also to apply, by way of exception, to parts produced by
    other cutting processes, this would have to be agreed upon separately. Flatness
    defects are not addressed as such in this document. The references are to the
    current standards for the materials used.
