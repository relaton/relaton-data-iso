abstract:
- language: en
  script: Latn
  content: 'ISO 22642:2015 defines synchronization and channel coding schemes in terms
    of: a) the services provided to the users of this specification; b) data formats;
    and c) the procedures performed to generate and process the data formats. It does
    not specify: a) individual implementations or products; b) the methods or technologies
    required to perform the procedures; or c) the management activities required to
    configure and control the system.'
