abstract:
- language: en
  script: Latn
  content: This document specifies a dynamic impact wedge method for the determination
    of the cleavage resistance under impact loading of high-strength adhesive bonds
    between two adherends, when tested under specified conditions of preparation and
    testing. This test procedure does not provide design information. The method allows
    a choice of sheet metal or fibre reinforced plastic substrates corresponding to
    those materials frequently used in industry, such as for automotive applications.
