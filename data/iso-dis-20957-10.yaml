abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements for exercise bicycles with
    a fixed wheel or without freewheel that have an inertia of >0,6 kg·m2. The requirements
    are in addition to the general safety requirements of ISO 20957‑1, with which
    ISO 20957-10 is intended to be read in conjunction. Any attachment provided with
    the exercise bicycle with a fixed wheel or without freewheel for the performance
    of additional exercises is subject to the requirements of ISO 20957‑1.
