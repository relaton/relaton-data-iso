abstract:
- language: en
  script: Latn
  content: This International Standard specifies the testing method to determine the
    extent to which granulated or ungranulated ceramic powders are agglomerated. After
    compacting ceramic powders by applying a given compressive pressure, uniaxial
    compressive stress is applied to measure the compressive strength of the ceramic
    powder compact. And the ratio of the compaction pressure to the compressive strength
    can be calculated to evaluate the agglomerate properties of ceramic powders.
