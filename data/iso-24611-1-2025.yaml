abstract:
- language: en
  script: Latn
  content: This document establishes a framework for the representation of annotations
    of word-sized units in texts. Such annotations describe tokens, their relationship
    with lexical units (word-forms), and the relevant morphosyntactic properties.
    This document proposes a metamodel for morphosyntactic annotation that can be
    augmented with references to data categories contained in a data category repository
    conforming to ISO 12620-2. It also defines an XML serialization for morphosyntactic
    annotations, according to the principles laid out in the TEI Guidelines (see Reference [31]).
    This document does not apply to structural ambiguities or the structure and composition
    of morphosyntactic tagsets. This document does not address the linguistic choices
    that identify tokens or determine the language- or context-particular relationships
    between tokens and word-forms.
