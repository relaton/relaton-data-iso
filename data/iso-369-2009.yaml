abstract:
- language: en
  script: Latn
  content: 'ISO 369:2009 specifies symbols and the corresponding meanings in English,
    French and German for application in the field of machine tools. The symbols given
    in ISO 369:2009 are for: - placement on equipment or parts of equipment of any
    kind of machine tool in order to instruct the persons handling the equipment or
    parts of equipment on their setting in operation and functioning (e.g. in user
    handbooks and information for use); - use in the representation of a state, a
    function or an operation, wherever this may be, and in documents such as drawings,
    maps and diagrams.'
