abstract:
- language: en
  script: Latn
  content: ISO 16387:2014 specifies one of the methods for evaluating the habitat
    function of soils and determining effects of soil contaminants and substances
    on the reproduction of Enchytraeus sp. by dermal and alimentary uptake in a chronic
    test. It is applicable to soils and soil materials of unknown quality, e.g. from
    contaminated sites, amended soils, soils after remediation, agricultural or other
    sites under concern and waste materials. ISO 16387:2014 provides information on
    how to use this method for testing substances under temperate conditions.
