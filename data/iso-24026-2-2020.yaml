abstract:
- language: en
  script: Latn
  content: 1.1 This document specifies the methods of preparation of test specimens
    and the test methods to be used in determining the properties of poly(methyl methacrylate)
    (PMMA) moulding and extrusion materials. It gives the requirements for handling
    test material and for conditioning both the test material before moulding and
    the specimens before testing. 1.2 This document specifies procedures and conditions
    for the preparation of test specimens and procedures for measuring properties
    of the materials from which these specimens are made. It lists properties and
    test methods which are suitable and necessary to characterize poly(methyl methacrylate)
    moulding and extrusion materials. 1.3 The properties have been selected from the
    general test methods in ISO 10350-1. Other test methods in wide use for, or of
    particular significance to, these moulding and extrusion materials are also included
    in this document, as are the designatory properties specified in ISO 24026-1.
