abstract:
- language: en
  script: Latn
  content: 'This document provides guidance on ethical and safe considerations and
    practices when carrying out sensory analysis on products, materials and ingredients.
    This document covers: • Sensory testing facilities and environments. • Sensory
    testing programmes. • Sensory tests. • Sensory testing with panels who participate
    on a regular basis. • Sensory testing programmes. • Sensory training courses and
    practical demonstrations. • Sensory analysis applied in research, development,
    quality assurance and quality control and marketing research. • Food and non-food
    products. The considerations may be applied in sensory judging, competitions and
    organised tastings. This document does not cover: • Pharmaceutical and medically-prescribed
    products. • Large scale market research studies and techniques for large-scale
    surveys. • Studies that require additional, specific ethical considerations.'
