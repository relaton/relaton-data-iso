  script: Latn
  content: ISO 7240-2:2017 specifies requirements, test methods and performance criteria
    for fire detection control and indicating equipment (FDCIE) for use in fire detection
    and fire alarm systems installed in buildings. For the testing of other types
    of FDCIE, this document is intended to be used only for guidance. FDCIE with special
