abstract:
- language: en
  script: Latn
  content: "​​This document provides guidance on assessing the potential for condensate
    level oscillatory (CLO) instability in passive residual heat removal systems (PRHRSs)
    for pressurized water reactors (PWRs). ​The assessment is based on steady and
    unsteady analytical solutions for the two-phase natural circulation loop model
    in terms of the condensate level in the vertical feedwater pipe section. ​ ​The
    document outlines a simplified model of the PWR PRHRS for analysis, including
    analytical solutions for steady and unsteady condensate water levels and acceptance
    criteria to determine whether CLO instability poses a threat to the system.​"
