abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1270:2004 specifies the application module for Message. The
    following are within the scope of ISO/TS 10303-1270:2004: identification of the
    message; identification of the message creator and creation date; identification
    of the items referenced in the message content; identification of the approver
    of the message; recording the state of the message with respect to a business
    process; application of a security classification to the message; association
    of messages with each other.'
