abstract:
- language: en
  script: Latn
  content: ISO 14120:2015 specifies general requirements for the design, construction,
    and selection of guards provided to protect persons from mechanical hazards. ISO
    14120:2015 indicates other hazards that can influence the design and construction
    of guards. ISO 14120:2015 applies to guards for machinery which will be manufactured
    after it is published. The requirements are applicable if fixed and movable guards
    are used. This International Standard does not cover interlocking devices. These
    are covered in ISO 14119. ISO 14120:2015 does not provide requirements for special
    systems relating specifically to mobility such as ROPS (rollover protective structures),
    FOPS (falling-object protective structures), and TOPS (tip over protective structures)
    or to the ability of machinery to lift loads.
