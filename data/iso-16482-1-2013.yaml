  content: ISO 16482-1:2013 specifies a method for determining the non-volatile content,
    by mass, of aqueous rosin-resin dispersions, using an oven. This method is applicable
    to resin dispersions having a softening point from 60 °C to 100 °C, measured in
    accordance with ISO 4625‑1 (ring-and-ball method).
