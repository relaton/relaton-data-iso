abstract:
- language: en
  script: Latn
  content: 'This document specifies the design as well as the construction and strength
    requirements for safety devices and arrangements intended to minimize the risk
    of persons falling overboard, and requirements to facilitate reboarding from the
    water, unaided, on small craft. This document is applicable to the risk of falling
    overboard and does not apply to falling within the limits of the deck zone. This
    document includes the use of toe straps for hiking out on small sailing boats,
    but it does not apply to the use of trapezes or similar devices that are designed
    to allow crew to operate sailing boats with their bodies entirely outside the
    periphery of the craft. This document does not apply to the following small craft
    types: —     canoes, kayaks; —     personal watercraft including powered surfboards.'
