abstract:
- language: en
  script: Latn
  content: This document applies to model tests of thrust and manoeuvring force and
    moment for waterjet units. It defines terms and quantities for force characteristic
    tests for waterjet unit and specifies requirements for test conditions, devices
    and methods and analysis procedure. This document does not include hydraulic system
    and control system of waterjet units. This document does not provide manufacturing
    tolerances in contract.
