abstract:
- language: en
  script: Latn
  content: ISO 13688:2012 specifies general performance requirements for ergonomics,
    innocuousness, size designation, ageing, compatibility and marking of protective
    clothing and the information to be supplied by the manufacturer with the protective
    clothing. ISO 13688:2012 is only intended to be used in combination with other
    standards containing requirements for specific protective performance and not
    on a stand-alone basis.
