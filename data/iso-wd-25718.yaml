abstract:
- language: en
  script: Latn
  content: This document specifies a proper method for measuring antiviral activity
    on non-porous surfaces of products treated with antiviral agents used in a dry
    condition against specified viruses following air-transmitted contamination. It
    evaluates the resistance of non-porous materials to specific air-transmitted viruses
    by simulating the situation where the activity of the virus is reduced after the
    microdroplets and aerosols generated during activities such as sneezing and coughing
    settle onto the material's surface. Due to individual sensitivities, the results
    of one test virus might not be applicable to other viruses. This document is not
    intended to be used to substantiate cleaning or disinfecting properties. This
    document is not intended to antiviral activity testing on porous surfaces and
    materials. This document does not refer to methods for testing the toxicological
    and ecotoxicological properties of the surfaces.
