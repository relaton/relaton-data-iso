abstract:
- language: en
  script: Latn
  content: ISO 18332:2007 defines porosity and its associated terms, and outlines
    the principles involved in porosity testing of metallic and related inorganic
    coatings. The purpose of porosity testing is also considered, thereby assisting
    the user to select the most suitable test for the product and its service application.
    The porosity test cannot be used to establish corrosion-performance standards.
