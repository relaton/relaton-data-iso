abstract:
- language: en
  script: Latn
  content: This International Standard specifies the 34- pole connector and the assignment
    of contact numbers at the interface between data terminal equipment (DTE) and
    data circuit-terminating equipment (DCE) where ITU-T Recommendation V.36 or Recommendation
    X.21bis together with Recommendation V.10 and V.11 are applicable. NOTE 1 An interoperation
    between interfaces designed according to electrical characteristics specified
    in ITU-T Recommendation V.36 and those specified in ITU-T Recommendation V.11
    is, at least to a limited degree, possible. This can be achieved, for example,
    by using a passive adaptor which joins the interface connectors in accordance
    with ISO/IEC 2593 and ISO 4902, or ISO 4903, respectively. This International
    Standard specifies the dimensions of the connector housing and gives recommendations
    for the type of locking device (jack-screw system) and connector shielding.
