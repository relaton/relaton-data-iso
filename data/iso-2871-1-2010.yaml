abstract:
- language: en
  script: Latn
  content: ISO 2871-1:2010 specifies a method for the determination of high-molecular-mass
    cationic-active materials such as quaternary ammonium compounds in which two of
    the alkyl groups each contain 10 or more carbon atoms, e.g. distearyl-dimethyl-ammonium
    chlorides, or salts of imidazoline or 3-methylimidazoline in which long-chain
    acylaminoethyl and alkyl groups are substituted in the 1- and 2-positions, respectively.
    The method is applicable to solids or to aqueous solutions of the active material.
    The method is not applicable if anionic surface active agents are present.
