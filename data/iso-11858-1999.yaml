abstract:
- language: en
  script: Latn
  content: 1.1 This International Standard specifies a procedure for assessing the
    friability of foam backings attached to textile floor coverings. 1.2 This International
    Standard is not suitable for evaluating the propensity of a foam backing to break
    down after installation, since such break-down is invariably due to a combination
    of flexing fatigue and oxidation, factors which are not covered in this International
    Standard.
