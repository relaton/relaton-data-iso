abstract:
- language: en
  script: Latn
  content: 'This document establishes a framework for testing and reporting deepfake
    attack detection mechanisms in biometric systems. The scope of this standard is
    focused on ensuring comparability, repeatability, and transparency of biometric
    deepfake attack detection. This document specifies: — Principles and methods for
    the performance assessment of biometric deepfake attack detection mechanisms;
    — Reporting of testing results from evaluations of biometric deepfake attack detection
    mechanisms. Outside the scope of this document are: — Standardization of specific
    biometric deepfake attack detection mechanisms; — Detailed information about models
    (e.g., neural-network based detectors), algorithms, or sensors; — Overall system-level
    security or vulnerability assessment beyond the evaluation of biometric deepfake
    attack detection components.'
