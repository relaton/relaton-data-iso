- language: en
  script: Latn
  content: ISO 15547-1:2005 gives requirements and recommendations for the mechanical
    design, materials selection, fabrication, inspection, testing, and preparation
    for shipment of plate-and-frame heat exchangers for use in petroleum, petrochemical
