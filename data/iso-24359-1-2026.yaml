abstract:
- language: en
  script: Latn
  content: This document addresses the development of a building commissioning (Cx)
    plan for new construction, major renovations, or system and assembly replacement
    projects. The commissioning plan incorporates commissioning activities which begin
    during early project stages, and continue through pre-design, design, construction,
    turnover and the first year of operation. The commissioning plan is developed
    during the design stage and also address later stages of the project. The commissioning
    plan presents the intended process to verify and document that the quality of
    the built project in operation meets the requirements of the owner. This document
    provides an overarching process for the planning of commissioning any aspect of
    a building project and is intended for use with system or discipline specific
    standards. This document does not include retro-commissioning or recommissioning
    in existing buildings.
