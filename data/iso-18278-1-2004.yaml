abstract:
- language: en
  script: Latn
  content: 'ISO 18278-1:2004 recommends procedures for determining the generic weldability
    for resistance spot, seam and projection welding of metallic materials. This procedure
    is applicable for the assessment of the weldability of uncoated/coated steels,
    stainless steels and non-ferrous alloys such as aluminium, titanium, magnesium
    and nickel and their alloys of single thickness lower than or equal to 5 mm. The
    weldability of metallic materials in resistance welding is defined in terms of:
    the ability to make the weld in the first place;the ability to continue making
    welds;the ability of the weld to withstand the imposed service stresses. The procedures
    recommended in ISO 18278-1:2004 can be used to: compare the weldability of different
    metallic materials;compare the welding response of particular welding equipment
    and allow comparisons between different equipment and determine the influence
    of the static/dynamic properties of different welding equipment;determine the
    weldability of a material when any welding configuration is changed e.g. electrode
    material and/or shape, water cooling requirements etc.;investigate the effect
    of welding parameters such as welding current, weld time, electrode force or complex
    welding schedules including pulse welding, current stepping etc. on weldability.'
