abstract:
- language: en
  script: Latn
  content: ISO 10521-2:2006 specifies methods of setting the target road load on chassis
    dynamometers for the purpose of a subsequent test, for example the fuel consumption
    test or the exhaust-emission measurement test. The road-load setting method on
    chassis dynamometers depends on the road-load measurement method, such as the
    coastdown method, the torquemeter method or the wind-tunnel and chassis-dynamometer
    method. ISO 10521-2:2006 gives detailed instructions on the methods of the chassis-dynamometer
    setting procedure for road-load value, obtained by the various measurement methods
    specified in ISO 10521-1:2006. ISO 10521-2:2006 is applicable to chassis dynamometers
    that can set road load at a minimum of three speed points, and to motor vehicles
    as defined in ISO 3833:1977 up to a gross vehicle mass of 3 500 kg.
