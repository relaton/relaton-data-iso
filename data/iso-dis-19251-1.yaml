abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the longitudinal tensile
    properties of pipe or pipe/pipe or pipe/fitting assemblies using hydrostatic pressure
    at (23 ± 2) °C. The method accommodates water-in-water and liquid-in-liquid tests.
    The document is applicable to pipes and their assemblies with fused and bonded
    joints. The method provides load-displacement curves, from which determines -the
    longitudinal strengths (σ_LY , σ_LU, σ_LB) -the percent elongation (ϵ_LB) -the
    energy for pipe or joint failure (UT).
