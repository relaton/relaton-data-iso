abstract:
- language: en
  script: Latn
  content: 'This document specifies general safety requirements for the design, testing
    and production of powered elevators. The requirements are applicable for onshore
    and offshore applications of such elevators in the petroleum and petrochemical
    industries. This document does not cover any other type of elevator. It is not
    applicable to the following types of products: — remote control devices; — lifting
    nubbins; — lifting plugs; — lifting subs; — internal gripping devices; — equipment
    for lifting tubular from and onto a vessel; — elevator links or bails. This list
    is not exhaustive. This document is not applicable to powered elevators manufactured
    before the date of this publication. NOTE Annex A provides the relation between
    the clauses of the European Directive on machinery (Directive 2006/42/EC) and
    this document, for potential significant hazards and the safety requirements dealing
    with them for powered elevators.'
