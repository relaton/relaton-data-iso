abstract:
- language: en
  script: Latn
  content: 'This document determines the fuel quality classes and specifications of
    graded wood briquettes. This document covers only wood briquettes produced from
    the following raw materials (see ISO 17225‑1: 2021, Table 1): 1.1 Forest, plantation
    and other virgin wood 1.2 By-products and residues from wood processing industry
    1.3.1 Chemically untreated used wood NOTE Thermally treated biomass briquettes
    (e.g. torrefied briquettes) are not included in the scope of this document.'
