abstract:
- language: en
  script: Latn
  content: This method is applicable to the determination of oxides of nitrogen (NOx)
    in emissions of electrically heated tobacco products (eHTPs) by chemiluminescence.
    This method might to be used to demonstrate the absence of oxides of nitrogen
    (NOx) in emissions of aerosol heated tobacco products (aHTPs) under the requirement
    that the specific aHTP puffing regime is applied. The described method is specified
    in ISO 5501-1.
