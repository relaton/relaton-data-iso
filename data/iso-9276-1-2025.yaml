abstract:
- language: en
  script: Latn
  content: This document specifies guidelines and instructions for the graphical representation
    of particle size analysis data in histograms, distribution densities and cumulative
    distributions. It also establishes a standard nomenclature to obtain the histograms,
    distribution densities and cumulative distributions from measured particle size
    data. This document applies to the graphical representation of particle size distributions
    (PSDs) of solid particles, droplets or gas bubbles covering all size ranges.
