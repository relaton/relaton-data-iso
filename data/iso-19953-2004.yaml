abstract:
- language: en
  script: Latn
  content: ISO 19953:2004 specifies a test method for determining the impact strength
    of the heels of ladies' shoes. The result provides an assessment of the liability
    to failure under the occasional heavy blows received during wear. While the test
    method is applicable to all types of high heels, of whatever construction, it
    is particularly useful for injection-moulded plastic heels which incorporate a
    steel dowel re-inforcement, giving information on the suitability of the dowel's
    hardness or softness. Heels which by virtue of their shape have a high lateral
    impact resistance do not normally required to be tested in this way.
