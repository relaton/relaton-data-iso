abstract:
- language: en
  script: Latn
  content: 'ISO/TS 13399-401:2016 specifies a concept for the design of adaptive items,
    limited to any kind of converters, extenders and reducers, together with the usage
    of the related properties and domains of values. ISO/TS 13399-401:2016 specifies
    a common way of designing simplified models that contain the following: - definitions
    and identifications of the design features of converting, extending and reducing
    adaptors, with an association to the used properties; - definitions and identifications
    of the internal structure of the 3D model that represents the features and the
    properties of converting, extending and reducing adaptors. The following are outside
    the scope of this part of ISO/TS 13399: - applications where these standard data
    may be stored or referenced; - concept of 3D models for cutting tools; - concept
    of 3D models for cutting items; - concept of 3D models for tool items; - concept
    of 3D models for other adaptive items not described in the scope of this part
    of ISO/TS 13399; - concept of 3D models for assembly items and auxiliary items.'
