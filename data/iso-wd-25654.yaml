abstract:
- language: en
  script: Latn
  content: This document specifies the production of reference materials for the validation
    of microplastic detection methods. It refers to top-down procedures to produce
    irregular shaped powders. The longest dimension in size of the produced reference
    materials is between 10 µm and 1000 µm. This document applies to thermoplastic
    polymers. This document does not apply to the production of fibres, elastomers,
    epoxy resin or road wear tyre particles. It excludes artificial aging and bottom-up
    methods.
