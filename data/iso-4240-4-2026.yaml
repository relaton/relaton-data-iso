abstract:
- language: en
  script: Latn
  content: This document specifies a test method for evaluating the performance of
    soil washing using fine bubble technology for the removal of oil (petroleum hydrocarbons)
    from contaminated soil. The test method is based on determining the concentration
    of oil in soil samples before and after washing with fine bubbles under defined
    test conditions, in order to quantify the efficiency of oil removal. This document
    is applicable to pilot-scale and full-scale soil-washing systems and is independent
    of specific equipment configurations or system designs. The test method can be
    conducted in controlled environments, such as indoor or outdoor test facilities,
    provided that the test conditions are appropriately managed. This document does
    not address site remediation design, soil excavation, soil transport, or the execution
    of full-scale remediation projects. Treatment of wastewater generated during the
    soil washing process is outside the scope of this document; however, informative
    guidance on potential treatment options is provided in Annex B and Annex C.
