abstract:
- language: en
  script: Latn
  content: This document specifies a means for determining the thermal load-carrying
    capacity of a gear unit that includes measurement on original gear units under
    practical conditions. This takes the form of either measurement of the power loss,
    heat dissipation or both, or, in the case of splash-lubricated gear units, the
    determination of the quasi-stationary temperature in the oil sump. An alternative
    method is all the methods of calculation for all individual components of power
    loss and heat dissipation described in this document.
