abstract:
- language: en
  script: Latn
  content: ISO 18402:2016 specifies test methods for determining, for use in roofs,
    the structural properties of double-sided load bearing structural insulated panels
    having - two face layers, at least one of which is a wood-based structural panel,
    and - a core made of a thermally insulating material having sufficient shear strength
    to cause the face layers to act together structurally.
