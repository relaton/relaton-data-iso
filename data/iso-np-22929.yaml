abstract:
- language: en
  script: Latn
  content: This standard method specifies the analytical method of measuring total
    tritium (tritiated water vapor (HTO) and organically bound tritium (OBT)) in urine
    using oxidation-distillation and liquid scintillation technique, as well as the
    method for evaluating internal exposure dose. This standard is applicable to the
    determination of 3H in urine during routine monitoring, accident situation, and
    the excretion promotion process, as well as the evaluation of internal exposure
    dose. This method covers the measurement of total tritium in urine in activity
    concentration from 7,0×10 1 Bq•l-1 to 7,5×10 5 Bq•l-1.
