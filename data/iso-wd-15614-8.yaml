abstract:
- language: en
  script: Latn
  content: The document specifies requirements for the approval testing of welding
    procedures for the arc-welding of tube to tube-plate joints in metallic materials
    by manual, semiautomatic, automatic or mechanized processes. It is a part of a
    series of standards given in ISO 15607. Annex B gives details of these standards.
    Approval by tube to tube-plate joints tests can be used for all joints even if
    they are fully loaded or only seal welded as required in application standards.
