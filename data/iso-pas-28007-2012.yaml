abstract:
- language: en
  script: Latn
  content: 'ISO/PAS 28007:2012 gives guidelines containing additional sector-specific
    recommendations, which companies (organizations) who comply with ISO 28000 can
    implement to demonstrate that they provide Privately Contracted Armed Security
    Personnel (PCASP) on board ships. To claim compliance with these guidelines, all
    recommendations ("shoulds") should be complied with. Compliance with ISO/PAS 28007:2012
    can be by first, second and third party (certification). Where certification is
    used, it is recommended the certificate contains the words: "This certification
    has been prepared using the full guidelines of ISO PAS 28007 as a Private Maritime
    Security Company providing Privately Contracted Armed Security Personnel".'
