abstract:
- language: en
  script: Latn
  content: ISO 9455-13:2017 specifies a method for estimating the tendency of a flux
    to spatter in use. It is a qualitative (comparative) method and is only applicable
    to liquid fluxes, as defined in ISO 9454‑1. The method is not applicable to flux
    cored solder wire or to solder pastes.
