abstract:
- language: en
  script: Latn
  content: ISO 25980:2014 specifies safety requirements for transparent welding curtains,
    strips, and screens to be used for shielding of work places from their surroundings
    where arc welding processes are used. They are designed to protect people who
    are not involved in the welding process from hazardous radiant emissions from
    welding arcs and spatter. Welding curtains, strips, and screens it specifies are
    not intended to replace welding filters. For intentional viewing of welding arcs
    other means of protection are used. It is not applicable for welding processes
    where laser radiation is used. NOTE Darker welding curtains or screens are advisable
    for mutual separation of adjacent work places for reasons of comfort.
