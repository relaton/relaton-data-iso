abstract:
- language: en
  script: Latn
  content: ISO 17451-1:2016 relates to the moving of household goods and personal
    effects. It provides the codification of items and their condition, the transportation
    modes and associated data relating to a shipment. The relevant codes can be found
    in the related annexes and information regarding their use can be found in Clause
    4. The objective of this document is to provide a common set of codes which allow
    movers of household goods and personal effects to exchange shipment-related information
    with each other and with external partners.
