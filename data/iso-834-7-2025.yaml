abstract:
- language: en
  script: Latn
  content: 'This document specifies the procedures to be followed for determining
    the fire resistance of columns when tested on their own. Two methods of testing
    are described: —     Method A, which is applicable to any type of column and in
    which the test is conducted with an applied axial load to the column; and —    
    Method B, which is only applicable to protected steel columns with any type of
    protection system and in which the test is conducted with no load applied to the
    column and the fire resistance is determined based on steel temperature limits.
    Method B is only applicable to protection systems that do not support any of the
    structural load. (See A.6). The application of this test to other untested forms
    of construction is acceptable when the construction conforms to the direct field
    of application as given in Annex B of this document, or when subjected to an extended
    application analysis in accordance with ISO/TR 12470 (series)[1]. General guidance
    on test method A and test method B is given in Annex A.'
