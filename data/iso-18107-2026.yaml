abstract:
- language: en
  script: Latn
  content: 'This document specifies: the test conditions and test methods for determining
    capacity and efficiency ratings; calculation methods for seasonal performance.
    This applies to factory made, electric mains operated, variable refrigerant flow
    air-cooled air conditioners and air-to-air heat pumps with a rated capacity above
    12 kW for cooling or for heating if the product has no cooling function. In this
    document, “heat pumps” means “air-to-air heat pumps” and “air conditioners” means
    “air-cooled air conditioners”. This document establishes a method for determining
    global variable refrigerant flow (VRF) performance with annexes addressing specific
    national or regional deviations, such as regionally specific power or testing
    requirements. This document does not apply to the testing and rating of: water-source
    heat pumps or water-cooled air conditioners; multi-split systems where each indoor
    unit has dedicated piping connected directly to the outdoor unit; individual assemblies
    not constituting a complete refrigeration system.'
