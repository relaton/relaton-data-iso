abstract:
- language: en
  script: Latn
  content: This document specifies the system architecture and data to be available relative to the operation of cranes, as defined in ISO 4301. It gives definitions of terms related to crane telematics data (see Clause 9). This document specifies the communication schema designed to provide crane status data from a telematics provider’s server to third-party client applications via the Internet. The data is collected from a crane using telematics data-logging equipment and stored on a telematics provider’s server. This document describes the communications used to request data from the server and the responses from the server containing specified data elements to be used in the analysis of crane performance and health. It is not applicable to the on-board data collection, on-board communication protocol (e.g., CAN bus) or wireless transmission of the crane data to the telematics provider’s server after data has been collected at the data logger
