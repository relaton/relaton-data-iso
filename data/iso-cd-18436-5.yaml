abstract:
- language: en
  script: Latn
  content: ISO 18436-5:2012 specifies the requirements for qualification and assessment
    of personnel who perform machinery condition monitoring and diagnostics using
    laboratory-based lubricant analysis. A certificate or declaration of conformity
    to ISO 18436-5:2012 provides recognition of the qualifications and competence
    of individuals to perform laboratory-based lubricant analysis for machinery condition
    monitoring. It is possible that this procedure is not applicable to specialized
    equipment or other specific situations. ISO 18436-5:2012 covers a three-category
    classification programme that is based on the technical areas delineated herein.
