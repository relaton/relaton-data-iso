abstract:
- language: en
  script: Latn
  content: ISO 13274:2013 specifies the requirements and test methods for compatibility
    testing of plastics packagings/Intermediate Bulk Containers (IBCs) and composite
    packagings/IBCs with plastics inners containing liquids. The testing involves
    storage with the liquid to be transported. For polyethylene-based packaging, testing
    with a standard liquid as defined in The European Agreement concerning the International
    Carriage of Dangerous Goods by Road may be undertaken. Annex B describes small-scale
    laboratory tests that may be used to determine the assimilation of those products
    to be carried with the standard liquids. Where there is any contradiction between
    ISO 13274:2013 and any applicable regulation, the regulation always takes precendence.
