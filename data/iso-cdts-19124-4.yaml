abstract:
- language: en
  script: Latn
  content: This Technical Specification defines the calibration and validation of
    Earth observing (EO) data acquired by Lidar sensors and products derived from
    Lidar data. The specified Lidar data include waveform and point cloud modes. In
    this specification, the term calibration refers to the process to correct the
    Lidar data, not only geometrically and radiometrically, but also characteristically
    for land, ice, forest, water and atmosphere applications, and the term validation
    refers to the process to evaluate the quality and accuracy of the calibrated data
    and derived products. This Technical Specification will also address the associated
    metadata related to calibration and validation that has not been defined in other
    ISO geographic information standards. This technical specification does not address
    the calibration of Lidar sensors and validation of Lidar sensor calibration, which
    are covered by ISO 19159-2.
