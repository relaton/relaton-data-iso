abstract:
- language: en
  script: Latn
  content: 'This document specifies a series of methods for the determination of peel
    adhesion properties of self adhesives tapes. This document specifies: —     Method
    1: Self adhesive tapes – Measurement of peel adhesion from stainless steel at
    an angle of 180°; —     Method 2: Self adhesive tapes – Measurement of peel adhesion
    from its own backing at an angle of 180°; —     Method 3: Self adhesive tapes
    – Measurement of peel adhesion of double-sided and transfer tapes at an angle
    180°; —     Method 4: Self adhesive tapes – Measurement of adhesion of the liner
    to an adhesive tape at an angle of 180°.'
