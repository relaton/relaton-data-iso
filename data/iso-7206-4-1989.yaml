abstract:
- language: en
  script: Latn
  content: This standard defines a test method and laboratory conditions so that the
    important parameters that affect the components are taken into account and describes
    how the specimen is set up for testing. The test method has been developed for
    prostheses that have a plane of symmetry and may not be suitable for other designs.
    The standard does not cover methods of examining and reporting of the test specimen.
    The informative Annex A includes a guidance on composition of high-alumina cement
    embedding medium.
