abstract:
- language: en
  script: Latn
  content: This document specifies abrasive blast-cleaning methods for the preparation
    of steel surfaces before coating with paints and related products. It provides
    information on the effectiveness of the individual methods and their fields of
    application. It describes the equipment to use and the procedure to follow. NOTE
    These methods are essentially intended for hot-rolled steel to remove mill scale,
    rust, etc. but could also be used for cold-rolled steel of sufficient thickness
    to withstand the deformation caused by the impact of abrasive.
