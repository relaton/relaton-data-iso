abstract:
- language: en
  script: Latn
  content: ISO 4526:2004 specifies requirements for electroplated nickel and nickel
    alloy coatings applied to ferrous and non-ferrous basis metals for engineering
    purposes. Binary nickel alloys in which nickel is a minor constituent are outside
    the scope of this International Standard. The designation provides a means of
    specifying the type and thickness of nickel and nickel alloy coatings appropriate
    for engineering applications.
