abstract:
- language: en
  script: Latn
  content: This document specifies a general method for the rapid determination of
    performance parameters of polyamides (PA) using Near-Infrared (NIR) spectroscopy.
    It provides the relevant terms and definitions, test principles, instrument requirements,
    sample selection, procedures for establishing and validating and maintaining the
    calibration model, and sample determination. It is applicable to determine the
    water content, relative viscosity, terminal amino group content and relative molecular
    mass of PA. The method is applicable to the polyamides such as PA46, PA6, PA66,
    PA69, PA610, PA612, PA11, PA12, PA6T/66, PA6I/6T, PA6T/6I/66, PA T/6I, PA6I/6T/66
    and PA MXD6, as well as to copolyamides, compounds of polyamides. This document
    is suitable for use in quality control, specification testing and process control
    of PA.
