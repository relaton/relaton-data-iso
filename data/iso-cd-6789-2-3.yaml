abstract:
- language: en
  script: Latn
  content: This document specifies the method for the calibration of hand torque tools
    and describes the method of calculation of measurement uncertainties for the calibration.
    It also specifies the minimum requirements for a certificate of calibration to
    this standard for hand torque tools. The Annex C of this document specifies the
    minimum requirements for the calibration of the torque measurement device where
    the relative measurement uncertainty interval, W´md, is not already provided by
    a traceable calibration certificate. This document applies to hand torque tools
    which are classified as indicating torque tools (Type I) and setting torque tools
    (Type II). NOTE   Hand torque tools covered by this document are those identified
    in ISO 1703:2018 by reference numbers 7 1 00 01 0 to 7 1 00 14 0 inclusive.  Torque
    limiting hand torque tools do not yet have reference numbers and will not do so
    until the next revision of ISO 1703
