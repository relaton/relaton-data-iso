abstract:
- language: en
  script: Latn
  content: This Document specifies the minimum testing requirements for validating
    the application of fuelling protocols specified in ISO 19885-3. This Document
    applies to dispensing systems, referred to as “dispensers”, designed to fill vehicle
    storage systems in accordance with ISO 19885-3. This Document was developed for
    and is intended to be used with the specific editions of ISO 19885-3 as referenced
    in Clause 2. For dispensers with the capability of unidirectional UCDC 1 communication
    with the vehicle, these test methods include the approach to confirm the requirements
    of unidirectional UCDC 1 communication. Newly manufactured dispensers should be
    tested in accordance with this Document prior to initial operation of the dispenser
    for fuelling vehicles. This Document is also intended to provide test methods
    for validation of fuelling protocols in existing dispensers. Unless otherwise
    specified, the requirements in this document apply to the validation of ISO 19885-3
    fuelling protocols in dispensers.
