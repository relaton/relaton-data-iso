- language: en
  script: Latn
  content: This part of ISO/IEC 9066 defines the services provided by the Reliable
    Transfer Service Element (RTSE). The RTSE services are provided by the use of
    the RTSE protocol (ISO/IEC 9066-2) in conjunction with the Association Control
    Service Element (ACSE) services (ISO 8649) and the ACSE protocol (ISO 8650), and
    the presentation-service (ISO 8822). No requirement is made for conformance to
    this part of ISO/IEC 9066.
