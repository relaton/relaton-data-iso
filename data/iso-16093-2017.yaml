abstract:
- language: en
  script: Latn
  content: ISO 16093:2017 deals with all significant hazards, hazardous situations
    and events to sawing machines as defined in Clause 3, whose primary intended use
    is for sawing cold metal (ferrous and non-ferrous), or material partly of cold
    metal and under conditions of misuse which are reasonably foreseeable by the manufacturer
    (see Clause 4). ISO 16093:2017 is applicable to (metal) sawing machines which
    are manufactured after the date of publication of this document. When additional
    processing (i.e. milling, boring, marking, finishing operation, etc.) is considered,
    this document can serve as a basis for safety requirements. For more detailed
    information, refer to the bibliography. ISO 16093:2017 deals with noise hazards
    but does not provide a full noise test code. It is intended to draft such a code
    in the next revision of this document. ISO 16093:2017 does not include requirements
    and safety measures for fire and explosion hazards. It is intended to deal with
    them in the next revision of this document.
