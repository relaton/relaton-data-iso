abstract:
- language: en
  script: Latn
  content: ISO 11037:2011 establishes guidelines for the sensory evaluation of the
    colours of products. The procedures specified are applicable to solid, semi-solid,
    powder and liquid products, which can be opaque, translucent, cloudy or transparent
    in nature, as well as matt or glossy. General information is also given about
    the viewing and lighting conditions to be used in various situations in sensory
    analysis, such as difference testing, profile analysis and grading methods, performed
    by panels of selected assessors or by individual experts in special situations.
    ISO 11037:2011 does not deal with consumer testing or with assessment of the metamerism
    of colours of food products.
