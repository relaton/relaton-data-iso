abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for a quality management system when
    an organization: a)    needs to demonstrate its ability to consistently provide
    products and services that meet customer and applicable statutory and regulatory
    requirements, and b)    aims to enhance customer satisfaction through the effective
    application of the system, including processes for improvement of the system and
    the assurance of conformity to customer and applicable statutory and regulatory
    requirements. All the requirements of this document are generic and are intended
    to be applicable to any organization, regardless of its type or size, or the products
    and services it provides. NOTE 1    In this document, the terms “product” or “service”
    only apply to products and services intended for, or required by, a customer.
    NOTE 2    Statutory and regulatory requirements can be expressed as legal requirements.
    This document specifies the requirements for a railway quality management system
    (RQMS) —    applicable throughout the whole supply chain of the railway sector
    related to industrial products and services, —    providing continual improvement,
    emphasizing defect prevention and defect reduction in the supply chain, and —   
    enhancing and sustaining product quality, including its safety aspects.'
