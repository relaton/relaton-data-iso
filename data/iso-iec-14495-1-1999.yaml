abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard defines a set of lossless
    (bit-preserving) and nearly lossless (where the error for each reconstructed sample
    is bounded by a pre-defined value) compression methods for coding continuoustone,
    gray-scale, or colour digital still images. This Recommendation | International
    Standard ? specifies a process for converting source image data to compressed
    image data; ? specifies processes for converting compressed image data to reconstructed
    image data; ? specifies coded representations for compressed image data; ? provides
    guidance on how to implement these processes in practice.
