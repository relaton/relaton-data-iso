abstract:
- language: en
  script: Latn
  content: 'The purpose of this standard is to describe the parameters and methods of testing natural stones relating to water absorption, bulk density, bulk specific gravity, and open porosity at atmospheric pressure and ambient temperature; it also defines units of measurement, conversions and range of applicability. This standard does not address the user''s responsibilities regarding safety concerns, health and environmental practices, and local regulatory considerations. NOTE: This method may be inappropriate for some rock types with very large voids (EX: Some travertines)'
