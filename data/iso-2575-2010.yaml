abstract:
- language: en
  script: Latn
  content: ISO 2575:2010 specifies symbols (i.e. conventional signs) for use on controls,
    indicators and tell-tales applying to passenger cars, light and heavy commercial
    vehicles and buses, to ensure identification and facilitate use. It also indicates
    the colours of possible optical tell-tales, which inform the driver of either
    correct operation or malfunctioning of the related devices.
