abstract:
- language: en
  script: Latn
  content: This document specifies a method for measuring the impact of fine bubbles
    (FBs) on membrane antifouling by employing the membrane fouling index measured
    under constant transmembrane pressure during crossflow filtration as the evaluation
    criterion. This method is applicable to various membrane treatment systems including
    ultrafiltration, nanofiltration, and reverse osmosis. Additionally, it is suitable
    for evaluating the water quality of different types of wastewater containing various
    pollutants such as particulates, colloids, and soluble organic pollutants.
