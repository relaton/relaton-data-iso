abstract:
- language: en
  script: Latn
  content: 'ISO 13400-1:2011 describes the general use cases and communication scenarios
    which are covered by an Internet Protocol-based vehicle communication standard.
    Each use case drives specific communication capabilities of the vehicle communication
    interface, for instance in order to be interoperable in an existing computer network.
    The diagnostic communication over Internet Protocol (DoIP) protocol supports the
    standardized service primitive interface as specified in ISO 14229-2. The descriptions
    in ISO 13400-1:2011 cover different application layer implementations, such as:
    enhanced vehicle diagnostics (system diagnostics beyond legislated functionality,
    non-emissions-related system diagnostics); WWH-OBD (World-Wide Harmonized On-Board
    Diagnostics) as specified in ISO 27145-2 and ISO 27145-3.'
