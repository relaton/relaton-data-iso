abstract:
- language: en
  script: Latn
  content: This part of ISO/TR 11548 specifies short identifiers for 8-dot Braille
    patterns in addition to the names specified in ISO/IEC 10646-1:2000. As there
    are many different code tables in use dealing with various character sets (e.g.
    Arabic, Chinese, Japanese, Latin) and for special purposes (e.g. chemistry, mathematics
    and music notation), this part of ISO/TR 11548-1 also defines a method of shifting
    between various Braille tables. This part of ISO/TR 11548 is intended to be used
    by users and manufacturers of 8-dot Braille input and output devices, interfaces
    and software for data exchange. This part of ISO/TR 11548 does not apply to 6-dot
    Braille, and does not specify any physical dimension of Braille characters.
