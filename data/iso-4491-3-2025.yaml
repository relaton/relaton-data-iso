abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the hydrogen-reducible
    oxygen content of metallic powders containing mass percentage of 0,05 % to 3 %
    oxygen. This document is applicable to unalloyed, partially alloyed or completely
    alloyed metal powders and also to mixtures of carbides and binder metal. This
    document is not applicable to powders containing lubricants or organic binders.
    This document can be extended to powders containing carbon by the use of a special
    catalytic device. This document is intended to be used in conjunction with ISO
    760 and ISO 4491-1.
