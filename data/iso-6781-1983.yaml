abstract:
- language: en
  script: Latn
  content: Specifies a qualitative method, by thermographic examination (infrared
    method), for detecting thermal irregularities in building envelopes. The method
    is used to identify wide variations in the thermal properties, including air tightness,
    of the components constituting the external envelopes of buildings. Does not apply
    to the determination of the degree of thermal insulation and air tightness of
    a structure.
