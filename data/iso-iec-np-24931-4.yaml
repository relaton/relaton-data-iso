abstract:
- language: en
  script: Latn
  content: This document specifies a technology-neutral reference model for metaverse systems and services. The reference model comprises functional components, relationships among the functional components, and system components that logically realize the functional components and their relationships. • The functional components include information networks; cloud computing and platforms; edge computing; sensors and actuators; real-world interaction; VR/AR/MR; virtual worlds; avatars; virtual-world interaction; 3D simulation; knowledge and semantic information processing; AI service integration; security and safety; and distributed ledger and digital asset services. • The relationships among the functional components describe how the components interact, depend on one another and exchange information to support integrated metaverse systems and services. They include the bidirectional integration of physical and virtual environments; interactions among users, avatars and virtual worlds; the coordination of computing, storage and information processing across cloud and edge computing environments; and the cross-cutting application of security, safety, distributed ledger and digital asset services. • The system components describe the logical system elements that realize the functional components and their relationships. They include logical interfaces that support communication and information exchange among system components and with external entities, devices, applications, services and platforms. • This document also provides a basis for defining domain-specific profiles that select applicable functional components, relationships and system components.
