abstract:
- language: en
  script: Latn
  content: 'This document specifies the procedure to measure or to verify the aiming
    of the luminous beams emitted by the front lighting devices installed on road
    motor vehicles excluding mopeds and motorcycles. This document prescribes the
    provisions specifying: a)       the test conditions and test area plane; b)      
    the preparation of the vehicle under test; c)        the procedure using equipment
    with a distant aiming screen; d)       the procedure using movable front-lighting
    testing system; e)       the photometric measurement.'
