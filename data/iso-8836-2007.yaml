abstract:
- language: en
  script: Latn
  content: ISO 8836:2007 specifies requirements for suction catheters made of plastic
    materials and intended for use in suction of the respiratory tract. Specialized
    suction catheters, e.g. those with more than one lumen and suction catheters without
    a terminal orifice, are excluded from the scope of this International Standard.
    Angled-tip suction catheters (e.g. Coudé catheters) and suction catheters with
    aspirator collectors are not considered to be specialized and are therefore included
    in the scope of ISO 8836:2007.
