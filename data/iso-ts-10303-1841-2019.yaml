abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1841:2019 specifies the application module for Annotated
    3D model equivalence assembly. The following are within the scope of ISO/TS 10303-1841:2019:
    representation of criteria for use in the equivalence validation of configuration
    and structure of annotated 3d model assemblies including relationships between
    an assembly and its component part and relationship between components; representation
    of criteria for use in the equivalence validation of configuration and structure
    of assemblies associated with corresponding inspection requirements; representation
    of criteria for use in the equivalence validation of configuration and structure
    of assemblies associated with corresponding assessment specification; representation
    of criteria for use in the equivalence validation of geometric properties of the
    whole assembly; representation of the inspection result of the equivalence validation
    of configuration and structure of assemblies.'
