abstract:
- language: en
  script: Latn
  content: ISO 15767:2009 provides recommendations for controlling the analytical
    uncertainty associated with aerosol collection medium instability, where collection
    medium or collection substrate includes any article used to collect particles
    (e.g. filter or foam material) as well as those supporting elements which must
    be analysed by weighing. ISO 15767:2009 is applicable to results compiled both
    from the literature and, if necessary and feasible, through laboratory experiment.
    Expected uncertainty associated with given aerosol capture methods is quantified
    where possible. Recommendations as to materials to be used are given. Means of
    minimizing uncertainty arising from instability are provided. Recommendations
    for the weighing procedure are given. A procedure for estimating weighing uncertainty
    is described. Finally, recommendations are given for the reporting of measured
    mass, including an uncertainty component and limits of detection and quantification.
