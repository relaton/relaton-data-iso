abstract:
- language: en
  script: Latn
  content: ISO 10819:2013 specifies a method for the laboratory measurement, data
    analysis, and reporting of the vibration transmissibility of a glove with a vibration-reducing
    material that covers the palm, fingers, and thumb of the hand. ISO 10819:2013
    specifies vibration transmissibility in terms of vibration transmitted from a
    handle through a glove to the palm of the hand in one-third-octave frequency bands
    with centre frequencies of 25 Hz to 1 250 Hz.
