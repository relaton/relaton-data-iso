abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the growth rate of small
    surface cracks in an aqueous environment (including atmospheric exposure) based
    on measurement of the change in size of the crack with exposure time. The methodology
    can be applied to stress corrosion and corrosion fatigue crack propagation. It
    also describes the varied methodologies for the generation of crack precursors
    including accelerated generation of single pits. Industries for whom this document
    is relevant include power generation (including nuclear), oil and gas, aerospace
    and automotive.
