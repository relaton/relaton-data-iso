abstract:
- language: en
  script: Latn
  content: This document specifies the minimum information to be included in the product specifications of time-varying (4D) 3D scanners, that is, scanners that capture the geometry and attributes of objects that change shape or position over time, as a time sequence of 3D models, in order to ensure consistency and to enable users to make meaningful comparisons of scanner features and performance characteristics. It further specifies the scanner parameter settings and environmental conditions to be recorded together with the scan result, in order to facilitate the interpretation, reproduction, and subsequent processing of the 3D scanned data. This document is Part 3 of a series. Surface 3D scanning is covered by Part 1 and volumetric 3D scanning by Part 2. Outside the scope of this document are 3D digitizing devices that use a contact probe to acquire positional data, motion capture systems that record only the trajectories of markers or joints without capturing continuous surface geometry, and safety-related requirements for 3D scanners and their processes, which are addressed by other standards.
