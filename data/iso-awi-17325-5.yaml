abstract:
- language: en
  script: Latn
  content: This document specifies the composition, technical requirements, test methods,
    inspection, marking, packaging, transportation and storage of anti-overturning
    devices for oil containment booms. This document applies to the manufacture and
    inspection of anti-overturning devices for oil containment booms used in marine
    environmental protection. Anti-overturning devices for oil containment booms used
    in other aquatic ecological environments with rapid water flow may also refer
    to this document.
