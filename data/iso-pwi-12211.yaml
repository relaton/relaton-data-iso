abstract:
- language: en
  script: Latn
  content: ISO 12211:2012 specifies requirements and gives recommendations for the
    mechanical design, materials selection, fabrication, inspection, testing and preparation
    for shipment of spiral plate heat exchangers for the petroleum, petrochemical
    and natural gas industries. ISO 12211:2012 is applicable to stand‑alone spiral
    plate heat exchangers and those integral with a pressure vessel.
