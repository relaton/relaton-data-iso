abstract:
- language: en
  script: Latn
  content: This International Standard specifies methods for sampling adhesives and
    related products, in order to obtain uniform samples of convenient size which
    are adequately representative of the product being sampled. The sample or samples
    so obtained are suitable for examination and preparation prior to testing. The
    methods are applicable to products which require the addition and mixing in of
    catalysts or hardeners prior to their application, by sampling each component
    separately. The methods are not applicable, however, to sampling from a stream
    of adhesive (in this case the samples can be prepared in accordance with ISO 8213).
    This International Standard does not apply to animal glues.
