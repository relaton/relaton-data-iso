abstract:
- language: en
  script: Latn
  content: This document specifies principles, tools, and processes for performance
    management, including performance goal planning, performance monitoring, performance
    evaluation, performance feedback, and digital management processes in the process
    of performance management. It provides guidelines for evaluating the performance
    of employees efficiently and effectively and supporting employees in a way that
    provides high-quality work, development, and career satisfaction. Provided that
    the organization has a clear strategic goal orientation and needs to manage and
    evaluate the work performance of its employees, any organization of any size,
    type, structure, and nature can use these guidelines to carry out performance
    management. Different types of organizations can select suitable performance management
    methods and tools according to their characteristics and needs.
