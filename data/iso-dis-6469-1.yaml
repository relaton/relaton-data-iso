abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements for rechargeable energy storage
    systems (RESS) of electrically propelled road vehicles for the protection of persons.
    It does not provide the comprehensive safety information for the manufacturing,
    maintenance and repair personnel. NOTE 1 Requirements for motorcycles and mopeds
    are specified in ISO 13063 and ISO 18243. NOTE 2 Additional safety requirements
    can apply for RESS that can be recharged by means different from supplying electric
    energy (e.g. redox flow battery).
