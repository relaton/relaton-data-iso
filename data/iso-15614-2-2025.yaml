abstract:
- language: en
  script: Latn
  content: 'This document specifies how a preliminary welding procedure specification
    (pWPS) is qualified by welding procedure tests. This document applies to production
    welding, repair welding and build-up welding. This document defines the conditions
    for the execution of welding procedure tests and the range of qualification for
    welding procedures for all practical welding operations within the qualification
    of this document. This document applies to the arc welding of wrought and cast
    aluminium and its alloys. In this document the term aluminium stands for aluminium
    and for aluminium alloys. This document does not apply to finishing welding of
    aluminium castings, which is addressed in ISO 15614-4. Arc welding of aluminium
    is covered by the following welding processes in accordance with ISO 4063:2023:
    131 — MIG welding with solid wire electrode; 141 — TIG welding with solid filler
    material (wire/rod); 142 — Autogenous TIG welding; 15 — plasma arc welding.'
