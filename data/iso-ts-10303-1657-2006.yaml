abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1657:2006 specifies the application module for Component
    feature. ISO/TS 10303-1657:2006 deals with the representation of component features
    and the their relationships in a physical design view. This is a fundamental enabling
    model for further specialization in ISO 10303. This application model supports
    specialization of component features as terminals enabling application of connectivity
    properties and requirements and supports assignment of the relationship between
    a component feature its assignment to a part feature in the physical usage view.
    This is an application of intellectual property control and management for the
    design organization as it allows the design organization to maintain one master
    copy from which published models or catalogue data may be derived. The following
    are within the scope of ISO/TS 10303-1657:2006: the definition of features of
    components in the assembly of a design view;the relationship between component
    features of various kinds such as make from; the assignment of component features
    to part features in a usage view; the definition of component terminals and information
    if they can be exchanged with other terminals termincals, called swapping.'
