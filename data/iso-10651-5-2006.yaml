abstract:
- language: en
  script: Latn
  content: ISO 10651-5:2006 specifies the basic safety and essential performance requirements
    for gas-powered emergency resuscitators intended for use with humans by first
    responders. This equipment is intended for emergency field use and is intended
    to be continuously operator attended in normal use. ISO 10651-5:2006 also specifies
    the requirements for resuscitator sets. ISO 10651-5:2006 is not applicable to
    electrically-powered resuscitators.
