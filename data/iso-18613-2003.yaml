abstract:
- language: en
  script: Latn
  content: ISO 18613:2003 specifies the maximum defects and damage allowed before
    a flat wooden pallet shall be repaired, and defines the minimum repair criteria
    that shall be used. This European Standard is applicable to wooden flat pallets
    repaired with wood based components. NOTE The maximum allowed defects and damage
    for pallets are described in this standard and the annexes A to D show examples
    of defects and damage which make the widely used pallets unacceptable for use.
    For other pallet types similar criteria should be set up. The repair criteria
    for pool and rental pallets are controlled by their respective controlling operators/owners,
    and may be subject to a licence.
