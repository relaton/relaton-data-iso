abstract:
- language: en
  script: Latn
  content: ISO 14026:2017 provides principles, requirements and guidelines for footprint
    communications for products addressing areas of concern relating to the environment.
    ISO 14026:2017 also provides requirements and guidelines for footprint communication
    programmes, as well as requirements for verification procedures. ISO 14026:2017
    does not address the quantification of a footprint, nor does it address the communication
    of footprints that are not related to the environment, e.g. footprints addressing
    social or economic issues. In particular, footprint communications relating to
    the economic and social dimensions of sustainable development are outside the
    scope of ISO 14026:2017. Footprint communications relating to organizations are
    also outside the scope of ISO 14026:2017.
