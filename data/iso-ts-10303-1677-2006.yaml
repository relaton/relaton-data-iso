abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1677:2006 specifies the application module for Functional
    decomposition to interconnect design. ISO/TS 10303-1677:2006 deals with the representation
    of the information needed to describe the assignment of a functional unit in a
    network definition to specific elements in the interconnect substrate design.
    ISO/TS 10303-1677:2006 defines the different means of performing swapping within
    a design. The types of swapping covered are the ones between gates in a single
    printed part, between identical gates in different instances of a printed part,
    and between terminals of identical type and behaviour in a gate. The following
    are within the scope of ISO/TS 10303-1677:2006: allocation of a functional unit
    in a hierarchical network definition to a transmition line in the interconnect
    design;allocation of a functional unit in a hierarchical network definition to
    a fabrication joint line in the interconnect design.'
