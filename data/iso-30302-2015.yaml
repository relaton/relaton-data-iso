abstract:
- language: en
  script: Latn
  content: ISO 30302:2015 gives guidance for the implementation of a MSR in accordance
    with ISO 30301. This International Standard is intended to be used in conjunction
    with ISO 30300 and ISO 30301. This International Standard does not modify and/or
    reduce the requirements specified in ISO 30301. It describes the activities to
    be undertaken when designing and implementing a MSR. ISO 30302:2015 is intended
    to be used by any organization implementing a MSR. It is applicable to all types
    of organization (e.g. commercial enterprises, government agencies, non-profit
    organizations) of all sizes.
