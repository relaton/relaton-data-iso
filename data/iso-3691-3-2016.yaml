abstract:
- language: en
  script: Latn
  content: 'ISO 3691-3:2016 gives safety requirements and the means for their verification,
    additional to those of ISO 3691‑1, for industrial trucks with a vertical, non-tilting
    mast: a) those trucks having an elevating operator position, and order‑picking
    trucks, as defined in ISO 5053‑1, where the elevating operator position and the
    load‑handling device lifts to a height of more than 1 200 mm above ground level;
    b) lateral- and front-stacking trucks, as defined in ISO 5053‑1, designed to travel
    with a load-handling device elevated more than 1 200 mm above ground level, with
    the load-handling device elevated, lowered or laterally displaced, laden or unladen,
    while the truck is travelling. These trucks are designed to travel indoors on
    a smooth, level surface (e.g. concrete) and can be guided, unguided, or both,
    when in use; they are not intended to tow or push. ISO 3691-3:2016 is not applicable
    to stacker trucks which handle two loads, one on the forks and the other on the
    support arms, this type of truck being covered by ISO 3691‑1. It is not applicable
    to trucks with an elevating operator position up to and including 1 200 mm, or
    to trucks specifically designed to travel with an elevated load having a fork
    height up to and including 1 200 mm above ground level. It is not applicable to
    low-level order pickers with elevating operator''s position up to and including
    1 200 mm lift height which can be equipped with an additional load lifting device
    having a maximum lift height of 1 800 mm from ground level. ISO 3691-3:2016 deals
    with all significant hazards, hazardous situations, or hazardous events, as listed
    in Annex A, relevant to the applicable machines when used as intended and under
    conditions of misuse which are reasonably foreseeable by the manufacturer. It
    does not establish requirements for hazards that can occur when using trucks on
    public roads or when operating in potentially explosive atmospheres. Regional
    requirements, additional to the requirements given in this part of ISO 3691, are
    addressed in ISO/TS 3691‑7 and ISO/TS 3691‑8.'
