abstract:
- language: en
  script: Latn
  content: 'This document gives guidance on enhancing the involvement and commitment
    of personnel within an asset management system to improve the overall efficiency
    of translation of asset management objectives into results. This involves an evaluation
    of human and cultural factors that influence: a)       the effectiveness of adoption
    of operational requirements and policies established by the organization’s strategic
    asset management plan (SAMP) across the organization; b)       the degree of involvement
    that personnel have in the development and execution of asset management plans
    and strategies; c)        the level of knowledge and awareness that personnel
    have of required activities established by asset management plans and strategies;
    d)       the impact of competence on the ability of personnel to execute these
    activities; e)       the process by which establishing development plans drives
    continual improvements in asset management system efficiency; f)         the recognition
    of mutual dependencies in teams that contribute to organizational performance.
    These elements apply to the leadership accountable for the overall functioning
    of the asset management system, as well as to personnel responsible for the development
    and execution of plans, strategies and activities. This document is applicable
    to any organization, regardless of its type or size. Additionally, while asset
    management is not necessarily conducted within the construct of an asset management
    system, the principles within the guidance set out in this document can be more
    broadly applied regardless of the nature of asset management within an organization.'
