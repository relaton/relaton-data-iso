abstract:
- language: en
  script: Latn
  content: Applies to nuts with nominal thread diameters up to and including 39 mm,
    specific mechanical requirements, widths across flats as specified in ISO 272,
    nominal heights greater than or equal to half the nominal diameter of the internal
    thread, made of carbon steel or low alloy steel. Does not apply to nuts requiring
    special properties (such as weldability, corrosion resistance, etc.). Values apply
    when tests are made at room temperature.
