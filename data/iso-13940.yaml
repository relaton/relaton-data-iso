abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for a system of concepts needed
    to define care processes that support the continuity of care in the health sector. 
    It is applicable to processes that support social care as well as clinical care. 
    Systems of concepts conforming to this document can be used to define: -     
    the information viewpoint within logical reference models as a common basis for
    semantic interoperability at international, national or local levels; -      information
    systems; -      information needed to support various types of care processes
    and their interaction. This document does not specify how to perform specific
    care processes. This document does not cover research processes in the context
    of social and clinical care, welfare and educational processes.'
