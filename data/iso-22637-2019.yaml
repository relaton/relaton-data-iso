abstract:
- language: en
  script: Latn
  content: This document specifies a test method to measure the electrical resistance
    as a material physical parameter of an adhesive film and composites of floor covering
    material and adhesive film. The electrical resistance is reciprocal to the electrical
    conductivity. This laboratory method does not take account of all influences which
    can occur in practice. This method applies to the determination of the electrical
    resistance of adhesive films on glass and of composites of floor coverings, adhesively
    bonded to a fibre cement substrate R4 and R5 (see Clause 3).
