abstract:
- language: en
  script: Latn
  content: ISO 7493:2006 specifies requirements, recommendations and test methods
    for the operator's stool in the dental office as well as requirements for the
    manufacturer's instructions for use and for marking and packaging. It also covers
    recommendations to manufacturers on the design of operator's stools. For purposes
    of ISO 7493:2006, the term "dental operator" includes dentists, dental assistants
    and dental hygienists.
