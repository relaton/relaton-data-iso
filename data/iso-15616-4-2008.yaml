abstract:
- language: en
  script: Latn
  content: ISO 15616-4:2008 provides minimum requirements for acceptance testing,
    using practical test methods, for CO2-laser beam machines for high quality welding
    and cutting in two dimensions (2-D), having a fixed workpiece on the platen and
    moving optics. ISO 15616-4:2008 is not applicable to CO2-laser beam machines which
    use an articulated robot, nor to those which include a work station, such as a
    welding positioner, fixed board cutter, etc. ISO 15616-4:2008 does not cover hazard
    protection devices, such as those for discharging chips and particles generated
    during welding and cutting.
