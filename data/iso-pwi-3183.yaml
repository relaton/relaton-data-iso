abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the manufacture of two product
    specification levels (PSL 1 and PSL 2) of seamless and welded steel pipes for
    use in pipeline transportation systems in the petroleum and natural gas industries.
    This document supplements API Spec 5L, 46th edition (2018), the requirements of
    which are applicable with the exceptions specified in this document. This document
    is not applicable to cast pipe.
