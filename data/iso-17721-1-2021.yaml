abstract:
- language: en
  script: Latn
  content: This document specifies test methods for evaluating the antibacterial activity
    of glazed and unglazed ceramic tile surfaces with incorporated antibacterial agents.
    Secondary effects on ceramic tile surfaces due to antibacterial treatments, such
    as changes in chemical resistance, stain resistance or small colour differences,
    are not covered by this document. For chemical resistance refer to ISO 10545-13,
    for stain resistance refer to ISO 10545-14 and for colour differences refer to
    ISO 10545-16. Any results obtained with this document will always refer to this
    document and the conditions used. Results obtained with this document indicate
    antibacterial activity under the specified experimental conditions used herein,
    and do not reflect activity under other circumstances where a variety of factors,
    such as temperature, humidity, different bacterial species, nutrient conditions,
    etc., are considered.
