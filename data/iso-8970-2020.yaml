abstract:
- language: en
  script: Latn
  content: This document specifies a method based on density, for the selection of
    pieces of wood used in determining the strength and stiffness properties of joints
    between members of structural timber made with mechanical fasteners. It is intended
    to be used in conjunction with a test standard specifying a test method. It is
    assumed that the wood pieces are conditioned to the relevant conditions, that
    the wood density is normally distributed and that any deviations are reported.
    This document is applicable only to specimens of structural timber. NOTE It is
    emphasized that the wood density is only one of the properties that can influence
    the strength of a joint. Other relevant properties are, for example, growth-ring
    size and orientation, toughness and hardness.
