abstract:
- language: en
  script: Latn
  content: ISO 16911-2:2013 describes specific requirements for automated measuring
    system (AMS) flow monitoring. It is partly derived from EN 14181 which is the
    general document on the quality assurance of AMSs and is applicable in conjunction
    with that document. ISO 16911-2:2013 specifies conditions and criteria for the
    choice, mounting, commissioning and calibration of AMSs used for determining the
    volume flow rate from a source in ducted gaseous streams. ISO 16911-2:2013 is
    applicable by correlation with the manual reference methods described in ISO 16911-1.
    ISO 16911-2:2013 is primarily developed for monitoring emissions from waste incinerators
    and large combustion plants. From a technical point of view, it can be applied
    to other processes for which flow rate measurement is required with a defined
    and minimized uncertainty.
