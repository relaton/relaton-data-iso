abstract:
- language: en
  script: Latn
  content: ISO 22915-16:2014 specifies tests for verifying the stability of pedestrian-propelled
    trucks. It is applicable to straddle, pallet and platform stacker trucks with
    capacities not exceeding 1 000kg, with manual or battery-powered lift, scissors
    lift pallet trucks with lift heights up to 1 000 mm and rated capacity up to 1
    000kg, with manual or battery-powered lift, and platform trucks. It also applies
    to trucks operating under the same conditions when equipped with load-handling
    attachments. It is not applicable to trucks with retractable devices such as a
    mast or fork.
