abstract:
- language: en
  script: Latn
  content: ISO 13433:2006 specifies a method to determine the resistance of geosynthetics
    to penetration by a steel cone dropped from a fixed height. The degree of penetration
    is an indication of the behaviour of the geosynthetic when sharp stones are dropped
    on its surface. The method is generally applicable to geosynthetics. However,
    the validity of this test for some types of products should be considered carefully,
    as the test principle may not be applicable.
