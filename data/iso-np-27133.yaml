abstract:
- language: en
  script: Latn
  content: To produce a new ISO standard for the quantitative analysis of human lung tissue samples for asbestos fibres by transmission electron microscopy. This will include the sample preparation, the analysis by analytical transmission electron microscopy (including selected area electron diffraction and energy-dispersive x-ray spectroscopy) and the calculation and reporting of a final result. This standard will be applicable to human lung tissue samples which have been fixed by commonly-used methods (including paraffin, formalin or alcohol), or to unfixed human lung tissue samples.
