abstract:
- language: en
  script: Latn
  content: 'This document gives technical requirements and guidance on the establishment
    or revision of standardized reference methods used for the analysis of microorganisms
    in: —    products intended for human consumption; —    products for feeding animals;
    —    environmental samples in the area of food and feed production and handling;
    —    samples from the primary production stage. This document specifies the technical
    stages of the establishment of a new standardized reference method and of the
    revision of an existing standardized reference method. It includes, in particular,
    requirements and guidance on the validation of the selected method. This document
    is intended to be implemented in particular by ISO/TC 34/SC 9 and its corresponding
    structure at CEN level, which is CEN/TC 463.'
