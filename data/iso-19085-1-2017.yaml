abstract:
- language: en
  script: Latn
  content: ISO 19085-1:2017 gives the safety requirements and measures to reduce risks
    related to woodworking machines arising during operation, adjustment, maintenance,
    transport, assembly, dismantling, disabling and scrapping and which are common
    to machines used in the woodworking industry. It is applicable to woodworking,
    stationary and displaceable machines when they are used as intended and under
    the conditions foreseen by the manufacturer. NOTE 1 For relevant but not significant
    hazards, e.g. sharp edges of the machine frame, see ISO 12100:2010. ISO 19085-1:2017
    is intended to be used in conjunction with the other parts of ISO 19085, applicable
    to specific machine types. ISO 19085-1:2017 is not applicable to machines intended
    for use in potential explosive atmospheres or to machines manufactured prior to
    the date of its publication. NOTE 2 Machines for capturing and extracting dust
    are covered by EN 12779 and EN 16770.
