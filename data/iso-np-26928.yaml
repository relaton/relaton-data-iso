abstract:
- language: en
  script: Latn
  content: This document defines terms and establishes a classification framework for academic, scientific, technological and skills competition events. It covers competition events in which participants are primarily assessed on knowledge, research capability, scientific inquiry, technological application, engineering practice, innovation capability, professional or vocational skills, practical operation, problem-solving ability or competence-based performance. This document provides classification criteria for such competition events, including purpose, subject area, participant group, organizational level, competition format, delivery mode, assessment method, outcome type, risk level and stakeholder involvement. This document is applicable to stakeholders involved in the planning, organization, operation, evaluation, statistical analysis or improvement of academic, scientific, technological and skills competition events. This document does not specify discipline-specific competition rules, scoring methods, technical requirements, qualification criteria, certification requirements or professional competence standards for any particular academic subject, scientific field, technological area or vocational skill. This document excludes sports competitions, cultural and artistic competitions, entertainment competitions and their specific technical, sporting or performance rules.
