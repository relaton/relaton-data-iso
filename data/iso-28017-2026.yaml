abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for two types, seven classes and
    three grades of wire- or textile-reinforced dredging hoses with nominal sizes
    ranging from 100 to 1 300. Such hoses are suitable for the delivery or suction
    of seawater or freshwater mixed with silt, sand, coral and small stones with a
    specific gravity in the range from 1,0 to 2,3 at ambient temperature ranging from
    -10 °C to +40 °C or for low-temperature hoses (designated -LT) ranging from -20 °C
    to +40 °C. This document covers two types of hose, as follows: type 1: floating
    type, for delivery only, which includes flotation material to give the hose buoyancy;
    type 2: submarine type for delivery and suction.'
