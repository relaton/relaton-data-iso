abstract:
- language: en
  script: Latn
  content: This document describes the general principles of train detection for operations
    and services which are applied to any railway. This document provides the link
    of train detection with management of operational principles. It includes descriptions
    of operational and environmental conditions affecting train detection and impacts
    on operations. This document provides non-technical guidance for supporting the
    choice of a suitable train detection method relating to railway operations, for
    new lines and upgrade or renewal of train detection systems. This document excludes
    all technical aspects.
