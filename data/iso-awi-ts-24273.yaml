abstract:
- language: en
  script: Latn
  content: 'This document presents an overview of the CFD models used in fire safety
    engineering but does not aim to provide an exhaustive description of these models.
    It does not deal with CFD codes verification method. The configurations likely
    to be encountered in fire safety engineering and relevant to be dealt with in
    the framework of this guidance are identified. This work is limited to the use
    of CFD tools for the search of fire consequences developing in enclosure following
    the ignition of solid fuel. This document does not deal with modelling of: - jet
    fire, - open field fire, - under-ventilated fire, - metal fire causing splashes
    of molten metal, - liquefiable solid fire, - egress, - suppression, - premixed
    combustion, - flashover, - condensation of gas in smoke or deposit on the floor
    or on walls, - fire extinction induced by low oxygen concentrations or low temperature.
    Moreover, this document does not deal with the structural behaviour of a burned
    building. This Technical Specification is not intended as a basis for regulation.'
