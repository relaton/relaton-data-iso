abstract:
- language: en
  script: Latn
  content: ISO 10789:2011 describes the processes and the requirements for the management
    of information/documentation within space programmes and projects. The requirements
    specified in ISO 10789:2011 apply to and affect the customer and supplier at all
    levels. When viewed from the perspective of a specific project context, the requirements
    defined in ISO 10789:2011 need to be tailored to match the specific requirements
    of the particular profile and circumstances of a project. Defence information
    and documentation are not part of the scope of ISO 10789:2011.
