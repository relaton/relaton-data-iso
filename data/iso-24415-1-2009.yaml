abstract:
- language: en
  script: Latn
  content: ISO 24415-1:2009 specifies requirements and test methods for the friction
    between the tips for assistive products for walking and the walking surface. The
    requirements and test method are based on a usage of tips for ordinary gait on
    the dry and flat walking surface. ISO 24415-1:2009 is not applicable to tips manufactured
    for special purposes.
