abstract:
- language: en
  script: Latn
  content: Describes the procedure and the precautions to be taken in drawing representative
    samples of ethylene in the liquid phase stored at -100 °C and in the gaseous phase,
    for the purpose of their analysis excluding the determination of water content,
    other polar components and hydrocarbons heavier than C5. In an annex a diagrammatic
    representation is given of a system for the removal of the portion of the sample
    not used in the analysis.
