abstract:
- language: en
  script: Latn
  content: ISO 16236:2013 specifies the test method for the determination of the volume
    and the concentration of the drainable volume of sprayers, in connection to the
    emptying of the diluted residue of the spray tank by using its outlet and other
    outlets allowing draining (e.g. suction filter, filling connection) at the end
    of the cleaning procedure. ISO 16236:2013 applies to agricultural sprayers used
    for crop protection and liquid fertiliser applications for both brand new sprayers
    and sprayers already in use.
