abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for determining the tensile properties
    of pipes made of unplasticized poly(vinyl chloride) (PVC-U), oriented unplasticized
    poly(vinyl chloride) (PVC-O), chlorinated poly(vinyl chloride) (PVC-C) and high-impact
    poly(vinyl chloride) (PVC-HI, PVC-M or PVC-A), and in particular the following
    properties: — the stress at yield and stress at break; — the elongation at break.
    NOTE The general method of test for the determination of the tensile properties
    of thermoplastics pipes is given in ISO 6259‑1. This document also gives, for
    information purposes only, the corresponding basic specifications in Annexes A,
    B, C and D.'
