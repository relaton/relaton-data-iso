abstract:
- language: en
  script: Latn
  content: ISO/TS 18684:2015 concerns whole watches, in which all or some of the components
    of the external parts are made of hard material, with the exception of watch glasses.
    It applies to all elements made in massive material whose hardness is greater
    than or equal to 1 200 Vickers. ISO/TS 18684:2015 describes the performance in
    terms of resistance to mechanical and thermal shocks, to corrosion, to scratches,
    to sunlight exposure and also to the wear of its components.
