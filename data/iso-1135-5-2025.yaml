abstract:
- language: en
  script: Latn
  content: This document specifies requirements for single use transfusion sets for
    use with pressure infusion equipment capable of generating pressures. It ensures
    compatibility with containers for blood and blood components as well as intravenous
    equipment. This document also provides guidance on specifications relating to
    the quality and performance of materials used in transfusion sets, to present
    designations for transfusion set components, and to ensure the compatibility of
    sets with red cell and plasma blood components. NOTE            In some countries,
    the national pharmacopoeia or other national regulations are legally binding and
    take precedence over this document.
