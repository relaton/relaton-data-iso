abstract:
- language: en
  script: Latn
  content: 'ISO/TS 22745-1:2009 contains an introduction to ISO/TS 22745. It includes:
    the scope of ISO/TS 22745; requirements that all open technical dictionaries must
    follow; a description of the architecture of ISO/TS 22745; an overview of ISO/TS
    22745, including a summary of the content of the other parts of ISO/TS 22745;
    a discussion of the differences between ISO/TS 22745 and ISO 13584, and between
    ISO/TS 22745 and ISO 15926; and the location of a website with additional information
