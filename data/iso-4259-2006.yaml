abstract:
- language: en
  script: Latn
  content: ISO 4259:2006 covers the calculation of precision estimates and their application
    to specifications. In particular, it contains definitions of relevant statistical
    terms, the procedures to be adopted in the planning of an inter-laboratory test
    programme to determine the precision of a test method, the method of calculating
    the precision from the results of such a programme, and the procedure to be followed
    in the interpretation of laboratory results in relation both to precision of the
    test methods and to the limits laid down in specifications. The procedures in
    ISO 4259:2006 have been designed specifically for petroleum and petroleum-related
    products, which are normally homogeneous. However, the procedures described in
    this International Standard can also be applied to other types of homogeneous
    products. Careful investigations are necessary before applying ISO 4259:2006 to
    products for which the assumption of homogeneity can be questioned.
