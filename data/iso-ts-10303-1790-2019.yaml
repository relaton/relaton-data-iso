abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1790:2019 specifies the application module for Parameterization
    and variational representation. The following are within the scope of ISO/TS 10303-1790:2019:
    association of parameters and constraints with models at the representation level,
    to create variational models of products, plans, processes or organizations; representation
    of models that are incompletely defined in the sense that certain values in the
    model may be regarded as not fully constrained; items within the scope of application
    module Elemental geometric shape, ISO/TS 10303-1004; items within the scope of
    application module Maths space, ISO/TS 10303-1091.'
