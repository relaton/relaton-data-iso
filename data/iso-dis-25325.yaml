abstract:
- language: en
  script: Latn
  content: This standard specifies the requirements for the training of citizen science
    divers. The standard shall have a broad scope so as to be applicable to all disciplines
    of science. This document is applicable to all recreational divers independent
    of any scientific background (unlike the ISO 8804 standard series which a primarily
    directed at the scientific diving community). A citizen science diver is competent
    in basic underwater scientific methodologies and protocols and shall be able to
    assist in scientific diving activities. This standard will specify competencies,
    prerequisites for training, Introductory information, Required theoretical knowledge,
    Required practical skills, Practical training parameters and Evaluation criteria
    for training systems aimed at training citizen science divers.
