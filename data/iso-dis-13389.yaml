abstract:
- language: en
  script: Latn
  content: This document is applicable to generic millimeter-wave radars which are intended to be installed on all types of road vehicles to measure or detect the surroundings of the vehicle. This document specifies test methods for detection performance of automotive exterior sensing millimeter-wave radar.This document does not address the impact of weather, secondary surface, blockage or misalignment on detection performance, nor aspects of cybersecurity, hardware aging.
