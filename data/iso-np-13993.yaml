abstract:
- language: en
  script: Latn
  content: This document specifies a uniform method for the sampling and inspection
    of complete and incomplete alpine ski-binding-boot systems used in rental operations.
    This document is intended for any facility which rents complete and incomplete
    alpine ski-binding-boot systems as for example when the skier owns the boots.
    This document is not applicable for alpine touring ski-binding-boot systems. This
    document is not applicable for complete and incomplete alpine ski-binding-boot
    systems which are rented for 15 days or more. NOTE 1 A period of less than 15
    days is common for equipment being rented. NOTE 2 ISO 11088 gives a method for
    testing if the equipment is owned or rented for 15 days or more.
