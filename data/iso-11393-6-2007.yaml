abstract:
- language: en
  script: Latn
  content: ISO 11393-6:2007 specifies requirements for the protection offered by upper
    body protectors against cutting by a hand-held chain-saw. It also specifies the
    procedures for sampling and pre-treatment of upper body protectors, the measurement
    of the protective coverage, the apparatus and test methods for assessing resistance
    to cutting, and the practical performance test for evaluating ergonomic properties.
