abstract:
- language: en
  script: Latn
  content: This document specifies requirements for language-learning services. These
    include any language-learning services that are addressed to language learners
    themselves as well as to interested parties who are acquiring the services for
    the benefit of learners. The key features of any such service are that the goals
    of learning are defined and evaluated, and that it involves interaction with the
    learner. The instruction may be delivered face-to-face, be mediated by technology
    or be a blend of both. In cases where the language-learning services are provided
    by an organization that delivers products (goods and services) or other learning
    services in addition to language-learning services, this document only applies
    to language-learning services.
