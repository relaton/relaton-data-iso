abstract:
- language: en
  script: Latn
  content: This document specifies the procedure for evaluating the accuracy of quartz
    watches, individually and by lots (see Annex A which presents the methods for
    statistical evaluation of accuracy by lot), and the relationship between the accuracy
    tested and the accuracy classification given by the manufacturer. It applies to
    quartz watches having accompanying documents on which the accuracy classification
    is indicated.
