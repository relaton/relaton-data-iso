abstract:
- language: en
  script: Latn
  content: ISO/TS 19293:2018 specifies requirements for a record of a dispense of
    a medicinal product. It is intended to be adopted by detailed, implementable specifications,
    such as interoperability standards, system specifications, and regulatory programs.
    ISO/TS 19293:2018 applies to information systems in which a dispense of a medicinal
    product is registered, and the systems that consume such information. These systems
    are usually in pharmacies or other healthcare institutions. This document does
    not necessarily apply to non-pharmacy shops or other non-clinical systems (e.g.
    supermarket cashiers). The scope of ISO/TS 19293:2018 includes the activities
    relating to the dispensing of a medicinal product and the information content
    for the capture of structured information produced in those events. These activities
    include any actual dispense, cancellation or other outcome that may have occurred
    at the time of planned or actual dispense. In other words, the dispense record
    also contains information that medication was expected to be dispensed but was
    not dispensed.
