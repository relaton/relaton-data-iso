abstract:
- language: en
  script: Latn
  content: This standard specifies the requirements of energy-based green ITS services
    on nomadic devices not only for encouraging eco-friendly driving to bus drivers
    but also for operating public transportation within the city in order to efficient
    energy use and CO2 emissions reduction. This document defines the service framework
    for sustainable urban public transport operation and management which includes
    as follows; - eco-friendly driving factors and indices applicable to drivers of
    urban public transport (i.e. buses) - indicators to monitor eco driving behaviour
    of urban public transport (i.e. buses) according to the guidelines provided to
    the drivers The standard also defines the data, interfaces, and functions of the
    framework for urban public transportation operations and management utilizing
    nomadic devices between users, service providers, data platform, and cloud server.
