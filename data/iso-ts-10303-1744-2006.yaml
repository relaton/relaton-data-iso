abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1744:2006 specifies the application module for Discrete shield.
    The following are within the scope of ISO/TS 10303-1744:2006: Inclusion of components
    specifically for shielding purposes in an assembly design; Design specific layout
    of path for cross section of shields in an assembly; Assembly design with specified
    requirements allocated to components; items within the scope of application module
    Assembly component placement requirements, ISO/TS 10303-1634; items within the
    scope of application module Assembly physical requirement allocation, ISO/TS 10303-1648;
    items within the scope of application module Physical connectivity definition,
    ISO/TS 10303-1755.'
