abstract:
- language: en
  script: Latn
  content: This document specifies the performance requirements, test methods, design
    requirements, identification and marking information for upper body protectors
    that offer protection against cutting by hand-held chainsaws. It also specifies
    procedures for sampling and pre-treatment of upper body protectors, the measurement
    of the protective coverage, the apparatus and test methods for assessing resistance
    to cutting, and the practical performance test for evaluating ergonomic properties.
    Guidance on chainsaw use and the selection of appropriate upper body protectors
    is given in Annex A.
