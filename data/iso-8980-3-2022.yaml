abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the transmittance properties of
    uncut and unmounted finished spectacle lenses, including attenuation of solar
    radiation. This document is not applicable to —    spectacle lenses having specific
    transmittance or absorption characteristics prescribed for medical reasons, —   
    products to which specific personal protective equipment transmittance standards
    apply, and —    products intended for direct observation of the sun, such as for
    solar-eclipse viewing. NOTE 1    By reference to ISO 21987 and ISO 14889, this
    document also applies to lenses mounted in spectacles. NOTE 2    Optical and geometric
    requirements are given for uncut finished spectacle lenses in ISO 8980‑1 and ISO 8980‑2,
    and for mounted lenses, in ISO 21987.
