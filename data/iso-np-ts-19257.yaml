abstract:
- language: en
  script: Latn
  content: This document specifies two methods for the characterization and quantification of functional groups on silica nanoparticles. The two methods described are solution quantitative nuclear magnetic resonance (qNMR) to measure total functional group and X-ray photoelectron spectroscopy (XPS) to measure surface functional groups.
