abstract:
- language: en
  script: Latn
  content: 'This document establishes the following items for any or all biometric
    sample types as necessary: —     terms and definitions that are useful in the
    specification and use of quality measures; —     purpose and interpretation of
    biometric quality scores; —     motivation for developing biometric sample datasets
    for the purpose of quality score normalization; —     format for exchange of quality
    assessment algorithm results; —     methods for aggregation of quality scores;
    —     methods for evaluating the efficiency of quality assessment algorithms.
    The following are outside the scope of this document: —     specification of minimum
    requirements for sample, module, or system quality scores; —     standardization
    of quality assessment algorithms; —     assessment of utility of biometric samples
    or references for human examiners.'
