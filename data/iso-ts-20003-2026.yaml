abstract:
- language: en
  script: Latn
  content: This document provides human-machine interface (HMI) design specifications
    in case an HMI is needed to secure the safe and/or fully understood execution
    of over the air (OTA) software updates for passenger cars (including sport utility
    vehicles and light trucks) and commercial vehicles (including heavy trucks and
    buses). The vehicle operator benefits from knowing if an OTA update has been successful
    or not, if an OTA update will influence the operation of the vehicle, or if the
    OTA update influences the quality of a feature. HMI specifications for the OTA
    software update provide support in case an HMI is needed in normal conditions,
    emergencies, low battery, avoidance of inadvertent actuations, alerts or specific
    non-standard situations.
