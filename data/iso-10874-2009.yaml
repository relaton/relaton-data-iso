abstract:
- language: en
  script: Latn
  content: ISO 10874:2009 establishes a classification system for resilient, textile
    and laminate floor coverings. The classification is based on practical requirements
    for areas of use and intensity of use and is linked to the requirements specified
    in the relevant International Standard for each type of floor covering. ISO 10874:2009
    is also intended to provide guidance for manufacturers, specifiers and consumers,
    to enable them to choose the appropriate class of floor covering for any given
    area of use or specific room.
