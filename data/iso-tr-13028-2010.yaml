abstract:
- language: en
  script: Latn
  content: 'ISO/TR 13028:2010: establishes guidelines for creating and maintaining
    records in digital format only, where the original paper, or other non-digital
    source record, has been copied by digitizing; establishes best practice guidelines
    for digitization to ensure the trustworthiness and reliability of records and
    enable consideration of disposal of the non-digital source records; establishes
    best practice guidelines for the trustworthiness of the digitized records which
    may impact on the legal admissibility and evidential weight of such records; establishes
    best practice guidelines for the accessibility of digitized records for as long
    as they are required; specifies strategies to assist in creating digitized records
    fit for long-term retention; and establishes best practice guidelines for the
    management of non-digital source records following digitization. ISO/TR 13028:2010
    is applicable for use in the design and conduct of responsible digitization by
    all organizations undertaking digitization, either business process digitization
    or back capture digitization projects for records management purposes, as outlined
    in ISO 15489-1:2001 and ISO/TR 15801:2009. ISO/TR 13028:2010 is not applicable
    to: capture and management of born-digital records; technical specifications for
    the digital capture of records; procedures for making decisions about records''
    eventual disposition; technical specifications for the long-term preservation
    of digital records; or digitization of existing archival holdings for preservation
    purposes.'
