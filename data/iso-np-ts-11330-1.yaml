abstract:
- language: en
  script: Latn
  content: This document deals with the survey of the topography of lakes and reservoirs
    for the determination of volume of live storage and the determination of water
    level, the objective being to establish a relation between water level and volume.
    It includes conventional surveying methods, electronic distance measurement (EDM)
    and Global Navigation Satellite Systems (GNSS) total station methods and advanced
    hydrographic surveying methods.
