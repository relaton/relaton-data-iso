abstract:
- language: en
  script: Latn
  content: This document specifies a test method to determine the degree and rate
    of aerobic biodegradation of plastic materials when settled on marine sandy sediment
    at the interface between seawater and the seafloor, by measuring the evolved carbon
    dioxide (CO2). This test method can also be applied to other solid materials.
    This test method is a simulation under laboratory conditions of the habitat found
    in different seawater/sediment-areas in the sea, e.g. in a benthic zone where
    sunlight reaches the ocean floor (photic zone) that, in marine science, is called
    sublittoral zone The determination of biodegradation of plastic materials and
    other solid materials buried in marine sediment is outside the scope of this document.
    NOTE Measurement of aerobic biodegradation can also be obtained by monitoring
    the oxygen consumption, as described in ISO 18830. The conditions described in
    this document do not always correspond to the optimum conditions for the maximum
    degree of biodegradation to occur.
