abstract:
- language: en
  script: Latn
  content: 'ISO 11536:2015 specifies a gravimetric method for the determination of
    the loss in mass of fully-oxidized iron ores, when ignited at 1 000 °C. This method
    is applicable to a concentration range of 1,0 % (m/m) to 10,0 % (m/m) loss on
    ignition in natural iron ores, iron ore concentrates and agglomerates. The method
    is not applicable to the following: a) Processed ores containing metallic iron
    (direct reduced iron); b) Natural or processed ores in which the sulfur content
    is higher than 0,2 % (m/m); c) Natural or processed ores in which the content
    of partially-oxidized iron is more than 1,0 % (m/m).'
