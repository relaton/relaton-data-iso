abstract:
- language: en
  script: Latn
  content: This document provides guidance on the prevention of hydrogen assisted
    brittle fracture, known as hydrogen embrittlement (HE), that results from the
    manufacturing process or operating conditions. This document is applicable to
    components or parts made of high strength steels. This document provides guidance
    on the relationship between material selection, manufacturing (including heat
    treatment) and coating. NOTE 1        For hot-dip galvanizing components, see
    ISO 14713-2. NOTE 2        This document does not consider applications under
    pressurised hydrogen.
