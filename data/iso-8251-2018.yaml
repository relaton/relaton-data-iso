abstract:
- language: en
  script: Latn
  content: 'This document specifies the following tests: a) abrasive-wheel-wear test,
    determining the abrasion resistance of anodic oxidation coatings with abrasive
    wheel on flat specimens of aluminium and its alloys; b) abrasive jet test, determining
    the comparative abrasion resistance of anodic oxidation coatings with jet of abrasive
    particles on anodic oxidation coatings of aluminium and its alloys; c) falling
    sand abrasion test, determining the abrasion resistance of anodic oxidation coatings
    with falling sand on thin anodic oxidation coatings of aluminium and its alloys.
    The use of abrasive-wheel-wear test and abrasive jet test for coatings produced
    by hard anodizing is described in ISO 10074.'
