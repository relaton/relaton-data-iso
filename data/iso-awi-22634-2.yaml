abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of benzo[a]pyrene
    (B[a]P) in the total particulate matter (TPM) of cigarette mainstream smoke using
    gas chromatography/mass spectrometry (GC/MS) with cyclohexane as extraction solvent.
    This method is specified using ISO 3308 smoking parameters. This document provides
    an alternative method to that specified in ISO 22634-1, with a different clean-up,
    and a shorter total analytical run allowing a potential increase of sample throughput
    in comparison with ISO 22634-1.
