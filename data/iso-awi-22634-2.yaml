abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of benzo[a]pyrene
    (B[a]P) in the total particulate matter (TPM) of the mainstream smoke with a smoking
    regime according to ISO 3308 (standard smoking regime) using GC-MS with cyclohexane
    as extraction solvent. The smoking of cigarettes and the collection of TPM are
    carried out in accordance with ISO 4387. This document provides an alternative
    method to that specified in ISO 22634-1, with a different clean-up, and a shorter
    total analytical run allowing a potential increase of sample throughput in comparison
    with ISO 22634-1.
