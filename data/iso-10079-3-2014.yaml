abstract:
- language: en
  script: Latn
  content: ISO 10079-3:2014 specifies safety and performance requirements for medical
    suction equipment powered from a vacuum or positive pressure gas source generating
    venturi suction. It applies to equipment connected to medical gas pipeline systems
    or cylinders and venturi attachments. The equipment can be stand-alone or part
    of an integrated system.
