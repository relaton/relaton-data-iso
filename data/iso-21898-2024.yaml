- language: en
  script: Latn
  content: This document specifies materials, construction and design requirements,
    type test and marking requirements for flexible intermediate bulk containers (FIBCs)
    intended to contain non-dangerous solid materials in powder, granular or paste
    form, and designed to be lifted from above by integral or detachable devices.
