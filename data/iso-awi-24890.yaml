abstract:
- language: en
  script: Latn
  content: This method describes the procedure for the analysis by X-Ray Fluorescence
    Spectrometry (XRFS) of Rare Earth related products and materials. The present
    procedure will be just focused in the XRFS determination of rare earth distribution
    in mixed rare-earth compounds using Borate Fusion as sample preparation. Mixed
    rare earth compounds as Pr/Nd Oxides, Carbonates and Oxalates under the range
    of concentration defined in Table Nº 1. This method is not applicable to the analysis
    of materials containing elements other than for which matrix corrections has been
    calculated. Such concomitants may invalidate results obtained if this method is
    used without modifications. This method is used for process control and inventory
    analysis. This method will be applicable for sales analysis when approved by the
    International Standards Committee. The concentration ranges of samples currently
    analysed by this method are shown in Table Nº1, for each element included in the
    scope. Table Nº1 — Concentration range of application of this method Oxide Range
    of Concentration (%) Y2O3 0.01 – 0.40 La2O3 0.01 – 0.40 CeO2 0.01 – 0.40 Pr6O11
    10 – 40 Nd2O3 60 – 90 Sm2O3 0.01 – 0.40 Eu2O3 0.01 – 0.40 Gd2O3 0.01 – 0.40 Tb4O7
    0.01 – 0.40 Dy2O3 0.01 – 0.40 Ho2O3 0.01 – 0.40 Er2O3 0.01 – 0.40 Tm2O3 0.01 –
    0.40 Yb2O3 0.01 – 0.40 Lu2O3 0.01 – 0.40
