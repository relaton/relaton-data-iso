abstract:
- language: en
  script: Latn
  content: 'ISO 15037-1:2006 specifies the general conditions that apply when vehicle
    dynamics properties are determined according to ISO test methods. In particular,
    it specifies general conditions for: variables,measuring equipment and data processing,environment
    (test track and wind velocity),test vehicle preparation (tuning and loading),initial
    driving, andtest reports (general data and test conditions). ISO 15037-1:2006
    is applicable to passenger cars as defined in ISO 3833 and light trucks.'
