abstract:
- language: en
  script: Latn
  content: ISO 13738:2011 specifies the requirements of lubricating oils (hereinafter
    referred to as "two-stroke oils") to be used in two-stroke-cycle spark-ignition
    gasoline engines which employ a crankcase scavenging system and are used in transportation,
    leisure and utility applications, such as motorcycles, snowmobiles and chainsaws.
    The requirements specified in ISO 13738:2011 are applicable to the categories
    of two-stroke oils, EGB, EGC and EGD, covered in ISO 6743-15, which defines the
    classification of lubricating oils for use in internal combustion engines.
