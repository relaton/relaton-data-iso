abstract:
- language: en
  script: Latn
  content: This standard specifies the hygienic requirements of feed processing machinery
    for artificially reared animals and the hygienic requirements for feed processing
    machinery in terms of design, manufacturing, materials, process design, equipment
    connection. It also proposes an evaluation method for hygiene risks caused by
    feed processing machinery to feed. This standard does not address the hygienic
    risks to the feed due to the processing process management, nor does it address
    the hygienic risks to the operators when operating the machinery. This standard
    is applicable to the design, manufacturing of single feed processing machinery,
    as well as the process design, equipment layout, and process connection of complete
    sets of feed processing equipment.
