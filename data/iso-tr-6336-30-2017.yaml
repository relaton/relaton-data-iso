abstract:
- language: en
  script: Latn
  content: ISO/TR 6336-30:2017 presents worked examples that apply exclusively the
    approximation methods for the determination of specific influential factors, such
    as the dynamic factor, Kv, and the load distributions factors KHα, KHβ, etc.,
    where full analytical calculation procedures are provided within the referenced
    parts of ISO 6336. Worked examples covering the more advanced analysis techniques
    and methods are outside the scope of this document. The example calculations presented
    in this document are provided for guidance on the application of ISO 6336‑1, ISO
    6336‑2, ISO 6336‑3 and ISO 6336‑5. Any of the values, safety factors or the data
    presented are not to be taken as recommended criteria for real gearing. Data presented
    within this document are for the purpose of aiding the application of the calculation
    procedures of ISO 6336‑1, ISO 6336‑2, ISO 6336‑3 and ISO 6336‑5.
