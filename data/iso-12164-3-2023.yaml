abstract:
- language: en
  script: Latn
  content: 'This document specifies the dimensions for hollow taper shanks with flange
    contact surface (HSK). These shanks are the male part of the interface to the
    machine tools (e.g. milling/drilling, turning and grinding machines). This document
    specifies three types of shanks: —     type T has a peripherally grooved flange
    for automatic tool change in turning machines with a gripper for HSK type T; —    
    type TA has a peripherally grooved flange for automatic tool change in milling
    machines, enabled (designed) for turning, with a gripper for HSK type A or AB;
    —     type U has no peripheral groove flange and is designed for manual tool change
    in turning machines. HSK types T and TA can also be changed manually via radial
    access bore holes in the hollow shank taper.'
