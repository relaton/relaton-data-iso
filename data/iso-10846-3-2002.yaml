abstract:
- language: en
  script: Latn
  content: This part of ISO 10846 specifies a method for determining the dynamic transfer
    stiffness for translations of resilient supports, under specific preload. The
    method concerns the laboratory measurements of vibration transmissibility and
    is called the indirect method. This method is applicable to test elements with
    parallel flanges. Measurements for translations normal and transverse to the flanges
    are covered in this part of ISO 10846. Annex A provides guidance for the measurement
    of transfer stiffnesses which include rotatory components. The method covers the
    frequency range from f2 up to f3. The values of f2 and f3 are determined by the
    test set-up and the isolator under test. The data obtained according to the method
    specified in this part of ISO 10846 can be used for product information provided
    by manufacturers and suppliers,information during product development,quality
    control, andcalculation of the transfer of vibration through isolators.
