abstract:
- language: en
  script: Latn
  content: ISO 24442:2011 specifies an in vivo method for assessment of the UVA protection
    factor (UVAPF) of topical sunscreen products. It is applicable to cosmetics, drugs
    and other products intended to be topically applied to human skin, including any
    component able to absorb, reflect or scatter UV rays. ISO 24442:2011 provides
    a basis for the evaluation of sunscreen products for the protection of human skin
    against UVA radiation from solar or other light sources.
