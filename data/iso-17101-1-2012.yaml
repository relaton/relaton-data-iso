abstract:
- language: en
  script: Latn
  content: 'ISO 17101-1:2012 gives specifications and acceptance criteria for thrown-object
    testing of rotary mowers used in agriculture. Examples of machines are shown.
    It is not applicable to the following: flail mowers; mowers with an articulated
    arm; mowers with one or more vertical axis designed for mulching; pedestrian-controlled
    motor mowers; lawn mowers or machines designed as lawn mowers; inter-row mowing
    units; machines designed for highway and road maintenance only.'
