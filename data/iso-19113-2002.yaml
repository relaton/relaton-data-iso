abstract:
- language: en
  script: Latn
  content: ISO 19113:2002 establishes the principles for describing the quality of
    geographic data and specifies components for reporting quality information. It
    also provides an approach to organizing information about data quality. ISO 19113:2002
    is applicable to data producers providing quality information to describe and
    assess how well a dataset meets its mapping of the universe of discourse as specified
    in the product specification, formal or implied, and to data users attempting
    to determine whether or not specific geographic data is of sufficient quality
    for their particular application. This International Standard should be considered
    by organizations involved in data acquisition and purchase, in such a way that
    it makes it possible to fulfil the intentions of the product specification. It
    can additionally be used for defining application schemas and describing quality
    requirements. As well as being applicable to digital geographic data, the principles
    of ISO 19113:2002 can be extended to identify, collect and report the quality
    information for a geographic dataset, its principles can be extended and used
    to identify, collect and report quality information for a dataset series or smaller
    groupings of data that are a subset of a dataset. Although ISO 19113:2002 is applicable
    to digital geographic data, its principles can be extended to many other forms
    of geographic data such as maps, charts and textual documents. ISO 19113:2002
    does not attempt to define a minimum acceptable level of quality for geographic
    data.
