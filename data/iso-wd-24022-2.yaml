abstract:
- language: en
  script: Latn
  content: This document specifies the methods of preparation of test specimens and the test methods to be used in determining the properties of PS moulding and extrusion materials. It gives requirements for handling test material and for conditioning both the test material before moulding and the specimens before testing. This document specifies the procedures and conditions for the preparation of test specimens and procedures for measuring properties of the materials from which these specimens are made. It lists the properties and test methods which are suitable and necessary to characterize PS moulding and extrusion materials. The properties have been selected from the general test methods in ISO 10350-1. Other test methods in wide use for or of particular significance to these moulding and extrusion materials are also included in this document, as are the designatory properties specified in ISO 24022-1.
