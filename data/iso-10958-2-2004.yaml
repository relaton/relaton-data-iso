abstract:
- language: en
  script: Latn
  content: ISO 10958-2:2004 specifies requirements and test methods for snowboards
    on which bindings are attached by means of inserts that are not removable and
    screws. ISO 10958-2:2004 does not apply to snowboards for children with a mass
    less then 25 kg. It contains data for the manufacturer of snowboards, bindings
    and retention devices concerning dimensions, tests and other specifications for
    the binding mounting area.
