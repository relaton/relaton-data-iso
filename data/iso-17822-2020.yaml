abstract:
- language: en
  script: Latn
  content: This document describes the particular clinical laboratory practice requirements
    to ensure the quality of detection, identification and quantification of microbial
    pathogens using nucleic acid amplification tests (NAAT). It is intended for use
    by laboratories that develop, and/or implement and use, or perform NAAT for medical,
    research or health-related purposes. This document does not apply to the development
    of in vitro diagnostic (IVD) medical devices by manufacturers. However, it does
    include verification and validation of such devices and/or the corresponding processes
    when implemented and used by the laboratories.
