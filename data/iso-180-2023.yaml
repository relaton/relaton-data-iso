abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the Izod impact strength
    of plastics under defined conditions. A number of different types of specimen
    and test configurations are defined. Different test parameters are specified according
    to the type of material, the type of test specimen and the type of notch. The
    method is used to investigate the behaviour of specified types of specimen under
    the impact conditions defined and for estimating the brittleness or toughness
    of specimens within the limitations inherent in the test conditions.
