abstract:
- language: en
  script: Latn
  content: 'IEC 62264-5:2016 defines transactions in terms of information exchanges
    between applications performing business and manufacturing activities associated
    with Levels 3 and 4. The exchanges are intended to enable information collection,
    retrieval, transfer and storage in support of enterprise-control system integration.
    This part of IEC 62264 is consistent with the IEC 62264-2 and IEC 62264-4 object
    models attributes. This standard also defines transactions that specify how to
    exchange the objects defined in IEC 62264-2, IEC 62264-4 and this standard. This
    second edition cancels and replaces the first edition published in 2011. This
    edition constitutes a technical revision. This edition includes the following
    significant technical changes with respect to the previous edition: The addition
    of transaction rules for objects defined in IEC 62264-4: Job, Job List, Job Response,
    Job Response List, Work Alert Definition, Work Alert, Work Calendar Definition,
    Work Calendar, Work Capability Work Directive, Work Master, Work Performance,
    Work Record, Work Schedule, Workflow Specification Node Type, Workflow Specification.
    It is published as a double logo standard.'
