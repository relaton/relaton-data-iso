abstract:
- language: en
  script: Latn
  content: ISO 10440-1:2007 specifies requirements for dry and oil-flooded, helical-lobe
    rotary compressors used for vacuum or pressure or both in petroleum, petrochemical,
    and gas industry services. It is intended for compressors that are in special-purpose
    applications. It is not applicable to general-purpose air compressors, liquid-ring
    compressors, or vane-type compressors.
