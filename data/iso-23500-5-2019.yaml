abstract:
- language: en
  script: Latn
  content: This document specifies minimum quality requirements for dialysis fluids
    used in haemodialysis and related therapies. This document includes dialysis fluids
    used for haemodialysis and haemodiafiltration, including substitution fluid for
    haemodiafiltration and haemofiltration. This document excludes the water and concentrates
    used to prepare dialysis fluid or the equipment used in its preparation. Those
    areas are covered by other International Standards. Sorbent-based dialysis fluid
    regeneration systems that regenerate and recirculate small volumes of dialysis
    fluid, systems for continuous renal replacement therapy that use pre-packaged
    solutions, and systems and solutions for peritoneal dialysis are excluded from
    this document.
