abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the determination of gross beta
    activity concentration in non-saline waters. This document covers non-volatile
    radionuclides with maximum beta energies of approximately 0,3 MeV or higher. This
    document does not apply to the measurement of low-energy beta emitters (e.g. 3H,
    228Ra, 210Pb, 14C, 35S and 241Pu) and some gaseous or volatile radionuclides (e.g.
    radon and radioiodine). This document is applicable to the analysis of raw and
    drinking waters with low amounts of total soluble salts in the water. The limit
    of detection depends on the performance characteristics (background count rate
    and counting efficiency) of the counter used. As this method requires sample preparation
    in laboratory facilities, this method is not suited for rapid, in-the-field analysis.
