abstract:
- language: en
  script: Latn
  content: ISO 22902-1:2006 is based on the AMI-C specifications and reference documents
    for the automotive industry. It is established to facilitate the development,
    promotion and standardization of automotive information and entertainment system
    interfaces to motor vehicle communication networks. The technical glossary is
    a compilation of terms and definitions used in AMI-C technical publications. The
    user guide describes the organization, classification and scope of the reference
    information for ISO documents. The architectural overview describes the structural,
    functional and applications views of the AMI-C architecture.
