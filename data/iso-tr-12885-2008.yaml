abstract:
- language: en
  script: Latn
  content: ISO/TR 12885:2008 describes health and safety practices in occupational
    settings relevant to nanotechnologies. ISO/TR 12885:2008 focuses on the occupational
    manufacture and use of engineered nanomaterials. It does not address health and
    safety issues or practices associated with nanomaterials generated by natural
    processes, hot processes and other standard operations which unintentionally generate
    nanomaterials, or potential consumer exposures or uses, though some of the information
    in ISO/TR 12885:2008 might be relevant to those areas. Use of the information
    in ISO/TR 12885:2008 could help companies, researchers, workers and other people
    to prevent adverse health and safety consequences during the production, handling,
    use and disposal of manufactured nanomaterials. This advice is broadly applicable
    across a range of nanomaterials and applications.
