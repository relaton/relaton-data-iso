abstract:
- language: en
  script: Latn
  content: 'ISO 286-2:2010 gives values of the limit deviations for commonly used
    tolerance classes for holes and shafts calculated from the tables given in ISO
    286‑1. ISO 286-2 covers values for the upper limit deviations eU, hole (for holes)
    and eU, shaft (for shafts) and the lower limit deviations eL, hole (for holes)
    and eL, shaft (for shafts). The ISO system for tolerances on linear size provides
    a system of tolerances and deviations suitable for features of the following types:
    cylinders; two parallel opposite surfaces. For simplicity, and also because of
    the importance of cylindrical workpieces of circular section, only these are referred
    to explicitly. It should be clearly understood, however, that the tolerances and
    deviations given in ISO 286-2 equally apply to workpieces of other than circular
    sections.'
