abstract:
- language: en
  script: Latn
  content: ISO 11338-1:2003 describes methods for the determination of the mass concentration
    of polycyclic aromatic hydrocarbons (PAHs) in flue gas emissions from stationary
    sources such as aluminium smelters, coke works, waste incinerators, power stations,
    and industrial and domestic combustion appliances. ISO 11338-1:2003 describes
    three sampling methods, which are here regarded as of equivalent value, and specifies
    the minimum requirements for effective PAH sampling. The three sampling methods
    are the dilution method (A), the heated filter/condenser/adsorber method (B) and
    the cooled probe/adsorber method (C). All three methods are based on representative
    isokinetic sampling, as the PAHs are commonly associated with particles in flue
    gas. Information is provided to assist in the choice of the appropriate sampling
    method for the measurement application under consideration. ISO 11338-1:2003 is
    not applicable to the sampling of fugitive releases of PAHs. NOTE Methods for
    sample preparation, clean-up and analysis are described in ISO 11338-2 and are
    intended to be combined with one of the sampling methods described in ISO 11338-1
    to complete the whole measurement procedure.
