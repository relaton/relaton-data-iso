abstract:
- language: en
  script: Latn
  content: This document provides general requirement and guidance on identification,
    design and development of emerging technologies with potential use in medical
    laboratories and their preparation for clinical use. This document is applicable
    to laboratories transitioning emerging technologies utilizing human samples into
    medical laboratory examinations for the purpose of providing information for the
    diagnosis, monitoring, management, prevention, and treatment of disease. This
    document does not apply to medical laboratory examinations undergoing validation
    at which point the technology has become an in-house (laboratory developed) test
    or in-vitro diagnostic medical device.
