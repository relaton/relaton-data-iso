abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for archival paper. It is applicable
    to unprinted papers intended for documents and publications required for permanent
    retention and frequent use. For these documents and publications, paper of high
    permanence and high durability is required. NOTE 1        Archival paper is primarily
    required for documents and publications intended to be kept permanently because
    of their high historical, legal or other significant value. Archival paper is
    for special purposes, not for common use. The use of the term “archival paper”
    does not imply that all papers kept in archives are “archival papers”. NOTE 2       
    For relationships between International Standards on paper permanence (ISO 9706),
    on archival paper permanence and durability (ISO 11108), and on paper stability
    for general graphic applications (ISO 20494), refer to Annex B.
