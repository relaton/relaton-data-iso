abstract:
- language: en
  script: Latn
  content: ISO 22854:2008 specifies the gas chromatographic (GC) method for the determination
    of saturated, olefinic and aromatic hydrocarbons in automotive motor gasoline.
    Additionally, the benzene content, oxygenate compounds and the total oxygenate
    content can be determined. ISO 22854:2008 is applicable to automotive motor gasoline
    with a total volume fraction of aromatics of up to 50 %; a total volume fraction
    of olefins from about 1,5 % up to 30 %; a volume fraction of oxygenates, from
    0,8 % up to 15 %; a total mass fraction of oxygen from about 1,5 % to about 3
    %; and a volume fraction of benzene of up to 2 %. Although this test method can
    be used to determine higher-olefin contents of up to 50 % volume fraction, the
    precision for olefins was tested only in the range from about 1,5 % volume fraction
    to about 30 % volume fraction. Although specifically developed for the analysis
    of automotive motor gasoline that contains oxygenates, ISO 22854:2008 can also
    be applied to other hydrocarbon streams having similar boiling ranges, such as
    naphthas and reformates.
