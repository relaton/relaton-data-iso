abstract:
- language: en
  script: Latn
  content: ISO 17660-2:2006 is applicable to the welding of weldable reinforcing steel
    and stainless reinforcing steel of non load-bearing welded joints, in workshops
    or on site. It specifies requirements for materials, design and execution of welded
    joints, welding personnel, quality requirements, examination and testing. Load-bearing
    welded joints are covered by ISO 17660-1.
