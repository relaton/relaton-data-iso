abstract:
- language: en
  script: Latn
  content: ISO 3320:2013 establishes a metric series of cylinder bore and piston rod
    diameters for hydraulic and pneumatic cylinders, and specifies for each pair of
    diameters a corresponding standard ratio between the useful areas. It applies
    only to the dimensional criteria of products manufactured in conformity with ISO
    3320:2013; it does not apply to their functional characteristics.
