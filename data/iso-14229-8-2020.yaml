abstract:
- language: en
  script: Latn
  content: This document specifies the implementation of a common set of unified diagnostic
    services (UDS) on clock extension peripheral interface networks in road vehicles.
    The UDSonCXPI diagnostics defines methods to implement diagnostic data transfer
    between a client and the CXPI slave nodes via the CXPI master node. This document
    specifies support of three different diagnostic classes for CXPI slave nodes.
    This document references ISO 14229-1 and ISO 14229-2 and specifies implementation
    requirements of the UDSonCXPI communication protocol for mainly HMI (Human Machine
    Interface), but not limited to, electric/electronic systems of road vehicles.
    UDSonCXPI defines how to implement the diagnostic data transfer between a client
    and CXPI slave nodes via CXPI master node. NOTE UDSonCXPI does not specify any
    requirement for the in-vehicle CXPI bus architecture. This document refers to
    information contained in ISO 14229-1, ISO 14229-2 and ISO 20794 (all parts). This
    document does not include any redundant information of the above-mentioned documents.
    It focuses on — additional requirements specific to the implementation of UDSonCXPI
    network, and — specific restrictions in the implementation of UDSonCXPI network.
