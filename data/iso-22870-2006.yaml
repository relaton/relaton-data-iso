abstract:
- language: en
  script: Latn
  content: ISO 22870:2006 gives specific requirements applicable to point-of-care
    testing and is intended to be used in conjunction with ISO 15189. The requirements
    of ISO 22870:2006 apply when POCT is carried out in hospital, clinic and by a
    healthcare organization providing ambulatory care. It can be applied to transcutaneous
    measurements, the analysis of expired air, and in vivo monitoring of physiological
    parameters. Patient self-testing in a home or community setting is excluded, but
    elements of ISO 22870:2006 can be applicable.
