abstract:
- language: en
  script: Latn
  content: This new work item specifies an instrumented indentation testing method
    for determination of hardness and other materials parameters at elevated temperature.
    This document covers instrumented indentation testing with passive indenter tip
    heating in air, in inert or reducing gaseous environments, and without tip temperature
    sensor. This new work item applies to testing in air, inert gaseous environments
    and reducing gaseous environments, where a localized hot zone is created around
    the test piece and indenter contact region while the majority of the testing machine
    remains at ambient temperature. It includes requirements for the testing machine,
    test procedure, assignment of the contact temperature, uncertainty evaluation,
    test report and a temperature calibration procedure. This new work item does not
    apply to testing in vacuum, to systems in which the whole instrument is heated,
    to systems in which only the test piece is actively heated and the indenter is
    heated only by proximity or contact without the assistance of gas convection,
    or to systems with independently actively heated test piece and indenter tip.
