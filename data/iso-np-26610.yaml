abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for the physical
    properties of mechanical oral care products intended for the use by children to
    promote the safety of these products for their intended use. This document is
    positioned as child-specific supplementary requirements to existing standards
    such as ISO 20126, ISO 20127, ISO 16409. In addition to the applicable requirements
    in the existing standards, the requirements of this document shall take precedence.
