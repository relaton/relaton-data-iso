abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the longitudinal reversion
    of thermoplastics pipes, to be carried out in either a liquid or in air. In case
    of dispute, heated liquid is used as the reference. This document is applicable
    to all thermoplastics pipes with smooth internal and external walls of constant
    cross‑section. It is not applicable to non‑smooth structured‑wall thermoplastics
    pipes. The parameters appropriate to the pipe material and recommendations for
    the maximum levels of reversion as a function of the pipe material are given in
    Annex A. This method is applicable for pipes of wall thickness ≤ 16 mm.
