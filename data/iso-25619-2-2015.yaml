abstract:
- language: en
  script: Latn
  content: ISO 25619-2:2015 specifies an index test method for determining the short-term
    compressive behaviour of geosynthetics. It can be used to determine the deformation
    behaviour under short-term compressive stress, e.g. after exposure to stress,
    liquids, or light. ISO 25619-2. 2015 can be used for quality control purposes.
    It is not intended to be used for design purposes.
