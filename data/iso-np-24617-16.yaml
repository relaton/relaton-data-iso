abstract:
- language: en
  script: Latn
  content: This proposed deliverable is an extension of ISO 24617 series of standards
    for the semantic annotation of language resources. It specifies a methodology
    and a schematic framework for the annotation of spoken or written utterances for
    the extraction of semantic and pragmatic information in relation to evaluative
    language, defined in the project as linguistic expressions of opinions, judgments,
    assessments or emotions towards objects, people, events or ideas. In particular,
    this deliverable will provide for a practical annotation guideline based on a
    taxonomy of categories of evaluative expressions in conjunction with their grammatical
    and semantic properties to enable consistent processing.
