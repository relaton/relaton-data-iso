abstract:
- language: en
  script: Latn
  content: ISO 10062:2006 specifies tests which are intended to determine the influence
    of one or more flowing polluting gas(es) at volume fractions less than or equal
    to 0,000001 on test samples and/or articles of metals and alloys with or without
    corrosion protection under determined conditions of temperature and relative humidity.
    These tests apply to metals and their alloys, metallic coatings (anodic and cathodic),
    metals with conversion coatings, metals with anodic oxide coatings, and metals
    with organic coatings.
