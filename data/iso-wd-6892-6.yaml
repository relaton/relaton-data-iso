abstract:
- language: en
  script: Latn
  content: This document specifies a method for tensile testing of test pieces of
    foil and strip of metals with a nominal thickness less than 0,200 mm by using
    computer controlled testing machines. This method is used to determine typically
    the proof strength Rp0,2, the tensile strength Rm and/or the percentage elongation
    at fracture A50 mm or preferably A100 mm.
