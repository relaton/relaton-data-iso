abstract:
- language: en
  script: Latn
  content: This document specifies requirements for handle starting equipment used
    on reciprocating internal combustion engines for land, rail and marine use, excluding
    engines used to propel road vehicle and aircraft. It can be applied to engines
    used to propel road construction, earth moving machines and other applications
    where no suitable International Standards exist. In addition to the technical
    safety requirements, this document describes procedures for checking adherence
    to these requirements.
