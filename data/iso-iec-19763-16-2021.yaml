abstract:
- language: en
  script: Latn
  content: 'The primary purpose of the ISO/IEC 19763 series is to specify a metamodel
    framework for interoperability. This document specifies a metamodel for registering
    document models (or schemata). Examples of such document models include: —   
    specifications for XML documents (using XML schema[3]); —    specifications for
    JSON documents (using JSON schema[2]). This metamodel was developed taking into
    account the requirements for both XML schema and JSON schema, but is applicable
    to all current specifications for document models.'
