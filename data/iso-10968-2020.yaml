abstract:
- language: en
  script: Latn
  content: This document specifies requirements and guidelines for the operator's
    controls on earth-moving machinery as defined in ISO 6165, in as far as those
    controls relate to any direct-control machine. The recommendations given for finger-,
    hand- and foot-operated controls are not intended to prevent usage of other types
    of controls, control locations or control movements. This document is not applicable
    to devices which are not directly related to machine control. NOTE For remote
    operator control of machines, see ISO 15817.
