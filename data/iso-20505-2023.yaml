abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of interlaminar
    shear strength at ambient temperature by the compression of a double-notched test
    piece and a method for the determination of interlaminar shear strength and modulus
    at ambient temperature by the Iosipescu test. This document applies to all ceramic
    matrix composites with a continuous fibre reinforcement, having unidirectional
    (1D), bidirectional (2D) and multidirectional (xD, with x > 2) fibre architecture,
    where a major part of reinforcements is a stack of plies. This document is applicable
    to material development, material comparison, quality assurance, characterization,
    reliability and design data generation. The simpler compression test method of
    a double-notched test piece is applicable only when the shear strength has to
    be measured.
