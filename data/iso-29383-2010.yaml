abstract:
- language: en
  script: Latn
  content: ISO 29383:2010 provides policy makers in governments, administration, non-profit
    and commercial organizations with guidelines and a methodology for the development
    and implementation of a comprehensive policy or strategy concerning the planning
    and management of terminology. ISO 29383:2010 defines key concepts and describes
    scenarios and environments which may require different kinds of terminology policies.
    It also places terminology policies in the broader context of institutional strategic
    frameworks.
