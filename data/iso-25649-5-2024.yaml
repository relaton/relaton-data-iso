abstract:
- language: en
  script: Latn
  content: 'This document specifies additional specific safety requirements and test
    methods for Class C floating leisure articles for use on and in the water regardless
    whether the buoyancy is achieved by inflation or inherent buoyant material. This
    document is applicable for Class C floating leisure articles as specified in ISO 25649-1:2024,
    Table 1. NOTE 1        Typical products forming Class C (see Annex B): —     
    tube riders towable with interior holding facility and closed cockpit; —     
    raft riders towable; —      board riders towable; —      banana type towable.
    NOTE 2        Typical places for application: —      distant from bathing areas
    and other frequented water surfaces, wide empty spaces, dedicated racetracks (parcours);
    —      no to little waves; —      no strong currents.'
