abstract:
- language: en
  script: Latn
  content: ISO 2931:2010 specifies a method for assessing the quality of sealed anodic
    oxidation coatings on aluminium and its alloys by measurement of the admittance.
    The method is applicable to anodic oxidation coatings sealed in an aqueous medium.
    The method is suitable for use as a production-control test and as an acceptance
    test where there is agreement between the supplier and the customer. Any type
    of anodized component can be tested by the method described, provided that there
    is a sufficient area (a circle of diameter about 20 mm ) and that the film thickness
    is greater than 3 µm.
