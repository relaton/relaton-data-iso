abstract:
- language: en
  script: Latn
  content: ISO 5667-6:2014 sets out the principles to be applied to the design of
    sampling programmes, sampling techniques, and the handling of water samples from
    rivers and streams for physical and chemical assessment. It is not applicable
    to the sampling of estuarine or coastal waters nor for microbiological sampling.
    (Procedures for microbiological sampling are given in ISO 19458.) ISO 5667-6:2014
    is neither applicable to the examination of sediment, suspended solids or biota,
    nor to dammed stretches of rivers or streams. Also, it is not applicable to passive
    sampling of surface waters (see ISO 5667‑23). In cases where naturally occurring
    or artificially constructed dams result in the retention or storage of water for
    several days or more, the stretch of the river or stream should be considered
    as a standing water body. For sampling purposes, see ISO 5667‑4.
