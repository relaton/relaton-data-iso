abstract:
- language: en
  script: Latn
  content: This document establishes a vocabulary for solid biofuels. This document
    only includes raw and processed material originating from —    forestry and arboriculture,
    —    agriculture and horticulture, and —    aquaculture. NOTE 1   Chemically treated
    material cannot include halogenated organic compounds or heavy metals at levels
    higher than those in typical virgin material values (see also ISO 17225-1:2021,
    Annex B) or higher than typical values of the country of origin. NOTE 2   Raw
    and processed material includes woody, herbaceous, fruit and aquatic biomass and
    biodegradable waste originating from above sectors. Materials originating from
    different recycling processes of end-of-life-products are outside the scope of
    this document but relevant terms are included for information. Liquid biofuels
    (ISO/TC 28/SC 7), natural gas (ISO/TC 193) and solid recovered fuels (ISO/TC 300)
    are outside the scope of this document.
