abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the tensile creep and
    creep rupture behaviour of geotextiles and geotextile-related products in an unconfined
    situation. Application of this document is limited to products and applications
    where the risk of collapse of a structure due to premature failure or to strain
    and time variation of the reinforcement under constant load is of essential importance.
