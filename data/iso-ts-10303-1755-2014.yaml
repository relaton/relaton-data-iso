abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1755:2014-02 specifies the application module for Physical
    connectivity definition. The following are within the scope of ISO/TS 10303-1755:2014-02:
    the network representation using physical component terminal identifiers;the lifecycle
    management of a network representation including make from and requirement based
    relationships between network representations; the representation of a functional
    network elaboration;the representation of a tree structured network to which properties
    may be assigned for layout and routing control purposes.'
