abstract:
- language: en
  script: Latn
  content: 'ISO 4952 specifies the chemical and mechanical characteristics, methods
    of manufacture, the acceptance conditions and the marking of structural steel
    products possessing improved atmospheric corrosion resistance. It applies to plates
    having a thickness of 4 mm and over, hot-rolled on reversing mills, wide flats,
    bars and hot-rolled sections generally used in the delivery condition and which,
    as a rule, form part of the bolted, riveted or welded structures in metal constructions
    and which have improved atmospheric corrosion resistance. ISO 4952 does not include
    the following steels, certain of which are covered by other International Standards:
    general purpose structural steels;steels for boilers and pressure purposes;steels
    for heat treatment;continuously hot-rolled structural steel sheet with improved
    atmospheric corrosion resistance;steel plates for forming and deep drawing.'
