abstract:
- language: en
  script: Latn
  content: This document specifies requirements for platinum slag, an abrasives supplied
    for abrasive blast-cleaning processes. It specifies ranges of particle sizes and
    values for apparent density, Mohs hardness, moisture content, conductivity of
    aqueous extract, and water-soluble chlorides. The requirements specified in this
    document apply to abrasives supplied in its unused "new" condition only. They
    do not apply to abrasives during or after use. Test methods for non-metallic blast-cleaning
    abrasives are given in the various parts of ISO 11127.
