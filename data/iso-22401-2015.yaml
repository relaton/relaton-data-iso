abstract:
- language: en
  script: Latn
  content: ISO 22401:2015 provides a test method to measure spray sedimentation from
    horizontal boom sprayers using a test bench. The sedimentation measure gives a
    value for potential spray drift. These measurements can be used to compare different
    sprayer setups on the same sprayer. ISO 22401:2015 is applicable to mounted, trailed
    and self-propelled horizontal boom sprayers used in arable crops; and horizontal
    boom sprayers used for weed control in orchards/vineyards and spray application
    on horticultural crops. ISO 22401:2015 is intended for booms using a uniform set
    of spray generators. If intended for spray drift classification of the sprayer,
    the comparison is limited to nozzle type, spray pressure and boom height. NOTE
    Further investigations and tests are on-going to consider other parameters for
    classification aims (e.g. air assisted system, forward speed, nozzle spacing and
    orientation).
