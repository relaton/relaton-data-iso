abstract:
- language: en
  script: Latn
  content: ISO 10893-11:2011 specifies requirements for the automated ultrasonic shear
    wave (generated by conventional or phased array technique) testing of the weld
    seam of submerged arc-welded (SAW) or electric resistance and induction-welded
    (EW) steel tubes. For SAW tubes, the test covers the detection of imperfections
    oriented predominantly parallel to or, by agreement, perpendicular to the weld
    seam or both. For EW tubes, the test covers the detection of imperfections oriented
    predominantly parallel to the weld seam. In the case of testing on longitudinal
    imperfections, Lamb wave testing can be applied at the discretion of the manufacturer.
    ISO 10893-11:2011 can also be applicable to the testing of circular hollow sections.
