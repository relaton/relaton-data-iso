abstract:
- language: en
  script: Latn
  content: This document specifies the dimensions and requirements for single-core
    cables intended for general purpose vehicle applications where the nominal system
    voltage is less than or equal to 30 V a.c. or less than or equal to 60 V d.c..
    It also applies to individual cores in multi-core cables. This document specifies
    requirements for aluminium conductor cables.
