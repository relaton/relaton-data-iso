abstract:
- language: en
  script: Latn
  content: This document outlines specifications for gold and gold alloy coatings,
    including double, multi-layered, and rolled gold coatings, by defining the minimum
    mass, thickness, and fineness requirements. The specifications apply to all gold
    coatings, whether applied on precious or non-precious jewellery and general decorative
    items. Additionally, this document defines the current vocabulary for gold alloy
    coatings. This document does not apply to watch-cases and their accessories, including
    bracelets permanently attached to the case.
