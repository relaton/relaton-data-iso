abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for a chamber test with different options
    of chamber sizes to measure the formaldehyde concentrations in air from wood products
    under defined test conditions of temperature, relative humidity, loading and air
    exchange rate. Results obtained from this small-scale chamber test method can
    be used for quality control (factory production control – ‘FPC’) based on correlation
    established by reference chamber test methods according to ISO, EN or ASTM standards.
    The establishment of a correlation is described in Annex D.
