abstract:
- language: en
  script: Latn
  content: ISO 16228:2017 specifies the different types of fastener inspection documents
    issued by the fastener manufacturer or distributor and/or by the external authorized
    representative on specific request of the purchaser at the time of the order.
    - declaration of compliance (F2.1); - test reports (F2.2, F3.1 and F3.2). NOTE
    The term "certificate" is in common use, however for fastener inspection documents
    the terminology to be used is "test report". ISO 16228:2017 specifies requirements
    for the content of each fastener inspection document, in conjunction with the
    order, the relevant standards and/or specified requirements. ISO 16228:2017 is
    applicable to finished fasteners such as bolts, screws, studs, nuts, washers,
    pins, rivets, etc. made of steel, stainless steel, non-ferrous metal or non-metallic
    material. ISO 16228:2017 does not apply to special-purpose or specially engineered
    applications requiring other types of procedures (e.g. initial samples). Examples
    of inspection documents are given in Annex A. An example of a coding system identifying
    the sections in fastener inspection documents is given in Annex B.
