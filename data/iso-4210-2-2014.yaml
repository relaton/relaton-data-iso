abstract:
- language: en
  script: Latn
  content: ISO 4210-2:2014 specifies safety and performance requirements for the design,
    assembly, and testing of bicycles and sub-assemblies having saddle height as given
    in Table 1, and lays down guidelines for manufacturer's instructions on the use
    and care of such bicycles. ISO 4210-2:2014 applies to young adult bicycles with
    maximum saddle height of 635 mm or more and less than 750 mm, city and trekking
    bicycles, mountain bicycles, and racing bicycles that have a maximum saddle height
    of 635 mm or more including folding bicycles.
