- language: en
  script: Latn
  content: 'This document specifies methods for the measurement of energy consumption,
    water consumption, ice production capacity and the harvested ice characteristics
    of ice makers with built-in condensing units for commercial use. This document
    does not apply to: —    ice makers intended to be incorporated in appliances for
    household use; —    ice makers with remote condensing units.'
