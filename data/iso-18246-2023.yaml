abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements for conductive connection of
    electrically propelled mopeds and motorcycles (referred to as the EVs) to external
    electric circuits. NOTE 1   External electric circuits include external electric
    power supplies and external electric loads. It does not provide comprehensive
    safety information for manufacturing, maintenance and repair personnel. It applies
    only to on-board charging systems between the plug or vehicle inlet and RESS circuits.
    NOTE 2   The requirements when not connected to external electric circuits are
    specified in the ISO 13063 series. Requirements for bidirectional energy transfer
    DC to AC are under consideration and are not part of this document. NOTE 3   The
    safety requirements for DC EV supply equipment where protection relies on electrical
    separation are specified in IEC 61851-25. NOTE 4   The safety requirements for
    DC EV supply equipment where protection relies on double or reinforced insulation
    are specified in IEC TS 61851-3-1 and IEC TS 61851-3-2.
