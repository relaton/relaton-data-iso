abstract:
- language: en
  script: Latn
  content: ISO 28560-3:2011 provides a data model and encoding rules for the use of
    radio frequency identification (RFID) tags for items appropriate for the needs
    of all types of libraries, including academic, public, corporate, special and
    school. ISO 28560-3:2011 specifies the rules for encoding a subset of data elements
    taken from the total set of data elements listed in ISO 28560-1 into a basic block,
    and other data elements into extension blocks onto the RFID tag.
