abstract:
- language: en
  script: Latn
  content: This document specifies the determination of Zearalenone (ZEN) in natural products using LC-FLD. It is applicable to the analysis of ZEN in raw materials and manufactured products including decoction pieces derived from plants and animals. It is suitable for the samples during the processes of harvesting, transportation, storage, as well as domestic and foreign trades for quality classification.
