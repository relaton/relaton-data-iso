abstract:
- language: en
  script: Latn
  content: This document specifies a measurement method and requirements for exhaust
    silencers which are installed on reciprocating internal combustion engines, including
    laboratory measurement and site measurement. This document applies to all exhaust
    silencers installed on reciprocating internal combustion engines falling within
    the field of application of ISO 3046 1. This document can also apply to other
    exhaust silencers for which no suitable International Standard exists. NOTE           
    Throughout the text, exhaust silencer is referred to as silencer and reciprocating
    internal combustion engine as engine.
