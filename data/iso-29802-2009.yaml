abstract:
- language: en
  script: Latn
  content: 'ISO 29802:2009 specifies the designations, dimensions, markings and load
    ratings of pneumatic tyres primarily intended for all terrain vehicles (ATV).
    It also specifies the designation, marking and contours of rims. The tyres are
    based on the following parameters: speeds not exceeding 130 km/h (speed symbol
    M); fitted to (AT) 5° tapered drop centre rims; nominal rim diameter codes of
    7 to 14 inclusive.'
