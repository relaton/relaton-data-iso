abstract:
- language: en
  script: Latn
  content: This document specifies requirements and guidelines for the planning, design, construction, renovation, operation and maintenance of school science laboratories. It covers site planning, space allocation, laboratory layouts, utilities integration, storage facilities, health and safety provisions, accessibility, environmental sustainability, energy efficiency, climate resilience, digital and smart laboratory infrastructure, waste management, and support facilities necessary for effective laboratory operation. The document applies to laboratories in primary schools, secondary schools, vocational institutions, technical colleges and university teaching laboratories. This document does not specify technical performance requirements for laboratory equipment, analytical instruments, testing procedures, laboratory personnel competence, laboratory accreditation, or laboratory testing activities that are covered by other ISO technical committees.
