abstract:
- language: en
  script: Latn
  content: 1.1 This document establishes a system of designation for plasticized PVC
    thermoplastic material which can be used as the basis for specifications. 1.2
    The types of PVC-U plastics are differentiated from each other by a classification
    system based on appropriate levels of the designatory properties a) Shore hardness,
    b) density, c) torsional-stiffness temperature at 300 MPa, and on information
    about physical form, intended application and/or method of processing, important
    properties, additives, colorants. 1.3 This document is applicable to all plasticized
    compositions of homopolymers and copolymers that contain at least a mass percentage
    of 50 % of vinyl chloride. It is also applicable to plasticized compositions containing
    chlorinated poly (vinyl chloride) and to plasticized compositions containing blends
    of one or more of the above-mentioned polymers, provided that the total amount
    of these polymers represents at least a mass percentage of 50 % of the polymer
    content of the composition. This document applies to materials ready for normal
    use in the form of powder (dry blends), granules or pellets and to materials unmodified
    or modified by colorants, additives, fillers, etc. It does not apply to cellular
    plastics or to paste compositions (plastisols). 1.4 This document does not intend
    to imply that materials having the same designation give the same performance.
    It does not provide engineering data, performance data or data on processing conditions
    which might be required to specify a material for a particular application and/or
    method of processing. If additional properties are required, they are, if suitable,
    determined using the test methods specified in ISO 24023-2. 1.5 In order to specify
    a thermoplastic material for a particular application or to ensure reproducible
    processing, additional requirements can be given in data block 5 (see 4.1).
