abstract:
- language: en
  script: Latn
  content: 'ISO/TS 29002-20:2010 specifies an interface to retrieve information from
    a concept dictionary. Three sets of capabilities, called "services", are defined:
    Location Service: given a registration authority identifier, returns location
    on the Internet of Terminology and Ontology servers for the registration authority;
    Terminology Service: searches for concepts, languages, and other elements of the
    dictionary based on a rich set of keywords, search criteria, and expressions;
    given an international registration data identifier (IRDI) in the format defined
    in ISO/TS 29002-5, retrieves terminological information; Ontology Service: retrieves
    ontological information about a concept based on the concept''s IRDI.'
