abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of polymer-based composite
    machinable blanks with respect to the milling process and provides the test methods
    that address the clinical issues specific to those materials. In addition, this
    document specifies the items to be described on the packaging and materials, as
    well as descriptions to be included in the instructions for use. The polymer-based
    composite machinable blanks covered in this document are blanks that are used
    for fabricating permanent dental restorative appliances (e.g. single crowns or
    inlays) by milling processes. They do not include large-sized blanks (e.g. discs)
    that allow for the fabrication of two or more units of crowns or bridges from
    one blank or materials for temporary use.
