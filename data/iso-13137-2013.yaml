abstract:
- language: en
  script: Latn
  content: ISO 13137:2013 specifies performance requirements for battery powered pumps
    used for personal sampling of chemical and biological agents in workplace air.
    It also specifies test methods in order to determine the performance characteristics
    of such pumps under prescribed laboratory conditions. ISO 13137:2013 is applicable
    to battery powered pumps having a nominal volume flow rate above 10 ml ⋅ min−1,
    as used with combinations of sampler and collection substrate for sampling of
    gases, vapours, dusts, fumes, mists and fibres. ISO 13137:2013 is primarily intended
    for flow-controlled pumps.
