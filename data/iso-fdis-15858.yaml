abstract:
- language: en
  script: Latn
  content: ISO 15858:2016 specifies minimum human safety requirements for the use
    of UVC lamp devices. It is applicable to in-duct UVC systems, upper-air in room
    UVC systems, portable in-room disinfection UVC devices, and any other UVC devices
    which may cause UVC exposure to humans. It is not applicable to UVC products used
    for water disinfection.
