abstract:
- language: en
  script: Latn
  content: This document defines terms relating to automated liquid handling systems
    (ALHS). This document also specifies general requirements for the use of ALHS.
    It describes types of ALHS and specific use requirements, settings, and adjustments
    for each ALHS type. It also specifies environmental requirements for the use of
    ALHS. This document is applicable to all ALHS with complete, installed liquid
    handling devices, including tips and other essential parts needed for delivering
    a specified volume, which perform liquid handling tasks without human intervention
    into labware. NOTE       Measurement procedures for the determination of volumetric
    performance are given in ISO 23783-2. The determination, specification, and reporting
    of volumetric performance of automated liquid handling systems are described in
    ISO 23783-3.
