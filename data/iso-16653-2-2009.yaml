abstract:
- language: en
  script: Latn
  content: ISO 16653-2:2009 specifies the design, calculations, safety requirements
    and test methods for mobile elevating work platforms (MEWPs) with non‑conductive
    (insulating) components. It is intended to be used in conjunction with ISO 16368.
    It is applicable to all types and sizes of MEWPs with non-conductive (insulating)
    components, including dielectric components designed and tested to meet the specific
    electrical properties consistent with the manufacturer's identification plate.
    This equipment is intended to move persons, tools and equipment to working positions
    where they can carry out work from a work platform located above a non-conductive
    boom section. ISO 16653-2:2009 covers structural design calculations and application
    of stability criteria, construction, safety examinations and tests done before
    MEWPs with non-conductive (insulating) components are first put into service.
    It identifies the hazards arising from the use of MEWPs with non-conductive (insulating)
    components and describes methods for the elimination or reduction of these hazards.
    It is not applicable to MEWPs designed for live working (see IEC 61057).
