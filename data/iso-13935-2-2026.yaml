abstract:
- language: en
  script: Latn
  content: This document specifies methods for the determination of seam maximum force
    of sewn seams when the force is applied perpendicularly to the seam. It describes
    the method known as the grab test. The method defined in this document is applicable
    to woven textile fabrics, including fabrics which exhibit stretch characteristics
    imparted by the presence of an elastomeric fibre, mechanical or chemical treatment.
    It can be applicable to fabrics produced by other techniques. It is normally not
    applicable to geotextiles, nonwovens, coated fabrics, textile-glass woven fabrics
    and fabrics made from carbon fibres or polyolefin tape yarns.[2], [3], [4] This
    method is applicable to straight seams only (obtained from previously sewn articles
    or prepared from fabric samples) and not to curved seams (see Annex B for considerations
    on seams). The method is restricted to the use of constant-rate-of-extension (CRE)
    testing machines.
