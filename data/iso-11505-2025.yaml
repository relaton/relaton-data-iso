abstract:
- language: en
  script: Latn
  content: This document specifies a glow discharge optical emission spectrometric
    (GD-OES) method for the determination of the thickness, mass per unit area and
    chemical composition of surface layer films. The applicability of this document
    is limited to description of general procedures for quantification of the chemical
    composition and thickness in GD-OES compositional depth profiling. This document
    is not directly applicable for quantification of individual materials having various
    thicknesses and elements to be determined.
