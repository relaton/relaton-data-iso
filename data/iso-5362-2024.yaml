abstract:
- language: en
  script: Latn
  content: This document specifies requirements for anaesthetic reservoir bags for
    use with anaesthetic and ventilator breathing systems. It includes requirements
    for the design of the neck, size designation and elasticity. This document is
    not applicable to special-purpose bags, for example bellows, self-inflating bags
    and bags for use with anaesthetic gas scavenging systems. The requirements in
    this device-specific standard take precedence over any conflicting requirements
    in the general standard for airway devices (ISO 18190). All the common requirements
    that appear in the general standard for airway devices have been removed from
    this document.
