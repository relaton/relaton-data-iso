abstract:
- language: en
  script: Latn
  content: ISO/TS 17104:2006 specifies a laboratory performance test method for hydraulic
    impulse tools for installing threaded fasteners. It gives instructions on the
    procedure, performance parameters to test, how to evaluate and present the test
    data and justification for the test method. ISO/TS 17104:2006 is not intended
    as a routine in-plant inspection method.
