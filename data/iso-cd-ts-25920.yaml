abstract:
- language: en
  script: Latn
  content: This document specifies a DNA metabarcoding method for the identification
    of mammals and birds at the genus or species level and allows the identification
    of a large number of commercially significant as well as exotic animals. A DNA
    segment from the mitochondrial 16S ribosomal RNA gene is amplified using PCR and
    then sequenced using next generation sequencing (NGS). The results are analysed
    bioinformatically. This document specifies a DNA metabarcoding method for the
    identification of mammals and birds at the genus or species level and allows the
    identification of a large number of commercially significant as well as exotic
    animals. A DNA segment from the mitochondrial 16S ribosomal RNA gene is amplified
    using PCR and then sequenced using next generation sequencing (NGS). The results
    are analysed bioinformatically. The method is applicable to all matrices (e.g.
    mixed products, processed foodstuff), from which amplifiable DNA can be extracted.
    It has been successfully validated in a collaborative study using a short read
    sequencing platform (emitted fluorescence detection) with DNA extract mixtures
    and DNA of sausages of known composition. The method is also described using ion
    semiconductor sequencing but was not collaboratively validated.
