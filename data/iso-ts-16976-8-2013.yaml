abstract:
- language: en
  script: Latn
  content: 'ISO/TS 16976-8:2013 gives guidance on the generic ergonomic factors for
    the preparation of standards for performance requirements, testing and use of
    respiratory protective devices (RPD). It specifies principles relating to: the
    biomechanical interaction between RPD and the human body; the interaction between
    RPD and the human senses: vision, hearing, smell, taste and skin contact.'
