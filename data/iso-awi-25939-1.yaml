abstract:
- language: en
  script: Latn
  content: This series of documents specifies general requirements for test environment
    of testing of ADAS on test track and public roads and others. It aims for a simplified
    general test structure as reference for future ADAS tests method development.
    Part 1 of the series is intended to define those general environmental conditions
    for test track. Remaining and specific test environment, means and parameters
    will be defined within the function specific ADAS test specification if needed.
