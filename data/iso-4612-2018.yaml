abstract:
- language: en
  script: Latn
  content: This document specifies two methods, A and B, for the preparation of pastes
    (also known as plastisols) from appropriate PVC resins, plasticizers and other
    ingredients using a planetary mixing process. Both method A and method B can be
    used to prepare pastes of any composition. Method A (single-speed) is particularly
    applicable to resins prone to heat build-up during paste preparation, while method
    B (two-speed) might be preferred for repetitive work, e.g. for process control
    during resin manufacture, because of its shorter mixing time. Such pastes can
    be used for a variety of test purposes, including the determination of rheological
    properties for resin designation and specification.
