abstract:
- language: en
  script: Latn
  content: 'This document specifies environmental, social and economic requirements
    to implement a sustainability management system in accommodation establishments
    in the tourism sector. This document applies to the aspects that can be controlled
    by the accommodation establishments and over which they can exert influence. This
    document is applicable to any accommodation establishment, regardless of its type,
    size or location, that wishes to: a) implement, maintain and improve sustainable
    practices in their operations; b) ensure conformance with its defined sustainability
    policy.'
