abstract:
- language: en
  script: Latn
  content: The scope of JPEG DNA is the creation of a standard for efficient coding
    of images that considers biochemical constraints and offers robustness to noise
    introduced by the different stages of the storage process that is based on DNA
    synthetic polymers. JPEG DNA is a multipart standard. Part 1, JPEG DNA Core Coding
    System, defines the syntax and an accompanying decompression process that is capable
    of representing bi-level, continuous-tone grey-scale, continuous-tone colour,
    or multichannel digital samples in a format representing nucleotide sequences
    for supporting DNA storage.
