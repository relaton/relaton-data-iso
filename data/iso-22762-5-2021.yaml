abstract:
- language: en
  script: Latn
  content: This document specifies minimum requirements and test methods for flat
    sliding seismic-protection isolators used for buildings and the materials used
    in the manufacture of such isolators. It is applicable to flat sliding seismic-protection
    isolators used to provide buildings with protection from earthquake damage. The
    sliders are each mounted on elastomeric bearings to provide vertical compliance
    and rotational flexibility about horizontal axes.
