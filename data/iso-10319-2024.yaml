abstract:
- language: en
  script: Latn
  content: This document specifies an index test method for the determination of the
    tensile properties of geosynthetics (polymeric, glass and metallic), using a wide-width
    strip. This document is applicable to most geosynthetics, including woven geotextiles,
    nonwoven geotextiles, geocomposites, knitted geotextiles, geonets, geomats and
    metallic products. It is also applicable to geogrids and similar open-structure
    geotextiles, but specimen dimensions will possibly need to be altered. It is not
    applicable to polymeric or bituminous geosynthetic barriers, but it is applicable
    to clay geosynthetic barriers. This document specifies a tensile test method that
    covers the measurement of tensile force, elongation characteristics and includes
    procedures for the calculation of secant stiffness, maximum load per unit width
    and strain at maximum force. Singular points on the tensile force-extension curve
    are also indicated. Procedures for measuring the tensile properties of both conditioned
    and wet specimens are included in this document.
