abstract:
- language: en
  script: Latn
  content: This document specifies the geometry of test specimens and the testing
    procedure for mechanized peel testing of single mechanical joints on single-lap
    test specimens up to a single sheet thickness of 4,5 mm. The term "sheet", as
    used in this document, includes extrusions and cast materials. The purpose of
    the mechanized peel tests is to determine the mechanical characteristics and the
    failure modes of the joints made with different joining methods. This document
    does not apply to civil engineering applications such as metal buildings and steel
    constructions which are covered by other application standards. NOTE For mechanized
    peel testing of resistance spot, seam and embossed projection welds, see ISO 14270
