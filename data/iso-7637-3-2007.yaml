abstract:
- language: en
  script: Latn
  content: 'ISO 7637-3:2007 establishes a bench top test for the evaluation of the
    immunity of devices under test (DUTs) to transient transmission by coupling via
    lines other than supply lines. The test transient pulses simulate both fast and
    slow transient disturbances, such as those caused by the switching of inductive
    loads and relay contact bounce. Three test methods are described in ISO 7637-3:2007:
    the capacitive coupling clamp (CCC) method; the direct capacitive coupling (DCC)
    method; and the inductive coupling clamp (ICC) method. Only one test method need
    be selected for slow transients and only one method need be selected for fast
    transients. ISO 7637-3:2007 applies to road vehicles fitted with nominal 12 V,
    24 V or 42 V electrical systems. For transient immunity, Annex B provides recommended
    test severity levels in line with the functional performance status classification
    (FPSC) principle described in ISO 7637-1.'
