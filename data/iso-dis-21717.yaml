abstract:
- language: en
  script: Latn
  content: This document contains the basic control strategy, minimum functionality
    requirements, basic driver interface elements, minimum requirements for diagnostics
    and reaction to failure, and performance test procedures for Partially Automated
    In-Lane Driving Systems (PADS). This document is applicable to passenger cars,
    commercial vehicles and buses. It is not applicable to automated driving systems
    of level 3 or higher (as defined in SAE J3016:2016).
