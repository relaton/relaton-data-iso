abstract:
- language: en
  script: Latn
  content: 'ISO 4094:2017 provides both general requirements and specific requirements
    (Annex A) for laboratories seeking to become "Authorized Laboratories (ALs)" and
    to maintain their Authorized Laboratory status for the issue of optical reference
    transfer standards of level 3. This document follows the requirements and adopts
    the format of ISO/IEC 17025, with the aims of: a) establishing and maintaining
    international optical reference transfer standards of level 2 (IR2) traceable
    to an international optical reference primary standard of level 1 (IR1) maintained
    by a standardizing laboratory; b) distributing traceability required to achieve
    inter-laboratory agreement in the results of test methods specified in International
    Standards for optical properties of paper, board or pulp; c) participating in
    the design and development of new methods and international harmonization of procedures.
    When a laboratory does not undertake one or more of the activities covered by
    this document, such as sampling and the design/development of new methods, the
    requirements of those clauses do not apply. ISO 4094:2017 is for use by specified
    laboratories authorized to issue optical reference transfer standards in developing
    their management system for quality, administrative and technical operations.
    Laboratory customers, regulatory authorities and accreditation bodies can also
    use it in confirming or recognizing the competence of laboratories. NOTE It might
    be necessary to explain or interpret certain requirements in this document to
    ensure that the requirements are applied in a consistent manner. Guidance for
    consistent application can be obtained from Technical Committee ISO/TC 6.'
