abstract:
- language: en
  script: Latn
  content: This document provides guidelines for good practices that can be adopted
    by organizations for the implementation of commuting safety management. These
    practices are intended to reduce the number of fatalities and serious injuries,
    the severity of injuries, and further to minimize damage to property and economic
    loss due to road crashes. This document is applicable to any organization to help
    it protect commuters including vulnerable road users (VRU) through the adoption
    of a proactive approach to manage commuting risks. This document is also applicable
    to commercial transport organizations including fleet operators, as well as schools.
