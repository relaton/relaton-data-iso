abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for the determination of
    delamination propagation curves (average delamination increment per cycle da/dN
    on a logarithmic scale) as a function of applied mode I strain energy release
    rate GI (or a quantity proportional to (√GI)2, also on a logarithmic scale) for
    unidirectional fibre-reinforced plastic composites using the Double Cantilever
    Beam (DCB) specimen and test apparatus. It is applicable to unidirectional carbon-fibre
    and glass-fibre reinforced thermosets and thermoplastics. The scope is not necessarily
    limited to these fibres and lay-ups, but for laminates with other types of fibres
    or lay-ups, no recommendations for specimen dimensions and fibre volume content
    are currently available.
