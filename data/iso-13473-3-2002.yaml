abstract:
- language: en
  script: Latn
  content: ISO 13473-3:2002 specifies requirements for profilometers used in pavement
    engineering in order to give meaningful and accurate measurement of micro-, macro-
    and megatexture characteristics of paved road and airfield surfaces. It also includes
    schemes for the classification of such profilometers with respect to their use
    and overall accuracy. The profilometers may be of any operational type. The scope
    of ISO 13473-3:2002 does not include profile analysis of machined surfaces. Also
    excluded from the scope is the profile analysis of road unevenness.
