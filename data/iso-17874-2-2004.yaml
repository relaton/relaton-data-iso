abstract:
- language: en
  script: Latn
  content: ISO 17874-2:2004 specifies the criteria for the selection, installation
    and use of a mechanical master-slave manipulator, for remote handling of radiaoactive
    materials in a nuclear facility. ISO 17874-2:2004 deals only with the technical
    aspects related to the manipulator and its interface with the nuclear facility
    in which it is intended to be installed. In particular, the process apparatus
    and the manipulator features need to be studied in parallel in order to optimize
    all the functionalities of the manipulator. However, ISO 17874-2:2004 does not
    cover the fundamental design criteria of the nuclear facility (e.g. the process
    involved, maintenance of the process equipment, intervention for other purposes).
