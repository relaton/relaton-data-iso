abstract:
- language: en
  script: Latn
  content: This document provides a humanoid robot dataset life cycle framework, specifies
    the general requirements throughout the dataset life cycle covering stages from
    dataset planning to dataset decommissioning, and specifies the across-cutting
    requirements across dataset life cycle including dataset quality, security and
    privacy requirements. This document is applicable to organizations and individuals
    engaged in the creation and management of humanoid robot datasets, including training,
    validation, and test datasets used for the training, selection, and evaluation
    of machine learning models applied in humanoid robots. This document is applicable
    to humanoid robots used in various application domains, including industrial,
    service, and medical domains, and regardless of their locomotion configuration
    (bipedal, wheeled or other forms of locomotion)
