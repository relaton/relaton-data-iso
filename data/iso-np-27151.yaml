abstract:
- language: en
  script: Latn
  content: 'This standard specifies the data requirements for the design of civil engineering works for small hydropower projects with a capacity of up to 30 MW. It covers the engineering design requirements for civil components, including: - headworks and diversion structures (small dams, weirs, and intake works);  - desilting structures and water conductor systems (channels, tunnels, pipes, forebays, balancing reservoirs, surge tanks, penstocks, and anchor blocks); - powerhouse structures; and - associated infrastructure, including access roads, bridges, store facilities, and auxiliary buildings.'
