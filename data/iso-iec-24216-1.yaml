abstract:
- language: en
  script: Latn
  content: This document provides guidance for creators, designers, producers, exhibitors,
    and distributors on user interface using avatar in the contents. This document
    defines terms and categorization by visual designs and functions of avatar. This
    document also refers considerations of ethical and usability aspects in design,
    distribution, and operation processes. This document is applicable to all fields
    of information technology that use avatars in the contents, including both entertainments
    and business applications on Virtual Reality, Augmentation Reality, Mixed Reality,
    Cyber-Physical System, Metaverse, and Interverse.
