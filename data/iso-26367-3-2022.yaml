abstract:
- language: en
  script: Latn
  content: 'This document is applicable to the sampling and analysis of effluents
    produced during fires that have the potential to cause harm through environmental
    contamination. It provides additional requirements to those International Standards
    already published by ISO TC 92/SC 3 for the sampling and analysis of fire effluents
    from experimental fires and standard tests, specifically as best practice from
    previously published methodologies. This document does not include pollutant screening
    of exposed humans or animals. The principle aims for the sampling and analysis
    of effluents from fires that can result in environmental contamination is therefore
    to provide information on: —    the nature and concentrations of airborne effluents
    over time and distance; —    the nature and concentrations of solid and liquid
    ground contaminants and “run-off” compounds from firefighting operations over
    time and distance. This document is principally of interest for the following
    parties: —    environmental regulatory authorities; —    public health authorities;
    —    fire investigators; —    property owners. This document is intended to be
    used together with ISO 26367-1 and ISO 26367-2 in assessments of the environmental
    impact of fire effluents.'
