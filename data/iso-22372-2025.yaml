abstract:
- language: en
  script: Latn
  content: This document provides guidelines for establishing, maintaining, monitoring
    and improving infrastructure resilience to help ensure the continuity and robustness
    of essential services. It supports collaborative decision-making across many stakeholders
    in diverse organizations. It can be used for engaging stakeholders at all levels
    responsible for, or having influence on, infrastructure resilience matters. This
    document is intended to be applicable to all types and sizes of organizations
    which have a role in infrastructure resilience.
