abstract:
- language: en
  script: Latn
  content: This document specifies the properties and performance requirements for surrogate roadside stationary objects (RSO) used for creating test scenarios to assess the system detection and activation performance of active safety systems and Automated Driving Systems (ADS). This document specifies roadside stationary objects representing — vehicle restraint systems, such as metal guardrails and concrete barriers, — posts, poles and pillars, — walls, — pavements, sidewalks, curbs. The document addresses the detection requirements for the objects in terms of sensing technologies commonly in use at the time of publication of this document, and where possible, anticipated future sensing technologies. It also addresses methodologies to verify the object response properties to these sensors. This document does not address the test procedures or performance criteria for active safety systems being evaluated.
