abstract:
- language: en
  script: Latn
  content: ISO 13495:2013 specifies molecular tools for generating molecular profiles
    of varieties of plant species, enabling varietal identification, i.e. confirmation
    of identity in relation to one or more references. ISO 13495:2013 is applicable
    to various matrices, seeds, leaves, roots, industrial products composed of only
    one variety. Matrices presented in the form of mixtures of varieties (such as
    purees, compotes, flours) are excluded from the scope of ISO 13495:2013. It does
    not deal with genetic purity.
