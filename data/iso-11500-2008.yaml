abstract:
- language: en
  script: Latn
  content: ISO 11500:2008 specifies an automatic particle-counting procedure for determining
    the number and sizes of particles present in hydraulic-fluid bottle samples of
    clear, homogeneous, single-phase liquids using an automatic particle counter (APC)
    that works on the light-extinction principle. ISO 11500:2008 is applicable to
    the monitoring of the cleanliness level of fluids circulating in hydraulic systems,
    the progress of a flushing operation, the cleanliness level of support equipment
    and test rigs and the cleanliness level of packaged stock.
