abstract:
- language: en
  script: Latn
  content: ISO 15528:2013 specifies procedures for the sampling of paints, varnishes
    and raw materials used in their manufacture. Such products include liquids and
    materials which, without undergoing chemical modification, are capable of being
    liquefied when heated up, and powdered, granulated and pasty materials. Samples
    may be taken from containers, e.g. cans, drums, tanks, tank wagons or ships' tanks,
    as well as from barrels, sacks, big-bags, silos or silo wagons, or from conveyor
    belts. ISO 15528:2013 does not deal with the sample preparation for testing or
    reduction of the samples thus taken. This is dealt with in ISO 1513.
