abstract:
- language: en
  script: Latn
  content: ISO 17632:2015 specifies requirements for classification of tubular cored
    electrodes with or without a gas shield for metal arc welding of non-alloy and
    fine grain steels in the as-welded condition or in the post-weld heat-treated
    condition with a minimum yield strength of up to 500 MPa or a minimum tensile
    strength of up to 570 MPa. One tubular cored electrode can be tested and classified
    with different shielding gases, if any. This International Standard is a combined
    specification providing classification utilizing a system based upon the yield
    strength and the average impact energy of 47 J of all-weld metal or utilizing
    a system based upon the tensile strength and the average impact energy of 27 J
    of all-weld metal. 1) Paragraphs and tables which carry the suffix letter "A"
    are applicable only to tubular cored electrodes classified to the system based
    upon the yield strength and the average impact energy of 47 J of all-weld metal
    in accordance with this International Standard. 2) Paragraphs and tables which
    carry the suffix letter "B" are applicable only to tubular cored electrodes classified
    to the system based upon the tensile strength and the average impact energy of
    27 J of all-weld metal in accordance with this International Standard. 3) Paragraphs
    and tables which have neither the suffix letter "A" nor the suffix letter "B"
    are applicable to all tubular cored electrodes classified in accordance with this
    International Standard. It is recognized that the operating characteristics of
    tubular cored electrodes can be modified by the use of pulsed current, but for
    the purposes of this International Standard, pulsed current is not permitted for
    determining the electrode classification.
