abstract:
- language: en
  script: Latn
  content: This document sets out the designation, contours and dimensions for rims
    for narrow- and wide-base off-road tyres primarily intended for earth-moving machinery.
    All dimensions in this document are given in millimetres and are applicable to
    the side of the rim which is in contact with the tyre. Tyre designations and dimensions,
    tyre classifications and nomenclature are given in ISO 4250-1, ISO 10571 and ISO
    13442. Annex A gives details on sealing ring grooves and O-rings for earth-mover
    rims.
