abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the thermal stability
    at elevated temperature of compounds and products based on vinyl chloride homopolymers
    and copolymers (in the following text abbreviated as PVC) which undergo dehydrochlorination
    (the evolution of hydrogen chloride). This document is applicable to the characterization
    of PVC compounds and products, especially with regard to the effectiveness of
    their heat-stabilizing systems. It is applicable to coloured PVC compounds and
    products where a discolouration test under the action of heat may be unsatisfactory.
    This document is applicable to compounded PVC materials and products. It can be
    applicable to polymers in powder form under appropriate conditions, to be agreed
    upon between the interested parties. This document does not apply to PVC compounds
    in the form of dry blends, since such materials can be not sufficiently homogeneous.
    This document does not apply to PVC compounds and products which evolve other
    decomposition products, in addition to hydrogen chloride, at elevated temperatures
    that can affect the conductivity of water when they are absorbed into it. In this
    case, a method suitable for the determination of chloride ion (Cl−) in the absorbing
    solution shall be used (see ISO 182-4[2]). This document can also be applied to
    other plastics materials which can evolve hydrogen chloride or other hydrogen
    halides when heated under the conditions prescribed by the relevant specifications,
    or as agreed upon between the interested parties.
