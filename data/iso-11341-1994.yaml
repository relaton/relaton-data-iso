abstract:
- language: en
  script: Latn
  content: Specifies a method for assessing either the resistance of paint coatings
    to artificial weathering or the resistance to light by exposure to artificial
    radiation. Describes the most important parameters and specifies the conditions
    to be used in the exposure apparatus. In strictly respecting the test conditions
    specified, reproducibility is improved and an improved correlation is obtained
    between natural-weathering and artificial-weathering test.
