abstract:
- language: en
  script: Latn
  content: ISO 3815-2:2005 specifies analytical methods for determining the chemical
    composition of zinc and zinc alloys in accordance with ISO 301 and ISO 752 by
    inductively coupled optical emission spectrometry. ISO 3815-2:2005 includes provisions
    for preparation of test solutions and calibration solutions for zinc and zinc
    alloys. The ranges specified for each method can be extended and/or adapted for
    determinations of low concentrations. ISO 3815-2:2005 can be applied to other
    elements (e.g. Ni, Cr and Ti). However, such results will need to be carefully
    checked by taking into account the interferences, the sensivity, the resolution
    and the linearity criteria for each instrument and each wavelength.
