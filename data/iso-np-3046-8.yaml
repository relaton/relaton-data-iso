abstract:
- language: en
  script: Latn
  content: This document specifies the test methods for lubricating oil consumption
    of reciprocating internal combustion (RIC) engines, including test methods for
    lubricating oil consumption and lubricating oil consumption rate. It applies to
    reciprocating internal combustion engines for land, rail-traction and marine use
    and may be applied to engines used to propel road construction and earth-moving
    machines, industrial trucks as well as for other applications where no suitable
    International Standard for these engines exists.
