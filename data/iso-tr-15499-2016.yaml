abstract:
- language: en
  script: Latn
  content: ISO/TR 15499:2016 is applicable to the conduct of biological evaluation
    of medical devices according to the requirements of ISO 10993‑1. It does not add
    to, or otherwise change, the requirements of ISO 10993‑1. This document does not
    include requirements to be used as the basis of regulatory inspection or certification
    assessment activities. This guidance is applicable to all biological evaluation
    of all types of medical devices including active, non-active, implantable and
    non-implantable medical devices.
