abstract:
- language: en
  script: Latn
  content: ISO/TR 10687:2012 summarizes descriptive quantities for those responsible
    (e.g. scientists, safety engineers) for determination of postures for a seated
    person who is exposed to whole-body vibration. It is the intention that the results
    of different methods which also are summarized can be easily related to these
    quantities and that they allow for a common terminology between practitioners.
    The postures determined can also be used as a basis for further investigation
    or as a means of comparison for different methods. Although some of the approaches
    described here can be applied to standing or recumbent positions, additional considerations
    are likely to be required in these cases. Additionally, ISO/TR 10687:2012 deals
    with dynamic postures where body angles or associated movements are determined
    visually or by measuring points on the skin or clothing. ISO/TR 10687:2012 does
    not recommend sampling strategies or evaluation methods.
