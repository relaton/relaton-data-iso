abstract:
- language: en
  script: Latn
  content: This document specifies the boundary dimensions for radial needle roller
    and cage assemblies. In addition, this document gives the tolerances for the cage
    width and method of functional gauging of bore diameter of needle roller complement.
    Informative values for the tolerances of shaft raceway, housing raceway and raceway
    widths are given in Annex A. Functional gauging of radial needle roller and cage
    assembly is given in Annex B.
