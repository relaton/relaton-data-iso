abstract:
- language: en
  script: Latn
  content: 'This document specifies two methods: - a reference method for the determination
    of the moisture content of maize grains and ground whole maize, groats, grits
    and maize flour, see Clause 4; - a routine method for the evaluation of the moisture
    content of maize in whole grains, see Clause 5. The latter is not suitable for
    use for experts'' reports, or for calibration or checking of humidity meters,
    because of its significant bias to the reference method (see Table B.3).'
