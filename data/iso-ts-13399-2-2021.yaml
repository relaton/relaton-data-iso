abstract:
- language: en
  script: Latn
  content: 'This document specifies a reference dictionary for cutting items, together
    with their descriptive properties and domains of values. This document specifies
    a reference dictionary containing: —    definitions and identifications of the
    classes of cutting items and their features, with an associated classification
    scheme; —    definitions and identifications of the data element types that represent
    the properties of cutting items and their features; —    definitions and identifications
    of domains of values for describing the above-mentioned data element types. The
    following are within the scope of this document: —    standard data that represent
    the various classes of cutting items and cutting item features; —    standard
    data that represent the various properties of cutting items and cutting item features;
    —    standard data that represent domains of values used for properties of cutting
    items and cutting item features; —    definitions of reference systems for cutting
    items and their properties; —    one implementation method by which the standard
    data defined in this document can be exchanged. NOTE 1    The implementation method
    by which the standard data defined in this document can be exchanged is specified
    in ISO 10303-21. The following are outside the scope of this document: —    applications
    where these standard data can be stored or referenced; —    implementation methods
    other than the one defined in this document by which the standard data can be
    exchanged and referenced; —    information model for cutting tools; —    definitions
    of classes and properties for tool items; —    definitions of classes and properties
    for adaptive items; —    definitions of classes and properties for assembly items
    and auxiliary items. NOTE 2    The information model for cutting tools is defined
    in ISO 13399-1. NOTE 3    The definitions of classes and properties for tool items,
    adaptive items, assembly items, and auxiliary items are provided in ISO/TS 13399-3,
    ISO/TS 13399-4, and ISO/TS 13399-5, respectively.'
