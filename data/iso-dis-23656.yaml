abstract:
- language: en
  script: Latn
  content: This document provides general requirements for quality management of data
    collected from ships needed to calculate a ship environmental index, such as the
    Carbon Intensity Indicator (CII), which is specified by IMO MEPC for carbon emission
    reduction. The requirements presented in this document can be applied to the data
    quality management of all cargo, RoPax and cruise ships above 5,000 GT. The data
    collected from the EU MRV and IMO DCS, which are used to calculate the ship environment
    index, are subject to quality management. In addition, it includes requirements
    for a system for reporting from ships to shore when issues related to data quality
    occur.
