abstract:
- language: en
  script: Latn
  content: This document specifies requirements for using blockchain and distributed
    ledger technologies (DLT) for trust anchors and trust management in decentralized
    identity systems. The document focuses on requirements to use DLT systems for
    • issuance, storage, revocation and management of trust anchors for decentralized
    identity management • trust management including the approval and revocation of
    trusted roles, issuance and verification role for decentralized identity management
    • interoperability with non-DLT based trust management for decentralized identity
    management The target audience of this document includes software developers,
    providers of components and infrastructure for decentralized identity management
    and allied professionals; IT professionals and application developers; legal and
    compliance professionals; researchers; educators; and other interested parties.
    Additionally the document address authorities responsible for trust management
    within identity management and related subjects.
