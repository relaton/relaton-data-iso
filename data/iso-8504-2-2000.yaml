abstract:
- language: en
  script: Latn
  content: This part of ISO 8504 describes abrasive blast-cleaning methods for the
    preparation of steel surfaces before coating with paints and related products.
    It also contains information on the effectiveness of the individual methods and
    their fields of application. ISO 8504 is applicable to new and corroded steel
    surfaces and to steel surfaces that are uncoated or have been previously coated
    with paints and related products. For limitations, see note 2. NOTE 1 These methods
    are essentially intended for hot-rolled steel to remove mill scale, rust, etc.,
    but could also be used for cold-rolled steel of sufficient thickness to withstand
    the deformation caused by the impact of abrasive. NOTE 2 There are several items
    that should be included in the purchaser's procurement documents to supplement
    this part of ISO 8504. Items that should be considered as a part of surface preparation
    before coating are edge grinding, removal of grease and oil, porosity of welds,
    removal of weld spatter, removal of burrs and other sharp edges, grinding of welds,
    filling of pits and other surface imperfections that may cause premature failure
    of the coating system (see ISO 8501-3 for more information) and the removal of
    water-soluble contaminants.
