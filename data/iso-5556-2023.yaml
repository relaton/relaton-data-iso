abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the design, construction, safety,
    performance and acceptance testing of single-drum winches for oceanographic research
    (hereafter referred as to “single-drum winches”) with hydraulic or electric drive.
    Single-drum winches are mainly used for fixed-point and towing marine survey,
    involving marine geological sampling, seawater water body parameter measurement
    and marine biological survey.
