abstract:
- language: en
  script: Latn
  content: ISO 10771 specifies a method of fatigue testing the pressure-containing
    envelopes of components used in hydraulic fluid power systems under sustained
    steady cyclic internal pressure loads. ISO 10771 is only applicable to component
    pressure-containing envelopes that are manufactured from metals, are operated
    at temperatures that exclude creep and low-temperature embrittlement, are only
    subjected to pressure-induced stresses, are not subjected to loss of strength
    due to corrosion or other chemical action and may include gaskets, seals and other
    non-metallic components; however, these are not considered part of the pressure-containing
    envelope being tested.
