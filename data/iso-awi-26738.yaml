abstract:
- language: en
  script: Latn
  content: 'This standard provides methods for assessing the driver’s viewing quality
    of AR images presented within the forward field of view. AR images displayed by
    a head-up display (HUD) are superimposed onto real-world objects such as preceding
    vehicles and road surfaces. This document covers both 2D and 3D HUD systems, regardless
    of the underlying technology, but excludes wearable-type HUDs. Considering actual
    driving environments, the driver’s viewing quality is assessed from the following
    perspectives: - To define the factors that affect visual comfort when viewing
    AR images and specifying their measurement methods; - To assessing AR images in
    terms of depth perception; - To assess spatial resolution and the relationship
    between the physical resolution and the perceived resolution of AR images.'
