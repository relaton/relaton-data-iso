abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for Shirodhara equipment intended for use in Ayurveda therapeutic procedures. It covers the design, construction, materials, dimensions, stability, liquid-flow characteristics, temperature-maintenance features where provided, safety, hygiene, durability and performance of the equipment. This document does not specify the therapeutic indications, clinical efficacy, treatment protocols, selection or formulation of liquids, duration or frequency of Shirodhara procedures, or requirements for the qualification of practitioners.
