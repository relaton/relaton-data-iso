abstract:
- language: en
  script: Latn
  content: 'ISO 2782-1:2016 specifies three methods for the determination of the permeability
    to gases of vulcanized or thermoplastic rubber under a differential partial pressure.
    The three methods specified are as follows: - pressure sensor method (using vacuum):
    for determining the gas transmission rate, gas permeability coefficient, gas diffusion
    coefficient and gas solubility coefficient; - simplified sensor method (using
    applied pressure): for determining the gas permeability coefficient only; - gas-chromatographic
    method: for determining the gas transmission rate and gas permeability coefficient.
    These methods apply to vulcanized and thermoplastic rubbers of hardness not less
    than 35 IRHD (international rubber hardness degrees) and to both single gases
    and mixtures of gases.'
