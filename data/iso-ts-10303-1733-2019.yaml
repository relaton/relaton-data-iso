abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1733:2019 specifies the application module for Planned characteristic.
    The following are within the scope of ISO/TS 10303-1733:2019: product properties
    based on a specific product definition that are planned for a specific end use
    or manufacturing environment; results of the evaluation of a specific product
    definition in a specific end use or manufacturing environment; results of the
    evaluation of a specific product definition in a rule based environment; product
    definition that is the collection of the results of evaluation of a specific product
    definition in a specific situation; classification of the evaluation type; classification
    of the evaluation result; identification of the requirement for the evaluation;
    items within the scope of application module Production rule, ISO/TS 10303-1739;
    items within the scope of application module Requirement assignment, ISO/TS 10303-1233.'
