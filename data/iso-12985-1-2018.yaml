abstract:
- language: en
  script: Latn
  content: This document specifies a dimensions method for the determination of the
    apparent density of carbonaceous products used in the production of aluminium.
    This method is applicable to samples with a simple or well-defined geometry (for
    example cylindrical, rectangular parallelepipedical or cubic) and a smooth surface
    profile. The accuracy of measurement is strongly influenced by the equipment used
    for sampling, i.e. the drilling and sawing machines.
