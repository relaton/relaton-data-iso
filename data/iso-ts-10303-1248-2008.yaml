abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1248:2008 specifies the application module for Product breakdown.
    The following are within the scope of ISO/TS 10303-1248:2008: the identification
    of a breakdown of a product or product_as_individual; the identification of the
    elements that comprise a breakdown; the identification of parent-child relationships
    between breakdown elements; the identification of relationships between elements
    in different breakdowns; items within the scope of application module Product
    view definition relationship, ISO/TS 10303-1041; items within the scope of application
    module Property assignment, ISO/TS 10303-1030.'
