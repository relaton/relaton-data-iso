abstract:
- language: en
  script: Latn
  content: This document specifies two methods (high temperature combustion and high
    pressure vessel combustion) for the determination of chlorine in solid mineral
    fuels. It is applicable to solid mineral fuels. The chlorine in the absorption
    solution can be determined using different finishes, such as coulometric or potentiometric
    titration, spectrophotometry or ion chromatography. The method is applicable to
    determine the chlorine content higher than 0,005 % mass fraction.
