abstract:
- language: en
  script: Latn
  content: This document specifies the test conditions for the determination of the
    tensile properties of unidirectional fibre-reinforced plastic composites, based
    upon the general principles given in ISO 527-1. NOTE      Isotropic and orthotropic
    reinforced materials are covered by ISO 527-4. The methods are used to investigate
    the tensile behaviour of the test specimens and for determining the tensile strength,
    tensile modulus, Poisson's ratios and other aspects of the tensile stress-strain
    relationship under the conditions defined. The test method is suitable for all
    polymer matrix systems reinforced with unidirectional fibres and which meet the
    requirements, including failure mode, set out in this document. The method is
    suitable for composites with either thermoplastic or thermosetting matrices, including
    preimpregnated materials (prepregs). The reinforcements covered include carbon
    fibres, glass fibres, aramid fibres and other similar fibres. The reinforcement
    geometries covered include unidirectional (i.e. completely aligned) fibres and
    rovings and unidirectional fabrics and tapes. The method is not normally suitable
    for multidirectional materials composed of several unidirectional layers at different
    angles (see ISO 527-4).
