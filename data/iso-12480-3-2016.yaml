abstract:
- language: en
  script: Latn
  content: ISO 12480-3:2016 establishes required practices for the safe use of tower
    cranes. It is intended to be used in conjunction with ISO 12480-1. Subjects covered
    include safe systems of work, management, planning, selection, erection and dismantling,
    special base, operation and maintenance of cranes and the selection of operators,
    slingers and signallers. It does not cover manually (non-powered) operated cranes,
    or cranes in which at least one of its motions is manually operated.
