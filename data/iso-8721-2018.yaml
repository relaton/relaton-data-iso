abstract:
- language: en
  script: Latn
  content: This document defines performance criteria for an optical data channel
    used in impact tests on road vehicles, when numerical time and space data are
    taken from images to analyse impact test results. The objective of this document
    is to facilitate comparison between results obtained by different laboratories
    by specifying minimum quality criteria. Annexes A, B, C and D present a method
    of measuring several indices like quality parameters of sub processes of the optical
    data channel, using a calibration target, reference distances and analysis systems.
