abstract:
- language: en
  script: Latn
  content: 'ISO 15085:2003 specifies the design as well as the construction and strength
    requirements for safety devices and arrangements intended to minimize the risk
    of falling overboard, and requirements to facilitate reboarding. It describes
    means which can be used individually or combined to achieve these objectives,
    and applies to small craft of up to 24 m length of hull. ISO 15085:2003 is not
    applicable to the following boat types: aquatic toys;canoes, kayaks, or other
    boats with a beam less than 1,1 m;personal watercraft, covered by ISO 13590;inflatable
    boats with a hull length of less than 8 m, covered by ISO 6185.'
