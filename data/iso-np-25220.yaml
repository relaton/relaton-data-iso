abstract:
- language: en
  script: Latn
  content: This document provides a consistent approach to minimizing loss in operations of plastic resin in the form of pellets, flakes, and powders. It specifies requirements for organizations to prevent plastic resin loss from entering the environment, supporting the goal of zero plastic resin loss. This document applies to organizations handling plastic resin, including but not limited to those involved in manufacturing, recycling, transportation, warehousing, distribution, repackaging, laboratory testing, formulating, processing, and converting. It can also be of interest to buyers, sellers, and users of plastic resin and plastic products, as well as brands, retailers, environmental stakeholders, regulators, and legislators. This document does not apply to plastic in the form of filament, fiber, or liquid and does not address air emissions, methods to estimate or measure loss, or secondary microplastics.
