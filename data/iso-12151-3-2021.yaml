abstract:
- language: en
  script: Latn
  content: This document specifies the general and dimensional requirements for the
    design and performance of flange hose fittings, made of carbon steel, for nominal
    hose inside diameters of 12,5 mm to 76 mm inclusive, in accordance with ISO 4397,
    for use with ports and clamps in accordance with ISO 6162‑1 and ISO 6162‑2. Note 1     
    Materials other than carbon steel can be supplied as agreed between the manufacturer
    and user. Note 2      For hose fittings used in hydraulic and pneumatic braking
    systems on road vehicles (as defined in the scope of ISO/TC 22/SC 2, Road vehicles),
    see ISO 4038, ISO 4039‑1 and ISO 4039‑2. These hose fittings are for use in hydraulic
    fluid power systems with a hose that meets the requirements of the respective
    hose standards and in general applications with suitable hoses.
