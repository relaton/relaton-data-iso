abstract:
- language: en
  script: Latn
  content: This document, as part of the 17739 series, specifies functional requirements and data exchange procedure for implementing infrastructure supported location-based services to enhance road safety in work zones. It covers functional requirements for an incident prevention service enabled by the exchange of status and/or intent information between workers with nomadic device in the work zone and nomadic device in approaching vehicles including non-automated vehicles, connected vehicles, automated vehicles, and connected automated vehicles, through nomadic and mobile devices, and roadside infrastructure.
