abstract:
- language: en
  script: Latn
  content: This International Standard specifies a colorimetric comparison method
    for the determination of the amount of ammonia and ammonium compounds in phenol-formaldehyde
    mouldings. NOTE This International Standard does not provide an absolute measure
    of the amount of ammonia present. The amount of ammonia in a moulded article is
    of importance when corrosion of metal inserts or contamination of foodstuffs in
    contact with the article has to be considered.
