abstract:
- language: en
  script: Latn
  content: This document proposes guidelines for the communication quality test of
    a small multi-copter UAS, to identify the working airspace in which its communication
    datalink can be reliably operated in available commercial LTE mobile networks.
    The proposed test method is focused on the measurement method of communication
    quality in the airspace and the utilization of measured data set, for applications
    in small UAS operations. Communication methods, environments, and communication
    quality parameters are not direct objects of ensuing development of this proposed
    method.
