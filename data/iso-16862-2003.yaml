abstract:
- language: en
  script: Latn
  content: 'ISO 16862:2003 describes test methods for evaluating the sag resistance
    (resistance to sagging) of paints, varnishes and similar coating materials (coatings)
    when applied to a substrate and held in a vertical position. Evaluation of the
    sag resistance can be carried out after the coating has been applied as follows:
    using a sag index applicator on a horizontally placed test panel which is afterwards
    put into a vertical position orusing a spray gun for application on a substrate
    in a vertical position. This International Standard is applicable to liquid coatings
    only.'
