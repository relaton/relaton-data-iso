abstract:
- language: en
  script: Latn
  content: This document provides recommendations for the production and evaluation
    of technical texts intended for translation into other languages by means of human
    and/or machine translation. In addition, this document also addresses text production
    and translation interface requirements in connection with technical texts. This
    document is intended for authors and editors of technical texts intended for translation.
    This document also enables translators and translation service providers to assess
    the suitability of technical texts for translation. This document can also be
    used by tool manufacturers to develop automatic language testing and verification
    procedures. This document does not provide recommendations for the specific requirements
    of producing fiction, journalistic, advertising and other non-technical texts.
