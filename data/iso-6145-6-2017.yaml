abstract:
- language: en
  script: Latn
  content: ISO 6145-6:2017 specifies a method for the dynamic preparation of calibration
    gas mixtures containing at least two gases (usually one of them is a complementary
    gas) from pure gases or gas pre-mixtures using critical flow orifices systems.
    The method applies principally to the preparation of mixtures of non-reactive
    gases that do not react with any of the materials forming the gas circuit inside
    the critical flow orifices system or auxiliary equipment. It has the merit of
    allowing multi-component mixtures to be prepared as readily as binary mixtures
    if an appropriate number of critical flow orifices are used. By selecting appropriate
    combinations of critical flow orifices, a dilution ratio of 1 × 104 is achievable.
    Although it is more particularly applicable to the preparation of gas mixtures
    at atmospheric pressure, the method also offers the possibility of preparing calibration
    gas mixtures at pressures greater than atmospheric. The upstream pressure will
    need to be at least two times higher than downstream pressure. The range of flow
    rates covered by this document extends from 1 ml/min to 10 l/min.
