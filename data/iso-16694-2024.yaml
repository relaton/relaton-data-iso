abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the list of parameters, measured
    during firing bench and flight tests. The requirements of the document apply to
    all the types of expendable liquid rocket engines supplied to the user: a)   
    operating on all types of propellant (including cryogenic); b)    with afterburning
    (with gradual burning) and without afterburning (without gradual burning); c)   
    low-thrust engines: one component (monopropellant) and two-component (bipropellant);
    d)    with a single firing or multiple firings. The document doesn’t specify firing
    bench test preparation and testing procedure, methods of test results processing
    and analysis, or requirements to measurement accuracy. The document specifies
    mandatory and optional parameters.'
