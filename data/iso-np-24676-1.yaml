abstract:
- language: en
  script: Latn
  content: This document specifies a method of determination of the notch tensile
    strength and specific fracture energy at room temperature of dense and insulating
    shaped refractory products using a wedge splitting test. Shaped refractories are
    those which have fixed geometry and dimensions when delivered to the user. This
    document is accordingly applicable to standard shape refractory bricks, but also
    special shapes refractory products and pre-cast products. This document is also
    applicable to unshaped refractories (see ISO 1927-6) after preparation of test
    specimens according to ISO 1927-5. This test method may be used for materials
    development, quality control, characterization and modelling data generation.
    Meanwhile, the test results serve as the basis for expert assessments in individual
    cases.
