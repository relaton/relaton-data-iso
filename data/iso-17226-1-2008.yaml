abstract:
- language: en
  script: Latn
  content: ISO 17226-1:2008 specifies a method for the determination of free and released
    formaldehyde in leathers. This method is based on high performance liquid chromatography
    (HPLC). It is selective and not sensitive to coloured extracts. The formaldehyde
    content is taken to be the quantity of free-formaldehyde and formaldehyde extracted
    through hydrolysis contained in a water extract from the leather under standard
    conditions.
