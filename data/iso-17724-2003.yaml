abstract:
- language: en
  script: Latn
  content: ISO 17724:2003 defines terms relating to graphical symbols, principally
    symbols for public information and use on equipment and safety signs. It does
    not include terms related to graphical symbols for diagrams [technical product
    documentation (tpd) symbols]. The definitions are intended to serve as a basis
