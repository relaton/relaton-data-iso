abstract:
- language: en
  script: Latn
  content: 'ISO 28017:2018 specifies requirements for two types, seven classes and
    three grades of wire- or textile-reinforced dredging hoses with nominal sizes
    ranging from 100 to 1 200. Within each class, all grades and sizes have the same
    maximum working pressure. Such hoses are suitable for the delivery or suction
    of seawater or freshwater mixed with silt, sand, coral and small stones with a
    specific gravity in the range from 1,0 to 2,3 at ambient temperatures ranging
    from −10 °C to +40 °C. ISO 28017:2018 covers two types of hose, as follows: -
    type 1: floating type, for delivery only, which includes flotation material to
    give the hose buoyancy; - type 2: submarine type for delivery and suction. ISO
    28017:2018 does not specify requirements concerning the service life of hoses
    or hose assemblies. Specifying such requirements is the responsibility of the
    customer, in consultation with the hose manufacturer.'
