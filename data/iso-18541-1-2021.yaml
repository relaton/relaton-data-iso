abstract:
- language: en
  script: Latn
  content: 'This document provides a general overview and structure of each part of
    the ISO 18541 series. This document also describes the use cases applicable to
    the standardized access to automotive RMI. The use cases address real world scenarios
    (e.g. servicing vehicles) regarding the information access necessary to perform
    vehicle roadside assistance, inspection, diagnosis, repair and maintenance, including
    the updating and replacement of electronic control units (ECU). Furthermore, this
    document defines requirements for granting access to security-related RMI in Annex A
    following the SERMI scheme. The RMI systems used by personnel to perform the services
    consist of: —    a web-based system, which provides access to RMI needed to perform
    the service(s); —    contact information for specific RMI; —    a security framework
    to protect access to security-related RMI (vehicle theft protection measures).
    This document is applicable to light passenger vehicles and light commercial vehicles.'
