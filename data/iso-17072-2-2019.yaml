abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the total metal
    content in leather using digestion of the leather and subsequent determination
    with inductively coupled plasma optical emission spectrometry (ICP-OES), inductively
    coupled plasma mass spectrometry (ICP-MS), atomic absorption spectrometry (AAS)
    or spectrometry of atomic fluorescence (SFA). This method determines the total
    metal content in leather; it is not compound-specific or specific to the oxidation
    state of the metals.
