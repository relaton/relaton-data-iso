abstract:
- language: en
  script: Latn
  content: This document provides guidance and requirements for the development and
    application of prognosis processes. It is intended to a)       allow developers,
    providers, users and manufacturers to share common concepts of prognostics, b)      
    enable users to determine the data, characteristics, processes and behaviours
    necessary for accurate prognosis, c)        outline appropriate approaches and
    processes to prognostics development, and d)       introduce prognostics concepts
    in order to facilitate future systems and training.
