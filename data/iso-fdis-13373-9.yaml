abstract:
- language: en
  script: Latn
  content: ISO 13373-9 specifies procedures to be considered when carrying out vibration
    diagnostics of various types of electric motors. The four motor types covered
    by ISO 13373-9 are squirrel-cage induction, wound-rotor induction, salient-pole
    and DC motors. NOTE The first two types are defined in ISO 20958. ISO 13373-9
    is mostly applicable to motors with power above 15 kW. ISO 13373-9 is intended
    to be used by condition monitoring practitioners, engineers and technicians and
    provides a practical step-by-step vibration-based approach to fault diagnosis.
    In addition, it gives a number of examples for a range of machine and component
    types and their associated fault symptoms. The procedures presented in ISO 13373-9
    can, in some cases, be applied to other types of electrical machines, such as
    generators, but there can be other specific techniques associated with such machines
    that are not included in ISO 13373-9. The use of non-vibration quantities, such
    as voltage and current, to identify and analyse vibration-related faults in electric
    motors is outside the scope of ISO 13373-9.
