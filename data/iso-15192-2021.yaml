abstract:
- language: en
  script: Latn
  content: This document specifies the determination of Cr(VI) in solid waste material
    and soil by alkaline digestion and ion chromatography with spectrophotometric
    detection. This method can be used to determine Cr(VI)-mass fractions in solids
    higher than 0,1 mg/kg. NOTE       In case of reducing or oxidising waste matrix
    no valid Cr(VI) content can be reported.
