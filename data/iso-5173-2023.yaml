abstract:
- language: en
  script: Latn
  content: This document specifies a method for making transverse root, face and side
    bend tests on test specimens taken from butt welds, butt welds with cladding (subdivided
    into welds in clad plates and clad welds) and cladding without butt welds, in
    order to reveal imperfections on or near the surface of the test specimen which
    is under tension during bend testing and/or assess ductility. It also gives the
    dimensions of the test specimen. In addition, this document specifies methods
    to be used instead of transverse bend tests with a former for welded joints when
    base materials, heat affected zones and/or weld metal have a significant difference
    in their physical and mechanical properties in relation to bending. This document
    applies to metallic materials in all forms of product with welded joints made
    by any welding process.
