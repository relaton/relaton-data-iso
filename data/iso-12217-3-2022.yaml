abstract:
- language: en
  script: Latn
  content: 'This document specifies methods for evaluating the stability and buoyancy
    of intact (i.e. undamaged) boats. The flotation characteristics of craft susceptible
    to swamping are also encompassed. The evaluation of stability and buoyancy properties
    using this document will enable the boat to be assigned to a design category (C
    or D) appropriate to its design and maximum load. This document is applicable
    to boats of hull length less than 6 m, whether propelled by human or mechanical
    power, except habitable sailing multihulls. Boats of hull length less than 6 m
    which are fitted with a full deck and quick-draining cockpit(s) complying with
    ISO 11812 can alternatively be assessed using ISO 12217‑1 or ISO 12217‑2 (for
    non-sailing and sailing boats, respectively), in which case higher design categories
    can be assigned. In relation to habitable multihulls, this document includes assessment
    of susceptibility to inversion, definition of viable means of escape and requirements
    for inverted flotation. This document excludes: —    inflatable and rigid-inflatable
    boats covered by the ISO 6185 series, except for references made in the ISO 6185 series
    to specific clauses of the ISO 12217 series; —    personal watercraft covered
    by ISO 13590 and other similar powered craft; —    aquatic toys; —    canoes and
    kayaks; —    gondolas and pedalos; —    sailing surfboards; —    surfboards, including
    powered surfboards; —    hydrofoils, foil stabilized boats and hovercraft when
    not operating in the displacement mode; and —    submersibles. NOTE       Displacement
    mode means that the boat is only supported by hydrostatic forces. It does not
    include or evaluate the effects on stability of towing, fishing, dredging or lifting
    operations, which need to be separately considered if appropriate.'
