abstract:
- language: en
  script: Latn
  content: ISO 16143-2:2004 specifies the technical delivery conditions for semi-finished
    products, hot or cold formed bars, rods and sections for general purposes made
    of the most important corrosion-resistant stainless steel grades. In addition
    to ISO 16143-2:2004, the general technical delivery requirements of ISO 404 are
    applicable. ISO 16143-2:2004 does not apply to components manufactured by further
    processing the product, where quality characteristics are altered as a result
    of such further processing.
