abstract:
- language: en
  script: Latn
  content: 'This document specifies the technical safety requirements and protective
    measures for the design, construction and supply (including installation and dismantling,
    with arrangements for transport and maintenance) of: —    milling machines (see
    3.1.1), including machines capable of performing boring operations (see 3.1.2);
    —    machining centres; and —    transfer machines (see 3.1.3) designed for continuous
    production use, which are intended to cut cold metal and other non-combustible
    cold materials, except wood or materials with physical characteristics similar
    to those of wood as defined in ISO 19085‑1 and glass, stone and engineered/agglomerated
    materials as defined in EN 14618. This document covers the following machines
    (referred to as "machines" in this document): a)    manually, without numerical
    control, operated boring and milling machines (see 3.2.1, Group 1), e.g. knee
    and column type milling machines (see Figures C.1 and C.2); b)    manually, with
    limited numerical control, operated boring and milling machines (see 3.2.2, Group 2),
    e.g. profile and contouring milling machines (see Figures C.3 and C.4); c)    
    numerically controlled milling machines and machining centres (see 3.2.3, Group 3),
    e.g. automatic milling machines and milling centres, e.g. multi-spindle milling
    machines, gear-milling machines (see Figures C.5 to C.7); d)    transfer and special-purpose
    machines (see 3.2.4, Group 4), which are designed to process only pre-specified
    workpieces or limited range of similar workpieces by means of a predetermined
    sequence of machining operations and process parameters (see Figures C.8 to C.13).
    e)    machines fitted with the following devices/facilities, whose hazards have
    been dealt with: —    tool magazine(s); —    tool changer(s); —    workpiece handling
    mechanism(s); —    powered workpiece clamping mechanism(s); —    swarf/chip conveyor(s);
    —    power-operated door(s); —    moveable operator cabin(s); —    additional
    equipment for turning; —    additional equipment for grinding. This document deals
    with all significant hazards, hazardous situations and events relevant to this
    type of machinery which can occur during transportation, assembly and installation,
    setting, operation, cleaning and maintenance, troubleshooting, dismantling or
    disabling according to ISO 12100, when the machinery is used as intended and under
    conditions of misuse which are reasonably foreseeable by the manufacturer (see
    Clause 4). This document presumes accessibility to the machine from all directions
    and specifies access conditions to operator positions. It also applies to workpiece
    transfer devices including transport devices for loading/unloading when they form
    an integral part of the machine.'
