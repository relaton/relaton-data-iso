abstract:
- language: en
  script: Latn
  content: The ISO 7000 database provides a collection of graphical symbols which
    are placed on equipment or parts of equipment of any kind in order to instruct
    the person(s) using the equipment as to its operation. Each graphical symbol is
    identified by a reference number and contains a title, graphical representations
    in vectorized and non-vectorized formats, and some additional data as applicable,
    such as the function or the description of the symbol, the intended use, related
    symbols or publications. Various search and navigation facilities allow for easy
    retrieval of graphical symbols.
