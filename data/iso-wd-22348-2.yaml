abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for emergency management of cascading
    event. It includes: - Characteristics of cascading event in the perspective of
    emergency management; - Principles of emergency management of cascading event;
    - Guidelines for cascading event identification; - Guidelines for establishing
    foundation of cascading event management; - Guidelines for prevention, preparedness
    and response of cascading event in emergency management process. This document
    is applicable to any level organizations, urban resilience authorities with responsibility
    and accountability for, or involvement in, part of all emergency management process
    of cascading event.'
