abstract:
- language: en
  script: Latn
  content: This document provides a method to determine the Payne effect (filler-filler
    interaction/filler network) of rubber vulcanizates in the hardness range from
    30 IRHD to 80 IRHD. The dynamic properties are measured via strain sweep in sinusoidal
    deformation at a defined temperature and frequency. Difference in storage modulus
    is determined to quantitatively estimate the Payne effect (filler-filler interaction/filler
    network) there by dispersion of filler in rubber vulcanizates.
