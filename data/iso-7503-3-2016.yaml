abstract:
- language: en
  script: Latn
  content: 'ISO 7503 and ISO 8769 are addressed to the people responsible for determining
    the radioactivity present on solid surfaces. ISO 7503-3:2016 applies to the evaluation
    of contamination on surfaces in terms of activity per unit area by direct and
    indirect methods of measurement and deals with the complex aspects of instrument
    calibration. ISO 7503-3:2016 is applicable to well-defined surfaces, such as those
    of equipment and facilities, containers of radioactive materials, sealed sources,
    and buildings or land. ISO 7503-3:2016 can be used for laboratory and equipment/installation
    control and for remediation and monitoring activities to comply with release criteria.
    This part of ISO 7503 also refers to the following: - calibration laboratories
    or institutions dealing with radionuclides with complex emission characteristics
    or radionuclides for which no reference calibration sources are available; - institutions
    confronted with the task to evaluate surface contaminations consisting of a radionuclide
    mixture; - institutions/authorities controlling nuclear material transports or
    material/equipment clearance according to national legislation guideline values
    or international convention limits. ISO 7503-3:2016 does not apply to contamination
    of the skin, clothing, or loose material, such as gravel. NOTE Direct evaluation
    of surface contamination from alpha-emitters, beta-emitters and photon emitters
    is dealt with in ISO 7503‑1. The test method using wipe-test samples for the evaluation
    of radioactive surface contaminations is dealt with in ISO 7503‑2.'
