abstract:
- language: en
  script: Latn
  content: ISO 10675:2010 specifies acceptance levels for indications from imperfections
    in aluminium butt welds detected by radiographic testing. If agreed, the acceptance
    levels may be applied to other types of welds or materials. The acceptance levels
    may be related to welding standards, application standards, specifications or
    codes. ISO 10675:2010 assumes that the radiographic testing has been carried out
    in accordance with ISO 17636. When assessing whether a weld meets the requirements
    specified for a weld quality level, the sizes of imperfections permitted by standards
    are compared with the dimensions of indications revealed by a radiograph made
    of the weld.
