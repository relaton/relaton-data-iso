abstract:
- language: en
  script: Latn
  content: This document specifies general requirements for anthropometric databases
    and their associated reports that contain measurements taken in accordance with
    ISO 7250-1. It provides necessary information, such as characteristics of the
    user population, sampling methods, measurement items and statistics, to make international
    comparison possible among various population segments. The population segments
    specified in this document are people who are able to hold the postures specified
    in ISO 7250-1. NOTE            The traditional anthropometry defined in ISO 7250-1
    is considered to be a necessary complement to 3-D methods, which are used in some
    countries. Scanned data are verified according to the definitions given in ISO 7250-1
    (see ISO 20685-1). State-of-the-art software allows integration of traditional
    anthropometric measures with those obtained by 3-D imaging.
