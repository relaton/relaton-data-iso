abstract:
- language: en
  script: Latn
  content: 'This standard specifies the test methods for verifying the capabilities
    of agricultural tyres. The tests include the tyre resistance to bursting for assessing
    the tyre structure stability and bonding of the tyre components, and the endurance
    test for evaluating the durability of the tyre under full load and moderate speed
    over long distances. This standard applies to new pneumatic tyres designed primarily,
    but not only, for agricultural and forestry vehicles. This standard does not apply
    to the following tyres: a) Tyres identified by speed category symbols corresponding
    to speeds of 70km/h speed symbol “E”）and above. b) Tyres designated primarily
    for other purposes, such as earth-moving equipment, Industrial and lift trucks.'
