abstract:
- language: en
  script: Latn
  content: This document specifies the basic principles, general requirements, planning, operation, evaluation, improvement and reporting for the application of chain of custody for the traceability of recycled materials and products thereof. This document is applicable to the traceability management of recycled materials and products thereof among upstream and downstream value chain actors through the application of chain of custody. It may also serve as a basis for third-party conducting evaluation of recycled materials and products thereof.
