abstract:
- language: en
  script: Latn
  content: This document specifies a method for the qualitative analysis of the organic
    acids in raw emulsionpolymerization styrene-butadiene rubber (E-SBR) using a gas
    chromatograph combined with mass spectrometer (GC-MS). It is applicable to the
    identification of fatty acids and rosin acids (including disproportionated rosin
    acids). The determination of the soap and organic-acid content of raw styrene-butadiene
    rubber (SBR) is specified in ISO 7781:2017.
