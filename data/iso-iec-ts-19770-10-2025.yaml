abstract:
- language: en
  script: Latn
  content: 'This document covers the following information technology asset management
    (ITAM) system processes: a)          management system processes for the overall
    system of IT asset management (not described in ISO/IEC 19770-1 in detail), which
    are specified in this document for comprehensive coverage and consistency of explanations;
    these include: —          understanding the external context and shareholder needs
    (7.1, 7.2 and 10.2); —          leadership, policy and organization (10.3); —         
    establishing and maintaining the management system (10.4); —          planning
    and risk management (10.5); —          support (including resources, competence,
    awareness, and communication – 10.6); —          executing functional and life
    cycle processes (10.7); —          performance evaluation and improvement (10.8);
    b)          functional management processes for IT assets (not described in ISO/IEC
    19770-1 in detail), which are cross-cutting processes that integrate with life-cycle
    processes for IT assets and which are shared with most IT management system standards,
    though sometimes slightly differently grouped; these include:  —          change
    management (11.2; also required by ISO/IEC 19770-1); —          data management;
    —          license management; —          security management; —          relationship
    and contract management; —          financial management; —          service level
    management; —          other risk management; c)          life cycle management
    processes for IT assets as specified in ISO/IEC 19770-1, which are grouped and
    named slightly differently by different methodologies; these include: —         
    specification; —          development; —          acquisition; —          release;
    —          deployment; —          operation; —          retirement. This document
    is applicable to all ITAM implementations. This document can be applied to all
    types of IT assets and by all types and sizes of organizations.'
