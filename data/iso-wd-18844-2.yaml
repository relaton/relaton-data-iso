abstract:
- language: en
  script: Latn
  content: This International Standard specifies a measurement procedure and its visualization
    for image flare at various angles of incidence for incoming light. The methods
    of measurement are designed to enable the assessment of the performance of digital
    cameras by using image data outputted by the digital cameras. This standard does
    not specify the value for the allowable range for the image flare.
