abstract:
- language: en
  script: Latn
  content: 'This document gives guidelines for the development of multi-operator/multi-service
    interoperable public surface (including subways) transport fare management systems
    (IFMSs) on a national and international level. This document is applicable to
    bodies in public transport and related services which agree that their systems
    need to interoperate. This document defines a conceptual framework which is independent
    of organizational and physical implementation. Any reference within this document
    to organizational or physical implementation is purely informative. This document
    defines a reference functional architecture for IFMSs and establishes the requirements
    that are relevant for ensuring interoperability between several actors in the
    context of the use of electronic tickets. The IFMS includes all the functions
    involved in the fare management process, such as: — management of media, — management
    of applications, — management of products, — security management, and — certification,
    registration, and identification. This document defines the following main elements:
    — identification of the different sets of functions in relation to the overall
    IFMS and services and media from non-transport systems which interact with fare
    management systems; — a generic model of an IFMS describing the logical and functional
    architecture and the interfaces within the system, with other IFMSs and with services
    and media from non-transport systems; — use cases describing the interactions
    and data flows between the different sets of functions; — security requirements.
    In its annexes, this document provides a framework for mobility platforms that
    integrate fare management and travel information for inter- and multimodal travel
    (see Annex A). It also elaborates on specific subjects covered in document and
    offers some national examples with regard to IFMS implementations (see Annex B,
    Annex C, Annex D and Annex E). This document does not define: — the technical
    aspects of the interface between the medium and the medium access device; — the
    data exchanges between the medium and the medium access device; NOTE The data
    exchanges between the medium and the medium access device are proposed by other
    standardization committees. — the financial aspects of fare management systems
    (e.g. customer payments, method of payment, settlement, apportionment, reconciliation).'
