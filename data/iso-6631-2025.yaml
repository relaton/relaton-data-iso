abstract:
- language: en
  script: Latn
  content: This document provides a method for quantification of marker peptide of
    type I collagen which was purified products extracted from bovine tissues with
    liquid chromatography - tandem mass spectrometry (LC-MS/MS). The method described
    in this document is intended to be used for marker peptide detection of purified
    bovine type I collagen which will be used for constructing tissue-engineered medical
    products (TEMPs) or other collagen-based biomaterials, for product quality control.
    This method also can be used for qualitative analysis and quantitative detection
    of bovine-specific and/or type I-specific collagen in the samples mixed with other
    animal sources and/or other type collagen. This document does not exclude other
    possible methods for quantifying type I collagen, such as hydroxyproline quantification,
    that can evaluate the total amount of collagen regardless of type. NOTE 1       
    The collagen has been known there are greater than 28 types and with the different
    property in each one. This document focuses on the quantification of marker peptide
    of purified bovine type I collagen. Type I collagen isolated from skin, tendon,
    bone, etc., can contain other types of collagen, for example, type III and type
    V. And type I collagen can be sourced from bovine, swine, etc. For quantification
    of other types of collagens or type I collagen sourced from other species of animals
    can use this document as a template, but need to design collagen type-specific
    or/and animal species-specific characteristic peptides for LC-MS/MS method, as
    well as optimize the determination conditions. NOTE 2        For quantification
    of the collagen marker peptide of scaffold which combined with other materials,
    or type I collagen contained in ECM materials of tissues or type I collagen-based
    regenerative tissues, can refer to this document, but need to isolate or/and purify
    the type I collagen with a reasonable and verified method at first (9,10), and
    then quantify it by referring to the method provided in this document.
