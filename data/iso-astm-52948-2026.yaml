abstract:
- language: en
  script: Latn
  content: This document specifies the classification of imperfections possibly generated
    during an additive manufacturing process by PBF-LB (laser beam powder bed fusion)
    or PBF-EB (electron beam powder bed fusion) for metallic parts. This document
    also indicates the most probable causes of the formation of imperfections and
    includes illustrations. This can be extended to other additive manufacturing process
    categories, nevertheless, the indication of probable causes is process specific.
    Acceptance criteria and dimensional description or scale for imperfections are
    not included in this document.
