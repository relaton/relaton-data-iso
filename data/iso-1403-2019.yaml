abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for three types of general-purpose
    textile-reinforced rubber water hose with an operating temperature range of −25
    °C to +70 °C and a maximum working pressure of up to 2,5 MPa (25 bar). These hoses
    are not intended to be used for conveyance of potable (drinking) water, for washing-machine
    inlets, as firefighting hoses, for special agricultural machines or as collapsible
    water hoses. These hoses can be used with additives which lower the freezing point
    of water.
