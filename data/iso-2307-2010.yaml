abstract:
- language: en
  script: Latn
  content: 'ISO 2307:2010 specifies, for ropes of different kinds, a method of determining
    each of the following characteristics: linear density; lay length; braid pitch;
    elongation; breaking force. The linear density, lay length and braided pitch are
    measured with the rope under a specified tension called the reference tension.
    The elongation corresponds to the measured increase in length of the rope when
    the tension to which it is subjected is increased from an initial value (reference
    tension) to a value equal to 50 % of the minimum specified breaking strength of
    the rope. The breaking force is the maximum force registered (or reached) during
    a breaking test on the test piece, carried out on a tensile testing machine with
    constant rate of traverse of the moving element. The breaking force values given
    in the tables of rope specifications are only valid when this type of testing
    machine is used. ISO 2307:2010 also provides a method for measuring water repellency,
    lubrication and finish content, and heat setting treatment, when requested by
    the customer.'
