abstract:
- language: en
  script: Latn
  content: This document defines the concepts and principles for laboratory design.
    This document is applicable to personnel involved in the planning, design, construction,
    operation, and ownership of laboratories. It is relevant to architects, engineers,
    builders, laboratory designers, laboratory planners, laboratory personnel, facility
    managers, and owners. Additionally, it is relevant to organizations and individuals
    within various industries who engage with laboratory facilities such as maintenance
    personnel, regulatory authorities, and certification agencies. This documentdoes
    not provide detailed technical (quantitative) specifications for laboratory design.
    This document does not apply to the work processes executed by laboratory personnel,
    and does not include laboratory safety work practices and it also excludes operational
    requirements by the users.
