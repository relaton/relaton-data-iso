abstract:
- language: en
  script: Latn
  content: 'This document specifies the general principles and requirements for non-hazardous
    solid recovered materials (SRM) used in construction works, covering the classification
    of SRM, material specifications and associated test methods. Note 1: This document
    does not cover waste treatment methods, manufacturing processes or construction
    practices. Note 2: This document does not apply to hazardous waste or solid recovered
    fuels (SRF) intended for energy recovery.'
