abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1637:2006 specifies the application module for Assembly module
    macro definition. ISO/TS 10303-1637:2006 deals with the representation of predefined
    subsets of a design for reuse functionality. The assembly macro definition is
    supported by an equivalent capability in the context of interconnect substrate
    design reuse. The expected usage of this capability is only in the context of
    library stored design data and in design system to design system data sharing
    and exchange. A macro is not intended to be a directly realizeable design definition.
    The essential feature of ISO/TS 10303-1637:2006 is the inclusion of terminals
    that only exist in a macro definition so to support their reference in floor planning
    based design and their subsumption and replacement upon macro expansion in the
    detailed design. In ISO/TS 10303-1637:2006, assembly macros rely on interconnect
    macros for connectivity implementation. The following are within the scope of
    ISO/TS 10303-1637:2006: terminals of assembly module macro;assignment of interconnect
    macro component terminals to assembly module macro terminals.'
