abstract:
- language: en
  script: Latn
  content: 'This document provides an overview and the fundamental principles of the
    multipart standard ISO 23726 series Industrial automation systems and integration
    – Ontology based interoperability (OBI). This document specifies the principles
    for ontologies and artefacts aligned with IDO upper ontology to be considered
    part of the OBI series. This document is applicable for the representation of
    engineering data associated with all phases of the life cycle of industrial products,
    plants and systems to enable semantic interoperability. The following are outside
    the scope of this document: - specification of ontology languages. - specification
    of Semantic Web standards such as Resource Description Framework (RDF), SHACL,
    SPARQL, and Internationalized Resource Identifiers (IRIs). - specification of
    methods for reasoning with ontologies. - methods to build, maintain, align, and
    evaluate ontologies and artefacts to meet the principles in this document. These
    will be covered in separate guideline documents.'
