abstract:
- language: en
  script: Latn
  content: ISO 22072:2011 defines the general characteristics, requirements and design
    data to be included in the procurement technical specification of an electrohydrostatic
    actuator (EHA) to be used to power aircraft control surfaces or other moving parts
    of an aerospace vehicle. This type of actuator is an alternative to the hydraulically
    powered servo-control actuators that are currently used. It is intended that ISO
    22072:2011 cover the unique requirements of EHAs.
