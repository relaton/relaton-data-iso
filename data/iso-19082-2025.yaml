abstract:
- language: en
  script: Latn
  content: 'This document specifies data elements and data frames for messages a)      
    exchanged between roadside modules and: 1)       signal controllers; 2)      
    traffic management centres, and/or; 3)       other roadside modules. b)      
    exchanged between traffic management centres and signal controllers. This document
    addresses the data in the application layer of the OSI (Open Systems Interconnection)
    reference model.'
