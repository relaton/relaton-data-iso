abstract:
- language: en
  script: Latn
  content: ISO 15025:2016 specifies two procedures (surface ignition and bottom-edge
    ignition) for determining flame spread properties of vertically oriented flexible
    materials in the form of single or multicomponent fabrics (coated, quilted, multilayered,
    sandwich constructions and similar combinations), when subjected to a small defined
    flame. This test standard does not apply to situations where there is restricted
    air supply or exposure to large sources of intense heat, for which other test
    methods are more appropriate. This test method is not appropriate for materials
    that demonstrate extensive melting or shrinkage.
