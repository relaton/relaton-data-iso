- language: en
  script: Latn
  content: ISO 23935:2006 specifies the requirements for tests which may be applied
    to all fluid system components located in zones designated as "fire zones" and
    built to satisfy the minimum level specified for withstanding fire. It does not
    relate to withstanding fire outside designated fire zones, nor to flammability
    requirements, or to those conditions induced by the flame coming from the combustion
    chamber.
