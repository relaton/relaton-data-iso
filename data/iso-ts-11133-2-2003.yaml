abstract:
- language: en
  script: Latn
  content: 'ISO/TS 11133-2:2003 sets criteria and methods for the performance testing
    of culture media. It applies to: commercial bodies producing and/or distributing
    ready-to-use or semi-finished reconstituted or dehydrated media to microbiological
    laboratories;non-commercial bodies supplying media to third parties;microbiological
    laboratories preparing culture media for their own use and evaluating the performance
    of these media.'
