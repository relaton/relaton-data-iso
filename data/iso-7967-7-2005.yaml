abstract:
- language: en
  script: Latn
  content: ISO 7967-7:2005 defines terms relating to governing systems for Reciprocating
    Internal Combustion (RIC) engines. It mainly deals with speed governing systems
    for reciprocating internal combustion engines. For governing systems based on
    other parameters (e.g. torque, temperature and load), the definitions given may
    be considered as a basis.
