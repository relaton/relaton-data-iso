abstract:
- language: en
  script: Latn
  content: 'ISO 4427-5:2007 specifies the characteristics of the fitness for purpose
    of assembled piping systems made from polyethylene (PE) intended for the conveyance
    of water for human consumption, including raw water prior to treatment and water
    for general purposes. It also specifies the test parameters for the test methods
    to which it refers. In conjunction with the other parts of ISO 4427, it is applicable
    to PE pipes, fittings, valves, their joints and to joints with components of other
    materials, intended to be used under the following conditions: a maximum operating
    pressure (MOP) up to and including 25 bar; an operating temperature of 20 °C as
    the reference temperature.'
