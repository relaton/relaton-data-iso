abstract:
- language: en
  script: Latn
  content: ISO 18466:2016 enables the determination of the biogenic fraction in CO2
    in stack gas using the balance method. The balance method uses a mathematical
    model that is based on different operating data of the Waste for Energy (WfE)
    plant (including stack gas composition) and information about the elementary composition
    of biogenic and fossil matter present in the fuel used. NOTE Use only mixed fuels
    when using the calculation method.
