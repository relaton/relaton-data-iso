abstract:
- language: en
  script: Latn
  content: 'This document specifies a concept for the design of tool items, limited
    to any kind drilling and countersinking tools for indexable inserts, together
    with the usage of the related properties and domains of values. This document
    specifies the requirements of simplified 3D models for data exchange of drills
    and countersinking tools for indexable inserts. The following are outside the
    scope of this document: — applications where these standard data may be stored
    or referenced; — concept of 3D models for cutting tools; — concept of 3D models
    for cutting items; — concept of 3D models for other tool items not being described
    in the scope of this document; — concept of 3D models for adaptive items; — concept
    of 3D models for assembly items and auxiliary items.'
