abstract:
- language: en
  script: Latn
  content: ISO 2815:2003 describes a method for carrying out an indentation test on
    a single coating or multicoat system of paint, varnish or related product, using
    a Buchholz indentor. The length of the indentation produced is indicative of the
    residual deformation of the coating. This indentation test is not suitable for
    products which contain a strong plasticizer.
