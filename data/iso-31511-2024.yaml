abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for refrigerated delivery service
    providers to deliver goods directly from the last contactless refrigerated goods
    operation areas at distribution centres to recipients through contactless cold
    chain, depending on customers'' needs. This document does not apply to the transfer
    of goods between distribution centres. This document includes requirements for:
    —     refrigerated delivery service providers; —     facilities and the equipment
    involved in contactless refrigerated delivery; —     the operation process; —    
    the handling of abnormal conditions. This standard is also applicable to scenarios
    that need contactless cold chain delivery under special circumstances, such as
    epidemics.'
