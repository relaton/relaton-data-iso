abstract:
- language: en
  script: Latn
  content: The test method is based on gripping a specimen, 200 mm wide and containing
    a joint/seam, across its entire width in the clamps of a tensile testing machine,
    operated at a prescribed rate of extension, and application of a longitudinal
    force (perpendicular to the seam axis) until the joint/seam ruptures. Procedures
    for measuring the tensile properties of both conditioned and wet specimens are
    included.
