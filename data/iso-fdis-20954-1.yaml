abstract:
- language: en
  script: Latn
  content: This document defines the measurement method of optical image stabilization
    performance for still images compensating for handheld blur consisting of three
    rotational components, roll, yaw and pitch. It applies to consumer digital cameras
    with optical image stabilization for still images. Apparatuses such as camcorders
    and mobile phones with still image shooting functionality are within the scope
    of this document.
