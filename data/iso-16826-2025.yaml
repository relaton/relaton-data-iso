abstract:
- language: en
  script: Latn
  content: This document specifies principles for the tandem technique and the longitudinal-longitudinal-transverse
    wave (LLT) technique for detection of discontinuities perpendicular to the surface
    or almost perpendicular to the surface. The general principles for ultrasonic
    testing of industrial products are described in ISO 16810. The tandem or LLT techniques
    can be used for the detection of embedded planar discontinuities. This document
    gives guidelines for the testing of metallic materials with a thickness between
    40 mm and 500 mm with parallel or concentric surfaces. The procedures provided
    in this document can be used for testing of other materials or smaller thickness
    if special measures are taken according to a written testing procedure. Phased
    array techniques can also be applied for the tandem technique and the LLT technique,
    but additional steps or verifications can be needed.
