abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements for the design, manufacture
    and testing of centrifugal pumps for cryogenic service. This document does not
    apply to reciprocating pumps. This document also gives guidance on the design
    of installations. It does not specify requirements for operation or maintenance.
    NOTE            For general requirements for materials used in cryogenic fluid
