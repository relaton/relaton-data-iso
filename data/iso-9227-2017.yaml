abstract:
- language: en
  script: Latn
  content: ISO 9227:2017 specifies the apparatus, the reagents and the procedure to
    be used in conducting the neutral salt spray (NSS), acetic acid salt spray (AASS)
    and copper-accelerated acetic acid salt spray (CASS) tests for assessment of the
    corrosion resistance of metallic materials, with or without permanent or temporary
    corrosion protection. It also describes the method employed to evaluate the corrosivity
    of the test cabinet environment. It does not specify the dimensions or types of
    test specimens, the exposure period to be used for a particular product, or the
    interpretation of results. Such details are provided in the appropriate product
    specifications. The salt spray tests are particularly useful for detecting discontinuities,
    such as pores and other defects, in certain metallic, organic, anodic oxide and
    conversion coatings. The neutral salt spray (NSS) test particularly applies to
    - metals and their alloys, - metallic coatings (anodic and cathodic), - conversion
    coatings, - anodic oxide coatings, and - organic coatings on metallic materials.
    The acetic acid salt spray (AASS) test is especially useful for testing decorative
    coatings of copper + nickel + chromium, or nickel + chromium. It has also been
    found suitable for testing anodic and organic coatings on aluminium. The copper-accelerated
    acetic acid salt spray (CASS) test is useful for testing decorative coatings of
    copper + nickel + chromium, or nickel + chromium. It has also been found suitable
    for testing anodic and organic coatings on aluminium. The salt spray methods are
    all suitable for checking that the quality of a metallic material, with or without
    corrosion protection, is maintained. They are not intended to be used for comparative
    testing as a means of ranking different materials relative to each other with
    respect to corrosion resistance or as means of predicting long-term corrosion
    resistance of the tested material.
