abstract:
- language: en
  script: Latn
  content: ISO 20957-7:2005 specifies safety requirements for rowing machines in addition
    to the general safety requirements of ISO 20957-1 and should be read in conjunction
    with it. ISO 20957-7:2005 is applicable to stationary training equipment type
    rowing machines (type 7), referred to as rowing machines, within the classes S
    and H and class A regarding accuracy. If accessories are provided with the rowing
    machine for the performance of additional exercises these are subject to the requirements
    of ISO 20957-1 and any other specific requirements of the appropriate part of
    this standard.
