abstract:
- language: en
  script: Latn
  content: ISO 6469-2:2018 specifies requirements for operational safety specific
    to electrically propelled road vehicles, for the protection of persons inside
    and outside the vehicle. NOTE 1 Relevant requirements for motorcycles and mopeds
    are described in ISO 13063. ISO 6469-2:2018 does not provide comprehensive safety
    information for manufacturing, maintenance and repair personnel. ISO 6469-2:2018
    does not consider specific aspects of driving automation features. NOTE 2 For
    definition of the term "driving automation features", see SAE J3016.
