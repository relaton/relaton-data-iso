abstract:
- language: en
  script: Latn
  content: 'ISO 5755-1:2014 specifies the designations and dimensions for the following
    pneumatic bicycle tyres: -"wired edge" tyres mounted on straight side or crotchet
    type rims; -"beaded edge" tyres mounted on hooked bead rims. Tubular sew-up tyres
    and non-pneumatic tyres are not covered by ISO 5775-1:2014.'
