abstract:
- language: en
  script: Latn
  content: ISO 13366-2|IDF 148-2:2006 gives guidance on the operating conditions for
    counting somatic cells, in both raw and chemically preserved milk, using fluoro-opto-electronic
    somatic cell counters in which either a rotating disc technique or flow cytometry
    is applied in the counting section. The guidance is applicable to the counting
    of somatic cells in raw cow milk. The guidance is also applicable to raw milk
    of other species, such as goat, sheep and buffalo, if the specified prerequisites
    are met.
