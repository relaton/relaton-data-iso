abstract:
- language: en
  script: Latn
  content: 'ISO 22155:2011 specifies a static headspace method for quantitative gas
    chromatographic determination of volatile aromatic and halogenated hydrocarbons
    and selected aliphatic ethers in soil. ISO 22155:2011 is applicable to all types
    of soil. The limit of determination is dependent on the detection system used
    and the quality of the methanol grade used for the extraction of the soil sample.
    Under the conditions specified in ISO 22155:2011, the following limits of determination
    apply (expressed on the basis of dry matter): Typical limit of determination when
    using gas chromatography/flame ionization detection (GC/FID): volatile aromatic
    hydrocarbons: 0,2 mg/kg; aliphatic ethers as methyl tert-butyl ether (MTBE) and
    tert-amyl methyl ether (TAME): 0,5 mg/kg. Typical limit of determination when
    using gas chromatography/electron capture detection (GC/ECD): volatile halogenated
    hydrocarbons: 0,01 mg/kg to 0,2 mg/kg. Lower limits of determination can be achieved
    for some compounds by using mass spectrometry (MS) with selected ion detection.'
