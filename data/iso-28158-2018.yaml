abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and test methods for integrated
    dental floss and handles used for home care, community care, professional care
    of oral health or a part of dental treatment. This document is applicable to integrated
    dental floss and handles for manual use. It does not include dental floss and
    handles which contain a continuous supply of dental floss, or handles to which
    the floss is subsequently added. This document excludes specific qualitative and
    quantitative test methods for demonstrating freedom from unacceptable biological
    risks. For assessment of such biological risks, see ISO 10993-1 and ISO 7405.
