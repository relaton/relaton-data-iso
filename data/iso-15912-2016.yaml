abstract:
- language: en
  script: Latn
  content: ISO 15912:2016 gives requirements and test methods for determining the
    compliance of dental casting investment, dental brazing investment, dental pressable-ceramic
    investment and dental refractory die materials used in the dental laboratory,
    regardless of the composition of the refractory powder, the composition of the
    binder, or the particular application. ISO 15912:2016 classifies such products
    into types and classes, according to their intended use and the burn-out procedure
    recommended by the manufacturer. It also gives requirements for marking, labelling
    and manufacturer's instructions. It specifies requirements for the essential physical
    and mechanical properties of the products and the test methods to be used for
    determining them. NOTE 1 Compliance with all of the requirements presented in
    Clause 5 may not be necessary for some products, and a requirement might not be
    applicable to a product with a particular binder chemistry or be intended for
    an application in which that requirement is irrelevant. When this is the case,
    a clear statement to this effect is given according to Clause 5. NOTE 2 A specific
    quantitative requirement for setting expansion is not included in this International
    Standard. If the setting expansion of gypsum-bonded investment is measured, then
    the procedure given in ISO 6873[1] can be considered ? a procedure not recommended,
    however, for investment materials with other binders.
