abstract:
- language: en
  script: Latn
  content: 'ISO 16004:2005 specifies dimensional interface and unobstructed space
    requirements applicable to the aircraft mating section of either passenger boarding
    bridges or passenger transfer vehicles used at airports for boarding and disembarkation
    of passengers on the types of civil transport aircraft listed below. These types
    of aircraft have a door sill height greater than 2,0 m (80 in) above the ground.
    Lower aircraft usually do not require such means of access, and have not been
    taken into account. Data was compiled and checked as to the exact location of
    such items on the most frequently used civil transport aircraft types (i.e. families
    of aircraft sub-types with the same fuselage design and the same general type
    designator, which potentially includes any future derivative aircraft with the
    same fuselage). These types include the following: AIRBUS INDUSTRIE: A300 / A310
    / A318 / A319 / A320 / A321 / A330 / A340BOEING COMMERCIAL AIRPLANE: B717 / B727
    / B737 / B747 / B757 / B767 / B777LOCKHEED AIRCRAFT: L1011McDONNELL DOUGLAS: DC9
    / DC10 / MD11 / MD80 / MD90 It is not the intent of ISO 16004:2005 to specify
    any requirements applicable to aircraft design. Future aircraft types with a new
    fuselage should meet the main deck passenger doors requirements for interface
    with passenger boarding bridges or passenger transfer vehicles of ISO 7718, which
    would ensure their compatibility with the aircraft mating section of passenger
    boarding bridges or passenger transfer vehicles meeting the requirements of ISO
    16004:2005.'
