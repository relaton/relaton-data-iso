abstract:
- language: en
  script: Latn
  content: This document gives general provisions for applying ultrasonic testing
    with arrays using FMC/TFM techniques and related technologies. It is intended
    to promote the adoption of good practice either at the manufacturing stage or
    for in-service testing of existing installations or for repairs. Some examples
    of applications considered in this document deal with characterization and sizing
    in damage assessment. Materials considered are low-alloyed carbon steels and common
    aerospace grade aluminium and titanium alloys, provided they are homogeneous and
    isotropic, but some recommendations are given for other materials (e.g. austenitic
    ones). This document does not include acceptance levels for discontinuities. For
    the application of FMC/TFM to testing of welds, see ISO 23864.
