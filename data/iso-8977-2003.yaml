abstract:
- language: en
  script: Latn
  content: ISO 8977:2002 lays down the basic dimensions and tolerances in millimetres
    for headless and headed matrixes, in the outside diameter range of 5 mm to 50
    mm. It gives examples of material and hardness, and specifies a designation for
    matrixes that meet the requirements of this International Standard. Matrixes in
    accordance with ISO 8977:2002 are adapted in their dimensions and tolerances to
    meet the required for punches in accordance with ISO 8020.
