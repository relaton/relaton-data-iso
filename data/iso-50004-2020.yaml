abstract:
- language: en
  script: Latn
  content: This document gives practical guidelines and examples for establishing,
    implementing, maintaining and improving an energy management system (EnMS) in
    accordance with the systematic approach of ISO 50001:2018. The guidance in this
    document is applicable to any organization. This document does not provide guidance
    on how to develop an integrated management system. While the guidance in this
    document is consistent with the requirements of ISO 50001:2018, it does not provide
    interpretations of those requirements.
