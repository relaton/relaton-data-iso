abstract:
- language: en
  script: Latn
  content: This document specifies a standardised way of embedding the legal entity
    identifier (LEI) code, as represented in ISO 17442-1, in digital certificates,
    represented by the International Telecommunications Union (ITU) Recommendation
    X.509 and its ISO equivalent standard, ISO/IEC 9594-8. This document specifies
    the structure of a public key certificate conforming with ISO/IEC 9594-8 in which
    the LEI is embedded.
