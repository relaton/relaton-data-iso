abstract:
- language: en
  script: Latn
  content: This document specifies procedures and requirements for the identification
    of materials that are suitable for recovery through anaerobic digestion. Due to
    the diversity of anaerobic digestion installations (wet versus dry, mesophilic
    versus thermophilic, without post-composting phase versus with post-composting
    phase) different classes of digestible materials are elaborated. A distinction
    can be made between AD-convertible (= converted to biogas during the anaerobic
    phase) and AD-compatible (= no or insufficient conversion to biogas, but no negative
    influence on the digestate quality and/or compost quality).
