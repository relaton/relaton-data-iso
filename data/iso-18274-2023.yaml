abstract:
- language: en
  script: Latn
  content: This document specifies requirements for classification of solid wire electrodes,
    solid strip electrodes, solid wires and solid rods for fusion welding of nickel
    and nickel alloys. The classification of the solid wire electrodes, solid strip
    electrodes, solid wires and solid rods is based on their chemical composition.
    It includes those compositions in which the nickel content exceeds that of any
    other element. The principles of this document can be applied to metal powders
    for cladding, hard facing and additive manufacturing.
