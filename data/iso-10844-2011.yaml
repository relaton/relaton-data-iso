abstract:
- language: en
  script: Latn
  content: 'ISO 10844:2011 specifies the essential characteristics of a test surface
    intended to be used for measuring vehicle and tyre/road noise emissions. The surface
    design given in ISO 10844:2011: a) produces consistent levels of tyre/road sound
    emission under a wide range of operating conditions including those appropriate
    to vehicle sound testing; b) minimizes inter-site variation; c)provides minor
    absorption of the vehicle sound sources; d) is consistent with road-building practice.'
