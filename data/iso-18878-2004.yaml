abstract:
- language: en
  script: Latn
  content: ISO 18878:2004 provides methods to prepare training materials and to administer
    training to operators (drivers) of Mobile Elevating Work Platforms (hereafter
    known as MEWPs). It is applicable to MEWPs, as defined in ISO 16368, which are
    intended to move persons to positions where they can carry out work from the work
    platform. If national regulations are more stringent, they take precedence over
    the requirements of ISO 18878:2004.
