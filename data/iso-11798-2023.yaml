abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and test methods for evaluation of
    the permanence and durability of writing, printing and copying on paper stored
    in libraries, archives, and other protected environments for long periods of time,
    in which the information recorded on paper must be retained but not necessarily
    the full artistic quality. It is applicable to: —     images on white permanent
    paper according to ISO 9706 or ISO 11108; —     recording obtained from pens,
    stamps, copying machines and printers (that can produce monocoloured and/or multicoloured
    images). It does not apply to: —     documents stored under harmful conditions,
    such as high humidity that promotes microbiological attack, excessive heat, radiation
    (e.g. light), high levels of pollutants, or the risk of water damage (or water
    contact). Since documents might be kept in non-protected environments before being
    transferred to protected environments, resistance to water and light is, however,
    of importance; —     legal documents, e.g. banking documents, where the authenticity
    is of primary interest; —     documents where the information contents are influenced
    by small colour changes; —     documents within the scope of ISO/TC 42, Photography.'
