abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of polyacrylate (PA) superabsorbent materials in airborne dust by measurement of sodium (Na) by atomic absorption spectrometry (AAS). This method is applicable to the determination of collected superabsorbent powder in the range between 0,2 µg and 60 µg (limit of detection near 0,2 µg) of superabsorbent powders. It is applicable to polyacrylate superabsorbent materials, which occur in hygiene products including urine-absorbing aids for incontinent persons. The test methods are addressed to the material exclusively. They are not intended to be used, and are not applicable for use, with finished manufactured urine-absorbing aids.
