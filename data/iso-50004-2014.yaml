abstract:
- language: en
  script: Latn
  content: ISO 50004:2014 provides practical guidance and examples for establishing,
    implementing, maintaining and improving an energy management system (EnMS) in
    accordance with the systematic approach of ISO 50001. The guidance in ISO 50004:2014
    is applicable to any organization, regardless of its size, type, location or level
    of maturity. ISO 50004:2014 does not provide guidance on how to develop an integrated
    management system. While the guidance in ISO 50004:2014 is consistent with the
    ISO 50001 energy management system model, it is not intended to provide interpretations
    of the requirements of ISO 50001.
