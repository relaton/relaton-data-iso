abstract:
- language: en
  script: Latn
  content: This document provides requirements for protecting personally identifiable
    information(PII) during interactions between user avatars and system avatars in
    the metaverse. This document identifies and classifies the PII generated and used
    by user avatars and system avatars and addresses privacy threats in the spaces
    where the respective avatar operates during the interactions between the user
    avatar and the system avatar.
