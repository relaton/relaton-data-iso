abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of prevailing torque (all metal)
    hexagon high nuts, in steel and stainless steel, with metric fine pitch thread
    8 mm to 39 mm, and with product grades A and B. NOTE            These nuts are
    designed with an overall height hmin = mmin (as specified in ISO 898-2 and ISO 8674
    for style 2) plus the prevailing torque feature. hmax has been established in
    function of hmin; therefore, the tolerance (hmax – hmin) does not follow the ISO
    code system for tolerances (IT system). The wrenching height mw,min corresponds
    to the values specified for style 1. If in certain cases other specifications
    are requested, property classes and stainless steel grades can be selected from
    ISO 898-2 or ISO 3506-2.
