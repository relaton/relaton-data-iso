abstract:
- language: en
  script: Latn
  content: This document specifies the concepts and structure for standardization
    for georegulation in the marine space. This document addresses the information
    structures related to management of legal spaces (such as the international maritime
    limits and boundaries, marine living and non-living resources management areas,
    marine conservation areas, etc.) and their related rights and obligations. This
    document establishes the common elements and basic schema to structure marine
    georegulation information system. It builds upon the common components defined
    in ISO 19152-1.
