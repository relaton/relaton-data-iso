abstract:
- language: en
  script: Latn
  content: This document specifies the terms and definitions, principles and methods,
    apparatus and materials, sample requirements and preparation, testing, calculation
    of shale linear swelling ratio, precision, and requirements and procedures for
    reporting when the linear swelling ratio of shale in water-based fluids is determined
    using a dilatometer. This document is applicable to the testing of rock samples
    delivered to the laboratory. The collection and preparation of rock samples are
    not covered by this document. This document is applicable to the assessment of
    wellbore collapse, permeability impairment and other risks caused by shale swelling
    after interaction with downhole working fluids, as well as to the guidance of
    liquid system and formulation optimization.
