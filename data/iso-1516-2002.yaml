abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method to determine if paints,
    varnishes, paint binders, solvents, petroleum or related products, when maintained
    at a selected equilibrium temperature and under the conditions of the test, give
    off sufficient flammable vapour to cause ignition on application of an external
    source of flame applied in a standard manner. This International Standard is not
    applicable to water-borne paints which may, however, be tested using ISO 3680.
    The method is suitable for use over the temperature range -30 °C to 110 °C, depending
    on the use of different apparatus listed in Table 1. The interpretation of results
    obtained from solvent mixtures containing halogenated hydrocarbons, should be
    considered with caution, as these mixtures can give anomalous results.
