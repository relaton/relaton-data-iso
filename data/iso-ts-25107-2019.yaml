abstract:
- language: en
  script: Latn
  content: This document gives requirements and recommendations for non-destructive
    testing (NDT) training syllabuses, with the intention of harmonizing and maintaining
    the general standard of training of NDT personnel for industrial needs. It also
    establishes the minimum requirements for effective structured training of NDT
    personnel to ensure eligibility for qualification examinations leading to third-party
    certification according to recognized standards. In addition to non-destructive
    testing in general, its guidelines for syllabuses cover acoustic emission testing,
    eddy current testing, leak testing, magnetic testing, penetrant testing, radiographic
    testing, ultrasonic testing, visual testing, thermographic testing, and strain
    gauge testing. ISO/TS 25108 gives requirements and recommendations for NDT training
    organizations.
