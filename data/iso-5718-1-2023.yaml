abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for blades used as cutting elements
    on rotary disc mowers and rotary drum mowers used for forage crop harvesting in
    agriculture only (as defined in ISO 4254-12) that are mounted, semi-mounted, trailed
    or self-propelled. It specifies requirements for testing and marking of such blades.
    This document is not applicable to blades used on: —    flail mowers; —    large
    rotary mowers covered by ISO 4254-13; —    arm-type large rotary mowers; —   
    pedestrian-controlled motor mowers; —    lawn mowers covered by the ISO 5395 series.
    NOTE 1    The main purpose of this document is to set material characteristics.
    Blades on rotary drum and rotary disc mowers are exposed to considerable centripetal
    forces and impacts with foreign objects. A bend test and impact test to check
    the brittleness and toughness of the material are therefore included in this document.
    NOTE 2    This document does not specify dimensional requirements.'
