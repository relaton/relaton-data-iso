abstract:
- language: en
  script: Latn
  content: ISO/IEC 15946-1:2016 describes the mathematical background and general
    techniques necessary for implementing the elliptic curve cryptography mechanisms
    defined in ISO/IEC 15946‑5, ISO/IEC 9796‑3, ISO/IEC 11770‑3, ISO/IEC 14888‑3,
    ISO/IEC 18033‑2 and other ISO/IEC standards. ISO/IEC 15946-1:2016 does not specify
    the implementation of the techniques it defines. For example, it does not specify
    the basis representation to be used when the elliptic curve is defined over a
    finite field of characteristic two. Thus, interoperability of products complying
    with ISO/IEC 15946-1:2016 will not be guaranteed.
