abstract:
- language: en
  script: Latn
  content: This document specifies a half-duplex block transmission protocol featuring
    the special needs of a contactless environment and defines the activation and
    deactivation sequence of the protocol. This document is intended to be used in
    conjunction with other parts of ISO/IEC 14443 and is applicable to proximity cards
    or objects of Type A and Type B.
