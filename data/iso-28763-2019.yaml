abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements and the functional characteristics
    of enamel coatings applied by any process, such as wet dipping, wet flow-coating,
    wet spraying, wet electrostatic spraying, wet electrodeposition or dry-powder
    electrostatic spraying, to profiled steel heat exchanger panels in regenerative
    heat exchangers, before and after packing in baskets. For very severe service
    conditions, or to obtain extended operational life, more stringent limits can
    be agreed between customer and supplier.
