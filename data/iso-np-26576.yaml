abstract:
- language: en
  script: Latn
  content: This document specifies general requirements for the energy system of solar-powered
    aircraft. The system primarily consists of solar cells, power control equipment,
    energy storage batteries, etc. This document includes design and validation requirements
    for the system architecture, performance metrics, reliability, safety, electromagnetic
    compatibility, interfaces, grounding, and other aspects. This document is applicable
    to energy systems for solar-powered aircraft and hybrid-electric general aviation
    vehicles. It aims to support the design and manufacturing for efficient connection,
    compatibility, and matching between systems and airframes produced by different
    manufacturers. This document does not cover detailed design methods for the solar-powered
    aircraft energy system and its individual components.
