abstract:
- language: en
  script: Latn
  content: |-
    This document specifies the terms and definitions commonly used in the field of Brain-computer Interface (BCI), including basic concepts and classifications of BCI, hardware, experiment setups and protocols used in BCI, related neuroscience concepts of BCI (e.g., coding and decoding, feedback and stimulation), and its applications etc.

    This document is applicable to the understanding of Brain-computer Interface concepts and the exchange of information.
