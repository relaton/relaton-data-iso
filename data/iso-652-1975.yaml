abstract:
- language: en
  script: Latn
  content: The specified thermometers are of the mercury-in-glass enclosed-scale type
    with short range. They are used in bomb calorimetry and for other purposes where
    an accurate measurement of a change of temperature is required. They are not provided
    with auxiliary scales and are therefore not suited for measurement of the absolute
    temperature. The requirements specify material, construction, scale, and accuracy.
