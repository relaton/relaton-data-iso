abstract:
- language: en
  script: Latn
  content: The scope of this proposal is to propose standard methods for partitioning
    a cohort of consumers into subgroups, called consumer segments, based on specified
    criteria. The criteria fall into two major categories; 1) a priori criteria, such
    as age, gender, geography, etc. and 2) preference/liking-based criteria, such
    as subgroups of consumers with similar patterns of liking scores across a set
    of test products.
