abstract:
- language: en
  script: Latn
  content: ISO 4064-2:2014|OIML R 49-2:2013 is applicable to the type evaluation and
    initial verification testing of water meters for cold potable water and hot water
    as defined in ISO 4064‑1:2014|OIML R 49‑1:2013. OIML Certificates of Conformity
    can be issued for water meters under the scope of the OIML Certificate System,
    provided that ISO 4064-2:2014|OIML R 49-2:2013, ISO 4064‑1:2014|OIML R 49‑1:2013
    and ISO 4064‑3:2014|OIML R 49‑3:2013 are used in accordance with the rules of
    the system. ISO 4064-2:2014|OIML R 49-2:2013 sets out details of the test programme,
    principles, equipment and procedures to be used for the type evaluation, and initial
    verification of a meter type. The provisions of ISO 4064-2:2014|OIML R 49-2:2013
    also apply to ancillary devices, if required by national regulations. The provisions
    include requirements for testing the complete water meter and for testing the
    measurement transducer (including the flow or volume sensor) and the calculator
    (including the indicating device) of a water meter as separate units.
