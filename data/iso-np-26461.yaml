abstract:
- language: en
  script: Latn
  content: This document specifies a method for the quantitative determination of monomeric diisocyanate content in isocyanate polymers by high performance liquid chromatography (HPLC). This document applies to the determination of monomeric diisocyanates in isocyanate polymers, such as 1,6-hexamethylene diisocyanate (HDI) trimer, HDI uretdione, toluene diisocyanate (TDI)trimer, isophorone diisocyanate (IPDI) trimer and prepolymers (e.g., HDI urethane, TDI-trimethylpropane adduct). The method is applicable for concentrations ranging from 0,01 % to 1,0 % mass fraction, with a method detection limit of 20 mg/kg.
