abstract:
- language: en
  script: Latn
  content: 'The proposed scope is intended to provide a framework for a sustainable
    HRM system that organizations can use to efficiently and effectively attract,
    develop, and deploy human capital. The key requirements will address attracting,
    developing, and deploying human capital, and include better treatment of workers,
    improved results for organizations, and support of broader societal goals. The
    terminology of ISO 30400 and the MSS Harmonized Structure will be taken into account.
    The following UN Sustainable Development Goals (SDG’s) underpin this proposed
    Type A MSS: UN SDG3-Good health and wellbeing; SDG4-Good Education, SDG5-Gender
    Equality, SDG8-Decent work and economic growth, SDG 9-Industry, innovation and
    infrastructure, and SDG10–Reduced inequalities. This document will be applicable
    to organizations of all sizes, growth phases and sectors, whether public or private,
    for profit or not for profit. This MSS is intended to help organizations align
    their human resources management system to effectively implement the organization’s
    strategic objectives. This MSS will follow the Harmonized Structure, and will
    not dictate the organization’s strategies and objectives, nor will it address
    its relationships with trade unions and other representative bodies.'
