abstract:
- language: en
  script: Latn
  content: This document establishes a measurable quantitative information extraction
    (MQIE) scheme, which is based on the semantic annotation scheme specified in ISO
    24617-11. It is applicable to the domains of technology that carry more applicational
    relevance than some theoretical issues found in the ordinary use of language.
    NOTE            ISO 24617-12 deals with more general and theoretical issues of
    quantification and quantitative information. This document also treats temporal
    durations that are discussed in ISO 24617-1, and spatial measures such as distances
    that are treated in ISO 24617-7, while making them interoperable with other measure
    types. It also accommodates the treatment of measures or amounts that are introduced
    in ISO 24617-6:2016, 8.3.
