abstract:
- language: en
  script: Latn
  content: This document specifies the production and performance relevant test requirements
    for automatic steam traps used for condensate removal/recovery services for optimized
    utilization of energy, in refinery, power generation or other general applications
    where steam is used as a medium of heat transfer. The tests can be classified
    as production tests and performance characteristic tests and can be conducted
    to ensure the correct functioning of a steam trap or to evaluate the performance
    of a particular design. This document specifies the tests performed relative to
    each one of these two categories and briefly describes the corresponding test
    methods.
