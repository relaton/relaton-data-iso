abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of valves made from polyethylene
    (PE) for buried and above ground applications, intended for the conveyance of
    water for human consumption, raw water prior to treatment, drains and sewers under
    pressure, vacuum sewer systems, and water for other purposes, with the exception
    of industrial applications. NOTE 1 For PE components intended for the conveyance
    of water for human consumption and raw water prior to treatment attention is drawn
    to 6.4. Components manufactured for water for other purposes, drains and sewers,
    and vacuum systems are possibly not suitable for water supply for human consumption.
    NOTE 2 Industrial application is covered by ISO 15494 [2]. The intended use includes
    sea outfalls, laid in water and pipes suspended below bridges. It is applicable
    to isolating unidirectional and bi-directional valves with spigot ends or electrofusion
    sockets intended to be fused with PE pipes or fittings conforming to ISO 4427
    2 and ISO 4427 3 respectively. NOTE 3 For valves intended for drains and sewers,
    additional information is given in Clause 10. It also specifies the test parameters
    for the test methods referred to in this document. In conjunction with ISO 4427-1,
    ISO 4427-2, ISO 4427-3 and ISO 4427-5, this document is applicable to PE pipes,
    fittings and valves, their joints and to joints with components of PE and other
    materials intended to be used under the following conditions: a) allowable operating
    pressure, PFA, up to 25 bar ); b) an operating temperature of 20 °C as a reference
    temperature; NOTE 4 For applications operating at constant temperature greater
    than 20 °C and up to 50 °C, see ISO 4427 1, Annex A. The ISO 4427 series covers
    a range of allowable operating pressures and gives requirements concerning colours
    and additives. It is the responsibility of the purchaser or specifier to make
    the appropriate selections from these aspects, taking into account their particular
    requirements and any relevant national guidance or regulations and installation
    practices or codes. This document covers valves to be installed in a piping system
    with a nominal outside diameter dn ≤ 400 mm as specified in ISO 4427-2.'
