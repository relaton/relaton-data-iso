abstract:
- language: en
  script: Latn
  content: This document specifies minimum nuclear criticality safety training requirements
    for operations staff, operations supervisors, and management. This document is
    applicable to areas, processes or facilities containing quantities of fissile
    material for which nuclear criticality safety assessment is required as defined
    in ISO 1709. This document is not applicable to the transport of fissile materials
    outside the boundaries of nuclear establishments.
