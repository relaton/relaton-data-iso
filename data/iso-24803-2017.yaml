abstract:
- language: en
  script: Latn
  content: 'ISO 24803:2017 specifies requirements for service providers in the field
    of recreational scuba diving and snorkelling excursions. It specifies the following
    areas of service provision: - introductory diving activities; - snorkelling excursions;
    - provision of training and education; - organized and guided diving for qualified
    divers; - rental of diving and snorkelling equipment. Service providers can offer
    one or more of these services. ISO 24803:2017 specifies the nature and quality
    of the services to the client. ISO 24803:2017 does not apply to freediving (also
    called "apnea diving").'
