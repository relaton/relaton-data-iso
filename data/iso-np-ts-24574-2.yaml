abstract:
- language: en
  script: Latn
  content: 'Many digital objects, which are stored in an electronic vault, are signed and/or time stamped. Many are also files in PDF (ISO 32000) or PDF/A (ISO 19005) format. Others will implement the technologies defined in the draft standard ISO/CD TS 32008 Authenticity of information — Extensions to Content Credentials for ISO 32000-2 (PDF 2.0). The purpose of this second part is to: Manage signed and/or time-stamped files (in particular, managing the validity of signature certificates), Use the information defined in ISO 32008. Furthermore, during discussions on the creation of Part 1, it became apparent that it might be useful to specify certain references, such as encryption and hash calculation algorithms. Part 2 will specify the references to the algorithms that can be used. This draft part will be an option for safe developers. It will add requirements but will not modify the requirements of Part 1 in any way. Part 2 will simply be a supplement to Part 1 in order to manage digital signature, ISO 32008 PDF file and precise technical implementation.'
