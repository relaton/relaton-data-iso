abstract:
- language: en
  script: Latn
  content: ISO/IEC 29120-1 establishes ? machine readable records for documenting
    the output of a biometric test, ? formats for data that ISO/IEC 19795 tests are
    required to report, and ? an ASN.1 syntax for test reports. This standard specifically
    does not ? require, prohibit, or otherwise specify, the format of biometric samples
    or templates used in a test, ? require, prohibit or otherwise specify, the encapsulation
    of biometric samples or templates used in a test, or ? regulate metrics for tests.
    NOTE ISO/IEC 19795‑1 establishes the reportable metrics.
