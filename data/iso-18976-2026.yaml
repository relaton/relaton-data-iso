abstract:
- language: en
  script: Latn
  content: This document applies to single stage, two stage and economised refrigerant
    compressors. Selected test methods are described for the determination of the
    refrigerating capacity, the power input, the isentropic efficiency and where possible
    the volumetric efficiency. These test methods provide results of sufficient accuracy
    to permit consideration of the suitability of a refrigerant compressor to operate
    satisfactorily under any set of basic test conditions required for a given application.
    NOTE            Tests on complete refrigeration installations are dealt with in
    ISO 916.
