abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for data dictionaries that are used
    by product catalogues for building services to provide the semantics of their
    definitions and data modelling. For this purpose, it defines an overall model
    that contains: —    subject kinds that allow to distinguish: —    product subjects
    representing products in product catalogues; —    catalogue subjects comprising
    meta data of product catalogues; —    various kinds of blocks that collect properties
    of complex product features, including ports and in/outlets; —    relationship
    types that allow to distinguish between different kinds of relationships like
    isSubtypeOf, hasPart, or hasBlock; —    property kinds to distinguish between:
    —    static properties describing products by providing property values in product
    catalogues; —    dynamic properties that describe the behaviour of products; —
       external properties that represent external conditions that influence the behaviour
    of the product by influencing the values of dynamic properties. This document
    also describes a mapping of the overall model to the data dictionary model of
    ISO 12006-3 by introducing a dictionary meta level. Finally, to overcome deficiencies
    of the standards underlying ISO 16757-5 in capturing all aspects of product catalogues,
    this document provides some rules and recommendations for required data dictionary
    elements. This document does not describe how product catalogues have to be organized,
    and it does not describe any formats for the exchange of product catalogues. Product
    catalogues are described in ISO 16757-5.'
