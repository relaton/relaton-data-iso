abstract:
- language: en
  script: Latn
  content: ISO 10497:2004 specifies fire type-testing requirements and a fire type-test
    method for confirming the pressure-containing capability of a valve under pressure
    during and after the fire test. It does not cover the testing requirements for
    valve actuators other than manually operated gear boxes or similar mechanisms
    when these form part of the normal valve assembly. Other types of valve actuators
    (e.g. electrical, pneumatic or hydraulic) may need special protection to operate
    in the environment considered in this valve test, and the fire testing of such
    actuators is outside the scope of this International Standard.
