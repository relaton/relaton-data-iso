abstract:
- language: en
  script: Latn
  content: The document specifies a method for evaluating the adhesion of sealants
    with a minimum elongation at break of 25 % (according to ISO 8339, Method A or
    B) on various substrates. This test method can be used for one-component and multi
    component sealants. This method is typically used for elastic sealants but can
    be also used for plastic sealants. For plastic sealants, the test can be more
    difficult and needs to be carried out by experienced technicians. This test is
    used to judge the adhesion of construction sealants in combination with cleaners,
    activators and/or primers on various substrates when exposed to a peeling force
    and also after different aging conditions. An adhesion test according to this
    document can also be conducted for process monitoring and quality assurance accompanying
    production. The test method described in this document is not intended to replace
    any adhesion cohesion test methods specified in ISO 11600.
