abstract:
- language: en
  script: Latn
  content: 'This Recommendation I International Standard: defines a general framework
    for context-relative naming, refining and elaborating on the naming concepts defined
    in Part 2 of the ODP-RM; identifies and characterizes functions necessary to handle
    names in the context of a federation of different naming systems; and clarifies
    the relationship between the concepts of name management (i.e. federation and
    naming) in distributed computing systems. It provides a general framework for
    the naming of entities of interest in ODP systems, which includes naming in the
    infrastructure of an ODP system, naming in the applications built on the infrastructure,
    and naming in the enterprise the system serves.'
