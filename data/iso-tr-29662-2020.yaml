abstract:
- language: en
  script: Latn
  content: This document establishes an overview of test methods in the field to determine
    flash point and combustibility of petroleum and related products. It presents
    advice on application and specification development. This document is not intended
    to be a comprehensive manual on flash point and combustibility tests, and the
    interpretation of test results, however it covers the key aspects on these subjects.
