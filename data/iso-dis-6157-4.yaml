abstract:
- language: en
  script: Latn
  content: 'This document specifies the limits of surface discontinuities for washers
    designed to be used in bolted joints in combination with bolts, screws, studs
    and nuts. This document basically applies to the following washers delivered in
    the uncoated or coated surface condition: — plain washers (with or without knurls,
    ribs or chamfers), — square washers, — square hole washers, — shaped plates, —
    conical washers, waved washers, electric terminal washers and teethed washers,
    — in steel with thickness 0,2 mm to 12 mm (see e.g. ISO 898-3). — in stainless
    steel with thickness 0,2 mm to 6 mm (see e.g. ISO 3506-7). It is also applicable
    to other thickness or types of washers or similar parts, by agreement between
    the purchaser and the supplier.'
