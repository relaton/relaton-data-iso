abstract:
- language: en
  script: Latn
  content: 'This document: specifies strategic aspects supporting systems engineering
    agility; provides guidelines for their selection and application. This document
    is applicable to: those who use or plan to use ISO/IEC/IEEE 15288 on projects
    dealing with human-made systems and services related to those systems and products;
    those who are responsible for the technical management of projects concerned with
    the engineering of systems; those responsible for executing ISO/IEC/IEEE 15288
    system life cycle processes at a project level; organizations and individuals
    who are seeking to improve their capability to deal with uncertain knowledge and
    dynamic environments.'
