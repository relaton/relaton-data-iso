abstract:
- language: en
  script: Latn
  content: ISO 14683:2007 deals with simplified methods for determining heat flows
    through linear thermal bridges which occur at junctions of building elements.
    ISO 14683:2007 specifies requirements relating to thermal bridge catalogues and
    manual calculation methods. Default values of linear thermal transmittance are
    given in Annex A for information.
