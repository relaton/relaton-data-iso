abstract:
- language: en
  script: Latn
  content: This document specifies the main dimensions and tolerances, in millimetres,
    of guide bushes of form H, headed gliding stripper bushes, type 1, intended for
    use in press tools and to be mounted in the stripper with transition fit and directly
    pressed into the stripper. It gives guidance on the materials, and specifies the
    hardness and the designation of bushes in accordance with this document.
