abstract:
- language: en
  script: Latn
  content: This document specifies the test method to determine the capillarity of
    cylindrical cork stoppers. It consists in measuring the capillary rise by dipping
    in a hydro-alcoholic solution containing a dye. Two methods using the same procedure
    but different concentrations of hydro-alcoholic solutions are described. It is
    applicable to all types of cylindrical cork stoppers, ready for use.
