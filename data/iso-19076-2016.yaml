abstract:
- language: en
  script: Latn
  content: 'ISO 19076:2016 provides a method for the measurement of the surface of
    leather or leather parts by the use of electronic measuring machines. It applies
    to the measurement of leather (or leather parts) fulfilling the following requirements:
    - flexible leather, finished or unfinished, dry or wet leather; - flexibility:
    such to allow full distension on the measuring line/surface.'
