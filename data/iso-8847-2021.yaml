abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the design, installation and
    testing of cable over pulley steering systems on small craft with or without a
    propulsion engine(s), and on small craft with outboard engine(s) up to and including
    37 kW total power. It specifies the requirements for the design and testing of
    all components of a cable over pulley steering system, from the steering mechanism
    to the mechanical interface with the rudder shaft or the outboard engine. It applies
    to cable over pulley steering systems, whether for pedestal or bulkhead types.
    This document does not address emergency means of steering the craft.
