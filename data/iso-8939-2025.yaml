abstract:
- language: en
  script: Latn
  content: This document provides information and guidelines on the decommissioning
    of a medical cyclotron facility, with a focus on activated or contaminated parts.
    Useful information and guidelines are given on decommissioning strategy and plan,
    safety assessment, and various decommissioning activities. This document also
    provides the guideline on the estimation of activation level using Monte Carlo
    simulation and the methodology for the measurement of activated radionuclides
    in the main structure, system components, and shielding walls, ceilings and floors
    during operation and decommissioning. Financial provisions and radioactive waste
    management aspects are also included. This document can be used by organizations
    responsible for operation and decommissioning of a medical cyclotron facility.
    In addition, it is expected that organizations that design a medical cyclotron
    or manage radioactive waste generated by cyclotron can utilize or refer to this
    document in whole or in part.
