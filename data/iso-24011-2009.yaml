abstract:
- language: en
  script: Latn
  content: ISO 24011:2009 specifies the characteristics of plain and decorative linoleum,
    supplied as either tiles or rolls. To encourage the consumer to make an informed
    choice, ISO 24011:2009 includes a classification system based on the intensity
    of use, which shows where resilient floor coverings provide satisfactory service.
    The term 'linoleum' is frequently incorrectly applied to a range of floor coverings,
    often to those based on poly(vinyl chloride) or rubber. Such materials are not
    included in ISO 24011:2009.
