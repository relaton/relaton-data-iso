abstract:
- language: en
  script: Latn
  content: ISO 28721-5:2016 establishes a system for the cataloguing of defects in
    enamellings for chemical service and vessels. In addition, it describes some types
    of areas in which defects have been treated and which can easily be confounded
    with enamelling defects. It serves for a consistent language use concerning the
    designation and characterization of enamelling defects. ISO 28721-5:2016 is limited
    to detectable defects and does not purport to fully take into consideration all
    occurring types of defects. It does not evaluate enamelling defects; the classification
    carried out is based on experience and corresponds, as far as possible, to ISO
    28721-1. NOTE Regarding the acceptance of glass lined equipment for use in process
    engineering, ISO 28721-1 applies.
