abstract:
- language: en
  script: Latn
  content: THIS DOCUMENT PROVIDES GENERAL INFORMATION REGARDING AUSTEMPERED DUCTILE
    IRON GEARS. ALLOWABLE STRESS NUMBERS IN THIS DOCUMENT ARE BASED ON DOCUMENTED
    RESEARCH GIVEN IN BIBLIOGRAPHY. THIS DOCUMENT ONLY PROVIDES INFORMATION WHICH
    DOES NOT HAVE ANY RESTRICTIVE NATURE. THIS DOCUMENT IS INTENDED FOR USE BY EXPERIENCED
    GEAR ENGINEERS CAPABLE OF USING REASONABLE VALUES AND METHODS BASED ON KNOWLEDGE
    OF SIMILAR DESIGNS. IT IS NOT INTENDED FOR USE BY THE ENGINEERING PUBLIC AT LARGE.
    EACH GEAR MANUFACTURER IS RESPONSIBLE FOR USING DIMENSIONING VALUES. ALLOWABLE
    STRESS NUMBERS CAN BE BASED ON THIS DOCUMENT OR ON OWN INVESTIGATIONS, EXPERIENCES,
    QUALITY VERIFICATION AND AGREEMENT BETWEEN CUSTOMER AND PURCHASER.
