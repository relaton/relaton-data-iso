abstract:
- language: en
  script: Latn
  content: This document specifies general inspection and test requirements for the
    factory test of liquid ammonia valves to be used on board ammonia fueled ships.
    These test procedures would be prepared for liquid ammonia valves of ammonia ships
    such as liquid ammonia (LNH3) carrier or liquid ammonia (LNH3) bunkering vessel.
    This document applies to all connection type valves on board a ammonia ships such
    as gate, globe, check, ball and butterfly valves and contains the minimum test
    requirements to be observed during the test. Functions that are specific to a
    manufacturer and any onboard tests or specifications required by client would
    not be included.
