abstract:
- language: en
  script: Latn
  content: 'This document gives requirements, guidelines and recommendations for using
    additive manufacturing (AM) in product design. It is applicable during the design
    of all types of products, devices, systems, components or parts that are fabricated
    by any type of AM system. This document helps determine which design considerations
    can be utilized in a design project or to take advantage of the capabilities of
    an AM process. General guidance and identification of issues are supported, but
    specific design solutions and process-specific or material-specific data are not
    supported. The intended audience comprises three types of users: — designers who
    are designing products to be fabricated in an AM system and their managers; —
    students who are learning mechanical design and computer-aided design; and — developers
    of AM design guidelines and design guidance systems.'
