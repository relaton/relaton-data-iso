abstract:
- language: en
  script: Latn
  content: 'La présente Norme internationale a été élaborée à fin de définir les exigences
    minimales acceptables pour les équipements de vannes de sécurité de fond (SSSV).
    Elle concerne les vannes de sécurité de fond, les systèmes les performances ou
    l''interchangeabilité des équipements des vannes de sécurité de fond. Les systèmes
    de verrouillage, les mandrins d''ancrage et les vannes de sécurité de fond fabriqués
    par différents établissements industriels ou constructeurs peuvent être fournis
    séparément. NOTE: Restrictions : La vanne de sécurité de fond est un équipement
    de sécurité d''urgence et n''est pas prévue ou conçue pour réaliser des opérations
    courantes d''exploitation telles que le dusage de la production ou de l''injection,
    les arrêts programmés de production ou comme clapet anti-retour.'
