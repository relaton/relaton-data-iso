abstract:
- language: en
  script: Latn
  content: 1.1        This document specifies requirements relating to the construction
    and operation of devices producing air through the blending of oxygen and nitrogen
    for use as sources of supply in supply systems for medical gases. 1.2        This
    document is applicable to proportioning units intended to produce synthetic medical
    air and air for driving surgical tools by mixing in defined proportions oxygen
    and nitrogen. 1.3        This document is applicable to proportioning units intended
    to be components of a medical gas supply system for medical air which supplies
    a medical gas pipeline distribution system complying with ISO 7396-1. 1.4       
    The number of proportioning units within the medical air supply system and their
    combination with other sources of supply (e.g. cylinder manifolds) to ensure that
    the supply system consists of at least three sources of supply is outside the
    scope of this document. Requirements for the supply systems for medical air are
    given in ISO 7396-1.
