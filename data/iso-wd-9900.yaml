abstract:
- language: en
  script: Latn
  content: This Standard specifies test methods for evaluating the thermal conductivity
    of high temperature thermal insulation by means of a guarded hot plate. The thermal
    conductivity of high temperature thermal insulation is tested in the temperature
    range of 100 °C to 800 °C. This Standard is used to measure the thermal conductivity
    of high temperature thermal insulation consisting of homogeneous materials. This
    Standard specifies and regulates such test methods.
