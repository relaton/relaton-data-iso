abstract:
- language: en
  script: Latn
  content: In order to create punctual timetables, it is necessary to accurately calculate
    and plan out many values, such as running time between stations, headway between
    trains, train scheduling, rolling stock scheduling, driver and crew scheduling,
    operation scheduling in stations and depots and capacity of the line/infrastructure.
    Among these values, shortest running time between stations must be calculated
    first, as this is the basis of timetabling. This document describes parameters
    as the requirements for shortest running time calculation that enable railway
    infrastructure managers, railway operators and related organizations to calculate
    accurate running time at the stage of setting up a feasible and punctual daily
    and annual timetable. In addition, this document shows the appropriateness of
    calculation by verifying the response observed on the calculated shortest running
    time when the parameter values are changed. This document excludes running time
    calculation used for purposes other than timetabling.
