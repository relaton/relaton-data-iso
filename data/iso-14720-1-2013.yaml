abstract:
- language: en
  script: Latn
  content: ISO 14720-1:2013 defines a method for the determination of sulfur in powdered
    and granular non-oxidic ceramic raw materials and materials, such as silicon carbides,
    silicon nitrides, graphites, carbon blacks, cokes, carbon powders. If proved by
    the recovery rate, this method can also be applied for other non-metallic powdered
    and granular materials, e.g. silicon dioxide. ISO 14720-1:2013 is applicable for
    materials with mass fractions of sulfur from 0,005 % to 2 %. ISO 14720-1:2013
    can also be applied for materials with higher mass fractions of sulfur after verification
    of the particular case.
