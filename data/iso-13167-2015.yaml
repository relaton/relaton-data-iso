abstract:
- language: en
  script: Latn
  content: ISO 13167:2015 specifies a test method for measuring actinides (238Pu,
    239+240Pu, 241Am, 242Cm, 243+244Cm and 237Np) in water samples by alpha spectrometry
    following a chemical separation. The method can be used for any type of environmental
    study or monitoring. The volume of the test portion required depends on the assumed
    activity of the sample and the desired detection limit. The detection limit of
    the test method is 5 × 10−3 to 5 × 10−4 Bq/l for a volume of the test portion
    of 0,1 l to 5 l with a counting time of two to ten days.
