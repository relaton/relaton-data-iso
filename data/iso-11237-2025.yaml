abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for five types of compact, wire-braid-reinforced
    hoses and hose assemblies of nominal size from 5 to 76. They are suitable for
    use with: —     oil-based hydraulic fluids HH, HL, HM, HR and HV as defined in
    ISO 6743-4 at temperatures ranging from −40 °C to +100 °C; —     water-based fluids
    HFC, HFAE, HFAS and HFB as defined in ISO 6743-4 at temperatures ranging from
    0 °C to +70 °C; —     water at temperatures ranging from 0 °C to +70 °C. This
    document does not include requirements for end fittings. It is limited to requirements
    for hoses and hose assemblies. The hose assembly maximum working pressure is governed
    by the lowest maximum working pressure of the components. NOTE            It is
    the responsibility of the user, in consultation with the hose manufacturer, to
    establish the compatibility of the hose with the fluid to be used.'
