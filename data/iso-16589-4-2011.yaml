abstract:
- language: en
  script: Latn
  content: ISO 16589 specifies seals utilizing sealing elements manufactured from
    suitably formulated compounds based on thermoplastic materials, such as polytetrafluoroethylene
    (PTFE). They are considered suitable for use under low-pressure conditions. ISO
    16589-4:2011 specifies general performance tests which can be used for seal qualification
    purposes. Materials quality control, dynamic testing, and supplementary low-temperature
    testing requirements are covered.
