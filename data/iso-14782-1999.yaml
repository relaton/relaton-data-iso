abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for the measurement of haze,
    an optical property resulting from wide-angle scattering of light, in transparent
    and substantially colourless plastics. This method is applicable to the measurement
    of haze values of less than 40 %. NOTE The haze of abraded or matted transparent
    plastics can be measured, but the value obtained may be erroneously lower than
    the true value due to light scattering within a narrow angle.
