abstract:
- language: en
  script: Latn
  content: This part of ISO 8573 provides guidance on selection from the available
    suitable methods for measurement of humidity in compressed air and specifies the
    limitations of the various methods. It does not provide methods for measurement
    of water content in states other than vapour. This part of ISO 8573 specifies
    sampling techniques, measurement, evaluation, uncertainty considerations and reporting
    for the air contamination parameter humidity. It gives guidance for the conversion
    of humidity statements to the standard format.
