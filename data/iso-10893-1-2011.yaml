abstract:
- language: en
  script: Latn
  content: ISO 10893-1:2011 specifies requirements for automated electromagnetic testing
    of seamless and welded steel tubes, with the exception of submerged arc-welded
    (SAW) tubes, for verification of hydraulic leak-tightness. It is applicable to
    the inspection of tubes with an outside diameter greater than or equal to 4 mm,
    when testing with eddy current, and greater than 10 mm when testing with flux
    leakage method. It can also be applicable to the testing of hollow sections.
