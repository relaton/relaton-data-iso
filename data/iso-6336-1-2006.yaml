abstract:
- language: en
  script: Latn
  content: ISO 6336-1:2006 presents the basic principles of, an introduction to, and
    the general influence factors for, the calculation of the load capacity of spur
    and helical gears. Together with ISO 6336-2, ISO 6336-3, ISO 6336-5 and ISO 6336-6,
    it provides a method by which different gear designs can be compared. It is not
    intended to assure the performance of assembled drive gear systems. It is not
    intended for use by the general engineering public. Instead, it is intended for
    use by the experienced gear designer who is capable of selecting reasonable values
    for the factors in these formulae based on knowledge of similar designs and awareness
    of the effects of the items discussed. The formulae in ISO 6336 are intended to
    establish a uniformly acceptable method for calculating the pitting resistance
    and bending strength capacity of cylindrical gears with straight or helical involute
    teeth.
