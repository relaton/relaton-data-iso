abstract:
- language: en
  script: Latn
  content: ISO 9334:2006 defines terms relating to the optical transfer function and
    indicates, where pertinent, the mathematical relationships between those terms.
    It also defines important parameters that should be specified in connection with
    optical transfer function testing. The terms and parameters defined in this ISO
    9334:2006 apply to all measurements of the optical transfer function for optical,
    electro-optical and other imaging systems.
