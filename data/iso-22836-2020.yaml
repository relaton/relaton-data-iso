abstract:
- language: en
  script: Latn
  content: This document specifies accelerated moisture absorption properties and
    supersaturated conditioning by moisture for fibre-reinforced plastics) using sealed
    pressure vessel at higher temperature than 100 °C with saturated water vapour
    at used heating temperature. The purpose of this moisture absorbing procedure
    is to screen test specimens with moisture by mechanical or thermal properties.
    This document applies to carbon-fibre materials and their products with either
    thermoset or thermoplastic matrices, with a Tg greater than 150 °C. This document
    can also apply to materials reinforced with other fibres (e.g. glass-fibres) with
    a Tg greater than 150 °C.
