abstract:
- language: en
  script: Latn
  content: This document specifies the quality characteristics for food products that
    can be stored in room temperature and consumed in an extra-ordinary condition.
    The target consumers for this document includes not only those suffering in the
    disaster area and those engaged in rescue operations, but also those who need
    to have their meals in an environment that differs from that of their ordinary
    lives.
