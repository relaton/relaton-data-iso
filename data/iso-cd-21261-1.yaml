abstract:
- language: en
  script: Latn
  content: This document specifies high-level requirements for responsible precious
    metals sourcing, processing and traceability, based on the OECD’s Five-Step Due
    Diligence Guideline. This document is based on the OECD’s Five-Step Due Diligence
    Guideline, and apply to all precious metals used within an organization. It describes
    the effective requirements for the process of responsible sourcing of precious
    metals. It also covers traceability / chain-of-custody requirements. The aim is
    to ensure that only metals sourced in compliance with the OECD Due Diligence Guidance
    are used throughout the supply chain, all the way to the end consumer.
