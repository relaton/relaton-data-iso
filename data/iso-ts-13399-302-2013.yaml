abstract:
- language: en
  script: Latn
  content: 'ISO/TS 13399-302:2013 specifies a concept for the design of tool items,
    limited to any kind of drilling and countersinking tools with solid cutting edges,
    together with the usage of the related properties and domains of values. ISO/TS
    13399-302:2013 specifies a common way of designing simplified models that contain:
    definitions and identifications of the design features of drills and countersinking
    tools with solid cutting edges, with a link to the properties used; definitions
    and identifications of the internal structure of the 3D model that represents
    the features and properties of drills and countersinking tools with solid cutting
    edges.'
