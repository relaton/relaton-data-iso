abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines on: — how to express vitamin quantity,
    — the expression of different molecular forms in appropriate units, — and in some
    cases, vitamin activity, according to vitamers present or used in food products,
    in addition to the quantitative content determination obtained from ISO and CEN
    analytical standards. It provides information to be used as a basis for discussion
    between stakeholders and food control laboratories. It is not intended to be prescriptive
    or exhaustive.'
