abstract:
- language: en
  script: Latn
  content: This document specifies the quality, safety requirements and test methods
    for Magnoliae officinalis cortex that is derived from the dried stem bark, root
    bark or branch bark of Magnolia officinalis Rehd. et Wils. or Magnolia officinalis
    Rehd. et Wils. var. biloba Rehd. et Wils. It is applicable to Magnoliae officinalis
    cortex that are sold and used as natural medicines in international trade, including
    Chinese materia medica (medicinal materials) and decoction pieces.
