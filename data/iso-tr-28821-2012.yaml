abstract:
- language: en
  script: Latn
  content: ISO/TR 28821:2012 lists the hose connections for equipment for welding,
    cutting and allied processes which are standardised within countries of ISO member
    bodies. Its purpose is to prevent further proliferation of hose connections in
    countries or fields of applications where such connections have not been standardised.
    ISO/TR 28821:2012 only provides details of the thread type and size applying to
    that connection.
