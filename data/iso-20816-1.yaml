abstract:
- language: en
  script: Latn
  content: This document establishes general principles for the measurement and evaluation of vibration using measurements made on rotating or non-rotating parts of complete machines. It is applicable to vibration measurements on non-rotating parts and to both absolute and relative radial shaft vibration with regard to the monitoring of radial clearances, but does not apply to axial shaft vibration, unless otherwise stated. The evaluation criteria, which are presented in terms of both vibration magnitude and change in vibration, relate to both operational monitoring and acceptance tests. They have been provided primarily with regard to securing reliable, safe, long-term operation of the machine while minimizing any adverse effects on associated equipment. This document also gives guidance on setting operating limits. NOTE 1        The evaluation criteria for different machine types are included in other parts of the ISO 10816 series and the ISO 20816 series. NOTE 2        The term “shaft vibration” is used throughout the ISO 10816 series and the ISO 20816 series because, in most cases, vibration measurements are made on machine shafts. However, the ISO 10816 series and the ISO 20816 series are also applicable to measurements made on other rotating elements of the machine if such elements are found or known to be more suitable, provided that the guidelines set in this document are met. The evaluation criteria are only applicable to the vibration produced by the machine itself and not the vibration transmitted to it from outside. This document does not apply to torsional vibration. NOTE 3        For information regarding the evaluation of torsional vibration, see e.g. ISO 3046-5, ISO 22266-1 or VDI 2039.
