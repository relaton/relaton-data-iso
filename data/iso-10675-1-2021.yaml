abstract:
- language: en
  script: Latn
  content: This document specifies acceptance levels for indications from imperfections
    in butt welds of steel, nickel, titanium and their alloys detected by radiographic
    testing. If agreed, the acceptance levels can be applied to other types of welds
    (such as fillet welds, etc.) or materials. The acceptance levels can be related
    to welding standards, application standards, specifications or codes. This document
    assumes that the radiographic testing has been carried out in accordance with
    ISO 17636‑1 for RT-F (F = film) or ISO 17636‑2 for RT-S (S = radioscopy) and RT-D
    (D = digital detectors).
