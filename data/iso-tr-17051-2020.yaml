abstract:
- language: en
  script: Latn
  content: 'This document establishes guidelines for the specification of vulcanized
    rubber based on the properties of individual rubber types. This document helps
    users of rubber products, who are not rubber experts, to create a specification
    for the rubber materials they wish to use. It also describes a designation system
    to enable a line call-cut code to be devised for each specification. Since the
    properties of rubber depend on the type of rubber, such as composition, some rubbers
    are classified into several types and organized by hardness. Representative specifications
    for the following rubber types are given in Annexes B to M: natural rubber (NR),
    styrene butadiene rubber (SBR), nitrile rubber (NBR), hydrogenated nitrile rubber
    (HNBR), nitrile rubber mixed with PVC (NBR/PVC), chloroprene rubber (CR), ethylene
    acrylic rubber (AEM), fluorocarbon rubber (FKM), silicone rubber (VMQ), epichlorohydrin
    rubber (ECO) and ethylene propylene rubber (EPM and EPDM). In cases of mixed rubber
    polymers, the main polymer in the rubber material gives the name of the rubber
    type.'
