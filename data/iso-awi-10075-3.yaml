abstract:
- language: en
  script: Latn
  content: ISO 10075-3:2004 establishes principles and requirements for the measurement
    and assessment of mental workload and specifies the requirements for measurement
    instruments. ISO 10075-3:2004 provides information for choosing appropriate methods
    and provides information on aspects of assessing and measuring mental workload
    to improve communication among the parties involved. ISO 10075-3:2004 is intended
    for use mainly by ergonomic experts, for example, psychologists, occupational
    health specialists, and/or physiologists, with appropriate training in the theoretical
    background and usage of such methods, as well as in the interpretation of the
    results. They will find the information needed when developing or evaluating methods
    of mental-workload assessment.
