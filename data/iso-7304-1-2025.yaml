abstract:
- language: en
  script: Latn
  content: 'This document establishes a method for estimation by sensory analysis
    of the cooking quality of alimentary pasta. Estimation takes place through the
    evaluation of the following: —     firmness, by chewing; —     liveliness, by
    manual handling; —     starch release, by manual handling. This document does
    not express a preference and only gives an estimate relating to the evaluation
    of the cooking of the pasta. It does not apply to small pasta shapes usually consumed
    in soups. This document is applicable to all forms of alimentary pasta produced
    from durum wheat and to products made from common wheat or a mixture of common
    wheat and durum wheat. NOTE            National regulations can apply. This document
    has been specifically designed to establish the reference method with a view to
    the development, approval or monitoring of instrumental or practical methods of
    sensory analysis.'
