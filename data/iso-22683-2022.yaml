abstract:
- language: en
  script: Latn
  content: This document specifies a test method to evaluate the rotational adaptability
    between an implant body and an implant abutment in a dental implant system. This
    document is applicable to the implant systems which do not have a friction-fit
    between implant body and implant abutment but incorporate only an anti-rotational
    feature between these components. Analog or replica components cannot be used
    to evaluate the adaptability of dental implant systems.
