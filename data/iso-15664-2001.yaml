abstract:
- language: en
  script: Latn
  content: 'This International Standard defines the procedures for noise control of
    mainly open plants. It is applicable to the following: _ specification of procedures
    for noise control during engineering of a new plant and modification/extension
    of existing plants (construction noise procedures are outside the scope of this
    International Standard but should be considered); _ definition of responsibilities
    of parties involved, viz. "end-user", "engineering contractor" and "equipment
    supplier"; _ description of general procedures to arrive at noise requirements
    for individual equipment, on the basis of overall noise requirements for the plant.
    A schematic flowchart, reviewing the noise control process, is presented in annex
    A and a summary of action items is presented in annex B. NOTE Concerning specific
    engineering methods for the acoustic design and analysis of plants, use should
    be made of other standards and textbooks.'
