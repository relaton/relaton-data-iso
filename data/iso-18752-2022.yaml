abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for ten classes, four grades and
    seven types of wire- or textile-reinforced hydraulic hoses and hose assemblies
    of nominal sizes ranging from 5 to 102. Each class has a single maximum working
    pressure for all sizes. They are suitable for use with: —    oil-based hydraulic
    fluids HH, HL, HM, HR and HV as defined in ISO 6743‑4 at temperatures ranging
    from −40 °C to +100 °C for types AS, AC, BS and BC hoses and from −40 °C to +120 °C
    for types CS, CC and DC hoses. —    water-based fluids HFC, HFAE, HFAS and HFB
    as defined in ISO 6743‑4 at temperatures ranging from −40 °C to +70 °C. —    water
    at temperatures ranging from 0 °C to +70 °C. This document does not include requirements
    for the connection ends. It is limited to the performance of hoses and hose assemblies.
    The hose assembly maximum working pressure is governed by the lowest maximum working
    pressure of the components. NOTE       It is the responsibility of the user, in
    consultation with the hose manufacturer, to establish the compatibility of the
    hose with the fluid to be used.'
