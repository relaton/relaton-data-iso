abstract:
- language: en
  script: Latn
  content: ISO 20507:2014 is a vocabulary, which provides a list of terms and associated
    definitions typically used for fine ceramic (advanced ceramic, advanced technical
    ceramic) materials, products, applications, properties, and processes. This International
    Standard contains, in separate lists, those abbreviations which have found general
    acceptance in the scientific and technical literature; they are given together
    with the corresponding terms and definitions or descriptions. In ISO 20507:2014,
    the terms are defined using the term "fine ceramic". The definitions apply equally
    to "advanced ceramics" and "advanced technical ceramics", which are considered
    to be equivalent. It does not include terms which, though used in the field of
    fine ceramics, are of a more general nature and are also well known in other fields
    of technology.
