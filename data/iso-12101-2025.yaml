abstract:
- language: en
  script: Latn
  content: This document covers the type testing of valve stem seals using a test
    fixture that is designed and fully defined to be representative of the performance
    of a valve using similar geometry. This document is applicable to stem seals for
    multi-turn, linear and quarter turn valves. It is intended to provide comparative
    type test results confirming the performance of seal manufacturers’ stem seal
    designs. This document is not intended to replace type testing of complete valve
    assemblies or valve production testing. Compliance with this document is not intended
    to be a mandatory qualification test to be completed for a stem seal design prior
    to testing a valve to the requirements of ISO 15848-1. Compressible seals with
    and without live loading, elastomers and pressure energized seals are in the scope
    of this document. Corrosion tests are not included in this document.
