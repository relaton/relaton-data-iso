abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the hierarchical taxonomy
    for specifying operating conditions which enable the definition of an operational
    design domain (ODD) and Operational Envelope (OE) of a Maritime Autonomous Surface
    Ship (MASS). This document also specifies requirements for the definition format
    of an ODD and OE using the taxonomy. This document can be used by organizations
    taking part in assurance and developing safety cases for MASS, in particular,
    for organizations conducting trials, testing and commercial deployment. This document
    can also be used by manufacturers of MASS to define the MASS’ operating capability.
    It may also be of interest to port authorities, regulators, class societies, service
    providers, national, local and regional governments to enable them to understand
    possible MASS deployments and capabilities. This document does not cover the basic
    test procedures for attributes of the ODD or OE. It does not cover the monitoring
    requirements of the ODD or OE attributes.
