abstract:
- language: en
  script: Latn
  content: 'ISO/TS 19158:2012 provides a framework for quality assurance specific
    to geographic information. It is based upon the quality principles and quality
    evaluation procedures of geographic information identified in ISO 19157 and the
    general quality management principles defined in ISO 9000. The framework defined
    in ISO/TS 19158:2012 enables a customer to satisfy itself that its suppliers,
    both internal and external, are capable of delivering geographic information to
    the required quality. Fundamental to the framework is the assurance of the supplier''s
    ability to understand and meet the quality requirements. Through the quality assurance
    framework both the customer and the supplier are able to consider the quality
    required at the earliest opportunity in the production/update process. Principles
    and responsibilities of the relationship between the customer and the supplier
    that facilitate the framework are provided. The responsibility for the quality
    assessment procedure is shared between the customer and the supplier. ISO/TS 19158:2012
    is applicable to customers and suppliers of all geographic information where the
    quality of the product may be impacted upon by the supplier''s processes in any
    of the following scenarios: 1) there is an agreement or legislation for the supply
    of data acquisition services, 2) data acquisition services are being tendered
    for, and 3) one or more suppliers exist in the supply chain. ISO/TS 19158:2012
    is not applicable for the supply of legacy datasets or ?off the shelf'' products
    where there is no further data production or update activity to manage.'
