abstract:
- language: en
  script: Latn
  content: This document establishes the performance requirements for lining and insock
    components for footwear, irrespective of the material, in order to assess the
    suitability for the end use and/or fitness for purpose. It also establishes the
    test methods to be used to evaluate compliance with these requirements. This document
    applies to lining and insocks for all kinds of footwear as defined in Clause 4.
    This document can be used as a reference by the manufacturer and the supplier.
