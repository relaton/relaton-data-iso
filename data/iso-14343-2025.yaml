abstract:
- language: en
  script: Latn
  content: This document specifies requirements for classification of wire electrodes,
    strip electrodes, wires and rods for gas-shielded metal arc welding, gas tungsten
    arc welding, plasma arc welding, submerged arc welding, electroslag welding and
    laser beam welding of stainless and heat-resisting steels. The classification
    of the wire electrodes, strip electrodes, wires and rods is based upon their chemical
    composition. This document is a combined specification providing for classification
    utilizing a system based upon nominal composition (system A), or utilizing a system
    based upon alloy type (system B). a)       Paragraphs which carry the label “classification
    according to nominal composition” and the suffix “system A”, or “ISO 14343-A”,
    are applicable only to products classified according to system A; b)       Paragraphs
    which carry the label “classification according to alloy type” and the suffix
    “system B”, or “ISO 14343-B”, are applicable only to products classified according
    to system B. c)        Paragraphs which carry neither label nor suffix letter
    are applicable to products that can be classified according to either system A
    or B or both.
