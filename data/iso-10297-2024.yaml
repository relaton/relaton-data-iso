abstract:
- language: en
  script: Latn
  content: 'This document specifies design, type testing and marking requirements
    for: a)       cylinder valves intended to be fitted to refillable transportable
    gas cylinders; b)       main valves (excluding ball valves) for bundles of cylinders;
    c)        cylinder valves or main valves with integrated pressure regulator (VIPR);
    NOTE 1        This includes the following specific VIPR designs where: 1)  The
    pressure regulating system is acting as the primary valve operating mechanism
    (VIPR type B). This also includes designs where closure of the primary valve operating
    mechanism is obtained by closing the seat of the pressure regulating mechanism.
    2)  The primary valve operating mechanism is located at the low-pressure side
    of the pressure regulating system (VIPR type C). d)       valves for pressure
    drums and tubes; which convey compressed, liquefied or dissolved gases. NOTE 2       
    Where there is no risk of ambiguity, cylinder valves, main valves, VIPRs and valves
    for pressure drums and tubes are addressed with the collective term “valves” within
    this document. This document does not apply to —     valves for cryogenic equipment,
    portable fire extinguishers and liquefied petroleum gas (LPG); —     quick-release
    cylinder valves (e.g. for fire-extinguishing, explosion protection and rescue
    applications) - requirements for quick-release cylinder valves are specified in
    ISO 17871 which contains normative references to this document; —     self-closing
    cylinder valves and ball valves. NOTE 3        Requirements for valves for cryogenic
    vessels are specified in ISO 21011 and at a regional level, e.g. in EN 1626. Requirements
    for LPG valves are specified in ISO 14245 or ISO 15995. Requirements for self-closing
    cylinder valves are specified in ISO 17879. Requirements for ball valves are specified
    in ISO 23826. Requirements for valves for portable fire extinguishers at a regional
    level are specified, for example, in the EN 3 series. This document only covers
    the function of a valve as a closure. Other functions that are possibly integrated
    in the valve can be covered by other standards. Such standards do however not
    constitute requirements according to this document. NOTE 4        Definition of
    and specific requirements for VIPRs in addition to those that are given in this
    document are specified in ISO 22435 for industrial applications or ISO 10524-3
    for medical applications. Similarly, certain specific requirements for residual
    pressure valves (RPV) with or without a non-return function in addition to those
    that are given in this document are given in ISO 15996. NOTE 5        Certain
    specific requirements for valves for breathing apparatus in addition to those
    that are given in this document are specified at a regional level, for example,
    in the EN 144 series. Certain specific requirements for quick-release valves for
    fixed fire-fighting systems in addition to those that are given in this document
    are specified in ISO 16003 and at a regional level, for example, in EN 12094–4.
    NOTE 6        Requirements for manufacturing tests and examinations of valves
    covered by this document are given in ISO 14246.'
