abstract:
- language: en
  script: Latn
  content: ISO 15874-2:2013 specifies the requirements of pipes made from polypropylene
    (PP) for piping systems intended to be used for hot and cold water installations
    within buildings for the conveyance of water whether or not intended for human
    consumption (domestic systems) and for heating systems under operating pressures
    and temperatures appropriate to the class of application. It covers a range of
    service conditions (application classes), design pressures and pipe dimension
    classes. It also specifies test parameters for test methods. In conjunction with
    the other parts of ISO 15874, ISO 15874-2:2013 is applicable to PP pipes, their
    joints and to joints with components of PP, other plastics and non-plastics materials
    intended to be used for hot and cold water installations. It is applicable to
    pipes with or without (a) barrier layer(s).
