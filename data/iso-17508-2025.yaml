abstract:
- language: en
  script: Latn
  content: 'This document specifies test methods for the determination of the chemical
    compatibility of packaging/ IBC made from polyethylene (PE), fluorinated polyethylene
    and co-extruded plastics. It covers the determination of adequate plastics compatibility
    against the following processes of deterioration: —     softening due to absorption
    (swelling); —     stress cracking; —     combinations thereof. This document is
    applicable to: —     drums and jerricans made from plastics; —     composite packaging
    (plastics) with inner receptacle made from plastics; —     rigid plastics IBCs
    (types 31H1 and 31H2); —     composite IBCs with rigid plastics inner receptacles
    (type 31HZ1); used for the transport of liquid dangerous goods. Proof of adequate
    plastics compatibility obtained using the test procedures specified in this document
    is only applicable to the above packaging and IBC types of the following materials
    and material specifications: —     packaging and IBCs made from PE; —     packaging
    and IBCs made from PE, whose internal surfaces are fluorinated; and —     packaging
    and IBCs which are coextrusion blow moulded and have walls with the following
    multilayer structure (from inside to outside): —    polyamide (PA), bonding agents,
    PE, or —    ethylene vinyl alcohol (EVOH), bonding agents, PE. Note             
    Packaging and IBCs made from PE and packaging and IBCs made from PE with fluorinated
    internal surfaces, deteriorate additionally due to molecular degradation reactions
    with the corresponding packaged substances. For this, the chemical compatibility
    can also be verified by the type tests described in ISO 13274:2013, Annex B, B.2.3,
    using the standard liquid nitric acid (55 %) or appropriate original packaged
    substances. Packaging made from Coex PE/PA and Coex PE/EVOH is not resistant to
    polar acid molecularly degrading substances such as nitric acid, with the result
    that a corresponding method is not considered for this process of deterioration
    in this document.'
