abstract:
- language: en
  script: Latn
  content: ISO 19385 specifies requirements for nine classes of reinforced hydraulic
    hoses and hose assemblies of nominal sizes ranging from 5 to 25. Each class has
    a single maximum working pressure. Such hoses and hose assemblies are intended
    to be used with very high-pressure water jetting and water blasting machines.
    ISO 19385 also reviews all the significant hazards, hazardous situations and events
    relevant to the equipment in the scope, when it is used as intended and under
    conditions of misuse which are reasonably foreseeable by the manufacturer.
