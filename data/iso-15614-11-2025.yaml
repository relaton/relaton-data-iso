abstract:
- language: en
  script: Latn
  content: This document specifies requirements for qualification testing of welding
    procedure specifications (WPSs) for electron or laser beam welding. This document
    applies to metallic materials, irrespective of the shape of the parts, their thicknesses,
    the manufacturing method (e.g. rolling, forging, casting, sintering) or their
    heat treatment. It covers both the production of new parts and repair work.
