abstract:
- language: en
  script: Latn
  content: ISO 6452:2007 specifies a test method which is intended to determine the
    fogging characteristics of rubber- or plastics-coated fabrics that are used as
    trim materials in the interior of motor vehicles. The method may also be applicable
    to fluid, pasty, powdered or solid raw materials which are the basis for such
    trim materials or from which the materials are manufactured. The method may also
    be applicable to other materials and finished products.
