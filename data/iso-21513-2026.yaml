abstract:
- language: en
  script: Latn
  content: This document gives guidance on the evaluation of projects and programmes
    after they have been closed, including guidance to the reviewers and contributors
    involved in these evaluations. Post-project or post-programme evaluations focus
    on evaluating the achievement of objectives, actual outcomes and actual realization
    of benefits, whether the outcomes or benefits are likely to fulfil expectations
    in future and the effectiveness of governance and management of the project or
    programme. This document includes guidance for setting, planning, organizing and
    conducting post-project and post-programme evaluations. It is applicable to any
    organization, including public, private and charitable, as well as, to any type
    of project or programme, regardless of purpose, delivery approaches, life cycle
    model used, complexity, size, cost or duration. This document does not apply to
    evaluations that occur before projects or programmes have started or during the
    implementation of a project or programme.
