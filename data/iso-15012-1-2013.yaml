abstract:
- language: en
  script: Latn
  content: ISO 15012-1:2013 specifies a method for testing equipment for the separation
    of welding fume in order to determine whether its separation efficiency meets
    specified requirements. The method specified does not apply to testing of filter
    cartridges independent of the equipment in which they are intended to be used.
    ISO 15012-1:2013 applies to equipment that is manufactured after its publication.
