abstract:
- language: en
  script: Latn
  content: Tests are given for hot pressing when the textile is dry, when it is wet,
    and when it is damp. The end-use of the textile usually determines which test
    should be made. A dry specimen (dry pressing) or a dry specimen covered with a
    wet cotton adjacent fabric (damp pressing) or a wet specimen covered with a wet
    cotton adjacent fabric (wet pressing) are pressed with a heating device at a specified
    temperature and pressure for a specified time.
