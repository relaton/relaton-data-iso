abstract:
- language: en
  script: Latn
  content: ISO 19449:2015 specifies methods for the direct measurement of the concentration
    of gaseous exhaust emissions from mopeds as defined in ISO 3833 during inspection
    or maintenance. The results measured by this International Standard show the concentration
    of gaseous exhaust emissions in the no-load engine operating condition. It is
    applicable to mopeds having spark ignition engines (four-stroke engines or two-stroke
    engines). These methods can be used, either totally or partially, for - periodic
    inspections in official garages, - official roadside checks, and - maintenance
    and diagnostic operations.
