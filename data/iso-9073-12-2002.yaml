abstract:
- language: en
  script: Latn
  content: ISO 9073-12 describes a method for the evaluation of the absorbency of
    fabrics when one side is in contact with a liquid and the fabric is under mechanical
    pressure. This test is designed to allow comparison of absorbent materials such
    as nonwovens and is not intended to simulate in-use conditions of finished products.
    Demand absorbency is also called demand wettability.
