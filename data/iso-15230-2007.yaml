abstract:
- language: en
  script: Latn
  content: 'ISO 15230:2007 describes the coupling parameters between the hands of
    a machine operator and a vibrating surface of the machine. The coupling between
    the hand and the vibrating surface can be described using different parameters
    and component parts of these parameters: force parameters, such as push, pull
    and grip; parameters such as pressure exerted on skin. In addition, informative
    annexes provide guidelines for measuring procedures, the measurement of the force
    and pressure parameters, and information on the requirements for measuring instrumentation,
    as well as a calibration method. ISO 15230:2007 does not deal with forces which
    act tangentially to the hand.'
