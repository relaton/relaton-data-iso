abstract:
- language: en
  script: Latn
  content: ISO 1133-2:2011 specifies a procedure for the determination of the melt
    volume-flow rate (MVR) and melt mass-flow rate (MFR) of thermoplastic materials
    that exhibit a high rheological sensitivity to the time-temperature history experienced
    by the sample during the test and/or to moisture. It is possible that this method
    will not be appropriate for materials whose rheological behaviour is extremely
    affected during testing. MFR values can be determined by calculation from MVR
    measurements provided the melt density at the test temperature and pressure is
    known, or by measurement using a cutting device provided that the accuracy of
    the measurement is at least the same as that of the MVR measurement. The primary
    difference between ISO 1133-2:2011 and ISO 1133-1 is that ISO 1133-2:2011 specifies
    tighter tolerances on the temperature in the cylinder and on the time duration
    over which the material is subjected to that temperature. Thus the time-temperature
    history of the material is more tightly controlled and consequently, for materials
    that are likely to be affected by exposure to elevated temperatures, the variability
    of test results is reduced compared with whether the specifications of ISO 1133-1
    were used. ISO 1133-2:2011 also provides information for preparation and handling
    of moisture sensitive materials that again are critical to obtaining repeatable,
    reproducible and accurate data. The test conditions for measurement of the MVR
    and MFR are often specified in the material standard. However, for those materials
    where there are no test conditions specified in the material standard, it is necessary
    for the test conditions to be agreed between the interested parties
