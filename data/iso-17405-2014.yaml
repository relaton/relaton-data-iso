abstract:
- language: en
  script: Latn
  content: ISO 17405:2014 specifies the techniques for manual ultrasonic testing of
    claddings on steel applied by welding, rolling, and explosion using single-element
    or dual-element probes. The test is intended to cover detection of two-dimensional
    or three-dimensional discontinuities in the cladding and in the region of the
    interface. ISO 17405:2014 does not give acceptance criteria nor define the extent
    of testing.
