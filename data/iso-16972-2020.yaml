abstract:
- language: en
  script: Latn
  content: This document defines terms and specifies units of measurement for respiratory
    protective devices (RPDs), excluding diving apparatus. It indicates graphical
    symbols that can be required on RPDs, parts of RPD or instruction manuals in order
    to instruct the person(s) using the RPD as to its operation. NOTE Terms and definitions
    for diving apparatus are given in EN 250.
