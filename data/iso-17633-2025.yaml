abstract:
- language: en
  script: Latn
  content: ISO 17633:2017 specifies requirements for classification of tubular flux
    and metal cored electrodes and rods, based on the all-weld metal chemical composition,
    the type of core, shielding gas, welding position and the all-weld metal mechanical
    properties, in the as-welded or heat-treated conditions, for gas shielded and
    non-gas shielded metal arc welding of stainless and heat-resisting steels. ISO
    17633:2017 is a combined standard providing for classification utilizing a system
    based upon nominal composition or utilizing a system based upon alloy type. a)
    Clauses, subclauses, and tables which carry the suffix letter "A" are applicable
    only to products classified using the system based upon nominal composition. b)
    Clauses, subclauses, and tables which carry the suffix letter "B" are applicable
    only to products classified using the system based upon alloy type. c) Clauses,
    subclauses, and tables which do not have either the suffix letter "A" or the suffix
    letter "B" are applicable to all products classified in accordance with this document.
    ISO 17633:2017 does not use pulsed current for determining the product classification.
