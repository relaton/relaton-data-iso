abstract:
- language: en
  script: Latn
  content: This international standard specifies requirements for dried Zanthoxyli
    Pericarpium, and the recommendations relating to storage and transport conditions
    are given in the annex. This document applies to red prickly ash pepper (Zanthoxylum
    bungeanum Maxim. syn. Zanthoxylum bungei Planch), green prickly ash pepper (Zanthoxylum
    schinifolium Sieb.et Zucc.), bamboo prickly ash pepper (Zanthoxylum armatum DC.),
