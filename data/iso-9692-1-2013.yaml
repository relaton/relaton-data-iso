abstract:
- language: en
  script: Latn
  content: ISO 9692-1:2013 specifies types of joint preparation for metal arc welding
    with covered electrode, gas-shielded metal arc welding, gas welding, TIG welding,
    and beam welding of steel. It applies to joint preparation for full penetration
    butt welds and for fillet welds. For partial penetration butt welds, types of
    joint preparation and dimensions differing from those specified in ISO 9692-1:2013
    may be stipulated. The root gaps referred to in ISO 9692-1:2013 are those gaps
    presented after tack welding, if used. Consideration is given to altering the
    joint preparation details (where appropriate) to facilitate temporary backing,
    "one-sided welding," etc.
