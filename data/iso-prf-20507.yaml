abstract:
- language: en
  script: Latn
  content: This document specifies terms and associated definitions which are typically
    used for fine ceramic (advanced ceramic, advanced technical ceramic) materials,
    products, applications, properties and processes. This document also contains
    those abbreviated terms which have found general acceptance in scientific and
    technical literature; they are given together with the corresponding full terms
    and definitions or descriptions. In this document, terms are defined using the
    term ‘fine ceramic’. The definitions apply equally to ‘advanced ceramics’ and
    ‘advanced technical ceramics’, which are considered to be equivalent. This document
    does not include terms which, though used in the field of fine ceramics, are of
    a more general nature and are also well known in other fields of technology. NOTE      
    Terms and definitions of a more general nature are available in ASTM C 1145-2019,
    EN 14232 and JIS R 1600.
