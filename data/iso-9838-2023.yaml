abstract:
- language: en
  script: Latn
  content: This document defines test soles representing —    an alpine ski-boot (form
    A) or at least the bottom part of it used for testing alpine ski-bindings for
    alpine skiing in accordance with ISO 9462 and ISO 9465, and —    a touring ski-boot
    (form T) or at least the bottom part of it used for testing touring ski-bindings
    for touring skiing in accordance with ISO 13992 and ISO 9465. This document also
    defines a test body representing alpine ski-boots with improved walking soles
    in accordance with ISO 23223. NOTE      Ski-boots have their own International
    Standards (ISO 5355, ISO 9523 and ISO 23223), which allow relatively large tolerances
    in defining the test sole that are generally believed to be suitable for on-slope
    use by skiers, but too large for reproducible laboratory measurements.
