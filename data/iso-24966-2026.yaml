abstract:
- language: en
  script: Latn
  content: This document describes a test method for the determination of the flash
    point of chemicals, lube oils, fuels including aviation turbine fuel, diesel fuel,
    diesel/biodiesel blends and related products. The precision of this method has
    been determined over the range of 24,5 °C to 229,5 °C. NOTE            Apparatus
    can determine the flash point at higher or lower temperatures than the precision
    range, however the precision has not been determined.
