abstract:
- language: en
  script: Latn
  content: This document defines test design techniques that can be used during the
    test design and implementation process that is defined in ISO/IEC/IEEE 29119‑2.
    Each technique follows the test design and implementation process that is defined
    in ISO/IEC/IEEE 29119‑2 and shown in Figure 1. This document is intended for,
    but not limited to, testers, test managers, and developers, particularly those
    responsible for managing and implementing software testing.
