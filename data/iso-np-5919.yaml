abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the contents
    of residue monomers in ABS by headspace-gas chromatography (HS-GC) equipped with
    a hydrogen flame ionization detector (FID).These monomers including styrene, acrylonitrile
    and 4-vinyl-1-cyclohexene (butadiene dimer). It may also be used for the determination
    of other volatile aromatic hydrocarbons such as toluene, xylene, isopropyl benzene
    in ABS.
