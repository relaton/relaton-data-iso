abstract:
- language: en
  script: Latn
  content: 'ISO 13722:2017 specifies a method for the enumeration of viable Brochothrix
    spp. by means of a colony-count technique. ISO 13722:2017 is especially applicable
    to meat and meat products, but is also suitable for the examination of the following:
    - other products intended for human consumption, - products intended for animal
    feeding, - environmental samples in the area of food and feed production, handling,
    and - samples from the primary production stage.'
