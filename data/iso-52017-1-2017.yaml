abstract:
- language: en
  script: Latn
  content: ISO 52017-1:2017 specifies the general assumptions, boundary conditions
    and equations for the calculation, under transient hourly or subhourly conditions,
    of the internal temperatures (air and operative) and/or the heating, cooling and
    humidification and dehumidification loads to hold a specific (temperature, moisture)
    set point, in a single building zone. No specific numerical techniques are imposed
    by ISO 52017-1:2017. Specific calculation procedures based on the generic calculation
    procedures of ISO 52017-1:2017 are given in ISO 52016-1. The specific simplifications,
    assumptions and boundary conditions in ISO 52016-1 are tailored to the respective
    application areas, such as the energy need for heating and cooling and for humidification
    and dehumidification, hourly internal temperature, design heating and cooling
    and humidification and dehumidification load. NOTE Table 1 in the Introduction
    shows the relative position of ISO 52017-1:2017 within the set of EPB standards
    in the context of the modular structure as set out in ISO 52000-1.
