abstract:
- language: en
  script: Latn
  content: This document establishes a vocabulary of and is limited to those terms
    in general use throughout the rubber industry. It does not define terms intended
    for particular rubber products, some of which are given in the vocabulary standards
    listed in the Bibliography. It does not define terms that are generally understood
    or adequately defined in other readily available sources such as general dictionaries.
    The terms are listed in the alphabetical order of the English terms, with an index
    to the corresponding English terms attached. Symbols are included under their
    full descriptions.
