abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the resistance of chemical enamels
    to chemical attack and thermal shock, as well as their designation, for ordering
    purposes. It is applicable to enamels used in glass-lined apparatus, piping and
    other components, primarily used in process equipment in chemical plants, which
    are applied on to low-alloy carbon steels substrates. NOTE            The main
    criteria for assessing enamel quality are its resistance to chemical attack and
    thermal shock, and the structure of the cover coat enamel.
