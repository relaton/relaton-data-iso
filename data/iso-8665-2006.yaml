abstract:
- language: en
  script: Latn
  content: ISO 8665:2006 specifies the requirements additional to ISO 15550 for determining
    the power of reciprocating internal combustion (RIC) engines when presented for
    documenting and checking of the declared (rated) power published by the manufacturer.
    ISO 8665:2006 applies to engines used for propulsion of recreational craft and
    other small craft of up to 24 m hull length. ISO 8665:2006 is to be used in conjunction
    with ISO 15550.
