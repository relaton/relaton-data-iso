abstract:
- language: en
  script: Latn
  content: ISO 12215-6:2008 concerns structural details and structural components
    not explicitly included in ISO 12215-5, ISO 12215-7, ISO 12215-8 and ISO 12215-9.
    It applies to monohull and multihull small craft constructed from fibre reinforced
    plastics (FRP), aluminium or steel alloys, wood or other suitable boat building
    material, with a hull length, in accordance with ISO 8666, of up to 24 m. ISO
    12215-6:2008 fulfils two functions. Firstly, it supports ISO 12215-5 by providing
    further explanations and calculation procedures and formulae. Secondly, it gives
    a number of examples of arrangements and structural details which illustrate principles
    of good practice. These principles provide a standard against which alternative
    arrangements and structural details can be benchmarked, using the equivalence
    criteria specified in ISO 12215-6:2008.
