abstract:
- language: en
  script: Latn
  content: This document specifies a method, carried out under standard conditions,
    for preparing and storing a sample of a multicomponent coating system and subsequently
    assessing its pot-life by measuring a particular property/ies. Reactive systems
    curing within a short period of time, e.g. 3 h, will have the end of their pot
    life so near to the gel point that they will need to be tested for that particular
    property in accordance with ISO 2535. The method can be carried out either as
    a pass/fail test by determining the particular property/ies after a specified
    period of time, or as determination of the pot life by repeating determinations
    at convenient intervals of time. This document is not intended for in situ control
    of products during their application. It is intended to determine "pot life" in
    the laboratory. The value obtained from this test method can be subject to modification
    by suppliers for practical reasons (e.g. starting temperature) when giving advice
    to users and should then be called the "practical pot life".
