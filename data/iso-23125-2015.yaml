abstract:
- language: en
  script: Latn
  content: 'ISO 23125:2014 specifies the requirements and/or measures to eliminate
    the hazards or reduce the risks in the following groups of turning machines and
    turning centres, which are designed primarily to shape metal by cutting. Group
    1: Manually controlled turning machines without numerical control. Group 2: Manually
    controlled turning machines with limited numerically controlled capability. Group
    3: Numerically controlled turning machines and turning centres. Group 4: Single-
    or multi-spindle automatic turning machines. It covers the significant hazards
    and applies to ancillary devices (e.g. for workpieces, tools and work clamping
    devices, handling devices and chip handling equipment), which are integral to
    the machine. ISO 23125:2014 also applies to machines which are integrated into
    an automatic production line or turning cell inasmuch as the hazards and risks
    arising are comparable to those of machines working separately.'
