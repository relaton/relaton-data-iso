abstract:
- language: en
  script: Latn
  content: 'ISO/TR 15608:2013 provides a uniform system for the grouping of materials
    for welding purposes. It can also apply to other purposes, such as heat treatment,
    forming and non-destructive testing. ISO/TR 15608:2013 covers grouping systems
    for the following standardized materials: steels; aluminium and its alloys; copper
    and its alloys; nickel and its alloys; titanium and its alloys; zirconium and
    its alloys; cast irons.'
