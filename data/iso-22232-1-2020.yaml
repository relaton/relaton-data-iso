abstract:
- language: en
  script: Latn
  content: This document specifies methods and acceptance criteria within the frequency
    range of 0,5 MHz to 15 MHz, for assessing the electrical performance of digital
    ultrasonic instruments for pulse operation using A-scan display, for manual ultrasonic
    non-destructive testing with single- or dual-transducer probes. This document
    is also applicable for multi-channel instruments. This document can partly be
    applicable to ultrasonic instruments in automated systems, but other tests can
    be needed to ensure satisfactory performance. This document excludes ultrasonic
    instruments for continuous waves. This document also excludes ultrasonic phased
    array instruments, see e.g. ISO 18563-1. If a phased array instrument has dedicated
    connectors for single- or dual-transducer probes this document is applicable for
    these channels.
