abstract:
- language: en
  script: Latn
  content: This document provides definitions, concepts, requirements and guidance
    related to assessing prompt-based text-to-text AI systems that utilize generative
    AI. It covers quality assessment (which encompasses safety) using methodologies
    including red teaming and builds on existing standards such as ISO/IEC 23282 and
    ISO/IEC 42119-7. Additionally, it details methods for analyzing and interpreting
    results, as well as best practices for documentation
