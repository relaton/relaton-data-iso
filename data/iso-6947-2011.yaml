abstract:
- language: en
  script: Latn
  content: ISO 6947:2011 defines welding positions for testing and production, for
    butt and fillet welds, in all product forms. One annex gives examples of the limits
    of the slope of a weld axis and the rotation of the weld face about the weld axis
    for welding positions. Another annex provides a comparison of International, European
    and US designations.
