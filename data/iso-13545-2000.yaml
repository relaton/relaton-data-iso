abstract:
- language: en
  script: Latn
  content: This International Standard specifies a lead sulfate precipitation EDTA
    titrimetric method after acid decomposition for determination of the lead content
    of lead sulfide concentrates. The method is applicable to lead sulfide concentrates
    having lead content in the range 50 % (m/m) to 80%(m/m). The method is not applicable
    to lead concentrates containing more than 1 % (m/m) of barium.
