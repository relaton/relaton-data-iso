abstract:
- language: en
  script: Latn
  content: This document specifies minimum requirements for personal vibration exposure
    meters (PVEM). This document is applicable to instruments designed for measurements
    of whole-body vibration in the context of industrial hygiene applications (according
    to ISO 2631-1, ISO 2631-2 and ISO 2631-4) and/or hand-arm vibration (according
    to ISO 5349-1) together with the associated exposure times. This document provides
    specified design goals and permitted tolerances that define the minimum performance
    capabilities and functional requirements of instruments designed to measure personal
    daily vibration exposure. This document does not apply to instruments designed
    to measure or log exposure times without also performing vibration measurement.
    Instrumentation of this type is described in ISO/TR 19664.
