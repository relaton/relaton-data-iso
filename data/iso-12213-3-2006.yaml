abstract:
- language: en
  script: Latn
  content: 'ISO 12213 specifies methods for the calculation of compression factors
    of natural gases, natural gases containing a synthetic admixture and similar mixtures
    at conditions under which the mixture can exist only as a gas. It is divided into
    three parts: this part, ISO 12213-3:2006, specifies a method for the calculation
    of compression factors when the superior calorific value, relative density and
    carbon dioxide content are known, together with the relevant pressures and temperatures.
    If hydrogen is present, as is often the case for gases with a synthetic admixture,
    the hydrogen content also needs to be known. The method is primarily applicable
    to pipeline quality gases within the ranges of pressure p and temperature T at
    which transmission and distribution operations normally take place, with an uncertainty
    of about +/-0,1 %. For wider-ranging applications the uncertainty of the results
    increases.'
