abstract:
- language: en
  script: Latn
  content: 'This document provides principles and guidelines on ethics and integrity
    for sports organizations to enable integration into policies, procedures and activities.
    These principles have three main pillars: —    ethics and integrity of sports
    organizations; —    ethics and integrity of sports competitions; —    ethics and
    integrity of individuals. This document is applicable to all types of sports organizations,
    including federations, professional leagues, decentralized bodies, sports associations,
    sports clubs and competition organizers (private or otherwise), regardless of
    their size or location.'
