abstract:
- language: en
  script: Latn
  content: This document specifies the pendulum impact test method on miniature Charpy-type
    V-notch test pieces of metallic materials. This document does not cover instrumented
    impact testing of miniature Charpy-type V-notch test pieces, which is specified
    in ISO 14556:2023, Annex D[1]. This document can be applied, by agreement, to
    other impact testing machines, such as drop-weight towers or high-speed servo-hydraulic
    machines. The user should be aware that data obtained from miniature test pieces
    are not directly comparable to those obtained from full-size standard Charpy V-notch
    test pieces[2],[3].
