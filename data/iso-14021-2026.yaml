abstract:
- language: en
  script: Latn
  content: This document establishes principles, specifies requirements and gives
    guidance on self-declared environmental claims about products and their environmental
    statement programmes, including claims that also cover related social and economic
    aspects that are affected by environmental conditions or the environmental performance
    of a product. This document defines selected terms commonly used in self-declared
    environmental claims and provides qualifications for their use, as well as describing
    the documentation and methodologies required for assessing self-declared environmental
    claims. This document is applicable to self-declared environmental claims that
    predominantly take the form of words, but can also be symbols or graphics on product
    or package labels, or appear in product literature, technical bulletins, advertising
    and publicity, including on digital platforms.
