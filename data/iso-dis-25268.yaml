abstract:
- language: en
  script: Latn
  content: This document gives guidelines for Healthcare Organization Management including
    healthcare suppliers and manufacturers of Autonomous Mobile Robots (AMRs) where
    they implement the internal hospital logistics using autonomous mobile robots.
    It includes the key components that should be considered to provide safe and reliable
    internal hospital logistics of pharmaceutics. It covers physical arrangement of
    AMR including medication packaging, delivery chambers, emergency halt method and
    logistics environment of hospitals such as elevator in-and-out sequence, locations
    of the delivery.
