abstract:
- language: en
  script: Latn
  content: 'This standard will provide definitions of critical events/milestones in
    the execution of operations in the maritime mode of transport that are related
    to the tracking of all types of cargo. Within the context of this effort the selection
    of which events will be covered in the deliverables of the Work Item, two main
    selection criteria will be applied: The Event/Milestone • is relevant to track
    and trace of cargo transported in the maritime sector. Events (and information
    contained in those Events) provide value to the Beneficial Cargo Owners (Sellers/Buyers
    of the Goods/Cargo). • enables stakeholders to synchronise or optimize their processes
    and activities based on the information provided in the Event (e.g., Actual Time
    of Arrival at terminal berth). This list is not exhaustive and the Working Group
    may apply other criteria. The standard aims to cover the most relevant events
    for all types of cargo transported via the maritime mode. Where feasible, the
    standard will build on work already done by other standardisation bodies and results
    of efforts by relevant industry associations regarding definitions of events already
    being used in intermodal transport. For example, this ISO effort can also be viewed
    as a further elaboration of the business requirements and approach described in
    the UNECE Business Requirements Specification (BRS) for “Integrated Track and
    Trace for Multi-Modal Transportation”, The UNECE BRS covers all modes of transport
    required to move the cargo from Seller to Buyer, whereas the scope of the proposed
    Work Item is limited to operations in the maritime mode and in ports. Therefore,
    alignment with this UNECE standard would appear to be desirable. Similar reasoning
    may apply for other prior work. The following main principles will be used in
    developing the standard: 1. The scope will be events related to the voyage of
    the ship, its stay in ports and at terminals as well as events related to the
    cargo being handled in these stages of maritime transportation. The main terminating
    events for the scope are gate-in and gate-out at the maritime terminal. Gate-in
    and gate-out events also include transhipments to train, inland waterways, short
    sea feeders and similar. Ship events will be included to the degree that they
    are interesting to the parties that are interested in the cargo. This may include
    the tendering of the notice of readiness as well as various other stages in making
    the ship ready to load or discharge cargo. 2. The cargo related events covered
    in this standard will be aligned with the events already defined in the ISO 28005
    series for various ship related operations. 3. The scope is limited to only those
    events that provide the most relevant information for stakeholders not executing
    those activities. 4. The standard will not cover passengers or other persons on
    the ships. The standard will define: - The most relevant events. - For each event
    an indication of the most relevant information associated with the event, which
    typically includes among others identifiers for event location, party logging
    the event, transport means, transport equipment, etcetera as well as information
    regarding the business context of the event (e.g., cargo discharged/offloaded,
    vessel/barge/truck/rail-vehicle departed). The standard will not define: - The
    concrete data model sued to transmit the event information between stakeholders.
    This will be included in the ISO 28005 series.'
