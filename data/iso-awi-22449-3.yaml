abstract:
- language: en
  script: Latn
  content: This document describes the technical requirements and test methods for
    the simulation test of the open recirculating cooling water system, mainly focusing
    on the recirculating cooling water systems that use reclaimed water as the make-up
    water. This document is applicable to the small-scale dynamic simulation test
    of the metal material (including ferrous and non-ferrous metals) wall heat exchange
    equipment in the open circulating cooling water system, and is also suitable for
    the medium-sized dynamic simulation test and the on-site small-scale dynamic simulation
    test. The performance test of circulating water treatment agent can also be used
    for reference in the project on-site verification and evaluation.
