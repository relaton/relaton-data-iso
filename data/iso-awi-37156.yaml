abstract:
- language: en
  script: Latn
  content: This document gives guidelines on principles and the framework to use for data exchange and sharing for entities with the authority to develop and operate community infrastructure. The guidelines in this document are applicable to communities of any size that are engaged in data exchange and sharing. The specific practices of data exchange and sharing of community infrastructures will depend on the characteristics of each community. NOTE 1 The concept of smartness is addressed in terms of data exchange and sharing, in accordance with sustainable development and resilience of communities as defined in ISO 37100. NOTE 2 Annex A outlines useful case studies of data exchange and sharing for community infrastructure.
