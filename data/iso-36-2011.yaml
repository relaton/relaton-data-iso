abstract:
- language: en
  script: Latn
  content: ISO 36:2011 specifies a method of test for measuring the force required
    to separate, by stripping, two plies of fabric bonded with rubber, or a rubber
    layer and a fabric ply bonded together. The method is applicable when the ply
    surfaces are approximately plane or when they are in the form of a cylinder having
    an internal diameter greater than approximately 50 mm. The method is not applicable
    when the ply surfaces contain sharp bends, angles or other gross irregularities
    which cannot be excluded when cutting out test pieces. The method does not apply
    to coated fabrics or textile conveyor belts.
