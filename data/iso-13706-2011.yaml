abstract:
- language: en
  script: Latn
  content: ISO 13706:2011 gives requirements and recommendations for the design, materials,
    fabrication, inspection, testing and preparation for shipment of air-cooled heat
    exchangers for use in the petroleum, petrochemical and natural gas industries.
    ISO 13706:2011 is applicable to air-cooled heat exchangers with horizontal bundles,
    but the basic concepts can also be applied to other configurations.
