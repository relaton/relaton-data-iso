abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1745:2006 specifies the application module for Signal. The
    following are within the scope of ISO/TS 10303-1745:2006: abstraction of signal
    as categorized according to an ISO or IEC standard; information related to functional
    abstractions of products as commonly specified on data sheets; mechanism to associate
    sets of data that characterize the behaviour of a product with the functional
    hierarchical model and physical geometric model of that product; items within
    the scope of application module Characteristic, ISO/TS 10303-1654.'
