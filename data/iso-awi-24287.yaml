abstract:
- language: en
  script: Latn
  content: This document specifies principles, requirements and test methods for consumer
    liquid laundry detergent capsules (packets) to ensure the performance, quality
    and safety of these products and in addition to help prevent pediatric accidents
    and contribute to the safe marketing of consumer products. The standard covers
    consumer liquid laundry detergent capsules. This includes all unit-dose consumer
    laundry detergent products in capsule form (i.e., that are contained in a water-soluble
    film) and that are entirely or partially liquid. Both single-compartment as well
    as multiple-compartment products are within scope. In case of multiple-compartment
    products, these are within scope as long as at least one of the compartments is
    in the liquid form. This definition of the scope implies that liquid detergent
    capsules for other applications than consumer laundry are excluded. It also implies
    that single dose laundry detergents that are entirely in the powder form (also
    if they are contained in a soluble film) are excluded.
