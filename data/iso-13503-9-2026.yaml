abstract:
- language: en
  script: Latn
  content: This document specifies the performance test procedures for acidizing fluids
    used as completion fluids and materials in oil and gas well operations. NOTE        
    The acidizing fluids mentioned in this document refer to hydrochloric acid, mud
    acid, polymer-based acid acidizing fluids, emulsified acid acidizing fluids, etc.,
    used in acidizing operations of oil and gas wells, including fundamental acid
    solution and acidizing fluid system with additives, such as corrosion inhibitor
    and ferric ion (Fe3+) stabling agent.
