abstract:
- language: en
  script: Latn
  content: This document provides guidelines on the functional and technical requirements
    for autonomous disinfection robots capable of performing disinfection tasks in
    hospital environments. It includes, but is not limited to, the basic requirements
    for the robot’s mobility, maneuvrability, and disinfection equipment. Additionally,
    it addresses the integration of hospital infrastructure with the robot, monitoring
    and remote operation of the robot, and emergency response functions to ensure
    effective disinfection tasks. This document applies to disinfection robots designed
    for use in hospital environments and does not apply to robots used in industrial
    settings or outdoor environments.
