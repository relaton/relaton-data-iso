abstract:
- language: en
  script: Latn
  content: This document establishes the types of lines used in technical drawings
    (e.g. diagrams, plans or maps), their designations and their configurations, as
    well as general rules for the draughting of lines. In addition, this document
    specifies general rules for the representation of leader and reference lines and
    their components as well as for the arrangement of instructions on or at leader
    lines in technical documents. Annexes have been provided for specific information
    on mechanical, construction and shipbuilding technical drawings. For the purposes
    of this document the term "technical drawing" is interpreted in the broadest possible
    sense encompassing the total package of documentation specifying the product (workpiece,
    subassembly, assembly).
