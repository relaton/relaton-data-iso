abstract:
- language: en
  script: Latn
  content: This document specifies the apparatus, materials, specimen preparation,
    procedures, results and reports for comparing the corrosion rates of steel reinforcement
    bars in concrete in simulated marine and coastal environments. This document is
    not applicable to galvanized steel reinforcement. It gives guidelines for material
    selection in corrosion design. In order to illustrate the methodology, Annex A
    provides examples of experimental results.
