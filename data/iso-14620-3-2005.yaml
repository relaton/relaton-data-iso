abstract:
- language: en
  script: Latn
  content: ISO 14620-3:2005 sets out the minimum requirements for Flight Safety Systems,
    including flight termination systems (externally controlled system or on-board
    automatic system), tracking systems, and telemetry data transmitting systems for
    commercial or non commercial launch activities of orbital or sub-orbital, unmanned
    space vehicles. The intent is to minimize the risk of injury or damage to persons,
    property or the environment resulting from the launching of space vehicles. ISO
    14620-3:2005 can be applied by any country, by any international organization,
    whether intergovernmental or not, and by any agency or operator undertaking the
    launching of space vehicles. ISO 14620-3:2005 is intended to be applied by any
    person, organization, entity, operator or launch authority participating in commercial
    or non-commercial launch activities of orbital or sub-orbital, unmanned space
    vehicles unless more restrictive requirements are imposed by the launch site country.
