abstract:
- language: en
  script: Latn
  content: ISO 3673-2:2012 specifies the methods of preparation of test specimens
    and the test methods to be used in determining the properties of crosslinked epoxy
    resins. The properties determined have been selected from the general test methods
    in ISO 10350‑1:2007. Test methods for the determination of the properties of non-crosslinked
    epoxy resins are not included in this part of ISO 3673. NOTE Test methods for
    non-crosslinked epoxy resins are specified in ISO 18280.
