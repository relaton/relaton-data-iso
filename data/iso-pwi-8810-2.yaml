abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the residual
    peroxide in plastic by using gas chromatography-mass spectrometry (GC-MS). The
    document is applicable to peroxide-degraded polypropylene and their products.
    The limit of quantification for DTBP and DBPH is 1 mg/kg. NOTE This method is
    also suitable for the determination of the residual peroxide in other plastics,
    such as polyethylene, polybutene, etc.
