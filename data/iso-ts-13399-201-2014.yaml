abstract:
- language: en
  script: Latn
  content: ISO 13399-201:2014 specifies a concept for the design of cutting items,
    limited to regular inserts, with the usage of the related properties and domains
    of values. It specifies a common way of designing simplified models that contain
    definitions and identification of the design features of regular inserts, with
    a link to the properties used, and definitions and identification of the internal
    structure of the 3D model that represents features and properties of regular inserts.
    Outside the scope of ISO 13399-201:2014 are applications where these standard
    data can be stored or referenced, and the creation and exchange of simplified
    3D models for cutting tools, or for tool items, other cutting items not described,
    adaptive items or for assembly and auxiliary items.
