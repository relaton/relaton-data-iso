abstract:
- language: en
  script: Latn
  content: 'This document gives guidance to organizations on planning for and addressing
    occupational health and safety (OH&S) risks arising from climate change and climate
    change action, including: —     OH&S risks which arise as a result of climate
    change adaptation efforts, including changing ways of working and work processes,
    and infrastructure upgrades; —     OH&S risks arising from climate change mitigation
    actions; —     OH&S opportunities arising from both climate change adaptation
    and mitigation actions. This document is applicable to all organizations taking
    a systematic approach to addressing OH&S risks arising from climate change. It
    is applicable to organizations of all sizes including small and medium-sized enterprises
    (SMEs).'
