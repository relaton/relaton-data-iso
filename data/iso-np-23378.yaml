abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies the general delivery requirements
    for all types of cement clinker except white cement clinker. This is a base document
    for the order or appropriate product which includes: Terms and definitions, classifications
    of clinker, physical requirements, chemical requirements, components, granulometric,
    activity, uniformity, crushability, packaging and package marking, storage, inspection,
    sampling, preparation of test specimen, rejection, transportation, and so on.'
