abstract:
- language: en
  script: Latn
  content: 'This document provides an overview of process assessment and interprets
    the requirements of ISO/IEC 33002 and ISO/IEC 33004 through the provision of guidance
    on the selection and use of assessment models, documented assessment processes,
    and instruments or tools for assessment. Process assessment is applicable in the
    following circumstances: a)       by or on behalf of an organization with the
    objective of understanding the state of its own processes for process improvement;
    b)       by or on behalf of an organization with the objective of determining
    the suitability of its own processes for a particular requirement or class of
    requirements; c)        by or on behalf of one organization with the objective
    of determining the suitability of another organization''s processes for a particular
    contract or class of contracts.'
