abstract:
- language: en
  script: Latn
  content: 'This document establishes a vocabulary of terms, with their definitions,
    applied in the field of rolling bearings and their technology under ISO Technical
    Committee TC 4 management. It includes terms related to all types of rolling bearings
    wherein the principal degree of freedom is continuous rotation about an axis enabled
    by an ordered set of rolling elements between two circular raceways such that
    loads can be transmitted between them in a particular range of radial and/or axial
    directions. Also included are accessories to these products. The following types
    of terms are not included: — terms specified in ISO 76, ISO 281 and ISO 1132‑1;
    — terms which are narrowly applied in only one specialised rolling bearing International
    Standard.'
