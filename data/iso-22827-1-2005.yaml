abstract:
- language: en
  script: Latn
  content: ISO 22827-1:2005 specifies basic requirements and test methods for acceptance
    testing of high-power (average power more than 100 W), lamp-pumped or laser-diode-pumped
    Nd:YAG laser beam welding machines for seam welding with optical fibre delivery
    systems. ISO 22827-1:2005 applies to the beam generating system, the optical delivery
    system and the devices for shielding and assist gases.
