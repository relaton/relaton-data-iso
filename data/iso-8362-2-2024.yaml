abstract:
- language: en
  script: Latn
  content: This document specifies the shape, dimensions, material, performance requirements
    and labelling of closures for injection vials covered by ISO 8362-1 and ISO 8362-4.
    The dimensional requirements are not applicable to barrier-coated closures. Closures
    specified in this document are intended for single use only. NOTE            The
    potency, purity, stability and safety of a medicinal product during its manufacture
    and storage can strongly be affected by the nature and performance of the primary
    packaging.
