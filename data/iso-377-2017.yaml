abstract:
- language: en
  script: Latn
  content: ISO 377:2017 specifies requirements for the identification, location and
    preparation of samples and test pieces intended for mechanical tests on steel
    sections, bars, rod, flat products and tubular products as defined in ISO 6929.
    If agreed in the order, ISO 377:2017 can also apply to other metallic products.
    These samples and test pieces are for use in tests that are carried out in conformity
    with the methods specified in the product or material standard or, in the absence
    of this, in the standard for the test method. Where the requirements of the order
    or product standard differ from those given in ISO 377:2017, then the requirements
    of the order or product standard apply.
