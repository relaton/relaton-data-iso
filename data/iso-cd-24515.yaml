abstract:
- language: en
  script: Latn
  content: 'This document provides a framework and basic rules on the management of
    water supply systems to prevent the occurrence of MPs in drinking water. This
    includes the assessment of the occurrence of MPs at each stage and its impacts,
    and methods of implementing improvement strategies to reduce the occurrence designed
    after the assessment. It covers the entire water supply system from the intakes
    to water distributions, since MPs can occur potentially at every stage in producing
    and supplying drinking water. It also recommends the monitoring frequency and
    methods for assessing the managemental activities to control MPs occurrence at
    each of the water production and supply stages. This document is applicable to:
    a) water utilities, engineers, and enterprises that intend to effectively control
    the occurrence of MPs in municipal water supply systems and make recommendations
    of selecting and optimizing various management strategies to reduce the occurrence
    of MPs and public concerns on them, b) water service providers committed to supply
    the communities with clean and risk-reduced drinking water and to protect public
    health.'
