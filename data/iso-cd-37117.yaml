abstract:
- language: en
  script: Latn
  content: This document provides a framework of sustainable goods and services related
    to harbour cities. It is aligned to ISO 37101. It can be adopted by operators,
    shipping carriers, service providers in harbour cities, and harbour authorities
    aiming to enhance efficiency, effectiveness and resilience of goods and services
    delivery. It can be used to evaluate and improve the quality and sustainability
    of ports and harbour services to meet the evolving needs and challenges. It is
    applicable to various types of harbour cities, regardless of sizes, functions
    or regions, including cities with ports, maritime cities, and seaports.
