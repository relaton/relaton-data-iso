abstract:
- language: en
  script: Latn
  content: This document provides information on the goal, scope, structure, contents
    and background of the different parts of the ISO 20710 series. The purpose of
    the ISO 20710 series is to provide information on active fire protection systems
    according to the design, implementation and maintenance described in ISO 23932-1.
    The ISO 20710 series is linked to the steps of the performance-based fire safety
    engineering design process described in ISO 23932-1. This document is not intended
    as a detailed technical design guide but is intended to provide the guidance necessary
    for use of the ISO 20710 series by professionals who consider the active fire
    protection systems at each step presented in ISO 23932-1.
