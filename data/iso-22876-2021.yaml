abstract:
- language: en
  script: Latn
  content: 'This document establishes the minimum requirements for supplementary charter
    services and experiences offered by a charter provider. It is applicable to any
    individual or organization which offers such additional services. This document
    excludes bareboats that: —    do not have living accommodation; —    are only
    hired as accommodation and are not permitted to leave their mooring/berth. This
    document does not establish the construction requirements for equipment provided.'
