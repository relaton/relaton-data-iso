abstract:
- language: en
  script: Latn
  content: This document specifies a method for the photometric determination of dissolved
    chromium(VI) using manual, (e.g. hand photometry), automated static (e.g. discrete
    analyser system) or automated dynamic [e.g. flow injection analysis (FIA), continuous
    flow analysis (CFA)] or ion chromatography with post-column reaction (IC-PCR)]
    techniques. The method described in this document is applicable for other matrices,
    such as leachates from landfills and raw wastewater, after appropriate method
    validation.
