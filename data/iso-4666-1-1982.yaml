abstract:
- language: en
  script: Latn
  content: 'Gives directions for carrying out measurements which make possible predictions
    regarding the durability of rubbers in finished articles, e.g. tyres, bearings,
    V-belts etc. Due to the wide variations in service conditions, no simple correlation
    between accelerated tests and service performance can be assumed. - Part 2 of
    this standard: rotary flexometer, part 3: compression flexometer.'
