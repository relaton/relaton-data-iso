abstract:
- language: en
  script: Latn
  content: ISO 11343:2003 specifies a dynamic impact wedge method for the determination
    of the cleavage resistance under impact loading of high-strength adhesive bonds
    between two metallic adherends, when tested under specified conditions of preparation
    and testing. This test procedure does not provide design information. The method
    allows a choice of sheet metal substrate corresponding to those materials frequently
    used in industry, e.g. for automotive applications.
