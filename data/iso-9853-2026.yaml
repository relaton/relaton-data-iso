abstract:
- language: en
  script: Latn
  content: This document specifies a test method to determine if a fitting will fail in crushing mode under compression before a predefined percentage deformation of moulded fittings for thermoplastics piping systems and provides recommended percentage deformation for fittings (see Annex A). This document applies to fittings made from unplasticized poly(vinyl chloride) (PVC-U), high-impact poly(vinyl chloride) (PVC-HI), chlorinated poly(vinyl chloride) (PVC-C), polyethylene (PE), polypropylene (PP), acrylonitrile-butadiene-styrene (ABS), poly(vinylidene difluoride) (PVDF), poly(phenyl sulfone) (PPSU) and unplasticized polyamide (PA-U). This document can also be applied to moulded fittings made from other thermoplastics, in which case the test conditions can differ.
