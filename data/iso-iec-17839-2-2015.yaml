abstract:
- language: en
  script: Latn
  content: 'ISO 17839-2:2015 defines the following: - dimensions of a Biometric System-on-Card
    type S1 and type S2; - position and size of the biometric capture device; - minimum
    requirements to a Biometric System-on-Card with respect to - mechanical durability,
    and ? man-machine interface and ergonomics. The standardization of other on-card
    devices such as an electronic display or a keypad is outside the scope of this
    part of ISO/IEC 17839.'
