abstract:
- language: en
  script: Latn
  content: 'ISO 15465:2004 specifies the requirements for the design, manufacture
    and testing of four principal types of stripwound metal hose and hose assemblies,
    of which only one type is for pressure applications. The four are: single overlap,
    unpacked and packed; double overlap, unpacked and packed, the last of these having
    maximum permissible pressures of up to 40 bar. These hoses and hose assemblies
    may be supplied in nominal sizes from DN 6 to DN 500 and may operate at temperatures
    up to 600 °C dependent on materials of construction.'
