abstract:
- language: en
  script: Latn
  content: This proposed standard will define quality measures and associated measurement
    methods that can be used to quantitatively assess the quality of ICT (Information
    and Communication Technologies) systems and products in terms of the characteristics
    and subcharacteristics defined in ISO/IEC 25019. This proposed standard is not
    limited to any specific application area and can be applied to measure the quality
    of ICT systems and products.
