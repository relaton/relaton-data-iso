abstract:
- language: en
  script: Latn
  content: ISO 8692:2012 specifies a method for the determination of the growth inhibition
    of unicellular green algae by substances and mixtures contained in water or by
    waste water. This method is applicable for substances that are easily soluble
    in water. With modifications to this method, as specified in ISO 14442 and ISO
    5667-16, the inhibitory effects of poorly soluble organic and inorganic materials,
    volatile compounds, heavy metals and waste water can be tested. A rapid algal
    growth inhibition screening test for waste water is described in an annex. An
    alternative test procedure with algae from algal beads, with direct measurement
    of algal growth in spectrophotometric cells, is described in an annex.
