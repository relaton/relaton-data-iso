abstract:
- language: en
  script: Latn
  content: This document specifies the quality and safety requirements of Prunus persica
    and Prunus davidiana seed derived from the plant of Prunus persica (L.) Batsch
    and Prunus davidiana (Carr.) Franch.. It is applicable to Prunus persica and Prunus
