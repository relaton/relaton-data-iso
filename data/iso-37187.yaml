abstract:
- language: en
  script: Latn
  content: This document describes the requirements for data framework and functions
    in the modeling process of smart cities. Furthermore, the operation and maintenance
    of the platform are involved. This document applies to the infrastructure and
    management of the city information modeling (CIM) platform and its related applications
    and scenarios, including transportation, communication, energy, buildings, roads,
    and the activities of organizations and people, such as governments, enterprises,
    schools, and families.
