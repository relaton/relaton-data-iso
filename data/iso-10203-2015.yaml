abstract:
- language: en
  script: Latn
  content: ISO 10203:2015 specifies a flame atomic absorption spectrometric method
    for the determination of the mass fraction of calcium in iron ores. This method
    is applicable to mass fractions of calcium between 0,010 % and 8,00 % in natural
    iron ores, iron ore concentrates, and agglomerates, including sinter products.
