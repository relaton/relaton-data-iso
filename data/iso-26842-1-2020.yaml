abstract:
- language: en
  script: Latn
  content: This document gives guidelines to select, by means of delamination-resistance
    tests, adhesive/wood combinations for use in wood products placed in non-severe
    environments, in which the products are not exposed to extreme changes in temperature
    and humidity. This document provides a series of exposure cycles at various temperature
    and humidity values to verify that the adhesive selected, or a product bonded
    with the adhesive, meets the necessary requirements for resistance to delamination.
    This document is intended to help the user not only to select a suitable adhesive,
    but also to evaluate adhesives and adhesively bonded wood products. NOTE When
    actual wood products are tested using this method, the test results might not
    be comparable because the test laboratory do not normally have had adequate control
    over the way the product was assembled. This document is not intended for use
    in the qualification of structural components.
