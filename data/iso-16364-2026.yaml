abstract:
- language: en
  script: Latn
  content: This document specifies standard methods for avoiding galvanic corrosion in the design stage and for determining whether actual corrosion damage was caused by galvanic corrosion. It also specifies guideline for standard methods for suppressing galvanic corrosion. This document also provides guidance for predicting galvanic corrosion in different environments (e.g. in water and in atmospheric and soil environments) by numerical calculation based on polarization data. This document does not establish the grounds for indexes related to safety or the loss of functions of materials in actual use. However, this document can be used to estimate the function maintenance life and safety maintenance life of these materials in advance. The responsibility for using the guideline rests with the reader.
