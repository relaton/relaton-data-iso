abstract:
- language: en
  script: Latn
  content: This document specifies the access to vehicle on-board diagnostics (OBD)
    by describing minimum hardware and software requirements including requirements
    for reprogramming, calibration and configuration after repair works. In addition,
    it provides hardware and software specifications for diagnostic tools. This document
