abstract:
- language: en
  script: Latn
  content: ISO 20088-1:2016 describes a method for determining the resistance to liquid
    cryogenic spillage on cryogenic spillage protection (CSP) systems. It is applicable
    where CSP systems are installed on carbon steel and will be in contact with cryogenic
    fluids. Liquid nitrogen is used as the cryogenic medium since it has a lower boiling
    point than liquid natural gas or liquid oxygen and it is not flammable. Additionally,
    it can be safely used for experiment. Future parts of the standard will cover
    vapour phase and jet exposure conditions. The test laboratory is responsible to
    conduct an appropriate risk assessment according to local regulation in order
    to consider the impact of liquid and gaseous nitrogen exposure to equipment and
    personnel.
