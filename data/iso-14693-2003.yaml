abstract:
- language: en
  script: Latn
  content: 'ISO 14693:2003 provides general principles and specifies requirements
    for design, manufacture and testing of new drilling and well-servicing equipment
    and of replacement primary load-carrying components manufactured subsequent to
    the publication of ISO 14693:2003. ISO 14693:2003 is applicable to the following
    equipment: -- rotary tables; -- rotary bushings; -- rotary slips; -- rotary hoses;
    -- piston mud-pump components; -- drawworks components; -- spiders not capable
    of use as elevators; -- manual tongs; -- safety clamps not used as hoisting devices;
    -- power tongs, including spinning wrenches. Annex A gives a number of standardized
    supplementary requirements which apply only when specified.'
