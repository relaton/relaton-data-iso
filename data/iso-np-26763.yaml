abstract:
- language: en
  script: Latn
  content: 'This document describes the procedure for structural testing of distal
    interface components from prosthetic sockets and clarifies available information
    from ISO 10328:2016 therefore. It includes test description for distal socket
    regions with connections, specifically designed for manufacturing techniques like
    3D-printing. This document does not specify: - the holistic, full system testing
    of prosthetic sockets - the influence of gait or biomechanical analysis on socket
    design - the influence of fitting procedures from prosthetists on socket design'
