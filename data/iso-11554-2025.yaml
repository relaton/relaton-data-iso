abstract:
- language: en
  script: Latn
  content: This document specifies test methods for determining the radiant power
    and radiant energy of continuous wave and pulsed laser beams, as well as their
    temporal characteristics of pulse shape, pulse duration and pulse repetition rate.
    Test and evaluation methods are also given for the radiant power stability of
    cw-lasers, radiant energy stability of pulsed lasers and pulse duration stability.
    The test methods given in this document are used for the testing and characterization
    of lasers.
