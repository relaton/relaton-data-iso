abstract:
- language: en
  script: Latn
  content: ISO 12759:2010 specifies requirements for classification of fan efficiency
    for all fan types driven by motors with an electrical input power range from 0,125
    kW to 500 kW. It is applicable to (bare shaft and driven) fans, as well as fans
    integrated into products. Fans integrated into products are measured as stand-alone
    fans. It is not applicable to fans for smoke and emergency smoke extraction; fans
    for industrial processes; fans for automotive application, trains, planes, etc.;
    fans for potentially explosive atmospheres; box fans, powered roof ventilators
    and air curtains or jet fans for use in car parks and tunnel ventilation.
