abstract:
- language: en
  script: Latn
  content: ISO 9168:2009 is applicable for achieving reliable interchangeability between
    hoses from dental units and dental handpieces. ISO 9168:2009 specifies four types
    of hose connector for use between air driven dental handpieces and the flexible
    hoses of the dental unit which supply the handpieces with water, air and light,
    and provide for exhaust.
