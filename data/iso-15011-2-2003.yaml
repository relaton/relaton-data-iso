abstract:
- language: en
  script: Latn
  content: 'ISO 15011-2:2003 provides guidance on the determination of emission rates
    of gases generated by arc welding using a fume box technique. It describes the
    test principle, gives a possible fume box arrangement and considers methods for
    sampling and analysis. The following gases that can be produced during arc welding
    are covered: - carbon monoxide (CO); - carbon dioxide (CO2); - nitrogen oxide
    (NO); - nitrogen dioxide (NO2). The fume box described in this International Standard
    may also be used for the determination of organic gases produced in the arc welding
    of coated metals, e.g. primed, painted or plastic coated material.'
