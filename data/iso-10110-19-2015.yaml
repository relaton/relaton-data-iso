abstract:
- language: en
  script: Latn
  content: ISO 10110-19:2015 specifies the presentation of design and functional requirements
    for optical elements and systems in technical drawings used for manufacture and
    inspection. ISO 10110-19:2015 provides a general method of describing surfaces
    and components. This part of ISO 10110 applies to continuous and discontinuous
    surfaces. It does not apply to diffractive surfaces, Fresnel surfaces, ophthalmic
    glasses, and micro-optical surfaces. ISO 10110-19:2015 applies to any general
    surface or component, even including spherical or rotationally symmetric surfaces
    if it is necessary, i.e. when NURBS, splines, point clouds, etc. are used. ISO
    10110-19:2015 does not specify the method by which compliance with the specifications
    is to be tested.
