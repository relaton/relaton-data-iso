abstract:
- language: en
  script: Latn
  content: This document specifies dimensions and safety requirements for manually
    operated and power-operated coupling devices used for assembling inland navigation
    vessels as push tows or for coupling vessels alongside by means of rope connections.
    The coupling device secures the stable positioning of the coupled vessels. Safety
    requirements to protect operators from accidents during the creation, operation,
    and separation of the rope connections of push tows and vessels coupled alongside
    are specified in this document. It also gives rules for designation and testing.
