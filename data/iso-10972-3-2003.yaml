abstract:
- language: en
  script: Latn
  content: ISO 10972-3:2003 establishes requirements which apply specifically to the
    mechanisms and related components of tower cranes, in addition to the general
    requirements given in ISO 10972-1. These additional requirements concern the arrangement,
    features and characteristics of the crane mechanisms, and the minimum requirements
    for certain mechanism components. Rules for the proof of competence calculation
    regarding different limit states (yield strength, fatigue, wear) are excluded
    from ISO 10972-3:2003. ISO 10972-3:2003 is not applicable to the climbing mechanisms
    and related components used on tower cranes, nor to the climbing frame.
