abstract:
- language: en
  script: Latn
  content: This document specifies general test methods for rotary instruments used
    in dentistry. These test methods are used for measuring the dimensional characteristics,
    neck strength and surface roughness of rotary instruments, such as burs, cutters,
    polishers, grinding instruments and rotary instruments used for oral surgery such
    as drills and countersinks. Specific tests are specified in the respective instrument
    standards, if available. This document does not specify test methods for materials
    used for rotary instruments. NOTE       For materials used for rotary instruments,
    see ISO 21850-1 and respective instrument standards. This document is not applicable
    to endodontic instruments. For endodontic instruments, see ISO 3630-1.
