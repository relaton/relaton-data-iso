abstract:
- language: en
  script: Latn
  content: 'This document defines the minimum requirements for safety in poles for
    alpine and touring skiing. It specifies test methods to check conformity with
    these requirements. It is applicable to ski-poles for alpine and touring skiing
    in the following ranges of total length, lT: — group A, lT ≥ 1 050 mm (adults''
    poles); — group B, 1 050 mm > lT ≥ 700 mm (junior poles); — group C, lT < 700
    mm (children''s poles).'
