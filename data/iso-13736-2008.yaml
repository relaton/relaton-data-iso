abstract:
- language: en
  script: Latn
  content: ISO 13736:2008 specifies a method for the determination of the closed-cup
    flash point of combustible liquids having flash points between - 30,0 °C and 70,0
    °C, inclusive. However, the precision given for this method is only valid for
    flash points in the range - 5,0 °C to 66,5 °C. ISO 13736:2008 is not applicable
    to water-borne paints, which can, however, be tested using ISO 3679.
