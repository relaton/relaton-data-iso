abstract:
- language: en
  script: Latn
  content: ISO/TS 24530-1:2006 establishes the top-level "containers" for TPEG messages
    in XML and the common data types that are used by tpegML applications (e.g. tpeg-ptiML).
    Inherently, tpegML is designed to "map" the TPEG binary (ISO/TS 18234 series),
    however, additional tags are provided to create a message and message set structure
    to facilitate internet file delivery.
