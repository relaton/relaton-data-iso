abstract:
- language: en
  script: Latn
  content: 'ISO 14253-1:2017 establishes the rules for verifying the conformity or
    nonconformity with a given tolerance for a characteristic of a workpiece (or a
    population of workpieces) or with a given maximum permissible errors for a metrological
    characteristic of a measuring equipment, including when the measured value falls
    close to the specification limits, taking measurement uncertainty into account.
    ISO 14253-1:2017 applies to specifications defined in general GPS standards (see
    ISO 14638), i.e. standards prepared by ISO/TC 213, including: - workpiece specifications
    and population specifications (usually given as an upper specification limit or
    a lower specification limit or both); - measuring equipment specifications (usually
    given as maximum permissible errors). ISO 14253-1:2017 only applies for characteristics
    and maximum permissible errors expressed as quantity values.'
