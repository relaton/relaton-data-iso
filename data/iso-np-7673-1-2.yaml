abstract:
- language: en
  script: Latn
  content: 'This document defines concepts to enable the exchange at scale of agricultural
    observations and field operations data by defining a set of fundamental data classes
    that are reusable across these domains. This includes: — the fundamental (“core”)
    documents that represent different stages of a data-driven, principled approach
    to field operations management, from collecting input data to making recommendations,
    to creating a work order, to logging the results of the operation in a work record;
    — a set of classes to support the unambiguous identification of resources; — a
    set of classes to unambiguously represent time, space, and geopolitical-context-dependent
    data; — a basic set of reference data classes; — a basic set of setup/master data
    classes such as farms, fields, and people; — a simple framework for managing configuration
    data; — harmonized terminology. This document provides an industry-wide data model
    that can be used to implement unambiguous data exchange by actors in the agrifood
    industry.'
