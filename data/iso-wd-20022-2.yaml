abstract:
- language: en
  script: Latn
  content: 'ISO 20022-2:2013 defines the UML Profile for ISO 20022. In essence, it
    defines how to use UML to create models that conform to the ISO 20022 Metamodel,
    which is defined in ISO 20022-1:2013. In so doing, it defines a UML-based concrete
    syntax for the Metamodel. It does not preclude the specification of additional
    concrete syntaxes for the Metamodel, such as a textual concrete syntax. The Profile
    defines how to represent in UML each of the Metamodel''s Scope Level Elements
    (Level 1), Business Level Elements (Level 2) and Message Level Elements (Level
    3), as well as Metamodel Elements that are scoped across the levels. Therefore,
    the Profile covers all of the Metamodel''s Packages, except for the following:
    · ISO20022::Metamodel::ConceptualLevel::MessageTransport · ISO20022::Metamodel::LogicalLevel::Reversing
    · ISO20022::Metamodel::LogicalToPhysicalTransformation · ISO20022::Metamodel::PhysicalLevel
    The Profile also covers the ISO20022::TypeLibrary Package, upon which the Metamodel
    has some dependencies. ISO 20022-2:2013 is only applicable when UML is used.'
