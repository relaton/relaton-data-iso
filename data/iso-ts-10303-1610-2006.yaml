abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1610:2006 specifies the application module for AP210 assembly
    technology constraints. ISO/TS 10303-1610:2006 deals with the representation of
    assembly technology constraints. This data includes all information provided to
    the design team by assembly service providers from which may be derived constraints
    on which packages may be selected, mounting arrangements to be specified, permitted
    mounting areas, clearances, etc. Configuration management information and design
    change management information is provided. This data includes at least one geometric
    representation. The following is within the scope of ISO/TS 10303-1610:2006: process
    based constraint description.'
