abstract:
- language: en
  script: Latn
  content: 'This document provides the basic information and the requirements related
    to the International Terrestrial Reference System (ITRS), its definition, its
    realizations and how to access and use these realizations. This document: — describes
    ITRS following the definitions and terminology adopted by the International Union
    of Geodesy and Geophysics (IUGG), the International Association of Geodesy (IAG)
    and the International Astronomical Union (IAU); — describes different categories
    of ITRS realizations: its primary realization, labelled the International Terrestrial
    Reference Frame (ITRF), other existing realizations of reference systems that
    are mathematically derived from the ITRS, and realizations that are aligned to
    the ITRF, such as GNSS-specific reference frames; — categorizes procedures for
    realizing the ITRS.'
