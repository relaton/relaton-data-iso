abstract:
- language: en
  script: Latn
  content: This standard specifies a method for evaluating the stability of FBs using
    a B-mode ultrasound imaging device. The method employs the duration of B-mode
    image grayscale maintenance as the evaluation metric, defined by continuously
    observing the imaging effect of FBs during B-mode ultrasound examination. This
    method applies to FBs, including free fine bubbles (FFBs) and shelled fine bubbles
    (SFBs) encapsulated by polymer or lipid materials. It enables the direct and reliable
    assessment of FB stability.
