abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory method for the determination of total
    organic carbon (TOC) in surface water, ground water, and wastewater that is oxidized
    and measured in manufactured and commercially available sealed-tube tests. It
    is applicable to both dissolved and suspended particulate organic carbon. The
    method is not applicable for the determination of volatile, or purgable, organic
    carbon under the conditions described in this standard. The method allows for
    determination of TOC ≥ 2 mg/l. The lower and upper working ranges are restricted
    by instrument and procedure-dependent conditions (for example sample volume, chemistry
    concentration, path length) and can be adjusted for a wider range (both lower
    and upper levels).
