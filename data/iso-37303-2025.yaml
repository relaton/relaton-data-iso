abstract:
- language: en
  script: Latn
  content: This document provides guidance for the determination and development of
    competencies necessary to achieve an organization's compliance management system
    objectives. It provides guidance for establishing the adequate level of competencies
    of certain internal functions and third parties. This document is applicable to
    all organizations regardless of the type, size and nature of the activity, as
    well as whether the organization is from the public, private or non-profit sector.
    This document does not add to, change or otherwise modify requirements for compliance
    management system or any other standards.
