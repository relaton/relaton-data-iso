abstract:
- language: en
  script: Latn
  content: This document describes the concept of AI task as applied to natural language.
    It proposes a landscaping of the AI tasks related to the analysis or generation
    of natural language, as well as other languagerelated functionalities that are
    associated to those AI systems. It identifies existing and competing terminologies,
    co-existing variants of the same tasks and functionalities, and how specific tasks
    can be affected by language diversity in terms of their role or their challenges.
    This includes all languages, dialects and variants, whether official or not. The
    relations among tasks or functionalities, and their interactions within pipelines,
    are discussed and illustrated. In addition, the document provides references to
    existing standards and published guidelines associated to those tasks and functionalities, highlighting
    their differences in case of competing standards.
