abstract:
- language: en
  script: Latn
  content: ISO 22609:2004 describes a laboratory test method for measuring the resistance
    of medical face masks to penetration by a splash of synthetic blood. ISO 22609:2004
    primarily addresses the performance of materials or certain material constructions
    used in medical face masks. The test method does not address the performance of
    the medical face mask's design, construction, interfaces or other factors which
    may affect the overall protection offered by the medical face mask and its operation
    (such as filtration efficiency and pressure drop). ISO 22609:2004 does not evaluate
    the performance of medical face masks as a protection against contamination via
    airborne exposure pathways or in the prevention of the penetration of aerosolized
    body fluids deposited on the medical face mask.
