abstract:
- language: en
  script: Latn
  content: This technical specification establishes the basic terms and their definitions
    in the field of systematization and use of residue and waste wooden materials.
    This technical specification provides the terminology and definitions for timber
    residues and post-consumer wood. In this International standard, the emphasis
    is given to general terms relating to raw and processed materials originating
    from logging and wood processing industry and non-fuel applications of woody biomass.
    Specific terminology relating to the definition of wood residues different origins
    is in the scope of ISO/TC 238, “Solid Biofuels” and Project Committee ISO/PC 287,
    “Chain of custody of wood and wood-based products”. The technical specification
    applies to secondary wood resources, used wood, logging residues and wood residues.
    The technical specification also applies to waste - wood, which cannot use more
    (from which you want to get rid of). This technical specification may be used
    as a terminological base for the labelling and identification of wood residue.
    The terms and definitions set forth in this technical specification are intended
    for use in technical and design documentation as well as scientific, technical,
    educational and reference literature in relation to the processes involving wood
    residues production and consumption as secondary material and energy resources
    with protection of the environment in the course of economic activity in the treatment
    of secondary wood resources.
