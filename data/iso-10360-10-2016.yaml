abstract:
- language: en
  script: Latn
  content: ISO 10360-10:2016 specifies the acceptance tests for verifying the performance
    of a laser tracker by measuring calibrated test lengths, test spheres and flats
    according to the specifications of the manufacturer. It also specifies the reverification
    tests that enable the user to periodically reverify the performance of the laser
    tracker. The acceptance and reverification tests given in this part of ISO 10360
    are applicable only to laser trackers utilizing a retro-reflector as a probing
    system. Laser trackers that use interferometry (IFM), absolute distance meter
    (ADM) measurement, or both can be verified using this part of ISO 10360. This
    part of ISO 10360 can also be used to specify and verify the relevant performance
    tests of other spherical coordinate measurement systems that use cooperative targets,
    such as "laser radar" systems. NOTE Systems, such as laser radar systems, which
    do not track the target, will not be tested for probing performance. ISO 10360-10:2016
    does not explicitly apply to measuring systems that do not use a spherical coordinate
    system (i.e. two orthogonal rotary axes having a common intersection point with
    a third linear axis in the radial direction). However, the parties can apply this
    part of ISO 10360 to such systems by mutual agreement. ISO 10360-10:2016 specifies
    - performance requirements that can be assigned by the manufacturer or the user
    of the laser tracker, - the manner of execution of the acceptance and reverification
    tests to demonstrate the stated requirements, - rules for proving conformance,
    and - applications for which the acceptance and reverification tests can be used.
