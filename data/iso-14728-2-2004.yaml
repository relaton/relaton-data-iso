abstract:
- language: en
  script: Latn
  content: ISO 14728-2:2004 specifies methods of calculating the basic static load
    rating, static equivalent load and static safety factor for linear motion rolling
    bearings manufactured from contemporary, commonly used, high quality, hardened
    bearing steel in accordance with good manufacturing practice and basically of
    conventional design as regards the shape of the rolling contact surfaces. ISO
    14728-2:2004 is not applicable to designs where the rolling elements operate directly
    on the slide surface of the machine equipment, unless that surface is equivalent
    in all respects to the raceway of the linear motion rolling bearing component
    it replaces.
