abstract:
- language: en
  script: Latn
  content: ISO 37120:2014 defines and establishes methodologies for a set of indicators
    to steer and measure the performance of city services and quality of life. It
    follows the principles set out and can be used in conjunction with ISO 37101:?,
    Sustainable development in communities ? Management systems ? General principles
    and requirements, when published, and other strategic frameworks. ISO 37120:2014
    is applicable to any city, municipality or local government that undertakes to
    measure its performance in a comparable and verifiable manner, irrespective of
    size and location.
