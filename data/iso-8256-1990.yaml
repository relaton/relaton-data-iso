abstract:
- language: en
  script: Latn
  content: Specifies two methods for the determination of the energy required to rupture
    test specimens of plastics under a specified tensile-impact velocity. The tests
    can be described as tensile tests at comparatively high rates of straining. These
    methods are applicable to specimens prepared from moulding materials or to specimens
    taken from finished or semi-finished products. These methods are not suitable
    for use as a source of data for design calculations on components.
