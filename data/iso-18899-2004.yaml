abstract:
- language: en
  script: Latn
  content: ISO 18899:2004 outlines the principles of calibration of rubber test equipment
    and gives guidance on the general requirements for ensuring measurement traceability,
    establishing calibration intervals and estimating measurement uncertainty. Methods
