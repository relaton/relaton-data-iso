abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 15414:2006 provides: a language (the enterprise language) comprising
    concepts, structures, and rules for developing, representing, and reasoning about
    a specification of an Open Distributed Processing (ODP) system from the enterprise
    viewpoint (as defined in ISO/IEC 10746-3); andrules which establish correspondences
    between the enterprise language and the other viewpoint languages (defined in
    ISO/IEC 10746-3) to ensure the overall consistency of a specification.'
