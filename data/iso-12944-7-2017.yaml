abstract:
- language: en
  script: Latn
  content: ISO 12944-7:2017 deals with the execution and supervision of paint work
    on steel structures in the workshop or on site. ISO 12944-7:2017 does not apply
    to - the preparation of surfaces to be painted (see ISO 12944‑4) and the supervision
    of such work, - the application of metallic coatings, and - pre-treatment methods,
    such as phosphating and chromating, and paint application methods, such as dipping,
    powder coating or coil coating.
