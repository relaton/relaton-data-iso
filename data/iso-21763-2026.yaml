abstract:
- language: en
  script: Latn
  content: 'This document specifies guidelines for smart manufacturing technologies applicable to smart plants in the iron and steel industry, together with the basic requirements for these technologies as defined in the application guidelines. This document covers three dimensions related to the steel production process: smart production process design, smart equipment, and smart production. This document provides an overview of the potential applications of smart manufacturing technology in these scenarios, as well as the specific technical requirements it needs to meet. This document provides reference guidelines for the iron and steel industry to formulate smart factory upgrading plans to improve productivity and product quality. It is intended for use by iron and steel manufacturing enterprises, smart manufacturing technology vendors, and relevant public sector organizations, and is applicable to steel plants regardless of manufacturing process route, equipment configuration, plant size, geographic location, or product type. This document is not intended to be used for any form of evaluation or grading of steel plants or companies.'
