abstract:
- language: en
  script: Latn
  content: ISO 19011:2011 provides guidance on auditing management systems, including
    the principles of auditing, managing an audit programme and conducting management
    system audits, as well as guidance on the evaluation of competence of individuals
    involved in the audit process, including the person managing the audit programme,
    auditors and audit teams. ISO 19011:2011 is applicable to all organizations that
    need to conduct internal or external audits of management systems or manage an
    audit programme. The application of ISO 19011:2011 to other types of audits is
    possible, provided that special consideration is given to the specific competence
    needed.
