abstract:
- language: en
  script: Latn
  content: This document specifies viewing conditions for images on both reflective
    and transmissive media, such as prints (both photographic and photomechanical)
    and transparencies. This document applies to —     critical evaluation of and
    comparison between transparencies, backlighted signs, reflection photographic
    or photomechanical prints and/or a reference object or image, —     appraisal
    of the tone reproduction and colourfulness of prints and transparencies at illumination
    levels similar to those for practical use, including routine inspection, and —    
    critical appraisal of transparencies which are viewed by projection, for comparison
    with prints, objects, or other reproductions. This document is not applicable
    to soft-proofing displays, for paper manufacture, and other applications outside
    of graphic technology and photography.
