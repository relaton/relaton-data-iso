abstract:
- language: en
  script: Latn
  content: 'Cancels and replaces the first edition (1985). Specifies three methods
    for the examination of colour: a method for the examination of apparent colour
    by visually observing a water sample in a bottle; a method for the determination
    of the true colour of a water sample using optical apparatus; a method for the
    determination of the colour by visual comparison with hexachloroplatinate standard
    solutions. Under certain circumstances, strongly coloured water samples need to
    be diluted before examination or determination.'
