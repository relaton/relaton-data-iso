abstract:
- language: en
  script: Latn
  content: This document specifies the quality and safety requirements for the Atractylodis
    rhizoma that are derived from the rhizome of Atractylodes lancea (Thunb.) DC.
    And Atractylodes chinensis (DC.) Koidz. This document applies to Atractylodis
    rhizoma which is sold and used as natural medicines in international trade, including
    Chinese materia medica (whole medicinal materials) and decoction pieces derived
    from these plants.
