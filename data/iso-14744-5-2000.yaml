abstract:
- language: en
  script: Latn
  content: This standard is intended for use when the run-out accuracy of the moving
    parts of electron beam welding machines complying with EN ISO 14744-1 is to be
    measured in connection with an acceptance inspection. It provides information
    on the procedure and apparatus to be used for making the measurements. Given the
    great variety of electron beam welding machines, the scope of measurements required
    for acceptance inspection purposes should be specified separately for the machine
    concerned. Run-out accuracy as defined here is a systematic error and thus counts
    as one of the parameters by which the performance of a machine tool can be characterized.
    Other factors influencing performance (e.g. dynamic forces, vacuum level, positioning
    accuracy of CNC machines) and methods of statistical evaluation are not covered
    in this standard. Electron beam welding involves movement of the workpiece and/or
    of the electron gun. Successful welding presupposes that this movement is effected
    by the devices concerned (e.g. work table and rotating fixture) with a given degree
    of accuracy. The purpose of the measurement is thus to check whether and to what
    extent the required run-out accuracy is maintained.
