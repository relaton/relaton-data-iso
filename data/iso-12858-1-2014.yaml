abstract:
- language: en
  script: Latn
  content: ISO 12858-1:2014 specifies the most important requirements of Invar levelling
    staffs used in geodesy and industry for precise measurement of heights in combination
    with either an optical-mechanical level equipped with a parallel plate micrometre,
    or a digital level of comparable precision. It is applicable to classical staffs
    with graduation lines and numbering and staffs used in digital levelling with
    code patterns. ISO 12858-1:2014 is not applicable to the detailed design and construction
    of Invar levelling staffs (e.g. materials, handles, fixing points for the struts,
    fixing of the Invar strip and of the circular level), which may be selected by
    the manufacturer as appropriate.
