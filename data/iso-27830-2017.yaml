abstract:
- language: en
  script: Latn
  content: ISO 27830:2017 specifies the technical requirements of metallic and other
    inorganic coatings in order to develop consistent technical standards and establishes
    a standard format for designating the coatings. It applies to International Standards
    for electrodeposited, autocatalytic and vapour-deposited coatings. Detailed technical
    requirements for individual coatings are not given in this document, but can be
    found in the International Standards listed in the Bibliography. ISO 27830:2017
    does not apply to thermally sprayed and porcelain enamel coatings.
