abstract:
- language: en
  script: Latn
  content: This document specifies requirements for single-use sharps containers intended
    to hold potentially hazardous sharps medical waste with or without sharps protection
    features, e.g. scalpel blades, trocars, hypodermic needles and syringes. It is
    applicable to single-use sharps containers that are supplied complete by the manufacturer
    and to those that are supplied as components intended to be assembled by the user.
    It is not applicable to reusable sharps containers or to the outer containers
    used in the transportation of filled single-use sharps containers.
