abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies two accelerated corrosion test procedures,
    Methods A and B, for the evaluation of corrosion behaviour of surface-treated
    metals and their alloys with and without paint on them in atmospheric environments.
    It also specifies the apparatus used. The two tests involve salt deposition and
    dry/wet conditions at a constant absolute humidity. Method A applies to: metals
    and their alloys (including corrosion-resistance alloys) Method B applies to:
    metals and their alloys metals and their alloys with coatings [including metallic
    coatings (anodic or cathodic), organic coatings, and conversion coatings]'
