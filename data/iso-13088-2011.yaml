abstract:
- language: en
  script: Latn
  content: ISO 13088:2011 specifies the minimum requirements for the filling conditions
    and filling inspection of acetylene cylinder bundles. It applies both to both
    bundles which are filled while the cylinders are assembled in the bundle and to
    bundles of which the cylinders are filled as individual cylinders and are assembled
    into a bundle after filling. It does not apply to bundles containing solvent-free
    acetylene cylinders. ISO 13088:2011 is not applicable to individual acetylene
    cylinders that are not intended to be assembled into a bundle (see ISO 11372).
