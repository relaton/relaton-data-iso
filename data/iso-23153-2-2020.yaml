abstract:
- language: en
  script: Latn
  content: This document specifies the methods of preparation of test specimens and
    the test methods to be used in determining the properties of polyetheretherketone
    (PEEK) moulding and extrusion materials. Requirements for handling test material
    and for conditioning both the test material before moulding and the specimens
    before testing are given. Procedures and conditions for the preparation of test
    specimens and procedures for measuring properties of the materials from which
    these specimens are made are also given. Properties and test methods that are
    suitable and necessary to characterize PEEK moulding and extrusion materials are
    listed. In order to obtain reproducible and comparable test results, the methods
    of preparation and conditioning, the specimen dimensions and the test procedures
    specified herein are used. Values determined will not necessarily be identical
    to those obtained using specimens of different dimensions or prepared using different
    procedures.
