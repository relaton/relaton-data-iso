abstract:
- language: en
  script: Latn
  content: This document specifies, by reference to the relevant parts of ISO 230,
    several families of tests for machining centres with horizontal or vertical spindle
    or with universal heads of different types, standing alone, or integrated in flexible
    manufacturing systems. This document also establishes the tolerances or maximum
    acceptable values for the test results corresponding to general purpose and normal
    accuracy machining centres. This document is also applicable, totally or partially,
    to numerically controlled milling and boring machines, when their configuration,
    components, and movements are compatible with the tests described herein. This
    document specifies standard test pieces with reference to ISO 230-1, cutting tests
    under finishing conditions. It also specifies the characteristics and dimensions
    of the test pieces themselves. This document is intended to supply minimum requirements
    for assessing the cutting accuracy of the machining centres with 3 to 5 simultaneous
    machining axes. Annex A introduces a freeform test piece for five-axis machining
    centres. This machining test is applied to machining centres using five-axis flank
    milling of freeform surfaces.
