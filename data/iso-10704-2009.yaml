abstract:
- language: en
  script: Latn
  content: ISO 10704:2009 specifies a method for the determination of gross alpha
    and gross beta activity in non‑saline waters for alpha- and beta‑emitting radionuclides.
    The method is applicable to raw and potable waters containing a small quantity
    of dissolved matter. It can, after adaptation, apply to other kind of waters.
    The range of application depends upon the amount of dissolved material in the
    water and on the performance characteristics of the measurement equipment (background
    count rate and counting efficiency).
