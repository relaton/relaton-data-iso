abstract:
- language: en
  script: Latn
  content: ISO 10241-2:2012 addresses the introduction of standardized terminological
    entries into other cultural and linguistic environments, and in particular the
    adoption of internationally standardized terminological entries by regional and
    national standardizing bodies. It establishes principles and guidelines for dealing
    with the key issues to be considered in this process. It also provides examples
    of, and solutions to, problems that occur when the adopting standardizing body
    adopts internationally standardized terminological entries, aligns the concept
    systems of the adopting standardizing body with internationally standardized concept
    systems, and prepares standardized terminological entries as additions or supplements
    to internationally standardized terminological entries.
