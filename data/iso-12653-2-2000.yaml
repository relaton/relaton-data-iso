abstract:
- language: en
  script: Latn
  content: This part of ISO 12653 specifies test methods for evaluating the consistency
    of the output quality over time from the black-and-white reflection scanning of
    office documents using the test target specified in ISO 12653-1 and other targets.
    It is applicable to assessing the output quality of black-and-white scanners used
    for black-and-white or colour office documents, with or without half-tone or colour.
    It does not apply to colour scanners or scanners used for the scanning of transparent
    or translucent documents.
