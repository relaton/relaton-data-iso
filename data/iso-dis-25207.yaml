abstract:
- language: en
  script: Latn
  content: This standard specifies the general requirements of a comprehensive optoelectronic
    connector in the aerospace field, including signal type, materials, design and
    structure, quality assessment procedures and other general requirements, test
    conditions, test methods, test results assessment and other test requirements.
    This standard is applicable to the aerospace field, aircraft, rockets, satellites
    and other aircraft and spacecraft internal equipment terminals, internal printed
    panel transmission power transmission power and photoelectric signals. Although
    this standard is mainly used for such applications, it can also be used in other
    fields if necessary.
