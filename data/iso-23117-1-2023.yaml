abstract:
- language: en
  script: Latn
  content: This document, when used together with ISO 16119-1, specifies the requirements
    and the means for verification of the design and performance of unmanned aerial
    spraying systems (UASS) mounted on unmanned aircraft systems (UAS) for application
    of plant protection products (PPPs) in agriculture, forestry, turf and amenity
    areas, with regard to minimising the potential risk of environmental contamination
    during use, including misuse foreseeable by the UASS manufacturer. The requirements
    of this document take precedence over those of ISO 16119-1. The ISO 23117 series
    does not cover human safety aspects of UASS’s or safety aspects concerning UAS’s,
    remote pilots or bystanders. This document is not applicable to UASS mounted on
    UASs with a maximum take-off mass greater than 150 kg. This document is not applicable
    to UASSs manufactured before the date of its publication.
