abstract:
- language: en
  script: Latn
  content: ISO 10681-1:2010 defines common requirements for vehicle systems implemented
    on a FlexRay communication link, as specified in the FlexRay Communications Systems
    Protocol Specification. It also describes general use-cases and communication
    scenarios that are covered by FlexRay transport and network layer. Each use case
    drives specific communication capabilities and requirements of the vehicle communication
    interface.
