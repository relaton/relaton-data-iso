abstract:
- language: en
  script: Latn
  content: 'This document provides an overview of the standards developed in the ISO 25500
    series for supply chain interoperability and integration. This document: states
    the subject matter of the ISO 25500 series as a whole; establishes the principles
    of supply chain interoperability and integration; describes the path to supply
    chain interoperability and integration; describes the structure of the supply
    chain interoperability and integration series; establishes the relationship of
    the supply chain interoperability and integration series with other International
    Standards. The following is outside the scope of this document: the interoperability
    and integration of the physical objects or services exchanged.'
