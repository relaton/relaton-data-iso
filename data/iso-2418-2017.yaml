abstract:
- language: en
  script: Latn
  content: ISO 2418:2017 specifies the location of a laboratory sample within a piece
    of leather and the method of labelling and marking the laboratory samples for
    future identification. It is applicable to all types of leather derived from mammals
    irrespective of the tanning used. It is not applicable to leathers derived from
    birds, fish, reptiles or furs.
