abstract:
- language: en
  script: Latn
  content: 'This document specifies the general service framework and components for
    operating automated driving buses (ADBs) in public transport networks. It includes:
    a)       a description of the ADB service components which consist of ADBs, the
    monitoring and control (MC) centre, Internet of Things (IoT) infrastructure, the
    smart bus stations and the passengers. b)       a description of the use cases
    for the ADB service operation.'
