abstract:
- language: en
  script: Latn
  content: This document describes in vitro methods of measurement of the sizing parameters
    for surgical valves (referring to mechanical and stented bioprosthetic valves
    only here and hereafter). It represents a consensus reached among manufacturers,
    independent bioengineers and clinicians, and is underpinned by interlaboratory
    studies. This document relates to surgical heart valve prostheses and is intended
    to be used in conjunction with ISO 5840-1:2021 and ISO 5840-2:2021. Where noted,
    the requirements of this document clarify certain requirements of ISO 5840-1 and/or
    ISO 5840-2. Specific methodologies are included for flexible leaflet (bioprosthetic)
    and rigid (mechanical) valves. Sutureless valves, stentless valves and valved
    conduits are not included.
