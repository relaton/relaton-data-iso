abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of sulfur in non-oxidic
    ceramic raw materials and ceramic materials, such as silicon carbides, silicon
    nitrides, graphites, carbon blacks, cokes, carbon powders. If demonstrated by
    the recovery rate, this document can also be applied for other non-metallic powdered
    and granular materials, e.g. silicon dioxide. This document is applicable for
    materials with mass fractions of sulfur from 0,005 % to 2 %. This document can
    also be applied for materials with higher mass fractions of sulfur after verification
    of the particular case.
