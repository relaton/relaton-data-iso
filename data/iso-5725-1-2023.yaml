abstract:
- language: en
  script: Latn
  content: This document —     introduces conditions, constraints and resources necessary
    to evaluate a measurement method or a result; —     defines an organizational
    scheme for the acquisition of trueness and precision data by study; —     provides
    the necessary definitions, statistical model and principles for ISO 5725 (all
    parts). —     is not applicable to proficiency testing or production of the reference
    item that has their own standards (ISO 13528, respectively and ISO Guide 35).
    This document is concerned exclusively with measurement methods which yield results
    on a continuous scale and give a single value as the test result, although this
    single value may be the outcome of a calculation from a set of observations. It
    defines values which describe, in quantitative terms, the ability of a measurement
    method to give a true result (trueness) or to replicate a given result (precision).
    Thus, there is an implication that exactly the identical item is being measured,
    in exactly the same way, and that the measurement process is under control. This
    document may be applied to a very wide range of test items, including gas, liquids,
    powders and solid objects, manufactured or naturally occurring, provided that
    due consideration is given to any heterogeneity of the test item. This document
    does not include methods of calculation that are described in the other parts.
