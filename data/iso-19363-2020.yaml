abstract:
- language: en
  script: Latn
  content: 'This document defines the requirements and operation of the on-board vehicle
    equipment that enables magnetic field wireless power transfer (MF-WPT) for traction
    battery charging of electric vehicles. It is intended to be used for passenger
    cars and light duty vehicles. This document addresses the following aspects for
    an EV device: — safety requirements; — transferred power and power transfer efficiency;
    — ground clearance of the EV device; — functionality with associated off-board
    systems under various conditions and independent of manufacturer; — test procedures.
    EV devices that fulfil the requirements in this document are intended to operate
    with supply devices that fulfil the MF-WPT related requirements in the IEC 61980
    series. NOTE 1 Charging of a vehicle in motion is not considered in this edition.
    NOTE 2 Bi-directional power transfer is not considered in this edition.'
