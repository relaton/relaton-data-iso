abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and gives recommendations for the pre-installation surveys, design, materials, equipment, installation, commissioning, operation, inspection, and maintenance of cathodic protection systems for the external surface of on-land pipelines. This document is applicable to on-land pipelines and piping systems used in other industries and transporting other media such as industrial gases, waters, or slurries. Throughout this document, on-land pipelines mean: pipelines that are buried; landfalls of offshore pipeline sections protected by onshore based cathodic protection installations; immersed sections of on-land pipelines such as river or lake crossings. This document is applicable to pipelines of carbon steel, stainless steel, cast iron, galvanized steel, and copper. This document does not apply to pipelines made of reinforced concrete (see ISO 12696).'
