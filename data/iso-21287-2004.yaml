abstract:
- language: en
  script: Latn
  content: ISO 21287:2004 establishes a metric series of single rod pneumatic compact
    cylinders with bores of 20 mm to 100 mm for use of at maximum working pressure
    of 1 000 kPa (10 bar) with and without magnetic function. This series of pneumatic
    cylinder is not equipped with adjustable cushioning. Therefore, the application
    is restricted to those systems where adjustable cushioning is not required. Cylinders
    with bores of 20 mm and 25 mm can be used with end cover mountings in accordance
    with ISO 21287:2004. Cylinders with bores from 32 mm to 100 mm can be used with
    end cover mountings in accordance with ISO 15552. Piston rod mountings can be
    used for the different bores in accordance with ISO 8139 and ISO 8140.
