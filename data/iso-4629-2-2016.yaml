abstract:
- language: en
  script: Latn
  content: ISO 4629-2:2016 specifies a titrimetric method for determining the hydroxyl
    value of resins, binders for paints and varnishes, primary alcohols, glycols and
    fats. Whether it can be applied for hydro carboxylic acids, phenolic hydroxyl
    groups, polyols such as trimethyl propane and substances containing aromatic groups
    have been activated for Friedel-Crafts acylation shall be decided on case-to-case
    basis. Under the right conditions, the method is also applicable for determining
    the hydroxyl value of castor oil and its derivatives.
