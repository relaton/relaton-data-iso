abstract:
- language: en
  script: Latn
  content: This document specifies a real-time polymerase chain reaction (real-time
    PCR) method for the qualitative detection of goose-specific DNA derived from food
    and feed. It requires the extraction of an adequate amount of PCR amplifiable
    DNA from the relevant matrix and can be applied to the detection of goose material
    derived from domestic breeds of swan goose (Anser cygnoides domesticus) and domestic
    goose (Anser anser domesticus). Cross detection of Anser brachyrhynchus, Anser
    indicus, Branta canadensis, Cygnus atratus, Cygnus buccinator, Cygnus cygnus,
    Cygnus olor, Nettapus auritus, Oxyura jamaicensis and Stictonetta naevosa of Anseriformes
    is expected. The method can be applied to distinguish domestic breeds of swan
    goose (Anser cygnoides domesticus) and domestic goose (Anser anser domesticus)
    from domestic chicken, duck and turkey which are the most common adulterants of
    foie gras.[1] It is also able to differentiate the domestic goose from other high-end
    domestic poultry meats (quail, pigeon, pheasant). The target sequence is a partial
    fragment of the Anser cygnoides isolate SCWG-2014 breed Sichuan white goose unplaced
    genomic scaffold, GooseV1.0 scaffold320 (i.e. GenBank accession number NW_025927981.1)[2],
    which is present as a single copy per haploid genome. The provided PCR assay for
    this target has an absolute limit of detection of five copies per reaction, with ≥ 95 %
    confidence at this concentration (LOD95 %).
