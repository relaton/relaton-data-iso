abstract:
- language: en
  script: Latn
  content: This document specifies the sizing of safety valves and bursting discs
    for gas/liquid two-phase flow in pressurized systems such as reactors, storage
    tanks, columns, heat exchangers, piping systems or transportation tanks/containers,
    see Figure 2. The possible fluid states at the safety device inlet that can result
    in two-phase flow are given in Table 1. NOTE          The pressures used in this
    document are absolute pressures, not gauge pressures.
