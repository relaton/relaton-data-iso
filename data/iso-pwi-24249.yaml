abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of total saturated
    hydrocarbons, total unsaturated hydrocarbons, total aromatics, total olefins concentration
    and detailed hydrocarbon types present in aviation turbine fuel with gas chromatography/mass
    spectrometry (GC-MS). This document is applicable to the aviation turbine fuels
    with a boiling range of 140°C to 300°C. The detailed hydrocarbon compositions
    include: paraffins, noncondensed cycloparaffins, condensed dicycloparaffins, condensed
    tricycloparaffins, monoolefins, cycloolefins, alkylbenzenes, indans and/or tetralins,
    CnH2n-10 (indenes, etc.), naphthalenes, CnH2n-14 (acenaphthenes, etc.), CnH2n-16
    (acenaphthylenes, etc.) and tricyclic aromatics.'
