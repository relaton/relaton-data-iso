abstract:
- language: en
  script: Latn
  content: This document specifies a classification framework and terminology of simulation
    models for perception sensors in Advanced Driver Assistance Systems and Automated
    Driving (ADAS/AD) use cases. It builds upon the overall framework defined in ISO
    11010-1 , which is applicable to vehicle dynamic models. This document focuses
    on perception sensor models for radar, camera, lidar and ultrasonic. This document
    enables a structured approach for perception sensor model selection and provides
    a foundation for consistent sensor model comparison. The model classification
    is based on the modeling approach of the sensor model and its environment as well
    as the necessary inputs and outputs of the model.
