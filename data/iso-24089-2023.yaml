abstract:
- language: en
  script: Latn
  content: This document specifies requirements and recommendations for software update
    engineering for road vehicles on both the organizational and the project level.
    This document is applicable to road vehicles whose software can be updated. The
    requirements and recommendations in this document apply to vehicles, vehicle systems,
    ECUs, infrastructure, and the assembly and deployment of software update packages
    after the initial development. This document is applicable to organizations involved
    in software update engineering for road vehicles. Such organizations can include
    vehicle manufacturers, suppliers, and their subsidiaries or partners. This document
    establishes a common understanding for communicating and managing activities and
    responsibilities among organizations and related parties. The development of software
    for vehicle functions, except for software update engineering, is outside the
    scope of this document. Finally, this document does not prescribe specific technologies
    or solutions for software update engineering.
