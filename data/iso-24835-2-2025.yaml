abstract:
- language: en
  script: Latn
  content: This document specifies the principles, instruments, materials and experimental
    conditions for testing Young’s modulus and Poisson’s ratio using triaxial testing
    method. It also specifies the sampling and mechanical testing procedures, as well
    as the method and precision requirements for calculating shale mechanical brittleness
    index based on Young’s modulus and Poisson’s ratio. This document is applicable
    to reservoir quality evaluation and sweet spot identification in shale gas production.
