abstract:
- language: en
  script: Latn
  content: ISO 20773:2013 is applicable to the determination of total particulate
    matter and to the subsequent determination of nicotine and nicotine-free dry particulate
    matter present in the sidestream smoke from cigarettes. The described method is
    specified using the ISO 3308 smoking parameters (puff volume, duration and frequency)
    and butt length, but it is technically compatible with other smoking regimes.
