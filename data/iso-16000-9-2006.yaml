abstract:
- language: en
  script: Latn
  content: ISO 16000-9:2006 specifies a general laboratory test method for determination
    of the area specific emission rate of volatile organic compounds (VOCs) from newly
    produced building products or furnishing under defined climate conditions. The
    method can also, in principle, be applied to aged products. The emission data
    obtained can be used to calculate concentrations in a model room. ISO 16000-9:2006
    applies to various emission test chambers used for determination of the emission
    of volatile organic compounds from building products or products. A general description
    of an emission test chamber is given. ISO 16000-9:2006 is also applicable to wood-based
    panels and other building products, in order to determine the emission rate of
    formaldehyde.
