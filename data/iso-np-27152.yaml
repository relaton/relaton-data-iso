abstract:
- language: en
  script: Latn
  content: The purpose scope of this document is to establish internationally agreed principles for the systematic planning and construction of SHP project up to 30 MW involves multidisciplinary civil, hydro-mechanical and electromechanical works, and associated infrastructure. - Harmonized construction-stage guidance required to ensure well-designed projects are built safely, to specification, and on schedule. The standard shall provide adequate construction readiness, planning, sequencing, constructability, field engineering, temporary works, workmanship, interface coordination, inspection, testing and commissioning。 - Shall lead to minimize the time and cost overrun, quality control, material management by effective construction stage guidance. - Timely completion of the project shall meet the societal expectations to deliver the planned benefits - Timely completion of the project shall lead to minimize the environmental cost, reduction in poor aesthetic of site under construction, ensure safety, environmental and health protection.
