abstract:
- language: en
  script: Latn
  content: 'ISO 14649-111:2010 specifies the data elements describing cutting tool
    data for milling machine tools and machining centres, which work together with
    the process data for milling machine tools and machining centres specified in
    ISO 14649-11. They can be used as criteria for selecting one of several operations;
    they do not describe complete information on a particular tool. Therefore, leaving
    out optional attributes gives the controller more freedom to select from a larger
    set of tools. ISO 14649-111:2010 also specifies the information to be provided
    in the tool set-up sheet: tool identifier; tool type; tool geometry; application-dependent
    expected tool life. The following data types are outside its scope: normative
    tool life; tool location in the tool changer; adaptive items also know as tool
    holders or tool clamping devices; tools for other technologies, such as turning,
    grinding and electrical discharge machining (EDM). ISO 14649-111:2010 uses the
    EXPRESS language as specified in ISO 10303-11.'
