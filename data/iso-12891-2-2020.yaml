abstract:
- language: en
  script: Latn
  content: This document specifies methods for the analysis of retrieved surgical
    implants. This document describes the analysis of retrieved metallic, polymeric
    and ceramic implants. The analysis is divided into three stages which are increasingly
    destructive. This document can also be applied to other materials, e.g. animal
    tissue implants. NOTE National regulations or legal requirements regarding the
    handling and analysis of retrieved implants and tissues and associated biological
    material can also apply to specific topics covered in this document.
