abstract:
- language: en
  script: Latn
  content: ISO/IEC TS 22237-7:2018 specifies processes for the management and operation
    of data centres. The primary focus of this document is the operational processes
    necessary to deliver the expected level of resilience, availability, risk management,
    risk mitigation, capacity planning, security and energy efficiency. The secondary
    focus is on management processes to align the actual and future demands of users.
