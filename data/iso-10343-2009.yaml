abstract:
- language: en
  script: Latn
  content: ISO 10343:2009, together with ISO 15004-1, specifies requirements and test
    methods for continuously or digitally indicating ophthalmometers. Certain types
    of ophthalmometer are capable of measuring radii of curvature of contact lenses
    as described in ISO 18369-3:2006, 4.1. It is assumed that the local corneal front
    surface and both contact lens surfaces are spherical or toroidal. ISO 10343:2009
    takes priority over ISO 15004-1, if differences exist.
