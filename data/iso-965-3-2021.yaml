abstract:
- language: en
  script: Latn
  content: This document specifies limit deviations for pitch and crest diameters
    for ISO general purpose metric screw threads (M) conforming to ISO 261 having
    basic profile in accordance with ISO 68-1. The limit deviations specified are
    derived from the fundamental deviations and tolerances specified in ISO 965-1.
    This document is applicable to ISO general purpose metric screw threads with the
    recommended tolerance classes.
