abstract:
- language: en
  script: Latn
  content: This document specifies a method with the minimum technical requirements
    for DNA extraction of diatom samples, for use in DNA-based approaches dedicated
    to taxonomic identification of diatom communities, as well as ecological status
    and water quality assessments. The objective is to ensure high-quality DNA yields
    suitable for the subsequent molecular steps of DNA-based approaches (e.g. DNA
    metabarcoding). This document does not aim to cover the PCR, library preparation,
    sequencing, and data analysis steps of the workflow, which will be given in separate
    standards or technical reports.
