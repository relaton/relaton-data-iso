abstract:
- language: en
  script: Latn
  content: This document prescribes safety signs for the purposes of accident prevention,
    fire protection, health hazard information and emergency evacuation. The shape
    and colour of each safety sign are according to ISO 3864‑1 and the design of the
    graphical symbols is according to ISO 3864‑3. This document is applicable to all
    locations where safety issues related to people need to be addressed. However,
    it is not applicable to the signalling used for guiding rail, road, river, maritime
    and air traffic and, in general, to those sectors subject to a regulation which
    may differ with regard to certain points of this document and of the ISO 3864
    series. This document specifies the safety sign originals that can be scaled for
    reproduction and application purposes.
