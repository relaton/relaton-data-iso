abstract:
- language: en
  script: Latn
  content: This document specifies requirements for downhole thermoplastics lined
    tubing (TLT) used in the oil and gas industries, including configuration, materials,
    manufacturing, inspection and testing, documentation, marking, packaging, transportation,
    storage and use. This document is applicable to downhole thermoplastics lined
    tubing (TLT) used in contact with media related to oil and gas exploration and
    production (which involves multiphase flow, as well as water injection). This
    document is suitable for thermoplastics including but not limited to polyethylene
    (PE), polyethylene of raised temperature resistance (PE-RT), ultra-high molecular
    weight polyethylene (PE-UHMW), crosslinked polyethylene (PE-X), polypropylene
    (PP), unplasticized polyamide (PA-U), polyketone (PK), polyphenylene sulfide (PPS),
    polyvinylidene fluoride (PVDF), and polyetheretherketone (PEEK) which meet the
    requirements of relevant design specifications, standards or regulations.
