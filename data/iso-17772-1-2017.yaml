abstract:
- language: en
  script: Latn
  content: ISO 17772-1:2017 specifies requirements for indoor environmental parameters
    for thermal environment, indoor air quality, lighting and acoustics and specifies
    how to establish these parameters for building system design and energy performance
    calculations. It includes design criteria for the local thermal discomfort factors,
    draught, radiant temperature asymmetry, vertical air temperature differences and
    floor surface temperature. ISO 17772-1:2017 is applicable where the criteria for
    indoor environment are set by human occupancy and where the production or process
    does not have a major impact on indoor environment. It also specifies occupancy
    schedules to be used in standard energy calculations and how different categories
    of criteria for the indoor environment can be used. The criteria in ISO 17772-1:2017can
    also be used in national calculation methods. ISO 17772-1:2017 sets criteria for
    the indoor environment based on existing standards and reports (listed in Clause
    2 and the Bibliography). The document does not specify design methods, but gives
    input parameters to the design of building envelope, heating, cooling, ventilation
    and lighting.
