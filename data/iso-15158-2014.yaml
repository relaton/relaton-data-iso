abstract:
- language: en
  script: Latn
  content: ISO 15158:2014 describes the procedure for determining the pitting potential
    for stainless steels (austenitic, ferritic/austenitic, ferritic, martensitic stainless
    steel) under potentiodynamic control. The principal advantage compared with other
    potentiostatic test methods is the rapidity of this test method, with which the
    pitting potential can be measured in a single potential scan. The pitting potential
    as determined by ISO 15158:2014 can be used as a relative index of performance.
    For example, one can compare the relative performances for different lots of stainless-steel
    grades and products. The test described in ISO 15158:2014 is not intended to determine
    the pitting potential at which actual pitting can occur under real service conditions,
    or not.
