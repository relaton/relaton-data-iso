abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements for servicers utilizing
    data from multiple interoperable sensors to deliver spaceborne remote sensing
    services. It outlines the necessary processes, parameters, and conditions for
    obtaining, integrating, and utilizing data from multiple spaceborne sensors, enabling
    the effective development and operation of such services. The standard is intended
    for developers and providers of remote sensing services across various industries,
    offering guidance to ensure data integrity, compatibility, and reliability in
    the construction of services and systems. Specifically, this document establishes
    standardized processes, and parameters related to service development, input data
    management, and output data validation. It emphasizes ensuring the quality, accuracy,
    and usability of data derived from multiple sensors, as well as their seamless
    integration into user-oriented services. The scope extends beyond the space industry,
    aiming to facilitate the adoption of spaceborne data in other sectors and promote
    interoperability and trust in service delivery. By standardizing these elements,
    the document ensures that servicers can deliver high-quality, reliable, and interoperable
    remote sensing services to end users across diverse industries. This document
    specifies requirements applicable to services that consider interoperability,
    and does not cover requirements for individual spaceborne data.
