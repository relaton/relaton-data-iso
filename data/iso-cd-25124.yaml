abstract:
- language: en
  script: Latn
  content: 'This document specifies the categories, designs, requirements and test
    methods of the offshore gangway system. The gangway includes all kinds of marine
    passages between ships, offshore installations and docks as follows: a) Ship to
    ship. b) Ship to offshore floating installation. c) Ship to dock. d) Ship to fixed
    offshore installation. e) Offshore floating installation to ship. This document
    is applicable to the gangway system for ships and offshore installations.'
