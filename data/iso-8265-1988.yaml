abstract:
- language: en
  script: Latn
  content: Gives guidance on the equipment and procedures for the sampling by quadrat
    samplers in waters of depth less than 500 mm, although methods are described to
    permit sampling, under certain conditions, in a water depth of up to 1 m. The
    procedures are applicable to all accessible aquatic habitats in rivers, streams
    and estuaries where current velocities in excess of 0,1 m/s would be expected.
