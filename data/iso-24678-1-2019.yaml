abstract:
- language: en
  script: Latn
  content: 'This document provides requirements to govern the application of explicit
    algebraic formulae sets to the calculation of fire phenomena. This document is
    an implementation of the general requirements provided in ISO 16730‑1 for the
    case of fire dynamics calculations involving sets of explicit algebraic formulae.
    This document is arranged in the form of a template, where specific information
    relevant to algebraic formulae are provided to satisfy the following types of
    general requirements: a) Requirements governing description of physical phenomena;
    b) Requirements governing calculation process; c) Requirements governing limitations;
    d) Requirements governing input parameters; e) Requirements governing domain of
    applicability.'
