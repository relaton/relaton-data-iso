abstract:
- language: en
  script: Latn
  content: 'ISO 2238:2011 specifies the dimensions of machine bridge reamers. It gives,
    for a series of diameter ranges, d1, from 6 mm to 50,8 mm, the values, in millimetres,
    for the following dimensions of these tools: overall length, l3; total cutting
    edge length, l2; tapered cutting edge length, l1. Unless otherwise stated, these
    reamers are right-hand cutting.'
