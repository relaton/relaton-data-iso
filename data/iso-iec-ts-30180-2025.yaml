abstract:
- language: en
  script: Latn
  content: 'This document specifies the functional requirements of the following items
    to determine the status of self-quarantine through IoT data interfaces working
    over a set of hand-held devices, monitoring tag, and a management system: –    
    functional requirements for monitoring entity and monitoring tag at a self-quarantine
    place; –     functional requirements for managing entity and proxy managing entity
    at the management side; and –     functional requirements for the protection of
    the self-quarantine status and the privacy information.'
