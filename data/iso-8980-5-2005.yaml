abstract:
- language: en
  script: Latn
  content: ISO 8980-5:2005 specifies the requirement and test method for spectacle
    lens surfaces that are claimed to provide a basic level of abrasion resistance
    including those with coatings. A lens claimed to be abrasion-resistant shall meet
    the requirements on both front and back surfaces. Lens powers and surface form
    is restricted for testing, however test results are applicable to claims for lenses
    and lens surfaces with identical properties other than the lens power or surface
    radius. ISO 8980-5:2005 does not attempt to define the properties of lens surfaces
    with abrasion resistance better than the following defined criteria.
