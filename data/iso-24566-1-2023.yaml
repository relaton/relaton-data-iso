abstract:
- language: en
  script: Latn
  content: 'This document identifies and sets out principles for integrating climate
    change impacts into the planning and design activities of water utilities for
    the provision of water services. It also includes methodologies to assess the
    principles in the context of climate change and to provide examples of adaptations
    made. NOTE            Discussion of impacts and strategies for responses for stormwater,
    drinking water and wastewater utilities are intended to be set out in ISO 24566-2:—[1],
    ISO 24566-3:—[2] and ISO 24566-4:—[3], respectively, with examples of adaptations
    that have been made. < clear="all">< align="left" size="1" width="33%"> [1]  Under
    preparation. Stage at the time of publication: ISO/DIS 24566-2:2023. [2]  Under
    preparation. Stage at the time of publication: ISO/CD 24566-3:2023. [3]  Under
    preparation. Stage at the time of publication: ISO/CD 24566-4:2023.'
