abstract:
- language: en
  script: Latn
  content: ISO 22036:2008 describes the determination of trace elements in digests
    or extraction solutions from soil by inductively coupled plasma - atomic emission
    spectrometry (ICP-AES) for 34 elements. This multi-element determination method
    is applicable to soil extracts obtained with aqua regia in accordance with ISO
    11466, with DTPA in accordance with ISO 14870 or other weak extractants, or soil
    extracts for the determination of total element contents using the acid digestion
    method of ISO 14869-1 or the fusion method of ISO 14869-2. The choice of calibration
    method depends on the extractant and can be adapted to the extractant concentration.
