abstract:
- language: en
  script: Latn
  content: ISO 16877:2008 specifies the requirements for fine-tolerance Grade TH hoist
    chains, for use as load chains in manually operated chain hoists. It is applicable
    to these round steel short link chains, electrically welded and heat treated,
    tested to and compliant with the ISO 1834 general conditions of acceptance. The
    range of nominal sizes of hoist chains covered by ISO 16877:2008 is from 3 mm
    to 13 mm. They are for use in the temperature range -10 °C to 200 °C.
