abstract:
- language: en
  script: Latn
  content: This document provides information on the psycho-physiological effects
    related to the wearing of respiratory protective devices (RPD) and it is intended
    for the preparation of standards for selection and use of RPD. It specifies for
    the writers of RPD standards, principles relating to —    the interaction between
    RPD and the human physiological and psychological perception, —    the acceptance
    by the wearer, and —    the need for training to improve acceptance of the RPD
    by the wearer. This document does not cover requirements related to the specific
    hazard for which the RPD is designed.
