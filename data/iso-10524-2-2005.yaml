abstract:
- language: en
  script: Latn
  content: 'ISO 10524-2:2005 specifies requirements for manifold pressure regulators
    intended to be connected to cylinders with nominal filling pressures up to 25
    000 kPa at 15 °C and for line pressure regulators for inlet pressures up to 3
    000 kPa and intended for use in pipeline systems for the following medical gases:
    oxygen; nitrous oxide; air for breathing; carbon dioxide; oxygen/nitrous oxide
    mixtures; air for driving surgical tools; nitrogen for driving surgical tools;
    oxygen produced by an oxygen concentrator. ISO 10524-2:2005 applies to manifold
    pressure regulators and line pressure regulators supplied as individual units
    or to the relevant components incorporated within an assembly. It does not apply
    to pressure regulators for use with vacuum pipeline systems.'
