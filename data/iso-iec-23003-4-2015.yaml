abstract:
- language: en
  script: Latn
  content: ISO/IEC 23003-4:2015 specifies technology for loudness and dynamic range
    control. ISO/IEC 23003-4:2015 is applicable to most MPEG audio technologies. It
    offers flexible solutions to efficiently support the widespread demand for technologies
    such as loudness normalization and dynamic range compression for various playback
    scenarios.
