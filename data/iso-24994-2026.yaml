abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the selected metals and semi-metals migration from the internal surface of plastics pipes, fittings and joints to be used for the transport of water intended for human consumption by inductively coupled plasma mass spectrometry (ICP-MS). This document is used to determine the selected metal and semi-metals migration values of lead (Pb), tin (Sn), antimony (Sb), cadmium (Cd), chromium (Cr), copper (Cu), barium (Ba), magnesium (Mg), aluminium (Al), nickel (Ni), zinc (Zn) and arsenic (As). This method is suitable for all plastics pipes, fittings and joints to be used for the transport of water and raw water intended for human consumption.
