abstract:
- language: en
  script: Latn
  content: ISO 17636:2003 specifies fundamental techniques for radiographic examination
    of fusion welded joints in metallic materials. The object is to obtain satisfactory
    and repeatable results using the most economical methods. The techniques are based
    on generally recognized practice and fundamental theory of the subject. ISO 17636:2003
    applies to testing of fusion welded joints in plates or pipes.
