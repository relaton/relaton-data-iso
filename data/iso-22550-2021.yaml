abstract:
- language: en
  script: Latn
  content: This document specifies Advanced Function Presentation (AFP) interchange
    as a container for document objects by defining the AFP file format Mixed Object
    Document Content Architecture (MO:DCA)[1]. It includes a means of identifying
    support for specifically including single and multi-page Portable Document Format
    (PDF) document objects as a container function set. It also includes a mechanism
    for pairing and managing resources associated with PDF. NOTE       For an example
    of how PDF external file references map into AFP secondary resources, see Annex A.
    The use of AFP is applicable to AFP and PDF workflows where the final production
    is managed within an Intelligent Printer Data Stream (IPDS) environment.   [1]
    The Architecture references shown (MO:DCA as an example) are copyright of the
    AFP Consortium. This information is given for the convenience of users of this
    document and does not constitute an endorsement by ISO of this product.
