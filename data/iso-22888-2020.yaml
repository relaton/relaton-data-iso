abstract:
- language: en
  script: Latn
  content: This document specifies the concepts and basic requirements for the planning
    of railway operation in order to reduce risk in the event of earthquakes. This
    excludes regions where the consequences of seismic hazard for railway operation
    are low or non-existent. The definition of such regions is out of the scope of
    this document. NOTE The stages defined for consideration of the countermeasures
    necessary for the safe management of the seismic hazards can also be relevant
    for dealing with other natural phenomena. This document includes only operational
    measures and excludes any infrastructure measures. Furthermore, this document
    does not include specific measures which ensure, without fail, passenger safety
    or which provide protection against railway-operational damage caused by earthquakes.
    Therefore, residual risk can remain.
