abstract:
- language: en
  script: Latn
  content: This part of ISO 5530 specifies a method, using an extensograph, for the
    determination of the rheological properties of wheat flour dough in an extension
    test. The recorded load?extension curve is used to assess general quality of flour
    and its response to improving agents. The method is applicable to experimental
    and commercial flours from wheat (Triticum aestivum L.). NOTE This part of ISO
    5530 is based on ICC 114.[3]
