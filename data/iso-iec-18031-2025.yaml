abstract:
- language: en
  script: Latn
  content: This document specifies a conceptual model for a random bit generator for
    cryptographic purposes, together with the elements of this model. This document
    specifies the characteristics of the main elements required for both non-deterministic
    and deterministic random bit generators. It also establishes the security requirements
    for both non-deterministic and deterministic random bit generators. Techniques
    for statistical testing of random bit generators for the purposes of independent
    verification or validation and detailed designs for such generators are outside
    the scope of this document.
