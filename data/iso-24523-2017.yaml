abstract:
- language: en
  script: Latn
  content: ISO 24523:2017 provides guidelines on good benchmarking practice of drinking
    water and wastewater utilities. It describes the basic framework and methods associated
    with benchmarking in the water sector. The guidelines are intended primarily for
    voluntary benchmarking. Specific objectives set forth by the authorities and which
    are to be achieved by the water utility are not covered by this document. ISO
    24523:2017 is applicable to water utilities of any size managed by a public or
    private entity. It does not favour any particular ownership or operating model.
