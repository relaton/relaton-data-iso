abstract:
- language: en
  script: Latn
  content: This document identifies the essential welding quality related tasks and
    responsibilities included in welding coordination. The principle of an assessment
    according to this document is that welding coordination personnel need to be competent
    in the welding-related tasks allocated to them. It is presumed that welding coordination
    personnel have the necessary education, qualifications and experience and are
    appointed by the manufacturer. Regulatory documents, application standards and
    contracts can give specific requirements for welding coordination personnel. Otherwise,
    it is the responsibility of the manufacturer to determine the requirements to
    be in compliance with this document.
