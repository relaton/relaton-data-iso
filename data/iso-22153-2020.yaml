abstract:
- language: en
  script: Latn
  content: This document provides basic requirements for electric valve actuators,
    used for on-off and control valves. It includes guidelines for classification,
    design, enclosure and corrosion protection, and methods for conformity assessment.
    Combinations of electric actuators and gearboxes when supplied by the actuator
    manufacturer are within the scope of this document. This document does not cover
    solenoid actuators, electro-hydraulic actuators and electric actuators which are
    integral to the valves. Other requirements or conditions of use different from
    those indicated in this document are agreed between the purchaser and the manufacturer/supplier,
    prior to order.
