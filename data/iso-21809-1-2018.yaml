abstract:
- language: en
  script: Latn
  content: This document specifies requirements for plant-applied external three-layer
    polyethylene and polypropylene based coatings for corrosion protection of welded
    and seamless steel pipes for pipeline transportation systems in the petroleum
    and natural gas industries in accordance with ISO 13623. NOTE Pipes coated in
    accordance with this document are considered suitable for further protection by
    means of cathodic protection.
