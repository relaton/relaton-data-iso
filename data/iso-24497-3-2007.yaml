abstract:
- language: en
  script: Latn
  content: ISO 24497-3:2007 specifies the general requirements for the application
    of the metal magnetic memory inspection method (MMM inspection) as a non-destructive
    testing method for quality assurance of welded joints of pressurized components.
    ISO 24497-3:2007 may be applied to welded joints in any type of products, pipelines,
    vessels, equipment, and metal constructions, as agreed with the purchaser. The
    terms and definitions for the process are contained in ISO 24497-1, and the general
    requirements of the process are in ISO 24497-2.
