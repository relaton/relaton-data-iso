abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for classification of tubular
    cored electrodes with or without a gas shield for metal arc welding of high-strength
    steels in the as-welded condition or in the post-weld heat-treated condition with
    a minimum yield strength higher than 550 MPa or a minimum tensile strength higher
    than 590 MPa. One tubular cored electrode can be tested and classified with different
    shielding gases, if used with more than one. This document is a combined specification
    providing classification utilizing a system based upon the yield strength and
    an average impact energy of 47 J of the all-weld metal, or utilizing a system
    based upon the tensile strength and an average impact energy of 27 J of the all-weld
    metal. —     Subclauses and tables which carry the suffix “system A” are applicable
    only to tubular cored electrodes classified under the system based upon the yield
    strength and an average impact energy of 47 J of the all-weld metal given in this
    document. —     Subclauses and tables which carry the suffix “system B” are applicable
    only to tubular cored electrodes classified under the system based upon the tensile
    strength and an average impact energy of 27 J of the all-weld metal given in this
    document. —     Subclauses and tables which do not have either the suffix “system
    A” or the suffix “system B” are applicable to all tubular cored electrodes classified
    under this document. It is recognized that the operating characteristics of tubular
    cored electrodes can be modified by the use of pulsed current but, for the purposes
    of this document, pulsed current is not used for determining the electrode classification.
