abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for supply chain data to be interoperable. The following are within the scope of this document: — character encoding used in supply chain interoperable format; — rules for naming files in supply chain interoperable format; — the rules for formatting interoperable data in the supply chain; — using an open concept dictionary to ensure that supply chain data is unambiguous with meaning clear, supporting interoperability. The following are outside the scope of this document: — the information to be represented by the supply chain interoperable format'
