abstract:
- language: en
  script: Latn
  content: ISO 10580:2010 specifies a general laboratory test method for determination
    of the area-specific emission rate of volatile organic compounds (VOC) and/or
    the vapour-phase VOC concentration under defined climate conditions. ISO 10580:2010
    describes emission test chambers used for the determination of the emission of
    volatile organic compounds from resilient, textile and laminate floor coverings.
