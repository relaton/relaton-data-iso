abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of hexagon regular nuts (style 1),
    in steel and stainless steel, with metric fine pitch thread 8 mm to 39 mm, and
    with product grades A and B. NOTE       For nuts with sizes D > 39 mm, see Annex A.
