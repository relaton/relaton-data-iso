abstract:
- language: en
  script: Latn
  content: ISO 7456:2007 specifies the grades and quality, the dimensional characteristics,
    the dimensional and geometrical tolerances, and the surface finish of standardized
    guide rails and their fishplates. In addition, ISO 7456:2007 defines a designation
    system for guide rails. ISO 7456:2007 is applicable to guide rails used in passenger
    lift and service lift installations to provide guiding for the car and the counterweight.
