abstract:
- language: en
  script: Latn
  content: 'This document provides guidance and specifications for the determination
    of personal exposure to gases and vapours in welding and allied processes. It
    applies to the following thermal processes used to join, cut, surface or remove
    metals: (111)    Manual metal arc welding (metal arc welding with covered electrode);
    shielded metal arc welding /USA/ (114)    Self-shielded tubular-cored arc welding
    (131)    Metal inert gas welding; MIG welding; gas metal arc welding /USA/ (135)   
    Metal active gas welding; MAG welding; gas metal arc welding /USA/ (136)    Tubular-cored
    metal arc welding with active gas shield; flux cored arc welding /USA/ (137)   
    Tubular-cored metal arc welding with inert gas shield; flux cored arc welding
    /USA/ (141)    Tungsten inert gas arc welding; TIG welding; gas tungsten arc welding
    /USA/ (15)      Plasma arc welding; (31)      Oxy-fuel gas welding; oxy-fuel gas
    welding /USA/ (52)      Laser beam welding; (912)    Flame brazing; torch brazing
    /USA/ (97)      Braze welding;   —     arc and flame gouging; —     arc and laser
    cutting processes; —     flame and plasma cutting processes; —     metal-spraying
    (see ISO 4063). The following gases and vapours which can be produced or be present
    during welding and allied processes are covered: —     ozone (O3); —     carbon
    monoxide (CO); —     carbon dioxide (CO2); —     nitric oxide (NO) and nitrogen
    dioxide (NO2); —     vapours produced in the welding or cutting of metals having
    paint or other surface coatings. Fuel, oxidant and shielding gases used in welding
    and allied processes are not covered. The general background level of gases and
    vapours in the workplace atmosphere influences personal exposure, and therefore
    the role of fixed-point measurements is also considered.'
