abstract:
- language: en
  script: Latn
  content: ISO 12732:2006 specifies the method for measuring the degree of sensitization
    (DOS) in stainless steel and nickel-based alloys using the Double Loop Electrochemical
    Potentiokinetic Reactivation (DL-EPR) test (based on Cihal's method). The method
    may be used for the quantitative assessment of deleterious thermal effects resulting
    in the formation of alloy-element-depleted zones at grain boundaries or in the
    matrix. However, attention should be paid when testing heat-affected weld zones,
    due to possible non-uniform distribution of sensitized zones along the fusion
    lines. The results of the test can be used as an index to identify the potential
    susceptibility of stainless steel and nickel-based alloys to intergranular corrosion,
    pitting corrosion, and intergranular-stress corrosion cracking, but prediction
    of these corrosion modes depends on complementary specific testing. ISO 12732:2006
    describes the general methodology and gives examples of suitable test exposure
    conditions for specific alloys.
