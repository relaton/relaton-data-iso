abstract:
- language: en
  script: Latn
  content: 'ISO 14457:2012 is applicable to handpieces and motors used in dentistry
    for patient contact, regardless of their construction. It specifies requirements,
    test methods, manufacturer''s information, marking and packaging. ISO 14457:2012
    is applicable to: straight and geared angle handpieces, including handpiece attachments;
    high-speed air turbine handpieces; air motors; electrical motors; prophy handpieces.'
