abstract:
- language: en
  script: Latn
  content: ISO 22915-12:2014 specifies the tests for verifying the stability of industrial
    variable-reach trucks when handling empty or laden freight containers of 6 m (20
    ft) length and longer. It is applicable to these types of industrial variable-reach
    trucks that are equipped with a spreader (top lift and side lift), swap bodies,
    or semi-trailers or other load-handling means applicable for container handling.
    ISO 22915-12:2014 does not specify requirements for industrial variable-reach
    trucks (see ISO 22915‑11) and rough terrain variable-reach trucks (see ISO 22915‑14).
    ISO 22915-12:2014 does not apply to trucks when handling a container which has
    a mobile centre of gravity (see ISO 3874). ISO 22915-12:2014 is not applicable
    to counterbalanced trucks with masts designed for handling freight containers,
    dealt with by ISO 22915‑9.
