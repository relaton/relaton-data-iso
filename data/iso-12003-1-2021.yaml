abstract:
- language: en
  script: Latn
  content: 'This document specifies procedures for both the static and dynamic strength
    testing of roll-over protective structures (ROPS) front-mounted on narrow tractors.
    It defines the clearance zone and acceptance conditions for rigid or tiltable,
    front, two-post ROPS, including any associated rear fixtures, and is applicable
    to tractors so equipped having the following characteristics: —    a ground clearance
    of not more than 600 mm beneath the lowest points of the front- and rear-axle
    housings (not considering lower points on the axle differential); —    a fixed
    or adjustable minimum track width of one of the two axles of less than 1 150 mm;
    NOTE It is understood that the axle mounted with the wider tyres is set at a track
    width of not more than 1 150 mm. Tyre track width is adjustable so that the outer
    edges of the narrower tyres do not extend beyond the outer edges of the tyres
    of the other axle. Where the two axles are fitted with rims and tyres of the same
    size, the fixed or adjustable track width of the two axles is less than 1 150 mm.
    —    a mass greater than 400 kg but less than 3 500 kg, unballasted, including
    the ROPS and tyres of the largest size recommended by the manufacturer; —    fitted
    with roll-over protective structures of the dual-pillar type mounted only in front
    of the seat index point (SIP) and characterised by a reduced clearance zone attributable
    to the tractor silhouette. This document also specifies optional testing procedures
    for both seat anchorage points and folding efforts of front-mounted ROPS designed
    to fold.'
