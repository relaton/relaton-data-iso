abstract:
- language: en
  script: Latn
  content: ISO 4548-14:2016 specifies a method of testing the ability of full-flow
    lubricating oil filters manufactured with composite pressure vessel materials
    for internal combustion engines to withstand an internal pressure surge and cyclic
    internal pressure variations experienced in the application at specified operating
    temperatures. These tests are intended for application to spin-on type filters
    and detachable filters with disposable elements constructed of composite materials.
