abstract:
- language: en
  script: Latn
  content: This document gives guidelines for the establishment of a conversion relationship
    between the results of an alternative method and an anchor method, and its verification
    for the quantitative determination of the microbiological quality of milk. NOTE
    The conversion relationship can be used a) to convert results from an alternative
    method to the anchor basis or b) to convert results/limits, expressed on an anchor
    basis, to results in units of an alternative method.
