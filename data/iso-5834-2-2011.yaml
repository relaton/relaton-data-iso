abstract:
- language: en
  script: Latn
  content: ISO 5834-2:2011 specifies the requirements and corresponding test methods
    for moulded forms, e.g. sheets and rods, made from ultra-high-molecular-weight
    polyethylene (UHMWPE) for use in the manufacture of surgical implants. ISO 5834-2:2011
    is not applicable to direct-moulded (near net shape), irradiated or finished products
    or products manufactured from polyethylene blended with additives or from blending
    of different forms of polyethylene.
