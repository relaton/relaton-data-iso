abstract:
- language: en
  script: Latn
  content: This document specifies the general technical requirements for the process
    of cultivation and collection of medicinal plants, including selection of site,
    seeds and other propagation materials, cultivation, harvest and collection, post-harvest
    processing, packaging and labelling, storage and transportation. This document
    applies to the cultivation, harvest and collection of medicinal plants used as
    the source for herbal medicines, including certain post-harvest operations. This
    document also provides practical record formats for the entire process.
