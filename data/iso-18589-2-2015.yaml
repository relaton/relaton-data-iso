abstract:
- language: en
  script: Latn
  content: ISO 18589-2:2015 specifies the general requirements, based on ISO 11074
    and ISO/IEC 17025, for all steps in the planning (desk study and area reconnaissance)
    of the sampling and the preparation of samples for testing. It includes the selection
    of the sampling strategy, the outline of the sampling plan, the presentation of
    general sampling methods and equipment, as well as the methodology of the pre-treatment
    of samples adapted to the measurements of the activity of radionuclides in soil.
    ISO 18589-2:2015 is addressed to the people responsible for determining the radioactivity
    present in soil for the purpose of radiation protection. It is applicable to soil
    from gardens, farmland, urban, or industrial sites, as well as soil not affected
    by human activities. ISO 18589-2:2015 is applicable to all laboratories regardless
    of the number of personnel or the range of the testing performed. When a laboratory
    does not undertake one or more of the activities covered by this part of ISO 18589,
    such as planning, sampling, or testing, the corresponding requirements do not
    apply.
