abstract:
- language: en
  script: Latn
  content: This document specifies principles and requirements and gives guidance
    on ecolabelling programmes and ecolabels This document is applicable to ecolabelling
    programme development, selection of product categories, product environmental
    criteria and product function criteria, and the process for assessing and certifying
    products that are licensed to use an ecolabel. It provides guidance on how ecolabels
    in conformity with this document can be differentiated from other environmental
    statements and ecolabels in the market. NOTE            Ecolabels and ecolabelling
    programmes address environmental aspects of products but can also include social
    and economic aspects in support of sustainable development.
