abstract:
- language: en
  script: Latn
  content: ISO 5145:2017 establishes practical criteria for determining valve outlet
    connections for gas cylinders. It applies to the selection of gas cylinder valve
    outlet connections and specifies the dimensions for a number of them. ISO 5145:2017
    is not applicable to connections used for cryogenic gas withdrawal or gases for
    breathing equipment, which are the subjects of other International Standards.
    NOTE Other safeguard provisions like labelling or colour coding are not affected
    by this document.
