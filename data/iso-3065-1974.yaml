abstract:
- language: en
  script: Latn
  content: 'The Standard specifies the following characteristics of the oil. Appearance:
    Clear, mobile liquid. Colour: Colourless to pale yellow. Odour: Characteristic
    of the odour of 1,8-cineole. Relative density at 20/20 °C: 0,918 - 0,928. Refractive
    index at 20 °C: 1,4580 - 1,4650. Optical rotation at 20 °C: Range from - 2 to
    + 2 . Solubility in 70 % (V/V) ethanol at 20 °C: 1 volume in 3 volumes. Cineole
    content: 80 - 85 %.'
