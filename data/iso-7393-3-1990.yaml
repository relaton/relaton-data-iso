abstract:
- language: en
  script: Latn
  content: Specifies a procedure for water. It is applicable for the measurement of
    concentrations, in terms of chlorine, from 0,01 to 0,21 mmol/l. The interfering
    substances are given. In annex B a procedure for direct titration is specified.
    It is usually applied to chlorine concentrations above 7 mol/l in treated drinking
    water.
