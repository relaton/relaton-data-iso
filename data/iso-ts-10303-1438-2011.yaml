abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1438:2011-10 specifies the application module for Work structure.
    The following are within the scope of ISO/TS 10303-1438:2011-10: identification
    and characterization a work request and work order; association of a work request
    with an activity method; identification of the product or activity data affected
    by the work request; identification of the activities that are governed by a work
    order; the definition and quantification of planned as well as recorded work outputs;
    the relationships between the work output and detailed descriptions of the output.'
