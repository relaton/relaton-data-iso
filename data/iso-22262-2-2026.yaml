abstract:
- language: en
  script: Latn
  content: 'This document specifies procedures for quantification of asbestos mass
    fractions below approximately 5 %, and for quantitative determination of asbestos
    in vermiculite, other industrial minerals and commercial products that incorporate
    these minerals. This document is applicable to the quantitative analysis of: a)      
    any material for which the estimate of asbestos mass fraction obtained using ISO 22262-1
    is deemed to be of insufficient precision to reliably classify the regulatory
    status of the material (i.e. whether the material is subject to asbestos regulations
    in the particular jurisdiction) or for which it is considered necessary to obtain
    further evidence to demonstrate the absence of asbestos; b)       resilient floor
    tiles, asphaltic materials, roofing felts and any other materials in which asbestos
    is embedded in an organic matrix; c)        wall and ceiling plasters, with or
    without aggregate; d)       vermiculite and commercial products containing vermiculite;
    e)       mineral powders such as talc, wollastonite, sepiolite, attapulgite (palygorskite),
    calcite or dolomite, and commercial products containing these minerals. This document
    primarily applies to samples in which asbestos has been identified at estimated
    mass fractions lower than approximately 5 % by sample mass. This document is also
    applicable to samples that can contain asbestos at low mass fractions incorporated
    into matrix material such that microscopical examination of the untreated sample
    is either not possible or unreliable.'
