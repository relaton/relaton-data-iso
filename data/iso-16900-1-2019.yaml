abstract:
- language: en
  script: Latn
  content: This document specifies the test methods for determining inward leakage
    of respiratory interfaces (RI) and total inward leakage of complete respiratory
    protective devices (RPD) using specified test agents and incorporating specified
    body movements, at specified metabolic work rates. These tests are conducted in
    laboratories using specific test agents under specified conditions and therefore
    do not indicate the performance of the device in actual use.
