abstract:
- language: en
  script: Latn
  content: This document specifies three procedures (diagonal marking, inverted-T
    marking and mock-garment marking) to measure the spirality or torque of woven
    and knitted fabrics after domestic laundering. The results obtained from different
    procedures will not always be comparable. This document is not intended to measure
    the spirality of fabrics as manufactured, but rather the spirality after laundering.
    NOTE       Some fabric constructions, such as denim, can have spirality intentionally
    introduced during manufacturing. Fabrics made on circular knitting machines can
    have inherent nonverticality of wale alignment.
