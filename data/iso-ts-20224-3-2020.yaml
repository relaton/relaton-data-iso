abstract:
- language: en
  script: Latn
  content: This document specifies a real-time polymerase chain reaction (real-time
    PCR) method for the qualitative detection of porcine-specific DNA derived from
    food and feed. It requires the extraction of an adequate amount of PCR amplifiable
    DNA from the relevant matrix and can be applied to the detection of porcine material
    derived from pig (Sus scrofa domesticus) and wild boar (Sus scrofa). The target
    sequence is a partial fragment of the Sus scrofa beta actin (ACTB) gene, partial
    cds. (i.e. GenBank accession number DQ452569.1)[1], which is present as a single
    copy per haploid genome. The provided PCR assay for this target has an absolute
    limit of detection of five copies per reaction, with ≥ 95 % replicability at this
    concentration (LOD95 %).
