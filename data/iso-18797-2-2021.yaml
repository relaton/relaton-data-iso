abstract:
- language: en
  script: Latn
  content: This document specifies the selection criteria and minimum requirements
    for protective coating systems for maintenance and field repair of risers exposed
    to conditions in the splash zone. It is applicable for maintenance requirements
    and field repairs of riser coatings. This document does not apply to the selection
    of techniques and materials used to restore integrity of the risers to be coated,
    nor does it apply to the selection of additional mechanical protective materials
    that are not part of the coating systems described in this document. New construction
    shop applied riser coatings are covered in ISO 18797-1. Compatible maintenance
    and repair coating systems specified in ISO 18797-1 are covered in this document.
