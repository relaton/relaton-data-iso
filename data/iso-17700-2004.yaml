abstract:
- language: en
  script: Latn
  content: ISO 17700:2004 specifies two test methods for assessing the degree of damage
    (marring) and transfer of a material's surface colour during mild dry or wet abrasion.
    The methods are applicable to all footwear uppers, linings and insocks irrespective
    of the material, in order to assess suitability for end use. ISO 17700:2004 also
    specifies a method for determining the likelihood of colour bleeding from materials
    and components such as sewing threads and shoe laces due to the action of water
    and artificial perspiration solutions, in order to assess suitability for end
    use.
