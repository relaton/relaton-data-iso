abstract:
- language: en
  script: Latn
  content: 'This document specifies standardized methods for measuring the characteristics
    of grid square statistics. It includes the following objectives: To recommend
    standard methodologies to measure characteristics, such as errors and correlations,
    for establishing a common understanding of grid statistics produced by different
    organizations from a statistical perspective. To establish standardized procedures
    for assessing the accuracy of grid square statistics when converting between different
    grid coordinate systems with geometric shapes, using prorating methods based on
    grid area.'
