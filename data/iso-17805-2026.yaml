abstract:
- language: en
  script: Latn
  content: 'This document specifies procedures for sampling, capture and preservation of environmental DNA (eDNA) in aquatic environments, originating from organisms that are present or have recently been present in a water body, or whose DNA has been introduced to the water body through some mechanism. This document also specifies procedures for avoiding sample contamination and ensuring the integrity of environmental DNA during water filtration and sample preservation. It also specifies the required equipment and metadata reporting. This document excludes: methods for the collection of eDNA from biofilms, sediments or similar sample types; passive sampling methods; sampling designs.'
