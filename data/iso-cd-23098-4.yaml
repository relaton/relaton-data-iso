abstract:
- language: en
  script: Latn
  content: 'This document describes the supplement role for regulated service for
    sustainable mobility and transportation mobility monitoring and services by data
    sharing platform. It provides a paradigm describing: a) supplement role to the
    functional model described in ISO 23098-3. b) additional responsibilities of the
    regulators and authorities for regulated service. c) detail of these supplemental
    responsibilities of the regulators and authorities. This document supplement to
    the responsibilities of regulators and authorities for regulated service, other
    than the responsibilities described in ISO 23098-3. In-vehicle control system
    is not in scope of this document.'
