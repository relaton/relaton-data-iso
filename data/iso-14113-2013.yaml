abstract:
- language: en
  script: Latn
  content: ISO 14113:2013 specifies requirements for rubber and plastics hose and
    hose assemblies for use with compressed, liquefied, and dissolved gases up to
    a maximum working pressure of 450 bar (45 MPa), within the ambient temperature
    range of −20 °C to +60 °C. It applies to hose assemblies used to connect industrial
    gas cylinders to manifolds or bundles prior to any pressure reduction stage. It
    does not cover rubber or thermoplastic hoses for welding, cutting, and allied
    processes (see ISO 3821 and ISO 12170). It does not apply to refrigerated liquefied
    gases or to liquefied petroleum gases (LPG).
