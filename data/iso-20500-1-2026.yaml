abstract:
- language: en
  script: Latn
  content: This document specifies the common safety requirements for mobile road
    construction machinery. The ISO 20500 series is applicable to mobile road construction
    machinery as listed in Annex A. NOTE 1        For travelling on public roads,
    the national roading regulations apply (e.g. braking, steering, lighting). This
    document deals with significant hazards, hazardous situations and events relevant
    to mobile road construction machinery, when used as intended and under conditions
    foreseen, but also taking into account any reasonably foreseeable misuse thereof
    (see Annex I). NOTE 2        The requirements specified in this document are common
    to two or more families of mobile road construction machinery. This document gives
    the common safety requirements for mobile road construction machinery and is intended
    to be used in conjunction with ISO 20500-2 to ISO 20500-7. These machine specific
    parts (ISO 20500-2 to ISO 20500-7) do not repeat the requirements from this document
    but supplement or modify the requirements for the family in question. This document
    does not deal with hazards related to transport of dangerous goods by road. Lightning
    as a significant and relevant hazard is not covered in this document. This document
    specifies the appropriate technical measures to eliminate or reduce risks arising
    from the significant hazards as specified in Annex I. This document is not applicable
    to mobile road construction machinery manufactured before the date of its publication.
    As a general principle, dimensions are used according to ISO 3411:2007 in order
    to cover 5 to 95 percentile of machine operators.
