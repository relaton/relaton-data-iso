abstract:
- language: en
  script: Latn
  content: This part of ISO/IEC 9072 defines a Remote Operation (RO-) notation for
    defining the services provided to interactive applications. This part of ISO/IEC 9072
    also defines the services provided by the Remote Operation Service Element (ROSE)
    services. The ROSE services are provided by the use of the ROSE protocol (part 2
    of ISO/IEC 9072) in conjunction with the Association Control Service Element (ACSE)
    services (ISO 8649) and the ACSE protocol (ISO 8650), optionally the Reliable
    Transfer Service Element (RTSE) services (ISO/IEC 9066-1) and the RTSE protocol
    (ISO/IEC 9066-2), and the presentation-service (ISO 8822). No requirement is made
    for conformance to this part of ISO/IEC 9072.
