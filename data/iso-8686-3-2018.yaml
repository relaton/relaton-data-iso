abstract:
- language: en
  script: Latn
  content: This document establishes the application of ISO 8686-1 to tower cranes
    for construction work as defined in ISO 4306-3, and gives specific requirements
    and values for factors to be used at the structural calculation. Tower cranes
    for construction work are exclusively equipped with a hook as the load-handling
    device. For tower cranes intended to be used for other purposes and/or with other
    load-handling devices, other values can be necessary according to the tower crane
    usage specification.
