abstract:
- language: en
  script: Latn
  content: 1.1 This part of ISO/IEC 6523 specifies a structure for globally and unambiguously
    identifying organizations, and parts thereof, for the purpose of information interchange.
    This part of ISO/IEC 6523 also makes recommendations regarding cases where prior
    agreements may be concluded between interchange partners. 1.2 This part of ISO/IEC
    6523 does not specify file organization techniques, storage media , languages,
    etc. to be used in its implementation.
