abstract:
- language: en
  script: Latn
  content: ISO 2819:2017 specifies methods of checking the adhesion of electrodeposited
    and chemically deposited coatings. It is limited to tests of a qualitative nature.
    ISO 2819:2017 does not describe certain tests that have been developed at various
    times to give a quantitative measure of adhesion of metallic coating to a substrate,
    since such tests require special apparatus and considerable skill in their performance
    which renders them unsuitable as quality control tests for production parts. Some
    of these quantitative tests can, however, be useful in research and development
    work.
