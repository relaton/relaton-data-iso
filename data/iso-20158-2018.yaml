abstract:
- language: en
  script: Latn
  content: This document describes test methods for determining water absorption time
    and water absorption capacity of all textile fabrics designed to absorb water.
    Such fabrics are commonly used in products such as cloths and mops for cleaning
    tasks. This method is especially applicable to fabrics such as waffle, chamois,
    bubble looped, checkered, terry looped, and multilayer textile materials.
