abstract:
- language: en
  script: Latn
  content: ISO 13628-2:2006 defines the technical requirements for safe, dimensionally
    and functionally interchangeable flexible pipes that are designed and manufactured
    to uniform standards and criteria. Minimum requirements are specified for the
    design, material selection, manufacture, testing, marking and packaging of flexible
    pipes, with reference to existing codes and standards where applicable. ISO 13628-2:2006
    applies to unbonded flexible pipe assemblies, consisting of segments of flexible
    pipe body with end fittings attached to both ends. ISO 13628-2:2006 applies to
    both static and dynamic flexible pipes used as flowlines, risers and jumpers.
    The applications addressed by this ISO 13628-2:2006 are sweet and sour service
    production, including export and injection applications for production products
    including oil, gas, water and injection chemicals. ISO 13628-2:2006 does not cover
    flexible pipes of bonded structure or flexible pipe ancillary components or to
    flexible pipes for use in choke-and-kill line applications. ISO 13628-2:2006 does
    not apply to flexible pipes that include non-metallic tensile armour wires.
