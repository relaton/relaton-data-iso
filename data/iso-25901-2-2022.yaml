abstract:
- language: en
  script: Latn
  content: "  This document contains terms and definitions applicable to health and
    safety in welding and allied processes. It is intended to be referenced in other
    documents dealing with this subject. In the main body of this document, terms
    are arranged in systematic order. Indexes are included at the end of this document
    in which all terms are listed alphabetically in English, French and German, respectively,
    with reference to the appropriate term numbers and translations of the terms in
    the other two languages. NOTE: In addition to text written in the official ISO
    languages (English and French), this document gives text in German. This text
    is published under the responsibility of the member body for Germany (DIN) and
    is given for information only. Only the text given in the official languages can
    be considered as ISO text."
