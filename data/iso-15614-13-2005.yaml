abstract:
- language: en
  script: Latn
  content: 'ISO 15614-13:2005 specifies the tests which should be used for qualification
    of welding procedure specifications. It applies to resistance butt welding and
    flash welding of metallic materials, e.g. with solid, tubular, flat or circular
    cross-section. The basic principles of ISO 15614-13:2005 may be applied to other
    resistance welding processes when this is specified in the specification. ISO
    15614-13:2005 defines the conditions for carrying out tests and the limits of
    validity of a qualified welding procedure for all practical welding operations
    covered by ISO 15614-13:2005. ISO 15614-13:2005 covers the following resistance
    welding processes as defined in ISO 4063: 24 flash welding using direct current
    or alternating current with various movement sequences, constant flashing and
    pulsed flashing; 25 resistance butt welding, using direct current or alternating
    current with various pressure sequences.'
