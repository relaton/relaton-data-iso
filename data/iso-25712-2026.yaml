abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the total content (solvent
    extractable) of melamine in chemicals for the leather tanning industry. This method
    requires the use of liquid chromatography (LC) with a triple quadrupole mass spectrometer
    (MS/MS), an ultraviolet (UV) detector, or diode array detector (DAD) to identify
    and quantify the melamine.
