abstract:
- language: en
  script: Latn
  content: ISO 13383-2:2012 specifies a manual method of making measurements for the
    determination of the volume fraction of major phases in fine ceramics (advanced
    ceramics, advanced technical ceramics) using micrographs of polished and etched
    sections, overlaying a square grid of lines, and counting the number of intersections
    lying over each phase. The method applies to ceramics with one or more distinct
    secondary phases, such as found in Al2O3/ZrO2, Si/SiC, or Al2O3/SiCw. If the test
    material contains discrete pores, these are to be treated as a secondary phase
    for the purpose of this method, provided that there is no evidence of grain pluck-out
    during polishing being confused with genuine pores.
