abstract:
- language: en
  script: Latn
  content: ISO 19901-4:2003 contains requirements and recommendations for those aspects
    of geoscience and foundation engineering that are applicable to a broad range
    of offshore structures, rather than to a particular structure type. Such aspects
    are site characterization, soil and rock characterization, and design and installation
    of foundations supported by the seabed (shallow foundations) and the identification
    of hazards. Aspects of soil mechanics and foundation engineering that apply equally
    to offshore and onshore structures are not addressed. The user of this part of
    ISO 19901-4:2003 is expected to be familiar with such aspects.
