abstract:
- language: en
  script: Latn
  content: ISO/TS 15926-8:2011 is a specification for data exchange and life-cycle
    information integration using Resource Description Framework (RDF) and Web Ontology
    Language (OWL). ISO/TS 15926-8:2011 provides rules for implementing the upper
    ontology specified by ISO 15926-2 and the template methodology specified by ISO
    15926-7 into the RDF and OWL languages, including models for reference data as
    specified by ISO/TS 15926-3 and ISO/TS 15926-4, and for metadata. The electronic
    files attached to ISO/TS 15926-8:2011 provide the OWL declarations, together with
    example instance data.
