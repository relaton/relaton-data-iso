abstract:
- language: en
  script: Latn
  content: This document specifies guidance for the development of standards and specifications
    covering plastics waste recovery, including recycling. The document establishes
    the different options for the recovery of plastics waste arising from post-industrial
    and post-consumer sources as illustrated diagrammatically in Annex A. Consequently,
    the process stages, steps, and terminology presented in this document are intended
    to be of general applicability presented in Annex B.
