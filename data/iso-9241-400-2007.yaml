abstract:
- language: en
  script: Latn
  content: 'ISO 9241-400:2006 gives guidelines for physical input devices for interactive
    systems. It provides guidance based on ergonomic factors for the following input
    devices: keyboards, mice, pucks, joysticks, trackballs, trackpads, tablets and
    overlays, touch sensitive screens, styli, light pens, voice controlled devices,
    and gesture controlled devices. It defines and formulates ergonomic principles
    valid for the design and use of input devices. These principles are to be used
    to generate recommendations for the design of products and for their use. It also
    defines relevant terms for the entire 400 series of ISO 9241. For some applications,
    e.g. in areas where safety is the major concern, other additional principles may
    apply and take precedence over the guidance given here. ISO 9241-400:2006 also
    determines properties of input devices relevant for usability including functional,
    electrical, mechanical, maintainability and safety related properties. Additionally
    included are aspects of interdependency with the use environment and software.'
