abstract:
- language: en
  script: Latn
  content: This document specifies the dimensions and tolerances of guide pillars,
    type A, intended for use in press tools. These guide pillars can be straight,
    type A1, or straight with end-locking and locking ring, type A2. This document
    gives guidance on the materials and specifies the hardness and the designation
