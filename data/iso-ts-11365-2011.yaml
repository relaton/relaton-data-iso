abstract:
- language: en
  script: Latn
  content: ISO/TS 11365:2011 applies to the use of triaryl phosphate esters as fire-resistant
    fluids for turbine control and other hydraulic systems in power generation. ISO/TS
    11365:2011 is intended to help power equipment operators appreciate the important
    properties of triaryl phosphate esters; provide information on their safe handling,
    storage and use. ISO/TS 11365:2011 addresses the causes of fluid deterioration
    and sets out procedures for examining consignments of new fluid, for monitoring
    the fluid in use and for maintaining an adequate fluid condition.
