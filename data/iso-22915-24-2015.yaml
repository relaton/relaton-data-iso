abstract:
- language: en
  script: Latn
  content: 'ISO 22915-24:2015, together with ISO 22915‑1, specifies the tests for
    verifying the stability of slewing variable-reach rough-terrain trucks (hereafter
    also referred to as trucks), equipped with fork arms or with load carrying or
    non-load carrying attachments. It is not applicable to those trucks equipped with
    the following: - integrated and non-integrated personnel work platforms; - tracks;
    - equipment to operate on rails.'
