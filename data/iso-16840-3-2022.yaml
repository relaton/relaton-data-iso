abstract:
- language: en
  script: Latn
  content: This document specifies requirements for static, impact, and repetitive
    load strengths for postural support devices (PSDs) with associated attachment
    hardware intended for use with an undefined wheelchair seating system. It specifies
    the test methods for determining whether the minimum performance requirements
    have been met to release a product into use. It also specifies requirements for
    disclosure of the test results. Not all tests apply to all PSDs. This document
    is also applicable to other seating systems. The test methods can be used to verify
    the manufacturer’s claims that a product meets the requirements of this document.
    This document does not apply to PSDs that are designed to fail under certain static,
    dynamic, or repetitive loads. This document does not apply to the strength of
    PSDs under crash conditions in a motor vehicle. This document does not evaluate
    long-term useful life. NOTE 1   ISO 16840‑4 provides crash test methods and requirements
    for wheelchair seating systems when used as part of a wheelchair seat in a motor
    vehicle. NOTE 2   For user masses greater or less than those specified in this
    document, appropriate extrapolation of test apparatus dimensions, mounting point
    separation, forces, etc. can be carried out, and the test parameters noted in
    the test report. NOTE 3   Rigid surrogate test fixtures are utilized to provide
    a standardized test method, and consequently this document does not involve a
    test of a PSD on a particular wheelchair.
