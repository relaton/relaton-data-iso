abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and recommendations for the design,
    use and siting of mobile booths for simultaneous interpreting. The main features
    of mobile booths that distinguish them from permanent booths are that they can
    be dismantled, moved and set up in a room. This document also ensures the usability
    and accessibility of booths for all interpreters. This document is to be used
    in conjunction with ISO 20109, which contains requirements and recommendations
    for the equipment necessary for simultaneous interpreting. For requirements and
    recommendations for mobile booths which do not have a direct view of a room, see
    ISO 17651-3.[1] [1]  Under preparation. Stage at the time of publication: ISO/CD
    17651-3.2:2024.'
