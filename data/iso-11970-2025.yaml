abstract:
- language: en
  script: Latn
  content: This document specifies how a welding procedure specification (WPS) for
    production welding of steel castings is qualified. Tests are intended to be carried
    out in accordance with this document, unless additional tests are specified by
    the purchaser or by agreement between the contracting parties. This document defines
    the conditions for the execution of welding procedure qualification tests and
    the limits of validity of a qualified welding procedure for all practical welding
    operations within the range of essential variables. This document applies to the
    arc welding of steel castings. The principles of this document can be applied
    to other fusion welding processes subject to agreement between the contracting
    parties.
