abstract:
- language: en
  script: Latn
  content: ISO 4996:2014 applies to hot-rolled steel sheet of high yield stress structural
    quality with the use of microalloying elements. The product is intended for structural
    purposes where particular mechanical properties are required. It is generally
    used in the delivered condition and is intended for structures that may include
    bolting, riveting and welding. ISO 4996:2014 is not applicable to steels intended
    for boilers or pressure vessels, steels designated as commercial quality or drawing
    quality (covered by ISO 3573), steels to be re-rolled to cold-reducing products,
    steels designated as weathering steels, having increased atmospheric corrosion
    resistance, or steels having improved formability properties compared with those
    covered by it.
