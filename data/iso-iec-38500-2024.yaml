abstract:
- language: en
  script: Latn
  content: 'This document provides guiding principles for members of governing bodies
    of organizations and those that support them on the effective, efficient and acceptable
    use of information technology (IT) within their organizations. This document is
    applicable to: —     the governance of the organization’s current, and future,
    use of IT; —     the governance of IT as a domain of governance of organizations.
    In terms of audience, this document is applicable to: —     all organizations,
    including public and private companies, government entities, and not-for-profit
    organizations; —     organizations of all sizes, from the smallest to the largest,
    regardless of the extent of their use of IT.'
