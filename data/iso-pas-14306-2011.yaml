abstract:
- language: en
  script: Latn
  content: ISO/PAS 14306:2011 defines the syntax and semantics of the JT Version 8.1
    file format. The JT format is an industry focused, high-performance, lightweight,
    flexible file format for capturing and repurposing three-dimensional product definition
