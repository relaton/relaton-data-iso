abstract:
- language: en
  script: Latn
  content: ISO/TR 52018-2:2017 refers to ISO 52018‑1. ISO 52018‑1 gives a succinct
    enumeration of possible requirements related to thermal energy balance features
    and to fabric features. It also provides tables for regulators to report their
    choices in a uniform manner. ISO/TR 52018-2:2017 provides many background considerations
    that can help both private actors and public authorities, and all stakeholders
    involved, to take informed decisions. ISO/TR 52018-2:2017 does not contain any
    normative provision.
