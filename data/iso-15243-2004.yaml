abstract:
- language: en
  script: Latn
  content: ISO 15243:2004 defines, describes and classifies the characteristics, changes
    in appearance and possible causes of failure of rolling bearings, occurring in
    service. It will assist in the understanding of the various forms of change in
    appearance and the failure that has occurred. Consideration is restricted to characteristic
    forms of change in appearance and failure, which have a well-defined appearance
    and which can be attributed to particular causes with a high degree of certainty.
    The features of particular interest for explaining changes and failures are described.
    The various forms are illustrated with photographs and diagrams, and the most
    frequent causes are indicated. The failure mode designations shown in the subclause
    titles are recommended for general use, but similar expressions or synonyms are
    given within parentheses below the titles. Examples of rolling bearing failures
    are given, together with a description of the causes of failure and proposed corrective
    actions.
