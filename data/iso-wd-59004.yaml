abstract:
- language: en
  script: Latn
  content: This document defines key terms, establishes a vision and principles for
    a circular economy, and gives guidance, including possible actions, for an organization
    to implement. It is applicable to organizations seeking to understand and commit
    or contribute to a circular economy while contributing to sustainable development.
    These organizations can be either private or public, acting individually or collectively,
    regardless of type or size, and located in any jurisdiction, or position within
    a specific value chain or value network.
