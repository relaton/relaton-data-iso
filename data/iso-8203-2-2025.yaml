abstract:
- language: en
  script: Latn
  content: This document describes procedures for mechanized ultrasonic testing of
    FRP composite materials using array probes in conjunction with the application
    of synthetic focusing signal processing algorithms, as well as testing using air-coupled
    ultrasonic probes and the evaluation of the test result. This document is intended
    for array ultrasonic testing (A-UT) and for air-coupled ultrasonic testing (AC-UT)
    techniques applied to non-destructive testing of carbon fibre-reinforced plastic
    (CFRP) and glass fibre-reinforced plastic (GFRP) composites with thermoset or
    thermoplastic matrices. The procedures are primarily intended for inspection of
    continuous unidirectional or multidirectional composites; however, this does not
    exclude their use on other formats of structural composites including woven and
    stitched fabrics and pultrusions. The techniques contained within this document
    are intended to be used on flat, plane test objects where the material thickness
    differs by less than 20 %. This document addresses ultrasonic testing via contact
    or immersion techniques using ultrasonic array probes as well as testing in pitch-catch
    or through-transmission technique using single element air-coupled ultrasonic
    probes.
