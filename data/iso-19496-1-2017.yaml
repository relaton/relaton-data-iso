abstract:
- language: en
  script: Latn
  content: ISO 19496-1:2017 defines a number of terms relating to vitreous and porcelain
    enamels and their technology. This list is not complete and only comprises those
    terms for which the definition is considered necessary for correct and adequate
    understanding in order to clarify these processes. The interpretations given are
    those corresponding to the practical usage in this field and they do not necessarily
    coincide with those used in other fields. For purposes of clarification, the term
    "vitreous enamel", used throughout this document, is synonymous with "porcelain
    enamel", the term favoured in the United States and some other countries.
