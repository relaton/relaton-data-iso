abstract:
- language: en
  script: Latn
  content: ISO 21329:2004 specifies requirements and provides guidance for the testing
    of mechanical connectors for use in pipeline transportation systems for the petroleum
    and natural gas industries as defined in ISO 13623. The tests specified in ISO
    21329:2004 are intended to form part of the design verification process for connectors.
    They provide objective evidence that connectors conform to a defined performance
    envelope. ISO 21329:2004 does not cover the use of design procedures as part of
    the qualification process for mechanical connectors, nor does it address fabrication
    and quality control. However, it can be used as input to a qualification procedure.Although
    its principles can be applied, ISO 21329:2004 does not address a) connectors that
    are designed to rotate in use, b) manifolds, c) topsides pipework or piping, d)
    flanges, e) connectors used in pipelines installed by reeling or J-tube pulls,
    f) factory acceptance testing, g) statistical bases for risk analysis.
