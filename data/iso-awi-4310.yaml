abstract:
- language: en
  script: Latn
  content: ISO 4310:2009 specifies tests, inspections and procedures for verifying
    the conformance of a crane with its operational specifications and capability
    to lift rated loads (see ISO 7363). ISO 4310:2009 is applicable to the types of
    cranes designated in ISO 4306-1, prior to first use following manufacture or after
    modification or repair of the load‑bearing structure or a component of an individual
    crane. Where rated loads are governed by stability, a test procedure and test
    load are specified that permit stability margins to be easily verified.
