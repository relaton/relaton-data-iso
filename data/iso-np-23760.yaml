abstract:
- language: en
  script: Latn
  content: 'This document specifies technical safety requirements and protective measures
    to be adopted by persons undertaking the design, manufacture and supply of folding
    and longbending machines which are designed to work cold metal or material partly
    of metal and hereafter referred to as machines. This document also covers folding
    and longbending machines, whose primary intended use is the cold working of metal,
    which are to be used in the same way to work other sheet materials such as cardboard
    or plastic. The requirements in this standard take account of intended use, including
    reasonably foreseeable misuse as defined in 3.24 of ISO 12100:2010. This document
    presumes access to the press brake from all directions, deals with the hazards
    described in Clause 4, and specifies the safety measures for both the operator
    and other exposed persons. This document also applies to: - ancillary devices
    which are an integral part of the press brake, e.g. back gauges and cutting devices;
    - machines which are integrated into an automatic production line where the hazards
    and risk arising are comparable to those of machine working separately. The requirements
    of this document apply to all folding and longbending machines whatever the technology
    used in their control system, e.g. electromechanical and/or electronic or pneumatic.
    This document is not applicable to folding and longbending machines manufactured
    before the date of its publication. This document does not cover the safety aspect
    of automatic loading and unloading equipment. Some guidance how to take into account
    additional automatic loading and unloading equipment can be found in ISO 11161:2007.'
