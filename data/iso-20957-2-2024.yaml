abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements for stationary strength training
    equipment, in addition to the general safety requirements of ISO 20957-1:2013.
    This document is applicable to stationary strength training equipment with stacked
    weight resistance or alternative means of resistance, such as elastic cords, hydraulic,
    pneumatic, electrical, magnetic, springs and externally loaded weights (hereinafter
    referred to as stationary training equipment) with the classes H, S and I according
    to ISO 20957-1:2013. NOTE            Accuracy classes are not applicable to this
    type of stationary training equipment as accuracy classes do not affect the safety
    of this equipment.
