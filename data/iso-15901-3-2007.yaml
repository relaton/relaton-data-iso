abstract:
- language: en
  script: Latn
  content: ISO 15901-3:2007 describes methods for the evaluation of the volume of
    micropores (pores of internal width less than 2 nm) and the specific surface area
    of microporous material by low-temperature adsorption of gases These are comparative,
    non-destructive tests. The methods use physisorbing gases that can penetrate into
    the pores under investigation. The method is applicable to isotherms of type I,
    II, IV or VI of the IUPAC classification (see ISO 15901-2:--, Figure 1, and ISO
    9277). The methods in ISO 15901-3:2007 are not applicable when chemisorption or
    absorption takes place.
