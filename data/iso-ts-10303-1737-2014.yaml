abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1737:2014-02 specifies the application module for Printed
    physical layout template. The following are within the scope of ISO/TS 10303-1737:2014-02:
    templates for simple and complex microwave structures; templates for simple and
    complex embedded passive structures; terminals for access to the template functionality;
    surface and cross section terminal representations; single and mult-layer template
    structures; printed connector template definition; definition of the connections
    provided by the template where more than one template terminal has the same signal
    name; mapping between the functional view terminals and the layout view template
    terminals; transmission line cross section template structures; items within the
    scope of application module Functional usage view, ISO/TS 10303-1705; items within
    the scope of application module Layered interconnect complex template, ISO/TS
    10303-1716.'
