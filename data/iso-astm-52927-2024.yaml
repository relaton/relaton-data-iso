abstract:
- language: en
  script: Latn
  content: This document specifies the principal requirements applied to the testing
    of parts produced by additive manufacturing processes. This document —     identifies
    quality characteristics for feedstock and parts and the corresponding test procedures,
    —     provides the specific procedures to build specimens using additive manufacturing
    process, and —     recommends the scope and content of test and supply agreements.
    This document is aimed at machine manufacturers, feedstock suppliers, AM system
    users, part providers, and customers to facilitate the communication on main quality
    characteristics. It applies wherever additive manufacturing processes are used.
    NOTE            It is the intent to include, in future versions of this document,
    other characteristics such as thermal properties, electrical requirements and
    physical and physico-chemical properties based upon material types.
