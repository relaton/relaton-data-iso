abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1797:2018-11 specifies the application module for Kinematic
    structure. The following are within the scope of ISO/TS 10303-1797:2018-11: representation
    of kinematic mechanisms; items within the scope of application module Assembly
    structure, ISO/TS 10303-1026; items within the scope of application module Basic
    curve, ISO/TS 10303-1651; items within the scope of application module Composite
    surface, ISO/TS 10303-1525; items within the scope of application module Geometric
    model relationship, ISO/TS 10303-1403; items within the scope of application module
    Kinematic topology, ISO/TS 10303-1799; items within the scope of application module
    Shape property assignment, ISO/TS 10303-1032.'
