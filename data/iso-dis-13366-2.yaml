abstract:
- language: en
  script: Latn
  content: This document gives guidance on the operating conditions for counting the
    total number of somatic cells, in both raw and chemically preserved milk, using
    flow cytometers. The guidance is applicable to the counting of somatic cells in
    raw cow milk. The guidance is also applicable to raw milk of other species, such
    as goat, sheep and buffalo, if the specified prerequisites are met.
