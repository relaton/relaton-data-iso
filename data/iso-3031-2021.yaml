abstract:
- language: en
  script: Latn
  content: This document specifies the boundary dimensions and tolerances for thrust
    needle roller and cage assemblies. Furthermore, it recommends dimensions and tolerances
    for thrust washers, i.e. raceway members, which can be used either as shaft or
    housing washers. Annex A gives general characteristics for application of thrust
    needle roller and cage assemblies and thrust washers. Gauging method for thrust
    needle roller and cage assemblies and thrust washers is given in Annex B.
