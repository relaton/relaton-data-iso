abstract:
- language: en
  script: Latn
  content: This document gives guidance on programme management. It is applicable
    to any type of organization including public or private and any size or sector,
    as well as any type of programme in terms of complexity. This document provides
    high-level descriptions of relevant terms, definitions, concepts, prerequisites
    and practices, including roles and responsibilities that form good practice in
    programme management. It does not provide guidance on processes, methods and tools.
