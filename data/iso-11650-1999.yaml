abstract:
- language: en
  script: Latn
  content: This International Standard specifies the test apparatus, test gas mixtures,
    sampling procedures and analytical techniques used to determine the performance
    of refrigerant recovery and/or recycling equipment (hereinafter, "equipment").
    This International Standard also specifies the refrigerants to be used for the
    evaluation of equipment, i.e. halogenated hydrocarbon refrigerants and blends
    containing halogenated hydrocarbons. This International Standard is not intended
    for use as a guide in defining the maximum levels of contaminants in recycled
    refrigerants used in various applications. This International Standard is not
    intended to define safety requirements. It is strongly recommended that the product
    be designed, constructed, assembled, and installed in accordance with recognized
    safety requirements.
