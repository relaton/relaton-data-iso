abstract:
- language: en
  script: Latn
  content: ISO 10907-1:2008 specifies the basic dimensions and tolerances, in millimetres,
    of locating rings for mounting of moulds (see Figure 1) without thermal insulating
    sheets, suitable for injection moulding machines up to size E12 (according to
    EUROMAP 2), type A (with bore) and type B (without bore). It also gives material
    guidelines and hardness requirements, and specifies the designation of locating
    rings that are in accordance with its specifications.
