abstract:
- language: en
  script: Latn
  content: La présente Norme Internationale spécifie des exigences minimales et donne
    des recommandations pour la conception, la fabrication, les essais et la documentation
    des vannes à tournant sphérique, clapets de retenue et robinets-vannes prévus
    pour des applications immergées dans les systèmes de conduites sous-marines satisfaisant
    aux exigences de l'ISO 13623 applicable aux Industries du Pétrole et du Gaz Naturel.
    Les vannes pour des classes de pression excédant PN 420 (classe 2500) ne sont
    pas couvertes par la présente Norme Internationale. L'Annexe A de la présente
    Norme Internationale présente des lignes directrices pour aider les acheteurs
    à sélectionner le type de vanne et à spécifier les exigences particulières lors
    d'une commande de vannes. L'Annexe B de la présente Norme Internationale présente
    une liste résumée des informations que le fabricant et/ou l'acheteur doivent fournir
    lors d'une commande de vannes.
