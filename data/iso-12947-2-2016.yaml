abstract:
- language: en
  script: Latn
  content: ISO 12947-2:2016 specifies the procedure for the determination of specimen
    breakdown (end-point of test) by inspection at fixed intervals and is applicable
    to all textile fabrics including nonwovens apart from fabrics where the specifier
    indicates the end performance as having a low abrasion wear life. It is not applicable
    to coated fabrics (including laminated fabrics). If the abrasion behaviour of
    the coated surface of a coated fabric is to be determined, use the methods described
    in the various parts of ISO 5470.
