abstract:
- language: en
  script: Latn
  content: This document specifies a test method for determining the liquid tightness
    of clothing for protection against rain, using a static manikin exposed to large
    amount of high energy droplets from above. It is applicable to the testing of
    jackets, trousers, coats and one- or two-piece suits. This document is not applicable
    to the testing of garments for resistance to other weather conditions, e.g. snow,
    hail-, or strong winds. NOTE            For general background of the rain simulation,
    see Annex A.
