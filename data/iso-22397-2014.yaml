abstract:
- language: en
  script: Latn
  content: ISO 22397:2014 provides guidelines for establishing partnering arrangements
    among organizations to manage multiple relationships for events impacting on societal
    security. It incorporates principles and describes the process for planning, developing,
    implementing and reviewing partnering arrangements. ISO 22397:2014 is applicable
    to all organizations regardless of type, size and nature of activity whether in
    or between the private, public, or not-for-profit sectors.
