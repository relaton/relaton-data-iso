abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of hexagon socket set screws
    with truncated cone point, with metric coarse pitch threads M1,6 to M30 for steel
    and M1,6 to M24 for stainless steel, and with product grade A. Set screws are
    not intended for use under tensile load. If in certain cases other specifications
    are requested, hardness classes and stainless steel grades can be selected from
    ISO 898-5 or ISO 3506-3, and dimensional options from ISO 888, ISO 965-1 or ISO
    4753.
