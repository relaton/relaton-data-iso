abstract:
- language: en
  script: Latn
  content: This document specifies the technical delivery requirements for —    semi-finished
    products, hot formed (e.g. blooms, billets, slabs) (see NOTE 1), —    bars (see
    NOTE 1), —    wire rod, —    finished flat products, and —    hammer or drop forgings
    (see NOTE 1) manufactured from the case-hardening non-alloy or alloy steels listed
    in Table 3 and supplied in one of the heat-treatment conditions given for the
    different types of products in Table 1 and in one of the surface conditions given
    in Table 2. The steels are, in general, intended for the manufacture of case-hardened
    machine parts. NOTE 1   Hammer-forged semi-finished products (blooms, billets,
    slabs, etc.), seamless rolled rings and hammerforged bars are covered under semi-finished
    products or bars and not under the term “hammer and drop forgings”. NOTE 2   For
    International Standards relating to steels conforming with the requirements for
    the chemical composition in Table 3, however, supplied in other product forms
    or treatment conditions than given above or intended for special applications,
    and for other related International Standards, see the Bibliography.
