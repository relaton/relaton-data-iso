abstract:
- language: en
  script: Latn
  content: This document specifies the minimum functional safety requirements for
    rear load carriers intended for attachment on the rear of passenger cars and light
    commercial vehicles with a maximum gross weight up to 3,5 t as defined in ISO 1176.
    This document does not apply to incomplete and supplemental rear load carriers.
    This document establishes technical specifications and test methods that offer
    both road users and users of the rear load carriers a minimum level of functional
    safety when the rear load carriers are being used in accordance with the manufacturer’s
    instructions. Moreover, the requirements of this document complement the directives
    from UNECE‑R 26 and its successive amendments concerning these products.
