abstract:
- language: en
  script: Latn
  content: 'ISO 11011:2013 sets requirements for conducting and reporting the results
    of a compressed air system assessment that considers the entire system, from energy
    inputs to the work performed as the result of these inputs. ISO 11011:2013 considers
    compressed air systems as three functional subsystems: supply which includes the
    conversion of primary energy resource to compressed air energy; transmission which
    includes movement of compressed air energy from where it is generated to where
    it is used; demand which includes the total of all compressed air consumers, including
    productive end-use applications and various forms of compressed air waste. ISO
    11011:2013 sets requirements for analysing the data from the assessment, reporting
    and documentation of assessment findings, and identification of an estimate of
    energy saving resulting from the assessment process. ISO 11011:2013 identifies
    the roles and responsibilities of those involved in the assessment activity.'
