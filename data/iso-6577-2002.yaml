abstract:
- language: en
  script: Latn
  content: ISO 6577 specifies requirements for nutmeg, whole or broken, and for mace,
    whole or in pieces, obtained from the nutmeg tree (Myristica flagrans Houtt.)
    for wholesale commercial purposes. NOTE As nutmeg and mace are obtained from the
    same plant, it was considered preferable to give the specifications for these
    two spices in one International Standard. It does not apply to Papua-type nutmeg
    and mace (Myristica argentea Warburg). Recommendations relating to storage and
    transport conditions are given in annex A.
