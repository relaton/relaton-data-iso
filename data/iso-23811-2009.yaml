abstract:
- language: en
  script: Latn
  content: ISO 23811:2009 specifies a simple practical method for calculating the
    non-volatile matter by volume, NVV, of a coating material from the non-volatile-matter
    content, NV, the density of the coating material and the density of the solvents.
    Using the non-volatile matter by volume results and the density obtained in accordance
    with ISO 23811:2009, it is possible to calculate the theoretical spreading rate
    of a coating material. ISO 23811:2009 is not applicable to coating materials which
    exceed the critical pigment volume concentration (CPVC).
