abstract:
- language: en
  script: Latn
  content: This document provides definitions, guidelines and supporting information
    for evaluating and reporting (with respect to the basic design items ongoing,
    and the operational results of a reference plant or unit as feedback) to ensure
    the (designed) performance of a PCC plant integrated with a host power plant.
    The PCC plant separates CO2 from the power plant flue gas in preparation for subsequent
    transportation and geological storage. The physical system being addressed is
    a single power plant, with an optional auxiliary unit to provide thermal energy
    required for the PCC plant, and a single PCC plant as described in ISO 27919-1.
    The formulas and methods to assure and maintain reliable performance, presented
    in this document, describe issues addressed during the design and construction
    phases and practices that document reliability and availability during routine
    operation. These practices would also guide ongoing maintenance programmes. This
    document does not provide guidelines for benchmark, comparison or assessment studies
    for PCC plant operations using different capture technologies (i.e. absorbents),
    nor does it specify appropriate operating conditions such as temperature etc.
