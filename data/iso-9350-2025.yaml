abstract:
- language: en
  script: Latn
  content: 'This document specifies: a)       the determination of mass gain; b)      
    the surface inspection of products of hafnium when corrosion tested in water at
    360 °C. This document is applicable to hot-work or cold-work hafnium rods, wires,
    plates, sheets and strips. This method has been widely used in the development
    of hafnium products. It is applicable for use in its entirety to the extent specified
    for a product acceptance test, rather than merely a means of assessing performance
    in service of pressurized water reactor.'
