abstract:
- language: en
  script: Latn
  content: This document specifies the execution, validation, verification and documentation
    of a numerical welding simulation within the field of computational welding mechanics
    (CWM) and performed with a scientific computational tool (SCT). This document
    is applicable to the thermal and mechanical finite element analysis (FEA) of arc,
    laser and electron beam welding processes for the purpose of calculating the effects
    of welding processes, and in particular, residual stresses and distortion, in
    support of structural integrity assessment.
