abstract:
- language: en
  script: Latn
  content: ISO 6887-6:2013 specifies rules for the preparation of samples taken at
    all stages from the farm to the slaughterhouse and their suspension for microbiological
    examination when the samples require different preparation from the methods described
    in ISO 6887-1. ISO 6887-6:2013 excludes the preparation of samples for both enumeration
    and detection test methods where preparation details are specified in the relevant
    International Standards. ISO 6887-6:2013 is applicable to various samples taken
    from the hatchery, the farm, from the vehicle or the animals during transportation,
    or from animals or their carcasses in the slaughterhouse, to indicate the microbiological
    status of the animals in relation to zoonotic agents. ISO 6887-6:2013 does not
    apply to samples taken to assess the hygiene of meat.
