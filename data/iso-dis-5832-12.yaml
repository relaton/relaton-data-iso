abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for two wrought cobalt 28-chromium
    6-molybdenum alloys used for surgical implants. The properties apply specifically
    to wrought bar, rod and wire. NOTE 1 The mechanical properties of a sample obtained
    from a finished product made of this alloy can differ from those specified in
    this document. NOTE 2 The high carbon content of this alloy produces a structure
    containing a significant carbide distribution. This can be adjusted either in
    the production of the bar or in subsequent thermomechanical processing to produce
    the final device. Carbide distribution in the final device is not included as
    part of this document.
