abstract:
- language: en
  script: Latn
  content: ISO 3107:2004 specifies the requirements and performance test methods for
    non-water-based zinc oxide/eugenol cements suitable for use in restorative dentistry
    for temporary cementation, for permanent cementation, for cavity liners and bases
    and as temporary restorations. ISO 3107:2004 is also applicable to non-eugenol
    cements containing zinc oxide and aromatic oils suitable for temporary cementation.
