abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the collection, preparation, preservation,
    transportation, storage, distribution and disposal of plant biological materials
    and associated data. This document is applicable only to biological material that
    can be used for further processing of biomolecules, e.g. nucleic acids, proteins
    and metabolites. This document is applicable to all organizations performing plant
    biobanking for research and development.
