abstract:
- language: en
  script: Latn
  content: 'ISO 18539:2015 specifies the information to be recorded in wild-caught
    molluscs supply chains in order to establish the traceability of products originating
    from wild-caught molluscs. It specifies how molluscan products traded are to be
    identified and the information to be generated and held on those products by each
    of the food businesses that physically trade them through the distribution chains.
    It is specific to the distribution for human consumption of molluscs and their
    products, from wild caught through to retailers or caterers. The types of businesses
    identified in ISO 18539:2015 for wild-caught molluscan distribution chains are
    the following: ? capture; ? landing business and first sale; ? depuration and
    shucking, etc.; ? processors; ? transporters and store operators; ? traders and
    wholesalers; ? retailers and caterers; ? logistics including materials brought
    from other domains. Any given molluscan distribution chain can be made up of some
    or all of the above components but not necessarily in the sequence listed.'
