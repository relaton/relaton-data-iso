abstract:
- language: en
  script: Latn
  content: This document specifies fuelling protocols for liquid hydrogen (LH2), defining
    the minimum design, installation and operation requirements for a safe, as well
    as fast, efficient and interoperable hydrogen transfer from the fuelling station
    to the vehicle fuel system. This document applies to land vehicles of all types
    equipped with a liquid hydrogen storage system in accordance with ISO 13985. The
    protocols described in this document are currently limited to vehicles with storage
    system total internal volume equal to or comprised between 0,6 m3 and 4 m3. The
    requirements specified in this document are also applicable to further hydrogen
    applications, however, further specific requirements that can be necessary for
    the safe operation of such fuelling are not addressed in this document. This document
    specifies the requirements for liquid hydrogen fuelling and dispensing systems,
    fuelling station - vehicle interface and vehicle storage system in order to minimise
    the risk of fire, explosion or any other hydrogen adverse effects to an acceptable
    level, especially during and after the fuelling process.
