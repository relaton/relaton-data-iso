abstract:
- language: en
  script: Latn
  content: ISO 19118:2005 specifies the requirements for defining encoding rules to
    be used for interchange of geographic data within the ISO 19100 series of International
    Standards. ISO 19118:2005 specifies requirements for creating encoding rules based
    on UML schemas,requirements for creating encoding services,an informative XML
    based encoding rule for neutral interchange of geographic data. ISO 19118:2005
    does not specify any digital media, it does not define any transfer services or
    transfer protocols, nor does it specify how to encode inline large images.
