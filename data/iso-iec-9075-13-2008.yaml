abstract:
- language: en
  script: Latn
  content: ISO/IEC 9075 defines the SQL language. The scope of the SQL language is
    the definition of data structure and the operations on data stored in that structure.
    ISO/IEC 9075-1:2008, ISO/IEC 9075-2:2008 and ISO/IEC 9075-11:2008 encompass the
    minimum requirements of the language. Other parts define extensions. ISO/IEC 9075-13:2008
    specifies the ability to invoke static methods written in the Java programming
    language as SQL-invoked routines and to use classes defined in the Java programming
    language as SQL structured user-defined types. (Java is a registered trademark
    of Sun Microsystems, Inc.)
