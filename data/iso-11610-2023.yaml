abstract:
- language: en
  script: Latn
  content: This document contains a list of terms which are frequently used in the
    standardization of protective clothing (5.1.4) and protective equipment worn on
    the body, including hand and arm protection and lifejackets, and definitions of
    these terms. The definitions are intended to support an unambiguous use of the
    terms listed. This document is intended to serve as a reference document for the
    Working Groups of CEN/TC 162 and ISO/TC 94/SC 13 to ascertain what definitions
    already exist and may be used for setting up new standards and to provide guidance
    in the elaboration of new definitions. NOTE - In addition to text written in the
    official ISO languages (English, French), this document gives text in German.
    This text is published under the responsibility of the Member Body for Germany
    (DIN) and is given for information only. Only the text given in the official lan­guages
    can be considered as ISO text.
