abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the machine manufacturer for
    preparation of the safety-relevant parts of an instruction handbook for machinery.
    This document: — provides further specifications to the general requirements on
    information for use given in ISO 12100:2010, 6.4.5; and — deals with the safety-related
    content, the corresponding structure and presentation of the instruction handbook,
    taking into account all phases of the life cycle of the machine. NOTE 1 The strategy
    for risk reduction at the machine is given in ISO 12100:2010, Clause 6, and includes
    inherently safe design measures, safeguarding and complementary risk reduction
    measures as well as information for use. NOTE 2 Annex A contains a correspondence
    table between ISO 12100:2010, 6.4, and this document. NOTE 3 Information for conception
    and preparation of instructions in general is available in IEC/IEEE 82079-1. This
    document establishes the principles which are indispensable to provide information
    on residual risks. This document does not address requirements for declaration
    of noise and vibration emissions. This document is not applicable to machinery
    manufactured before the date of its publication.'
