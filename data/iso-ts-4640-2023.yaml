abstract:
- language: en
  script: Latn
  content: This document gives guidance on substrate selection, storage and handling
    as well as essential characteristics of tensile bond strength test methods for
    quality testing of the adhesive bond between restorative dental materials and
    tooth structure, i.e. enamel and dentine. Some specific test methods for tensile
    bond strength measurements are given in Annex A. This document does not include
    requirements for components of adhesive materials and their performance.
