abstract:
- language: en
  script: Latn
  content: ISO 13756:2015 specifies a volumetric method for the determination of silver
    in silver jewellery alloys, preferably within the range of fineness stated in
    ISO 9202. These alloys may contain copper, zinc, cadmium, and palladium. Apart
    from palladium, which must be precipitated before commencing titration, these
    elements do not interfere with this method of determination. NOTE This method
    is an alternative recommended method to ISO 11427.
