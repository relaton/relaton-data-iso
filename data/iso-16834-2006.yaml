abstract:
- language: en
  script: Latn
  content: ISO 16834:2006 specifies requirements for classification of wire electrodes,
    wires, rods and weld deposits in the as-welded condition and in the post-weld
    heat-treated (PWHT) condition for gas-shielded metal arc welding and tungsten
    inert-gas welding of high strength steels with a minimum yield strength greater
    than 500 MPa, or a minimum tensile strength greater than 570 MPa. One wire electrode
    can be tested and classified with different shielding gases. ISO 16834:2006 is
    a combined specification providing for classification utilizing a system based
    upon the yield strength and the average impact energy of 47 J of all-weld metal,
    or utilizing a system based upon the tensile strength and the average impact energy
    of 27 J of all-weld metal.
