abstract:
- language: en
  script: Latn
  content: 'This document defines the programme management requirements for material,
    mechanical parts and processes for projects covering mission definition, design,
    development, production and operations of space systems, including disposal. This
    document covers the following: — management, including organization, reviews,
    acceptance status and documentation control; — selection criteria and rules; —
    evaluation, validation and qualification, or verification testing; — procurement
    and receiving inspection; and — utilization criteria and rules. This document
    applies to all space deliverable products and all programme phases.'
