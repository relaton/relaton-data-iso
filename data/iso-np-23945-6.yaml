abstract:
- language: en
  script: Latn
  content: This document specifies the method for determining the tensile bond between sprayed concrete and substrate of concrete or rock tested in a laboratory or in-situ. Bond strength is defined as the capacity to transfer tension between two layers. This document does not purport to address all of the safety concerns, if any, associated with its use. It is the responsibility of the user of this document to establish appropriate safety and health practices and determine the applicability of regulatory limitations prior to use.
