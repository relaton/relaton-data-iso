abstract:
- language: en
  script: Latn
  content: 'This document defines terms for respiratory care. This document is applicable:
    —     in respiratory high-flow therapy equipment standards; —     in sleep apnoea
    breathing therapy equipment standards; —     in sleep apnoea breathing therapy
    masks and accessories standards; —     in ventilatory support equipment standards;
    —     in health informatics standards; —     for labelling on medical electrical
    equipment and medical electrical systems; —     in medical electrical equipment
    and medical electrical system instructions for use and accompanying documents;
    —     for medical electrical equipment and medical electrical systems interoperability;
    —     in electronic health records. This document excludes mechanical ventilation
    (defined in ISO 19223:2019), high-frequency and jet ventilation (defined in ISO
    19223-2:2025), negative pressure ventilation, liquid ventilation, and extracorporeal
    membrane oxygenation.'
