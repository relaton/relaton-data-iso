abstract:
- language: en
  script: Latn
  content: This document reviews the literature regarding human-computer interaction
    (HCI) theory and user-centred design (UCD) principles in the design and development
    of electronic health information record systems (HIRS). The focus is on some unintended
    consequences of HIRS design decisions over the last 15 years and the way that
    application of HCI and UCD to HIRS data analytics, data representation, and clinical
    decision support can help to alleviate HIRS-associated clinician burden.
