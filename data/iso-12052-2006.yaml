abstract:
- language: en
  script: Latn
  content: 'Within the field of health informatics this ISO 12052:2006 addresses the
    exchange of digital images, and information related to the production and management
    of those images, between both medical imaging equipment and systems concerned
    with the management and communication of that information. ISO 12052:2006 is intended
    to facilitate interoperability of medical imaging equipment and information systems
    by specifying: a set of protocols to be followed by systems claiming conformance
    to this International Standard.the syntax and semantics of commands and associated
    information data models that ensure effective communication between implementations
    of this International Standard;information that shall be supplied with an implementation
    for which conformance to this International Standard is claimed.'
