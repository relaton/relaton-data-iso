abstract:
- language: en
  script: Latn
  content: This document identifies and defines terms, specifies a means of classification,
    provides dimensional characteristics, gives nomenclature of components, and provide
    commercial specifications for mulching equipment (in other words, mulcher carriers
    and mulcher attachments) used in forestry and related operations. Its aim is to
    establish a uniform method of describing the various configurations of these types
    of forestry machines. Machines for mulching designed for feeding by hand and not
    covered by this document.
