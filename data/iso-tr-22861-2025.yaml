abstract:
- language: en
  script: Latn
  content: This document sets out a methodology for the exposure zone division of
    reinforced concrete structures in marine environments, based on a test procedure
    that is provided in this document. This document is applicable to the division
    of coastal and offshore marine environment areas. It is not applicable to typhoon,
    strong tide and other marine environment areas. Annexes B, C, and D provide examples
    of marine environment zonation to illustrate the methodology.
