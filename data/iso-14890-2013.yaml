abstract:
- language: en
  script: Latn
  content: ISO 14890:2013 specifies requirements for rubber and/or plastics covered
    conveyor belting of textile construction for general surface use on flat or troughed
    idlers. ISO 14890:2013 is not suitable or valid for light conveyor belts as described
    in ISO 21183-1. Items that are not requirements of ISO 14890:2013, but need to
    be agreed between the manufacturer and the purchaser, as well as a list of the
    details intended to be supplied by the purchaser of belting with an enquiry are
    included in the annexes.
