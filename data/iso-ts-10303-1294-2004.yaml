abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1294:2004 specifies the application module for Interface
    lifecycle. The following are within the scope of ISO/TS 10303-1294:2004: the identification
    of the life cycle phase (designed, planned or realized) of an interface connector,
    the product or part with which one or more other products will interact; the relationship
    between interface design, interface as planned (that is an interface which is
    planned), and interfaces as realized (a an actual interface).'
