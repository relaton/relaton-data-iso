abstract:
- language: en
  script: Latn
  content: 'This document specifies methods for the determination of chlorine and/or
    bromine present in raw rubber as well as vulcanized or unvulcanized rubber compounds.
    The methods are applicable to natural rubbers and to the following synthetic rubbers:
    isoprene, styrene-butadiene, butadiene, butyl, halogenated butyl, nitrile, ethylene-propylene,
    chloroprene and epichlorohydrin.'
