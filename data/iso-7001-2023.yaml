abstract:
- language: en
  script: Latn
  content: This document specifies graphical symbols for the purposes of public information.
    This document is generally applicable to public information symbols in all locations
    and all sectors where the public has access. However, it is not applicable to
    safety signs or those sectors subject to specific regulations (e.g. traffic signs
    on public roads). This document specifies the original symbols that can be scaled
    for reproduction and application purposes. The symbols can be used in conjunction
    with text to improve comprehension.
