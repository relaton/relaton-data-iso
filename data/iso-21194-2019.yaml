abstract:
- language: en
  script: Latn
  content: This document specifies a method for evaluating the adhesion of elastic
    adhesives and sealants [with a minimum elongation at break of 100 % and a modulus
    of elasticity of maximum 10 MPa[1]] on various substrates. In this way, the effect
    of various coatings or the surface pre-treatments of the substrate materials on
    the adhesion can be compared. It can also be used to evaluate the influence of
    pre-treatment, substrate and adhesive on the long-term durability of adhesively
    bonded joints and seals. This test can also be used for process monitoring and
    quality assurance accompanying production. [1] The elongation and modulus of elasticity
    are measured according to ISO 527-2.
