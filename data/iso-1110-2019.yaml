abstract:
- language: en
  script: Latn
  content: This document describes a method for the accelerated conditioning of test
    specimens of polyamides and copolyamides. It is applicable to grades containing
    fillers and other additives, but not grades containing more than a mass fraction
    of 2 % extractables. The equilibrium moisture content attained by this method
    is close to the equilibrium moisture content obtained in standard atmosphere 23
    °C/50 %RH. The values of mechanical properties obtained after accelerated conditioning
    in accordance with this method can differ slightly from those obtained after conditioning
    in standard atmosphere 23 °C/50 %RH.
