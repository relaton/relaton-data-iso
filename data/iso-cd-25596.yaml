  content: This standard provides a guide on the principles and methods for the design
    analysis of radioactive source in pressurized light water reactor nuclear power
    plants for normal operation states. This standard is applicable to the radioactive
    source design analysis for newly built operating pressurized light water reactor
    nuclear power plants that uses UO2 fuel. This standard does not involve any analysis
