abstract:
- language: en
  script: Latn
  content: ISO 13161:2011 specifies the measurement of 210Po activity concentration
    by alpha spectrometry in all kinds of natural waters. The detection limit of this
    method depends on the volume of the sample, the counting time, the background
    count rate and the detection efficiency. In the case of drinking water, the analysis
    is usually carried out on the raw sample, without filtration or other pretreatment.
    If suspended material has to be removed or analysed, filtration at 0,45 µm is
    recommended. The analysis of the insoluble fraction requires a mineralization
    step that is not covered by ISO 13161:2011. In this case, the measurement is made
    on the different phases obtained. The final activity is the sum of all the measured
    activity concentrations.
