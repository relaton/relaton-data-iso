abstract:
- language: en
  script: Latn
  content: Provides guidance on fire testing of plastics (fire scenarios and models,
    types of fire tests, characteristics of burning behaviour, design of fire tests,
    aspects of fire hazard assessment) for manufacturers, converters, users, specifiers
    and regulators. This guidance applies in particular to the working groups of ISO/TC
    61/SC 4 and is applicable to all the test methods developed by this sub-committee.
    Fire tests are necessary for gathering information for estimating fire hazard
    and are used in legal codes and regulations, specifications, quality assurance,
    research and development.
