abstract:
- language: en
  script: Latn
  content: 'This TS specifies characteristics and performance/activity assessment
    of disinfectant suspensions containing nanomaterials to surfaces (non-porous)
    removal of covid-19 virus. Further the document also describes the relevant physical
    and chemical characterization methods. Note 1: For those disinfectants having
    photocatalytic response, antiviral activity under light exposure shall also be
    determined. Note 2: The non-porous surface material includes but not limited to
    wood, plastics/composites, metals, glass, and ceramics.'
