abstract:
- language: en
  script: Latn
  content: ISO 6658:2017 gives general guidance on the use of sensory analysis. It
    describes tests for the examination of foods and other products by sensory analysis,
    and includes some general information on the techniques to be used if statistical
    analysis of the results is required. Generally these tests are intended only for
    objective sensory analysis. However, if a test can be used for determining preference
    in hedonic test, this is indicated. A hedonic test aims to determine the acceptability
    of the products and/or to determine preferences among two or more products by
    the specified consumer population. The methods are effective for determining whether
    a perceptible preference exists (difference in degree of liking), or whether no
    perceptible preference exists (paired similarity test). General guidance for hedonic
    tests is given in ISO 11136.
