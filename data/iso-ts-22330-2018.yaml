abstract:
- language: en
  script: Latn
  content: 'This document gives guidelines for the planning and development of policies,
    strategies and procedures for the preparation and management of people affected
    by an incident. This includes: — preparation through awareness, analysis of needs,
    and learning and development; — coping with the immediate effects of the incident
    (respond); — managing people during the period of disruption (recover); — continuing
    to support the workforce after returning to business as usual (restore). The management
    of people relating to civil emergencies or other societal disruption is out of
    the scope of this document.'
