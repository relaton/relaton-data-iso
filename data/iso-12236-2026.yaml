abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the puncture
    resistance by measuring the force required to push a flat-ended plunger through
    geosynthetics. The test is normally carried out on dry specimens conditioned in
    the specified atmosphere. The test is applicable to most types of geosynthetic
    products, but does not apply to products with apertures greater than 10 mm.
