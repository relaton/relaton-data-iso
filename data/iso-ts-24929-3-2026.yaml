abstract:
- language: en
  script: Latn
  content: This document establishes principles for the classification of child care articles based on chemical hazards, behavioural habits, physiological characteristics, exposure routes and chemical risk assessment methods related to classification. It specifies general and fundamental chemical requirements applicable to all child care articles. It also describes the relationship between this document and specific product standards. NOTE 1        Chemical hazards that are unique to specific product categories of child care articles are addressed in corresponding product standards. NOTE 2        There are many child care articles, and many materials and chemical substances are used. This document cannot cover all child care articles and all chemical hazardous substances, which is why this document also gives principles for dealing with unknown products and chemical substances.
