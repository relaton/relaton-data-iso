abstract:
- language: en
  script: Latn
  content: ISO 8516:2011 provides a basis for a specification applicable to textured
    yarns made from single or folded yarns of textile glass. Textured glass yarns
    can be produced by several types of process. They can be made starting either
    from a single strand or from two or more strands in which one or more have been
    "opened" to give the "bulky" aspect of textured yarn. Textured glass yarn is used
    in various applications, for example insulation, filtration, the manufacture of
    decorative textiles, the reinforcement of plastics and the manufacture of packing
    materials.
