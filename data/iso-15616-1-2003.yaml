abstract:
- language: en
  script: Latn
  content: ISO 15616-1:2003 is applicable to CO2-laser beam machines for welding and
    cutting in two operating directions. The main purpose of this International Standard
    is to provide requirements for acceptance testing of CO2-laser beam machines prior
    to or during installation at the user's premises. The acceptance tests are used
    to document the ability of CO2-laser beam machines to produce welded joints and
    cuts of consistent quality. ISO 15616-1:2003 is intended to be used for preparation
    of the technical specification for CO2-laser beam machines for high quality welding
    and cutting in two operating directions. It specifies basic requirements. However,
    this International Standard may also be used for testing as part of maintenance,
    as appropriate.
