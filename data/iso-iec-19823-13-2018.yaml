abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 19823-13:2018 describes test methods for determining the conformance
    of security crypto suites with the specifications given in ISO/IEC 29167‑13. ISO/IEC
    19823-13:2018 contains conformance tests for all mandatory and optional functions.
    The conformance parameters are the following: - parameters that apply directly
    affecting system functionality and inter-operability; - protocol including commands
    and replies; and - nominal values and tolerances. Unless otherwise specified,
    the tests in this document are applied exclusively to RFID tags and interrogators
    defined in the ISO/IEC 18000 series using ISO/IEC 29167‑13.'
