abstract:
- language: en
  script: Latn
  content: ISO 4967:2013 specifies a micrographic method of determining the non-metallic
    inclusions in rolled or forged steel products having a reduction ratio of at least
    3 using standard diagrams. This method is widely used to assess the suitability
    of a steel for a given use. However, since it is difficult to achieve reproducible
    results owing to the influence of the test operator, even with a large number
    of specimens, precautions should be taken when using the method. ISO 4967:2013
    also provides for the determination of non-metallic inclusions by image analysis
    technologies.
