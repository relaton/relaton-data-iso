abstract:
- language: en
  script: Latn
  content: ISO/TS 11405:2015 gives guidance on substrate selection, storage, and handling
    as well as essential characteristics of different test methods for quality testing
    of the adhesive bond between restorative dental materials and tooth structure,
    i.e. enamel and dentine. It includes a tensile bond strength measurement test,
    a test for measurement of marginal gaps around fillings, a microleakage test,
    and gives guidance on clinical usage tests for such materials. Some specific test
    methods for bond strength measurements are given for information in Annex A. ISO/TS
    11405:2015 does not include requirements for adhesive materials and their performance.
