abstract:
- language: en
  script: Latn
  content: ISO/TS 15011-6:2012 provides guidance on determination of emission rates
    of fume and gases generated by spot welding of uncoated and coated steel sheets,
    expressed as the quantity of pollutants per spot weld. It describes the test principle
    and considers methods for sampling and analysis. ISO/TS 15011-6:2012 can be used
    for determining the influence of the type of material, the coating system, and
    the material thickness on the possible generation of fume and gases when using
    a fixed combination of electrodes, welding equipment, and testing conditions.
    The data generated can be used by product manufacturers to provide information
    for inclusion in safety data sheets and by occupational hygienists to evaluate
    the significant substances emitted by spot welding in the performance of risk
    assessments and/or workplace exposure measurements.
