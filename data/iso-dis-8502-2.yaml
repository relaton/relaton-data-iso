abstract:
- language: en
  script: Latn
  content: ISO 8502-2:2017 describes a method for the determination of chloride-containing salts that are readily soluble in water and are present on a steel surface. The method is also applicable to previously coated surfaces. ISO 8502-2:2017 includes a method, applicable in the field or in the laboratory, for washing off the surface while several methods are referred to for chloride analyses.
