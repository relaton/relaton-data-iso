abstract:
- language: en
  script: Latn
  content: In pneumatic system, compressed air discharged from compressor is supplied
    to the terminal equipment through main supply piping. However, this pressure transition
    process involves loss of compressed air energy due to pressure loss and air leakage
    loss. This standard specifies the energy condition monitoring method, the maintenance
    procedures, methods of identifying cause and the optimal pipe size selection method
    for main supply piping in pneumatic systems.
