abstract:
- language: en
  script: Latn
  content: 'This document specifies the methods for: a)    uninterrupted creep tests
    with continuous monitoring of extension; b)    interrupted creep tests with periodic
    measurement of elongation; c)    stress rupture tests where normally only the
    time to fracture is measured; d)    a test to verify that a predetermined time
    can be exceeded under a given force, with the elongation or extension not necessarily
    being reported. NOTE       A creep test can be continued until fracture has occurred
    or it can be stopped before fracture.'
