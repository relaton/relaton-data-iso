abstract:
- language: en
  script: Latn
  content: 1.1 This document determines resistance of security glazing products to
    natural threats characterized by simulated destructive-windstorm events. 1.2 The
    test method determines the performance of security-glazing for use in fenestration
    assemblies under conditions representative of events that occur in severe, destructive-windstorm
    environments using simulated missile impact(s) followed by the application of
    cyclic static-pressure differentials. 1.3 A missile-propulsion device, an air
    pressure system and a test chamber are used to model some conditions that can
    be representative of windborne debris and pressures in a windstorm environment.
    1.4 The performance determined by this test method relates to the ability of glazing
    in the building envelope to remain without openings during a windstorm.
