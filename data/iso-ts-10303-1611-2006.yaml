abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1611:2006 specifies the application module for AP210 connection
    zone based model extraction. ISO/TS 10303-1611:2006 deals with the representation
    of simulation models based on capturing behaviour, using specific areas on a feature
    as a port rather than the entire feature. This allows more accurate simulation
    models than is available using feature assignment to analytical model ports. Configuration
    management information and design change management information is provided. The
    following is within the scope of ISO/TS 10303-1611:2006: simulation models based
    on connection areas.'
