abstract:
- language: en
  script: Latn
  content: 'This document specifies general test criteria and requirements to measure
    the energy consumption for self-propelled industrial trucks (hereinafter referred
    to as trucks) during operation. For electric trucks, the efficiency of the battery
    and the battery charger is included. ISO 23308-2, ISO 23308-3, ISO 23308-4 and
    ISO 23308-6 contain additional, truck-specific requirements which build on those
    expressed in this document. This document is applicable to the in-use phase of
    the product life cycle. It applies to the following truck types as defined in
    ISO 5053-1: —     counterbalance lift truck; —     articulated counterbalance
    lift truck; —     reach truck (with retractable mast or fork arm carriage); —    
    straddle truck; —     pallet-stacking truck; —     pallet truck; —     platform
    and stillage truck; —     end-controlled pallet truck; —     order-picking truck;
    —     centre-controlled order-picking truck; —     towing tractor; —     pushing
    tractor; —     burden and personnel carrier; —     lorry-mounted truck; —    
    towing and stacking tractor; —     side-loading truck (one side only); —     variable-reach
    container handler; —     counterbalance container handler; —     lateral-stacking
    truck (both sides); —     lateral-stacking truck (three sides); —     multi-directional
    lift truck; —     variable-reach truck; —     platform truck; —     double-stacker;
    —     rough-terrain truck; —     rough-terrain variable-reach truck; —     slewing
    rough-terrain variable-reach truck; —     stacking high-lift straddle carrier.'
