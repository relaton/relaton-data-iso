abstract:
- language: en
  script: Latn
  content: ISO 15609-4:2009 specifies requirements for the content of the welding
    procedure specification (WPS) for laser beam welding processes, including overlay
    welding. It is not applicable to other processes for cladding (e.g. thermal spraying).
    Variables listed in ISO 15609-4:2009 are those influencing the quality and properties
    of the welded joint.
