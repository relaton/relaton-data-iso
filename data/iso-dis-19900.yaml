abstract:
- language: en
  script: Latn
  content: 'This document specifies general provisions for the design and assessment
    of fixed (bottom-founded)  and floating (buoyant) offshore structures. This document
    contains general provisions for the design of new structures and site assessment
    of existing structures. This document is applicable for all phases of the life
    of the structure, including: ¾    pre-service (e.g., fabrication, transportation,
    installation), ¾    service in-place, both during originally specified design
    service life and during any life extensions, ¾    functional upgrade, repurpose
    and reuse, and ¾    decommissioning, and removal. This document focusses on primary
    and secondary load bearing structure but also provides some provisions for tertiary
    and ancillary structure. NOTE         ISO 24201[22] covers the design of stairs,
    gratings and handrails. This document was initially created for offshore oil &
    gas structures but is now also applicable to renewable energy offshore structures.
    This document does not apply to pipelines, risers or subsea systems.'
