abstract:
- language: en
  script: Latn
  content: This technical specification provides guidance on the calculation of the
    fire resistance performance of asymmetrical partitions and/or vertical membranes
    using existing fire test evidence. The fire resistance performance of asymmetrical
    partitions and/or vertical membranes is established on the basis of existing fire
    test evidence for the asymmetrical partitions and/or vertical membranes using
    tests conducted in conformance with ISO 834-1. The asymmetrical partitions are
    constructions that comprise of multiple layers of boards, which are installed
    against C-profile steel studs. The gypsum plaster boards are shown as the example.
    And the principles of the calculation methodology can be applied to other types
    of board materials used in partition system provided the studs used are noncombustible
    and to other heating regimes.
