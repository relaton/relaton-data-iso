abstract:
- language: en
  script: Latn
  content: 'ISO 16089:2015 specifies the requirements and/or measures to eliminate
    the hazards or reduce the risks in the following groups of stationary grinding
    machines which are designed primarily to shape metal by grinding: Group 1: Manually
    controlled grinding machines without power operated axes and without numerical
    control. Group 2: Manually controlled grinding machines with power operated axes
    and limited numerically controlled capability, if applicable. Group 3: Numerically
    controlled grinding machines. NOTE 1 For detailed information on the groups of
    grinding machines, see the definitions in 3.1 and 3.4. NOTE 2 Requirements in
    this International Standard are, in general, applicable to all groups of grinding
    machines. If requirements are applicable to some special group(s) of grinding
    machines only, then the special group(s) of grinding machine(s) is/are specified.
    This International Standard covers the significant hazards listed in Clause 4
    and applies to ancillary devices (e.g. for workpieces, tools, and workpiece holding
    devices, handling devices), which are integral to the machine. This International
    Standard also applies to machines which are integrated into an automatic production
    line or grinding cell inasmuch as the hazards and risks arising are comparable
    to those of machines working separately. This International Standard also includes
    in Clause 7 a minimum list of safety-relevant information which the manufacturer
    has to provide to the user. See also ISO 12100:2010, Figure 2, which illustrates
    the interaction of manufacturer''s and user''s responsibility for the operational
    safety. The user''s responsibility to identify specific hazards (e.g. fire and
    explosion) and reduce the associated risks can be critical (e.g. whether the central
    extraction system is working correctly). Where additional metalworking processes
    (e.g. milling, turning, laser processing) are involved, this International Standard
    can be taken as a basis for safety requirements. For specific information on hazards
    arising from other metalworking processes, which are covered by other International
    Standards, see the Bibliography. This International Standard applies to machines
    that are manufactured after the date of issue of this International Standard.
    This International Standard does not apply to stationary honing, polishing, and
    belt grinding machines and not to transportable motor-operated electric tools
    in accordance with IEC 61029‑2‑4 and IEC 61029‑2‑10.'
