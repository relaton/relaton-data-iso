abstract:
- language: en
  script: Latn
  content: This document provides general principle, definition, and technical requirement
    for Chemical Recycling of Plastics Waste by gasification. The information shown
    in this document is utilized to choose a preferable gasification technology for
    Chemical Recycling of Plastics Waste. This document is limited to the specification
    of Chemical Recycling by gasification, not including other Chemical Recycling
    methods such as Pyrolysis, Liquid-gas hydrogenation, Methanolysis, Glycolysis
    and Hydrolysis. The standard value of technical requirement for each Chemical
    Recycling technology shall be established individually due to different technical
    feature among Chemical Recycling technologies.
