abstract:
- language: en
  script: Latn
  content: This standard deals with the energy efficiency evaluation and optimization
    of pneumatic cylinder systems. Before applying this standard, the system should
    be designed properly and according to good engineering practice/state of the art
    (for example by applying ISO/TR 22165). This standard provides general procedures
    and calculation methods for assessing the air consumption of pneumatic cylinder
    systems to enable the system designer to make a comparison with other solutions
    or cylinder technologies. The considerations of this standard start after the
    main shut-off valve of the system to assist in the design of the pneumatic system.
