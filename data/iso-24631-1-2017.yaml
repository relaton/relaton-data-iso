abstract:
- language: en
  script: Latn
  content: ISO 24631-1:2017 provides the means of evaluating the conformance with
    ISO 11784 and ISO 11785 of radiofrequency identification (RFID) transponders used
    in the individual identification of animals. It sets forth the conditions for
    the granting and use of the manufacturer code related to a transponder and the
    associated rights and obligations of the parties involved in the issuance of the
    code. The test procedures specified in this document are recognized by the Federation
    of European Companion Animals Veterinary Association (FECAVA) and World Small
    Animal Veterinarian Association (WSAVA) and, as such, can be applied also to companion
    animals.
