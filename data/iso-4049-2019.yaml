abstract:
- language: en
  script: Latn
  content: This document specifies requirements for dental polymer-based restorative
    materials supplied in a form suitable for mechanical mixing, hand-mixing, or intra-oral
    and extra-oral external energy activation, and intended for use primarily for
    the direct or indirect restoration of the teeth and for luting. The polymer-based
    luting materials covered by this document are intended for use in the cementation
    or fixation of restorations and appliances such as inlays, onlays, veneers, crowns
    and bridges. This document does not cover those polymer-based luting materials
    that have an adhesive component within the structure of the material (see ISO/TS
    16506). The document does not cover polymer-based materials intended to prevent
    caries (see ISO 6874), core materials or those used for veneering metal sub-frames
    (see ISO 10477).
