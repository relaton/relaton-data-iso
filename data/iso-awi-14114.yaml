abstract:
- language: en
  script: Latn
  content: ISO 14114:2017 applies to acetylene cylinder manifold systems extending
    from the cylinder valve or the bundle outlet connections to the outlet connection
    of the main shut-off valve. It specifies requirements for design, materials and
    testing of cylinder manifold systems for the supply of acetylene for use in welding,
    cutting and allied processes. ISO 14114:2017 applies to acetylene cylinder manifold
    systems in which acetylene single cylinders or acetylene bundles are coupled for
    collective gas withdrawal. NOTE National regulations exist regarding limitation
    of the amount of single cylinders/bundles of acetylene on a single location (e.g.
    in warehouse or connected to a manifold system). ISO 14114:2017 also covers a
    test procedure for decomposition blockers.
