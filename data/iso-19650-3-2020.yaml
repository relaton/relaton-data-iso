abstract:
- language: en
  script: Latn
  content: This document specifies requirements for information management, in the
    form of a management process, within the context of the operational phase of assets
    and the exchanges of information within it, using building information modelling.
    This document can be applied to all types of assets and by organizations of all
    types and sizes involved in the operational phase of assets. The requirements
    in this document can be achieved through direct actions carried out by the organization
    in question or can be delegated to another party.
