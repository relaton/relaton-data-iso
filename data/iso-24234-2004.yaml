abstract:
- language: en
  script: Latn
  content: ISO 24234:2004 specifies the requirements and test methods for alloys and
    for mercury suitable for the preparation of dental amalgam, together with the
    requirements and test methods for that amalgam and the requirements for packaging
    and marking. It is applicable to alloys supplied in the form of either a powder
    in bulk, or a powder compressed to form a tablet, or a powder in predosed capsules.
    It is applicable to dental mercury supplied either in bulk quantities, or in predosed
    sachets, or in predosed capsules. ISO 24234:2004 does not exclude the supply of
    alloy or mercury separately. ISO 24234:2004 is not applicable to alloys intended
    for use with liquid metals that are not mercury, nor is it applicable to liquid
    metal alloys.
