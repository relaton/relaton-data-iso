abstract:
- language: en
  script: Latn
  content: This international standard specifies a method for the determination of uranium(VI) concentrations in TBP-aliphatic diluents (for example TBP-kerosene or TBP-n-dodecane) coming from the nuclear fuel cycle. The method is applicable for the analysis of samples containing 5 g/l to 100 g/l uranium(VI). The concentration of plutonium in the solution should be less than 1.5 g/l to ensure the absence of significant interferences.
