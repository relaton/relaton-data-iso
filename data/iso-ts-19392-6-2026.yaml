abstract:
- language: en
  script: Latn
  content: This document specifies a method to measure ice adhesion from artificial
    ice on test substrates by using a centrifuge. Basic ice types are defined and
    test parameters for the ice removal are described to achieve reproducibility of
    test results for ice adhesion measurements for rotor blade coatings. This document
    does not intend to provide fixed test parameter to account for the diversity of
    relevant icing scenarios in this field of application. NOTE            In practice,
    ice adhesion can be determined by two different measurement principles, the centrifugal
    test (covered in this document) and the shear test, which differ in dynamic and
    quasistatic shear rates. This test method can be used to test the adhesion of
    dynamic ice on the coating system of a wind turbine rotor blade under operation.
