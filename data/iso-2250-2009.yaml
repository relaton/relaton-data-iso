abstract:
- language: en
  script: Latn
  content: 'ISO 2250:2008 specifies the dimensions of cylindrical shank socket reamers
    and taper shank socket reamers manufactured to produce self-holding taper sockets
    for self-holding taper shanks of the following designations: metric tapers no.
    4 and no. 6; Morse tapers no. 0 to no. 6 inclusive. The dimensional characteristics
    of these socket reamers are in accordance with ISO 296.'
