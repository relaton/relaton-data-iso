abstract:
- language: en
  script: Latn
  content: 'ISO 12614-18:2014 specifies tests and requirements for the gas temperature
    sensor, a liquefied natural gas fuel system component intended for use on the
    types of motor vehicles defined in ISO 3833. This part of ISO 12614 is not applicable
    to the following: a) fuel containers; b) stationary gas engines; c) container
    mounting hardware; d) electronic fuel management; e) refueling receptacles.'
