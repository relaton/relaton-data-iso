abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1668:2010-07 specifies the application module for Fabrication
    joint. The following are within the scope of ISO/TS 10303-1668:2010-07: the representation
    of the information needed to describe a permanent material joint created during
    the interconnect substrate realization process. The fabrication joint purpose
    in the model is to describe an abstraction or intended connection between the
    interconnect substrate material features. The fabrication joint concept is usually
    created for analysis purposes and is usually not resolvable as a separate feature
    in the finished product. The fabrication joint concept may not be needed when
    the source and receiving systems share the same semantics for co-located connection
    points; interconnect design feature data;interconnect analysis data extracted
    from design data.'
