abstract:
- language: en
  script: Latn
  content: This International Standard specifies the dimensions of T-slot cutters
    with plain or flatted cylindrical shanks, with threaded shanks and with Morse
    taper shanks having tapped hole. It applies to those tools which are intended
    for manufacturing T-slots for machine tools for equipment, in accordance with
    ISO 299. T-slot cutters with plain cylindrical shanks or flatted cylindrical shanks
    and with threaded shanks are suitable for the production of slots in accordance
    with ISO 299 from 5 mm to 36 mm inclusive; those with Morse taper shanks are suitable
    for the production of slots in accordance with ISO 299 from 10 mm to 54 mm inclusive.
