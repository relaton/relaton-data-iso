abstract:
- language: en
  script: Latn
  content: ISO 5902:2013 specifies laboratory measurement methods to determine the
    elastic properties of alpine skis. Its purpose is to calculate the resistance
    of defined parts of the ski to bending and torsion. The standard measurement procedures
    are recommended in order to ensure comparability between laboratory measurement
    data determined and published by ski manufacturers, institutions and others.
