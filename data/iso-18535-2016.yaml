abstract:
- language: en
  script: Latn
  content: ISO 18535:2016 specifies a procedure for and provides guidance on the determination
    of the coefficient of friction and the specific wear rate of diamond-like carbon
    (DLC) films. The method specifies that the materials are tested under dry conditions
    in pairs in a ball-on-disc configuration. The results of the tests are not applicable
    when DLC-coated parts operate in a lubricated environment.
