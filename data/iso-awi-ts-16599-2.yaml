abstract:
- language: en
  script: Latn
  content: 'Scope of the proposed deliverable. Establishment of the governance and
    principles which are the foundations of quality data for healthcare to support
    specification collection and use of quality data in healthcare. This includes:
    ● Data Design o Principles of design in a data supply chain environment o Data
    at source o Data exchange (interoperability) o Data changes through the supply
    chain (such as aggregation, maps and concept representation variations for different
    purposes e.g. SNOMED CT to ICD) o Secondary Use Data o Designing data for the
    life of the individual It is not intended that this work defines the requirements
    for quality information or data models – however the document will indicate where
    such models impact the quality of the data.'
