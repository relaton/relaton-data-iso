abstract:
- language: en
  script: Latn
  content: This document provides safety requirements specific to binding and finishing
    equipment and systems. It provides additional safety requirements for the design
    and construction of new equipment used to convert printed or blank substrates
    into cut, folded, collated, assembled, bound, or otherwise finished product. This
    document is applicable to processes for preparing substrate for the printing process.
    It is also applicable to a wide range of equipment used in the binding and finishing
    process.
