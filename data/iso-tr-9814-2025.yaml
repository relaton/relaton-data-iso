abstract:
- language: en
  script: Latn
  content: 'This document gives good practices on how to prevent the capsizing of
    ships with large profile height during turning. The following are covered this
    document: a)    ship turning, centrifugal force, and consequent heeling; b)   
    accident use cases of capsizing during turning; c)    effect of the KG on the
    ship stability; d)    three good practices of preventing capsizing during turning
    of ships.'
