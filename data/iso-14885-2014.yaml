abstract:
- language: en
  script: Latn
  content: ISO 14885:2014 specifies the safety requirements for diesel engines with
    a rated power of 100kW and over for propulsion and essential auxiliaries for power
    generation for large yachts 24 m and over in hull length, measured in accordance
    with ISO 8666:2002, and of less than 500 GT which are in commercial use for sport
    or pleasure, and do not carry cargo and do not carry more than twelve passengers.
    The engine in terms of ISO 14885:2014 is understood as the prime mover up to its
    driving extremitie(s) for power take off(s). ISO 14885:2014 does not cover engines
    used for generating the emergency source of electrical power.
