abstract:
- language: en
  script: Latn
  content: ISO 2635:2003 specifies the dimensions, electrical characteristics and
    mechanical characteristics of multi-strand conductors for general-purpose aircraft
    electrical cables and aerospace applications. It applies to stranded conductors
    over the nominal cross-sectional area range 0,12 mm2 to 107 mm2 inclusive. It
    is not applicable to conductors for fire-resistant cables or for thermocouple
    extension cables. Conductors for fire-resistant cables are specified in ISO 1967
    and for thermocouple extension cables are specified in ISO 8056-1.
