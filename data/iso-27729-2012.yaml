abstract:
- language: en
  script: Latn
  content: ISO 27729:2012 specifies the International Standard name identifier (ISNI)
    for the identification of public identities of parties, i.e. the identities used
    publicly by parties involved throughout the media content industries in the creation,
    production, management and content distribution chains. The ISNI system uniquely
    identifies public identities across multiple fields of creative activity and provides
    a tool for disambiguating public identities that might otherwise be confused.
    The ISNI is not intended to provide direct access to comprehensive information
    about a public identity but can provide links to other systems where such information
    is held.
