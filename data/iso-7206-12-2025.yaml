abstract:
- language: en
  script: Latn
  content: This document specifies a test method for determining short-term deformation
    of a press-fit acetabular component for total hip joint replacement under specific
    laboratory conditions. This document also defines the conditions of testing so
    that the important parameters that affect the components are taken into account
    and it describes how the specimen is set up for testing. The described method
    is intended to be used to measure the amount of deformation under load and plastic
    deformation after unloading of various designs and materials used for acetabular
    components in total hip joint replacement. These measurements are then used in
    an evaluation of risks associated with acetabular cup deformation for the acetabular
    component under evaluation to determine if its performance can be adversely affected.
    In the evaluation of risks associated with acetabular component deformation, it
    can be useful to take into consideration various design, material and surgical
    implantation factors (e.g. those identified in Clause 8), and, if necessary, a
    comparison of results to a reference implant tested under the same conditions.
    Depending on this evaluation, either additional testing or clinical data, or both,
    which is outside the scope of this document, can be necessary. The loading of
    the acetabular components in vivo differs, in general, from the loading defined
    in this test method. The results obtained here cannot be used to directly predict
    in vivo performance. This document does not cover methods that examine the test
    specimens.
