abstract:
- language: en
  script: Latn
  content: ISO 16140-1:2016 defines general terms and definitions relating to method
    validation of microbiology in the food chain. It is applicable to the validation
    of methods for the analysis (detection or quantification) of microorganisms in
    - products intended for human consumption, - products intended for animal feeding,
    - environmental samples in the area of food and feed production, handling, and
    - samples from the primary production stage.
