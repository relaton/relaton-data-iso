abstract:
- language: en
  script: Latn
  content: ISO 4618:2006 is a trilingual vocabulary which defines English, French
    and German terms used in the field of coating materials (paints, varnishes and
    raw materials for paints and varnishes). Terms relating to specific applications
    and properties are dealt with in standards concerning those applications and properties,
    e.g. corrosion protection, coating powders.
