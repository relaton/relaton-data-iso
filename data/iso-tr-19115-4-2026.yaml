abstract:
- language: en
  script: Latn
  content: This document describes a ECMA 404:2017 JSON implementation of ISO 19115-1 and ISO 19157-1 as a proof of concept. The resulting JSON encoding is not a formal json specification but is intended to proof the feasibilty of the approach taken and the implicated encoding principles. The document provides a set of JSON schema files which define a JSON encoding of the concepts defined by conceptual schemas in ISO 19115-1 and ISO 19157-1. The JSON representation is scoped to exchange via HTTP. In this document, only a subset of the content of both ISO 19115-1 and ISO 19157-1 is included, in order to simplify the process of defining the resulting JSON schema. For the same reason, ISO 19115-2:2019 is currently not included. The subset is chosen to be a core operational set of both ISO 19115- and ISO 19157-1. This document describes the procedure used to generate JSON schema from ISO geographic information conceptual models related to metadata. The procedure includes creation of an UML implementation model for JSON implementation derived from the ISO 19115-1 and ISO 19157-1 conceptual schemas.
