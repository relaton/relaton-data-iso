abstract:
- language: en
  script: Latn
  content: 'This document describes a shared conceptual framework for the nuclear
    digital ecosystem (NDE). In addition, this framework also serves as a systematic
    basis for a series of additional standards for management methods and technical
    guidelines for information integration and exchange, specifically in the nuclear
    industry. The framework focuses on the nuclear industry-specifics with management
    requirements as well as information specifications to facilitate practical benefits
    from implementing ISO standards. It is viable because the industry scope is narrowed
    down to the nuclear sector, while the management concerns are expanded to cover
    the various disciplines throughout the entire life cycle. The following are within
    the scope of this document: —     definition of the conceptual structure of the
    nuclear ecosystem with components and relationships in terms of facility type,
    life cycle (lifetime), and technical management methodology; the scope of this
    document exclusively addresses ‘all reactor-related facilities’; —     definition
    of the industry sectors involved within NDE, encompassing civil, architectural,
    mechanical, electrical, I&C, process engineering and ICT; —     list of high-level
    constituents for each component; —     instructions to guide the collective use
    of this document and existing standards to specify information requirements within
    the NDE for different functional purposes. The following are outside the scope
    of this document: —     definition of detailed management methodologies or processes
    related to the standard data exchange; —     list of detailed properties and structures
    of the required information exchange (IE).'
