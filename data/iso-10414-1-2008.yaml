abstract:
- language: en
  script: Latn
  content: 'ISO 10414-1:2008 provides standard procedures for determining the following
    characteristics of water-based drilling fluids: drilling fluid density (mud weight),
    viscosity and gel strength, filtration, water, oil and solids contents, sand content,
    methylene blue capacity, pH, alkalinity and lime content, chloride content and
    total hardness as calcium. ISO 10414-1:2008 provides additional test methods which
    may be used for chemical analysis for calcium, magnesium, calcium sulfate, sulfide,
    carbonate and potassium; determination of shear strength; determination of resistivity;
    removal of air drill-pipe corrosion; monitoring sampling, inspection and rejection
    rig-site sampling; calibration and verification of glassware, thermometers, viscometers,
    retort-kit cup and drilling-fluid balances; permeability-plugging testing at high
    temperature and high pressure for two types of equipment; and an example of a
    report form for water-based drilling fluid.'
