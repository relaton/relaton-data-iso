abstract:
- language: en
  script: Latn
  content: This document provides in detail how the standards of fine bubble technologies
    can contribute to establish the systematic classification of fine bubble technologies
    including the effective functions and the application fields of fine bubbles,
    which is useful for the users and the potential customers to optimize the application
    of fine bubble technologies.. This document also specifies the clauses required
    for fine bubble standards, including a description relating application fields
    and effective functions of fine bubble technologies.
