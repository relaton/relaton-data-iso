abstract:
- language: en
  script: Latn
  content: This document specifies methods for the chemical analysis of fine aluminium
    nitride powders used as the raw material for fine ceramics. This document stipulates
    the determination methods of the aluminium, total nitrogen, boron, calcium, copper,
    iron, magnesium, manganese, molybdenum, nickel, potassium, silicon, sodium, titanium,
    tungsten, vanadium, zinc, zirconium, carbon, chlorine, fluorine, and oxygen contents
    in aluminium nitride powders. The aluminium content is determined by using either
    an acid pressure decomposition-CyDTA-zinc back titration method or an acid digestion-inductively
    coupled plasma-optical emission spectrometry (ICP-OES) method. The total nitrogen
    content is determined by using an acid pressure decomposition-distillation separation-acidimetric
    titration method, a direct decomposition-distillation separation-acidimetric titration
    method, or an inert gas fusion-thermal conductivity method. The boron, calcium,
    copper, iron, magnesium, manganese, molybdenum, nickel, potassium, silicon, sodium,
    titanium, tungsten, vanadium and zinc contents are determined by using an acid
    digestion-ICP-OES method or an acid pressure decomposition-ICP-OES method. The
    sodium and potassium contents are determined via an acid pressure decomposition-flame
    emission method or an acid pressure decomposition-atomic absorption spectrometry
    method. The oxygen content is determined by using an inert gas fusion-IR absorption
    spectrometry method, while that of carbon is determined via a combustion-IR absorption
    spectrometry method or a combustion-conductometry method. The chlorine and fluorine
    contents are determined by using a pyrohydrolysation method followed by ion chromatography
    or spectrophotometry.
