abstract:
- language: en
  script: Latn
  content: This document specifies a test method for inductively coupled plasma optical
    emission spectrometry (ICP-OES) for the detection of the sulfur content from 2
    mg/kg to 21 mg/kg in fatty acid methyl esters (FAME). NOTE 1 For the purposes
    of this document, the term "% (m/m)" is used to represent the mass fraction (µ)
    of the material. NOTE 2 The method can also be used for the determination of concentrations
    outside the given limits. The precision statement, however, is only valid for
    the concentration range given in the scope. NOTE 3 The method described in the
    document was tested with FAME derived from soybean oil and beef tallow. FAME derived
    from other feedstock, in particular aged oils, may behave different due to the
    different nature of sulfur compounds.
