abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1099:2005 specifies the application module for Independent
    property definition. The following are within the scope of ISO/TS 10303-1099:2005:
    an observable or measurable quantity; NOTE 1   This concept is called a ''physical
    quantity instance''. EXAMPLE 1   The temperature of 400 degrees Celsius is a physical
    quantity instance. NOTE 2   A physical quantity instance is a class that has members.
    The members of 400 degrees Celsius are all objects that have this temperature.
    the physical quantity space that contains a physical quantity instance; NOTE 3  
    A physical quantity space contains different physical quantity instances for the
    same physical phenomenon. EXAMPLE 2   Temperature is a physical quantity space.
    The physical quantity instance that is the temperature of 400 degrees Celsius
    is a member of this space. the symmetry of a physical quantity instance; EXAMPLE
    3   Isotropic is a symmetry of a physical quantity instance. The physical quantity
    instance that is the elasticity with Young''s modulus of 210000 MNm-2 and Poisson''s
    ratio of 0.3 has isotropic symmetry.'
