abstract:
- language: en
  script: Latn
  content: This document specifies the dimensions and tolerances so as to ensure the
    interchangeability of pneumatic quick-action coupling plugs. It also provides
    specifications and application guidelines, and specifies the tests to be applied
    to the plugs together with sockets. NOTE 1 The construction and dimensions of
    sockets are left to the manufacturer's option. This document applies to cylindrical
    quick-action couplings for maximum working pressures of 1 MPa, 1,6 MPa and 2,5
    MPa (10 bar, 16 bar and 25 bar) for use in pneumatic fluid power systems. NOTE
    2 Quick-action couplings with shut-off valves for equipment for welding, cutting
    and related processes are covered by ISO 7289. This document applies only to the
    dimensional criteria of products manufactured in accordance with this document.
    It does not apply to their functional characteristics.
