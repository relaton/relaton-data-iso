abstract:
- language: en
  script: Latn
  content: ISO 15860:2006 covers gases (air, nitrogen, helium, and argon) compressed
    up to 40 MPa used in systems and units of space vehicle launch and technical complexes.
    ISO 15860:2006 determines compressed gas impurities (mechanical impurities, water
    vapour, oil, and foreign gases) content measurement methods. It can be used by
    countries and firms participating in the development, redesign, modernization,
    and maintenance of space vehicle launch sites and technical complexes.
