abstract:
- language: en
  script: Latn
  content: Le présent document fournit un flux de travail intégrant des modes opératoires
    expérimentaux et des algorithmes de détection des défauts destinés à localiser
    les défauts dans les pièces produites par le procédé de fusion laser sur lit de
    poudre métallique (PBF-LB). Il met l'accent sur l'utilisation de la surveillance
    in situ basée sur des photodiodes coaxiales et d'algorithmes statistiques et de
    regroupement par apprentissage automatique, en particulier pour détecter des défauts
    induits par un manque de fusion. Le flux de travail délimite les seuils de définition
    pour la détection statistique et la détermination du nombre de grappes pour les
    algorithmes d'apprentissage automatique, en utilisant des défauts implantés intentionnellement
    dans les pièces. Les modes opératoires de validation sont fournis par des données
    scannées par tomographie informatisée. Les limitations matérielles et les considérations
    relatives aux procédés multi-laser sont abordées, en soulignant les problèmes
    potentiels.
