abstract:
- language: en
  script: Latn
  content: This document provides a workflow comprising experimental procedures and
    flaw detection algorithms aimed at locating flaws in parts produced during the
    powder bed fusion-laser-based (PBF-LB) process of metals. It emphasizes the use
    of coaxial photodiode-based in-situ monitoring and statistical and clustering
    machine learning algorithms, particularly for detecting lack of fusion-induced
    flaws. The workflow delineates setting thresholds for statistical detection and
    determining the number of clusters for machine learning algorithms, utilizing
    intentional seeded flaws in parts. Validation procedures are provided through
    computed tomography scanner data. Hardware limitations and considerations for
    multi-laser processes are addressed, with attention to potential issues.
