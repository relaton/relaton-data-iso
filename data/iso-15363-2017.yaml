abstract:
- language: en
  script: Latn
  content: ISO 15363:2017 specifies the ring hydraulic pressure test for metallic
    tubes. It is generally applied to tubes with an outside diameter greater than
    120 mm and outside diameter to thickness ratio of not less than 20. The objective
    of this test is to ascertain the value of the hoop stress required to produce
    a specified total circumferential (hoop) strain.
