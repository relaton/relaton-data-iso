abstract:
- language: en
  script: Latn
  content: 'This document specifies definitions and technical criteria for labelling
    and claims for: —     foods containing no animal-derived ingredients and limited
    conditional use of animal-derived ingredients; —     ingredients containing no
    animal-derived ingredients and limited conditional use of animal-derived ingredients;
    —     food labelling and claims for foods containing no animal-derived ingredients
    and limited conditional use of animal-derived ingredients. This document does
    not apply to: —     any unprocessed edible part of a plant, such as fruits, vegetables,
    pulses and grains; —     animal feed and pet food; —     packaging material for
    foods. This document does not apply to pre-harvest, environmental safety, human
    safety, animal welfare, animal testing, or methods of manufacturing or preparation.
    This document defines general criteria that are applicable to all food categories
    and does not include any detailed compositional or nutritional criteria or technical
    guidance for specific food types.'
