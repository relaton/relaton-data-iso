abstract:
- language: en
  script: Latn
  content: 'This is a Type B MSS providing implementation guidelines for the Type
    A MSS ISO 30201. This document: - provides practical guidance for organisations
    to establish and improve a human resource management system (HRMS) consistent
    with the requirements specified in ISO 30201; - is applicable to organizations
    of all sizes, growth phases and sectors, whether public or private, for profit
    or not for profit; - does not determine the organization’s strategies and objectives.
    - is intended to be used in conjunction with ISO 30201.'
