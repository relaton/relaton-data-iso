abstract:
- language: en
  script: Latn
  content: This part of ISO 22262 specifies methods for sampling bulk materials and
    identification of asbestos in commercial bulk materials. This part of ISO 22262
    specifies appropriate sample preparation procedures and describes in detail the
    procedure for identification of asbestos by polarized light microscopy and dispersion
    staining. This part of ISO 22262 also specifies simple procedures for separation
    of asbestos fibres from matrix materials such as asphalt, cement, and plastics
    products. Optionally, identification of asbestos can be carried out using scanning
    electron microscopy or transmission electron microscopy with energy dispersive
    X-ray analysis. Information is also provided on common analytical problems, interferences
    and other types of fibre that may be encountered in the analysis. This part of
    ISO 22262 is applicable to qualitative identification of asbestos in specific
    types of manufactured asbestos-containing products and commercial minerals. This
    part of ISO 22262 is applicable to the analysis of fireproofing, thermal insulation,
    and other manufactured products or minerals in which asbestos fibres can readily
    be separated from matrix materials for identification. NOTE This part of ISO 22262
    is intended for use by microscopists who are familiar with polarized light microscopy
    methods and the other analytical procedures specified (References [16]?[19]).
    It is not the intention of this part of ISO 22262 to provide instruction in the
    fundamental analytical techniques.
