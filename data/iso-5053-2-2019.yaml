abstract:
- language: en
  script: Latn
  content: This document establishes only the vocabulary of fork arms and load handling
    attachments. This document gives no safety requirements of fork arms and load
    handling attachments. For the purpose of this document, the term attachment describes
    a device that is mounted to an industrial truck to allow an alternative way to
    use the lifting system. NOTE This document does not give any proposals as to which
    attachment can be appropriate for which load.
