abstract:
- language: en
  script: Latn
  content: ISO 28238:2010 specifies the characteristics of components of gating systems
    used in injection moulds for the processing of thermoplastics, thermosetting plastics
    and elastomers. These are gating systems for solidifying sprues for externally
    heated gating systems, internally heated gating systems and cold runner gating
    systems. The purpose of ISO 28238:2010 is to establish coherent terms for the
    different gating systems in professional terminology.
