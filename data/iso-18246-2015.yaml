abstract:
- language: en
  script: Latn
  content: ISO 18246:2015 specifies safety requirements for conductive connection
    to an external electric power supply of electrically propelled mopeds and motorcycles.
    It is not applicable to vehicles not in normal conditions, such as damaged vehicles
    and vehicles which have mechanical and/or electrical failure. It applies only
    to on-board charging systems between the plug or vehicle couplers and RESS circuits.
    The safety requirements for vehicles not connected to external power supply are
    specified in ISO 13063. NOTE This International Standard does not contain requirements
    for bidirectional power flow. It does not provide comprehensive safety information
    for manufacturing, maintenance and repair personnel.
