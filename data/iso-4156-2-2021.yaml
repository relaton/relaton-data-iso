abstract:
- language: en
  script: Latn
  content: This document specifies geometry and inspection dimensions for the design
    and manufacture of straight (non-helical) side-fitting cylindrical involute splines.
    Limiting dimensions, tolerances, manufacturing errors and their effects on the
    fit between connecting coaxial spline elements are defined and tabulated. Linear
    dimensions are expressed in millimetres and angular dimensions in degrees. The
    specified diameters for external splines in the geometry tables and the values
    in the inspection dimension tables are only valid for fundamental deviation "h".
    For fundamental deviations other than "h", diameters and tooth thicknesses are
    calculated for external splines according to the formulae in ISO 4156-1 and inspection
    dimensions according to the formulae in ISO 4156-3.
