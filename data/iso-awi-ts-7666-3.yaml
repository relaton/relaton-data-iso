abstract:
- language: en
  script: Latn
  content: This International Standard specifies the new method for rodent 2-year
    inhalation carcinogenesis study for the nanomaterials that are resistant to biodegradation
    to facilitate its utilization by shifting from its aerosol concentration in exposure
    chamber to the “lung burden” as a measure of its internal exposure of the experimental
    animals. This standard protocol is based on the principle that the lung burden
    is strongly related to the lung toxicity profile of the nanomaterials that are
    resistant to biodegradation, and is therefore applicable to the evaluation of
    chronic toxicity including carcinogenicity.
