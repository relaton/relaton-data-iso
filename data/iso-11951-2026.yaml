abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for single and double cold-reduced
    blackplate in the form of coils which are generally intended for manufacturing
    electrolytic tinplate or electrolytic chromium/chromium oxide-coated steel (ECCS)
    according to ISO 11949[1] or ISO 11950[2]. This document applies to: —     single
    cold-reduced blackplate which is generally specified in nominal thicknesses that
    are multiples of 0,005 mm from 0,150 mm up to and including 0,600 mm; —     double
    cold-reduced blackplate which is generally specified in nominal thicknesses that
    are multiples of 0,005 mm, from 0,100 mm up to and including 0,390 mm. This document
    applies to coils in nominal minimum rolling widths of 600 mm1) with either trimmed
    or untrimmed edges. 1)Nominal minimum rolling widths of 500 mm may be applied
    by agreement between the purchaser and the manufacturer.'
