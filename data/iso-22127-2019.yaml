abstract:
- language: en
  script: Latn
  content: This document specifies the dose assessment method when an RPLD is used
    for dosimetry audit in external high-energy X-ray beam radiotherapy. The dosimetry
    for electron beams and X-ray beams of stereotactic radiotherapy, gamma‑ray of
    brachytherapy is not included in this version. This document addresses RPLD handling,
    measurement method, conversion of measured value to dose, necessary correction
    coefficient, and the performance requirements for RPLD systems, including the
    reader.
