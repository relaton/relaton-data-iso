abstract:
- language: en
  script: Latn
  content: 'This document establishes requirements on fingermark image quality assessment
    algorithms that predict the utility of a fingermark image for search against databases
    of fingermark and fingerprint images. This document establishes: — terms and definitions
    for quantifying fingermark image quality and utility, — methods used to quantify
    the quality of fingermark images, and — standardized encoding of fingermark image
    quality, for images depicting a single fingermark region, with a known spatial
    sampling rate and a known bit depth.'
