abstract:
- language: en
  script: Latn
  content: Identifies surface treatments of components and substrates excluding ophthalmic
    optics (spectacles) by the application of optical coatings and gives a standard
    form for their specification. Defines the general characteristics and the test
    and measurement methods whenever necessary, but is not intended to define the
    process method. This part specifies categories of use for optical coatings and
    identifies corresponding environmental tests.
