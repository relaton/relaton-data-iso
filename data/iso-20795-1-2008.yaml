abstract:
- language: en
  script: Latn
  content: 'ISO 20795-1:2008 classifies denture base polymers and copolymers and specifies
    their requirements. It also specifies the test methods to be used in determining
    compliance with these requirements. It further specifies requirements with respect
    to packaging and marking the products and to the instructions to be supplied for
    use of these materials. Furthermore it applies to denture base polymers for which
    the manufacturer claims that the material has improved impact resistance. It also
    specifies the respective requirement and the test method to be used. ISO 20795-1:2008
    applies to denture base polymers such as those listed below: poly(acrylic acid
    esters); poly(substituted acrylic acid esters); poly(vinyl esters); polystyrene;
    rubber modified poly(methacrylic acid esters); polycarbonates; polysulfones; poly(dimethacrylic
    acid esters); polyacetals (polyoxymethylene); copolymers or mixtures of the polymers
    listed above.'
