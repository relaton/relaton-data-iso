abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1653:2006 specifies the application module for Cable. ISO/TS
    10303-1653:2006 deals with the representation of the usage view of a cable with
    its connectors, terminals and the externally visible definition of the connection
    between the cable terminals. The following is within the scope of ISO/TS 10303-1653:2006:
    definition of the usage view of a cable, including its connectors, terminals and
    terminal to terminal connections.'
