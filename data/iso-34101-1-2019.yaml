abstract:
- language: en
  script: Latn
  content: This document specifies high-level requirements for management systems
    for sustainable cocoa bean production, including post-harvest processes, if applicable,
    and traceability of the sustainably produced cocoa beans within the organization
    producing the cocoa beans. NOTE 1 Post-harvest processes include pod-breaking,
    fermentation, drying, sorting, packing, transport and storage of cocoa beans.
    Only organizations that fulfil both the cocoa sustainability management system
    requirements of either this document or ISO 34101‑4:2019, Annex A or B, and the
    performance requirements of ISO 34101‑2 can claim their cocoa beans have been
    sustainably produced. NOTE 2 ISO 34101-4 specifies the requirements for cocoa
    sustainability management systems at entry and medium levels.
