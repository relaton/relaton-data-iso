abstract:
- language: en
  script: Latn
  content: 'This document specifies safety requirements and/or protective measures
    applicable to EDM equipment and EDM systems intended to be adopted by persons
    undertaking their design, construction, installation and/or supply, such as: —   
    manually controlled EDM die sinking or EDM drilling machines; —    numerically
    controlled EDM die sinking or EDM drilling machines; and —    numerically controlled
    EDM wire cutting machines. This document also includes information to be provided
    by the manufacturer to the user. This document is not applicable to arc eroding
    and electro-chemical machining equipment. This document takes account of the precondition
    of the intended use as well as the reasonably foreseeable misuse, in normal workshop
    environments and non-explosive atmospheres, including transportation, installation,
    setting, maintenance, repair and dismantling for removal or disposal of EDM equipment
    and EDM systems. This document is also applicable to auxiliary devices essential
    for EDM processing. This document deals with all significant hazards, hazardous
    situations or hazardous events relevant to EDM equipment and EDM systems, where
    they are used as intended and under conditions of misuse which are reasonably
    foreseeable by the manufacturer (see Clause 4). This document is intended to apply
    to machines manufactured after the date of publication of this document. When
    requirements of this type-C standard are different from those which are stated
    in type-A or -B standards, the requirements of this type-C standard take precedence
    over the requirements of other standards for machines that have been designed
    and built according to the requirements of this type-C standard. This document
    defines required performance level and safety categories of the safety-related
    parts of the control system for EDM equipment and EDM systems as defined in ISO 13849-1:2015.'
