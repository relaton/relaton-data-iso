abstract:
- language: en
  script: Latn
  content: ISO 4250-1:2017 specifies designations and dimensions for earth-mover tyres
    and gives the recommended rims primarily intended for earth-moving machinery as
    defined in ISO 6165. The ISO 4250 series consists of three parts which specify
    the technical elements relating to designation and dimensions of tyres and rims
    for earth-movers; it also gives load tables for these tyres.
