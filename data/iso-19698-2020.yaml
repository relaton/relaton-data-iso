abstract:
- language: en
  script: Latn
  content: 'This document provides guidance on the conditions of beneficial use of
    biosolids produced from industrial and municipal sludge and municipal biosolids
    derived products (e.g. composts, growing media) in the production of food and
    feed crops, energy crops, forestry crops and for the remediation of disturbed
    sites. This document applies to biosolids for land application and includes biosolids
    from wastewater treatment (municipal, industrial and private onsite systems).
    This document does not apply to hazardous sludge that originates from wastewater
    which, due to its nature, physical, chemical or infectious properties, is potentially
    hazardous to human health and/or the environment during use, handling, storage
    or transportation and which requires special disposal techniques to eliminate
    or reduce the hazard. This document includes: — general guidelines for the land
    application of biosolids and biosolids derived products; — specific guidelines
    for the land application of biosolids and biosolids derived products for food
    and feed crop production and for non?food and non?feed crop production (e.g. horticulture,
    fibre for bio?mass, silviculture, etc.); and — specific guidelines for the land
    application of biosolids and biosolids derived products for other beneficial uses
    (e.g. land reclamation or rehabilitation).'
