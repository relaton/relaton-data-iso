abstract:
- language: en
  script: Latn
  content: ISO/IEC 9075 defines the SQL language. The scope of the SQL language is
    the definition of data structure and the operations on data stored in that structure.
    ISO/IEC 9075-1:2008, ISO/IEC 9075-2:2008 and ISO/IEC 9075-11:2008 encompass the
    minimum requirements of the language. Other parts define extensions. ISO/IEC 9075-1:2008
    specifies the conceptual framework used in other parts of ISO/IEC 9075 to specify
    the grammar of SQL and the result of processing statements in that language by
    an SQL-implementation.
