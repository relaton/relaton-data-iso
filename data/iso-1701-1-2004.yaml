abstract:
- language: en
  script: Latn
  content: ISO 1701-1:2004 specifies, with reference to ISO 230-1, both geometric
    and machining tests on general purpose, normal accuracy, horizontal-spindle milling
    machines with table of variable height. It also specifies the applicable tolerances
    corresponding to the above-mentioned tests. ISO 1701-1:2004 deals only with the
    verification of accuracy of the machine. It does not apply to the testing of the
    running of the machine (vibration, abnormal noise, stick-slip motion of components,
    etc.), nor to machine characteristics (such as speeds, feeds, etc.), as such checks
    are generally carried out before testing the accuracy.
