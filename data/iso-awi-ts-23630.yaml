abstract:
- language: en
  script: Latn
  content: This technical specification provides guidance on the use of Computational
    Fluid Dynamics for the steady-state prediction of fan performance at defined operating
    points. These operating points include those relating to simulated acceptance
    tests (EN ISO 5801:2017 for axial fans, EN ISO 13350:2015 for jet fans), as well
    as modelled in-situ performance (EN ISO 5802:2008/A1:2015 for axial fans). The
    objective of this guidance is to enable practitioners to follow a robust methodology
    to ensure that their predictions of fan aerodynamic data (including volumetric
    flowrate, pressure rise and absorbed power) lie within one of the tolerance grades
    defined in ISO 13348:2007.
