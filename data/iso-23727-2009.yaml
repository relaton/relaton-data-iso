abstract:
- language: en
  script: Latn
  content: ISO 23727:2009 provides for the interchangeability of attachments on wheeled
    loaders by establishing common dimensions and clearances for a coupler. It is
    applicable to wheeled loaders as defined in ISO 6165 with an operating mass of
    between 8 000 kg and 17 500 kg. Alternative coupler designs and dimensions are
    permitted, but might not provide broad interchangeability of attachments. ISO
    23727:2009 is not intended for, but may be applicable to, other wheeled loaders,
    skid steer loaders or backhoe loaders if interchangeability of common attachments
    is desired. It does not require the fitting of a coupler and attachments can be
    directly mounted to the lifting linkage without the use of one.
