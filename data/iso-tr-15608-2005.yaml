abstract:
- language: en
  script: Latn
  content: 'ISO/TR 15608:2005 provides a uniform system for grouping of materials
    for welding purposes. It may also apply to other purposes such as heat treatment,
    forming, non-destructive testing. It covers grouping systems for the following
    standardized materials: steel;aluminium and its alloys;nickel and its alloys;copper
    and its alloys;titanium and its alloys;zirconium and its alloys;cast iron.'
