abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory method for measuring hand-transmitted
    vibration emission at the handles of hand-held power-driven angle and vertical
    grinders. It is a type-test procedure for establishing the magnitude of vibration
    in the gripping areas of a machine fitted with a specified test wheel and run
    under no‑load conditions. The method has been established for surface grinding
    tasks only. Cutting and sanding generally create lower vibrations. It is intended
    that the results be used to compare different models of the same type of machine.
    This document is applicable to hand-held machines (see Clause 5), driven pneumatically
    or by other means, intended for grinding, cutting-off and rough sanding, with
    bonded, coated and super-abrasive products and with wire brushes for use on all
    kinds of materials. It is not applicable to die grinders or straight grinders.
    NOTE To avoid confusion with the terms "power tool" and "inserted tool", machine
    is used for the former throughout this document.
