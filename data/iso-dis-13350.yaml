abstract:
- language: en
  script: Latn
  content: ISO 13350:2015 deals with the determination of those technical characteristics
    needed to describe all aspects of the performance of jet fans as defined in ISO
    13349. It does not cover those fans designed for ducted applications, nor those
    designed solely for air circulation, e.g. ceiling fans and table fans. The test
    procedures described in this International Standard relate to laboratory conditions.
    The measurement of performance under on-site conditions is not included.
