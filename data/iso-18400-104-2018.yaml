abstract:
- language: en
  script: Latn
  content: This document gives general guidance on the development of site investigation
    strategies and detailed guidance on the development of sampling strategies, when
    collecting information on — the average properties of soil, — the variability
    of soil properties, and — the spatial distribution of soil properties. It is applicable
    to soil samples intended for chemical testing and determination of a variety of
    other properties (e.g. physical). Although the main focus of this document is
    the collection of material (field samples) for transfer to a laboratory for testing,
    it is also applicable when measurements are made directly in the field. NOTE 1
    This document also provides information on the statistical principles underlying
    the development of appropriate sampling strategies and statistical methodologies.
    NOTE 2 Guidance on other forms of related sampling activities are given in other
    International Standards [for soil gas (ISO 18400-204) and for biological testing
    purposes (ISO 18400-206)]. Guidance on sampling groundwater is provided in ISO
    5667-11 and ISO 5667-22 and on sampling methods and groundwater measurements in
    geotechnical investigations in ISO 22475-1.
