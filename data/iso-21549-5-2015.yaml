abstract:
- language: en
  script: Latn
  content: 'ISO 21549-5:2015 describes and defines the basic structure of the identification
    data objects held on healthcare data cards, but does not specify particular data
    sets for storage on devices. The detailed functions and mechanisms of the following
    services are not within the scope of this part of ISO 21549 (although its structures
    can accommodate suitable data objects elsewhere specified): - security functions
    and related services that are likely to be specified by users for data cards depending
    on their specific application, e.g. confidentiality protection, data integrity
    protection and authentication of persons and devices related to these functions;
    - access control services; - the initialization and issuing process (which begins
    the operating lifetime of an individual data card, and by which the data card
    is prepared for the data to be subsequently communicated to it according to this
    part of ISO 21549). The following topics are therefore beyond the scope of this
    part of ISO 21549: - physical or logical solutions for the practical functioning
    of particular types of data card; - the forms that data take for use outside the
    data card, or the way in which such data are visibly represented on the data card
    or elsewhere.'
