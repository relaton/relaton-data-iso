abstract:
- language: en
  script: Latn
  content: ISO 21289:2008 identifies a set of parameters to be specified, as applicable,
    for vibration measurements, analysis, reporting and archiving. It is intended
    for use in the testing of structures, machines, vehicles, sensitive equipment
    and other dynamic systems. ISO 21289:2008 applies to measurements made by modern
    data acquisition systems, including digital signal processors, using readily available
    commercial instrumentation. It can be applied to a variety of common vibration
    measurement types, including time history, spectrum and frequency-response function
    measurements.
