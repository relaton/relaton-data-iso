abstract:
- language: en
  script: Latn
  content: ISO/IEC 24728:2006 specifies the requirements for the bar code symbology
    known as MicroPDF417. It specifies the MicroPDF417 symbology characteristics,
    data character encodation, symbol formats, dimensions, error correction rules,
    decoding algorithm, and a number of application parameters. MicroPDF417 is a multi-row
    symbology, derived from and closely based on PDF417. MicroPDF417 is designed for
    applications with a need for improved area efficiency but without the requirement
    for PDF417's maximum data capacity. A limited set of symbol sizes is available,
    together with a fixed level of error correction for each symbol size. Module dimensions
    are user-specified to enable symbol production and reading by a wide variety of
    techniques. Since MicroPDF417's data character encodation, its error correction
    method, and many of its other symbol characteristics are, and are intended to
    remain, identical to those of PDF417, descriptions of these characteristics are
    quoted verbatim from the PDF417 symbology specification (ISO/IEC 15438) wherever
    appropriate, or with the appropriate modifications. For ease of cross-reference,
    ISO/IEC 24728:2006 follows a similar document structure, with minor differences
    in clause/subclause numbering, to the PDF417 symbology specification.
