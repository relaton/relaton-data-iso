abstract:
- language: en
  script: Latn
  content: This document specifies a general wet-sample preparation technique common
    to the size analysis of nano-powdered fine ceramic materials. The measurement
    method is intended for the Dynamic Light Scattering technique (DLS). The particle
    sizes of the nano powders covered by this document are 10-1000 nm. It should be
    noted that even when following this document, the measured particle size distribution
    may include secondary particles (agglomerates). This is not considered a flaw
    in the measurement procedure; rather, it is a fundamental characteristic of the
    nano powders being evaluated.
