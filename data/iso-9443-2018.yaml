abstract:
- language: en
  script: Latn
  content: This document specifies technical delivery requirements for the surface
    quality of round bars, squares, hexagons and wire rod in the hot rolled condition
    with nominal dimensions dN from 5 mm to 200 mm. This document is applicable to
    bright products and tool steels, if agreed at the time of enquiry and order between
    manufacturer and purchaser. By agreement between manufacturer and purchaser, this
    document can also be applied to other special profiles. This document is particularly
    applicable to steels for engineering and structural applications. This document
    does not include any requirements for the permissible depth of surface decarburization.
    NOTE The determination of depth of surface decarburization is presented in ISO
    3887. The material standards for steel bars and wire rod can exclude the application
    of one or other of the surface quality classes of this document. They can also
    cover requirements for surface quality which deviate from this document. In these
    cases the requirements of the material standard prevail.
