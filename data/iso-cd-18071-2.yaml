abstract:
- language: en
  script: Latn
  content: This document specifies the determination of the antiviral activity of
    materials that contain indoor-light-active photocatalytic materials or have indoor-light-active
    photocatalytic films on the surface by measuring the infectivity titre of virus
    after illumination with indoor light using the virus that can infect animal cells.
    Due to individual sensitivities, the results of one test virus might not be applicable
    to other viruses. This document is intended for use with different kinds of indoor-light-active
    photocatalytic materials used in construction materials, in flat sheet, board
    or plate shapes that are the basic forms of materials for various applications.
    It does not include powder, granular or porous indoor-light-active photocatalytic
    materials. This document is applicable to indoor-light-active photocatalytic materials
    produced for an antiviral applications. Other types of performance of indoor-light-active
    photocatalytic materials, i.e. antibacterial activity, antifungal activity, decomposition
    of water contaminants, self-cleaning, antifogging and air purification, are not
    determined by this method. The values expressed in this document are in accordance
    with the International System of Units. (SI)
