abstract:
- language: en
  script: Latn
  content: ISO 9181:2007 specifies the dimensions and tolerances, in millimetres,
    for round punches with a 60° conical head and reduced shank, having shank diameters
    of 2 mm or 3 mm. ISO 9181:2006 gives examples of materials and hardness, and specifies
    the designation of punches which meet the requirements of this document. The main
    use of punches defined in ISO 9181:2006 is for punching holes in steel sheet.
    They may also be used for punching holes in other materials.
