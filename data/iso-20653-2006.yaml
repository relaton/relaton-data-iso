abstract:
- language: en
  script: Latn
  content: 'ISO 20653:2006 applies to degrees of protection (IP-Code) provided by
    enclosures of the electrical equipment of road vehicles. It specifies the following:
    Designations and definitions of types and degrees of protection provided by enclosures
    of electrical equipment (IP-Codes) for the: protection of electrical equipment
    within the enclosure against ingress of foreign objects, including dust (protection
    against foreign objects);protection of electrical equipment inside the enclosure
    against effects due to ingress of water (protection against water);protection
    of persons against access to hazardous parts inside the enclosure (protection
    against access); Requirements for each degree of protection;Tests to be carried
    out in order to confirm that the enclosure complies with requirements of the relevant
    degree of protection.'
