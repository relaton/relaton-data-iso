abstract:
- language: en
  script: Latn
  content: ISO 6508-1:2015 specifies the method for Rockwell regular and Rockwell
    superficial hardness tests (scales and applicable range of application according
    to Table 1) for metallic materials and is applicable to stationary and portable
    hardness testing machines. For specific materials and/or products, other specific
    International Standards apply (for instance, ISO 3738‑1 and ISO 4498). NOTE Attention
    is drawn to the fact that the use of tungsten carbide composite for ball indenters
    is considered to be the standard type of Rockwell indenter ball. Steel indenter
    balls are allowed to continue to be used only when complying with Annex A.
