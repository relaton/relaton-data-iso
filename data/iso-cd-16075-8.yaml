abstract:
- language: en
  script: Latn
  content: 'This part of ISO 16075 provides a guideline for the design and use of
    reservoirs for the purpose of storing treated wastewater (TWW) and other types
    of water intended for irrigation of agricultural crops and various other uses.
    This document will cover the following aspects: — the need to store water for
    reuse, — types of reservoirs, — chemical, physical and biological processes in
    stored water, — monitoring of water quality in the reservoir, — reservoir design,
    — facilities in the reservoir, — reservoir sealing, — reservoir cover, — reservoirs
    maintenance.'
