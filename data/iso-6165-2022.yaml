abstract:
- language: en
  script: Latn
  content: 'This document provides vocabulary and an identification structure for
    classifying earth-moving machinery designed to perform the following operations:
    —    excavation; —    loading; —    transportation; —    drilling, spreading,
    compacting or trenching of earth, rock and other materials, during work, for example,
    on roads and dams, in quarries and mines and on building sites. The purpose of
    this document is to provide a clear means to identify earth-moving machinery according
    to its function and design configurations which can include additional classifications
    according to its operating mass and control operator configuration. Annex A provides
    a procedure based on the identification structure used by this document to classify
    the machinery and introduce detailed identifications consistent with the logic
    implied by the structure. Annex B provides a hierarchy of the operator control
    configurations for earth-moving machinery.'
