abstract:
- language: en
  script: Latn
  content: This document provides guidelines for the planning and implementation of
    hardening of different water and wastewater infrastructures aiming to improve
    the resilience of water and wastewater services provided by water utilities through
    security measures. It applies to the determination of measures for the protection
    of water supply systems and sewer collection systems from unwanted or unplanned
    access, as part of risk management. This document is applicable to all water and/or
    wastewater utilities. This document does not include guidelines for the protection
    of large water sources such as lakes or rivers.
