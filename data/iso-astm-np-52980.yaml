abstract:
- language: en
  script: Latn
  content: This document provides an overview and a categorisation of computational modelling and simulation in additive manufacturing (AM), including their application to AM processes, materials and parts. It supports the use of modelling approaches for decision-making across the AM process chain and includes relevant terms, definitions and considerations for input data, calibration and validation. This document is applicable to all AM process categories and all AM modelling approaches, irrespective of the underlying mathematical or numerical methods. The document is intended for users and developers of computational modelling and simulation in AM. This document does not address geometric or computer-aided design (CAD) modelling activities, which are covered by the ISO/ASTM 52910 ‎[2] and ISO/ASTM 52911 series ‎[3]-‎[5].
