abstract:
- language: en
  script: Latn
  content: The proposed International Standard specifies cryptographic mechanisms
    to compute a function on encrypted data, while preserving the confidentiality
    of input, intermediate data, and output of a computation using Fully Homomorphic
    Encryption. The document provides the definitions, symbols, and formats. It defines
    the security model, assumptions, message spaces, ciphertext spaces, key spaces,
    and formats, and the cryptographic mechanisms for the cryptographic schemes suitable
    for standardization.
