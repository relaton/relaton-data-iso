abstract:
- language: en
  script: Latn
  content: ISO 5351:2010 specifies a method which yields a number that is an estimate
    of the limiting viscosity number of pulp in a dilute cupri-ethylenediamine (CED)
    solution. ISO 5351:2010 is primarily applicable to CED-soluble samples of bleached
    chemical pulps but can also be applied to any kind of pulp that dissolves completely
    in CED solution.
