abstract:
- language: en
  script: Latn
  content: ISO 17615:2007 defines the requirements for grades of alloyed aluminium
    ingots intended for remelting. It specifies the classifications and designations
    applicable to these grades, the conditions in which they are produced, their properties
    and the required identification marking. ISO 17615:2007 does not address the issue
    of radioactivity. Certain elements, such as Pb, Hg, Cr6 and Cd, may be subject
    to restrictions.
