abstract:
- language: en
  script: Latn
  content: 'Establishes a general classification of cranes based on the number of
    operating cycles to be carried out during the expected life of the crane and a
    load spectrum factor which represents a nominal state of loading. Classification
    considers only the operating conditions which are independent of the type of crane
    and the way it is driven.   Additional information for the user: This version
    uses the time - based classification method. If you need to use the cycle - based
    classification method please use the 2016 version.'
