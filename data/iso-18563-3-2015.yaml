abstract:
- language: en
  script: Latn
  content: 'ISO 18563-3:2015 addresses ultrasonic test systems implementing linear
    phased array probes, in contact (with or without wedge) or in immersion, with
    centre frequencies in the range of 0,5 MHz?10 MHz. It provides methods and acceptance
    criteria for verifying the performance of combined equipment (i.e. instrument,
    probe and cables connected). The methods described are suitable for users working
    under on-site or shop floor conditions. Its purpose is for the verification of
    the correct operation of the system prior to testing, and also the characterization
    of sound beams or verification of the absence of degradation of the system. The
    methods are not intended to prove the suitability of the system for particular
    applications, but are intended to prove the capability of the combined equipment
    to generate ultrasonic beams according to the settings used. The calibration of
    the system for a specific application is outside of the scope of part of ISO 18563
    and it is intended that it be covered by the test procedure. ISO 18563-3:2015
    does not address the following: - encircling arrays; - series of apertures having
    a different number of elements; - different settings for transmitting and receiving
    (e.g. active aperture, number of active elements, delays); - techniques using
    post-processing of the signals of individual elements in a more complex manner
    than a simple delay law (e.g. full matrix capture).'
