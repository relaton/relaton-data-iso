abstract:
- language: en
  script: Latn
  content: This part of ISO 22056 describes a method for verifying the minimum dirt
    holding capacity (grams) of an aerospace lubricant fluid filter element to a maximum
    expected differential pressure This test procedure describes the laboratory conditions
    for tests and will need to be augmented by system level testing including actual
    conditions of use, for example the operating fluid or contamination. The tests
    data resulting from application of this part of ISO 22056 can be used to compare
    the performance of aerospace lubricant filter elements.
