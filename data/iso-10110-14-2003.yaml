abstract:
- language: en
  script: Latn
  content: International Standard ISO 10110 applies to the presentation of design
    and functional requirements for optical elements and assemblies in technical drawings
    used for manufacturing and inspection. ISO 10110-14:2003 provides rules for the
    indication of the allowable deformation of a wavefront transmitted through or,
    in the case of reflective optics, reflected from an optical element or assembly.
    The deformation of the wavefront refers to its departure from the desired shape
    ("Nominal theoretical wavefront"). The tilt of the wavefront with respect to a
    given reference surface is excluded from the scope. There is no requirement that
    a tolerance for wavefront deformation be indicated. If such a tolerance is specified,
    it does not take precedence over a tolerance for the surface deformation according
    to ISO 10110-5. If tolerances for both the surface deformation and the wavefront
    deformation are given, they must both be upheld.
