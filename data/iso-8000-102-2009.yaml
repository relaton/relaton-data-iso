abstract:
- language: en
  script: Latn
  content: ISO 8000-102:2009 contains the vocabulary relating to master data quality,
    for use in connection with the master data quality series of parts of ISO 8000.
    ISO 8000-102:2009 includes those terms and definitions referenced in published
    parts of ISO 8000 dealing with master data quality. It is therefore not a comprehensive
    lexicon for master data quality. ISO 8000-102:2009 includes terms and definitions
    related to syntax and semantics of master data messages, terms and definitions
    related to characteristic data and data provenance, and terms and definitions
    related to items of production and items of supply.
