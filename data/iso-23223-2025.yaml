abstract:
- language: en
  script: Latn
  content: This document specifies requirements, test methods and marking for alpine
    ski-boots with improved walking soles that are used with systems of alpine ski-bindings
    for improved walking soles with attachment at the boot front and boot rear, the
    proper release function of which depends on the dimensions and design of the interfaces.
    Alpine ski boots with improved walking soles are intended to a better walkability
    without affecting the function of the alpine ski binding designed for improved
    walking soles. This document is applicable to ski-boots of sizes 15,0 and larger
    [Types A (Adults) and C (Children)] in the Mondopoint system (see Annex A).
