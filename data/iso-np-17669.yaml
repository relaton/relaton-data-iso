abstract:
- language: en
  script: Latn
  content: This document specifies a method for the quantitative determination of
    the microstructure of synthetic isoprene rubber (IR) using 1H-NMR spectrometry.
    The relative content of three components in IR, cis1,4-, trans1,4-, and 3,4-polyisoprene
    can be calculated respectively. This method is applicable for raw synthetic isoprene
    rubber.
