abstract:
- language: en
  script: Latn
  content: 'This document defines the design, safety and operation characteristics
    of cryo-compressed hydrogen land vehicle (CcHLV) refuelling connectors. CcHLV
    refuelling connectors consist of the following components, as applicable: • —
    receptacle and protective cap (mounted on vehicle); • — nozzle; • — communication
    hardware. This document is applicable to refuelling connectors which have nominal
    working pressures or hydrogen service levels up to 40 MPa. This document is not
    applicable to refuelling connectors dispensing blends of hydrogen with natural
    gas, gaseous or liquid hydrogen.'
