abstract:
- language: en
  script: Latn
  content: ISO 1853:2011 specifies the requirements for the laboratory testing of
    the volume resistivity of specially prepared test pieces of vulcanized or thermoplastic
    rubber compounds rendered conducting or dissipative by the inclusion of carbon
    black or ionizable materials. The tests are suitable for materials with a resistivity
    of less than about 108 ohm metres. Method 1 is the preferred method when test
    pieces with bonded electrodes are not available. Method 2 is the preferred method
    when test pieces are moulded with the inclusion of bonded electrodes. Method 3
    may be used if methods 1 and 2 are not suitable, but it has lower accuracy.
