abstract:
- language: en
  script: Latn
  content: This document provides guidelines for a comprehensive qualification scheme
    for VTE used in the evaluation of ADS. It specifies the criteria and procedures
    for assessing the VTE. This document is applicable to Open-Loop as well as Closed-Loop
    environments. Examples are Model-in-the-Loop (MiL) and Software-in-the-Loop (SiL)
    testing methodologies and may extend to hybrid testing techniques such as Hardware-in-the-Loop
    (HiL) and Vehicle-in-the-Loop (ViL). This document does not address the validation
    or assessment of individual simulation models, such as sensor or vehicle dynamics
    models, nor does it evaluate the ADS themselves. This document is intended for
    ADS developers, testing organizations, and regulatory bodies responsible for ensuring
    that VTE can provide reliable and adequate representations of real-world test
    environments.
