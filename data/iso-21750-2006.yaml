abstract:
- language: en
  script: Latn
  content: ISO 21750:2006 deals with electronic Tyre Pressure Monitoring Systems (TPMS)
    for tubeless tyres in association or not with an Extended Mobility System with
    a reference pressure lower or equal to 375 kPa fitted in single formation on four
    wheeled vehicles. The systems are able to survey all tyres in use, but not necessarily
    those in temporary use, and provide information to the driver. ISO 21750:2006
    establishes overall performance guidelines for the systems and their components,
    independently of the physical principles and the technological solution which
    have been selected to monitor the tyre pressure to compute the difference to the
    requested level and to deliver a relevant information to the driver if the pressure
    of one, several or all tyres need corrective action for the intended service conditions.
