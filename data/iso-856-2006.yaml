abstract:
- language: en
  script: Latn
  content: 'ISO 856:2006 specifies certain characteristics of the oil of peppermint
    (Mentha x piperita L.), with a view to facilitate assessment of its quality. As
    it is difficult to differentiate the specification of peppermint oils (Mentha
    x piperita L.) from different origins, they have been regrouped in ISO 856:2006.
    The following origins have been taken into consideration: USA, United Kingdom,
    France, Italy, India and China.'
