abstract:
- language: en
  script: Latn
  content: ISO 11296-4:2009, in conjunction with ISO 11296-1, specifies requirements
    and test methods for cured-in-place pipes and fittings used for the renovation
    of underground non-pressure drainage and sewerage networks. It applies to the
    use of various thermosetting resin systems, in combination with compatible fibrous
    carrier materials and other process-related plastics components.
