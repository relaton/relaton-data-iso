abstract:
- language: en
  script: Latn
  content: ISO 12151-3:2010 specifies the general and dimensional requirements for
    the design and performance of flange hose fittings, made of carbon steel, for
    nominal hose inside diameters of 12,5 mm to 51 mm inclusive, in accordance with
    ISO 4397, for use with ports and clamps in accordance with ISO 6162-1 and ISO
    6162-2. Materials other than carbon steel can be supplied as agreed between the
    manufacturer and user. These fittings are used in hydraulic fluid power systems
    with hose that meets the requirements of the respective hose standards and in
    general applications with suitable hoses.
