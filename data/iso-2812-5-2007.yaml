abstract:
- language: en
  script: Latn
  content: ISO 2812-5:2007 specifies a method, using a temperature-gradient oven,
    for determining the resistance of an individual-layer or multi-layer system of
    coating materials to the effects of liquids or paste-like products. This method
    enables the testers to determine the effects of the test substance on the coating
    and, if necessary, to assess the damage to the substrate.
