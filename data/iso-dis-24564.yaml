abstract:
- language: en
  script: Latn
  content: 'This document specifies general requirements for adhesive selection with
    the adhesive bonding process and quality assurance used in space systems. This
    document can be applied to different types of adhesive materials in space systems,
    such as launch vehicles, satellites, spacecraft and space station for the following
    applications: bonding, components embedding (only for space application), sealing,
    fixing and repairing.'
