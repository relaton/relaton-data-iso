abstract:
- language: en
  script: Latn
  content: This document describes principles and tools to control a manufacturing
    process in accordance with a GPS specification. For this purpose a set of one
    or more complementary, independent characteristics (size, form, orientation, and
    location characteristics independent to each other) that correlate to the manufacturing
    process parameters and to the manufacturing process coordinate system established
    from the manufacturing datum system are used. This document describes the concept
    of decomposition of the macro-geometrical part of the GPS specification. It does
    not cover the micro-geometry, i.e. surface texture. The objective of the decomposition
    presented in this document is to define correction values for manufacturing control
    or to perform a statistical analysis of the process.
