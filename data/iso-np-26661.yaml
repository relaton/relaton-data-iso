abstract:
- language: en
  script: Latn
  content: This document specifies the quality and safety requirements and test methods
    for Gentianae macrophyllae Radix that is derived from the root of Gentiana macrophylla
    Pall., Gentiana straminea Maxim., Gentiana crassicaulis Duthie ex Burk. and Gentiana
    daurica Fisch.. This document applies to Gentianae macrophyllae root that is sold
    and used as natural medicines in international trade, including Chinese materia
    medica (whole medicinal materials) and decoction pieces derived from this plant.
