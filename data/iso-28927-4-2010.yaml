abstract:
- language: en
  script: Latn
  content: ISO 28927-4:2010 specifies a laboratory method for measuring hand-transmitted
    vibration emission at the handles of straight grinders. It is a type-test procedure
    for establishing the magnitude of vibration in the gripping areas of a machine
    fitted with a specified test wheel and run under no-load conditions. ISO 28927-4:2010
    is applicable to hand-held machines, driven pneumatically or by other means, intended
    for grinding and surface finishing using straight grinding wheels type 1, tapered
    wheels type 4 and cylindrical plugs, e.g. of type 16 (cylindrical plug, tapered
    cone), 18 (cylindrical plug, flat end), 18R (cylindrical plug, rounded end) and
    19 (cylindrical plug, taper-roll shaped), for use on all kinds of materials. It
    is not applicable to grinders used with wire brushes, nor is it applicable to
    die grinders where the inserted tool is mounted in a collet.
