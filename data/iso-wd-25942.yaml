abstract:
- language: en
  script: Latn
  content: This standard specifies the method for detection of silica in water and
    wastewater. This colorimetric method determines molybdatereactive silica. It is
    applicable to most waters, though some may require filtration and dilution to
    remove interferences from colour and turbidity. This method is useful for concentrations
    as low as 20 μg/l.
