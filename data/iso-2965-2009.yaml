abstract:
- language: en
  script: Latn
  content: ISO 2965:2009 specifies a method for the determination of air permeability
    (AP). It is applicable to materials used as cigarette papers, filter plug wrap
    and filter joining paper, including materials having an oriented permeable zone
    or discrete permeable zones where the measured permeability is in excess of 10
    cm3 . (min-1 . cm-2) at 1 kPa. In addition, it is applicable to banded cigarette
    papers, with bands no narrower than 4 mm.
