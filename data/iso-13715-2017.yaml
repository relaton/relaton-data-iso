abstract:
- language: en
  script: Latn
  content: ISO 13715:2017 specifies rules for the indication and dimensioning of undefined
    edges in technical product and dimensions. The proportions and dimensions of the
    graphical symbols to be used are also specified. In cases where the geometrically
    defined shape of an edge (for example, 1 × 45°) is required, the general dimensioning
    principles given in ISO 129‑1 apply.
