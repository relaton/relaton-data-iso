abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1703:2014-02 specifies the application module for Model parameter.
    The following are within the scope of ISO/TS 10303-1703:2014-02: the identification
    of a parameter for a model;the identification of a parameter based on a schema;the
    assignment of values to a parameter;the assignment of a parameter to a model;overriding
    of a parameter assignment;assignment of a parameter value to a product category;assignment
    of a parameter value to a product in a category;assignment of a parameter value
    based on a test method.'
