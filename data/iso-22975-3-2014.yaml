abstract:
- language: en
  script: Latn
  content: ISO 22975-3:2014 is applicable to the determination of the long term behaviour
    and service life of selective solar absorbers for use in vented flat plate solar
    collectors working under conditions corresponding to that in a typical solar domestic
    hot water system or combisystem. ISO 22975-3:2014 specifies a failure criterion
    of a solar absorber based on changes in optical performance of the absorber. The
    optical properties of interest are solar absorptance and thermal emittance. ISO
    22975-3:2014 specifies durability testing procedures focused on resistance to
    high temperatures and condensation of water on the absorber surface as well as
    high humidity in the presence of sulfur dioxide.
