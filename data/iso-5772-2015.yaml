abstract:
- language: en
  script: Latn
  content: ISO 5772:2015 specifies minimum requirements for three types of hoses in
    two categories and two classes of hose assemblies used for measured fuel dispensing,
    including oxygenated fuels (up to a maximum of 15 % oxygenated compounds). The
    assemblies are intended for use at ambient temperatures between −30 °C and +55
    °C for normal temperature class and −40 °C and +55 °C for low temperature class
    at a working pressure up to and including 16 bar (1,6 MPa). NOTE 1 bar = 0,1 MPa.
