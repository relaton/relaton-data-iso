abstract:
- language: en
  script: Latn
  content: 'This document specifies minimum requirements for the construction, design,
    material, performance, test methods and marking at manufacture of non-refillable
    liquefied petroleum gas (LPG) cartridges. This document is applicable to non-refillable
    LPG cartridges which: a) predominantly comprise butane fuel gas (iso/normal);
    b) have a total nominal capacity of up to 250 g net; c) are intended to deliver
    gas in the vapour state when either positioned upright or in a horizontal orientation;
    d) are used with certain types of gas appliances, e.g. portable gas cookers; e)
    are classified as UN 2037, RECEPTACLES, SMALL, CONTAINING GAS (GAS CARTRIDGES)
    without a release device, non-refillable for the transport of dangerous goods.'
