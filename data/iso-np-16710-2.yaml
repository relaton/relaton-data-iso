abstract:
- language: en
  script: Latn
  content: This International Standard describes a procedure for analysing human activity
    in relation to specifying and refining the human component in the design or redesign
    of machinery and work systems. The ergonomics methodology described in this International
    Standard could also be applied to the design or redesign of products and non-work
    systems. This International Standard is intended to assist project leaders in
    implementing human and physical resources, methods and schedules as well as in
    preparing the documents necessary to meeting related requirements. The ergonomics
    methodology described can be applied to all different stages in design projects
    from the earliest concept to the final “prototype” or “mock-up”, whatever the
    industrial field or sector. The objective of this International Standard is to
    achieve a solution that takes into account as many situations as possible which
    all users - including operators, maintenance staff and installers, may encounter.
    This will ultimately allow improved usability of the machinery and more robust
    technical solutions, combined with significantly greater system resilience, user
    autonomy and accessibility. Examples of the application of the methodology described
    in this International Standard are provided in Annex A.
