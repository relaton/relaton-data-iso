abstract:
- language: en
  script: Latn
  content: ISO 16840-2:2018 specifies apparatus, test methods and disclosure requirements
    for wheelchair seat cushions intended to maintain tissue integrity and prevent
    tissue trauma. Test conditions simulate a symmetric anatomy and posture and do
    not represent cushion performance for specific individual users. Loads are intended
    to represent those seen under the pelvis of a 50th percentile wheelchair user
    and are not intended to assess the weight capacity of the cushion or to characterize
    the cushion under bariatric loads. It is possible that not all test methods apply
    to existing and future cushion technologies. It does not include test methods
    or requirements for determining the fire resistance of cushions. ISO 16840-2:2018
    can also be applicable to tissue integrity management devices used as other support
    systems, as well as to cushions used in situations other than a wheelchair.
