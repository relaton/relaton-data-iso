abstract:
- language: en
  script: Latn
  content: This document specifies methods, tolerances and acceptance criteria for verifying the performance of combined ultrasonic test equipment (i.e. instrument, probes and cables connected) by the use of appropriate standard calibration blocks. These methods are specifically intended for manual test equipment, i.e. ultrasonic instruments according to ISO 22232-1, and for manual ultrasonic non-destructive testing with single- or dual-transducer probes according to ISO 22232-2. This document is also applicable for multi-channel instruments. For automated test equipment, different tests can be needed to ensure satisfactory performance. The specified methods are intended for the use by operators working under site or shop floor conditions. These methods are not intended to prove the suitability of the equipment for particular applications. This document excludes ultrasonic instruments for continuous waves. This document also excludes ultrasonic phased array systems, see e. g. ISO 18563-3. If a phased array instrument is used in combination with single- or dual-transducer probes, this document is applicable to this combination.
