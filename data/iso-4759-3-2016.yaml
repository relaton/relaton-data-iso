abstract:
- language: en
  script: Latn
  content: ISO 4759-3:2016 specifies tolerances for flat washers of product grades
    A, C and F with nominal diameters of 1 mm to 150 mm inclusive, designed to be
    used in bolted joints in combination with bolts, screws, studs and nuts. This
    part of ISO 4759 may be applied to non-flat washers however it does not include
    all the tolerances related to these washers. It applies to non-captive and captive
    washers, and to standard and non-standard washers. It does not apply to dynamic
    disc springs. Washers of product grades F and A are intended to be used with bolts,
    screws, studs and nuts of product grades A and B; washers of product grade C are
    intended to be used with bolts, screws, studs and nuts of product grade C. NOTE
    The product grade refers to a specific tolerance range related to dimensional
    and geometrical characteristics (product grade F for fine tolerances, product
    grade A for precise tolerances, product grade C for large tolerances). Annex A
    presents tolerances taken from ISO 286‑1 and ISO 286‑2.
