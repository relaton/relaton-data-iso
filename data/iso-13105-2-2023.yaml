abstract:
- language: en
  script: Latn
  content: 'This document specifies safety requirements for machines used for concrete
    surface floating and finishing. This includes pedestrian-controlled equipment
    and ride-on equipment. This document is not applicable to: —     internal or external
    vibrators or ancillary equipment used with internal and external vibrators, e.g.
    air compressors, hydraulic power sources, and voltage transformers; —     remote-controlled
    or hand-held smoothing machines and self-acting (e.g. robotic) smoothing machines;
    —     strike-off type machines commonly known as screeds. This document deals
    with significant hazards, hazardous situations, or hazardous events relevant to
    machinery for concrete surface floating and finishing (power trowels) when used
    as intended and under conditions of misuse which are reasonably foreseeable by
    the manufacturer. This document is not applicable to machines which are manufactured
    before the date of its publication.'
