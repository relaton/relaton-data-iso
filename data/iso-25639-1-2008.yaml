abstract:
- language: en
  script: Latn
  content: 'ISO 25639-1:2008 specifies terms and definitions that are commonly used
    in the exhibition industry. They are grouped into the following four categories:
    individual and entity, which lists and classifies the various types of people
    involved in the exhibition industry, type of event, which defines the different
    types of exhibitions and their related meetings, physical item, which describes
    the various component sizes of the exhibition, the types of facility and print
    material, and miscellaneous.'
