abstract:
- language: en
  script: Latn
  content: ISO 16424:2012 is applicable to the evaluation of the homogeneity of Gd
    distribution within gadolinium fuel blends, and the determination of the Gd2O3
    content in sintered fuel pellets of Gd2O3+UO2 from 1 % to 10 %, by measurements
    of gadolinium (Gd) and uranium (U) elements using ICP-AES. After performing measurements
    of Gd and U elements using ICP-AES, if statistical methodology is additionally
    applied, homogeneity of Gd distribution within a Gd fuel pellet lot can also be
    evaluated. However, ISO 16424:2012 covers the statistical methodology only on
    a limited basis.
