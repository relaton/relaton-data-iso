abstract:
- language: en
  script: Latn
  content: ISO 8469:2006 specifies general requirements and physical tests for non-fire-resistant
    hoses for conveying petrol end diesel oil designed for a working pressure not
    exceeding 0,34 MPa for hoses with inner diameter up to and including 10 mm and
    0,25 MPa for hoses up to 63 mm inner diameter in craft of hull length up to 24
    m. ISO 8469:2006 applies to hoses for small craft with permanently installed fuel
    systems. Specifications for fire-resistant hoses are laid down in ISO 7840.
