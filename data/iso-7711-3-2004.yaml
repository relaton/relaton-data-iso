abstract:
- language: en
  script: Latn
  content: ISO 7711-3:2004 specifies the designation, colour code and grit sizes for
    diamond rotary instruments which are used commonly in a dental surgery. It applies
    to all types of dental diamond rotary instruments independent of type and shape.
    NOTE Attention is drawn to ISO 6360 which specifies a number coding system for
    the identification of dental rotary instruments of all types.
