abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for the service process and operations
    management of live streaming host, live streaming marketing platform, live streaming
    marketer, and multi-channel network agency (MCN agency) in the process of carrying
    out live streaming marketing services. This document is applicable to the parties
    involved in live streaming marketing services. This document does not cover information
    technology (IT) requirements, specifically excluding: —     information security,
    cybersecurity, and privacy protection; —     coding of audio, picture, multimedia,
    and hypermedia information; —     IT service management and IT governance.'
