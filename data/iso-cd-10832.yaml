abstract:
- language: en
  script: Latn
  content: ISO/TS 10832:2009 specifies a method to evaluate the effects of pollutants
    on spore germination of a mycorrhizal fungus, Glomus mosseae. This direct acute
    toxicity bioassay allows the evaluation of potential effects of pollutants and
    contaminated soils on beneficial soil microorganisms important for plant growth
    within the concept of sustainable agriculture. ISO/TS 10832:2009 is applicable
    to chemical substances, and contaminated soils, waste and soil-waste mixture and
    sludge.
