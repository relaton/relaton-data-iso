abstract:
- language: en
  script: Latn
  content: 'This Recommendation | International Standard specifies the Enhanced Communications
    Transport Protocol (ECTP), which is a transport protocol designed to support Internet
    multicast applications over multicast-capable IP networks. This Recommendation
    | International Standard specifies the ECTP for the simplex multicast transport
    connection that consists of one sender and many receivers. This Recommendation
    | International Standard specifies the protocol procedures for the following protocol
    operations: a) connection creation with tree creation; b) multicast data transmission;
    c) tree-based reliability control with error detection, retransmission request
    and retransmission; d) late join and leave; e) tree membership maintenance; and
    f) connection termination.'
