abstract:
- language: en
  script: Latn
  content: This document specifies the limits of sizes for major, pitch and minor
    diameters of ISO general purpose metric screw threads (M) conforming to ISO 261
    and having basic and design profiles in accordance with ISO 68-1. This document
    is applicable to the metric fastening screw threads with the ten tolerance classes
    (4H, 5H, 6H, 7H, 6G, 4h, 6h, 6g, 6f and 6e) recommended in ISO 965-1.
