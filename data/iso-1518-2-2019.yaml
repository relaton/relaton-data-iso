abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining, using a pointed stylus
    loaded with a continuously increasing load, the scratch resistance of a single
    coating of a paint, varnish or related product, or the upper layer of a multicoat
    system. This test has been found to be useful in comparing the scratch resistance
    of different coatings. It is most useful in providing relative ratings for a series
    of coated panels exhibiting significant differences in scratch resistance. NOTE
    Neither this document nor ISO 1518‑1 specifies a method using a curved stylus,
    which is specified in ISO 12137. The choice between the three methods will depend
    on the particular practical problem.
