abstract:
- language: en
  script: Latn
  content: Provides specifications for four steps to be followed when describing the
    noise from a single aircraft operation. Provides a method for determining a noise-exposure
    measure for a succession of operations in a given time-interval. Discusses furthermore
    specific purposes for which these methods might be used, including certification,
    monitoring of noise levels and of noise-exposure, and land-use planning.
