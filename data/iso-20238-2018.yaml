abstract:
- language: en
  script: Latn
  content: ISO 20238:2018 specifies a method of testing to determine the propensity
    of a conveyor belt to generate heat flame or glow when held stationary, under
    a given tension, in surface contact around a rotating driven steel drum. ISO 20238:2018
    describes means of varying the conveyor belt tension. NOTE For conveyor belts
    containing steel reinforcement, it may not be possible to conduct this test in
    full due to the inability of the conveyor belt to comply with the requirements
    of 7.2. In this case, premature termination according to 7.3 can be necessary.
