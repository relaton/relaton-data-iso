  script: Latn
  content: ISO/IEC 27007 provides guidance on managing an information security management
    system (ISMS) audit programme, on conducting audits, and on the competence of
    ISMS auditors, in addition to the guidance contained in ISO 19011:2011. ISO/IEC
    27007 is applicable to those needing to understand or conduct internal or external
    audits of an ISMS or to manage an ISMS audit programme.
