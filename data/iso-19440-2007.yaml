abstract:
- language: en
  script: Latn
  content: ISO 19440:2007 specifies the characteristics of the core constructs necessary
    for computer-supported modelling of enterprises conforming to ISO 19439. ISO 19440:2007
    focuses on, but is not restricted to, the computer integration of the information
    aspects of manufacturing, including the management and control technology and
    the required human tasks. It does not specify how these core constructs for model-based
    operations are to be implemented and, in particular, it does not include the control
    language needed to specify and execute (internal) activity behaviour, nor the
    mapping between functional operations and capabilities.
