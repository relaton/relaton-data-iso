abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for design, dimensions, material,
    fabrication and production testing of gate, globe, ball/plug and butterfly valve
    design types used as isolation valves and check valves for low-temperature applications.
    This document is applicable to isolation valves for use in low and cryogenic temperature
    service where the design low-temperature service is -50 °C down to –196 °C. This
    document does not apply to valves for cryogenic services, designed in accordance
    with ISO 21011, used with cryogenic vessels. Where the requirements of this document
    vary from those given in the valve product standards, the requirements of this
    document apply. This document is applicable to valves with body, bonnet, bonnet
    extension or cover made of metallic materials. This document is applicable to:
    —    valves of nominal sizes DN: 10; 15; 20; 25; 32; 40; 50; 65; 80; 100; 125;
    150; 200; 250; 300; 350; 400; 450; 500; 600; 650; 700; 750; 800; 850; 900; 950;
    1 000; 1 050; 1 200; 1 350; 1 400; 1 500; 1 600; 1 650; 1 800, —    corresponding
    to nominal pipe sizes NPS: ⅜; ½; ¾; 1; 1 ¼; 1 ½; 2; 2 ½; 3; 4; 5; 6; 8; 10; 12;
    14; 16; 18; 20; 24; 26; 28; 30; 32; 34; 36; 38; 40; 42; 48; 54; 56; 60; 64; 66;
    72, and applies to pressure designations: —    PN 16; 25; 40; 100; 160; 250; 400,
    —    Class 150; 300; 600; 800; 900; 1 500; 2 500. NOTE       Not all type and
    size combination are available in all pressure ratings. This document does not
    apply to safety valves and control valves.'
