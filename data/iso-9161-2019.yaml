abstract:
- language: en
  script: Latn
  content: This document specifies a method of determining the apparent density and
    tap density of free-flowing uranium dioxide (UO2) powder which will be used for
    pelleting and sintering of UO2 pellets as a nuclear fuel. This method can be used
    for different UO2 powder types including grains, granules, spheres or other kinds
    of particles. The method can also be applied to other fuel powders as PuO2, ThO2
    and powder mixtures as UO2-PuO2 and UO2-Gd2O3. This document is based on the principle
    of using a flowmeter funnel (see 4.1). Other measurement apparatus, such as a
    Scott volumeter, can also be used.
