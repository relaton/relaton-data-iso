abstract:
- language: en
  script: Latn
  content: ISO 5774:2016 specifies the requirements for four types of flexible thermoplastic
    hose, textile reinforced, for compressed-air applications in the temperature range
    from −10 °C to +60 °C. The four types are classified as light service for a maximum
    working pressure of 7 bar at 23 °C and 4,5 bar at 60 °C, medium service for a
    maximum working pressure of 10 bar at 23 °C and 6,5 bar at 60 °C, heavy service
    for a maximum working pressure of 16 bar at 23 °C and 11 bar at 60 °C, and heavy
    service for use in mining for a maximum working pressure of 25 bar at 23 °C and
    13 bar at 60 °C.
