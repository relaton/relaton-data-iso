abstract:
- language: en
  script: Latn
  content: The methods of measurement specified apply to e.g. fabrics, films, coatings,
    foams and leather, including multilayer assemblies, for use in clothing, quilts,
    sleeping bags, upholstery and similar textile or textile-like products. Application
    is restricted to a maximum thermal resistance and water-vapour resistance which
    depend on the dimensions and construction of the apparatus used (e.g. 2 m^2 K/W
    and 700 m^2 Pa/W, respectively), for the minimum specifications of the equipment
    referred to.
