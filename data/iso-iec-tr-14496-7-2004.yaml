abstract:
- language: en
  script: Latn
  content: 'ISO/IEC TR 14496-7:2004 specifies the encoding tools that enhance both
    the execution and quality for the coding of visual objects as defined in ISO/IEC
    14496-2. There are five visual tools, including: Fast Motion Estimation;Fast Global
    Motion Estimation;Fast and Robust Sprite Generation;Optimized Reference Software
    for Simple Profile with Fast Variable Length Decoder Technique; andError Resilience
    Tools with RVLC. The platform specific optimization is not currently addressed.
    The error resilience tools are separately implemented based on the Momusys reference
    software.'
