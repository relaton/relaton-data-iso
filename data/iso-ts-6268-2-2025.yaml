abstract:
- language: en
  script: Latn
  content: 'This document provides a telehealth cybersecurity reference model of the
    overall security framework for systems and services applied to telehealth. This
    document contains a general description of: —     factors of telehealth cybersecurity
    threats; —     relationships between security risks and safety risks in telehealth
    services; —     methodologies for defining security levels in telehealth services;
    —     a cybersecurity reference model of telehealth services. Defining the specific
    type of telehealth services is not covered in this document.'
