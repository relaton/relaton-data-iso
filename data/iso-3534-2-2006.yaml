abstract:
- language: en
  script: Latn
  content: ISO 3534-2:2006 defines applied statistics terms, and expresses them in
    a conceptual framework in accordance with ISO normative terminology practice.
    Term entries are arranged thematically. An alphabetical index is provided. Standardized
    symbols and abbreviations are defined. The two principal purposes of ISO 3534-2:2006
    are, specifically, to establish a common vocabulary for use throughout ISO/TC
    69 standards, together with the broader intent to enhance the preciseness, clarity
    and cohesiveness in the usage/application of applied statistics generally. The
    mathematical level has deliberately been kept to a low level in order for the
    content to be made readily comprehensible to the widest possible readership.
