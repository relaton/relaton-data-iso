abstract:
- language: en
  script: Latn
  content: This document specifies a method for the semi-quantitative analysis of
    oils, fats and oil/fat-related samples (deodistillates). It is applicable to the
    screening of oils, fats and oil/fat-related samples to obtain main (e.g. triglycerides)
    and minor (e.g. sterols, sterol esters, tocopherols, wax esters, fatty alcohols,
    glycerol) component information in one single analysis. For a truly quantitative
    analysis of pre-identified compound classes, specific methods are more appropriate.
    The method can also be used as a useful qualitative screening tool for the relative
    comparison of sample compositions.
