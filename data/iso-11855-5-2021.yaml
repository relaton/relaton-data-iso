abstract:
- language: en
  script: Latn
  content: This document establishes requirements for the installation of embedded
    radiant heating and cooling systems. It specifies general and uniform requirements
    for the design and construction of heating and cooling floors, ceiling and wall
    structures to ensure that the heating/cooling systems are suited to the particular
    application. The requirements specified by this document are applicable only to
    the components of the heating/cooling systems and the elements which are part
    of the heating/cooling surface and which are installed due to the heating/cooling
    systems. This document is applicable to water-based embedded surface heating and
    cooling systems in residential, commercial and industrial buildings. The methods
    apply to systems integrated into the wall, floor or ceiling construction without
    any open-air gaps, but are not applicable to panel systems with open-air gaps
    which are not integrated into the building structure.
