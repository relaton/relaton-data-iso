abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1614:2006 specifies the application module for AP210 functional
    decomposition. ISO/TS 10303-1614:2006 deals with the representation of functional
    decomposition. This data includes specification of the folded and unfolded (elaborated)
    hierarchical product definition in the functional view. Support is provided for
    a usage view and a design view. The ability to exchange data defining a functional
    test bench and functional specification based on signals is included. Signal definition
    relies on external definition, but signal properties may be represented. Support
    is provided for both lumped element and distributed port properties. Analysis
    models may be included in the exchange structure with close integration accomplished
    by pin mapping. Configuration management information and design change management
    information is provided. The following are within the scope of ISO/TS 10303-1614:2006:
    folded network hierarchy;signal names;signal properties;functional unit definition.'
