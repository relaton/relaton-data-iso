abstract:
- language: en
  script: Latn
  content: ISO 21601:2013 provides guidelines on the appropriate steps to take when
    a stress corrosion crack has been detected in service and an assessment has to
    be made of the implications for structural integrity. Such an evaluation should
    be made in the context of the perceived consequences of failure using appropriate
    risk-based management methodologies. Since this is application-specific, it is
    beyond the scope of ISO 21601:2013.
