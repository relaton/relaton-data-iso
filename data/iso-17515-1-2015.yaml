abstract:
- language: en
  script: Latn
  content: ISO 17515-1:2015 enables usage of the E-UTRAN cellular network technology
    as an ITS access technology in an ITS station by specifying details of the "Communication
    Adaptation Layer" (CAL) and the "Management Adaptation Entity" (MAE) of communication
    interfaces specified in ISO 21218, and session management by reference to ISO
    25111. Wherever practicable, this part of ISO 17515-1:2015 has been developed
    by reference to suitable extant standards, adopted by selection.
