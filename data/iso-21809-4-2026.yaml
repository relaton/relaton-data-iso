abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for qualification, application,
    inspection, testing, handling and storage of materials for plant application of
    two-layer polyethylene coatings (2-layer PE) applied externally for the corrosion
    protection of bare steel pipe for use in pipeline transportation systems for oil
    and gas industries as defined in ISO 13623. NOTE            Pipes coated in accordance
    with this document are considered suitable for additional protection by means
    of cathodic protection.
