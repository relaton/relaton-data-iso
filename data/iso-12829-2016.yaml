abstract:
- language: en
  script: Latn
  content: ISO 12829:2016 specifies methods for verifying the rated fatigue life and
    the rated static burst pressure of the pressure-containing envelope (i.e. the
    filter housing) of a spin-on hydraulic filter with a disposable filter element
    and a finite life. Because the service life of housings for these types of filters
    is relatively short, a rated fatigue life of 100 000 cycles is judged sufficient
    for typical industrial applications.
