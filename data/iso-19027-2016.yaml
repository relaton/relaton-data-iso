abstract:
- language: en
  script: Latn
  content: ISO 19027:2016 specifies basic configurations for communication support
    boards, which are necessary to facilitate communication. A variety of communication
    support boards can be designed for specific communication purposes. This International
    Standard specifies basic elements common to different types of formats/media,
    such as simple boards, book style or digital media. This International Standard
    does not regulate any specific design or any specific pictorial symbols for communication
    support boards. As for design principles of pictorial symbols, this International
    Standard introduces examples of design principles applicable when designing and
    developing pictorial symbols. NOTE Examples of basic pattern used to create pictorial
    symbols are shown in Annex A. Examples of communication support boards using pictorial
    symbols are shown in Annexes B and C.
