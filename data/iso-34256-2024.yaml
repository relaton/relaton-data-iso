abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the ability of a test
    piece bonded with a thermoplastic adhesive, to support a given load for a specified
    time without fracture or excessive distortion, and specifies performance requirements
    for mean survival time. It should be used in conjunction with ISO 19209 and ISO
    19210, which describe durability classes and corresponding test methods for non-structural
    wood adhesives based on their ability to withstand various water treatments and
    relatively rapidly applied loads. The test described in this standard may be used
    to assess joints made with thin glue line, as defined in ISO 19210. NOTE           
    The test described in this document is not a mandatory requirement for the classification
    of adhesives into the classes D1, D2, D3 and D4 given in ISO 19209. It is an additional
    test that can be specified by a purchaser if required.
