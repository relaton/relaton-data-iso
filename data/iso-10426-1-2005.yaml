abstract:
- language: en
  script: Latn
  content: ISO 10426-1:2005 specifies requirements and gives recommendations for eight
    classes of well cements, including their chemical and physical requirements and
    procedures for physical testing. ISO 10426-1:2005 is applicable to well cement
    classes A, B, C, D, E and F, which are the products obtained by grinding Portland
    cement clinker and, if needed, calcium sulfate as an interground additive. Processing
    additives can be used in the manufacture of cement of these classes. Suitable
    set-modifying agents can be interground or blended during manufacture of classes
    D, E and F. ISO 10426-1:2005 is also applicable to well cement classes G and H,
    which are the products obtained by grinding Portland cement clinker with no additives
    other than calcium sulfate or water.
