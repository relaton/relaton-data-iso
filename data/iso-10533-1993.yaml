abstract:
- language: en
  script: Latn
  content: Specifies the performance requirements and test method for mechanical lift-arm
    support devices for loaders, backhoe loaders and skid-steer loaders equipped with
    a lift-arm where the lift arm is required to be held in the elevated position
    for maintenance, servicing or other non-operational purposes. It also specifies
    installation, instructions, storage and colour requirements for lift-arm support
    devices.
