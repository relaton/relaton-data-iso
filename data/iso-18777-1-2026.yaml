abstract:
- language: en
  script: Latn
  content: This document specifies requirements for transportable liquid oxygen systems
    that are common to both base units and portable units and requirements that are
    particular to base units. Stationary liquid oxygen systems used for oxygen pipeline
    supply systems are excluded from this document. NOTE 1        Throughout this
    document the term “units” is used where the requirement applies to both base units
    and portable units. NOTE 2        ISO 18777 - 2 specifies those requirements particular
    to portable units.
