abstract:
- language: en
  script: Latn
  content: ISO 8575:2016 provides information relating to the sizes and materials
    of tubing for use in aerospace hydraulic pressure and return and suction lines.
    For pressure lines, the requirements apply to the pressure and temperature ranges
    covered by pressure class D, E and J and temperature type 13 and type 20 as specified
    in ISO 6771.
