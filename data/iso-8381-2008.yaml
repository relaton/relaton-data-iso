abstract:
- language: en
  script: Latn
  content: ISO 8381¦IDF 123:2008 specifies the reference method for the determination
    of the fat content of milk-based infant foods. The method is applicable to liquid,
    concentrated and dried milk-based infant foods with no, or not more than a mass
    fraction of 5 % (dry matter) of such added matter as starch, dextrin, vegetables,
    fruit and meat. The method is not applicable to products which do not dissolve
    completely in ammonia owing to the presence of starch or dextrin at mass fractions
    of more than a few percent, or to the presence of hard lumps. The method is also
    not applicable to products which contain free fatty acids in significant quantities.
    The results obtained for these products will be too low.
