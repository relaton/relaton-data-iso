abstract:
- language: en
  script: Latn
  content: This document describes the specification of high manganese (Mn) austenitic
    steel plates to be used for LNG tanks on board ships. The specification of high
    manganese austenitic steel can be also considered for design and manufacture of
    cargo tanks and process pressure vessels of LNG supply/terminal and transportation
    of fuels and traded gases. This document is primarily applicable for the specification
    of LNG tanks below volumetric capacity of approximately 30 000 m3 using high manganese
    austenitic steel. The thickness of plates is limited to between 6 mm to 40 mm.
