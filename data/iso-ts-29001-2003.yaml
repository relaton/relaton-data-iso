abstract:
- language: en
  script: Latn
  content: ISO/TS 29001:2003 defines the quality management system requirements for
    the design, development, production, installation and service of products for
    the petroleum, petrochemical and natural gas industries, based on ISO 9001:2000.
    Limits are addressed on claims of conformity to ISO/TS 29001:2003 if exclusions
    are made. ISO/TS 29001:2003 does not address competitive or commercial matters
    such as price, warranties, guarantees, or clauses intended to sustain commercial
    objectives.
