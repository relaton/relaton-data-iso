abstract:
- language: en
  script: Latn
  content: 'ISO 16443:2014 specifies terms and definitions for dental implants and
    for instruments, accessories, and the most commonly used clinical terms related
    to implant systems and procedures in dentistry. Grafting materials and membranes
    are excluded from ISO 16443:2014. The following devices are also excluded from
    the scope of ISO 16443:2014. Device specially designed to be placed within, through
    or upon the bones of the cranio-facial complex, the primary purpose of which is
    to provide anchorage for an epithesis (to replace for example: ears, noses and
    parts of eyes and orbital regions): epithesis implant; craniofacial implant; maxillofacial
    implant. Device specially designed to be placed within, through or upon the bones
    of the cranio-facial complex, the primary purpose of which is to provide anchorage
    for an orthodontic appliance: orthodontic implant.'
