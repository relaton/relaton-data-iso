abstract:
- language: en
  script: Latn
  content: ISO 21207:2004 defines two accelerated corrosion test methods to be used
    in assessing the corrosion resistance of products with metals in environments
    where there is a significant influence of chloride ions, mainly as sodium chloride
    from a marine source or by winter road de-icing salt, and of corrosion-promoting
    gases from industrial or traffic air pollution. This International Standard specifies
    both the test apparatus and test procedures to be used in executing the accelerated
    corrosion tests. The methods are especially suitable for assessing the corrosion
    resistance of sensitive products with metals, e.g. electronic components, used
    in traffic and industrial environments.
