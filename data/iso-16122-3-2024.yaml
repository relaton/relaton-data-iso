abstract:
- language: en
  script: Latn
  content: This document, when used together with ISO 16122-1:2024, specifies the
    requirements and test methods for the inspection of sprayers for bush and tree
    crops, when in use. The requirements relate mainly to the condition of the sprayer
    with respect to its potential risk for the environment and its performance to
    achieve good application. NOTE            Requirements for the protection of inspectors
    during an inspection are given in ISO 16122-1:2024.
