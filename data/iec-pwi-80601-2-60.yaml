abstract:
- language: en
  script: Latn
  content: 'IEC 80601-2-60:2019 applies to the BASIC SAFETY and ESSENTIAL PERFORMANCE
    OF DENTAL UNITS, DENTAL PATIENT CHAIRS, DENTAL HANDPIECES AND DENTAL OPERATING
    LIGHTS, hereafter referred to as DENTAL EQUIPMENT. If a clause or subclause is
    specifically intended to be applicable to ME EQUIPMENT only, or to ME SYSTEMS
    only, the title and content of that clause or subclause will say so. If that is
    not the case, the clause or subclause applies both to ME EQUIPMENT and to ME SYSTEMS,
    as relevant. HAZARDS inherent in the intended physiological function of ME EQUIPMENT
    or ME SYSTEMS within the scope of this document are not covered by specific requirements
    in this document except in 7.2.13 and 8.4.1 of the general standard. IEC 80601-2-60:2019
    cancels and replaces the first edition published in 2012. This edition constitutes
    a technical revision. This edition includes the following significant technical
    changes with respect to the previous edition: a) alignment with IEC 60601-1:2005
    and IEC 60601-1:2005/AMD1:2012.'
