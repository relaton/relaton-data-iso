abstract:
- language: en
  script: Latn
  content: This document defines terms that are used in connection with both maceral
    and microlithotype analyses, and with the determination of the reflectance of
    vitrinite. It applies to the terms used in the examination of coal of all ranks
    and types. This document is not intended to be a comprehensive glossary of coal
    petrographic terminology, nor does it attempt to provide sufficient information
    to allow recognition of all the coal components described.
