abstract:
- language: en
  script: Latn
  content: ISO/TR 19263-1:2017 specifies how to perform quality analysis of imaging
    systems (e.g. flatbed scanners, planetary scanners, or digital still cameras)
    used for digitization of reflective two-dimensional originals. Original materials
    include but are not limited to books, textual documents, drawings, prints, photographs,
    and paintings. Certain types of two-dimensional materials with complex surface
    geometry and or highly reflective surface elements require special illumination
    techniques that can fall outside the scope of this document. NOTE ISO/TS 19264‑2
    will address transmissive materials.
