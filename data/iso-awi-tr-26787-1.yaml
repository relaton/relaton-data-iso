abstract:
- language: en
  script: Latn
  content: This document describes applications and use cases of product data visualization
    supported by AI-based object detection across the product lifecycle, including
    manufacturing, maintenance and recycling. It covers the preparation of data and
    object-detection models, the linkage of detection results to product identity
    and product data, and the presentation of product data to users according to their
    task and device. This document does not specify requirements, AI algorithms or
    implementation technologies, nor the use of AI for the control of machines or
    robots.
