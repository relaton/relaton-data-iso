abstract:
- language: en
  script: Latn
  content: ISO/TC 138/SC 8 developed a suite of standards for the rehabilitation of
    existing pipelines for four different application areas, split per technique family.
    Development took place jointly with CEN via the Vienna Agreement. This document
    provides a scheme for the assessment of conformity of PA-U products and assemblies
    for the rehabilitation of existing pipelines, in accordance with ISO 11300-5,
    and intended to be included in the manufacturer’s quality plan as part of the
    quality management system and for the establishment of certification procedures.
    It is recommended that the quality management system conforms to or is no less
    stringent than the relevant requirements to EN ISO 9001.This document provides
    a scheme for the assessment of conformity of PA-U products and assemblies for
    the rehabilitation of existing pipelines, in accordance with ISO 11300-5, and
    intended to be included in the manufacturer’s quality plan as part of the quality
    management system and for the establishment of certification procedures. NOTE
    In order to help the reader, summary tables of overall scheme requirements are
    provided in Annex C.
