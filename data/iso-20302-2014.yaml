abstract:
- language: en
  script: Latn
  content: ISO 20302:2014 is designed to confirm, via a numbering system and registration
    procedure, the identities of both the healthcare application provider and the
    health card holder in order that information may be exchanged by using cards issued
    for healthcare services. ISO 20302:2014 focuses on the machine-readable cards
    of ID-1 type defined in ISO/IEC 7810 that are issued for healthcare services provided
    in a service area that crosses the national borders of two or more countries/areas.
    ISO 20302:2014 applies to healthcare data cards where the issuer and the application
    provider are the same party. ISO 20302:2014 applies directly, or refers, to existing
    ISO standards for physical characteristics and recording techniques. Security
    issues follow the requirements of each healthcare data card system. In addition,
    ISO 20302:2014 regulates the visual information written on the healthcare data
    card.
