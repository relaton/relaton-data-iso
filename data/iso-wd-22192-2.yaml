abstract:
- language: en
  script: Latn
  content: This document specifies procedures and requirements for the transfer of
    bunkers to vessels by bunker tankers using the Coriolis mass flow meter (MFM)
    system. It encompasses the process leading to the approval of the MFM system as
    installed on bunker tankers and post-approval bunkering operation. It covers terminology,
    specifications, requirements and procedures on metrology, system integrity, metering
    system selection and installation, MFM system verification, bunker delivery and
    dispute handling. NOTE Local and international regulations, such as the International
    Convention for the Prevention of Pollution from Ships (MARPOL) can apply.
