abstract:
- language: en
  script: Latn
  content: This document covers the measurements of particles on the test bench for
    both kinds of friction pairs (disc and pads, wheel and brake shoes). This document
    specifies apparatus, methods, test reports, minimum test conditions and minimum
    requirements to provide comparability of the measurements between test benches.
    This document does not define typical operational load spectra or the definition
    of limit values for emission. This document does not define product classification
    based on dust emission.
