abstract:
- language: en
  script: Latn
  content: The scope of JPEG XE is the creation of a standard for the representation
    of Events in an efficient way allowing interoperability between sensing, storage,
    and processing, targeting machine vision and other relevant applications. An Event
    is the message that signals the result of an observation at a precise point in
    time. It is typically triggered by a detected change in the physical world. Examples
    are contrast detection (CD) events from an event-based vision sensor or inertial
    measurement unit (IMU) readings. Part 1 – Core coding system This part defines
    the syntax and an accompanying decompression process that is capable of efficiently
    representing event sequences and allows for low-latency and low-complexity implementations.
    Part 2 – Profiles and levels This part defines several subsets of the syntax specified
    in Part 1 as profiles and levels. Part 3 – Reference software This part contains
    the reference software of the JPEG XE series. It acts as a guideline for implementation
    and as a reference for conformance testing. Part 4 – Conformance This part specifies
    the framework, concepts, methodology for testing, and criteria to be achieved
    to claim conformance to multiple parts of the JPEG XE series. It lists the conformance
    testing procedures. Part 5 – File formats and metadata This part specifies file
    formats to store JPEG XE codestreams along with metadata on the event sequences.
    It further also defines metadata information that can be embedded into the Part
    1 syntax.
