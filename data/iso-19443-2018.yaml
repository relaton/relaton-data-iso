abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies requirements for a quality management
    system when an organization: a) needs to demonstrate its ability to consistently
    provide products and services that meet customer and applicable statutory and
    regulatory requirements, and b) aims to enhance customer satisfaction through
    the effective application of the system, including processes for improvement of
    the system and the assurance of conformity to customer and applicable statutory
    and regulatory requirements. All the requirements of this International Standard
    are generic and are intended to be applicable to any organization, regardless
    of its type or size, or the products and services it provides. NOTE 1 In this
    International Standard, the terms "product" or "service" only apply to products
    and services intended for, or required by, a customer. NOTE 2 Statutory and regulatory
    requirements can be expressed as legal requirements. This International Standard
    applies to organizations supplying ITNS products or services. Application of this
    standard to organizations performing activities on a licensed nuclear site is
    subject to prior agreement by the Licensee. Requirements specified in this International
    Standard are complementary (not alternative) to customer and applicable statutory
    and regulatory requirements.'
