abstract:
- language: en
  script: Latn
  content: This document specifies the method of the peel test using a tensile testing
    machine to evaluate the adhesion strength of metallic coatings on plastic substrates
    under controlled temperature. The designation of the peel test results is also
    specified. The designation consists of the adhesion of metallic coatings to the
    substrate and test temperature, as well as the substrate material and the principal
    component, manufacturing process and thickness of the metallic coatings.
