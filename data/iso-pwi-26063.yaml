abstract:
- language: en
  script: Latn
  content: This document specifies the principles, reagents and materials, apparatus,
    preparation of the test sample, procedures, expression of results, precision requirements
    and test report for the determination of gossypol in vegetable fats and oils using
    ultra-high performance liquid chromatography-tandem mass spectrometry. — The method
    is applicable to the determination of free gossypol content in vegetable fats
    and oils. — The limit of detection (LOD) of the method is 10 μg/kg and the limit
    of quantification (LOQ) is 50 μg/kg.
