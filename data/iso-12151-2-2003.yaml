abstract:
- language: en
  script: Latn
  content: ISO 12151-2:2003 specifies the general and dimensional requirements for
    the design and performance of hose fittings with 24° cone connector ends with
    O-rings, in accordance with ISO 8434-1 and ISO 8434-4. These hose fittings are
    made of carbon steel and are intended for use with hoses with nominal inside diameters
    from 5 mm through 38 mm (inclusive). These hose fittings are for use in fluid
    power systems with hoses that meet the requirements of respective standards and
    in general applications with suitable hoses.
