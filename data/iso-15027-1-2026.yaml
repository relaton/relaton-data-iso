abstract:
- language: en
  script: Latn
  content: This document specifies performance and safety requirements for constant
    wear suits and suit systems for professional and leisure activities to protect
    the user against the effects of cold-water immersion, by reducing cold shock and
    delaying the onset of hypothermia. If a suit system includes a personal flotation
    device (PFD), it provides protection against drowning. This document is applicable
    to dry and wet constant wear suits and suit systems. This document does not apply
    to abandonment suits. Requirements for abandonment suits are given in ISO 15027-2:2026.
    Test methods for immersion suits are given in ISO 15027-3:2026.
