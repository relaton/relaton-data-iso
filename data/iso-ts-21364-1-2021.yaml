abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements for domestic gas cooking
    appliances. These appliances are freestanding, built-in or table-top and are intended
    to be used indoors. This document applies to the gas sections of the appliances
    and their component parts (e.g. combined gas-electric cooking appliances). This
    document does not apply to: a) electrical heated elements as part of the appliance;
    b) outdoor appliances; c) appliances supplied at pressures greater than the maximum
    pressure of the test gases; d) cook stoves, covered by the standards being developed
    in ISO/TC 285 In general, it does not take into account children playing with
    the appliance. NOTE 1    For requirements of electrical safety refer to the IEC 60335
    standard series. NOTE 2    Attention is drawn to the fact that −      for appliances
    intended to be used in vehicles or on board of ships or aircrafts, additional
    requirements could be necessary; −      in many countries additional requirements
    are specified by the national health authorities, the national water supply authorities
    and similar authorities This document does not cover requirements relating to
    gas cylinders, their pressure regulators and their connections. This document
    does not cover requirements for gas installation.'
