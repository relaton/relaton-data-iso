abstract:
- language: en
  script: Latn
  content: This part of ISO 10427 provides minimum performance requirements, test
    procedures and marking requirements for casing bow-spring centralizers for the
    petroleum and natural gas industries. The procedures provide verification testing
    for the manufacturer's design, materials and process specifications, and periodic
    testing to confirm the consistency of product performance. This part of ISO 10427
    is not applicable to rigid or positive centralizers.
