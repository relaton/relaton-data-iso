abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining and testing the grain
    size distribution of electro-fused aluminium oxide and silicon carbide macrogrit
    sizes P12 to P220 for coated abrasive products. It is applicable to grits used
    in the manufacture of coated abrasive products and to grits extracted from coated
    abrasive products for test purposes.
