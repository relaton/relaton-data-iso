abstract:
- language: en
  script: Latn
  content: 'This document provides the following: — specifications for cylinders for
    the transport of uranium hexafluoride (UF6) to provide compatibility among different
    users, — description of cylinder designs, but is not intended to develop new designs,
    — fabrication requirements for the procurement of new cylinders designed for the
    transport of 0,1 kg or more of uranium hexafluoride, — fabrication requirements
    for the procurement of new valve protections, valves and plugs, and — requirements
    for cylinders and valve protections in service.'
