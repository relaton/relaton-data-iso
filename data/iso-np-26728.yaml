abstract:
- language: en
  script: Latn
  content: This standard specifies the definition of coalbed methane (CBM), the general
    principles for the reserve estimation of adsorbed gas and free gas in coal reservoirs,
    the estimation conditions and methods for geological reserves, technically recoverable
    reserves and economically recoverable reserves, as well as the requirements for
    comprehensive reserve evaluation. This standard applies to the estimation and
    evaluation of coalbed methane reserves for surface exploration and production,
    and the formulation of relevant technical standards.
