abstract:
- language: en
  script: Latn
  content: This document provides best practices for writing a banking products or
    services (BPoS) handbook. It is applicable to any providers of banking products
    or services (BPoSP) that issue and operate BPoS. NOTE 1        A BPoS handbook
    is edited by either product managers or personnel in charge of key elements mentioned
    in this document, based on their role and responsibility within the BPoSP. NOTE 2       
    Whether ISO 21586 has been formally introduced, this document is useful as existing
    BPoS contain the key elements listed in ISO 21586.
