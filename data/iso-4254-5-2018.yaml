abstract:
- language: en
  script: Latn
  content: ISO 4254-5:2018, intended to be used together with ISO 4254‑1, specifies
    the safety requirements and their verification for the design and construction
    of mounted, semi-mounted and trailed power-driven soil-working machines used in
    agriculture. In addition, it specifies the type of information on safe working
    practices (including residual risks) to be provided by the manufacturer. ISO 4254-5:2018
    deals with significant hazards (as listed in Annex A), hazardous situations and
    events relevant to power-driven soil-working machines used as intended and under
    the conditions foreseeable by the manufacturer (see Clause 4). ISO 4254-5:2018
    is not applicable to - spading machines, and - machines fitted with a retractable
    device making them capable of working between two successive plants in the same
    row. ISO 4254-5:2018 is not applicable to environmental hazards. It is not applicable
    to hazards related to moving parts for power transmission (except for strength
    requirements for guards and barriers) or to maintenance or repairs carried out
    by professional service personnel. NOTE 1 Specific requirements related to road
    traffic regulations are not taken into account in this document. NOTE 2 Vibrations
    are not regarded as a significant hazard in the case of mounted, semi-mounted
    or trailed machines. ISO 4254-5:2018 is not applicable to power-driven soil-working
    machines which are manufactured before the date of its publication. When requirements
    of this document are different from those which are stated in ISO 4254‑1, the
    requirements of this document take precedence over the requirements of ISO 4254‑1
    for machines that have been designed and built according to the provisions of
    this document.
