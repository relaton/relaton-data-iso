abstract:
- language: en
  script: Latn
  content: ISO 12633-1:2011 specifies the technical delivery requirements for hot-finished
    hollow sections of circular, square or rectangular form. It is applicable to hollow
    sections formed hot with or without subsequent heat treatment or formed cold with
    subsequent heat treatment to obtain equivalent metallurgical conditions to those
    obtained in the hot-formed product. Fine grain steels are generally delivered
    in the normalized condition. ISO 12633-1:2011 gives the grades, chemical composition
    and mechanical properties for non-alloy steels and fine grain steels.
