abstract:
- language: en
  script: Latn
  content: 'This document specifies the risks and reliability of an autonomous underwater
    vehicle (AUV) in its underwater realm. It covers sensors, communication devices,
    and any other pieces and parts directly influencing the “digital mission” of the
    vehicle. This document does not cover the manufacturing or operation of the following
    items: autonomous underwater gliders (AUGs), as they use a narrowly modifiable
    set of operational commands; batteries for the use of AUVs; electrical motors
    for the use of AUVs.'
