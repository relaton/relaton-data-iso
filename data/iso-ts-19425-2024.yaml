abstract:
- language: en
  script: Latn
  content: This document specifies the measurement method and requirements for combustion
    air inlet noise of air cleaners which are installed on reciprocating internal
    combustion engines, including laboratory measurement (engineering method and survey
    method) and site measurement (survey method). This document applies to all air
    cleaners installed on reciprocating internal combustion engines (reciprocating
    internal combustion engine is referred to as engine hereafter, except for specific
    explanations) falling within the field of application of ISO 3046-1 and/or other
    air induction installation.
