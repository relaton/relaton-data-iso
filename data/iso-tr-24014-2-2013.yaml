abstract:
- language: en
  script: Latn
  content: 'ISO/TR 24014-2:2013 introduces a generic conceptual framework that can
    be applied to all Interoperable Fare Management Systems (IFMS) compliant with
    ISO 24014-1, as the basis for business practices relating to the conceptual framework
    for an IFMS, which is described in ISO 24014-1. This generic conceptual framework
    comprises three parts: structure of Set of Rules; collaboration of functional
    models; integration of Set of Rules.'
