abstract:
- language: en
  script: Latn
  content: This document applies to searchlights installed on lifeboats and rescue
    boats used on maritime ships. These searchlights are essential for facilitating
    search and rescue operations, navigation in low-visibility conditions, and safe
    maneuvering during emergencies. The document sets requirements to portable or
    fixed searchlights specifically designed for use on lifeboats and rescue boats,
    ensuring reliability, durability under marine conditions, and compatibility with
    relevant international safety standards.
