abstract:
- language: en
  script: Latn
  content: ISO 10718:2015 specifies a method to enumerate the colony-forming units
    of yeasts, moulds and bacteria which can exist on cork stoppers and in an alcoholic
    solution, and which, under certain conditions, can be extracted during the 3 months
    following delivery. ISO 10718:2015 applies to all types of ready-to-use cork stoppers,
    submitted to a sanitation process and packaged in properly aseptic and hermetic
    conditions. ISO 10718:2015 specifies the limit values of the colony-forming units
    of yeasts, moulds and bacteria which can be found on cork stoppers submitted to
    the test procedures included in this standard.
