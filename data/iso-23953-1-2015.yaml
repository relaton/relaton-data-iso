abstract:
- language: en
  script: Latn
  content: ISO 23953-1:2015 establishes a vocabulary of terms and definitions relative
    to refrigerated display cabinets used for the sale and display of foodstuffs.
    It is not applicable to refrigerated vending machines or cabinets intended for
    use in catering or similar non-retail applications. NOTE In addition to terms
    in English and French, two of the three official ISO languages, this part of ISO
    23953 gives the equivalent terms in German, Italian, and Spanish; these are published
    under the responsibility of the member bodies for Germany (DIN), Italy (UNI),
    and Spain (AENOR). However, only the terms and definitions given in the official
    languages can be considered as ISO terms and definitions.
