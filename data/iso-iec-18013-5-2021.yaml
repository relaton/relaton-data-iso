abstract:
- language: en
  script: Latn
  content: 'This document establishes interface specifications for the implementation
    of a driving licence in association with a mobile device. This document specifies
    the interface between the mDL and mDL reader and the interface between the mDL
    reader and the issuing authority infrastructure. This document also enables parties
    other than the issuing authority (e.g. other issuing authorities, or mDL verifiers
    in other countries) to: —    use a machine to obtain the mDL data; —    tie the
    mDL to the mDL holder; —    authenticate the origin of the mDL data; —    verify
    the integrity of the mDL data. The following items are out of scope for this document:
    —    how mDL holder consent to share data is obtained; —    requirements on storage
    of mDL data and mDL private keys.'
