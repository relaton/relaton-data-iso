abstract:
- language: en
  script: Latn
  content: ISO 15883-2:2006 specifies particular requirements for washer disinfectors
    (WD) that are intended for use for the cleaning and thermal disinfection, in a
    single operating cycle, of re-usable medical devices such as surgical instruments,
    anaesthetic equipment, bowls, dishes and receivers, utensils and glassware. The
    requirements in ISO 15883-2:2006 apply in addition to the general requirements
    specified in ISO 15883-1. The specified performance requirements of ISO 15883-2:2006
    may not ensure the inactivation or removal of the causative agent(s) (prion protein)
    of transmissible spongiform encephalopathies.
