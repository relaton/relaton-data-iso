abstract:
- language: en
  script: Latn
  content: 'Part 3 of the standard defines an ontology for service-level data concepts,
    i.e. concepts that are not common to all city representations, but specific to
    a particular service or application. It includes the following categories: • Parking
    • Public Transport • Transport Cost • Transportation System • Trip • Trip Cost
    • Vehicle For each category, concepts are defined using a subset of Description
    Logic, and in implementation is provided in the OWL web ontology language.'
