abstract:
- language: en
  script: Latn
  content: This document specifies cloud computing interoperability and portability
    types, the relationship and interactions between these two cross-cutting aspects
    of cloud computing and distributed platforms, as well as common terminology and
    concepts used to discuss interoperability and portability, particularly relating
    to cloud services. The goal of this document is to ensure that all parties involved
    in cloud computing, particularly cloud service customers (CSC), cloud service
    providers (CSP) and cloud service partners (CSN) acting as cloud service developers,
    have a common understanding of interoperability and portability for their specific
    needs, including switching service provision from one CSP to another. This common
    understanding helps to achieve interoperability and portability in cloud computing
    by establishing common terminology and concepts.
