abstract:
- language: en
  script: Latn
  content: ISO 11151-1:2015 specifies requirements for laser components used in the
    ultraviolet, visible, and near infrared spectral ranges, from wavelengths 170
    nm to 2 100 nm, and facilitates the supply of spare parts by specifying preferred
    dimensions and tolerances, thereby reducing the variety of types, by standardizing
    the specifications and removing barriers to trade, and by establishing an agreed
    designation for item orders. ISO 11151-1:2015 covers planar, plano-spherical and
    spherical substrates, lenses, and optical components that are designed specifically
    as standardized optical components normally offered through a catalogue from suppliers
    and intended for use with lasers. ISO 11151-1:2015 includes component descriptions,
    materials employed, physical dimensions, and manufacturing tolerances (including
    surface finish, figure, and parallelism). Although most, but not all, of these
    components are coated (fully reflecting, partially reflecting or anti-reflecting)
    before incorporation into the laser system, ISO 11151-1:2015 does not include
    recommendations for the specification of coatings.
