abstract:
- language: en
  script: Latn
  content: This document gives guidelines for project management. It is applicable
    to any organization, including public, private and charitable, as well as to any
    type of project, regardless of purpose, delivery approaches, life cycle model
    used, complexity, size, cost or duration. NOTE Delivery approach can be any method
    or process suited to the type of outputs, such as predictive, incremental, iterative,
    adaptive or hybrid, including agile approaches. This document provides high-level
    descriptions of practices that are considered to work well and produce good results
    within the context of project management. This document does not provide guidance
    on the management of programmes or portfolios. Topics relating to general management
    are addressed only within the context of project management.
