abstract:
- language: en
  script: Latn
  content: This document provides general guidance on urban power distribution information systems within the smart community energy infrastructure. It covers functional and system reference architectures, requirements for digitization and visualization, as well as data privacy and security considerations. This document is applicable to stakeholders involved in the planning, design, implementation, operation, management and supervision of urban power distribution information systems and associated smart community energy infrastructure
