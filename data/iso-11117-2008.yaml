abstract:
- language: en
  script: Latn
  content: ISO 11117:2007 specifies the requirements for valve protection caps and
    guards for gas cylinders. ISO 11117:2007 defines tests for checking the mechanical
    strength and physical properties of the valve protection cap or valve guard. ISO
    11117:2007applies to protection devices for valves used on cylinders for liquefied,
    dissolved or compressed gases. It excludes protection devices for cylinders with
    a water capacity of 5 l or less and cylinders whereby the protection device is
    fixed by means of lugs welded or brazed to the cylinder, or is welded or brazed
    directly to the cylinder. This International Standard does not cover valve protection
    for breathing apparatus cylinders. ISO 11117:2007 does not specify all the requirements
    that may be necessary to enable the valve protection device to be used for lifting
    the cylinder.
