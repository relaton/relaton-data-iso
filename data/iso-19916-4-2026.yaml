abstract:
- language: en
  script: Latn
  content: 'This document specifies a method to evaluate, by means of impactors described
    in ISO 29584:2015, safe breakage characteristics of vacuum insulating glass (VIG)
    products intended to reduce cutting and piercing injuries to persons through accidental
    impact. This document does not specify the intended use of the products, but provides
    a method of classification in terms of the performance of the products being tested.
    The impact energy used for the various levels of classification are designed to
    provide the intended user or the legislator with the information to assist in
    defining the level of safety and protection required relative to the intended
    location at which the selected safety glass is to be used. The products to which
    this document is applicable are: VIG without further processing (Group 2); VIG
    processed into a laminated glass (Group 1); VIG backed with an adhesive (safety)
    film (Group 1). Insulating glass units incorporating VIG are excluded from this
    document.'
