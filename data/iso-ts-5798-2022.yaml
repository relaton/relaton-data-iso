abstract:
- language: en
  script: Latn
  content: This document provides requirements and recommendations for the design,
    development, verification, validation and implementation of analytical tests for
    detecting the severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2) using
    nucleic acid amplification. It addresses pre-examination, examination and post-examination
    process steps for human specimens. This document is applicable to medical laboratories.
    It is also intended to be used by in vitro diagnostic developers and manufacturers,
    as well as by institutions and organizations supporting SARS-CoV-2 research and
    diagnostics. This document does not apply to environmental samples.
