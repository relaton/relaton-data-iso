abstract:
- language: en
  script: Latn
  content: ISO 11783 as a whole specifies a serial data network for control and communications
    on forestry or agricultural tractors, mounted, semi-mounted, towed or self propelled
    implements. Its purpose is to standardize the method and format of transfer of
    data between sensors, actuators, control elements, information storage and display
    units whether mounted, or part of the tractor or any implement. ISO 11783-14:2013
    specifies a sequence control system, such as a headland management system, which
    includes tractor and implement functions in one system. The system allows recording
    of multiple sequences of operator-activated functions from a tractor or any other
    control function on the ISO 11783 network, and replaying them on operator command.
