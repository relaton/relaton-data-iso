abstract:
- language: en
  script: Latn
  content: 'This document deals with the technical requirements and the means for
    their verification for additive manufacturing (AM) machines using a bed of metallic
    powder, pyrophoric feedstock excluded, and a laser herein designated as machine.
    This document deals with all significant hazards, hazardous situations or hazardous
    events during all phases of the life of the machine (ISO 12100:2010, 5.4), as
    listed in Annex A, caused by AM machines using a bed of metallic powder and a
    laser when used as intended and under conditions of misuse which are reasonably
    foreseeable by the manufacturer. This document does not deal with hazards which
    can occur: —     during the design and construction phase of the laser beam powder
    ped fusion (PBF-LB) machine itself; —     operating in potentially explosive atmospheres.
    This document does not apply to technologies other than AM metals PBF-LB. This
    document is not applicable to machines manufactured before the date of its publication.'
