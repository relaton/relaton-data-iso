abstract:
- language: en
  script: Latn
  content: This document specifies a hydrostatic method for the determination of the
    apparent density and the open (to water) porosity of carbonaceous products used
    in the production of aluminium. This hydrostatic method was developed principally
    to determine the open porosity but can also be used to measure the apparent density.
    This document is especially applicable to samples of complex on irregular geometry
    (due to drilling difficulties).
