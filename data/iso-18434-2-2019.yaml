abstract:
- language: en
  script: Latn
  content: 'This document provides specific guidance on the interpretation of infrared
    thermograms as part of a programme for condition monitoring and diagnostics of
    machine systems. In addition, IR applications pertaining to machinery performance
    are addressed. This document is intended to: — provide guidance on establishing
    severity assessment criteria for anomalies identified by IRT; — outline methods
    and requirements for carrying out thermography of machine systems, including safety
    recommendations; — provide information on image interpretation, assessment criteria
    and reporting requirements.'
