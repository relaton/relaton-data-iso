abstract:
- language: en
  script: Latn
  content: 'ISO 21501-2:2007 describes a calibration and verification method for a
    light scattering liquid-borne particle counter (LSLPC), which is used to measure
    the size and particle number concentration of particles suspended in liquid. The
    light scattering method described in ISO 21501-2:2007 is based on single particle
    measurements. The typical size range of particles measured by this method is between
    0,1 µm and 10 µm in particle size. Instruments that conform to ISO 21501-2:2007
    are used for the evaluation of the cleanliness of pure water and chemicals, as
    well as the measurement of number and size distribution of particles in various
    liquids. The measured particle size using the LSLPC depends on the refractive
    index of particles and medium; therefore the measured particle size is equivalent
    to the calibration particles in pure water. The following are within the scope
    of ISO 21501-2:2007: size calibration;verification of size setting;counting efficiency;size
    resolution;false count rate;maximum particle number concentration;sampling flow
    rate;sampling time;sampling volume;calibration interval;test report.'
