abstract:
- language: en
  script: Latn
  content: This document gives guidelines for information exchange. It includes principles,
    a framework and a process for information exchange. It identifies mechanisms for
    information exchange that allow a participating organization to learn from others'
    experiences, mistakes and successes. It can be used to guide the maintenance of
    the information exchange arrangement in order to increase commitment and engagement.
    It provides measures that enhance the ability of participating organizations to
    cope with disruption risk. This document is applicable to private and public organizations
    that require guidance on establishing the conditions to support information exchange.
    This document does not apply to technical aspects but focuses on methodology issues.
    NOTE Legislation can differ from jurisdiction to jurisdiction. It is the user's
    responsibility to determine how applicable legal requirements relate to this document.
