abstract:
- language: en
  script: Latn
  content: This document specifies —    metrological requirements, —    maximum permissible
    errors, —    requirements for marking and —    information to be provided for
    users, for manually operated precision laboratory syringes made of glass or glass
    and metal designed to deliver their selected volume (Ex). Manually operated precision
    laboratory syringes are instruments used for delivering liquids and gases. The
    barrel is typically made of glass and the plunger and the needle are typically
    made of metal.
