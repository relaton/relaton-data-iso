abstract:
- language: en
  script: Latn
  content: This document specifies requirements for lighters equipped with a flame-lock
    system to ensure a reasonable degree of safety for normal use or reasonably foreseeable
    misuse of such lighters by users. This document applies to all flame-producing
    products, equipped with a flame lock system, intended for usages requiring prolonged
    burn time (such as culinary, arts and crafts, welding, jewellery). It does not
    apply to matches and flame-producing products covered by ISO 9994, ISO 22702 and
    EN 521.
