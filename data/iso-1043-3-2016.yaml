abstract:
- language: en
  script: Latn
  content: ISO 1043-3:2016 provides uniform symbols for components of terms relating
    to plasticizers to form abbreviated terms. It includes, in general, only those
    abbreviated terms that have come into established use. The purpose of ISO 1043-3:2016
    is to prevent the occurrence of more than one abbreviated term for a given plasticizer.
    The symbols are primarily intended to be convenient shorthand for forming abbreviated
    terms for chemical names in publications and other written matter.
