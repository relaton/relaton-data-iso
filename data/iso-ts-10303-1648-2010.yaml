abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1648:2010-03 specifies the application module for Assembly
    physical requirement allocation. The following are within the scope of ISO/TS
    10303-1648:2010-03: the representation of the assignment of customer, regulatory
    agency, and enterprise requirements to an assembly under design. These requirements
    may be assigned to physical items or geometric features that are used in various
    phases of the design process. thermal requirement allocation;electromagnetic compatibility
    requirement allocation;requirement allocation to shields;electromagnetic requirement
    allocation;requirement allocation to components in a design;requirement allocation
    to component features in a design;interface requirements;mating requirement to
    a connector in a design.'
