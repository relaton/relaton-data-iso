abstract:
- language: en
  script: Latn
  content: 'This document specifies ergonomic principles which apply to the user requirements,
    design, and procurement of the physical equipment and environment, which contribute
    to the context of use of interactive systems. It provides requirements, recommendations
    and explanations related to these principles. In particular, the general principles
    and requirements specified in this document apply to the standards specifying
    functional design of furniture and equipment constituting the environment. The
    principles specified in this document utilize ergonomic knowledge (from the disciplines
    anthropometry, acoustics, vision, thermal environments, indoor air quality, mechanical
    vibrations, etc.) to design and evaluate environments that enhance usability (effectiveness,
    efficiency and satisfaction), accessibility, performance and well-being for organized
    and non-organized use of interactive systems. The intended users of this document
    include: — developers of systems, products and services; — public and corporate
    purchasers; — occupational health and safety professionals; — architects and interior
    designers; — human resource professionals; — usability/ergonomics/human factors
    professionals.'
