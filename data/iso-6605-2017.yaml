- language: en
  script: Latn
  content: ISO 6605:2017 specifies uniform test methods for evaluating the performance
    of hoses and hose assemblies (hoses and attached hose fittings) used in hydraulic
    fluid power systems. Specific tests and performance criteria for evaluating hoses
    and hose assemblies used in hydraulic applications are in accordance with the
