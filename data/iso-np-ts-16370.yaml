abstract:
- language: en
  script: Latn
  content: This proposal specifies specifies the terminology, classification, technical
    conditions, selection principles and methods of wear-resistant refractory materials
    used in different high-temperature areas of circulating fluidized bed boilers.
    It applies to circulating fluidized bed (CFB) boilers with a capacity of 410 t/h
    and above. Circulating fluidized bed boilers of other capacity classes could also
    use this evaluation standard as reference.
