abstract:
- language: en
  script: Latn
  content: ISO 16050:2003 specifies a reverse-phase high-performance liquid chromatographic
    method, with immunoaffinity column clean-up and post-column derivatization, for
    the determination of aflatoxins in cereals, nuts and derived products. The limit
    of quantification for aflatoxin B1, and for the sum of aflatoxins B1, B2, G1 and
    G2, is 8 micrograms per kilogram. The method has been validated for maize containing
    24,5 micrograms per kilogram, for peanut butter containing 8,4 micrograms per
    kilogram, and for raw peanuts containing 16 micrograms per kilogram of total aflatoxins.
    It has also been shown that this method can be used for oilseed products, dried
    fruits and derived products.
