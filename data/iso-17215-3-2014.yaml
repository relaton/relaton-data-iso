abstract:
- language: en
  script: Latn
  content: ISO 17215-3:2014 specifies the standardized camera messages and data types
    used by a VCIC camera (OSI Layer 7). Applications hosted on ECUs want to communicate
    with one or more cameras (e.g. "Ask camera for parameters."). If the applications
    can use standardized services supported by the cameras (API layer 7), the development
    of a vision application should be independent of the camera used. The services
    can be implemented by general libraries. The definition of streaming data are
    not an issue of this API. The general terminology defined in ISO 17215-1 is also
    used in ISO 17215-3:2014.
