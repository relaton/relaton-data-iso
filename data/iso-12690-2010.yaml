abstract:
- language: en
  script: Latn
  content: ISO 12690:2010 specifies the tasks and responsibilities necessary to ensure
    the quality of a thermal sprayed coating or a coated component, including the
    coordination of activities related to thermal spraying. Thermal spraying coordination
    can be carried out by one or a number of persons within the same company or manufacturing
    department. The responsibilities of the spraying coordinator are specified by
    the manufacturer.
