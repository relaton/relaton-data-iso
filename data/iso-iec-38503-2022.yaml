abstract:
- language: en
  script: Latn
  content: This document provides guidance on the assessment of governance of information
    technology (IT) based on the principles, definitions and model for the governance
    of IT outlined in ISO/IEC 38500 and ISO/IEC TR 38502 and the implementation considerations
    outlined in ISO/IEC TS 38501. This document includes approaches for conducting
    the assessment, the criteria against which the assessment can be made, guidance
    on the evidence that can be used for the assessment, as well as a method for determining
    the maturity of the organization’s governance of IT. This document is applicable
    to organizations of all sizes, regardless of the extent of their use of IT.
