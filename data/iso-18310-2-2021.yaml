abstract:
- language: en
  script: Latn
  content: This document addresses the measurement methods, procedures and uncertainty
    estimation for the measurement, using a personal dosimeter, of the effective dose
    to the caregiver in the vicinity of the patient treated with radioiodine to ablate
    the thyroid. The general requirements for the patient and caregiver and a guidance
    (see Annex A) for designated expert on instructing caregivers of discharged patients
    is considered to effectively measure the effective dose to the caregiver in the
    vicinity of the patient.
