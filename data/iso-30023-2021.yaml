abstract:
- language: en
  script: Latn
  content: 'This document —    establishes a system of graphical symbols, intended
    for use in the marking of workwear articles and protective clothing providing
    information on the suitability for professional industrial laundering using ISO 15797,
    and —    specifies the use of these symbols in qualifying garments as potentially
    suitable for industrial laundering. The following professional industrial laundering
    treatments are covered: washing, bleaching, tunnel finishing and tumble drying
    after washing. Textile-care treatments in dry and wet cleaning are covered in
    ISO 3175 (all parts). This document applies to articles of workwear and protective
    clothing in the form in which they are supplied to the professional launderer.'
