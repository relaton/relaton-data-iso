- language: en
  script: Latn
  content: ISO 5610-9:2010 specifies tool holders with rectangular shank, style L,
    i.e. with offset shank and cutting edge angle equal to 95° for end cutting. These
    tool holders are primarily intended for indexable inserts made of hardmetal or
    other cutting materials to be mounted by clamping and to be used for turning operations.
