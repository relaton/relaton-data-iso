abstract:
- language: en
  script: Latn
  content: ISO 5074:2015 specifies the method for determining the grindability index
    of hard coal using the Hardgrove machine. It also specifies the procedure for
    calibrating the test machine and for preparing the standard reference coal samples.
    NOTE In this International Standard, the term "hard coal" is used as an indication
    of maturity or rank in the coalification sequence and is not related to the physical
    properties of the coal.
