abstract:
- language: en
  script: Latn
  content: ISO 8598-1:2014 specifies requirements and test methods for general purpose
    focimeters designed for the measurement of vertex powers, cylinder axis, prismatic
    power and prism base setting within a restricted area at a specified location
    of a lens. This excludes instruments that can only measure the whole lens at once.
    It is applicable to instruments typically intended for use by the ophthalmic community,
    with the capability to demonstrate conformity of spectacle lens products with
    the International Standards existing for these lenses.
