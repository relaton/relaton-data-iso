abstract:
- language: en
  script: Latn
  content: This document specifies a method for sampling, extracting and preserving
    macro-invertebrates from soils, including the litter zone. The sampling and extraction
    methods in this document are applicable to almost all types of soil, with the
    exception of soils in extreme climatic conditions (hard, frozen or flooded soils)
    and matrices other than soil, e.g. tree trunks, plants or lichens.
