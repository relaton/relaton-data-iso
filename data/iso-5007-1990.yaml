abstract:
- language: en
  script: Latn
  content: This first edition cancels and replaces the first edition of the Technical
    Report ISO/TR 5007:1980. Specifies a method for measuring and evaluating the effectiveness
    of the seat in reducing the vertical whole-body vibration transmitted to the operator
    of an tractor. Applies to seats fitted to tractors within specified classes, each
    class being defined as a group of tractors having similar vibration characteristics
    (table 2).
