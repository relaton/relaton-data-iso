abstract:
- language: en
  script: Latn
  content: This document specifies requirements for gaseous fire-extinguishing systems utilising IG-901, an isopycnic agent formulated to maintain a vapour density comparable to the ambient atmosphere. It covers the physical properties, design specifications, system usage, and safety aspects necessary to achieve and maintain a state of neutral buoyancy within a protected enclosure. 1.2 This document is applicable for systems operating at nominal pressures of 200 bar and 300 bar at 15 °C. This does not preclude the use of other systems, although design data for other pressures are not available at this time.
