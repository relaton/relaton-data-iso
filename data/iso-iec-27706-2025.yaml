abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides guidance for bodies providing
    audit and certification of a privacy information management system (PIMS) according
    to ISO/IEC 27701, in addition to the requirements contained within ISO/IEC 17021-1.
    The requirements contained in this document are demonstrated in terms of competence
    and reliability by bodies providing PIMS certification. The guidance contained
    in this document provides additional interpretation of these requirements for
    bodies providing PIMS certification. NOTE       This document can be used as a
    criteria document for accreditation, peer assessment or other audit processes.
