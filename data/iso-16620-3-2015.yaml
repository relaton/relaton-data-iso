abstract:
- language: en
  script: Latn
  content: ISO 16620-3:2015 specifies the method of determining the amounts of biobased
    part in the biobased synthetic polymer in plastics products. This calculation
    method for biobased synthetic polymer content is based on the mass of biobased
    synthetic polymer in the plastics products. ISO 16620-3:2015 is applicable to
    plastic products and plastic materials, polymer resins, monomers, or additives
    (e.g. plasticizers or modifiers), which are made from biobased or fossil-based
    constituents.
