abstract:
- language: en
  script: Latn
  content: 'ISO 15830-3:2013 specifies requirements for electronic components of the
    WorldSID 50th percentile side-impact dummy, a standardized anthropomorphic dummy
    for side-impact testing of road vehicles. It is applicable to impact tests involving:
    passenger vehicles of category M1 and goods vehicles of category N1; impacts to
    the side of the vehicle structure; impact tests involving the use of an anthropometric
    dummy as a human surrogate for the purpose of evaluating compliance with vehicle
    safety standards.'
