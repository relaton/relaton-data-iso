abstract:
- language: en
  script: Latn
  content: ISO 16603:2004 describes a laboratory test method for measuring the penetration
    resistance of clothing materials to blood and body fluids. This test method uses
    a synthetic blood in continuous contact with the material specimen at specified
    set of conditions using the ISO 13994 test apparatus. This test method is not
    always effective in testing protective clothing materials having thick, inner
    liners which readily absorb the synthetic blood.
