abstract:
- language: en
  script: Latn
  content: 'This document presents data modelling approaches and interface definitions
    for virtual human models in VR/AR/MR systems integration. It supports the creation
    of simulation environments for testing and evaluating key characteristics prior
    to production. The document defines semantic data processing interfaces that enable
    the creation, manipulation, and management of virtual humans within virtual environments.
    It also specifies data interfaces for accessing and utilizing semantic attributes
    of these virtual entities across a range of application domains. This work will:
    • Define data modelling approaches and interfaces for specifying data structures
    and operations to create and manage virtual humans within virtual environments,
    enabling simulation environments for testing and evaluating human-related products.
    • Specify semantic representations of virtual humans that allow access to individual
    components and their functional, physical, behavioural, physiological, and additional
    properties. • Classify and define the properties of virtual human objects to support
    semantic information processing and enable efficient management and retrieval.
    • Provide use case examples demonstrating data modelling and operations for virtual
    humans using the proposed interfaces. Device hardware technologies for VR/AR/MR
    systems integration are excluded from the scope of this document.'
