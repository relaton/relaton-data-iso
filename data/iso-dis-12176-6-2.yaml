abstract:
- language: en
  script: Latn
  content: This document specifies the type tests and the specific test methods for
    the control units (hereinafter called EUT – Equipment Under Test) operating with
    output voltage control that the manufacturer shall perform before placing the
    product on the market. It also specifies the tests that shall be performed after
    any service which has impact only over functional aspects and, in Annex A, the
    minimal content of the final test report. Electrical safety is out of the scope
    of this document. The outcome of the tests, as presented in the final test report,
    may be used by a conformity assessment body operating according to ISO/IEC 17021-1.
