abstract:
- language: en
  script: Latn
  content: ISO 15708-2:2017 specifies the general principles of X-ray computed tomography
    (CT), the equipment used and basic considerations of sample, materials and geometry.
    It is applicable to industrial imaging (i.e. non-medical applications) and gives
    a consistent set of CT performance parameter definitions, including how those
    performance parameters relate to CT system specifications. ISO 15708-2:2017 deals
    with computed axial tomography and excludes other types of tomography such as
    translational tomography and tomosynthesis.
