abstract:
- language: en
  script: Latn
  content: This standard specifies a categorial structure in the field of Traditional
    Chinese Medicine (TCM) informatics by defining a set of domain constraints composed
    of sanctioned characteristics and semantic links. It defines domain constraints,
    sanctioned characteristics, and semantic relationships used to describe individual
    patients, practitioners, and related actors in the context of digital TCM systems
    This part builds upon the foundational model established in Part 1 and focuses
    on standardizing the representation of individuals for use in healthcare, research,
    and administrative applications.
