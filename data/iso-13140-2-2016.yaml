abstract:
- language: en
  script: Latn
  content: ISO 13140-2:2016 specifies the abstract test suite (ATS) to evaluate the
    conformity of on-board equipment (OBE) and roadside equipment (RSE) to ISO 13141:2015
    in accordance with the test suite structure and test purposes defined in ISO 13140‑1:2016.
    It provides a basis for conformance tests for dedicated short-range communication
    (DSRC) equipment (OBE and RSE) to support interoperability between different equipment
    supplied by different manufacturers.
