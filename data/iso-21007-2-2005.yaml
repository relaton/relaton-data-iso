abstract:
- language: en
  script: Latn
  content: ISO 21007-2:2005 establishes a common framework for data structure to enable
    the unambiguous identification in gas cylinder applications and for other common
    data elements in this sector. ISO 21007-2:2005 enables a structure to allow some
    harmonization between different systems. However, it does not prescribe any one
    system and has been written in a non-mandatory style so as not to make it obsolete
    as technology changes. The main body of ISO 21007-2:2005 excludes any data elements
    that form any part of transmission or storage protocols such as headers and checksums.
