abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for the determination of
    the particulate content of middle distillate fuels with a closed flash point of
    38 °C or higher, determined in accordance with ISO 2719, ISO 3679 or ISO 13736.
    It is not applicable to light distillate fuels (gasolines) or to aviation fuels.
    A gravimetric limitation of the contamination of middle distillate fuels used
    in diesel engines and domestic applications should be used for the control of
    filter plugging and other operational problems, and this procedure is applicable
    up to 25 g/m3. The precision of this procedure is only valid if the results are
    obtained strictly in accordance with the provisions of this International Standard,
    particularly in respect of the material used for the filter (see the note in 6.9),
    sample size and filtration of the complete sample.
