abstract:
- language: en
  script: Latn
  content: ISO 1135-4:2011 specifies requirements for single-use transfusion sets
    for medical use in order to ensure their compatibility with containers for blood
    and blood components as well as with intravenous equipment. Secondary aims of
    ISO 1135-4:2011 are to provide guidance on specifications relating to the quality
    and performance of materials used in transfusion sets and to present designations
    for transfusion set components. In some countries, the national pharmacopoeia
    or other national regulations are legally binding and take precedence over ISO
    1135-4:2011.
