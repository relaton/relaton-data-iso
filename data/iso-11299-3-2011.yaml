abstract:
- language: en
  script: Latn
  content: ISO 11299-3:2011, in conjunction with ISO 11299-1, specifies requirements
    and test methods for close-fit lining systems intended to be used for the renovation
    of gas supply networks. ISO 11299-3:2011 is applicable to polyethylene (PE) pipes
    for both independent and interactive pressure pipe liners as well as associated
    fittings and joints for the construction of the lining system.
