abstract:
- language: en
  script: Latn
  content: This document provides guidance on the implementation of effective governance of IT in an organization, in accordance with ISO/IEC 38500. It identifies the key activities that an organization can undertake and provides guidance on the design and establishment of the supporting and enabling arrangements for the governance of IT, clarifying the roles and responsibilities of key organizational stakeholders. This document can be used by individuals responsible for governance of IT in an organization, as well as individuals supporting the governance of IT in organizations, and is applicable to organizations of all sizes and types.
