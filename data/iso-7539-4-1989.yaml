abstract:
- language: en
  script: Latn
  content: Covers procedures for designing, preparing and using uniaxially loaded
    tension specimens. These specimens may be used to test a variety of product forms
    (for example sheet, plate, tubes, wire or rod as well as parts joined by welding,
    riveting, or other methods). Uniaxially loaded tensile specimens may be stressed
    quantitatively with equipment for application of either a constant load, a constant
    strain or an increasing load or strain.
