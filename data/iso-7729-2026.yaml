abstract:
- language: en
  script: Latn
  content: This document specifies the properties and characteristics of typical vertical
    joints between two prefabricated concrete external wall components irrespective
    of whether these joints coincide with joints between the external wall and an
    internal wall or column. However, the characteristics of joints which are involved
    in the structural behaviour of buildings are not specified in this document. This
    document is applicable to all public or private buildings, used as dwellings,
    offices, educational or hospital premises.
