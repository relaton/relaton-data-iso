abstract:
- language: en
  script: Latn
  content: ISO 21909-1:2015 provides performance and test requirements for determining
    the acceptability of neutron dosimetry systems to be used for the measurement
    of personal dose equivalent, Hp(10), for neutrons ranging in energy from thermal
    to 20 MeV[1]. No distinction between the different techniques available in the
    market place is made in the description of the tests. Only generic distinctions,
    as disposable or reusable dosemeters for instance, are considered. This part of
    ISO 21909 gives information for extremity dosimetry, based on recommendations
    given by ICRU Report 66 in Annex A. [1] This maximal limit of the energy range
    is only an order of magnitude. The reference radiation fields used for the performance
    tests are those defined in ISO 8529-1. This means that the maximal energies could
    only be 14,8 MeV or 19 MeV. The present standard gives performance requirements
    to 14,8 MeV which is the typical neutron energy encountered for fusion. For fission
    spectra, the highest energies are around 20 MeV but the contribution to dose equivalent
    coming from neutrons with energy higher than 14,8 MeV is negligible.
