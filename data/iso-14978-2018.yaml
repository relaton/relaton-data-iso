abstract:
- language: en
  script: Latn
  content: This document specifies the general requirements, calibration, terms and
    definitions of characteristics of GPS measuring equipment, for example micrometers,
    callipers, gauge blocks and rotary axis form measuring instruments. This document
    forms the basis for standards defining and describing the design characteristics
    and metrological characteristics for measuring equipment and gives guidance for
    the development and content of standards for GPS measuring equipment. This document
    is intended to ease the communication between manufacturer/supplier and customer/user
    and to make the specification phase of GPS measuring equipment more accurate.
    This document is also intended as a tool to be used in companies in the process
    of defining and selecting relevant characteristics for measuring equipment. This
    document includes terms which are frequently used in connection with the characterization
    of specific measuring equipment.
