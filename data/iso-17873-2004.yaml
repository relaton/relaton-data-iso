abstract:
- language: en
  script: Latn
  content: ISO 17873:2004 specifies the applicable requirements concerning the design
    and use of ventilation systems in nuclear installations such as hot cells, nuclear
    fuel fabrication and examination laboratories, plutonium-handling facilities,
    reprocessing plants, enrichment facilities, nuclear-waste treatment stations,
    storage facilities, etc. The purpose of ventilation and containment systems is
    to ensure safety functions and protect workers, public and environment against
    the spread of radioactive contamination resulting from the operational processes
    of these installations. ISO 17873:2004 does not apply to the containment envelope
    of nuclear power plants and some research reactors where high pressure can occur
    during accident scenarios. It does apply to auxiliary rooms of these facilities.
