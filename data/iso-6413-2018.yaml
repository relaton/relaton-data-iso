abstract:
- language: en
  script: Latn
  content: 'This document specifies the rules and graphical symbols for the representations
    of splines and serrations in technical product documentation. Two methods of representation
    are specified: a) complete representation; b) simplified representation. The rules
    and graphical symbols specified in this document are applicable to detail drawings
    of parts (shafts and hubs) and to assembly drawings of joints. NOTE For uniformity,
    all the figures in this document have been drawn in the first-angle orthographic
    projection. A third-angle orthographic projection could equally have been used
    without prejudice to principles established.'
