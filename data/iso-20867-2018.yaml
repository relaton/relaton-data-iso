abstract:
- language: en
  script: Latn
  content: ISO 20867:2018 specifies a method to determine the ability of an insole
    component to hold a heel pin and to prevent its head from being pulled through
    the insole component. The method is applicable to insoles used in the seat of
    footwear with inside attached heels, and also to seat components where outside
    heel attachments are used and the heel pin is clenched.
