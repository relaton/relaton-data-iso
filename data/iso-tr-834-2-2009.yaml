abstract:
- language: en
  script: Latn
  content: ISO/TR 834-2:2009 establishes general principles for measuring the uniformity
    of furnace exposure of samples tested in accordance with the requirements of ISO
    834-1. ISO/TR 834-2:2009 specifies the type and location of instrumentation used
    to measure the temperature, velocity and oxygen content near the surface of simulated
    test samples. The surface of the simulated sample facing the furnace is gypsum
    board secured to cold-formed steel supports. ISO/TR 834-2:2009 does not include
    requirements for furnace performance.
