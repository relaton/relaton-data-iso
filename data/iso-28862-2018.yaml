abstract:
- language: en
  script: Latn
  content: This document specifies performance requirements and methods of test for
    non-reclosable packaging that has been designated child-resistant and which is
    intended to contain non-pharmaceutical products. This document is intended for
    type approval only (see 2.5) and is not intended for quality assurance purposes.
    This document applies to non-reclosable packages of the single-use type consisting
    of one or more individual units. Non-reclosable packages for pharmaceutical products
    are excluded from the scope of this document. These are the subject of a separate
    standard, ISO 14375, Child-resistant non-reclosable packaging for pharmaceutical
    products — Requirements and testing.
