abstract:
- language: en
  script: Latn
  content: ISO 4892-3:2013 specifies methods for exposing specimens to fluorescent
    UV radiation, heat and water in apparatus designed to simulate the weathering
    effects that occur when materials are exposed in actual end-use environments to
    global solar radiation, or to solar radiation through window glass. The specimens
    are exposed to fluorescent UV lamps under controlled environmental conditions
    (temperature, humidity and/or water). Different types of fluorescent UV lamp can
    be used to meet all the requirements for testing different materials.
