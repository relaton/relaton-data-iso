abstract:
- language: en
  script: Latn
  content: ISO 17655:2003 specifies the determination of the delta ferrite content
    of welds, of surfacings with austenitic weld metal, welding being carried out
    on welding procedure tests and production coupon test plates using any fusion
    welding process that is suitable for austenitic materials, with or without filler
    metal including welds made on components. It is intended that the ferrite number
    be used exclusively for stating the delta ferrite content of austenitic weld metal
    as determined by the method described in ISO 17655:2003.
