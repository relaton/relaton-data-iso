abstract:
- language: en
  script: Latn
  content: This document specifies requirements for systems that are used to produce
    offset prints for process colour reproduction on metallic substrates, which have
    been printed with a white coating. It is intended for flat printed sheet metal
    applications. It does not cover shaped or pre-formed metal such as pre-formed
    cans. Recommendations are provided with regard to appropriate test methods associated
    with these requirements. This document differs from the method used to produce
    an offset print on paper or board in ISO 12647-2 in that it considers the colour
    values of a typical white coated metal substrate intended for metal decoration,
    using offset lithography and substrates that are independent of backing colour.
