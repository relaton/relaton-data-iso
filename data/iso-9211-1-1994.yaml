abstract:
- language: en
  script: Latn
  content: 'Defines terms relevant to optical coatings grouped in four classes: basic
    definitions, definition of coatings by function, definitions of common coating
    imperfections and other definitions. ISO 9211 identifies surface treatments of
    components and substrates excluding ophthalmic optics (spectacles) by the application
    of optical coatings, gives a standard form for their specification, and defines
    the general characteristics and the test and measurement methods.'
