abstract:
- language: en
  script: Latn
  content: ISO 14829 specifies the calculations to be carried out to determine the
    stability of a straddle carrier. The stability calculations specified in this
    International Standard are intended to ensure that users of straddle carriers
    have adequate information about the behaviour of these carriers under various
    operating conditions. Stability warning and control devices are not covered by
    this International Standard.
