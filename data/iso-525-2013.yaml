abstract:
- language: en
  script: Latn
  content: 'ISO 525:2013 is applicable to bonded abrasive products (e.g. grinding
    wheels, segments, sticks and stones) in general, excluding superabrasive products
    and coated abrasive products. ISO 525:2013 specifies: the ISO type number and
    shape; dimensional symbols; standard profiles; requirements for dimensions, limit
    deviations and tolerances as well as permissible unbalance; the specification
    mark; the marking requirements.'
