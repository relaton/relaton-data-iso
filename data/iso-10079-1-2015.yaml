abstract:
- language: en
  script: Latn
  content: 'ISO 10079-1:2015 specifies safety and performance requirements for electrically
    powered medical and surgical suction equipment. It applies to equipment used in
    health care facilities such as hospitals, for domiciliary care of patients and
    for field and transport use. ISO 10079-1:2015 does not apply to the following:
    a) central power supply (by vacuum/compressed air generation), piping systems
    of vehicles and buildings, and wall connectors; b) end-pieces such as suction
    catheters, drains, curettes, Yankauer suckers and suction tips; c) syringes; d)
    dental suction equipment; e) anaesthetic gas scavenging systems; f) laboratory
    suction; g) autotransfusion systems; h) mucus extractors including neonatal mucus
    extractors; i) suction equipment where the collection container is downstream
    of the vacuum pump; j) ventouse (obstetric) equipment; k) suction equipment marked
    for endoscopic use only; l) plume evacuation systems.'
