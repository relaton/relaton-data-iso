abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements for the manufacture and
    testing of stranded carbon steel wire ropes for lifts, made from bright and galvanized
    wire finish in various constructions from 6 mm to 38 mm diameter. It is applicable
    to ropes used for suspension duty on traction drive and roped hydraulic lifts,
    and for compensation and governor duties on passenger lifts, freight lifts, service
    lifts, and man lifts moving between guides. It is not applicable to ropes for
    —    builder’s hoists, —    temporary hoists not running between permanent guides,
    —    cable-ways, —    mine hoists.
