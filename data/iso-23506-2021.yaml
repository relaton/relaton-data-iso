abstract:
- language: en
  script: Latn
  content: The method described in this document quantifies the absolute exposure
    to mineral oil vapours and droplets, within a concentration range from 0,5 mg/m3
    to 125 mg/m3, in the inhalable fraction of the workplace air. This document contains
    comprehensive information and instructions on the equipment and chemicals to be
    used. This method is applicable for water soluble oils and metal working fluids.
