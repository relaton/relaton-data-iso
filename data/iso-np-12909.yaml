abstract:
- language: en
  script: Latn
  content: This proposal specifies terms, definitions, symbols, principles, apparatus,
    specimen, test procedure, data processing, result evaluation, report and other
    content for the very high cycle fatigue test under resonant axial loading at an
    ultrasonic frequency that an accelerated method permits affordable time consuming
    to obtain the fatigue result. This proposal is applicable to the determination
    of fatigue properties or to the comparing of fatigue resistance of metallic materials
    at large number of cyclic loading within the range from 10^7 to 10^11 cycle, which
    are applied for the study of durability problems, such as analysis of wheel set
    safety based on numerical simulation in railway industry, design of key elements
    in power plant for long term service in energy industry, numerical predictive
    assessment of structure integrity in aviation industry, etc.
