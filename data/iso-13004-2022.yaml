abstract:
- language: en
  script: Latn
  content: This document describes a method for substantiating a selected sterilization
    dose of 17,5 kGy, 20 kGy, 22,5 kGy, 27,5 kGy, 30 kGy, 32,5 kGy or 35 kGy that
    achieves a sterility assurance level (SAL) of 10−6 or less for radiation sterilization
    of health care products. This document also specifies a method of sterilization
    dose audit used to demonstrate the continued effectiveness of the substantiated
    sterilization dose. NOTE 1   Selection and substantiation of the sterilization
    dose is used to meet the requirements for establishing the sterilization dose
    within process definition in ISO 11137‑1. This document does not apply to other
    sterilization doses than the substantiation of a selected sterilization dose of
    17,5 kGy, 20 kGy, 22,5 kGy, 27,5 kGy, 30 kGy, 32,5 kGy or 35 kGy. The method is
    not used for the substantiation of a selected sterilization dose if the average
    bioburden of the entire product item exceeds the limit specified for the selected
    sterilization dose (see Table 3). NOTE 2   The methods for substantiation of selected
    sterilization doses of 25 kGy and 15 kGy are not included in this document. They
    are described in ISO 11137‑2. If the decision is made to use this method of sterilization
    dose establishment, the method is intended to be followed in accordance with the
    requirements (shall) and guidance (should) stipulated herein.
