abstract:
- language: en
  script: Latn
  content: ISO 11452-8:2007 specifies tests for the electromagnetic immunity of electronic
    components for passenger cars and commercial vehicles, regardless of the propulsion
    system (e.g. spark-ignition engine, diesel engine, electric motor), to magnetic
    fields generated by power transmission lines and generating stations and some
    powerful electrical equipment, such as motors. To perform this test, the device
    under test (DUT) is exposed to a magnetic disturbance field. The radiating loop
    method can be applied to small DUTs or to larger DUTs by positioning the coil
    in multiple locations. The Helmholtz coil is sometimes used as an alternative
    method. This technique is limited by the relationship between the size of the
    DUT and the size of the coils. The electromagnetic disturbances considered in
    ISO 11452-8:2007 are limited to continuous narrowband electromagnetic fields.
    Immunity measurements of complete vehicles can generally only be carried out by
    the vehicle manufacturer for reasons including the high cost of an absorber-lined
    shielded enclosure preserving the secrecy of prototypes or the large number of
    different vehicle models. Consequently, for research, development and quality
    control, a laboratory measuring method is used by the vehicle manufacturer and
    equipment suppliers to test electronic components.
