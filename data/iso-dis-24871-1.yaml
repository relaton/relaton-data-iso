abstract:
- language: en
  script: Latn
  content: This document specifies a series of test methods for pyranometers classified
    in ISO 9060:2018, covering test conditions, test equipment, operation procedures
    and data processing of multiple parameters, among which include sensitivity, response
    time, zero off-set, non-stability, nonlinearity, directional response, clear sky
    global horizontal irradiance spectral error, temperature response and tilt response.
    Test methods in this standard are applicable to all class of pyranometers based
    on thermoelectric and photoelectric principles covered in ISO 9060:2018. Also,
    the appendix of this standard provides examples of uncertainty evaluation for
    each parameter, which can be used as reference for manufacturers and instrument
    users.
