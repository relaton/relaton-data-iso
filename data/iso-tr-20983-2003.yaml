abstract:
- language: en
  script: Latn
  content: ISO/TR 20983:2003 is applicable to all types of libraries in all countries.
    Limitations on the applicability of individual performance indicators are listed
    in the scope clause of the description of each indicator. Indicators may be used
    for comparison over time for the services provided by the same library. Comparisons
    between libraries and services should only be made with caution, taking into account
    differences in the constituencies of the libraries, with good understanding of
    the indicators used, and careful interpretation of the data. ISO/TR 20983:2003
    does not include indicators for the evaluation of the impact of libraries either
    on individuals or on society.
