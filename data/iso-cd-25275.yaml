abstract:
- language: en
  script: Latn
  content: This International Standard specifies test specimens and procedures for
    evaluation fatigue crack growth characteristics of the bonded plates of carbon
    fibre reinforced plastics (CFRPs) to metal using double cantilever beam (DCB)
    specimens under mode I (opening mode) loading. In this standard, cyclic mode I
    load (opening mode) is intentionally applied under repeated tensile loading to
    DCB specimen to put most severe condition in adhesive and the interface of adherend,
    in which undesirable interfacial failure is likelihood to occur with unstable
    and unpredictable fatigue crack growth. This method provides evaluation procedure
    of fatigue resistance of adhesive joints under opening load mode, as the estimation
    of the safety condition for considering long-term stabilization of bonded plates
    used in bonding carbon fibre reinforced plastics (CFRPs) to metal assemblies.
