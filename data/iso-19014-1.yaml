abstract:
- language: en
  script: Latn
  content: This document specifies a methodology for the determination of performance levels required for earth-moving machinery as defined in ISO 6165:2022. NOTE 1        For controls determined to be safety-related, the characteristics for architecture, hardware, software, environmental requirements, and performance are covered by other parts in the ISO 19014 series. NOTE 2        The ISO 19014 series covers the significant hazards caused by the failure of a safety control system and excludes hazards arising from the equipment itself (for example, electric shock or fire). To cover all the relevant safety requirements for the products in its scope, this document is used in combination with ISO 19014-2:2026, ISO 19014-3:2026, ISO 19014-4:2026, and ISO 19014-5:2026. This document does not apply to other controls that are not safety control systems (SCS) and that do not mitigate a hazard or perform a control function, and where the operator would be aware of a failure (e.g. windscreen wipers, head lights, cab light). NOTE 3        A list of safety control systems is included in Annex B. NOTE 4        Audible warnings are excluded from the requirements of diagnostic coverage. This document is not applicable to earth-moving machinery manufactured before the date of its publication.
