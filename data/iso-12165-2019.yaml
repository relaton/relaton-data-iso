abstract:
- language: en
  script: Latn
  content: This document specifies the terms generally in use for components of compression
    and injection moulds and diecasting dies. The function of these components is
    shown in Figure 1 to Figure 30. NOTE The figures are given as examples. The purpose
    of this document is to introduce coherent terms in professional terminology particularly
    with regard to the use in CAD (Computer Aided Drafting). Various symbols are specified
    for simplified representation on technical drawings.
