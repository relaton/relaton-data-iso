abstract:
- language: en
  script: Latn
  content: 'ISO 25947-5:2017 specifies requirements for the construction, performance
    and primary packaging of fireworks of category 1, 2 and 3 of the following types:
    - aerial wheels; - bangers; - batteries; - batteries requiring external support;
    - Bengal flames; - Bengal matches; - Bengal sticks; - Christmas crackers; - combinations;
    - combinations requiring external support; - compound fireworks; - crackling granules;
    - double bangers; - double flash bangers; - flash bangers; - flash pellets; -
    fountains; - ground movers; - ground spinners; - hand-held sparklers; - jumping
    crackers; - jumping ground spinners; - mines; - mini rockets; - nezumi-hanabi;
    - non-hand-held sparklers; - novelty matches; - party poppers; - rockets; - Roman
    candles; - senko-hanabi; - serpents; - shot tubes; - snaps; - spinners; - table
    bombs; - throwdowns; - wheels. ISO 25947-5:2017 does not apply to articles containing
    pyrotechnic composition that includes any of the following substances: - arsenic
    or arsenic compounds; - hexachlorobenzene; - mixtures containing a mass fraction
    of chlorates greater than 80 %; - mixtures of chlorates with metals; - mixtures
    of chlorates with red phosphorus (except when used in Christmas crackers, party
    poppers, snaps and throwdowns); - mixtures of chlorates with potassium hexacyanoferrate(II);
    - mixtures of chlorates with sulfur (these mixtures are allowed for friction heads
    only); - mixtures of chlorates with sulfides; - lead or lead compounds; - mercury
    compounds; - white phosphorus; - picrates or picric acid; - potassium chlorate
    with a mass fraction of bromates greater than 0,15 %; - sulfur with an acidity,
    expressed in mass fraction of sulphuric acid, greater than 0,002 %; - zirconium
    with a particle size of less than 40 µm. ISO 25947-5:2017 does not apply for theatrical
    pyrotechnic articles which are designed for indoor or outdoor stage use, including
    film and television productions or similar use.'
