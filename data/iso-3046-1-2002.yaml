abstract:
- language: en
  script: Latn
  content: ISO 3046-1 specifies the requirements for the declaration of power, fuel
    consumption, lubricating oil consumption and the test method in addition to the
    basic requirements defined in ISO 15550. It defines codes for engine brake power
    in accordance with ISO 15550, in order, where necessary, to simplify the application
    of the statements of power and to facilitate communication. This applies, e.g.,
    to statements of power used on engine data plates. ISO 3046-1 applies to reciprocating
    internal combustion (RIC) engines for land, rail-traction and marine use and may
    be applied to engines used to propel road construction and earth-moving machines,
    industrial trucks as well as for other applications where no suitable International
    Standard for these engines exists.
