abstract:
- language: en
  script: Latn
  content: ISO 18435-3:2015 defines the profiling methodology to use the interoperability
    templates of ISO 18435‑2. These profiling methods describe the construction and
    the use of application domain matrix elements (ADMEs), application interaction
    matrix elements (AIMEs), and an open technical dictionary (OTD) to support the
    information exchange. In particular, ISO 18435-3:2015 gives guidance related to
    profiling the information exchange between two applications by establishing the
    context, conveyance, and contents defined in ISO 18435‑2. ISO 18435-3:2015 is
    intended to be used in conjunction with ISO 18435‑1 and ISO 18435‑2.
