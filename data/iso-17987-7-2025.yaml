abstract:
- language: en
  script: Latn
  content: This document specifies the conformance test for the electrical physical
    layer (EPL) of the LIN communications system. The purpose of this document is
    to provide a standardised way to verify whether a LIN bus driver conforms to ISO 17987-4.
    The primary motivation is to ensure a level of interoperability of LIN bus drivers
    from different sources in a system environment. This document provides all the
    necessary technical information to ensure that test results are consistent even
    on different test systems, provided that the particular test suite and the test
    system are conformant to the content of this document.
