abstract:
- language: en
  script: Latn
  content: ISO 19145:2013 specifies the process for establishing, maintaining and
    publishing registers of representation of geographic point location in compliance
    with ISO 19135. It identifies and describes the information elements and the structure
    of a register of representations of geographic point location including the elements
    for the conversion of one representation to another. ISO 19145:2013 also specifies
    the XML implementation of the required XML extension to ISO/TS 19135-2, for the
    implementation of a register of geographic point location representations.
