abstract:
- language: en
  script: Latn
  content: 'ISO 5526:2013 lists the botanical names of the main species of: a) cereals
    (Clause 3); b) pulses (Clause 4); c) other food grains (Clause 5). ISO 5526:2013
    also lists the stabilized plant names of the International Seed Testing Association
    (ISTA). Various commonly met synonyms of the botanical names are indicated in
    an annex.'
