abstract:
- language: en
  script: Latn
  content: ISO 10594:2006 specifies a test target and a method for checking the optical
    and mechanical performances of rotary cameras used for producing 16 mm microfilm.
    This test target and method can be used for evaluating the performance of cameras
    (e.g. before purchase to establish initial reference),acceptance tests (e.g. confirming
    purchase specifications after maintenance), androutine checking (e.g. weekly or
    monthly). NOTE The characteristics of a rotary camera are also indicated.
