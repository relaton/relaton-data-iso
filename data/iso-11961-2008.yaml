abstract:
- language: en
  script: Latn
  content: ISO 11961:2008 specifies the technical delivery conditions for steel drill
    pipes with upset pipe body ends and weld-on tool joints for use in drilling and
    production operations in petroleum and natural gas industries for three product
    specification levels (PSL-1, PSL-2 and PSL-3). The requirements for PSL-1 form
    the basis of this ISO 11961:2008 but those that define different levels of standard
    technical requirements for PSL-2 and PSL-3 are also given. ISO 11961:2008 covers
    grade E drill pipe and the high-strength grades X, G and S. A typical drill pipe
    configuration is given, showing main elements and lengths. The main dimensions
    and masses of the grades of drill pipe are given in both SI units and in USC units.
    ISO 11961:2008 can also be used for drill pipe with tool joints not specified
    by ISO or API standards. By agreement between purchaser and manufacturer, ISO
    11961:2008 can also be applied to other drill-pipe body and/or tool-joint dimensions.
    ISO 11961:2008 lists supplementary requirements that can optionally be agreed
    between purchaser and manufacturer, for testing, performance verification and
    non-destructive examination. ISO 11961:2008 does not consider performance properties.
