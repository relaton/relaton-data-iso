abstract:
- language: en
  script: Latn
  content: This document specifies a method of test for determining the ignitability
    of products by direct small flame impingement under zero impressed irradiance
    using vertically oriented test specimens. Information on the precision of the
    test method is given in Annex A (informative). Information on testing not essentially
    flat end-use products is given in Annex B (normative). Information on testing
    perforated end-use products is given in Annex C (normative).
