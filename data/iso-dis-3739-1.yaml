abstract:
- language: en
  script: Latn
  content: 'This document specifies the main requirements of the metric series of
    pneumatic tyres primarily intended for industrial vehicles, including designations,
    dimensions and markings. The tyres are based on the following parameters: —   
    speeds not exceeding 50 km/h; —    use on 5° tapered or flat base rims. The conversion
    of code-designated industrial tyres into metric-designated tyres is outside the
    scope of this document.'
