abstract:
- language: en
  script: Latn
  content: ISO 11660-1:2008 establishes the general requirements for access to control
    stations and other areas of cranes as defined in ISO 4306-1, during normal operations,
    maintenance, inspection, erection, dismantling and emergency. It also deals with
    guards and restraints in general, concerning the protection of persons on or near
    the crane with regard to moving parts, falling objects or live parts. The particular
    requirements relating to access, guards and restraints for the various types of
    cranes and lifting appliances are given in ISO 11660-2, ISO 11660-3 and ISO 11660-5.
