abstract:
- language: en
  script: Latn
  content: ISO 15137:2005 specifies requirements and test methods for self-adhesive
    hanging devices (SAHD) used in combination with infusion containers, e.g. infusion
    glass bottles (see ISO 8536-1). The purpose of ISO 15137:2005 is to establish
    a safe SAHD for prescribed infusion containers while administering their content
    so as to ensure a safe application for the patient and for the user.
