abstract:
- language: en
  script: Latn
  content: 'This document describes the methods for the determination of void and
    fibre with specific orientation contents in a polished cross section of continuous
    fibre-reinforced ceramic matrix composites by image analysis. The methods apply
    to all ceramic matrix composites with continuous fibre reinforcement: bidirectional
    (2D) and tridirectional (3D). The methods also apply to carbon-fibre-reinforced
    carbon matrix composites (also known as: carbon/carbon or C/C). NOTE           
    The result obtained by the method is not volume content but area content.'
