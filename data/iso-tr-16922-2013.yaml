abstract:
- language: en
  script: Latn
  content: ISO/TR 16922 gives the specifications and guidelines for the methods to
    be used in the odorization of natural gas under a safety point of view. ISO/TR
    16922 also specifies the principles for the odorization technique (including handling
    and storage of odorants) and the control of odorization of natural gas. ISO/TR
    16922 does not cover odorization of gas supply with gases other than natural gas.
    NOTE The general requirements for odorants, and the physical and chemical properties
    of commonly used odorants are specified in ISO 13734.
