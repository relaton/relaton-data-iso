abstract:
- language: en
  script: Latn
  content: This document establishes principles, frameworks and methods for developing
    and maintaining corpora that are used for natural language processing (NLP) systems.
    It includes requirements and recommendations for corpus construction and application,
    and provides guidance and measures for quality evaluation of corpora used for
    NLP systems. This document is applicable for all organizations involved in any
    stage of an AI system life cycle.
