abstract:
- language: en
  script: Latn
  content: This document specifies, with reference to ISO 230-1, ISO 230-2 and ISO
    230-7, geometric tests, positioning tests and machining tests on general purpose
    and normal accuracy internal cylindrical grinding machines with horizontal spindle,
    whether they are or are not fitted with a facing wheelhead slide. This document
    also specifies the applicable tolerances corresponding to the above-mentioned
    tests. This document deals only with the verification of the accuracy; it applies
    neither to the testing of the machine operation (vibrations, abnormal noise, stick-slip
    motion of components, etc.), nor to the checking of its characteristics (such
    as speeds, feeds), which are generally checked before the testing of the accuracy.
    This document provides the terminology used for the principal components of the
    machine and the designation of the axes with reference to ISO 841.
