abstract:
- language: en
  script: Latn
  content: ISO 17653:2003 is applicable to spot welded test specimens with single
    sheet thicknesses ranging from 0,5 mm to 3,0 mm in steels. It may be used for
    non-ferrous materials in certain circumstances. The aim of this test is to determine
    the influence of different steel types, welding parameters and other factors on
    the deformation characteristics of a spot weld. Using this test, it is possible
    to determine the weld diameter and the fracture type from fractured specimens.
    Additionally, the maximum torsion moment (torque) and the corresponding torsion
    angle can be determined.
