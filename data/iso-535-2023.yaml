abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the water absorptiveness
    of paper and board, including corrugated fibreboard, under standard conditions.
    This document is not applicable for paper of grammage less than 50 g/m2 or embossed
    paper. It is not applicable for porous papers such as newsprint or papers such
    as blotting paper or other papers having a relatively high-water absorptiveness
    for which ISO 8787 is more suitable.
