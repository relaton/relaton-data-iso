abstract:
- language: en
  script: Latn
  content: This document applies to all goggles with plano lenses, intended for eye
    protection against hazards including mechanical impacts, corneal freezing, ultraviolet
    and visible solar radiation, rain, snow and wind, during snowmobile driving and
    other similar activities. This document applies to snowmobile goggles fitted with
    an insert to carry prescription lenses. It specifies requirements and testing
    for materials, performance, marking of goggles and information to be supplied
    by the manufacturer. Information on the selection and use of downhill skiing and
    snowboarding goggles is given in Annex A. This document does not apply to a) eye
    protectors for protection when operating or travelling on a motorized vehicle,
    b) eye protectors for protection against optical radiation from artificial sources,
    such as those used in solaria, c) eye protectors for direct observation of the
    sun, and d) eye protectors intended for sports with unrelated hazards and risks.
