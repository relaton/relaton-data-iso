abstract:
- language: en
  script: Latn
  content: This document specifies indicators for evaluating thermoplastics, thermosets or elastomeric materials used for microfluidic devices. This document provides basic considerations for selecting materials based on the material indicators for use in microfluidic devices. This document provides examples of the measurement methods of indicators used for evaluating thermoplastics, thermosets or elastomeric materials. This document does not apply to evaluate glass, although glass is considered as a reference.
