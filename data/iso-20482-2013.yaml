abstract:
- language: en
  script: Latn
  content: ISO 20482:2013 specifies a standard test method for determining the ability
    of metallic sheets and strips having a thickness from 0,1 mm up to 2 mm and a
    width of 90 mm or greater to undergo plastic deformation in stretch forming. For
    materials that are thicker and when only narrower strips are available, tools
    of specified dimensions are provided, in which case subscripts are used, as shown
    in Table 1.
