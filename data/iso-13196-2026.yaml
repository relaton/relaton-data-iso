abstract:
- language: en
  script: Latn
  content: This document specifies the procedure for screening soils for selected
    elements using handheld or portable equipment for energy dispersive X-ray fluorescence
    spectrometry (ED-XRF). It covers the application of this screening method to obtain
    qualitative or semi-quantitative data to assist decisions on a sampling strategy
    for detailed assessment of soil quality employing laboratory analytical chemical
    methods. NOTE 1        Screening methods generally provide qualitative or semi-quantitative
    concentration values that are indicative of concentration values, although occasionally
    they can give quantitative results under specific or limited conditions. NOTE 2       
    The greater the effort applied to the pretreatment of soil samples, the better
    the analytical results that can be expected (see e.g. Reference [19]). This document
    does not explicitly specify elements for which it is applicable, since the applicability
    depends on the performance of the apparatus and the objective of the screening.
    The elements which can be determined are limited by the performance of the instrument
    used, the concentrations of particular elements present in the soil, and the requirements
    of the investigation in terms of the minimum concentrations of concern (e.g. guideline
    value). NOTE 3        The XRF measurements of As, Cd, Co, Cr, Cu, Hg, Mo, Ni,
    Pb, Sb, Sn, V and Zn were validated as described in Annex A. NOTE 4        Annex B
    provides examples of when screening with a handheld ED-XRF spectrometer and a
    portable ED-XRF spectrometer can be useful. This document does not provide guidance
    on how to use the equipment to provide quantitative data for use in detailed site
    assessments. This document does not cover how the results of multiple determinations
    are synthesized to address the objectives of an ED-XRF determination.
