abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides guidance for the design
    and development of generative AI applications that integrate pretrained large
    language models (LLM) with retrieval-augmented generation (RAG) capabilities or
    functionally equivalent retrieval-based grounding mechanisms. It applies irrespective
    of deployment or access arrangements and addresses application-level mechanisms
    for retrieval-based grounding and generated-output control, whether these mechanisms
    are implemented within a single component or distributed across multiple components
    or service providers. This document is applicable to generative AI applications
    that use knowledge sources for tasks such as generating, summarizing, transforming,
    retrieving, extracting, classifying or explaining information in response to user
    or system inputs. This document focuses on design and development activities for
    such applications. It does not specify requirements for designing, training or
    fine-tuning foundation models or large language models.
