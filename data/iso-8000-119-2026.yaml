abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for transport unit identifiers
    (TUID). These requirements supplement those of ISO 8000-115. The following are
    within the scope of this document: —     the methods used to identify the originator
    of a potential shipment; —     the methods used to identify the origin and destination
    locations of a potential shipment; —     the requirements for the representation
    of the originator, origin, and destination locations of a potential shipment in
    a single identifier. The following are outside the scope of this document: —    
    the methods used to identify shipments in the transport phase; —     the identification
    of the goods movement phase.'
