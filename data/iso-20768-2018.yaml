abstract:
- language: en
  script: Latn
  content: 'This document: — defines the parameters and specifies the standard conditions
    for a vaping machine for vapour products (as defined in 3.1); — specifies technical
    requirements for the machine for routine analytical vaping, conforming with the
    standard conditions stated within Clause 4; — does not specify the vapour product,
    the vapour product operation or the liquid to be used; — does not specify the
    means for aerosol trapping, subsequent sample preparation or analyses of components
    in the trapped aerosol.'
