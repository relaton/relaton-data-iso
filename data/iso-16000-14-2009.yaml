abstract:
- language: en
  script: Latn
  content: ISO 16000-14:2009 specifies extraction, clean-up, and analysis procedures
    for the determination of polychlorinated biphenyls (PCBs), polychlorinated dibenzo-p-dioxins
    (PCDDs) and polychlorinated dibenzofurans (PCDFs) collected from indoor air on
    particle filters backed by polyurethane foam (PUF). The method incorporates specific
    analyses by high resolution gas chromatography combined with high resolution mass
    spectrometry (HRGC/HRMS). The method provides accurate quantitative data for tetra-
    to decachlorobiphenyls and tetra- to octachloro-dibenzo-p-dioxins/dibenzofurans
    (total concentrations for each isomeric series). It is capable of detecting 0,2
    pg/m3 or lower concentrations of most PCBs and PCDFs/PCDDs with air sampling volumes
    up to 360 m3 or more in special cases. However, it may not be possible to detect
    all analytes at 0,2 pg/m3 or lower, especially at lower sampling volumes. Precision
    under normal conditions can be expected to be ±25 % or better and uncertainty
    ±50 % or better.
