abstract:
- language: en
  script: Latn
  content: This document contains performance requirements and recommendations for
    electrical lighting systems in the interiors of urban rail guided vehicles, under
    all operating and emergency conditions. This document includes requirements for
    lighting installed for effect purposes (also referred to as decorative lighting).
    This document also defines the requirements for testing and conformity assessment,
    including options for verification via modelling (also referred to as simulation).
    This document applies only to new units. This document does not apply retrospectively
    to existing railway vehicles for reasons of refurbishment or renewal unless stated
    otherwise in the Technical Specification. This document does not address lighting
    installed in instruments or control devices (for example backlit buttons). This
    document does not address indicator lights (for example access door indicators,
    which are addressed in other Standards). This document does not address requirements
    for display screens.
