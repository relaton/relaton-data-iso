abstract:
- language: en
  script: Latn
  content: This international standard includes a method for the quantitative determination
    of lithium hydroxide (LiOH) and lithium carbonate (Li2CO3) in LiOH monohydrate
    (LHM). This method of determination is not suitable for LiOH anhydrous (LHA) because
    it rapidly absorbs CO2 from the atmosphere. This method utilizes a potentiometric
    probe with an automatic titrator to measure both LiOH and Li2CO3 in the test solution.
    This approach is more efficient and precise than colorimetric approaches that
    rely mainly on manual operation and visual inspection.
