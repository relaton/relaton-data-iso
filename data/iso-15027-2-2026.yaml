abstract:
- language: en
  script: Latn
  content: This document specifies performance and safety requirements for abandonment
    suits and suit systems in emergency situations for professional and leisure activities
    to protect the user against the effects of cold-water immersion, by reducing cold
    shock and delaying the onset of hypothermia. If a suit system includes a personal
    flotation device (PFD), it provides protection against drowning. This document
    is applicable to dry and wet abandonment suits. This document does not apply to
    constant wear suits. Requirements for constant wear suits are given in ISO 15027-1:2026.
    Test methods for immersion suits are given in ISO 15027-3:2026.
