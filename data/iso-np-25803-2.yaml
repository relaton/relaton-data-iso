abstract:
- language: en
  script: Latn
  content: This document specifies requirements for three types, marking, packaging,
    transportation and storage of dimethyl sulfoxide for industrial use. Type I is
    designated for use as a reaction solvent in the synthesis of carbon fibers and
    as a cleaning agent within the electronics industry. Type II is intended for use
    as raw materials and carriers within the pharmaceutical industry. Type III includes
    solvents and reaction reagents utilized in various other industrial applications.
