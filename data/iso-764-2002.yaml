abstract:
- language: en
  script: Latn
  content: ISO 764 specifies the minimum requirements and test methods for magnetic
    resistant watches. It is based on the simulation of an accidental exposure of
    a watch to a direct current magnetic field of 4 800 A/m. Annex A deals with watches
    designated as magnetic resistant with an additional indication of intensity of
    a magnetic field exceeding 4 800 A/m.
