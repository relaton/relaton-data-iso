abstract:
- language: en
  script: Latn
  content: ISO 2560 specifies requirements for classification of covered electrodes
    and deposited metal in the as-welded condition and in the post-weld heat-treated
    condition for manual metal arc welding of non-alloy and fine grain steels with
    a minimum yield strength of up to 500 N/mm2 or a minimum tensile strength of up
    to 570 N/mm2. It is a combined specification providing for classification utilizing
    a system based upon the yield strength and the average impact energy of 47 J of
    all-weld metal, or utilizing a system based upon the tensile strength and the
    average impact energy of 27 J of all-weld metal.
