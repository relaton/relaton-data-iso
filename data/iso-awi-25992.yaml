abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for verifying the
    physical properties, biological properties, chemical properties, additives and
    other requirements of an arterial blood specimen collection (often called “arterial
    blood gas collection needles ") for blood gas analysis. This document is applicable
    to single-use receptacles for human arterial blood specimen collection, including
    preset type receptacle for arterial blood specimen collection and drawout type
    receptacle for arterial blood specimen collection.This document does not provide
    requirements for venous blood specimen collection and capillary blood specimen
    collection.
