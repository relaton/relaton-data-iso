abstract:
- language: en
  script: Latn
  content: This part of ISO 228 specifies the requirements for thread form, dimensions,
    tolerances and designation for fastening pipe threads, thread sizes 1/16 to 6
    inclusive. Both internal and external threads are parallel threads, intended for
    the mechanical assembly of the component parts of fittings, cocks and valves,
    accessories, etc. These threads are not suitable as jointing threads where a pressure-tight
    joint is made on the thread. If assemblies with such threads must be made pressure-tight,
    this should be effected by compressing two tightening surfaces outside the threads,
    and by interposing an appropriate seal. NOTE 1 For pipe threads where pressure-tight
    joints are made on the threads, see ISO 7-1. NOTE 2 ISO 228-2 gives details of
    methods for verification of fastening thread dimensions and form, and recommended
    gauging systems.
