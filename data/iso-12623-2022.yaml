abstract:
- language: en
  script: Latn
  content: This document specifies the equipment and procedures for determining the
    short-term water absorption of preformed pipe insulation by partial immersion
    in water. It is applicable to thermal insulating products. NOTE      It is intended
    to simulate the water absorption caused by exposure to rain for 24 h during product
    installation. This document has been prepared for products used to insulate building
    equipment and industrial installations, but it can also be applied to products
    used in other areas.
