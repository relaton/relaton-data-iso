abstract:
- language: en
  script: Latn
  content: This document specifies a general-purpose document registry framework for
    transmitting, storing and utilizing documents in clinical and personalized health
    environments. It is quite broad in its applicability to realise the goal of sharing
    health-related documents spanning a broad spectrum of health domains such as healthcare
    specialities covering laboratory, cardiology, eye care, etc. and the many areas
    of personalized health. This document also supports shared document registration
    and retrieval via the federation of documents’ registries (IHE Cross-Community
    Access) in terms of individual users to reduce health information extrusion possibilities.
    This document supports the sharing of documents of any standardized content in
    the context of healthcare and well-being. It describes the means of locating and
    accessing shared documents among a diverse set of health organizations. It is
    designed to leverage existing health informatics for structuring and semantically
    rich health information, if so desired. It does not require the development of
    new health informatics standards.
