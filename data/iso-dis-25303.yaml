abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the degree of biodegradation and disintegration of plastics when exposed to wet mesophilic (37 °C ± 2 °C) or thermophilic (52 °C ± 2 °C) anaerobic digestion conditions. This method is based on ISO 13975, amended with a modified approach to determine disintegration. This method is designed to simulate typical anaerobic digestion conditions for wastewater sludge, the organic fraction of mixed municipal solid waste, manure, or agricultural waste. The test product is exposed in a laboratory test to an inoculum derived from anaerobic digesters operating on wastewater sludge, pre-treated household waste, manure, agricultural waste, or a mixture thereof. The anaerobic decomposition takes place under less than 15 % total solids (TS) and static non-mixed conditions. If disintegration is not complete at the end of the anaerobic phase, the digestate can be transferred to controlled aerobic composting conditions to determine the degree of disintegration after a post-composting phase. NOTE This test method is written for “plastics”, which include raw materials, intermediates (such as films) and finished items. NOTE 2  This test method does not consider the pre-treatment technologies applied in wet anaerobic digestion plants. Consequently, it does not address the question of whether a particular plastic, with its specific shape, thickness, and mechanical properties, enters the anaerobic reactor, or is rejected upstream.
