abstract:
- language: en
  script: Latn
  content: 'ISO 11089:2010 describes a procedure for the determination of the following
    antidegradants in raw synthetic rubbers: N‑alkyl-N''‑phenyl-p‑phenylenediamine;
    N‑aryl-N''‑aryl-p‑phenylenediamine; poly‑2,2,4‑trimethyl-1,2‑dihydroquinoline.
    Extender oils, when present, can interfere. The method, with modification if necessary,
    can be applied to the determination of other amine antidegradants.'
