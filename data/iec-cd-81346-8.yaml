abstract:
- language: en
  script: Latn
  content: This part of the 81346 International Standard, published jointly by IEC
    and ISO, provides, in combination with IEC 81346-1 and IEC 81346-2, rules and
    recommendations on the classification of properties related to systems designated
    by reference designations in any area of technical products and equipment. It
    provides a classification scheme of properties representing characteristics of
    objects and systems being designated by function- product- location- or type-specific
    reference designations. The classes of properties are intended, when combined
    with a reference designation to provide a clear identification of any property.
    RDS 81346-8 Properties are based on fundamental quantities and units in accordance
    with ISO 80000 standard series and standard data element types in accordance with
    IEC 61360 standard series (CDD) where applicable. This NP is coordinated with
    IEC SC3D (CDD) which supports this NP. This document will provide a generic set
    of properties which is fit for purpose in the design phase of systems and make
    these properties an important relation to the object occurrence (see IEC 81346-1,
    4.9) as distinct from object individuals (see IEC 81346-1, 4.9).
