abstract:
- language: en
  script: Latn
  content: ISO 10417:2004 establishes requirements and provides guidelines for configuration,
    installation, test, operation and documentation of subsurface safety valve (SSSV)
    systems. In addition, ISO 10417:2004 establishes requirements and provides guidelines
    for selection, handling, redress and documentation of SSSV downhole production
    equipment. ISO 10417:2004 is not applicable to repair activities. ISO 10432 provides
    requirements for SSSV equipment repair.
