abstract:
- language: en
  script: Latn
  content: 'This document, which is device-specific, specifies requirements for laryngoscopes
    with non-flexible blades, with internal battery-operated power sources, used for
    illuminating the larynx during intubation. It also specifies critical dimensions
    for those handles and laryngoscope blades with interchangeable hook‐on fittings.
    It is not applicable to the following: — flexible laryngoscopes; — laryngoscopes
    designed for surgery; — laryngoscopes powered from mains electricity supply; —
    laryngoscopes connected by light‐transmitting cables to external light sources;
    — video laryngoscopes designed to work with an external, integral or attached
    video system.'
