abstract:
- language: en
  script: Latn
  content: This document specifies the overall architecture, description process,
    scenario hierarchy, scenario status, scenario timing and sentence structure of
    the controlled natural scenario description of the test scenario. This document
    is applicable to the description of test scenarios for automated driving systems
    (ADS) of road vehicles from SAE Level 3 to SAE Level 5, specifically describing
    the functional scenarios and abstract scenario levels defined in ISO 34501 standard.
    The natural language description of testing scenarios below SAE Level 3 can be
    executed with reference.
