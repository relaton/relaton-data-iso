abstract:
- language: en
  script: Latn
  content: This document specifies a test method for determining the resistance of
    complete protective clothing to inward leakage of liquid chemicals (protective
    clothing integrity). This method specifies an alternative method for determining
    the resistance to spray penetration because it uses a static manikin instead of
    a test subject; it also uses a different spray configuration and duration than
    the other methods within ISO 17491 series. This test method is aligned with ASTM F1359
    since the only laboratories with equipment of this kind are performing testing
    according to that standard. This test method is not appropriate for evaluating
    the permeation or penetration of liquid chemicals through the material from which
    the clothing is made.
