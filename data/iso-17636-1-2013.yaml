abstract:
- language: en
  script: Latn
  content: ISO 17636-1:2013 specifies techniques of radiographic examination of fusion
    welded joints in metallic materials using industrial radiographic film techniques.
    ISO 17636-1:2013 applies to the joints of plates and pipes. Besides its conventional
    meaning, "pipe" as used in this International Standard covers other cylindrical
    bodies such as tubes, penstocks, boiler drums, and pressure vessels. ISO 17636-1:2013
    does not specify acceptance levels for any of the indications found on the radiographs.
    If contracting parties apply lower test criteria, it is possible that the quality
    achieved is significantly lower than when ISO 17636-1:2013 is strictly applied.
