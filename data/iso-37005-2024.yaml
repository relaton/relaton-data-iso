abstract:
- language: en
  script: Latn
  content: This document provides guidance to governing bodies on how to approach
    the development and use of indicators in their governing activities. This document
    is primarily written for use by governing bodies, it is also written to be of
    relevance to a range of other stakeholders inside and outside of the organization
    to help them improve the quality of the information on which they assess and make
    decisions regarding the organization’s governance. It is applicable to all organizations
    regardless of type, size, location, structure or purpose. This document does not
    cover indicators of effective governance.
