abstract:
- language: en
  script: Latn
  content: ISO 15647:2004 specifies a method of isotopic analysis of uranium hexafluoride
    (UF6) with 235U concentrations less than or equal to 5 % by mass and 234U and
    236U concentration between 0,001 % by mass and 1,5 % by mass. The method is in
    routine use to determine conformance to UF6 specifications. ISO 15647:2004 is
    applicable if the mass spectrometer uses Faraday cups.
