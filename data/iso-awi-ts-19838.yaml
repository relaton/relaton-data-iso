abstract:
- language: en
  script: Latn
  content: 'This Technical Specification gives general guidelines to explain the use
    of ISO cosmetic microbiological standards depending on the objective (in-market
    control, product development, etc.) and the product to be tested including products
    containing probiotics. This Technical Specification gives general guidelines to
    explain the use of ISO cosmetic microbiological standards depending on the objective
    (in-market control, product development, etc.) and the product to be tested including
    products containing probiotics. This Technical Specification provides guidance
    on how to assess the microbial content (contaminants part) and preservation efficacy
    of products containing intentionally added probiotics. This Technical Specification
    can be used to fulfil the requirements of the ISO standard on microbiological
    limits (ISO 17516). This Technical Specification does not give guidance on: 1)
    The assessment of human or environmental safety of the products 2) The evaluation
    of efficacy, stability or other claims as related to probiotic ingredients'
