abstract:
- language: en
  script: Latn
  content: This document specifies the composition, functional and performance requirements
    of flight controls for civil multicopter unmanned aircrafts (UAs) with the maximum
    take-off mass (MTOM) less than or equal to 25 kg corresponding to unmanned aircraft
    systems (UAS) at levels I, II, III and IV as graded in ISO 21895 which does not
    include fully autonomous flights. The flight control system in this document consists
    of flight control unit, navigation unit, fault diagnosis and management unit,
    flight planning, flight recorder, etc. This document is applicable to the design
    and manufacture of other UA flight control systems or subsystems.
