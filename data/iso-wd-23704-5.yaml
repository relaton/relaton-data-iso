abstract:
- language: en
  script: Latn
  content: 'This document specifies an implementation architecture (IA) and implementation
    guideline (IG) of CPSAM for implementing functional architecture (FA) given in
    ISO 23704-3 without crossing over AM standards based on the roadmap established
    by ISO/TC261 and ASTM F42, etc. Specifically, this document specifies: 1. Implementation
    architecture of CPCM (Cyber-Physically Controlled Machine tools) for additive
    manufacturing (CPSAM) 2. Implementation architecture of CSSM (Cyber Supporting
    System for Machine tools) for additive manufacturing (CPSAM), and provides 3.
    Implementation guideline (IG) of CPSAM including - Information model of CPSAM
    for CPCM and CSSM, - Communication model of CPSAM for CPCM and CSSM, and - Integration
    model of CPSAM, together with 4. Informative annexes including: - Use cases for
    various AM processes including PBF, DED, WAAM, etc., and - Use cases for industry
    applications for AM in industry., etc.'
