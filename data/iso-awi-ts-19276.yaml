abstract:
- language: en
  script: Latn
  content: "​​This document specifies how to evaluate the human exposure to foot-transmitted
    vibration in buses, trains, subways, aircraft, ships, on mobile equipment or in
    the vicinity of machinery. The standard specifies the measurement procedures and
    the frequency weighting to be adopted for workers that are either standing on
    or walking over vibrating surfaces. It specifies the factors to be considered
    in order to quantify the dangerousness of working environments. The frequency
    ranges considered is between 0,5 and 2 000 Hz. ​The standard defines the preferred
    methods for mounting the transducers, the frequency weightings to be adopted and
    the data processing procedures. The standard is only applicable to motion transmitted
    to the human body through the feet and does not apply to vibration transmitted
    through the upper limb or through the seat.​"
