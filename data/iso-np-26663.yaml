abstract:
- language: en
  script: Latn
  content: This document specifies the quality and safety requirements and test methods
    of Houttuynia cordata herb, which is derived from the dried aerial part of Houttuynia
    cordata Thunb. (Fam. Saururaceae). This document is applicable to Houttuynia cordata
    herb that are sold and used as natural medicines in international trade, including
    Chinese materia medica (whole medicinal material) and decoction pieces derived
    from this plant.
