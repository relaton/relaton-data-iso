abstract:
- language: en
  script: Latn
  content: This document specifies a test method to evaluate the effects of liquid
    cleaners and disinfectants on the properties of waterproof coated textiles that
    are used as the protective outer surface of assistive products for tissue integrity
    (APTIs). The test method is not applicable to outer surfaces of APTIs that are
    not sufficiently drapeable. The test addresses degradation by pure chemical contact
    time only, it does not address degradation by other factors, such as abrasion.
