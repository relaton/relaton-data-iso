abstract:
- language: en
  script: Latn
  content: ISO 1974:2012 specifies a method for determining the (out-of-plane) tearing
    resistance of paper. It can also be used for boards having a low grammage if the
    tearing resistance is within the range of the instrument. ISO 1974:2012 does not
    apply to corrugated fibreboard, but it may be applied to the components of such
    boards. It is not suitable for determining the cross-direction tearing resistance
    of highly directional paper (or board).
