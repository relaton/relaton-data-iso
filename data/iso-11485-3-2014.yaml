abstract:
- language: en
  script: Latn
  content: ISO 11485-3:2014 defines the conditions to classify a curved glass product
    as a curved safety glass. It classifies curved tempered glass and curved laminated
    glass as safety glasses used in buildings, by performance under impact and by
    mode of breakage. The classification by drop height corresponds to graded values
    of energy transmitted by the impact of a person. The classification system in
    ISO 11485-3:2014 relates to increasing personal safety by the reduction of cutting
    and piercing injuries to persons and the containment characteristics of the material.
    ISO 11485-3:2014 covers fracture characteristics, including fragmentation test
    and the physical and mechanical characteristics of curved tempered safety glass
    for use in buildings.
