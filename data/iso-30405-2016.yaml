- language: en
  script: Latn
  content: 'ISO 30405:2016 provides guidance on how to attract, source, assess and
    recruit people. It focuses on key processes and practices, including: · recruitment
    policy development; · the flow from the sourcing of potential applicants to the
    boarding of new recruits; · evaluation and measurement. ISO 30405:2016 can be
