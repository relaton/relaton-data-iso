abstract:
- language: en
  script: Latn
  content: This document specifies terms and definitions relating to dredgers, with
    the aim of giving clear enough definitions for every term for them to be understood
    by all specialists. This document is applicable only to equipment which is used
    for the construction and maintenance of navigable waterways and the extraction
    of soil and rocks. The terms specified in this document are intended to be used
    in documentation of all kinds. Certain standardized terms are also given with
    their abridged version; these can be used in cases where no possibility of misinterpretation
    can arise. A combination of terms is allowed in application.
