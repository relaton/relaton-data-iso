abstract:
- language: en
  script: Latn
  content: This document specifies methods for measuring rolling resistance, under
    controlled laboratory conditions, for new pneumatic tyres designed primarily for
    use on passenger cars, trucks and buses. This document is not applicable to tyres
    intended for temporary use only. It includes a method for correlating measurement
    results to allow inter-laboratory comparisons. It is designed to facilitate international
    cooperation and, possibly, regulation building. Measurement of tyres using this
    method enables comparisons to be made between the rolling resistance of new test
    tyres when they are free-rolling straight ahead, in a position perpendicular to
    the drum outer surface, and in steady-state conditions.
