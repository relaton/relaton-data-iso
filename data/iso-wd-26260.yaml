abstract:
- language: en
  script: Latn
  content: This proposed standard specifies the requirements for dried sea cucumber
    and the test methods for quality control. It also specifies the requirements of
    packaging, marking, storage and transportation. This proposed standard is applicable
    to dried sea cucumber made from sea cucumbers such as Apostichopus japonicus,
    Cucumaria frondosa, Parastichopus californics, Holothuria mexicana, Isostichopus
    badionotus, Holotoria scabra, and others, processed through pretreatment, boiling,
    drying and other processes.
