abstract:
- language: en
  script: Latn
  content: 'La présente norme internationale s''applique à des accouplements de type
    à dents, ou à éléments métalliques flexibles, ou à arbre flexible (quillshaft)
    ou à élasticité torsionnelle (tortionally resilient-type). Elle ne s''applique
    pas à d''autres types d''accouplements comme ceux de types à embrayage (clutch),
    ou hydrauliques, ou à courants de Foucault (eddy-current) ou de type rigide, ou
    de type à cannelures radiales (radial spline), ou de types à chaînes ou de types
    à soufflets.La présente Norme internationale concerne la conception, les matériaux
    de construction, la qualité de fabrication, l''inspection et les tests des accouplements.
    Elle ne comprend pas de critères de choix des différents types d''accouplements
    convenant à des applications spécifiques.NOTE: Il est vivement recommandé, lorsque
    des utilisateurs veulent adapter des nouveaux accouplements sur un ensemble de
    machines existant, les nouveaux accouplements étant de types différents de ceux
    qui ont équipé le train de machines à l''origine, que les utilisateurs consultent
    le vendeur ayant eu la responsabilité de l''ensemble du train de machines à l''origine,
    de façon à avoir l''assurance qu''ils appliquent correctement la présente Norme
    internationale. Il sera alors généralement nécessaire de refaire un calcul d''ensemble
    du comportement dynamique des parties tournantes de l''ensemble du train de machines.'
