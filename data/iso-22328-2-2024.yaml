abstract:
- language: en
  script: Latn
  content: This document gives guidelines for the implementation of a community-based
    disaster early warning system (EWS) for landslides. It complements the generic
    guidelines in ISO 22328-1. It describes the methods and procedures, implementation
    methods and activities specifically related to landslides. This document is applicable
    to communities vulnerable to landslides, without taking secondary/indirect effects
    into consideration.
