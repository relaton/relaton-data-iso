abstract:
- language: en
  script: Latn
  content: This document specifies a gas-chromatographic method for the identification
    and quantification of organotin compounds (OTCs) in soils as specified in Table
    1. This document is also applicable to samples from sediments, sludges and wastes
    (soil-like materials). The working range depends on the detection technique used
    and the amount of sample taken for analysis. The limit of quantification for each
    compound is about 10 µg/kg.
