abstract:
- language: en
  script: Latn
  content: This document specifies three test methods for investigating brazeability.
    A spreading test shows testing method with measurement of the spread area of the
    filler metals. A T-joint test describes a scheme to construct a T-shape design
    by the test pieces and a testing method. A varying gap test describes a test piece
    and a testing method for assessing the influence of the various parameters which
    can influence brazing during manufacture as a function of clearances.
