abstract:
- language: en
  script: Latn
  content: This document establishes an extended classification which includes sub-categories
    of environmentally acceptable lubricants and specifies the minimum requirements
    for mineral or synthetic based lubricants for the categories CKH, CKJ and CKM,
    according to ISO 6743-6, and their sub-categories of environmentally acceptable
    lubricants, intended for the lubrication of open and semi-enclosed gears. This
    document covers the lubricants applied in the open and semi-enclosed gear systems
    most currently encountered in the industry. It does not cover the extreme cases
    of use with regards to temperature and extreme charges conditions. NOTE 1 For
    use in exceptional conditions, suppliers and purchasers of lubricants can mutually
    agree on additional testing methods and acceptability criteria of the products.
    NOTE 2 This document can be read in conjunction with ISO 6743-6.
