abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of the following
    elements in aqua regia, nitric acid or mixture of hydrochloric (HCl), nitric (HNO3)
    and tetrafluoroboric (HBF4)/hydrofluoric (HF) acid digests of soil, treated biowaste,
    waste, sludge and sediment: Aluminium (Al), antimony (Sb), arsenic (As), barium
    (Ba), beryllium (Be), bismuth (Bi), boron (B), cadmium (Cd), calcium (Ca), cerium
    (Ce), chromium (Cr), cobalt (Co), copper (Cu), dysprosium (Dy), erbium (Er), europium
    (Eu), gallium (Ga), gadolinium (Gd), germanium (Ge), gold (Au), hafnium (Hf),
    holmium (Ho), indium (In), iridium (Ir), iron (Fe), lanthanum (La), lead (Pb),
    lithium (Li), lutetium (Lu) magnesium (Mg), manganese (Mn), mercury (Hg), molybdenum
    (Mo), neodymium (Nd), nickel (Ni), palladium (Pd), phosphorus (P), platinum (Pt),
    potassium (K), praseodymium (Pr), rhodium (Rh), ruthenium (Ru), samarium (Sm),
    scandium (Sc), selenium (Se), silicon (Si), silver (Ag), sodium (Na), strontium
    (Sr), sulfur (S), tantalum (Ta), tellurium (Te), terbium (Tb), thallium (Tl),
    thulium (Tm), thorium (Th), tin (Sn), titanium (Ti), tungsten (W), vanadium (V),
    yttrium (Y), ytterbium (Yb), zinc (Zn) and zirconium (Zr). The method is also
    applicable to other extracts or digests originating from, for example, DTPA extraction,
    fusion methods or total digestion methods, provided the user has verified the
    applicability. The method has been validated for the elements given in Table A.1
    (sludge), Table A.2 (compost) and Table A.3 (soil). The method is applicable for
    other solid matrices and other elements as listed above, provided the user has
    verified the applicability. This method is also applicable for the determination
    of major, minor and trace elements in aqua regia and nitric acid digests and in
    eluates of construction products (EN 17200[22]). NOTE            Construction
    products include e.g. mineral-based products; bituminous products; metals; wood-based
    products; plastics and rubbers; sealants and adhesives; paints and coatings.'
