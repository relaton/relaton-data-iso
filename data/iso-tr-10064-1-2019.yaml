abstract:
- language: en
  script: Latn
  content: This document supplements ISO 1328‑1:2013. It provides a code of practice
    dealing with measurements on flanks of individual cylindrical involute gears,
    i.e. with the measurement of pitch, profile, helix and tangential composite characteristics.
    It describes measuring equipment, provides advice for gear measuring methods and
    for the analysis of measurement results, and discusses the interpretation of results.
    Measurements using a double flank tester are not included (see ISO/TR 10064‑2).
    This document only applies to involute gears.
