abstract:
- language: en
  script: Latn
  content: ISO 13803:2014 specifies a test method for determining the haze of coatings.
    The method is suitable for the haze measurement of non-textures coatings on plane,
    opaque substrates. The use of the 20° geometry means that the method is closely
    related to the measurement of gloss at 20° in ISO 2813. The application of this
    method is intended to give improved differentiation between high-gloss surfaces,
    for example in the field of assessment of dispersion characteristics.
