abstract:
- language: en
  script: Latn
  content: 'This document specifies the definitions and requirements for buried circular manholes and inspection chambers installed to a maximum depth of 6 m from ground level to the invert of the main channel and manufactured from unplasticized poly(vinyl chloride) (PVC-U), polypropylene (PP), polypropylene with mineral modifiers (PP-MD) or polyethylene (PE). These products are intended for use in traffic areas and outside the building structure (application area code “U”) for wastewater (foul wastewater, domestic wastewater, surface water). NOTE 1        Products conforming with this document are also suitable in non-traffic areas. This document is only applicable to those chamber/manhole items where the manufacturer has clearly stated in the documentation how the components must be assembled to create a complete manhole or inspection chamber. The products covered by this document comprise the following: products providing access to the drain or sewer systems by means of inspection and cleaning equipment. products designated as manholes providing additionally human access to the drain or sewer systems. NOTE 2        Manholes and inspection chambers can be subject to national regulations and/or local provisions. NOTE 3        Products conforming with this document can be installed in underground applications without additional static calculations.'
