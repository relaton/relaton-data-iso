abstract:
- language: en
  script: Latn
  content: ISO 18287:2006 specifies the quantitative determination of 16 polycyclic
    aromatic hydrocarbons (PAH) according to the priority list of the Environmental
    Protection Agency, USA (EPA, 1982). ISO 18287:2006 is applicable to all types
    of soil (field-moist or chemically dried samples), covering a wide range of PAH
    contamination levels. Under the conditions specified in ISO 18287:2006, a lower
    limit of application of 0,01 mg/kg (expressed as dry matter) can be ensured for
    each individual PAH.
