abstract:
- language: en
  script: Latn
  content: 'Computer security is divided into four areas: security with regard to
    installation and operation; system security; security with regard to document
    contents; security with regard to communication. The use of this standard is intended
    to facilitate communication with quality assurance functions within the company
    and outside, consideration of the different security aspects in the design work,
    purchase of appropriate systems and services.'
