abstract:
- language: en
  script: Latn
  content: ISO 20245:2017 establishes minimum screening criteria for second-hand goods
    that are traded, sold, offered for sale, donated or exchanged between countries.
    ISO 20245:2017 is intended to help protect health, safety and the environment
    in which second-hand goods interact, when used by consumers. ISO 20245:2017 is
    applicable to second-hand goods that are shipped across at least one international
    border, and where the intended end user is a consumer. ISO 20245:2017 does not
    apply to goods that are remanufactured, rebuilt or refurbished.
