abstract:
- language: en
  script: Latn
  content: This document gives guidelines for inspection, recording procedures, packaging
    and storage of products, assemblies and components made from vulcanized or thermoplastic
    rubber prior to being put into circulation. It is applicable to both solid and
    cellular rubber products prepared from dry raw rubber, latex or other sources.
    It is not intended for use with raw rubber in bale, liquid (solution or emulsion)
    or particulate form, storage guidance for which is given in ISO 7664. NOTE           
    The recommendations for packaging form an integral part of the controlled storage
    procedure, as well as providing means of identifying the material and product.
