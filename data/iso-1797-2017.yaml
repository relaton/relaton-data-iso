abstract:
- language: en
  script: Latn
  content: ISO 1797:2017 specifies the requirements for dimensions and material properties
    of shanks used in dentistry for rotary or oscillating instruments. It describes
    the measurement methods for the verification of the requirements. ISO 1797:2017
    is not applicable to tips fixed to the handpiece with a screw, e.g. scaler tips.
    Information about the location of marking is also given. Annex A on quality control
    is included in order to ensure a high quality level.
