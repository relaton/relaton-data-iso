abstract:
- language: en
  script: Latn
  content: This document specifies a preparation method for the extraction of microplastics
    from water matrices such as terrestrial waters, wastewater, seawater, and groundwater.
    The method outlines the most reliable preparatory procedures that assure polymer
    stability and high recovery rates, precautions to prevent contamination, and quality
    control procedures. This document does not describe sampling methods and subsequent
    analytical methods. ISO 5667-27 should be referred to water sampling. ISO/DIS
    16094-2 and ISO/DIS 16094-3 should be used for analysis for the identification
    and quantification of extracted microplastics depending on the purpose of monitoring.
