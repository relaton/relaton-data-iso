abstract:
- language: en
  script: Latn
  content: This document specifies the attributes and the composition of the core metadata of marine biological material, describes the principles and methods of metadata extension. This document is applicable to the cataloging, archiving, storing, publishing, sharing, exchanging and inquiry of the core metadata of marine biological material. This document also supports structured data preparation for automated processing and, where applicable, AI-driven analytical applications.
