abstract:
- language: en
  script: Latn
  content: ISO 16000-6:2004 specifies a method for determination of volatile organic
    compounds (VOCs) in indoor air and in air sampled for the determination of the
    emission of VOCs from building materials using test chambers and cells. The method
    is based on use of Tenax TA® sorbent with subsequent thermal desorption and gas
    chromatographic analysis. The method is applicable to the measurement of non-polar
    and slightly polar VOCs in a concentration range of sub-microgram per cubic metre
    to up to several milligrams per cubic metre. Using the principles described in
    this method, some very volatile compounds and semivolatile organic compounds can
    also be analysed.
