abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods common to all non-hinged
    hand instruments used in dentistry, including materials, hardness, surface finish,
    resistance to reprocessing and information for marking, although some can have
    additional specific requirements and test methods. This document does not specify
    terms and definitions or classification of specific types of hand instruments.
    This document excludes powered instruments. The classification and the shape of
    working ends of non-hinged hand instruments are excluded from this document.
