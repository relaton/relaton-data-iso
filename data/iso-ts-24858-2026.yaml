abstract:
- language: en
  script: Latn
  content: This test method defines test terms and specifies a standard method for evaluating the homogeneity of electrically conductive spread carbon fibre tow using eddy current measurement. The impedance in the width direction of the fibre is measured continuously, and the standard deviation of the measured impedance determines the homogeneity of the conductive material in fibre form.
