abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for the detection of a DNA sequence
    present in a genetically modified linseed (Linum usitatissimum) line (event FP967,
    also named as “CDC Triffid”). For this purpose, extracted DNA is used in a real-time
    PCR and the genetic modification (GM) is specifically detected by amplification
    of a 105 bp DNA sequence representing the transition between the nopaline synthase
    gene terminator (Tnos) from Agrobacterium tumefaciens and the dihydrofolate reductase
    gene (dfrA1) from a Class 1 integron of Escherichia coli. The method described
    is applicable for the analysis of DNA extracted from foodstuffs. It can also be
    suitable for the analysis of DNA extracted from other products such as feedstuffs
    and seeds. The application of this method requires the extraction of an adequate
    amount of amplifiable DNA from the relevant matrix for the purpose of analysis.
