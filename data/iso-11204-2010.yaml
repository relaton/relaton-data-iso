abstract:
- language: en
  script: Latn
  content: 'ISO 11204:2010 specifies a method for determining the emission sound pressure
    levels of machinery or equipment, at a work station and at other specified positions
    nearby, in any environment which meets certain qualification requirements. A work
    station is occupied by an operator and may be located in open space, in the room
    where the source under test operates, in a cab fixed to the source under test,
    or in an enclosure remote from the source under test. One or more specified positions
    may be located in the vicinity of a work station, or in the vicinity of an attended
    or unattended machine. Such positions are sometimes referred to as bystander positions.
    Emission sound pressure levels are determined as A-weighted levels. Additionally,
    levels in frequency bands and C-weighted peak emission sound pressure levels can
    be determined in accordance with ISO 11204:2010, if required. A method is given
    for determining a local environmental correction (subject to a specified limiting
    maximum value) to be applied to the measured sound pressure levels to exclude
    the effects of reflections from reflecting surfaces other than the plane on which
    the source under test is placed. This correction is based upon the mean sound
    pressure level on a measurement surface, the sound pressure level measured at
    a specified position, and either an environmental correction or the equivalent
    absorption area of the test room. With the method specified in ISO 11204:2010
    results of accuracy grade 2 (engineering grade) or accuracy grade 3 (survey grade)
    are obtained. Corrections are applied for background noise and, as described above,
    for the acoustic environment. Instructions are given for the mounting and operation
    of the source under test and for the choice of microphone positions for the work
    station and for other specified positions. One purpose of the measurements is
    to permit comparison of the performance of different units of a given family of
    machines, under defined environmental conditions and standardized mounting and
    operating conditions. The method specified in ISO 11204:2010 is suitable for all
    types of noise (steady, non-steady, fluctuating, isolated bursts of sound energy,
    etc.) defined in ISO 12001. The method specified in ISO 11204:2010 is applicable
    to all types and sizes of noise sources. The type of test environment influences
    the accuracy of the determination of emission sound pressure levels. ISO 11204:2010
    is applicable to an indoor or outdoor environment with one or more reflecting
    planes present, meeting specified requirements. These requirements on the room
    are less strict than those of ISO 11201, in particular regarding the acoustical
    quality of the environment. ISO 11204:2010 is applicable to work stations and
    other specified positions where emission sound pressure levels are to be determined.
    Appropriate positions where measurements may be made include the following: a)
    work station located in the vicinity of the source under test; this is the case
    for many industrial machines and domestic appliances; b) work station within a
    cab which is an integral part of the source under test; this is the case for many
    industrial trucks and earth-moving machines; c) work station within a partial
    or total enclosure (or behind a screen) supplied by the manufacturer as an integral
    part of the source under test; d) work station partially or totally enclosed by
    the source under test — this situation may be encountered with some large industrial
    machines; e) bystander positions occupied by individuals not responsible for the
    operation of the source under test, but who may be in its immediate vicinity,
    either occasionally or continuously; f) other specified positions, not necessarily
    work stations or bystander positions. The work station may also lie on a specified
    path along which an operator moves.'
