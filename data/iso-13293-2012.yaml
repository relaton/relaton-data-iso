abstract:
- language: en
  script: Latn
  content: 'ISO 13293:2012 specifies requirements for gas blender training programmes
    and the competencies required of an individual in order to obtain a gas blender
    certificate from a training organization, attesting that he/she has met or exceeded
    the requirements specified in ISO 13293:2012. ISO 13293:2012 specifies two levels
    of gas blender qualification, as follows: Level 1 gas blender; Level 2 gas blender.
    ISO 13293:2012 recognizes that a training programme can be organized and delivered
    in a modular way.'
