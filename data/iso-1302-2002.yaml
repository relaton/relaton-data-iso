abstract:
- language: en
  script: Latn
  content: This International Standard specifies the rules for the indication of surface
    texture in technical product documentation (e.g. drawings, specifications, contracts,
    reports) by means of graphical symbols and textual indications. It is applicable
    to the indication of requirements for surfaces by means of profile parameters,
    according to ISO 4287, related to the R-profile (roughness parameters), W-profile
    (waviness parameters) and P-profile (structural parameters), to motif parameters,
    according to ISO 12085, related to the roughness motif and waviness motif, as
    well as to parameters related to the material ratio curve according to ISO 13565-2
    and ISO 13565-3. NOTE For the indication of requirements for surface imperfections
    (pores, scratches etc.), which cannot be specified using surface texture parameters,
    reference is made to ISO 8785, which covers surface imperfections.
