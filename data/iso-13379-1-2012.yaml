abstract:
- language: en
  script: Latn
  content: This part of ISO 13379 gives guidelines for the data interpretation and
    diagnostics of machines. It is intended to — allow the users and manufacturers
    of condition monitoring and diagnostics systems to share common concepts in the
    fields of machine diagnostics; — enable users to prepare the necessary technical
    characteristics that are used for the further diagnosis of the condition of the
    machine; — give an appropriate approach to achieve a diagnosis of machine faults.
    Since these are general guidelines, a list of the machine types addressed is not
    included. However, the machine sets covered by this part of ISO 13379 normally
    include industrial machines such as turbines, compressors, pumps, generators,
    electrical motors, blowers, gearboxes, and fans.
