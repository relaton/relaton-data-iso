abstract:
- language: en
  script: Latn
  content: ISO/TR 24156:2008 gives guidelines for using a subset of the Unified Modeling
    Language, UML, to represent the results of terminological concept analysis. It
    describes how object modelling techniques can be used for this purpose. The representation
    of concepts and concept relations used in terminology work by corresponding entities
    in the UML is described. ISO/TR 24156:2008 does not describe the UML and its general
    use in depth. These matters are covered in e.g. ISO/IEC 19501. ISO/TR 24156:2008
    does not describe the principles and methods of terminology work. This is covered
    in ISO 704.
