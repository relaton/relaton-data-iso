abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1602:2006 specifies the application module for Altered part.
    ISO/TS 10303-1602:2006 deals with the representation of the properties of a component
    that has had some preparation work done to it, which modifies the form or fit
    or function or material properties of the component and is usually installed in
    the product to be delivered to a customer. The preparation work may be necessary
    to facilitate the installation, or to support alternate mounting arrangements,
    or to implement a program in a field programmable device. This module does not
    distinguish between the properties of a component that has been altered prior
    to installation and the properties of a component that has been altered, installed
    and delivered to a customer as part of the assembly. The following is within the
    scope of ISO/TS 10303-1602:2006: representation of a part which is modified.'
