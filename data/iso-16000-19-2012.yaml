abstract:
- language: en
  script: Latn
  content: ISO 16000-19:2012 describes the measurement strategy for the detection
    of fungi in indoor environments. ISO 16000-19:2012 describes suitable sampling
    and analysis methods together with a description of the applicability and the
    interpretation of the measurement results to maximize the comparability of the
    measured data obtained for a given measurement objective. It does not include
    details on recording building characteristics or field inspections by qualified
    professionals which have to take place prior to any microbiological measurement.
    ISO 16000-19:2012 is not applicable to a detailed description of the building
    physics- and building-engineering-related procedures applicable to field inspections.
    The methods and procedures presented do not allow quantitative exposure assessment
    with regard to the room occupants. The application of ISO 16000-19:2012 presupposes
    the knowledge of ISO 16000-1.
