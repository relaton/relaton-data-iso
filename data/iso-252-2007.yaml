abstract:
- language: en
  script: Latn
  content: ISO 252:2007 specifies two test methods, A and B, for determining the adhesion
    strength between constitutive elements of a conveyor belt, i.e. between plies
    and between covers and carcass. Basic test conditions are in conformity with ISO
    36. It is applicable to all types of construction of conveyor belting with the
    exception of belts containing steel cord reinforcement, and textile-reinforced
    belts with a full-thickness tensile strength of less than 160 N/mm. It is not
    suitable or valid for light conveyor belts as described in ISO 21183-1.
