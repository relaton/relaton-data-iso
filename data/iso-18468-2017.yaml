abstract:
- language: en
  script: Latn
  content: ISO 18468:2017 specifies the requirements and test methods applicable to
    factory applied epoxy coatings (fusion bonded or 2-pack liquid epoxy) for ductile
    iron fittings and accessories supplied to ISO 2531 and ISO 7186, and ductile iron
    valves. It covers internal and external coatings for use in the conveyance of
    raw water, potable water and waste waters for operating temperatures up to 60
    °C. ISO 18468:2017 contains specifications for performance tests and routine tests
    of the coating.
