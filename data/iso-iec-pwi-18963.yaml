abstract:
- language: en
  script: Latn
  content: 'This standard defines a taxonomy of quantum simulator architectures and
    quantum simulation programming. The taxonomy includes the architecture of analog
    quantum simulators (AQSs) and digital quantum simulators (DQSs). For each of these
    architectures there are one or more types of quantum processor units (e.g., based
    on Rydberg interacting qubits, superconducting qubits) with one or more qubit
    modalities (e.g., based on atoms, ions, electrons, photons) known as quantum objects.
    The programming of quantum simulations operates according to two approaches: target
    Hamiltonian (i.e., AQS) and non-native Hamiltonian evolution (i.e., DQS). The
    mathematical constructs that can be used to describe the time-evolution of a quantum
    system of interest as well as enabling technologies, and software components are
    included in the taxonomy.'
