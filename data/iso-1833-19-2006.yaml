- language: en
  script: Latn
  content: ISO 1833-19:2006 specifies a method, by heating, to determine the percentage
    of cellulosic fibre in textiles made of binary mixtures of cotton or regenerated
    cellulose and chrysotile and crocidolite asbestos. This method may be applicable
    to other types of asbestos, subject to agreement between the interested parties.
