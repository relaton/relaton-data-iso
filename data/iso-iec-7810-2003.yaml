abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 7810:2003 is one of a series of standards describing the characteristics
    of identification cards. It is the purpose of ISO/IEC 7810:2003 to provide criteria
    to which cards shall perform and to specify the requirements for such cards used
    for international interchange. It takes into consideration both human and machine
    aspects and states minimum requirements. ISO/IEC 7810:2003 specifies: four different
    sizes of identification cards with a nominal thickness of 0,76 mm and dimensions
    of: ID-000 25 mm x 15 mm, ID-1 85,60 mm x 53,98 mm, ID-2 105 mm x 74 mm, ID-3
    125 mm x 88 mm;the conditions for conformance;the dimensions and tolerances of
    the identification cards;the construction and materials of the identification
    cards; andthe physical characteristics of the cards such as bending stiffness,
    flammability, toxicity, resistance to chemicals, dimensional stability, adhesion
    or blocking, warpage, resistance to heat, surface distortions, and contamination.
    ISO/IEC 7810:2003, together with a standard for test methods, provides for interchange
    between various types of identification card processing devices and systems.'
