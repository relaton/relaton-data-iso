abstract:
- language: en
  script: Latn
  content: This part of ISO 13215 specifies the requirements and test methods for
    judging if user-installed child restraints are correctly installed. Acceptance
    criteria are given for the child restraint when tested by the specified methods.
    These methods provide a measure of the effectiveness of the child restraint in
    preventing incorrect installation, and also cover the correctness of use of the
    child harness. The method is intended for technical assessment (see 4.1). The
    method is not primarily indended for quality assurance or research purposes.
