abstract:
- language: en
  script: Latn
  content: This document provides a method for the simultaneous analysis of multi-class pesticide residues in soil using gas chromatography-tandem mass spectrometry (GC-MS/MS) and liquid chromatography-tandem mass spectrometry (LC-MS/MS) analysis following extraction with acetonitrile and buffering salts mixture, and cleanup via dispersive solid-phase extraction (d-SPE). This document is applicable to the 30 target analytes listed in Table 1. This document can be applicable to other pesticide residues if their validity is confirmed.
