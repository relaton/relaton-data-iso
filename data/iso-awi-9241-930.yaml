abstract:
- language: en
  script: Latn
  content: This standard provides guidelines for haptic / tactile interactions in
    the context of multimodal environments specific to immersive and other environments,
    where combinations of modalities are intended to be used concurrently, overlapping,
    or sequentially by a user and will consider multimodal issues (such as allocation
    of functionality to different modalities). It provides guidance on the design
    of hardware, software, and combinations of hardware and software interactions,
    including how to design (multimodal) systems which use touch, gesture, and user’s
    body movement as inputs. Guidance on how and where to use different interaction
    patterns and techniques. Allows the design of direct and indirect interactions
    for passive and active touch for interaction and manipulation using various classes
    of input devices and their characteristics including hand and non-hand input devices.
