abstract:
- language: en
  script: Latn
  content: ISO/IEC 15419:2009 describes the characteristics and defines categories
    of bar code digital imaging systems, identifies the attributes of each system
    which are required to be controlled, and specifies minimum requirements for those
    attributes. It defines test methods for assessing the conformance of those attributes
    with ISO/IEC 15419:2009. It is intended to be used in conjunction with International
    Standards which detail the methodology for assessing the quality of a bar code
    symbol, such as ISO/IEC 15416. ISO/IEC 15419:2009 does not apply to Bar Code Masters,
    which are covered by ISO/IEC 15421.
