abstract:
- language: en
  script: Latn
  content: ISO 3356|IDF 63:2009 specifies a method for the determination of alkaline
    phosphatase activity in milk. The method applies to alkaline phosphatase activities
    not less than 1 µg of phenol per millilitre. The method is also suitable for the
    determination of alkaline phosphatase activity in milk powder, buttermilk and
    buttermilk powder, whey and whey powder.
