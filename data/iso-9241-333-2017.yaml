abstract:
- language: en
  script: Latn
  content: ISO 9241-333:2017 specifies ergonomic requirements for stereoscopic displays
    using glasses designed to produce or facilitate binocular parallax. These requirements
    are stated as performance specifications, aimed at ensuring effective and comfortable
    viewing conditions for users, and at reducing visual fatigue caused by stereoscopic
    images on stereoscopic display using glasses. Test methods and metrology, yielding
    conformance measurements and criteria, are provided for design evaluation. See
    Annex B for measurement procedures. ISO 9241-333:2017 is applicable to temporally
    or spatially interlaced types of display. These are implemented by flat-panel
    displays, projection displays, etc. Stereoscopic displays using glasses can be
    applied to many contexts of use. However, this document focuses on business and
    home leisure applications (i.e. observing moving images, games, etc.). Only dark
    environments are specified in this document. For technical explanation of display
    technologies, see Annex C.
