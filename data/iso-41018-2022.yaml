abstract:
- language: en
  script: Latn
  content: 'This document gives guidance on the development of a facility management
    (FM) policy when the organization: a) intends to establish a framework for setting
    FM objectives and the effective management of risk; b) intends to achieve alignment
    between the FM strategy and operational FM requirements; c) wants to improve the
    usefulness and benefits provided by the FM system; d) aims to meet the needs of
    interested parties and applicable FM requirements consistently; e) aims to be
    sustainable.'
