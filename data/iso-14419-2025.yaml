abstract:
- language: en
  script: Latn
  content: This document specifies a method for the evaluation of a substrate's resistance
    to absorption of a selected series of liquid hydrocarbons of different surface
    tensions. This document provides guidance to oil stain resistance. It can provide
    a rough index of oil stain resistance as, generally, the higher the oil repellency
    grade, the better resistance to staining by oily materials, especially liquid
    oil substances. This is particularly true when comparing various finishes for
    a given substrate. This document can also be used to determine if washing and/or
    drycleaning treatments have any adverse effect on the oil repellency characteristics
    of a substrate. NOTE 1        Washing and drycleaning treatment procedures are
    described in ISO 6330 and ISO 3175 (all parts), respectively. This document is
    not intended to give an absolute measure of the resistance of the substrate to
    staining by all oily materials. Other factors, such as composition and viscosity
    of the oily substances, substrate construction, fibre type, dyes and other finishing
    agents, also influence stain resistance. This document is not intended to estimate
    the resistance to penetration of the substrate by oil-based chemicals. NOTE 2       
    For the evaluation of the resistance to penetration of the substrate by oil-based
    chemicals, see ISO 6530.
