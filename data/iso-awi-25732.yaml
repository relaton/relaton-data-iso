abstract:
- language: en
  script: Latn
  content: 'This proposed standard gives advice on how to set up a style guide dedicated
    to the creation of conceptual information in information development processes
    applied in technical communication environments, as defined in IEC/IEEE 82079-1,
    Preparation of information for use (instructions for use) of products – Part 1:
    Principles and general requirements. The style guide is intended to support technical
    communicators, information architects and similar roles within an organization
    in designing, structuring and delivering information that their organization conveys
    to users of a supported product. To this aim, it provides these experts with criteria
    in making information design decisions on available options with respect to the
    context of use of a supported product, which is determined by —users and other
    target audiences; —their goals and tasks; —available technical and other resources;
    and —the environment in which the supported product is used. The listed parameters
    of a specific context of use limit the choice of suitable modes, modal resources,
    and thus, multimodal information product elements. They also determine what output
    media are suitable for that context of use. Taking into account these modelling
    decisions and restrictions on creating suitable information product elements,
    the style guide serves as an organisational framework that supports technical
    communicators and information architects in developing consistent information.'
