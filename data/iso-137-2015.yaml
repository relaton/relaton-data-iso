abstract:
- language: en
  script: Latn
  content: ISO 137:2015 specifies the procedure and the measurement conditions for
    the determination of the wool fibre diameter using a projection microscope. The
    method is suitable for wool fibres in any form and also for other fibres of reasonably
    circular cross-section. (In the case of dyed, bleached or finished fibres, the
    diameter might be different from that of fibres not subjected to such treatments.
    The estimates of fibre diameter obtained at the various stages of processing one
    lot of wool will not necessarily be the same.)
