abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies the minimum requirements and test
    conditions for certified cargo unit load devices to be installed in certified
    aircraft. It covers pallets, nets and containers intended for use with the following
    classes of aircraft loading and restraint systems: _ Class I: Unit load device
    restraint in conformity with all flight and ground load conditions, including
    9g forward emergency loading conditions. _ Class II: All other unit load device
    restraints.'
