abstract:
- language: en
  script: Latn
  content: This document specifies the test method and performance indicators to evaluate
    the behaviour of a vehicle equipped with a rear cross traffic alerting system.
    The overall test method for the rear cross traffic alerting system includes the
    specifications of the test objects, the accuracy of the test equipment measurements,
    the test environment requirements, and types of test scenarios. This document
    applies to M1 category vehicles. The requirements of rear cross traffic alerting
    system are not in the scope of this document.
