- language: en
  script: Latn
  content: ISO 11724:2016 specifies a method for the determination of total fluorine
    in coal, coke and fly ash. From measurement of the total fluorine alone, it is
    not possible to estimate the amount of fluorine released to the environment by
    utilization of the coal and subsequent disposal of the ash residue.
