abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for surface-applied diamond composite coatings on designated working zones of agricultural soil-engaging tools, including rotary tiller blades, plowshares and similar components. Note 1 This document applies to coatings produced by brazing, laser cladding, induction brazing, furnace brazing or other thermal processes capable of forming a metallurgical bond between the coating and the metallic substrate. It covers coated-zone designation, coating characteristics, surface integrity and performance requirements. Note 2 This document does not cover the structural design, bulk heat treatment or mechanical properties of the uncoated tool substrate. It does not apply to bulk diamond-impregnated or sintered tool bodies, or to discrete wear elements located in holes, grooves or pockets.
