abstract:
- language: en
  script: Latn
  content: Extends the protocol specifications given in ISO 8571 part 4 and supporting
    the internal and external file service interfaces to provide support for the services
    offered by overlapped access. The objective in introducing overlapped access is
    to allow more efficient access to structured files when a single initiator has
    a need to perform many reading and updating operations.
