abstract:
- language: en
  script: Latn
  content: ISO 2577:2007 specifies a method of determining the moulding shrinkage
    and the shrinkage after heat treatment of moulded test specimens of thermosetting
    moulding materials. These characteristics are useful for the production control
    of thermosetting material and for checking uniformity of manufacture. Furthermore,
    knowledge of the initial shrinkage of thermosetting materials is important for
    the construction of moulds, and knowledge of post-shrinkage for establishing the
    suitability of the moulding material for the manufacture of moulded pieces with
    accurate dimensions.
