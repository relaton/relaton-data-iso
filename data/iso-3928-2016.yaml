abstract:
- language: en
  script: Latn
  content: ISO 3928:2016 specifies - the die cavity dimensions used for making fatigue
    test pieces by pressing and sintering, together with certain dimensions of the
    test piece obtained from such a die, and - the dimensions of the test pieces machined
    from sintered and powder forged materials. ISO 3928:2016 is applicable to all
    sintered metals and alloys, excluding hardmetals.
