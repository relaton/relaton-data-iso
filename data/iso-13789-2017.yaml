abstract:
- language: en
  script: Latn
  content: ISO 13789:2017 specifies a method and provides conventions for the calculation
    of the steady‐state transmission and ventilation heat transfer coefficients of
    whole buildings and parts of buildings. It is applicable both to heat loss (internal
    temperature higher than external temperature) and to heat gain (internal temperature
    lower than external temperature). For the purpose of ISO 13789:2017, the heated
    or cooled space is assumed to be at uniform temperature. Annex C provides a steady‐state
    method to calculate the temperature in unconditioned spaces adjacent to conditioned
    spaces. NOTE Table 1 in the Introduction shows the relative position of ISO 13789:2017
    within the set of EPB standards in the context of the modular structure as set
    out in ISO 52000-1.
