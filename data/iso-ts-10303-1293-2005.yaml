abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1293:2005 specifies the application module for AP239 part
    definition information, in particular: representation of the data that identify
    parts and their versions;representation of characterization views of a version
    of a part;representation of parts, their versions, their definitions, and their
    management information, such as dates, that are assigned to them;representation
    of alias identifications assigned to product data;representation of the data that
    identify a product and the categories of products it belongs to; representation
    of the data that designate a version of a product;representation of characterization
    views of a product version;representation of relationships between versions of
    products;representation of assignments of an identifier to product data;representation
    and classification of documents and document information that may apply to part
    definition information;representation of properties of objects, their values and
    types, and classifications;representation of information that records the identification
    of an existing or potential future artifact - an actual product whose properties
    can only be known by observation or by derivation from observations;representation
    of interfaces between products;representation of the life cycle phase of existing
    interfaces between actual products (as realized), and includes planned interfaces
    between planned products;representation of relationships between requirements
    and items to which they are assigned, and between requirements and the items which
    are their source;representation of the information that identify a requirement
    and versions of requirements; representation of characterization views of a requirement
    version;representation of relationships between requirements which are expressed
    as relationships between requirement view definitions;representation of a type
    of state;representation of state observed.'
