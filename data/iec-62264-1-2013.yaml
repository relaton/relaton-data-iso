abstract:
- language: en
  script: Latn
  content: 'IEC 62264-1:2013 describes the manufacturing operations management domain
    (Level 3) and its activities, and the interface content and associated transactions
    within Level 3 and between Level 3 and Level 4. This description enables integration
    between the manufacturing operations and control domain (Levels 3, 2, 1) and the
    enterprise domain (Level 4). Its goals are to increase uniformity and consistency
    of interface terminology and reduce the risk, cost, and errors associated with
    implementing these interfaces. IEC 62264-1 can be used to reduce the effort associated
    with implementing new product offerings. This second edition cancels and replaces
    the first edition published in 2003. It constitutes a technical revision and includes
    the following significant technical changes with respect to the previous edition:
    - the functional hierarchy in 5.2 was extended using the definitions from IEC
    62264-3; - the equipment hierarchy in 5.3 was extended using the definitions from
    IEC 62264-3; - a physical asset equipment model was added in 5.3; - the generic
    model of manufacturing operations management categories in Clause 7 was added
    using information from IEC 62264-3; - the formal UML models that were in Clause
    7 were moved to IEC 62264-2 and the remaining data definitions are now in Clause
    8; - the capacity and capability model in Clause 8 was extended; - new Annexes
    A and B were moved from IEC 62264-3; - Subclause 5.5 on the decision hierarchy
    was removed and a reference added to ISO 15704; - Annex C, D, E were moved to
    a Technical Report; - Annex F was removed.'
