abstract:
- language: en
  script: Latn
  content: By successive extraction, separation, evaporation, redissolution, and filtration
    through an ion-exchange resin the contents of sodium chloride, anionic-active
    matter, polyglycol, and polyglycol sulfate are determined. From the content of
    anionic surface active agent (alkylether sulfate) and the anionic surface active
    matter content determined by two-phase titration, the mean relative molecular
    mass is estimated.
