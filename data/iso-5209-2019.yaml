abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the mandatory and optional
    markings of general purpose industrial valves. It defines the method of applying
    the markings, on the body, on a flange, on an identification plate or any other
    location. This document is considered in conjunction with the specified requirements
    of the valve product standards or valve performance standards. The marking requirements
    for plastic valves are not within the scope of this document.
