abstract:
- language: en
  script: Latn
  content: This document specifies test methods and acceptance criteria, within the
    frequency range of 0,5 MHz to 15 MHz, for assessing the performance of equipment
    dedicated for determining thickness using pulse-echo ultrasound, e.g. according
    to ISO 16809. This document only specifies the verifications required for the
    determination of thickness. This document is applicable to instruments with numerical
    display and instruments with A-scan presentation, each using either single- or
    dual-transducer probes. The tests described in this document can be used for verifying
    equipment covered by ISO 22232-1 and ISO 22232-2 when used for thickness determination.
