abstract:
- language: en
  script: Latn
  content: ISO 14692-4:2017 gives requirements and recommendations for the fabrication,
    installation, inspection and maintenance of GRP piping systems for use in oil
    and natural gas industry processing and utility service applications. The recommendations
    apply to delivery, inspection, handling, storage, installation, system pressure
    testing, maintenance and repair. It is intended to be read in conjunction with
    ISO 14692‑1.
