abstract:
- language: en
  script: Latn
  content: 'This document specifies computational methods for determining the acoustical
    source level of projectile sound and its one-third octave band spectrum, expressed
    as the sound exposure level for nominal mid-band frequencies from 12,5 Hz to 10 kHz.
    It also specifies a method on how to use this source level to calculate the sound
    exposure level at a receiver position. Results obtained with this document can
    be used as a basis for assessment of projectile sound from shooting ranges. Additionally,
    the data can be used to determine sound emission or immission from different types
    of ammunition and weapons. The prediction methods are applicable to outdoor conditions
    and straight projectile trajectories. Two computational methods are given to determine
    the acoustical source level: one for streamlined projectile shapes and one for
    non-streamlined shapes, such as pellets.'
