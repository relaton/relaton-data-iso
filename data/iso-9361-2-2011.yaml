abstract:
- language: en
  script: Latn
  content: 1 Scope This part of ISO 9361 specifies the dimensions of indexable ceramic
    inserts with rounded corners, with cylindrical fixing hole, with 0° normal clearance.
    These inserts are primarily intended to be mounted by top and hole clamping or
    hole clamping alone on external and internal turning tools. Ceramic cutting materials
    consist of a variety of oxides, nitrides and carbides. In contrast with hard metals
    (including cermets), ceramics do not have a metallic binding matrix. Such ceramic
    materials are, for example, oxide ceramics (consisting primarily of aluminium
    oxide Al2O3), carboxide ceramics (consisting generally of a mixture of aluminium
    oxide and other materials, such as titanium carbide TiC) and nitride ceramics
    (consisting generally of a mixture of silicon nitride and other materials, such
    as yttrium oxide Y2O3 and aluminium oxide).
