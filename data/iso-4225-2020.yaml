abstract:
- language: en
  script: Latn
  content: This document specifies terms and definitions that are related to air quality
    (see 3.1.1.1). These are either general terms or are used in connection with the
    sampling (see 3.3.3.1) and measurement of gases, vapours (see 3.1.5.8) and airborne
    particles (see 3.2.2.1) for the determination of air quality. The terms included
    are those that have been identified as being fundamental because their definition
    is necessary to avoid ambiguity and ensure consistency of use. An alphabetical
    index of the terms is provided in Annex A. This document is applicable to all
    International Standards, ISO Technical Reports, ISO Technical Specifications,
    and ISO Guides related to air quality.
