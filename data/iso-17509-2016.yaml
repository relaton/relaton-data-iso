abstract:
- language: en
  script: Latn
  content: ISO 17509:2016 specifies requirements for torque transmitters to be used
    in oral implantology in conjunction with a dental handpiece as an accessory in
    the placement of dental implants and the further manipulation of connecting parts
    in the craniofacial area. ISO 17509:2016 applies to torque transmitters used for
    placement and for removal in the oral cavity of the patient which are connected
    to power-driven systems having torque control mechanism, but does not apply to
    the power-driven systems themselves. ISO 17509:2016 does not include the dental
    implant nor parts that would be connected to it. With regard to safety, this International
    Standard gives requirements for classification, intended performance, performance
    attributes, material selection, performance evaluation, manufacture, reprocessing
    and information to be supplied by the manufacturer.
