abstract:
- language: en
  script: Latn
  content: ISO 10110-7:2008 specifies the indication of the level of acceptability
    of surface imperfections within the effective aperture of individual optical elements
    and optical assemblies. These include localized surface imperfections, edge chips
    and long scratches. ISO 10110-7:2008 applies to transmitting and reflecting surfaces
    of finished optical elements, whether or not they are coated, and to optical assemblies.
    It recognizes that permissible imperfections may be specified according to the
    area affected by imperfections on components or in optical assemblies.
