abstract:
- language: en
  script: Latn
  content: This document defines the maturity model and gives guidance on the evaluation
    criteria and methodology for evaluation of the quality of online learning across
    four key practice domains; — online learning environment; — learner support; —
    learning and assessment tasks; — learning resources. The scope of this document
    includes the following; — maturity model definition; — principles of evaluation
    questionnaires for maturity model components; — guidance for a maturity model
    evaluation method.
