abstract:
- language: en
  script: Latn
  content: This document establishes requirements for adventure tourism involving
    Water activities, relating to the operational safety of participants, leaders
    and assistants. This document applies to Water activities that are offered as
    tourism products. Tourism product design involves a product planning and development
    phase that is not subject to this document. Some tourism products include Water
    activities together with other tourism services (e.g. transfers, meals, lodging),
    but this document applies only to Water activities, the additional tourism services
    being excluded from the scope. This document is applicable to any kind of adventure
    tourism activity provider that offers tourism products consisting of Water activities.
