abstract:
- language: en
  script: Latn
  content: 'ISO 22915 deals with the safety of industrial trucks, as defined in ISO
    5053, relative to their stability and the verification of that stability. For
    the purposes of ISO 22915, industrial trucks are wheeled, self‑propelled or pedestrian‑propelled
    vehicles, excepting those running on rails. They are either operator‑controlled
    or driverless and designed to carry, tow, push, lift, stack or tier in racks.
    ISO 22915-8:2008 specifies an additional test for verifying the stability of a
    truck in the special condition of stacking with mast tilted forward and load in
    the elevated position. It is applicable to the following types of truck: counterbalanced
    trucks with tiltable masts; reach (retractable mast or forks) and straddle trucks
    with tiltable masts; pallet stackers with tiltable masts,; bi‑directional and
    multi‑directional (retractable mast or forks) trucks with tiltable masts; rough
    terrain trucks with tiltable masts; counterbalanced trucks fitted with articulated
    steering with tiltable masts.'
