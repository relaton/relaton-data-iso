abstract:
- language: en
  script: Latn
  content: This document specifies the general characteristics of fibre ropes and
    their constituent materials. It is intended to be used in conjunction with the
    standards for the individual types of fibre rope, which cover the physical properties
    and specific requirements for that particular product type. This document also
    gives some information on the use of fibre ropes and also on their inspection
    and retirement criteria. This document does not intend to address all of the safety
    matters associated with its use.
