abstract:
- language: en
  script: Latn
  content: ISO 7097:Part 2 describes an analytical method for the determination of
    uranium in pure product material samples such as U metal, UO2, UO3, uranyl nitrate
    hexahydrate, uranium hexafluoride and U3O8 from the nuclear fuel cycle. This procedure
    is sufficiently accurate and precise to be used for nuclear materials accountability.
    This method does not generate a toxic mixed waste as does the potassium dichromate
    titration. The method may not be applied to scrap or waste samples until such
    time as it is qualified by obtaining results statistically equivalent to those
    obtained by the potassium dichromate method on the same sample types. The method
    recommends that an aliquot of sample is weighed and that a mass titration is used,
    in order to obtain improved precision and accuracy. This does not preclude the
    use of any alternative techniques which could give equivalent performance. As
    the performance of some steps of the method is critical, the use of some automatic
    device has some advantages, mainly in the case of routine analysis.
