abstract:
- language: en
  script: Latn
  content: This document establishes the requirements and recommendations related
    to the equipment and services applicable to heritage hotels in order to provide
    quality services in a traditional style. This document emphasizes the harmonization
    of the equipment, furniture and service provision style with the historical period
    to which the heritage hotel belongs. It does not deal with the equipment or services
    of other types of hotels.
