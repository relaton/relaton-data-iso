abstract:
- language: en
  script: Latn
  content: This document stipulates the quality requirements and test methods for
    Citrus aurantium and Citrus sinensis fruit. Citrus aurantium and Citrus sinensis
    fruit is the dried immature fruit of Citrus aurantium L. and its cultivars or
    Citrus sinensis Osbeck (Fam. Rutaceae). This document is applicable to Citrus
    aurantium and Citrus sinensis fruit that is sold and used as natural medicines
    in international trade, including Chinese materia medica (whole medicinal materials)
    and decoction pieces derived from this plant. This document does not cover processing
    methods of Citrus aurantium and Citrus sinensis fruit.
