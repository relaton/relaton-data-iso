abstract:
- language: en
  script: Latn
  content: This document specifies requirements and guidelines for organizations to
    consider biodiversity in their strategies and operations, thereby adopting a biodiversity
    approach. It is applicable to any type of organization, irrespective of its size
    or nature (e.g. large groups, public institutions, local authorities, mid-cap
    companies, associations, micro-structures, single-member companies), sector, level
    of development and the extent to which it includes biodiversity protection in
    its activities.
