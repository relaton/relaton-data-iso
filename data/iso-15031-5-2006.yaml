abstract:
- language: en
  script: Latn
  content: ISO 15031-5:2006 specifies diagnostic services and functionally addressed
    request/response messages required to be supported by motor vehicles and external
    test equipment for diagnostic purposes which pertain to motor vehicle emission-related
    data. Any external test equipment meeting the requirements of ISO 15031-4 use
    these messages to retrieve emissions-related information from the vehicle. Each
    section of ISO 15031-5:2006, which specifies additional detail to existing sections
    of ISO 9141-2, ISO 14230-4, SAE J1850, and ISO 15765-4, supersedes those specifications.
