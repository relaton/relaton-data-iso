abstract:
- language: en
  script: Latn
  content: ISO 8015:2011 specifies fundamental concepts, principles and rules valid
    for the creation, interpretation and application of all other International Standards,
    Technical Specifications and Technical Reports concerning geometrical product
    specifications (GPS) and verification. It applies to the interpretation of GPS
    indications on all types of drawings. For the purposes of ISO 8015:2011, the term
    "drawing" is to be interpreted in the broadest possible sense, encompassing the
    total package of documentation specifying the workpiece.
