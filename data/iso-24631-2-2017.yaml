abstract:
- language: en
  script: Latn
  content: ISO 24631-2:2017 provides the means of evaluating the conformance with
    ISO 11784 and ISO 11785 of radiofrequency identification (RFID) transceivers used
    in the individual identification of animals. It also specifies the procedure for
    applying for a transceiver test registration and the associated rights and obligations
    of the parties involved. ISO 24631-2:2017 includes a wireless synchronization
    test applicable to mobile transceivers; however, it contains no provision for
    evaluating the wired synchronization of stationary transceivers. The test procedures
    specified in this document are recognized by the Federation of European Companion
    Animals Veterinary Association (FECAVA) and World Small Animal Veterinarian Association
    (WSAVA) and, as such, can be applied also to companion animals.
