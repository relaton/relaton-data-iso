abstract:
- language: en
  script: Latn
  content: This document specifies emotion annotation of data-stream for affective
    computing user interface (AUI). This document describes the emotion elements of
    emotion annotation, including emotional characteristic data-stream, scene, modality,
    timestamp, discrete emotion category, dimensional emotion space, and value. This
    document focuses on emotion annotation of data-stream which meets the needs of
    users. This document does not apply to emotion annotation process in AUI.
