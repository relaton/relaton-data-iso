abstract:
- language: en
  script: Latn
  content: This document defines a common terminology to be used in the context of
    third-party payment (TPP). Next, it establishes two logical structural models
    in which the assets to be protected are clarified. Finally, it specifies security
    objectives based on the analysis of the logical structural models and the interaction
    of the assets affected by threats, organizational security policies and assumptions.
    These security objectives are set out in order to counter the threats resulting
    from the intermediary nature of TPPSPs offering payment services compared with
    simpler payment models where the payer and the payee directly interact with their
    respective account servicing payment service provider (ASPSP). This document assumes
    that TPP-centric payments rely on the use of TPPSP credentials and the corresponding
    certified processes for issuance, distribution and renewal purposes. However,
    security objectives for such processes are out of the scope of this document.
    NOTE       This document is based on the methodology specified in the ISO/IEC
    15408 series. Therefore, the security matters that do not belong to the TOE are
    dealt with as assumptions, such as the security required by an information system
    that provides TPP services and the security of communication channels between
    the entities participating in a TPP business.
