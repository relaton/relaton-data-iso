abstract:
- language: en
  script: Latn
  content: This Technical Specification describes the way of making Electrochemical
    Noise Measurements (ENM), specifically focusing on its use for assessment of the
    protection being afforded by organic coatings to metal substrates. It outlines
    the procedure for use of the electrochemical apparatus, experimental set up and
    electrodes configurations, the presentation of measured data, and analysis of
    results. A detailed description of the methodology for application to bare metal,
    can be found in ISO 17093 (prepared by ISO TC 156 WG 11).
