abstract:
- language: en
  script: Latn
  content: 'This document defines the dimensions, design local pressures, mechanical
    properties and design stresses for the scantlings determination of monohull small
    craft with a hull length (LH) or a load line length (see NOTE 1) of up to 24 m.
    It considers all parts of the craft that are assumed to be watertight or weathertight
    when assessing stability, freeboard and buoyancy in accordance with ISO 12217.
    NOTE 1 The load line length is defined in the IMO "International Load Lines Convention
    1966/2005", it can be larger than LH for craft with overhangs. This length also
    sets up at 24 m the lower limit of several IMO conventions. The main core of this
    document determines the local design pressures and stresses for monohulls and
    details the possible scantlings methods derived from these pressures and stresses,
    both for monohulls and multihulls (see NOTE 2). The assessment process requires,
    where relevant, the application of Annexes. This document is applicable to small
    craft, in intact condition, of the two following types: — recreational craft,
    including recreational charter vessels; — small commercial craft and workboats,
    see Clause 12 and Annex J. It is not applicable to racing craft designed only
    for professional racing. NOTE 2 Local pressures and stresses for multihulls are
    given in ISO 12215-7. This document is applicable to the structures supporting
    windows, portlights, hatches, deadlights, and doors. For the complete scantlings
    of the craft, this document is intended to be used with ISO 12215-8 for rudders,
    ISO 12215-9 for appendages and ISO 12215-10 for rig loads and rig attachments.
    This document covers small craft built from the following materials: — fibre-reinforced
    plastics, either in single skin or sandwich construction; — aluminium or steel
    alloys; — glued wood or plywood (single skin or sandwich), excluding traditional
    wood construction; — non-reinforced plastics for craft with a hull length less
    than 6 m (see Annex D). Throughout this document, unless otherwise specified,
    dimensions are in (m), areas in (m2), masses in (kg), forces in (N), moments in
    (N.m), pressures in kN/m2 (1 kN/m2 = 1 kPa), stresses and elastic modulus in N/mm2
    (1 N/mm2 = 1 Mpa). Max(a;b;c) means that the required value is the maximum of
    a, b, and c; and min(d;e;f) means that the required value is the minimum of d,
    e, and f.'
