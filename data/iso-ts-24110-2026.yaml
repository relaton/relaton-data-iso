abstract:
- language: en
  script: Latn
  content: This document describes a test method of exposing specimens to artificial
    UV radiation in combination with a creep load. This method uses UV radiation source
    and ISO 899-1 for the tensile creep test. Fluorescent UV lamps specified in ISO
    4892-3 or UVC lamp can be used as UV radiation sources. NOTE            UVC exposure
    is described in IEC 60335-1.
