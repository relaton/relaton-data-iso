abstract:
- language: en
  script: Latn
  content: ISO/TS 15694:2004 specifies methods for measuring single shocks at the
    handle(s) of hand-held and hand-guided machinery characterized by a maximum strike
    rate below 5 Hz. ISO/TS 15694:2004 also defines additional requirements for the
    measuring instrumentation which is necessary for the evaluation of shocks. The
    aim is to facilitate the gathering of emission and human exposure data in order
    to provide a basis for emission declaration and for the future development of
    exposure risk criteria. However, ISO/TS 15694:2004 does not provide methods for
    the interpretation of the potential human effects of single shocks. It is therefore
    a basis for measurement and evaluation of emission of single shocks from hand-held
    and hand-guided machinery but does not cover the evaluation of human exposure.
