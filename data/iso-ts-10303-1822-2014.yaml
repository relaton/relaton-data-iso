abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1822:2014-02 specifies the application module for Externally
    conditioned data quality inspection result. The following are within the scope
    of ISO/TS 10303-1822:2014-02: the representation of the inspection result whether
    or not the inspected product data violates a data quality criterion of which acceptance
    conditions are defined in an external document; the representation of the inspected
    element of product for a data quality criterion of which acceptance conditions
    are defined in an external document.'
