abstract:
- language: en
  script: Latn
  content: This part of ISO 7206 specifies a test method for determining the endurance
    properties, under specified laboratory conditions, of stemmed femoral components
    of total hip joint prostheses and stemmed femoral components used alone in partial
    hip joints. It also defines the conditions of testing so that the important parameters
    that affect the components are taken into account, and describes how the specimen
    is set up for testing. This part of ISO 7206 is applicable to prostheses that
    have a plane of symmetry, or have preformed anteversion or double curvature of
    the stem, and to prostheses designed for use in revision surgery. This part of
    ISO 7206 does not specify methods of examining the test specimen; these should
    be agreed between the test laboratory and the party submitting the specimen for
    test.
