abstract:
- language: en
  script: Latn
  content: ISO/TR 15916:2015 provides guidelines for the use of hydrogen in its gaseous
    and liquid forms as well as its storage in either of these or other forms (hydrides).
    It identifies the basic safety concerns, hazards and risks, and describes the
    properties of hydrogen that are relevant to safety. Detailed safety requirements
    associated with specific hydrogen applications are treated in separate International
    Standards. "Hydrogen" in this paper means normal hydrogen (1H2), not deuterium
    (2H2) or tritium (3H2).
