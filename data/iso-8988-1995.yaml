abstract:
- language: en
  script: Latn
  content: Cancels and replaces the first edition (1989). Specifies two methods for
    the determination of the hexamethylenetetramine ("hexa") content of phenolic resins.
    They are equivalent. The Kjeldahl method is not applicable if there are other
    components containing nitrogen in the phenolic resin. The perchloric acid method
    is only applicable if there are no other basic or acidic additives in the resin.
