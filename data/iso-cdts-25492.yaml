abstract:
- language: en
  script: Latn
  content: This technical specification outlines a comprehensive methodology for estimating
    acute toxic gas emissions and impact during building fires. It is specifically
    designed to aid in the early design phases of building projects,where detailed
    information about material compositions may be limited or unknown. By providing
    standardized guidance, this specification enables fire safety engineers and related
    professionals to make informed decisions about fire safety planning, risk assessment,
    and mitigation strategies. The primary focus of this technical specification is
    on the emissions of Carbon Monoxide (CO), Carbon Dioxide (CO2), Hydrogen Chloride
    (HCl), and Hydrogen Cyanide (HCN), which are among the most hazardous gases emitted
    during fires. However, this can be complemented if presence of other hazardous
    compounds in smoke can be expected. The technical specification provides tabulated
    emission factors derived from experimental and empirical studies, offering a practical
    tool for estimating the potential release of these gases under various fire scenarios.
    Applicable to a wide range of building occupancies—including residential, commercial,
    industrial, car parks settings—this specification assists professionals in identifying
    and categorizing the types of combustibles likely to be present in different environments.
    It addresses fire development stages such as growth, fully developed, and decay,
    recognizing that toxic gas emissions can vary significantly throughout these stages.
    This technical specification is intended to be used in conjunction with a full
    fire safety engineering methodology from ISO 23932-1, using fire modelling simulation
    tools, to provide a detailed analysis of potential fire scenarios and toxic gas
    dispersal patterns. By integrating these estimations into fire safety planning,
    engineers can evaluate the effectiveness of safety measures, such as ventilation
    systems and evacuation plans, to ensure occupant safety. Moreover, this document
    emphasizes the importance of considering uncertainties and variability in material
    properties, fire conditions, and measurement techniques. It includes recommendations
    for managing these uncertainties, such as using conservative estimates and validating
    model predictions with real-world data.The scope of this specification extends
    beyond simple estimations, encouraging continuous improvement through feedback
    and the incorporation of new research findings. It is designed for use by a broad
    range of stakeholders,including fire safety engineers, architects, building designers,
    regulatory authorities, and safety planners, providing them with a framework to
    enhance building safety and occupant protection.This technical specification focuses
    on acute impact on occupants.
