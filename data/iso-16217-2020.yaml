abstract:
- language: en
  script: Latn
  content: This document specifies a procedure of water immersion for the in vivo
    determination of the water resistance of sunscreen products. This document is
    applicable to products intended to be placed in contact with human skin including
    any component able to absorb, reflect or scatter UV rays and which, in addition,
    are designed to be less readily removed from the skin by water and/or during water
    immersion. It is intended to be read in conjunction with ISO 24444.
