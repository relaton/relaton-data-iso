abstract:
- language: en
  script: Latn
  content: 'This document specifies methods for the evaluation of some aspects of
    the behaviour of nonwoven fabrics in the presence of liquids. In particular: —    
    the liquid absorbency time; —     the liquid absorptive capacity; —     the liquid
    wicking rate (capillarity). The different aspects of absorbency can relate to
    various end uses of the tested products. The tests do not apply to any fabric
    containing super absorbent materials.'
