abstract:
- language: en
  script: Latn
  content: This International Standard specifies hygiene requirements of machines
    and provides information for the intended use to be provided by the manufacturer.
    It applies to all types of machines and associated equipment used in applications
    where hygiene risks to the consumer of the product can occur. This International
    Standard does not cover requirements relative to the uncontrolled egress of microbiological
    agents from the machine.
