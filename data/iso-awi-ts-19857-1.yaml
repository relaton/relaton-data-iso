abstract:
- language: en
  script: Latn
  content: This document describes a laboratory test method, using an IGT1-type or
    a prüfbau2-type printability tester, for the preparation of specimens to evaluate
    the absorption rate of an ink on a substrate in offset lithography by setting-off
    the printed surface to an unprinted surface. This method describes testing with
    an amount of ink simulating either single colour or multi-colour printing. The
    print and the set-off print (counter print) are made with interval times, between
    print and set-off, common for the target process. This method evaluates a particular
    ink and substrate combination.   1These materials are available from IGT Testing
    Systems, www.igt.nl. This information is given for the convenience of the users
    of this document and does not constitute an endorsement by ISO of the products.
    Equivalent products may be used if they can be shown to lead to the same results.
    2These materials are available from prüfbau, Dr.-Ing. H. Dürner GmbH, www.pruefbau.de.
    This information is given for the convenience of the users of this document and
    does not constitute an endorsement by ISO of the products. Equivalent products
    may be used if they can be shown to lead to the same results.
