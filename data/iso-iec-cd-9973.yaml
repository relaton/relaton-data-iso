abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 9973:2013 specifies procedures to be followed in preparing, maintaining
    and publishing the International Register of Items for any standard whose classes
    of items are applicable to this register. The items that may be registered fall
    into several broad categories including: computer graphics concepts, data structures
    used by relevant standards, spatial and environmental concepts, and profiles of
    relevant standards.'
