abstract:
- language: en
  script: Latn
  content: This document specifies methods for the enumeration of colony-forming units
    (cru) of thermoresistant spores of thermophilic bacteria in heatprocessed milk
    and dried milk products by using a colony-count technique at 55 °C after heating
    the sample at 106 °C or 100 °C. The applicability of this document is limited
    to heatprocessed milk including pasteurized, ultra-high temperature (UHT) processed
    and sterilized milk; as well as dried whole milk, skim milk, buttermilk and whey
    products. 
