abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1613:2010-07 specifies the application module for Physical
    unit non planar design view. The following are within the scope of ISO/TS 10303-1613:2010-07:
    assemblies with non-planar shape models; assembly components with non-planar shape
    models that are sub-models of the shape of the assembly; items within the scope
    of application module Manifold subsurface, ISO/TS 10303-1702; items within the
    scope of application module Physical unit design view, ISO/TS 10303-1728.'
