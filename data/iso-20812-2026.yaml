abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements and test methods for factory-made
    cellular glass products which are used for thermal insulation of buildings. The
    products are manufactured in the form of slabs, faced or unfaced boards, and one-sided
    blocks. Products covered by this document are also used in prefabricated thermal
    insulation systems and composite panels. The performance of systems incorporating
    these products is not covered. This document describes product characteristics
    and test methods, designation code, marking and labelling. This document does
    not apply to: —     products with a declared thermal conductivity greater than
    0,056 W/(m K) at 25 °C; —     products for the insulation for the building equipment
    and industrial installations. This document does not specify the required level
    of a given property to be achieved by a product to demonstrate fitness for purpose
    in a particular application. Specific requirements agreed between the purchaser
    and the supplier, e.g. type, dimensions and forms, regulatory compliance and inspection
    requirements or certification requirements are outside the scope of this document.'
