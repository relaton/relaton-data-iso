abstract:
- language: en
  script: Latn
  content: This Technical Report applies to the removal of information recorded on
    write-once optical media systems when expungement is ordered by the court or administrative
    authority. Expungement requires specific removal actions to occur. This report
    establishes procedures for both information removal and documentation of the actions
    taken during removal. Following the recommendations contained in this Technical
    Report will ensure that the expungements are performed consistently.
