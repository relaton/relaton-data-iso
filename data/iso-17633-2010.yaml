abstract:
- language: en
  script: Latn
  content: ISO 17633:2010 specifies requirements for classification of tubular flux
    and metal cored electrodes and rods, based on the all-weld metal chemical composition,
    the type of electrode core, shielding gas, welding position and the all-weld metal
    mechanical properties, in the as-welded or heat-treated conditions, for gas shielded
    and non-gas shielded metal arc welding of stainless and heat-resisting steels.
    ISO 17633:2010 is a combined standard providing for classification utilizing a
    system based upon nominal composition or utilizing a system based upon alloy type.
    It is recognized that the operating characteristics of tubular cored electrodes
    can be modified by the use of pulsed current, but ISO 17633:2010 does not use
    pulsed current for determining the electrode classification.
