abstract:
- language: en
  script: Latn
  content: This document — specifies communication service parameters presented by
    ITS station (ITS-S) application processes to the ITS-S management in support of
    automatic selection of ITS-S communication profiles in an ITS station unit (ITS-SU),
    — specifies related procedures for the static and dynamic ITS-S communication
    profile selection processes at a high functional level, — provides an illustration
    of objectives used to estimate an optimum ITS-S communication profile.
