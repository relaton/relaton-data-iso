abstract:
- language: en
  script: Latn
  content: ISO 17380:2004 specifies a method for the photometric determination of
    the total cyanide and the easily released cyanide mass fraction in soil using
    an automated-distillation continuous-flow analysis. ISO 17380:2004 applies to
    all types of soil with cyanide mass fractions above 1 mg/kg on the basis of dry
    matter, expressed on the basis of the cyanide ion. Sulfide concentrations in the
    sample higher than 40 mg/kg dry matter cause interference. This effect can be
    recognized by the split peaks and as a slow decrease of the detector signal and
    can only be prevented by diluting the sample extract.
