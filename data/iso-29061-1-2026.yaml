abstract:
- language: en
  script: Latn
  content: This document provides criteria for judgement of usability of child restraint
    systems (CRSs) with ISOFIX attachments and their corresponding anchorage systems
    in vehicles. This document provides criteria for a separate evaluation of the
    CRS ISOFIX attachments, of the ISOFIX anchorage installation in vehicles, and
    an evaluation of the interface issues when installing a CRS in a certain vehicle.
    This document covers both rigid and flexible attachments of the CRS to the vehicle
    ISOFIX anchorages. NOTE 1        CRS includes enhanced child restraint system
    (ECRS) according to UN Regulation No. 129. NOTE 2        Although ISOFIX is defined
    in the original “ISOFIX” standard (ISO 13216-1) to be a rigid system, the term
    “ISOFIX” in this document is extended to include flexible CRS attachments (e.g.
    LATCH in USA, UAS in Canada).
