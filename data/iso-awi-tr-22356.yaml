abstract:
- language: en
  script: Latn
  content: This document provides case studies of good practices in crowd management
    for events, including the demonstration and analysis of how the crowd management
    framework and crowd assessment process established by ISO 22353 are implemented
    and applied at each stage of crowd management for events. The purpose of the document
    is to facilitate the sharing of crowd management experiences and to enhance the
    efficiency of the application and implementation of ISO 22353. The document takes
    into consideration varying contexts, including climate conditions, scales, available
    resources, or economic structures in these practices. This document is intended
    to serve organizers or participants involved in the planning and execution of
    events.
