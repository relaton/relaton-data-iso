abstract:
- language: en
  script: Latn
  content: This document specifies the method of verification and calibration of testing
    machines for carrying out the instrumented indentation test in accordance with
    ISO 14577-1. It specifies a direct verification method for verifying and calibrating
    the main functions of the testing machine and an indirect verification method
    suitable for the determination of the repeatability of the testing machine. The
    methods in ISO 14577 are applicable to all systems that comply with the requirements
    of this part of ISO 14577.
