abstract:
- language: en
  script: Latn
  content: ISO 17599:2003 specifies methods for determining the steady-state performance
    characteristics and dynamic performance characteristics of positive-displacement
    electrically and electronically controlled hydraulic pumps, so as to allow comparison
    of the performance of different components. Pumps covered by ISO 17599:2003 have
    the capacity to affect changes in the output flow or pressure in proportion to
    the electrical or electronic input signals. These pumps can be of the load-sensing
    control type, servo-control type, or electrical variable displacement mechanism
    type, which control output flow and output pressure by feedback using electrical
    signals.
