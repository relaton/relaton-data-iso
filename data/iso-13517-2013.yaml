- language: en
  script: Latn
  content: ISO 13517:2013 specifies a method for determining the flow rate of metallic
    powders, including powders for hardmetals and mixes of metallic powders and organic
    additives such as lubricants, by means of a calibrated funnel (Gustavsson flowmeter).
    The method is applicable only to powders which flow freely through the specified
    test orifice.
