abstract:
- language: en
  script: Latn
  content: ISO 21809-1:2011 specifies requirements of plant-applied external three-layer
    polyethylene- and polypropylene-based coatings for corrosion protection of welded
    and seamless steel pipes for pipeline transportation systems in the petroleum
    and natural gas industries in accordance with ISO 13623. Pipes coated in accordance
    with ISO 21809-1:2011 are considered suitable for further protection by means
    of cathodic protection.
