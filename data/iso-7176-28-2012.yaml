abstract:
- language: en
  script: Latn
  content: ISO 7176-28:2012 is applicable to stair-climbing chairs and stair-climbing
    wheelchair carriers where the stair-climbing device climbs backwards up the stairs,
    with the occupant facing downstairs, and climbs forwards down the stairs with
    the occupant also facing downstairs. ISO 7176-28:2012 is applicable to stair-climbing
    devices which are intended for the transport of adults and those intended for
    the transport of children. It is not applicable to stair-climbing devices which
    are intended to be operated by children as operating occupants or assistants.
    ISO 7176-28:2012 specifies requirements and test methods for electrically powered
    stair-climbing devices. It is not applicable to manually powered stair-climbing
    devices. ISO 7176-28:2012 specifies tests to demonstrate the stair-climbing device's
    ability to perform safely on stairs with a pitch of 35°, or higher if declared
    by the manufacturer. It also includes ergonomic, labelling and disclosure requirements.
