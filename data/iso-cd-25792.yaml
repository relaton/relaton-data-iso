abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the presence
    of HEV from test samples of meat products, or liver and liver products. Following
    liberation of viruses from the test sample, viral RNA is then extracted by lysis
    with guanidine thiocyanate and adsorption on silica. Target sequences within the
    viral RNA are amplified and detected by real-time RT-PCR. The RT-PCR assay can
    detect multiple genotypes, but it is expected that only zoonotic HEV will be present
    in the identified matrices. This method has not been validated for detection of
    HEV in meat.
