abstract:
- language: en
  script: Latn
  content: 'This document establishes the air interface for radio frequency identification
    (RFID) devices operating in the 860 MHz to 930 MHz industrial, scientific and
    medical (ISM) band used in item management applications. This document specifies
    a common technical specification for RFID devices that can be used to develop
    standards for applications using this radio identification (RAIN) air interface.
    This document is intended to improve compatibility and encourage inter-operability
    of products for the growing RFID market in the international marketplace. This
    document establishes the forward and return link parameters for technical attributes
    including, but not limited to, operating frequency, operating channel accuracy,
    occupied channel bandwidth, maximum effective isotropic radiated power (EIRP),
    spurious emissions, modulation, duty cycle, data coding, bit rate, bit rate accuracy,
    bit transmission order, and, where appropriate, operating channels, frequency
    hop rate, hop sequence, spreading sequence, and chip rate. This document further
    specifies the communications protocol used in the air interface. This document
    describes the physical and logical requirements for a passive backscatter, Interrogator-talks-first
    (ITF), radio frequency identification system operating in the 860 MHz to 930 MHz
    frequency range. This document specifies: physical interactions (the signalling
    layer of the communication link) between Interrogators and Tags; logical operating
    procedures and commands between Interrogators and Tags; the collision arbitration
    scheme used to identify a specific tag in a multiple-tag environment; optional
    security commands that allow the use of crypto suites of ISO/IEC 29167-1:2014.'
