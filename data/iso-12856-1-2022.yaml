abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of polymeric composite and
    reinforced polymeric composite materials in the manufacture of polymeric composite
    railway sleepers. It is applicable to sleepers, bearers and transoms to be installed
    in all tracks (both heavy and urban rail) with or without ballast. NOTE      In
    this document, the term “sleeper” refers to “sleeper, bearer and transom”.
