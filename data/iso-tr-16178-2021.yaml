abstract:
- language: en
  script: Latn
  content: This document defines lists of critical chemical substances potentially
    present in footwear and footwear components. This document describes the critical
    chemical substances, their potential risks of nocuousness, in which materials
    they could be found, and which test method(s) can be used to quantify them. The
    test methods listed indicate the state of the art. For some substances, a test
    method is not available. This document is applicable to any kind of footwear and
    footwear components.
