- language: en
  script: Latn
  content: 'This document establishes conformance testing for the requirements described
    in ISO/IEC 24787-1, which are: —     framework for on-card biometric comparison,
    both in sensor-off-card systems and as part of Biometric System-on-Card; —    
    security policies for on-card biometric comparison. Measuring the performance
    of on-card biometric comparison algorithms such as error rates or speed is not
    within the scope of this document.'
