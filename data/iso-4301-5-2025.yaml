abstract:
- language: en
  script: Latn
  content: 'This document establishes a general classification of bridge and gantry
    cranes and their mechanisms based on the service conditions, mainly expressed
    by the following: a)       total number of working cycles to be carried out during
    the specified design life of the crane; b)       the load spectrum factor which
    presents the relative frequencies of loads to be handled; c)        the average
    load displacements.'
