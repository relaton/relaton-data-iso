abstract:
- language: en
  script: Latn
  content: 'This document informs readers of ISO/IEC 38500 "Information technology — Governance of IT for the organization" (3rd edition, 2024) on recommendations for stakeholder engagement from the perspective of the human-centred approach. This bridging document identifies resources providing guidance on human-centred quality of IT and establishes principles for stakeholder engagement that support effective IT governance throughout the IT lifecycle: specification, procurement, and operation. The document is applicable to all types of organizations, regardless of size, type, or nature, that implement or govern IT systems.'
