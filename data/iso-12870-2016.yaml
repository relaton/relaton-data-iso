abstract:
- language: en
  script: Latn
  content: ISO 12870:2016 specifies fundamental requirements for unglazed spectacle
    frames designed for use with all prescription lenses. It is applicable to frames
    at the point of sale by the manufacturer or supplier to the retailer. This International
    Standard is applicable to all spectacle frame types, including rimless mounts,
    semi-rimless mounts and folding spectacle frames. It is also applicable to spectacle
    frames made from natural organic materials. NOTE See Annex A for recommendations
    on the design of spectacle frames. ISO 12870:2016 is not applicable to complete
    custom-made spectacle frames or to products designed specifically to provide personal
    eye protection.
