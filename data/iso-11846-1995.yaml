abstract:
- language: en
  script: Latn
  content: Specifies the methods of intergranular corrosion testing for solution heat-treatable
    aluminium alloys without protective coatings. Applies to cast and wrought heat-treatable
    aluminium alloys in the form of castings, forgings, plates, sheets, extrusions
    and semi-finished or finished parts. Anables comparative assessments of alloys
    of different grades and thickness depending on their chemical composition and
    other factors.
