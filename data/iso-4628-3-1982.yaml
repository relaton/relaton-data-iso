abstract:
- language: en
  script: Latn
  content: This document provides pictorial standards for designating the degree of
    rusting. The standards given are basically indended for rating on coated steel.
    They may used for designating the degree of corrosion of non-ferrous metals if
    the form of breakdown is comparable with that on the standards. Cancels and replaces
    section three of ISO 4628/1-1978.
