abstract:
- language: en
  script: Latn
  content: ISO 4156-2:2005 specifies geometry and inspection dimensions for the design
    and manufacture of straight (non-helical) side-fitting cylindrical involute splines.
    The specified diameters for external splines in the geometry tables and the values
    in the inspection dimension tables are only valid for fundamental deviation h.
    For fundamental deviations other than h, diameters and tooth thicknesses are calculated
    for external splines according to the formulae in ISO 4156-1:2005 and inspection
    dimensions according to the formulae in ISO 4156-3:2005.
