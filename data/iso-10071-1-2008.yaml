abstract:
- language: en
  script: Latn
  content: ISO 10071-1:2008 specifies interchangeability dimensions and tolerances,
    in millimetres, for ball-lock punches for light duty. It is applicable to ball-lock
    punches with shank diameter sizes from 6 mm up to and including 32 mm, in round,
    square, rectangular and oblong shapes, for punching holes in steel sheets or other
    materials, the thickness of which is less than 3 mm. ISO 10071-1:2008 also gives
    examples related to materials and hardness, and specifies the designation of ball-lock
    punches for light duty.
