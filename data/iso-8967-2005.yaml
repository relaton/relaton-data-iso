abstract:
- language: en
  script: Latn
  content: ISO 8967|IDF 134:2005 specifies a method for the determination of the bulk
    density of dried whole milk, dried partly skimmed milk and dried skimmed milk,
    whether non-instant or instant. The method is also applicable to dried whey, dried
    buttermilk and dried milk-based infant food, as well as to any of the dried products
    indicated above in which fat has been replaced by another fat, or which has been
    roller-dried instead of spray-dried.
