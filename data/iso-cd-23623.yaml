abstract:
- language: en
  script: Latn
  content: 'This document is applicable to all types of stakeholders involved in leachate
    treatment and reuse. It can help relevant authorities, training organizations,
    certification bodies and other responsible entities to develop regulations, plans
    and manuals, as well as to provide technical guidance to designers, operators
    and managers of leachate treatment and reuse systems. This document provides:
    —terms and definitions; —components of operation and maintenance system; —process
    operation; —maintenance of equipment; —routine inspection.'
