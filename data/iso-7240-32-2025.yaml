abstract:
- language: en
  script: Latn
  content: This document applies to non-resettable line-type heat detectors consisting
    of a sensing element distributed either continuously or discretely at close intervals
    along its length, which can be connected either directly or through a sensor control
    unit or an interface module to control and indicating equipment, and intended
    for use in fire detection and fire alarm systems installed in and around buildings
    and other civil engineering works. This document specifies requirements and performance
    criteria, and the corresponding test methods and provisions for assessment. This
    document also covers non-resettable line-type heat detectors intended for use
    in the local protection of plant (facility) and equipment. Non-resettable line-type
    heat detectors with special characteristics and developed for specific risks are
    not covered by this document.
