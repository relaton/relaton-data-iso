abstract:
- language: en
  script: Latn
  content: Specifies a procedure for assessing the output of black light lamps used
    in fluorescent magnetic particle and penetrant flaw detection techniques. Applies
    to both new lamps and lamps in service. May also be used for checking that specified
    levels of black light illumination are achieved and maintained. A control test
    for checking the fluorescence of penetrant liqids is specified in Annex A.
