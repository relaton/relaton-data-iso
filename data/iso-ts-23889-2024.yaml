abstract:
- language: en
  script: Latn
  content: This document establishes the performance requirements for heel and top
    pieces components for footwear, irrespective of the material, in order to assess
    the suitability for the end use and/or fitness for purpose. It also establishes
    the test methods used to evaluate the compliance with the requirements. This document
    applies to heel and top piece for all kind of footwear as defined in Clause 4.
    It does not apply to finished footwear. This document can be used as a reference
    by the manufacturer and the supplier.
