abstract:
- language: en
  script: Latn
  content: This document provides a method for determining the coefficient of friction
    between footwear and floorings under conditions simulating those experienced in
    the phases of a typical walking step when slip is most likely to occur. The method
    is applicable to all types of footwear and footwear components, outsole units,
    heel top pieces (top lifts) and sheet soling materials, excepting PPE footwear
    (Personal Protective Equipment) and special purpose footwear containing spikes,
    metal studs or similar.
