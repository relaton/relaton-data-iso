abstract:
- language: en
  script: Latn
  content: ISO/TR 14468:2010 assesses a measurement process where the characteristic(s)
    being measured is (are) in the form of attribute data (including nominal and ordinal
    data). ISO/TR 14468:2010 provides examples of attribute agreement analysis (AAA)
    and derives various results to assess closeness of agreement amongst appraisers,
    such as agreement within appraisers, agreement between appraisers, agreement of
    each appraiser vs. a standard, and agreement of all appraisers vs. a standard.
