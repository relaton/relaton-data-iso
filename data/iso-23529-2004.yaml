abstract:
- language: en
  script: Latn
  content: ISO 23529:2004 specifies conditions and procedures for the preparation,
    measurement, marking, storage and conditioning of rubber test pieces for use in
    physical tests specified in other International Standards, and the preferred conditions
    to be used during the tests. Special conditions applicable to a particular test
    or material or simulating a particular climatic environment are not included,
    nor are special requirements for testing whole products. This International Standard
    also specifies the requirements for the time-interval to be observed between forming
    and testing of rubber test pieces and products. Such requirements are necessary
    to obtain reproducible test results and to minimize disagreements between customer
    and supplier.
