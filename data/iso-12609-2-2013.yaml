abstract:
- language: en
  script: Latn
  content: ISO 12609-2:2013 gives guidance and information to users, manufacturers,
    suppliers, and safety advisors on the selection and use of eye protectors for
    intense light source (ILS) equipment used on humans and animals for cosmetic and
    medical applications against excessive exposure to optical radiation in the spectral
    range 250 nm to 3 000 nm, with the exception of laser radiation. ISO 12609-2:2013
    provides guidance on selection of an eye protector expected to cope with the majority
    of applications and a more rigorous procedure for determining appropriate eye
    protection against spectral outputs from ILS equipment.
