abstract:
- language: en
  script: Latn
  content: ISO 10524-2:2018 specifies design, construction, type testing, and marking
    requirements for manifold pressure regulators (as defined in 3.7) and line pressure
    regulators (as defined in 3.5) intended for use in medical gas pipeline systems.
    Examples of gases include oxygen, medical air and oxygen/nitrous oxide mixtures.
    ISO 10524-2:2018 applies to manifold pressure regulators and line pressure regulators
    supplied as individual units or to the relevant components incorporated within
    an assembly. Manifold pressure regulators are intended to be connected to a manifold
    system which has a nominal inlet pressure, P1 of up to 30 000 kPa (300 bar). Line
    pressure regulators are intended to be connected downstream of the manifold pressure
    regulator with a supply pressure up to 3 000 kPa (30 bar). ISO 10524-2:2018 does
    not apply to pressure regulators for use with vacuum pipeline systems. NOTE Requirements
    for pressure regulators for use with vacuum pipeline systems are covered in ISO
    10079‑3.
