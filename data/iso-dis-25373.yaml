abstract:
- language: en
  script: Latn
  content: This International Standard is designed to provide guidance for improvement
    of the heavy oil recovery by thermal method.This standard provides content and
    requirements for the design of Multi-component thermal fluid huff and puff production
    in heavy oil fields with complicate reservoir conditions including thin layers,
    thick layers, edge and bottom water as well as medium/deep layers. The standard
    is applicable to the full development cycle. It is proposed to standardize the
    design of Multi-component thermal fluid huff and puff process scheme to ensure
    the reliability and effectiveness of implementation, and ultimately improve the
    oil production and recovery rate.
