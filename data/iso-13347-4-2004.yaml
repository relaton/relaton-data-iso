abstract:
- language: en
  script: Latn
  content: ISO 13347-4:2004 applies to industrial fans as defined in ISO 5801 and
    ISO 13349. It is limited to the determination of airborne sound emission for the
    specified set-ups. Vibration is not measured, nor is the sensitivity of airborne
    sound emission to vibration effects determined. The sizes of the fan, which can
    be tested in accordance with ISO 13347-4:2004, are limited only by the practical
    aspects of the test installations. ISO 13347-4:2004 determines sound power by
    using sound intensity measurements on a measurement surface which encloses the
    sound source. It provides guidelines on the acoustical environment, ambient noise,
    measurement surface, and number of measurements. The test set-ups are generally
    designed to represent the physical orientation of a fan installed in accordance
    with ISO 5801 and also used in ISO 13347-2.
