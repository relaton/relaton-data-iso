abstract:
- language: en
  script: Latn
  content: This part of ISO 12240 specifies dimensions and tolerances for angular
    contact radial spherical plain bearings. The specified tolerance values apply
    to finished, angular contact radial spherical plain bearings before any coating
    or plating. Angular contact radial spherical plain bearings need not conform to
    the design illustrated but compliance is required as regards dimensions and tolerances
    specified. NOTE — Angular contact radial spherical plain bearings for airframe
    applications are not covered by this part of ISO 12240.
