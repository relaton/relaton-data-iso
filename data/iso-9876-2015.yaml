abstract:
- language: en
  script: Latn
  content: ISO 9876:2015 specifies the construction, performance, type testing, and
    inspection for a ship borne marine facsimile receiver that receives meteorological
    charts transmitted by "Facsimile transmission of meteorological chart over radio
    circuits" stated in accordance with World Meteorological Organization (WMO) publication
    No. 386, Part 111-5. ISO 9876:2015 applies to ship borne radio facsimile receivers
    for the reception of meteorological charts and other graphical representation
    of meteorological conditions intended as an aid to navigation at sea.
