abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides guidance for the construction
    of monitoring stations of karst critical zones, the monitoring of processes (specific
    processes), the monitoring data collection and processing, and sharing and service
    of monitoring information. This document applies to karst critical zones of different
    types—differing in lithology, altitude, and climatic zones, and proper monitoring
    adjustment is allowed for different types.
