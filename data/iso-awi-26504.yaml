abstract:
- language: en
  script: Latn
  content: This document specifies the test principles, testing equipment, specimen
    requirements, testing conditions and parameters, testing procedures, data processing,
    and report requirements for the coefficient of friction (COF) of biomimetic functional
    surfaces. This document is applicable to the measurement of the COF of biomimetic
    functional surfaces fabricated with metals and alloys, inorganic non-metallic
    materials, or polymers, with structural feature dimensions unit sizes ranging
    from 50 nm to 5 mm and a substrate elastic modulus of no less than 0.1 GPa.
