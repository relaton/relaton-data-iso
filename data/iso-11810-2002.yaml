abstract:
- language: en
  script: Latn
  content: ISO 11810:2002 specifies a standardized method for testing and classifying
    surgical drapes and other patient-protective covers with respect to laser-induced
    hazards. It applies to disposable and reusable, as well as woven and non-woven
    materials used as surgical drapes and other patient-protective covers which claim
    to be laser-resistant. An appropriate classification system is given. It is not
    the purpose of this International Standard to serve as a general fire safety specification
    and, as such, it does not cover other sources of ignition nor does it cover the
    issue of laser-induced secondary ignition. All materials reflect portions of the
    beam and it is necessary for the user to decide whether specular reflectance may
    be a hazard. This measurement, however, is not covered in this International Standard.
