abstract:
- language: en
  script: Latn
  content: 'ISO 18920:2011 specifies dark storage conditions, storage facilities and
    procedures for the handling and inspection of reflection prints of all types and
    sizes. ISO 18920:2011 is applicable to: · prints on opaque supports, · processed
    black-and-white silver gelatine prints, · processed multicolour and monochrome
    colour photographic prints, · black-and-white and colour prints. ISO 18920:2011
    is applicable to medium-term and extended-term storage conditions.'
