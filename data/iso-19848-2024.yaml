abstract:
- language: en
  script: Latn
  content: 'This document provides requirements and guidance on the capture and processing
    of data from sensors monitoring: ¾    the structure of the ship; ¾    shipboard
    machinery and equipment on board the ship; ¾    ship operational information.
    It is intended for implementers of software used to capture and process such data.
    This document describes how to name the sensor and required data item, as well
    as how to describe the data for shipboard machinery and equipment.'
