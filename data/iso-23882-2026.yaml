abstract:
- language: en
  script: Latn
  content: 'This document provides guidance for communicating the risks related to the beneficial use of biosolids produced from industrial and municipal sludge and municipal biosolids derived products (e.g. composts, growing medium) and for managing public perception related to their use. This document: defines key concepts related to risk and risk communication; provides context for risk in relation to the beneficial use of biosolids; describes public perceptions and responses to the beneficial use of biosolids at a global scale; outlines risk communication principles, methods, and tools; includes case studies and examples of communication strategies. This document can also be used to support the development of biosolids management plans, particularly in relation to community consultation, engagement, and communication activities. In addition, it can be applied, where appropriate, to risk communication associated with other beneficial uses of biosolids or similar materials. This document does not apply to communication regarding hazardous sludge originating from wastewater that, due to its physical, chemical, or infectious properties, can pose significant risks to human health or the environment during use, handling, storage, or transportation, and requires specialized disposal methods. The definition of “beneficial use of biosolids” is outside the scope of this document.'
