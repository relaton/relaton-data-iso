abstract:
- language: en
  script: Latn
  content: ISO/TR 10064-6:2009 provides information on measuring methods and practices
    of unassembled bevel and hypoid gears and gear pairs. It includes methods and
    practices, which permit the manufacturer and purchaser to conduct measuring procedures
    which are accurate and repeatable to a degree compatible with the specified tolerance
    grade of ISO 17485. Tolerances are given in Clause 5 of ISO 17485:2006, for calculating
    the maximum values allowed by the specific tolerance grade. Required and optional
    measuring methods are provided in Clause 6 of ISO 17485:2006. ISO/TR 10064-6:2009
    applies to bevel gear components as defined in ISO 17485. It does not apply to
    enclosed gear unit assemblies, including speed reducers or increasers, gear motors,
    shaft mounted reducers, high speed units, or other enclosed gear units which are
    manufactured for a given power, speed, ratio or application.
