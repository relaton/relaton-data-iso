abstract:
- language: en
  script: Latn
  content: 'This document specifies the general properties of hot dip galvanized coatings
    and test methods for hot dip galvanized coatings applied by dipping fabricated
    iron and steel articles (including certain castings) in a zinc melt (containing
    not more than 2 % of other metals). This document does not apply to the following:
    a) sheet, wire and woven or welded mesh products that are continuously hot dip
    galvanized; b) tube and pipe that are hot dip galvanized in automatic plants;
    c) hot dip galvanized products (e.g. fasteners) for which specific standards exist
    and which can include additional requirements or requirements which are different
    from those of this document. NOTE      Individual product standards can incorporate
    this document for the galvanized coating by quoting its number, or can incorporate
    it with modifications specific to the product. Different requirements can also
    be made for galvanized coatings on products intended to meet specific regulatory
    requirements. This document does not apply to after-treatment or additional coating
    of hot dip galvanized articles.'
