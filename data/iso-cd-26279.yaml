abstract:
- language: en
  script: Latn
  content: This document specifies test methods and requirements for the strength
    and durability of all types of slide fittings for all types of sliding doors and
    roll fronts sliding horizontally and vertically and their components for all fields
    of application. The tests consist of the application of loads, forces and velocities
    simulating normal functional use, as well as misuse, that might reasonably be
    expected to occur. The tests consist of the application of loads, forces and velocities
    simulating normal functional use, as well as misuse, that might reasonably be
    expected to occur. With the exception of the corrosion test in Clause 8, the tests
    are designed to evaluate properties without regard to materials, design/construction
    or manufacturing processes. The strength and durability tests only relate to the
    fittings and the parts used for the attachment. The strength and durability tests
    are carried out in a test frame with specified properties. The test results can
    only be used as a guide to the performance of a piece of furniture. The test results
    are only valid for the fittings tested. These results may be used to represent
    the performance of production models provided that the tested model is representative
    of the production model. With the exception of the corrosion test in Clause 8,
    ageing and influences of heat and humidity are not included.
