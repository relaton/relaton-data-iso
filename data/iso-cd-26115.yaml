abstract:
- language: en
  script: Latn
  content: This standard is for determination of tensile strength distribution of
    the recycled carbon fibre bundles from carbon fibre bundles tensile tests. It
    applies to continuous recycled carbon fibre bundles, from which specimens with
    a gauge length of 50 mm can be produced. Depending recycled process, the recycled
    carbon fibre can have rough surface and have friction force between fibres in
    the fibre bundle. Fibre bundles made from recycled carbon fibre may contain internal
    fibre breakage, so the modulus of elasticity of the fibres should be known. The
    tensile modulus should be obtained from single fibre tensile tests or tensile
    tests of resin impregnated composite materials.
