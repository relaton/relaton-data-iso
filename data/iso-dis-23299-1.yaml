abstract:
- language: en
  script: Latn
  content: This document contains performance requirements and recommendations for
    electrical lighting systems in the interiors of mainline passenger vehicles, under
    all operating and emergency conditions. This document includes controls for lighting
    installed for effect purposes, theme lighting (also referred to as mood or ambient
    lighting), and decorative lighting. This document also defines the requirements
    for testing and conformity assessment. This document includes options for verification
    via modelling (also referred to as simulation).This document applies only to new
    units.This document does not apply retrospectively to existing vehicles for reasons
    of refurbishment or renewal unless stated otherwise in the Technical Specification.
    This document does not address lighting installed in instruments or controls.This
    document does not address requirements for the lighting of boarding aids, for
    example, moveable steps, bridging plates, or lifts.This document does not address
    indicator lights (for example access door indicators, which are addressed in other
    Standards).This document does not address requirements for display screens.
