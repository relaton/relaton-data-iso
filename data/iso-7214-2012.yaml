abstract:
- language: en
  script: Latn
  content: ISO 7214:2012 specifies methods for testing flexible and semi-rigid cellular
    plastics made from polyethylene. Cellular plastics containing copolymers of ethylene
    or blends of polymers with polyethylene may also be tested by the procedures of
    this International Standard provided these materials have characteristics similar
    to polyethylene as described in ISO 1872-1, or copolymers of ethylene as described
    in ISO 4613-1. Mandatory tests suitable for characterization of cellular polyethylene,
    regardless of end use, and optional tests for the determination of properties
    that are relevant to certain uses are described.
