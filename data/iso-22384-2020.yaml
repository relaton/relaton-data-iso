abstract:
- language: en
  script: Latn
  content: This document gives guidelines for assessing product security-related threats,
    risks and countermeasures by developing a suitable protection plan, supporting
    its implementation and monitoring its effectiveness after implementation. This
    includes consideration of impacts and modifications to, for example, product life
    cycle, supply chain, manufacturing, data management, brand perception and costs
    so as to adapt the protection plan accordingly. This document is applicable to
    all types and sizes of organizations that want to ensure authenticity and integrity
    in order to support the trustworthiness of products, including documents, data
    and services related to products. This document supports organizations setting
    up a process to assess risks and to select and combine individual measures for
    developing a product protection plan.
