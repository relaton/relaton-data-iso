abstract:
- language: en
  script: Latn
  content: ISO 16128-2:2017 describes approaches to calculate natural, natural origin,
    organic and organic origin indexes that apply to the ingredient categories defined
    in ISO 16128‑1. This document also offers a framework to determine the natural,
    natural origin, organic and organic origin content of products based on the ingredient
    characterization. Neither ISO 16128‑1 nor this document addresses product communication
    (e.g. claims and labelling), human safety, environmental safety, socio-economic
    considerations (e.g. fair trade), characteristics of packaging materials or regulatory
    requirements applicable for cosmetics. ISO 16128-2:2017 builds on and enhances
    ISO 16128‑1. It is intended to be used in conjunction with ISO 16128‑1.
