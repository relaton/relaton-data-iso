abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 25051:2014 establishes: quality requirements for Ready to Use
    Software Product (RUSP); requirements for test documentation for the testing of
    RUSP, including test plan, test description, and test results; instructions for
    conformity evaluation of RUSP. It includes also recommendations for safety or
    business critical RUSP. ISO/IEC 25051:2014 deals only with providing the user
    with confidence that the RUSP will perform as offered and delivered. It does not
    deal with the production realization (including activities and intermediate products,
    e.g. specifications). The quality system of a supplier is outside the scope of
    ISO/IEC 25051:2014.'
