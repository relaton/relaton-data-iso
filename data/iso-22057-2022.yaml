abstract:
- language: en
  script: Latn
  content: This document provides the principles and requirements to enable environmental
    and technical data provided in EPDs for construction products and services, construction
    elements and integrated technical systems to be used in BIM to assist in the assessment
    of the environmental performance of a construction works over its life cycle.
    This document gives requirements on structuring EPD information using a data template
    according to ISO 23386 and ISO 23387, to make EPD data machine-interpretable and
    to enable their integration into information-driven design, construction, use
    and end-of-life stages. This document is applicable to structuring generic LCA
    data for use within a BIM environment, as these data are required in the absence
    of suitable EPD data to enable assessment of the environmental performance at
    the construction works level. The assessment of environmental performance at the
    construction works level is not covered by this document.
