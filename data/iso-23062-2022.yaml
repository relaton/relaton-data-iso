abstract:
- language: en
  script: Latn
  content: 'This document deals with foreseeable significant hazards, hazardous situations
    and events relevant to molding and coremaking machinery and associated equipment
    when used as intended and under conditions of misuse which are reasonably foreseeable
    by the manufacturer (see Clause 5). It provides the requirements to be met by
    the manufacturer to ensure the safety of persons and property during the life-cycle
    phases in accordance with ISO 12100:2010, 5.4, as well as in the event of foreseeable
    failures or malfunctions that can occur in the equipment. This document applies
    to the following equipment: a) machinery constructed to condition and/or reclaim
    foundry sands for mold and coremaking (including related moldable granular materials);
    b) molding machinery; c) coremaking machinery; d) knock-out equipment; e) other
    directly associated equipment. This document does not apply to: —    ladles and
    pouring equipment; NOTE          This equipment is covered within the European
    Union (EU) by EN 1247:2010. —    wax and lost foam pattern production and wax
    removal equipment; —    additive manufacturing equipment; —    dust and/or gaseous
    emissions reduction equipment; —    crane installations; —    winches; —    continuous
    conveyors or handling systems which can be an integral part of the equipment covered
    by this document; —    sand and casting separation systems. This document does
    not explicitly deal with electrical hazards. These hazards are covered by IEC 60204-1:
    2016'
