abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements, test methods, and material performance
    characteristics for car roof tents. It is not applicable to: a) The interface
    between tents and different vehicle models and roof types. b) The consideration
    of wind resistance and aerodynamic effects on tents when vehicles are in motion,
    which ensures safety during transport. c) Compatibility with roof racks for installation.'
