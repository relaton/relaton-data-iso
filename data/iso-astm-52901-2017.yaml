abstract:
- language: en
  script: Latn
  content: ISO/ASTM 52901:2017 defines and specifies requirements for purchased parts
    made by additive manufacturing. ISO/ASTM 52901:2017 gives guidelines for the elements
    to be exchanged between the customer and the part provider at the time of the
    order, including the customer order information, part definition data, feedstock
    requirements, final part characteristics and properties, inspection requirements
    and part acceptance methods. ISO/ASTM 52901:2017 is applicable for use as a basis
    to obtain parts made by additive manufacturing that meet minimum acceptance requirements.
    More stringent part requirements can be specified through the addition of one
    or more supplementary requirements at the time of the order.
