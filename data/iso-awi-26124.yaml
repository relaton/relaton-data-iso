abstract:
- language: en
  script: Latn
  content: This document specifies the conditions for determining the mechanical performances
    of bonded end-plugs in advanced ceramic matrix composite (CMC) tubes. It applies
    to all types of ceramic matrix composites, regardless of the nature of the matrix
    or the reinforcement architecture — including composites reinforced with continuous
    or discontinuous fibers. It is specific to the tubular geometry closures, and
    describes a test method applicable at both room and at elevated temperatures,
    in various environments such as air, vacuum or inert gas atmospheres. This test
    method provides information on the push-out force, the nominal joint strength,
    and the nominal burst pressure. It applied to various end-plug geometries and
    bonding types, including adhesives made from organic materials, metals, glass,
    or ceramic compounds. The information supports the development of new bonding
    materials, quality assurance during manufacturing, comparison of joint materials,
    material characterization, reliability assessment, and the generation of design
    data for closed tubular components. The document also addresses, though is not
    restricted to, a variety of recommended cconfigurations and dimensions for end-plug
    test specimen.
