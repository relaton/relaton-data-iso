abstract:
- language: en
  script: Latn
  content: ISO 20618:2015 is one of a family of documents specifying the Spacecraft
    Onboard Interface Services (SOIS)-compliant service to be provided in support
    of applications. The purpose of this document is to define services and service
    interfaces provided by the SOIS Device Enumeration Service (DES). Its scope is
    to specify the service only and not to specify methods of providing the service,
    although use of the SOIS subnetwork services is assumed. ISO 20618:2015 conforms
    to the principles set out in the SOIS Green Book (reference [D3]) and is intended
    to be applied together with it.
