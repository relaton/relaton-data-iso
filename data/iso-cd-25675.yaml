abstract:
- language: en
  script: Latn
  content: This standard specifies the test method to determine the dispersion stability
    of colloidal ceramic slurry, initially focusing on electrochromic/ion storage
    material, that small size of powders are dispersed into a liquid continuous phase
    by reducing their agglomeration, sedimentation or flocs. Homogeneous dispersibility
    and dispersion stability are core characteristics that ensures cost effective,
    uniform and consistent quality coating products. This test method utilizes light
    scattering effect to observe the changes in the dispersion state of colloidal
    nanoparticles such as transmittance and back scattering over a certain period
    of time.
