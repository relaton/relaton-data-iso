abstract:
- language: en
  script: Latn
  content: This document specifies the minimum information to be included in the product specifications of surface 3D scanners, that is, scanners that acquire the surface geometry and surface attributes of static objects, in order to ensure consistency and to enable users to make meaningful comparisons of scanner features and performance characteristics. It further specifies the scanner parameter settings and environmental conditions to be recorded together with the scan result, in order to facilitate the interpretation, reproduction, and subsequent processing of the 3D scanned data. This document is Part 1 of a series. Volumetric 3D scanning is covered by Part 2 and time-varying (4D) 3D scanning by Part 3. Outside the scope of this document are 3D digitizing devices that use a contact probe to acquire positional data, and safety-related requirements for 3D scanners and their processes, which are addressed by other standards.
