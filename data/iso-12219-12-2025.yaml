abstract:
- language: en
  script: Latn
  content: 'This document specifies test methods which are intended to determine the
    fogging characteristics of polyvinyl chloride (PVC) or polyurethane textiles that
    are used as trim materials in the interior of motor vehicles. The methods can
    also be applied to fluid, paste, powdered or solid raw materials which are the
    basis for such trim materials or from which the materials are manufactured. The
    methods can also be applied to other materials and finished products. The procedures
    are applicable to the measurement of fog condensate on glass surfaces within the
    limits of the test conditions. These tests do not or cannot measure accurately
    those cases in which: —     the surface tension of the condensate is low, resulting
    in early coalescing into a thin transparent film; —     the condensate is present
    in such a large quantity that the droplets coalesce and form a heavy oily/clear
    film (this heavy film gives false readings). NOTE            In such cases, the
    gravimetric method is used.'
