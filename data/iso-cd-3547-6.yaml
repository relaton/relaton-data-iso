abstract:
- language: en
  script: Latn
  content: The document specifies, following ISO 12301, the checking of the inside
    diameter of wrapped bushes (see ISO 3547‑2:2017, method C) and describes the necessary
    checking methods and measuring equipment. NOTE 1 All dimensions in this document
    are given in millimetres except where otherwise noted/designated. NOTE 2 The dimensions
    and tolerances of wrapped bushes are given in ISO 3547‑1. NOTE 3 Checking of the
    wall thickness is the subject of ISO 3547‑7. NOTE 4 Checking of the outside diameter
    of wrapped bushes is the subject of ISO 3547‑5.
