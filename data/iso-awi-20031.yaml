abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for personal contamination monitoring
    and dose assessment following wounds involving radioactive materials. It includes
    requirements for the direct monitoring at the wound site, monitoring of uptake
    of radionuclides into the body and assessment of local and systemic doses following
    the wound event. It does not address: — details of monitoring and assessment methods
    for specific radionuclides; — monitoring and dose assessment for materials in
    contact with intact skin or pre-existing wounds, including hot particles; — therapeutic
    protocols. However, the responsible entity needs to address the requirements for
    decontamination and decorporation treatments if appropriate.'
