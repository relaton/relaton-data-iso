abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1728:2006 specifies the application module for Physical unit
    design view. The following are within the scope of ISO/TS 10303-1728:2006: describtion
    of a specifically designed item in sufficient detail to permit production of that
    item in a manufacturing process; describtion of a specifically designed item in
    sufficient detail to permit analysis of that item''s response to a simulated environment
    in a computer based experimental environment; identification of an occurrence
    of a part in an assembly; identification of an occurrence of a part in an assembly,
    that is also an occurrence of a function; identification of an association between
    part occurrences in part usage and design view; items within the scope of application
    module Physical layout template, ISO/TS 10303-1722; items within the scope of
    application module Physical unit usage view, ISO/TS 10303-1732.'
