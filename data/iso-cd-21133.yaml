abstract:
- language: en
  script: Latn
  content: This document specifies a glow discharge optical emission spectrometric
    method for the determination of the mass per unit area of tin based metallic coatings.
    This method is applicable to tin based metallic coating, 1,0 g/m2 to 15 g/m2 of
    coating areic mass, on iron based substrates. Other elements that could be determined
    according to this document are Cr, P and S.
