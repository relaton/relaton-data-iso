abstract:
- language: en
  script: Latn
  content: This document defines test methods for performance testing of individual
    filter elements and of the complete filtration system.1) This procedure is intended
    for filter elements and filter systems which operate at flow rated up to 8 000 m3/h
    per filter element. 1)  The filters will be loaded with ultra-fine salt particles
    of a size mostly sub micron during variable humidity to simulate real offshore
    and coastal conditions hence filters with an initial conditioned efficiency lower
    than 50 % for the ePM1 particles (filter class T7) are likely to underperform
    and would not be suited as a single stage filter.
