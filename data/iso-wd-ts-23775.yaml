abstract:
- language: en
  script: Latn
  content: This document identifies and clarifies daylight louver systems properties
    for digital building design and maintenance. This document provides all the needed
    properties to design and to describe daylight louver systems. These properties
    are intended to be used as mapping properties for property providers and requesters.
    The mapping of the identifiers enables the exchange of daylight louver systems
    data within different databases. The unambiguous mapping and description of properties
    improves the data quality, reduces misinterpretations and the processing time
    in digital environments. Therefore, the properties listed in this document establishes
    the essential description of daylight louver systems in BIM systems and databases.
    The listed properties in this document are used to structure the product data
    sheet which is complemented with real product information.
