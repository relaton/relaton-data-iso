abstract:
- language: en
  script: Latn
  content: 1.1  This document establishes performance testing and rating criteria
    for factory-made residential, commercial and industrial, electrically-driven,
    mechanical- compression type, water-to-air and brine-to-air heat pumps. The requirements
    for testing and rating contained in this document are based on the use of matched
    assemblies. 1.2  Equipment designed for rating at one liquid temperature range
    under this document may not be suitable at all liquid temperature ranges covered
    in this document. 1.3  This document does not apply to the testing and rating
    of individual assemblies for separate use, nor to the testing and rating of heat
    pumps covered in ISO 5151, ISO 13253 or ISO 13256‑2.
