abstract:
- language: en
  script: Latn
  content: This document specifies the general requirements for the measurement and
    evaluation of human exposure to hand-transmitted shock vibrations. For the purposes
    of this document, hand-transmitted shock vibration is any impactive or impulsive
    vibration that the machine or tool produces as a sequence of single events (isolated
    shock vibrations) linked by periods of no, or lower vibration. This document specifies
    parameters for the evaluation of machinery emissions of hand-transmitted shocks
    in the frequency range covered by ISO 5349-1 (nominally the frequency range covered
    by the octave bands from 8 Hz to 1 000 Hz). NOTE            It is recognised that
    shock vibration often includes substantial high-frequency vibration energy. Therefore,
    reporting of information on hand-transmitted shock at higher frequencies that
    those specified in this document can be valuable.
