abstract:
- language: en
  script: Latn
  content: 'This document is applicable to biodegradable plastic materials used to
    produce mulch films or biodegradable mulch films ready to be used for mulch applications
    in agriculture and horticulture. This document specifies test methods and evaluation
    criteria by addressing the following characteristics: a) control of constituents;
    b) biodegradation; c) negative effects on terrestrial organisms. NOTE      This
    document is construed in a way that it can be used to assess other soil biodegradable
    plastic products that do not qualify as mulch films. For example: drip tape, twine,
    clips, and plant pots.'
