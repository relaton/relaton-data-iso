abstract:
- language: en
  script: Latn
  content: ISO 13009:2015 establishes general requirements and recommendations for
    beach operators that offer tourist and visitor services. It provides guidance
    for both beach operators and users regarding the delivery of sustainable management
    and planning, beach ownership, sustainable infrastructure and service provision
    needs, including beach safety, information and communication, cleaning and waste
    removal. ISO 13009:2015 is applicable to beaches during the bathing season.
