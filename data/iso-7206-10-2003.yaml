abstract:
- language: en
  script: Latn
  content: ISO 7206-10:2003 applies to femoral heads of partial or total hip-joint
    replacements of modular construction (i.e. a head/neck conical taper connection)
    and describes methods of determining the load required, under specified laboratory
    conditions, to cause failure of the head (disassembly or fracture). It applies
    to components made of metallic and non-metallic materials. ISO 7206-10:2003 does
    not cover methods of examining and reporting the test specimens.
