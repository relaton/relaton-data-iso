abstract:
- language: en
  script: Latn
  content: ISO 15927-5:2004 specifies the definition, method of calculation and method
    of presentation of the climatic data to be used in determining the design heat
    load for space heating in buildings. These include the winter external design
    air temperatures and the relevant wind speed and direction, where appropriate.
    Heat loss through the ground, which also contributes to the heat load for buildings,
    depends on longer-term temperature changes; methods for calculating ground heat
    loss are given in ISO 13370.
