abstract:
- language: en
  script: Latn
  content: This document specifies the basic dimensions, in millimetres, of headed
    angle pins (type A), straight angle pins (type B), angle pins mounted with external
    thread (type C) and angle pins mounted with hexagon socket head cap screw (type
    D), intended for use in diecasting dies and tools for moulding. It also specifies
    the material hardness and designation of the angle pins (types A, B, C and D).
