abstract:
- language: en
  script: Latn
  content: ISO 17828:2015 defines a method of determining bulk density of solid biofuels
    by the use of a standard measuring container. This method is applicable to all
    pourable solid biofuels with a nominal top size of maximum 100 mm. Bulk density
    is not an absolute value; therefore, conditions for its determination have to
    be standardized in order to gain comparative measuring results. NOTE Bulk density
    of solid biofuels is subject to variation due to several factors such as vibration,
    shock, pressure, biodegradation, drying, and wetting. Measured bulk density can
    therefore deviate from actual conditions during transportation, storage, or transhipment.
