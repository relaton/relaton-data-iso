abstract:
- language: en
  script: Latn
  content: This document specifies a test method for measuring the force required
    to pull a single heel pin out of a heel. This test method is used both to measure
    the heel pin holding strength of heel materials by using a standard heel pin and
    a method of insertion, and to assess the heel nailing of commercial production.
    This test method is applicable to testing plastics and wooden heels for women’s
    footwear. Heels composed of layers of fibreboard or leather and low plastics heels
    for men’s footwear cannot be tested by this method.
