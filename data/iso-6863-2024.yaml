abstract:
- language: en
  script: Latn
  content: This document specifies a method which applies to the preparation and validation
    of the standard materials generally called “large size spikes” with an uncertainty
    suitable for international nuclear safeguards used for measuring the content of
    plutonium and/or uranium by isotope dilution mass spectrometry. This measurement
    methodology can be applied to input solutions of irradiated Magnox and light water
    reactor fuels (boiling water reactor or pressurized water reactor); in final products
    at spent-fuel reprocessing plants; in feed and products of mixed oxide of plutonium
    and uranium (MOX); and in uranium fuel fabrication.
