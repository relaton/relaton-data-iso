abstract:
- language: en
  script: Latn
  content: 'This document specifies technical requirements for testing procedures
    for evaluation of energy supplied during use phase for the design of machine tools
    to process wood and materials with similar physical characteristics to wood. This
    document, along with ISO 14955‑1 and ISO 14955‑2, covers all significant energy
    requirements relevant to woodworking machine tools, when they are used as intended
    and under the conditions foreseen by the manufacturer/supplier. This document
    defines relevant operating states, optional shift regimes and optional machine
    tool activities for several types of woodworking machine tools. This document
    also applies to peripheral devices which are supplied as an integral part of the
    machine. This document also applies to machine tools which are part of an integrated
    manufacturing system where the energy required is comparable to those of machine
    tools working separately. This document applies to the following woodworking machine
    tools: — NC boring and routing machines; — horizontal beam panel sawing machines;
    — vertical panel sawing machines; — edge banding machines fed by chains; — wide
    belt calibrating and sanding machines; — four-sided moulding machines; — tenoning
    and/or profiling machines; — foiling/laminating machines; — dimension saws and
    circular saw benches; — single spindle vertical moulding machines (toupie); —
    surface planing, thickness planing, combined surface/thickness planing machines;
    — band sawing machines; — combined machines; — multi-blade rip-sawing machines;
    — presses and bending presses; — mounting presses. A list of energy efficiency
    improvements for woodworking machine tools is given in Annex A.'
