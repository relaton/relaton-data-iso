abstract:
- language: en
  script: Latn
  content: This international standard specifies test & measurement methods to evaluate
    the behaviour of a vehicle equipped with Level-2-Hands-Free-System (L2HF-System)
    whose purpose is to keep the vehicle in the middle of one lane at different driving
    situations while drivers drive hands-free. Hands-Free lane changes are not prohibited.
    For this purpose relevant vehicle dynamic variables that are useful to assess
    the behaviour of a vehicle and the assumed performance with L2HF-System in relation
    to ISO PAS 11585 and their test & measurement methods are defined.
