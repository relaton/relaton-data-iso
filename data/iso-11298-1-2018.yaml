abstract:
- language: en
  script: Latn
  content: ISO 11298-1:2018 specifies the requirements and test methods for plastics
    piping systems intended to be used for the renovation of underground water supply
    networks. It is applicable to pipes and fittings, as manufactured, as well as
    to the installed lining system. It is not applicable to the existing pipeline
    or any non-structural sprayed coatings or annular filler. ISO 11298-1:2018 gives
    the general requirements common to all relevant renovation techniques.
