abstract:
- language: en
  script: Latn
  content: This International Standard is intended to guide the implementation of
    urban reclaimed water for the production of ultra-pure water used in electronics
    and semiconductor industries by providing the recommendations for the water quality
    and quantity, guiding the progress of planning, operating, and management. This
    International Standard is applicable to practitioners and regulatory authorities
    who propose to implement principles and guidelines on the implementation of reclaimed
    water for the production of ultra-pure water, which aims to achieve a safe, stable,
    and efficient utilities of reclaimed water.
