abstract:
- language: en
  script: Latn
  content: Standardization in the field of Material Manufacturing through Weld Metal
    Buildup by Wire Arc Directed Energy Deposition and Ti-6A-4V Grade 5 (UNS R56400)
    and Grade 23 ELI (UNS R56401) Wires. The standard covers direct energy arc weld
    metal buildup of Ti-6A-4V Grade 5 (UNS R56400) and Grade 23 ELI (UNS R56401) to
    print build platforms and components by means of wire arc based full melt directed
    energy. The components produced by this process are used typically in applications
    that require mechanical properties of wrought products which are made of conventional
    processes such as casting, forging, rolling, extrusion, etc. Components manufactured
    to this standard require post built heat treatment to achieve required mechanical
    property and also require processing via machining, grinding, electrical discharge
    machining (EDM), polishing, and so forth to achieve desired surface finish and
    critical dimensions. The Wire Arc Directed Energy Deposition (WA DED) standard
    is intended for use of purchasers or producers, or both, on Ti-6A-4V Grade 5 (UNS
    R56400) and Grade 23 ELI (UNS R56401) direct deposition metal buildup components
    for defining the requirements and ensuring component properties. Users are advised
    to use this standard as a basis for obtaining components that will meet the minimum
    acceptance requirements established and revised by consensus of the members of
    the committee. User requirements considered more stringent may be met by the addition
    to the purchase order of one or more supplementary requirements, which may include,
    but are not limited to, those listed in Supplementary Requirements. The values
    stated in SI units are to be regarded as the standard. Other units are included
    only for informational purposes.
