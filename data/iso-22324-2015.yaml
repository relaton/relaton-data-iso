abstract:
- language: en
  script: Latn
  content: ISO 22324:2015 provides guidelines for the use of colour codes to inform
    people at risk as well as first response personnel about danger and to express
    the severity of a situation. It is applicable to all types of hazard in any location.
    This International Standard does not cover the method for displaying colour codes,
    detailed ergonomic considerations related with viewing displays, or safety signs
    covered by ISO 3864‑1.
