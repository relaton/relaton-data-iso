abstract:
- language: en
  script: Latn
  content: 'This document explains concepts and provides approaches to the following
    aspects of the production of reference materials (RMs): —     the assessment of
    homogeneity; —     the assessment of stability and the management of the risks
    associated with possible stability issues related to the properties of interest;
    —     the characterization and value assignment of properties of an RM; —    
    the evaluation of uncertainty for certified values; —     the establishment of
    the metrological traceability of certified values. The guidance given supports
    the implementation of ISO 17034. Other approaches can also be used as long as
    the requirements of ISO 17034 are fulfilled. Brief guidance on the need for commutability
    assessment (6.11) is given in this document, but no technical details are provided.
    A brief introduction for the characterization of qualitative properties (9.6 to
    9.8) is provided, together with brief guidance on sampling such materials for
    homogeneity tests (7.4.1.2). However, statistical methods for the assessment of
    the homogeneity and stability of RMs for qualitative properties are not covered.
    This document is also not applicable to multivariate quantities, such as spectral
    data. NOTE            ISO 33406 gives more information on the production of RMs
    with one or more qualitative property values.'
