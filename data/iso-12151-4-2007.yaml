abstract:
- language: en
  script: Latn
  content: ISO 12151-4:2007 specifies the general and dimensional requirements for
    the design and performance of ISO 6149 metric stud end hose fittings made of carbon
    steel, for nominal hose inside diameters of 6,3 mm through 38 mm inclusive, in
    accordance with ISO 4397. These hose fittings are for use in hydraulic fluid power
    systems with hose that meets the requirements of the respective hose standards
    and in general applications with suitable hoses.
