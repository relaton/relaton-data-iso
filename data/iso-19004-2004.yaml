abstract:
- language: en
  script: Latn
  content: ISO 19004:2004 describes how test sensitivity can be determined for test
    methods used to measure typical physical and chemical properties of rubber and
    rubber products. It is also applicable to tests used to measure the properties
    of carbon black fillers. Test sensitivity is defined as the ratio of the discrimination
    power of a test method for the fundamental property to be determined to the measurement
    error expressed as a standard deviation. It is frequently described as the 'signal-to-noise
    ratio'. The standard does not address the topic of sensitivity in the context
    of threshold (i.e. minimum) detection limits in the determination of very low
    or trace constituent levels. ISO 19004:2004 is based, with permission of ASTM,
    on ASTM D 6600-00, Standard Practice for Evaluating Test Sensitivity for Rubber
    Test Methods, copyright ASTM.
