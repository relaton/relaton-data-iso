abstract:
- language: en
  script: Latn
  content: 'This document, to be used together with ISO 4254-1, specifies the safety
    requirements and their verification for the design and construction of mounted,
    semi-mounted, trailed and self-propelled agricultural sprayers for use with plant
    protection products (PPP) and liquid fertilizer application, as placed on the
    market by the manufacturer and designed for a single operator only. In addition,
    it specifies the type of information on safe working practices (including residual
    risks) to be provided by the manufacturer. When requirements of this document
    are different from those which are stated in ISO 4254-1, the requirements of this
    document take precedence over the requirements of ISO 4254-1 for machines that
    have been designed and built according to the provisions of this document. This
    document, taken together with ISO 4254-1, deals with significant hazards, hazardous
    situations and events relevant to sprayers and liquid fertilizer distributors
    when they are used as intended and under the conditions foreseeable by the manufacturer
    (see Annex A), excepting the hazards arising from: — protection of the driver
    against spray when spraying (see Foreword); — automatically actuated height adjustment
    systems; — the environment, other than noise; — moving parts for power transmission
    except strength requirements for guards and barriers. This document is not applicable
    to sprayers and liquid fertilizer distributors which are manufactured before the
    date of publication of this document.'
