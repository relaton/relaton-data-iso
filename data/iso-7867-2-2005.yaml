abstract:
- language: en
  script: Latn
  content: ISO 7867-2:2005 establishes the service description, the tyre load ratings
    in basic and special applications, and reference inflation pressure increments
    for the metric series of tyres primarily intended for agricultural tractors and
    machines. It applies to bias-belted, diagonal and radial tyres mounted on 5° tapered
    rims, as specified in ISO 4251-3. It also applies to different concepts and types
    of tyres and rims; in these cases, however, appropriate load/speed curves and
    reference inflation pressure increments will be established and added. Basic tyre
    load-carrying capacities for ranges of existing tyres are also given.
