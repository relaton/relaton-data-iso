abstract:
- language: en
  script: Latn
  content: 'Specifies dimensions, design and the necessary requirements and tests:
    hardness and shock absorption and resistance to slipping of the landing surface.
    Ensures that for competitions and training mats of the same hardness and shock
    absorption are used, the surface of which presents the same resistance to slipping,
