abstract:
- language: en
  script: Latn
  content: 'ISO 2982-1:2013 specifies: boundary dimensions of adapter sleeves with
    taper 1:12 and withdrawal sleeves with tapers 1:12 and 1:30 for rolling bearings
    of a number of dimension series as specified in ISO 15; the outside diameter of
    suitable locknuts; distance from bearing small bore face to outer face of locknut;
    distance from bearing small bore face to outer face of bolt head; overall length
    of withdrawal sleeve and bearing ring.'
