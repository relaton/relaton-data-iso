abstract:
- language: en
  script: Latn
  content: 'This document defines terms within the field of electronic fee collection
    (EFC). This document defines: — terms within the fields of electronic fee collection
    and road user charging; — terms that are used in standards related to electronic
    fee collection; — terms of a more general use that are used more specifically
    in standards related to electronic fee collection. This document does not define:
    — Terms related primarily to other fields that operate in conjunction with EFC,
    such as terms for intelligent transport systems (ITS), common payment systems,
    the financial sector, etc. — Deprecated terms.'
