abstract:
- language: en
  script: Latn
  content: 'ISO 17662:2005 specifies requirements for calibration, verification and
    validation of equipment used for: control of process variables during fabrication;control
    of the properties of equipment used for welding or welding allied processes, where
    the resulting output cannot be readily or economically documented by subsequent
    monitoring, inspection and testing. This regards process variables influencing
    the fitness-for-purpose and in particular the safety of the fabricated product.
    The subject of ISO 17662:2005 is limited to calibration, verification and validation
    of equipment after installation, as part of the workshops'' schemes for maintenance
    and/or operation.'
