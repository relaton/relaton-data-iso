abstract:
- language: en
  script: Latn
  content: 'This document establishes principles and requirements for conducting Life Cycle Assessment (LCA) of Additive Manufacturing (AM) feedstock, equipment, processes and parts, in alignment with ISO 14040, ISO 14044, and ISO 14067. It provides guidance for defining system boundaries, functional units, data quality criteria, and impact assessment indicators to ensure consistency, transparency, and comparability of results. The scope includes: (a) process-level assessments of AM operations within defined system boundaries (gate-to-gate), covering energy consumption, material losses, and auxiliary inputs; (b) part-level assessments (cradle-to-gate) for components manufactured by AM, including raw material production, transportation, AM operations, and post-processing steps. The document is intended for use by LCA professionals to ensure consistency and comparability when reporting LCA results but also for AM manufacturers who will have to collect the data to conduct an LCA to harmonize the practices. This document does not address the use phase or end-of-life scenarios. Therefore, it does not provide detailed guidance on the sustainable design of AM parts, nor does it address data quality, toxicities, or other health and safety aspects. This document is not intended to describe the LCA methodology in detail but should be used to complement existing LCA standards.'
