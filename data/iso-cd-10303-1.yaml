abstract:
- language: en
  script: Latn
  content: 'This document provides an overview of the ISO 10303 series. This document
    defines the architectural principles of product information representation and
    exchange used in the ISO 10303 series. It specifies the characteristics of the
    various sets of parts in the ISO 10303 series and the relationships among them.
    The following are within the scope of this document: —     scope statement for
    the ISO 10303 series as a whole; —     overview of the ISO 10303 series; —    
    architectures of the ISO 10303 series; —     structure of the ISO 10303 series;
    —     overview of data specification methods used in the ISO 10303 series; NOTE           
    This includes the EXPRESS data specification language and graphical presentation
    of product information models. —     introduction to the ISO 10303 series: —    
    integrated resources (IRs); —     application interpreted constructs (AICs); —    
    application modules (AMs); —     application domain models (ADMs); —     Core
    model; —     business object models (deprecated); —     application protocols
    (APs); —     implementation methods; —     usage guides; —     conformance testing
    methodology and framework; —     abstract test suites (ATSs); —     scheme for
    identification of schemas and other information objects defined in the ISO 10303
    series.'
