abstract:
- language: en
  script: Latn
  content: ISO 2846-3:2002 specifies the colour and transparency to be produced by
    a process colour ink set including extender intended for four-colour publication
    gravure printing when printed under specified gravure printing conditions. It
    also specifies the test method to ensure conformance. ISO 2846-3:2002 does not
    specify pigments (or spectral reflectance) in order not to preclude developments
    which may enable different pigment combinations to be used advantageously while
    still achieving the colorimetric requirements specified in ISO 2846-3:2002. NOTE
    ISO 2846-3:2002 may also apply to certain non-publication gravure applications.
