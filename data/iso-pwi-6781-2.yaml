abstract:
- language: en
  script: Latn
  content: 'This part of ISO 6781 provides a means by which a person or entity, wishing
    to use infrared thermographic services for buildings, can understand and specify
    the types, capabilities and condition of equipment that are used in order to obtain
    valid and useful application-specific results. It is important for end users,
    and recipients of thermographic services, to understand that the type of equipment
    used may differ greatly depending on the particular application: Residential,
    Commercial or Institutional.'
