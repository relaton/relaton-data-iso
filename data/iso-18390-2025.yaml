abstract:
- language: en
  script: Latn
  content: This document specifies a simplified routine method for the dynamic or
    static sampling, by manual or mechanical means, of cereals, pulses and cereal
    products to assess their quality and condition. It is applicable to sampling for
    the determination of heterogeneously distributed contaminants, undesirable substances
    and parameters usually homogenously distributed, such as those used to assess
    quality or compliance with a specification. It is applicable to daily use in the
    field, and in silos and factories that ship or receive grains. It does not apply
    to determining insect infestation in a grain lot. Methods for assessing insect
    populations are provided in ISO 16002 and ISO 6639-2. This document does not apply
    to seeds. NOTE            The sampling of seeds is governed by the rules established
    by the International Seed Testing Association (ISTA).
