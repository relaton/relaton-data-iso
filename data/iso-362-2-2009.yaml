abstract:
- language: en
  script: Latn
  content: ISO 362-2:2009 specifies an engineering method for measuring the noise
    emitted by road vehicles of categories L3, L4 and L5 under typical urban traffic
    conditions. It excludes vehicles of category L1 and L2, which are covered by ISO
    9645, vehicles of categories M and N covered by ISO 362-1 and vehicles of categories
    L6 and L7. The specifications are intended to reproduce the level of noise generated
    by the principal noise sources during normal driving in urban traffic, typically
    on roads with speed limits of 50 km/h and 70 km/h. The method is designed to meet
    the requirements of simplicity as far as they are consistent with reproducibility
    of results under the operating conditions of the vehicle. The test method requires
    an acoustical environment that is only obtained in an extensive open space. Such
    conditions are usually provided for type approval measurements of a vehicle, measurements
    at the manufacturing stage and measurements at official testing stations.
