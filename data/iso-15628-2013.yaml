abstract:
- language: en
  script: Latn
  content: 'ISO 15628:2013 specifies the application layer core which provides communication
    tools for applications based on DSRC. These tools consist of kernels that can
    be used by application processes via service primitives. The application processes,
    including application data and application-specific functions, are outside the
    scope of ISO 15628:2013. ISO 15628:2013 is named "application layer", although
    it does not cover all functionality of OSI Layer 7 and it includes functionality
    from lower layers. It uses services provided by DSRC data link layer, and covers
    functionality of intermediate layers of the "OSI Basic Reference Model" (ISO/IEC
    7498-1). The following subjects are covered by ISO 15628:2013: a) application
    layer structure and framework; b) services to enable data transfer and remote
    operations; c) application multiplexing procedure; d) fragmentation procedure;
    e) concatenation and chaining procedures; f) common encoding rules to translate
    data from abstract syntax ASN.1 (ISO/IEC 8824-1) into transfer syntax (ISO/IEC
    8825‑2:2002) and vice versa; g) communication initialisation and release procedures;
    h) broadcast service support; i) DSRC management support including communication
    profile handling; and j) extensibility for different lower layer services and
    application interfaces. It is outside the scope of ISO 15628:2013 to define a
    security policy. Some transport mechanisms for security-related data are provided.'
