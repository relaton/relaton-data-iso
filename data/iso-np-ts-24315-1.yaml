abstract:
- language: en
  script: Latn
  content: The management of electronic transport regulations (METR) provides trustworthy,
    authoritative, machine-interpretable, transport-related rules for using the road
    network. The scope of METR includes both rules that are relatively static (e.g.,
    static speed limits) as well as those that are dynamic (e.g., variable speed limits,
    lane closures at incident scenes). However, where appropriate, METR is expected
    to incorporate existing standards (e.g., ISO/TS 19091 for signalized intersections).
    This document defines the terms used throughout the METR (ISO 24315) series.
