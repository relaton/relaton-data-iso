abstract:
- language: en
  script: Latn
  content: '1.1 This part of ISO 9327 applies to forgings and rolled or forged bars
    manufactured from the austenitic and austenitic-ferritics steels given in Table
    1 and delivered according to the specifications given in ISO 9327-1. 1.2 This
    part of ISO 9327 covers the following data: a) In Table 1 the limits for the chemical
    composition according to the cast analysis; the tensile properties at room temperature;
    the indications on the usual heat treatment condition at the time of delivery;
    b) in Table 2 the permissible deviations of the results of the product analysis
    from the specified limits for the cast analysis, c) in Table 3 the minimum elevated
    temperature proof strength values; d) in Table 4 the estimated average stress
    rupture properties.'
