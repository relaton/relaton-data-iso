abstract:
- language: en
  script: Latn
  content: ISO 9018:2015 specifies the sizes of test pieces and test specimens, and
    the procedure for carrying out tensile tests, for determining the tensile strength
    and location of fractures in welded joints with transverse stressed fillet welds.
    It is applicable to metallic materials with welded cruciform and lapped joints
    on plates, where the term plate ? alone or in combination ? refers to plates,
    sheets, extruded bars or other solid sections. Information concerning the evaluation
    of test results is not included in this International Standard.
