abstract:
- language: en
  script: Latn
  content: This document specifies the technical requirements for monitoring vegetation
    distribution changes of Blue Carbon (BC) ecosystems in intertidal zones, using
    high-resolution optical remote sensing imagery interpretation and field validation.
    It establishes general monitoring principles, vegetation distribution monitoring
    techniques, data analysis and quality controls requirements. This document applies
    to natural, restored, and managed intertidal wetlands and is intended for use
    in BC projects by researchers, policymakers, carbon project developers, and other
    stakeholders involved in BC monitoring and climate mitigation efforts.
