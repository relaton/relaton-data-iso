abstract:
- language: en
  script: Latn
  content: 'This part of ISO 20271 defines the individual properties that may be included
    within each layer of the reference model for textual documents. It also establishes
    classification criteria based on the functional characteristics of each layer.
    A structured taxonomy defines each property within the reference model. To support
    its practical application, each property is also represented using an XML-based
    reference markup, ensuring that the relevant information is embedded directly
    within the document structure. This combined use of taxonomy and markup avoids
    reliance on proprietary parsers or rendering behaviours, and supports interpretability
    in the face of technical degradation or format obsolescence. The reference markup
    is designed to associate relevant information with all applicable elements of
    a textual document, including content, layout, and metadata. By doing so, it supports
    consistency in document structure and interpretation. This standard facilitates
    quantitative and objective evaluations of existing textual document formats against
    the preservation requirements outlined in ISO 20271-1. It also enables comparative
    assessments across different formats by using a unified reference markup. In addition,
    the standard defines a structured taxonomy of properties to be applied across
    the layers of the reference model. To support its practical application, the standard
    provides guidance on how the taxonomy may be implemented, including non-prescriptive
    XML-based reference markups and example instance documents to illustrate potential
    usage. The standard also outlines a methodology for the technical evaluation of
    current textual document formats, and includes checkpoints to assist in the design
    of new formats that are resilient to technical degradation. This part does not
    define a specific file format. Rather, it focuses on ensuring that the necessary
    information is captured within the appropriate layer, as defined in the reference
    model, to avoid loss of meaning or functionality if such information is omitted.
    The content and guidance provided in this part are intended to support consistent,
    structured approaches to the preservation and evaluation of textual documents,
    in accordance with the long-term preservation principles outlined in ISO 20271-2.
    This part of ISO 20271-3 includes the following key specifications: • defines
    a structured taxonomy of properties applicable to each layer of the reference
    model for textual documents, and provides classification criteria based on the
    functional characteristics of those layers • illustrates how these properties
    may be represented through example XML-based reference markup, supporting explicit
    expression of content and reducing the risk of interpretability loss due to technical
    obsolescence or specification decay. • includes guidelines for linking structured
    properties to content elements, layout information, and metadata within textual
    documents, enabling a coherent and comprehensive preservation structure. • offers
    comparative evaluation scenarios using existing standard documents to support
    assessment and benchmarking of various document formats. • provides criteria that
    may be used to construct checklists for designing document formats that are resilient
    to technical degradation and ensure consistency of element-level information,
    aligned with the layer-specific semantics the reference model. This part of ISO
    20271-3 does not define or mandate the following elements, which are considered
    out of scope for this standard: • specific file formats for textual documents
    or other types of documents, such as presentation documents, spreadsheets, images,
    or CAD files. • exact technical methods for verifying the existence of properties
    within specific textual documents. • technical analysis methods for particular
    document formats, including DOC, DOCX, ODT, TXT, PDF, etc. • metadata items specifically
    required for the long-term preservation of textual documents. • any recommendations
    regarding specific hardware, operating systems, or software applications. • detailed
    processes, procedures, or management practices related to long-term preservation
    and records management. This standard outline specific guidelines for establishing
    properties and markup that improve the long-term interpretability of textual documents,
    addressing the challenges posed by potential technical obsolescence. Targeted
    at developers, format designers, and evaluators, it supports the development of
    new document formats as well as the evaluation of existing ones. The focus is
    on maintaining accessibility and content accuracy over extended periods. These
    guidelines promote a structured and objective framework for assessing the suitability
    of document formats for long-term preservation, helping to ensure that documents
    remain interpretable and usable as technologies evolve.'
