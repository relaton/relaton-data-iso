abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for the simultaneous determination
    of 2-MCPD esters (bound 2-MCPD), 3‐MCPD esters (bound 3‐MCPD) and glycidyl esters
    (bound glycidol) in a single assay, based on acid catalysed ester cleavage and
    derivatization of cleaved (free) analytes with phenylboronic acid (PBA) prior
    to GC/MS analysis. This document is applicable to solid and liquid fats and oils.
    For all three analytes the limit of quantification (LOQ) is 0,1 mg/kg and the
    limit of detection (LOD) is 0,03 mg/kg.
