abstract:
- language: en
  script: Latn
  content: This document establishes a classification of challenging conditions to
    which HEPA filters may be designed and qualified to in nuclear facilities. This
    document is intended to be used in conjunction with ISO 23137. This standard is
    applicable to all HEPA filters used in nuclear facilities, regardless of their
    design and function. This standard does not address general specifications for
    HEPA filters used in nuclear facilities. Such specifications (e.g., filtration
    performance, materials, marking, lifetime…) are discussed in ISO 23137.
