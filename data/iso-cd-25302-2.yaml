abstract:
- language: en
  script: Latn
  content: This document specifies test methods and criteria which are to be applied
    to verify if a plastic is dispersible or soluble in marine environments. NOTE   
    Eventual dispersibility and solubility is unrelated to biodegradability. To claim
    biodegradability only biodegradation standard tests are suitable such as the ISO
    23977-series, ISO 18830, ISO 19679 and ISO 22404. These characteristics are useful
    for knowing whether a plastic product will quickly disappear visually and physically
    when introduced into seawater. As such it is complementary to ISO 23832 which
    is measuring the disintegration. Visual or physical disappearance is no proof
    of biodegradation.
