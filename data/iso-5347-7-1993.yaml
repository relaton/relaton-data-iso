abstract:
- language: en
  script: Latn
  content: Lays down detailed specifications for the instrumentation and procedure
    to be used for primary calibration of accelerometers using centrifuge calibration.
    Applies to rectilinear accelerometers with zero-frequency response, mainly of
    the strain gauge or piezoresistive type, and to primary standard and working pick-ups.
    Is applicable for a calibration range from 10 m/s^2 to 1000 m/s^2 (higher accelerations
    possible) at 0 Hz. The limits of uncertainty applicable are ± 1 % of reading.
