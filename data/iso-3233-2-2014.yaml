abstract:
- language: en
  script: Latn
  content: ISO 3233-2:2014 specifies a method for determining the non-volatile matter
    by volume (NVv) of coating materials by determining the practical dry-film density.
    This method determines the volume percentage of non-volatile matter in paints,
    varnishes and related products by measuring the density of a dry coating for any
    specified temperature range and period of drying or curing. Using the non-volatile
    matter by volume results obtained in accordance with ISO 3233-2:2014, it is possible
    to calculate the practical spreading rate of coating materials. This method specifies
    an additional shape of plate to those described in ISO 3233‑1 and is suitable
    for all products which can be applied by dipping.
