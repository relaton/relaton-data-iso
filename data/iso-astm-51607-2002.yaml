abstract:
- language: en
  script: Latn
  content: 'ISO/ASTM 51607 covers materials description, dosimeter preparation, instrumentation
    and procedures for using the alanine-EPR dosimetry system for measuring the absorbed
    dose in materials irradiated with photons and electrons. The system is based on
    electron paramagnetic resonance (EPR) spectroscopy of free radicals derived from
    the amino acid alanine. It is classified as a reference standard dosimetry system.
    This International Standard covers alanine-EPR dosimetry systems for dose measurements
    under the following conditions: the absorbed dose range is between 1 Gy and 105
    Gy; the absorbed dose rate is up to 102 Gy s -1 for continuous radiation fields
    and up to 5 times 107 Gy s-1 for pulsed radiation fields; the radiation energy
    for photons and electrons is between 0,1 MeV and 28 MeV; the irradiation temperature
    is between - 60 °C and + 90 °C.'
