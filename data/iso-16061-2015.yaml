abstract:
- language: en
  script: Latn
  content: ISO 16061:2015 specifies general requirements for instruments to be used
    in association with non-active surgical implants. These requirements apply to
    instruments when they are manufactured and when they are resupplied after refurbishment.
    This International Standard also applies to instruments which may be connected
    to power-driven systems, but does not apply to the power-driven systems themselves.
    With regard to safety, this International Standard gives requirements for intended
    performance, design attributes, materials, design evaluation, manufacture, sterilization,
    packaging, and information supplied by the manufacturer. This International Standard
    is not applicable to instruments associated with dental implants, transendodontic
    and transradicular implants, and ophthalmic implants.
