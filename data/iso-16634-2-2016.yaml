abstract:
- language: en
  script: Latn
  content: ISO 16634-2:2016 specifies a method for the determination of the total
    nitrogen content and the calculation of the crude protein content of cereals,
    pulses and milled cereal products. This method, like the Kjeldahl method (see
    References [1] and [6]), does not distinguish between protein nitrogen and non-protein
    nitrogen. For the calculation of the protein content, various conversion factors
    are used (see 3.2).
