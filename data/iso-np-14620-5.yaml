abstract:
- language: en
  script: Latn
  content: This document defines safety management requirements and safety technical
    requirements for human rated spacecraft system during the development phase and
    flight process, and specifies the safety requirements for payloads of human rated
    spacecraft and the safety requirements for operation, to ensure the safe of crews
    and human rated spacecraft in orbit. This document contains the requirements of
    safety management work and technical work for human rated spacecraft system. The
    safety management requirements include safety organization, safety programme reviews,
    safety compliance demonstration, safety training, accident/incident reporting
    and investigation, safety documentation, safety deviations and waivers. The safety
    technical requirements include the hazards identification, safety risk analysis
    and assessment, safety critical functions control, safety design, safety verification,
    safety assessment and mission operations which are special for human rated spacecraft
    system. This document is applicable to safety management and technical work for
    human rated space vehicle, space station, and items and payloads on board (including
    cargoes, scientific experiment payloads and so on). This document establishes
    the safety requirements for human rated spacecraft which is applicable to the
    phases of development, operation in orbit (long-term operation in-orbit, extravehicular
    activity, rendezvous and docking), deorbiting, recovering and landing.
