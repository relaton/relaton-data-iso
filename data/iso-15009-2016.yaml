abstract:
- language: en
  script: Latn
  content: 'ISO 15009:2016 specifies a method for quantitative gas-chromatographic
    determination of volatile aromatic hydrocarbons, naphthalene and volatile halogenated
    hydrocarbons in soil. This International Standard is applicable to all types of
    soil. NOTE In the case of unsaturated peaty soils, absorption of the extraction
    solution may occur. The lower limit of quantification is dependent on the equipment
    used and the quality of the methanol grade used for the extraction of the soil
    sample. Under the conditions specified in this International Standard the following
    limits of quantification apply (expressed on basis of dry matter): Typical limit
    of quantification when using GC-FID: - Volatile aromatic hydrocarbons: 0,1 mg/kg
    Typical limit of quantification when using GC-ECD: - Volatile halogenated hydrocarbons:
    0,01 mg/kg Lower limits of quantification for some compounds can be achieved by
    using mass spectrometry (MS) with selected ion detection.'
