abstract:
- language: en
  script: Latn
  content: This document specifies methods for determining the velocity and cross-sectional
    area of water flowing in open channels and for calculating the discharge employing
    point velocity measurement devices. It is applicable to methods using rotating-element
    current meters, acoustic doppler velocimeters (ADVs), acoustic doppler current
    profiler (ADCP) stationary method, surface velocity measurement including floats
    and other surface velocity systems. Although some general procedures are discussed,
    this document does not describe in detail how to use or deploy these systems.
    NOTE         For detailed procedures, refer to guidelines from instrument manufacturers
    and the appropriate public agencies.
