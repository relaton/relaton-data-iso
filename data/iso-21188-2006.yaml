abstract:
- language: en
  script: Latn
  content: ISO 21188:2006 sets out a framework of requirements to manage a PKI through
    certificate policies and certification practice statements and to enable the use
    of public key certificates in the financial services industry. It also defines
    control objectives and supporting procedures to manage risks. ISO 21188:2006 draws
    a distinction between PKI systems used in open, closed and contractual environments.
    It further defines the operational practices relative to financial services industry
    accepted information systems control objectives. ISO 21188:2006 is intended to
    help implementers to define PKI practices that can support multiple certificate
    policies that include the use of digital signature, remote authentication and
    data encryption. ISO 21188:2006 facilitates the implementation of operational,
    baseline PKI control practices that satisfy the requirements for the financial
    services industry in a contractual environment. While the focus of ISO 21188:2006
    is on the contractual environment, application of this document to other environments
    is not specifically precluded. For the purposes of this document, the term "certificate"
    refers to public key certificates. Attribute certificates are outside the scope
    of ISO 21188:2006.
