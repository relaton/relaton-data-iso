abstract:
- language: en
  script: Latn
  content: This document defines terms relating to rock drill rigs and rock reinforcement
    rigs, including their intended use, working methods, types, and main components.
    It also provides (see Annex A) several classifications of rock drill rigs, based
    on intended use, mobility and type of operation. The primary use of this document
    is in instruction handbooks for rock drill rigs and in marketing material. Safety
    related terminology is used in ISO 18758‑2. This document is not applicable to
    drill rigs for soil and rock mixture. NOTE Documents covering vocabulary of related
    subjects are found in the bibliography.
