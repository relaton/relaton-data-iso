abstract:
- language: en
  script: Latn
  content: ISO 105-E12:2010 specifies a method for determining the resistance of the
    colour of wool and part-wool textiles to the action of soap and sodium carbonate
    solutions used in alkaline milling (severe method) or of a soap solution only
    (mild method). The mild method can be applied to light- or medium-weight wool
    (or wool-containing) clothing fabrics.
