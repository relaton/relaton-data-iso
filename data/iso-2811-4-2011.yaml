abstract:
- language: en
  script: Latn
  content: ISO 2811-4:2011 specifies a method for determining the density of paints,
    varnishes and related products using a pressure cup. The method is suitable for
    products which are aerated. Emulsion paints, for example, often trap small air
    bubbles, and these might still be present when the density is measured. It is
    not, however, suitable for textured paints which contain coarse particles.
