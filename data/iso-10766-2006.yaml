abstract:
- language: en
  script: Latn
  content: 'ISO 10766:2006 specifies the preferred range of nominal dimensions and
    associated tolerances for a series of hydraulic cylinder piston and rod housings
    for rectangular-section-cut bearing rings, of the type shown in Figure 1, for
    applications in the following range of dimensions: for cylinders with bores of
    16 mm to 500 mm, inclusive;for rods with diameters of 12 mm to 360 mm, inclusive.
    ISO 10766:2006 does not give details of cut bearing ring design, because the manner
    of construction of cut bearing rings varies with each manufacturer.The design
    material of cut bearing rings and any incorporated anti-extrusion component are
    determined by conditions such as temperature and pressure.'
