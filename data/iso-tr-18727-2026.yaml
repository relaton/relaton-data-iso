abstract:
- language: en
  script: Latn
  content: This document presents a case study of a quality management process to
    support the integration of medical information storage within a hierarchical storage
    structure, across multiple medical sites. This case study examines how it was
    used within the MID-NET® Project,[5] utilizing the hierarchical storage structure
    conformant with ISO/TS 24289. This document does not address issues related to
    the protection of patient privacy, network security, or the management of patient
    identifiers and information processes.
