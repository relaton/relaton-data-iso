abstract:
- language: en
  script: Latn
  content: This document provides guidelines to organizations for establishing the
    basic elements, strategies and processes for preventing and reducing crime and
    the fear of crime at a new or existing built environment. It recommends the establishment
    of countermeasures and actions to treat crime and security risks in an effective
    and efficient manner by leveraging environmental design. Within this document,
    the term "security" is used in a broad manner to include all crime, safety and
    security-specific applications, so it is applicable to public and private organizations,
    regardless of type, size or nature. While this document provides general examples
    of implementation strategies and best practices, it is not intended to provide
    an exhaustive listing of detailed design, architectural or physical security crime
    prevention through environmental design (CPTED) implementation strategies or restrict
    the potential applications to only those examples provided in this document.
