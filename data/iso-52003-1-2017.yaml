abstract:
- language: en
  script: Latn
  content: The set of EPB assessment standards produces a great number of overall
    and partial EPB indicators as outputs. ISO 52003-1:2017 provides general insight
    to both private parties and public regulators (and all stakeholders involved in
    the regulatory process) on how to make good use of these outputs for different
    purposes (post-processing). ISO 52003-1:2017 describes the relation between the
    EPB indicators and the EPB requirements and EPB ratings, and it discusses the
    importance of project-specific, tailored values as requirement or reference for
    certain EPB indicators. ISO 52003-1:2017 also includes a couple of possible EPB
    labels and it lists the different steps to be taken when establishing an EPB certification
    scheme. ISO 52003-1:2017 provides standardized tables for reporting in a structured
    and transparent manner the choices that are to be made with respect to overall
    EPB requirements. The tables are non-restrictive, thus allowing for full regulatory
    flexibility. ISO 52003-1:2017 does not provide such tables for partial EPB requirements
    (related to the fabric or technical buildings systems), as this is dealt with
    in other documents. NOTE Table 1 in the Introduction shows the relative position
    of ISO 52003-1:2017 within the set of EPB standards in the context of the modular
    structure as set out in ISO 52000-1.
