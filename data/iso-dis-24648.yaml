abstract:
- language: en
  script: Latn
  content: 'This document specifies conditions for the determination of circumferential
    mechanical properties of ceramic matrix composite (CMC) tubes with continuous
    fibre-reinforcement at room temperature on C-ring specimen under diametric compression.
    This document is specific to the tubular geometries because fibre architecture
    and specimen geometry factors in composite tubes are distinctly different from
    those in flat specimens. This test method is straightforward to carry out and
    low-material consumption. It provides the C-ring modulus, the mechanical response
    and the ultimate fracture force. If the ultimate fracture occurs within the linear
    elastic domain, then the tensile strength can be determined from the corresponding
    ultimate fracture force. The information can be used for material development,
    control of manufacturing (quality insurance), material comparison, characterization,
    reliability and design data generation for tubular components. This document addresses,
    but is not restricted to, various suggested test piece fabrication methods. This
    document is primarily applicable to ceramic matrix composites tube with a continuous
    fibrous-reinforcement: unidirectional (1D, filament winding and tape lay-up),
    bidirectional (2D, braid and weave) and multi-directional (xD, with x >2).'
