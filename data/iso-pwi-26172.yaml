abstract:
- language: en
  script: Latn
  content: This standard specifies the test methods and test conditions for assessing
    the life of positive displacement compressors. It includes rotary compressors,
    scroll compressors and reciprocating piston compressors. This standard applies
    to hermetic compressors. Semi-hermetic compressors may refer to it for use. This
    standard applies to compressors using refrigerants R22, R410A, R32, R454B and
    R290. Compressors using other refrigerants may refer to it for use. This standard
    applies to compressors used in air conditioning, space heating, refrigeration,
    dehumidification and heat pump water heater applications. Compressors used in
    other applications may refer to it for use.
