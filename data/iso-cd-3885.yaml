abstract:
- language: en
  script: Latn
  content: This document specifies a method for the simultaneous determination of
    the fluorine, chlorine, bromine, and sulfur content in environmental solid matrices
    by oxidative pyrohydrolytic combustion at (1 050 ± 50) °C, followed by ion chromatography.
    The method is applicable for the determination of concentrations ≥ 10 mg/kg of
    each element based on dry matter. The upper limit and exact concentration range
    covered depends on the blank levels of the instrumentation and the capacity of
    the chromatographic separation column used for determination.
