abstract:
- language: en
  script: Latn
  content: 'This document specifies tests for verifying the stability of pedestrian-propelled
    trucks. It is applicable to: —     stacker, pallet and pallet stacker trucks with
    capacities not exceeding 1 000 kg, with manual or battery-powered lift; —    
    scissor-lift pallet trucks with lift heights up to 1 000 mm and rated capacity
    up to 1 500 kg, with manual or battery-powered lift; —     platform trucks. It
    also applies to trucks operating under the same conditions when equipped with
    load-handling attachments. It is not applicable to trucks with retractable devices
    such as a retractable mast or retractable fork carrier.'
