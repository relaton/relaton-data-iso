abstract:
- language: en
  script: Latn
  content: This document specifies the safety requirements for reciprocating internal
    combustion (RIC) engine driven generating sets up to 1 000 V alternating current
    (AC) or 1 500 V direct current (DC) and voltages above 1 000 V (AC) and not exceeding
    36 kV consisting of an RIC engine, an AC generator including the additional equipment
    required for operating, e.g. controlgear, switchgear, auxiliary equipment. This
    document is applicable to generating sets for land and marine use (domestic, recreational
    and industrial application). This document is not applicable to generating sets
    used on board of seagoing vessels and mobile offshore units as well as on aircraft
    or to propel road vehicles and locomotives. This document is not applicable to
    gensets and components manufactured before the date of its publication. NOTE           
    This document does not apply to arc welding equipment (IEC 60974 series). This
    document does not specify the special requirements needed to cover operation in
    potentially explosive atmospheres and is not applicable for such environments.
    The hazards relevant to RIC engine driven generating sets are identified in Table A.1.
    This document deals with the special requirements of test and safety design which
    are observed in addition to the definitions and requirements in ISO 8528-1:2018,
    ISO 8528-2:2018, ISO 8528-3:2020, ISO 8528-4:2025, ISO 8528-5:2025, ISO 8528-6:2023
    and ISO 8528-10:2022, where applicable. This document specifies safety requirements
    in order to protect the user from danger.
