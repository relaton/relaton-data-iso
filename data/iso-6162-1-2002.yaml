abstract:
- language: en
  script: Latn
  content: ISO 6162-1:2002 specifies complete general and dimensional characteristics
    for flange heads, split flange clamps (FCS), one-piece flange clamps (FC) and
    ports applicable to four-screw, split and one-piece flange clamp type tube and
    hose connectors for use at pressures of 3,5 MPa (35 bar) to 35 MPa (350 bar).
    It also specifies the dimensions of the seals to be used, as well as the grooves
    to house the seal. ISO 6162-1:2002 also recognizes the need to accommodate metric
    screw fasteners, as well as to provide a means to use existing inch screw fasteners.
