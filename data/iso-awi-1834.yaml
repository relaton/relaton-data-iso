abstract:
- language: en
  script: Latn
  content: This International Standard specifies the general conditions of acceptance for electrically welded round steel short link chain for lifting purposes. It includes medium tolerance chain for use in chain slings and for general lifting purposes, and fine tolerance chain for use with chain hoists and other similar lifting appliances. It is applicable to short link lifting chain in accordance with ISO 1835, ISO 3075, ISO 3076 and ISO 3077.
