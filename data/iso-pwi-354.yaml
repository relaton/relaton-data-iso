abstract:
- language: en
  script: Latn
  content: ISO 354:2003 specifies a method of measuring the sound absorption coefficient
    of acoustical materials used as wall or ceiling treatments, or the equivalent
    sound absorption area of objects, such as furniture, persons or space absorbers,
    in a reverberation room. It is not intended to be used for measuring the absorption
    characteristics of weakly damped resonators. The results obtained can be used
    for comparison purposes and for design calculation with respect to room acoustics
    and noise control.
