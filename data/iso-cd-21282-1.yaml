abstract:
- language: en
  script: Latn
  content: This document specifies general principles for the determination of mass
    of carbon dioxide sequestrated in concrete and concrete constituents. The scope
    of standard includes determination of carbon dioxide sequestrated in recycled
    crushed concrete and other concrete oriented materials used for applications other
    than concrete constituents. Carbon dioxide in natural inorganic carbonates such
    as limestone is not included in the scope of determination.
