abstract:
- language: en
  script: Latn
  content: 'This document aims to specify a categorial structure in the field of disorder
    representation in traditional Chinese medicine (TCM) by defining a set of domain
    constraints for use within terminological resources. It contains a concept detailing
    the domains of four subcategories: body parts, causative agents, pathological
    process and manifestation. This document does not include: —    a comprehensive
    categorial structure for TCM; —    a treatment procedure for TCM; —    relevant
    devices; —    terms or descriptions for subcategories of body parts, causative
    agents, pathological process or manifestation.'
