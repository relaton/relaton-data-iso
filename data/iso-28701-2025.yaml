abstract:
- language: en
  script: Latn
  content: This document provides requirements and guidance for implementing a safety
    and sustainability management system for commercial shipping on inland waterways.
    The document is tailored toward navigation on the inland waterways, including
    but not limited to rivers and lakes. It applies to freight, cruise, ferries and
    passenger vessels larger than 24 m in length on inland waterways and land-based
    operations supporting ships. This document is aligned with the ISM Code[14] and
    is also applicable to sea going vessels when sailing on inland waterways.
