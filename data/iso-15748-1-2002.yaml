abstract:
- language: en
  script: Latn
  content: ISO 15748-1 applies to the planning, design and configuration of potable
    water supply systems on ships, stationary or floating marine structures and inland
    waterway vessels. It specifies the minimum requirements for potable water supply
    systems to be met in order to protect the potable water and to maintain its quality.
    ISO 15748-1 also provides hints on components to be used and on laying of the
    pipelines.
