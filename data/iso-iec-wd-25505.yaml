abstract:
- language: en
  script: Latn
  content: 'This International Standard defines the communication protocol architecture
    and message framework for wireless energy transfer and management in autonomous
    moving machines (AMMs) operating across heterogeneous wireless networks. It specifies
    logical communication structures above the MAC layer to enable energy transfer
    session coordination, device identification and authentication, session continuity,
    and seamless network handover during autonomous charging operations. This standard
    defines logical communication and message structures operating above the MAC layer,
    enabling interoperability across heterogeneous wireless networks such as wireless
    LAN (IEEE 802.11) and short-range wireless communication technologies (IEEE 802.15.4
    family), without requiring changes or constraints to existing physical or MAC
    technologies. This International Standard is intended to be developed in multiple
    parts: • Part 1 - Architecture and Requirements • Part 2 - Communication Protocol
    • Part 3 – Protocol for Communication Synchronization and Operation Additional
    parts may be developed as needed to address related technical topics within the
    scope of this work item.'
