abstract:
- language: en
  script: Latn
  content: ISO 8986-2:2009 specifies the methods of preparation of test specimens
    and the test methods to be used in determining the properties of polybutene‑1
    (PB‑1) moulding and extrusion materials. Requirements for handling test material
    and for conditioning both the test material before moulding and the specimens
    before testing are also specified. Procedures and conditions for the preparation
    of test specimens and procedures for measuring properties of the materials from
    which these specimens are made are given. Properties and test methods which are
    suitable and necessary to characterize PB moulding and extrusion materials are
    listed. The properties have been selected from the general test methods in ISO
    10350‑1. Other test methods in wide use for or of particular significance to these
    moulding and extrusion materials are also included in this part of ISO 8986, as
    is the designatory property specified in Part 1.
