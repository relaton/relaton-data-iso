abstract:
- language: en
  script: Latn
  content: This document provides principles and framework for use of recycled aggregates
    for concrete, which are produced from used resources primarily in the form of
    waste concrete. This document is intended to accelerate the use of recycled aggregates
    produced from construction and demolition wastes such as waste concrete and demolished
    masonry units. This document complements ISO 19595, natural aggregates for concrete,
    which does not include the minimum requirements for the recycled aggregates for
    concrete.
