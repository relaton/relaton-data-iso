abstract:
- language: en
  script: Latn
  content: 'A multipart set of documents is envisioned as part of the 19885 series, Gaseous hydrogen -- Fuelling protocols for hydrogen-fuelled vehicles. The 19885 documents will address the general design and development process for the definition and verification of fuelling protocols and the implementation of the protocols for dispensing fuel to hydrogen vehicles rated up to 70 MPa nominal working pressure (NWP). V01/2026 This NP proposes the following project: 19885-5: Physical and data link layer requirements of the communications between the vehicle and dispenser control systems Focus is on the physical and data-link layer requirements of the bidirectional communication system needed to implement the fueling protocols defined in the ISO 19885 series for hydrogen vehicles. This document specifies the physical interface, data-link layer, and pairing channel requirements necessary to support interoperable and secure communications between vehicle and dispenser control systems. The document supports implementation of the communication framework defined in ISO 19885-2 and the fueling protocols defined in other parts of the ISO 19885 series. This document also specifies service primitives and associated requirements for interactions between the layer defined in this document and the upper layer for communication protocols defined in ISO 19885-2, enabling interoperable implementation of the communication stack. The communication architecture should be capable of supporting applicable UCDC communication levels defined within the ISO 19885 series. Approach: • To be written in the context anticipated use as the document proceeds industry application, • Coordinate with ISO 19885-2 to support implementation of the communications defined between vehicle and dispenser control systems • Compatible with communication requirements and fueling protocols defined in the ISO 19885 series to ensure interoperable and secure communication across all applicable UCDC levels.'
