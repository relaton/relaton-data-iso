abstract:
- language: en
  script: Latn
  content: 'This document specifies the preparation methods of the test samples for
    the qualitative and quantitative analysis of specific chemical substances in fireworks.
    The document applies to the following substances to be tested using ISO 22863
    (all parts): — hexachlorobenzene; — lead and lead compounds; — arsenic or arsenic
    compounds; — mercury compounds; — chlorates; — white phosphorus; — picrates or
    picric acid; — zirconium with a particle size of less than 40 µm; — content of
    nitrogen in nitrocellulose.'
