abstract:
- language: en
  script: Latn
  content: ISO 24801-1:2007 specifies the competencies that a scuba diver has to have
    achieved in order for a training organization to award the scuba diver certification
    indicating that he has met or exceeded scuba diver level 1 -- "Supervised diver"
    and specifies assessment of these competencies. It also specifies conditions under
    which training has to be provided, in addition to the general requirements for
    recreational diving service provision in accordance with ISO 24803. ISO 24801-1:2007
    applies only to contractual training and certification in recreational scuba diving.
