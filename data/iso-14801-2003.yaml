abstract:
- language: en
  script: Latn
  content: ISO 14801:2003 specifies a method of fatigue testing of single-post endosseous
    dental implants of the transmucosal type. It is most useful for comparing endosseous
    dental implants of different designs or sizes. While it simulates the functional
    loading of an endosseous dental implant body and its premanufactured prosthetic
    components under worst-case conditions, ISO 14801:2003 is not applicable for predicting
    the in vivo performance of an endosseous dental implant or prosthesis, particularly
    if multiple endosseous dental implants are used for a prosthesis.
