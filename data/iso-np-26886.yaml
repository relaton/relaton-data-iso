abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of the mass concentration
    (ng/L or μg/L) of tyre and road wear particles (TRWP) in water samples, and the
    mass concentration in suspended solids(μg/g). This document establishes principles
    for: — water sample collection — pre-concentration of TRWP from water — sample
    preparation and pre-treatment prior to pyrolysis; — generation of pyrolysis fragments
    from the sample; and — quantification of the generated polymer fragments. This
    document is applicable to samples from water'
