abstract:
- language: en
  script: Latn
  content: 'ISO 18902:2013 specifies the principal physical and chemical requirements
    for album, storage and framing materials to prevent damage to processed or printed
    imaging materials over time. It covers requirements for: paper and paperboard;
    plastics; metals; writing instruments; adhesives; tapes; self-adhesive labelling
    materials; stamping inks and pads; framing and glazing materials used as, or in
    the construction of, storage and display materials for black-and-white or colour
    reflection prints or negatives made with traditional silver-halide and silver
    dye bleach photographic materials; dye- and pigment-based inkjet, dye diffusion
    thermal transfer ("dye sublimation"), and liquid- and dry-toner electrophotographic
    digital prints.'
