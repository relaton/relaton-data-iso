abstract:
- language: en
  script: Latn
  content: This proposed standard specifies the process for developing a commissioning plan for existing buildings. The commissioning plan describes the procedures to verify and document that the performance of the building in operation meets the owner’s requirements. This standard provides a general framework for commissioning plan development and is intended to be used in conjunction with system- or discipline-specific standards. This standard constitutes Part 2 of the ISO 24359 series and does not cover the commissioning plans for new construction, major renovations, or system and assembly replacement projects, which were addressed in Part 1.
