abstract:
- language: en
  script: Latn
  content: This document defines tests to help evaluate the optical effect of a vehicle’s
    glazing on the vehicle’s camera image when the glazing is mounted in front of
    the vehicle’s camera. The tests apply to glazing camera zones with cameras that
    operate within or close to the visible light spectrum and support a vehicle's
    automated driving system. The tests may be performed during design phase, pre-production,
    production, and post-production. Test results are key performance indicators (KPIs)
    of the glazing camera zone or of the glazing camera zone in combination with the
    vehicle camera system. Any value limit standards for quality control need to be
    defined by the user. The performance analysis of the camera lens, image sensor,
    physical arrangement of components, camera electronics, and vehicle driving system
    embedded image analysis software fall outside the scope of both SC35 and this
    document.
