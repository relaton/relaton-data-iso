abstract:
- language: en
  script: Latn
  content: ISO 1144:2016 gives the principles and recommended units of the Tex System
    for the expression of linear density and includes conversion tables for calculating
    the tex values of numbers or counts in other systems together with a statement
    of the procedure for the implementation of the Tex System in trade and industry.
    The Tex System is applicable to all kinds of textile fibres, intermediate products
    (for example tops, slivers and rovings), yarns and similar structures.
