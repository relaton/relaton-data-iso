abstract:
- language: en
  script: Latn
  content: This document will provide general requirements and guidelines for the
    detection of specific antimicrobial resistance (AMR) determinants in bacteria
    as identified by whole genome sequencing. This document will include details on
    the detection of AMR mechanisms and prediction of AMR in a range of bacterial
    species. The document will include both verified whole genome sequences and targeted
    analysis. The scope includes a One Health approach for a document formally applicable
    to bacteria isolated from the food chain but with the purpose to be applicable
    also to bacteria covered by ISO/TC 34/SC 16 Horizontal methods for molecular biomarker
    analysis, bacteria isolated from clinical samples, covered by ISO/TC 212 Medical
    laboratories and in vitro diagnostic systems, as well as bacteria isolated from
    animals, as covered by the World Organization for Animal Health (WOAH).
