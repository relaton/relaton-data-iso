abstract:
- language: en
  script: Latn
  content: This International Standard specifies the requirements for the magnetic
    and mechanical properties of soft magnetic composite materials used for components
    made by powder metallurgical process. Soft magnetic composite materials are used
    in electromagnetic applications and are made from ferromagnetic powder particles
    surrounded by an electrical insulating layer. Components made from such powders
    are formed to near-net-shape by compaction followed by a heat treatment at a temperature
    low enough to avoid forming inter-particle metallic bonds. This standard does
    not apply to sintered soft magnetic materials.
