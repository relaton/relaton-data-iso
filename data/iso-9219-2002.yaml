abstract:
- language: en
  script: Latn
  content: ISO 9219:2002 specifies the characteristics of bolts for pulleys, with
    thin hexagonal head, close tolerance shank and short thread, in alloy steel and
    cadmium plated (classification 1 100 MPa/235 °C), in titanium alloy and MoS2 lubricated
    (classification 1 100 MPa/315 °C) or in corrosion-resistant steel and passivated.
    ISO 9219:2002 is applicable to bolts used with ISO 9217 and ISO 9218 washers,
    ISO 9216 nuts and ISO 1234 splint pins.
