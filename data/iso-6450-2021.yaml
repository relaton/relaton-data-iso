abstract:
- language: en
  script: Latn
  content: 'This document specifies two methods of evaluating the resistance of rubber-
    or plastics-coated fabrics to the action of liquids by measurement of selected
    properties of the materials before and after immersion in selected liquids. The
    two methods are as follows: —    Method A: total immersion with liquid; —    Method
    B: one surface side immersion with liquid.'
