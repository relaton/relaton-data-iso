abstract:
- language: en
  script: Latn
  content: 1.1 ISO 10366-1:2002 establishes a system of designation for methyl methacrylate-acrylonitrile-butadiene-styrene
    (MABS) moulding and extrusion materials, which may be used as the basis for specifications.
    1.2 The types of MABS plastic are differentiated from each other by a classification
    system based on appropriate levels of the designatory properties Vicat softening
    temperaturemelt volume-flow rateCharpy notched impact strengthtensile modulus
    and on information about composition, intended application and/or method of processing,
    important properties, additives, colorants, fillers and reinforcing materials.
    1.3 This part of ISO 10366 is applicable to all methyl methacrylate-acrylonitrile-butadiene-styrene
    materials consisting of a continuous phase based mainly on copolymers of styrene
    (and/or alkyl-substituted styrene), acrylonitrile and methyl methacrylate and
    a dispersed elastomeric phase based mainly on polybutadiene. It applies to MABS
    materials ready for normal use in the form of powder, granules or pellets, unmodified
    or modified by colorants, additives, fillers, etc.
