abstract:
- language: en
  script: Latn
  content: ISO 15848-2:2015 specifies test procedures for the evaluation of external
    leakage of valve stems or shafts and body joints of isolating valves and control
    valves intended for application with volatile air pollutants and hazardous fluids.
    End connection joints, vacuum application, effects of corrosion, and radiation
    are excluded from this part of ISO 15848. The production acceptance test is intended
    for standard production valves where fugitive emissions standards are specified.
