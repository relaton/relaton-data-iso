abstract:
- language: en
  script: Latn
  content: ISO 4709 gives a classification system for composition cork intended to
    be used as gaskets in the mechanical industry. It provides a means for specifying
    or describing the relevant properties. Since not all properties that contribute
    to gasket performance are included, the use of this system is limited to the selection
    of materials in accordance with specified requirements.
