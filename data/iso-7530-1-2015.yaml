abstract:
- language: en
  script: Latn
  content: ISO 7530-1:2015 describes flame atomic absorption spectrometric methods
    for the determination of cobalt, chromium, copper, iron, and manganese in nickel
    alloys which can be dissolved in the nitric-hydrochloric acids mixture specified.
    For each element, the method is applicable to the content range between 0,01 %
    and 4 %.
