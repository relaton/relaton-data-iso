abstract:
- language: en
  script: Latn
  content: 'This document will provide guidance on what a purpose is, how a purpose-driven
    organization (PDO) approaches decisions, and how it acts. It outlines the worldviews,
    principles and associated behaviours and activities of a PDO. It will provide
    guidance to governing bodies and executive managers of organizations on: • developing
    an understanding of purpose and the relevancy and level of challenge of their
    organization in becoming a PDO; • terms and definitions related to purpose; •
    understanding the worldviews, principles and behaviours of a successful PDO and
    what it might need to do to align with them; • developing strategies and actions
    to enact and embed purpose in organizational policies, processes, practices, products,
    services and value networks; • aligning purpose with decision making across the
    organization. It is applicable to all types and sizes of organizations, including
    private and public sector organizations, regulators, central and local government
    and professional bodies. It is particularly relevant for governing bodies and
    executive managers to develop their understanding and implementation of a purpose.
    It is also relevant for those providing services and support to organizations
    as well as stakeholders who might benefit from understanding purpose and who might
    invest in, support and help hold organizations to account for their commitment
    to purpose.'
