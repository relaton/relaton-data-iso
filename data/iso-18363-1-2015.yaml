abstract:
- language: en
  script: Latn
  content: ISO 18363-1:2015 describes a procedure for the indirect determination of
    3-MCPD esters (bound 3-MCPD) and possible free 3-MCPD after alkaline catalysed
    ester cleavage and derivatization with phenylboronic acid (PBA). Furthermore,
    this part of ISO 18363 enables the indirect determination of glycidyl esters (bound
    glycidol) under the assumption that no other substances are present that react
    at room temperature with inorganic chloride to generate 3-MCPD. ISO 18363-1:2015
    is applicable to solid and liquid fats and oils. Milk and milk products (or fat
    coming from milk and milk products) are excluded from the scope of this part of
    ISO 18363.
