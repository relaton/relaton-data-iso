abstract:
- language: en
  script: Latn
  content: ISO 21079-1:2008 specifies methods for the chemical analysis of AZS (alumina,
    zirconia, and silica) refractory products (containing 5 % to 45 % of ZrO2) and
    raw materials, using traditional ("wet") methods, inductively coupled plasma atomic
    emission (ICP-AE) spectrometry and flame atomic absorption (FAA) spectrometry.
    It covers apparatus, reagents and dissolution methods. ISO 21079-1:2008 is not
    applicable to MgO-based refractories. ISO 21079-1:2008 gives alternatives to the
    X-ray fluorescence (XRF) method given in ISO 12677.
