abstract:
- language: en
  script: Latn
  content: This document specifies testing methods for alternative current (AC) influenced
    corrosion of conducting alloys. The methods are applicable for testing the corrosion
    rate of specific conducting metals and alloys for high-voltage AC electric power
    transmission systems exposed to atmosphere. This document introduces corrosion
    testing methods for comparative study of corrosion rate of conducting materials
    such as aluminium, copper and their alloys.
