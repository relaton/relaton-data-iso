abstract:
- language: en
  script: Latn
  content: This document specifies the quality, safety requirements and test methods
    for Aucklandia lappa root that is derived from the Aucklandia lappa Decne. It
    is applicable to Aucklandia lappa root sold and used as natural medicines in international
    trade, including Chinese materia medica (whole medicinal materials) and decoction
    pieces. This document does not apply to the processed Aucklandia lappa root, including
    products traditionally processed with different methods, or its processing methods.
