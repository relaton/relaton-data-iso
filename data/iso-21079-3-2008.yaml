abstract:
- language: en
  script: Latn
  content: ISO 21079-3:2008 specifies flame atomic absorption spectrophotometry (FAAS)
    and inductively coupled plasma emission spectrometry (ICP-AES) methods for the
    analysis of AZS (alumina, zirconia, and silica) refractory products (containing
    5 % to 45 % of ZrO2) and raw materials. ISO 21079-3:2008 is not applicable to
    MgO-based refractories. ISO 21079-3:2008 gives alternatives to the X-ray fluorescence
    (XRF) method given in ISO 12677.
