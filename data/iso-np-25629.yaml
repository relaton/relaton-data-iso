abstract:
- language: en
  script: Latn
  content: This document specifies requirements for biobanking of human intestinal
    organoids (HIO) and intestinal cancer organoids (HCIO), including the establishment
    and characterization of HIO and HCIO. This document is applicable to biobanking
    of HIO and HCIO used for research and development in the life sciences. This document
    does not apply to HIO and HICO for the purpose of in vivo application in humans,
    clinical applications or therapeutic use. NOTE International, national or regional
    regulations or requirements or multiple of them can also apply to specific topics
    covered in this document.
