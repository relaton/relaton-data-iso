abstract:
- language: en
  script: Latn
  content: 'This document specifies the performance requirements and test methods for filtration property and safety of materials for nonwoven general use face coverings for single use. This document specifies the following filtration properties: sub-micron filtration efficiency (PFE), water aerosol filtration efficiency with bacteria (BFE), water aerosol filtration efficiency with viruses (VFE), pollen particle filtration efficiency, and differential pressure. This document specifies the following safety items: free formaldehyde, specific azo dye, heavy metals, and pH. This document applies to nonwoven general use face coverings. It does not apply to medical face masks (see EN 14683 [5]), medical devices, or personal protective equipment (PPE) in the scope of ISO/TC94/SC15, Respiratory protective devices (RPD).'
