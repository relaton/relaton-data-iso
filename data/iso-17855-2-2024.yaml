abstract:
- language: en
  script: Latn
  content: This document specifies the methods of preparation of test specimens and
    the test methods for determining the properties of polyethylene (PE) moulding
    and extrusion materials. It gives requirements for handling test material and
    for conditioning both the test material before moulding and the specimens before
    testing. This document specifies the procedures and conditions for the preparation
    of test specimens and procedures for measuring properties of the materials from
    which these specimens are made. Properties and test methods that are suitable
    and essential to characterize PE moulding and extrusion materials are listed.
    The properties in this document have been selected from the general test methods
    in ISO 10350-1. Other test methods in wide use for or of particular significance
    to PE moulding and extrusion materials are also included in this document, as
    are the designatory properties specified in ISO 17855-1. Properties of slow crack
    growth, etc. are specified in documents of polyethylene (PE) materials for piping
    systems. The methods of preparation and conditioning, the specimen dimensions
    and the test procedures specified herein are used to obtain reproducible and comparable
    test results. Values determined will not necessarily be identical to those obtained
    using specimens of different dimensions or prepared using different procedures.
