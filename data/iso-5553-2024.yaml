abstract:
- language: en
  script: Latn
  content: This document specifies a method for the detection of linear condensed
    phosphates in meat and meat products by thin layer chromatographic separation.
    This document only applies to the detection of added condensed phosphates that
    are still present in the sample at the time of investigation, because condensed
    phosphates are gradually hydrolyzed by enzymes present in meat or meat products
    and during heat treatment of meat or meat products.
