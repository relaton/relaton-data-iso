abstract:
- language: en
  script: Latn
  content: ISO 18589-6:2009 provides a method that allows an estimation of gross radioactivity
    of alpha- and beta-emitters present in soil samples. ISO 18589-6:2009 applies,
    essentially, to systematic inspections based on comparative measurements or to
    preliminary site studies to guide the testing staff both in the choice of soil
    samples for measurement as a priority and in the specific analysis methods for
    implementation. The gross a or β radioactivity is generally different from the
    sum of the effective radioactivities of the radionuclides present since, by convention,
    the same alpha counting efficiency is assigned for all the alpha emissions and
    the same beta counting efficiency is assigned for all the beta emissions
