abstract:
- language: en
  script: Latn
  content: This standard provides guidelines for stakeholders on how to merge multiple
    related trade documents barcodes into one single barcode acting as envelope utilizing
    a barcode repository storing these barcodes, and it also provides guidelines on
    how to arrange the barcode repository storing these barcodes, which is technology-neutral
    to handle various barcodes. These guidelines can be used in carrying, presenting,
    merging or detaching, encoding or decoding multiple related trade documents barcodes.
    This standard is applicable to logistical, commercial, and regulatory documents
    in international trade and travel, as well as the scenarios where the trade documents
    use or could potentially use barcodes. This standard does not address the printing
    format or quality of barcodes, and the business operations of trade documents.
