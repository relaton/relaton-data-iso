abstract:
- language: en
  script: Latn
  content: This document specifies the properties and acceptance tolerances for bonded
    man-made mineral wool thermal insulating mats (batts and rolls). The mats specified
    in this document are only intended to be used for horizontal applications with
    unrestricted ventilation, where any excess of thickness recovery of the insulation
    mat will not restrict the essential ventilation space. See ISO 9774:2004, Figure 1
    for typical locations. The mineral wool mats which are specified in ISO 8144-1
    are primarily intended for use in applications where any excess of thickness must
    be limited. This document provides limiting values for most of the properties.
    These limiting values are for specification purposes only; design values can be
    derived from these by considering the environmental factors affecting the thermal
    performance of the product, the influence of the product properties on installation,
    and the effect of workmanship on the thermal performance. For converting declared
    R-values to design values, see ISO 10456. Mats can be supplied with a factory-applied
    facing, but facings are not covered by this document. In general, mats are not
    designed to support any applied load. For this reason, only the mechanical properties
    required for adequate handling during application are specified.
