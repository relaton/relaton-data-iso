abstract:
- language: en
  script: Latn
  content: ISO 18134-3:2015 describes the method of determining the moisture in the
    analysis test sample by drying in an oven. It is intended to be used for general
    analysis samples in accordance with EN 14780. The method described in this part
    of ISO 18134-3:2015 is applicable to all solid biofuels. The moisture content
    of solid biofuels (as received) is always reported based on the total mass of
    the test sample (wet basis). Since biofuels in small particle size are very hygroscopic,
    their moisture content will change with humidity in the atmosphere and therefore,
    the moisture of the test portion is determined simultaneously with determination
    of for example calorific value, carbon content, and nitrogen content. NOTE The
    term moisture content when used with biomass materials can be misleading since
    untreated biomass frequently contains varying amounts of volatile compounds (extractives)
    which can evaporate when determining the moisture content by oven drying (see
    References [1] and [2]).
