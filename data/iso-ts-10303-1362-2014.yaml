abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1362:2014-02 specifies the application module for Dimension
    and tolerance callouts. The following are within the scope of ISO/TS 10303-1362:2014-02:
    the representation of annotation elements in an explicit form used in technical
    drawings and annotated geometric models; the representation of annotation elements
    for dimension and dimensional tolerance callouts; the representation of annotation
    elements for geometric tolerance and datum feature callouts; the representation
    of annotation elements for surface condition callout; items within the scope of
    application module Associative draughting elements, ISO/TS 10303-1311; items within
    the scope of application module Draughting annotation, ISO/TS 10303-1206; items
    within the scope of application module Draughting element specialisations, ISO/TS
    10303-1312; items within the scope of application module Geometric tolerance,
    ISO/TS 10303-1051.'
