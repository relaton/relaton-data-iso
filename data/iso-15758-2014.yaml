abstract:
- language: en
  script: Latn
  content: ISO 15758:2014 specifies a method for calculating the density of the water
    vapour flow rate in cold pipe insulation systems, and the total amount of water
    diffused into the insulation over time. The calculation method presupposes that
    water vapour can only migrate into the insulation system by diffusion, with no
    contribution from airflow. It also assumes the use of homogeneous, isotropic insulation
    materials so that the water vapour partial pressure is constant at all points
    equidistant from the axis of the pipe. ISO 15758:2014 is applicable when the temperature
    of the medium in the pipe is above 0 °C. It applies to pipes inside buildings
    as well as in the open air.
