abstract:
- language: en
  script: Latn
  content: 'ISO/IEC TS 22237-3:2018 addresses power supplies to, and power distribution
    within, data centres based upon the criteria and classifications for "availability",
    "physical security" and "energy efficiency enablement" within ISO/IEC TS 22237‑1.
    ISO/IEC TS 22237-3:2018 specifies requirements and recommendations for the following:
    a) power supplies to data centres; b) power distribution systems within data centres;
    c) facilities for both normal and emergency lighting; d) equipotential bonding
    and earthing; e) lightning protection; f) devices for the measurement of the power
    consumption characteristics at points along the power distribution system and
    their integration within management tools. Safety and electromagnetic compatibility
    (EMC) requirements are outside the scope of this document and are covered by other
    standards and regulations. However, information given in this document may be
    of assistance in meeting these standards and regulations. Conformance of data
    centres to the present document is covered in Clause 4.'
