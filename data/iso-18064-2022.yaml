abstract:
- language: en
  script: Latn
  content: This document establishes a nomenclature system for thermoplastic elastomers
    based on the chemical composition of the polymer or polymers involved. It specifies
    symbols and abbreviated terms used to identify thermoplastic elastomers in industry,
    commerce, and government. It is not intended to conflict with, but to supplement,
    existing trade names and trademarks. NOTE 1   The name of the thermoplastic elastomer
    is intended to be used in technical papers and presentations followed by the abbreviated
    term used to designate the elastomer in this document. NOTE 2   Annex A gives
    thermoplastic-elastomer abbreviated terms that have been used in the past in materials
    standards, technical bulletins, textbooks, patents, and trade literature.
