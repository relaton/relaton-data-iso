abstract:
- language: en
  script: Latn
  content: This International Standard specifies a dynamic test method for mechanical
    hook-type connections and hook coupling devices, as well as a static test of their
    keeper plates. It is applicable to hooks meeting the requirements of ISO 6489-1
    used on towing vehicles with an unladen mass of up to 10 t. Towing vehicles with
    a greater unladen mass are nevertheless treated as 10 t towing vehicles, especially
    with regard to their reference mass.
