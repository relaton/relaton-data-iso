abstract:
- language: en
  script: Latn
  content: 'This document applies to high pressure die casting machines: a)      
    hot-chamber die casting machines (horizontal die closing system); b)       horizontal
    cold-chamber die casting machines (horizontal die closing system). This document
    applies to high pressure die casting units, i.e. high pressure die casting machines
    (HPDCM), and their interfaces with the following ancillary equipment: a)      
    die; b)       melting, holding and dosing furnaces (see ISO 13577-1:2016); c)       
    metal feeding equipment; d)       inserting and removal devices; e)       spraying
    appliances; f)         heating and cooling devices for the die. This ancillary
    equipment itself is not covered. Additional risks arising from the material being
    cast are not covered. This document does not apply to either low pressure die
    casting machines or gravity die casting machines, or both. This document deals
    with all significant hazards, hazardous situations and events relevant to pressure
    die casting machines when used as intended and under conditions of misuse which
    are reasonably foreseeable by the manufacturer (see Clause 4). This includes hazards
    coming from intentional interactions as well as unintentional but foreseeable
    interactions between movable parts of the machine and persons. This document provides
    the requirements to be met by the manufacturer to ensure the safety of persons
    and property during transport, commissioning, use, de-commissioning and maintenance
    periods, as well as in the event of foreseeable failures or malfunctions that
    can occur in the equipment.'
