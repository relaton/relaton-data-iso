abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1108:2014-02 specifies the application module for Specification
    based configuration. The following are within the scope of ISO/TS 10303-1108:2014-02:
    characterization of a use case of product or process data with a Boolean combinations
    of product characteristics; characterization of a design case of product or process
    data with a Boolean combinations of product characteristics; assignment of date-based
    effectivity to a use case; assignment of a use case to a part occurrence.'
