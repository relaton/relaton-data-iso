abstract:
- language: en
  script: Latn
  content: ISO 12819:2009 specifies two methods for determining the battery life of
    a battery-powered watch and specifies the labelling to be used by the manufacturers
    or the distributors to inform the users. According to the available information,
    either the theoretical battery life or the practical battery life must be calculated
    using the equations given in ISO 12819:2009.
