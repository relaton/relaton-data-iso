abstract:
- language: en
  script: Latn
  content: ISO 8499:2003 describes defects which commonly appear during the inspection
    of knitted fabrics.A defect is a fault that would reduce the expected performance
    of the knitted fabric or, if it appeared in a prominent position in an article
    made from the fabric, would readily be seen and rejected by a prospective purchaser.
    Except where otherwise stated the descriptions apply to defects appearing in both
    weft-knitted and warp-knitted fabrics.
