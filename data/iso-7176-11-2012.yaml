abstract:
- language: en
  script: Latn
  content: ISO 7176-11:2012 specifies requirements for test dummies of any mass greater
    than or equal to 25 kg, to be used in the evaluation of wheelchairs. ISO 7176-11:2012
    provides formulae that specify the location of the overall centre of mass of test
    dummies, the masses of the segments that comprise the test dummies and the locations
    of pivots that connect the segments. It also specifies the characteristics of
    loading pads that support the segments. ISO 7176-11:2012 is intended to enable
    the construction of test dummies that will produce comparable results for stability,
    performance and durability testing of manual wheelchairs and electrically powered
    wheelchairs, including scooters. ISO 7176-11:2012 also includes informative tables
    of mass and locations of centre of mass, which are derived from the formulae,
    corresponding to example test dummy masses up to 300 kg in 25 kg increments.
