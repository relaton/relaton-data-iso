abstract:
- language: en
  script: Latn
  content: This document describes the most commonly used test methods considered
    in standardization work relating to scratch and abrasion resistance of plastic
    spectacle lenses along with their technical capacities and limitations. It includes
    the ISO test method for assessment of claims for basic abrasion resistance in
    ISO 8980-5. This document is intended to be of benefit to any future interest
    in ISO standardization on scratch and abrasion resistance of spectacle lenses.
