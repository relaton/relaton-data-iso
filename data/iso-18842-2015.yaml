abstract:
- language: en
  script: Latn
  content: ISO 18842:2015 describes methods for the determination of tapped and untapped
    bulk density of smelter grade aluminium oxide primarily used for the production
    of aluminium. Methods using the fall of sample into a receptacle have been found
    to be sensitive to flow rate variations, which are caused by physical properties
    of the aluminium oxide. ISO 18842:2015 minimizes flow rate variations.
