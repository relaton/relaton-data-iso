abstract:
- language: en
  script: Latn
  content: ISO 17491-3:2008 specifies a test method for determining the resistance
    of protective clothing against penetration by a jet of liquid. ISO 17491-3:2008
    is applicable to clothing with liquid-tight connections between different parts
    of the clothing and, if applicable, between the clothing and other items of personal
    protective equipment worn with it. ISO 17491-3:2008 does not address chemical
    permeation resistance of the clothing materials, which is specified in other standards.
