abstract:
- language: en
  script: Latn
  content: ISO 22891:2013 specifies a method for the calculation of transmittance
    based upon diffuse reflectance measurements. The use of the method is restricted
    to white and near-white translucent papers (see 3.9). If it is necessary to determine
    the transmittance of papers which contain fluorescent whitening agents, the fluorescence
    emission is eliminated using the prescribed UV cut-off filter.
