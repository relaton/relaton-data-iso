abstract:
- language: en
  script: Latn
  content: ISO 23601:2009 establishes design principles for displayed escape plans
    that contain information relevant to fire safety, escape, evacuation and rescue
    of the facility's occupants. These plans may also be used by intervention forces
    in case of emergency. These plans are intended to be displayed as signs in public
    areas and workplaces. ISO 23601:2009 is not intended to cover the plans to be
    used by external safety services nor detailed professional technical drawings
    for use by specialists.
