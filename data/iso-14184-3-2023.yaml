abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the amount of free formaldehyde
    and formaldehyde extracted partly through hydrolysis by means of an extraction
    method. The method can be applied for the testing of textile fibres, fabrics or
    yarns. NOTE            This method, based on liquid chromatography (LC), is selective
    and not sensitive to coloured extracts and is intended to be used for precise
    quantification of formaldehyde.
