abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the determination of the ability
    of diaper coverstock to resist the transport back onto the skin of a liquid which
    has already penetrated the coverstock. This test corresponds with repeated liquid
    strike-through time according to NWSP 070.7. This test method is intended for
    quality control and is designed for comparison of wetback for different nonwoven
    coverstocks and treatments. It does not simulate in use conditions for finished
    products.
