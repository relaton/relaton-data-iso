abstract:
- language: en
  script: Latn
  content: ISO 17871:2015 in conjunction with ISO 10297:2014 and ISO 14246:2014 specifies
    design, type testing, marking and manufacturing tests, and examinations requirements
    for quick-release cylinder valves intended to be fitted to refillable transportable
    gas cylinders which convey non-toxic, non-oxidizing, and non-corrosive compressed
    or liquefied gases or extinguishing agents charged with compressed gases to be
    used for fire-extinguishing, explosion protection, and rescue applications. ISO
    17871:2015 covers the function of a quick-release cylinder valve as a closure.
    ISO 17871:2015 does not apply to quick-release cylinder valves for cryogenic equipment,
    for portable fire extinguishers, or for liquefied petroleum gas (LPG).
