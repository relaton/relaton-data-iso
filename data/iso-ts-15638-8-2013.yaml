abstract:
- language: en
  script: Latn
  content: 'ISO/TS 15638-8:2013 addresses the provision of ?Vehicle Access Management''
    (and monitoring) and specifies the form and content of such data required to support
    such systems, and access methods (4.3) to that data. ISO/TS 15638-8:2013 provides
    specifications (4.50) for common communications and data exchange aspects of the
    application service (4.6) vehicle access monitoring that a regulator (4.43) may
    elect to require or support as an option, including: a) high level definition
    of the service that a service provider (4.48) has to provide, (The service definition
    describes common service elements; but does not define the detail of how such
    an application service (4.6) is instantiated, not the acceptable value ranges
    of the data concepts defined) b) means to realise the service c) application data,
    naming content and quality that an IVS (4.29) has to deliver. The definition of
    what comprises a ?regulated'' service is regarded as an issue for national decision,
    and may vary from jurisdiction (4.33) to jurisdiction. This document does not
    impose any requirements on nations in respect of which services for regulated
    vehicles jurisdictions will require, or support as an option, but provides standardised
    sets of requirements descriptions for identified services to enable consistent
    and cost efficient implementations where instantiated. ISO 15638 has been developed
    for use in the context of regulated commercial freight vehicles [hereinafter referred
    to as ''regulated vehicles'' (4.42)]. There is nothing, however, to prevent a
    jurisdiction extending or adapting the scope to include other types of regulated
    vehicles, as it deems appropriate.'
