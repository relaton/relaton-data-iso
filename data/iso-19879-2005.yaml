abstract:
- language: en
  script: Latn
  content: ISO 19879:2005 specifies uniform methods for the testing and performance
    evaluation of metallic tube connections, stud ends for ports and flange connections
    for use in hydraulic fluid power applications. This International Standard does
    not apply to the testing of hydraulic quick-action couplings. Tests outlined in
    ISO 19879:2005 are independent of each other and document the method to follow
    for each test. See the appropriate component International Standard for which
    tests to conduct and for performance criteria. For qualification of the connector,
    the minimum number of samples specified in this International Standard are tested,
    unless otherwise specified in the relevant connector standard or as agreed upon
    by the manufacturer and the user.
