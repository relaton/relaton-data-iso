abstract:
- language: en
  script: Latn
  content: ISO 10439-2:2015 specifies minimum requirements and gives recommendations
    for axial compressors, single-shaft, and integrally geared process centrifugal
    compressors and expander-compressors for special purpose applications that handle
    gas or process air in the petroleum, petrochemical, and natural gas industries.
    ISO 10439-2:2015 specifies requirements for non-integrally geared centrifugal
    and axial compressors, in addition to the general requirements specified in ISO
    10439-1. These machines do not have gears integral with their casing but can have
    external gears.
