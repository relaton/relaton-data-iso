abstract:
- language: en
  script: Latn
  content: This document specifies two accelerated corrosion test methods. These methods
    assess the corrosion resistance of products containing copper in environments
    where there is a significant influence of chloride ions, mainly as sodium chloride
    from a marine source or winter road de-icing salt, as well as the influence of
    corrosion-promoting gases from industrial or traffic air pollution. This document
    specifies both the test apparatus and test procedures to be used in executing
    the accelerated corrosion tests. The methods are especially suitable for assessing
    the corrosion resistance of sensitive products with metals, e.g. electronic components,
    used in traffic and industrial environments.
