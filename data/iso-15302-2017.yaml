abstract:
- language: en
  script: Latn
  content: ISO 15302:2017 specifies a method for the determination of benzo[a]pyrene
    in crude or refined edible oils and fats by reverse-phase high performance liquid
    chromatography (HPLC) using fluorimetric detection in the range 0,1 µg/kg to 50
    µg/kg. Milk and milk products (or fat coming from milk and milk products) are
    excluded from the scope of this document.
