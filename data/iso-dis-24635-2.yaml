abstract:
- language: en
  script: Latn
  content: 'This standard specifies a training model for minimizing the gap between
    the project organization''s deliverables and the project''s target performance,
    as defined in "The corpus annotation project management -part 1: Core model".
    Accordingly, to improve the quality of the corpus annotations resulting from the
    corpus annotation project, the training process and content for workers involved
    in the project will include the following topics: contents of the corpus annotation
    project, qualifying participants, and workflows across tasks and work packages'
