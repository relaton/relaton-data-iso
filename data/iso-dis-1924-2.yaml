abstract:
- language: en
  script: Latn
  content: ISO 1924-2:2008 specifies a method for measuring the tensile strength,
    strain at break and tensile energy absorption of paper and board, using a testing
    machine operating at a constant rate of elongation (20 mm/min). ISO 1924-2:2008
    also specifies equations for calculating the tensile index, the tensile energy
    absorption index and the modulus of elasticity. Testing in conformance with ISO
    1924-2:2008 always includes the measurement of tensile strength. Measurement or
    calculation of other properties is subject to agreement between the parties concerned.
    ISO 1924-2:2008 is applicable to all papers and boards, including papers with
    a high strain at break if the results are within the capacity of the testing machine.
    It also applies to the components of corrugated board but not, however, to corrugated
    board itself.
