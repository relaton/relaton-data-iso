abstract:
- language: en
  script: Latn
  content: 'ISO 9917-1:2003 specifies requirements and test methods for powder/liquid
    acid-base dental cements intended for permanent cementation, lining and restoration.
    It is applicable to both hand-mixed cements and encapsulated cements for mechanical
    mixing. It specifies limits for each of the properties according to whether the
    cement is intended for use as a luting agent, a restorative material, a base or
    a liner. Specific qualitative and quantitative requirements for freedom from biological
    hazard are not included in this part of ISO 9917, but it is recommended that,
    in assessing possible biological or toxicological hazards, reference should be
    made to ISO 7405, Dentistry -- Preclinical evaluation of biocompatibility of medical
    deviced used in dentistry -- Test methods for dental materials, and ISO 10993-1,
    Biological evaluation of medical devices -- Part 1: Evaluation and testing.'
