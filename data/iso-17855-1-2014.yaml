abstract:
- language: en
  script: Latn
  content: ISO 17855-1:2014 establishes a system of designation for polyethylene thermoplastic
    material, which may be used as the basis for specifications. ISO 17855-1:2014
    is applicable to all polyethylene homopolymers and to copolymers of ethylene having
    a content of other 1-olefinic monomers of less than 50 % (mass fraction) and a
    content of non-olefinic monomers with functional groups up to a maximum of 3 %
    (mass fraction). ISO 17855-1:2014 applies to materials ready for normal use in
    the form of powder, granules or pellets, unmodified or modified by colorants,
    additives, fillers, etc.
