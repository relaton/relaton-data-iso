abstract:
- language: en
  script: Latn
  content: Mechanically laminated timber (MLT) is an engineered wood product that
    is intended for structural applications subjected to out-of-plane loading. The
    MLT layups contain lumber laminations connected to parallel to each other along
    adjacent laminations on the wide face using either steel metal or wooden fasteners,
    with the laminations loaded on edge. The fibre directions of all laminations within
    MLT are parallel to each other. The proposed standard will address the production
    and qualification requirements for MLT. It will provide qualification paths for
    prescriptive MLT products with standard layups and custom MLT products with proprietary
    layups.
