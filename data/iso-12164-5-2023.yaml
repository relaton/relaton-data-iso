abstract:
- language: en
  script: Latn
  content: 'This document specifies the dimensions of hollow taper shanks with flange
    contact surface (HSK). These shanks are the male part of the interface to the
    machine tools (e.g. milling/drilling and grinding machines). This document specifies
    three types of shanks: —     types AS and ES have a peripherally grooved flanges
    for automatic tool change; —     type CS has a flange without peripheral groove
    and can only be changed manually. HSK types AS and ES can also be changed manually
    via radial bore holes in the hollow shank taper. This document provides information
    for dynamically balanced HSK‑AS and HSK‑CS shanks balancing according to ISO 16084.'
