abstract:
- language: en
  script: Latn
  content: ISO 17492:2003 specifies a test method for measuring the heat transfer
    of horizontally mounted flame-resistant textile materials when exposed to a combination
    of convective and radiant energy. This test method can be used for any type of
    sheet material used either as a single layer or in a multilayer construction when
    all structures or sub-assemblies are made of flame-resistant materials. It is
    not intended to be used on materials that are not flame resistant. This test method
    is not intended for evaluating materials exposed to any other type of thermal-energy
    sources, such as radiant heat only or flame contact only. Use ISO 6942 when evaluating
    heat-transfer through materials due to radiant heat only and use ISO 9151 when
    evaluating heat-transfer through materials due to flame contact only. ISO 17492:2003
    should be used to measure and describe the properties of materials, products or
    assemblies in response to both convective and radiant energy under controlled
    laboratory conditions and should not be used to describe or appraise the fire
    hazard or fire risk of materials, products or assemblies under actual fire conditions.
    However, the results of this test method may be used as elements of a fire-risk
    assessment which takes into account all of the factors which are pertinent to
    an assessment of the fire hazard of a particular end use.
