abstract:
- language: en
  script: Latn
  content: This part of ISO 197 defines terms relating to wrought products (rod/bar,
    wire, drawing stock, tube, profile, sheet, strip, foil, forging stock, forging,
    blank, circle and slug), produced by hot and/or cold plastic deformation processes
    (such as extruding, forging, hot rolling, cold rolling or drawing). An annex gives
    explanatory notes concerning classification principles of some definitions.
