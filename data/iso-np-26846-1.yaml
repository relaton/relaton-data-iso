abstract:
- language: en
  script: Latn
  content: This document specifies the classification, definition, and measurement
    of external adverse weather conditions that affect perception sensors for automotive
    surroundings supporting assisted or automated driving functions. This document
    includes specifications for equipment to measure characteristics of specific adverse
    weather conditions. This document applies to any automotive perception sensors
    (e.g., LiDAR, RGB/FIR cameras, millimeter-wave radar) used to measure or detect
    the surroundings of the vehicle. This document contains the terminology and general
    requirements for the series of standards on automotive perception sensor performance
    under adverse weather conditions.
