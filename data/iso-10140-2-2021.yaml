abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory method for measuring the airborne
    sound insulation of building products, such as walls, floors, doors, windows,
    shutters, façade elements, façades, glazing, small technical elements, for instance
    transfer air devices, airing panels (ventilation panels), outdoor air intakes,
    electrical raceways, transit sealing systems and combinations, for example walls
    or floors with linings, suspended ceilings or floating floors. The test results
    can be used to compare the sound insulation properties of building elements, classify
    elements according to their sound insulation capabilities, help design building
    products which require certain acoustic properties and estimate the in situ performance
    in complete buildings. The measurements are performed in laboratory test facilities
    in which sound transmission via flanking paths is suppressed. The results of measurements
    made in accordance with this document are not applicable directly to the field
    situation without accounting for other factors affecting sound insulation, such
    as flanking transmission, boundary conditions and total loss factor.
