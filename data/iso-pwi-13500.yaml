abstract:
- language: en
  script: Latn
  content: ISO 13500:2008 covers physical properties and test procedures for materials
    manufactured for use in oil- and gas-well drilling fluids. The materials covered
    are barite, haematite, bentonite, nontreated bentonite, OCMA-grade bentonite,
    attapulgite, sepiolite, technical-grade low-viscosity carboxymethylcellulose (CMC‑LVT),
    technical-grade high-viscosity carboxymethylcellulose (CMC-HVT), starch, low-viscosity
    polyanionic cellulose (PAC-LV), high-viscosity polyanionic cellulose (PAC-HV)
    and drilling-grade Xanthomonas campestris (Xanthan gum). ISO 13500:2008 is intended
    for the use of manufacturers of named products.
