abstract:
- language: en
  script: Latn
  content: 'La présente partie de l''ISO/CEI 9318 décrit l''interface de niveau logique
    3 (niveau générique) pour les unités de bandes magnétiques. Voir l''article 6
    de l''ISO/CEI 9318-1 pour une explication des niveaux. Les caractéristiques physiques,
    électriques et celles de la configuration ainsi que les protocoles de transmission
    de cette interface sont conformes à l''ISO/CEI 9318-1. L''interface est capable
    de gérer les vitesses de transfert de données de 0 à 10 Moctets/s, en fonction
    de la classe du contrôleur et du récepteur. L''objet de la présente partie de
    l''ISO/CEI 9318 est de faciliter le développement et l''utilisation d''une interface
    intelligente qui permet la connexion à un contrôleur de périphériques de plusieurs
    types tels que disques, imprimantes, bandes, communications. La présente partie
    de l''ISO/CEI 9318 ne remplace pas des normes existantes mais apporte un complément
    aux autres normes d''interface pour périphériques intelligents (IPI) (voir article
    2). La présente partie de l''ISO/CEI 9318 fournit une définition d''une partie
    générique appareil, d''une famille de normes appelées «interface pour périphériques
    intelligents (IPI)», interface parallèle tous usages, à hautes performances. L''intention
    de IPI est d''isoler l''hôte (CPR), autant du point de vue matériel que logiciel,
    des changements dans les périphériques, en fournissant un jeu de commandes de
    «fonctions géné 1585riques» permettant le connexion de multiples types de périphériques
    (disques, imprimantes, bandes, communications). Pour assouplir la transition entre
    la méthode actuelle et l''approche générique, IPI supporte des jeux de commandes
    spécifiques à un appareil, comme celui-ci, pour aider à établir une passerelle
    entre les deux approches. Pour réaliser cet ensemble d''objectifs, la définition
