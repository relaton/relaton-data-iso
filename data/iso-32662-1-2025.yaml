abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the content of
    undissolved substances, referred to as total contamination, in middle distillates,
    in diesel fuels containing a volume fraction of up to 30 % fatty acid methyl esters
    (FAME). The working range is from 12 mg/kg to 26 mg/kg and it was established
    in an interlaboratory study by applying ISO 4259-1[4]. This document in general
    is applicable to products having a kinematic viscosity not exceeding 8 mm2/s at
    20 °C, or 5 mm2/s at 40 °C. This test method can be used for paraffinic diesel
    fuels as specified in EN 15940, for diesel fuels containing a volume fraction
    of more than 30 % FAME and for petroleum products having a kinematic viscosity
    exceeding 8 mm2/s at 20 °C, or 5 mm2/s at 40 °C, however in such cases the precision
    of the test method has not been determined. WARNING — The use of this document
    can involve hazardous materials, operations and equipment. This document does
    not purport to address all of the safety problems associated with its use. It
    is the responsibility of the user of this document to establish appropriate safety
    and health practices and determine the applicability of regulatory limitations
    prior to use.
