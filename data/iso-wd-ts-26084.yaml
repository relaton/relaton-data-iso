abstract:
- language: en
  script: Latn
  content: This document specifies the impact performance test methods for load-bearing
    components (including tubes, connectors, and platforms) of fiber-reinforced polymer
    (FRP) small modular scaffolds within the temperature range of -40℃ to 0℃. This
    document applies to glass fiber reinforced polymer (GFRP) or carbon fiber reinforced
    polymer (CFRP) composites used in load-bearing components of small modular scaffolds,
    such as uprights, ledgers, and platforms.
