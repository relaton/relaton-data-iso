abstract:
- language: en
  script: Latn
  content: ISO 16844-4:2004 specifies the CAN (controller area network) interface
    for the interchange -- performed in accordance ISO 16844-6 -- of digital information
    between a road vehicle's tachograph system and vehicle units, and within the tachograph
    system itself. It specifies parameters of, and requirements for, the physical
    and data link layers of the electrical connection used in the electronic systems.
