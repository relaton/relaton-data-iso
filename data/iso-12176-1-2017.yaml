abstract:
- language: en
  script: Latn
  content: ISO 12176-1:2017 specifies the general characteristics of, and performance
    requirements for, equipment for butt fusion jointing of polyethylene (PE) piping
    systems using electrically powered heater plates. ISO 12176-1:2017 is applicable
    to mechanical and pressure-activated equipment for butt fusion jointing of PE
    pipes and fittings either intended to be used for the supply of gaseous fuels,
    conforming to ISO 4437‑2[1] and ISO 4437‑3[2], or intended for the conveyance
    of water for human consumption (including raw water prior to treatment) and for
    the conveyance of water for general purposes, conforming to ISO 4427‑2[3] and
    ISO 4427‑3[4]. Butt fusion machines with an automatic controller are subject to
    additional requirements as given in Annex A. NOTE This document is also applicable
    to butt fusion machines for larger nominal pipe diameters and nominal wall thicknesses
    than given in this document.
