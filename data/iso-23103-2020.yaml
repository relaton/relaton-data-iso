abstract:
- language: en
  script: Latn
  content: '1.1.1 This Recommended Standard defines, in an abstract manner, a CSTS
    in terms of: a) the procedures necessary to provide the service; b) the states
    of the service; c) the behavior of each procedure; d) the states of the procedures;
    e) the operations necessary to constitute the procedures; and f) the parameters
    associated with each operation. 1.1.2 It does not specify: a) individual application
    services, implementations, or products; b) the implementation of entities or interfaces
    within real systems; c) the methods or technologies required to acquire data;
    d) the methods or technologies required to provide a suitable environment for
    communications; or e) the management activities required to schedule and configure
    services.'
