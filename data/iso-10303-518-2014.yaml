abstract:
- language: en
  script: Latn
  content: ISO 10303-518:2014 specifies the integrated resource constructs for mechanical
    design shaded presentation. ISO 10303-518:2014 specifies the use of ISO 10303
    application interpreted construct satisfying the requirements for mechanical design
    shaded presentations. ISO 10303-518:2014 is mainly based on ISO 10303-46. Point,
    curve, and surface styles may be specified for the constituents of any shape representation.
    Shading and surface characteristics, such as reflectance and transparency are
    included. The concept of layers is out of scope, as is the representation of text.
