abstract:
- language: en
  script: Latn
  content: 'This proposed International Standard specifies test methods and performance requirements for polymeric foam core substrate boards used beneath ceramic tile finishes. It applies to boards with: • Foam cores such as XPS, EPS, PU, or similar; • Cementitious, mineral, or polymer modified facings and thermoplastic-based plastic sheets; • Intended application as tile backer boards, wet area construction panels, or substrates for bonded waterproofing systems. Excluded: • Products used solely as thermal insulation; • Boards without facers; • Panels not intended to receive ceramic tile finishes; • Non foam core board products.'
