abstract:
- language: en
  script: Latn
  content: 'This second edition cancels and replaces the first edition (1984). Specifies
    the requirements for a range of connector units. Each unit consists of the following
    components: shackle type connector, connector bolt, connector nut. It does not
    indicate a complete design, but it gives sufficient detail to ensure dimensional
    compatibility with chains complying with ISO 610 and scraper bars complying with
    ISO 5612.'
