abstract:
- language: en
  script: Latn
  content: ISO 19600:2014 provides guidance for establishing, developing, implementing,
    evaluating, maintaining and improving an effective and responsive compliance management
    system within an organization. The guidelines on compliance management systems
    are applicable to all types of organizations. The extent of the application of
    these guidelines depends on the size, structure, nature and complexity of the
    organization. ISO 19600:2014 is based on the principles of good governance, proportionality,
    transparency and sustainability.
