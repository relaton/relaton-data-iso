abstract:
- language: en
  script: Latn
  content: ISO 23160:2011 specifies tests for the evaluation of the resistance of
    watch cases and their bracelets to wear, scratching and impacts occurring when
    wearing the watch. ISO 23160:2011 is applicable mainly to complete watch cases
    fitted with bracelets. However, certain tests can be applied to the watch case
    only, to the complete or partial bracelet, or to specially prepared samples.
