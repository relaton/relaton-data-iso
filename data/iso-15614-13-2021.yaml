abstract:
- language: en
  script: Latn
  content: 'This document specifies tests for the qualification of welding procedure
    specifications applicable to upset (resistance butt) welding and flash welding
    of metallic materials, e.g. with solid, tubular, flat or circular cross-section.
    Its basic principles can also be applied to other resistance welding processes
    when this is stated in the specification. This document defines the conditions
    for carrying out tests and the limits of validity of a qualified welding procedure
    for all the practical welding operations that it covers. It covers the following
    resistance welding processes, as defined in ISO 4063: —    24 flash welding, using
    direct current or alternating current with various movement sequences, constant
    flashing and pulsed flashing; —    25 resistance upset welding, using direct current
    or alternating current with various pressure sequences.'
