abstract:
- language: en
  script: Latn
  content: 'This document specifies performance, test methods, controls, control forces
    and component strength for brake systems fitted to the following, as defined in
    ISO 5053-1: powered industrial trucks of all capacities; towing and pushing tractors
    up to and including 66 750 N drawbar pull (hereafter referred to as industrial
    tractors); burden carriers; and industrial trucks handling freight containers.
    Loss of electrical power and loss of any other form of power assistance is not
    covered by this document. Braking systems used in emergency situations (e.g. activating
    the emergency switch or control system shut down) are not covered in this document.
    This document only includes requirements for newly manufactured trucks.'
