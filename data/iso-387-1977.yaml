abstract:
- language: en
  script: Latn
  content: Glass hydrometers of constant mass which do not incorporate a thermometer
    are considered. Basis of scale, reference temperature, surface tension and reference
    levels for adjustment and reading are specified. In annex A the standard categories
    of surface tension are tabled, and annex B deals with the adoption of density
    as preferred basis of scale.
