abstract:
- language: en
  script: Latn
  content: This document specifies best practices for considering body size and shape
    (anthropometry) in design. Since most products, tasks, and environments interact
    with multiple user attributes at the same time, multivariate design techniques
    are necessary to obtain accurate accommodation estimates. Although the approach
    outlined can also incorporate user preference unrelated to anthropometry, the
    focus in this document is on “fit” and the spatial accommodation of users.
