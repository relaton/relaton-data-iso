abstract:
- language: en
  script: Latn
  content: This document specifies two methods for establishing the minimum air volume
    flow rate. One method is dedicated for use with captor hoods, nozzles and slot
    nozzles with a ratio of slot length to hose diameter of 8:1 or less. The other
    method is dedicated for use with on-gun extraction devices. These methods are
    not applicable to down draught tables.
