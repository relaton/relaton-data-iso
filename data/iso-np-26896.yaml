abstract:
- language: en
  script: Latn
  content: THIS DOCUMENT SPECIFIES SAFETY REQUIREMENTS, OPERATIONAL CONDITIONS, AND
    TEST PROCEDURES FOR AUTOMATED VEHICLE MARSHALLING SYSTEMS (AVMS) USED IN PROTECTED
    OPERATIONAL AREAS. THIS DOCUMENT ADDRESSES THE COORDINATION OF VEHICLE, INFRASTRUCTURE,
    COMMUNICATION AND OPERATIONAL MANAGEMENT FUNCTIONS NECESSARY FOR AUTOMATED VEHICLE
    MARSHALLING. TYPICAL APPLICATIONS INCLUDE VEHICLE PRODUCTION PLANTS, LOGISTICS
    YARDS, PORT YARDS, DEALER FACILITIES AND OTHER PROTECTED OPERATIONAL AREAS.
