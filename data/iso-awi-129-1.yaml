abstract:
- language: en
  script: Latn
  content: This document establishes the general principles for presentation of dimensions
    and associated tolerances that apply to 2D technical drawings in all disciplines
    and trades but which can also be applied to 3D applications, applications (mainly
    in the mechanical engineering discipline). Where applicable, 2D and 3D figures
    are included to illustrate the same dimensioning rules.  This document does not
    cover the application of dimensional tolerances and their meaning. See ISO 14405‑1
    for tolerancing principles. This document can only be used to describe the nominal
    model of a drawing, not the non-ideal surface model (skin model) used for tolerancing
    purposes (for more information on tolerancing specifications, see the list of
    ISO GPS standards listed as normative reference or as bibliography). Considering
    the ISO 14405 series, the presentation of tolerance indication is unambiguous
    when it is applied to a dimension which is a size and ambiguous when the dimension
    is not a size. All rules presented in this document are available for any type
    of drawing (see ISO 29845). In addition, this document introduces the concept
    of property indicators, developed length, between, surface indicators, flagnotes
    and textual instructions. NOTE Additional information and details for construction
    engineering are given in ISO 6284.
