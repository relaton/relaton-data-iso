abstract:
- language: en
  script: Latn
  content: ISO/TS 8062-2:2013 gives the rules for geometrical dimensioning and tolerancing
    of final moulded parts and parts machined out of moulded parts. It also gives
    rules and conventions for the indications of these requirements in technical product
    documentation and specifies the proportions and dimensions of the graphical symbols
    to be used. ISO/TS 8062-2:2013 provides symbols which may be used to identify
    the relative completeness of the moulded features and parts. These graphical symbols
    should not be confused with the graphical symbols for surface texture according
    to ISO 1302, which are notably larger.
