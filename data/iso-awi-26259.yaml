abstract:
- language: en
  script: Latn
  content: 'This document specifies methods for defining scope and requirements for Producer Responsibility Organizations in char
    ge of administering EPR schemes. This document also provides EPR schemes with
    guidelines relating to: ● The role of Producer Responsibility Organizations (PROs)
    ● responsibilities and governance ● defining the boundary of responsibility of the PRO under the EPR scheme (e.g.
    circular value creation, value retentioin and value recovery) as defined by EPR provisions of regulations
    ● establish the optimal governing structure (PRO or other) which delivers the
    highest value to stakeholders ● financial/fiscal transparency (e.g. financing,
    repayment, reporting thresholds) ● minimum reporting requirements from producer
    to PRO (e.g. contents, timelines, formats) ● measurements (e.g. weights, volumes,
    metric) ● marking/labelling, ● ecomodulation ● measures for stimulating and informing
    end consumers and markets in line with existing legislative requirements. This
    document does not address topics already covered by standards related to specific
    sectors and/or product groups.'
