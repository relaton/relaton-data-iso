abstract:
- language: en
  script: Latn
  content: Establishes general principles for the design and application of safety
    signs and hazard pictorials permanently affixed to tractors, machinery for agriculture
    and forestry, and powered lawn and garden equipment as defined in ISO 3339-0 and
    ISO 5395. Outlines safety sign objectives, describes the basic safety sign formats
    and colours, and provides guidance on developing the various panels that together
    constitute a safety sign.
