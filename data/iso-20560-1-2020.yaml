abstract:
- language: en
  script: Latn
  content: This document specifies safety information for overground piping systems
    related to the content of the piping system and associated hazards for the purpose
    of accident prevention, reducing risks to health and providing information for
    use in case of an emergency. This document does not cover piping that is buried.
    Safety signing of the hazards in an area is not part of this document. This document
    can also be used for marine structures and ships.
