abstract:
- language: en
  script: Latn
  content: 'The requirements of ISO 16736:2006 govern the application of explicit
    algebraic equation sets to the calculation of specific characteristics of ceiling
    jet flows. ISO 16736:2006 is an implementation of the general requirements provided
    in ISO/TR 13387-3 for the case of fire dynamics calculations involving sets of
    explicit algebraic equations. ISO 16736:2006 is arranged in the form of a template,
    where specific information relevant to algebraic ceiling-jet-flow equations is
    provided to satisfy the following types of general requirements: description of
    physical phenomena addressed by the calculation method; documentation of the calculation
    procedure and its scientific basis; limitations of the calculation method; input
    parameters for the calculation method; domain of applicability of the calculation
    method. Examples of sets of algebraic equations meeting all the requirements of
    ISO 16736:2006 are provided for each different type of ceiling jet flow, including
    those for quasi-steady state axisymmetric ceiling jet flows.'
