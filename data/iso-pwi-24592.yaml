abstract:
- language: en
  script: Latn
  content: This standard prescribes rules for rounding off numerical values for the
    purpose of reporting results of a test, an analysis, a measurement or a calculation,
    and thus assisting in drafting specifications. It also makes recommendations as
    to the number of figures that should be retained in course of computation. The
    scope of ISO/TC 69 is standardization in the application of statistical methods,
    including generation, collection (planning and design), analysis, presentation
    and interpretation of data, and includes presentation and interpretation of data.
    This NWIP in essence guides for presenting the result of measurement, test or
    of a calculation in rounded off form thus helps in interpretation of result, data.
    Also ISO/TC 69/SC6 deals with measurement methods and results. This standard falls
    in category of ‘Measurement methods and results’ as rounding off is applicable
    to the measurement result before reporting.
