abstract:
- language: en
  script: Latn
  content: This document specifies the fire resistance requirements and testing methods
    for fire barriers for railway vehicles. The objective of the measures and requirements,
    specified in this document, is to protect passengers and staff in railway vehicles
    in the event of a developing fire on board. Use of a Fire Containment and Control
    System, where permitted as an alternative to a fire barrier, is not in the scope
    of this document. It is not within the scope of this document to describe measures
    that ensure the preservation of the railway vehicles in the event of a fire.
