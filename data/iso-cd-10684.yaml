abstract:
- language: en
  script: Latn
  content: ISO 10684:2004 specifies material, process, dimensional and some performance
    requirements for hot dip spun galvanized coatings applied to coarse threaded steel
    fasteners from M8 up to and including M64 and for property classes up to and including
    10.9 for bolts, screws and studs and 12 for nuts. It is not recommended to hot
    dip galvanize threaded fasteners in diameters smaller than M8 and/or with pitches
    below 1,25 mm. ISO 10684:2004 primarily concerns the spun hot dip galvanizing
    of threaded steel fasteners, but it may also be applied to other threaded steel
    parts. The specifications given in this document may also be applied to non-threaded
    steel parts such as washers.
