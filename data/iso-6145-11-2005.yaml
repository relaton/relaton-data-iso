abstract:
- language: en
  script: Latn
  content: ISO 6145-11:2005 specifies a method for the preparation of calibration
    gas mixtures by using electrochemical generation of a calibration component and
    introduction into a complementary gas flow. By alteration of the gas flow or the
    charge passed through the cell electrolyte, it is possible to change the composition
    of the gas mixture. The relative expanded uncertainty of the calibration gas content,
    U, obtained by multiplying the relative combined standard uncertainties by a coverage
    factor, k = 2, is not greater than 5 %. The method described in ISO 6145-11:2005
    is intended to be applied to the preparation of calibration gas mixtures in the
    volume fraction ranges (0,1 to 250) x 10-6.
