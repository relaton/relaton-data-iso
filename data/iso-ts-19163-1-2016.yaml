abstract:
- language: en
  script: Latn
  content: ISO/TS 19163-1:2016 classifies imagery and regularly spaced gridded thematic
    data into types based on attribute property, sensor type and spatial property,
    and defines an encoding-neutral content model for the required components for
    each type of data. It also specifies logical data structures and the rules for
    encoding the content components in the structures. The binding between the content
    and a specific encoding format will be defined in the subsequent parts of ISO
    19163. ISO/TS 19163-1:2016 does not address LiDAR, SONAR data and ungeoreferenced
    gridded data. The logical data structures and the rules for encoding the content
    components will be addressed in the subsequent parts of ISO 19163.
