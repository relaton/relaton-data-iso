abstract:
- language: en
  script: Latn
  content: 1.1 This International Standard specifies the procedure for determining
    the relative resistance of stainless steels and nickel-base alloys to stress corrosion
    cracking in a sodium chloride drop evaporation system. 1.2 The method results
    in a threshold stress to fracture, the magnitude of which can be used to rank
    the relative performance of different alloys for this environment.
