abstract:
- language: en
  script: Latn
  content: ISO/TS 13725:2016 specifies a method for the evaluation of the buckling
    load which a) takes into account a geometric model of the hydraulic cylinder,
    meaning it does not treat the hydraulic cylinder as an equivalent column, b) can
    be used for all types of cylinder mounting and rod end connection specified in
    Table 2, c) includes a factor of safety, k, to be set by the person performing
    the calculations and reported with the results of the calculations, d) takes into
    account possible off-axis loading, e) takes into account the weight of the hydraulic
    cylinder, meaning it does not neglect all transverse loads applied on the hydraulic
    cylinder, f) can be implemented as a simple computer program, and g) considers
    the cylinder fully extended. The method specified is based on the elastic buckling
    theory and is applicable to single and double acting cylinders that conform to
    ISO 6020 (all parts), ISO 6022 and ISO 10762. If necessary, finite element analyses
    can be used to verify as well as to determine the buckling load. The method is
    not developed for thin-walled cylinders, double-rods or plunger cylinders. The
    method is not developed for internal (rod) buckling. The friction of spherical
    bearings is not taken into account. NOTE This method is based mainly on original
    work by Fred Hoblit.[2] This method has been established in reference to the standard
    NF PA/T3.6.37.[1]
