abstract:
- language: en
  script: Latn
  content: ISO 4121:2003 provides guidelines describing quantitative response scales
    (where the response obtained indicates the intensity of perception) and their
    use when assessing samples. It is applicable to all quantitative assessment, whether
    global or specific and whether objective or hedonic. It is intentionally limited
    to the most commonly used measurement scales for sensory assessment.
