abstract:
- language: en
  script: Latn
  content: This document describes pre-crash classification systems that specify the
    conflict situations between road traffic actors that lead to real-world crashes.
    Classification systems are useful tools in defining and understanding the role
    and actions of traffic actors and therefore, can be applied to the development
    of vehicle active safety technology, vehicle-safety assessment and traffic-safety
    research in general. This document addresses pre-crash classification systems
    that are based on characteristics of conflict situations which can lead to a crash.
    This document does not address test scenarios that describe the operation domain
    of assisted or automated driving systems.
