abstract:
- language: en
  script: Latn
  content: The proposed ISO standard (on the line of ISO 7250-Part1) is being prepared
    to help different researchers/ national standard bodies in generating internationally
    compatible muscular strength databases. The standard will include definitions
    of strength parameters to be measured, instrumentation to be used for measurement,
    instrument accuracy, strength measurement protocol, and measurer training. This
    standard in association with ISO NP 22567 (General requirements for establishing
    muscular strength databases which is being prepared on the line of ISO 15535)
    will be useful to collect muscular strength data of various population groups.
