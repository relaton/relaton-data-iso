- language: en
  script: Latn
  content: This document specifies a classification and labeling system for sintered
    NdFeB permanent magnets. It defines classification criteria based on magnetic
    properties, operating temperature grades, intrinsic coercivity, and major alloying
    elements, and establishes a standardized code structure and labeling requirements
    to support traceability and recycling within the circular economy.
