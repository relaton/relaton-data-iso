abstract:
- language: en
  script: Latn
  content: This document specifies a method for identifying entry marks, which can
    occur during electro-deposition coating. Entry marks can often occur in the form
    of streaks when the workpiece, either set as cathode or anode, is immersed in
    the electro-deposition tank under applied electric potential (relation of voltage
    and current). These marks occur parallel to the bath surface on the objects to
    be coated. It is applicable to electro-deposition coatings for automotive industries
    and other general industrial applications, e.g. chiller units, consumer products,
    radiators, aerospace, agriculture.
