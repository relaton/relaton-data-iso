abstract:
- language: en
  script: Latn
  content: ISO 4087:2005 establishes general principles for microfilming printed newspapers
    for preservation and distribution to libraries and other documentation services.
    It includes requirements for targets to ensure proper bibliographic control and
    to verify that the film meets the requirements of International Standards applied
    to archival microfilming. ISO 4087:2005 is applicable only to unperforated silver
    microfilms that are 35 mm wide, in rolls or strips, whether first-generation (camera
    negatives), intermediate or distribution copies.
