abstract:
- language: en
  script: Latn
  content: 'This document describes the methods that are available to perform a spectral
    analysis of a pavement surface profile. It specifies a method for performing spatial
    frequency analysis (or texture wavelength analysis) of two-dimensional surface
    profiles that describe the pavement texture amplitude as a function of the distance
    along a straight or curved trajectory over the pavement. It also details an alternative
    (non-preferred) method to obtain these spectra: a)       constant-percentage bandwidth
    obtained by digital filtering (normative method); b)       constant narrow bandwidth
    frequency analysis by means of discrete Fourier transform (DFT), followed by a
    transformation of the narrow-band spectrum to an octave- or one-third-octave-band
    spectrum (informative). The result of the frequency analysis will be a spatial
    frequency (or texture wavelength) spectrum in constant-percentage bandwidth bands
    of octave or one-third-octave bandwidth. The objective of this document is to
    standardize the spectral characterization of pavement surface profiles. This objective
    is pursued by providing a detailed description of the analysis methods and related
    requirements for those who are involved in pavement characterization but are not
    familiar with general principles of frequency analysis of random signals. These
    methods and requirements are generally applicable to all types of random signals;
    however, they are elaborated in this document for their use in pavement surface
    profile analysis. NOTE            The spectral analysis as specified in this document
    cannot express all characteristics of the surface profile under study. In particular,
    the effects of asymmetry of the profile, e.g. the difference of certain functional
    qualities for “positive” and “negative” profiles cannot be expressed by the power
    spectral density, as it disregards any asymmetry of the signal (see Annex B).'
