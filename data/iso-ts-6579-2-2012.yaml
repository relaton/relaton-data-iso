abstract:
- language: en
  script: Latn
  content: 'ISO/TS 6579-2 gives a method for the enumeration of Salmonella spp. present
    in: products intended for human consumption and for the feeding of animals; environmental
    samples in the area of food production and food handling; animal faeces; and environmental
    samples from the primary production stage by calculation of the most probable
    number (MPN). The method is based on miniaturization of the dilution, pre-enrichment
    and selective enrichment steps. The selective enrichment medium, modified semi-solid
    Rappaport?Vassiliadis (MSRV), is intended for the detection of motile salmonellae
    and is not appropriate for the detection of non-motile salmonellae. It is possible
    that the method is less appropriate to enumerate Salmonella ser. Typhi and Salmonella
    ser. Paratyphi. The method is not appropriate for the enumeration of Salmonella
    spp. in (very) low contaminated samples (<1 cfu/g).'
