abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and test methods for assistive products
    for walking, as covered by the following subclauses from ISO 9999:2022 - 12 02
    Assistive products for walking not manipulated by arms - 12 03 Assistive products
    for walking manipulated by one arm (used singly or in pairs, each manipulated
    by one of the arms or hands, possibly in combination with the upper body) - 12
    06 Assistive products for walking manipulated by both arms (manipulated by either
    both arms, the upper body, or by other means) This document does not apply to
    assistive product for walking for which there is a particular standard, for example,
    but not limited to: - ISO 11199-1, walking frames; - ISO 11199-2, rollators; -
    ISO 11199-3, walking tables; - ISO 19894, walking trolleys; - ISO 11334-1, elbow
    crutches; - ISO 11334-4, multi-leg sticks.'
