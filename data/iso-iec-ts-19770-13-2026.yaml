abstract:
- language: en
  script: Latn
  content: The document gives guidance to organizations on the incorporation of sustainability
    aspects for IT asset management (ITAM). This document is applicable to any organization,
    regardless of size, type and nature, and applies to the sustainability aspects
    that an organization has implemented or will implement in its IT asset management
    system (ITAMS) in accordance with the scope definition of ISO/IEC 19770-1. This
    document also addresses what is material from the perspective of the organization
    and of its stakeholders.
