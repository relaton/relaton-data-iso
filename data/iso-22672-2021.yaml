abstract:
- language: en
  script: Latn
  content: 'This document defines the Forward Space Packet (FSP) service in conformance
    with the transfer services specified in reference [1], Cross Support Reference
    Model―Part 1: SLE Services. The FSP service is a Space Link Extension (SLE) transfer
    service that enables a mission to send Space Packets to a spacecraft in sequence-controlled
    or expedited mode. This document defines, in an abstract manner, the FSP service
    in terms of: the operations necessary to provide the transfer service; the parameter
    data associated with each operation; the behaviors that result from the invocation
    of each operation; and the relationship between, and the valid sequence of, the
    operations and resulting behaviors. It does not specify: individual implementations
    or products; the implementation of entities or interfaces within real systems;
    the methods or technologies required to radiate Space Packets to a spacecraft
    and to acquire telemetry frames from the signals received from that spacecraft
    for extraction of the Operational Control Field; the methods or technologies required
    for communications; or the management activities necessary to schedule, configure,
    and control the FSP service. NOTE   –    While the FSP service as described in
    reference [1] is conceived to handle a variety of packet data structures, this
    version of the FSP Recommended Standard is restricted to the handling of Space
    Packets as defined in reference [6]. This version of the FSP Recommended Standard
    is specific to the transfer of Space Packets to be transmitted via the Telecommand
    protocol stack as defined in references [3], [4], and [5]. The Cross Support Reference
    Model (reference [1]) specifies that the FSP service may also be used in conjunction
    with the Advanced Orbiting System protocol stack, but that mode of operation is
    outside the scope of this version of the Recommended Standard. The FSP service
    is provided in the online delivery mode, as defined in reference [1].  The offline
    delivery mode is the subject of further study.'
