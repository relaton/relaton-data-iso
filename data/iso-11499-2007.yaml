abstract:
- language: en
  script: Latn
  content: ISO 11499:2007 gives specific performance requirements for single-use dental
    cartridges of 1,8 ml and 2,2 ml nominal capacity, for use with local anaesthetics.
    It specifies tests for leakage, plunger movement, extractable volume and underfilling,
    and lists general overall dimensions to ensure that the cartridge will fit dental
    cartridge syringes complying with ISO 9997. Labelling requirements are also specified
    in ISO 11499:2007.
