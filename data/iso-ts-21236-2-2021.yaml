abstract:
- language: en
  script: Latn
  content: This document specifies characteristics to be measured and measurement
    methods for clay nanoplate samples in powder and suspension forms used for gas-barrier
    films. In addition, measurement protocols for the individual characteristics are
    described. This document does not deal with characteristics of post-manufacturing
    modification of clay nanoplates. This document does not cover considerations specific
    to health and safety issues either during manufacturing or use.
