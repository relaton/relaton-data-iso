abstract:
- language: en
  script: Latn
  content: 'ISO 18072-1:2007 provides general requirements for the limit state assessment
    of ship structures primarily used in the transport of commercial goods and cargos.
    For the purposes of assessment, the effects of actions on ship structures are
    considered in respect of the following limit states: serviceability, ultimate,
    fatigue and accidental.'
