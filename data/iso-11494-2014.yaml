abstract:
- language: en
  script: Latn
  content: ISO 11494:2014 describes a method for the determination of platinum in
    platinum jewellery alloys, preferably within the range of fineness specified in
    ISO 9202, by means of inductively coupled plasma optical emission spectrometry
    (ICP-OES). This method applies to platinum jewellery alloys that might contain
    silver, indium, iridium, gallium, copper, cobalt, nickel, tin, and ruthenium.
    However, this list is not exhaustive and care is always to be taken to investigate
    potential interference effects.
