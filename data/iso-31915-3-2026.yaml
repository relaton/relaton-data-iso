abstract:
- language: en
  script: Latn
  content: This document is applicable to whole body vibration as a significant hazard.
    It also specifies the methods for determining the vibration emission transmitted
    to the whole body of drivers standing or seated on freely moveable ground support
    equipment (GSE) when driving, for purposes of type evaluation and declaration.
    This document also specifies methods for verifying vibration emission. This document
    is applicable to self-powered GSE only. The test results do not apply to the determination
    of whole body vibration exposure of persons. This document is intended to be used
    in conjunction with the different parts of the EN 1915 series and the EN 12312
    series. This document does not apply to GSE manufactured before the date of its
    publication.
