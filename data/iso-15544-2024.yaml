abstract:
- language: en
  script: Latn
  content: 'This document specifies objectives, functional requirements and guidelines
    for emergency response (ER) measures on installations used for the development
    of offshore hydrocarbon resources. It is applicable to: —     fixed offshore structures;
    —     floating systems for production, storage and off-loading. NOTE         
    For mobile offshore units, the ER plans developed in conformance with the requirements
    and recommendations of the International Maritime Organization (IMO) are generally
    adequate for the normal, independent operation of the unit in most locations.
    The following aspects of ER planning are not generally addressed by IMO and are
    topics intended for inclusion in the scope of this document where relevant to
    the specific installation: —      area evacuation, e.g. precautionary evacuation
    in areas of tropical revolving storms; —      combined operations (where an integrated
    command and ER system is relevant); —      arctic operations; —      uncontrolled
    flow from a well.'
