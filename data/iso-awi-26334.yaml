abstract:
- language: en
  script: Latn
  content: This document specifies the principle, method and procedure for measuring
    the gas mass flow of weighing method standard facility flowing to a pipe in a
    weighing vessel at known time intervals, as well as the method for estimating
    the uncertainty associated with the measurement. It is applicable to static weighing
    method gas flow standard facility (hereinafter referred to as the "facility")
    for the gas pressure range above 0.3MPa.
