abstract:
- language: en
  script: Latn
  content: Specifies the requirements and provides guidance for the production of
    Profile Test Specifications (PTSs) for conformance testing of OSI protocol profiles.
    Also specifies requirements concerning the expression of conformance requirements
    in protocol profile specifications. Applicable to testing the conformance of a
    profile implementation to the static and dynamic conformance requirements of each
    protocol and any information objects included in the profile, by controlling and
    observing Protocol Data Unit (PDU) exchanges.
