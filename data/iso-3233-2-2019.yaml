abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the non-volatile matter
    by volume (NVV) of coating materials by determining the practical dry-film density.
    This method determines the volume percentage of non-volatile matter in paints,
    varnishes and related products by measuring the density of a dry coating for any
    specified temperature range and period of drying or curing. The non-volatile matter
    content is determined in accordance with ISO 3251. Using the non-volatile matter
    by volume results obtained in accordance with this document, it is possible to
    calculate the practical spreading rate of coating materials. This method specifies
    an additional shape of plate to those described in ISO 3233‑1 and is suitable
    for all products which can be applied by dipping. This document is not applicable
    to coating materials which exceed the Critical Pigment Volume Concentration (CPVC).
    Annex A gives an overview of the existing methods for the determination of non-volatile
    matter content and of non-volatile matter volume.
