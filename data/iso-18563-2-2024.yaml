abstract:
- language: en
  script: Latn
  content: 'This document specifies characterization tests to be performed at the
    end of the fabrication of an array probe. It defines both methodology and acceptance
    criteria. This document is applicable to the following array probes used for ultrasonic
    non-destructive testing [phased array technique or signal processing technique,
    e.g. full-matrix capture (FMC) and total-focusing technique (TFM)] in contact
    technique (with or without a wedge or delay line) or in immersion technique, with
    centre frequencies in the range 0,5 MHz to 10 MHz: a)       array probes with
    elements in one direction: —    1-D-linear array (linear array); —    1-D-curved
    array; —    annular array; b)       array probes with elements in two directions:
    —    2-D-array (matrix array); —    sectorial annular array; —    partial sectorial
    annular array. This document does not give methods and acceptance criteria to
    characterize the performance of an ultrasonic phased array instrument or the performance
    of a complete system, which are given in ISO 18563–1 and in ISO 18563–3.'
