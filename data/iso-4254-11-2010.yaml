abstract:
- language: en
  script: Latn
  content: ISO 4254-11:2010, intended to be used together with ISO 4254-1, specifies
    the safety requirements and their verification for the design and construction
    of self-propelled and trailed pick-up balers, including the combination of pick-up
    balers with wrappers, independent of the shape or size of the bales formed. It
    describes methods for the elimination or reduction of hazards arising from the
    intended use and reasonably foreseeable misuse of these machines by one person
    (the operator) in the course of normal operation and service. In addition, it
    specifies the type of information on safe working practices to be provided by
    the manufacturer. ISO 4254-11:2010, taken together with ISO 4254-1, deals with
    all the significant hazards, hazardous situations and events relevant to self-propelled
    and trailed pick-up balers, including the combination of pick-up balers with wrappers,
    when they are used as intended and under the conditions of misuse that are reasonably
    foreseeable by the manufacturer. ISO 4254-11:2010 is not applicable to pedestrian-controlled
    round balers, environmental hazards, road safety, vibration and hazards related
    to moving parts for power transmission. It is not applicable to hazards related
    to maintenance or repairs carried out by professional service personnel.
