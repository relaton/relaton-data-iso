abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1162:2005 specifies the application module for Class of product
    library. The following are within the scope of ISO/TS 10303-1162:2005: the existence
    of a class of product;a mapping between one class of product and another that
    indicates the nature of a whole-part relationship between two individual products;a
    mapping between one class of product and another that indicates the nature of
    a connection relationship between two individual products;a mapping between one
    class of product and another that indicates the nature of a containment relationship
    between two individual products;set theory relationships, such as subset, union
    and intersection, between classes of product and between mappings.'
