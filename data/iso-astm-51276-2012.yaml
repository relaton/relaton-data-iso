abstract:
- language: en
  script: Latn
  content: 'ISO/ASTM 51276:2012 provides recommendations for properly implementing
    dosimetry in radiation processing. ISO/ASTM 51276:2012 specifies a practice for
    using polymethylmethacrylate (PMMA) dosimetry systems to measure absorbed dose
    in materials irradiated by photons or electrons in terms of absorbed dose to water.
    The PMMA dosimetry system is classified as a routine dosimetry system. The PMMA
    dosimeter is classified as a Type II dosimeter on the basis of the complex effect
    of influence quantities. ISO/ASTM 51276:2012 is applicable to the use of PMMA
    dosimetry systems under the following conditions: - the absorbed dose range is
    0,1 kGy to 150 kGy; - the absorbed dose rate is 1 x 10−2 Gy·s−1 to 1 x 107 Gy·s−1;
    - the photon energy range is 0,1 MeV to 25 MeV; - the electron energy range is
    3 MeV to 25 MeV.'
