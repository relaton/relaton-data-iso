abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for the determination of a rating of
    the source flow ripple, source impedance and pressure ripple levels generated
    by positive-displacement hydraulic motors, including bidirectional motors. This
    document is applicable to all types of positive-displacement motor operating under
    steady-state conditions, irrespective of size, for frequencies from 50 Hz to 3 500 Hz.
    It is applicable for the inlet port of positive-displacement motors.
