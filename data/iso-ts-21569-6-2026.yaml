abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for the detection of a DNA sequence
    of the modified cry1Ab/Ac gene and a procedure for the detection of the DNA transition
    sequence between the maize ubiquitin promoter (Pubi) and the cry1Ab/Ac gene. The
    modified cry1Ab/Ac gene and the Pubi-cry construct are frequently found in genetically
    modified Bt (Bacillus thuringiensis) plants. Both detection methods are based
    on real-time PCR and can be used for qualitative screening purposes. For identification
    and quantification of a specific genetically modified plant (event) a follow-up
    analysis has to be carried out. This document is applicable to the analysis of
    DNA extracted from foodstuffs. It can also be suitable for the analysis of DNA
    extracted from other products such as feedstuffs and seeds. The application of
    these methods requires the extraction of an adequate amount of amplifiable DNA
    from the relevant matrix.
