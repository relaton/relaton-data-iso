abstract:
- language: en
  script: Latn
  content: This document specifies offset ink related properties which are intended
    to be communicated between ink supplier and the printer, and which are essential
    for the optimized print production planning and the intended use of the final
    product. NOTE       The final product is not necessarily the finished print product.
    Aspects related to food safety and other safety requirements like children's toys
    safety are not part of the scope of this document.
