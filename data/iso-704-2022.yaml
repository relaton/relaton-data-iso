abstract:
- language: en
  script: Latn
  content: This document establishes the basic principles and methods for preparing
    and compiling terminologies both inside and outside the framework of standardization.
    It describes the links between objects, concepts, definitions and designations.
    It also establishes general principles for the formation of terms and proper names
    and the writing of definitions. This document is applicable to terminology work
    in scientific, technological, industrial, legal, administrative and other fields
    of knowledge. This document does not stipulate rules for the presentation of terminological
    entries in International Standards, which are treated in ISO 10241-1 and ISO 10241-2.
