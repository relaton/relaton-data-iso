abstract:
- language: en
  script: Latn
  content: This standard will specify laboratory test protocols for measuring the
    performance of air disinfection devices regarding airborne microorganism inactivationby
    comparing up- and downstream of the device. It will apply to full size duct-mounted
    devices. It refers to in-activation of microorganisms. It will cover all microorganisms,
    including viruses, bacteria and fungi. It will not apply to freestanding in-room
    air cleaners. The test protocol includes detailed requirements for the test rig,
    the airflow, and the generation of the airborne microorganism challenge. The method
    also covers data acquisition, analysis, and reporting of results.
