abstract:
- language: en
  script: Latn
  content: This standard specifies a series of quality measures used to establish
    high quality telehealth systemsat a global level when an organization:a) needs
    to demonstrate its ability to consistently provide services that meet customer/
    patient,stakeholder, and applicable statutory and regulatory requirements,b) aims
    to enhance customer/patient satisfaction through the effective application of
    the telehealthsystem, including processes for improvement of the system and the
    assurance of conformity tocustomer/patient, and applicable statutory and regulatory
    requirements, andc) demonstrate its commitment to a telehealth system that is
    for the people, equitable, resilient, safeand efficient.The requirements of this
    International Standard are intended to be applicable to any telehealth system,regardless
    of its organizational structure or size.
