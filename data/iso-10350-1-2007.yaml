abstract:
- language: en
  script: Latn
  content: ISO 10350 identifies specific test procedures for the acquisition and presentation
    of comparable data for certain basic properties of plastics. In general, each
    property is specified by a single experimental value, although in certain cases
    properties are represented by two values obtained under different test conditions.
    The properties included are those presented conventionally in manufacturers' data
    sheets. ISO 10350-1:2007 applies predominantly to unreinforced and reinforced
    thermoplastic and thermosetting materials that may be injection- or compression-moulded
    or prepared as sheets of specified thickness. Part 2 of ISO 10350 deals specifically
    with long- or continuous-fibre-reinforced plastics. For the purposes of ISO 10350,
    long-fibre-reinforced plastics are considered to have fibre lengths greater than
    7,5 mm prior to moulding.
