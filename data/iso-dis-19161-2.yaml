abstract:
- language: en
  script: Latn
  content: 'This standard will provide a description of the numbering system replacing
    the DOMES numbering. The description of the DOMES numbering can be found in MERIT/COTES
    joint working groups, MERIT campaign: connection of reference frames, implementation
    plan, 1983. The standard will provide to the geodetic data producers and users
    a proper identification of the permanently instrumented stations, (e.g. those
    used in the production of the International Terrestrial Reference Frame and other
    similar stations), with special emphasis on the backward compatibility with existing
    DOMES numbers, which will have a positive impact on interoperability issues when
    merging several data from different communities. This standard will: • support
    interoperability among GNSS providers (GPS, GLONASS, GALILEO, BEIDOU, …) • clarify
    the potential confusion between communities which have already adopted their own
    numbering systems • support the UNGGIM GGRF resolution on global geodetic infrastructure.'
