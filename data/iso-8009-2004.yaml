abstract:
- language: en
  script: Latn
  content: ISO 8009:2004 specifies the minimum requirements and test methods to be
    used for reusable diaphragms made from natural rubber and silicone rubber. These
    diaphragms are intended for contraceptive use. ISO 8009:2004 is not applicable
    to other vaginal contraceptive barriers, such as those known as cervical caps,
    vaginal sponges and vaginal sheaths.
