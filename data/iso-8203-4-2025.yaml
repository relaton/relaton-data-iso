abstract:
- language: en
  script: Latn
  content: This document specifies the principal method for out-of-plane laser shearography
    non-destructive testing (NDT) of fibre-reinforced polymer (FRP) composites. This
    document is applicable to both monolithic and sandwich FRP laminate constructions,
    with or without curved surfaces, fibre-reinforced thermoset and thermoplastic
    matrix composites incorporating uni- or multi-directional reinforcements in either
    a continuous or discontinuous format; including but not limited to woven fabrics,
    stitched fabrics, short fibre, or particulate filled, honeycomb or foam cores,
    as well as combination or hybrid reinforcements. This document is not applicable
    to variations on this basic configuration.
