abstract:
- language: en
  script: Latn
  content: This document specifies a method for the in vitro determination of sun
    protection factor (SPF). This method is applicable to sunscreen products in form
    of an emulsion or alcoholic one-phase formulation, excluding in form of a loose
    or compressed powder or stick. Specifications are given to enable determination
    of the spectral absorbance characteristics of SPF protection in a reproducible
    manner. Use of this method is strictly for the determination of a static sun protection
    factor. It is not applicable for the determination of water-resistance properties
    of a sun protection product.
