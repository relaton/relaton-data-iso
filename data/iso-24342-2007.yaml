abstract:
- language: en
  script: Latn
  content: ISO 24342:2007 describes methods for determining side lengths, straightness
    of edges and squareness of resilient or textile floor tiles. The side lengths,
    straightness and squareness of resilient or textile floor tiles are important
    considerations because installed flooring will have an objectionable appearance
    if these performance criteria are not followed. This may cause the installed tiles
    to line up unevenly, producing unsightly seams and corners that do not match.
