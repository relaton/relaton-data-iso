abstract:
- language: en
  script: Latn
  content: ISO 4266-4 gives guidance on the selection, accuracy, installation, commissioning,
    calibration and verification of automatic tank thermometers (ATTs) in fiscal/custody
    transfer applications in which the ATT is used for measuring the temperature of
    petroleum and liquid petroleum products having a Reid vapour pressure less than
    100 kPa, stored in atmospheric storage tanks. ISO 4266-4 is not applicable to
    the measurement of temperature in caverns or in refrigerated storage tanks.
