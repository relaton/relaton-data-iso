abstract:
- language: en
  script: Latn
  content: 'This part of IEC 63086 specifies test methods for measuring the performance of household and similar fresh-air air cleaners. This document is applicable to household and similar fresh-air air cleaners intended for use on rated single-phase AC input voltage circuits not exceeding 250 V and DC input voltage circuits not exceeding 480 V, which are connected to the external environment with the function of external circulation cleaning but without exhaust air system, provide pollutant reduced outdoor air into an indoor space but are not connected to the HVAC system of the dwelling or building. NOTE 1: The fresh-air air cleaner within the scope of this document can have passive heat exchangers, but this document does not focus on heat exchanging performance. NOTE 2: This document is not applicable to building-centralized fresh air systems and non-power cleaning systems installed in fresh air pipes. JWG5 has identified 4 types of fresh-air air cleaners(see outline for the definitions of different types). At this time, the first edition of this standard will give measurement methods for Type 1 and Type 2. Further work on the development of test procedures for Type 3 and Type 4 are necessary. This document may include the following contents: (1) Definitions of different types of Fresh-air air cleaners (2) Test setup (3) Air flow rate test method (4) Single-pass efficiency of the air flow test method (5) Fresh air delivery rate'
