abstract:
- language: en
  script: Latn
  content: 'ISO 13012-2:2009 specifies the boundary dimensions, other relevant dimensions
    and their tolerances of accessories for sleeve type linear ball bearings which
    are specified in ISO 10285. ISO 13012-2:2009 applies to: housings — closed and
    adjustable flangeless housings for series 5 sleeve type linear ball bearings,
    open and open adjustable flangeless housings for series 5 sleeve type linear ball
    bearings; shaft support rails — standard height shaft support rails for series
    5 sleeve type linear ball bearings; shaft support blocks — flanged shaft support
    blocks for series 5 sleeve type linear ball bearings; shafts — solid and tubular
    shafts for series 5 sleeve type linear ball bearings.'
