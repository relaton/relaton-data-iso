abstract:
- language: en
  script: Latn
  content: 'This document specifies a contingency plan with a set of actions and protocols,
    associated with infection prevention and control (IPC), to be implemented in response
    to any infectious disease outbreak, applicable during the entire cycle of an exhibition,
    i.e. its planning, operating and evaluating stages. The contingency plan in this
    document focuses on the following elements: risk assessment, surveillance and
    early detection, continuity of essential services, capacity building and rapid
    response mechanism. The contingency plan describes recommendations for organizers,
    venue operators, service providers, exhibitors and participants in terms of their
    roles and responsibilities at each stage of the exhibition during an infectious
    disease outbreak.'
