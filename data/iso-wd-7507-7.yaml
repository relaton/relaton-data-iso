abstract:
- language: en
  script: Latn
  content: This part of ISO 7507 specifies a method for the calibration of vertical
    cylindrical tanks having diameters greater than 3 m by means of internal or external
    measurements using 3D scanning instrument, and for the subsequent compilation
    of tank capacity tables. The method is suitable for tanks tilted up to a 3 % deviation
    from the vertical, provided that a correction is applied for the measured tilt
    as described in ISO 7507-1:2003, Clause 11. This part of ISO 7507 also applies
    to tanks with floating roofs or internal floating blankets.
