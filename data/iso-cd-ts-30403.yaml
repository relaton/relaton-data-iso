abstract:
- language: en
  script: Latn
  content: 'The scope of this document is the streamlining of content in the 16 Human
    Resource TS to eliminate repetitive content and bring all the human resource metrics
    within the TS into one document. This single document will list all available
    human resource metrics. There will be no change to formulae or intent or specific
    metric content. If, however, WG7 ISO 30414: 2024 adds or modifies existing human
    resource metrics, this will be reflected in the single technical specification.'
