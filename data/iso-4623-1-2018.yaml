abstract:
- language: en
  script: Latn
  content: This document describes a test procedure for assessing the protective action
    of coatings of paints or varnishes on steel against filiform corrosion arising
    from a scribed mark cut through the coating. It is only suitable for assessing
    the performance of the coating/substrate combination tested. It is not suitable
    for predicting the performance of the coating on different substrates.
