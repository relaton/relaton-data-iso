abstract:
- language: en
  script: Latn
  content: Click or tap here to enter text. The document provides guidance for users
    of all kinds of ISO Management System Standards (MSS) on how to systemically address
    risks and opportunities within an Integrated Management System (IMS). The application
    of these guidelines can be customized to any organization and its context.. The
    document is applicable to all types and sizes of organizations (e.g. commercial
    enterprises, government or other public agencies and non-profit organizations)
    which intend to establish, implement, maintain and improve a management system
    to address risk and opportunities. It is not industry or sector specific. This
    document is applicable to all types of risks and opportunities, e.g. • risks and
    opportunities faced by organizations (management related) • risks and opportunities
    provoked, caused or opened up by organizations (risks and opportunities associated
    with processes, products and services, assets or people) • risks and opportunities
    faced by society as a whole or parts thereof (society related, e.g. climate change,
    human rights or SDG related). This document can be used throughout the life of
    the organization and can be applied to any activity at all levels. It does not
    describe detailed activities within the organization, but rather provides guidance
    at a general level. It does not prescribe any requirements or specific tools or
    methods to address risks and opportunities.
