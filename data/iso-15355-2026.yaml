abstract:
- language: en
  script: Latn
  content: This document specifies a potentiometric titration method for the determination of chromium content in steel and iron. The method is applicable to chromium contents between 1 % (mass fraction) and 35 % (mass fraction). This document applies to steel and iron with vanadium contents less than 1 % (mass fraction) for chromium contents higher than 10 % (mass fraction) and less than 0,2 % (mass fraction) for chromium contents less than 10 % (mass fraction).
