abstract:
- language: en
  script: Latn
  content: 'ISO 14289-1:2012 specifies how to use ISO 32000-1 (PDF/UA-1) to produce
    accessible electronic documents. ISO 14289-1:2012 is not applicable to: specific
    processes for converting paper or electronic documents to the PDF/UA format; specific
    technical design, user interface, implementation, or operational details of rendering;
    specific physical methods of storing these documents, such as media and storage
    conditions; required computer hardware and/or operating systems.'
