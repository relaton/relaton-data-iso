abstract:
- language: en
  script: Latn
  content: ISO/TS 16791:2014 provides guidance on identification and labelling of
    medicinal products from the point of manufacture of packaged medicinal product
    to the point of dispensing the product. ISO/TS 16791:2014 outlines best practice
    for AIDC barcoding solutions for applications. Users can, however, consider the
    coding interoperability requirements for other AIDC technologies e.g. Radio Frequency
    Identification (RFID).
