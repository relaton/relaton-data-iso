- language: en
  script: Latn
  content: ISO TS 18234-1:2006 provides an introduction and index to the initial set
    of TPEG applications and specifications. It allows the indexing of new applications
    as they are added to the TPEG applications family, by defining their Application
    Identification (AID). As such developments occur, ISO TS 18234-1:2006 will be
    updated to indicate the latest status and the interworking of the various TPEG
    specifications. It will be issued as a new editorial version every time a new
