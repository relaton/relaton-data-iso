abstract:
- language: en
  script: Latn
  content: This document specifies the analytical performance requirements and test
    methods for silicon-based nanowire/nano plate field effect transistor (FET) sensors
    used in molecule detecting devices. It defines key performance parameters, including
    sensitivity, selectivity, exclusivity, and limit of detection. This standard provides
    guidance for manufacturers in evaluating the performance characteristics of these
    sensors.
