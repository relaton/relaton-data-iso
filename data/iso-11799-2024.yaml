abstract:
- language: en
  script: Latn
  content: This document specifies the required characteristics of repositories used
    for the long-term storage of archive and library materials. It covers the siting,
    construction and renovation of the storage facility, and the installation and
    equipment to be used both within and around the building. This document applies
    to all archive and library materials held in repositories, where mixed media can
    be stored together with paper-based materials. It does not preclude the establishment
    of separate areas or compartments within individual repositories, where the environment
    can be controlled to create conditions suitable for the needs of specific archive
    materials. This document does not specify exhibition or display guidelines.
