abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory method for the determination of the distillation characteristics of light and middle distillates derived from petroleum and related products of synthetic or biological origin with initial boiling points above 20 °C and end-points below approximately 400 °C, at atmospheric pressure utilizing an automatic micro distillation apparatus. This test method is applicable to such products as light and middle distillates, automotive spark-ignition engine fuels, automotive spark-ignition engine fuels containing a volume fraction of up to 20 % ethanol, aviation gasolines, aviation turbine fuels, (paraffinic) diesel fuels, FAME (B100), diesel blends containing a volume fraction of up to 30 % fatty acid methyl esters (FAME), special petroleum spirits, naphthas, white spirits, kerosenes, burner fuels, and marine fuels. The test method is also applicable to hydrocarbons with a narrow boiling range, like organic solvents or oxygenated compounds. The test method is designed for the analysis of distillate products; it is not applicable to products containing appreciable quantities of residual material.
