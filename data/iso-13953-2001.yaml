abstract:
- language: en
  script: Latn
  content: This International Standard describes a test method for determination of
    the tensile strength and tensile failure mode of butt-fused polyethylene (PE)
    pipe assemblies. The method is applicable to butt-fused joints between PE pipes
    with a nominal outside diameter of not less than 90mm. . The method may be used,
    together with other test methods, to evaluate the quality of the butt-fused joints.
