abstract:
- language: en
  script: Latn
  content: 'The “Finding value in mining wastes” standard will outline a framework
    for systematically determining the economic value of different types and forms
    of residual materials from mining operations. This would include the value of
    residual minerals and elements. It is expected that this standard will consider
    materials generated over the life cycle of a mine and include historic, current
    and future mines. Most relevant Sustainable Development Goals SDG: 8 Decent work
    and economic growth, 9 Industry innovation and infrastructure, 10 Reduced inequality,
    12 Responsible consumption and production, 13 Climate action, 14 Life below water,
    and 15 Life on land. Material types and characterisation General principles (e.g.
    waste versus resource), characterising major material types and keeping records.
    Evaluating principles and approaches The value of minerals content versus the
    value of other materials, the value of minerals and materials versus the value
    of land, mixed versus segregated material streams (e.g. comparing grade, value,
    impurities, etc. per tonne of material), present value versus future value and
    opportunities, materials characterisation and recoverability, processing options
    and available infrastructure, and maintaining highest resource value at all times.
    Evaluation methodology Inventory of materials, characterisation of material streams
    and sub-streams, waste management approach and objectives, discarded materials
    as a potential future asset, and operational requirements and efficiency. Inclusion
    in sustainable supply chains Exploration and mine design, changes and developments
    over the life of mine, integrating recovery with mine rehabilitation and closure,
    re-commercialisation, including land reuse, and a pathway to a circular economy.
    This standard would allow for a systematic assessment of a discarded materials
    value considering both their potential for use as part of the mining operation
    or value external to this. This assessment should reduce the unintended loss of
    material value within the processing and waste management operations, leading
    to capturing the highest economic value and/or optimizing the economic value while
    achieving the best environmental outcome. Excluded: Environmental and social aspects
    of mine closure which are addressed by separate standards. Stakeholders for this
    standard include but are not limited to the following: Governments at different
    levels (local, regional, state, national) Mining companies Professionals, including
    in the mining and research and development industries Communities, including NGOs'
