abstract:
- language: en
  script: Latn
  content: ISO 10133:2012 establishes the requirements for the design, construction
    and installation of extra-low-voltage direct current (d.c.) electrical systems
    which operate at nominal potentials of 50 V d.c. or less on small craft of hull
    length up to 24 m. Conductors that are part of an outboard engine assembly and
    that do not extend beyond the outboard engine manufacturer's supplied cowling
    are not included. Additional information to be included in the owner's manual
    is listed in an annex.
