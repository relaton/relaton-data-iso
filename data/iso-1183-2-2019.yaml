abstract:
- language: en
  script: Latn
  content: This document specifies a gradient column method for the determination
    of the density of non-cellular moulded or extruded plastics or pellets in void-free
    form. Density gradient columns are columns containing a mixture of two liquids,
    the density in the column increasing uniformly from top to bottom. NOTE Density
    is frequently used to follow variations in physical structure or composition of
    plastic materials. Density can also be useful in assessing the uniformity of samples
    or specimens. The density of plastic materials can depend upon the choice of specimen
    preparation method. When this is the case, precise details of the specimen preparation
    method are intended to be included in the appropriate material specification.
