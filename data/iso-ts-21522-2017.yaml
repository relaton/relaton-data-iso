abstract:
- language: en
  script: Latn
  content: ISO/TS 21522:2017 gives guidance on the quantitative test methods to measure
    chemical components in fumes emitted during the manufacturing process of rubbers
    (including storage) and considered hazardous. NOTE Quantification of the level
    of exposure allows selection of the correct type of protection for the operators
    and, after implementation of the protection, verification that the risk was eliminated
    by implementation of the selected protection.
