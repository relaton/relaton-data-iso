abstract:
- language: en
  script: Latn
  content: This document specifies the "Fast Networking & Transport Protocol" (FNTP)
    of the ITS-S networking & transport layer. FNTP is in support of efficient localized
    communications distinguishing networking related features and transport related
    features. FNTP is extendible in the future without breaking binary backward compatibility.
    This document specifies - message formats and related basic protocol procedures
    by reference to ISO TS 16460, and - further requirements for operation of FNTP
    in the context of an ITS station specified in ISO 21217.
