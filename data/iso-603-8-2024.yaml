abstract:
- language: en
  script: Latn
  content: 'This document specifies the nominal dimensions, in millimetres, of: —    
    shape type 1: straight grinding wheel. These bonded abrasive products are intended
    to be used for deburring and fettling of any surface of a workpiece. The workpiece
    is manually guided, and the grinding wheel is fixed. This document does not specify
    limit deviations and run-out tolerances, which are given in ISO 13942.'
