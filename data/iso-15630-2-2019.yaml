abstract:
- language: en
  script: Latn
  content: This document specifies chemical and mechanical test methods and measurement
    methods of geometrical characteristics applicable to welded fabric and lattice
    girders for the reinforcement of concrete. NOTE In some countries, the expression
    "welded wire reinforcement" is used in place of "welded (wire) fabric". For those
    tests not specified in this document (e.g. bend test, rib/indentation geometry,
    mass per metre), ISO 15630-1 is applicable. This document does not cover the sampling
    conditions that are dealt with in the product standards. A list of options for
    agreement between the parties involved is provided in Annex A.
