abstract:
- language: en
  script: Latn
  content: ISO 1986-1:2014 specifies, with reference to ISO 230‑1, both geometric
    and machining tests on general purpose and normal accuracy surface grinding machines
    with reciprocating table up to 1 600 mm table length and horizontal grinding wheel
    spindle. It also specifies the applicable tolerances corresponding to the above-mentioned
    tests. It is not applicable to surface grinding machines with fixed or rotating
    tables or to machines having longitudinal traverse of the wheelhead. ISO 1986-1:2014
    deals only with the verification of the accuracy of the machine; it does not apply
    to the testing of the machine operation (vibrations, abnormal noises, stick-slip
    motion of components, etc.), nor to the machine characteristics (such as speeds,
    feeds, etc.), which should generally be checked before testing the accuracy. ISO
    1986-1:2014 provides the terminology used for the principal components of the
    machine and indicates the designation of the axes with reference to ISO 841.
