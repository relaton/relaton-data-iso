abstract:
- language: en
  script: Latn
  content: ISO 18333:2002 gives guidance on minimum recommended timber quality characteristics.
    It applies to stringers, stringerboards, blocks and deckboards used for flat wooden
    pallet assembly. The purpose of ISO 18333:2002 is to establish internationally
    recognized minimum acceptable quality levels for the above-mentioned wooden parts
    commonly used for the assembly of timber pallets. The properties of these components
    affect pallet performance. ISO 18333:2002 does not address the safety problems,
    if any, associated with the use of these components.
