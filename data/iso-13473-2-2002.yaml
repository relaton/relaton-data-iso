abstract:
- language: en
  script: Latn
  content: ISO 13473-2:2002 defines terms, expressions and parameters that are related
    to the analysis of pavement texture, on roads as well as on airport runways and
    taxiways. In particular, it defines terms and expressions related to profile representations
    of texture, which are anticipated to be useful in modelling of pavement characteristics
    such as tyre/road noise emission, tyre/road friction, tyre rolling resistance
    and tyre wear. In addition, some brief general information on pavement surface
    characteristics and their effects is presented. ISO 13473-2:2002 also contains
    some basic requirements in connection with the use of the terms, expressions and
    parameters. Profile analysis of machined surfaces is not included, since this
    subject is dealt with in other International Standards, for example ISO 3274,
    ISO 4287, ISO 4288, ISO 5436-1 and ISO 12085. Profile analysis of road unevenness,
    which is dealt with in ISO 8608, is also excluded.
