abstract:
- language: en
  script: Latn
  content: This document specifies a real-time polymerase chain reaction (real-time
    PCR) method for the qualitative detection of donkey-specific DNA derived from
    food and feed. It requires the extraction of an adequate amount of PCR amplifiable
    DNA from the relevant matrix and can be applied to the detection of donkey material
    derived from donkey (Equus asinus), mule (Equus caballus ♀ × Equus asinus ♂) and
    hinny (Equus caballus ♂ × Equus asinus ♀). The assay also detects the species
    zebra (Equus burchellii). The target sequence is a partial fragment of the Equus
    asinus isolate Maral har breed Guanzhong donkey unplaced genomic scaffold, ASM130575v1
    scaffold786, whole genome shotgun sequence (i.e. GenBank accession number NW_014638576.1)[1],
    which is present as a single copy per haploid genome. The provided PCR assay for
    this target has an absolute limit of detection of five copies per reaction, with
    ≥ 95 % replicability at this concentration (LOD95 %).
