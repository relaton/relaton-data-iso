abstract:
- language: en
  script: Latn
  content: This document describes spot measurement methods for determining the activity
    concentration of short-lived radon-222 decay products in the air and for calculating
    the potential alpha energy concentration. This document gives indications for
    performing a spot measurement of the potential alpha energy concentration, after
    sampling at a given place for several minutes, and the conditions of use for the
    measuring devices. The measurement method described is applicable for a rapid
    assessment of the potential alpha energy concentration. The result obtained cannot
    be extrapolated to an annual estimate potential alpha energy concentration of
    short-lived radon-222 decay products. Thus, this type of measurement is not applicable
    for the assessment of annual exposure or for determining whether or not to mitigate
    citizen exposures to radon or radon decay products. This measurement method is
    applicable to air samples with potential alpha energy concentration greater than
    5 nJ/m3. NOTE This document does not address the potential contribution of radon-220
    decay products.
