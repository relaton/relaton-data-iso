abstract:
- language: en
  script: Latn
  content: 'This document provides: • AI-specific application notes for relevant security
    assurance requirements (SARs) from ISO/IEC 15408-3 (CC Part 3), and • AI-specific
    application notes for relevant work units (WUs) from ISO/IEC 18045 (CEM) presented
    as defined in ISO/IEC 15408-4 (CC Part 4). The document also considers AI-specific
    security functional requirements (SFRs) in an extended security functional requirement
    class for AI (based on ISO/IEC 15408-3 (CC Part 2)).'
