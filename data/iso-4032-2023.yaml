abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of hexagon regular nuts (style 1),
    in steel and stainless steel, with metric coarse pitch thread M5 to M39, and with
    product grades A and B. NOTE            For nuts with sizes D < M5 and D > M39,
    see Annex A. If in certain cases other specifications are requested, property
    classes and stainless steel grades can be selected from ISO 898-2 or ISO 3506-2.
