abstract:
- language: en
  script: Latn
  content: ISO15629 gives guidelines on nails and staples used in the assembly of
    new and repair of used wooden flat pallets. For the purposes of this International
    Standard the term fasteners applies to nails and staples only. ISO 15629 is prescriptive
    and performance-based and contains physical descriptions of fasteners as well
    as minimum recommended performance levels.
