abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for dried parsley (Petroselinum crispum,
    synonyms: Petroselinum hortense, Petroselinum sativum, Apium petroselinum) in
    whole, cut leaves or rubbed (ground) form. The term "dried parsley" includes dehydrated
    parsley, i.e. artificially dried parsley. Recommendations relating to storage
    and transport conditions are given in Annex A.'
