abstract:
- language: en
  script: Latn
  content: 'This document establishes applicability evaluation methodology for synthetic
    biometric samples in biometric performance testing. It also defines report requirements
    to ensure transparency regarding the synthetic biometric samples used. This document
    only treats with synthesizing biometric samples generated from real biometric
    samples, with trying to keep respective identities of the latter biometric samples.
    The testing targets are image-based modalities including, but not to limited to
    face, fingerprint and vein. Specifically, this document: - defines applicability
    evaluation methodology focusing on (1) quality of the synthetic biometric samples
    and (2) score similarity between real and synthetic biometric samples. - specifies
    report contents to ensure transparency through results. This document does not:
    - specify image synthesis techniques or algorithms. - cover synthetic biometric
    samples not generated from real biometric samples. - address biometric performance
    testing methodologies beyond the use of synthetic biometric samples as defined
    within this scope. - establish specific performance thresholds or acceptance criteria
    for biometric systems.'
