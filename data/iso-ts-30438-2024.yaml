abstract:
- language: en
  script: Latn
  content: This document provides recommendations on how to measure individual employee
    engagement and whether to aggregate this data to an enterprise view. It demonstrates
    how the use of a strategic framework for employee engagement determines the key
    aspects that drive employee engagement, and how a framework of metrics can be
    developed that link positive or negative outcomes to one or more of the strategic
    drivers, to link cause and effect. The document also demonstrates the linkage
    between individual engagement and the role and performance of management at all
    levels to understand and manage the conditions that impact actual engagement.
    It demonstrates the complexity and interconnectedness of values, behaviours, processes,
    systems, and relationships that create a system of inter-dependency responsible
    for the achievement of optimum employee engagement.
