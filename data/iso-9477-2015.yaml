abstract:
- language: en
  script: Latn
  content: ISO 9477:2015 specifies requirements for four grades of heat treated cast
    carbon and alloy steels for general engineering and structural purposes. In cases
    where castings are produced by welding component parts together, this International
    Standard does not cover the welding process or the properties of the weldment.
    The four steel grades are intended for service at ambient temperature. However,
    properties at other temperatures can be agreed on through the use of supplementary
    requirements in ISO 4990.
