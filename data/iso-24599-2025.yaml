abstract:
- language: en
  script: Latn
  content: The document provides guidelines for the management of electrically powered
    mobile toilets that are connected to water and electricity under public epidemic
    emergencies (PEEs) from different perspectives, including users, operators, and
    suppliers. It also gives recommendations to provide safe sanitation services for
    users, cleaners, and waste tank drivers. It is applicable to epidemic situations
    of major respiratory tract and intestinal infectious diseases, but not to group
    unexplained diseases, major food and occupational poisoning and other events that
    seriously affect public health.
