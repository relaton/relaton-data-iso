abstract:
- language: en
  script: Latn
  content: ISO 13110:2012 specifies a method for the gas-chromatographic determination
    of menthol in the total particulate matter (TPM) of mentholated cigarette smoke
    condensates. The smoking of cigarettes and the collection of mainstream smoke
    are carried out in accordance with ISO 4387 with some exceptions. Encapsulated
    menthol in specific products may lead to specific handling not described in ISO
    13110:2012.
