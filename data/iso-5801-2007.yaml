abstract:
- language: en
  script: Latn
  content: ISO 5801:2007 deals with the determination of the performance of industrial
    fans of all types except those designed solely for air circulation e.g. ceiling
    fans and table fans. Estimates of uncertainty of measurement are provided and
    rules for the conversion, within specified limits, of test results for changes
    in speed, gas handled and, in the case of model tests, size, are given.
