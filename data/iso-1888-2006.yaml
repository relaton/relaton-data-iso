abstract:
- language: en
  script: Latn
  content: ISO 1888:2006 specifies longitudinal-profile and transverse-section methods
    for determining the average diameter (i.e. the average value of actual diameters)
    of staple fibres or filaments in a textile glass product. This diameter must not
    be confused with the nominal diameter which is used in the designation of yarns
    and materials manufactured from these yarns and corresponds to the average diameter
    but rounded to the nearest whole number.
