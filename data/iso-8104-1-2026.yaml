abstract:
- language: en
  script: Latn
  content: 'This document gives a methodology for improving the safety of existing
    passenger and goods passenger lifts with the aim of reaching an equivalent level
    of safety to that of newly installed lifts by the application of today’s state-of-the-art
    for safety. This document prioritizes improvements of safety based on objective
    hazard analysis but does not define a methodology for achieving full conformity
    to current standards for new installations. NOTE   Due to situations, such as
    the building design, etc. it is not always possible to reach today’s state-of-the-art
    for safety. This document applies to permanently installed passenger or goods
    passenger lifts, with traction, positive or hydraulic drive serving defined landing
    levels, having a car designed for the transportation of persons or persons and
    goods and moving along guide rails inclined not more than 15° to the vertical.
    This document includes the improvement of safety of existing lifts for: passengers;
    maintenance and inspection personnel; persons outside the well, machinery space(s)
    and the pulley room(s) (but in their immediate vicinity); any other authorized
    persons. This document is not applicable to: lifts with drive systems others than
    those mentioned above; hydraulic lifts: with a rated speed exceeding 1 m/s; where
    the setting of the pressure relief valve exceeds 50 MPa; lifting appliances, such
    as paternosters, mine lifts, theatre lifts, appliances with automatic caging,
    skips, lifts and hoists for building and public works sites, ships’ hoists, platforms
    for exploration or drilling at sea, construction and maintenance appliances; installations
    where the inclination of the guide rails to the vertical exceeds 15°; lifting
    appliances with a rated speed lower than or equal to 0,15 m/s; safety during transport,
    installation, repairs and dismantling of lifts. However, this document can usefully
    be taken as a reference basis. This document does not cover: improvement of safety
    for specific items like vandalism, seismic conditions, fire issues, etc.; improvement
    of accessibility.'
