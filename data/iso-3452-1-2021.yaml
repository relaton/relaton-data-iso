abstract:
- language: en
  script: Latn
  content: This document specifies a method of penetrant testing used to detect discontinuities,
    e.g. cracks, laps, folds, porosity and lack of fusion, which are open to the surface
    of the material to be tested using white light or UV-A (365 nm) radiation. It
    is mainly applied to metallic materials, but can also be performed on other materials,
    provided that they are inert to the test media and not excessively porous (castings,
    forgings, welds, ceramics, etc.) This document also includes requirements for
    process and control testing, but is not intended to be used for acceptance criteria.
    It gives neither information relating to the suitability of individual test systems
    for specific applications nor requirements for test equipment. NOTE 1   Methods
    for determining and monitoring the essential properties of penetrant testing products
    to be used are specified in ISO 3452-2 and ISO 3452-3. NOTE 2   The term "discontinuity"
    is used in this document in the sense that no evaluation concerning acceptability
    or non-acceptability is included. NOTE 3   CEN/TR 16638 addresses penetrant testing
    using actinic blue light.
