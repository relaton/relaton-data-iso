abstract:
- language: en
  script: Latn
  content: This document specifies safety and performance requirements for the design,
    assembly, and testing of bicycles and sub-assemblies, and lays down guidelines
    for manufacturer’s instructions on the use and care of such bicycles. This document
    applies to young adult bicycles with maximum saddle height of 635 mm or more and
    less than 750 mm, city and trekking bicycles, mountain bicycles, and racing bicycles
    that have a maximum saddle height of 635 mm or more including folding bicycles.
    This document does not apply to specialized types of bicycle, such as delivery
    bicycles, recumbent bicycles, tandems, BMX bicycles, and bicycles designed and
    equipped for use in severe applications such as sanctioned competition events,
    stunting, or aerobatic manoeuvres. NOTE      For bicycles with a maximum saddle
    height of 435 mm or less, see national regulations for ride-on toys, and with
    a maximum saddle height of more than 435 mm and less than 635 mm, see ISO 8098.
