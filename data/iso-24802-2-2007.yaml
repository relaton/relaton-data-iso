abstract:
- language: en
  script: Latn
  content: ISO 24802-2:2007 specifies the competencies that a scuba instructor has
    to have achieved in order for a training organization to award the scuba instructor
    certification indicating that he has met or exceeded scuba instructor level 2
    and specifies assessment of these competencies. It also specifies conditions under
    which training has to be provided, in addition to the general requirements for
    recreational diving service provision in accordance with ISO 24803. ISO 24802-2:2007
    applies only to contractual training and certification in recreational scuba diving.
