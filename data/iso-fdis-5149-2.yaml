abstract:
- language: en
  script: Latn
  content: 'ISO 5149-2:2014 is applicable to the design, construction, and installation
    of refrigerating systems, including piping, components, materials, and ancillary
    equipment directly associated with such systems, which are not covered in ISO
    5149‑1, ISO 5149‑3, or ISO 5149‑4. It also specifies requirements for testing,
    commissioning, marking, and documentation. Requirements for secondary heat-transfer
    circuits are excluded except for any safety devices associated with the refrigerating
    system. ISO 5149-2:2014 is applicable to new refrigerating systems, extensions
    or modifications of already existing systems, and for used systems, being transferred
    to and operated on another site. ISO 5149-2:2014 applies to: a) refrigerating
    systems, stationary or mobile, of all sizes including heat pumps; b) secondary
    cooling or heating systems; c) the location of the refrigerating systems; and
    d)replaced parts and added components after the adoption of this part of ISO 5149,
    if they are not identical in function and in capacity. ISO 5149-2:2014 does not
    cover "motor vehicle air conditioners". It does not apply to goods in storage,
    with respect to spoilage or contamination, but it also applies in the case of
    the conversion of a system for another refrigerant.'
