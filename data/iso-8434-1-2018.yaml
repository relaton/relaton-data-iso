abstract:
- language: en
  script: Latn
  content: This document specifies the general and dimensional requirements for 24°
    cone connectors using cutting ring and O‑ring seal cone (referred to as DKO) suitable
    for use with ferrous and non‑ferrous tubes with outside diameters from 4 mm to
    42 mm inclusive. These connectors are for use in fluid power and general applications
    within the limits of pressure and temperature specified in this document. They
    are intended for the connection of plain end tubes and hose fittings to ports
    in accordance with ISO 6149‑1, ISO 1179‑1 and ISO 9974‑1. (See ISO 12151‑2 for
    a related hose fitting specification.) These connectors provide full-flow connections
    in hydraulic systems operating to the working pressures shown in Table 1. Because
    many factors influence the pressure at which a system performs satisfactorily,
    these values are not intended to be understood as guaranteed minimums. For every
    application, sufficient testing is meant to be conducted and reviewed by both
    the user and manufacturer to ensure that required performance levels are met.
    NOTE 1 For new designs in hydraulic fluid power applications, see the requirements
    given in 9.6. Where the requirements of the application allow for the use of elastomeric
    seals, connector designs that conform to International Standards and incorporate
    elastomeric sealing are preferred. NOTE 2 For use under conditions outside the
    pressure and/or temperature limits specified, see 5.4. This document also specifies
    a performance and qualification test for these connectors.
