abstract:
- language: en
  script: Latn
  content: ISO 21809-3:2008 specifies requirements for field joint coating of seamless
    or welded steel pipes for pipeline transportation systems in the petroleum and
    natural gas industries as defined in ISO 13623. ISO 21809-3:2008 specifies the
    qualification, application and testing of the corrosion protection coatings applied
    to steel surfaces left bare after the pipes and fittings (components) are joined
    by welding. ISO 21809-3:2008 does not address additional mechanical protection,
    thermal insulation or joint infills for concrete weight-coated pipes. ISO 21809-3:2008
    defines and codifies the different types of field joint coatings for buried or
    submerged pipelines as presented in Table 1.
