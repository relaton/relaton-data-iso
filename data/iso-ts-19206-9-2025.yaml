abstract:
- language: en
  script: Latn
  content: This document specifies performance requirements for surrogate small child
    targets (SCT) used to assess the system detection and activation performance of
    active safety systems and automated driving systems (ADS). This document specifies
    the properties of targets that represent two small children in terms of size,
    shape, reflection properties, etc. for testing purposes. The two targets represent
    a 9- to 12-month-old infant and a two-year-old toddler. This document addresses
    the detection requirements for the targets in terms of sensing technologies commonly
    in use at the time of publication, and where possible, anticipated future sensing
    technologies. It also addresses methodologies to verify the target response properties
    to these sensors. This document does not address the test procedures in terms
    of speed, position, or timing of events. Performance criteria for the active safety
    system being evaluated are also not addressed. NOTE            Related test procedures
    using small child targets according to this document can be found in ISO 4273
    and ISO 23374-1.
