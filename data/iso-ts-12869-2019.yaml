abstract:
- language: en
  script: Latn
  content: This document specifies a method for the detection and quantification of
    Legionella spp. and L. pneumophila using a quantitative polymerase chain reaction
    (qPCR). It specifies general methodological requirements, performance evaluation
    requirements, and quality control requirements. Technical details specified in
    this document are given for information only. Any other technical solutions complying
    with the performance requirements are suitable. NOTE 1 For performance requirements,
    see Clause 9. This document is intended to be applied in the bacteriological investigation
    of all types of water (hot or cold water, cooling tower water, etc.), unless the
    nature and/or content of suspended matter and/or accompanying flora interfere
    with the determination. This interference can result in an adverse effect on both
    the detection limit and the quantification limit. NOTE 2 For validation requirements,
    see 9.7. The results are expressed as the number of genome units of Legionella
    spp. and/or L. pneumophila per litre of sample. The method described in this document
    is applicable to all types of water. However, some additives, such as chemicals
    used for water treatment, can interfere with and/or affect the sensitivity of
    the method. The qPCR methods do not give any information about the physiological
    state of the Legionella.
