abstract:
- language: en
  script: Latn
  content: This International Standard specifies test methods to determine the lateral
    stability of heavy commercial vehicle combinations as defined in ISO 3833, including
    truck centre-axle trailer combinations and articulated buses. It is applicable
    to trucks and trailers having a mass exceeding 3,5 t and buses having a mass exceeding
    5 t, i.e. vehicle categories N2, N3, O3, O4 and M3 according to 92/53/EEC. The
    manoeuvres specified in these test methods are not fully representative of real
    driving conditions, but are useful for determining the lateral stability of a
    heavy vehicle combination.
