abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the respiratory tubing and connectors
    used to convey respirable gases to a patient in the healthcare and homecare environments
    and provide a safe connection between the gas supply device and the patient interface.
    Respiratory tubing and connectors are mainly used for delivery of oxygen but can
    also be used for respirable air or oxygen/air mixtures and breathable medicinal
    gas mixtures such as oxygen/nitrous oxide or oxygen/helium mixtures. This document
    also specifies requirements for respiratory therapy extension tubing. NOTE 1       
    The gas supply devices referred to in this document do not include anaesthetic
    machines/workstations and ventilators. NOTE 2        This document does not cover
    breathing tubes for breathing systems. These are specified in ISO 5367. This document
    is written following the format of ISO 18190, General standard for airways and
    related equipment. The requirements in this device-specific standard take precedence
    over any conflicting requirements in the General standard
