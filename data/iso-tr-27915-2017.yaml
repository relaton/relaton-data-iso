abstract:
- language: en
  script: Latn
  content: 'ISO/TR 27915:2017 presents a review of publicly available literature identifying
    materially relevant issues and options relating to "good practices" for quantifying
    and verifying GHG emissions and reductions at the project level. Its scope covers
    all components of the CCS chain (e.g. capture, transport, storage) and includes
    a lifecycle assessment approach to estimating project level emissions and emission
    reductions from project assessment, construction and operations, through to completion
    and post-closure activities. This document considers the following at the project
    level: - a variety of Q&V related boundaries applicable to all components of a
    CCS project; - the composition of the CO2 stream, including its purity, and requirements
    for measuring and verifying the physical and chemical state of the CO2 stream
    in CCS projects; - identification and quantification of GHG emissions and reductions
    across integrated CCS components; - monitoring objectives, methodologies, and
    sampling strategies, including locations, periods, and frequencies; - GHG data
    collection and reporting; - verifying GHG expectations with agreed verification
    criteria; - life cycle assessment (LCA) of CCS projects.'
