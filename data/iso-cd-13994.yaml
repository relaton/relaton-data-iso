abstract:
- language: en
  script: Latn
  content: ISO 13994:2005 describes a laboratory test method that enables determination
    of the resistance of materials used in protective clothing to visible penetration
    under the conditions of continuous liquid contact and pressure, for example, clothing
    that is exposed to repeated splashes of liquid spray under pressure. Protective
    clothing "pass/fail" determinations are based on visual detection of liquid penetration.
    This test method is normally used to evaluate the barrier effectiveness against
    liquids of materials used for protective clothing and specimens from finished
    items of protective clothing. ISO 13994:2005 addresses only the performance of
    materials or certain material constructions (e.g. seams) used in protective clothing.
    It does not address the design, overall construction and components, or interfaces
    of garments or other factors which may affect the overall protection offered by
    the protective clothing.
