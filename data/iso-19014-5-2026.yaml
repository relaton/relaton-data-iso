abstract:
- language: en
  script: Latn
  content: This document specifies machine performance levels required (MPLr) by common function and type for earth-moving machinery as defined in ISO 6165:2022. These MPLr can then be mapped or applied to safety control systems (SCS) used to control or that affect the functions defined in Tables A.1 to AA.1. To cover all the relevant safety requirements for the products in its scope, this document is used in combination with ISO 19014-1:2026, ISO 19014-2:2026, ISO 19014-3:2026, and ISO 19014-4:2026. This document is not applicable to earth-moving machinery manufactured before the date of its publication.
