abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1662:2018-11 specifies the application module for Design
    specific assignment to assembly usage view. The following is within the scope
    of ISO/TS 10303-1662:2018-11: the representation of the assignment of component
    terminals in a assembly design view to part terminals in the assembly usage view.
    This provides the ability for a design organization to explicitly manage the relationships
    between the externally published information typically found in legacy systems
    in an interface control document or catalog and the detailed design items that
    are the internal implementation of those externally visible features. This module
    provides the ability for the design organization to manage the information using
    standard models in a database application. assignment of component terminals in
    an assembly design to part features in the usage view of the assembly.'
