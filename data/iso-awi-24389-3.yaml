abstract:
- language: en
  script: Latn
  content: This document specifies guidances to provide assurance of the radiation
    safety of the disposal of radioactive waste, in the operation of a disposal facility
    and especially after its closure. It applies to the disposal of radioactive waste
    of all types by means of emplacement in designed disposal facilities, subject
    to the necessary limitations and controls being placed on the disposal of the
    waste and on the development, operation and closure of facilities. In addition,
    this document also provides guidance for data management for waste that has been
    delivered to a disposal facility, repository operation, and monitoring required
    for in-situ and ex-situ disposal.
