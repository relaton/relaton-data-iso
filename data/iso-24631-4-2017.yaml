abstract:
- language: en
  script: Latn
  content: ISO 24631-4:2017 provides the means of evaluating the performance of ISO
    11784- and ISO 11785-conformant RFID (radiofrequency identification) transceivers
    used in the individual identification of animals. The test procedures specified
    in this document are recognized by the Federation of European Companion Animals
    Veterinary Association (FECAVA) and World Small Animal Veterinarian Association
    (WSAVA) and, as such, can be applied also to companion animals.
