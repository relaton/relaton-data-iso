abstract:
- language: en
  script: Latn
  content: This document specifies a titrimetric method for determining the hydroxyl
    groups in resins and binders for paints and varnishes. This method is primarily
    suitable for neutral media. Acidic products provide higher values; neutral products
    provide, through neutralization of the acidic carbamates, lower values. For these
    products, preliminary tests are performed to ensure the applicability of the method.
