abstract:
- language: en
  script: Latn
  content: ISO/TS 11135-2:2008 provides guidance for the requirements in ISO 11135-1:2007.
    It does not repeat the requirements and is not intended to be used in isolation.
    The exclusions in ISO 11135-1 apply also to this Technical Specification. This
    guidance document is intended for people who have a basic knowledge of the principles
    of EO sterilization but may need help in determining how to best meet the requirements
    contained in ISO 11135-1. This document is not intended for people lacking a basic
    knowledge of the principles of EO sterilization.
