abstract:
- language: en
  script: Latn
  content: ISO 9381:2005 applies to all vertically hinged or pivoted doors. ISO 9381:2005
    specifies the method to be used to determine the permanent deformation caused
    when static stress in torsion is applied to an open door leaf fixed in its own
    door frame as part of a doorset. ISO 9381:2005 can also be used in respect a door
    leaf submitted for test in a frame which the manufacturer considers appropriate
    to and typical for the intended utilisation.
