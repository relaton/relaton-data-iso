abstract:
- language: en
  script: Latn
  content: This document defines a coverage processing language for server-side extraction,
    filtering, processing, analytics, and fusion of multi-dimensional geospatial coverages
    representing, for example, spatio-temporal sensor, image, simulation, or statistics
    datacubes. Services implementing this language provide access to original or derived
    sets of coverage information, in forms that are useful for client-side consumption.
    This document relies on the ISO 19123-1 abstract coverage model. In this edition,
    regular and irregular multi-dimensional grids are supported for axes that can
    carry spatial, temporal or any other semantics. Future editions will additionally
    support further axis types as well as further coverage types from ISO 19123-1,
    specifically, point clouds and meshes.
