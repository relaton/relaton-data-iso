abstract:
- language: en
  script: Latn
  content: ISO 8317:2003 specifies the requirements and test methods for reclosable
    packages designated as resistant to opening by children. Acceptance criteria are
    given for the package when tested by specified methods. These methods not only
    provide a measure of the effectiveness of the package in restricting access by
    children, but also cover the accessibility to the contents by adults. Reclosable
    packages for any product intended to be exposed or removed from the packaging
    in normal use are covered by the procedures. ISO 8317:2003 is intended for type
    approval only and is not intended for quality assurance purposes.
