abstract:
- language: en
  script: Latn
  content: ISO 10865-2:2015 applies to wheelchair passenger spaces that are intended
    for use by passengers with a body mass greater than 22 kg who remain in their
    wheelchairs when travelling facing forward in accessible transport vehicles designed
    to transport both standing and sitting passengers on fixed-route service. It assumes
    that the maximum acceleration imparted to the vehicle during emergency driving
    manoeuvres will not exceed 1 g in any direction and rarely exceeds 3 g in frontal
    crashes. For the purposes of this part of ISO 10865, the term wheelchair includes
    manual and powered wheelchairs, and three and four wheeled scooters. ISO 10865-2:2015
    specifies performance requirements and associated test methods, design requirements,
    requirements for manufacturer instructions and warnings to installers, wheelchair
    users, and vehicle operators, and requirements for product labelling and disclosure
    of test information. The provisions of this part of ISO 10865 apply primarily
    to a complete forward-facing wheelchair passenger space (FF-WPS), but subsets
    of the provisions can be applied to components and subassemblies sold separately,
    as appropriate to the specific functions of the components and/or subassemblies
    they are intended to replace.
