abstract:
- language: en
  script: Latn
  content: ISO 307:2003 specifies a method for the determination of the viscosity
    number (also referred to as reduced viscosity) of dilute solutions of polyamides
    in certain specified solvents. The method is applicable to the polyamides designated
    PA 46, PA 6, PA 66, PA 69, PA 610, PA 612, PA 11, PA 12, PA 6T/66 and PA MXD6
    as defined in ISO 1874-1, as well as to copolyamides and other polyamides that
    are soluble in one of the specified solvents under the specified conditions. The
    method is not applicable to polyamides produced by anionic polymerization of lactams
    or produced with crosslinking agents; such polyamides are normally insoluble in
    the specified solvents.
