abstract:
- language: en
  script: Latn
  content: This document specifies the classification, requirements and test methods
    for rinsed and rinse-free hexavalent chromium-free chemical conversion coatings
    on aluminium and aluminium alloys. This document applies to hexavalent chromium-free
    chemical conversion coatings on extruded aluminium and aluminium alloy components,
    profiles, coils, sheets, as well as cast aluminum alloy parts. The Hexavalent
    chromium-free conversion coatings may serve as standalone anti-corrosion layers
    or as a base layer for organic coatings (such as paints, rubber, or adhesives).
