abstract:
- language: en
  script: Latn
  content: This document specifies the fundamental deviations and limits of sizes
    for the pitch and major diameters of the hot-dip galvanized metric external threads
    (M) conforming to ISO 262 (M6 to M68 with the coarse pitches and M72 to M100 with
    pitch 6) having basic and design profiles in accordance with ISO 68-1. This document
    is applicable to the hot-dip galvanized metric external threads undersized to
    tolerance class 6az before galvanizing to mate with the internal threads made
    to tolerance position H or G after galvanizing.
