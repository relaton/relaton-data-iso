abstract:
- language: en
  script: Latn
  content: This document specifies the methods of preparation of test specimens and
    the test methods to be used in determining the properties of PE-UHMW moulding
    and extrusion materials. It gives the requirements for handling test material
    and for conditioning both the test material before moulding and the specimens
    before testing. This document gives the procedures and conditions for the preparation
    of test specimens and procedures for measuring properties of the materials from
    which these specimens are made. Properties and test methods which are suitable
    and necessary to characterize PE-UHMW moulding and extrusion materials are listed.
    The properties have been selected from the general test methods in ISO 10350-1.
    Other test methods in wide use for or of particular significance to these moulding
    and extrusion materials are also included in this document, as are the designatory
    properties specified in ISO 21304-1. This document specifies the materials with
    MFR less than 0,1 g/10 min at 190 °C /21,6 kg based on ISO 17855-1. The methods
    of preparation and conditioning, the specimen dimensions and the test procedures
    specified in this document are used in order to obtain reproducible and comparable
    test results. Values determined will not necessarily be identical to those obtained
    using specimens of different dimensions or prepared using different procedures.
