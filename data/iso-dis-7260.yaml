abstract:
- language: en
  script: Latn
  content: This document specifies requirements, test methods, and labeling for protective
    filtering devices intended for protection against retinal blue light exposure
    from powered polymerization activators in the scope of ISO 10650:2018, i.e., powered
    polymerization activators using quartz-tungsten halogen lamps or light emitting
    diodes (LED) to activate polymerization. This document does not apply to protective
    filtering devices for lasers or plasma arc devices.
