abstract:
- language: en
  script: Latn
  content: ISO 18213-2:2007 presents procedures for standardizing a set of calibration
    data to a fixed set of reference conditions so as to minimize the effect of variations
    in ambient conditions that occur during the measurement process. The procedures
    presented herein apply generally to measurements of liquid height and volume obtained
    for the purpose of calibrating a tank (i.e., calibrating a tank's measurement
    system). When used in connection with other parts of ISO 18213, these procedures
    apply specifically to tanks equipped with bubbler probe systems for measuring
    liquid content. The standardization algorithms presented in ISO 18213-2:2007 can
    be profitably applied when only estimates of ambient conditions, such as temperature,
    are available. However, the most reliable results are obtained when relevant ambient
    conditions are measured for each measurement of volume and liquid height in a
    set of calibration data.
