abstract:
- language: en
  script: Latn
  content: This document provides information on rechargeable energy storage systems
    (RESS) in earth-moving machinery (EMM) as defined in ISO 6165. It also identifies
    current standards and other relevant documents that can guide the development
    of electrified EMM. Additionally, this document defines terms that are common
    in the design of electrical equipment. This document covers electrics and electronics
    that are physically part of the machine. It does not cover electrics and electronics
    that are off-board the machine, nor off-board sources of energy and communications
    with chargers.
