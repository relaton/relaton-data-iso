abstract:
- language: en
  script: Latn
  content: 'ISO 11978:2017 specifies the information to be provided by the manufacturer
    of contact lenses and contact lens care products to ensure the correct and safe
    use of these devices and their accessories by both types of user of contact lenses:
    the eye care professional and the contact lens wearer. ISO 11978:2017 does not
    specify the format in which such information shall be provided.'
