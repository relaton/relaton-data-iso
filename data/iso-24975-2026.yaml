abstract:
- language: en
  script: Latn
  content: 'This document specifies methods of measurement for the determination of
    the dimensions of all types of mattresses, bed frames, divans and bed bases intended
    for adult size. It also includes recommended tolerances based on any nominal dimension,
    in order to ensure the correct fit between the bed components. This document does
    not apply to the following: —     air beds/mattresses and water beds/mattresses;
    —     mattress pads that are placed on top of the main support mattress; —    
    dimensions of bed bases for bunk beds and high beds.'
