abstract:
- language: en
  script: Latn
  content: This document specifies constructs for modelling product-related service
    systems in business terms, recognising the service environment and the product
    lifecycle. The constructs and their meta-model are consistent with a model-driven
    service engineering architecture. This document is intended for use by business
    users to address their business concerns and decision-making, and by systems engineers
    and information technology researchers using a model-driven engineering approach
    in the design, development and deployment of service systems in virtual manufacturing
    enterprises, business ecosystems and other application areas.
