abstract:
- language: en
  script: Latn
  content: This document specifies fundamental techniques of film and digital radiography
    with the object of enabling satisfactory and repeatable results to be obtained
    economically. The techniques are based on generally recognized practice and fundamental
    theory of the subject. This document applies to the radiographic examination of
    pipes in metallic materials for service induced flaws such as corrosion pitting,
    generalized corrosion and erosion. Besides its conventional meaning, "pipe" as
    used in this document is understood to cover other cylindrical bodies such as
    tubes, penstocks, boiler drums and pressure vessels. Weld inspection for typical
    welding process induced flaws is not covered, but weld inspection is included
    for corrosion/erosion type flaws. The pipes can be insulated or not, and can be
    assessed where loss of material due, for example, to corrosion or erosion is suspected
    either internally or externally. This document covers double wall inspection techniques
    for detection of wall loss, including double wall single image (DWSI) and double
    wall double image (DWDI). Note that the DWDI technique described in this document
    is often combined with the tangential technique covered in ISO 20769-1. This document
    applies to in-service double wall radiographic inspection using industrial radiographic
    film techniques, computed digital radiography (CR) and digital detector arrays
    (DDA).
