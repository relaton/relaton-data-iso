abstract:
- language: en
  script: Latn
  content: 'This document specifies the application module for AP239 part definition
    information. The following are within the scope of this document: the identification,
    classification and representation of part designs, the parts that are realized
    from designs, documents, and requirements and their versions and definitions;
    the assignment of properties to part designs, realized parts, documents and requirements;
    the assignment of management information, such as dates, approvals, people and
    organizations to parts, documents and requirements in a given role; the representation
    of predicted and observed states of parts and documents; the association of requirements
    to parts; the identification, categorization and representation of interfaces
    on parts; the representation of messages and envelopes for messages; the representation
    of the rights to access information about part designs, realized parts, documents,
    and requirements.'
