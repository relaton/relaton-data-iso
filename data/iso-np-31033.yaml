abstract:
- language: en
  script: Latn
  content: 'This management system standard will provide requirements with guidance
    for use for travel service providers for establishing, maintaining, implementing
    and continually improving the provision of travel service activities and related
    risk management within the context of its organization. It will complement the
    guidance in ISO 31030 – travel risk management. It recognises that Travel Risk
    Management is a multi-faceted, cross-functional discipline and that travel service
    providers also have additional responsibilities to their clients, who require
    evidence-based assurances, including governance, compliance, risk management,
    business continuity, business resilience, guest welfare and safeguarding (including
    youth and vulnerable people), physical security and cybersecurity (including AI),
    vendor management, anti-bribery and corruption and more. It will support existing
    management system frameworks implemented by travel service providers. It is intended
    for use by all types and sizes of organizations providing travel, security and
    assistance services to organizations and travellers. Note: As part of the Preliminary
    Work to investigate the viability of this proposal, BSI has consulted widely with
    relevant stakeholders and reviewed relevant standards, including ISO 31030. (Please
    see Justification Study). While no suggestions for change to the guidance were
    identified, should this proposal be approved, any suggestions for changes to the
    guidance will be recorded and fed into any future revision of ISO 31030. Should
    this proposal be approved, BSI would continue to engage with these groups, and
    others, to develop the standard. BSI would also seek to establish Twinning arrangements.'
