abstract:
- language: en
  script: Latn
  content: 'This document specifies data elements and data exchange functions for orchestrating the allocation and use of physical spaces by automated and conventional vehicles across road, water, and air domains. Part 2 extends ISO TS 25614-1 by addressing space orchestration beyond passenger pickup and drop-off operations, including: • Space definition and availability management • Demand expression and space-to-vehicle matching • Reservation, scheduling, and queue management • Delay notification and cancellation handling This document applies to any shared-use space where vehicles arrive, stop, stand, wait, or hover, including but not limited to: • Loading and unloading zones (indoor and outdoor) • Curbside spaces and parking facilities • Maritime docks and slips • Aerial waypoints and holding points • Service facilities (charging, fueling, maintenance, cleaning, storage) Part 2 applies to vehicles at all automation levels, including both crewed and uncrewed operations'
