abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for filtering coolant emulsion
    mist-separators by classification of usable filter elements with regard to their
    filtration performance. It describes a reliable and proven test method for the
    classification using an aerosol generator, a test rig for filter elements (plane
    or shaped filter elements) and measuring devices used to determine the separation
    efficiency of the filter elements. In this document only the oil content of the
    coolant emulsion mist, which is the subject of occupational exposure limit values,
    is taken into account for the separation efficiency. This standard is only applicable
    to water-miscible coolants (emulsions or solutions), with a maximum concentration
    of the coolant concentrate of 15 % by volume in water. This standard is not applicable
    to cutting oils or drilling oils (non-water-miscible coolants with 100 % by volume
    oil). Filtering coolant mist separator elements including a blower are not the
    subject of this standard. Electrostatic precipitators, mass force separators,
    scrubbers and adsorption filters (such as activated carbon filters) are also not
    subject of this standard.
