abstract:
- language: en
  script: Latn
  content: ISO 15530-3:2011 specifies the evaluation of measurement uncertainty for
    results of measurements obtained by a CMM (coordinate measuring machine) and by
    using calibrated workpieces or measurement standards. It provides an experimental
    technique for simplifying the uncertainty evaluation of CMM measurements, whose
    approach (substitution measurements) leads to measurements being carried out in
    the same way as actual measurements, but with calibrated workpieces of similar
    dimension and geometry instead of the unknown workpieces to be measured. Non-substitution
    measurements on CMMs are also covered, as are the requirements of the uncertainty
    evaluation procedure, the measurement equipment needed, and the reverification
    and interim check of the measurement uncertainty.
