abstract:
- language: en
  script: Latn
  content: This document specifies a test method for investigating the oxidative stability
    of ultra-high-molecular-weight polyethylene (UHMWPE) materials as a function of
    processing and sterilization method. This document describes a laboratory method
    for accelerated ageing of UHMWPE specimens and components for total joint prostheses.
    The UHMWPE is aged at elevated temperature and at elevated oxygen pressure, to
    accelerate oxidation of the material and thereby allow for the evaluation of its
    potential long-term chemical and mechanical stability.
