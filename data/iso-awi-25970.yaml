abstract:
- language: en
  script: Latn
  content: 'This document specifies how to measure the change and trends when it comes
    to biodiversity in managed forest landscapes (one or several forest management
    unit(s)) on the organizational or aggregated level (the area of study). It includes:
    • Determining the forest management unit(s), • Identification and selection of
    relevant biodiversity indicators adapted to local conditions (related to both
    direct observations and management activities). • Assessment of the current status
    and dynamics of biodiversity in relation to those indicators, • Interpretation
    of change when it comes to biodiversity indicator results, including possible
    thresholds and impacts of interventions, • Reporting format. The methodology sets
    a framework which can be adjusted and adapted to local conditions. This document
    sets general requirements and provides overarching terminology. This document
    includes information on how claims and declarations can be communicated based
    on this document, both within the value chain and to customers and consumers.
    This document is intended to be used by organizations seeking to understand, commit
    to or contribute to biodiversity goals. These organizations can be either private
    or public, regardless of type or size, and located in any jurisdiction. This document
    is not a tool that allows comparability between studies by e.g. giving absolute
    numbers.'
