abstract:
- language: en
  script: Latn
  content: This document establishes principles and specifies general requirements
    that are applicable to all types of product-related environmental statements and
    environmental statement programmes. Environmental statements result from environmental
    statement programmes and include self-declared environmental claims, ecolabels,
    environmental product declarations (EPDs) and footprint communications. This document
    is intended to be used in conjunction with other standards in the ISO 14020 family.
    NOTE      Those other standards contain additional terms and definitions, principles
    and requirements that are relevant to their specific scopes.
