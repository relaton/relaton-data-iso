abstract:
- language: en
  script: Latn
  content: This standard provides guidelines for good practices that can be adopted
    by any platform providers in the transport sector for the implementation of work-related
    road traffic safety management. These practices are intended to reduce death and
    serious injuries related to road traffic crashes which it can influence. This
    document is applicable to any platform providers to offer further protection to
    the platform drivers as well as other road users through the adoption of a proactive
    approach to manage work-related road risks.
