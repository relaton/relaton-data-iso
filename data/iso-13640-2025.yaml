abstract:
- language: en
  script: Latn
  content: This document specifies the procedures for producing substrates of mortar,
    glass and anodized aluminium used for testing sealants. This document defines
    the composition and the method of preparation of the test substrates to ensure
    the reproducibility of the tests conducted on sealants. The substrates defined
    in this document are indicators of the sealant's performance and not substrates
    which reproduce the characteristics of the construction materials.
