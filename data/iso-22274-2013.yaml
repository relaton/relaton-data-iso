abstract:
- language: en
  script: Latn
  content: 'ISO 22274:2013 establishes basic principles and requirements for ensuring
    that classification systems are suitable for worldwide application, considering
    such aspects as cultural and linguistic diversity as well as market requirements.
    By applying principles relating to terminology work, ISO 22274:2013 provides guidelines
    for creating, handling, and using classification systems for international environments.
    ISO 22274:2013 addresses the need in many domains for classification systems that
    are concept based to ensure that they are suitable for worldwide use and can be
    adapted to specific user communities. It provides information about the design,
    development, and use of classification systems that are fully enabled for diverse
    linguistic, cultural, and market-based environments. ISO 22274:2013 primarily
    specifies the factors that need to be considered when creating and populating
    a classification system for use in diverse linguistic environments. These factors
    include the specification of principles for incorporating internationalization
    aspects into classification systems, and maintaining and using those aspects for
    the structuring of activities, products, services, agents, and other entities
    of a company or organization. The following are within the scope of ISO 22274:2013:
    a) guidelines on information content to support internationalization of classification
    systems and their underlying concept systems; b) terminological principles applicable
    to classification systems; c) requirements for internationalization of classification
    systems; d) considerations on workflow and administration of classification system
    content to support worldwide use. The following are outside the scope of ISO 22274:2013:
    1) providing formal data models for representing classification systems in machine-readable
    form; 2) prescribing classification system content for specific business domains
    or products; 3) harmonization of classification systems. ISO 22274:2013 is intended
    for those who develop content for classification systems. This includes terminologists
    and content managers who are called upon to apply the principles of terminology
    work to ensure that cultural and linguistic diversity are appropriately reflected
    in classification systems. It is also relevant for people who design and model
    appropriate IT tools.'
