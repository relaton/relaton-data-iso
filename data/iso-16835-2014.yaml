abstract:
- language: en
  script: Latn
  content: 'ISO 16835:2014 specifies test methods for the thermal expansion of refractory
    products. It describes a method for determining the linear thermal expansion percentage,
    the linear thermal expansion curve, and the linear thermal expansion coefficient.
    ISO 16835:2014 includes the following three test methods for the thermal expansion
    of refractory products: a) a contact method with a cylindrical test piece; b)
    a contact method with a rod test piece; c) a non-contact method.'
