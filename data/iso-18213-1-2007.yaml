abstract:
- language: en
  script: Latn
  content: ISO 18213-1:2007 describes procedures for tank calibration and volume determination
    for nuclear process tanks equipped with pressure-measurement systems for determining
    liquid content. Specifically, overall guidance is provided for planning a calibration
    exercise undertaken to obtain the data required for the equation to estimate a
    tank's volume and the key steps in the procedure are presented for subsequently
    using the estimated volume-measurement equation to determine tank liquid volumes.
    The procedures presented apply specifically to tanks equipped with bubbler probe
    systems for measuring liquid content. Moreover, these procedures produce reliable
    results only for clear (i.e., without suspended solids), homogeneous liquids that
    are at both thermal and static equilibrium.
