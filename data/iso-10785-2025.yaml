abstract:
- language: en
  script: Latn
  content: This document specifies general and detailed requirements for bellows used
    in space systems. It establishes requirements regarding material, design, analysis,
    fabrication, material, testing, inspection, and operation for space use. This
    document is applicable to metallic bellows which are used as pressure bearing
    components and are integrated into a pressure system. This document is not applicable
    to engine bellows or valve bellows.
