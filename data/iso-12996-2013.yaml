abstract:
- language: en
  script: Latn
  content: ISO 12996:2013 specifies the geometry of the test specimens and the procedure
    for the tensile shear testing of single mechanical joints on single and multilayer
    specimens up to a single sheet thickness of 4,5 mm. The term sheet, as used in
    ISO 12996:2013, includes extrusions and cast materials. The purpose of the tensile
    shear test is to determine the mechanical characteristics and failure modes of
    the joints made with the different methods. ISO 12996:2013 does not apply to civil
    engineering applications such as metal building and steel construction which are
    covered by other applicable standards.
