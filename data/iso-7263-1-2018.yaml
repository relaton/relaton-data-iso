abstract:
- language: en
  script: Latn
  content: This document describes a method for the determination of the flat crush
    resistance of a corrugating medium after laboratory fluting using an A-flute geometry.
    The procedure is applicable to any corrugating medium intended to be used, after
    fluting, in the manufacture of corrugated board. NOTE ISO 7263-2 describes a method
    to determine the flat crush resistance using a B-flute geometry.
