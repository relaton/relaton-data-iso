abstract:
- language: en
  script: Latn
  content: 'This document specifies procedures for commissioning digital twins in
    manufacturing environments covered by the ISO 23247 series. It defines the key
    activities, requirements and procedures for the preparation of digital twins for
    operational use. This document covers: — initializing and configuring digital
    twins from different sources; — connecting digital twins to digital threads from
    different sources; — verifying the operation of each digital twin meets frequency,
    latency and fidelity requirements; — confirming the readiness of the digital twins
    for operational use; — enabling the cooperation of the digital twins from different
    sources. This document does not address general commissioning practices unrelated
    to digital twins or sectors outside the scope of ISO 23247.'
