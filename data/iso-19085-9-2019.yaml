abstract:
- language: en
  script: Latn
  content: 'This document gives the safety requirements and measures for stationary
    and displaceable circular saw benches (with or without sliding table and/or demountable
    power feed unit), also known as "table saws" (in the USA), hereinafter referred
    to as "machines", designed to cut wood and material with similar physical characteristics
    to wood. NOTE 1 For the definition of stationary and displaceable machine, see
    ISO 19085‑1:2017, 3.4 and 3.5. It deals with all significant hazards, hazardous
    situations and events as listed in Clause 4 relevant to these machines when they
    are operated, adjusted and maintained as intended and under the conditions foreseen
    by the manufacturer including reasonably foreseeable misuse. Also, transport,
    assembly, dismantling, disabling and scrapping phases are taken into account.
    NOTE 2 For relevant but not significant hazards, e.g. sharp edges of the machine
    frame, see ISO 12100:2010. It is also applicable to machines fitted with one or
    more of the following devices, or working unit, whose hazards have been dealt
    with: — device for the main saw blade and scoring saw blade to be raised and lowered
    through the table; — device to tilt the main saw blade and scoring saw blade for
    angled cutting; — device for scoring; — device for grooving with milling tool
    with a width not exceeding 20 mm in one pass; — demountable power feed unit; —
    additional manually operated sliding table; — powered work-piece clamping device.
    NOTE 3 Circular saw benches are used for ripping, cross cutting, dimensioning
    and grooving. This document does not apply to: a) transportable/displaceable machines
    intended for outdoor use on building sites; NOTE 4 Building site saws (contractor
    saws) are covered by the requirements of ISO 19085‑10:2018. b) hand held woodworking
    machines including any adaptation permitting their use in a different mode, i.e.
    bench mounting; c) machines intended for use in a potentially explosive atmosphere;
    d) machines manufactured before the date of its publication as an International
    Standard; e) transportable machines with a maximum saw blade diameter of ≤315
    mm. NOTE 5 Transportable motor-operated electric tools are dealt with in IEC 62841‑1:2014
    and IEC 62841‑3‑1:2014.'
