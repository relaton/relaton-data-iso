abstract:
- language: en
  script: Latn
  content: This document specifies a framework and integration guidelines for applying
    homomorphic encryption (HE) to the secondary use of clinical genomic data. It
    addresses the preparation and encoding of clinical genomic data for homomorphic
    computation, the workflow for performing analysis on encrypted genomic data, and
    the interpretation and integration of decrypted results into clinical reporting.
    This document does not define homomorphic encryption algorithms, cryptographic
    parameters, or key management protocols, which are addressed by other International
    Standards.
