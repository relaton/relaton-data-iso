abstract:
- language: en
  script: Latn
  content: ISO/TR 17671-5:2004 gives general recommendations for the welding of clad
    steels by means of appropriate arc welding processes and electroslag strip cladding.
    It is generally applicable to all clad steels and is appropriate regardless of
    the type of fabrication involved, although the application standard may have additional
    requirements. Non-ferrous claddings, such as titanium, tantalum, zirconium and
    their alloys are not covered by ISO/TR 17671-5:2004. ISO/TR 17671-5:2004 covers
    welding of cladding deposits as well as welding of the transition zone(s), when
    existant, between parent metal and cladding. These transition zones are metal
    combinations of non-alloyed ferrous parent metal with high alloyed stainless steels,
    nickel alloys or other non-ferrous metals. The mechanical and physical design
    of the joints is not covered by ISO/TR 17671-5:2004. Methods of testing and acceptance
    levels are not included because they depend on the service conditions of the fabrication.
    The corrosion resistance of the cladding depends on many factors and is not part
    of ISO/TR 17671:2004.
