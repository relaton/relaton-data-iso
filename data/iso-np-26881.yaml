abstract:
- language: en
  script: Latn
  content: This document specifies the performance test method for recovered reverse
    osmosis (RO) membranes intended for water reuse applications without potable use.
    It defines the test methods for key operating characteristics, including salt
    rejection and permeate flow, based on ISO 20466 (Guidance for performance grading
    of recovered reverse osmosis (RO) membranes for water reuse). In addition, the
    performance test methods for recovered RO membranes cannot always be directly
    applied from those used for new RO membranes, as some recovered RO membranes cannot
    be accurately evaluated using the same procedures. Accordingly, this document
    specifies the appropriate supplementary measures to be applied when necessary.
    This document is applicable to the spiral wound type of recovered membranes from
    seawater reverse osmosis (SWRO) and brackish water reverse osmosis (BWRO) systems.
    This document does not cover the grading or classification of recovered membranes
    (see ISO 20466) or the regeneration process itself.
