abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of in-plane shear
    strength of continuous fibre-reinforced ceramic composites at elevated temperature
    in air or inert atmosphere by the asymmetric four-point bending test on double-edge
    notched specimens. The shear strength in plane (1,2) can be evaluated, where direction
    1 is that of the greater fraction of reinforcement and direction 2 is perpendicular
    to direction 1. Methods for test piece fabrication, testing modes and rates (load
    or displacement rate), data collection and reporting procedures are addressed.
    This document applies to all ceramic matrix composites with continuous fibre-reinforcement:
    unidirectional (1D), bidirectional (2D) and tridirectional (xD, with 2 < x ≤ 3).
    This document is for material development, material comparison, quality assurance,
    characterization, reliability and design data generation.'
