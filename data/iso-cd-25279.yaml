abstract:
- language: en
  script: Latn
  content: 'Standardization of “International statistics for school libraries” to
    specify rules for the school library community on the collection, interpretation
    and reporting of statistics: — for the purpose of strategic planning and internal
    management of school libraries, — for reporting to stakeholders such as funding
    institutions, politicians, or the public, — to promote the libraries’ role and
    value for learning and education; — for comparing and aggregating results at a
    regional, national or international level.'
