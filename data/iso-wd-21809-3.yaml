abstract:
- language: en
  script: Latn
  content: ISO 21809-3:2016 specifies requirements for field joint coating of seamless
    or welded steel pipes for buried and submerged sections of pipeline transportation
    systems used in the petroleum, petrochemical and natural gas industries as defined
    in ISO 13623. This part of ISO 21809 specifies the qualification, application
    and testing of the corrosion protection coatings applied to steel surfaces left
    bare after the joining of pipes and fittings (components) by welding. ISO 21809-3:2016
    defines and codifies in Table 1 the different types of field joint coatings for
    pipelines. ISO 21809-3:2016 does not address requirements for additional mechanical
    protection, for thermal insulation or for joint infills of concrete weight-coated
    pipes. NOTE Field joints of pipes and fittings coated in accordance with this
    part of ISO 21809 are considered suitable for further protection by means of cathodic
    protection.
