abstract:
- language: en
  script: Latn
  content: 'This document specifies a concept for the design of machine operated feed
    out tools, limited to any kind of machine operated feed out tools, together with
    the usage of the related properties and domains of values. This document specifies
    the requirements of simplified 3D models for data exchange of machine operated
    feed out tools. The following are outside the scope of this document: — applications
    where these standard data can be stored or referenced; — creation and exchange
    of 3D for cutting tools; — creation and exchange of 3D for cutting items; — creation
    and exchange of 3D for tool items; — creation and exchange of 3D for other adaptive
    items not being described in the scope of this document; — creation and exchange
    of 3D for assembly items and auxiliary items.'
