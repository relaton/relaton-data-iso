abstract:
- language: en
  script: Latn
  content: This document provides guidance on selection, installation, use and maintenance
    of auxiliary systems and equipment as well as best management practises for hardened
    protective shelters (further referred to as “shelters”). This document does not
    address shelter protective equipment and systems, which are presented in ISO/TS
    22359-2. The document is intended for use by the owners of the hardened protective
    shelters, architects and engineers designing them, industry producing the targeted
    equipment, and procurement organisations in construction industry sourcing such
    equipment.
