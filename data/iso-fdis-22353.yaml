abstract:
- language: en
  script: Latn
  content: 'The document gives guidance on crowd management at events and mass gatherings.
    It provides principles applicable to any event but mainly to events gathering
    crowds. This document will help hosts and organizers to plan and execute safe
    and successful crowd management by: • introducing a set of principles and best
    practices for crowd management at events and mass gatherings; • establishing processes
    to understand, assess and handle crowd management risks; • establishing plans
    and execution of sufficient crowd movement in all phases (arrival/ingress, event
    circulation, egress/departure); • providing stakeholder engagement and involvement
    of public and private interested parties. This document is applicable both in
    normal and emergency situations.'
