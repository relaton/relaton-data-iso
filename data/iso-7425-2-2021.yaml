abstract:
- language: en
  script: Latn
  content: This document specifies the dimensions and associated tolerances for a
    series of hydraulic cylinder rod seal housings to accommodate elastomer-energized,
    plastic-faced seals used in reciprocating applications. This document does not
    stipulate details of seal design, since the manner of construction of seals varies
    with each manufacturer. The design and material of the seals, and any incorporated
    anti-extrusion components, are determined by conditions such as temperature and
    pressure. This document only applies to the dimensional characteristics of products
    manufactured in accordance with this document. It does not apply to their functional
    characteristics.
