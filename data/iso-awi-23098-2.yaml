abstract:
- language: en
  script: Latn
  content: 'This document describes a basic role model of unregulated service (service
    provided by private enterprise/authority as non-enforcement activity) for smart
    city mobility monitoring and services by data sharing platform as a common platform
    for smart city instantiation. It provides a paradigm describing: a) a framework
    architecture for the provision of a mobility monitoring service b) a description
    of the concept of operations, and the role models c) a conceptual architecture
    between actors involved in the provision/receipt of mobility monitoring service
    applications d) references for the key documents on which the architecture is
    based e) a taxonomy of the organization of generic procedures. scope is specialized
    in defining the requirements of the basic role and functional model of service
    for the introduction of mobility monitoring services including infrastructure
    facilities to support mobility in urban and rural areas. In-vehicle control system
    is not in scope of this document. This document is describing the scope limited
    to the unregulated service for mobility monitoring services using physical and
    digital infrastructure. The physical infrastructure facilities are, for example,
    battery charging facility, dynamic charging facility for battery electric vehicle,
    physical infrastructure markings, physical traffic regulation signs, mobility
    monitoring facility, emergency responding service support facility, traffic operation
    control centre facility, fee collection service facility such as road usage fee,
    battery EV charging facility, online reservation and online mobility usage fee
    payment facility, other infrastructure platform facility to support mobility monitoring
    services. This document can contribute to the development of future mobility monitoring
    service business cases other than system service described within this document.'
