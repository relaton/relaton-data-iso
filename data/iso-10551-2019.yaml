abstract:
- language: en
  script: Latn
  content: 'This document presents principles and examples of practical application
    for the construction of appropriate subjective scales for use in the assessment
    and evaluation of the physical environment. It does not standardize particular
    scales. It considers scales of perception, comfort, preference, acceptability,
    expression form and tolerance, and environmental components such as thermal, visual,
    air quality, acoustic and vibration. It does not consider other scales such as:
    — scales related to the effects of the environment on the ability to read displays
    or signs, on manual performance or on psychological conditions such as mood, etc.;
    — scales related to pain or scales related to stimuli that can lead to injury.
    This document does not present principles of surveys (see Note) or questionnaire
    design. However, the scales that are developed using this document can be incorporated
    into surveys or questionnaires. NOTE Environmental surveys are described in ISO
    28802. ISO 28802 includes scales that are complementary to, and based upon, the
    principles of scale construction that are described in this document.'
