abstract:
- language: en
  script: Latn
  content: This NWIP specifies the technical delivery conditions regarding structure,design,designation,
    dimensions, materials, manufacturing process, technical requirements,test and
    inspection methods, marking, handling and storage of thermoplastic lined glass
    fiber reinforced plastic (referred to as TPL-GRP) pipes for use in pipeline transportation
    systems for the petroleum and natural gas industries. This NWIP is applicable
    to TPL-GRP pipes for use in transportation pipelines transporting corrosive media-containing
    single-phase or multi-phase fluid such as oil, gas and water for the petroleum
    and natural gas industries. It can also be used as reference in other fields.
