abstract:
- language: en
  script: Latn
  content: 'This document provides guidance on aspects of the design of human-system
    interaction, including conceptual design, user-system interaction design, user
    interface design and navigation design for interactive systems. This document
    applies to all design and development approaches and methodologies, including
    human-centred design, object-oriented, waterfall, human factors integration (HFI),
    agile and rapid development. It is intended for the following types of users:
    —     user interface designers, who will apply the guidance during the development
    process; —     developers, who will apply the guidance during the design and implementation
    of system functionality; —     evaluators, who are responsible for ensuring that
    products meet the recommendations; —     designers of user interface development
    tools and style guides to be used by user interface designers; —     project managers,
    who are responsible for managing development processes.'
