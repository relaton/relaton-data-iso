abstract:
- language: en
  script: Latn
  content: ISO 10705-3:2003 specifies the general principles for assessing the performance
    of methods for the concentration of bacteriophages from water. Concentration is
    recommended for those water samples expected to contain < 3 pfp (plaque-forming
    particles) per millilitre. Concentration methods can be applied to all kinds of
    water provided that the amount and nature of suspended solids and/or dissolved
    matter do not interfere with the concentration procedure. ISO 10705-3:2003 does
    not give specific details of concentration methods, but outlines the fundamental
    principles for evaluating the suitability of a particular method for a given type
    and volume of water. Annex A gives examples of methods that have been found satisfactory
    and their fields of application.
