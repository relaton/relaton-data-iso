abstract:
- language: en
  script: Latn
  content: 'This document specifies a test method for continuous process analysis
    (real-time analysis) using near-infrared spectroscopy for the indirect determination
    of the following fuel-characterising parameters: — total chlorine content; — water
    content; — heating value. NOTE When accuracy is proven, real-time analysis can
    be supplemented by further fuel-characterising parameters. This document applies
    to solid recovered fuels according to ISO 21640.'
