abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for line pressure regulators and
    line pressure regulators with flow-metering devices to be connected to industrial
    gas distribution pipelines of: —     compressed gases and carbon dioxide up to
    6 MPa (60 bar); —     acetylene up to 150 kPa (1,5 bar); —     liquefied petroleum
    gases (LPG); —     methylacetylene-propadiene mixtures (MPS); for use in welding,
    cutting and allied processes. This document does not apply to pressure regulators
    intended for direct use on cylinders or bundles, such regulators are addressed
    in ISO 2503 or ISO 7291, respectively. NOTE            Where there is no risk
    of ambiguity, both line pressure regulators and line pressure regulators with
    flow-metering devices are addressed with the collective term ‘pressure regulators’.'
