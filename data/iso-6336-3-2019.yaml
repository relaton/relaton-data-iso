abstract:
- language: en
  script: Latn
  content: This document specifies the fundamental formulae for use in tooth bending
    stress calculations for involute external or internal spur and helical gears with
    a rim thickness sR > 0,5 ht for external gears and sR > 1,75 mn for internal gears.
    In service, internal gears can experience failure modes other than tooth bending
    fatigue, i.e. fractures starting at the root diameter and progressing radially
    outward. This document does not provide adequate safety against failure modes
    other than tooth bending fatigue. All load influences on the tooth root stress
    are included in so far as they are the result of loads transmitted by the gears
    and in so far as they can be evaluated quantitatively. This document includes
    procedures based on testing and theoretical studies such as those of Hirt[11],
    Strasser[14] and Brossmann[10]. The results are in good agreement with other methods
    (References [5], [6], [7] and [12]). The given formulae are valid for spur and
    helical gears with tooth profiles in accordance with the basic rack standardized
    in ISO 53. They can also be used for teeth conjugate to other basic racks if the
    virtual contact ratio εαn is less than 2,5. The load capacity determined on the
    basis of permissible bending stress is termed "tooth bending strength". The results
    are in good agreement with other methods for the range, as indicated in the scope
    of ISO 6336‑1. If this scope does not apply, refer to ISO 6336-1:2019, Clause
    4.
