abstract:
- language: en
  script: Latn
  content: 'This document specifies the functional requirements for rail vehicle windscreens,
    including type testing, routine testing and inspection methods for high speed
    rail, heavy rail, light rail and metro applications. This document is also applicable
    for tram vehicles. For on-track machines (OTMs) when in transport mode (self-propelled
    or hauled) the requirements of this standard are applicable. OTMs in working configuration
    are outside the scope of this document. Determination of the size, shape, orientation
    and position of windscreens is outside the scope of this document. These data
    form part of the windscreen technical specification. This document applies to
    windscreens made of laminated glass, which is the most commonly used material,
    but also to other materials, subject to the performance requirements being satisfied.
    This document does not specify requirements for the interfaces between the windscreen
    and the vehicle. Accordingly this document does not address issues relating to:
    installation, structural integrity and crashworthiness.'
