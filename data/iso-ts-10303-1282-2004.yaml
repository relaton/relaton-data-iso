abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1282:2004 specifies the application module for Resource management
    characterized. The following are within the scope of ISO/TS 10303-1282:2004: the
    identification of managed resources; the association of dates, times, people,
    and other management information with managed resources; the association of approvals
    and conditions with managed resources; the association of documents with managed
    resources; the association of justifications with managed resources; the association
    of properties with managed resources.'
