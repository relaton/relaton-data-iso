abstract:
- language: en
  script: Latn
  content: This document specifies the framework, concepts and methodology for conformance
    testing and criteria to be achieved to claim conformance to the family of applicable
    standardization documents regarding geographic information and relevant application
    domains. This document provides a framework for specifying abstract test suites
    composed of abstract test cases grouped in conformance classes and for defining
    the procedures to be followed during conformance testing. Conformance can be claimed
    for data or software products or services or by specifications including any profile
    or functional standard. The structure of, and relationships between, conformance
    classes as defined in this document underly a systematic approach to configuration
    management involving managing dependencies within and between modules.
