abstract:
- language: en
  script: Latn
  content: This document specifies a process to determine the capability of laminate
    floor coverings to withstand exposure to moderate humid and dry climate conditions.
    This document is also applicable to modular mechanically locked floor coverings
    which include moisture sensitive panels with wood-based substrates or other moisture
    sensitive substrates or panels with surface layers with hygroscopic properties,
    e.g. wood veneer or cork.
