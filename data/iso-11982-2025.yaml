abstract:
- language: en
  script: Latn
  content: 'This document provides requirements and guidance for quantifying liquefied
    natural gas (LNG) as a marine fuel on board LNG bunkering ships. It is applicable
    to the measurement of LNG from any source, e.g. gas from conventional reservoirs,
    shale gas, coalbed methane, at the time of: —     ship to ship (STS) transfer
    to LNG-fuelled ships, —     STS transfer between LNG bunkering ships, and —    
    transfer to or from shore tanks or other facilities, irrespective of the type
    of tanks. This document is also applicable to the quantification of biomethane
    and synthetic methane from fossil fuels or renewable sources.'
