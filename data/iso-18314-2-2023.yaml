abstract:
- language: en
  script: Latn
  content: This document specifies the Saunderson correction for different measurement
    geometries and the solutions of the Kubelka-Munk equation for hiding and transparent
    layers. It also specifies methods for the calculations of the tinting strength
    including the residual colour difference based on different criteria such as the
    depth of shade. Finally, methods for determining the hiding power are provided.
    The procedures for preparing the samples for these measurements are not part of
    this document. They are agreed between the contracting parties or are described
    in other national or international standards.
