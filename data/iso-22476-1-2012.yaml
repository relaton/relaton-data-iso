abstract:
- language: en
  script: Latn
  content: 'ISO 22476-1:2012 deals with equipment requirements, the execution of and
    reporting on electrical cone and piezocone penetration tests as part of geotechnical
    investigation and testing according to EN 1997‑1 and EN 1997‑2. Within the electrical
    cone and piezocone penetration test, two subcategories of the cone penetration
    test are considered: electrical cone penetration test (CPT), which includes measurement
    of cone resistance and sleeve friction; piezocone test (CPTU), which is a cone
    penetration test with the additional measurement of pore pressure. The CPTU is
    performed like a CPT with the measurement of the pore pressure at one or several
    locations on the penetrometer surface. ISO 22476-1:2012 specifies the following
    features: type of cone penetration test; application class; penetration length
    or penetration depth; elevation of the ground surface or the underwater ground
    surface at the location of the cone penetration test with reference to a datum;
    location of the cone penetration test relative to a reproducible fixed location
    reference point; pore pressure dissipation tests.'
