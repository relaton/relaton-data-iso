abstract:
- language: en
  script: Latn
  content: ISO 16891:2016 specifies a standard reference test method useful to assess
    the relative degradation characteristics of cleanable filter media for industrial
    applications under standardized simulated test conditions. The main purpose of
    testing is to obtain the information about relative change of properties of filter
    media due to exposure to the simulated gas conditions for a long time. The main
    target of this International Standard is the property change of nonwoven fabric
    filters because they are frequently used under similar circumstances to the test
    gas conditions described in this International Standard. The results obtained
    from this test method are not intended for predicting the absolute properties
    of full scale filter facilities. However, they are helpful for the design of a
    bag filter and selection and development of appropriate cleanable filter media,
    and for the identification of suitable operating parameters.
