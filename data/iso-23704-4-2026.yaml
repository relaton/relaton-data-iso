abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and guidelines for implementing the reference architecture given in ISO 23704-2. Specifically, this document specifies the implementation architecture (IA) including: cyber-physically controlled machine tools (CPCM) for subtractive manufacturing (SM); cyber-supporting system for machine tools (CSSM) for SM. Also, this document provides implementation guidelines (IGs) including: information model of CPSMT for SM; communication model of CPSMT for SM; integration model of CPSMT for SM. As information, the following are included in the annexes: systems engineering (SE) including SE-vee model and stakeholder requirements for SM (see Annex A); use case of IA and IG of CPSMT for SM (see Annex B); an implementation use case for CPSMT (see Annex C).'
