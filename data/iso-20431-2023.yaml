abstract:
- language: en
  script: Latn
  content: This document defines the quality requirements and recommendations applicable
    to heat treatment on mechanical parts intended to be used in the industry (e.g.
    car manufacturing, aerospace, pipeline systems, civil engineering equipment, earth
    moving machinery, agricultural equipment, naval industry, energy equipment, tooling,
    fasteners). This document provides a reference for quality audit and for the inspection
    of heat-treatment facilities, whether these are integrated or belonging to subprime
    contractors. This document can also be used as a basis for discussion and development
    of specifications. A description of the equipment calibration and the frequency
    of the controls is given in Annex A. An example of scoring table is given in Annex B.
    An example of audit report is given in Annex C. The different measuring chain
    testing methods (SAT) are presented in Annex D.
