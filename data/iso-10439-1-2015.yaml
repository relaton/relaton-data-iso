abstract:
- language: en
  script: Latn
  content: 'ISO 10439 specifies minimum requirements and gives recommendations for
    axial compressors, single-shaft, and integrally geared process centrifugal compressors,
    and expander-compressors for special purpose applications that handle gas or process
    air in the petroleum, petrochemical, and natural gas industries. ISO 10439-1:2015
    specifies general requirements applicable to all such machines. ISO 10439-1:2015
    does not apply to fans (these are covered by API 673) or blowers that develop
    less than 34 kPa (5 psi) pressure rise above atmospheric pressure. It also does
    not apply to packaged, integrally geared centrifugal plant, and instrument air
    compressors, which are covered by API 672. Hot gas expanders over 300 °C (570
    °F) are not covered by ISO 10439-1:2015. ISO 10439-1:2015 contains information
    pertinent to all equipment covered by the other parts of ISO 10439. It shall be
    used in conjunction with the following parts of ISO 10439, as applicable to the
    specific equipment covered: ISO 10439‑2; ISO 10439‑3 ISO 10439‑4'
