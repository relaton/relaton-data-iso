abstract:
- language: en
  script: Latn
  content: ISO 17225-1:2014 determines the fuel quality classes and specifications
    for solid biofuels of raw and processed materials originating from a) forestry
    and arboriculture; b) agriculture and horticulture; and c) aquaculture. Chemically
    treated material may not include halogenated organic compounds or heavy metals
    at levels higher than those in typical virgin material values or higher than typical
    values of the country of origin.
