abstract:
- language: en
  script: Latn
  content: ISO 26424:2008 specifies a method for measuring the abrasive wear rate
    of ceramic coatings by means of a micro-scale abrasion wear test based on the
    well-known crater-grinding technique used for coating thickness determination
    in ISO 26423. The method can provide data on both coating and substrate wear rates,
    either by performing two separate tests or by careful analysis of the data from
    a single test series. The method can be applied to samples with planar or non-planar
    surfaces, but the results analysis described in the text applies only to flat
    samples. For non-planar samples, a more complicated analysis, possibly requiring
    the use of numerical methods, is required.
