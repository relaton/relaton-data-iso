abstract:
- language: en
  script: Latn
  content: ISO/TS 81346-3 establishes comprehensive and practice-oriented principles
    and rules for the designation of technical objects within a system, as well as
    for the designation of connections, signals and documents in accordance with the
    corresponding basic standards. The principles of ISO/TS 81346-3 apply to all technical
    fields for all industries and can be applied in all phases of the life cycle of
    a technical object. The designation of types, individuals, cost-centres, projects,
    etc. is not covered.
