abstract:
- language: en
  script: Latn
  content: Many of the systems around us are designed according to the speed of human
    locomotion. Failure of this design can result in a variety of risks. For example,
    if pedestrian signals are not matched to the lower limit of locomotion speed,
    children or elderly may not be able to cross the driveway safely. On the other
    hand, if safety features of machinery are not matched to the higher limit of locomotion
    speed, machinery cannot stop according to the approaches of person. This document
    provides a definition and measurement procedure of normal and steady walking speed
    which can be used as a basis for safety ergonomic designs. The definition and
    measurement procedures of normal and steady walking speed specified in this document
    is intended to serve as a guide for ergonomists who are required to measure human
    walking speed and apply their knowledge to the design of the systems where people
    live and work. In addition, this document presents the various factors that may
    influence normal and steady walking speed to provide points to be aware of when
    designing the system. It serves as a guide on how to take normal and steady walking
    speed measurements, but also gives information on human walking speed to the ergonomists
    and designers which are applied in the solution of design tasks. This document
    is intended to be used in conjunction with national or international regulations
    or agreements to help ensure safe social life for humans.
