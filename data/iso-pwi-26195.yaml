abstract:
- language: en
  script: Latn
  content: This document specifies the accelerated corrosion test method of metal
    and alloy soil, including reagents, test devices, soil preparation, samples, test
    procedures, test results evaluation,and test reports. The soil tests test particularly
    applies to metals and their alloys in soil corrosion, metallic coatings (anodic
    and cathodic), conversion coatings. The soil test does not apply to microbiological-influenced
    corrosion、AC and DC corrosion
