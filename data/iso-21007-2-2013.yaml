abstract:
- language: en
  script: Latn
  content: ISO 21007-2:2013 establishes a common framework for data structure to enable
    the unambiguous identification in gas cylinder (GC) applications and for other
    common data elements in this sector. It enables a structure to allow some harmonization
    between different systems. However, it does not prescribe any one system and has
    been written in a non-mandatory style so as not to make it obsolete as technology
    changes.
