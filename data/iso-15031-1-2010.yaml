abstract:
- language: en
  script: Latn
  content: ISO 15031-1:2010 gives an overview of the structure and the partitioning
    of ISO 15031 (Road vehicles — Communication between vehicle and external test
    equipment for emissions-related diagnostics), and shows the relation between the
    different parts. It also defines the corresponding SAE recommended practices and
    reference to the SAE Digital Annexes. The terminology defined in ISO 15031-1:2010
    is common for all parts of ISO 15031. ISO 15031-1:2010 also describes the use
    cases applicable to the communication between vehicle and external test equipment
    for emissions-related diagnostics.
