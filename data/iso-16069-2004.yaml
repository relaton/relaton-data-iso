abstract:
- language: en
  script: Latn
  content: ISO 16069:2004 describes the principles governing the design and application
    of visual components used to create a safety way guidance system (SWGS). ISO 16069:2004
    contains general principles valid both for electrically powered and for phosphorescent
    components. Special information which is related to the type of component is given
    to assist in defining the environment of use, choice of material, layout, installation
    and maintenance of SWGS. ISO 16069:2004 does not cover risk assessment. Applications
    with different risks to the occupants typically require different layouts and
    types of SWGS. The specific application and exact final design of SWGS is entrusted
    to those persons responsible for this task. ISO 16069:2004 also does not include
    the special considerations of possible tactile or audible components of SWGS,
    nor does it include requirements concerning the emergency escape route lighting,
    especially the design and application of emergency escape route lighting, unless
    illumination is used to mark safety equipment or special features of the escape
    route like the emergency exit doors or stairs. ISO 16069:2004 is intended, by
    collaboration and coordination, to be used by all other Technical Committees within
    ISO and IEC charged with developing SWGS for their specific requirements. ISO
    16069:2004 is not to be used for ships falling under regulations of the International
    Maritime Organization (IMO).
