abstract:
- language: en
  script: Latn
  content: ISO 14673-3|IDF 189-3:2004 specifies a routine method for the determination
    of the nitrate and nitrite contents of milk and milk products by cadmium reduction
    and flow injection analysis (FIA). The method is applicable to hard, semi-hard
    and soft cheeses of various ages, and processed cheese. The detection limits of
    the method are 0,5 mg of nitrate ions per kilogram and 1,0 mg of nitrite ions
    per kilogram, respectively. The method is also applicable to whey powder, milk
    powder and milk-based infant food.
