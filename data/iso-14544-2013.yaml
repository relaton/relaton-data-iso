abstract:
- language: en
  script: Latn
  content: ISO 14544:2013 specifies the conditions for determination of compression
    properties of ceramic matrix composite materials with continuous fibre reinforcement
    for temperatures up to 2 000 °C. ISO 14544:2013 applies to all ceramic matrix
    composites with a continuous fibre reinforcement, unidirectional (1D), bidirectional
    (2D), and tridirectional (xD, with 2 < x ≤ 3), loaded along one principal axis
    of reinforcement.
