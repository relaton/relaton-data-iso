abstract:
- language: en
  script: Latn
  content: This document details the general considerations for the correct specification
    of pre-engineered Indirect Fire Extinguishing (IFE) systems for the protection
    of unoccupiable cabinets and small enclosures of volume up to 20m³. Such cabinets
    and small enclosures may be single or multi-compartment and may include free vent
    areas or airflow. This approach is intended to cover systems that fall outside
    other existing fire extinguishing standards and provide guidance on what equipment
    manufacturers should consider when they assess, specify, design, manu-facture
    and supply a system for this specific application category. It should also provide
    a guide for responsi-ble persons and specifiers as to what information they should
    require of manufacturers and service providers, to confirm the suitability of
    the system being offered. This document allows use of any recognised extinguishing
    agent and allows total flooding or local application solutions to be proposed,
    as appropriate to the fire risk, fire class and specific application conditions
    that are being considered. For example those in ISO 14520, ISO 15779, and ISO
    6183, etc. and accepted within the region the system is to be installed. There
    are other fire risks that can be classified as unoccupiable cabinets / enclosures,
    where other adverse conditions may also require a non-standard solution and the
    practical application of this approach may be deemed a suitable part of the fire
    protection strategy. This document specifies requirements and gives recommendations
    for the design, installation, testing, maintenance and safety of firefighting
    systems in specific equipment, plant or other similar enclosures, and the characteristics
    of the various extinguishants and types of fire for which they are a suitable
    extinguishing approach. This document does not apply to explosion suppression.
