abstract:
- language: en
  script: Latn
  content: This document specifies the taxonomy of production automation (TPA) to
    judge how automatic a manufacturing system in level 0-2 of IEC 62264 is. Reference
    model and major features of the TPA are defined in the deliverable. This document
    is applicable to manufacturing enterprises, providers of manufacturing process
    automation system solutions, and regulatory bodies involved in identifying gaps
    in production automation levels, planning solutions, and improving and enhancing
    them.
