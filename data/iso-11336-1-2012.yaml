abstract:
- language: en
  script: Latn
  content: ISO 11336-1:2012 specifies technical requirements for glazed openings on
    large yachts, taking into account navigation conditions, and the location of the
    opening. Large yachts are yachts with length of the hull, LH, higher or equal
    to 24 m, in use for sport or pleasure and commercial operations, with a tonnage
    limitation up to 3 000 gross tonnage, according to the International Tonnage Convention.
    The opening and the associated closing appliances considered in ISO 11336-1:2012
    are only those that are above the deepest waterline (dsw) and are critical for
    the ship integrity related to weathertightness and watertightness, i.e. those
    that could lead to ingress of water in the hull in case of rupture of the pane.
    The scope of ISO 11336-1:2012 is related to and limited to independent glazed
    openings.
