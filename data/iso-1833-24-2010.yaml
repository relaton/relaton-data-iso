- language: en
  script: Latn
  content: ISO 1833-24:2010 specifies a method using phenol and tetrachloroethane
    to determine the percentage of polyester after removal of non-fibrous matter,
    in textiles made of binary mixtures of certain polyester fibres with acrylic,
    polypropylene or aramid fibres. This method is not applicable to coated fabrics.
