abstract:
- language: en
  script: Latn
  content: ISO 28564-1:2010 specifies requirements and principles for the design and
    application of location plans, maps and diagrams used in public areas and workplaces
    to assist users to understand the environment, locate facilities and determine
    appropriate routes to reach those facilities. These location plans, maps and diagrams
    are referred to as location plans in ISO 28564-1:2010. Location plans are intended
    for use in, for example, shopping centres, stores, hospitals, bus and train stations,
    airports, sporting and entertainment complexes, urban areas, parks, gardens and
    countryside, public attractions, museums and office complexes. ISO 28564-1:2010
    is not applicable to the design of escape plans, nor does it cover the design
    of directional and location wayfinding signs.
