abstract:
- language: en
  script: Latn
  content: This document describes the concept and general principles of EDA for categorical and numerical data. It also provides some guidelines for conducting EDA and its place within Six Sigma projects. This document focuses on the graphical tools of EDA. It is applicable to organizations using manufacturing processes as well as service and transactional processes.
