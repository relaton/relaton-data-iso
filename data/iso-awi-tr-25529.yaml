abstract:
- language: en
  script: Latn
  content: 'This document develops a wavelength-specific terminology for the 380 to
    500 nm portion of the visible light spectrum to enable classification and characterization
    of the optical transmission of ophthalmic devices such as contact lenses, IOL’s,
    spectacles and eye protection. The rationale for this spectral division relates
    to potential visual and non-visual photobiological effects. The document describes
    the potential visual and non-visual effects of optical radiation with wavelengths
    [primarily] from 380 nm to 500 nm. Including consideration of:  i) the spectral
    effects to be considered including the source of radiation; ii) how changes in
    the eye associated with age might modulate such effects, and the characteristics of
    phakic, pseudophakic and aphakic eyes; iii) modification by filtration and or
    reflection of the radiation before it reaches the eye; iv) the optical radiation
    factors to be explored include the effect of spectral energy distribution reaching
    or entering the eye, irradiance and radiance, and the duration and the angular
    size of the exposure. This document also provides information relating to limitations
    that exist in terminology, measurement methods and data models which have been
    used for determining visual and non-visual impacts, and calculations relating
    to claims for these wavelengths. This information is intended to be useful in
    the development of uniform terminology in standards in the ophthalmic optics and
    eye and face protection committees.This document does not: - specify requirements
    relating to protection from these wavelengths; - address other optical radiation
    spectral bands.'
