abstract:
- language: en
  script: Latn
  content: ISO/TS 12025:2012 provides methodology for the quantification of nano-object
    release from powders as a result of treatment, ranging from handling to high energy
    dispersion, by measuring aerosols liberated after a defined aerosolization procedure.
    In addition to information in terms of mass, the aerosol is characterized for
    particle concentrations and size distributions. ISO/TS 12025:2012 provides information
    on factors to be considered when selecting from the available methods for powder
    sampling and treatment procedures and specifies minimum requirements for test
    sample preparation, test protocol development, measuring particle release and
    reporting data. In order to characterize the full size range of particles generated,
    the measurement of nano-objects as well as agglomerates and aggregates is recommended
    in ISO/TS 12025:2012.
