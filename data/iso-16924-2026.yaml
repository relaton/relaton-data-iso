abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the design, construction, operation,
    maintenance and inspection of stations for fuelling liquefied natural gas (LNG)
    to vehicles, including equipment, safety and control devices. This document also
    specifies the design, construction, operation, maintenance and inspection of fuelling
    stations using LNG as an onsite source for supplying compressed natural gas (CNG)
    to vehicles, commonly referred to as liquefied-to-compressed natural gas (LCNG)
    fuelling stations, including safety and control devices of the station and specific
    LCNG fuelling station equipment. NOTE            Specific CNG equipment is dealt
    with in ISO 16923. This document is applicable to fuelling stations receiving
    LNG and other liquefied methane-rich gases such as bio LNG which comply with local
    applicable gas composition regulations or with the gas quality requirements of
    ISO 13686. This document covers all equipment from the LNG storage tank unloading
    connection up to (but not including) the fuelling nozzle on the vehicle. The LNG
    storage tank unloading connection itself and the vehicle fuelling nozzle are not
    covered in this document. This document applies to fuelling stations having the
    following characteristics: private access; public access (self-service or assisted);
    metered dispensing and non-metered dispensing; fuelling stations with fixed LNG
    storage; fuelling stations with mobile LNG storage; movable fuelling stations;
    mobile fuelling stations; multi-fuel stations. This document does not apply to:
    equipment, piping, or tubing downstream of the gas pressure regulator for closed
    boil-off gas systems;  liquefaction equipment.'
