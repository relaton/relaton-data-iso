abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1675:2006 specifies the application module for Functional
    decomposition to assembly design. ISO/TS 10303-1675:2006 deals with the allocation
    of a functional unit in a hierarchical network definition to an assembly joint
    concept in an assembly definition primarily intended for detailed and extended
    analysis of a design. The following is within the scope of ISO/TS 10303-1675:2006:
    creation of functional network definition for detailed analysis of design issues.'
