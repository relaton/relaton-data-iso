abstract:
- language: en
  script: Latn
  content: 'This document specifies graphical symbols for diagrams related to industrial
    components, products and processing. This document constitutes a symbol library,
    from which users can use the symbols or created symbol examples for use in diagrams
    (see Tables 1 to 149). General rules and guidance for the preparation and presentation
    of graphical symbols are given in ISO 14617-1. Application rules for the symbols
    are shown in normative Annex A. This document does not apply to: —    graphical
    symbols for fluid power objects, see ISO 1219-1 (the collective application standard
    of the ISO 14617 series); —    symbols of measurement and control functions such
    as mathematical functions and process functions; —    graphical symbols for electrotechnical
    objects, see the IEC 60617 database. Symbols deleted from the previous edition
    of the ISO 14617 series are summarized in informative Annex B as a reference.
    The alphabetic index of symbols defined in this document is shown in informative
    Annex C.'
