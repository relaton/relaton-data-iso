abstract:
- language: en
  script: Latn
  content: ISO 19064-1:2015 establishes a system of designation for styrene/acrylonitrile
    (SAN) moulding and extrusion materials, which may be used as the basis for specifications.
    The types of styrene/acrylonitrile plastic are differentiated from each other
    by a classification system based on appropriate levels of the designatory properties,
    a) Vicat softening temperature, b) melt mass-flow rate, and on information about
    composition, intended application and/or method of processing, important properties,
    additives, colorants, fillers and reinforcing materials. ISO 19064-1:2015 is applicable
    to all copolymers of styrene and/or substituted styrene having between 5 % (m/m)
    and 50 % (m/m) acrylonitrile. It applies to materials ready for normal use, unmodified
    or modified by colorants, additives, fillers, etc. ISO 19064-1:2015 does not apply
    to expandable materials. It is not intended to imply that materials having the
    same designation give necessarily the same performance. This part of ISO 19064
    does not provide engineering data, performance data or data on processing conditions
    which may be required to specify a material for a particular application and/or
    method of processing. If such additional properties are required, they shall be
    determined in accordance with the test methods specified in ISO 4894-2, if suitable.
    In order to specify a thermoplastic material for a particular application or to
    ensure reproducible processing, additional requirements may be given in data block
    5 (see 3.1).
