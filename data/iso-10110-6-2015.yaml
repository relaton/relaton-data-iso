abstract:
- language: en
  script: Latn
  content: ISO 10110-6:2015 specifies the presentation of design and functional requirements
    for optical elements and systems in technical drawings used for manufacturing
    and inspection. ISO 10110-6:2015 specifies rules for indicating centring tolerances
    for optical elements, subassemblies, and assemblies. ISO 10110-6:2015 applies
    to plano surfaces, rotationally invariant surfaces, circular cylindrical, non-circular
    cylindrical, and non-symmetrical surfaces (general surfaces). General surfaces
    are described using ISO 10110‑19.
