abstract:
- language: en
  script: Latn
  content: This document specifies the test method for evaluating the formaldehyde purification performance of interior wall coatings using the bag method. This document is applicable to the measurement and evaluation of formaldehyde purification performance of various types of interior wall coatings. This document can also apply to other indoor decoration materials with formaldehyde purification performance, such as wallpaper, carpets and decorative panels. Additionally, the method can be extended to the evaluation of the purification performance of other carbonyl compounds, such as acetaldehyde, propionaldehyde and butyraldehyde.
