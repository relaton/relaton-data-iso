abstract:
- language: en
  script: Latn
  content: This document specifies the techniques for manual ultrasonic testing of
    claddings on steel applied by welding, rolling and explosion using single-transducer
    or dual-transducer probes. The test is intended to cover detection of two-dimensional
    or three-dimensional discontinuities in the cladding and in the region of the
    interface. This document does not give acceptance criteria nor define the extent
    of testing.
