abstract:
- language: en
  script: Latn
  content: 'A clinical pathway (CP) is a tool for effectively managing a care process.
    Since the first use of the term ‘clinical pathway’ in 1985 by Zander, et al.,
    it has become called variously including ‘care pathway’, ‘critical pathway’, ‘integrated
    care pathway’, ‘care map’ and so on. We use the term “clinical pathway” or “CP”
    in short, in the following. Recently, CPs are increasingly digitized and the need
    for patient participation in clinical care is becoming more pronounced. To deliver
    more streamlined and patient-centric care, the proposed work item aims to deliver
    a generic model that represents both healthcare process by clinicians and prescribed
    care process by patients at home in a synchronized way through two-way communication
    between the two processes, sharing the same data block construct. The generic
    model for bridging healthcare process and prescribed care processes may be considered
    to represent an extended “clinical pathway” which enables care coordination between
    the patients and their healthcare professionals. The proposed work item intends
    to establish a Technical Specification for the generic model for bridging healthcare
    process and prescribed care processes with deliverables including: 1) concepts
    of healthcare process and prescribed care process, 2) business viewpoint, enterprise
    viewpoint, and information viewpoint of the bridged healthcare and prescribed
    care processes, 3) generic representation of integrated care processes, and 4)
    high level specification for the generic model. The deliverables will be in accordance
    with ISO 23903 Interoperability and integration reference architecture - Model
    and framework. The aims of this technical specification include the following:
    ･ support and promote collaborated care between healthcare professionals and patients;
    ･ bridge healthcare process and prescribed care process; ･ provide high-level
    specifications for implementations; ･ make care process data available for Learning
    Health System (LHS); The work item intends to deliver the high-level specifications
    only and not the implementation details.'
