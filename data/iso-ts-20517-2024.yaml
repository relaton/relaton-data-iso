abstract:
- language: en
  script: Latn
  content: This document defines requirements and recommendations to be used for the
    management of cybersecurity in space systems. Space systems include manned and
    unmanned spacecraft, launcher, payload, experiment, ground equipment and any other
    space facilities. This document describes the processes, techniques, and responsibilities
    for managing the cybersecurity, ways to prevent and mitigate accidents and incidents.
    This document addresses systems engineering activities and provides requirements
    and recommendations for security engineering. This document establishes a common
    reference for the space sector to work to manage the systems engineering issues
    related to cybersecurity for all space products, services and projects. This document
    doesn't describe in detail the systems engineering processes or related project
    management processes, or detailed requirements or processes for cybersecurity.
