abstract:
- language: en
  script: Latn
  content: ISO/TR 14786:2014 is intended to provide information and analyses in support
    of the development of chemical nomenclature for the naming of "nano-objects".
    "Nano-objects" have been defined in ISO/TS 80004‑1:2010 to mean "materials with
    one, two, or three external dimensions in the nanoscale", with the nanoscale defined
    as the "size range from approximately 1 nm to 100 nm". Nano-objects are further
    defined as nanoplates, nanofibres, and nanoparticles. More specifically, the nano-objects
    that are the subject of ISO/TR 14786:2014 are discrete chemical entities rather
    than devices or mixtures (preparations). The nano-objects discussed in this Technical
    Report are not intended to constitute an exhaustive list. ISO/TR 14786:2014 is
    intended to facilitate communications between developers and potential users of
    nomenclature including academia, industry, government and non-governmental organizations.
