abstract:
- language: en
  script: Latn
  content: This document specifies the tests for verifying the stability of rough-terrain
    counterbalanced trucks with mast, equipped with fork arms or with load handling
    attachments with a rated load up to and including 10 000 kg. It is not applicable
    to trucks designed for handling freight containers, which are dealt with by ISO 22915-9.
    It is not applicable to rough-terrain variable-reach trucks when fitted with a
    vertical mast attachment.
