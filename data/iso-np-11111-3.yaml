abstract:
- language: en
  script: Latn
  content: This part of ISO 11111 is intended to be used in conjunction with ISO 11111-1, ISO 11111-2, ISO 11111-6 and ISO 11111-7. It specifies significant hazards and corresponding safety requirements and/or measures for nonwoven machinery. By taking into account the scope of ISO 11111-1 as far as is relevant, this part of ISO 11111 is applicable to all machinery, plant and related equipment intended to be used for opening, cleaning, blending, carding, needle punching, cylinder drying and batching, as specified in Clause 5.
