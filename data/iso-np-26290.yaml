abstract:
- language: en
  script: Latn
  content: This document specifies an iodometric titration method for determining the average oxidation state of cobalt and calculating the oxygen non-stoichiometry of applicable cobalt-containing oxide ceramic materials. It specifies procedures for sample preparation, dissolution, iodometric titration, calculation of oxygen non-stoichiometry and reporting of analytical results. This document applies to cobalt-containing oxide ceramic materials in which oxygen non-stoichiometry is expressed by the oxygen deficiency parameter (δ) and can be derived from the average oxidation state of cobalt using the appropriate charge neutrality relationship. The method is intended for material characterization, quality control, and research and development. It provides a harmonized analytical procedure for obtaining reproducible and comparable oxygen non-stoichiometry data among laboratories. This document is not applicable to oxide ceramic materials requiring pretreatment, reaction conditions or calculation procedures different from those specified in this document.
