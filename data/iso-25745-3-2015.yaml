abstract:
- language: en
  script: Latn
  content: 'ISO 25745-3:2015 specifies generic tools for estimating energy consumption
    of escalators and moving walks, and a consistent method for energy performance
    classification of existing, modernized, or new escalators and moving walks. It
    considers the energy performance during the operational portion of the life cycle
    of escalators and moving walks. It does not cover energy consumption and classification
    of the ancillary equipment, such as the following: a) lighting with the exception
    of comb plate lighting, step gap lighting, and traffic light (comb plate lighting,
    step gap lighting, and traffic light are considered essential for the operation
    of the equipment and are therefore not defined as ancillary equipment); b) cooling
    and heating and machine room ventilation; c) alarm devices and emergency battery
    supplies equipment, etc.; d) environmental conditions; e) consumption through
    the power sockets. There can be other electrical loads not associated with the
    escalator or moving walk, and not included. ISO 25745-3:2015 considers all escalators
    and inclined moving walks up to a rise of 8 m and horizontal moving walks with
    a length up to 60 m (this represents about 85 % of worldwide installed units).'
