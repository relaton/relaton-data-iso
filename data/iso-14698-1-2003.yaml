abstract:
- language: en
  script: Latn
  content: ISO 14698:2003 establishes the principles and basic methodology of a formal
    system of biocontamination control (Formal System) for assessing and controlling
    biocontamination when cleanroom technology is applied for that purpose. It specifies
    the methods required for monitoring risk zones in a consistent way and for applying
    control measures appropriate to the degree of risk involved. In zones where risk
    is low, it can be used for information.
