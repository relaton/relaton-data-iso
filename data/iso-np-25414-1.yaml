abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the hardware, software, communication
    interfaces and data exchange needed to ensure interoperability of parcel locker
    systems used for unattended delivery, collection and return of parcels in multi
    operator, multi carrier environments. It applies to fixed, unattended parcel lockers
    in public locations and does not cover detailed product safety, construction requirements
    or business models
