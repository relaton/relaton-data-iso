abstract:
- language: en
  script: Latn
  content: The proposed standard specifies a competency framework for professionals
    engaged in project, programme, and portfolio management (PPPM), as well as those
    involved in related governance activities. The proposed standard provides a structured
    and comprehensive framework of the knowledge, skills, abilities, behaviours, and
    attributes needed to support effective performance in these roles. The proposed
    standard is aligned with the competency expectations for project personnel as
    described in ISO 21502, and is consistent with the capability-related guidance
    provided in ISO 21503, ISO 21504, and ISO 21505. It also aligns with the concepts
    and practices defined in ISO 21500 series standards. It can serve as a tool for
    defining, assessing, and developing the competencies necessary to achieve both
    individual and organizational objectives. Applications of the framework include
    competency-based recruitment, professional development, performance assessment,
    and organizational capability building. The proposed standard is applicable to
    professionals who participate in the management of the project, programme, and
    portfolio, and related governance. It is also applicable to any organization,
    including public, private and charitable, as well as, to any type of project,
    programme and portfolio, regardless of purpose, delivery approaches, life cycle
    model used, complexity, size, cost or duration.
