abstract:
- language: en
  script: Latn
  content: 'This document specifies guidelines for the implementation of continuous
    monitoring systems for drinking water quality and operational parameters in drinking
    water distribution networks. It provides guidance for determining the: — effective
    number of continuous monitoring stations in the drinking water distribution network;
    — location of monitoring stations in the drinking water distribution network;
    — types of operational and drinking water quality parameter measuring devices
    (MDs) that can be installed in a continuous monitoring station; — quality control,
    maintenance and calibration requirements of the continuous monitoring system.
    This document excludes guidance on the design, structure, number and type of MDs
    to be installed in a continuous monitoring system.'
