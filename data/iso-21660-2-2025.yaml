abstract:
- language: en
  script: Latn
  content: This document specifies a method for determination of the moisture content
    in a test portion of the laboratory sample by drying the test portion in an oven.
    This method is applicable for routine production control on site, e.g. if a high
    precision of the determination of moisture content is not required. It is applicable
    to all solid recovered fuels. If the solid recovered fuel contains large amounts
    of oil-fractions, a lower temperature is advisable (e.g. 50 °C ± 10 °C) and a
    longer drying time until constant mass is achieved. As an alternative, the Karl-Fischer-Titration-Method
    (see ISO 760[1]) is advisable. NOTE 1        The total moisture content of recovered
    fuels is not an absolute value and therefore standardised conditions for its determination
    are indispensable to enable comparative determinations. NOTE 2        The term
    moisture content when used with recovered materials can be misleading since solid
    recovered materials, e.g. biomass, frequently contain varying amounts of volatile
    compounds (extractives) which can evaporate when determining the moisture content
    of the general analyses sample by oven drying.
