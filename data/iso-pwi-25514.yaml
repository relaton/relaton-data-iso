abstract:
- language: en
  script: Latn
  content: Based on the British Ship Research Association (BSRA) Standard method of
    speed trial analysis (SMSTA), this document specifies requirements for the preparation,
    execution and reporting of the wind propulsion system force matrix (WPSFM), test
    and provides procedures to be applied in the analysis, evaluation and correction
    of the gathered speed trial data covering all influences that can be relevant
    to the individual trial runs reporting of WPSFM test, with reference to the effects
    that can have an influence upon the speed, power and propeller shaft speed and
    relative wind direction relationship.
