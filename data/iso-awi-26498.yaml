abstract:
- language: en
  script: Latn
  content: This standard describes the procedure for determining the repassivation
    potential for crevice corrosion (ER,CREV) of stainless steels in neutral aqueous
    solutions containing chloride ions by a cyclic anodic polarization test. The ER,CREV
    determined in accordance with this standard can be used as relative index of the
    corrosion resistance of materials. When the test environment is appropriately
    selected, it can also be used as a reference for estimating the corrosion resistance
    threshold of the material in the intended service environment.
