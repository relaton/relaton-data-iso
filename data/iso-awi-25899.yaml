abstract:
- language: en
  script: Latn
  content: 'This proposal regulates the technical requirements of sludge as auxiliary
    solid fuel, including sludge quality control, sludge as auxiliary solid fuel pretreatment
    and utilization, sludge sampling and monitoring methods. The proposal applies
    to sludge derived specifically from: - Primary sludge, - Residual sludge, - Mixed
    sludge generated in the sewage purification process of the municipal sewage treatment
    plant. The referred sludge in this standard does not include grid slag, scum and
    sand pit gravel.'
