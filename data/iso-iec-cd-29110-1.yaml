abstract:
- language: en
  script: Latn
  content: This part of ISO/IEC 29110 introduces the major concepts required to understand
    and use the ISO/IEC 29110 series. It introduces the characteristics and requirements
    of a VSE and clarifies the rationale for VSE-specific profiles, documents, standards
    and guides. This part of ISO/IEC 29110 also introduces process, lifecycle, standardization
    concepts and defines the organizational terms common to the VSE Profile Set of
    Documents. This part of ISO/IEC 29110 is applicable to a VSE. A VSE is an entity
    (enterprise, organization, department or project) having up to 25 people. The
    lifecycle processes described in the ISO/IEC 29110 series, Standardized Profiles
    and Technical Reports are not intended to preclude nor discourage their use by
    an entity that is larger than a VSE.
