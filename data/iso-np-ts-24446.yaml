abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements for an electronic machine
    interface between a blasthole drill rig and an external control system. This document
    does not provide technical details of the means of implementing the electronic
    machine interface. Such details are to be agreed upon by the implementers of the
    external control system and the base machine control system that comprise the
    drilling system. This document identifies areas that system developers and system
    integrators designing implementations of the electronic machine interface would
    consider when performing a risk assessment and defining safety requirements and
    other risk reductions measures as part of the overall system safety program of
    a drilling system. This document is applicable to blasthole drill rigs used in
    surface mining applications, independent of the prime mover and energy source.
    It is not applicable to other types of machinery or mining applications.
