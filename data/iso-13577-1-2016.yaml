abstract:
- language: en
  script: Latn
  content: ISO 13577-1:2016 the general safety requirements common to industrial furnaces
    and associated processing equipment (TPE). ISO 13577-1:2016 deals with the significant
    hazards, hazardous situations or hazardous events relevant to TPE, as listed in
    Annex A, when TPE is used as intended and also under conditions of misuse that
    are reasonably foreseeable by the manufacturer. Annex B provides a list of common
    industrial furnaces and associated processing equipment. This document specifies
    the requirements intended to be met by the manufacturer to ensure the safety of
    persons and property during commissioning, start-up, operation, shut-down, maintenance
    periods and dismantling, as well as in the event of foreseeable faults or malfunctions
    that can occur in the equipment. These general safety requirements apply to all
    TPE, unless an exception is given in other parts of ISO 13577 dealing with specific
    equipment. The provisions of other parts of ISO 13577 that directly apply to specific
    types of TPE take precedence over the provisions of this document. ISO 13577-1:2016
    is not applicable to blast furnaces, converters (in steel plants), boilers or
    equipment not covered under ISO 12100.
