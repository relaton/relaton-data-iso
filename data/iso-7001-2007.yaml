abstract:
- language: en
  script: Latn
  content: ISO 7001:2007 specifies graphical symbols for the purposes of public information.
    It is generally applicable to public information symbols in all locations and
    all sectors where the public has access. ISO 7001:2007 specifies the symbol originals
    that may be scaled for reproduction and application purposes. The symbols may
    be used in conjunction with text to improve comprehension.
