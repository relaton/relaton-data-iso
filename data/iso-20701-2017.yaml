abstract:
- language: en
  script: Latn
  content: ISO 20701 | IUF 427:2017 specifies a method for determining the colour
    fastness to saliva of all kinds of leathers, independent of the colouring procedure
    applied. The method uses an artificial saliva solution to simulate whether colouring
    materials can migrate from leather to the mouth or to the mucous membranes.
