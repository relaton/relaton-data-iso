abstract:
- language: en
  script: Latn
  content: 'New scope of powder coating standard. This document is applicable to the corrosion protection provided by organic powder coating on: a) steel components from carbon steel and low-alloy steel, b) steel components from continuously hot dip coated steel in accordance with EN 10346, c) steel components that have been hot dip galvanized in accordance with ISO 1461, d) steel components that have been electroplated in accordance with ISO 2081, e) steel components that have been sherardized in accordance with ISO 17668, f) steel components that have been thermal-sprayed metallic coated in accordance with ISO 2063-1 and ISO 2063-2. This document defines terms for the use of the document. This document provides requirements for: - powder coating materials - surface preparation and pre-treatment before powder coating - application of powder coatings - measurement of coating thickness of powder coatings - quality assurance test procedures to indicate suitability for certain durability ranges in environments that can be classified according to ISO 9223 This document provides guidance on certain powder coating systems that may be suitable for certain durability ranges in environments that can be classified according to ISO 9223. This document does not apply to: - coil coating of steel sheet or strip. - visual or decorative aspects of powder coating. - Corrosion protection requirements in environments that cannot be classified according to ISO 9223 - corrosion protection requirements for powder coatings related to influence of organic organisms (e.g., bacteria or fungi), chemical attack (e.g., acids, alkalis, organic solvents, gases); mechanical damage (e.g., abrasion and wear); fire - powder coating of reinforcing steel and components for use in reinforced concrete. - Corrosion performance, or application of, metallic coatings'
