abstract:
- language: en
  script: Latn
  content: This International Standard establishes minimum cybersecurity, trusted
    communications and interoperability requirements for smart container IoT devices.
    The requirements are intended to provide an internationally harmonised baseline
    that supports compliance with applicable national and regional cybersecurity regulations
    while facilitating global multimodal transport. This Part does not replace applicable
    legislation. It establishes technology-neutral requirements that can be implemented
    independently of jurisdiction and communication technology.
