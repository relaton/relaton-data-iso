abstract:
- language: en
  script: Latn
  content: This document provides an overview of the corrosivity of disinfectants
    and corrosion protection when using disinfectants, including an overview of test
    methods that can be used to determine their corrosivity. This document is generic
    and applicable to organizations of all sizes in all industries, as well as to
    families and individuals, and it is intended to assist in determining appropriate
    health and safety measures regarding the use of disinfectants. The resolution
    of security issues related to the use of disinfectants is outside the scope of
    this document.
