abstract:
- language: en
  script: Latn
  content: This document gives guidelines for a landslide early warning system. It
    provides a definition, aims to improve understanding, describes methods and procedures
    to be implemented, and gives examples of types of activities. It is applicable
    to communities vulnerable to landslides, without taking secondary effects into
    consideration. It recognizes population behaviour response planning as a key part
    of the preparedness. It takes into account the approach of ISO 22315 and provides
    additional specifications for landslides.
