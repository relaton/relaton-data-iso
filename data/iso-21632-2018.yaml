abstract:
- language: en
  script: Latn
  content: 'This document provides directions for measuring and calculating the electricity
    consumption of any format of digital production press, whose modes, other than
    production printing mode, play a significant role in the comprehensive energy
    consumption. It excludes digital presses designed to print substrates other than
    paper or plastic and conventional printing presses fitted with digital inkjet
    printing heads. It can be used to compare the energy efficiency figures for different
    machine combinations: best-quality (slowest), highest-productivity (fastest) or
    other alternative combinations.'
