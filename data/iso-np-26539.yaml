abstract:
- language: en
  script: Latn
  content: 'This document provides a framework for flood risk assessment of physical
    and operational losses in individual structures and facilities in private and
    public organizations. This document includes methodologies for assessing projected
    flood risks under the future climate scenarios. NOTE: Risk assessment is necessary
    for risk finance, and this document complements ISO 37116:2026 that provides organizations
    with principles and general requirements for finance for ex-ante investment in
    risk reduction.'
