abstract:
- language: en
  script: Latn
  content: This document describes hose impulse testing, with flexing, of rubber or
    plastics hydraulic hose assemblies at both high and low impulse pressures. The
    high-pressure testing is carried out at pressures greater than 3 MPa and the low-pressure
    testing at pressures from 1,5 MPa to 3 MPa. The test procedure is applicable to
    hydraulic hose assemblies that are subject to pulsating pressures in service which
    are included in the product requirements. NOTE Impulse test procedures without
    flexing can be found in ISO 6803.
