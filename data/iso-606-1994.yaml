abstract:
- language: en
  script: Latn
  content: Specifies requirements for short-pitch precision roller chains of simple
    and multiplex construction suitable for the mechanical transmission of power and
    allied applications, together with those for their associated chain wheels. Covers
    dimensions, tolerances, length measurement, proof testing and minimum tensile
    strengths. Although it applies to chain wheels for cycles and motor cycles, it
    does not apply to chains for cycles and motor cycles, which are covered by ISO
    9633 and ISO 10190 respectively.
