abstract:
- language: en
  script: Latn
  content: This document specifies design methods for combination of actions and spans
    for factory made, self-supporting, double skin metal faced insulating sandwich
    panels (hereafter sandwich panels) according to ISO/DIS 17880:2025. The sandwich
    panels are for use in self-supporting and structural applications in roofs, in
    external and internal walls (including partitions) and in ceilings in buildings
    as well as those in cold store applications. This document covers uniformly distributed
    loads and thermal gradients, it gives no information about normal forced axially
    loaded sandwich panels, torsional loaded sandwich panels or sandwich panels as
    a part of a diaphragm.
