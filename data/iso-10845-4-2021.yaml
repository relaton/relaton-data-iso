abstract:
- language: en
  script: Latn
  content: This document sets out standard conditions for the calling for expressions
    of interest which a) bind the employer and respondent to behave in a particular
    manner, b) establish what is required for a respondent to submit a compliant submission,
    c) make known to respondents the evaluation criteria, and d) establish the manner
    in which the employer conducts the process of calling for expressions of interest.
    This document is intended for use in procurements relating to goods, services
    and construction works and certain disposals other than by auction.
