abstract:
- language: en
  script: Latn
  content: ISO 16730-1:2015 establishes a framework for the verification and validation
    of all types of calculation methods used as tools for fire safety engineering
    by specifying specific procedures and requirements for the purpose. It does not
    address specific fire models, but it is applicable to analytical models, algebraic
    correlations and complex numerical models, which are addressed as calculation
    methods in the context of this International Standard. This International Standard
    includes - a process to determine that the relevant equations and calculation
    methods are implemented correctly (verification) and that the calculation method
    being considered is an accurate representation of the real world (validation),
    - requirements for documentation to demonstrate the adequacy of the scientific
    and technical basis of a calculation method, - requirements for data against which
    a calculation method's predicted results are checked, and - guidance on use of
    this International Standard by developers and/or users of calculation methods,
    and by those assessing the results obtained by using calculation methods.
