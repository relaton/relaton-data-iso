abstract:
- language: en
  script: Latn
  content: This document establishes the content for commercial literature for concrete
    mixers used either as individual machines on building sites or as components of
    batching plants. Definitions refer to whole machines, their structure and parameters.
    The commercial specifications establish technical characteristics of the whole
    machines and their components. Truck mixers, as defined in ISO 19711‑1, are excluded
    from this document.
