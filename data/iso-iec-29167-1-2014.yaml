abstract:
- language: en
  script: Latn
  content: ISO/IEC 29167-1:2014 defines the architecture for security services for
    the ISO/IEC 18000 air interfaces standards for radio frequency identification
    (RFID) devices. Its purpose is to provide a common technical specification for
    optional security services for RFID devices that may be used by ISO committees
    developing RFID application standards. ISO/IEC 29167-1:2014 defines various security
    features called security mechanisms that can be implemented by a tag depending
    on the application. A tag may support one, a subset, or all of the specified security
    mechanisms. For an interrogator it is possible to get information about the security
    mechanisms that are actually implemented and supported by a tag. Moreover, it
    has been considered that adding new security mechanisms remains possible. Besides
    signalling the presence of certain security services, further details of the mechanisms
    such as utilized encryption algorithm and key length also need to be specified
    and accessible. ISO/IEC 29167-1:2014 defines the requirements for crypto suites
    defined in further parts of ISO/IEC 29167 and furthermore defines how crypto suites
    identifiers are assigned to the various parts of ISO/IEC 29167.
