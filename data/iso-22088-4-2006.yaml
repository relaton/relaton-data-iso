abstract:
- language: en
  script: Latn
  content: ISO 22088-4:2006 specifies a ball or pin impression method for the determination
    of the environmental stress cracking (ESC) behaviour of plastics by means of a
    constant-strain test. The method is applicable to finished products and to test
    specimens prepared by moulding and/or machining, and can be used for the assessment
    of the ESC behaviour of a plastic product or material exposed to different environments,
    as well as for the determination of the ESC behaviour of different plastics materials
    exposed to a specific environment. An alternative method for the determination
    of environmental stress cracking by means of a constant-strain test is specified
    in ISO 22088-3 and ISO 22088-5. A method for the determination of environmental
    stress cracking by means of a constant-stress test is specified in ISO 22088-2.
