abstract:
- language: en
  script: Latn
  content: This document specifies a practical procedure to create and verify distance-speed
    diagrams and speed curves using the parameters specified in ISO 24675-1, from
    which the shortest running time for railway timetabling is obtained by numerically
    integrating the speed curves. This document excludes running time calculation
    used for purposes other than timetabling.
