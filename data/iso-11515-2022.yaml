abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements for the materials, design,
    construction and performance testing of —    Type 2 hoop-wrapped composite tubes,
    —    Type 3 fully-wrapped composite tubes, and —    Type 4 fully-wrapped composite
    tubes with water capacities between 450 l and 3 000 l for storage and conveyance
    of compressed or liquefied gases with test pressures up to and including 1 600 bar[1]
    and a design life of at least 15 years. This document is applicable to expected
    service temperatures between −40 °C and +65 °C. NOTE       Type 4 tubes manufactured
    and tested to this document are not intended to contain toxic, oxidizing or corrosive
    gases. This document is applicable to tubes with composite reinforcement of carbon
    fibre or aramid fibre or glass fibre (or a mixture thereof) in a matrix.   [1]
    1 bar = 0,1 MPa = 105 Pa; 1 MPa = 1 N/mm2.
