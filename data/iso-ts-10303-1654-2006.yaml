abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1654:2006 specifies the application module for Characteristic.
    The following are within the scope of ISO/TS 10303-1654:2006: identification of
    scalar characteristic; identification of tolerance characteristic; identification
    of range characteristic; identification of measurements in which there is an associated
    uncertainty; items within the scope of application module Characterizable object,
    ISO/TS 10303-1765; items within the scope of application module Document assignment,
    ISO/TS 10303-1122; items within the scope of application module Extended measure
    representation, ISO/TS 10303-1106; items within the scope of application module
    Value with unit extension, ISO/TS 10303-1753.'
