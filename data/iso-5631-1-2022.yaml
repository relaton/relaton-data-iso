abstract:
- language: en
  script: Latn
  content: This document specifies a method for measuring the colour of paper and
    board by the diffuse reflectance method with the elimination of specular gloss.
    This document is not applicable to coloured papers or boards which incorporate
    fluorescent dyes or pigments. It may be used to determine the colour of papers
    or boards which contain fluorescent whitening agents provided the UV content of
    the illumination on the test piece has been adjusted to conform to that in the
    CIE illuminant C, using a fluorescent reference standard that fulfils the requirements
    for international fluorescent reference standards of level 3 (IR3) as prescribed
    by ISO 2469 with an assigned ISO brightness value provided by an authorized laboratory,
    as described in ISO 2470‑1.
