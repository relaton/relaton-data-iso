abstract:
- language: en
  script: Latn
  content: This International Standard specifies a potentiometric titration method
    for the determination of chromium content in steel and iron. The method is applicable
    to chromium contents between 1 % (m/m) and 35 % (m/m). Vanadium contents in steel
    and iron should be less than 1 % (m/m) for chromium contents higher than 10 %
    (m/m) and less than 0,2 % (m/m) for chromium contents less than 10 % (m/m).
