abstract:
- language: en
  script: Latn
  content: ISO 9017:2017 specifies the sizes of test specimen and the procedures for
    carrying out fracture tests in order to obtain information about types, sizes
    and distribution of internal imperfections such as porosities, cracks, lack of
    fusion, lack of penetration and solid inclusions on the fracture surface. ISO
    9017:2017 applies to metallic materials in all forms of product with joints made
    by any fusion welding process with a thickness greater or equal to 2 mm.
