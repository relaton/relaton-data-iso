abstract:
- language: en
  script: Latn
  content: This document specifies a method, using glacial acetic acid, to determine
    the mass percentage of acetate, after removal of non-fibrous matter, in textiles
    made of mixtures of — acetate with — certain chlorofibres or after-chlorinated
    chlorofibres. It is also possible to analyse mixtures containing acetate by using
    the test methods described in ISO 1833-3 or ISO 1833-9.
