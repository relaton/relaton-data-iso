abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the contents of a technical file
    to demonstrate the fulfilment of regulatory requirements for an endosseous dental
    implant that can include: implant body; implant abutment; abutment screw; implant
    connecting part; implant connecting part screw; prosthetic screw; implant cover
    screw; transmucosal healing component. This document also specifies requirements
    for intended use and performance, design attributes, components, biocompatibility,
    manufacturing, packaging, sterilization, shelf life, marking, labelling and information
    supplied by the manufacturer. This document does not apply to the following devices:
    dental implants incorporating animal or human components or bioactive characteristics;
    custom-made devices that have no pre-fabricated connection; implantable materials
    for bone filling and augmentation in oral and maxillofacial surgery; membrane
    materials for guided tissue regeneration in oral and maxillofacial surgery; specific
    instruments indicated to be used as part of a dental implant system. NOTE 1       
    ISO 22794 specifies the necessary content of technical files for implantable materials
    for bone filling and augmentation in oral and maxillofacial surgery. ISO 22803
    specifies the necessary content of technical files for membrane materials for
    guided tissue regeneration in oral and maxillofacial surgery. These materials
    require a separate technical file. NOTE 2        ISO 13504 gives the general requirements
    for specific instruments indicated to be used as part of a dental implant system.
    These instruments require a separate technical file. NOTE 3        Custom-made
    devices are defined in IMDRF/PMD WG/N49 [5].'
