abstract:
- language: en
  script: Latn
  content: ISO 2017-3:2015 establishes requirements to ensure appropriate exchange
    of information regarding the application of isolation of buildings from vibrations
    and shocks generated by man-made sources. ISO 2017-3:2015 is applicable only during
    the design and construction of new buildings in areas affected by important vibrations
    which can be generated by single or multiple sources (railways, traffic, industrial
    activity, etc.) The isolation of these buildings serves to ensure the integrity
    of the structure and equipment inside (including sensitive equipment) and human
    comfort. ISO 2017-3:2015 specifies the information to be exchanged between building
    owner, customer, and vibration isolation supplier. It gives appropriate responses
    to questions highlighted by the producer and user (why, what, when, and how to
    isolate mechanical systems). ISO 2017-3:2015 does not include earthquake and wind-generated
    forces.
