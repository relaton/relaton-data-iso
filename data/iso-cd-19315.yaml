abstract:
- language: en
  script: Latn
  content: This document specifies requirements for materials used for die cutting,
    and requirements for cutting die used including creasing and scoring production
    of folding boxes. This document gives specifications for process control for flatbed
    die cutting including creasing and scoring. This document gives specifications
    and measurement methods for the finished die cutting product. This document does
    not apply for rotary die cutting and laser cutting. It is not applicable to label
    converting, non paper-based print products and corrugated boards.
