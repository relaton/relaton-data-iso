abstract:
- language: en
  script: Latn
  content: ISO 5832-2:2018 specifies the characteristics of, and corresponding test
    methods for, unalloyed titanium for use in the manufacture of surgical implants.
    Six grades of titanium based on tensile strength are listed in Table 2. NOTE The
    mechanical properties of a sample obtained from a finished product made of this
