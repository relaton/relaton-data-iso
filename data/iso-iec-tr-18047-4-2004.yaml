abstract:
- language: en
  script: Latn
  content: 'ISO/IEC TR 18047-4:2004 defines test methods for determining the conformance
    of radio frequency identification (RFID) devices (tags and interrogators) for
    item management with the specifications given in the corresponding part of ISO/IEC
    18000, but does not apply to the testing of conformity with regulatory or similar
    requirements. The test methods require only that the mandatory functions, and
    any optional functions which are implemented, be verified. This may, in appropriate
    circumstances, be supplemented by further, application specific functionality
    criteria that are not available in the general case. The interrogator and tag
    conformance parameters in ISO/IEC TR 18047-4:2004 are: mode-specific conformance
    parameters including nominal values and tolerances;parameters that apply directly
    affecting system functionality and inter-operability. The following are not included
    in ISO/IEC TR 18047-4:2004: parameters that are already included in regulatory
    test requirements;high-level data encoding conformance test parameters (these
    are specified in ISO/IEC 15962). Unless otherwise specified, the tests in ISO/IEC
    TR 18047-4:2004 apply exclusively to RFID tags and interrogator defined in ISO/IEC
    18000-4 Mode 2.'
