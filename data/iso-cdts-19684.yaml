abstract:
- language: en
  script: Latn
  content: This document describes a framework for evaluating homogeneity and heterogeneity
    in dispersed solid/liquid, liquid/liquid, and gas/liquid particle systems. The
    antonyms homogeneity and heterogeneity are defined in terms of the degree to which
    a property or dispersed phase is uniformly distributed throughout a quantity of
    material over a stated (and typically macroscopic) length scale. This document
    defines indices for measurement of homogeneity and heterogeneity, presents methods
    for off-line and online measurement, and includes application examples. The measurement
    of dispersion stability requires multiple measurements of homogeneity over time
    and is not considered here. Although this document does not directly address powders
    or other multiphase dispersions, the concepts can be readily carried over to those
    areas.
