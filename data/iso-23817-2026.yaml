abstract:
- language: en
  script: Latn
  content: This document provides requirements and procedures for commissioning a ballast water management system (BWMS) using electrolytic methods following installation on board a ship. It specifies safety measures, procedures for commissioning (including installation inspection, function test, training of the ship's crew) and a commissioning test according to BWM.2/Circ.70/Rev.1.[22] This commissioning process ensures the health and safety of personnel involved in commissioning, verifies proper function and operation, and provides procedures for sampling and analysis. This document also provides requirements on the documentation of commissioning. This document focuses on the commissioning of a BWMS using electrolytic methods after initial installation on board a ship, but it can also apply to other necessary surveys of a BWMS and readiness evaluation of land-based or shipboard testing for type approval required by either IMO or a port state, or both. NOTE            A survey of the installed equipment and associated documentation is conducted by a Recognized Organization (RO) according to the BWMS Code (MEPC.300(72)[13]), and the Harmonized System for Survey and Classification (HSSC)[19]. Installation checkout and commissioning is normally completed by the manufacturer or their technical representative according to manufacturer requirements, while verification of discharge samples is conducted by a ballast water testing organization.
