abstract:
- language: en
  script: Latn
  content: This document provides a procedure for reporting indoor air quality safety
    when combusting moxibustion devices by comparing indoor concentration values of
    pollutants among combustion products with international, regional or national
    ambient/indoor air quality regulations, standards, or guideline values. This document
    does not apply to moxibustion devices that do not involve combustion, such as
    electric heating moxibustion equipment covered in ISO 21292:2020 and infrared
    moxibustion-like instrument covered in ISO 20493:2018.
