abstract:
- language: en
  script: Latn
  content: This document describes the use of high performance liquid chromatography-tandem
    mass spectrometry (HPLC-MS/MS) for the specific separation and detection of trace
    amounts of MEA, DEA and TEA in nonionicsurfactants or product matrices containing
    ethanolamine derivatives. This standard is applicable to the determination of
    MEA, DEA and TEA in nonionicsurfactants or product matrices containing ethanolamine
    derivatives.
