abstract:
- language: en
  script: Latn
  content: This document establishes general principles for an organization to identify
    the risks related to various types of product fraud and product fraudsters. It
    provides guidance on how organizations can establish strategic, business countermeasures
    to prevent or reduce any harm, tangible or intangible loss and cost from such
    fraudulent attacks in a cost-effective manner. This document is applicable to
    all organizations regardless of type, size or nature, whether private or public
    sector. The guidance can be adapted to the needs, objectives, resources and constraints
    of the organization. This document is intended to promote common understanding
    in the field of product-related fraud risk and its countermeasures.
