abstract:
- language: en
  script: Latn
  content: ISO 9335:2012 gives general guidance for the construction and use of equipment
    for measurement of the optical transfer function (OTF) of imaging systems. It
    specifies important factors that can influence the measurement of the OTF, and
    gives general rules for equipment performance requirements and environmental controls.
    It specifies important precautions that should be taken to ensure accurate measurements
    and correction factors to be applied to the collected data.
