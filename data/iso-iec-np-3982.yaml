abstract:
- language: en
  script: Latn
  content: 'Health information in VR smart cities is defined in order to represent
    human health information in 3D virtual environments. It defines concepts, a data
    model, and how to integrate 3D virtual worlds and information from health device
    sensors. It defines an exchangeable information model necessary for transferring
    and storing human health information with virtual environments. ISO/IEC 3982 will
    specify: • Representation of 3D human models and animation for a VR smart city
    • Representation of health device sensor information for a VR smart city • Representation
    of human health information for a VR smart city'
