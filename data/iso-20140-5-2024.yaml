abstract:
- language: en
  script: Latn
  content: 'This document defines a set of environmental performance evaluation (EPE)
    data classes, including their properties. It is applicable to entire manufacturing
    facilities or to parts of a manufacturing facility. This document applies to manufacturing
    systems including discrete, batch and continuous control, which are defined in
    IEC 62264-1. The following are outside the scope of this document: —     syntax
    of EPE data and data models; —     protocols to exchange EPE data; —     functions
    that can be enabled by the use of EPE data; —     product life cycle assessment;
    —     EPE data that are specific to a particular industry sector, manufacturer
    or machinery; —     acquisition of EPE data.'
