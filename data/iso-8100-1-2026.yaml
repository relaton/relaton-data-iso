abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety rules for lifts permanently serving
    buildings and constructions and intended for the transport of persons or persons
    and goods. It applies to traction lifts, positive drive lifts and hydraulic lifts
    that: serve specific levels; and have a rated speed exceeding 0,15 m/s; and have
    an enclosed car; and move along guide rails inclined not more than 15° to the
    vertical; and     are indoor or weather-protected. This document also applies
    to the electrical equipment of these lifts including the lighting and socket outlets
    in the well. This document specifies safety rules related to: persons to be safeguarded:
    users, including passengers, maintenance and inspection personnel; persons at
    the landings and outside of the well, or any machinery space and pulley room,
    who can be affected by the lift. property to be safeguarded: loads in the car;
    components of the lift installation; building in which the lift is installed.
    This document does not specify additional requirements for: lifts serving buildings
    with requirements for seismic conditions; lifts serving buildings with requirements
    for accessibility; lifts exposed to vandalism; lifts which can be used for firefighting
    and evacuation purposes under firefighters control; lifts which can be used to
    support faster evacuation of persons with disabilities; the behaviour of the lift
    when the control system of the lift receives a recall signal(s) in the event of
    fire in a building. This document is not applicable to passenger and goods passenger
    lifts, which are installed before the date of its publication.'
