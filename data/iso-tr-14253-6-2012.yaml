abstract:
- language: en
  script: Latn
  content: ISO/TR 14253-6:2012 expands the scope of decision rules to industrial situations
    where the default rule of ISO 14253-1 might not be economically optimal. (ISO
    14253-1 provides a default decision rule having a very high probability that a
    measured value resulting in product acceptance also yields a product with the
    corresponding measurand conforming to specifications.) ISO/TR 14253-6:2012 does
    not address how to determine the cost of correct decisions (accepting conforming
    workpieces or rejecting nonconforming workpieces) or incorrect decisions (rejecting
    conforming workpieces or accepting nonconforming workpieces) as this is a business
    concern. However, the terminology and requirements to communicate and implement
    the particular decision rules desired by an organization are provided along with
    examples to guide the reader.
