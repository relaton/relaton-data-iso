abstract:
- language: en
  script: Latn
  content: This document defines the dimensions and specifies the performance and
    safety requirements for traction aid winches used in forestry for assisting supported
    machines while going uphill and downhill (pulling and braking). This document
    is applicable to fixed and detachable winches and their components, connections
    and communications, which are used with mobile and self-propelled forestry machinery
    as defined in ISO 6814:2009 and earth moving machinery as defined in ISO 6165:2012.
    It is also applicable to remote traction aid winch systems which are installed
    on a position away from the supported machine. In addition, this document defines
    requirements for the assembly of supported machine and traction aid winch. It
    is not applicable to winches which are not using a controlled rope force while
    going downhill and winches used for skidding, hoisting operations on cranes, draglines,
    high lead logging, rope logging systems or yarding. The kind of prime mover used
    to drive a traction aid winch does not limit the applicability of this document.
    This document is intended to be applied to traction aid systems used on machines
    where, without use of these systems, the machine remains stationary on slopes
    under its independent control (see Annex E). Forestry machines, as defined in
    ISO 6814:2009, that are used as anchor or supported machines are not in the scope
    of this document. Requirements for the safety of many types of supported machines
    are within the scope of ISO 11850:2011. This document is not applicable to traction
    aid winches manufactured before the date of its publication.
