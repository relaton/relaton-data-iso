abstract:
- language: en
  script: Latn
  content: This document specifies general requirements and recommendations for quality
    assessments and control of massively parallel sequencing (MPS) data. It covers
    post raw data generation procedures, sequencing alignments, and variant calling.
    This document also gives general guidelines for validation and documentation of
    MPS data. This document does not apply to any processes related to de novo assembly.
