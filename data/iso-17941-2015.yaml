- language: en
  script: Latn
  content: ISO 17941:2015 specifies classification and designation, requirements,
    test method, marking, packaging, transport, and storage of hydraulic watertight
    hinged fireproof doors (hereinafter referred to as "watertight doors"). ISO 17941:2015
