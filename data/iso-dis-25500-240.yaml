abstract:
- language: en
  script: Latn
  content: 'This document describes the fundamental concepts and principles of strategic
    sourcing which are universally applicable to the following: — organizations seeking
    to improve their onboarding process through a common understanding of the fundamental
    concepts, principles and vocabulary used in strategic sourcing; — organizations
    seeking to improve the quality of the data they receive from their trading partners
    in order to establish confidence in their supply chain. 1.1 In scope — terminology
    required to describe the workflow and data used in the strategic sourcing process;
    — stages of the strategic sourcing process; — data required to support the strategic
    sourcing process; — metadata and reference data required to support the strategic
    sourcing process. 1.2 Out of scope — data exchange technology; — supplier evaluation
    methods and techniques.'
