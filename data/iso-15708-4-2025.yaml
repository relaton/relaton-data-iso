abstract:
- language: en
  script: Latn
  content: This document gives guidance on the qualification of the performance of
    a computed tomography (CT) system with respect to various testing tasks. This
    document is applicable only to industrial imaging (i.e. non-medical applications)
    and provides a consistent set of definitions of CT performance parameters, including
    the relationship between these performance parameters and CT system specifications.
    This document is applicable to industrial computed tomography. This document does
    not apply to other techniques of tomography such as translational tomography and
    tomosynthesis.
