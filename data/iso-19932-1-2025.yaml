abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety and environmental requirements and
    their means of verification for the design and construction of knapsack sprayers
    carried on the back or shoulder of the operator for use with plant protection
    products. It also specifies the type of information on safe working practices
    (including residual risks) to be provided by the manufacturer. This document is
    applicable to lever-operated knapsack sprayers, knapsack compression sprayers
    and knapsack sprayers driven by an engine or electric motor using hydraulic pressure
    atomisation of the spray liquid intended to be used primarily in agriculture,
    forestry and horticulture with a nominal volume of more than 6,0 l. This document
    is not applicable to knapsack sprayers which are manufactured before the date
    of publication of this document. It does not apply to knapsack combustion engine-driven
    air-blast sprayers according to ISO 28139: 2019+A1:2024. This document deals with
    all significant hazards, hazardous situations and hazardous events relevant to
    knapsack sprayers when they are used as intended and under conditions of misuse
    which are reasonably foreseeable by the manufacturer (see Annex A), excepting
    the hazards arising from: —     static electricity; —     explosion or fire from
    chemicals for spraying; and —     insufficient structural integrity. Noise is
    not considered to be a relevant hazard for: —     lever operated knapsack sprayers;
    —     electric motor driven knapsack sprayers. This document does not cover electromagnetic
    compatibility (EMC) requirements. This document is intended to be applied in conjunction
    with ISO 19932-2:2025.'
