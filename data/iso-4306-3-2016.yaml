abstract:
- language: en
  script: Latn
  content: ISO 4306-3:2016 as a whole establishes a vocabulary of the most commonly
    used terms in the field of cranes. This part of ISO 4306 gives the general definition
    of a tower crane and illustrates the terminology used with each type of tower
    crane by the use of figures with referenced term numbers. It is applicable to
    - tower cranes that can be assembled and dismantled (by element or self-erecting
    cranes), - permanently erected tower cranes, and - mobile self-erecting tower
    cranes. It is not applicable to - mobile cranes, or - erection masts, with or
    without jibs.
