- language: en
  script: Latn
  content: ISO 3668:2017 specifies a method for the visual comparison of the colour
    of films of paints or related products against a standard (either a reference
    standard or a freshly prepared standard) using artificial light sources in a standard
    booth. It is not applicable to coatings containing special-effect pigments, e.g.
