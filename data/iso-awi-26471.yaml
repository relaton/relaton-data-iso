abstract:
- language: en
  script: Latn
  content: This document specifies minimum requirements and test methods for Curcuma
    wenyujin, Curcuma longa, Curcuma kwangsiensis, and Curcuma phaeocaulis root [the
    dried root of Curcuma wenyujin Y. H. Chen et C. Ling, Curcuma longa L., Curcuma
    kwangsiensis S. G. Lee et C. F. Liang, and Curcuma phaeocaulis Val.]. It is applicable
    to Curcuma root that is sold and used as a natural medicine in international trade,
    including Chinese materia medica (whole medicinal materials) and decoction pieces
    derived from those plants. This document does not apply to the processing methods
    and processed products of Curcuma root.
