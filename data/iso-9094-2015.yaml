abstract:
- language: en
  script: Latn
  content: 'ISO 9094:2015 defines a practical degree of fire prevention and protection
    intended to provide enough time for occupants to escape a fire on board small
    craft. It applies to all small craft of up to 24 m length of hull (LH) except
    for personal watercraft. ISO 9094:2015 excludes: the design and installation of
    those permanently installed galley stoves and heating appliances (including components
    used to distribute the heat) using fuels that are liquid at atmospheric pressure
    on small craft, which are covered by ISO 14895; carbon monoxide detecting systems,
    which are covered by ISO 12133.'
