abstract:
- language: en
  script: Latn
  content: ISO 1524:2013 specifies a method for determining the fineness of grind
    of paints, inks and related products by use of a suitable gauge, graduated in
    micrometres. It is applicable to all types of liquid paints and related products,
    except products containing pigments in flake form (e.g. glass flakes, micaceous
    iron oxides, zinc flakes).
