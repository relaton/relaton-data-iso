abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and test methods for intraoral cameras
    used in dentistry on patients for pictorial representation of oral cavities in
    order to support diagnosis and facilitate patient information. It specifies requirements,
    test methods, instructions for use and marking. This document is not applicable
    to: a) powered polymerization activators for polymerization of dental materials;
    b) exclusively extraoral camera equipment to prepare overviews or to record treatments;
    c) dental microscopes for minimally invasive treatments; d) medical endoscopes;
    e) camera handpieces for tooth illumination (transillumination); f) CAD or CAM
    scanner handpieces; g) combinations of dental instruments with camera functions;
    h) cameras for endodontic purposes; i) devices for root canal inspection (endoscopic
    microcameras); j) cameras for tool navigation; k) cameras for determination of
    tooth colour.'
