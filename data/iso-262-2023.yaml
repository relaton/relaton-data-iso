abstract:
- language: en
  script: Latn
  content: This document specifies the selected sizes for bolts, screws, studs and
    nuts in the diameter range from 1 mm to 100 mm of ISO general purpose metric screw
    threads (M) having the basic and design profiles according to ISO 68-1. These
    sizes of diameter and pitch combinations are selected from ISO 261. This document
    is applicable to the metric commercial fastener screw threads.
