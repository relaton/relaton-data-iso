abstract:
- language: en
  script: Latn
  content: This standard specifies the competence requirements for investigators,
    either personnel, business associates or third parties, involved in investigations
    on behalf of an organization. This document is applicable to all types of organizations
    regardless of the type, size and nature of the activity, as well as whether the
    organization is from the public, private or non-profit sector that appoints investigators.
    This document is also intended for organizations providing awareness-raising and
    training activities related to investigations.
