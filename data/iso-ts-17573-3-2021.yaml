abstract:
- language: en
  script: Latn
  content: 'This document specifies the syntax and semantics of data objects in the
    field of electronic fee collection (EFC). The definitions of data types and assignment
    of values are provided in accordance with the abstract syntax notation one (ASN.1)
    technique, as specified in ISO/IEC 8824‑1. This document defines: —    ASN.1 (data)
    types within the fields of EFC; —    ASN.1 (data) types of a more general use
    that are used more specifically in standards related to EFC. This document does
    not seek to define ASN.1 (data) types that are primarily related to other fields
    that operate in conjunction with EFC, such as cooperative intelligent transport
    systems (C-ITS), the financial sector, etc.'
