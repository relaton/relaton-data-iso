abstract:
- language: en
  script: Latn
  content: ISO 7823-3:2003 specifies requirements for non-modified flat poly(methyl
    methacrylate) (PMMA) continuous cast sheets (plates) for general-purpose use.
    The sheets may be colourless or coloured, and may be transparent, translucent
    or opaque. The thickness range of the sheets covered by this part of ISO 7823
    is 1 mm to 10 mm.
