abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for crowd management at events, mass gatherings and crowded places. It is designed to assist event organizers, event rights holders, event hosts, venue operators and emergency services in planning and executing effective, successful and safe crowd management by ensuring: implementation of the framework and principles for crowd management; necessary event and crowd profiling to understand the crowd management risk; available spaces for expected crowds using crowd capacity assessments;  sufficient crowd management in the ingress, event circulation, and egress phases; safe and secure venues, spaces, and pathways for crowds in all phases and situations; sufficient crowd management plans both for planned execution and in emergencies; necessary engagement and involvement of public and private interested parties; continual improvement through systematic evaluation of crowd management arrangements. This document does not address crowd control or situations that require intervention to manage crowds that display undesirable or dangerous behaviours.'
