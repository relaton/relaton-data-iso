abstract:
- language: en
  script: Latn
  content: ISO 19288:2016 specifies requirements for the classification of solid wire
    electrodes, solid wires and rods for fusion welding of magnesium and magnesium
    alloys. The classification is based on their chemical composition. The compositions
    of solid wire electrodes for metal inert gas (MIG) welding are the same as solid
    wire electrodes, solid wires and rods for tungsten inert gas (TIG) arc welding,
    plasma arc welding, laser beam welding, laser-MIG hybrid welding and other fusion
    welding processes.
