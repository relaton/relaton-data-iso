abstract:
- language: en
  script: Latn
  content: 'This document specifies a process to design, implement, maintain and monitor
    biodiversity net gain (BNG) outcomes throughout the life cycle of spatially explicit
    development projects, until the expected outcome on biodiversity has been realized
    as proportionate to the project. This document provides a framework to demonstrate
    that a project: ¾    has followed a process that is based on good practice and
    indicators of biodiversity change, ¾    is aligned with the vision, goals and
    targets of the Convention on Biological Diversity and the Global Biodiversity
    Framework.[23] This document covers terrestrial and freshwater habitats, and intertidal
    habitats down to the mean low water mark, as the process and methods to deliver
    net gain for marine habitats are different from the approach set out here. It
    does not cover the detailed requirements associated with the delivery of biodiversity
    enhancements or management. This document is applicable for projects that affect
    biodiversity and those with limited or no impact on biodiversity, as well as projects
    aiming to achieve BNG either onsite or offsite, or both. BNG can be applicable
    to any sector of industry, including residential, mixed-use, energy, water, extractive
    industry, transport, communications agriculture, forestry and infrastructure.'
