abstract:
- language: en
  script: Latn
  content: 'This document provides terminology, principles, requirements and guidance
    for the preparation of natural capital accounts for organizations. Natural capital
    accounts quantify the impacts from the organization’s activities on natural capital,
    or the dependencies of the organization on natural capital, or both. The scope
    of natural capital accounts can be expanded to cover activities in the organization’s
    value chain. There are two types of natural capital accounts, each with supporting
    schedules: a)       the natural capital income statement; b)       the natural
    capital balance sheet. This document is applicable to all types of organizations
    (e.g. public, private (both listed and unlisted) or non-governmental organizations)
    across all sectors, and of any size (such as small to medium-sized enterprises
    (SMEs) and larger businesses) and to one or more sites at which they operate.
    This document does not apply to national, sub-national or sector-wide natural
    capital accounts.'
