abstract:
- language: en
  script: Latn
  content: ISO 1940-1:2003 gives specifications for rotors in a constant (rigid) state.
    It specifies balance tolerances, the necessary number of correction planes, and
    methods for verifying the residual unbalance. Recommendations are also given concerning
    the balance quality requirements for rotors in a constant (rigid) state, according
    to their machinery type and maximum service speed. These recommendations are based
    on worldwide experience. ISO 1940-1:2003 is also intended to facilitate the relationship
    between the manufacturer and user of rotating machines, by stating acceptance
    criteria for the verification of residual unbalances. Detailed consideration of
    errors associated with balancing and verification of residual unbalance are given
    in ISO 1940-2. ISO 1940-1:2003 does not cover rotors in a flexible state. The
    balance quality requirements for rotors in a flexible state are covered by ISO
    11342.
