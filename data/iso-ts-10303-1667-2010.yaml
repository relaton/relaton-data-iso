abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1667:2010-03 specifies the application module for Extended
    basic geometry. The following are within the scope of ISO/TS 10303-1667:2010-03:
    identification of a geometric vector; representation of real features in product
    model; identification of a association between two geometric models; identification
    of a association between two detailed geometric model elements; items within the
    scope of application module Basic geometry, ISO/TS 10303-1652; items within the
    scope of application module Geometric model relationship, ISO/TS 10303-1403.'
