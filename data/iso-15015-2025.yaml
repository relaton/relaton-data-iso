abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements and test methods for solid flat
    extruded sheets of impact-modified acrylonitrile-styrene copolymer materials:
    —     acrylonitrile-butadiene-styrene (ABS), —     acrylonitrile-(ethylene-propylene-diene)-styrene
    (AEPDS) (commonly known as AES), and —     acrylonitrile-styrene-acrylate (ASA),
    without fillers or reinforcing materials. This document also applies to ABS, AEPDS
    and ASA sheet in rolled form. It applies only to thicknesses from 0,25 mm to 20,0 mm.'
