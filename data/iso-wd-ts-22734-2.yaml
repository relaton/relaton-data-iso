abstract:
- language: en
  script: Latn
  content: This Technical Specification describes testing protocols for water electrolyser
    systems with the focus on alkaline and PEM water electrolysers. The purpose of
    these protocols is to determine if an electrolyser has the basic capabilities
    of providing electricity grid services. It also covers test apparatus, measuring
    instruments and measuring methods, and evaluates test reports for electrolyser
    systems.
