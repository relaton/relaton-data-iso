abstract:
- language: en
  script: Latn
  content: ISO 7328¦IDF 116:2008 specifies the reference method for the determination
    of the fat content of most milk-based edible ices and ice mixes. The method is
    also applicable to concentrated and dried ice mixes. The method is not applicable
    to some milk-based edible ices and ice mixes, in which the level of emulsifier,
    stabilizer or thickening agent or of egg yolk or of fruits, or of combinations
    of these constituents makes the Roese-Gottlieb method unsuitable.
