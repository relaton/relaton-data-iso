abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies definitions and requirements for
    sealants used for sealing of joints applied in sanitary areas in the interior
    of buildings exposed to non-pressurised water. It covers joints in: — bathrooms;
    — toilets; — showers; — domestic kitchens; — prefabricated elements in sanitary
    areas (e.g. shower cubicles). Industrial, drinking water, underwater (swimming
    pools, sewage systems, etc.), food contact applications and sealing of glass-ceramic
    cooktop panels (stove tops, ceramic hobs) are excluded from the scope. This International
    Standard does not provide criteria or recommendations for the design of joints
    and installation of sealants in sanitary applications. This International Standard
    does not apply to sealants in any of non-paste form, to those used in sanitary
    joints and to oil-based mastics.'
