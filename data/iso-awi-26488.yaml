abstract:
- language: en
  script: Latn
  content: 'This document specifies procedures for extracting environmental DNA (eDNA)
    that has been captured on filters after filtering water from aquatic environments.
    This document applies to the eDNA from any target taxonomic group that has been
    captured on filters, from single species to whole communities. It applies to eDNA
    in both intracellular (i.e., within cells, either with or without a cell wall)
    and extracellular (i.e., free or attached to particles of biological or non-biological
    origin) form. Procedures in this document do not apply to the extraction of eDNA
    from other starting materials, including but not limited to biofilms, sediments,
    and bulk samples. This standard is designed for eDNA extractions performed in
    a laboratory and is not designed for field-based eDNA extractions. This document
    does not include procedures for water sampling, filtering, and sample preservation
    and storage after filtering; these are covered by ISO FDIS 17805. This document
    provides the following procedures and/or guidelines as they relate to eDNA extraction
    from filters: (1) contamination prevention; (2) eDNA extraction method selection;
    (3) positive and negative controls; (4) lysis and purification steps; (5) quantifying
    and storing eDNA extracts; and (6) quality testing of extracted eDNA for downstream
    applications, with a focus on PCR-based biodiversity monitoring.'
