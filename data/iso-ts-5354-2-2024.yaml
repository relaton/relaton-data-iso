abstract:
- language: en
  script: Latn
  content: This document provides a list of target sequences that can be used to screen
    for the presence of genetically modified (GM) material in cotton and cotton products.
    This document is applicable to cottonseed, cotton leaf, cotton fibre and cotton
    fibre-derived materials from which sufficiently high-quality PCR amplifiable DNA
    can be extracted. Methods describing the extraction of DNA from different cotton
    samples can be found in ISO 5354-1[1]. NOTE 1        The list of target sequences
    provides guidance for the screening of all currently known GM cotton events and
    GM cotton events that contain the same DNA sequences. Further guidance on screening
    of foodstuffs is provided in CEN/TS 16707[2]. NOTE 2        Sampling is outside
    of the scope of this document. Information on sampling cotton products can be
    found in ISO 1130:1975[3] and in ASTM D1441-12[4].
