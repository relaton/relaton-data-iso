abstract:
- language: en
  script: Latn
  content: 'This document describes the requirement of the design, installation and
    testing of interfaces of onboard AC/DC charging circuits and systems for lithium-ion
    batteries using shore-power supply, including below. - Charging and safety system
    design; - Charging sequence and communication design; - Charging monitoring and
    control design; - Charging circuit installation; - Testing of charging system.
    This document applies to electric propulsion and electric hybrid (system with
    a rechargeable battery) small crafts up to 24 m length of the hull (according
    to ISO 8666) operated in the ranges either individually or in combination of up
    to 1500V DC nominal and 1000V AC nominal (according to ISO 16315) and does not
    apply to the following: - Crafts at dry docking and out of service maintenance
    and repair; - Unmanned crafts; - Pressure crafts; - Hover craft, wing-in-ground-effect
    craft, amphibious craft, hydrofoil craft; - Battery capacity less than 600 Wh
    (according to ISO 23625). This document can be used along with the existing relevant
    standards, such as those referenced in this document, to integrate into a boat.'
