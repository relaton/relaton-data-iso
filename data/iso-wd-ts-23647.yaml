abstract:
- language: en
  script: Latn
  content: ISO/TR 23647:2010 specifies a gas chromatographic method for determining
    the wax content of crude, degummed, neutralized, winterized, and fully refined
    vegetable oils, such as sunflower, soybean, rapeseed, corn, and rice bran oils.
    Waxes are esters of long chain fatty acids and fatty alcohols (having C20 or longer
    saturated carbon chain). The wax content is expressed in milligrams per kilogram
    of oil.
