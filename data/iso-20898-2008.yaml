abstract:
- language: en
  script: Latn
  content: ISO 20898:2008 specifies the electrical requirements for the design and
    manufacture of self-propelled industrial trucks including masted and variable
    reach rough terrain trucks (as defined in ISO 5053:1987), and tow tractors with
    a rated drawbar pull up to and including 20 000 N. It applies to trucks with battery
    voltages in accordance with ISO 1044. For additional requirements of trucks with
    mains power, see IEC 60204‑1. ISO 20898:2008 does not apply to trucks used in
    potentially explosive atmospheres or issues related to electromagnetic compatibility.
    It does not repeat all the technical rules which are state of the art and which
    are applicable to the material used to construct the industrial truck, for which
    reference can be made to ISO 12100‑2.
