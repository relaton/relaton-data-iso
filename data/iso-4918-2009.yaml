abstract:
- language: en
  script: Latn
  content: ISO 4918:2008 specifies methods for assessment of the wear behaviour of
    textile floor coverings, assessment of the change in colour (glossing) of needled
    floor coverings without a pile, assessment of the general structural integrity
    of textile floor coverings, and determination of susceptibility to surface crazing,
    construction integrity and joint stability for resilient or laminate floor covering,
    including joints. The methods involve subjecting the test piece to the movement
    of a castor chair.
