abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1621:2006 specifies the application module for AP210 interconnect
    requirement allocation. ISO/TS 10303-1621:2006 deals with the representation of
    interconnect requirement allocation. Interconnect requirement allocation includes
    the following information: complete functional and physical requirements,complete
    capability to allocate enterprise or external agency requirements to interconnect
    function or physical design,model based requirement description using simulation
    models and models with assigned parametric data;capability to explicitly describe
    the required external connections for a printed wiring board or simple substrate;capability
    to segregate the required external connections from the required functions other
    than simple interconnect for printed circuit boards (including printed components).
    Supporting data including document, authorization, product identification, external
    definition, and authorization are included. The following are within the scope
    of ISO/TS 10303-1621:2006: requirement traceability between functional and physical
    requirements; inclusion of both functional and physical requirements in same requirement
    collection; inclusion of both functional and physical requirement allocation in
    design characteristic planning and evaluation.'
