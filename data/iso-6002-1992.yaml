- language: en
  script: Latn
  content: 'Specifies the requirements for valves of nominal sizes DN 10 up to DN
    1 000 and nominal pressures PN 10 up to PN 100 having the following features:
    bolted bonnet, outside screw and yoke, inside screw (alternative for PN 10, 16,
