abstract:
- language: en
  script: Latn
  content: This document specifies the acceptance tests for verifying the performance
    of an optical 3D coordinate measuring system (CMS) when measuring lengths as stated
    by the manufacturer. It also specifies the reverification tests that enable the
    user to periodically reverify the performance of the optical 3D CMS. This document
    is applicable to verification of the measuring performance of CMSs if the surface
    characteristics (e.g. glossiness, colour) of the object to be scanned are restricted
    and within a cooperative range. This document does not apply to other types of
    CMSs, including those covered by the other parts of the ISO 10360 series.
