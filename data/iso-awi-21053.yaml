abstract:
- language: en
  script: Latn
  content: This document specifies the evaluation method of life cycle analysis of
    ductile iron pipes used for water applications as specified in ISO 2531 and ISO
    16631. Studies on economic and environmental impacts are important for utility
    decision-makers as they seek to balance budget concerns over immediate and long-term
    needs across acquisition, operations and maintenance, and planned end of life.
    For authorities and engineers designing pipeline systems, the life cycle cost
    analysis serves as a tool to study various scenarios to determine the right solution
    for site-specific conditions and community values, as well as to provide the necessary
    data to support those decisions. Informative annexes are included in this document
    as a compilation of reference and consensual factors (pumping cost, leakage incident
    rate, etc.).
