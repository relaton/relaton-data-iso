abstract:
- language: en
  script: Latn
  content: This document specifies requirements for operational safety means and protection
    against failures related to hazards specific to any kind of electrically propelled
    mopeds and motorcycles when used in normal conditions. It is applicable only if
    the maximum working voltage of the on-board electrical circuit does not exceed
    1 000 V alternating current (a.c.) or 1 500 V direct current (d.c.). This document
    does not provide comprehensive safety information for manufacturing, maintenance
    and repair personnel. This document does not consider specific aspects of driving
    automation features. NOTE      For definition of the term “driving automation
    features”, see SAE J3016.
