abstract:
- language: en
  script: Latn
  content: This document contains requirements for seismic design and assessment of offshore structures. This document includes recommendations for the effects of seismic events on floating structures. This document addresses specifically the design and assessment of offshore structures subjected to earthquake-induced ground motions. It also covers briefly other geologically induced hazards such as liquefaction, slope instability, fault surface displacement, tsunamis, mud volcanoes and shock waves. This document provides requirements for site-specific probabilistic seismic hazard analysis for offshore structures in high seismic areas and for offshore structures with high consequence levels.
