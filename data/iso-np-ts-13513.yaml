abstract:
- language: en
  script: Latn
  content: 1. This proposal focuses on the sludge of urban sewage treatment plants,
    absorbs the scientific research results and practical experience of the development
    of sludge anaerobic digestion process at home and abroad in recent years. It mainly
    stipulates the design principles and standards of sludge anaerobic digestion process,
    and summarizes the basic design parameters and unit design requirements of different
    sludge anaerobic digestion processes, put forward sludge anaerobic digestion operation
    management guidelines and process performance requirements, and clarifies the
    safe disposal and utilization of sludge anaerobic digestion products. The proposal
    aims to improve the rationality and scientificity of sludge anaerobic digestion
    process design, as well as the standardization and safety of operation, improve
    the process design and operation management level of sludge anaerobic digestion,
    achieving the goal of stabilization, reduction, harmlessness, and recycling of
    sewage sludge. 2. This guide is applicable to process selection, system design,
    and operation management of sludge anaerobic digestion in new, expanded, and rebuilt
    urban sewage treatment plants.
