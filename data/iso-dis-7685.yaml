abstract:
- language: en
  script: Latn
  content: This document specifies methods for determining the initial ring stiffness
    of glass-reinforced thermosetting plastics (GRP) pipes. Two methods are given
    (constant load and constant deflection), and within the specified deflection limits,
    each is equally valid and can be used for any diameter.
