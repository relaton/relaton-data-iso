abstract:
- language: en
  script: Latn
  content: ISO 21238:2007 gives guidelines for the common basic methodology of empirically
    determining scaling factors to evaluate the radioactivity of difficult-to-measure
    nuclides in low- and intermediate-level radioactive waste packages. ISO 21238:2007
    gives common guidelines for the scaling factors used in the characterization of
    contaminated wastes produced in nuclear power plants with water-cooled reactor.
    ISO 21238:2007 is also relevant to other reactor types, such as gas-cooled reactors.
    Methodologies for determining scaling factors based on theoretical considerations
    (i.e. not based on experimental measurement) are not covered by ISO 21238:2007.
