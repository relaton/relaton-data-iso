abstract:
- language: en
  script: Latn
  content: ISO 16841:2014 identifies the different types of pulling eyes prepared
    at, or attached to, a steel wire rope end for connection to another rope when
    installing a new rope or re-reeving an existing rope on a machine. It also specifies
    the minimum requirements for pulling eyes, including their geometry, strength,
    maximum line pull to which the pulling eye is intended to be subjected and information
    for use to be provided by the manufacturer. The pulling eyes covered by ISO 16841:2014
    are not intended to be subjected to a load when the machine performs a service
    operation. ISO 16841:2014 applies to those pulling eyes prepared at, or attached
    to, ends of steel wire ropes conforming to ISO 2408 and ISO 10425.
