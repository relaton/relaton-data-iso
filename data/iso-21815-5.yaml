abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for collision warning systems (CWS)
    and collision avoidance systems (CAS) that address types of motion not specifically
    covered in ISO 21815-3 and ISO 21815-4 for: earth-moving machinery as defined
    in ISO 6165; mobile underground mining machinery as defined in ISO 19296; rock
    drill rigs as defined in ISO 22932-5; road construction machinery as defined in
    ISO 22242. This document applies to: collision warning and avoidance for articulation
    motion by speed reduction, stopping, or motion inhibit; NOTE            Steering
    the machine whilst in forward and reverse motion is not considered as articulation
    motion. collision warning and avoidance for four-wheel steering motion by speed
    reduction, stopping, or motion inhibit; collision warning and avoidance for motion
    of towed trailers in reverse by speed reduction, stopping, or motion inhibit;
    collision warning and avoidance for differential speed, skid turning, counter
    rotation motion by speed reduction, stopping, or motion inhibit; collision warning
    and avoidance for telescopic extension and retraction motions by speed reduction,
    stopping, or motion inhibit; collision warning and avoidance for vertical motions
    i.e. height or depth by speed reduction, stopping, or motion inhibit. This document
    does not cover avoidance by automatic manoeuvring (e.g. steering) away from the
    intended object. The system described in this document is intended to assist the
    operator of the machine. The responsibility for safe operation of the machine
    remains with the machine operator. This document is not applicable to collision
    warning and collision avoidance systems installed or manufactured before the date
    of its publication. This document is not applicable to machines that are double
    articulated.'
