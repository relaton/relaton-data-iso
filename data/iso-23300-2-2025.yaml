abstract:
- language: en
  script: Latn
  content: This document specifies the requirements on rail aluminothermic welding,
    including the requirements for approval process, laboratory tests, approval of
    welder and contractor, as well as the acceptance criteria of aluminothermic welds
    in track. This document concerns the welding of 43 kg/m to 75 kg/m new vignole
    rails of the same profiles and the same grades. This document is restricted to
    butt welding for connecting rail ends. NOTE           Conformity with the requirements
    of this document does not ensure the suitability of a welding process for specific
    conditions of track and traffic. This document does not cover welds made between
    different rail sections, differently worn rails or different rail grades.
