abstract:
- language: en
  script: Latn
  content: This document specifies electrical test methods for rubber and plastics
    hoses, tubing and hose assemblies to determine the resistance of conductive, antistatic
    and non-conductive hoses and the electrical continuity or discontinuity between
    metal end fittings. All the test methods described for rubber hoses in this document
    can also be applied to plastics hoses.
