abstract:
- language: en
  script: Latn
  content: ISO/TS 17379-2:2013 specifies a method for the determination of selenium.
    The method is applicable to drinking water, surface water, ground water, and rain
    water. The dynamic range of ISO/TS 17379-2:2013 is approximately 0,5 µg/l to 20
    µg/l. Samples containing selenium at higher concentrations than the application
    range can be analysed following appropriate dilution. The method is unlikely to
    detect organoselenium compounds. The sensitivity of this method is dependent on
    the selected operating conditions. It is important to use high purity reagents
    in all cases with minimum levels of selenium.
