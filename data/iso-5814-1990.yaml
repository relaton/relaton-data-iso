abstract:
- language: en
  script: Latn
  content: Includes a procedure by means of an electrochemical cell which is isolated
    from the sample by a gas permeable membrane. Depending on the type of probe employed
    measurement can be made either as concentration of oxygen, percentage saturation
    or both. The procedure is suitable for measurements made in the field and for
    continuous monitoring and in the laboratory. It is the preferred procedure for
    highly coloured and turbid waters. It is suitable for natural, waste and saline
    waters.
