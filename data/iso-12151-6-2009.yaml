abstract:
- language: en
  script: Latn
  content: ISO 12151-6:2009 specifies the general and dimensional requirements for
    the design and performance of hose fittings made of carbon steel with 60° cone
    ends for hose sizes 5 to 51 inclusive, in accordance with ISO 4397. These hose
    fittings are for use in hydraulic fluid power systems with hose that meets the
    requirements of the respective hose standards and in general applications with
    suitable hose.
