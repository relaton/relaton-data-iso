abstract:
- language: en
  script: Latn
  content: This document specifies methods for the olfactory and visual examination
    and determination of foreign matter and defects in green coffee from all origins.
    These methods can also be used for determining one or more of the characteristics
    of green coffee with an impact on coffee quality for technical, commercial, administrative
    and arbitration purposes, and for quality control or quality inspection. This
    document is applicable to green coffee as defined in ISO 3509.
