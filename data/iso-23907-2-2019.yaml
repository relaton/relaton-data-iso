abstract:
- language: en
  script: Latn
  content: This document specifies requirements for reusable sharps containers intended
    to hold potentially hazardous sharps medical waste with or without sharps protection
    features, e.g. scalpel blades, trocars, hypodermic needles and syringes. This
    document is applicable to sharps containers that are supplied complete by the
    manufacturer and to those that are supplied as components intended to be assembled
    by the user. It is not applicable to single use sharps containers (refer to ISO
    23907-1 for such containers). This document includes design functionality for
    user safety, lifespan simulation, cleaning and decontamination, microbiological
    validation, quality monitoring and performance testing.
