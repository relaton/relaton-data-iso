abstract:
- language: en
  script: Latn
  content: This document specifies the test procedures for lithium-ion battery packs
    and systems used in electrically propelled mopeds and motorcycles. The specified
    test procedures enable the user of this document to determine the essential characteristics
    on performance and safety of lithium-ion battery packs and systems. It is also
    possible to compare the test results achieved for different battery packs or systems.
    This document enables setting up a dedicated test plan for an individual battery
    pack or system subject to an agreement between customer and supplier. If required,
    the relevant test procedures and/or test conditions of lithium-ion battery packs
    and systems are selected from the standard tests provided in this document to
    configure a dedicated test plan. NOTE 1        Electrically power-assisted cycles
    (EPAC) cannot be considered as mopeds. The definition of electrically power-assisted
    cycles can differ from country to country. An example of definition can be found
    in Reference [7]. NOTE 2        Testing on cell level is specified in the IEC
    62660 series.
