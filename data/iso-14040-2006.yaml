abstract:
- language: en
  script: Latn
  content: 'ISO 14040:2006 describes the principles and framework for life cycle assessment
    (LCA) including: definition of the goal and scope of the LCA, the life cycle inventory
    analysis (LCI) phase, the life cycle impact assessment (LCIA) phase, the life
    cycle interpretation phase, reporting and critical review of the LCA, limitations
    of the LCA, the relationship between the LCA phases, and conditions for use of
    value choices and optional elements. ISO 14040:2006 covers life cycle assessment
    (LCA) studies and life cycle inventory (LCI) studies. It does not describe the
    LCA technique in detail, nor does it specify methodologies for the individual
    phases of the LCA. The intended application of LCA or LCI results is considered
    during definition of the goal and scope, but the application itself is outside
    the scope of this International Standard.'
