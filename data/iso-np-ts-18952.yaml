abstract:
- language: en
  script: Latn
  content: This International Technical Specification covers general characteristics
    required for photo books intended for long-term preservation. These books are
    typically produced on electrophotographic printers but may also be produced using
    inkjet or traditional photographic printers. There is no specific limitation on
    the subjects of photo books intended for long-term preservation, since the intended
    usage for a photo book may not be known at the time of printing. Many photo books
    documenting weddings, genealogy, travel, and fine art fit into this category.
    Other photo books are produced for short-term applications and events. These books
    are not intended for long-term preservation and may not have the same permanence
    and durability requirements. This specification assumes that the photo book will
    be stored in typical home environments, which may or may not be climate controlled.
    For this reason, it includes requirements designed to limit the adverse effects
    of humidity and temperature that may be outside of typical recommended storage
    conditions. It is also applicable to photo books stored under more stringent conditions,
    such as those preserved in libraries, archives, and museums. Photo books are generally
    stored closed on a bookshelf, consequently environmental factors that may adversely
    affect displayed prints, such as light and ozone, are not applicable to photo
    book preservation. The user is cautioned that these factors may become relevant
    if the photo book is displayed or otherwise exposed to light or other factors
    for an extended period of time. The effect of light and ozone is outside the scope
    of this technical specification. ISO 18937[1] and 18941[2] provide guidelines
    on predicting the effect of light and ozone on photo books. This specification
    leverages information in related standards for paper and books, including ISO
    9706, ISO 11800, and ISO 16763, to assist manufacturers producing photo books
    for long-term preservation. It also takes advantage of test methods for photo
    books described in ISO 18948. This technical specification documents many of the
    industry’s best practices but should not be regarded as an all-encompassing compendium
    since there are an infinite combination of materials and production processes
    for the photo book manufacturer to choose from. It is also not meant to replace
    the detailed requirements and information given in the referenced documents. Photo
    books produced in compliance with ISO 11800 or with paper that conforms to ISO
    9706 may choose to include a statement of compliance as indicated in the relevant
    standard.
