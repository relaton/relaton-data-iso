abstract:
- language: en
  script: Latn
  content: This document specifies principles, system boundary, requirements and guidelines
    for the quantification, verification and reporting of the carbon footprint of
    the product cathode active material for lithium-ion battery. This document takes
    into consideration the life cycle stages of acquisition of raw material and production
    (cradle to gate), excluding the life cycle stages of use and end-of-life treatment
    and recycling. It is applicable to climate change mitigation.
