abstract:
- language: en
  script: Latn
  content: ISO 52022-3:2017 specifies a detailed method, based on spectral data of
    the transmittance and reflectance of the constituent materials (solar protection
    devices and the glazing), to determine the total solar energy transmittance, the
    total light transmittance and other relevant solar-optical data of the combination.
    If spectral data are not available, the methodology can be adapted to use integrated
    data.
