abstract:
- language: en
  script: Latn
  content: 'This document specifies principles for verification methods and validation
    principles of agricultural machinery and tractors that are used in agricultural
    applications and that have partially automated, semi-autonomous and autonomous
    functions. The purpose of this document is to assist in the provision of more
    specific safety requirements, means of verification and information for use to
    ensure an appropriate level of safety for agricultural machinery and tractors
    with partially automated, semi-autonomous and autonomous functions used in a specified
    way. This document deals with the significant hazards relevant to agricultural
    machinery and tractors with partially automated, semi-autonomous and autonomous
    functions when used as intended and under the conditions of misuse reasonably
    foreseeable by the manufacturer during normal operation and service. Applicability
    of the design principles and any additional requirements, for design, verification,
    validation or information for use are outside the scope of this document. When
    risk assessment concludes that hazards are not significant hazards, the principles
    of this document do not apply. NOTE          Safety requirements for specific
    non-automated functions of agricultural machinery and tractors can be available
    in machine-specific type-C standards. This document is not applicable to: —    
    forestry applications; —     operations on public roads including relevant requirements
    for braking and steering systems. This document is not applicable to agricultural
    machinery and tractors which are manufactured before the date of its publication,
    or to systems applied to agricultural machinery and tractors put into use before
    the date of its publication.'
