abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for workstation ergonomic design
    of baggage handling agents for individual pieces of baggage checked-in by airline
    passengers at airports to be carried into aircraft cargo holds. This document
    applies to all manual handling workplaces in the processing chain for sorting,
    safe handling and routing of the baggage (containers and bulk baggage, departure
    and arrival circuits, at terminal and at aircraft, excluding passenger check-in
    process and loading into aircraft cargo holds). This document doesn't apply to
    manual handling of odd-sized baggage. This document does not specify the baggage
    handling systems in and out of airport terminals, except the baggage weights and
    dimensions to be handled and the critical characteristics of manual workstations.
    This document does not specify the baggage handling systems in the aircraft.
