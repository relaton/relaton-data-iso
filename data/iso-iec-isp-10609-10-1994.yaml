abstract:
- language: en
  script: Latn
  content: Applicable to End Systems concerned with operating in the Open Systems
    Interconnection (OSI) environment. Specifies a combination of OSI standards, which
    collectively provide the connection-mode Transport Service using the connection-mode
    Network Service. Specifies subnetwork-type dependent requirements applicable to
    an end system attached to a local area network (LAN) subnetwork and using the
    ISO 8802-2 LLC type 2 protocol, irrespective of the LAN medium.
