abstract:
- language: en
  script: Latn
  content: 'ISO 17885:2015 specifies the requirements and test methods for mechanical
    fittings intended to join plastic pressure piping systems including transition
    fittings to metal pipes for the following: ? supply of gaseous fuels (GAS); ?
    supply of water for human consumption (W), including raw water prior to treatment
    and for the supply of water for general purpose, as well as underground drainage
    and sewerage under pressure (P); ? supply of water for irrigation (I); ? industrial
    applications (IS). ISO 17885:2015 is applicable only to mechanical fittings with
    operating-temperature and pressure limits as indicated in the relevant systems
    standards.'
