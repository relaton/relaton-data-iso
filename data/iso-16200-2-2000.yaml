abstract:
- language: en
  script: Latn
  content: This part of ISO 16200 gives general guidance for the sampling and analysis
    of volatile organic compounds (VOCs) in air. This part of ISO 16200 is applicable
    to a wide range of VOCs, including hydrocarbons, halogenated hydrocarbons, esters,
    glycol ethers, ketones and alcohols. A number of devices and sorbents are recommended
    for the sampling of these VOCs, each sorbent having a different range of applicability.
    NOTE Activated coconut shell charcoal is frequently used. Very polar compounds
    may require derivatization; very low boiling compounds will only be partially
    retained by the sorbents and can only be estimated qualitatively. Semi-volatile
    compounds will be fully retained by the sorbents, but may only be partially recovered.
    This part of ISO 16200 is valid for the measurement of airborne vapours of VOCs
    in a concentration range of approximately 1 mg/m3 to 1000 mg/m3 individual organic
    for an exposure time of 8 h. The upper limit of the useful range is set by the
    sorptive capacity of the sorbent used and, subject to dilution of the analysed
    solution, by the linear dynamic range of the gas chromatograph column and detector
    or by the sample splitting capability of the analytical instrumentation used.
    The lower limit of the useful range depends on the noise level of the detector
    and on blank levels of analyte and/or interfering artefacts on the sampling devices
    or in the desorption solvent. Artefacts are typically sub-nanogram for activated
    charcoal, but higher levels of aromatic hydrocarbons have been noted in some batches.
