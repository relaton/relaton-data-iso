abstract:
- language: en
  script: Latn
  content: This document establishes a qualification scheme for virtual test environments (VTE) used in the evaluation of automated driving systems (ADS). It specifies criteria and procedures for assessing the VTE in open-loop and closed-loop configurations. This document does not apply to the validation or assessment of individual simulation models (for example, sensor or vehicle dynamics models) and does not apply to the evaluation of ADS performance.
