abstract:
- language: en
  script: Latn
  content: ISO 5667-17:2008 is applicable to the sampling of suspended solids for
    the purpose of monitoring and investigating freshwater quality, and more particularly
    to flowing freshwater systems such as rivers and streams. Certain elements of
    ISO 5667-17:2008 can be applied to freshwater lakes, reservoirs, and impoundments;
    however, field sampling programmes can differ and are not necessarily covered
    here.
