abstract:
- language: en
  script: Latn
  content: 'This document specifies: the classification and selection criteria applicable
    to refrigerating systems;  safety requirements for the installation site of refrigerating
    systems and their ancillary components. These classification and selection criteria
    are used in ISO 5149-2 and ISO 5149-4. This document is applicable to: refrigerating
    systems, stationary or mobile, of all sizes, except vehicle air conditioning systems
    covered by a specific product standard, e.g. ISO 13043 and SAE J 639; secondary
    cooling or heating systems; the location of the refrigerating systems; parts replaced
    and components added after publication of this document if they are not identical
    in function and in capacity. This document is applicable: to new refrigerating
    systems, extensions or modifications of already existing systems; for used systems,
    being transferred to and operated on another site; in the case of the conversion
    of a system for another refrigerant. This document is only applicable to systems
    containing refrigerants which have a safety group classification and are listed
    in ISO 817.'
