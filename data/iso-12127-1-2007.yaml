- language: en
  script: Latn
  content: ISO 12127-1:2007 specifies a test method for the determination of contact
    heat transmission. It is applicable to protective clothing (including hand protectors)
    and its contituent materials intended to protect against high contact temperatures.
    Application of ISO 12127-1:2007 is restricted to contact temperatures between
    100 °C and 500 °C.
