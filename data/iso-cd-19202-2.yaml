abstract:
- language: en
  script: Latn
  content: ISO 19202-2:2017 specifies operational requirements, signage, maintenance,
    repair and modifications for summer toboggan runs and their components according
    to ISO 19202‑1. ISO 19202-2:2017 is applicable to summer toboggan runs and major
    modification to summer toboggan runs and toboggans manufactured after the effective
    date of publication. National rules on occupational safety and health first apply
    and they can be completed by ISO 19202-2:2017.
