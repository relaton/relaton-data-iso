abstract:
- language: en
  script: Latn
  content: This document specifies test methods and test parameters for the strength
    and durability of all hinges, stays and systems, which include stays and hinges
    pivoting on a horizontal axis and their components for all fields of application.
    It does not apply to systems intended for storage functions. With the exception
    of corrosion, ageing and the influence of heat and humidity are not included.
