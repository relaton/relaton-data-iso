abstract:
- language: en
  script: Latn
  content: ISO 14801:2016 specifies a method of dynamic testing of single post endosseous
    dental implants of the transmucosal type in combination with their premanufactured
    prosthetic components. It is most useful for comparing endosseous dental implants
    of different designs or sizes. This International Standard is not a test of the
    fundamental fatigue properties of the materials from which the endosseous implants
    and prosthetic components are made. This International Standard is not applicable
    to dental implants with endosseous lengths shorter than 8 mm nor to magnetic attachments.
    While ISO 14801:2016 simulates the functional loading of an endosseous dental
    implant under "worst case" conditions, it is not applicable for predicting the
    in vivo performance of an endosseous dental implant or dental prosthesis, particularly
    if multiple endosseous dental implants are used for a dental prosthesis.
