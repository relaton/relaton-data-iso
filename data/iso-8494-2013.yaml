abstract:
- language: en
  script: Latn
  content: ISO 8494:2013 specifies a method for determining the ability of metallic
    tubes of circular cross-section to undergo plastic deformation during flange formation.
    ISO 8494:2013 is intended for tubes having an outside diameter no greater than
    150 mm and a wall thickness no greater than 10 mm, although the range of diameters
    or wall thickness for which ISO 8494:2013 is applicable may be more exactly specified
    in the relevant product standard.
