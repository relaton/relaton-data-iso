abstract:
- language: en
  script: Latn
  content: This document specifies the apparatus, materials, specimen preparation,
    procedures, results and reports for testing the corrosion test of steel bars.
    This document includes an evaluation method. This document applies to reinforced
    concrete structures exposed simultaneously to atmospheric, splash, tidal, immersion,
    and buried zones in marine environments. NOTE            Annex A provides test
    apparatus examples. Annex B illustrates test results.
