abstract:
- language: en
  script: Latn
  content: 'ISO/TS 18090-1:2015 is directly applicable to pulsed X-radiation with
    pulse duration of 0,1 ms up to 10 s. This covers the whole range used in medical
    diagnostics at the time of publication. Some specifications may also be applicable
    for much shorter pulses; one example is the air kerma of one pulse. Such a pulse
    may be produced, e.g. by X-ray flash units or high-intensity femtosecond-lasers.
    Other specifications are not applicable for much shorter pulses; one example is
    the time-dependent behaviour of the air kerma rate. This may not be measurable
    for technical reasons as no suitable instrument is available, e.g. for pulses
    produced by a femtosecond-laser. ISO/TS 18090-1:2015 specifies the characteristics
    of reference pulsed radiation for calibrating and testing radiation protection
    dosemeters and dose rate meters with respect to their response to pulsed radiation.
    The radiation characteristics includes the following: a) time-dependent behaviour
    of the air kerma rate of the pulse; b) time-dependent behaviour of the X-ray tube
    high voltage during the pulse; c) uniformity of the air kerma rate within a cross-sectional
    area of the radiation beam; d) air kerma of one radiation pulse; e) air kerma
    rate of the radiation pulse; f) repetition frequency. ISO/TS 18090-1:2015 does
    not define new radiation qualities. Instead, it uses those radiation qualities
    specified in existing ISO and IEC standards. This part of ISO/TS 18090 gives the
    link between the parameters for pulsed radiation and the parameters for continuous
    radiation specifying the radiation qualities. It does not specify specific values
    or series of values for the pulsed radiation field but specifies only those limits
    for the relevant pulsed radiation parameters that are required for calibrating
    dosemeters and dose rate meters and for determining their response depending on
    the said parameters. The pulse parameters with respect to the phantom-related
    quantities were determined using conversion coefficients according to ISO 4037
    (all parts). This is possible as the radiation qualities specified in existing
    ISO and IEC standards are used. A given reference pulsed X-ray facility is characterized
    by the parameter ranges over which the full specifications and requirements according
    to this part of ISO/TS 18090 are met. Therefore, not all reference pulsed X-ray
    facilities can produce pulses covering the same parameter ranges.'
