abstract:
- language: en
  script: Latn
  content: 'This document specifies the application of phased array technology for
    the semi- or fully automated ultrasonic testing of fusion-welded joints in steel
    parts with thickness values between 3,2 mm and 8,0 mm. This meets the typical
    range of tube wall thickness values in boilers, which is an important application
    of this testing technology. The minimum and maximum value of the wall thickness
    range can be exceeded, when testing level "D" of this document is applied. This
    document applies to full penetration welded joints of simple geometry in plates,
    tubes, pipes, and vessels, where both the weld and parent material are low-alloy
    and/or fine grained steel. NOTE "Semi-automated testing" encompasses a controlled
    movement of one or more probes on the surface of a component along a fixture (guidance
    strip, ruler, etc.), whereby the probe position is unambiguously measured with
    a position sensor. The probe is moved manually. "Fully automated testing" includes
    mechanized propulsion in addition. Where material-dependent ultrasonic parameters
    are specified in this document, they are based on steels having a sound velocity
    of (5 920 ± 50) m/s for longitudinal waves, and (3 255 ± 30) m/s for transverse
    waves. It is necessary to take this fact into account when testing materials with
    a different velocity. This document provides guidance on the specific capabilities
    and limitations of phased array technology for the detection, location, sizing
    and characterization of discontinuities in fusion-welded joints. Ultrasonic phased
    array technology can be used as a stand-alone technique or in combination with
    other non-destructive testing (NDT) methods or techniques, during manufacturing
    and testing of new welds/repair welds (pre-service testing). This document specifies
    two testing levels: — level "C" for standard situations; — level "D" for different
    situations/special applications. This document describes assessment of discontinuities
    for acceptance purposes based on: — height and length; — amplitude (equivalent
    reflector size) and length; — go/no-go decision. This document does not include
    acceptance levels for discontinuities.'
