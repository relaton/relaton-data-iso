abstract:
- language: en
  script: Latn
  content: This International Standard specifies a rapid method using nuclear magnetic
    resonance (NMR) for the determination of the oil and water contents of oilseed
    residues obtained after oil extraction by pressure or solvents (excluding mixed
    products). It is applicable to oilseed residues as flour, plates or agglomerates,
    provided that the particles are smaller than 2 mm and that the water content is
    not higher than the conversion threshold.
