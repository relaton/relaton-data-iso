abstract:
- language: en
  script: Latn
  content: ISO 15709:2002 gives a simplified theory of the physics of soil water in
    the unsaturated zone and defines a set of terms, quantities, units and symbols
    used in the field of soil physics investigation of the unsaturated zone. ISO 15709:2002
    is applicable only to standards on soil physical investigations of the unsaturated
    zone (including swelling soils) elaborated within ISO/TC 190. ISO 15709:2002 specifically
    excludes macropore flow.
