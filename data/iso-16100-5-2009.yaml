abstract:
- language: en
  script: Latn
  content: 'ISO 16100-5:2009 specifies the methods and rules for matching existing
    manufacturing software unit (MSU) capability profiles and required capability
    profiles derived from multiple capability class structures. The methods and rules
    allow MSUs in manufacturing applications to be evaluated for interoperability
    and, in some cases, for interchangeability. The following are outside the scope
    of ISO 16100-5:2009: services for creating, registering and accessing the various
    templates for the reference manufacturing domain models, the manufacturing domain
    data and the capability class structures; the conformance tables that reference
    Type 1 services defined and specified in ISO 16100-3; additional services needed
    for managing these templates in a database or equivalent object repository.'
