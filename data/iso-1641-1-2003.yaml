abstract:
- language: en
  script: Latn
  content: 'ISO 1642-1:2002 specifies the general dimensions of the following milling
    cutters with plain cylindrical, flatted cylindrical and threaded shanks: end mills,
    flat-ended or ball-nosed -- standard series and long series; slot drills -- short
    series and standard series. The dimensional characteristics of cylindrical shanks
    are in accordance with ISO 3338-1, ISO 3338-2 and 3338-3.'
