abstract:
- language: en
  script: Latn
  content: This document applies to analog night vision devices such as monoculars,
    binoculars and bioculars that are used under extreme low light conditions, at
    night or in dark rooms, for observation activities, search and rescue actions,
    performing urgent repairs in the dark, night-time surveillance and security, night
    hunting and fishing (where legal), night driving and exploring dark spaces like
    caves or tunnels.  This document does not cover analog night and thermal imaging
    vision telescopic sights and front attachments. 
