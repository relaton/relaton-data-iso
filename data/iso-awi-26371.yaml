abstract:
- language: en
  script: Latn
  content: This document specifies the quality and safety requirements and test methods
    of Alisma orientale and Alisma plantago-aquatica tuber, which is derived from
    the tuber of Alisma orientale (Sam.) Juzep. and Alisma plantago-aquatica Linn.
    (Fam. Alismataceae). This document is applicable to Alisma orientale and Alisma
    plantago-aquatica tuber that are sold and used as natural medicines in international
    trade, including Chinese Materia Medica (whole medicinal material) and decoction
    pieces derived from this plant.
