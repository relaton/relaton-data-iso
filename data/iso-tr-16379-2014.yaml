abstract:
- language: en
  script: Latn
  content: ISO/TR 16379:2014 has been prepared for evaluation of therapeutic courses
    for articular cartilage disease and summarizes results from structural evaluation
    of knee joint cartilage by diffusion tensor imaging, an MRI applied technology
    allowing non-invasive observation of soft tissue morphology in vivo. ISO/TR 16379:2014
    is intended for use in areas such as regenerative medicine for knee joint cartilage
    disease.
