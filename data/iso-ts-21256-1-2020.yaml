abstract:
- language: en
  script: Latn
  content: This document describes the test method to evaluate the cleaning performance
    of ultrafine bubble water when used in high-pressure water jet to wash out salt-stained
    steel surfaces. The evaluation is carried out by measuring comparative removal
    of salt stain from the surface of a test plate with the ultrafine bubble water
    to that with control water.
