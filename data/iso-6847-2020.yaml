abstract:
- language: en
  script: Latn
  content: This document specifies the procedure to be used for deposition of a weld
    metal pad for chemical analysis. This document applies to deposition of a weld
    metal pad by use of covered electrodes, wire electrodes for gas shielded metal
    arc welding, tubular cored electrodes for gas shielded metal arc welding and for
    non-gas shielded metal arc welding, solid rods and tubular cored rods for gas
    tungsten arc welding, and wire-flux and strip-flux combinations for submerged
    arc welding or electroslag welding and cladding. This document is applicable to
    welding consumables for non-alloy and fine grain steels, high strength steels,
    creep-resisting steels, stainless and heat-resisting steels, nickel and nickel
    alloys, and copper and copper alloys.
