abstract:
- language: en
  script: Latn
  content: This document gives guidance for the organization of learning and development
    in the workplace. This guidance is concerned with formal and informal learning
    that addresses short-term operational needs and the long-term skills needs of
    an organization as well as the career-related and life-long learning needs of
    individual workers as these align with organizational context and strategy. The
    administrative operations connected with the organization of learning and development
    are outside the scope of this document. In this document, where any process involving
    one-to-one or group interaction is referred to, such interaction can be either
    face-to-face or through some form of online technology. Organizations include
    both commercial and non-profit employers of all sizes which directly employ individuals.
    The guidance principles set out in this document apply to all workers who have
    a relationship with the organization, such as contractors, subcontractors, trainees,
    interns and volunteers when they work on behalf of the organization in some contractual
    or non-contractual capacity.
