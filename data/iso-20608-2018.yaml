abstract:
- language: en
  script: Latn
  content: ISO 20608:2018 specifies the general requirements, test methods, manufacturer's
    information, marking and packaging, independently of the design of the powder
    jet handpieces (see Figure 1). ISO 20608:2018 applies to powder jet handpieces
    and their associated powders for use in the field of dentistry. They are used
    on patients to remove dental debris, discolourations and plaque and to clean and
    polish teeth where abrasion is a side effect. ISO 20608:2018 is also applicable
    to powder jet handpieces and their associated powders that are used in dentistry
    for air driven abrasion, e.g. minimally invasive cavity preparation, preparation
    of surfaces for adhesives and for the removal of cement residues where abrasion
    is part of the desired outcome. ISO 20608:2018 is not applicable for the dental
    units that are employed to supply the powder jet handpieces. ISO 20608:2018 is
    not applicable to dental prophylaxis handpieces (contra angles), or electrically
    driven plaque removers (scalers) or multifunctional handpieces (syringes).
