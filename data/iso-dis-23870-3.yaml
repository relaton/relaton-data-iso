abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for the HSI single data channel
    coupling connector system used to connect machines, attachments and expansion
    kits within an HSI infrastructure. This document specifies: — The HSI coupling
    plug, HSI break-away connector and HSI expansion connector; — Functional, stylistic,
    geometric, mounting, mechanical, material and electrical requirements; — Conformance
    testing of the HSI single data channel coupling connector system.'
