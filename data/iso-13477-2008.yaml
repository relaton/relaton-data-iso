abstract:
- language: en
  script: Latn
  content: ISO 13477:2008 specifies a small-scale (S4) test method for determining
    the arrest or propagation of a crack initiated in a thermoplastics pipe at a specified
    temperature and internal pressure. ISO 13477:2008 is applicable to the assessment
    of the performance of thermoplastics pipes intended for the supply of gases or
    liquids. In the latter case, air can also be present in the pipe.
