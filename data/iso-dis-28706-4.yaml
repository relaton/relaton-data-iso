abstract:
- language: en
  script: Latn
  content: ISO 28706-4:2016 describes a test method for the determination of the resistance
    of vitreous and porcelain enamelled articles to attack by alkaline liquids at
    temperatures between 25 °C and 95 °C. The apparatus used is a cylindrical vessel
    in which only one enamelled specimen is tested. NOTE 1 The test method was initially
    set up for determination of the resistance of vitreous and porcelain enamels to
    a hot sodium hydroxide solution. Within the scope of this part of ISO 28706, the
    resistance of other alkaline liquids can be tested. NOTE 2 This part of ISO 28706,
    which uses a cylindrical vessel, is generally used for tests carried out on vitreous
    and porcelain enamel coatings for the chemical industry.
