abstract:
- language: en
  script: Latn
  content: ISO 17654:2003 specifies the pressure test method to be applied to resistance
    seam welded specimens of different types of material, e.g. uncoated and coated
    ferritic steels and uncoated austenitic steel sheet with single sheet thicknesses
    ranging from 0,3 mm to 3,2 mm. The purpose of this pressure test is to determine
    the suitability of the material, welding equipment, welding parameters and of
    other factors on a tank, a vessel or a container for liquids or gases, which are
    manufactured by resistance seam welding.
