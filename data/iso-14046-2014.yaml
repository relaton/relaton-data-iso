abstract:
- language: en
  script: Latn
  content: ISO 14046:2014 specifies principles, requirements and guidelines related
    to water footprint assessment of products, processes and organizations based on
    life cycle assessment (LCA). ISO 14046:2014 provides principles, requirements
    and guidelines for conducting and reporting a water footprint assessment as a
    stand-alone assessment, or as part of a more comprehensive environmental assessment.
    Only air and soil emissions that impact water quality are included in the assessment,
    and not all air and soil emissions are included. The result of a water footprint
    assessment is a single value or a profile of impact indicator results. Whereas
    reporting is within the scope of ISO 14046:2014, communication of water footprint
    results, for example in the form of labels or declarations, is outside the scope
    of ISO 14046:2014.
