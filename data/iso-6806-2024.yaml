abstract:
- language: en
  script: Latn
  content: 'This document specifies the minimum requirements for rubber hoses and
    hose assemblies for use in oil burners. The following two types of hose assembly
    are specified: —     Type 1: Hose assemblies for flux and reflux, but not for
    insertion between the oil burner pump and the atomizing connection; maximum working
    pressure 1,0 MPa (10 bar); maximum oil temperature 100 °C; —     Type 2: Hose
    assemblies for insertion between the oil burner pump and the atomizing connection;
    maximum working pressure 4,0 MPa (40 bar); maximum oil temperature 100 °C. The
    hose assemblies specified in this document are not intended to be used, without
    special assessment, for purposes other than oil burner installations.'
