abstract:
- language: en
  script: Latn
  content: ISO 6807:2003 specifies the requirements for textile- and steel-reinforced
    rubber hoses and hose assemblies for use with water-based and/or oil-based muds,
    up to a maximum temperature of 82 °C, which are pumped at high pressure in large
    volumes in rotary drilling service and which, when tested in accordance with ISO
    2977, have a minimum aniline point of 66 °C. This International Standard applies
    to hoses which are suitable for use at ambient temperatures between -20 °C and
    +52 °C, unless changed by a supplementary requirement on request of the purchaser,
    and are resistant to ageing and tropical conditions. This International Standard
    does not apply to hoses which are intended for use with gases.
