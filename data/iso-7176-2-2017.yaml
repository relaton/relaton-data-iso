abstract:
- language: en
  script: Latn
  content: ISO 7176-2:2017 specifies test methods for determining the dynamic stability
    of electrically powered wheelchairs. ISO 7176-2:2017 is applicable to electrically
    powered wheelchairs, including scooters, with a maximum nominal speed not exceeding
    15 km/h, intended to carry one person. ISO 7176-2:2017 is not applicable to manual
    wheelchairs with add-on power kits used for, or to assist, propulsion.
