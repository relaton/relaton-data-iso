abstract:
- language: en
  script: Latn
  content: 'ISO 18763:2016 describes a technique for determining the effects of soil
    and soil-related materials on the seed germination and early growth of higher
    plants. These endpoints are useful indicators for the assessment of the quality
    of a soil as a habitat for organisms. It is applicable to all soils in which soil
    organisms are active and may be used to evaluate: - the effects on plants due
    to toxicity of solid or liquid chemicals contaminating soil or materials (compost,
    sludge, waste) and chemicals added to soil; - the changes in the soil effect on
    plants after restoration measures.'
