abstract:
- language: en
  script: Latn
  content: The second edition of ISO/IEC 12087-5 is being driven by the needs of certain
    U.S. DoD stakeholders and their partners to have their BIIF Profile standards
    be capable of extending the Image Mode (IMODE) field of the BIIF standard, which
    is currently not an extensible field. The profile-specific extensions being considered
    by this user community support the addition of a temporal dimension to the profiled
    logical data formats. The requesting parties have demonstrated the utility of
    these proposed changes and have identified reference implementations which prove
    the feasibility of the proposed changes. Since two Corrigenda Items already exist
    against the first edition of the standard, JTC 1/SC 24/WG 7 has suggested that
    a full second edition should be created. Beyond the proposed changes to the IMODE
    field definition, this NWIP also proposes to correct mistakes, errors, and inconsistencies
    in the current standard which have been identified by community stakeholders.
    In addition, the example profile contained in the standard is outdated and will
    be updated to reflect the currently registered graphical item supplied by the
    Treaty on Open Skies user community.
