abstract:
- language: en
  script: Latn
  content: This document applies to generating sets driven by reciprocating internal
    combustion (RIC) engines for emergency power supply to safety services. This document
    applies, for example, to safety equipment in hospitals, high-rise buildings and
    public gathering places. It establishes the special requirements for the performance,
    design and maintenance of generating sets used in these applications referred
    to previously and takes into account the provisions of ISO 8528-1 to ISO 8528-6
    and ISO 8528-10.  
