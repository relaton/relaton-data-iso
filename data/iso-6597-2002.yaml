abstract:
- language: en
  script: Latn
  content: ISO 6597specifies the method of testing the hydraulic braking systems of
    vehicles of categories M and N (with and without antilock device) which are built
    to comply with ECE-R 13/09 without supplements. Hydraulic braking systems include
    vacuum-assisted and power hydraulic-assisted braking systems as well as full power
    hydraulic braking systems.
