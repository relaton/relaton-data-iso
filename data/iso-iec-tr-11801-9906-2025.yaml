abstract:
- language: en
  script: Latn
  content: 'This document covers cabling channel specifications, for cabling channels
    constructed from balanced single-pair cabling components, intended for use in: 
    1)    industrial automation applications, Industrial Internet of Things (IIoT),
    Industry 4.0; 2)   enterprise building applications, Internet of Things (IoT),
    smart lighting, energy management, and access control; 3)   other IoT applications,
    smart building, and home automation applications. The cabling channel specifications
    are intended to support ISO/IEC/IEEE 8802-3 single-pair Ethernet (SPE) link segment
    specifications in the following SPE physical layer specifications (PHYs): a)  
    1000BASE‑T1 Type B, with reach up to 40 m; b)   1000BASE‑T1 Type A, with reach
    up to 15 m; c)    100BASE‑T1L, with reach up to 500 m; d)   100BASE‑T1, with reach
    up to 15 m; e)   10BASE‑T1L, with reach up to 1000 m; f)    10BASE‑T1S, with reach
    up to 15 m. NOTE At the time of publication, 100BASE-T1L is unpublished. The channel
    component specifications are referenced according to corresponding IEC balanced
    single-pair cable and connector specifications. Channel specifications include
    IL, RL, TCL, coupling attenuation, and alien crosstalk parameters specifications.
    The channel EMC related specifications are referenced according to the MICE standard
    environmental characterization systems specified in ISO/IEC 11801-1.'
