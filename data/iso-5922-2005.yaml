abstract:
- language: en
  script: Latn
  content: ISO 5922:2005 specifies requirements for two types of malleable cast iron,
    namely whiteheart malleable cast iron and blackheart malleable cast iron, used
    in the manufacture of castings. Classification is given for each type of malleable
    cast iron on the basis of mechanical properties determined on separately cast
    test pieces. ISO 5922:2005 is applicable only to malleable cast iron cast into
    sand moulds or moulds of comparable thermal diffusivity.
