abstract:
- language: en
  script: Latn
  content: This document provides a guideline for good design and practice for urban
    reclaimed water that recharges into landscape water, including urban stream flow
    (e.g. rivers and lakes), aesthetic impoundments and wetlands replenishment, to
    ensure the proper support of the aquatic ecosystem. This document covers urban
    stream flow and leisure with possible incidental body contact. It does not cover
    urban irrigation, such as the irrigation of elements of the natural environment,
    urban public areas, or residential areas. It does not cover the cultivation of
    aquatic plants or animals for food purposes, including their sale. This document
    provides recommendations for reclaimed water for landscaping uses, including those
    for planning, design, management, and maintenance.
