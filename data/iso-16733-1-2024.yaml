abstract:
- language: en
  script: Latn
  content: This document describes a methodology for the selection of design fire
    scenarios for use in fire-safety engineering analyses of any built environment,
    including —     buildings, —     structures, and —     transportation systems.
    This document specifies procedures for selecting a manageable number of design
    fire scenarios using a qualitative or semi-quantitative approach. NOTE         
    See ISO 16732-1 for a full quantitative approach using risk assessment.
