abstract:
- language: en
  script: Latn
  content: ISO 9934-1:2015 specifies general principles for the magnetic particle
    testing of ferromagnetic materials. Magnetic particle testing is primarily applicable
    to the detection of surface-breaking discontinuities, particularly cracks. It
    can also detect discontinuities just below the surface but its sensitivity diminishes
    rapidly with depth. This part of ISO 9934 specifies the surface preparation of
    the part to be tested, magnetization techniques, requirements and application
    of the detection media, and the recording and interpretation of results. Acceptance
    criteria are not defined. Additional requirements for the magnetic particle testing
    of particular items are defined in product standards (see the relevant ISO or
    EN standards). This part of ISO 9934 does not apply to the residual magnetization
    method.
