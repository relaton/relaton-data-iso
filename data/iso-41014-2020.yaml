abstract:
- language: en
  script: Latn
  content: 'This document gives guidelines for the development of a strategy for facility
    management (FM) when the FM organization: a) intends to ensure alignment between
    FM requirements and the objectives, needs and constraints of the demand organization''s
    core business; b) wants to improve the usefulness and benefits provided by the
    facilities for the betterment of the demand organization and its core business;
    c) aims to meet the needs of stakeholders and applicable provisions consistently;
    d) aims to be sustainable in a globally competitive environment.'
