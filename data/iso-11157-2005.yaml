abstract:
- language: en
  script: Latn
  content: ISO 11157:2005 specifies a dynamometer test method to homologate alternative
    types of brake linings (including pads) mounted on original equipment, in accordance
    with UN-ECE Regulation No. 13-09, annex 15. ISO 11157:2005 is applicable to road
    vehicles of categories M, N and O as defined in UN-ECE Consolidated resolution
    of the construction of vehicles, R.E.3, annex 7. Application for approval corresponding
    to this test method is made by the vehicle manufacturer (in the case of vehicles
    of category O the application is to be made by the axle or brake manufacturer)
    or by his duly accredited representative.
