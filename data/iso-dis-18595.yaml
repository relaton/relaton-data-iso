abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for resistance spot welding in the
    fabrication of assemblies of aluminium sheet, extrusions (both work- and age-hardening
    alloys) and/or cast material comprising two or three thicknesses of metal, where
    the maximum single (sheet) thickness of components to be welded is within the
    range 0,6 mm to 6 mm. This document is applicable to the welding of sheets or
    plates of dissimilar thickness where the thickness ratio is less than or equal
    to 3:1. It applies to the welding of three thicknesses where the total thickness
    is less than or equal to 9 mm. Welding with the following types of machines is
    within the scope of this document: — pedestal welding machines; — gun welders;
    — automatic welding equipment where the components are fed by robots or automatic
    feeding equipment; — multi-welders; — robotic welders. Information on appropriate
    welding equipment is given in Annex A and on spot welding conditions in Annex
    B. The latter are for guidance only and can require modification depending on
    service conditions of the fabrication, type of welding equipment, characteristics
    of the secondary circuit, electrode material and geometry. The welding of coated
    material, e.g. zinc-coated or anodized material, is outside the scope of this
    document.'
