abstract:
- language: en
  script: Latn
  content: This document specifies a method for measuring the Palmqvist toughness
    of hardmetals and cermets at room temperature by an indentation method. This document
    is applicable to a measurement of toughness, called Palmqvist toughness, calculated
    from the total length of cracks emanating from the corners of a Vickers hardness
    indentation, and it is intended for use with metal-bonded carbides and carbonitrides
    (normally called hardmetals, cermets or cemented carbides). The test procedures
    specified in this document are applicable for use at ambient temperatures, but
    can be extended to higher or lower temperatures by agreement. The test procedures
    specified in this document are also applicable for use in a normal laboratory-air
    environment. This document is not applicable for use in corrosive environments,
    such as strong acids or seawater.
