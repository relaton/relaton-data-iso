abstract:
- language: en
  script: Latn
  content: ISO 16961:2015 specifies the minimum requirements for surface preparation,
    materials, application, inspection and testing of internal coating lining systems
    that are intended to be applied on internal surfaces of steel storage tanks of
    crude oil, hydrocarbons and water for corrosion protection. It covers both new
    construction and maintenance works of tank internal coating and lining as well
    as the repair of defective and deteriorated systems. ISO 16961:2015 also provides
    the minimum requirements for shop performance testing of the coated/lined samples
    and the criteria for their approval.
