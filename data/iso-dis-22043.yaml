abstract:
- language: en
  script: Latn
  content: This document specifies the classification for horizontal closed ice-cream
    freezer with access of the product from the top via transparent or solid lid(s)
    and specifies their requirements and test methods. The ice-cream freezers defined
    in this document are different from supermarket segment freezers, as they work
    with static air cooling, with a skin evaporator (no evaporator fan) and are used
    specifically for the storage and display of pre-packed ice-cream. This document
    is only applicable to integral type refrigeration systems. It is not applicable
    to remote and secondary system type cabinets. Ice-cream freezers defined in this
    document are intended to have a net volume ≤600 l. For transparent lid ice-cream
    freezers only, they are intended to have a net volume/TDA ≥ 0,35 m.
