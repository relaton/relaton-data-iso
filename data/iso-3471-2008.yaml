abstract:
- language: en
  script: Latn
  content: 'ISO 3471:2008 specifies performance requirements for metallic roll-over
    protective structures (ROPS) for earth-moving machinery, as well as a consistent
    and reproducible means of evaluating the compliance with these requirements by
    laboratory testing using static loading on a representative specimen. ISO 3471:2008
    is applicable to ROPS intended for the following mobile machines with seated operator
    as defined in ISO 6165 and with a mass greater than or equal to 700 kg: dozer;
    loader; backhoe loader; dumper; pipelayer; tractor section (prime mover) of a
    combination machine (e.g. tractor scraper, articulated frame dumper); grader;
    landfill compactor; roller; trencher. ISO 3471:2008 is not applicable to training
    seats or additional seats for operation of an attachment.'
