abstract:
- language: en
  script: Latn
  content: This document specifies optically and mechanically related dimensions for
    imaging components of a microscope such as a) the dimensions related to objective,
    eyepiece and tube lens, b) the dimensions of screw thread types for connecting
    a microscope objective to the nosepiece, and c) the diameters of interchangeable
    eyepieces and corresponding viewing tubes of microscopes.
