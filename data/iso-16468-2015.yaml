abstract:
- language: en
  script: Latn
  content: ISO 16468:2015 specifies technical requirements for castings (steel, nickel
    alloys, and cobalt alloys) produced by the investment-casting process. The International
    Standards specifying metallurgical material requirements for steel, nickel alloy,
    and cobalt alloy casting grades are listed in the Bibliography. The requirements
    stated in ISO 16468:2015 form an integral part of the material specification.
    In cases of conflict, the requirements of this specification take precedence over
    the individual material specification requirements.
