abstract:
- language: en
  script: Latn
  content: 'This document provides requirements for demonstrating that the site in
    question is adequate to provide safe, long-term containment of CO2, for demonstrating
    that the CO2 flood is operated in a way to assure containment of the CO2 in the
    EOR complex, and for quantifying associated storage. This document applies to
    CO2 that is injected in enhanced recovery operations for oil and other hydrocarbons,
    including natural gas, (CO2-EOR) for which quantification of CO2 that is safely
    stored long-term in association with the CO2-EOR project is sought. Recognizing
    that some CO2-EOR projects use non-anthropogenic CO2 in combination with anthropogenic
    CO2, the document also shows how allocation ratios can be utilized for optional
    calculations to quantify the portion of associated storage comprised of anthropogenic
    CO2 (see Annex A). This document does not apply to quantification of CO2 injected
    into reservoirs where no hydrocarbon production is anticipated or occurring. Storage
    of CO2 in geologic formations that do not contain hydrocarbons is covered by ISO 27914
    even if located above or below hydrocarbon producing reservoirs. If storage of
    CO2 is conducted in a reservoir from which hydrocarbons were previously produced
    but will no longer be produced in paying or commercial quantities, such storage
    would be subject to the requirements of ISO 27914. This document addresses: safe,
    long-term containment of CO2 within the EOR complex; CO2 leakage from the EOR
    complex through leakage pathways; and on-site CO2-EOR project loss of CO2 from
    wells, equipment, or other facilities. This document does not address the following:
    lifecycle emissions, including but not limited to CO2 emissions from capture or
    transportation of CO2, on-site emissions from combustion or power generation,
    and CO2 emissions resulting from the combustion of produced hydrocarbons; storage
    of CO2 above ground; buffer and seasonal storage of CO2 below ground (similar
    to natural gas storage); )any technique or product that does not involve injection
    of CO2 into the subsurface; and emissions of any greenhouse gases (GHGs) other
    than CO2. NOTE            Some authorities can require other GHG components of
    the CO2 stream to be quantified.'
