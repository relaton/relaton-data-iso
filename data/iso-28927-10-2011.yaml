abstract:
- language: en
  script: Latn
  content: ISO 28927-10:2011 specifies a laboratory method for measuring hand-transmitted
    vibration emission at the handles of hand-held power driven percussive machines
    with and without rotary action [portable rock drills, plug hole drills, rotary
    hammers, breakers (e.g. pavement breakers, concrete breakers or road breakers),
    riveting hammers, chipping hammers, pick hammers or similar]. It is a type-test
    procedure for establishing the magnitude of vibration in the gripping areas of
    a machine fitted with an inserted tool bit. ISO 28927-10:2011 is applicable to
    hand-held machines, driven pneumatically or by other means, intended for making
    holes in hard materials, such as rock and concrete. It is also applicable to breakers
    intended to work downwards to break hard materials (concrete, rock, pavement,
    asphalt, etc.) and for hammers intended to work in any direction to perform riveting
    or chiselling work. It is not applicable to impact drills with direct mechanical
    impact mechanisms. ISO 28927-10:2011 is not applicable to jack leg type rock drills
    and push feed rock drills, which are hand guided (the feed force is not applied
    by hand, but by an additional device).
