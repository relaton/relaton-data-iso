abstract:
- language: en
  script: Latn
  content: This standard provides a methodology, and a listing of fields of (technical)
    activity, organized in groups and subgroups, for classifying standards publications.
    By inheritance, it provides a common, harmonized understanding of standards application
    domains - enabling interoperability, consistency, and semantic alignment across
    different systems and stakeholders, in the form of a foundational semantic enrichment
    of SMART standards.
