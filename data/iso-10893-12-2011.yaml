abstract:
- language: en
  script: Latn
  content: ISO 10893-12:2011 specifies requirements for the automated full peripheral
    ultrasonic testing of seamless and welded steel tubes, with the exception of submerged
    arc-welded (SAW) tubes, for wall thickness measurement. It specifies the testing
    method and corresponding calibration procedures. It can also be applicable to
    the testing of circular hollow sections. ISO 10893-12:2011 is applicable to the
    thickness measurement of tubes with a specified outside diameter equal to or greater
    than 25,4 mm and a minimum wall thickness of 2,6 mm, unless otherwise agreed on.
