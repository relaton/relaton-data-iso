abstract:
- language: en
  script: Latn
  content: 'This document defines the requirements for the symbology known as Aztec
    Code. It specifies the Aztec Code symbology characteristics, including: —    
    data character encodation; —     rules for error control encoding; —     the graphical
    symbol structure; —     symbol dimensions and print quality requirements; —    
    a reference decoding algorithm; —     user-selectable application parameters.'
