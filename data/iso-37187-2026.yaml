abstract:
- language: en
  script: Latn
  content: This document provides guidance on the city information modelling (CIM)
    platform for the information modelling process of smart city construction, operation
    and maintenance. This document applies to both building and infrastructure assets.
    It also applies to the management of the CIM platform and its related applications
    and scenarios, including community infrastructures, such as transportation, communication,
    energy, roads and logistics, and the activities of stakeholders (both organizations
    and citizens) for governments, enterprises, schools, health care and families,
    etc. NOTE            Annex A outlines case studies on data exchange and sharing
    using the CIM platform in smart communities.
