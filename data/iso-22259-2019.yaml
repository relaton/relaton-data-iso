abstract:
- language: en
  script: Latn
  content: This document specifies requirements for typical conference systems, the
    parts they are composed of, the auxiliary devices necessary for their use (such
    as microphones, headphones, and sound reinforcement equipment) and the environment
    in which they are used. These requirements ensure interoperability and optimum
    performance under conditions of normal operation. It is applicable to both wired
    and wireless systems. The environment and areas where events are held are described
    in Annex A. This document facilitates the determination of the quality of conference
    systems, the comparison of different systems and the assessment of their proper
    use by listing their characteristics. This document contains the technical backbone
    of ISO 20108 and ISO 20109.
