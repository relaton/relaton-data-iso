abstract:
- language: en
  script: Latn
  content: The plutonium dioxide has to contain less than 0,5 % of non-volatile impurities.
    The content of these impurities shall be measured and a correction made to allow
    for them. The method is used to cross-check accountancy analyses of plutonium
    dioxide for safeguard purposes. Principle of the method, interferences, reagents,
    apparatus, procedure and expression of results are described.
