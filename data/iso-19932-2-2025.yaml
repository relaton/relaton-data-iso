abstract:
- language: en
  script: Latn
  content: This document specifies particular test methods for the verification of
    requirements of ISO 19932-1:2025 for knapsack sprayers carried on the back or
    shoulder of the operator for use with plant protection products. It is applicable
    to lever-operated knapsack sprayers, knapsack compression sprayers and knapsack
    sprayers driven by an engine or electric motor using hydraulic pressure atomization
    of the spray liquid intended to be used primarily in agriculture, forestry and
    horticulture with a nominal volume of more than 6,0 l. It does not apply to knapsack
    combustion engine-driven air-blast sprayers covered by ISO 28139:2019+2019A1:2024.
    This document is intended to be applied in conjunction with ISO 19932-1:2025.
