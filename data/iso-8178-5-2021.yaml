abstract:
- language: en
  script: Latn
  content: This document specifies fuels whose use is recommended for performing the
    exhaust emission test cycles given in ISO 8178-4. It is applicable to reciprocating
    internal combustion engines for mobile, transportable and stationary installations
    excluding engines for vehicles primarily designed for road use. This document
    is applicable to engines used, e.g. earth-moving machines and generating sets,
    and for other applications.
