abstract:
- language: en
  script: Latn
  content: This document gives test methods to determine the dimensional variance
    between elements of laminate floor coverings in a manufactured free-standing shape
    (unrestricted) in respect of thickness, length, width, squareness, straightness,
    width flatness, length flatness, openings between assembled elements and height
    differences between assembled elements. NOTE These test methods are also applicable
    to other mechanically assembled panels, e.g. modular multilayer floorings.
