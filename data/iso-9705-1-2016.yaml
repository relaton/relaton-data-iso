abstract:
- language: en
  script: Latn
  content: ISO 9705-1:2016 specifies the test method to evaluate the reaction of wall
    and ceiling products to fire when installed at the surface of a small room and
    exposed directly to a specified ignition source. The test represents a fire scenario,
    which starts under well-ventilated conditions in a corner of a specified room
    with a single open doorway. Tests performed in accordance with the method specified
    in this part of ISO 9705 provide data for the early stages of a fire from ignition
    up to flashover. The method does not evaluate the fire resistance of products.
    The method is not intended to evaluate floor coverings. This method is not suitable
    for sandwich panel building systems, pipe insulation and façades for which specific
    ISO standards (i.e. ISO 13784, ISO 20632 and ISO 13785, respectively) are available.
