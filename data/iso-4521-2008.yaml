abstract:
- language: en
  script: Latn
  content: ISO 4521:2008 specifies requirements for electroplated silver and silver
    alloy coatings for electrical, electronic and other engineering applications,
    including test methods. Engineering applications are defined as those in which
    the coating essentially serves a non-decorative purpose. Although ISO 4521:2008
    does not specify the condition, finish or surface roughness of the basis material
    prior to electroplating, the appearance and serviceability of electroplated silver
    and silver alloy coatings depends on the condition of the basis material. It is
    essential that the purchaser specifies the surface finish and roughness of the
    basis material in order to conform to the product requirements. ISO 4521:2008
    does not apply to coatings on screw threads or to coatings on sheet, strip or
    wire in the non-fabricated form.
