abstract:
- language: en
  script: Latn
  content: ISO 8653:2016 specifies a method to measure the ring-size using a ring
    stick with defined characteristics, which is mainly used during manufacturing
    steps, and specifies the designation of the ring-size. NOTE For jeweller-consumer
    relationships, the finger size is measured with a finger gauge set made up of
    a ring for each size with the same diameter and tolerance than the ring stick
    ones.
