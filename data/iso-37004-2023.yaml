abstract:
- language: en
  script: Latn
  content: This document gives guidance on evaluating the establishment of governance
    conditions and on the application of governance principles with consideration
    for the ISO 37000 key aspects of practice. It sets out the concept of governance
    maturity and its measurement and provides a governance maturity measurement framework,
    associated governance maturity scale and a governance maturity model. This document
    is applicable to all types and sizes of organizations no matter their location.
