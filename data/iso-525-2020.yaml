abstract:
- language: en
  script: Latn
  content: 'This document is applicable for bonded abrasive products in general. NOTE
    1 Bonded abrasive products are e.g. grinding wheels, segments, sticks and stones.
    This document specifies: a) ISO type number and shape; b) dimensional symbols;
    c) standard profiles; d) specification; e) designation; f) marking requirements.
    NOTE 2 This document is general and is complemented by ISO 603 (all parts) that
    is applicable for dimensions, by ISO 6103 that is applicable for permissible unbalance
    and by ISO 13942 that is applicable for limit deviations and tolerances. This
    document is not applicable for superabrasive products and coated abrasive products.'
