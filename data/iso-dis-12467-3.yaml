abstract:
- language: en
  script: Latn
  content: This document specifies potentiometric titration methods for the determination
    of lithium carbonate and lithium hydroxides content in lithium composite oxides
    for lithium-ion batteries (LIBs). The method is applicable to lithium composite
    oxides for LIBs with a mass fraction of lithium carbonate and lithium hydroxides
    in the range from 0.001% to 2.500%.
