abstract:
- language: en
  script: Latn
  content: 'This document specifies a uniform, reproducible testing process for various
    drive units, chassis, constructions and lifting devices for the refuse collection
    vehicles described in EN 1501 (all parts, excluding EN 1501-4), with which a comparison
    for energy consumption can be performed. This specification defines criteria for
    a reference area with regard to a synthesized tour (test circuit). This therefore
    serves to determine a representative test circuit and/or data for a software calculation
    tool, e.g. VECTO[1]. NOTE            VECTO (Vehicle Energy Consumption calculation
    TOol) is a simulation tool that has been developed by the European Commission
    for determining CO2 emissions and fuel consumption from heavy duty vehicles with
    a gross vehicle mass above 3 500 kg. URL: https://ec.europa.eu/clima/policies/transport/vehicles/vecto_en#tab-0-0
      [1] VECTO is an example of a suitable product available free of charge. This
    information is given for the convenience of users of this document and does not
    constitute an endorsement by ISO of this product.'
