abstract:
- language: en
  script: Latn
  content: ISO 7590:2009 specifies three methods for the measurement of total belt
    thickness and the thickness of covers of steel cord conveyor belts. Methods A1
    and A2 (micrometer methods) can be used for all steel cord conveyor belts for
    the measurement of both total belt thickness and cover thickness. Method B (optical
    method) is recommended for the measurement of cover thickness only. It is not
    suitable if there is a textile or metal weft, nor if the ends of the steel cords
    become twisted when cut.
