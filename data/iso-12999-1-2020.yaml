abstract:
- language: en
  script: Latn
  content: This document specifies procedures for assessing the measurement uncertainty
    of sound insulation in building acoustics. It provides for — a detailed uncertainty
    assessment; — a determination of uncertainties by inter-laboratory tests; — an
    application of uncertainties. Furthermore, typical uncertainties are given for
    quantities determined according to ISO 10140 (all parts), ISO 16283 (all parts)
    and ISO 717 (all parts).
