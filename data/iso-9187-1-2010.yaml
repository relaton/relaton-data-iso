abstract:
- language: en
  script: Latn
  content: ISO 9187-1:2010 specifies materials, dimensions, capacities, performance
    and packaging requirements for three forms of glass ampoule (forms B, C and D)
    for injectable pharmaceutical products. ISO 9187-1:2010 is applicable to ampoules
    with and without a colour break-ring; the provision of ampoules with a colour
    break-ring, and the choice of colour of the break-ring, is subject to agreement
    between the manufacturer and user. Ampoules complying with ISO 9187-1:2010 are
    intended for single use only.
