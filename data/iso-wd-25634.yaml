abstract:
- language: en
  script: Latn
  content: 'Multiple fields of data science technology such as statistical method,
    scientific method, machine learning, deep learning, artificial intelligence (AI),
    and data analysis are applied to define a method to manage corrosion rate (corrosion
    life) or corrosion risk in atmospheric corrosion environment from enormous data
    on materials and environment. [*] The process of optimizing corrosion management
    such as corrosion prevention methods, corrosion risk categorization, corrosion
    life estimation, and establishment of equipment maintenance measures using data
    science technology is roughly composed of the following items This document is
    applicable to: — date acquisition and selection (corrosion data, environmental
    data); — data preparation for quality improvement; — model selection, learning,
    verification,and rule derivation; — improvements of corrosion risk management
    and corrosion control. The steps to actually apply data science technology are
    defined in the classification of use cases. Broadly, it consists of the following:
    1)data acquisition; 2)Study of the learning model; 3)prediction.'
