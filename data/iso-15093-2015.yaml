abstract:
- language: en
  script: Latn
  content: ISO 15093:2015 specifies an analytical procedure for the determination
    of either platinum in platinum jewellery alloys, gold in gold jewellery alloys,
    or palladium in palladium jewellery alloys, with a nominal content of each precious
    metal of 999 ? (parts per thousand) by measuring specific elements. (See Tables
    A.1, A.2, and A.3.) ISO 15093:2015 specifies a method intended to be used as the
    recommended method for the determination of fineness in 999 ? alloys covered by
    ISO 9202.
