abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1722:2010-03 specifies the application module for Part template.
    The following are within the scope of ISO/TS 10303-1722:2010-03: the identification
    and classification of templates and their versions and definitions; the identification
    of areas on templates that are defined to be suitable for connection to external
    items when the template is applied in a design; the association between a simulation
    model and a template definition where the template definition provides a contextual
    basis for the definition of the parameters and ports of the simulation model;'
