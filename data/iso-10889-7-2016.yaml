abstract:
- language: en
  script: Latn
  content: ISO 10889-7:2016 specifies dimensions, designations, and complementary
    technical delivery conditions for tool holders with taper seat of type F and with
    a cylindrical shank mounting system in accordance with ISO 10889‑1. ISO 10889
    is applicable to tool holders with cylindrical shank for machine tools with non-rotating
    tools, preferably for turning machines. For non-standardized tool holders with
    taper seat such as the tool holders shown in Figure 1, it is advisable to apply
    the corresponding specifications of this part of ISO 10889.
