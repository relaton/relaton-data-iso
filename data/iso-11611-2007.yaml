abstract:
- language: en
  script: Latn
  content: ISO 11611:2007 specifies minimum basic safety requirements and test methods
    for protective clothing including hoods, aprons, sleeves and gaiters that are
    designed to protect the wearer's body including head (hoods) and feet (gaiters)
    and that are to be worn during welding and allied processes with comparable risks.
    For the protection of the wearer's head and feet, ISO 11611:2007 is only applicable
    to hoods and gaiters. ISO 11611:2007 does not cover requirements for hand protection.
    This type of protective clothing is intended to protect the wearer against spatter
    (small splashes of molten metal), short contact time with flame, radiant heat
    from the arc, and minimizes the possibility of electrical shock by short-term,
    accidental contact with live electrical conductors at voltages up to approximately
    100 V d.c. in normal conditions of welding. Sweat, soiling or other contaminants
    can affect the level of protection provided against short-term accidental contact
    with live electric conductors at these voltages. ISO 11611:2007 specifies two
    classes with specific performance requirements, i.e. Class 1 being the lower level
    and Class 2 the higher level. Class 1 is protection against less hazardous welding
    techniques and situations, causing lower levels of spatter and radiant heat. Class
    2 is protection against more hazardous welding techniques and situations, causing
    higher levels of spatter and radiant heat. For adequate overall protection against
    the risks to which welders are likely to be exposed, personal protective equipment
    (PPE) covered by other standards should additionally be worn to protect the head,
    face, hands and feet.
