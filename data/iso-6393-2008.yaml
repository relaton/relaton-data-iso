abstract:
- language: en
  script: Latn
  content: ISO 6393:2008 specifies a method for determining the noise emitted to the
    environment by earth‑moving machinery, measured in terms of the A-weighted sound
    power level while the machine is stationary with the engine operating at the rated
    speed under no-load conditions. It is applicable to earth-moving machinery as
    specified in Annex A and as defined in ISO 6165.
