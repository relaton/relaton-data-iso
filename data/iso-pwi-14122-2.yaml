abstract:
- language: en
  script: Latn
  content: ISO 14122-2:2016 gives requirements for non-powered working platforms and
    walkways which are a part of a stationary machine, and to the non-powered adjustable
    parts (e.g. foldable, sliding) and movable parts of those fixed means of access.
    NOTE 1 "Fixed" means of access are those mounted in such a manner (for example,
    by screws, nuts, welding) that they can only be removed by the use of tools. ISO
    14122-2:2016 specifies minimum requirements that also apply when the same means
    of access is required as the part of the building or civil construction (e.g.
    working platforms, walkways) where the machine is installed, on condition that
    the main function of that part of the construction is to provide a means of access
    to the machine. NOTE 2 Where no local regulation or standards exist, this part
    of ISO 14122 can be used for means of access which are outside the scope of the
    standard. It is intended that this part of ISO 14122 be used with ISO 14122‑1
    to give the requirements for walking platforms and walkways. The ISO 14122 series
    as a whole is applicable to both stationary and mobile machinery where fixed means
    of access are necessary. It is not applicable to powered means of access such
    as lifts, escalators, or other devices specially designed to lift persons between
    two levels. ISO 14122-2:2016 is not applicable to machinery manufactured before
    the date of its publication.
