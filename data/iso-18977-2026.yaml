abstract:
- language: en
  script: Latn
  content: This document specifies the safety and quality requirements for herbal dispensing services. It is applicable to facilities related to large-scale herbal dispensaries, in-house hospital dispensaries and medium to large commercial dispensaries. It does not apply to dispensing services in medical clinics where herbal preparations are dispensed to patients by or under the supervision of the prescribing practitioners. The specifications regarding tools and equipment used in these services are excluded.
