abstract:
- language: en
  script: Latn
  content: 'This document applies to driver’s cabs of Multiple Unit, railcars, locomotives
    and driving trailers. This document applies to driver''s desks installed on the
    left, on the right, or in a central position in the driver’s cab. This document
    defines: — guidelines for the use of anthropometric data; — visibility conditions
    from the driver''s cab, including forward and lateral visibility and the reference
    positions of line-side signals to be considered; — design principles and assessment
    methods of visibility. NOTE Drivers outside of the standard anthropometric data
    defined in this document could have reduced driving comfort depending on the conditions,
    e.g. drivers taller or smaller than the standard range at extreme seat positions.
    The potential restriction of visibility is addressed by the operator management
    system. This document does not apply to rail mounted machines, shunting locomotives,
    tramways, metros and light rail vehicles.'
