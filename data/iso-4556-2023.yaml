abstract:
- language: en
  script: Latn
  content: This document specifies the manufacturing characteristics, the dimensions,
    the tolerances, the methods for quality control and delivery conditions, the measurement
    and the marking of hardwood and softwood raw parquet elements. NOTE       The
    classification of raw parquet elements according to specific characteristics and
    wood defects are specified, for the different species of wood, in the relevant
    International Standards such as ISO 4561. This document applies to raw parquet
    elements intended for the manufacture of strips for different types of parquet
    flooring.
