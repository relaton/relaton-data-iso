abstract:
- language: en
  script: Latn
  content: ISO 19338:2007 provides performance and assessment requirements for design
    standards for structural concrete. It can be used for international harmonization
    of design and construction requirements. ISO 19338:2007 includes requirements
    that define the required structural concrete performance, criteria that give means
    for expressing the requirements, and assessment clauses, which give acceptable
    methods of verifying the specific criteria.
