abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the melt volume-flow rate
    (MVR) of some Ultra-high-molecular-weight polyethylene (PE-UHMW) and High-molecular-weight
    polyethylene (PE-HMW) pipes, fittings and assemblies using a die with a bore diameter
    of 3,628 mm. This document is applicable to the measurement of the melt volume
    flow rate of PE-UHMW and PE-HMW pipes, fittings and assemblies under the conditions
    of 230℃/21.6kg where the melt volume flow rate is greater than or equal to 0.1
    cm3/10 min. This document is also applicable for the determination of the melt
    volume flow rate of other thermoplastics, such as polyethylene (PE) materials,
    polypropylene (PP) etc. pipes, fittings and assemblies.
