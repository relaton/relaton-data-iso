abstract:
- language: en
  script: Latn
  content: This document specifies procedures suitable for the analysis of data which,
    when converted into logarithms of the values, have either a normal or a skewed
    distribution. It is intended for use with test methods and referring standards
    for glass-reinforced thermosetting plastics (GRP) pipes or fittings for the analysis
    of properties as a function of time. However, it can also be used for the analysis
    of other data. Two methods are specified, which are used depending on the nature
    of the data. Extrapolation using these techniques typically extends a trend from
    data gathered over a period of approximately 10 000 h to a prediction of the property
    at 50 years, which is the typical maximum extrapolation time. This document only
    addresses the analysis of data. The test procedures for collecting the data, the
    number of samples required and the time period over which data are collected are
    covered by the referring standards and/or test methods. Clause 6 discusses how
    the data analysis methods are applied to product testing and design.
