- language: en
  script: Latn
  content: ISO 217:2008 specifies a primary range and a supplementary range of untrimmed
    sizes of paper in sheets which are to be trimmed to the ISO-A series of sizes
    as given in ISO 216, and establishes a system of designation of untrimmed sizes.
    ISO 217:2008 also specifies the method for the indication of machine direction
    of untrimmed sizes.
