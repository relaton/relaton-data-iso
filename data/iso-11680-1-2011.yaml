abstract:
- language: en
  script: Latn
  content: ISO 11680-1:2011 gives safety requirements and measures for their verification
    for the design and construction of portable, hand-held, pole-mounted powered pruners
    having an integral combustion engine as their power unit and using a drive shaft
    to transmit power to a cutting attachment consisting of a saw chain or a reciprocating
    or circular saw blade with a 205 mm maximum outside diameter. Methods for the
    elimination or reduction of hazards arising from the use of these machines and
    the type of information on safe working practices to be provided by the manufacturer
    are specified. ISO 11680-1:2011 deals with all significant hazards, hazardous
    situations or hazardous events with the exception of electric shock from contact
    with overhead electric lines (apart from warnings and advice for inclusion in
    the instruction handbook), relevant to these machines when they are used as intended
    and under conditions of misuse which are reasonably foreseeable by the manufacturer.
