abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1375:2014-02 specifies the application module for Cfd conditions.
    The following are within the scope of ISO/TS 10303-1375:2014-02: data from solutions
    of equation sets commonly used in fluid dynamics analysis: Navier-Stokes equations,
    Euler equations, linear and nonlinear potential flow equations, small disturbance
    equations, boundary layer equations, and stream function equations.'
