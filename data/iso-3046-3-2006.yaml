abstract:
- language: en
  script: Latn
  content: ISO 3046-3:2006 specifies the common measurement techniques of the main
    performance parameters of reciprocating internal combustion engines, in addition
    to the basic requirements defined in ISO 15550. This is to ensure that the required
    accuracy of measurement is achieved for comparison of the measured values with
    those values specified by the engine manufacturer. Where necessary, individual
    requirements may be given for particular engine applications. ISO 3046-3:2006
    applies to reciprocating internal combustion engines for land, rail-traction and
    marine use. It may be applied to engines used to propel road construction machines,
    industrial trucks and for other applications where no suitable International Standards
    for these engines exist.
