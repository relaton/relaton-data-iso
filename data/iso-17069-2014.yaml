- language: en
  script: Latn
  content: ISO 17069:2014 specifies considerations to be taken, as well as support
    and assistive products that can be used when organizing a physical meeting in
    which older persons and persons with disabilities can actively participate. Teleconferences
    and web conferences are important methods that can be used to include older persons
    and persons with disabilities in meetings.
