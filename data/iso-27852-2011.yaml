abstract:
- language: en
  script: Latn
  content: ISO 27852:2011 describes a process for the estimation of orbit lifetime
    for satellites, launch vehicles, upper stages and associated debris in LEO-crossing
    orbits. ISO 27852:2011 also clarifies the modelling approaches and resources for
    solar and geomagnetic activity modelling; the resources for atmosphere model selection;
    and an approach for satellite ballistic coefficient estimation.
