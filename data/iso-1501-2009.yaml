abstract:
- language: en
  script: Latn
  content: ISO 1501:2009 specifies the profiles, diameter-pitch combinations, basic
    dimensions, tolerances, limits of size and designation for ISO miniature screw
    threads with nominal diameters from 0,3 mm to 1,4 mm. These threads are applicable
    to timepieces, optical instruments, electrical meters, measuring instruments,
    etc. The profiles and tolerance system for ISO miniature screw threads (S) differ
    from the profile and tolerance system for ISO general purpose metric screw threads
    (M).
