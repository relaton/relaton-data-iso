abstract:
- language: en
  script: Latn
  content: This standard specifies the sample preparation, test device, test method,
    and electrochemical measurement method of metallic materials in the simulated
    water level fluctuation zone. This standard is applicable to evaluating the corrosion
    problems of metallic materials, alloys, non-metallic materials, etc. in the water
    level fluctuation zone. This standard is also applicable to evaluating the corrosion
    resistance of metal materials in the tidal range zone, but it is not applicable
    to the splash zone.
