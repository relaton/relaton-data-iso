abstract:
- language: en
  script: Latn
  content: ISO 8835-5:2004 specifies particular requirements for the essential performance
    of anaesthetic ventilators (as defined in 3.1). ISO 8835-5:2004 is applicable
    to anaesthetic ventilators which are always a component of an anaesthetic system
    and are intended to be continuously attended by an operator. ISO 8835-5:2004 is
    not applicable to anaesthetic ventilators intended for use with flammable anaesthetics,
    as determined by Annex BB. The requirements of ISO 8835-5:2004 which replace or
    modify the requirements of IEC 60601-1:1988 and its Amendments 1 (1991) and 2
    (1995) are intended to take precedence over the corresponding general requirements.
    This Scope is additional to the Scope given in IEC 60601-1:1988, Clause 1, except
    as noted above.
