abstract:
- language: en
  script: Latn
  content: 'ISO 25649-6:2017 is applicable for Class D floating leisure articles for
    use on and in water according to ISO 25649‑1 regardless whether the buoyancy is
    achieved by inflation or inherent buoyant material. ISO 25649-6:2017 is to be
    applied with ISO 25649‑1 and ISO 25649‑2. NOTE 1 Typical products forming Class
    D (see Annex A): - inflatable climbing structures on the water; - bouncing platforms;
    - inflatable slides; - water trampolines; - teeter totters; - obstacle courses.
    NOTE 2 Typical places for application: - pools; - lakes, ponds; - open sea; -
    sea shore (no offshore winds, no currents).'
