abstract:
- language: en
  script: Latn
  content: 'ISO 21508:2018 provides guidance for practices of earned value management
    in project and programme management. It is applicable to any type of organization
    including public or private and any size or sector, as well as any type of project
    or programme in terms of complexity, size or duration. ISO 21508:2018 provides
    the following: a) terms and definitions; b) descriptions of the purpose and benefits
    of earned value management; c) the integration and relationship with project or
    programme management; d) an overview of the processes and process descriptions;
    e) basic requirements for an earned value management system; f) use of an earned
    value management system. ISO 21508:2018 does not provide guidance on the use of
    specific processes, methods or tools in the practice of earned value management.
    Annexes A, B and C describe cost, schedule and performance analysis, commonly
    used formulae with associated interpretations, and the integration of earned value
    with other project or programme management processes.'
