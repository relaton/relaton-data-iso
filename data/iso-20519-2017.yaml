abstract:
- language: en
  script: Latn
  content: 'ISO 20519:2017 sets requirements for LNG bunkering transfer systems and
    equipment used to bunker LNG fuelled vessels, which are not covered by the IGC
    Code. This document includes the following five elements: a) hardware: liquid
    and vapour transfer systems; b) operational procedures; c) requirement for the
    LNG provider to provide an LNG bunker delivery note; d) training and qualifications
    of personnel involved; e) requirements for LNG facilities to meet applicable ISO
    standards and local codes.'
