abstract:
- language: en
  script: Latn
  content: ISO 9533:2010 specifies a static test method for determining the sound
    output performance and alarm activation requirements of audible travel alarms
    and forward horns mounted on earth-moving machinery, as defined in ISO 6165, for
    operation on work sites and travelling on public roads. It offers objective test
    methodologies and performance criteria. It is applicable only to those alarms
    and horns that are installed on the earth-moving machinery. It does not specify
    the installation of one or more audible travel alarms or forward horns on particular
    machines. It addresses neither the laboratory testing of warning alarm functionality
    nor durability.
