abstract:
- language: en
  script: Latn
  content: ISO 8784-1:2005 specifies a method for determining the total number of
    colony-forming units of bacteria, yeast and moulds in dry market pulp, paper and
    paperboard after disintegration. The enumeration relates to specific media. ISO
    8784-1:2005 is applicable to most kinds of paper and paperboard, especially those
    grades intended to come into contact with foodstuffs.
