- language: en
  script: Latn
  content: ISO 6647-1:2007 specifies a reference method for the determination of the
    amylose content of milled rice, non-parboiled. The method is applicable to rice
    with an amylose mass fraction higher than 5 %. ISO 6647-1:2007 can also be used
    for husked rice, maize, millet and other cereals if the extension of this scope
    has been validated by the user.
