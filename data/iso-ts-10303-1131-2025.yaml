abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1131 specifies the application module for Construction geometry.
    The following are within the scope of ISO/TS 10303-1131: geometric primitives
    of one and two dimensions; geometry used in the construction of two-dimensional
    and three-dimensional shape representations; association of a construction geometry
    to a geometric model or a construction from which it is derived.'
