abstract:
- language: en
  script: Latn
  content: This document specifies the general technical requirements for digitalization
    of distribution in urban natural gas systems. It covers the range from end of
    transmission pipelines to urban gas end-users, clarifies the requirements of data,
    terminals, and platforms. This document gives guidance on planning, implementation,
    and operation of the intelligent gas distribution systems in urban areas. It provides
    technical guidance for the digitalization of the management of whole life cycle
    of urban natural gas facilities and equipment and operation and maintenance of
    urban natural gas. This document is not applicable to gas supply facilities and
    application facilities built by industrial enterprises.
