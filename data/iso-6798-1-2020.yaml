abstract:
- language: en
  script: Latn
  content: This document specifies the engineering method, which is the measurement
    method of the sound power level for reciprocating internal combustion engines.
    This document applies to all reciprocating internal combustion engines falling
    within the field of application of ISO 3046-1 and other internal combustion engines
    where no suitable International Standard exists. NOTE In this document, reciprocating
    internal combustion engines are referred to as engines unless otherwise explained.
