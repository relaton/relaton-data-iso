abstract:
- language: en
  script: Latn
  content: ISO/TS 19337:2016 describes characteristics of working suspensions of nano-objects
    to be considered when conducting in vitro assays to evaluate inherent nano-object
    toxicity. In addition, this Technical Specification identifies applicable measurement
    methods for these characteristics. This Technical Specification is applicable
    to nano-objects, and their aggregates and agglomerates greater than 100 nm. NOTE
    This Technical Specification intends to help clarify whether observed toxic effects
    come from tested nano-objects themselves or from other uncontrolled sources.
