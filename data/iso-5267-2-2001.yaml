abstract:
- language: en
  script: Latn
  content: This part of ISO 5267 specifies a method for determination of the drainability
    of a pulp suspension in water in terms of the "Canadian Standard" freeness in
    millilitres. In principle, this method is applicable to all kinds of pulp in aqueous
    suspension. NOTE Treatments which produce a large proportion of fines may induce
    an anomalous rise in freeness (false freeness), as a rule at values below 100
    ml.
