abstract:
- language: en
  script: Latn
  content: This document specifies requirements and tests for single-use, copper-bearing
    contraceptive intrauterine devices (IUDs) and their insertion instruments. It
    is not applicable to IUDs consisting only of a plastics body or whose primary
    purpose is to release progestogens or other medicinal products. NOTE       Some
    aspects of this document can be applicable to medicated intrauterine devices and
    IUDs not containing copper.
