abstract:
- language: en
  script: Latn
  content: ISO 15194:2009 specifies requirements for certified reference materials
    and the content of their supporting documentation, in order for them to be considered
    of higher metrological order in accordance with ISO 17511. It is applicable to
    certified reference materials classifiable as primary measurement standards, secondary
    measurement standards and international conventional calibrators that function
    either as calibrators or trueness control materials. ISO 15194:2009 also provides
    requirements on how to collect data for value determination and how to present
    the assigned value and its measurement uncertainty. ISO 15194:2009 applies to
    certified reference materials with assigned values of differential or rational
    quantities. Annex A provides information on nominal properties and ordinal quantities.
    ISO 15194:2009 does not apply to reference materials that are parts of an in vitro
    diagnostic measuring system, although it is possible that many elements are helpful.
