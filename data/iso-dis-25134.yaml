abstract:
- language: en
  script: Latn
  content: 'This Standard applies to protein products intended for human consumption
    that are not derived from animal sources. It covers proteins obtained from plants
    (including vegetables and algae), fungi and micro-organisms such as bacteria,
    yeasts and moulds. It covers three types of protein product : - protein flour,
    - protein concentrate, - protein isolate. This document does not apply to : -
    wheat gluten [1] and soya proteins [2] that are defined by CODEX, - precision
    fermentation proteins (e.g specific proteins intentionally obtained from recombinant
    DNA technology) and proteins of animal origin, irrespective of the production
    method employed. Example : casein produced from non-animal sources, such as plants,
    falls outside the scope of this standard, - raw materials (source materials) used
    to produce these proteins, as well as the compound foods that use these protein
    products as ingredients, - labelling and/or claims for foods sold to consumers.'
