abstract:
- language: en
  script: Latn
  content: ISO 18069:2015 specifies the measurements of the corrosion rate of uniform
    corrosion for stainless steels and nickel based alloys in the intended liquids
    and the ability for the material to passivate after activation. This method is
    intended to be used for estimation of the uniform corrosion rate in liquids, under
    atmospheric conditions, for the chemical industry under specific environmental
    conditions and not as a qualification test. It can also be used to determine iso-corrosion
    diagrams and at which temperature the corrosion rate exceeds 0,1 mm/a. ISO 18069:2015
    is not intended for excessive corrosion rates above 1 mm/a since an even higher
    corrosion rate indicates that the stainless steel is not suitable in the application.
    Nor is it intended to be used for solutions containing halides, especially chlorides,
    since these might cause localized corrosion.
