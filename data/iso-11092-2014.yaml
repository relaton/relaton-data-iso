abstract:
- language: en
  script: Latn
  content: ISO 11092:2014 specifies methods for the measurement of the thermal resistance
    and water-vapour resistance, under steady-state conditions, of e.g. fabrics, films,
    coatings, foams and leather, including multilayer assemblies, for use in clothing,
    quilts, sleeping bags, upholstery and similar textile or textile-like products.
    The application of this measurement technique is restricted to a maximum thermal
    resistance and water-vapour resistance which depend on the dimensions and construction
    of the apparatus used (e.g. 2 m2·K/W and 700 m2·Pa/W respectively, for the minimum
    specifications of the equipment referred to in ISO 11092:2014).
