abstract:
- language: en
  script: Latn
  content: ISO 4496:2017 specifies methods for determining, in iron, copper, tin and
    bronze powders, the approximate content of non-metallic materials which are insoluble
    in the ordinary mineral acids. The insoluble matter referred to is generally considered
    to be acid-insoluble silica and silicates, carbides, alumina, clays or other refractory
    oxides which are either present in the raw material from which the powders are
    manufactured or introduced during the manufacturing process.
