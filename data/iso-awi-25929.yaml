abstract:
- language: en
  script: Latn
  content: The Minimum Safe Lookout Area (MSLA) defines the spatial area around a
    vessel. It quantifies the requirements on which condition unattended lookout is
    possible. It enables quantitative verification on situational awareness, decision
    making on collision avoidance, controlling system, and bandwidth and displaying
    requirements if a remote operating conter (ROC) is adopted. In the context of
    maritime autonomous surface ships (MASS), the capability of detecting and awaring
    all relevant objects is to be used by an antonomous navigation system (ANS) or
    crew, onboard a MASS or at ROC, for e.g. decision making and collision avoidance,
    to ensure navigation safety. This document specifies the definition and determination
    of the MSLA, considering variations due to ship characteristics and environmental
    conditions, and provides a consistent and verifiable basis for its application
    across different operational scenarios.
