abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory test method for determining the degree
    and rate of the aerobic biodegradation level of plastic materials. Biodegradation
    of plastic materials is determined by measuring the oxygen demand in a closed
    respirometer when exposed to seawater sampled from coastal areas under laboratory
    conditions. The conditions described in this document might not always correspond
    to the optimum conditions for the maximum degree of biodegradation, however this
    test method is designed to give an indication of the potential biodegradability
    of plastic materials. NOTE This document addresses plastic materials but can also
    be used for other materials.
