abstract:
- language: en
  script: Latn
  content: This document specifies the quality and safety requirements and test methods
    of Crataegus pinnatifida Fruit, derived from the dried fruit of Crataegus pinnatifida
    Bge. or Crataegus pinnatifida Bge. var. major N.E.Br. (Fam Rosaceae). This document
    is applicable to Crataegus pinnatifida fruit that are sold and used as natural
    medicines in international trade, including Chinese materia medica (whole medicinal
    material) and decoction pieces derived from this plant.
