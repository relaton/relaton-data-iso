abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of the following
    elements in aqua regia, nitric acid or mixture of hydrochloric (HCl), nitric (HNO3)
    and tetrafluoroboric (HBF4)/hydrofluoric (HF) acid digests of soil, treated biowaste,
    waste, sludge and sediment: aluminium (Al), antimony (Sb), arsenic (As), barium
    (Ba), beryllium (Be), bismuth (Bi), boron (B), cadmium (Cd), calcium (Ca), cerium
    (Ce), caesium (Cs), chromium (Cr), cobalt (Co), copper (Cu), dysprosium (Dy),
    erbium (Er), europium (Eu), gadolinium (Gd), gallium (Ga), germanium (Ge), gold
    (Au), hafnium (Hf), holmium (Ho), indium (In), iridium (Ir), iron (Fe), lanthanum
    (La), lead (Pb), lithium (Li), lutetium (Lu), magnesium (Mg), manganese (Mn),
    mercury (Hg), molybdenum (Mo), neodymium (Nd), nickel (Ni), palladium (Pd), phosphorus
    (P), platinum (Pt), potassium (K), praseodymium (Pr), rhenium (Re), rhodium (Rh),
    rubidium (Rb), ruthenium (Ru), samarium (Sm), scandium (Sc), selenium (Se), silicon
    (Si), silver (Ag), sodium (Na), strontium (Sr), sulfur (S), tellurium (Te), terbium
    (Tb), thallium (Tl), thorium (Th), thulium (Tm), tin (Sn), titanium (Ti), tungsten
    (W), uranium (U), vanadium (V), ytterbium (Yb), yttrium (Y), zinc (Zn), and zirconium
    (Zr). NOTE 1        Details on validation are given in Annex A. This method is
    also applicable for the determination of major, minor and trace elements in aqua
    regia and nitric acid digests and in eluates of construction products (EN 17200[7]).
    NOTE 2        Construction products include e.g. mineral-based products, bituminous
    products, metals, wood-based products, plastics and rubbers, sealants and adhesives,
    paints and coatings.'
