abstract:
- language: en
  script: Latn
  content: ISO 16232-7:2007 defines methods for determining the size and number of
    contaminant particles, which have been extracted from components and deposited
    on the surface of a membrane filter, as determined by using either a light optical
    microscope (LM) or a scanning electron microscope (SEM). The result of this measurement
    is the particle size distribution on the membrane filter. As the function of parts
    and components can be impaired by the presence of a single or a few critical particles,
    a complete analysis of the total membrane filter surface is essential. These analyses
    can be performed either manually or fully automatically using Image Analysis (IA)
    techniques if the appropriate equipment is available.
