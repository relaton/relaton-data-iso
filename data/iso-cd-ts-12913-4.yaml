abstract:
- language: en
  script: Latn
  content: This document provides guidance on how to assess the soundscape data, collected
    and analysed by means of the existing documents ISO/TS 12913-2 and ISO/TS 12913-3,
    and how to determine the need for interventions to preserve and/or improve a soundscape
    and how to implement a soundscape design as an intervention. The document aims
    to define a soundscape design process with relevant conceptual tools to involve
    different stakeholders.
