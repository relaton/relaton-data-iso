abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies four methods for the determination
    of the specific surface area of types and grades of carbon black for use in the
    rubber industry: — method A using the Ni‑Count‑1 apparatus (Clause 3); — method
    B using the Areameter apparatus (Clause 4); — method C using gas chromatography
    (Clause 5); — method D using the Monosorb surface-area analyser (Clause 6). Somewhat
    different results might be obtained from the four methods. The degassing procedure
    used differs from method to method, and it is important to investigate the possibility
    of correcting the results by using standard reference blacks. The results might
    also differ from those obtained using the multipoint method specified in ISO 18852,
    which is the preferred method.'
