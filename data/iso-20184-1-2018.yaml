abstract:
- language: en
  script: Latn
  content: This document gives guidelines on the handling, documentation, storage
    and processing of frozen tissue specimens intended for RNA examination during
    the pre-examination phase before a molecular assay is performed. This document
    is applicable to any molecular in vitro diagnostic examination performed by medical
    laboratories and molecular pathology laboratories that evaluate RNA extracted
    from frozen tissue. It is also intended to be used by laboratory customers, in
    vitro diagnostics developers and manufacturers, biobanks, institutions and commercial
    organisations performing biomedical research, and regulatory authorities. Tissues
    that have undergone chemical stabilization pre-treatment before freezing are not
    covered in this document. NOTE International, national or regional regulations
    or requirements can also apply to specific topics covered in this document.
