abstract:
- language: en
  script: Latn
  content: ISO 16458:2004 is applicable to unmanned spacecraft and their supporting
    hardware including science instrument and payloads. It establishes the requirements
    for transportation by rail, road, air, and water and as a part of a launch vehicle
    and establishes the requirements for special containers and loading/unloading
    operations meant to safeguard unmanned spacecraft and their supporting hardware
    during transportation. ISO 16458:2004 is intended to be applied in international
    transportation. It may also be used in national transportation.
