abstract:
- language: en
  script: Latn
  content: ISO 14952-4:2003 provides requirements related to rough-cleaning processes
    used to prepare parts and components for precision cleaning. It identifies precleaning
    processes that can be used for ground support equipment, launch vehicles and spacecraft.
    Rough cleaning removes contaminants such as weld scale, heat-treat scale, corrosion,
    oxide films, oils, grease, shop soil, fuel and carbon deposits. Rough cleaning
    is considered a normal shop process and usually does not require special environmental
    controls, packaging, handling or storage beyond accepted good practice. ISO 14952-4:2003
    is applicable equally to ground support equipment, launch vehicles and spacecraft.
