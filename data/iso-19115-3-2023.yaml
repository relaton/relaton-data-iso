abstract:
- language: en
  script: Latn
  content: 'This document defines an integrated XML implementation of ISO 19115-1
    and ISO 19115-2 by defining the following artefacts: —     a set of XML schema
    required to validate metadata instance documents conforming to conceptual model
    elements defined in ISO 19115-1 and ISO 19115-2; and —     a set of ISO/IEC 19757-3
    (Schematron) rules that implement validation constraints in the ISO 19115-1 and
    ISO 19115-2 UML models that are not validated by the XML schema. This document
    describes the procedure used to generate XML schemas from ISO geographic information
    conceptual models related to metadata. The XML schemas are generated directly
    from the conceptual UML model (8.5).'
