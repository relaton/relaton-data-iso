abstract:
- language: en
  script: Latn
  content: ISO 17294-1:2004 specifies the principles of inductively coupled plasma
    mass spectrometry (ICP-MS) and provides general directions for the use of this
    technique for determining elements in water. Generally, the measurement is carried
    out in water, but gases, vapours or fine particulate matter may be introduced
    too. ISO 17294 applies to the use of ICP-MS for water analysis. The ultimate determinations
    of the elements are described in the separate parts of ISO 17294, one for each
    series of elements and matrix. The other parts of ISO 17294 refer the reader to
    the guidelines presented in ISO 17294-1:2004 for the basic principles of the method
    and for configuration of the instrument.
