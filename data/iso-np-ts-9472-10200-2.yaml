abstract:
- language: en
  script: Latn
  content: 'Lifestyle plays a key role for maintaining or improving an individual’s health and in preventing diseases. Since lifestyle is ultimately in the hands of individuals, the development and implementation of mobile applications for health promotion are rapidly progressing around the world. A coordinated deployment of mobile applications will help to improve various aspects of lifestyle monitoring and recording of self-health activities anytime and anywhere in daily life. Self-health activities involve taking an active role in maintaining or improving one''s own health and are typically conducted and observed by the individual or, where appropriate, by caregivers. Self-health activities may last for a few weeks, several months, or years, depending on the objective. A standard is needed to capture self-health activities and to manage related mobile data over time for a given duration. This document establishes meta-level specifications for purpose-oriented self-health activities (PSA) observed directly by an individual or by their caregivers. The goal of meta-level specifications is to represent structured PSA in the context of health and wellbeing concepts based on WHO family of international classifications (WHO-FIC). This document is expected to contribute to health promotion programs, health policies, epidemiological studies, concept building and concept interoperability in the field of personalized digital health. PSA is defined using ISO 23903:2021 Health informatics - Interoperability and integration reference architecture - Model and framework. Some envisioned applications of structured PSA include but are not limited to the following: — Community health promotion programs e.g., frailty prevention program for the elderly, participatory programs by local governments aimed at improving lifestyle of residents — Health monitoring and policy making by public health authorities e.g., monitoring of community dental health and guidance of dental hygiene practices by health centres — Health maintenance or improvement programs by health insurers e.g., a health check program provided by life insurance companies to the insured — Lifestyle improvement to prevent lifestyle-related diseases e.g., life-style habit improvements to prevent life-style related diseases under the guidance of a physician for pre-symptomatic state — Studies on health behaviour and health intervention e.g., studies on the use of mobile apps to improve nutrition outcomes This specification is designed to organize PSA based on WHO International Classification of Functioning, Disability and Health (WHO-ICF), WHO International Classification of Health Interventions (WHO-ICHI) and related Determinants of Health. PSA is conceptually aligned with the broader framework of personalized health navigation (PHN), currently under development. This Technical Specification specifies a set of meta-level specifications for expressing the following: — the concept of “Purpose-oriented Self-health Activities” (PSA) with lifestyle parameters such as purpose/checks. — a general process for PSA identification and management over a given period, including the relationships among its elements. — an accompanying data structure for PSA. NOTE. Considerations for implementation of PSA-based applications are given as an annex (Informative).'
