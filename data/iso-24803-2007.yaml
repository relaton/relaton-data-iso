abstract:
- language: en
  script: Latn
  content: 'ISO 24803:2007 specifies requirements for service providers in the field
    of recreational scuba diving. It specifies three areas of service provision: training
    and education,organized and guided diving for certified divers,rental of diving
    equipment. Service providers may offer one or more of these services. ISO 24803:2007
    specifies the nature and quality of the services to the client and applies only
    to contractual provision of those services.'
