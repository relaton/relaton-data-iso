abstract:
- language: en
  script: Latn
  content: This document specifies dimensions and requirements for both open and closed
    suction catheters made of flexible materials and intended for use in suctioning
    of the respiratory tract. Suction catheters intended for use with flammable anaesthetic
    gases or agents, lasers or electrosurgical equipment are not covered by this document.
    NOTE For guidance on airway management during laser surgery of the upper airway,
    see ISO/TR 11991[4].
