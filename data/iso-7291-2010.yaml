abstract:
- language: en
  script: Latn
  content: 'ISO 7291:2010 specifies requirements and test methods for pressure regulators
    in manifold systems used in welding, cutting, and allied processes for: a) compressed
    gases up to 30 MPa (300 bar); b) dissolved acetylene; c) liquefied petroleum gases
    (LPG); d) methylacetylene‑propadiene‑mixtures (MPS); e) carbon dioxide (CO2).
    It is not applicable to pressure regulators fitted directly to the gas cylinders,
    as defined in ISO 2503.'
