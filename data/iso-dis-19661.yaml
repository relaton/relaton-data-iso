abstract:
- language: en
  script: Latn
  content: |-
    This document specifies the quality and safety requirements of Anemarrhena asphodeloides rhizome [the dried rhizome of Anemarrhena asphodeloides Bunge].
    This document applies to Anemarrhena asphodeloides rhizome that is sold and used as natural medicines in international trade, including Chinese materia medica (whole medicinal materials) and decoction pieces derived from the plant.
