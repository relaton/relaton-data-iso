abstract:
- language: en
  script: Latn
  content: ISO 20795-2:2010 is applicable to orthodontic base polymers and copolymers
    used in the construction of both active and passive orthodontic appliances and
    specifies their requirements. It also specifies test methods to be used in determining
    compliance with these requirements. ISO 20795-2:2010 further specifies requirements
    with respect to packaging and marking the products and to the instructions to
    be supplied for use of these materials.
