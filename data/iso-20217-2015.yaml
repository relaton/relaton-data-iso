abstract:
- language: en
  script: Latn
  content: 'ISO 20217:2015 defines the Spacecraft Onboard Interface Services (SOIS)
    File and Packet Store Services (FPSS). The definition encompasses specification
    of the service interface exposed to onboard software (user applications and libraries)
    as well as the conceptual mapping of the FPSS primitives to the protocols implementing
    such services. The SOIS File and Packet Store Services are for use by onboard
    software to: ? Access, and manage files residing in a file store. The files residing
    in the file store could contain any type of data, including for example telemetry,
    commands and command sequences, software updates, imagery, and other science observations.
    ? Access and manage packets residing in a packet store. It should be noted that
    the packet store may or may not be aware of, and its actions may or may not be
    informed by, the contents of a packet. To achieve this, the FPSS comprise the
    following services: ? File Access Service (FAS); ? File Management Service (FMS);
    ? Packet Store Access Service (PSAS); ? Packet Store Management Service (PSMS).
    It should be noted that the SOIS File and Packet Store Services do NOT define
    the file and packet stores themselves, but only their minimum provided service.
    The initialization and configuration of the file and packet stores is out of scope
    for this document.'
