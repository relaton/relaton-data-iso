abstract:
- language: en
  script: Latn
  content: ISO 6396:2008 specifies a method for determining the emission sound pressure
    level of earth-moving machinery at the operator's position, measured in terms
    of the time-averaged A-weighted emission sound pressure level while the machine
    is operating under dynamic test conditions. It is applicable to earth-moving machinery
    as defined in ISO 6165 and as specified in ISO 6395:2008, Annex A.
