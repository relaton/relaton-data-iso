abstract:
- language: en
  script: Latn
  content: ISO 4992-1:2006 specifies the requirements for the ultrasonic examination
    of steel castings (with ferritic structure) for general purposes, and the methods
    for determining internal discontinuities by the pulse-echo technique. ISO 4992-1:2006
    applies to the ultrasonic examination of steel castings which have usually received
    a grain-refining heat treatment and which have wall thicknesses up to and including
    600 mm. For greater wall thicknesses, special agreements apply with respect to
    the test procedure and recording levels. ISO 4992-1:2006 does not apply to austenitic
    steels and joint welds.
