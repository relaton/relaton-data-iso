abstract:
- language: en
  script: Latn
  content: This document provides a general framework, principles and requirements
    related to the determination of system boundaries and the acquisition of inventory
    data necessary for conducting a life cycle assessment (LCA) of concrete, precast
    concrete and concrete structures. This document is intended to be used in conjunction
    with, and following the principles set out in ISO 14040, ISO 14044, ISO 21930,
    ISO 21931-1 and ISO 21931-2. Where deviation occurs, this document takes precedence.
