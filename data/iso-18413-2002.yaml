abstract:
- language: en
  script: Latn
  content: ISO 18413 specifies the content of an inspection document that includes
    both the cleanliness requirement for the specified part or component and the inspection
    method to be used for evaluating its cleanliness level. The cleanliness requirement
    and inspection method shall be established and agreed upon by the parties involved.
    ISO 18413 is applicable to the wetted surfaces of any fluid power system part
    or component. It does not cover appearance defects and contamination by liquid
    or gaseous materials. This International Standard does not address safety problems
    that may arise from hazardous materials, operations and equipment associated with
    its use. The user of ISO 18413 is responsible for establishing appropriate safety
    and health practices and determining the applicability of regulatory limitations
    prior to use.
