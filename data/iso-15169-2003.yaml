abstract:
- language: en
  script: Latn
  content: ISO 15169:2003 gives guidance on the selection, installation, commissioning,
    calibration and verification of hybrid tank measurement systems (HTMS) for the
    measurement of level, static mass, observed and standard volume, and observed
    and reference density in tanks storing petroleum and petroleum products in fiscal
    or custody transfer application. As it is a matter for the user to decide which
    measurements (i.e. volume, or mass or both) are used for custody transfer purposes,
    this International Standard includes an uncertainty analysis, with examples, to
    enable users to select the correct components of an HTMS to address the intended
    application. ISO 15169:2003 is applicable to stationary, vertical cylindrical
    tanks storing liquid hydrocarbons with a Reid Vapour Pressure (RVP) below 103,42
    kPa. ISO 15169:2003 is not applicable to pressurized tanks or marine applications.
