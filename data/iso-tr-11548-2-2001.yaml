abstract:
- language: en
  script: Latn
  content: This part of ISO/TR 11548 specifies the assignation of 8-dot Braille to
    Latin alphabet based 8-bit code tables. This part of ISO/TR 11548 is intended
    to be used by experts and manufacturers of 8-dot Braille input and output devices,
    interfaces and software for data exchange. This part of ISO/TR 11548 does not
    apply to 6-dot Braille and does not specify any physical dimension of Braille
    characters.
