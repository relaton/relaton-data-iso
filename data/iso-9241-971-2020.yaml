abstract:
- language: en
  script: Latn
  content: This document provides both general and specific ergonomic requirements
    and recommendations for accessible tactile/haptic interactive systems, including
    accessible tactile/haptic interactions. This document provides guidance for increasing
    the accessibility of interactive systems making use of tactile/haptic input/output
    modalities such as gestures, vibration, and force feedback. The guidance provided
    also supports alternative input modalities and the use of different output representations.
    This document provides guidance for tactile/haptic interactions that is applicable
    to a variety of interactive systems, including assistive technologies (AT).
