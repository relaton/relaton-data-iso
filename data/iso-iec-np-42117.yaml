abstract:
- language: en
  script: Latn
  content: This document establishes principles and specifies general requirements that are applicable to all types of AI system- and model-related trustworthiness fact statements and AI trustworthiness fact statement programmes. AI Trustworthiness fact statements result from AI trustworthiness fact statement programmes and include self-declared trustworthiness fact claims, AI trustworthiness fact labels (TFLs), AI quantitative facts declarations (QFDs), AI developer techinical cards (DTCs) and footprint communications. This document is intended to be used in conjunction with other standards in the ISO/IEC 42117 family
