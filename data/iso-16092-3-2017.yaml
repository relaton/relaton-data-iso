abstract:
- language: en
  script: Latn
  content: ISO 16092-3:2017, in addition to ISO 16092‑1, specifies the technical safety
    requirements and measures to be adopted by persons undertaking the design, manufacture
    and supply of hydraulic presses which are intended to work cold metal or material
    partly made up of cold metal. The presses covered by this document range in size
    from small high-speed machines with a single operator producing small workpieces
    to large relatively slow-speed machines with several operators and large complex
    workpieces. ISO 16092-3:2017 deals with all significant hazards relevant for hydraulic
    presses when they are used as intended and under the conditions of misuse which
    are reasonably foreseeable by the manufacturer (see Clause 4). All the phases
    of the lifetime of the machinery as described in ISO 12100:2010, 5.4 have been
    taken into consideration.
