abstract:
- language: en
  script: Latn
  content: This document specifies requirements for single-use burettes to be used
    as subcomponents within sterilised infusion and transfusion sets for single use
    under gravity feed conditions or with pressure infusion apparatus. NOTE 1       
    Annex B provides explanations about the history of the development of the standard
    and summarises the different arguments discussed within ISO/TC 76 during the collaboration
    of this document. NOTE 2        Annex C provides recommendations regarding sustainability.
    NOTE 3        Annex D provides information on attributive and variable testing.
