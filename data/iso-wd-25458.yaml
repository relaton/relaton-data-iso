abstract:
- language: en
  script: Latn
  content: This document provides the types of materials used in reusable, passive
    temperature-controlled packaging systems, qualification process, and how to manage
    maintenance services, including returns, repairs, and inspections. This document
    does not cover the active temperature-controlled packaging but only covers the
    passive packaging system able to control the desired temperature without any power
    sources. Cryogenic transport packaging is outside the scope of this document.
