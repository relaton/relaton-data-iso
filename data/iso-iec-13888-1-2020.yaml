abstract:
- language: en
  script: Latn
  content: 'This document serves as a general model for subsequent parts specifying
    non-repudiation mechanisms using cryptographic techniques. The ISO/IEC 13888 series
    provides non-repudiation mechanisms for the following phases of non-repudiation:
    — evidence generation; — evidence transfer, storage and retrieval; and — evidence
    verification. Dispute arbitration is outside the scope of the ISO/IEC 13888 series.'
