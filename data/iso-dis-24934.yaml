abstract:
- language: en
  script: Latn
  content: This document specifies the quality control metrics and procedures for
    multi-omics profiles and data integration to achieve reproducibility in multi-omics
    studies. Multi-omics encompasses, but is not limited to, genomics, epigenomics,
    transcriptomics, proteomics, and metabolomics. The purposes of multi-omics studies
    may include the classification of samples and the identification of differentially
    expressed omics features. This document is applicable to assessing the quality
    of normalized multi-omics profiles with both qualitative and quantitative data
    values. The quality control metrics described are intended for assessing the aggregated
    normalized data. This document assumes that the quality of normalized profiles
    reflects the overall proficiency of a laboratory or the quality of a multi-omics
    study. This document is not intended for — The experimental processes involved
    in obtaining raw data from samples. — The analytical processes involved in transforming
    raw data or intermediate data into normalized profiles.
