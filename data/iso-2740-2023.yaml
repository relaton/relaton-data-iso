abstract:
- language: en
  script: Latn
  content: 'This document is applicable to all sintered metals and alloys, excluding
    hardmetals. This document specifies: —    the die cavity dimensions used for making
    tensile test pieces by pressing and sintering, and by metal injection moulding
    (MIM) and sintering; —    the dimensions of tensile test pieces machined from
    sintered and powder forged materials.'
