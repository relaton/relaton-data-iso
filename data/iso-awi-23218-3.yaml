abstract:
- language: en
  script: Latn
  content: 'This document addresses the safety issues of NC system and provides guidelines
    for addressing significant hazards related to NC system. It consists of safety
    principles, safety guidelines for NC system and information for use, and so on.
    This document is applicable to NC systems used in machine tools (including metal
    cutting machine tools, metal forming machine tools, woodworking machine tools,
    and so on.) and to components of machine tools (including cabinets and auxiliary
    devices) designed for integration into machine tools. It is also applicable to
    other production equipment using NC systems. This standard is applicable to the
    design, manufacture, use and maintenance of NC systems. This standard does not
    apply to: ─NC systems used in an explosive environment; ─Numerical control devices
    for radiological and medical purposes.'
