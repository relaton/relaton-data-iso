abstract:
- language: en
  script: Latn
  content: Requirements for equipment, survey procedures, data analysis, and reporting
    for active measurement of surface wave exploration, which is a non-destructive
    testing method that uses multiple sensors placed on the ground surface, are specified.
    This standard is applied to multichannel surface wave exploration for estimating
    one-dimensional shear wave velocity. Specifically, a method for estimating S-wave
    velocity profile by processing records of artificially generated Rayleigh waves
    based on the fundamental mode is described. The application is only for soil ground
    investigation. Applications of surface wave exploration to non-soil ground, such
    as diagnosis of asphalt roads at depths of several centimetres or the diagnosis
    of metal plate deterioration, are not covered in this standard.
