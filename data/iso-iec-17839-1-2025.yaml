abstract:
- language: en
  script: Latn
  content: 'This document establishes: —     functional architecture of a Biometric
    System-on-Card (BSoC); —     definition of Type ID-1 BSoC (ISO/IEC 7810 conformant)
    and Type ID-T BSoC (see ISO/IEC 18328-2:2021, Annex A) implementation of a BSoC;
    —     sensor types in a BSoC; —     requirements to a BSoC with respect to: —   
    discriminative power (i.e. biometric accuracy criteria); —    interfaces; —   
    power supply options. —     The following aspects are out of scope of this document
    (see ISO/IEC 24787-1): —     off-card biometric comparison, storage-on-card; —    
    on-card biometric comparison (sensor-off-card); —     work-sharing implementations;
    —     detailed specification and configuration of individual components. This
    document provides a functional architectural description of a BSoC and describes
    how the interfaces are mapped using existing commands and data structures from
    other International Standards.'
