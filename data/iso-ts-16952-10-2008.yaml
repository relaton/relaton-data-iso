abstract:
- language: en
  script: Latn
  content: ISO/TS 16952-10:2008 contains sector-specific stipulations for structuring
    principles and reference designation rules on technical products and technical
    product documentation of power plants. It applies in combination with ISO/TS 16952-1,
    IEC/PAS 62400 and VGB B 101 for the classification of systems and objects, and
    for function-, product- and location-specific designation of technical products
    and their documentation for power plants. It specifies the designation blocks
    for the clear identification and localization of the technical products, which
    are used for their labelling in the plant, for their designation in technical
    documents and for the designation of the technical documents as well. ISO/TS 16952-10:2008
    encompasses the process of energy conversion. The specifications in ISO/TS 16952-10:2008
    apply for the power plant process, for the primary energy supply and final products
    distribution, as well as for auxiliary media and auxiliary energy supply, waste
    materials and waste energy disposal. ISO/TS 16952-10:2008 is not applicable to
    recovery of the primary energy and the media for supplying the process, nor to
    the processing of residues from process disposal (e.g. gypsum, slag products,
    waste water, etc.).
