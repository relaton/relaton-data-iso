abstract:
- language: en
  script: Latn
  content: Specifies four intermediate measures due to changes in observation conditions
    (time, calibration, operator and equipment) within a laboratory. These intermediate
    measures can be established by an experiment within a specific laboratory or by
    an interlaboratory experiment. Furthermore, discusses the implications of the
    definitions of intermediate precision measures, presents guidance on the interpretation
    and application of the estimates of intermediate precision measures in practical
    situations, discusses the connections between trueness and measurement conditions.
