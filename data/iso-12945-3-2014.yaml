abstract:
- language: en
  script: Latn
  content: ISO 12945-3:2014 describes a method for the determination of the resistance
    to pilling, fuzzing, and matting of textile fabrics using the random tumble pilling
    tester. This method is applicable to most of woven and knitted fabrics, including
    napped fabrics (fleeces, inlay fabrics). This method is not applicable to fabrics
    which cannot tumble freely.
