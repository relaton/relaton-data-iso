abstract:
- language: en
  script: Latn
  content: ISO 6427:2013 specifies methods for the determination of components in
    plastics that can be extracted by hot organic liquids near their boiling points.
    For one special case, a so-called cold-extraction method is given. The extractable
    components can be monomers, oligomers, polymers, plasticizers, stabilizers, etc.
    The kind and percentage of extractable matter influence the properties of plastics.
    The recommended extraction liquid depends on the type of plastic and on the purpose
    of the determination. The extracted amounts of special constituents are often
    not quantitative in the sense of analytical chemistry.
