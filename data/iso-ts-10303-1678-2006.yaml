abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1678:2006 specifies the application module for Functional
    decomposition with nodal representation to packaged mapping. ISO/TS 10303-1678:2006
    deals with the representation of the information needed to describe the assignment
    of a set of nodes in a hierarchical network definition to a single node in a non-hierarchical
    network definition for an assembly design. The set of nodes in the hierarchical
    network satisfy a transitive closure property, i.e. any node in the set shall
    be reachable from any other node in the set by traversing only network definitions
    that contain a node in the set. The graph representation of the hierarchical network
    definition shall be directed. The following is within the scope of ISO/TS 10303-1678:2006:
    mapping between a set of nodes in the functional hierarchical network and a single
    node in the physical network.'
