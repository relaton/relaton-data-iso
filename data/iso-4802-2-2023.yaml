abstract:
- language: en
  script: Latn
  content: 'This document specifies: a)       a method for determining the hydrolytic
    resistance of the interior surfaces of glass containers when subjected to attack
    by water at (121 ± 1) °C for (60 ± 1) min. The resistance is measured by determining
    the amount of sodium and other alkali metal or alkaline earth oxides in the extraction
    solution using flame atomic emission or absorption spectrometry (flame spectrometry);
    b)       a classification of glass containers according to the hydrolytic resistance
    of the interior surfaces determined by the methods specified in this document.
    The test method specified in this document might not be applicable to containers
    whose surfaces have been treated for functional modifications, e.g. silicone (e.g.
    containers that are ready for direct filling).'
