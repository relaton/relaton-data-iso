abstract:
- language: en
  script: Latn
  content: ISO 4401:2005 specifies the dimensions and other data relating to surfaces
    on which four-port hydraulic directional control valves are mounted in order to
    ensure their interchangeability. It applies to mounting surfaces for four-port
    hydraulic directional control valves which represent current practice. They are
    generally applicable to industrial equipment.
