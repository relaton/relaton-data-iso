abstract:
- language: en
  script: Latn
  content: This document establishes a framework for the implementation of a sharing
    economy. It specifies requirements for and gives guidance on the operational economic,
    social, environmental, legal and other considerations and factors associated with
    implementation of sharing economy applications and approaches in sharing economy
    contexts. This document is applicable to all actors participating in the sharing
    economy ecosystem, including platform operators, providers, users and other stakeholders.
    This document is applicable to all types and sizes of organization (e.g. commercial
    enterprises, government agencies, not-for-profit organizations).
