abstract:
- language: en
  script: Latn
  content: This document establishes a framework and outlines a process to identify
    criteria for environmental impacts and performance to take into account when considering
    projects, assets and activities seeking finance. This document also gives guidance
    on assessing the risks and opportunities that can arise in applying environmental
    criteria to projects, assets and activities. It is applicable to parties seeking
    finance, providing finance or other interested parties.
