abstract:
- language: en
  script: Latn
  content: ISO 16419:2013 applies to semi-elaborated natural cork stoppers and colmated
    natural cork stoppers at the definitive dimensions stage, and finished natural
    cork stoppers and colmated natural cork stoppers ready to use. It describes the
    anomalies of cork stoppers that can be detected by visual examination by the manufacturer
    or the end-user. These anomalies, according to their size, can have functional
    or not functional consequences being able to alter, more or less, the cork stoppers'
    sealing capacity. On the basis of a common sampling example, ISO 16419:2013 proposes,
    for all these anomalies, some specifications for stoppers.
