abstract:
- language: en
  script: Latn
  content: 'THIS DOCUMENT PROVIDES ALLOWABLE STRESS NUMBERS FOR PITTING AND BENDING
    AND CHARACTERISTICS FOR DUCTILE IRONS TO BE ABLE TO USE THIS MATERIAL IN THE DESIGN
    OF GEARS ACCORDING TO ISO 6336 SERIES AND ISO 10300 SERIES. FOR CALCULATION OF
    PITTING DURABILITY AND BENDING STRENGTH, THE FACTORS OF NODULAR CAST IRON ARE
    GIVEN IN ISO 6336-1 [2] ISO 6336-2 [15], ISO 6336-3 [16], ISO 10300-1 [10] , ISO
    10300-2 [7], AND ISO 10300-3 [8] . TYPICAL CHARACTERISTICS FOR MATERIAL QUALITY
    AND HEAT TREATMENT DESCRIBED IN CLAUSE 6 APPLY FOR GEARS WITH A MODULE OF 14 MM
    AND LARGER. AN AGREEMENT BETWEEN PURCHASER AND SUPPLIER CAN BE DEFINED FOR GEARS
    WITH MODULE SMALLER THAN 14 MM, AS THE EXPERIENCE OF SUCH GEARS MADE OF DUCTILE
    IRON IS LIMITED. THIS DOCUMENT IS APPLICABLE ONLY TO DUCTILE IRON WHICH FULFIL
    ALL THE CHARACTERISTICS DETAILED IN CLAUSE 6 AND DOES NOT COVER HIGH SILICON DUCTILE
    IRON (I.E.: SILICON SOLUTION STRENGTHENED FERRITIC DUCTILE IRON) NOR ADI (AUSTEMPERED
    DUCTILE IRON).'
