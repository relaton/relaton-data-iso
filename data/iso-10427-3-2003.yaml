abstract:
- language: en
  script: Latn
  content: ISO 10427-3:2003 describes testing practices to evaluate the performance
    of cementing float equipment for the petroleum and natural gas industries. ISO
    10427-3:2003 is applicable to float equipment that will be in contact with water-based
    fluids used for drilling and cementing wells. It is not applicable to float equipment
    performance in non-water-based fluids.
