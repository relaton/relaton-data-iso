abstract:
- language: en
  script: Latn
  content: This document specifies a method for the measurement of room acoustic parameters
    in unoccupied open-plan offices. It specifies measurement procedures, the apparatus
    needed, the coverage required, the method for evaluating the data, and the presentation
    of the test report. This document describes a group of single-number quantities
    indicating the room acoustic performance of an open-plan office in a condition
    when one person is speaking. They focus on spatial decay of speech while the quantities
    in ISO 3382-2 focus on temporal decay of sound.
