- language: en
  script: Latn
  content: The scope of this Recommendation | ISO/IEC 27011:2016 is to define guidelines
    supporting the implementation of information security controls in telecommunications
    organizations. The adoption of this Recommendation | ISO/IEC 27011:2016 will allow
    telecommunications organizations to meet baseline information security management
    requirements of confidentiality, integrity, availability and any other relevant
    security property.
