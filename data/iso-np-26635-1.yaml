abstract:
- language: en
  script: Latn
  content: This document specifies a test method for evaluating the oxidation performance of fine bubble water–generating systems using the sodium sulfite oxidation reaction. The method applies to systems that use an oxygen containing gas with a known oxygen volume fraction as the gas source, such as air, oxygen enriched air, or high purity oxygen. It is suitable for assessing and comparing the performance of oxygen fine bubble water–generating systems used in industrial water treatment, flue-gas desulfurization, hydrometallurgical leaching, battery-material regeneration, and other industrial oxidation processes in which dissolved oxygen (DO) plays a critical role. The method is also applicable to processes requiring efficient gas–liquid oxygen transfer under controlled laboratory conditions. By providing a means to characterize the oxygen-driven oxidation capability of fine bubble systems, this method supports technology evaluation, equipment comparison, and process optimization across applications where oxygen participates as a reactive oxidant rather than solely as a mass-transfer medium.
