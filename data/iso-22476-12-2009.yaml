abstract:
- language: en
  script: Latn
  content: 'ISO 22476-12:2009 specifies a mechanical cone penetration test (CPTM),
    including equipment requirements, execution and reporting. The results from such
    geotechnical testing are especially suited to the qualitative and/or quantitative
    determination of a soil profile — together with direct investigations — or as
    a relative comparison with other in situ tests. The results from a cone penetration
    test can in principle be used to evaluate stratification, soil type, and geotechnical
    parameters such as soil density, shear‑strength parameters and deformation and
    consolidation characteristics. ISO 22476-12:2009 specifies the following features:
    type of cone penetration test; application class; penetration length or penetration
    depth; elevation of the ground surface or underwater ground surface at the location
    of the cone penetration test with reference to a datum; location of the cone penetration
    test relative to a reproducible fixed location reference point.'
