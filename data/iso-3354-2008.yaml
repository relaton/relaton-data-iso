abstract:
- language: en
  script: Latn
  content: 'ISO 3354:2008 specifies a method for the determination of the volume flow-rate
    in a closed conduit by means of the velocity-area method using propeller-type
    current-meters under the following conditions: a) the velocity distribution is
    regular; b) the fluid is water which is clean or considered to be clean; c) the
    conduit is full; d) the flow is steady. ISO 3354:2008 deals in particular with
    the technology and calibration of propeller-type current-meters, the measurement
    of local velocities and the calculation of the flow-rate by velocity integration.'
