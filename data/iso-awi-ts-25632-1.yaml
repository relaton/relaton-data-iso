abstract:
- language: en
  script: Latn
  content: The proposed document provides the design method of recycled aggregate
    concrete-filled steel tubular (RACFST) structures. These structures can be used
    in small- to medium-scale buildings, bridges, and other constructions. RACFST
    structures employ RACFST members as main structural components, such as columns
    and piers. RACFST members should be subjected to relatively low stress levels
    during their service life. The cross-sections of RACFST members include circular,
    square, and rectangular shapes. In the proposed document, recycled aggregate concrete
    (RAC) only includes concrete using recycled coarse aggregates (RCA) which satisfy
    the ISO 18985. Concrete using recycled fine aggregates or using RCA from other
    waste materials, such as waste bricks, mine tailings, and industrial waste residues,
    is out of the scope.
