abstract:
- language: en
  script: Latn
  content: ISO 17510-1:2007 specifies requirements for equipment intended for sleep
    apnoea breathing therapy for domiciliary use, ships, aircraft and other transport
    vehicles and for use in healthcare institutions. ISO 17510-1:2007 applies to equipment
    intended for use with adults and children, and excludes equipment intended for
    use with neonates. Jet and very high frequency ventilation and oscillation are
    not considered in ISO 17510-1:2007.
