abstract:
- language: en
  script: Latn
  content: The Avatar Representation Format offers an exchange format for avatars,
    allowing applications to export and import the personalized avatar model of the
    user across different applications, services, and metaverse worlds. This specification
    will define a generic and extensible representation of an avatar, relying on other
    standards for the encoding/compression of specific components of the avatar. The
    scope of the work of this specification is fully aligned with the MPEG-I requirements
    and scope of the MPEG Immersive project.
