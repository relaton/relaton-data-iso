abstract:
- language: en
  script: Latn
  content: 'This document specifies three test methods (method A, method B and method
    C) for assessing the degree of transfer of a material''s surface colour during
    dry or wet rubbing and a method (method D) for determining the likelihood of colour
    bleeding. The methods are applicable to all footwear uppers, linings and insocks,
    irrespective of the material. Method D is also applicable to sewing threads and
    shoelaces. The methods are: — method A: to-and-fro square rubbing finger fastness
    testing machine; — method B: rotative rub fastness testing machine; — method C:
    to-and-fro circular rubbing finger fastness testing machine; — method D: colour
    fastness to bleeding.'
