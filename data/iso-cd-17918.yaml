abstract:
- language: en
  script: Latn
  content: ISO 17918:2015 specifies procedures of on-site detection and evaluation
    in order to determine the effects of material deterioration such as material loss
    from the components and structures that are sensitive to selective corrosion in
    industrial facilities, including nuclear power plants. The methodology involves
    visual inspection and hardness measurements in situ complemented by sample removal.
    These procedures include (a) representative sampling of components sensitive to
    selective corrosion, (b) the visual inspection, and (c) the hardness test, respectively.
    For an exact analysis, additional laboratory testing is recommended. The methodology
    is most applicable to grey cast iron and copper alloy with more than 15 % zinc.
    Extension to other alloys requires supportive evidence of validation. Assessment
    criteria orientated to the nuclear power plant application during the past five
    years before the end of extended operation define the necessity for further engineering
    evaluation and action like, for example, further sampling, higher frequency of
    inspection, and component repair or exchange. This specification is not applicable
    for components used where the representative sampling of surfaces in contact to
    the fluid is not detectable optically or detected with the portable hardness tester.
    Also, in case of non-representative component selection like in HVAC or building
    service application, this specification is not applicable. For components not
    used in nuclear power plant, the assessment criteria have to be agreed by the
    parties. Assessment criteria of hardness test alone is not applicable to the evaluation
    of structural integrity of Al-bronze, NAB, and Cu-Ni.
