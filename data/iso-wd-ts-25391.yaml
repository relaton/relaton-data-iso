abstract:
- language: en
  script: Latn
  content: This document sets forth guidelines for in-house translation departments,
    focusing on personnel and labour management aspects. The aim is to establish a
    common framework for in-house translation departments, ensuring the quality and
    professionalism of their work. This document applies to in-house translation departments
    across all industries and sectors. This includes, but is not limited to, private
    companies, government agencies, non-profit organizations, and academic institutions
    that have internal translation departments or teams. This document does not apply
    to interpreting services.
