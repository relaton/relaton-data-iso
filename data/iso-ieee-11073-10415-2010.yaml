abstract:
- language: en
  script: Latn
  content: ISO/IEEE 11073-10415:2010 establishes a normative definition of communication
    between personal telehealth weighing scale devices and computer engines (e.g.,
    cell phones, personal computers, personal health appliances, and set top boxes)
    in a manner that enables plug-and-play interoperability. It leverages appropriate
    portions of existing standards, including ISO/IEEE 11073 terminology, information
    models, application profile standards, and transport standards. It specifies the
    use of specific term codes, formats, and behaviours in telehealth environments
    restricting optionality in base frameworks in favour of interoperability. This
    International Standard defines a common core of communication functionality for
    personal telehealth weighing scales. ISO/IEEE 11073-10415:2010 addresses a need
    for an openly defined, independent standard for controlling information exchange
    to and from personal health devices and computer engines.
