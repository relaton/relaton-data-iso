abstract:
- language: en
  script: Latn
  content: ISO 7798:2017 specifies a method for the determination of the fatigue indexes
    of cross-country skis (i.e. the resistance of the skis to changes of bottom camber
    height or irreversible damage) after a bending test with cyclic loading. ISO 7798:2017
    is applicable to cross-country skis with a nominal length of 160 cm to 215 cm.
