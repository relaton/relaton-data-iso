abstract:
- language: en
  script: Latn
  content: ISO 13982-1:2004 specifies the minimum requirements for chemical protective
    clothing resistant to penetration by airborne solid particles (Type 5). These
    garments are full-body protective clothing, i.e. covering trunk, arms and legs,
    such as one-piece coveralls or two piece suits, with or without hood or visors,
    with or without foot protection. Requirements for component parts, such as hoods,
    gloves, boots, visors or respiratory protective equipment might be specified in
    other International and European Standards. ISO 13982-1:2004 is applicable only
    to airborne solid particulates. It is not applicable to other forms of challenge
    by solid chemicals, e.g. penetration of chemical dust through materials by rubbing
    or flexing, which may form the object of separate standards.
