abstract:
- language: en
  script: Latn
  content: ISO/ASTM 51401:2003 covers the preparation, testing, and procedure for
    using the acidic aqueous silver dichromate dosimetry system to measure absorbed
    dose in water when exposed to ionizing radiation. The system consists of a dosimeter
    and appropriate analytical instrumentation. For simplicity, the system will be
    referred to as the dichromate system. It is classified as a reference standard
    dosimetry system. ISO/ASTM 51401:2003 describes the spectrophotometric analysis
    procedures for the dichromate system.
