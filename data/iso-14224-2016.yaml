abstract:
- language: en
  script: Latn
  content: 'ISO 14224:2016 provides a comprehensive basis for the collection of reliability
    and maintenance (RM) data in a standard format for equipment in all facilities
    and operations within the petroleum, natural gas and petrochemical industries
    during the operational life cycle of equipment. It describes data collection principles
    and associated terms and definitions that constitute a "reliability language"
    that can be useful for communicating operational experience. The failure modes
    defined in the normative part of this International Standard can be used as a
    "reliability thesaurus" for various quantitative as well as qualitative applications.
    This International Standard also describes data quality control and assurance
    practices to provide guidance for the user. Standardization of data collection
    practices facilitates the exchange of information between parties, e.g. plants,
    owners, manufacturers and contractors. This International Standard establishes
    requirements that any in-house or commercially available RM data system is required
    to meet when designed for RM data exchange. Examples, guidelines and principles
    for the exchange and merging of such RM data are addressed. This International
    Standard also provides a framework and guidelines for establishing performance
    objectives and requirements for equipment reliability and availability performance.
    Annex A contains a summary of equipment that is covered by this International
    Standard. ISO 14224:2016 defines a minimum amount of data that is required to
    be collected, and it focuses on two main issues: - data requirements for the categories
    of data to be collected for use in various analysis methodologies; - standardized
    data format to facilitate the exchange of reliability and maintenance data between
    plants, owners, manufacturers and contractors. The following main categories of
    data are to be collected: a) equipment data, e.g. equipment taxonomy, equipment
    attributes; b) failure data, e.g. failure cause, failure consequence; c) maintenance
    data, e.g. maintenance action, resources used, maintenance consequence, down time.
    NOTE Clause 9 gives further details on data content and data format. The main
    areas where such data are used are the following: 1) reliability, e.g. failure
    events and failure mechanisms; 2) availability/efficiency, e.g. equipment availability,
    system availability, plant production availability; 3) maintenance, e.g. corrective
    and preventive maintenance, maintenance plan, maintenance supportability; 4) safety
    and environment, e.g. equipment failures with adverse consequences for safety
    and/or environment. ISO 14224:2016 does not apply to the following: i. data on
    (direct) cost issues; ii. data from laboratory testing and manufacturing (e.g.
    accelerated lifetime testing), see also 5.2; iii. complete equipment data sheets
    (only data seen relevant for assessing the reliability performance are included);
    iv. additional on-service data that an operator, on an individual basis, can consider
    useful for operation and maintenance; v. methods for analysing and applying RM
    data (however, principles for how to calculate some basic reliability and maintenance
    parameters are included in the annexes).'
