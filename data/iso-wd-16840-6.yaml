abstract:
- language: en
  script: Latn
  content: 'Unchanged in essence as: This document specifies apparatus, test methods,
    and disclosure requirements for generating aging effects in a seat cushion that
    reproduce those seen in use. It also provides methods of determining changes in
    the physical and mechanical properties of seat cushions based on their age and
    use. This document provides a set of tests that simulate wear and tear, which
    can be useful to validate warranty claims and to provide information about product,
    life, and performance limitations associated with product use The content will
    be aligned with the ANSI-RESNA version'
