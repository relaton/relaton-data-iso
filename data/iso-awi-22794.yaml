abstract:
- language: en
  script: Latn
  content: ISO 22794:2007 applies to implantable materials, whether resorbable or non-resorbable, used as dental devices for filling and augmenting bones in oral and maxillofacial surgery. Products that are essentially pure (greater than 90 %) hydroxyapatite are not covered by this International Standard. Evaluation includes the physico-chemical, mechanical, biological and clinical aspects and behaviour of these implantable dental materials.
