abstract:
- language: en
  script: Latn
  content: This document defines the colour and transparency of lithographic printing
    inks orange (O), green (G) and violet (V) for seven-colour offset printing. Different
    sets of inks conforming to this standard will produce a similar colour when printed
    on the same substrate at the appropriate film thickness. This enables colour separations
    to be based on known colour references and simplifies the task of consistently
    printing the same images in multiple printing sites.
