abstract:
- language: en
  script: Latn
  content: This International Standard specifies the reference method for the determination
    of polyethylene-type polymers in animal and vegetable fats and oils. It has been
    established that below 50 mg of polymers per kilogram the precision of the method
    is insufficient (see the results for tallow 1 in Table A.1). This method is used
    for animal fats and oils in particular.
