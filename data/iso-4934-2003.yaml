abstract:
- language: en
  script: Latn
  content: ISO 4934:2003 specifies a gravimetric method for the determination of the
    sulfur content in steels and iron, excluding steels containing selenium. The method
    is particularly suitable as a reference method for the standardization of samples
    on which certified standard values are to be established. The method is applicable
    to a sulfur content between 0,003 % (mass fraction) and 0,35 %(mass fraction).
