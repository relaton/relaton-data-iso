abstract:
- language: en
  script: Latn
  content: This document describes a test method to determine the activity concentration
    of atmospheric tritium by trapping tritium in air by bubbling through a water
    solution. Atmospheric tritium activity concentration levels are expressed in becquerel
    per cubic metre (Bq∙m-3). The formulae are given for a sampling system with four
    bubblers. They can also be applied to trapping systems with only one trapping
    module consisting of two bubblers if only tritiated water vapour (HTO) is in the
    atmosphere to be sampled. This document does not cover laboratory test sample
    results, in becquerel per litre of trapping solution, according to ISO 9698 or
    ISO 13168. The test method detection limit result is between 0,2 Bq∙m-3 and 0,5 Bq∙m-3
    when the sampling duration is about one week.
