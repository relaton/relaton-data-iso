abstract:
- language: en
  script: Latn
  content: 'This standard defines the framework, vocabulary, reference architecture,
    and conformance structure for learning analytics interoperability within the ISO/IEC
    20748 series. It establishes: • a five-layer reference architecture for learning
    analytics systems and the Conformance Reference Points (CRPs) associated with
    each layer; • graduated conformance classes (LA-C1, LA-C2, LA-C3, LA-C4) representing
    capability profiles from core interoperability to full multimodal AI-enabled analytics;
    • a three-tier hybrid conformance framework specifying the types of verification
    required for each conformance class: Tier 1 (Technical Conformance), Tier 2 (AI
    Performance Assessment), and Tier 3 (Governance Audit); • certification routes
    (Route A: Self-Declaration; Route B: Third-Party Technical Assessment; Route C:
    Full Conformity Assessment) and conformance declaration principles applicable
    to the ISO/IEC 20748 series; • the role and relationship of Part 1 to the other
    parts of the ISO/IEC 20748 series, covering system requirements, data interoperability,
    privacy and data protection, conformance test methods, advanced AI requirements,
    and implementation guidance. This standard is applicable to developers, integrators,
    procurers, and operators of learning analytics platforms, learning management
    systems (LMS), learning experience platforms (LXP), educational data repositories,
    AI-enhanced tutoring systems, and related services that participate in the capture,
    processing, analysis, presentation, or action phases of the learning analytics
    cycle. It is also intended for use by procurement agencies, certification bodies,
    and regulators referencing a harmonized conformance framework for educational
    AI and learning analytics. This document does not itself specify detailed system-level
    requirements (addressed by ISO/IEC 20748-2), data-mapping rules (ISO/IEC 20748-3),
    privacy controls (ISO/IEC 20748-4), conformance test methods (ISO/IEC 20748-5),
    advanced AI requirements (ISO/IEC 20748-6), or implementation guidance (ISO/IEC
    20748-7).'
