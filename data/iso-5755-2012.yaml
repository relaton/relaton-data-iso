abstract:
- language: en
  script: Latn
  content: ISO 5755:2012 specifies the requirements for the chemical composition and
    the mechanical and physical properties of sintered metal materials used for bearings
    and structural parts. When selecting powder metallurgical (PM) materials, it should
    be taken into account that the properties depend not only on the chemical composition
    and density, but also on the production methods. The properties of sintered materials
    giving satisfactory service in particular applications may not necessarily be
    the same as those of wrought or cast materials that might otherwise be used. Therefore,
    liaison with prospective suppliers is recommended.
