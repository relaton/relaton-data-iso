abstract:
- language: en
  script: Latn
  content: 'This document specifies measurement methods and conditions to obtain reproducible
    and comparable exterior noise emission levels and spectra for all kinds of vehicles
    operating on rails or other types of fixed track, hereinafter conventionally called
    “unit”. This document is applicable to type testing of units. It provides measurement
    procedures for vehicle exterior noise (in general, a vehicle type test is carried
    out using only a selected subset of these tests): when the vehicle is moving at
    constant speed; when the vehicle is accelerating or decelerating; when the vehicle
    is stationary in different operating conditions. It does not include all the instructions
    to characterize the noise emission of the infrastructure related sources (bridges,
    crossings, switching, impact noise, curving noise, etc.). This document does not
    apply to the noise emission of track maintenance units while working, environmental
    impact assessment (collection of data to be used in a prediction method for environmental
    assessment), noise immission assessment, guided buses, and warning signal noise.
    The results can be used, for example to characterize the exterior noise emitted
    by units, to compare the noise emission of various units on a particular track
    section, and to collect basic source data for units. NOTE            Additional
    guidance is provided in Annex E for measurements in the specific case of urban
    rail vehicles.'
