abstract:
- language: en
  script: Latn
  content: This document specifies the measurement and evaluation methods for gaseous
    and particulate exhaust emissions from reciprocating internal combustion engines
    (RIC engines) in the field. This document is applicable when the emissions from
    RIC engines used in non-road machinery, industrial equipment, marine installations,
    generating sets, diesel rail traction or similar machinery applications need to
    be measured in the field. Clause 4 applies for the conduct of discrete-mode steady-state
    gaseous or particulate emission measurements at a single operating point or conduct
    a weighted cycle-based test in the field. Clause 5 applies where it is necessary
    to assess gaseous emissions performance of engines during typical in-service operation
    under field conditions using portable emission measurement systems (PEMS).
