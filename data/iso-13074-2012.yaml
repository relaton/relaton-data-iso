abstract:
- language: en
  script: Latn
  content: 'ISO 13074:2012 specifies the fitting dimensions of movements to hands.
    It is applicable to analogue quartz table and wall clock movements, with and without
    alarm, that have the following properties: minute wheel shafts with an outer diameter
    of between 1,3 mm and 3,6 mm; hour wheel, minute wheel, second wheel and alarm
    wheel shafts made of metal and plastic material. ISO 13074:2012 can be referenced
    for other types of analogue quartz clock movements.'
