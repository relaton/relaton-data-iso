abstract:
- language: en
  script: Latn
  content: This document gives guidelines for cultural organizations on understanding
    and implementing an event sustainability management system that meets the requirements
    of ISO 20121:2024, in order to meet the needs and expectations of their audiences,
    customers, employees, partners and all other relevant interested parties along
    the value chain of cultural and artistic events. Including production and touring,
    as well as audience behaviour in the context of events and cultural participation.
    It promotes implementing an event sustainability management system in a responsible
    and accountable manner, through the application of ISO 20124 on a comprehensive
    basis. These guidelines do not add, change or modify the requirements of ISO 20124.
    This document will be a guidance standard only (informative) It is applicable
    to all different kinds of cultural and arts organizations (such as theatres and
    museums), regardless of focus, type or size in order to constitute a comprehensive
    event sustainability management system that focuses on the cultural organization
    achieving its objectives. The comprehensive character of this system is essential
    to ensure that all the areas of the cultural organizations have a specified level
    of reliability (i.e. effectiveness of the processes). This International Standard
    does not include product specifications, product test methods, product performance
    levels, or other forms of guidance or requirements directly related to the products
    of electoral organizations.
