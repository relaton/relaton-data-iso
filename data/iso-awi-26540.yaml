abstract:
- language: en
  script: Latn
  content: This document provides guidelines for cultural organizations on implementing
    an event sustainability management system in accordance with ISO 20121:2024, addressing
    the needs and expectations of interested parties across the value chain of cultural
    and artistic events, including production, touring, and audience behaviour in
    the context of cultural participation. It promotes the responsible and accountable
    implementation of an event sustainability management system through the comprehensive
    application of ISO 20121:2024. These guidelines do not add to, change, or modify
    the requirements of ISO 20121:2024. This document is intended to be a guidance
    standard. It is applicable to various types of cultural and arts organizations
    (such as theatres and museums), regardless of their focus or size. It supports
    the establishment of a comprehensive event sustainability management system that
    enables the organization to achieve its objectives. The comprehensive nature of
    this system is essential to ensure that all areas of the organization achieve
    a defined level of conformity.
