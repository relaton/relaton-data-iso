abstract:
- language: en
  script: Latn
  content: This document specifies the relevant terms and definitions of the enhancement
    release of benthic bivalve mollusk in the marine mudflats. It specifies the principles
    of the enhancement release, selection of species, baseline survey, construction
    of foundation seed farm, species quality, offspring breeding, inspection and quarantine,
    packaging and transportation, release, requirements for enhancement release management
    and effect assessment. This document is applicable to the enhancement release
    of benthic bivalve mollusk in the marine mudflats.
