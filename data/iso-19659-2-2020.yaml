abstract:
- language: en
  script: Latn
  content: This document specifies a general approach for achieving thermal comfort
    for passenger compartments or saloons of railway vehicles (single level or double-decker)
    such as main line, regional/suburban and urban vehicles used in public transportation
    services. This document also describes guidelines to specify conditions, performance
    values and the comfort parameter measurement methods for compartments, saloons
    and local annexes. This document does not apply to the thermal comfort of the
    cab driver.
