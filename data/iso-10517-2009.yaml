abstract:
- language: en
  script: Latn
  content: ISO 10517:2009 specifies safety requirements and their verification for
    the design and construction of hand-held, integrally-driven petrol combustion
    engine hedge trimmers designed to be used by a single operator for trimming hedges
    and bushes while utilizing one or more linear reciprocating cutter blades. It
    establishes methods for the elimination or reduction of hazards arising from the
    use of the trimmers. In addition, it specifies the type of information to be provided
    by the manufacturer on safe working practices. It deals with all significant hazards,
    hazardous situations and events relevant to hand-held powered hedge trimmers when
    they are used as intended. It does not deal with low noise design. It is not applicable
    to hedge trimmers with an engine displacement over 80 cm3, nor to hedge trimmers
    manufactured before the date of its publication.
