abstract:
- language: en
  script: Latn
  content: This International Standard establishes principles for deriving dimensions
    from anthropometric measurements and applying them to the design of workstations
    at non-mobile machinery. It is based on current ergonomic knowledge and anthropometric
    measurements. This International Standard specifies the body's space requirements
    for equipment during normal operation in sitting and standing positions. This
    International Standard does not specifically include space demands for maintenance,
    repairing and cleaning work. This International Standard does not give recommendations
    specifically for visual display terminal workstations at machinery. For this purpose
    ISO 9241-5 can be used in conjunction with this International Standard. Situations
    where people are to be prevented from reaching a hazard are dealt with in ISO
    13852.
