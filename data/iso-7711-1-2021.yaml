abstract:
- language: en
  script: Latn
  content: This document specifies the general requirements and test methods for diamond
    rotary instruments used in dentistry, including designation, colour code and grit
    sizes and a quality control for these instruments. It applies to all types of
    diamond rotary instruments independent of type and shape with exception to diamond
    discs, which are specified in ISO 7711-2.
