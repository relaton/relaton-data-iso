abstract:
- language: en
  script: Latn
  content: 'This document establishes the smart streetlighting management platform
    (SSMP) as a representative case study, based on the Korean implementation. This
    document provides practical, non-normative reference information to support other
    countries considering the adoption of similar systems. This document provides
    information on: the system components of SSMP, the roles and functions of each
    individual component; the classification, naming, descriptions, and operational
    procedures of traffic safety service use cases enabled by SSMP.'
