abstract:
- language: en
  script: Latn
  content: This technical specification provides guidance for the specification of design fires in mass timber enclosures for use in fire safety engineering analysis. It is intended to complement existing methodologies detailed in ISO 16733-1:2015 and ISO/TS 16733-2:2021 for selection of design fire scenarios and guidance for the specification of design fires. Specific considerations are provided herein to assess the potential contribution of exposed mass timber surfaces on the fire dynamics in an enclosure using various engineering methods
