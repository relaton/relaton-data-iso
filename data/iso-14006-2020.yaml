abstract:
- language: en
  script: Latn
  content: This document gives guidelines for assisting organizations in establishing,
    documenting, implementing, maintaining and continually improving their management
    of ecodesign as part of an environmental management system (EMS). This document
    is intended to be used by organizations that have implemented an EMS in accordance
    with ISO 14001, but it can also help in integrating ecodesign using other management
    systems. The guidelines are applicable to any organization regardless of its type,
    size or product(s) provided. This document is applicable to product-related environmental
    aspects and activities that an organization can control and those it can influence.
    This document does not establish specific environmental performance criteria.
