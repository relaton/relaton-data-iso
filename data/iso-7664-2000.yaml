abstract:
- language: en
  script: Latn
  content: This International Standard provides information on the most suitable conditions
    for the storage of raw natural and raw synthetic rubber delivered in the form
    of bales. For rubber delivered in the form of powder, loose crumb or pellets,
    extra care should be taken because of the far greater exposed surface area. In
    addition, "particulate" rubber can agglomerate under the influence of elevated
    temperature and/or pressure.
