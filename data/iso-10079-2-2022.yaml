abstract:
- language: en
  script: Latn
  content: This document specifies safety and performance requirements for manually
    powered suction equipment intended for oro-pharyngeal suction. It applies to equipment
    operated by foot or by hand or both. The commonest use of manually powered suction
    is in situations outside of healthcare settings often described as field use or
    transport use. Use in these situations may involve extreme conditions of weather
    or terrain. Additional/alternative requirements for manually powered suction equipment
    intended for field use or transport use are included in this document. This document
    does not apply to mucus extractors.
