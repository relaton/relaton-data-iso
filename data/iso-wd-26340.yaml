abstract:
- language: en
  script: Latn
  content: This document specifies the test method for electrochemically accelerating
    grooving corrosion of ERW steel pipes by potentiostatic polarization techniques.
    It standardizes specimen preparation, test solution, temperature, test duration,
    polarization potential and calculation method of grooving corrosion coefficient.
    This document provides two methods. Method A is applicable to ERW steel pipes
    in oil and gas field aggressive environments, while Method B is applicable to
    those in tap water environments.
