abstract:
- language: en
  script: Latn
  content: This document specifies the dimensions (in millimetres), nominal initial
    forces and types of gas springs. It is applicable to gas springs with increased
    spring force and same built height of type 7 500 to 200 000, pressurized with
    nitrogen with a nominal initial force of between 7 400 N (with a tolerance of
    ±5 %) and 200 000 N (with a tolerance of ±5 %), for use in press tools. It also
    specifies marking, technical delivery conditions and designation. NOTE       Specifications
    of mounting accessories for gas springs are given in ISO 11901‑2.
