abstract:
- language: en
  script: Latn
  content: ISO 16132:2004 specifies the requirements for seal coatings for factory
    application to the surfaces of cement mortar linings, which are factory applied
    to the interior of ductile iron pipes and fittings. It also gives performance
    test requirements for short term sealing efficiency and long term durability and
    requirements for routine testing for visual appearance, coating thickness and
    adhesion. ISO 16132:2004 is applicable to products for potable and other water
    applications.
