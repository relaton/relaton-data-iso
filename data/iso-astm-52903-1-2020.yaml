abstract:
- language: en
  script: Latn
  content: 'This document describes a method for defining requirements for plastic
    materials used in extrusion-based additive manufacturing (AM) processes. Materials
    include unfilled, filled, and reinforced plastic materials suitable for processing
    into parts. These materials can also contain special additives (e.g. flame retardants,
    stabilizers, etc.). Processes include all material extrusion-based AM processes.
    This document is intended for use by manufacturers of materials, feedstocks, plastic
    parts or any combination of the three using material extrusion-based AM. NOTE
    In some cases, material manufacturers can also be feedstock manufacturers. In
    other cases, a material manufacturer can supply materials (example: pellets) to
    a feedstock manufacturer (example: converter of pellets into filaments). This
    document does not purport to address all of the safety concerns, if any, associated
    with its use. It is the responsibility of the user of this standard to establish
    appropriate safety and health, and environmental practices and determine the applicability
    of regulatory limitations prior to use.'
