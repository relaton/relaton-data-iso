abstract:
- language: en
  script: Latn
  content: This part of ISO/TS 11155 specifies a particulate filtration test, including
    the critical characteristics of equipment, test procedure and report format, for
    the consistent assessment of filter elements in a laboratory test rig with particle
    sizes larger than 0,3 μm. It is applicable to filters for removing particulate
    matter from external or recirculated air used for ventilating motor vehicle passenger
    compartments or cabins. The test specified in this part of ISO/TS 11155 enables
    an assessment of filter elements for pressure loss, fractional filtration efficiency
    and accelerated particulate holding capability against standardized laboratory
    particulate challenges. Because the test methods exclude the full range of possible
    particulate challenges and environmental effects, the relative ranking of filters
    may change in service. NOTE 1 Absolute comparability is only possible with filter
    elements of the same shape and size as well as the same position in the test duct.
    NOTE 2 Subject to agreement between supplier and the customer, the test procedure
    allows for the calculation of gravimetric efficiency as a single parameter for
    quality control purposes. For gravimetric efficiency tests refer to ISO 5011.
