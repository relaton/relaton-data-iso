abstract:
- language: en
  script: Latn
  content: '1.1    This document specifies the safety requirements and measures for
    —    cold presses, —    hot presses, —    bending presses, —    edge/face gluing
    presses, —    membrane presses, and —    embossing presses, where the pressing
    force is applied by hydraulic, pneumatic or electrical actuators pushing two flat
    or shaped surfaces against each other, capable of continuous production use, altogether
    referred to as “machines”. This document deals with all significant hazards, hazardous
    situations and events as listed in Annex A, relevant to machines, when operated,
    adjusted and maintained as intended and under the conditions foreseen by the manufacturer,
    including reasonably foreseeable misuse. Also, transport, assembly, dismantling,
    disabling and scrapping phases are taken into account. 1.2    This document is
    applicable to machines fitted with one or more of the following devices or additional
    working units, whose hazards have been dealt with: a)    a device for hot gluing;
    b)    a device for high-frequency gluing in the frequency range from 1 MHz to
    400 MHz; c)    a device for high-frequency shaping in the frequency range from
    1 MHz to 400 MHz; d)    an automatic workpiece loading and unloading system; e)
       an intermediate additional platen; f)    a workpiece extractor; g)    a horizontal
    pressing system; h)    split moveable platens. 1.3    The machines are designed
    to process workpieces consisting of: a)    solid wood; b)    materials with similar
    characteristics to wood (see ISO 19085-1:2021, 3.2), except those with light alloy
    laminates/edges/profiles for high-frequency presses; c)    wood-based material
    such as chipboard, fibreboard and plywood composed/laminated with steel sheets/edges/profiles,
    except for high-frequency presses; d)    honeycomb board; e)    composite boards
    made from the materials listed above. 1.4    This document does not deal with
    any hazards related to: —    specific devices that differ from the list above;
    —    hot fluid heating systems internal to the machine other than electrical;
    —    any hot fluid heating systems external to the machine; —    operation of
    taking intermediate platens out and in again; —    the combination of a single
    machine being used with any other machine (as part of a line). 1.5    This document
    is not applicable to: —    frame presses; —    membrane presses where the pressing
    force is applied by vacuum only; —    presses for producing chipboard, fibreboard,
    OSB; —    machines intended for use in potentially explosive atmosphere; —    machines
    manufactured before the date of publication of this document.'
