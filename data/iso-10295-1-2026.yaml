abstract:
- language: en
  script: Latn
  content: 'This document specifies the heating condition, method of test and criteria
    for the evaluation of the ability of a penetration sealing system to maintain
    the integrity and insulation of a fire-separating element at the position at which
    it has been penetrated. This document assesses: the effect of such penetrations
    on the integrity and insulation performance of the element concerned, the integrity
    and insulation performance of the penetration sealing system, and the insulation
    performance of the penetrating service or services, and where appropriate, the
    integrity failure of a service. NOTE 1        Optional water and air leakage tests
    are included in Annex A. NOTE 2        Explanatory notes are included in Annex B.'
