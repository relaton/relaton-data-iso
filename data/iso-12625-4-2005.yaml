abstract:
- language: en
  script: Latn
  content: ISO 12625-4:2005 specifies a test method for the determination of the tensile
    strength, stretch at break and tensile energy absorption of tissue paper and tissue
    products. It uses a tensile-testing apparatus operating with a constant rate of
    elongation. It also specifies the method of calculating the tensile index and
    the tensile energy absorption index.
