abstract:
- language: en
  script: Latn
  content: Specifies a method for the detection and enumeration of F-specific ribonucleic
    acid bacteriophages. The sample is incubated with an appropriate host strain.
    Applicable to all kinds of water, sediments and sludges, even for shellfish extracts.
    The presence of F-specific RNA bacteriophages in a water sample indicates pollution
    by wastewater contaminated by human or animal faeces.
