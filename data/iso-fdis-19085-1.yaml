abstract:
- language: en
  script: Latn
  content: This document gives the safety requirements and measures to reduce risks
    arising during operation, adjustment, maintenance, transport, assembly, dismantling,
    disabling and scrapping, related to woodworking machines capable of continuous
    production use, hereinafter referred as "machines". These safety requirements
    and measures are those common to most of the machines, when they are used as intended
    and under the conditions foreseen by the manufacturer; reasonably foreseeable
    misuse has been considered too. The machines are designed to process solid wood
    and material with similar physical characteristics to wood, with hand feed or
    integrated feed. This document is intended to be used in conjunction with the
    other parts of the ISO 19085 series, applicable to specific machine types. The
    extent to which all significant hazards of a specific machine type are covered
    is indicated in the specific part of the ISO 19085 series relevant to that machine
    type. The hazards covered, at least partly, by the requirements of this document,
    are listed in Annex A. It is not applicable to machines intended for use in potential
    explosive atmospheres or to machines manufactured prior to the date of its publication.
