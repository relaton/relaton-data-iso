abstract:
- language: en
  script: Latn
  content: This new part of ISO 28564 specifies principles and give a range of guidelines
    for planning, design and setting of air-terminal guidance systems. This document
    is applicable to the planning, design and setting of the public information guidance
    systems for airport terminals. It is intended for use by airport operators, wayfinding
    designers, organizations providing airport wayfinding design services and other
    entities providing wayfinding related services. This document is not applicable
    to the planning and setting of safety way guidance systems (SWGS) and safety signing
    systems in airport terminals, as well as sectors that are subject to specific
    regulations or principles (e.g. traffic signs on roads within the airport area,
    variable message signs in air-terminal buildings). However, when creating a wayfinding
    design brief, many of the principles outlined in this document can be relevant
    for planning a coordinated scheme.
