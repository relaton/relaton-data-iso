abstract:
- language: en
  script: Latn
  content: ISO 16245:2009 specifies requirements for boxes and file covers, made of
    cellulosic material, to be used for long term storage of documents on paper or
    parchment. ISO 16245:2009 is applicable to boxes made of solid or corrugated board
    and to file covers made of paper or board. ISO 16245:2009 can also be applicable
    to other types of enclosure for long term storage such as cases, portfolios, tubes
    and envelopes made of cellulosic material. ISO 16245:2009 is not applicable to
    storage of photographic materials. NOTE ISO 18902 contains requirements on storage
    materials for photographs.
