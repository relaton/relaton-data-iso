abstract:
- language: en
  script: Latn
  content: ISO 12465:2007 establishes requirements for the specification of plywood
    for general and structural use, in dry, tropical dry/humid and high-humidity/exterior
    conditions. It includes requirements for the quality of veneer, glue bond, lay-up
    (construction), dimensions and tolerances, conformance verification and marking.
    The values listed in ISO 12465:2007 relate to product properties, but they are
    not characteristic values to be used in design calculations. Additional information
    on supplementary properties for certain applications is also given.
