abstract:
- language: en
  script: Latn
  content: This document, part one of a multipart standard, covers the preparation
    of compact interoperable biometric reference data suitable for storage on 2D barcodes
    and other containers of limited capacity. NOTE Subsequent parts of the series
    establish modality-specific requirements for preparation of the compact biometric
    payload. Each part targets an approximate encoded payload size suitable for a
    2D barcode. To support subsequent parts of this specification, this document -
    Establishes common terms, definitions and specifications for the preparation of
    the data. - This document includes guidance on the use of ISO/IEC 19795-based
    tests intended to assess potential biometric accuracy losses inherent in the use
    of lossy techniques applied to achieve compact sizes. Not within scope are cryptographic
    specifications, error correction profiles, and application-specific details like
    metadata, binary vs. text encoding, and 2D barcode coding.
