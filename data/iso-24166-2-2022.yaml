abstract:
- language: en
  script: Latn
  content: This document specifies the shape, dimensions, fill capacities and performance
    requirements of moulded glass bottles for metering pumps. It also specifies the
    material for the manufacturing of such containers as well as the secondary packaging.
    This document also provides requirements for packaging of the moulded glass bottles
    and addresses nonsterile, ready to sterilize or sterile as three possible options.
    This document is applicable to colourless or amber glass containers moulded from
    borosilicate or soda-lime-silica glass and intended to be used in the packaging,
    storage or transportation of products intended for medicinal use.
