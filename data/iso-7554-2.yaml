abstract:
- language: en
  script: Latn
  content: This document defines measuring methods for the determination of basic
    measurements of surgical standard instruments. This document does not apply to
    instruments for use on the central nervous system and on the central cardiovascular
    system. NOTE 1 Instruments for use on the central nervous system and on the central
    cardiovascular system are measured differently due to complex geometries which
    are adapted to the human anatomy. NOTE 2 In Annex A provides tables for converting
    customary units.
