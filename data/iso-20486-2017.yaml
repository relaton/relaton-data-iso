abstract:
- language: en
  script: Latn
  content: ISO 20486:2017 specifies the calibration of those leaks that are used for
    the adjustment of leak detectors for the determination of leakage rate in everyday
    use. One type of calibration method is a comparison with a reference leak. In
    this way, the leaks used for routine use become traceable to a primary standard.
    In other calibration methods, the value of vapour pressure was measured directly
    or calculated over a known volume. The comparison procedures are preferably applicable
    to helium leaks, because this test gas can be selectively measured by a mass spectrometer
    leak detector (MSLD) (the definition of MSLD is given in ISO 20484). Calibration
    by comparison (see methods A, As, B and Bs below) with known reference leaks is
    easily possible for leaks with reservoir and leakage rates below 10−7 Pa·m3/s.
    Figure 1 gives an overview of the different recommended calibration methods.
