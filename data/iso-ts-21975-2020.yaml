abstract:
- language: en
  script: Latn
  content: This document specifies characteristics including barrier properties to
    be measured of polymeric nanocomposite films used for improving food packaging.
    The barrier properties cover gas (oxygen), water vapour transmission and UV-Vis
    light transparency. This document also describes the relevant measurement methods.
    This document addresses neither safety and health issues related to the food packaging
    nor environmental aspects.
