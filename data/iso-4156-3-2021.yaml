abstract:
- language: en
  script: Latn
  content: This document provides data, guidance and requirements for the inspection
    of straight (non-helical) side fitting cylindrical involute splines. Limiting
    dimensions, tolerances, manufacturing deviations and their effects on the fit
    between connecting coaxial spline elements are defined and tabulated. Linear dimensions
    are expressed in millimetres and angular dimensions in degrees.
