abstract:
- language: en
  script: Latn
  content: ISO 21931-1:2010 provides a general framework for improving the quality
    and comparability of methods for assessing the environmental performance of buildings
    and their related external works. It identifies and describes issues to be taken
    into account in the use and development of methods of assessment of the environmental
    performance for new or existing buildings in their design, construction, operation,
    maintenance and refurbishment, and in the deconstruction stages. The object of
    assessment in ISO 21931-1:2010 is the building and the external works within its
    site (curtilage).
