abstract:
- language: en
  script: Latn
  content: This document specifies three quantitative methods for the determination
    of the ionic halide (excluding fluoride) content of soldering fluxes. Halides
    are calculated as chlorides. A useful qualitative test method for the detection
    of ionic halides is also described. Method A is a potentiometric titration method for
    the determination of halide (excluding fluoride) content and is applicable to
    flux classes 1 and 2, defined in ISO 9454-1. This method, which is considered
    the reference method for these fluxes, is suitable for halide contents generally
    within the range of 0,05 % mass fraction to 2 % mass fraction in the non-volatile
    matter of the flux. Method B is a titration method for the determination of the
    total halide (excluding fluoride) content of water-soluble fluxes. It is applicable
    to flux classes 2122 to 2124, 3112 to 3114 and 3212 to 3214, as defined in ISO 9454-1.
    Method C is a titration method for the determination of the halide (excluding
    fluoride) content of water-soluble fluxes containing phosphates and is applicable
    to flux class 331, as defined in ISO 9454-1. Method D is a qualitative test, using
    silver chromate test paper, for the presence of ionic halides. The technique can
    be used for all classes of flux.
