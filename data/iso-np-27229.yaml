abstract:
- language: en
  script: Latn
  content: This document specifies operator and environment-related safety requirements and the means of their verification for the design and construction of closed transfer systems (CTS) for liquid formulations of plant protection products (PPP) in 20 l and larger containers. In addition, it specifies the type of information on safe working practices including information about residual risks to be provided by the CTS manufacturer and specifies the maximum potential contamination during any single transfer operation.
