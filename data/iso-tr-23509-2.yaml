abstract:
- language: en
  script: Latn
  content: This document provides sample calculations for different bevel gear designs,
    how the geometry is numerically determined according to the methods and formulae
    of ISO 23509-1. The term “bevel gear” is used to mean straight, helical (skew),
    spiral bevel, zerol and hypoid gear designs. Where this document pertains to one
    or more, but not all, the specific forms are identified. The manufacturing process
    of forming the desired tooth form is not intended to imply any specific process,
    but rather to be general in nature and applicable to all methods of manufacture.
    The geometry for the calculation of factors used in bevel gear rating, such as
    ISO 10300 (all parts), is also included.
