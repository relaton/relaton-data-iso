abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of anions content
    of lithium hexafluorophosphate (LiPF6) by Ion Chromatography(IC).This document
    is applicable to the determination of impurity anions such as chloride(Cl-)and
    sulfate(SO42-). The limits of detection(LOD) for each anion are 0.1mg/kg and 0.3mg/kg,
    respectively. This method is suitable for the laboratory operation of LiPF6 producer,
    final user and independent test institute.
