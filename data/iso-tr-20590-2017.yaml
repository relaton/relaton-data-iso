abstract:
- language: en
  script: Latn
  content: ISO/TR 20590:2017 contains non-normative information on the design and
    operational practices for launch vehicle orbital stages for mitigating space debris.
    ISO/TR 20590:2017 can be used to guide engineers in the application of the family
    of space debris mitigation standards (see 4.2) to reduce the growth of space debris
    by ensuring that launch vehicle orbital stages are designed, operated, and disposed
    of in a manner that prevents them from generating debris throughout their orbital
    lifetime.
