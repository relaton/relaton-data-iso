  script: Latn
  content: This document outlines the specification of 60° female cone end-connections for high-pressure components in hydrogen supply systems. This is appliable for tube couplings up to 12.7 mm external diameter. This requirement includes dimensional specification and related tolerances, assembly description, usage and assembling recommendation, material choices including hardness and hydrogen compatibility, and related norms.
