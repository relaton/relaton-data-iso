abstract:
- language: en
  script: Latn
  content: 'This document specifies the method of instrumented indentation test for
    determination of hardness and other materials parameters for the following three
    ranges: macro range: 2 N ≤ F ≤ 30 kN; micro range: 2 N > F; h > 0,2 µm; nano range:
    h ≤ 0,2 µm. For the nano range, the mechanical deformation strongly depends on
    the real shape of indenter tip and the calculated material parameters are significantly
    influenced by the contact area function of the indenter used in the testing machine.
    Therefore, careful calibration of both instrument and indenter shape is required
    in order to achieve an acceptable reproducibility of the materials parameters
    determined with different machines. The macro and micro ranges are distinguished
    by the test forces in relation to the indentation depth. Attention is drawn to
    the fact that the micro range has an upper limit given by the test force (2 N)
    and a lower limit given by the indentation depth of 0,2 µm. The determination
    of hardness and other material parameters is given in the normative Annex A. At
    high contact pressures, damage to the indenter is possible. For test pieces with
    very high hardness and modulus of elasticity, permanent indenter deformation can
    occur and can be detected using suitable reference materials. Indentations that
    result in damage or permanent deformation of the indenter are excluded from the
    scope of this test method. This test method can also be applied to thin metallic
    and non-metallic coatings and non-metallic materials. In this case, it is recommended
    that the specifications in the relevant standards be taken into account (see also
    7.3 and ISO 14577-4). The analysis methods of this standard assume that materials
    behave like ideal materials. Any deviation (internal stress, pile-up, sink-in,
    densification, phase transitions, cracks) will result in additional uncertainties.
    This becomes especially important if comparisons shall be done to material parameters,
    obtained with other methods.'
