abstract:
- language: en
  script: Latn
  content: ISO 27955:2010 applies to devices for the securing of cargo in passenger
    cars, station wagons and multi-purpose passenger cars, where the seats directly
    delimit the loading space. ISO 27955:2010 defines minimum requirements and tests
    for front and rear seats and partitioning systems, in order to improve the protection
    of the vehicle occupants against shifting load during a frontal impact. In addition,
    ISO 27955:2010 defines minimum requirements and tests for lashing points in the
    above-mentioned vehicles in order to be able to secure a load (luggage or goods)
    in a reliable and roadworthy way. For vehicles primarily designed for the transportation
    of cargo and derived from a passenger car, only the requirements concerning the
    lashing points of ISO 27955:2010. Additional requirements for these vehicles and
    requirements for any other delivery vans are specified in ISO 27956.
