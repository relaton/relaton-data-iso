abstract:
- language: en
  script: Latn
  content: ISO 5667-15:2009 provides guidance on procedures for the preservation,
    handling and storage of samples of sewage and waterworks sludge, suspended matter,
    saltwater sediments and freshwater sediments, until chemical, physical, radiochemical
    and/or biological examination can be undertaken in the laboratory. The procedures
    in ISO 5667-15:2009 are only applicable to wet samples of sludge, sediment and
    suspended matter.
