abstract:
- language: en
  script: Latn
  content: ISO 8455:2011 gives guidelines for conditions aimed to minimize the risks
    of infestation, contamination, and quality deterioration of green coffee (also
    known as raw coffee) in bags and "big-bags", in bulk and in silos, being the subject
    of international commerce, from the time of its packing for export until the time
    of its arrival in the importing country.
