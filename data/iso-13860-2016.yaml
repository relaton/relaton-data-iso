abstract:
- language: en
  script: Latn
  content: ISO 13860:2016 specifies terminology and required information as a general
    framework for identifying and describing the main dimensions and features of wheeled
    forwarders. It is applicable to articulated wheeled forwarders (as defined in
    ISO 6814, a forwarder is a self-propelled machine designed to move trees or parts
    of trees by carrying them).
