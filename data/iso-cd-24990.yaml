abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the physical and chemical properties
    of dentifrice tablets and provides guidelines for suitable test methods. It also
    specifies requirements for the marking, labelling, and packaging of dentifrice
    tablets. This document applies to dentifrice tablets, destined to be used by the
    consumers on a daily basis with a toothbrush to promote oral hygiene. This document
    excludes non-tablet dentifrices such as toothpaste. Specific qualitative and quantitative
    requirements for freedom from biological and toxicological hazards are not included
    in this document. These are covered in ISO 7405 and ISO 10993-1.
