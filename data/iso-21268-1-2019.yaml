abstract:
- language: en
  script: Latn
  content: This document specifies a test providing information on leaching of soil
    and soil-like materials under the experimental conditions specified hereafter,
    and particularly at a liquid to solid ratio of 2 l/kg dry matter. The document
    has been developed to measure the release of inorganic and organic substances
    from soil and soil-like material as well as to produce eluates for subsequent
    ecotoxicological testing. For ecotoxicological testing, see ISO 15799[6] and ISO
    17616[7]. NOTE 1 Volatile organic substances include the low-molecular-weight
    substances in mixtures such as mineral oil. NOTE 2 It is not always possible to
    optimise test conditions simultaneously for inorganic and organic substances and
    optimum test conditions can also vary between different groups of organic substances.
    Test requirements for organic substances are generally more stringent than those
    for inorganic substances. The test conditions suitable for measuring the release
    of organic substances will generally also be applicable to inorganic substances.
    NOTE 3 Within the category of organic substances, a significant difference in
    behaviour exists between the more polar, relatively water-soluble compounds and
    apolar, hydrophobic organic substances (HOCs). In the latter case, mechanisms
    of release (e.g. particle-bound or dissolved organic carbon-bound) can be more
    crucial as well as sorption losses of soluble HOCs on different materials with
    which they come in contact (e.g. bottles, filters). The test and the results should
    be used for leaching of organic substances only with thorough consideration of
    the specific properties of the substances in question and the associated potential
    problems. NOTE 4 For ecotoxicological testing, eluates representing the release
    of both inorganic and organic substances are needed. In this document, ecotoxicological
    testing is also meant to include genotoxicological testing. This test method produces
    eluates, which can subsequently be characterized by physical, chemical and ecotoxicological
    methods in accordance with existing standard methods. The test is not suitable
    for substances that are volatile under ambient conditions. This procedure is not
    applicable to materials with a dry-matter-content ratio lower than 33 %. This
    test is mainly aimed at being used for routine and control purposes, and it cannot
    be used alone to describe all leaching properties of a soil. Additional leaching
    tests are needed for that extended goal. This document does not address issues
    related to health and safety. It only determines the leaching properties as outlined
    in Clause 4.
