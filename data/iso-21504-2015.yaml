abstract:
- language: en
  script: Latn
  content: ISO 21504:2015 provides guidance on the principles of project and programme
    portfolio management. ISO 21504:2015 is relevant to any type of organization including
    public or private and any size organization or sector. The guidance presented
    in ISO 21504:2015 is intended to be adapted to suit the specific environment of
    the project and programme portfolio. ISO 21504:2015 does not provide guidance
    on project management, programme management, or general business portfolio management
    (e.g. financial portfolio management).
