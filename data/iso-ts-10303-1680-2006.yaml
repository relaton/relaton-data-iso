abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1680:2006 specifies the application module for Functional
    unit requirement allocation. ISO/TS 10303-1680:2006 deals with the representation
    of the assignment of customer, regulatory agency and enterprise human and computer
    interpretable requirements to a functional element in a network. These requirements
    may be assigned for various purposes and phases of the design process. The following
    are within the scope of ISO/TS 10303-1680:2006: human interpretable requirement
    allocation to a functional unit;application interpretable requirement allocation
    to a functional unit;representation of a nodal formulation of a network definition.'
