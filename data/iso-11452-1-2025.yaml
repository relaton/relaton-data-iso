abstract:
- language: en
  script: Latn
  content: This document specifies general conditions, defines terms, gives practical
    guidelines, and establishes the basic principles of the component tests used in
    the other parts of the ISO 11452 series for determining the immunity of electronic
    components of passenger cars and commercial vehicles to electrical disturbances
    from narrowband radiated electromagnetic energy, regardless of the vehicle propulsion
    system (e.g. spark-ignition engine, diesel engine, electric motor). The electromagnetic
    disturbances considered are limited to continuous narrowband electromagnetic fields.
    A wide frequency range (d.c. and 15 Hz to 18 GHz) is allowed for the immunity
    testing of the components in the ISO 11452 series.
