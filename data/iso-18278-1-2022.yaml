abstract:
- language: en
  script: Latn
  content: This document specifies procedures for assessing the generic weldability
    for resistance spot, seam and projection welding of uncoated and coated metals.
    The purpose of the tests described in this document are to a) compare the metallurgical
    weldability of different metals, b) assess the weldability of differing component
    designs, e.g. dimensional configuration, stack-up, projection geometry, etc.,
    c) investigate the effect of changes in welding parameters such as welding current,
    weld time, electrode force or complex welding schedules including pulse welding,
    current stepping etc. on weldability, and/or d) compare the performance of resistance
    welding equipment. Precise details of the test procedure to be used depend on
    which aspect of items a) to d) will be evaluated relative to the welding result
    obtained.
