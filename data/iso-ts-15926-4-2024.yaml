abstract:
- language: en
  script: Latn
  content: 'This document specifies the set of core reference data items which can
    be used to record information about process plants, including oil and gas production
    facilities. The following are within the scope of this document: —     core classes
    for process plants, including oil and gas production facilities; —     information
    about a reference data item. NOTE            The total set of information about
    a reference data item can be found in Table B.1. The following are outside the
    scope of this document: —     data requirements for additional reference data
    items; —     the procedures to be followed for registration and maintenance of
    additional reference data items.'
