abstract:
- language: en
  script: Latn
  content: This European Standard specifies minimum requirements and test methods
    for protective clothing for abrasive blasting operations and for hand protection,
    for the treatment of surfaces with granular abrasives propelled by compressed
    air or by mechanical means. The protection against substances that develop during
    the blasting operation as well as connections between the protective clothing
    and the respiratory protective device are also covered. This European Standard
    does not apply to steam blasting, jet blasting and flame blasting operations.
