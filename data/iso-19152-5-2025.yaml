abstract:
- language: en
  script: Latn
  content: 'This document: —     specifies a reference land administration domain
    model (LADM) covering basic information-related components of spatial plan information
    on land/water and elements below/on/above the surface of the Earth with 2D/3D/4D
    (3D + time) geometric representation; —     provides an abstract, conceptual model
    with packages related to: —    plan unit, i.e. the smallest homogenous area/space
    (2D/3D/4D) with assigned function/purpose, e.g. office, education, retail; —   
    plan block, i.e. a set of neighbouring plan units decided on by planning authorities,
    e.g. high-density residential area, nature area, heavy industry area; —    plan
    group unit, i.e. areas corresponding to the higher planning levels; —    plan
    group, i.e. hierarchy in spatial plans consisting of multiple plan blocks, e.g.:
    —     continent/regional-wide (e.g. European regions), —     country-wide (e.g.
    Indonesia, the Netherlands), —     island, —     state or region province, —    
    municipality or city, and —     urban or rural; —    permit, i.e. something that
    is granted to a party which gives the party permission to undertake an activity
    which would otherwise be restricted; —     defines terminology for spatial plan
    information as part of land administration, based on various national and international
    systems, that is as simple as possible in order to be useful in practice. The
    terminology allows a shared description of different formal or informal practices
    and procedures in various jurisdictions; —     provides a platform for comparison
    and monitoring of spatial planning information based on Sustainable Development
    Goal (SDG) indicators; —     provides an approach to modelling the integration
    of spatial plan information (outputs of spatial plans) into land administration;
    —     provides a basis for national and regional profiles; —     enables the combining
    of land-use planning and land development planning in land administration information
    from different sources in a coherent manner; —     allows for the relationship
    to multiple parties and groups to be expressed together with a referencing structure
    so that the sourcing of all information systems can be maintained. It reuses core
    LADM classes so that sourcing of all information systems can be maintained; —    
    establishes the common elements and basic schema for spatial plan information
    upon which a more detailed schema can be established. NOTE            This document
    does not interfere with (national) and sub-national spatial planning laws.'
