abstract:
- language: en
  script: Latn
  content: 'ISO 29802:2017 specifies the designations, dimensions, markings and load
    ratings of pneumatic tyres primarily intended for all-terrain vehicles (ATV).
    It also specifies the designation, marking and contours of rims. The tyres meet
    the following parameters: a) speeds not exceeding 130 km/h (Speed Symbol M); b)
    fitted to (AT) 5° tapered drop centre rims; c) nominal rim diameter codes of 7
    to 14 inclusive.'
