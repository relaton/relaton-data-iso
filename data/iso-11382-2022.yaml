abstract:
- language: en
  script: Latn
  content: This document provides guidelines for the description of data sheets for
    infrared materials. It specifies the nomenclature and the properties of infrared
    materials which are reported on such data sheets. These data sheets do not necessarily
    contain information on every property identified in this document. This document
    also specifies the parameters needed to characterize optical materials intended
    for use in the infrared spectral range from 0,78 µm to 25 µm and provides various
    methods to be used for measuring these parameters. This document is applicable
    only to materials used in the manufacture of passive optical components. The properties
    of materials used in active applications (e.g. optoelectronics) are not taken
    into account. Materials specified in this document can also transmit in other
    spectral domains (microwaves, visible or ultraviolet).
