abstract:
- language: en
  script: Latn
  content: This document specifies methodologies for calculation of braking performance
    for railway rolling stock and is applicable to all countries. This document describes
    the general algorithms/formulae using mean value inputs to perform calculations
    of brake equipment and braking performance in terms of stopping/slowing distances,
    stationary braking, power and energy for all types of rolling stock, either as
    single vehicles or train formations, with respect to the braking distance. The
    calculations can be used at any stage of the assessment process (design, manufacture,
    testing, verification, investigation, etc.) of railway rolling stock. This document
    does not set out the specific acceptance criteria (pass/fail). This document is
    not intended to be used as a design guide for selection of brake systems and does
    not specify performance requirements. This document does not provide a method
    to calculate the extension of stopping distances when the level of available adhesion
    is exceeded (wheel slide activity). This document contains examples of the calculation
    of brake forces for different brake equipment types and calculation of stopping
    distance and stationary braking relevant to a single vehicle or a train.
