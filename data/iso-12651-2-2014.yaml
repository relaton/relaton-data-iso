abstract:
- language: en
  script: Latn
  content: ISO 12651-2:2014 defines terms and concepts relevant to electronic document
    workflow management. It is intended to facilitate communication in the field of
    electronic document management and translation of the terms and concepts it contains
    into other languages. It identifies the terminology used to describe the concepts
    and general structure of a workflow management system for electronic images and
    other electronic documents, its major functional components, and their interfaces.
    It also provides a list of synonyms variously used within the industry as alternative
    terms to the preferred terminology
