abstract:
- language: en
  script: Latn
  content: 'This part of ISO 16119 specifies requirements and the means for their
    verification for the design and performance of fixed and semi-mobile sprayers,
    as defined in 3.1 and 3.2, with regard to minimizing the potential risk of environmental
    contamination during use, including misuse foreseeable by the manufacturer. This
    type of spraying system is generally a combination of separate elements (main
    tank, pump and application unit) that can be assembled in fixed installations
    (fixed sprayers) or with moving parts (semi-mobile sprayers). It does not apply
    to application equipment for space/spatial treatments. It is intended to be used
    with ISO 16119 1, which gives general requirements common to all the sprayer types
    covered by ISO 16119. When requirements of this part of ISO 16119 are different
    from those stated in ISO 16119 1, the requirements of this part of ISO 16119 take
    precedence over the requirements of ISO 16119 1 for machines within the scope
    of this part of ISO 16119. This part of ISO 16119 does not cover safety aspects
    (see ISO 4254 6). • Filling - Total tank extra volume • Quick coupler for CTS
    + mandatory provision of inductor hopper or CTS • Filters drain valve • Digital
    level indicator + accuracy • Pump requirements as per ISO 12908: 2020 • Residue
    concentration only one method for system rinsing'
