- language: en
  script: Latn
  content: ISO 5743:2004 specifies the general technical requirements to be met by
    pliers and nippers. It does not specify insulating or antistatic characteristics
    of handle coatings. Plastic coatings or plastic sleeves are intended for gripping
    comfort only. ISO 5743:2004 is only applicable to pliers for which ISO standards
