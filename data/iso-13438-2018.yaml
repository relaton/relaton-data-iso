abstract:
- language: en
  script: Latn
  content: 'This document specifies a screening test method for determining the resistance
    of geotextiles and geotextile-related products to oxidation. The test is applicable
    to products as follows: — Method A for material consisting solely in polypropylene
    (PP), polyethylene (PE), polyamide (PA), aramide (AR); — Method B for material
    consisting solely in polyvinyl alcohol (PVAL). The data are suitable for screening
    purposes but not for deriving performance data such as lifetime, unless supported
    by further evidence.'
