abstract:
- language: en
  script: Latn
  content: ISO 18754:2003 specifies a method for the determination of the apparent
    solid density, bulk density and apparent porosity of fine ceramics. This method
    is not appropriate for the determination of an apparent porosity greater than
    10 %. For materials with higher porosity, the accuracy of the measurement may
    not be satisfactory. The method may also not give satisfactory open porosity result
    if it is less than 0,5 %.
