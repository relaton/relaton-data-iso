abstract:
- language: en
  script: Latn
  content: This document describes a method to assess the potential for dermal transfer
    and subsequent exposure to metal and metal oxide nano-objects incorporated into
    treated wood products or applied to surface-coated wood products using a sampling
    wipe method. This document is applicable to a range of wood products such as decks,
    playsets, and flooring.
