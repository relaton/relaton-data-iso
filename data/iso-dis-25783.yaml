abstract:
- language: en
  script: Latn
  content: This document specifies requirements for calculating the carbon footprint
    specific to farmed photosynthetic microalgae product category rules (CFP–PCR).
    This methodology builds on the requirements of International Standards for life
    cycle assessment (LCA) and products’ carbon footprints. This document is applicable
    to the calculation and communication of farmed photosynthetic microalgae products’
    carbon footprints from seedling production to the consumption of photosynthetic
    microalgae products.
