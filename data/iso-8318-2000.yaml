abstract:
- language: en
  script: Latn
  content: This International Standard specifies two methods for carrying out a sinusoidal
    vibration test on a complete, filled transport package or unit load using a variable
    frequency. These tests may be used to assess the performance of a package or an
    unit load in terms of its strength or the protection that it offers to its contents
    when it is subjected to vertical vibration. Each may be performed either as a
    single test to investigate the effects of vertical vibration or as part of a sequence
    of tests designed to measure the ability of a package or unit load to withstand
    a distribution system that includes a vibration hazard.
