abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for the determination of
    the saponification value of animal and vegetable fats and oils. The saponification
    value is a measure of the free and esterified acids present in fats and fatty
    acids. The method is applicable to refined and crude vegetable and animal fats.
    If mineral acids are present, the results given by this method are not interpretable
    unless the mineral acids are determined separately.
