abstract:
- language: en
  script: Latn
  content: This document specifies methods for the measurement of specular reflectance
    and specular gloss of flat samples of anodized aluminium using geometries of 20°
    (Method A), 45° (Method B), 60° (Method C) and 85° (Method D) and of specular
    reflectance by an additional 45° method (Method E) employing a narrow acceptance
    angle. The methods described are intended mainly for use with clear anodized surfaces.
    They can be used with colour-anodized aluminium, but only with similar colours.
