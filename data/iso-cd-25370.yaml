abstract:
- language: en
  script: Latn
  content: 'This document provides guidance on the use of leaching tests to determine
    key parameters (KPs) of soil and materials for predicting transfer and mobility
    of components including information on the following: ⎯ the procedure to predict
    leaching behaviour of components using KPs; ⎯ the method to determine KPs and
    the choice of leaching tests; ⎯ the limitations of predictions. In this respect,
    it is important to keep in mind that to simulate real field conditions from the
    results of leaching tests comprise many assumptions and simplifications. Leaching
    tests are designed and used for characterisation of soil and material as source
    term. It is possible to address transport term with sorption tests. The guidance
    of this International Standard is applicable to both source and transport terms
    that is based on advection-dispersion model. In this International Standard, when
    the term “soil” is only quoted to simplify the writing, the broader term “soil
    and materials” shall be considered.'
