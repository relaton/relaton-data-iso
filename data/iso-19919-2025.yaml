abstract:
- language: en
  script: Latn
  content: This document specifies an analytical method for the determination of silver
    on a material considered homogeneous. The silver content of the samples lies preferably
    between 50 ‰ (parts per thousand) and 990 ‰ (parts per thousand). Fineness above
    990,0 ‰ can be determined using a spectroscopy method by difference (see ISO 15096).
    NOTE            Lower contents of silver can be analysed according to this method.
