abstract:
- language: en
  script: Latn
  content: This document defines a test method used to determine the degree of disintegration
    of plastic materials in a pilot-scale aerobic composting test under defined conditions.
    It forms part of an overall scheme for the evaluation of the industrial compostability
    of plastics as outlined in ISO 17088. The test method laid down in this document
    is also used to determine the influence of the test material on the composting
    process and the quality of the compost obtained. This test method cannot be used
    to determine the aerobic biodegradability of a test material. NOTE Other methods
    are available for this test (for example, see ISO 14851, ISO 14852 or ISO 14855-1
    and ISO 14855-2).
