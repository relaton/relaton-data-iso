abstract:
- language: en
  script: Latn
  content: This document specifies tokenization methods in distributed ledger technologies
    (DLTs), including private DLTs, public permissioned DLTs, and public permissionless
    DLTs. It defines methodological requirements for tokenization and identifies the
    governance impacts, benefits, challenges and representative use cases associated
    with each DLT type. The scope is strictly limited to methodological aspects. It
    does not prescribe lifecycle models, asset taxonomies or jurisdiction-specific
    regulatory frameworks. Instead, it sets out governance-neutral criteria that enable
    tokenization to be secure, reliable, scalable and aligned with sustainability
    across diverse deployment contexts. This document provides a foundational, interoperable
    framework intended to support industry, regulators and technical committees, and
    to facilitate future collaboration and sector-specific adaptations.
