abstract:
- language: en
  script: Latn
  content: This document applies to the performance testing of compressor driven refrigerating
    systems (hereafter referred to as refrigerating systems) that operate according
    to the principle of vapour compression and consist of the circuit parts for compression,
    condensation, and evaporation as well as the connecting pipes and any necessary
    associated ancillaries required for a complete refrigeration circuit. This document
    does not apply to the testing of other refrigeration systems such as absorption
    or steam jet refrigerating systems. Testing of the suitability of a refrigerating
    system for a specific use, such as household refrigerators, refrigerated commercial
    and display cabinets, air conditioners, is not covered by this document. This
    document includes testing outside laboratories or where specific laboratory testing
    standards for systems do not exist and which is performed according to agreed
    operating conditions.
