abstract:
- language: en
  script: Latn
  content: This document establishes a generic framework for static analysis that
    can be referenced and used by all organizations involved in the development, test
    and maintenance of systems and software. It contains a generic process, activities,
    tasks, review techniques and documentation that are applied during the analysis
    of software specifications, source code. models or associated data. A supporting
    informative diagram describing the process is also provided. This document is
    intended for, but not limited to, project managers, development managers, quality
    managers, test managers, business analysts, developers, testers, and all those
    involved in the development, testing and maintenance of systems and software.
