abstract:
- language: en
  script: Latn
  content: ISO 17140:2014 specifies the conditions for the determination of properties
    at constant-amplitude of load or strain in uniaxial tension/tension or in uniaxial
    tension/compression cyclic fatigue of ceramic matrix composite materials (CMCs)
    with fibre reinforcement at room temperature. It applies to all ceramic matrix
    composites with fibre reinforcement, unidirectional (1D), bi-directional (2D),
    and tri-directional (xD, where 2 < x ≤ 3).
