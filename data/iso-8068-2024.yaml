abstract:
- language: en
  script: Latn
  content: 'This document specifies the minimum requirements for lubricants for turbines,
    as delivered. It is intended to be used in conjunction with ISO 6743-5. This document
    specifies the requirements for a wide variety of lubricants for the lubrication
    of most types of turbines for power generation, including steam turbines, gas
    turbines, single shaft combined cycle turbines with common lubrication system
    and hydraulic turbines. This document does not specify the requirements for lubricants
    for wind turbines, which are covered in ISO 12925-1. The following lubricants
    are considered: —     mineral oils, of either API groups I, II, II+, III, including
    group III from GTL (gas to liquid) process, and III+. Some API groups II and III
    are suitable for high temperature gas turbines; —     synthetic lubricants, esters
    (API group V) and polyalphaolefins (API group IV), intended for high temperature
    gas turbines; —     synthetic lubricants, esters (API group V) and polyalphaolefins
    (API group IV), environmentally acceptable for use in hydraulic turbines; —    
    fire resistant phosphate-ester type lubricants.'
