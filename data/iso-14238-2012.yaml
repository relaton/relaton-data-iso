abstract:
- language: en
  script: Latn
  content: This International Standard specifies laboratory procedures for measuring
    the mineralization and nitrification of nitrogen by the soil microbiota. For investigations
    on the evaluation of soil quality or on effects of contamination, a procedure
    is given to measure the rates and extent of N-mineralization in soil or soils
    of known or unknown quality. For investigation of the potential toxicity of chemicals
    to N-mineralization in soils, a simple procedure is given which allows the impact
    of single chemicals to be assessed and provides a basis for comparison of the
    toxicities of different chemicals.
