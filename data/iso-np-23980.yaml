abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for the qualification of setters
    for automatic mechanical joining of sheet materials in accordance with ISO/WD
    23982. The term “sheet”, as used in this document, includes extrusions, cast and
    moulded materials. This document can be applicable to: — combinations of metallic
    materials — metallic and non-metallic materials — combinations of non-metallic
    materials This can also include the use of adhesives applied to the sheets in
    combination with mechanical joining. The application of adhesives is not addressed
    by this document. This document applies to automatic joining of sheet materials
    for mass production, primarily, but not limited to, replacing traditional welding
    processes. This document does not apply to building fasteners or structural bolting
    for civil engineering applications which are covered by other application standards.
    Mechanical joining operators do not need to qualify to this document. The principles
    of this document may be applied to mechanical joining processes not listed in
    ISO/WD 5695.'
