abstract:
- language: en
  script: Latn
  content: ISO 2846-2:2007 specifies the colour and transparency to be produced by
    inks intended for four-colour coldset web offset printing when printed under specified
    conditions on a printability tester. It also describes the test method to ensure
    conformance. ISO 2846-2:2007 is not applicable to fluorescent inks and does not
    specify pigments (or spectral reflectance) so as not to preclude the use of suitable
    future pigment combinations and still claim compliance with its colorimetric requirements.
