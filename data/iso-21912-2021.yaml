abstract:
- language: en
  script: Latn
  content: This document provides principles and requirements for safe handling, treatment
    and storage of solid recovered fuels (SRF), prepared from non-hazardous waste,
    to be used for energy purposes. This document covers process stages from point
    of acceptance of material to point of delivery of SRF. This document excludes
    fuels that are included in the scope of ISO/TC 238 Solid biofuels and ISO/TC 28
    Petroleum products and related products of synthetic or biological origin. It
    uses a risk-based approach to determine what safety measures are to be considered.
    Although unloading and loading of e.g. vessels, trains or trucks are included,
    the safety issues following the loading and transport itself are not.
