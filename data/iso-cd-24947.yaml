abstract:
- language: en
  script: Latn
  content: This standard specifies the procedures and methods for the establishment
    of internal detection baselines, multiple rounds of multi-source data alignment,
    and data comparison and analysis of pipeline transportation systems in the oil
    and gas industry. This standard applies to pipelines for land transportation in
    the oil and gas industry. This standard does not apply to the process pipelines
    in the factories of oil refining, chemical and other enterprises.
