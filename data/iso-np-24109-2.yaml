abstract:
- language: en
  script: Latn
  content: This document specifies the measuring the impedance of solid electrolyte symmetric cells at temperatures up to 900 ℃ using electrochemical impedance spectroscopy (EIS) in a two-electrode configuration over a range of frequencies. This document is applicable to symmetric cells with solid electrolytes which have ionic transference numbers higher than 0,99 and is used for characterization of electrode materials, electrolyte materials, and their interface for various electrochemical devices, such as solid oxide electrochemical cells, electrochemical sensors, and all-solid-state batteries.
