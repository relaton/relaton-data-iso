abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1632:2006 specifies the application module for Assembly 2D
    shape. The following are within the scope of ISO/TS 10303-1632:2006: generic analysis
    input; generic analysis output; shock analysis input; shock analysis output; design;
    vibration analysis input; vibration analysis output; electromagnetic compatibility
    analysis input; electromagnetic compatibility analysis output; thermal analysis
    input; thermal analysis output; extruded shape class; manhattan shape class; generic
    shape class; planar assembly shape; planar assembly keepout shape; two dimensional
    shape properties of assemblies; items within the scope of application module Assembly
    technology, ISO/TS 10303-1649; items within the scope of application module Physical
    unit 2d design view, ISO/TS 10303-1724.'
