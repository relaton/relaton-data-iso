- language: en
  script: Latn
  content: ISO 22960:2008 specifies a molecular absorption spectrometric method using
    1, 10-phenanthroline for the determination of the mass fraction of iron in titanium
    and titanium alloys. The method is applicable to titanium and titanium alloys
    with a mass fraction of iron in the range from 0,005 % to 2,0 %.
