abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for acrylic hard type materials
    used as chairside denture base relining materials and the test methods to determine
    compliance with these requirements. This document also specifies requirements
    for packaging and marking the products and for the instructions for use to be
    supplied by the manufacturer. Dentures which are relined by chairside denture
    base relining materials specified by this document are limited to those of acrylic.
    This document is not applicable to either denture base relining materials that
    are for laboratory use or soft lining materials. NOTE 1    Acrylic hard type materials
    contain acrylic and methacrylic monomers such as acrylic acid esters and substituted
    (meth)acrylic acid esters and their polymers. NOTE 2    Acrylic dentures are made
    of polymers such as poly (acrylic acid esters), poly (substituted acrylic acid
    esters) and rubber-modified poly (methacrylic acid esters).
