abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of fibre length
    distribution parameters (principally mean length, expressed as Hauteur or Barbe,
    and the coefficient of variation of the measurement) on slivers and rovings made
    from combed wool or combed synthetic fibres. As the fibres of different chemical
    structure have different di-electric values, the method is not directly applicable
    to slivers made up of a blend of wool/synthetic fibres.
