abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 11801-4:2017(E) This document specifies generic cabling within
    a home and provides users with: - an application independent system capable of
    supporting a wide range of applications in a range of installation and operating
    environments; - a flexible scheme such that modifications are both easy and economical;
    - a multi-vendor supply chain within an open market for cabling components.'
