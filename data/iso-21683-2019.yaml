abstract:
- language: en
  script: Latn
  content: This document specifies a method for experimental determination of the
    release of nanoscale pigments and extenders into the environment following a mechanical
    stress of paints, varnishes and pigmented plastics. The method is used to evaluate
    if and how many particles of defined size and distribution under stress (type
    and height of applied energy) are released from surfaces and emitted into the
    environment. The samples are aged, weathered or otherwise conditioned to simulate
    the whole lifecycle.
