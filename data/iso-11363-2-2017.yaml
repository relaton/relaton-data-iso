abstract:
- language: en
  script: Latn
  content: ISO 11363-2:2017 specifies types, dimensions and principles of use of gauges,
    to be used in conjunction with the taper threads specified in ISO 11363-1 (i.e.
    17E and 25E threads). It provides examples of calculations for thread gauge dimensions
    on the large end diameter (Annex A) and draws attention to the limitations of
    the gauging system specified (Annex B).
