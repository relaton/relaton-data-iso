abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the design, installation and
    testing of engine-mounted and craft-mounted remote hydraulic steering systems
    used with single and multiple engine installations of outboard engines over 15 kW
    per engine, as well as with single and multiple engines of inboard, sterndrive,
    and water jet drives, all used on small craft. This document does not address
    emergency means of steering the craft.
