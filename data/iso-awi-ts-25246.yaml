abstract:
- language: en
  script: Latn
  content: 'This document specifies guidance and recommendations for infant sleep
    products primarily intended for use by babies aged under 12 months in the domestic
    environment that: a) are clearly intended for infants to sleep in or on (including
    soothing or settling); b) are intended to be worn by babies while sleeping or
    are used as bedding; c) are not primarily intended for sleeping in or on but in
    which babies are likely to sleep for short or long periods; d) are marketed for
    use in the sleeping environment as a sleep aid or monitoring device. The document
    includes detailed explanations that support the design guidance. Infant sleep
    products specifically designed and intended for use in settings where there is
    likely to be close supervision and physiological monitoring by health professionals,
    such as hospitals and child health clinics, are not covered by this document.
    This document includes three informative annexes: — Annex A Sudden unexpected
    death in infancy (SUDI) — Annex B Risk assessment — Annex C A safe sleeping environment'
