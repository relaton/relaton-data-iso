abstract:
- language: en
  script: Latn
  content: This document specifies and establishes the content of technical specifications
    (TS) for research and test reactors, including basic compartments to consider
    when building the technically comprehensive characteristics for radioactive waste
    and spent fuel management and parameters for decommissioning of previous operational
    and/or new fission research reactors. These compartments are limited in the document
    to only consider basic value-added areas of an organization detailing the appropriate
    logic and organizational pathways for the pre-decommissioning preparatory phase
    with crisscrossing synergistic operational activities. Outlining critical decommissioning
    tasks and waste stream agreements, as well as an enhanced control and safeguard
    end state culture and competencies for non-expansive organizational structures
    and significant student research turnover is a included for consideration in the
    document. This limited scope also includes needs-based radioactive waste management
    corridors and their implementation specific to high trafficked and unobstructed
    public campus locations or research centers. Specific safety and protection considerations
    include both Administrative and Operational activities, and waste management needs
    and storage activities during decommissioning relevant to the restricted areas
    of non-restricted public access and right of way campus or research center environments.
