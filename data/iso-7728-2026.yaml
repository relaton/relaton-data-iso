abstract:
- language: en
  script: Latn
  content: This document specifies the properties and characteristics of typical horizontal
    joints between two prefabricated ordinary concrete external wall components and
    a concrete floor. However, the characteristics of joints, which are involved in
    the structural behaviour of buildings, are not specified in this document. This
    document is applicable to all public or private buildings, used as dwellings,
    offices, educational or hospital premises.
