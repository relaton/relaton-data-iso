abstract:
- language: en
  script: Latn
  content: This test method applies to OEM windshields and other automotive glazing
    for road vehicles made from glass or glass/plastic combinations. It is used to
    determine fracture resistance to impact by sharp objects.The test method can be
    performed on material sample, component, or finished goods level. The test method
    does not encompass all-plastic windshields or after-market protective films.
