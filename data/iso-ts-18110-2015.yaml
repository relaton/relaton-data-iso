abstract:
- language: en
  script: Latn
  content: ISO/TS 18110:2015 aims to provide the necessary definitions that specify
    the bounds of key innovation indicators as they relate to nanotechnology, in order
    to facilitate and unify the global assessment of nanotechnology activities in
    different areas. The availability of these terms can help the measurement and
    comparison of various indicators in this field. This Technical Specification does
    not intend to redefine terms that are already defined in other ISO documents.
    Furthermore, there is no intention to show how the indicators can be used as an
    assessment tool.
