abstract:
- language: en
  script: Latn
  content: 'ISO 24516-3:2017 specifies guidelines for technical aspects, tools and
    good practices for the management of assets of wastewater networks to maintain
    value from existing assets. ISO 24516-3:2017 does not apply to the management
    of assets of treatment plants, which are also physically part of the wastewater
    system and can influence the management of network assets. NOTE 1 The management
    of the following individual assets will be covered by ISO 24516‑4: wastewater
    pumping stations, retention and detention in the network, wastewater treatment
    plants and sludge treatment facilities. ISO 24516-3:2017 includes examples of
    good practice approaches on the strategic, tactical and operational levels. ISO
    24516-3:2017 is applicable to all types and sizes of organizations and/or utilities
    operating wastewater networks, and all different roles/functions for the management
    of assets within a utility (e.g. asset owner/responsible body, asset manager/operator,
    service provider/operator). NOTE 2 Depending on the size and structure of an organization,
    the utility can decide to what extent it applies the guidance in this document,
    but in any case, the philosophy of this document remains applicable to small and
    medium utilities.'
