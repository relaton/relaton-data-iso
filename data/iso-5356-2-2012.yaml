abstract:
- language: en
  script: Latn
  content: 'ISO 5356-2:2012 specifies dimensional requirements for screw-threaded
    weight-bearing conical connectors intended for use with inhalation anaesthesia
    apparatus and ventilators. Such connectors are intended for mounting heavy accessories.
    ISO 5356-2:2012 specifies requirements for the following screw-threaded, weight-bearing
    conical connectors: 22 mm connectors; 22/15 mm coaxial connectors.'
