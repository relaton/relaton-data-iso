abstract:
- language: en
  script: Latn
  content: 'This document specifies additional specific safety requirements and test
    methods for Class B floating leisure articles for use on and in the water regardless
    whether the buoyancy is achieved by inflation or inherent buoyant material. This
    document is applicable for Class B floating leisure articles as specified in ISO 25649-1:2024,
    Table 1. Class B devices provide a buoyant structure with one or more body openings
    into which the user is positioned partly immersed. NOTE 1        Typical products
    in Class B (see Annex B): —      floating rafts with interior body holding system
    (“swim seats”) mostly in circular or square shape, fantasy shape for playing purposes;
    —      floating fantasy shaped structures with one or more openings to host a
    child’s body, with or without body holding system; —      floating with slits
    or openings to put legs through any shape; —      floating rings with interior
    seat segments inside the circular body opening. NOTE 2        Typical places for
    application: —      pools; —      protected areas of lakes, ponds; —      protected
    areas of sea shore (no offshore winds, no currents).'
