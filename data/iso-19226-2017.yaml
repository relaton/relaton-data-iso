abstract:
- language: en
  script: Latn
  content: ISO 19226:2017 provides a procedure for the evaluation of irradiation data
    in the region between the reactor core and the inside surface of the containment
    vessel, through the pressure vessel and the reactor cavity, between the ends of
    active fuel assemblies, given the neutron source in the core. NOTE These irradiation
    data could be neutron fluence or displacements per atom (dpa), and Helium production.
    The evaluation employs both neutron flux computations and measurement data from
    in-vessel and cavity dosimetry, as appropriate. This document applies to pressurized
    water reactors (PWRs), boiling water reactors (BWRs), and pressurized heavy water
    reactors (PHWRs). ISO 19226:2017 also provides a procedure for evaluating neutron
    damage properties at the reactor pressure vessel and internal components of PWRs,
    BWRs, and PHWRs. Damage properties are focused on atomic displacement damage caused
    by direct displacements of atoms due to collisions with neutrons and indirect
    damage caused by gas production, both of which are strongly dependent on the neutron
    energy spectrum. Therefore, for a given neutron fluence and neutron energy spectrum,
    calculations of the total accumulated number of atomic displacements are important
    data to be used for reactor life management.
