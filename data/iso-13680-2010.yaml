abstract:
- language: en
  script: Latn
  content: 'ISO 13680:2010 specifies the technical delivery conditions for corrosion-resistant
    alloy seamless tubulars for casing, tubing and coupling stock for two product
    specification levels: PSL-1, which is the basis of ISO 13680:2010; PSL-2, which
    provides additional requirements for a product that is intended to be both corrosion
    resistant and cracking resistant for the environments and qualification method
    specified in ISO 15156-3 and Annex G of ISO 13680:2010. At the option of the manufacturer,
    PSL-2 products can be provided in lieu of PSL-1. The corrosion-resistant alloys
    included in ISO 13680:2010 are special alloys in accordance with ISO 4948-1 and
    ISO 4948-2. ISO 13680:2010 is applicable to the following four groups of product:
    group 1, which is composed of stainless alloys with a martensitic or martensitic/ferritic
    structure; group 2, which is composed of stainless alloys with a ferritic-austenitic
    structure, such as duplex and super-duplex stainless alloy; group 3, which is
    composed of stainless alloys with an austenitic structure (iron base); group 4,
    which is composed of nickel-based alloys with an austenitic structure (nickel
    base). ISO 13680:2010 contains no provisions relating to the connection of individual
    lengths of pipe.'
