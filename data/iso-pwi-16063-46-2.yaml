abstract:
- language: en
  script: Latn
  content: 'This document specifies the instrumentation and procedure used for vibration
    calibration of rectilinear vibration transducer (with or without amplifier) to
    obtain the low-frequency complex sensitivity by machine vision systems. It is
    applicable to a frequency range from 0,01 Hz to 20 Hz and a dynamic range (amplitude)
    from 0,000 4 m/s2 (200 mm displacement peak-peak at 0,01 Hz) to 20 m/s2. NOTE:
    The lower limit of frequency range depends on the noise of the vibration transducer
    and the stroke of the vibrator. The lower limit of dynamic range depends on the
    noise of the vibration transducer and environmental noise.'
