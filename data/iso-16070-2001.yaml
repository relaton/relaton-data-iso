abstract:
- language: en
  script: Latn
  content: La présente Norme internationale définit les exigences en matière de mandrins
    à clefs d'ancrage et de sièges d'ancrage utilisés dans les complétions des puits
    producteurs ou injecteurs pour l'installation d'équipements de contrôle de débit
    ou d'autres équipements employés par les industries du pétrole et du gaz naturel.
    Elle prend en compte les filetages assurant l'interface entre les mandrins à clefs
    d'ancrage et les équipements de contrôle de débit et autres, mais ne couvre pas
    ceux assurant l'interface entre la colonne de tubes de production ou d'injection
    et les sièges d'ancrage.
