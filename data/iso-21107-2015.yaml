abstract:
- language: en
  script: Latn
  content: ISO 21107:2015 establishes a search structure and properties vocabulary
    for identifying rolling bearings, bearing housings, accessories and spherical
    plain bearings primarily with the aid of electronic media, such as the Internet.
    The methodology for using this International Standard in search programs is not
    included. ISO 21107:2015 does not establish a search structure and an attribute
    vocabulary for identifying linear motion rolling bearings. NOTE A reference dictionary
    for all rolling bearings in this document is defined in ISO/TS 23768‑1. It contains
    definitions of bearing classes, data element types of descriptive properties and
    domains of values.
