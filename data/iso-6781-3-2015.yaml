abstract:
- language: en
  script: Latn
  content: ISO 6781-3:2015 specifies the qualifications and competence requirements
    for personnel who (i) perform thermographic investigations on buildings, (ii)
    interpret the data emanating from thermographic investigations, and (iii) report
    the results of thermographic investigations. ISO 6781-3:2015 provides the basis
    for a statement of conformity, in three classes, of the knowledge, skills and
    abilities of individuals to perform thermographic measurements, analysis and reporting
    of results for small buildings, residential buildings, and commercial and institutional
    buildings. ISO 6781-3:2015 is not applicable to specialized equipment or other
    specific situations.
