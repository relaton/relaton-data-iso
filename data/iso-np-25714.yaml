abstract:
- language: en
  script: Latn
  content: This standard delves into the types of items (evidence materials) and their
    recovery from the scene (place of assault, victim and suspect) in sexual assault
    cases, prepared by incorporating relevant information deduced from the recommendations
    and best practices on the recovery of forensic evidence in sexual assault cases
    published by professional organisations and the research publications on the subject.
    This standard shall facilitate the investigators, forensic medical examiners,
    forensic science personals while processing the items of forensic potential, and
    the prosecutors and judiciary during judicial appraisal of the forensic testimony.
    Standardization shall reduce variations in forensic practices, minimize errors,
    ensure consistency, interoperability and comparability of forensic analysis outcome,
    and shall enhance the reliability of forensic testimony in legal proceedings imbibing
    the trust in the society. This standard shall prompt the stakeholders of criminal
    justice functionaries to remain cognizant of the latest practices applicable in
    dealing with the sexual assault cases and contribute in delivering justice to
    the victims and innocent suspects.
