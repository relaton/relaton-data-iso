abstract:
- language: en
  script: Latn
  content: This document describes a test that determines the rate of leakage of ambient
    (cold) and medium (warm) temperature smoke from one side of door and shutter assemblies
    to the other under the specified test conditions. This test method is applicable
    to door and shutter assemblies and self-closing operable glazed elements of different
    configurations intended for the purpose of controlling the passage of smoke in
    case of fire. Wherever door and shutter assemblies are referred to in this document,
    it also applies to self-closing glazed elements. The fire resistance of glazed
    elements is determined by tests in accordance with ISO 3009. The acceptable leakage
    rates for different situations are not addressed in this document, but rather
    are specified by the regulations of the controlling authorities.
