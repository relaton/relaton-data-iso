abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for qualification of welding operators
    and weld setters for mechanized and automatic welding of metallic materials. This
    document does not apply to personnel who: —     do not control or adjust welding
    parameters; —     are not involved in the setup of welding equipment. Qualification
    of welding operators and weld setters for friction stir welding and friction stir
    spot welding are covered by ISO 25239-3 and ISO 18785-3, respectively.'
