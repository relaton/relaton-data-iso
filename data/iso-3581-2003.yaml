abstract:
- language: en
  script: Latn
  content: ISO 3581 specifies requirements for classification of covered electrodes,
    based on the all-weld metal chemical composition, the type of electrode covering
    and other electrode properties, and the all-weld metal mechanical properties,
    in the as-welded or heat-treated conditions, for manual metal arc welding of stainless
    and heat-resisting steels. It is a combined standard providing for classification
    utilizing a system based upon classification according to nominal composition,
    or utilizing a system based upon classification according to alloy type.
