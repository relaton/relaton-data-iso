abstract:
- language: en
  script: Latn
  content: 'ISO/TS 13399-310:2017 carbide tips, together with the usage of the related
    properties and domains of values. ISO/TS 13399-310:2017 carbide tips, together
    with the usage of the related properties and domains of specifies a common way
    of designing simplified models that contain the following: - definitions and identifications
    of the design features of turning tools with carbide tips, with a link to the
    properties used; - definitions and identifications of the internal structure of
    the 3D model that represents features and properties of turning tools with carbide
    tips. The following are outside the scope of this document: - applications where
    these standard data can be stored or referenced; - creation and exchange of simplified
    3D models for cutting tools; - creation and exchange of simplified 3D models for
    cutting items; - creation and exchange of simplified 3D models for other tool
    items not being described in the scope of this document; - creation and exchange
    of simplified 3D models for adaptive items; - creation and exchange of simplified
    3D models for assembly items and auxiliary items.'
