abstract:
- language: en
  script: Latn
  content: This document describes the conditions for performing, validating and safeguarding
    non-target-screening of small organic compounds in water (drinking water, ground
    water and surface water) by chromatographic separation techniques with by mass
    spectrometry. This document can be applied to both liquid chromatography with
    high resolution mass spectrometry and gas chromatography with mass spectrometry.
    Both high and low resolution mass spectrometry can be applied, sometimes with
    some specific rules depending on the technique used with gas chromatography. The
    ISO 13808 serie is divided in three parts. The first part gives fundamental aspects
    in the use of chromatography in combination with mass spectrometry for non-target
    screening of small organic compounds in water. The second part gives the ultimate
    working procedure of non-target screening with liquid chromatography with high
    resolution mass spectrometry. The third part gives ultimate working procedure
    of non-target screening with gas chromatography with mass spectrometry. The second
    and third parts of this document refer to the reader to these guidelines for the
    basic principles of the method and for the configuration of the instruments. This
    first part of ISO 13808 serie is intended to show fundamental aspects in the use
    of chromatography in combination with mass spectrometry for non-target screening
    of small organic compounds in water drinking water, ground water, surface water.
    The standard can be applied to both liquid chromatography with high resolution
    mass spectrometry and gas chromatography with mass spectrometry. Both high and
    low resolution mass spectrometry can be applied with gas chromatography, sometimes
    with some specific rules depending on the technique used. The ultimate working
    procedure of non-target screening is described in two separated International
    Standard and provides criteria for carrying out, validating and safeguarding non-target
    screening. The individual parts of this Internal Standard refer to the reader
    to these guidelines for the basic principles of the method and for the configuration
    of the instruments.
