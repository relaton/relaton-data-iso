abstract:
- language: en
  script: Latn
  content: This document defines basic terms, symbols, and units of measurement for
    the field of laser technology in order to unify the terminology and to arrive
    at clear definitions and reproducible tests of beam parameters and laser-oriented
    product properties. NOTE The laser hierarchical vocabulary laid down in this document
    differs from that given in IEC 60825?1. ISO and IEC have discussed this difference
    and agree that it reflects the different purposes for which the two standards
    serve. For more details, see informative Annex A.
