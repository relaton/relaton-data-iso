abstract:
- language: en
  script: Latn
  content: 'ISO 1461:2009 specifies the general properties of coatings and test methods
    for coatings applied by dipping fabricated iron and steel articles (including
    certain castings) in a zinc melt (containing not more than 2 % of other metals).
    It does not apply to the following: sheet, wire and woven or welded mesh products
    that are continuously hot dip galvanized; tube and pipe that are hot dip galvanized
    in automatic plants; hot dip galvanized products (e.g. fasteners) for which specific
    standards exist and which might include additional requirements or requirements
    which are different from those of ISO 1461:2009. After-treatment/over-coating
    of hot dip galvanized articles is not covered by ISO 1461:2009.'
