abstract:
- language: en
  script: Latn
  content: 'TermBase eXchange (TBX), as specified in ISO 30042, comprises a framework
    consisting of two interacting components: a core structure and a formalism for
    defining data category modules. ISO 30042 describes the elements and attributes
    of the TBX core structure. This document provides an overview of schemas or alternative
    representations that can be developed based on the information described in ISO 30042.
    Individual validation schemas or alternative representations are described in
    individual Technical Reports in the ISO 24633 series. This document does not include
    details for creating schemas or alternative representations for any particular
    TBX dialect.'
