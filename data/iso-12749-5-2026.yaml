abstract:
- language: en
  script: Latn
  content: This document encompasses the collection of terms, definitions, notes to entry and examples corresponding to nuclear reactors, excluding quantitative data. It provides the minimum essential information for each nuclear reactor concept represented by a single term. Full understanding of concepts requires background knowledge of the nuclear field. It is intended to facilitate communication and promote common understanding. The scope of this document does not cover nuclear fusion reactors. NOTE            See Annex A for the methodology used to develop the vocabulary.
