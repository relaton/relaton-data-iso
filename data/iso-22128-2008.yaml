abstract:
- language: en
  script: Latn
  content: ISO 22128:2008 identifies and describes a wide range of terminology products
    and services so that suppliers of these products and services and their clients
    can have a common understanding as well as shared expectations in their delivery.
    This International Standard outlines some of the generally-accepted terminology
    practices to be followed in the development and delivery of terminology products
    and services as well as some of the desired quality features that should characterize
    the products and services produced. ISO 22128:2008 is intended as guidance for
    work contracts in the field of terminology. This International Standard focuses
    on terminology in specialized language as opposed to general language resources.
