abstract:
- language: en
  script: Latn
  content: This document specifies the test methods for coating adhesion of sputtered
    silver layer coating for electrical, electronic, optical and other engineering
    applications. Engineering applications are defined as those in which the coating
    essentially serves a non-decorative purpose. Although the appearance and serviceability
    of the sputtered silver coating depends on the condition of the basis material,
    this document does not specify the condition, finish or surface roughness of the
    basis material prior to the deposition. Therefore, it is the responsibility of
    the purchaser to specify the surface finish and roughness of the basis material
    in order to conform to the product requirements. This document specifies the test
    methods of coatings on sheets and the flat objects. However, it does not apply
    to coatings on screw threads, strip or wire in the non-fabricated form.
