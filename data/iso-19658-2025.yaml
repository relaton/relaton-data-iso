abstract:
- language: en
  script: Latn
  content: 'This document specifies procedures for validating the characterization
    methods for physical properties of sludge. The method applies to sludges and suspensions
    from: —     storm water handling; —     urban wastewater collecting systems; —    
    urban wastewater treatment plants; —     industrial wastewater that has been treated
    similarly to urban wastewater; —     water supply plants. In accordance with ISO/TC 275
    scope this document is applicable to sludge and products from urban wastewater
    collection systems, night soil, storm water handling, water supply treatment plants,
    wastewater treatment plants for urban and similar industrial waters. This document
    is applicable to all sludge that can have similar environmental and/or health
    impacts with exclusion of hazardous sludge from industry and dredged sludge.'
