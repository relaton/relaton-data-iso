abstract:
- language: en
  script: Latn
  content: ISO 24333:2009 specifies requirements for the dynamic or static sampling,
    by manual or mechanical means, of cereals and cereal products, for assessment
    of their quality and condition. It is applicable to sampling for the determination
    of heterogeneously distributed contaminants, undesirable substances, and parameters
    usually homogeneously distributed like those used to assess quality or compliance
    with specification. It can be used to determine insects in a grain lot. It is
    applicable to sampling for assessment of the quality and condition of lots of
    genetically modified organisms (GMO) but is inappropriate for the determination
    of the presence of adventitious genetically modified material in non-GM product.
    It is not applicable to seed grain.
