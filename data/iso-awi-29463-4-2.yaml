abstract:
- language: en
  script: Latn
  content: 'ISO 29463-4:2011 specifies the test procedure of the "scan method", considered
    to be the reference method, for determining the leakage of filter elements. It
    is applicable to filters ranging from classes ISO 35 H to ISO 75 U. ISO 29463-4:2011
    also describes the other normative methods: the oil thread leak test and the photometer
    leak test, applicable to classes ISO 35 H to ISO 45 H HEPA filters, and the leak
    test with solid PSL aerosol. ISO 29463-4:2011 is intended for use in conjunction
    with ISO 29463-1, ISO 29463-2, ISO 29463-3 and ISO 29463-5.'
