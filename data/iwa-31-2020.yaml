abstract:
- language: en
  script: Latn
  content: This document gives guidelines for integrating and using ISO 31000 in organizations
    that have implemented one or more ISO and IEC Management System Standards (MSS),
    or that have decided to undertake a project implementing one or more MSS incorporating
    ISO 31000. This document explains how the clauses of ISO 31000 relate to the high
    level structure (HLS) for MSS. This document does not provide guidance on implementing
    a management system in general. It does not specify requirements of a MSS. It
    does not provide a summary of ISO 31000; however, it does, as explained above,
    provide the background for understanding ISO 31000. Using this document does not
    remove the need to use other standards to address specific aspects of risk.
