abstract:
- language: en
  script: Latn
  content: The purpose of this guideline is to provide a method for assessing the
    power saving achieved from wind propulsion technology. “Power saving" means the
    power consumption of a ship while utilizing a wind propulsion technology, compared
    to that of a corresponding ship not using wind propulsion, for the same ship speed.
    This guideline is applicable to displacement vessels with wind-assisted propulsion
    system that can maintain its intended speed even when contribution from wind propulsion
    is small or zero. Sailing yachts, racing boats or traditional sailing vessels
    are not in the scope of this guideline. The minimum trial program can be conducted
    within one day and includes around 5 wind conditions. The scope can be extended
    to include a larger number of conditions and be conducted over a longer period
    of time during operation. The sea trial result in power saving assessments at
    a discrete number of ship’s speeds, wind speeds, wind directions and draughts.
