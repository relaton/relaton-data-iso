abstract:
- language: en
  script: Latn
  content: This document specifies fuse-links for the use in road vehicles. It establishes,
    for these fuse-link types, the rated current, test procedures, performance requirements
    and dimensions. This document is applicable to fuse-links with a rated voltage
    up to 1.000V AC / 1.500V DC, a current rating of ≤ 1.500 A and a minimum rated
    breaking capacity of 20.000 A intended for use in road vehicles. This document
    is intended to be used in conjunction with ISO 8820-1 and with ISO 8820-2. The
    numbering of its clauses corresponds to that of ISO 8820-1 whose requirements
    are applicable, except where modified by requirements particular to this document.
