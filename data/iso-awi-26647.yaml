abstract:
- language: en
  script: Latn
  content: This document specifies terms and definitions commonly used in the meetings
    industry. The terms cover categories such as individuals and entities involved
    in meetings, types of meetings, meeting-related activities, services and operational
    processes, physical items and facilities, and other relevant concepts. The document
    is intended to facilitate a common understanding of the terminology used in the
    planning, organization, management, evaluation, and communication of meetings
    and related activities. This document is applicable to meeting organizers, venue
    operators, service providers, sponsors, governmental bodies, industry associations,
    and other stakeholders involved in meeting activities.
