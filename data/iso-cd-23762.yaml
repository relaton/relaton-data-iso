abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and test methods for enhanced visibility
    clothing which is capable of visually signalling the wearer’s presence. Such clothing
    is intended to provide conspicuity of the wearer under any daylight conditions
    and/or under illumination by vehicles headlights or searchlights in the dark.
    This document is applicable to medium-risk situations. Performance requirements
    are included for colour and retroreflection, and specifications for the minimum
    areas and placement of the materials in protective clothing are provided. This
    document is not applicable to: - high visibility clothing in high risk situations,
    which is covered in ISO 20471:2013 (see Annex A); - visibility equipment specifically
    intended for the head, hands, and feet, e.g., helmets, gloves, and shoes; - equipment
    integrating active lighting, e.g., LEDs; - garments with retroreflective and/or
    luminescent elements included only for reasons of design or decoration.'
