abstract:
- language: en
  script: Latn
  content: ISO 8049:2016 defines a method of sampling for analysis of ferronickel
    lots in the form of shot as specified in ISO 6501 in those cases where lots are
    constituted either heat by heat or by taking from blended stock. The purpose is
    to determine the contents of the various elements - either from slugs by physical
    analysis methods (such as X-ray fluorescence or emission spectral analysis), or
    - from chips by dry methods (carbon, sulfur) or chemical analysis (other elements).
