abstract:
- language: en
  script: Latn
  content: 'This document specifies additional specific safety requirements and test
    methods for Class A floating leisure articles for use on and in the water regardless
    whether the buoyancy is achieved by inflation or inherent buoyant material. This
    document is applicable for Class A floating leisure articles as specified in ISO 25649-1:2024,
    Table 1. NOTE 1        Typical products in Class A (see Figures A.1 to A.3): —     
    “Floating Islands” in near round or square shaped forms decorated with palm tree,
    sun shade, etc. high superstructure; —      large floats/rafts in various shapes,
    from round to square; —      large floating tubes, giant tubes (inflatable or
    inherently buoyant); —      floating arm chairs, seats and sun beds; —      air
    mattresses for use on the water; —      recreational rafts/floating platforms/pontoons.
    NOTE 2        Typical places for application: —      pools; —      protected areas
    of lakes, ponds; —      protected area sea shore (no offshore winds, no currents).'
