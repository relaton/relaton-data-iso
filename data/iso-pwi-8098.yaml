abstract:
- language: en
  script: Latn
  content: This document specifies safety and performance requirements and test methods
    for the design, assembly and testing of fully assembled bicycles and sub-assemblies
    for young children. It also provides guidelines for instructions on the use and
    care of the bicycles. This document is applicable to bicycles with a maximum saddle
    height of more than 435 mm and less than 635 mm, propelled by a transmitted drive
    to the rear wheel. It is not applicable to special bicycles intended for performing
    stunts (e.g. BMX bicycles). NOTE      For bicycles with a maximum saddle height
    of 435 mm or less, see national regulations for ride-on toys, and with a maximum
    saddle height of 635 mm or more, see ISO 4210-1 to ISO 4210-9.
