abstract:
- language: en
  script: Latn
  content: This document defines Type F1, Type F2 and Type F3 software measurement
    standards, for verifying instruments and analysis software. It introduces the
    concept of mathematical softgauge (Type F3) that is based upon mathematics and
    is independent from implementation arbitrary choices. Type F1 traceable softgauges
    and Type F2 traceable software are derived from the Type F3 mathematical softgauges.
