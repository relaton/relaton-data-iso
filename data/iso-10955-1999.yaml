abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies the characteristics, the inspection
    and test methods as well as the quality assurance requirements for: end-fittings
    swaged on wire ropes, as specified in ISO 9737, ISO 9747, ISO 9748, ISO 9749,
    ISO 9759 and ISO 9760, wire rope turnbarrel parts, as specified in ISO 9736, ISO
    9738, ISO 9757, ISO 9758 and ISO 9761, and wire rope turnbarrel assemblies (as
    defined in 3.1), used in aircraft controls. This International Standard is applicable
    to the parts cited above providing that reference is made to it in the product
    standard or the definition document.'
