abstract:
- language: en
  script: Latn
  content: ISO 8317:2015 specifies performance requirements and test methods for reclosable
    packages designated as resistant to opening by children. Acceptance criteria are
    given for the packages when tested by specified methods. These methods not only
    provide a measure of the effectiveness of the packaging in restricting access
    by children, but also cover the accessibility to the contents by adults. ISO 8317:2015
    is applicable to reclosable packages for any product intended to be exposed or
    removed from the packaging in normal use. ISO 8317:2015 is intended for type approval
    only and is not intended for quality assurance purposes.
