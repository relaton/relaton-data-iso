abstract:
- language: en
  script: Latn
  content: ISO 3315:2011 is applicable to the driving parts of hand-operated square
    drive socket wrenches identified in ISO 1703 under designations 6 1 00 04 0, 6
    1 00 06 0, 6 1 00 06 1, 6 1 00 09 0, 6 1 00 10 0, 6 1 00 10 1, 6 1 00 01 0, 6
    1 00 01 1, 6 1 00 03 0, 6 1 00 05 0 and 6 1 00 05 1. ISO 3315:2011 specifies the
    overall dimensions, the minimum Rockwell hardness value for their squares, the
    method of torque testing, the minimum torsional strength values, the method endurance
    of testing for ratchet handles, designation and marking.
