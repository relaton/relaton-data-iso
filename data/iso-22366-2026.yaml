abstract:
- language: en
  script: Latn
  content: This document provides the framework and principles for the energy resilience
    of organizations, to help reduce impacts and ultimately achieve a build back better
    goal after disruptive events, including natural and human-made disruptions. It
    covers broad resilience engineering and management principles applicable to an
    energy supply network that includes social and technical considerations. This
    document does not provide guidance on the application of these principles for
    engineering design, which require specialized considerations to address risks
    and define resilience measures. This document is intended to be used by organizations
    responsible for, or participating in, energy supply networks.
