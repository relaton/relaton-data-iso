abstract:
- language: en
  script: Latn
  content: ISO 19160-1:2015 defines a conceptual model for address information (address
    model), together with the terms and definitions that describe the concepts in
    the model. Lifecycle, metadata, and address aliases are included in the conceptual
    model. The model is presented in the Unified Modeling Language (UML). The model
    provides a common representation of address information, independent of actual
    addressing implementations. It is not intended to replace conceptual models proposed
    in other specifications, but provides a means to cross-map between different conceptual
    models for address information and enables the conversion of address information
    between specifications. The model provides a basis for developing address specifications
    by individual countries or communities.
