abstract:
- language: en
  script: Latn
  content: This document gives general guidance on evaluating the sources of error
    in optical transfer function (OTF) equipment and in using this information to
    estimate errors in a measurement of OTF. It also gives guidance on assessing and
    specifying a general uncertainty for a specific measuring equipment, as well as
    recommending methods of routine assessment. The main body of this document deals
    exclusively with the modulation transfer function (MTF) part of the OTF. The phase
    transfer function (PTF) is dealt with relatively briefly in Annex A.
