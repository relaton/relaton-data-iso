abstract:
- language: en
  script: Latn
  content: La présente partie de l'ISO 15136 donne les lignes directrices et exigences
    d'une pompe à cavités progressantes (PCP) de fond de puits utilisée dans l'industrie
    du pétrole et du gaz naturel pour la production de fluides mono ou multiphasiques.
    La présente partie de l'ISO 15136 traite de la pompe à cavités progressantes de
    fond de trou. Elle fait référence, mais ne traite pas, des composants intermédiaires
    et accessoires nécessaires pour constituer une unité de pompage complète. Elle
    exclut les exigences d'expédition, de chargement et de transport.
