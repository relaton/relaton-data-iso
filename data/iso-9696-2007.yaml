abstract:
- language: en
  script: Latn
  content: ISO 9696:2007 specifies a method for the determination of gross alpha activity
    in non-saline waters for alpha‑emitting radionuclides which are not volatile at
    350 °C. It is possible to determine supported volatile radionuclides measured
    to an extent determined by half-life, matrix retention (of the volatile species)
    and the duration of measurement (counting time). The method is applicable to raw
    and potable waters.
