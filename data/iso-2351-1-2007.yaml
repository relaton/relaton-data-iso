abstract:
- language: en
  script: Latn
  content: ISO 2351-1:2007 prescribes the technical specifications for machine-operated
    screwdriver bits for slotted head screws. It applies to bits with male hexagon
    drive or with cylindrical flat end drive as defined in ISO 1173, and to tips for
    screwdrivers Type C as defined in ISO 2380-1. It also gives recommended combinations
    between tips and bits.
