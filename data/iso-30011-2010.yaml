abstract:
- language: en
  script: Latn
  content: ISO 30011:2010 specifies a procedure for the use of quadrupole inductively
    coupled plasma mass spectrometry (ICP‑MS) for analysing test solutions prepared
    from samples of airborne particulate matter collected as specified in ISO 15202‑1.
    Method development, performance checks, and a routine analysis method are specified.
    Test solutions for analysis by ISO 30011:2010 are prepared as specified in ISO
    15202‑2. ISO 30011:2010 is applicable to the assessment of workplace exposure
    to metals and metalloids for comparison with limit values.
