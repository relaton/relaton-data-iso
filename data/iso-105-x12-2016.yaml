abstract:
- language: en
  script: Latn
  content: ISO 105-X12:2016 specifies a method for determining the resistance of the
    colour of textiles of all kinds, including textile floor coverings and other pile
    fabrics, to rubbing off and staining other materials. The method is applicable
    to textiles made from all kinds of fibres in the form of yarn or fabric, including
    textile floor coverings, whether dyed or printed. Two tests may be made, one with
    a dry rubbing cloth and one with a wet rubbing cloth.
