abstract:
- language: en
  script: Latn
  content: Specifies for bicycles for young children safety and performance requirements
    concerning design, assembly and testing of bicycles and bicycles components. Gives
    guides for their use and maintenance. Applies to bicycles having a saddle height
    between 435 mm and 635 mm maximum, and a transmitted drive to the rear wheel.
