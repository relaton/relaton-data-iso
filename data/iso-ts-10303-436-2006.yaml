abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-436:2006 specifies the application module for AP236 furniture
    catalog and interior design. The following are within the scope of ISO/TS 10303-436:2006:
    representation of catalog product data definition; supporting of catalog product
    stucture; possibility of variants and options for product representations; products
    classification and products specification associated control; produtcs dimensions;
    price lists based on products identification and associated characteristics; product
    configuration based on diferent characteristics; multi-language support; approval
    status of the products; effectivity for data validation; documents definition
    and assignment; product manufacturing configuration; advanced boundary representation,
    faceted boundary representation, manifold surfaces with topology, geometrically
    bounded surface, geometrically bounded wireframe 2d and 3d geometry, wireframe
    with topology, and constructive solid geometry; product geometry including advanced
    boundary representation, faceted boundary representation, manifold surfaces with
    topology, geometrically bounded surface, geometrically bounded wireframe 2d and
    3d geometry, wireframe with topology, and constructive solid geometry; product
    geometric validation properties, for the assessment of the quality of conversions
    that occur in a transfer of geometric data; product geometric tolerance; parameterized
    properties for products based on expressions and using property values; establishment
    of relationships between product variables and properties; components of building
    elements for decoration projects; building elements for decoration projects such
    as walls, beams and columns; space elements for decoration projects such as rooms
    and gangways; construction elements which define the structure of buildings for
    decoration projects; location of building items in the decoration project; product
    placement for definition of interior decoration project.'
