abstract:
- language: en
  script: Latn
  content: This document provides organizations with guidance for managing the risk
    of money laundering in their operations, supply chains and wider operating context.
    Recognising the complexity and sensitivity of money laundering, this guidance
    uses a risk-based approach to help organizations understand the risk of money
    laundering, use and build appropriate leverage to manage and reduce this risk
    as part of their legal and non-legal frameworks, and go beyond their legal and
    statutory duties. This standard would be applicable to all types and sizes of
    organizations.
