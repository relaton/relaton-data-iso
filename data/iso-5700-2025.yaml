abstract:
- language: en
  script: Latn
  content: This document specifies a static test method and the acceptance conditions
    for roll-over protective structures (cab or frame) of wheeled or tracked tractors
    for agriculture and forestry as described in ISO 12934:2021, 3.2.1. It is applicable
    to tractors having at least two axles for wheels mounted with pneumatic tyres,
    or having tracks instead of wheels, with an unballasted tractor mass of not less
    than 600 kg and a minimum track width of the rear wheels greater than 1 150 mm.
    It is not applicable to tractors having a mass ratio (maximum permissible mass
    / reference mass) greater than 1,75.
