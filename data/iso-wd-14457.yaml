abstract:
- language: en
  script: Latn
  content: 'ISO 14457 specifies requirements and test methods for handpieces and motors
    used in dentistry for treatment of patients and having patient contact, regardless
    of their construction. It also specifies requirements for manufacturer’s information,
    marking and packaging. This document is applicable to the following: a) straight
    and angle handpieces; b) high-speed air turbine handpieces; c) air motors; d)
    electrical motors; e) prophy handpieces.'
