abstract:
- language: en
  script: Latn
  content: This International Standard specifies the requirements for the automated
    systematic sampling of moving oilseeds (flowing or falling stream) using mechanical
    methods, for the purpose of obtaining representative unbiased samples used for
    assessing the quality and condition of a consignment (3.8.) of oilseeds. The automated
    mechanical sampling systems and the prescribed methods described in this standard
    provide consistent and unbiased sampling of a flowing grain stream. This standard
    does not apply to the sampling of seed grain (used for propagation). This standard
    is applicable to small oilseeds such as canola, rapeseed, flax, mustard, soybean,
    sunflower, soybean and safflower. It is not applicable to large oilseeds such
    as copra or palm kernels. The sampling device shall not discriminate the product
    by particle size or damage the product being sampled. Annex A presents equipment
    used in automatic sampling systems of moving oilseeds. These devices allow the
    oilseeds to move freely without introducing bias to the sampling process. Annex
    B presents the recommended manual instrument and the process used to reduce the
    bulk sample (3.7.) mass to produce the laboratory sample (3.13.). Annex C presents
    automated sampling equipment that could introduce bias in the sampling, if not
    used for sampling conditioned oilseed lot (3.14.)s and/or operating under specific
    programs. Annex D presents a manual divider equipment that could introduce bias
    in the sampling, if not used correctly.
