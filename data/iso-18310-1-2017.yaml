abstract:
- language: en
  script: Latn
  content: ISO 18310-1:2017 specifies suitable methods for the measurement of ambient
    dose equivalent rate at a distance from the patient treated with radioiodine to
    ablate the thyroid. For this purpose, direct measurement of the ambient dose equivalent
    rate due to the inpatients using an ionization chamber (or other suitable devices)
    may be employed. ISO 18310-1:2017 addresses the measurement methods, the calibration
    of ionization chamber and the uncertainty estimation for the measurement of the
    ambient dose equivalent rate of the patient treated with radioiodine to ablate
    the thyroid using the ionization chamber.
