abstract:
- language: en
  script: Latn
  content: 'La présente prénorme définit les interfaces permettant la compensation
    entre exploitants et elle donne un plan type pour la structure des messages communs
    et des données à utiliser sur les interfaces. Elle a pour objectif de permettre
    le transfert des paiements et des données concernant le recouvrement automatique
    des droits (AFC) 1) entre différents systèmes de paiement d''une part, et entre
    des exploitants différents d''autre part, comme des agents collecteurs, des opérateurs
    de compensation ou des prestataires de services de transport publics et privés.
    La présente prénorme peut s''appliquer à : a) différents modes de paiement (par
    exemple pré-paiement, post-paiement) ; b) une grande variété de services de transport
    et de services liés au transport (péage, stationnement, ferry/pont/tunnel, transport
    public, paiement pour guidage routier, etc.) ; c) des services d''exploitants
    (coordination entre des collecteurs d''argent et des points de paiement, etc.)
    ; d) la sécurité et la confidentialité. Il n''est pas dans l''objet de la présente
    prénorme de définir des procédures administratives et des structures organisationnelles.
    La spécification d''un système de paiement interopérable à une plus grande échelle
    (paneuropéenne par exemple) est en dehors du domaine d''application de la présente
    prénorme. Dans la présente prénorme ne sont pas décrits les participants indirects
    (extérieurs) comme les autorités promulguant la législation générale ou particulière
    relative au systè 269me de paiement et autres règlements nationaux. Les modèles
    présentés dans la présente prénorme sont génériques. Des systèmes simples (systèmes
    fermés) peuvent être conçus en sélectionnant des sous-ensembles du plan type d''interface
    défini ici.'
