abstract:
- language: en
  script: Latn
  content: This document specifies criteria and provides guidance for the development and assessment of AI-ready interoperability specifications for data-driven agrifood systems. It addresses the information and interface descriptions needed for AI agents, acting with appropriate authorization, to discover resources, establish connections, interpret data consistently, invoke operations and verify results across organizational and technical boundaries. The document covers machine-readable resource and capability discovery; interface contracts and versioning; semantic definitions and mappings; identifiers, units and reference systems; provenance and data-quality metadata; machine-actionable access and usage policies; trust and verifiable claims; and conformance-assessment guidance for the specification being drafted. It requires a specification to identify which workflow stages it covers and the external specifications on which it relies. Illustrative agrifood use cases include input recommendations and verification of supply-chain claims. The document does not define a universal agrifood API, prescribe a particular AI model or agent architecture, replace horizontal standards for AI governance, identity or cybersecurity, or establish legal obligations for data sharing. It is intended for standard developers and may also inform implementers and reviewers.
