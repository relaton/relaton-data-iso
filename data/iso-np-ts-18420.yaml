abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the reporting of equivalent dose
    (De) determinations and luminescence dating results deduced from such equivalent
    doses. The most commonly employed technique in geosciences and archaeology is
    the SAR-OSL protocol for quartz mineral separates. However, such data reporting
    requirements applies to luminescence dosimetric method.
