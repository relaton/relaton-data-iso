abstract:
- language: en
  script: Latn
  content: 'This document specifies a mechanical performance testing procedure for
    cover glass used in automotive display modules. The document focuses on the quantification
    of surface fracture stress after flaw introduction via Oscillating Taber abrasion
    similar to ASTM F735. After abrasion, the retained surface fracture load is measured
    with the method documented in ASTM C1499 and converted appropriately to failure
    stress. The failure stresses are plotted using a Weibull distribution for communication
    of strength statistics. NOTE: The actual display product strength required to
    survive an impact test is largely dependent on the construction, supporting structure,
    its deformation while in use as installed into a vehicle. It is recommended to
    quantify stress in a glass cover lens component using commercially available FEA
    software to understand what stress a glass component may need to survive. The
    strength evaluation results obtained by the test procedure described in this document
    may not directly correlate to the durability of a final display product as installed
    in the cabin compartment.'
