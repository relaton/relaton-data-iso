abstract:
- language: en
  script: Latn
  content: 'This Standard specifies the measurement of displacements by means of geodetic
    instruments carried out for geotechnical monitoring. It refers to position measurements
    where a signal travels through air/the atmosphere between an instrument and a
    measuring point (target). General rules of performance monitoring of the ground,
    of structures interacting with the ground, of geotechnical fills and of geotechnical
    works are presented in ISO 18674 1:2015. This document is applicable to measurements
    by means of:  Tachymeter (manual or robotic)  level In informative annexes,
    this document also refers to principles of some techniques that can be applied
    to the monitoring of displacements of topographic surfaces:  satellite radar
    interferometry (INSAR);  terrestrial radar interferometry;  laser scanning;
     GNSS. NOTE : This document fulfils the requirements for the performance monitoring
    of the ground, of structures interacting with the ground and of geotechnical works
    by the means of geodetic instruments as part of the geotechnical investigation
    and testing'
