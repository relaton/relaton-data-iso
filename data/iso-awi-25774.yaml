abstract:
- language: en
  script: Latn
  content: This document specifies three procedures related to the evaluation of fingerprint
    visibility and cleanability of easy-to-clean coatings for cover glass used in
    automotive display modules. The document prescribes a standard method applying
    a fingerprint pattern (sample prep). A measurement method for quantifying fingerprint
    visibility is then explained through the use of a spectrophotometer. Finally,
    a cleanability test procedure is outlined via a wiping method and additional spectrophotometer
    measurements
