abstract:
- language: en
  script: Latn
  content: This document establishes a framework and methodology for model-based standards
    authoring, MBSA. MBSA improves the conciseness and completeness of future and
    existing standards by basing them on a formalized linkage of graphical and textual
    representations of a standard’s content to enable dual-mode comprehension. This
    document also serves as an example of a model-based standard. This document uses
    Object-Process Methodology, OPM, specified in ISO 19450, as the modelling language
    for the examples and method demonstration. While the MBSA approach can be applied
    using other modelling languages, this document applies OPM to demonstrate the
    methodology.
