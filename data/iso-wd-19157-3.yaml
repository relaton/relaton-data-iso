abstract:
- language: en
  script: Latn
  content: This International Standard specifies the process of establishing, maintaining
    and publishing register of data quality measures in compliance with ISO 19135-1:2015.
    It identifies and describes components and content structure of a register for
    data quality measures, and the registration and maintenance procedure. This International
    Standard also specifies the required machine-readable (XML, Geospatial-API) implementation
    of the register and the procedure of access and use of the register.
