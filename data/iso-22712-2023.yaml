abstract:
- language: en
  script: Latn
  content: This document defines the activities related to refrigerating systems according
    to ISO 5149‑1, ISO 5149‑2, ISO 5149‑3 and ISO 5149‑4 and other equivalent standards,
    such as EN 378‑1, EN 378‑2, EN 378‑3, EN 378‑4 and the associated competence profiles.
    It also establishes the competence criteria for persons who carry out these activities.
    Activities concerning electricity are excluded. NOTE 1   As a refrigerating circuit
    is considered not to incorporate electrical and electronic systems, activities
    in this area are not part of this document. National regulations or appropriate
    International or national standards can be referred to for competence on electrical
    and electronic systems. NOTE 2   This document does not apply to persons carrying
    out work on self‑contained refrigerating systems as defined in ISO 5149‑1 or EN 378‑1,
    from the initial design of the product to the complete manufacture of the product,
    provided the process is controlled and the methods used are checked by an organization
    or individual responsible for the conformance with statutory requirements on health,
    safety and environment (e.g. energy efficiency). NOTE 3   This document does not
    constitute a training programme.
