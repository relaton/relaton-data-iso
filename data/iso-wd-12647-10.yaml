abstract:
- language: en
  script: Latn
  content: 'This part of ISO 12647 document specifies the requirements for the exchange
    of data and information necessary for the definition of the aims for process and
    spot colour gravure printing of packaging materials. It is based on the use of
    colour characterization data to define the colourimetric printing aims and includes
    appropriate assignment of responsibility for and recommended tolerances on critical
    parameters of the Rotogravure printing process. • This part of ISO 12647 document
    is directly applicable to: • — gravure packaging printing. • — half-tone and continuous
    tone proofing processes that predict the colourimetric results of gravure packaging
    printing. • It is not directly applicable to: • Metalized Inks and transparent
    inks printed directly on metalized substrate. • All Gravure application different
    from Packaging'
