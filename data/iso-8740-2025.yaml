abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of parallel grooved pins with
    chamfer point and full-length diamond grooves (with open ends), in steel and stainless
    steel, and with nominal diameter 1 mm to 25 mm. These grooved pins are designed
    to fulfil the main following function: locking together two or more parts, with
    an easy installation (due to the chamfer point) and a highest level of pull-out
    resistance (due to the elastic fit behaviour of the pin). The general requirements
    (including functional principles for grooved pins and assembly) are specified
    in ISO 13669.'
