abstract:
- language: en
  script: Latn
  content: This document specifies test methods for grasping force and durability
    of repetitive grasping of externally powered prosthetic hands used to substitute
    for wholly or in part of absent or deficient hand. The grasping motions covered
    by this document are — cylindrical grasp, — pinch grip, — lateral pinch. This
    document does not apply to body-powered prosthetic hands, cosmetic hands, passive
    hands, and finger prostheses. This document does not cover a myo-electric sensor
    to measure myopotential from residual muscles.
