abstract:
- language: en
  script: Latn
  content: 'This document specifies three methods for the determination of ash from raw rubbers, compounded rubbers and vulcanizates. The methods are applicable to raw, compounded or vulcanized rubbers of the M, N, O, R and U families described in ISO 1629 [1], except that: Method A is not used for the determination of ash from compounded or vulcanized rubbers containing chlorine, bromine or iodine; Method B is used for compounded or vulcanized rubbers containing chlorine, bromine or iodine. It is not applicable to uncompounded rubbers; Method C is intended to be used for the determination of ash from raw, compounded or vulcanized rubber not containing chlorine, bromine or iodine by wrapping the test portion in ashless filter paper; lithium and fluorine compounds can react with silica crucibles to form volatile compounds, giving low ash results. This document does not cover the interpretation of the ash results as to the inorganic chemical content of a compound or vulcanizate, which is the responsibility of the analyst, who must be aware of the behaviour of rubber additives at elevated temperatures.'
