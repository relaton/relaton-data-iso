abstract:
- language: en
  script: Latn
  content: This document presents the methods and provisions for sampling tritium
    and carbon‑14 in the gaseous effluents generated by nuclear facilities during
    operation and decommissioning. Specifically included are sample withdrawal location,
    extraction, transport flow measurement, and collection for later analysis. This
    document doesn’t address to real time measurements of tritium activity and carbon-14
    activity in the effluent air of stacks and ducts. Information about real time
    measurements can be found in ISO 2889:2021, Annex H. Sample processing, analysis
    and calculations of tritium and carbon‑14 emissions will be addressed in future
    parts of ISO 20041.
