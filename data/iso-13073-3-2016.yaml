abstract:
- language: en
  script: Latn
  content: ISO 13073-3:2016 specifies a method of human health risk assessment that
    enables the evaluation of anti-fouling paint application and removal in order
    to determine if the product can be used safely where users are at risk of being
    exposed to biocidally active substances contained within anti-fouling paints.
    This can be used for a risk assessment to determine the impact(s), if any, on
    professional or non-professional operators. ISO 13073-3:2016 does not specify
    a specific test method for evaluation of hazard and toxicity or recommend usage
    restrictions of certain substances. NOTE 1 ISO 13073-3:2016 is a "minimum" method,
    i.e. additional regulations or assessments based on national needs can be warranted.
    NOTE 2 While the approach prescribed is a tiered system, studies required in higher
    tiers can be undertaken in lieu of equivalent lower tier studies.
