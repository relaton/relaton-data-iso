abstract:
- language: en
  script: Latn
  content: ISO 17907:2014 specifies the technical requirements and test methods for
    the equipment necessary for the ships intended to use single point mooring (hereinafter
    referred to as "SPM") arrangements, such as bow chain stoppers, bow fairleads,
    and pedestal rollers. ISO 17907:2014 is applicable to the SPM arrangements provided
    for tankers, gas carriers, and chemical vessels.
