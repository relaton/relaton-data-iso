abstract:
- language: en
  script: Latn
  content: ISO 8870|IDF 83:2006 specifies a method for the detection of heat-stable
    DNase (thermonuclease) produced by coagulase-positive staphylococci in milk and
    milk-based products. The enzyme can be used as an indicator that staphylococcal
    growth has reached hazardous levels and reveal the potential presence of staphylococcal
    enterotoxins.
