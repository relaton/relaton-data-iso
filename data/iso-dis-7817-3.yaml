abstract:
- language: en
  script: Latn
  content: The standard specifies a data model in UML and a derived XML schema (XSD)
    for defining the Level of Information Need in software applications based on concepts
    and principles given in Part 1, and guidance given in Part 2, in compliance with
    the principles and data exchange standards of data templates (ISO 23387). The
    standard defines the exchange format schema in XSD according to the UML schema
    and it gives guidelines for the usage and application of the schema. In addition,
    the integration with Linked Data principles and paradigms will be demonstrated.
