abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1656:2010-07 specifies the application module for Component
    grouping. The following are within the scope of ISO/TS 10303-1656:2010-07: the
    representation of the information needed to describe the different ways of grouping
    assembly components in an assembly. The module functionality supports discrete
    and fabricated assemblies, and design reuse of complex design elements. Random,
    linear and array placement patterns are supported. The group is placed in the
    design with a single placement transformation facilitating high level design operations
    including optimization. the grouping of components within an assembly and their
    arrangement in a linear or rectangular pattern with a fixed grid;the grouping
    of components within an assembly and their arrangement in a random arrangement.'
