abstract:
- language: en
  script: Latn
  content: 'ISO 4202:2016 specifies the dimensions of reduction sleeves with external
    7/24 taper (Nos. 30, 40, 45, 50 and 60) for tools with Morse taper shanks (Nos.
    1 to 6). All these sleeves allow driving of tools having Morse taper shanks which
    have a tenon at the small end of the shank; some sleeves allow driving of tools
    having Morse taper shanks which have an axially tapped hole in the shank: - with
    the use of an incorporated screw for sleeves 30 × 1 ? 40 × 1 ? 40 × 2 ? 45 × 1
    ? 45 × 2 ? 45 × 3 ? 50 × 2 ? 50 × 3 ? 50 × 4 ? 60 × 3 ? 60 × 4 ? 60 × 5; - with
    the use of a draw bar for sleeves 30 × 1 ? 30 × 2 ? 40 × 1 ? 40 × 2 ? 40 × 3 ?
    45 × 1 ? 45 × 2 ? 45 × 3 ? 45 × 4 ? 50 × 2 ? 50 × 3 ? 50 × 4 ? 50 × 5 ? 60 × 3
    ? 60 × 4 ? 60 × 5 ? 60 × 6. Morse tapers conform to ISO 296 while 7/24 tapers
    are in accordance with ISO 297.'
