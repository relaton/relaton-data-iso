abstract:
- language: en
  script: Latn
  content: ISO 18541-1:2014 provides a general overview and structure of each part
    of ISO 18541. It also specifies use cases related to repair and maintenance information
    (RMI) systems in order to standardize the access to RMI for independent operators.
    ISO 18541-1:2014 also describes the use cases applicable to the standardized access
    to automotive RMI. The use cases address real world scenarios (e.g. servicing
    vehicles) in regard to the information access necessary to perform vehicle roadside
    assistance, inspection, diagnosis, repair and maintenance, including the updating
    and replacement of Electronic Control Units (ECU). ISO 18541-1:2014 provides an
    overview of the entire standard and how it applies to the automotive industry.
    ISO 18541-1:2014 is applicable to light passenger and commercial vehicles as defined
    in regulation (EC) 715/2007 Article 2.
