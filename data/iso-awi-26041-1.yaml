abstract:
- language: en
  script: Latn
  content: This document specifies the definitions and structures of the data elements
    used for screening the population to identify disability or functional limitation.
    It provides a generic set of screening information that is application-independent.
    The mechanism of exchange and security of the collected information is out of
    scope of this standard. The standard does not provide the method, process or algorithm
    used to identify individuals with disability.
