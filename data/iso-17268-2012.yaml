abstract:
- language: en
  script: Latn
  content: ISO 17268:2012 defines the design, safety and operation characteristics
    of gaseous hydrogen land vehicle (GHLV) refuelling connectors consisting of, as
    applicable, a receptacle and a protective cap (mounted on vehicle), and a nozzle.
    It applies to refuelling connectors which have working pressures of 11 MPa, 25
    MPa, 35 MPa and 70 MPa, referred to as H11 - 11 MPa at 15 °C, H25 - 25 MPa at
    15 °C, H35 - 35 MPa at 15 °C, H35HF - 35 MPa at 15 °C (high flow for commercial
    vehicle applications), and H70 - 70 MPa at 15 °C. Nozzles and receptacles that
    meet the requirements of ISO 17268:2012 will only allow GHLVs to be filled by
    fuelling stations dispensing hydrogen with nominal working pressures equal to
    or lower than the vehicle fuel system working pressure. They will not allow GHLV
    to be filled by fuelling stations dispensing blends of hydrogen with natural gas.
    Refuelling connectors dispensing blends of hydrogen with natural gas are excluded
    from the scope of ISO 17268:2012.
