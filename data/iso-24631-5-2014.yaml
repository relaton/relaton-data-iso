abstract:
- language: en
  script: Latn
  content: ISO 24631-5:2014 specifies rules and procedures for verifying the capability
    of RFID transceivers of reading transponders used in individual animal identification
    complying to ISO 11784 and ISO 11785. In addition, ISO 24631-5:2014 specifies
    how to apply for an approval and the rights and duties to use this approval. ISO
    24631-5:2014 does not set out the procedures for evaluating wireless synchronised
    mobile transceivers and also this document contains no provision for evaluating
    wired synchronisation of stationary transceivers. This test differs from ISO 24631‑2,
    which is intended for testing transceivers with all mandatory features described
    in ISO 11784 and ISO 11785. The test described here is intended for cost-effective
    non-synchronising transceivers that are capable of reading transponders complying
    to ISO 11784 and ISO 11785 but have no synchronisation capability and does not
    have to support the dual adaptive protocol. Furthermore, the activation field
    frequency accuracy is more relaxed.
