abstract:
- language: en
  script: Latn
  content: This document specifies the test method to be followed for measuring and
    documenting the three-point and four-point flexural strengths of calcium salt
    based bone void fillers after preconditioning in deaerated phosphate buffered
    saline to mimic in vivo circumstances. This standard can be applied for all calcium
    salt based bone void fillers including non-porous ones after appropriate inter-laboratory
    tests. This documen t applies to porous calcium salt based bone void fillers with
    a total porosity ratio of 50 % to 90 % and an average size of macropores of 1
    μm to 500 μm as measured by methods described in ISO 13175-3.
