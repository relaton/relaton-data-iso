abstract:
- language: en
  script: Latn
  content: 'The proposed standard will set the Reference Data (Model/Schema) to describe
    and identify carbon credit projects and units. The standard supports participants,
    regulators and infrastructure providers in international carbon credit markets
    by facilitating exchange of information on the assets being created, transacted,
    and tracked. The scope of this proposal includes: - Defining a common carbon credit
    data taxonomy to help harmonise data fields, formats, and models across different
    carbon credit registries maintained by carbon crediting programs or other parties;
    - Considerations for adapting this data model for use in financial markets. The
    scope of this proposal excludes: - Setting thresholds or otherwise evaluating
    carbon credit quality; - Standardizing processes for how carbon credits are created,
    measured, verified or traded - Guidance on who can issue, trade or purchase carbon
    credits.'
