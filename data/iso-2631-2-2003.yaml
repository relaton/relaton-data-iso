abstract:
- language: en
  script: Latn
  content: ISO 2631-2:2003 concerns human exposure to whole-body vibration and shock
    in buildings with respect to the comfort and annoyance of the occupants. It specifies
    a method for measurement and evaluation, comprising the determination of the measurement
    direction and measurement location. It defines the frequency weighting Wm which
    is applicable in the frequency range 1 Hz to 80 Hz where the posture of an occupant
    does not need to be defined. Whilst it is often the case that a building will
    be available for experimental investigation, many of the concepts contained within
    ISO 2631-2 would apply equally to a building in the design process or where it
    will not be possible to gain access to an existing building. In these cases, reliance
    will have to be placed on the prediction of the building response by some means.
    ISO 2631-2 does not provide guidance on the likelihood of structural damage, which
    is discussed in ISO 4866. Further, it is not applicable to the evaluation of effects
    on human health and safety. Acceptable magnitudes of vibration are not stated
    in ISO 2631-2. The mathematical definition of the frequency weighting Wm is given
    in Annex A. Guidelines for collecting data concerning complaints about building
    vibration are given in Annex B.
