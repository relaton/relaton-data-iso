abstract:
- language: en
  script: Latn
  content: ISO 14246:2014 specifies the procedures and acceptance criteria for manufacturing
    testing and examination of cylinder valves that have been manufactured to achieve
    type approval. ISO 14246:2014 is applicable to cylinder valves intended to be
    fitted to refillable transportable gas cylinders, main valves (excluding ball
    valves) for cylinder bundles and cylinder valves or main valves with integrated
    pressure regulator (VIPR) designed and type tested according to ISO 10297.
