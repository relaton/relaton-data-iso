abstract:
- language: en
  script: Latn
  content: 'Supporting the emerging global rules and regulations on emission monitoring
    covering flaring and venting, a specific and unique application of ultrasonic
    flowmeters which brings a unique set of challenges (as rangeability of 1:4000,
    low pressure, large pipe, contamination, varying composition, wet / saturation)
    - Is focusing on Ultrasonic flow meter technology only – with three staged approach:
    1- starting with Actual Volumetric flow rate (primary measurement) 2- followed
    by Standard volumetric flow rate (adding secondary measurements like, T, P and
    Z) 3- and finally with emissions in CO2 eq per hour (adding tertiary measurement)
    in liaison with ISO/TC67/SC9 - Aims to develop a type approval specific for ultrasonic
    flowmeter technology – as it covers the majority of the flare measurement market.
    (next to thermal and venturi) - Starting with improving the actual volumetric
    flow rate (low hanging fruit such as installation effects, Reynolds effects, calibration,
    CFD)'
