abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the determination of the Vickers
    hardness of metallic blast-cleaning abrasives. This method is not recommended
    for the testing of particle sizes below 0,3 mm. NOTE Accurate testing of particles
    below 0,3 mm (grades S040/G050) is extremely difficult. This is one of a number
    of parts of ISO 11125 dealing with the sampling and testing of metallic abrasives
    for blast-cleaning. The types of metallic abrasive and requirements on each are
    contained in the various parts of ISO 11124. The ISO 11124 and ISO 11125 series
    have been drafted as a coherent set of International Standards on metallic blast-cleaning
    abrasives. Information on all parts of both series is given in Annex A.
