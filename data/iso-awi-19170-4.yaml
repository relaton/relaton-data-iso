abstract:
- language: en
  script: Latn
  content: Axis aligned (AA) is a new DGGS classification standard, which can be defined
    according to whether it is parallel to the coordinate axis of the existing geographic
    information coordinate system. The purpose of this classification method is to
    determine whether the division of a specific dimensional space by a given DGGS
    is orthogonal. AA classified DGGS from the perspective of coordinate reference
    system and describes a way to define DGGS from coordinate reference system. This
    standard does not specify any specific AA DGGS model, basic coordinate reference
    system or coordinate reference system category, but is intended to allow a range
    of options to produce AA DGGS with compatible and interoperable function features.
    This standard also describes the relationship between AA DGGS and other types
    of DGGS, as well as the basic principles and ideas of mutual conversion and interoperability
    between different types of AA DGGS.
