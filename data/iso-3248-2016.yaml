abstract:
- language: en
  script: Latn
  content: ISO 3248:2016 specifies a method for determining the resistance of single
    coatings or multi-coat systems of paints, varnishes or related products to changes
    in gloss and/or colour, blistering, cracking and/or detachment from the substrate
    under conditions of a specified temperature. This procedure is applicable to products
    intended for use on domestic radiators or other articles likely to be subjected
    to similar temperatures.
