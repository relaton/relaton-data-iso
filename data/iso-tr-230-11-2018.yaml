abstract:
- language: en
  script: Latn
  content: The aim of this document is to document the characteristics of precision
    measuring instruments for testing the geometric accuracy of machine tools, operating
    either under no-load or under quasi-static conditions. Where necessary, reference
    is made to the appropriate International Standards. The measuring instruments
    for operational testing of machine tools [vibrations (ISO/TR 230‑8), noise (ISO
    230‑5), stick-slip motion of components, etc.] as well as instruments for checking
    of other characteristics of machine tools (speeds, feeds, temperature) are not
    covered in this document. The measuring instruments for checking of workpiece
    geometry (size, form, etc.) are not covered by this document either. This document
    has list style construction for ease of search and identification of each instrument's
    characteristics. Sources of uncertainty of instruments and measurements are described
    in this document for more accurate measurement procedures.
