abstract:
- language: en
  script: Latn
  content: This International Standard specifies requirements for a series of pyknometers
    for general laboratory use for the determination of the densities of liquids.
    Specialized pyknometers for use with particular products, or otherwise not in
    common use, are excluded. Sufficient details to define such pyknometers should
    be included in International Standards which specify or describe their use. A
    device suitable for adjustment of the liquid level in the neck of the Reischauer
    pyknometer is shown in annex A.
