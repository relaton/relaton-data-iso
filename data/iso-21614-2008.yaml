abstract:
- language: en
  script: Latn
  content: ISO 21614:2008 describes a method for determining the carbon content in
    UO2, (U,Gd)O2 and (U,Pu)O2 powder and sintered pellets by combustion in an induction
    furnace and infrared absorption spectroscopy measurement. ISO 21614:2008 is applicable
    for determining 10 µg/g to 500 µg/g of carbon in UO2, (U,Gd)O2 and (U,Pu)O2 powder
    and pellets.
