abstract:
- language: en
  script: Latn
  content: ISO 472:2013 defines terms used in the plastics industry, including terms
    and definitions appearing in plastics standards (of ISO/TC 61) and general terms
    and definitions of polymer science used in all aspects of plastics technology.
    In addition to terms in English and French (two of the three official ISO languages),
    this vocabulary includes the equivalent terms in German; these have been included
    under the responsibility of the member body for Germany (DIN). However, only the
    terms and definitions in the official languages can be considered as ISO terms
    and definitions.
