abstract:
- language: en
  script: Latn
  content: This document applies to searchlights, firefighting lights and day signalling
    lamps fitted to ships. Searchlights on board facilitate the detection of other
    vessels, offshore structures, obstructions to shipping, floating objects, and
    living things, shorelines, as well as fixed and floating sea marks and other aids
    to navigation, thus providing essential information to the navigator for safe
    navigation, collision avoidance and search and rescue of shipwrecked persons at
    sea.
