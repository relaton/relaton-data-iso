abstract:
- language: en
  script: Latn
  content: This document describes methods for the quantification of nano-object release
    from powders as a result of treatment, ranging from handling to high energy dispersion,
    by measuring aerosols liberated after a defined aerosolization procedure. Particle
    number concentration and size distribution of the aerosol are measured and the
    mass concentration is derived. This document provides information on factors to
    be considered when selecting among the available methods for powder sampling and
    treatment procedures and specifies minimum requirements for test sample preparation,
    test protocol development, measuring particle release and reporting data. In order
    to characterize the full size range of particles generated, the measurement of
    nano-objects as well as agglomerates and aggregates is adressed in this document.
    This document does not include the characterization of particle sizes within the
    powder. Tribological methods are excluded where direct mechanical friction is
    applied to grind or abrade the material.
