abstract:
- language: en
  script: Latn
  content: 'This document specifies safety requirements for mobile robots in an industrial
    environment without drivers or riders, referred to as industrial mobile robots
    (IMRs). This document applies to IMRs whose intended use is to perform industrial
    automation operations that are not load handling. The exception is that load handling
    may be performed by one or more industrial robot(s) in accordance with the ISO
    10218:2025 series; these industrial robots may be integrated with, or integral
    to, an IMR. This document applies to industrial mobile robots intended to perform
    automation operations in an industrial environment. Some examples include: inspection;
    monitoring; measurement; testing; quality verification; data collection; maintenance
    support; machine interaction; machine tending; mobile manipulation. Exclusions:
    The following mobile machines are out of scope of this document: Industrial trucks
    defined in clause 1 Scope of ISO 5053-1 and designed to perform load handling(see
    ISO 3691-4); Dynamically stable industrial mobile robots (see ISO 25785-1); Service
    robots (see ISO 13482); Commercial and industrial floor-cleaning robots (see IEC
    63327); Agricultural and forestry machines within the scope of the ISO 25119 series;
    Mobile machines solely under control of a driver (e.g., driver remote control,
    driver continuous local control); Machines lifting or transporting people; Mobile
    machines whose travel is solely mechanically guided; Mobile machines which are
    worn by humans (e.g., exoskeletons); Road vehicles; Airborne, waterborne, underwater,
    or climbing mobile machines; Mobile robots used in agricultural and forestry domains;
    Earth-moving and mining machinery; Military and space robots; Toys; Medical robots.
    Examples of mobile robots used in non-industrial environments can include: Mobile
    robots intended for consumer or household use; undersea, military and space robots;
    or medical, surgical, or rehabilitative mobile robots. The following hazards are
    not covered in this document: severe conditions (e.g. extreme climates, freezer
    applications, strong magnetic fields) outside of manufacturer’s specification;
    corrosive or potentially explosive environments (dust, liquid, vapour or gas);
    nuclear environments; specific hygienic requirements; ionizing and hazardous non-ionizing
    radiation; during the transportation of (a) person(s); when handling loads the
    nature of which can lead to dangerous situations (e.g., molten metals, acids/bases,
    radiating materials). If the IMR will be used outdoors, or in rough terrain, it
    is expected that the IMR is adequate to withstand the environment per the information
    for use, and that users operate the IMR only under conditions for which its manufacturer
    indicates it is intended.'
