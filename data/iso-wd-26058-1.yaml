abstract:
- language: en
  script: Latn
  content: 'Type C Standard stating: Safety requirements industrial mobile robots,
    traveling on the ground. For the purpose of this document, an "industrial environment"
    is a workplace where the public is excluded or restricted from access. This document,
    Part 1, is intended to be the first in a series addressing safety requirements.
    Part 2, to be developed separately, will address safety requirements for the integration
    of applications of industrial mobile robots. Exclusions: The following automated
    mobile machines are out of scope of this document: • Industrial trucks defined
    in ISO 5053-1 (covered by EN ISO 3691-4); • Industrial mobile robots with actively
    controlled stability (separately proposed for development as ISO/NP 25785-1);
    • Mobile machines whose travel speed and travel direction is solely under control
    of a driver or an operator (e.g., human remote control, human continuous local
    control); • Mobile machines whose travel is solely mechanically guided; • Mobile
    machines which are worn by humans (e.g., exoskeletons); • Road vehicles; • Airborne,
    waterborne, underwater, or climbing mobile machines; • Mobile machines used in
    agricultural and forestry domains; • Earth-moving and mining machinery; • Commercial
    and industrial floor-cleaning robots; and • Mobile machines when used in non-industrial
    environments. Note: Examples of mobile robots used in non-industrial environments
    can include: Mobile robots intended for consumer or household use; undersea, military
    and space robots; or medical, surgical, or rehabilitative mobile robots. The following
    hazards are not covered in this document: • severe conditions (e.g. extreme climates,
    freezer applications, strong magnetic fields) outside of manufacturer’s specification;
    • corrosive or potentially explosive environments (dust, liquid, vapour or gas);
    • nuclear environments; • specific hygienic requirements; • ionizing and hazardous
    non-ionizing radiation; • during the transportation of (a) person(s); • when handling
    loads the nature of which can lead to dangerous situations (e.g., molten metals,
    acids/bases, radiating materials).'
