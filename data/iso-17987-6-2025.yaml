abstract:
- language: en
  script: Latn
  content: This document specifies the LIN protocol conformance test. This test verifies
    the conformance of LIN communication controllers with respect to ISO 17987-2 and
    ISO 17987-3. This document provides all necessary technical information to ensure
    that test results are identical even on different test systems, provided that
    the particular test suite and the test system are compliant to the content of
    this document. Annex A, Annex B and Annex C specify the protocol conformance test
    plans for responder nodes supporting auto addressing procedures according procedure
    C, procedure D or procedure E, see ISO 17987-3:2025, Annex C.
