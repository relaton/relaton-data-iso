abstract:
- language: en
  script: Latn
  content: ISO 23713:2005 specifies a method for determining fibre coarseness using
    polarized light. The method is applicable to all kinds of pulp that polarize light.
    However fibrous particles shorter than 0,2 mm are not regarded as fibres for the
    purposes of ISO 23713:2005 and therefore are not to be included in the results.
