abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the rust prevention
    characteristics of lubricating grease under dynamic wet conditions. This test
    method is used to assess the ability of a grease to prevent corrosion in rolling
    bearings operated in presence of water, synthetic sea water or any industrial
    aqueous pollutant. NOTE      For the purposes of this document, the term “% (m/m)”
    is used to represent the mass fraction.
