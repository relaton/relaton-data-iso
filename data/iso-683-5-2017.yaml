abstract:
- language: en
  script: Latn
  content: ISO 683-5:2017 gives the technical delivery requirements for - semi-finished
    products, e.g. blooms, billets, slabs (see note 1), - bars (see note 1), - wire
    rod, - hot-rolled plates (see note 2), and - hammer or drop forgings (see note
    1) manufactured from the nitriding steels listed in Table 3 and supplied in one
    of the heat-treatment conditions given for the different types of products in
    Table 1, rows 2 to 5, and in one of the surface conditions given in Table 2. The
    steels are generally intended for the fabrication of quenched and tempered and,
    subsequently, nitriding machine parts. The requirements for mechanical properties
    given in this document are restricted to the sizes given in Table 6. NOTE 1 Hammer-forged
    semi-finished products (blooms, billets, slabs, etc.), seamless rolled rings and
    hammer-forged bars are in the following covered under semi-finished products or
    bars and not under the term "hammer and drop forgings". NOTE 2 The term "plate"
    includes in the following also wide flats unless otherwise stated. In special
    cases, variations in these technical delivery requirements or additions to these
    requirements can form the subject of an agreement at the time of enquiry and order
    (see 5.2 and Annex B). In addition to this document, the general technical delivery
    requirements of ISO 404 are applicable.
