abstract:
- language: en
  script: Latn
  content: This document specifies quality requirements for the chart, test procedure
    and acceptance level for near, far, and colour vision acuity of NDT personnel.
    Information for grey scale perception and low contrast can be found in the annexes.
    This document also specifies the qualification requirements for personnel permitted
    to carry out the test. This document is only applicable to vision acuity under
    defined conditions similar to those encountered during routine NDT inspection.
    This document does not address an individual’s overall visual acuity and users
    are advised to consider the need for a general eye examination by specialist medical
    personnel to ensure general vision acuity.
