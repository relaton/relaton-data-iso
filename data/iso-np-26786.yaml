abstract:
- language: en
  script: Latn
  content: This document specifies the properties, designation, generation principle,
    particle size distribution, concentration stability, chemical composition, and
    verification of a laboratory-generated salt aerosol intended to reproduce the
    sub-micrometre accumulation-mode fraction of typical urban atmospheres. This document
    is intended for use in laboratory evaluation, ageing, conditioning, or loading
    of air filters and air-cleaning equipment, including general ventilation filters
    evaluated in conjunction with the ISO 16890 series. This document does not specify
    a complete ageing procedure, a filter loading endpoint, an efficiency test method,
    an energy-use calculation, a filter classification method, a life-cycle cost method,
    or a calibration aerosol for particle counters. It does not replace coarse-test
    dust standards when a coarse-dust challenge is required.
