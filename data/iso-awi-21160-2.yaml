abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of selected carbonyls
    (formaldehyde, acetaldehyde, acetone, acrolein, propionaldehyde, crotonaldehyde,
    2-butanone and butyraldehyde) as their 2,4-dinitrophenylhydrazones in mainstream
    smoke using reversed phase HPLC-UV/DAD with impregnated glass fibre filter pad.
    This method is applicable to cigarettes with nicotine-free dry particulate matter
    (NFDPM) yields between 1 mg/cigarette and 15 mg/cigarette using reversed phase
    HPLC-UV/DAD. Note: The analytical method cannot separate n-butyraldehyde and iso-butyraldehyde
    and therefore the method reports butyraldehyde (sum of n-butyraldehyde and iso-butyraldehyde)
    based on the response factor of n-butyraldehyde.'
