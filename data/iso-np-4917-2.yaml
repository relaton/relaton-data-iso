abstract:
- language: en
  script: Latn
  content: This document applies to nuclear power plants with water cooled reactors
    to achieving the safety objectives specified in ISO 4917-1. For other nuclear
    facilities the applicability of the document need to be checked in advance, before
    it might be applied correspondingly. This document is independent of national
    standards. Recommendations, given in Annex A, are mainly based on the Eurocodes-Design-Philosophy
    and European Standards. Alternatively, other equivalent standards or regulations
    can be used in case the general requirements given in this document together with
    Annex A can be met.
