abstract:
- language: en
  script: Latn
  content: 'his document specifies recommended best practices for executing and evaluating
    retrospective safety assessments of Automated Driving Systems (ADS, as defined
    in ISO/SAE PAS 22736:2021) following deployment into the traffic system. The purpose
    of the document is to provide stakeholders with a set of recommended best practices
    for executing and evaluating retrospective safety assessments. Excluded from this
    document are the following aspects: — ethics of ADS technology (already in scope
    for ISO/IEC/IEEE 24748-7000:2022, ISO 39003:2023, and ISO/IEC TR 2436:2022); —
    prospective safety performance assessment (already in scope for ISO/TR 21934-1:2021
    and ISO/TS 21934-2:2024); — non-crash related outcomes, such as safety critical
    events, measures of crash proximity, or other potential safety surrogate measures
    (already in scope as a prospective measure of safety within for ISO/TR 21974-1:2018);
    — usage of simulation and virtual tooling (already in scope for ISO/TR 21934-1:2021,
    ISO/TS 21934-2:2024, ISO/TS 5083:2025 and SAE J2998).'
