abstract:
- language: en
  script: Latn
  content: This document defines the requirements about trusted communication in legal,
    administrative and technical considerations. This document shows a TCP system
    architecture to guarantee trusted communication and promote trusted services by
    providing trusted communication evidence as the proof. This document focuses on
    TCP at the view of 7th application layer of OSI (Open Systems Interconnection)
    Reference Model. The audiences are the policy makers for IT innovation such as
    dematerialization, legal experts regarding electronic activities, IT planners
    for single windows and secure transactions, IT service providers related to distributed
    networking and ledger, trusted system auditors, trusted communication concerned
    parties and so on.
