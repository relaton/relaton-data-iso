- language: en
  script: Latn
  content: This standard specifies the classification, identification, and functional
    requirements for IoT based system integrated into smart pallets. It provides a
    unified definition of the term "Smart Pallet," which varies across regions and
    industries, and classifies Smart Pallets into grades based on their level of smartness
