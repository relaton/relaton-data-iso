abstract:
- language: en
  script: Latn
  content: ISO 10619-1:2017 specifies three methods for measuring the flexibility
    of rubber and plastics hoses and tubing (methods A1, B and C1), where the deformation
    of the hose or tubing is measured, and two methods for measuring the stiffness
    (methods A2 and C2) by measuring the force required to bend rubber or plastics
    hoses or tubing to a specific radius at ambient temperature. Methods A1 and A2
    are suitable for rubber and plastics hoses and tubing with inside diameter of
    up to and including 80 mm. Method A1 allows the measurement of the flexibility
    of the hose or tubing by measuring the reduction in outside diameter when the
    hose is compressed between two plates. Method A2 provides a means of measuring
    the force required to reach a specific bend radius when the hose or tubing is
    compressed, as between two plates. The test can be carried out at a specified
    internal pressure. Method B is suitable for rubber and plastics hoses and tubing
    with inside diameter of up to and including 100 mm, and provides a means of assessing
    the behaviour of the hose and tubing when bent around a mandrel. The final mandrel
    diameter used can be taken as the minimum bend radius of the hose or tubing. As
    this value is determined by the reduction of the outside diameter, it can be used
    as a measure of the flexibility of the hose or tubing. The hose or tubing being
    tested can be unpressurized, pressurized or under vacuum and, if required, with
    the curvature or against the curvature of the hose or tubing, if such curvature
    is present. Methods C1 and C2 are suitable for rubber and plastics hoses and tubing
    with inside diameter of 100 mm and greater. Method C1 provides a means of determining
    the flexibility of the hose and tubing at the minimum bend radius. Method C2 provides
    a method of measuring the stiffness of the hose and tubing at the minimum bend
    radius.
