abstract:
- language: en
  script: Latn
  content: This document defines the approach to maintain type approval, design and
    safety qualification of building-integrated PV modules including modules with
    more than two glass panes and insulating glass modules which are made up of a
    certified glass-glass PV module. The performance of the final BIPV product can
    be impacted by the change in either the structure or the manufacturing process
    of the BIPV modules. This document lists typical structure and the retesting requirements
    on the different test standards. Those products successfully passing the test
    procedures defined in this standard are considered to be compliant with the standard
    in a full qualification.
