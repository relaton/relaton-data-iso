abstract:
- language: en
  script: Latn
  content: ISO 12192:2011 specifies a method for the determination of the edgewise
    compressive strength (ring crush resistance) of paper and paperboard, especially
    board used in the manufacture of fibreboard shipping containers. ISO 12192:2011
    is applicable to all paper and paperboard with a thickness in the range 100 µm
    to 580 µm. For samples having a thickness below 280 µm, test values can result
    from a combination of both buckling failure and pure compression.
