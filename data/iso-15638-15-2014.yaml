abstract:
- language: en
  script: Latn
  content: ISO 15638-15:2014 addresses the provision of vehicle location monitoring
    and specifies the form and content of such data required to support such systems
    and access methods to that data. ISO 15638-15:2014 provides specifications for
    common communications and data exchange aspects of the application service vehicle
    location monitoring that a regulator may elect to require or support as an option,
    including a) high-level definition of the service that a service provider has
    to provide, NOTE The service definition describes common service elements; but
    does not define the detail of how such an application service is instantiated,
    not the acceptable value ranges of the data concepts defined. b) means to realize
    the service, and c) application data, naming content, and quality that an IVS
    has to deliver.
