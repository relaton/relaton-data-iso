abstract:
- language: en
  script: Latn
  content: This document provides requirements on identification and labelling of
    medicinal products from the point of manufacturing of packaged medicinal product
    to the point of dispensing the product. This document outlines commonly accepted
    international practices for automatic identification and data capture (AIDC) barcoding
    solutions for applications and applies to manufacturers, distributors, healthcare
    facilities and all parties involved in labelling and distribution of packaged
    medicinal products. These users can, however, consider the coding interoperability
    requirements for other AIDC technologies, e.g. radio frequency identification
    (RFID); that technology is not addressed in this document except as for information.
