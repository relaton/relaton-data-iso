abstract:
- language: en
  script: Latn
  content: This document specifies rules for the indication of the surface texture
    of optical elements, in the ISO 10110 series, which standardizes drawing indications
    for optical elements and systems. Surface texture is the characteristic of a surface
    that can be effectively described with statistical methods. Typically, surface
    texture is associated with high spatial frequency errors (roughness) and mid-spatial
    frequency errors (waviness). This document is primarily intended for the specification
    of polished optics. This document describes a method for characterizing the residual
    surface that is left after detrending by subtracting the surface form. The control
    of the surface form specified in ISO 10110-5, ISO 10110-12, and ISO 10110-19 is
    not specified in this document.
