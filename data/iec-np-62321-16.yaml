abstract:
- language: en
  script: Latn
  content: This part of IEC 62321 specifies one normative extraction and measurement
    technique for determination of benzotriazole ultraviolet absorbers ((2-(2'-Hydroxy-3',5'-di-tert-butylphenyl)
    benzotriazole(UV-320), 2-(5-Chloro-2-Benzotriazolyl)-6-Tert-Butyl-p-Cresol(UV-326),2-(3,5-Di-Tert-Butyl-2-Hydroxyphenyl)-5-Chlorobenzotriazole(UV-327),
    2-(2H-Benzotriazol-2-yl)-4,6-ditertpentylphenol(UV-328), Octrizole(UV-329), 2-(benzotriazol-2-yl)-6-butan-2-yl-4-tert-butylphenol
    (UV-350)) in polymers by gas chromatography-mass spectrometry method(GC-MS). This
    standard specifies the qualitative and quantitative methods for the determination
    of benzotriazole ultraviolet absorbers in polymers by means of ultrasonic-assisted
    extraction and gas chromatography-mass spectrometry method (GC-MS).
