abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the glass cupping device applying
    negative pressure created by a heat source placed in its inner cavity. This document
    includes the requirements for configuration, material, performance, packaging
    and labelling, as well as appropriate test methods. This document applies to single-use
    and multiple-use glass cupping devices. This document does not apply to the air
    extraction cupping device covered by ISO 19611.
