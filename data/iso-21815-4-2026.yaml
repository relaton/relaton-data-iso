abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for collision warning systems (CWS)
    and collision avoidance systems (CAS) that address swing and rotation motion for:
    earth moving machinery as defined in ISO 6165; mobile underground mining machinery
    as defined in ISO 19296; rock drill rigs as defined in ISO18758-1; road construction
    machinery as defined in ISO 22242. This document covers the risk of collision
    with an intended object between the ground plane of the machine and the top of
    the machine operator cabin. This document does not cover the risk of collision
    with parts of the intended objects that are higher than the top of the machine
    operator cabin. This document does not consider machine height of working tool
    (e.g. height of boom and arm). This document covers collision avoidance by motion
    inhibition or collision warning by providing warning to the operator, prior to
    initiation of swing and rotation motion around vertical axis of a machine (e.g.
    excavators) or swing and rotation parts of a machine about an axis (e.g. backhoe
    portion of backhoe loaders, conveyer part of mobile screens, booms on rock drills).
    It does not cover collision avoidance by automatic application of the braking
    or automatic manoeuvring (e.g. raise bucket) away from the intended object. The
    system described in this document is intended to assist the operator of the machine.
    The responsibility for safe operation of the machine remains with the machine
    operator. This document is not applicable to collision warning and collision avoidance
    systems installed/manufactured before the date of its publication. For the purpose
    of this document, the term "machine" means swing and rotation machine or swing
    and rotation parts of machine.'
