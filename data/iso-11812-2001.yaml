abstract:
- language: en
  script: Latn
  content: This International Standard specifies requirements for cockpits and recesses
    to be designated either as "watertight" or as "quick-draining" on small craft
    of hull length up to 24 m. It does not set requirements for the size and shape
    of a cockpit or recess, nor when or where it shall be used. It only considers
    draining by gravity, and not by pumping or other methods. NOTE 1 The term "quick-draining
    cockpit" has been chosen to differentiate from the common understanding of "self-draining
    cockpit" where water may be drained overboard in certain conditions, but without
    specified draining speed, height of bottom or sill, etc. NOTE 2 Examples of single-plane
    cockpit bottoms are given in informative annex A.
