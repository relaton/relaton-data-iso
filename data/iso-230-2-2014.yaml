abstract:
- language: en
  script: Latn
  content: ISO 230-2:2014 specifies methods for testing and evaluating the accuracy
    and repeatability of positioning of numerically controlled machine tool axes by
    direct measurement of individual axes on the machine. These methods apply equally
    to linear and rotary axes. ISO 230-2:2014 can be used for type testing, acceptance
    tests, comparison testing, periodic verification, machine compensation, etc. The
    methods involve repeated measurements at each position. The related parameters
    of the test are defined and calculated. Their uncertainties are estimated as described
    in ISO/TR 230-9:2005, Annex C.
