abstract:
- language: en
  script: Latn
  content: This document specifies a test method for measuring actinides (238Pu, 239+240Pu, 241Am,
    242Cm, 243+244Cm and 237Np) in water samples by alpha spectrometry following a
    chemical separation. This method can be used for any type of environmental study
    or monitoring after appropriate sampling and handling, and test sample preparation.
    The detection limit of the test method is 5 × 10−3 Bq·l-1 to 5 × 10−4 Bq·l-1 for
    a volume of test portion between 0,1 l to 5 l with a counting time of two to ten
    days. This is lower than the WHO criteria for safe consumption of drinking water
    (1 Bq·l-1 or 10 Bq·l-1 depending on radionuclide).[4] The method described in
    this document is applicable in the event of an emergency situation.
