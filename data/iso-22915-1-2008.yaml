abstract:
- language: en
  script: Latn
  content: 'ISO 22915 deals with the safety of industrial trucks, as defined in ISO
    5053, relative to their stability and the verification of that stability. For
    the purposes of ISO 22915, industrial trucks are wheeled, self-propelled or pedestrian-propelled
    vehicles, excepting those running on rails. They are either operator-controlled
    or driverless and designed to carry, tow, push, lift, stack or tier in racks.
    ISO 22915-1:2008 specifies basic test criteria and requirements to verify stability
    for industrial trucks, referred to simply as trucks. It applies to the following
    truck types and special conditions: counterbalanced trucks with mast; reach and
    straddle trucks; pallet stackers, double stackers and order-picking trucks up
    to and including 1200 mm; single side loading trucks; bidirectional and multidirectional
    trucks; additional stability test for trucks operating in special conditions of
    stacking with the mast tilted forward; counterbalanced trucks with mast handling
    freight containers of 6 m (20 ft) length and longer; additional stability test
    for trucks operating in special condition with the load substantially laterally
    displaced by powered devices; industrial variable reach trucks; industrial variable
    reach trucks handling freight containers of 6 m (20 ft) length and longer; rough
    terrain variable reach trucks; counterbalanced trucks with articulated steering;
    pedestrian propelled trucks; burden and personnel carrier; additional stability
    test for trucks operating in a special condition with offset load, offset determined
    by utilisation; order-picking trucks with elevating operator position above 1200
    mm. ISO 22915-1:2008 does not apply to: trucks handling suspended loads which
    may swing freely; low lift trucks with lift height up to and including 500 mm.'
