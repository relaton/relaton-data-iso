abstract:
- language: en
  script: Latn
  content: This document specifies a test method for atmospheric corrosion measurements,
    using two-electrode electrochemical sensors. It is applicable to measurements
    of the corrosion rate of uncoupled metal surfaces (i.e. "free" corrosion rate),
    galvanic corrosion rate, conductance of thin film solutions and barrier properties
    of organic coatings. It specifies electrochemical sensors that are used with or
    without organic coatings. The sensors are applicable to corrosion measurements
    made in laboratory test chambers, outdoor exposure sites and service environments.
