abstract:
- language: en
  script: Latn
  content: This International Standard specifies the characteristics of liquid hydrogen
    refuelling and dispensing systems on land vehicles of all types in order to reduce
    the risk of fire and explosion during the refuelling procedure and thus to provide
    a reasonable level of protection from loss of life and property. This International
    Standard is applicable to the design and installation of liquid hydrogen (LH2)
    fuelling and dispensing systems. It describes the system intended for the dispensing
    of liquid hydrogen to a vehicle, including that portion of the system that handles
    cold gaseous hydrogen coming from the vehicle tank, that is, the system located
    between the land vehicle and the storage tank.
