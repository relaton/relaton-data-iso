abstract:
- language: en
  script: Latn
  content: ISO 6719:2010 specifies a method of measuring the total and diffuse luminous
    reflectance characteristics of aluminium surfaces, using integrating-sphere instruments.
    The method specifed is also applicable to the measurement of specular reflectance
    (principal gloss value), specularity and diffuseness. The method is unsuitable
    for use with lighting reflectors.
