abstract:
- language: en
  script: Latn
  content: Specifies the data elements and the size and layout of the form to be used
    as a mail confirmation of a loan/deposit contract made between banks. The form
    may also be used to correct, cancel, complete or confirm an amendment to or the
    rollover of a previously issued contract. Additionally, it may be used as a confirmation
    at maturity. The data elements are, as far as possible and with the exception
    of certain field lengths, compatible with the appropriate S.W.I.F.T. specification.
