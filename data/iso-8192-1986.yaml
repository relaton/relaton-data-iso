abstract:
- language: en
  script: Latn
  content: Specified a method for assessing the inhibitory effect of a test material.
    This effect may include the effect on respiration and nitrification. This method
    gives information on inhibitory or stimulatory effects after a short exposure
    of the test material on activated sludge micro-organisms. It is applicable to
    chemical substances which are soluble under the conditions of the test.
