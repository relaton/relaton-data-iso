abstract:
- language: en
  script: Latn
  content: This document specifies the 150-Mbit/s optical physical layer for MOST
    (MOST150 oPHY), a synchronous time-division-multiplexing network. This document
    specifies the applicable constraints and defines interfaces and parameters, suitable
    for the development of products based on MOST150 oPHY. Such products include fibre
    optical links and connectors, fibre optic receivers, fibre optic transmitters,
    electrical to optical converters, and optical to electrical converters. This document
    also establishes basic measurement techniques and actual parameter values for
    MOST150 oPHY.
