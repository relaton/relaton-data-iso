abstract:
- language: en
  script: Latn
  content: This document specifies the test method and procedure to evaluate the algal bloom removal rate using microbubbles in on-site microbubble-based algal-bloom removal facilities.  The evaluation of the removal rate is conducted by comparing chlorophyll-a concentration before and after treatment using microbubbles. The range of water and weather conditions are served for test because they influence the characteristics of microbubbles and the algal bloom removal rate.
