abstract:
- language: en
  script: Latn
  content: This document specifies minimum content to be reported in material data
    sheets to justify the published material property values. This document does neither
    aim to define compulsory test quantities nor to define any basis for qualification
    purposes. Individual additions and extensions are permissible. This document is
    intended for use by organisations throughout the additive manufacturing supply-chain,
    e.g., manufacturers of PBF-LB/M or PBF-EB/M machines or comparable metal-powder-bed
    equipment, powder suppliers, service providers and users of the additively manufactured
    components.
