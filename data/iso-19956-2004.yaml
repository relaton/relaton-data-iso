abstract:
- language: en
  script: Latn
  content: ISO 19956:2004 specifies a test method for determining the ability of heels
    of ladies' shoes to withstand the repeated small impacts imposed by normal walking.
    Although intended primarily for plastic heels, the procedure is also usable for
    testing steel heel dowels on their own. While the test method is applicable to
    all types of high heels of any construction, it is particularly useful for injection-moulded
    plastic heels that incorporate a steel dowel reinforcement.
