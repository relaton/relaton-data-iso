abstract:
- language: en
  script: Latn
  content: 'This document specifies geometrical and dimensional tolerances for plastic moulded parts including: limits of technical manufacturability according to the manufacturing effort for direct tolerances; general tolerances of plastic moulded parts; acceptance conditions of plastic moulded parts; modification of the drawing default according to ISO 8015, in accordance to the environmental conditions common in the plastics industry. This document is applicable to non-porous moulded parts made from thermoplastics, thermoplastic elastomers and thermosets of thermoplastics, made by injection moulding, injection compression moulding, transfer moulding, compression moulding and rotational moulding. This document is applicable to other plastic processes, if agreed to by the contractual parties. Moulded part surface imperfections such as sink marks, undesired flow structures and roughness, as well as joint lines are not addressed in this document.'
