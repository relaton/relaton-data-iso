abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and recommendations for the construction
    of buildings and other structures which provide accommodation for data centres
    based on the criteria and classification for “physical security” within ISO/IEC 22237-1
    in support of availability. This document specifies requirements and recommendations
    for the following: a)       location and site selection (taking in to account
    natural environment and adjacencies); b)       protection from environmental risks;
    c)        site configuration; d)       building construction; e)       building
    configuration; f)         provision of access; g)       physical intrusion protection;
    h)       physical fire protection; i)         protection against damage from water;
    j)         quality construction measures. Safety and electromagnetic compatibility
    (EMC) requirements are outside the scope of this document and are covered by other
    standards and regulations. However, information given in this document can be
    of assistance in meeting these standards and regulations. Conformance of data
    centres to the present document is covered in Clause 4.'
