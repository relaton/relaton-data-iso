abstract:
- language: en
  script: Latn
  content: ISO 17638:2016 specifies techniques for detection of surface imperfections
    in welds in ferromagnetic materials, including the heat affected zones, by means
    of magnetic particle testing. The techniques are suitable for most welding processes
    and joint configurations. Variations in the basic techniques that will provide
    a higher or lower test sensitivity are described in Annex A. ISO 17638:2016 does
    not specify acceptance levels of the indications. Further information on acceptance
    levels for indications may be found in ISO 23278 or in product or application
    standards.
