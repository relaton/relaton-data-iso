abstract:
- language: en
  script: Latn
  content: ISO 8098:2014 specifies safety and performance requirements and test methods
    for the design, assembly and testing of fully assembled bicycles and sub-assemblies
    for young children. It also provides guidelines for instructions on the use and
    care of the bicycles. ISO 8098:2014 is applicable to bicycles with a maximum saddle
    height of more than 435 mm and less than 635 mm, propelled by a transmitted drive
    to the rear wheel. ISO 8098:2014 is not applicable to special bicycles intended
    for performing stunts (e.g. BMX bicycles).
