abstract:
- language: en
  script: Latn
  content: This document defines the railway specific technical and safety requirements
    to minimize the specific hazards for trolleys and portable machines intended for
    use on track, which can arise during the commissioning, operation, maintenance
    and disposal of trolleys and portable machines when used as intended and under
    the conditions foreseen by the manufacturer. This document applies to manually
    propelled trolleys and portable machines with rail wheels or rollers designed
    for work whilst on the track.
