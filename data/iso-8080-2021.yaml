abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for producing and testing an unsealed
    anodic coating on titanium and titanium alloys. The anodic coating is produced
    by the sulfuric acid process. The coating is used with solid film lubricants for
    protection of titanium fasteners against galling, for limited protection of less
    noble metals against galvanic corrosion when in contact with titanium or for other
    approved uses.
