abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1287:2005 specifies the application module AP239 activity
    recording. The following are within the scope of this part of ISO 10303: recording
    the usage of a product;recording the maintenance activities on a product;recording
    the use of resources during usage of a product;recording the use of resources
    during the maintenance of a product;recording observations against a product or
    its support solution;relating the record of an activity to the work order, work
    request and work definition from which it arose.'
