abstract:
- language: en
  script: Latn
  content: This document specifies a method using a shear test apparatus for measuring
    the in-plane shear stress/shear strain response, shear modulus and shear strength
    of continuous-fibre-reinforced plastic composite materials with fibre orientations
    of 0° and 0°/90°. This method is applicable to thermoset and thermoplastic matrix
    laminates made from unidirectional layers/non-woven fabrics and/or fabrics including
    unidirectional fabrics, with the fibres oriented at 0° and 0°/90° to the specimen
    axis, where the lay-up is symmetrical and balanced about the specimen mid-plane.
    The method is suitable for determining shear properties in both the linear and
    nonlinear load-deformation range even at shear strains greater than 5 %. Short
    and long fibre-reinforced plastic composites can also be tested using this document.
