abstract:
- language: en
  script: Latn
  content: ISO 9379:2005 is for hinged/pivoted and sliding doorsets with latches,
    for pedestrian use. ISO 9379:2005 defines the test methods to determine the forces
    to open/close doors and to engage/release and lock/unlock the hardware using a
    key or handle. ISO 9379:2005 is only applicable to the manual operation doorsets.
    The tests are applicable to doorsets of any material. ISO 9379:2005 is not applicable
    to the measurement of forces for doorsets with self closing devices engaged or
    to doorsets with special hardware e.g. emergency exit devices.
