abstract:
- language: en
  script: Latn
  content: 'This document specifies, for ropes of different kinds, a method of determining
    each of the following characteristics: — linear density; — diameter; — lay length;
    — braid pitch; — elongation; — breaking force. This document also provides a method
    for measuring water repellence, lubrication and finish content, when requested
    by the customer.'
