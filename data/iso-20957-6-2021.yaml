abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements and test methods for treadmills
    in addition to the general safety requirements and test methods of ISO 20957‑1.
    It is intended that this document is applied together with ISO 20957‑1. This document
    deals with significant hazards, hazardous situations and events relevant to stationary
    training equipment used as intended and under the conditions of misuse foreseeable
    by the manufacturer (see Clause 4). This document is applicable to power-driven
    as well as to non-power/manually driven training equipment type treadmills (hereafter
    referred to as treadmills) with the classes S, H and I and classes A, B and C
    regarding accuracy. This document is not applicable to treadmills which are manufactured
    before it publication.
