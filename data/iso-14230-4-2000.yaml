abstract:
- language: en
  script: Latn
  content: This part of ISO 14230 specifies the requirements for the Keyword Protocol
    2000 (KWP 2000) data link and connected vehicle and scan tool when used to comply
    with on-board diagnostic (OBD) requirements for emission-related test data. This
    part of ISO 14230 only specifies requirements relative to the Keyword Protocol
    2000 for OBD purposes. Complete specification can be found in ISO 14230 parts
    1 to 3 and in ISO 14229. ISO 14230-1, ISO 14230-2 and ISO 14230-3 are applicable
    for OBD purposes only as explicitly referenced in this part of ISO 14230.
