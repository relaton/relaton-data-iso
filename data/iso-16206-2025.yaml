abstract:
- language: en
  script: Latn
  content: This document specifies a method for the quantitative analysis of residual
    quartz (i.e. alpha-quartz) in silica bricks within the mass fraction range of
    0,3 % to 5,0 %, by X-ray diffraction (XRD) using a Bragg-Brentano diffractometer.
    This document includes details of sample preparation and of preliminary establishment
    of a working curve using external standards. This document does not address the
    safety issues associated with its use. The ground silica brick powders and reference
    materials may cause damage to lungs through prolonged or repeat inhalation during
    tests. It is responsibility of the users of this standard to establish appropriate
    safety and health practices.
