abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for the management of decentralized
    water reuse systems and water reuse applications in urban areas. This document
    addresses decentralized water reuse systems in their entirety and is applicable
    to any water reuse systems component (e.g. reclaimed water, source water, treatment,
    storage, distribution, operation and maintenance, and monitoring). This document
    covers: management of each system component of a decentralized water reuse system;
    specific aspects for consideration and emergency response. This document does
    not cover monitoring parameters and regulatory values of a decentralized water
    reuse system.'
