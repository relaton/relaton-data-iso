abstract:
- language: en
  script: Latn
  content: This document specifies the measurement of internal stress by sin2φ method
    using XRD analysis for hard ceramic coatings. This test method applies to hard
    ceramic coatings that are polycrystalline. This test method is valid when the
    relationship between sin2φ and diffraction angle is linear. The internal stress
    is calculated using the sin2φ method to analyse stress behaviour within the coating
    layer. The test method is applicable to hard ceramic coatings used for aerospace,
    automobile, cutting-tool, etc.
