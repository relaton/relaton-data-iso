abstract:
- language: en
  script: Latn
  content: The method of classification given in this part of ISO 4433 serves to determine
    the chemical resistance of polyolefin pipes, fittings and valve components designed
    for the conveyance of chemicals in the absence of pressure and stress such as
    earth loads, dynamic internal stresses. To determine the chemical resistance,
    the method uses the change in mass and the changes in tensile properties which
    result from the storage of test pieces, taken from such pipes, fittings and valve
    components, in chemicals. The test is carried out in accordance with ISO/DIS 4433-1.
    This part of ISO 4433 is also applicable to polyolefin sheets as appropriate.
