abstract:
- language: en
  script: Latn
  content: 'This document specifies common safety requirements of paper, fibre and
    pulp machinery and equipment, hereinafter referred to as “machinery”. This document
    specifies the significant hazards, hazardous situations or hazardous events relevant
    to the machine as listed in Annex XXX which arise during the various phases in
    the life of the machine and describes methods for the elimination or reduction
    of these hazards when it is used as intended and under conditions of misuse which
    are reasonably foreseeable by the manufacturer. This document is also applicable
    to offline paper finishing machines and their associated hazards. This document
    is not applicable to: — machinery used in paper converting; — pressure equipment
    used in paper making and paper finishing machines; — the safety of the industrial
    process itself; — auxiliary equipment that provides material, fluids or energy
    to other machinery and that does not itself perform a paper or pulp processing
    function, for example steam and condensate systems, mechanical drives, machine
    ventilation, hall ventilation, lubrication systems, compressed air systems and
    electrification systems; — machinery intended for use in potentially explosive
    atmospheres. This document is not applicable to paper and pulp process equipment
    manufactured before the date of its publication.'
