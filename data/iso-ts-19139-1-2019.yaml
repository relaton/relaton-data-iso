abstract:
- language: en
  script: Latn
  content: This document defines XML based encoding rules for conceptual schemas specifying
    types that describe geographic resources. The encoding rules support the UML profile
    as used in the UML models commonly used in the standards developed by ISO/TC 211.
    The encoding rules use XML schema for the output data structure schema. The encoding
    rules described in this document are not applicable for encoding UML application
    schema for geographic features (see ISO 19136 for those rules).
