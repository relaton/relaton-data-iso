abstract:
- language: en
  script: Latn
  content: This document specifies methods and means of monitoring for inadvertent
    movement and illicit trafficking of radioactive material. It provides guidelines
    on the use of both stationary and portable, for example hand-held, instruments
    to monitor for radiation signatures from radioactive material. Emphasis is placed
    on the operational aspects, i.e., requirements derived for monitoring of traffic
    and commodities mainly at border-crossing facilities. Although the term border
    is used repeatedly in this document, it is meant to apply not only to international
    land borders but also maritime ports, airports, and similar locations where goods
    or individuals are being checked. This document does not specifically address
    the issue of detection of radioactive materials at recycling facilities, although
    it is recognized that transboundary movement of metals for recycling occurs, and
    that monitoring of scrap metals might be done at the borders of a state. This
    document is applicable to —    regulatory bodies and other competent authorities
    seeking guidance on implementation of action plans to combat illicit trafficking,
    —    law enforcement agencies, for example border guards, to obtain guidelines
    on recommended monitoring procedures, —    equipment manufacturers in order to
    understand minimum requirements derived from operational necessities according
    to this document, and —    end-users of radiation detection equipment applicable
    to this document.
