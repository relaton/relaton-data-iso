abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of gel content in
    radiation cross-linked polyamide and its composite, establishes general principles,
    and gives guidelines for performance of measurements. The gel content test is
    applicable for PA6, PA66 and their modified compounds, such as flame-retardant,
    reinforced, filled ones, etc.This document does not apply to aliphatic and aromatic
    polyamides that are insoluble in formic acid, as well as their modified plastics.
