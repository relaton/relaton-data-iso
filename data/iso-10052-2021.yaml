abstract:
- language: en
  script: Latn
  content: This document specifies field survey methods for measuring a) airborne
    sound insulation between rooms, b) impact sound insulation of floors, c) airborne
    sound insulation of façades, and d) sound pressure levels in rooms caused by service
    equipment. The methods described in this document are applicable for measurements
    in rooms of dwellings or in rooms of comparable size with a maximum of 150 m3.
    For airborne sound insulation, impact sound insulation and façade sound insulation
    the method gives values which are (octave band) frequency dependent. They can
    be converted into a single number characterising the acoustical performances by
    application of ISO 717-1 and ISO 717-2. For heavy/soft impact sound insulation,
    the results also are given as A-weighted maximum impact sound pressure level.
    For service equipment sound the results are given directly in A - or C -weighted
    sound pressure levels.
