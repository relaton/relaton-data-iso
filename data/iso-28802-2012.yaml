abstract:
- language: en
  script: Latn
  content: This International Standard provides an environmental survey method for
    the assessment of the comfort and well-being of occupants of indoor and outdoor
    environments. It is not restricted to any particular environment, but provides
    the general principles that allow assessment and evaluation. It presents the principles
    for conducting an environmental survey to assess the comfort and well-being of
    people in environments. It gives guidance on the design of the survey, as well
    as on the environmental measurements used to quantify the environment and the
    subjective assessment methods used to quantify the occupants' responses to that
    environment. It does not provide guidance on the design of subjective scales.
    It is applicable to built as well as other environments, including vehicle and
    outdoor environments, and to all the occupants of those environments who can be
    considered as providing valid responses to an environmental survey. There may
    be specific features of certain types of environment that have to be taken into
    account; however, the general principles it outlines will apply. This International
    Standard is not restricted to specific environmental components. It includes assessment
    of thermal environments, the acoustic environment, the visual and lit environment,
    air quality and other environmental factors that could be considered to influence
    the comfort and well-being of the occupants of an environment. It is a basic ergonomics
    standard which can contribute to the development of standards concerned with specific
    environments such as those found in buildings. It is intended to be used by people
    involved in the general assessment and evaluation of physical environments, including
    general ergonomics practitioners as well as those who develop standards and guidelines
    for specific applications. NOTE The results of the environmental survey produced
    by the application of this International Standard may identify specific problems
    that require expert advice.
