abstract:
- language: en
  script: Latn
  content: ISO 17258:2015 describes a methodology for establishing the level of quality,
    performance, and productivity of processes, products, and services according to
    Six Sigma principles. It is applicable to all sectors (industries, services, administration,
    etc.) and to all types of organizations, whether it is already involved in an
    improvement programme such as Six Sigma, Lean, or not. In particular, it can be
    used to initiate a Six Sigma programme by providing a selection of improvement
    projects. NOTE. The focus of this methodology is on criteria, measures, measurement
    process, and comparison process. The results can then be used to identify good
    practices of benchmarking.
