abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the most important metrological
    and design characteristics of plain limit gauges of linear size. This document
    defines the different types of plain limit gauges used to verify linear dimensional
    specifications associated with linear size. This document also defines the design
    characteristics and the metrological characteristics for these limit gauges as
    well as the new or wear limits state maximum permissible limits (MPLs) for the
    new state or wear limits state for these metrological characteristics. In addition,
    this document describes the use of limit gauges. It covers linear sizes of up
    to 500 mm.
