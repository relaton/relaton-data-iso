abstract:
- language: en
  script: Latn
  content: 'This document specifies a data model of visualization elements for 3D
    data exchange for error information feedback between product lifecycle management
    (PLM) and manufacturing execution system (MES or MOM: manufacturing operations
    management) in the engineering plant industry. The followings are within the scope
    of this document: a)       data model of visualization elements for the engineering
    plant industry with complex and long-lifespan products; b)       definitions of
    the properties of the data model for the visualization elements of the PLM-MES
    interface; c)        relationship with the information model of visualization
    elements as defined in ISO 10303-239; d)       relationship with the information
    model of the visualization elements as defined in IEC 62264 series; e)       information
    flow with equipment used in production and related measuring equipment as managed
    inside MES.'
