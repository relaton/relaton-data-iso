abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1477:2010-03 specifies the application module for System
    modelling. The following is within the scope of ISO/TS 10303-1477:2010-03: This
    part of ISO 10303 specifies an application module for the representation of the
    variety of general model classifications used to support model-based systems engineering.
    This includes all models used to characterize the physical structure and its behaviour
    and the full range of models used to support systems engineering trade studies.'
