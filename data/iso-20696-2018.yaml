abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for sterile urethral
    catheters for single use, with or without a balloon. This document does not include
    drainage catheters covered by ISO 20697, e.g. ureteral catheters, nephrostomy
    catheters, and suprapubic catheters. This document also excludes ureteral stents.
    NOTE Ureteral stents are covered in ASTM F1828‑97.
