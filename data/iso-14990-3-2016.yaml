abstract:
- language: en
  script: Latn
  content: ISO 14990-3:2016 specifies the particular safety requirements for the electrical
    equipment and its components incorporated in self-powered (utilizing on-board
    electric power sources) electrically-driven earth-moving machines (EMMs). It is
    applicable to those machines using on-board voltages in the range of 50 V?36 kV
    AC r.m.s. at any frequency, and 75 V?36 kV DC ? including any repetition rate
    of pulsating DC? intended for outdoor use. Voltages occurring within devices are
    not considered to be on-board voltages and are thus not within its scope. It is
    intended to be used in conjunction with ISO 14990‑1, which gives general requirements
    for EMMs regardless of how they are powered. Requirements specific to externally-powered
    machines are given in ISO 14990‑2. It is possible to have an EMM that is both
    self-powered and externally powered (e.g. a battery powered machine having a built-in
    charger with power supply function), in which case ISO 14990‑2 is also applicable.
