abstract:
- language: en
  script: Latn
  content: ISO 19403-2:2017 specifies a test method to measure the contact angle for
    the determination of the surface free energy of a solid surface. The method can
    be applied for the characterization of substrates and coatings. NOTE 1 For the
    determination of the surface free energy of polymers and coatings, either the
    method in accordance with Owens, Wendt, Rabel and Kaelble or the method in accordance
    with Wu is used preferably. NOTE 2 The morphological and chemical homogeneity
    have an influence on the measuring results. NOTE 3 The procedures indicated in
    ISO 19403-2:2017 are based on the state-of-the-art employing the drop projection
    method in penumbral shadow. Other methods are not excluded. NOTE 4 Measuring the
    contact angle on powders is not part of ISO 19403-2:2017. For further information,
    see the bibliography.
