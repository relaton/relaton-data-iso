abstract:
- language: en
  script: Latn
  content: 'ISO 15877-7:2009 gives guidance for the assessment of conformity included
    in the manufacturer''s quality plan as part of his/her quality system. ISO 15877-7:2009
    includes: - provisions for materials, components, joints and assemblies given
    in the applicable part(s) of ISO 15877; - provisions for the manufacturer''s quality
    system, which can conform to ISO 9001; - definitions and procedures applied if
    certification is involved; in which case, the certification body can be accredited
    to ISO/IEC Guide 65 or ISO/IEC Guide 62, as applicable. In conjunction with the
    other parts of ISO 15877, ISO 15877-7:2009 is applicable to chlorinated poly(vinyl
    chloride) (PVC-C) piping systems intended to be used for hot and cold water installations
    within buildings for the conveyance of water, whether or not intended for human
    consumption (domestic systems), under design pressures and temperatures appropriate
    to the class of application (see Table 1 of ISO 15877-1:2009).'
