abstract:
- language: en
  script: Latn
  content: This document specifies two methods for the assessment of surface resistance
    to different kinds of visible scratches. It is applicable to the rigid surfaces
    of all finished products, regardless of their material. It does not apply to finishes
    on leather and fabrics. Method A is suitable for all types of surface coatings
    and coverings except for melamine faced boards (in accordance with EN 14322) and
    HPL (in accordance with EN 438-1). It simulates measurable penetrating and/or
    deforming scratches. Method B is suitable for all types of surfaces. It simulates
    first visible traces (e.g. scratches, marks) that can also be a change in the
    gloss. The test is intended to be carried out on a part of finished furniture.
    It can, however, be carried out on test panels of the same material, finished
    in an identical manner to the finished product, and of a size sufficient to meet
    the requirements of the test. The test is carried out on unused surfaces without
    any defects or damages.
