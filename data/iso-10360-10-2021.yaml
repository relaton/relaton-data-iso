abstract:
- language: en
  script: Latn
  content: 'This document specifies the acceptance tests for verifying the performance
    of a laser tracker by measuring calibrated test lengths, according to the specifications
    of the manufacturer. It also specifies the reverification tests that enable the
    user to periodically reverify the performance of the laser tracker. The acceptance
    and reverification tests given in this document are applicable to laser trackers
    utilizing a retroreflector, or a retroreflector in combination with a stylus or
    optical distance sensor, as a probing system. Laser trackers that use interferometric
    measurement (IFM), absolute distance measurement (ADM) or both can be verified
    using this document. This document can also be used to specify and verify the
    relevant performance tests of other spherical coordinate measurement systems that
    use cooperative targets, such as “laser radar” systems. NOTE       Systems which
    do not track the target, such as laser radar systems, will not be tested for probing
    performance. This document does not explicitly apply to measuring systems that
    do not use a spherical coordinate system. However, interested parties can apply
    this document to such systems by mutual agreement. This document specifies: —   
    performance requirements that can be assigned by the manufacturer or the user
    of the laser tracker; —    the manner of execution of the acceptance and reverification
    tests to demonstrate the stated requirements; —    rules for proving comformity;
    —    applications for which the acceptance and reverification tests can be used.'
