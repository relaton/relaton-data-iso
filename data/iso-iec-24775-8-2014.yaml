abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 24775-8:2014(E) models various details of the following objects
    of the media library for monitoring: Library, Drives, Changer Devices, Slots,
    IO Slots, SCSI Interfaces and SCSI and FC Target Ports, Physical Tapes, Physical
    Package and Magazines. This International Standard, together with ISO/IEC 24775-1
    to ISO/IEC 24775-7 and replaces ISO/IEC 24775, second edition, published in 2011,
    and constitutes a technical revision. It includes the following technical changes:
    - reorganization into eight parts; - maturity identification using stages and
    new profiles.'
