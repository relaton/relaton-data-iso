abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides recommendations to safeguard
    the process for the analysis of items of potential forensic value. It includes
    requirements and recommendations for the selection and application of suitable
    method(s) for the analysis to meet the needs of the customer and fulfil the request.
    The requirements are designed to ensure the use of suitable methods, proper controls,
    qualified personnel and appropriate analytical strategies throughout the forensic
    analysis of items. This document is applicable to activities conducted by a forensic
    service provider that occur at the scene and within a facility. This document
    is applicable to all disciplines of forensic science; however, it is not applicable
    to the recovery of digital data which is covered by ISO/IEC 27037. The requirements
    and recommendations facilitate the comprehensive, accurate and reliable analysis
    of items.
