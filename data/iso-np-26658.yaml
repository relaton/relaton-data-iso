abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the responsible management of
    plantation forests, as defined in Clause 3. It establishes auditable and verifiable
    requirements, including minimum mandatory elements and performance‑based indicators
    intended to support measurable sustainability outcomes at the forest management
    unit level. The document provides a technical framework that may be used in conjunction
    with voluntary or regulatory programs. The standard is technology‑neutral and
    outcome‑based. It does not prescribe specific silvicultural practices or operational
    methods, allowing the use of legally approved technologies and management approaches
    that achieve the required performance outcomes.
