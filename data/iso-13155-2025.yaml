abstract:
- language: en
  script: Latn
  content: This document defines the basic terms of functional components and performance
    indicators commonly used in the area of refuse collection vehicles (RCV). This
    document also gives classification and requirements for commercial specifications
    for RCVs. It aims to align with terminology that are used internationally. This
    standard provides further vocabulary to those defined in ISO 24161. NOTE           
    ‘Refuse’ and ‘waste’ are used interchangeably in this document.
