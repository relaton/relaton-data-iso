abstract:
- language: en
  script: Latn
  content: ISO/TS 18339:2015 specifies the design of eyepiece cap and light guide
    connector of an endoscope to enable the combination of products from different
    manufacturers. The products intended only for limited combination are out of the
    scope. It is a mechanical connection; it might not generate best results, but
    it allows the user to be able to work. ISO/TS 18339:2015 supports manufacturers
    of components in the design of interfaces.
