abstract:
- language: en
  script: Latn
  content: ISO 8692:2004 specifies a method for the determination of the growth inhibition
    of unicellular green algae by substances and mixtures contained in water or by
    wastewater. The method is applicable for substances that are easily soluble in
    water. With modifications to this method, as described in ISO 14442 and ISO 5667-16,
    the inhibitory effects of poorly soluble organic and inorganic materials, volatile
    compounds, heavy metals and waste water can be tested. A rapid algal growth inhibition
    screening test for wastewater is also included.
