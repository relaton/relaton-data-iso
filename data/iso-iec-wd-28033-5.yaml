abstract:
- language: en
  script: Latn
  content: This document specifies mechanisms for switching of homomorphic encryption
    schemes based on Chimera framework and related optimizations. This section describes
    advanced constructions that rely on ciphertexts that have been defined for the
    FHE schemas BFV/BGV, CKKS and CGGI and use the same security levels. The main
    goal is to be able to convert LWE/RLWE/GLWE ciphertexts encrypted under the FHE
    schemas without decrypting them.
