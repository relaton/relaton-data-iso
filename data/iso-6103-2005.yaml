abstract:
- language: en
  script: Latn
  content: ISO 6103:2005 specifies the maximum permissible values of unbalances for
    various grinding wheels of ISO 603-1 to ISO 603-9 and ISO 603-12 to ISO 603-16
    in the as-delivered condition, with an outside diameter greater than 115 mm and
    maximum operating speed greater than or equal to 16 m/s. It also specifies the
    method for measuring the unbalance and the practical method for testing whether
    a grinding wheel is acceptable or not. ISO 6103:2005 is applicable to bonded abrasive
    grinding wheels in the as-delivered condition. It is not applicable to diamond,
    cubic boron nitride or natural stone grinding wheels, or centreless control wheels,
    lapping and disc wheels, ball wheels or glass grinding wheels.
