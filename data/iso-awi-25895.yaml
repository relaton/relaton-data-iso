abstract:
- language: en
  script: Latn
  content: This document provides a framework for the development of biomimetic products.
    The document links the biomimetic approach with the general product development
    process and locates biomimetic methods and approaches in this process in terms
    of time and content. It is complementary to established standards for general
    product development as well as standards for the product development of special
    products. The present document for the development of biomimetic products can
    be used both for technically driven technology pull processes (in technology,
    solution principles from nature are sought, top down) and for biologically driven
    biology push processes (biology opens up areas of application in technology, bottom
    up), in which the mechanisms of action of a discovered natural phenomenon are
    to be transferred into a technical solution principle. For both types of development,
    the standard provides a description of necessary procedural steps and an overview
    of suitable methods for the steps to be taken. The document is therefore aimed
    at people who want to develop and use biomimetic products, from the fields of
    development, design, application, industry, research, teaching and training, as
    well as students.
