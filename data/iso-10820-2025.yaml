abstract:
- language: en
  script: Latn
  content: This document specifies the irradiation equipment using ultraviolet light
    emitting diode (UV-LED) and optical radiometry for testing the performance of
    semiconducting photocatalytic materials. The UV-LED irradiation equipment specified
    in this document uses UV-LEDs having a peak wavelength of 365 nm in the UV-A range
    and applies for a semiconductor photocatalyst exhibiting a photocatalytic function
    at this wavelength. This document applies only to irradiation equipment using
    UV-LED. ISO 10677[2] is applicable for equipment using conventional UV light sources
    such as fluorescent lamps.
