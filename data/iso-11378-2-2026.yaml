abstract:
- language: en
  script: Latn
  content: This document specifies the test method for assessing the propensity of
    textile floor coverings to soiling in the absence of abrasive wear and texture
    changes using a standard artificial soil composition. This document applies to
    the testing of unused textile floor coverings of all types. This document can
    also be extended to assess the effects of fibre finishes, cleaning chemicals and
    cleaning equipment (see Annex A).
