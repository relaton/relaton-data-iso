abstract:
- language: en
  script: Latn
  content: ISO 6162-1:2012 gives general and dimensional specifications for flanged
    heads, split flange clamps (FCS and FCSM), one-piece flange clamps (FC and FCM),
    ports and mounting surfaces applicable to four-screw, split and one-piece flange
    clamp type tube connectors and hose fittings for use at pressures of 3,5 MPa (35
    bar ) to 35 MPa (350 bar). It also specifies the dimensions of the seals to be
    used, as well as the grooves that house the seals. ISO 6162-1:2012 also recognizes
    the need to accommodate metric screw fasteners (type 1), as well as to provide
    a means to use existing inch screw fasteners (type 2). These connections are intended
    for application in hydraulic systems on industrial and commercial products where
    it is desired to avoid the use of threaded connectors. Surges of pressure higher
    than the nominal ratings will reduce the ability of the flange connections to
    retain the hydraulic fluid. This needs to be taken into account in the design
    of the hydraulic system.
