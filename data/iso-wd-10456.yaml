abstract:
- language: en
  script: Latn
  content: ISO 10456:2007 specifies methods for the determination of declared and
    design thermal values for thermally homogeneous building materials and products,
    together with procedures to convert values obtained under one set of conditions
    to those valid for another set of conditions. These procedures are valid for design
    ambient temperatures between -30 °C and +60 °C. ISO 10456:2007 provides conversion
    coefficients for temperature and for moisture. These coefficients are valid for
    mean temperatures between 0 °C and 30 °C. ISO 10456:2007 also provides design
    data in tabular form for use in heat and moisture transfer calculations, for thermally
    homogeneous materials and products commonly used in building construction.
