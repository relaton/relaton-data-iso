abstract:
- language: en
  script: Latn
  content: Specifies two methods for the quantitative determination of mineral oil
    content in soil by IR spectrometry (method A) and gas chromatography (method B).
    Method A is applicable to mineral oil contents above 20 mg/kg on a dry matter
    basis, method B to those above 100 mg/kg. Petrol cannot be determined quantitatively
    with these methods, due to loss of volatile compounds during sample pretreatment.
    Weak polar compounds of recent biogenic origin may be determined as mineral oil.
    Relatively high contents of polar compounds give interferences in the determination.
    Halogenated hydrocarbons also may interfere.
