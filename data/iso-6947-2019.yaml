abstract:
- language: en
  script: Latn
  content: This document defines welding positions for testing and production, for
    butt and fillet welds, in all product forms. Annex A gives examples of the limits
    of the slope of a weld axis and the rotation of the weld face about the weld axis
    for welding positions in production welds. Annex B gives a comparison of this
    document and US designation systems for welding positions.
