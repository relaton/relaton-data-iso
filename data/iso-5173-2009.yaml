abstract:
- language: en
  script: Latn
  content: ISO 5173:2009 specifies a method for making transverse root, face and side
    bend tests on test specimens taken from butt welds, butt welds with cladding (subdivided
    into welds in clad plates and clad welds) and cladding without butt welds, in
    order to assess ductility and/or absence of imperfections on or near the surface
    of the test specimen. It also gives the dimensions of the test specimen. In addition
    ISO 5173:2009 specifies a method for making longitudinal root and face bend tests
    to be used instead of transverse bend tests for heterogeneous assemblies when
    base materials and/or filler metal have a significant difference in their physical
    and mechanical properties in relation to bending. ISO 5173:2009 applies to metallic
    materials in all forms of product with welded joints made by any fusion arc welding
    process.
