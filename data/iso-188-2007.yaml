abstract:
- language: en
  script: Latn
  content: 'ISO 188:2007 specifies accelerated ageing or heat resistance tests on
    vulcanized or thermoplastic rubbers. Two methods are given: Method A: air-oven
    method using a cell-type oven or cabinet oven with low air speed and a ventilation
    of 3 to 10 changes per hour; Method B: air-oven method using a cabinet oven with
    forced air circulation by means of a fan and a ventilation of 3 to 10 changes
    per hour.'
