abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for dimensions, sectional properties
    and tolerances for hot-rolled sections as follows: equal angle LE (L section);
    unequal angle LU (L section); sloping flange channel US (U section); sloping flange
    I beam IS(I section). This document is used together with technical delivery conditions
    especially, but is not limited, ISO 630-1, ISO 630-2, ISO 630-3, ISO 630-5 and
    ISO 630-6.'
