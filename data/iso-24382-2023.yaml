abstract:
- language: en
  script: Latn
  content: This document specifies the quality requirements, analytical methods, and
    packaging, labelling, marking, storage and transportation conditions for bee pollen.
    This document is applicable to bee pollen collected at the entrance of beehives
    by Apis mellifera and other bees’ species of colonies, as well as dried, frozen
    and lyophilized bee pollen. It does not apply to crushed powdery bee pollen and
    products made from bee pollen.
