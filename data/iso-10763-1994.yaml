abstract:
- language: en
  script: Latn
  content: Specifies sizes and nominal working pressures for tubes with outside diameters
    in accordance with ISO 4397 and wall thicknesses or mechanical properties in accordance
    with ISO 3304 (seamless precision steel tubes) and ISO 3305 (welded precision
    steel tubes). The nominal working pressures included herein reflect a design factor
    ratio of 4 to 1 between the static burst and nominal working pressures.
