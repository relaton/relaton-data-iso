abstract:
- language: en
  script: Latn
  content: ISO 18543:2017 specifies the accelerated ageing test and requirements for
    electrochromic (EC) glazings. The test method described in ISO 18543:2017 is only
    applicable to chromogenic glazings that can be switched using an electrical stimulus
    from high to low transmission states and vice versa. This test method is not applicable
    to other chromogenic glazings such as photochromic and thermochromic glazings,
    which do not respond to electrical stimulus. This test method is applicable to
    any electrochromic glazing fabricated for vision glass (e.g. insulating glass
    unit, laminated glass) for use in buildings such as doors, windows, skylights
    and exterior wall systems and glazing exposed to solar radiation. The layers used
    for constructing the EC glazing and for electrochromically changing the optical
    properties can be inorganic or organic materials.
