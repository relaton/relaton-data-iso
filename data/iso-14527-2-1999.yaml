abstract:
- language: en
  script: Latn
  content: This part of ISO 14527 specifies the methods of preparation of test specimens
    and the test methods to be used in determining the properties of urea-formaldehyde
    and urea/melamine-formaldehyde powder moulding compounds (UF- and UF/MF-PMCs).
    Requirements for handling test material and for conditioning both the test material
    before moulding and the specimens before testing are given here. Procedures and
    conditions for the preparation of test specimens and procedures for measuring
    properties of the materials from which these specimens are made are given. Properties
    and test methods which are suitable and necessary to characterize PMCs are listed.
    The properties have been selected from the general test methods in ISO 10350-1.
    Other test methods in wide use for, or of particular significance to, PMCs are
    also included in this part of ISO 14527, as are the designatory properties found
    in ISO 14527-1. In order to obtain reproducible and comparable test results, it
    is necessary to use the methods of preparation and conditioning, the specimen
    dimensions and the test procedures specified herein. Values determined will not
    necessarily be identical to those obtained using specimens of different dimensions
    or prepared using different procedures.
