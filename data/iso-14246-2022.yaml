abstract:
- language: en
  script: Latn
  content: 'This document specifies the procedures and acceptance criteria for manufacturing
    tests and examinations (sometimes called "initial inspection and tests") of valves
    designed and type tested in accordance with ISO 10297. This document is applicable
    to: a) cylinder valves intended to be fitted to refillable transportable gas cylinders;
    b) main valves (excluding ball valves) for bundles of cylinders; c) cylinder valves
    or main valves with integrated pressure regulator (VIPR); d) valves for pressure
    drums and tubes. NOTE       Where there is no risk of ambiguity, cylinder valves,
    main valves, VIPR and valves for pressure drums and tubes are addressed with the
    collective term “valves” within this document. The principles of these manufacturing
    tests and examinations can be beneficially applied to cylinder valves type tested
    to national or International Standards other than ISO 10297.'
