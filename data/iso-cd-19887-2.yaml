abstract:
- language: en
  script: Latn
  content: 'This standard establishes the minimum requirements for fuel system components
    intended for use on hydrogen-fuelled rail vehicles. It references ISO/FDIS 19887:2024
    for the main hydrogen component requirements and focuses on the specific details
    applicable to rail vehicle applications. This standard is applicable to components
    incorporated in Hydrogen Fuel Systems specified in IEC 63341-2 “Railway applications
    – hydrogen and fuel cell systems for rolling stock - Part 2: Hydrogen fuel system”.
    The scope of this standard covers the components already considered in ISO/FDIS
    19887:2024 and additional components, relevant for rail applications, such as
    pressure switches, flow restrictors (e.g. for purge lines), flexible fuel lines
    for intercar connections and quick-couplings (e.g. for purge interfaces). The
    definitive list of such additional components need to be finalized in the frame
    of the future working group. The intended outline in appendix A provide the preliminary
    list of fuel component to be addressed in the future standard. The scope of this
    standard excludes the same components as ISO/FDIS 19887:2024 (e.g. fuel containers,
    refuelling receptacles). NOTE: It is expected that ISO/TC 197 will approve a multipart
    series based on ISO 19887 and ISO/FDIS:2024 will be published as ISO/19887-1 ‘Gaseous
    hydrogen – Fuel system components for hydrogen fuelled vehicles – Part 1 Land
    vehicles’ within 2024.'
