abstract:
- language: en
  script: Latn
  content: This part of ISO 22056 specifies a test sequence for qualification of the
    lubricating fluid filter elements under customer specified conditions. These test
    procedures are for laboratory conditions and will need to be augmented by system
    level testing including actual conditions of use, for example the operating fluid
    or contamination. The test data resulting from application of this part of ISO
    22056 can be used to compare the performance of aerospace lubrication filter elements.
