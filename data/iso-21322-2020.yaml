abstract:
- language: en
  script: Latn
  content: This document gives guidance for the enumeration and/or detection of microorganisms
    present in a cosmetic product that is impregnated or coated onto a substrate (i.e.
    wipes and masks) where sampling and microbiological influence of the manufactured
    product presents particular challenges in terms of microbiological sampling and
    testing. The principle of this document can also be applied to test similar products
    (e.g. cushion, impregnated sponge, etc.) or applicators (e.g. brush, puff, sponge,
    etc.) with modification of the procedure as appropriate.
