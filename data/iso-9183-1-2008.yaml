abstract:
- language: en
  script: Latn
  content: 'ISO 9183-1:2007 specifies the basic dimensions and tolerances in millimetres
    of wear for press dies, type A, intended for use mainly in large press dies. It
    also specifies the size and positions of the clearance holes for attachment. ISO
    9183-1:2007 gives material indications, and specifies the designation of wear
    plates for press dies, type A, which meet the requirements of this part of ISO
    9183. Two thicknesses of this type of wear plate are specified: type A1, with
    a thickness, t, of 20 mm, and type A2, with a thickness, t, of 12 mm.'
