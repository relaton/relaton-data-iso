abstract:
- language: en
  script: Latn
  content: This document extends the base nomenclature provided in ISO/IEEE 11073-10101:2020
     to support terminology for implantable cardiac devices. Devices within the scope
    of this nomenclature are implantable devices such as pacemakers, defibrillators,
    devices for cardiac resynchronization therapy, and implantable cardiac monitors.
    This nomenclature defines the terms necessary to convey a clinically relevant
    summary of the information obtained during a device interrogation. The nomenclature
    extensions may be used in conjunction with other IEEE 11073 standard components
    (e.g., ISO/IEEE 11073-10201 [B2] ) or with other standards, such as Health Level
    Seven International (HL7).
