abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the simultaneous determination
    of primary aromatic amines (PAAs) in organic pigments using external reference
    standards. The separation, identification and quantification of PAAs are achieved
    by high performance liquid chromatography (HPLC) analysis with gradient elution
    and diode array detection (DAD) and/or mass spectrometry detection (MSD) after
    an extraction step. This analytical procedure can be applied to all organic pigments.
    The method allows the determination of extractable PAA content including sulfonated
    PAAs.
