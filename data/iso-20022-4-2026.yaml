abstract:
- language: en
  script: Latn
  content: This document complements the ISO 20022 Metamodel, as specified in ISO
    20022-1, with the XML syntax transformation rules to be applied by the ISO 20022
    Registration Authority in order to translate an ISO 20022 compliant MessageDefinition
    into an XML Schema for the description and validation of XML Messages. It specifies
    the transformation rules from the Logical to the Physical level. It is a deterministic
    transformation, meaning that the resulting XML Schema is completely predictable
    for a given MessageDefinition. There is neither manual input to the transformation
    itself nor manual adjustment to the result of the transformation.
