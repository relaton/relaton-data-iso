  script: Latn
  content: 'ISO/TS 10303-1731:2019 specifies the application module for Constructive
    solid geometry 2D. The following are within the scope of ISO/TS 10303-1731:2019:
    constructive solid geometry in 2D; half space; 2D primitives; replication of a
