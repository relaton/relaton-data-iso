abstract:
- language: en
  script: Latn
  content: 'This document provides a framework for communicating on the use of Privacy Enhancing Technologies (PETs) and create consumer trustworthiness: • Principles, guidance and requirements are provided to supply side stakeholders: o stakeholders involved in privacy by design activities (developers, auditors, and business managers) on how they communicate and explain PETs along with their contexts of use. o stakeholders involved in disseminating PETS in the market (catalogs, repository, open-source solution) on how they communicate on PETS along with their contexts of use in terms of successful use and demonstrated effectiveness. • Principles, guidance and requirements are provided to demand side stakeholders: o stakeholders involved in assessing PETS (e.g. consumer associations) on how they assess the supply side and how they communicate and explain PETs along with their contexts of use. o consumers involved in using product and services. • Requirements on a training program for both supply-side and demand-side stakeholders are identified.'
