abstract:
- language: en
  script: Latn
  content: This document provides testing procedures for evaluating proppants used
    in hydraulic fracturing and gravel packing operations. NOTE            Proppants
    mentioned in this document refer to sand, ceramic, resin-coated, gravel packing
    proppants, and other materials used for hydraulic fracturing and gravel packing
    operations. This document supplements API Std 19C, 2nd edition (2018), the requirements
    of which are applicable with the exceptions specified in this document. This document
    provides consistent methodology for testing performed on hydraulic fracturing
    and/or gravel packing proppants.
