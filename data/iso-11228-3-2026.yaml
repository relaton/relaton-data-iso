abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides recommendations for repetitive
    work tasks involving repetitive movements and exertions of the upper extremity.
    It provides guidance on the identification and assessment of risk factors commonly
    associated with repetitive movements and exertions of the upper limbs, thereby
    allowing evaluation of the related health risks to the working population. The
    recommendations apply to the adult working population and are intended to give
    reasonable protection for nearly all healthy adults. This document does not address
    the manual handling of objects while using lift-assistive devices such as exoskeletons
    and does not address the needs of pregnant women or persons with disabilities.
