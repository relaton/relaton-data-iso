abstract:
- language: en
  script: Latn
  content: ISO 11783 specifies a serial data network for control and communications
    on forestry or agricultural tractors and mounted, semi-mounted, towed or self-propelled
    implements. Its purpose is to standardize the method and format of transfer of
    data between sensors, actuators, control elements, and information-storage and
    -display units, whether mounted on, or part of, the tractor or implement. ISO
    11783 also provides an open interconnect system for on-board electronic systems
    used by agriculture and forestry equipment. It is intended to enable electronic
    control units (ECUs) to communicate with each other, providing a standardized
    system. This document defines and describes the network's 250 kbit/s, twisted,
    non-shielded, quad-cable physical layer and an alternative cable and architecture
    named twisted pair physical layer (TPPL) based on a 250 kbit/s, un-shielded, twisted
    pair cable network layer which is fully backward compatible to twisted quad based
    machines and devices. NOTE Where not differently specified, requirements are valid
    for both twisted quad and TPPL.
