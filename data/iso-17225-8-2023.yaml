abstract:
- language: en
  script: Latn
  content: 'This document determines the fuel quality classes and specifications of
    graded densified solid biofuels produced from thermally treated biomass for commercial
    applications and industrial use. This document covers pellets and briquettes produced
    from the following raw materials (see ISO 17225‑1:2021, Table 1): —    woody biomass;
    —    herbaceous biomass; —    fruit biomass; —    aquatic biomass; —    blends
    and mixtures. Subcategories of these raw materials are included. This document
    does not consider products which are marketed as charcoal or as charcoal products.
    For these products, see ISO 17225‑1:2021, Table 14. NOTE      Health, safety and
    environmental issues for solid biofuels are important and need special attention;
    however, they are outside the scope of this document.'
