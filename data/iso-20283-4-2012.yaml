abstract:
- language: en
  script: Latn
  content: ISO 20283-4:2012 provides guidelines for the instrumentation, measurement, and data processing procedures required to obtain reliable vibration data on ship propulsion systems. It also gives guidelines for the application of specific measuring techniques, which are common and adequate for measuring the mechanical vibration on propulsion plants of seagoing and inland vessels. The measuring techniques can be applied to diesel engine as well as turbine or electrically driven plants, always considering the specific limitation of application of each individually described procedure. The procedures specified in this part of ISO 20283 focus on repetitive mechanical vibration (steady-state or quasi-stationary like a sweep) and can therefore be inadequate for measuring and evaluating transient, very fast-changing or shock signals. ISO 20283-4:2012 mainly specifies techniques for measuring the mechanical vibration of the main propulsion plant during sea trials. The same or similar measuring principles can also be used for other purposes, such as performance monitoring, investigations of abnormal vibration in service, and evaluation of the condition of repaired parts. However, in such cases, the measuring procedure needs to be adapted to the specific requirements.
