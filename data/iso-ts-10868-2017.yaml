abstract:
- language: en
  script: Latn
  content: ISO/TS 10868:2017 provides guidelines for the characterization of compounds
    containing single-wall carbon nanotubes (SWCNTs) by using optical absorption spectroscopy.
    The aim of this document is to describe a measurement method to characterize the
    diameter, the purity, and the ratio of metallic SWCNTs to the total SWCNT content
    in the sample. The analysis of the nanotube diameter is applicable for the diameter
    range from 1 nm to 2 nm.
