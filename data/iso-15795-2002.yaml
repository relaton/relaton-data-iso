abstract:
- language: en
  script: Latn
  content: This International Standard defines terms relating to chromatic aberrations
    and indicates the mathematical relationships between those terms. It also gives
    general guidance for the measurement of chromatic aberrations and is valid for
    optical imaging systems which are constructed to be of rotational symmetric imaging
    geometry. It is also valid for optoelectronic imaging systems.
