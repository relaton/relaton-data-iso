abstract:
- language: en
  script: Latn
  content: ISO 23907:2012 specifies requirements for single-use sharps containers
    intended to hold potentially hazardous sharps medical waste with or without sharps
    protection features, e.g. scalpel blades, trocars, hypodermic needles and syringes.
    It is applicable to sharps containers that are supplied complete by the manufacturer
    and those that are supplied as components intended to be assembled by the user.
