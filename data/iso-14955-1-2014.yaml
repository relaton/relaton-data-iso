abstract:
- language: en
  script: Latn
  content: ISO 14955-1:2014 constitutes the application of eco-design standards to
    machine tools, mainly for metal working numerically controlled (NC) machine tools.
    ISO 14955-1:2014 addresses the energy efficiency of machine tools during the use
    stage, i.e. the working life of the machine tool. Elements of eco-design procedure
    according to ISO/TR 14062 are applied to machine tools. Reporting of results to
    users and suppliers and monitoring of results are defined. Evaluation of energy
    efficiency implies quantification of the resources used, i.e. energy supplied,
    and of the result achieved. ISO 14955-1:2014 provides guidance for a reproducible
    quantification of the energy supplied.
