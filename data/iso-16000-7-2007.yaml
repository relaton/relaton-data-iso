abstract:
- language: en
  script: Latn
  content: 'ISO 16000-7:2007 specifies procedures to be used in planning of air measurements
    to determine the concentrations of asbestos in indoor atmospheres. Careful planning
    of the measurement strategy is important, because the results can become the basis
    of recommendations for major building renovations, or for the return of a building
    to normal occupancy status after removal of asbestos-containing materials. ISO
    16000-7:2007 uses the following definition for indoor environments as specified
    in ISO 16000-1: dwellings having living rooms, bedrooms, do-it-yourself (DIY)
    rooms, recreation rooms, cellars, kitchens and bathrooms; workrooms or workplaces
    in buildings which are not subject to health and safety inspections in regard
    to air pollutants (for example, offices and sales premises); public and commercial
    buildings (for example, hospitals, schools, kindergartens, sports halls, libraries,
    restaurants and bars, theatres and other function rooms); cabins of vehicles and
    public transport.'
