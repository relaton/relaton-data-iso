abstract:
- language: en
  script: Latn
  content: ISO 17608:2015 specifies a method to determine the resistance of bare elastane
    yarns to chlorinated aqueous environments, such as swimming pools, through testing
    of the breaking force retention. Different alternative test conditions are specified.
    Three different concentrations and two different exposure hours are considered.
    ISO 17608:2015 is applicable to bare elastane yarns only. Result achieved from
    yarns cannot be used to predict the fabric performance.
