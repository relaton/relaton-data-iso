abstract:
- language: en
  script: Latn
  content: This document specifies the test cycles, the test procedures and the evaluation
    of gaseous and particulate exhaust emissions from reciprocating internal combustion
    (RIC) engines coupled to a dynamometer. With certain restrictions, this document
    can also be used for measurements at site. The tests are carried out under steady-state
    and transient operation using test cycles which are representative of given applications.
    This document is applicable to RIC engines for mobile, transportable and stationary
    use, excluding engines for on-road transport of passengers and goods. It can be
    applied to engines for non-road use, e.g. for earth-moving machines, generating
    sets and for other applications. For engines used in machinery covered by additional
    requirements (e.g. occupational health and safety regulations, regulations for
    power plants), additional test conditions and special evaluation methods can apply.
