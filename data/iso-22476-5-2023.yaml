abstract:
- language: en
  script: Latn
  content: This document is applicable to pressuremeter tests using cylindrical flexible
    probes placed in pre-existent boreholes using testing procedures other than the
    Menard procedure. Pressuremeter tests following the Menard procedure are provided
    in ISO 22476-4. NOTE          A high-pressure flexible pressuremeter probe which
    contains transducers for the measurement of radial displacements is also known
    as flexible dilatometer probe or high-pressure dilatometer probe. This document
    applies to tests performed in any kind of grounds, starting from soils, treated
    or untreated fills, hard soils and soft rocks, up to hard and very hard rocks,
    either on land or offshore. The parameters derived from this test can include
    stiffness, strength, initial in-situ stress state and consolidation properties.
