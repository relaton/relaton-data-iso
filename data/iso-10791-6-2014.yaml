abstract:
- language: en
  script: Latn
  content: ISO 10791-6:2014 specifies, with reference to ISO 230‑1 and ISO 230‑4,
    certain kinematic tests for machining centres, concerning spindle speeds, feed
    and the accuracy of the paths described by the simultaneous movement of two or
    more numerically controlled (NC) linear and/or rotary axes. It applies to machining
    centres having three linear axes (X, Y, and Z) and additionally one or two rotary
    axes (A, B, or C). Movements other than those mentioned are considered as special
    features and the relevant tests are not included in this part of ISO 10791. It
    deals only with the verification of kinematic accuracy of the machine and does
    not apply to the testing of the machine operation, e.g. vibrations, abnormal noises,
    etc., which should generally be checked separately. The tests described in ISO
    10791-6:2014 are also applicable, totally or partially, subject to specific agreement
    between the manufacturer/supplier and the user, to numerically controlled milling
    and boring machines, when their configuration, components, and movements are compatible
    with the tests described therein.
