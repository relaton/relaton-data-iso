abstract:
- language: en
  script: Latn
  content: ISO 13355:2016 specifies a method to carry out a vertical random vibration
    test on a complete, filled transport package(s) and unit loads using random excitation[1].
    This document also provides methods for assessing the performance of a package
    in terms of its strength or the protection that it offers to its contents when
    it is subjected to vertical vibration. The test discussed in this document can
    be performed either as a single test to investigate the effects of vertical vibration,
    or as a part of a sequence of tests designed to measure the ability of a test
    specimen to withstand a distribution system that includes a vibration hazard.
    NOTE In this International Standard, a package or unit load is referred to as
    test specimen. [1] Random vibration theory is discussed in IEC 60068-2-64.
