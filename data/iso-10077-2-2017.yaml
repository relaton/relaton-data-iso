abstract:
- language: en
  script: Latn
  content: ISO 10077-2:2017 specifies a method and gives reference input data for
    the calculation of the thermal transmittance of frame profiles and of the linear
    thermal transmittance of their junction with glazing or opaque panels. The method
    can also be used to evaluate the thermal resistance of shutter profiles and the
    thermal characteristics of roller shutter boxes and similar components (e.g. blinds).
    ISO 10077-2:2017 also gives criteria for the validation of numerical methods used
    for the calculation. ISO 10077-2:2017 does not include effects of solar radiation,
    heat transfer caused by air leakage or three-dimensional heat transfer such as
    pinpoint metallic connections. Thermal bridge effects between the frame and the
    building structure are not included. NOTE Table 1 in the Introduction shows the
    relative position of ISO 10077-2:2017 within the set of EPB standards in the context
    of the modular structure as set out in ISO 52000-1.
