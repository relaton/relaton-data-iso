abstract:
- language: en
  script: Latn
  content: This International standard provides general requirements for methods to
    detect specific DNA target sequences in food and feed as well as animal and vegetable
    propagation materials by analysing DNA from the sample under study using polymerase
    chain reaction (PCR) strategies and associated detection, identification and quantification
    methods. It specifies minimum requirements for method validation and performance
    criteria to ensure the production of accurate, repeatable and reproducible results.
    This document is applicable to food, feed, plant matrices and their propagules,
    plant pathogens, and animals or animal products in which amplification of a specific
    biomolecular target sequence is required.
