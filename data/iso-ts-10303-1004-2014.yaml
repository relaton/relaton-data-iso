abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1004:2014-02 specifies the application module for Elemental
    geometric shape. The following are within the scope of ISO/TS 10303-1004:2014-02:
    definition of a geometric coordinate space; definition of a geometric model; definition
    of a point expressed using cartesian coordinates; definition of an axis; definition
    of a coordinate system or axis placement; definition of a 2d or 3d geometric transformation
    by a 2*3 or 3*4 matrix; definition of a geometric transformation from the data
    of a source axis_placement and of the axis_placement that results from its transformation;
    definition of a geometric transformation from the data of a source axis_placement
    and of the 2*3 or 3*4 matrix that results from its transformation; items within
    the scope of application module Foundation representation, ISO/TS 10303-1006;
    items within the scope of application module Identification assignment, ISO/TS
    10303-1021.'
