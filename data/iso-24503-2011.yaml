abstract:
- language: en
  script: Latn
  content: ISO 24503:2011 specifies requirements for the design of tactile dots and
    tactile bars for use on consumer products to improve accessibility for everyone,
    including older persons and persons with disabilities. ISO 24503:2011 is applicable
    to consumer products used by persons with visual disabilities, and in cases where
    visual information is not the primary sense used for accomplishing the task. Alternative
    tactile methods, such as texture and vibration, and other tactile symbols, such
    as triangles and squares, are not covered in ISO 24503:2011. Alternative feedback
    methods, such as in acoustic and visual modalities, are not covered in ISO 24503:2011.
