abstract:
- language: en
  script: Latn
  content: ISO 16701:2003 defines an accelerated corrosion test method to be used
    in assessing the corrosion resistance of metals in environments where there is
    a significant influence of chloride ions, mainly as sodium chloride from a marine
    source or road de-icing salt. ISO 16701:2003 specifies the test apparatus and
    test procedure to be used in conducting the accelerated corrosion test to simulate,
    in a very controlled way, atmospheric corrosion conditions. In this International
    Standard, the term "metal" includes metallic materials with or without corrosion
    protection. The accelerated laboratory corrosion test applies to metals and their
    alloys; metallic coatings (anodic and cathodic); chemical conversion coatings;
    organic coatings on metals. The method is especially suitable for comparative
    testing in the optimization of surface treatment systems.
