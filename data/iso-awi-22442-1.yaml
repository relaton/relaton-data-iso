abstract:
- language: en
  script: Latn
  content: 'This document applies to medical devices other than in vitro diagnostic medical devices manufactured utilizing materials of animal origin, which are non-viable or have been rendered non-viable. This document specifies, in conjunction with ISO 14971, a procedure to identify the hazards and hazardous situations associated with such devices, to estimate and evaluate the resulting risks, to control these risks, and to monitor the effectiveness of that control. This document outlines the decision process for determining the acceptability of residual risks, taking into account the risk profile and expected benefit as compared to available alternatives, in line with ISO 14971. This document is intended to provide requirements and guidance on risk management related to the hazards typical of medical devices manufactured utilizing animal tissues or derivatives such as: a) contamination by bacteria, moulds, yeasts, or parasites; b) contamination by viruses; c) contamination by agents causing transmissible spongiform encephalopathies (TSEs) and other transmissible agents; d) material responsible for undesired pyrogenic, immunological or toxicological reactions. For parasites and other unclassified pathogenic entities, similar principles can apply. This document does not stipulate levels of acceptability which, because they are determined by a multiplicity of factors, cannot be established except for some particular derivatives mentioned in Annex C. Annex C stipulates levels of TSE risk acceptability for tallow derivatives, animal charcoal, milk and milk derivatives, wool derivatives and amino acids. This document does not apply to the utilization of human tissues in medical devices. NOTE 1 It is not a requirement of this document to have a full quality management system during manufacture. However, attention is drawn to international standards for quality management systems (see ISO 13485) that control all stages of production or reprocessing of medical devices. NOTE 2 For guidance on the application of this document, see Annex A.'
