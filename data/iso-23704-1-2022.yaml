abstract:
- language: en
  script: Latn
  content: 'This document specifies the concept and fundamental principles of cyber-physically
    controlled smart machine tool systems (CPSMT) and requirements, including —   
    the reference architecture of a CPSMT, —    the key components and interfaces
    which together make up the reference architecture of a CPSMT, and —    the capabilities
    of a CPSMT. This document also provides: —    the background for a CPSMT, —   
    the concept of a shop floor device system (SFDS), and —    example use cases of
    the reference architecture of a CPSMT. This document does not specify physical
    or implementation architecture.'
