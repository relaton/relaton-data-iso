abstract:
- language: en
  script: Latn
  content: This document provides rules for the measurement of the spectral internal
    transmittance of plane parallel elements using a spectrophotometer. It is applicable
    solely to the measurement of internal transmittance and does not apply to the
    regular and diffuse transmittance. It is applicable to test samples that are uncoated
    optical materials without optical power.
