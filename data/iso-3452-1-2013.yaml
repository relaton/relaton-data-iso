abstract:
- language: en
  script: Latn
  content: ISO 3452-1:2013 specifies a method of penetrant testing used to detect
    discontinuities, e.g. cracks, laps, folds, porosity and lack of fusion, which
    are open to the surface of the material to be tested. It is mainly applied to
    metallic materials, but can also be performed on other materials, provided that
    they are inert to the test media and not excessively porous (castings, forgings,
    welds, ceramics, etc.) It also includes requirements for process and control testing,
    but is not intended to be used for acceptance criteria and gives neither information
    relating to the suitability of individual test systems for specific applications
    nor requirements for test equipment.
