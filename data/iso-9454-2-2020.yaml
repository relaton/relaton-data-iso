abstract:
- language: en
  script: Latn
  content: This document specifies the performance requirements for fluxes in solid,
    liquid and paste forms intended for use with soft solders. NOTE 1 ISO 9454‑1 specifies
    the requirements for labelling and packaging as well as the coding system for
    the classification of the fluxes. NOTE 2 Some of the fluxes intended for inert
    gas and vapour phase soldering may not pass some of the criteria in Tables 1 and
    2. Requirements for these fluxes are agreed between the purchaser and the supplier.
