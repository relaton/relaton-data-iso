abstract:
- language: en
  script: Latn
  content: ISO 29481-2:2012 specifies a methodology and format for describing ?coordination
    acts' between actors in a building construction project during all life cycle
    stages. It therefore specifies a methodology that describes an interaction framework,
    an appropriate way to map responsibilities and interactions that provides a process
    context for information flow, a format in which the interaction framework should
    be specified. ISO 29481-2:2012 is intended to facilitate interoperability between
    software applications used in the construction process, to promote digital collaboration
    between actors in the building construction process, and to provide a basis for
    accurate, reliable, repeatable, and high-quality information exchange.
