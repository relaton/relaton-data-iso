abstract:
- language: en
  script: Latn
  content: ISO 6360-3:2005 specifies the code numbers for specific characteristics
    of burs, finishing burs, cutters and surgical instruments, which refer to the
    type of toothing on the working part of the instrument. This three digit number
    appears in the locations 10 to 12 of the 15-digit overall number and forms the
    fourth group of three digits in the 15-digit overall number, the principles of
    which are explained in ISO 6360-1 and 6360-2. In addition to terms for rotary
    instruments and accessories used in two of the three official ISO languages (English,
    French and Russian), ISO 6360-3:2005 gives the equivalent terms in the German
    language; these are published under the responsibility of the member body for
    Germany (DIN). However, only the terms given in the official languages can be
    considered as ISO terms.
