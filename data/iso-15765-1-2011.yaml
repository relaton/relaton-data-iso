abstract:
- language: en
  script: Latn
  content: ISO 15765-1:2011 gives an overview of the structure and the partitioning
    of ISO 15765, and shows the relationships between the different parts. It also
    defines the diagnostic network architecture. The terminology defined in this part
    is common for all diagnostic networks and is used throughout all parts of ISO
    15765. The diagnostic communication over controller area network (DoCAN) protocol
    supports the standardized service primitive interface as specified in ISO 14229‑2.
