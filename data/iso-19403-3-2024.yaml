abstract:
- language: en
  script: Latn
  content: This document specifies a test method to measure the surface tension of
    liquids with an optical method using the pendant drop. The method can be applied
    for the characterization of liquid coating materials. If applied to liquids with
    non-Newtonian flow behaviour (as defined in ISO 3219-1:2021, 3.22), restrictions
    can apply. NOTE       For other methods to determine the surface tension, see
    e.g. EN 14370 and ISO 1409.
