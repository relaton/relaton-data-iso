abstract:
- language: en
  script: Latn
  content: ISO 10936-1:2017 specifies requirements and refers to test methods for
    operation microscopes used for observation during surgical operation and treatment
    of patients. It does not apply to accessories, e.g. photographic cameras. NOTE
    Specific requirements with regard to optical radiation hazards from operation
    microscopes used in ocular surgery are given in ISO 10936‑2.
