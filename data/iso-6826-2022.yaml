abstract:
- language: en
  script: Latn
  content: This document establishes requirements for reciprocating internal combustion
    engines to minimize the risk of fire caused by the engine, its components and
    the auxiliaries fitted to it. Where necessary, special requirements can be given
    for particular engine applications. This document applies to reciprocating internal
    combustion engines for land and marine use, excluding engines used in an explosive
    atmosphere, road vehicles and aircraft. This document can also apply to engines
    used to propel small craft and for other applications where no suitable International
    Standard for fire protection on reciprocating internal combustion engines exists.
    For engine applications excluded above, this document can be used as the basis
    for engine application standards.
