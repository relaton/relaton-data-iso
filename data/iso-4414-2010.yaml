abstract:
- language: en
  script: Latn
  content: 'ISO 4414:2010 specifies general rules and safety requirements for pneumatic
    fluid power systems and components used on machinery as defined by ISO 12100.
    ISO 4414:2010 deals with all significant hazards associated with pneumatic fluid
    power systems and specifies principles to apply in order to avoid those hazards
    when the systems are put to their intended use. ISO 4414:2010 applies to the design,
    construction and modification of systems and their components, also taking into
    account the following aspects: assembly, installation, adjustment, uninterrupted
    system operation, ease and economy of maintenance and cleaning, reliable operation
    in all intended uses, energy efficiency and environment. ISO 4414:2010 does not
    apply to air compressors and the systems associated with air distribution as typically
    installed in a factory, including gas bottles and receivers.'
