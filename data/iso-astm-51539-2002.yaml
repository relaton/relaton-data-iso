abstract:
- language: en
  script: Latn
  content: ISO/ASTM 51539 covers the use of radiation-sensitive indicators in radiation
    processing. These indicators may be labels, papers, inks or packaging materials
    which undergo a colour change or become coloured when exposed to ionizing radiation.
    The purpose of these indicators is to determine visually whether or not a product
    has been irradiated, rather than to measure different dose levels.
