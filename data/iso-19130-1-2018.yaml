abstract:
- language: en
  script: Latn
  content: This document identifies the information required to determine the relationship
    between the position of a remotely sensed pixel in image coordinates and its geoposition.
    It supports exploitation of remotely sensed images. It defines the metadata to
    be distributed with the image to enable user determination of geographic position
    from the observations. This document specifies several ways in which information
    in support of geopositioning can be provided. a) It may be provided as a sensor
    description with the associated physical and geometric information necessary to
    rigorously construct a PSM. For the case where precise geoposition information
    is needed, this document identifies the mathematical equations for rigorously
    constructing PSMs that relate 2D image space to 3D ground space and the calculation
    of the associated propagated errors. This document provides detailed information
    for three types of passive electro-optical/ IR sensors (frame, pushbroom and whiskbroom)
    and for an active microwave sensing system SAR. It provides a framework by which
    these sensor models can be extended to other sensor types. b) It can be provided
    as a TRM, using functions whose coefficients are based on a PSM so that they provide
    information for precise geopositioning, including the calculation of errors, as
    precisely as the PSM they replace. c) It can be provided as a CM that provides
    a functional fitting based on observed relationships between the geopositions
    of a set of GCPs and their image coordinates. d) It can be provided as a set of
    GCPs that can be used to develop a CM or to refine a PSM or TRM. This document
    does not specify either how users derive geoposition data or the format or content
    of the data the users generate.
