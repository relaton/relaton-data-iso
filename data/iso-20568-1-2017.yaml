abstract:
- language: en
  script: Latn
  content: ISO 20568-1:2017 establishes a system of designation for fluoropolymer
    materials, which may be used as the basis for specifications. The various types
    of fluoropolymer are differentiated from each other by a classification system
    based on appropriate levels of the designatory properties and on information about
    the intended application and/or method of processing, important properties, additives,
    colorants, fillers and reinforcing materials.
