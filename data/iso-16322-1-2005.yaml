abstract:
- language: en
  script: Latn
  content: ISO 16322-1:2005 specifies a method of measuring the percentage of wale
    spirality change in weft-knitted jersey garments produced on knitting machines,
    following laundering. The results obtained from different procedures may not be
    comparable. The change in spirality is calculated from measurements on knitted
    garments before and after laundering.
