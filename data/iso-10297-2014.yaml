abstract:
- language: en
  script: Latn
  content: 'ISO 10297:2014 specifies design, type testing and marking requirements
    for: a) cylinder valves intended to be fitted to refillable transportable gas
    cylinders; b) main valves (excluding ball valves) for cylinder bundles; c) cylinder
    valves or main valves with integrated pressure regulator (VIPR); which convey
    compressed, liquefied or dissolved gases. ISO 10297:2014 covers the function of
    a valve as a closure. It does not apply to valves for cryogenic equipment, portable
    fire extinguishers and liquefied petroleum gas (LPG) and quick-release valves
    (e.g. for fire-extinguishing, explosion protection and rescue applications), non-return
    valves or ball valves.'
