abstract:
- language: en
  script: Latn
  content: 'This standard is applicable to air cleaners that are designed to remove
    microorganisms in the air. This standard is applicable to household and similar
    air cleaner with rated voltage of single-phase appliances not exceeding 250 V
    and that of other appliances not exceeding 480 V. This standard specifies methods
    for measuring microorganism reduction performance of air cleaners, and may include
    the following contents: (1) Reduction rate (2) Microorganism clean air delivery
    rate (mCADR) (3) Secondary release'
