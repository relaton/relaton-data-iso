abstract:
- language: en
  script: Latn
  content: ISO 10218-1:2011 specifies requirements and guidelines for the inherent
    safe design, protective measures and information for use of industrial robots.
    It describes basic hazards associated with robots and provides requirements to
    eliminate, or adequately reduce, the risks associated with these hazards. ISO
    10218-1:2011 does not address the robot as a complete machine. Noise emission
    is generally not considered a significant hazard of the robot alone, and consequently
    noise is excluded from the scope of ISO 10218-1:2011. ISO 10218-1:2011 does not
    apply to non‑industrial robots, although the safety principles established in
    ISO 10218 can be utilized for these other robots.
