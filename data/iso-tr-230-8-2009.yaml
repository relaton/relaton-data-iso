abstract:
- language: en
  script: Latn
  content: 'ISO/TR 230-8:2009 is concerned with the different types of vibration that
    can occur between the tool holding part and the work-piece holding part of a machine
    tool. (For simplicity, these will generally be referred to as “tool” and “work-piece”,
    respectively.) These are vibrations that can adversely influence the production
    of both an acceptable surface finish and an accurate work-piece. ISO/TR 230-8:2009
    is not aimed primarily at those who have expertise in vibration analysis and who
    routinely carry out such work in Research and Development environments. It does
    not therefore replace standard textbooks on the subject. It is, however, intended
    for manufacturers and users alike with general engineering knowledge in order
    to enhance their understanding of the causes of vibration by providing an overview
    of the relevant background theory. It also provides basic measurement procedures
    for evaluating certain types of vibration problem that can beset a machine tool:
    vibrations occurring as a result of mechanical unbalance; vibrations generated
    by the operation of the machine''s linear slides; vibrations transmitted to the
    machine by external forces; vibrations generated by the cutting process including
    self excited vibrations (chatter). Additionally, ISO/TR 230-8:2009 discusses the
    application of artificial vibration excitation for the purpose of structural analysis.'
