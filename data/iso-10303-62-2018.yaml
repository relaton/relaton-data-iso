abstract:
- language: en
  script: Latn
  content: ISO 10303-62:2018 specifies the integrated resource constructs for Equivalence
    validation of product data. This document provides structured representation of
    criteria together with inspection requirement, and inspection results for the
    equivalence validation of product data. It is designed for use in the representation
    of requirement/declaration of equivalence, equivalence assurance and for the representation
    of equivalence inspection result of product data, thus enabling equivalence guaranteed
    use of product data.
