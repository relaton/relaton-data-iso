abstract:
- language: en
  script: Latn
  content: This document describes a dynamic dual-task method that quantitatively
    measures human-performance degradation on a primary driving-like task while a
    secondary task is being performed. The performance measures of the method indicate
    the visual-manual and cognitive secondary-task demand associated with visual-manual
    or auditory-verbal secondary task engagement while driving. This document defines
    key terms and parameters for the assessment of BT + DRT. It provides guidelines
    and minimum requirements on equipment and procedures to plan evaluation trials,
    specify (and install) data capture equipment, conduct a study, analyse, interpret,
    and report metrics indicating visual-manual and cognitive secondary-task demand
    using the BT + DRT. The metrics and definitions described in this document provide
    a common source for the assessment of visual-manual and cognitive task demand
    induced by different IVIS while driving. The BT + DRT is applicable to standardized
    experiments in laboratory-based settings. Data collection and analyses according
    to this document allow comparisons across different secondary tasks. In contrast,
    this document does not apply to the measurement of primary (driving) task demand.
    This document can be applied to both original equipment manufacturer (OEM) and
    after-market in-vehicle systems, and to permanently installed as well as portable
    systems.
