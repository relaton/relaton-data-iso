abstract:
- language: en
  script: Latn
  content: This document specifies test methods for determining the physical properties
    of synchronous belts used in driving engine parts, such as camshafts, fuel injection
    pumps, balancing shafts. These test methods are intended to provide a means of
    characterizing synchronous belt properties for belts which are evaluated and qualified
    by dynamic laboratory and field testing.
