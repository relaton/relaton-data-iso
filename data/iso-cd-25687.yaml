abstract:
- language: en
  script: Latn
  content: This document specifies general requirements for optical fibres used in
    space fibre optic sub-systems. This document can be applied to different types
    of optical fibres in space fibre optic sub-systems, including multimode optical
    fibres, single-mode fibres and polarization-maintaining fibres. Typical application
    environment include inside and outside of space station, spaceship, satellite
    and other spacecraft.
