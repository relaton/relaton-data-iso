abstract:
- language: en
  script: Latn
  content: 'This document defines general terms and definitions relating to method
    validation and method verification of microbiology of the food chain. This document
    is applicable to the validation and verification of methods used for the analysis
    of microorganisms, bacterial toxins and biogenic amines in: — products intended
    for human consumption; — products intended for animal feeding; — environmental
    samples in the area of food and feed production and handling; — samples from the
    primary production stage'
