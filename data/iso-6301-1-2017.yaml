abstract:
- language: en
  script: Latn
  content: ISO 6301-1 specifies which characteristics of compressed-air lubricators
    are to be included in the supplier's literature. It also specifies product-marking
    requirements for lubricators. ISO 6301-1 is applicable to compressed-air lubricators
    constructed from light alloys (e.g. aluminium), zinc die-cast alloys, brass, steel
    and plastic, with a maximum rated pressure of 1 600 kPa (16 bar ) or less and
    a maximum rated temperature of 80 °C or less.
