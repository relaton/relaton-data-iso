abstract:
- language: en
  script: Latn
  content: 'This document specifies a routine reference method for the determination
    of the moisture content of cereals and cereal products. This document applies
    to: wheat, rice (paddy, husked and milled), barley, millet (Panicum miliaceum),
    rye, oats, triticale, sorghum in the form of grains, milled grains, semolina or
    flour. The method is not applicable to maize and pulses. NOTE            For moisture
    content determination in maize, see ISO 6540[5]; and for pulses, see ISO 24557[7].'
