abstract:
- language: en
  script: Latn
  content: The two parts of ISO 26203 specify methods for testing metallic sheet materials
    to determine the stress‑strain characteristics at high strain rates. ISO 26203-1:2010
    covers the use of elastic-bar-type systems. The strain-rate range between 10-3
    to 103 s-1 is considered to be the most relevant to vehicle crash events based
    on experimental and numerical calculations such as the Finite Elemental Analysis
    (FEA) work for crashworthiness. In order to evaluate the crashworthiness of a
    vehicle with accuracy, reliable stress-strain characterization of metallic materials
    at strain rates higher than 10-3 s-1 is essential. The test method in ISO 26203-1:2010
    covers the strain-rate range above 102 s-1.
