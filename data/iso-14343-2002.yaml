abstract:
- language: en
  script: Latn
  content: ISO 14343:2002 specifies requirements for classification of wire electrodes,
    wires and rods for gas-shielded metal arc welding, gas tungsten arc welding, plasma
    arc welding, submerged arc welding and laser beam welding of stainless and heat
    resisting steels. The classification of the wire electrodes, wires and rods is
    based upon their chemical composition.
