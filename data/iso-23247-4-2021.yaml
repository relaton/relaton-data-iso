abstract:
- language: en
  script: Latn
  content: 'This document identifies technical requirements for information exchange
    between entities within the reference architecture. The requirements for information
    exchange in the following networks are within the scope of this document: —   
    user network that connects the user entity and the digital twin entity; —    service
    network that connects sub-entities within the digital twin entity; —    access
    network that connects the device communication entity to the digital twin entity
    and to the user entity; —    proximity network that connects the device communication
    entity to the observable manufacturing elements.'
