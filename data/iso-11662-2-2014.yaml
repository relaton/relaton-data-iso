abstract:
- language: en
  script: Latn
  content: ISO 11662-2:2014 presents a test method for the structural competence under
    static loading of mobile cranes. This test method is to provide a systematic,
    non-destructive procedure for determining the stresses induced in crane structures
    under specified conditions of static loading through the use of resistance-type
    electric strain gauges, and to specify appropriate acceptance criteria for specified
    loading conditions. ISO 11662-2:2014 applies to mobile construction-type lifting
    cranes utilizing a) rope-supported, lattice boom attachment or lattice boom, and
    fly jib attachment, b) rope-supported, mast attachment and mast-mounted boom,
    and fly jib attachment, or c) telescoping boom attachment or telescopic boom and
    fly jib attachment. Mobile crane manufacturers can use ISO 11662-2:2014 to verify
    their design for the mobile crane types illustrated in its Annex E.
