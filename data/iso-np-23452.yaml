abstract:
- language: en
  script: Latn
  content: 'This document specifies the technical delivery requirements for — bars,
    — tubes and, — finished flat products up to thicknesses of 130 mm manufactured
    from the direct hardening alloy steels listed in Table 4 and supplied in one of
    the heat-treatment conditions given for the different types of products in Table
    2 and in one of the surface conditions given in Table 3. The steels are for wear
    and abrasion resistant applications in mechanical engineering, e. g.: bucket or
    shovel teeth and in general delivered in the treated to hardness range condition
    (+TH).'
