abstract:
- language: en
  script: Latn
  content: 'This document gives the safety requirements and measures for numerically
    controlled (NC/CNC) boring machines, NC/CNC routing machines and NC/CNC boring
    and routing machines (as defined in 3.2, 3.3 and 3.4), capable of continuous production
    use, hereinafter referred to as "machines". This document deals with all significant
    hazards, hazardous situations and events, listed in Annex A, relevant to the machines
    when they are operated, adjusted and maintained as intended and under the conditions
    foreseen by the manufacturer including reasonably foreseeable misuse. Also, transport,
    assembly, dismantling, disabling and scrapping phases have been taken into account.
    This document is also applicable to machines fitted with one or more of the following
    devices/additional working units, whose hazards have been dealt with: —    additional
    working units for sawing, sanding, assembling or dowel inserting; —    fixed or
    movable workpiece support; —    mechanical, pneumatic, hydraulic or vacuum workpiece
    clamping; —    automatic tool change devices. It is also applicable to machines
    fitted with edge-banding equipment, even if the relevant specific hazards have
    not been dealt with. NOTE      For the risk assessment needed for the edge-banding
    equipment, ISO 19085-17 can be useful. Machines covered in this document are designed
    for workpieces consisting of: —    solid wood; —    material with similar physical
    characteristics to wood (see ISO 19085-1:2021, 3.2); —    gypsum boards, gypsum
    bounded fibreboards, cardboard; —    matrix engineered mineral boards, silicate
    boards; —    composite materials with core consisting of polyurethane or mineral
    material laminated with light alloy; —    polymer-matrix composite materials and
    reinforced thermoplastic/thermoset/elastomeric materials; —    aluminium light
    alloy profiles; —    aluminium light alloy plates with a maximum thickness of
    10 mm; —    composite boards made from the materials listed above. This document
    does not deal with specific hazards related to: —    use of grinding wheels; —   
    ejection through openings guarded by curtains on machines where the height of
    the opening in the enclosure above the workpiece support exceeds 700 mm; —   
    ejection due to failure of milling tools with a cutting circle diameter equal
    to or greater than 16 mm and sawing tools not conforming to EN 847‑1:2017 and
    EN 847‑2:2017; —    the combination of a single machine being used with other
    machines (as a part of a line); —    integrated workpiece loading/unloading systems
    (e.g. robots). This document is not applicable to: —    single spindle hand fed
    or integrated fed routing machines; —    machines intended for use in potentially
    explosive atmosphere; —    machines manufactured prior to its publication.'
