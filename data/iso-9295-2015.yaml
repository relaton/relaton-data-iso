abstract:
- language: en
  script: Latn
  content: ISO 9295:2015 specifies four methods for the determination of the sound
    power levels of high-frequency noise emitted by machinery and equipment in the
    frequency range covered by the octave band centred at 16 kHz, which includes frequencies
    between 11,2 kHz and 22,4 kHz. They are complementary to the methods described
    in ISO 3741 and ISO 3744. The first three methods are based on the reverberation
    test room technique. The fourth method makes use of a free field over a reflecting
    plane. The test conditions which prescribe the installation and operation of the
    equipment are those specified in ISO 3741 or ISO 3744 as applicable.
