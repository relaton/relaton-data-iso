abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for cartridge syringes
    used in dentistry. These syringes are of the non-aspirating, aspirating and self-aspirating
    types using cartridges with dental local anaesthetics. This document is not applicable
    to cartridge syringes having a mechanical-advantage action for creating high pressure.
    This document specifies requirements for cartridge syringes with ISO metric thread
    sizes. However, attention is drawn to the existence of a variety of syringes with
    imperial thread sizes (see Annex A).
