abstract:
- language: en
  script: Latn
  content: This part of ISO/IEC 8882 specifies a set of abstract tests for verifying
    that the implementation of X.25 protocols for use by Data Terminal Equipment (DTE),
    conforms to the requirements of International Standards that specify those protocols.
    Testing of a DCE is not subject of this test suite. Testing of a DTE in DCE mode
    is covered in test group 28 of this test suite a) specifies a PIXIT proforma;
    b) describes the relationship of the PICS to the test suite, c) describes the
    relationship of the PIXIT to the test suite, d) specifies a set of abstract tests
    using TTCN Graphical notation. This part of ISO/IEC 8882 defines the testing of
    a DTE operating at the packet layer designed to access a public or private packet-switched
    network conforming to CCITT respectively ITU-T Recommendation X.25 (1980, 1984,
    1988, 1993) or another DTE conforming to ISO 8208. The specification of test cases
    in executable/machine processable TTCN is outside the scope of this part of ISO/IEC
    8882.
