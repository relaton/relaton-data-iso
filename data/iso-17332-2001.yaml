abstract:
- language: en
  script: Latn
  content: This International Standard specifies the position, dimensions, content
    and exposure of human-readable, latent image information applied onto 35 mm colour-print
    film. This information is normally exposed onto the film at the time of manufacture.
    This International Standard also specifies spectral densities and a film area
    which is not to be exposed by the film manufacturer, thus leaving it available
    for subsequent customer data recording such as soundtrack recording, etc.
