abstract:
- language: en
  script: Latn
  content: ISO/TR 13519:2012 provides guidance on the development and use of ISO publications
    supported by software. The software largely relates to statistical calculations
    considered by the subcommittees of ISO/TC 69, Application of statistical methods,
    but many other numerical calculations are covered by similar considerations. In
    terms of the development of ISO publications, ISO/TR 13519:2012 gives guidance
    on the traceability of data products (figures, tables and other numerical results)
    reproduced in normative-type documents. In terms of assisting users of ISO publications,
    ISO/TR 13519:2012 gives guidance on information that should be included in ISO
    publications regarding software specification, categories of support for software,
    and software performance including the use of reference data sets for testing
    purposes. Examples are included that illustrate aspects of the guidance provided.
