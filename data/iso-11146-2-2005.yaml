abstract:
- language: en
  script: Latn
  content: ISO 11146-2:2005 specifies methods for measuring beam widths (diameter),
    divergence angles and beam propagation ratios of laser beams. ISO 11146-2:2005
    is applicable to general astigmatic beams or unknown types of beams. For stigmatic
    and simple astigmatic beams, ISO 11146-1 is applicable. Within ISO 11146-2:2005,
    the description of laser beams is accomplished by means of the second order moments
    of the Wigner distribution rather than physical quantities such as beam widths
    and divergence angles. However these physical quantities are closely related to
    the second order moments of the Wigner distribution. In ISO/TR 11146-3, formulae
    are given to calculate all relevant physical quantities from the measured second
    order moments.
