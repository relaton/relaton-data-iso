abstract:
- language: en
  script: Latn
  content: The document defines the test method for evaluating the corrosion of nuclear
    fuel cladding tubes withinthe primary coolant in pressurized water reactors (PWR)
    nuclear power plants under condition of zinc injection. It details the test principle,
    the fuction of test equipment, test procedure and the assessment of test result,
    etc. It specifies the control methods for water chemistry, the internal heat of
    the cladding tube, heat flux density, and surface void fraction, as well as the
    post-evaluation of the corrosion hehavior after the corrosion test. The document
    is applicable to evaluating the CRUD and CRUD-induced corrosion behaviors on the
    surface of nuclear fuel cladding tubes in primary coolant with zinc injection
    for PWR nuclear power plants. The test material includes various types of cladding
    tubes such as zirconium alloy, Cr-coated zirconium alloy, FeCrAl alloy, etc.
