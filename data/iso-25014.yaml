abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the film thickness of
    a coating on concrete substrate by cross-section method. Coatings of various types
    shall meet the respective technical requirements. Furthermore, physical properties
    depend strongly on the film thickness. Hence, the knowledge of the film thickness
    in a coating system is important for the product development as well as for the
    application and evaluation of claims. Determining the film thickness of systems
    filled with quartz sand can be particularly difficult. This document describes
    the method for a measurement of film thickness in cured flooring system build-ups.
