abstract:
- language: en
  script: Latn
  content: Defines terms and specifies design criteria arising out of the combination
    of an RIC engine and an a.c. generator when operating as a unit. Applies to a.c.
    generating sets for land and marine use, excluding generating sets used on aircraft
    or to propel land vehicles and locomotives. For some specific applications (e.g.
    essential hospital supplies, high-rise buildings, etc.) supplementary requirements
    may be necessary.
