abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1655:2008 specifies the application module for Chemical substance.
    The following are within the scope of ISO/TS 10303-1655:2008: definition of a
    substance and its specialisations as physical particle, chemical element, and
    chemical compound; definition of the composition of a substance from other substances
    and their ratios; a consist-of relationship between a substance and a raw material
    part; items within the scope of application module Assembly structure, ISO/TS
    10303-1026; items within the scope of application module Generic material aspects,
    ISO/TS 10303-1681; items within the scope of application module Part view definition,
    ISO/TS 10303-1023; items within the scope of application module Person organization
    assignment, ISO/TS 10303-1013; items within the scope of application module Product
    view definition relationship, ISO/TS 10303-1041.'
