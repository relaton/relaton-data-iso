abstract:
- language: en
  script: Latn
  content: 'This document specifies the application module for Envelope. The following
    are within the scope of this document: identification of the sender of the envelope
    and date sent; identification of the recipient of the envelope and date received;
    authorisation of the sending of the message; solicitation of a receipt for the
    envelope and acknowledge it; association of envelopes to each other; association
