abstract:
- language: en
  script: Latn
  content: This document applies to slewing rough-terrain variable-reach trucks (hereinafter
    referred to as trucks) as defined in ISO 5053-1:2020, 3.22, that have a specific
    seated operator’s position, on the left-hand side of the boom, or centre position
    (excluding operator position on the right side of the boom). This document specifies
    a static test method for determining and evaluating the operator’s visibility
    on a rectangular boundary close around the truck and on a 12 m visibility test
    circle. Performance requirements for visibility are specified in this document.
    A calculation method or computer simulation can also be used. This document does
    not provide performance requirements for the additional means for indirect visibility.
    This document also covers information to be provided by the manufacturer.
