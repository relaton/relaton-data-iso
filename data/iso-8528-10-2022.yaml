abstract:
- language: en
  script: Latn
  content: This document specifies noise test codes for determining the sound power
    level and the emission sound pressure level at the workstation of reciprocating
    internal combustion engine driven electrical power generating sets. This document
    applies to constant and variable-speed reciprocating internal combustion (RIC)
    engine driven alternating current (AC) and direct current (DC) generating sets
    for fixed and mobile applications with rigid or flexible mountings. It is applicable
    for land and marine use, excluding generating sets used on aircraft or to propel
    land vehicles and locomotives. NOTE 1   For some specific applications (e.g. essential
    hospital supplies, high-rise buildings) supplementary requirements can be necessary.
    The provisions of this document can be regarded as a basis. NOTE 2   This document
    is referenced with regard to noise in ISO 8528-13:2016, which contains requirements
    concerning the design of generating sets, verification of noise levels and information
    related to noise in the operating and maintenance instructions.
