abstract:
- language: en
  script: Latn
  content: This document specifies a spectrophotometric method for the determination
    of nitrogen in steel. The method is applicable to the determination of nitrogen
    mass fraction between 0,000 6 % and 0,050 % in low alloy steels and between 0,010
    % and 0,050 % in high alloy steels. The method does not apply to samples containing
    silicon nitrides or having silicon contents higher than 0,6 %.
