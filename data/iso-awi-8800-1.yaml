abstract:
- language: en
  script: Latn
  content: This series of standards applies to safety-related systems that include one or more electrical and/or electronic (E/E) systems that use AI technology and that is installed in series production road vehicles, excluding mopeds. It does not address unique E/E systems in special vehicles, such as E/E systems designed for drivers with disabilities. This series of standards addresses the risk of undesired safety-related behaviour at the vehicle level due to AI errors. This part defines the vocabulary of terms used in the ISO 8800 series of standards and its technical and operational concepts. This part serves as a reference for the entire series, ensuring consistency across all subsequent parts by defining the common terminology and conceptual framework.
