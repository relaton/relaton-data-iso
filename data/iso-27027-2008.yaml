abstract:
- language: en
  script: Latn
  content: ISO 27027:2008 specifies the definitions, general performance requirements
    and test methods to determine the performance of solid-state (remote) power controllers
    (SSPC) for use in aerospace electrical power systems. The solid-state (remote)
    power controller consists of solid-state switching device(s) and associated solid-state
    circuitry for protection, action of control signals and providing status information.
