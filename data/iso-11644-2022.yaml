abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for measuring the adhesion of the finish
    to leather or the adhesion between two adjacent layers of the finish. The method
    is valid for all finished flexible leathers with a smooth surface that can be
    bonded to an adherent plate without the adhesive penetrating into the finish.
    Preliminary experiments can be necessary to determine whether these conditions
    are met. This test method applies to finished leathers with a thick finish-coat.
    The method specified in this document does not apply to unpigmented articles or
    articles without a continuous coating layer, such as: —    nubuk; —    aniline;
    —    pull-up; —    suede; —    perforated leather.'
