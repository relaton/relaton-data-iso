abstract:
- language: en
  script: Latn
  content: ISO 15186-2:2003 specifies a sound intensity method to determine the in-situ
    sound insulation of walls, floors, doors, windows and small building elements.
    It is intended for measurements that have to be made in the presence of flanking
    transmission. It can be used to provide sound power data for diagnostic analysis
    of flanking transmission or to measure flanking sound insulation parameters. ISO
    15186-2:2003 can be used by laboratories that could not satisfy the requirements
    of ISO 15186-1, which deals with laboratory measurements with no or little flanking
    transmission. ISO 15186-3 deals with measurements under laboratory conditions,
    at low frequencies. ISO 15186-2:2003 also describes the effect of flanking transmission
    on measurements made using the specified method, and how intensity measurements
    can be used -- to compare the in-situ sound insulation of a building element with
    laboratory measurements where flanking has been suppressed (i.e. ISO 140-3), --
    to rank the partial contributions for building elements, and -- to measure the
    flanking sound reduction index for one or more transmission paths (for validation
    of prediction models such as those given in EN 12354-1). This method gives values
    for airborne sound insulation, which are frequency dependent. They can be converted
    into a single number, characterizing the acoustic performance, by application
    of ISO 717-1. The reproducibility of this intensity method is estimated to be
    equal to or better than that of the methods of ISO 140-10 and ISO 140-4, when
    measuring a single small and large building element, respectively.
