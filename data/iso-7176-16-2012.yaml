abstract:
- language: en
  script: Latn
  content: ISO 7176-16:2012 specifies requirements and test methods to assess the
    resistance to ignition by match flame equivalent of all postural support devices
    that are supplied to be part of a wheelchair or its seating system. ISO 7176-16:2012
    only determines the resistance to ignition of the devices tested and not the ignitability
    of the complete wheelchair. ISO 7176-16:2012 allows for the separate testing of
    inferior/superior supports (e.g. arm supports), which are usually used in the
    horizontal plane, and anterior/posterior/lateral/medial supports (e.g. thoracic
    harnesses, calf panels), which are usually used in the vertical plane.
