abstract:
- language: en
  script: Latn
  content: This document defines how level of information need can be implemented
    in projects and programmes. It further clarifies how to state the prerequisites,
    as defined in Part 1 (EN 17412-1, ISO 7817-1) and then elaborates a methodology
    on how to specify information requirements for geometrical information, alphanumerical
    information and documentation, in line with the concepts and principles from Part
    1. Part 2 includes various examples and diagrams to help the information receiver
    understand the extent of their requirements specification, mainly using plain-language
    and a series of decision trees. This is illustrated with examples from building
    and infrastructure projects and is not limited by classification systems, software
    tools, exchange formats or data schemas. It also provides a few tabular templates,
    which help expressing the level of information need using traditional text and
    spreadsheet formats, in line with current industry practice. However, the ambition
    is to present the requirements in a structured way, allowing to specify the level
    of information need consistently across the international market. The structured
    approach will form the basis to develop a machine-interpretable exchange data
    schema to capture level of information need specifications, which is the subject
    of Part 3 of the standard. In addition, Part 2 describes suggestions and approaches
    for defining a nomenclature and it expands on verification and validation aspects
    as defined in Part 1. Part 2 supports the verification and validation of information
    deliverables against the information requirements expressed in the level of information
    need. Validation against design requirements, building code, regulations or building
    programme are not the scope of Part 2. Also, information model exchange and related
    data exchange formats are not within scope. Finally, Part 2 relates the level
    of information need to the elaboration of Exchange Information Requirements (EIR),
    BIM Execution Plan (BEP) according to ISO 19650 and explains how it relates to
    ISO 29481 Information Delivery Manual (IDM) and ISO 16739-1 Industry Foundation
    Classes (IFC).
