abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of arsenic content
    in crude oil pretreated by a closed microwave digestion method by atomic fluorescence
    spectrometry. The precision statement of this test method was determined in an
    interlaboratory study and is valid for samples with an arsenic content between
    0,35 mg/kg and 3,57 mg/kg. The test method can also be applied to samples with
    either a higher or lower arsenic content, however, no precision data has been
    determined at levels outside of this range.
