abstract:
- language: en
  script: Latn
  content: ISO 18436-7:2014 specifies the requirements for qualification and assessment
    of personnel who perform machinery condition monitoring and diagnostics using
    infrared thermography. A certificate or declaration of conformity to ISO 18436-7:2014
    will provide recognition of the qualifications and competence of individuals to
    perform thermal measurements and analysis for machinery condition monitoring using
    portable thermal imaging equipment. This procedure might not apply to specialized
    equipment or other specific situations. ISO 18436-7:2014 specifies a three-category
    classification programme that is based on the technical areas delineated herein.
