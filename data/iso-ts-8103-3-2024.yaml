abstract:
- language: en
  script: Latn
  content: This document identifies section and requirement numbers from ASME A17.1/CSA
    B44 or Japanese codes for requirements not included in ISO 8103-1. The content
    of the specific requirements is published in ASME A17.1/CSA B44 and Japanese codes.
    This document is applicable for new escalators and moving walks (pallet or belt
    type) as defined in ISO/DIS 8103-1:—, Clause 3. This document deals with all significant
    hazards, hazardous situations, and events relevant to escalators and moving walks
    when they are used as intended and under conditions of misuse which are reasonably
    foreseeable by the manufacturer (see Clause 4). This document is not applicable
    to escalators and moving walks which were manufactured before the date of its
    publication. It is, however, expected that existing installations be adapted to
    this standard.
