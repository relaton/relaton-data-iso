abstract:
- language: en
  script: Latn
  content: This document specifies, from view of ecosystems, fundamental elements and evaluation methods for establishing and maintaining digital content creation environments, including management of sharing digital content resources, collaboration mechanisms among upstream and downstream stakeholders, improvement of user experience, and performance assessment approaches. This document is applicable to all types of digital content creation enablers, such as shared workspace or hub operators, digital technology service providers, local authorities, non-governmental organizations, and individual digital content creators.
