abstract:
- language: en
  script: Latn
  content: 'This document specifies the operational and management framework for digital
    and remote-based healthcare infrastructure systems (DRBHISs). The document includes
    the following aspects related to the management framework: — Management and accountability
    structure — Collaborative management framework — Workforce and competency management
    framework — Risk management and recovery framework — Performance management and
    continuous improvement The requirements addressed in this document cover the necessary
    elements for managing DRBHISs.'
