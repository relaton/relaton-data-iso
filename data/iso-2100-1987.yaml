abstract:
- language: en
  script: Latn
  content: Lays down test procedures and performance requirements. Gives test details
    relating to the procedure and test results required. Includes contact and insulation
    resistances, shell continuity, sealing, contact holding force, contact retention,
    low temperature handling, immersion at low air pressure, resistance to fluids,
    voltage proof, vibration, thermal shock, endurance, magnetic effect, climatic,
    acceleration, salt spray, dust, flammability etc.
