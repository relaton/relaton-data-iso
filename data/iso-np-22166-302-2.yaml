abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and guidelines for mobility-related
    modules, a type of composite module used in service robots. It defines the information
    related to mobility-related modules based on the nine principles outlined in ISO
    22166-1 and provides a structured method for specifying the characteristics of
    such modules. This document considers mobility-related modules to consist of several
    software modules and associated hardware-software modules. It focuses on the interfaces,
    properties, composition, and execution-specific information relevant to mobility-related
    modules and is described based on ISO 22166-201, ISO 22166-202, and ISO WD 22166-203.
    This document is not a safety standard. However, it may include the necessary
    information required for safety-related aspects within mobility module.
