abstract:
- language: en
  script: Latn
  content: 'ISO 19063-1:2015 establishes a system of designation for impact-resistant
    polystyrene (PS-I) moulding and extrusion materials, which may be used as the
    basis for specifications. The types of impact-resistant polystyrene plastic are
    differentiated from each other by a classification system based on appropriate
    levels of the designatory properties: a) Vicat softening temperature; b) melt
    mass-flow rate; c) Charpy notched impact strength; d) flexural modulus; and on
    information about composition, intended application and/or method of processing,
    important properties, additives, colorants, fillers, and reinforcing materials.
    This part of ISO 19063 is applicable to all impact-resistant polystyrene plastics
    with a two-phase polymer system comprised of a continuous phase, consisting of
    polystyrene and/or a copolymer of styrene with an alkyl-substituted styrene, and
    a dispersed elastomeric phase based on butadiene. It applies to materials ready
    for normal use, unmodified or modified by colorants, additives, fillers, etc.
    ISO 19063-1:2015 does not apply to expandable materials. It is not intended to
    imply that materials having the same designation give necessarily the same performance.
    This part of ISO 19063 does not provide engineering data, performance data, or
    data on processing conditions which may be required to specify a material for
    a particular application and/or method of processing. If such additional properties
    are required, they will be determined in accordance with the test methods specified
    in ISO 2897‑2, if suitable. In order to specify a thermoplastic material for a
    particular application or to ensure reproducible processing, additional requirements
    may be given in data block 5 (see 3.1).'
