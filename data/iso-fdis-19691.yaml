abstract:
- language: en
  script: Latn
  content: This international standard specifies a method for measuring the corrosion
    loss of each part of structures using unpainted steel such as weathering steel
    by using the attached coupons Also this standard provides a prediction method
    for corrosion loss over a long period from the measurement results and a method
    for determining the applicability of existing and new constructing weathering
    steel structures. Also this standard provides a method for evaluating the type
    of corrosion by visual inspection of the appearance of rust on an existing weathering
    steel structure.
