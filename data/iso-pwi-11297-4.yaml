abstract:
- language: en
  script: Latn
  content: ISO 11297-4:2018, in conjunction with ISO 11297‑1 and ISO 11296‑4, specifies
    requirements and test methods for cured-in-place pipes and fittings used for the
    renovation of hydraulically and pneumatically pressurized underground drainage
    and sewerage networks with service temperatures up to 50 °C. ISO 11297-4:2018
    applies to independent (fully structural, class A) and interactive (semi structural,
    class B) pressure pipe liners, as defined in ISO 11295, which do not rely on adhesion
    to the existing pipeline. ISO 11297-4:2018 applies to the use of various thermosetting
    resin systems, in combination with compatible fibrous carrier materials, reinforcement,
    and other process-related plastics components (see 5.1). ISO 11297-4:2018 does
    not include requirements or test methods for resistance to abrasion, cyclic loading
    or impact, which are outside the scope of this document.
