abstract:
- language: en
  script: Latn
  content: 'This document specifies principles and gives guidance for developing normative
    documents that contain: specified requirements for the object of conformity assessment;
    specific methods and procedures for an individual conformity assessment activity
    (e.g. test methods); rules and methodology for conformity assessment (as part
    of conformity assessment schemes, including provisions for organizations that
    perform conformity assessment activities). This document is intended for the following
    users: standards developers; regulatory authorities; conformity assessment scheme
    owners; industry associations and consortia; conformity assessment bodies; accreditation
    bodies; purchasers; consumers and non-governmental groups; other interested parties,
    e.g. insurance organizations.'
