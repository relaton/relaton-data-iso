abstract:
- language: en
  script: Latn
  content: 'Le présent profil normalisé international spécifie les formats d''échange
    pour le transfert de documents structurés entre des équipements conçus pour le
    traitement de texte ou de document. Les documents peuvent contenir des caractères.
    Les documents pouvant être échangés à l''aide du présent profil normalisé international
    comprennent des notes et des lettres ainsi que des documents de structure simple.
    Le présent ISP fournit un niveau complet de caractéristiques pour le transfert
    de documents entre ces systèmes. Le présent profil normalisé international permet
    l''échange de documents sous les formes suivantes: formatée; retraitable; retraitable
    formatée. Les niveaux d''architecture définis pour ces trois formes possèdent
    des fonctionnalités correspondantes de sorte que les formats d''échange d''un
    document puissent être convertis d''une forme retraitable en une autre. Le présent
    profil normalisé international est indépendant des processus exécutés dans un
    système final pour créer, éditer ou reproduire des documents. Il est également
    indépendant du moyen de transfert des documents pouvant être, par exemple, des
    liaisons de communication ou des supports de stockage. Un document structuré conformément
    au présent profil normalisé international est représenté pour l''échange par l''un
    des deux profils du document d''application. Le premier profil utilise le format
    d''échange de document de bureau (ODIF - Office Document Interchange Format),
    tandis que l''autre utilise le langage de document de bureau (ODL - Office Document
    Language), tous deux étant définis dans l''ISO 8613-5. Lorsque ce document fait
    référence au présent profil normalisé international, il s''agit de l''un des deux
    profils du document d''application définis par le présent ISP.'
