abstract:
- language: en
  script: Latn
  content: This document specifies a method for evaluating the function of reducing
    mosquito contact and blood feeding through the anti-mosquito fabric regardless
    of whether chemicals are treated or not. It provides the test method for evaluating
    this function without using human or animal as blood feeding sources. In addition,
    this document is only concerned with evaluation of anti-mosquito performance,
    and not concerned with evaluation of preventive method of diseases caused by anti-mosquito
    performance.
