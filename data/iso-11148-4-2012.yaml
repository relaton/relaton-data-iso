abstract:
- language: en
  script: Latn
  content: ISO 11148-4:2012 applies to hand-held non-electric power tools (hereinafter
    "non-rotary percussive power tools") intended for chipping, riveting, breaking
    of concrete and asphalt, ramming, etc. The non-rotary percussive power tool can
    be powered by compressed air, hydraulic fluid or internal combustion engines and
    is intended for use by one operator and supported by the operator's hand or hands,
    with or without a suspension, e.g. a balancer. ISO 11148-4:2012 covers breakers,
    bush hammers, chipping hammers, small chisels, engraving pens, needle scalers,
    pick hammers, pile drivers, portable pile drivers, punches, rammers, riveting
    hammers, scaling hammers, stone hammers, spades and tampers. ISO 11148-4:2012
    does not cover special requirements and modifications on non-rotary percussive
    power tools for the purpose of mounting in a fixture. ISO 11148-4:2012 deals with
    all significant hazards, hazardous situations or hazardous events when the tools
    are used as intended and under conditions of misuse which are reasonably foreseeable
    by the manufacturer, with the exception of the use of non-rotary percussive power
    tools in potentially explosive atmospheres.
