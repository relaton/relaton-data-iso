abstract:
- language: en
  script: Latn
  content: ISO 6149-1:2006 specifies dimensions for metric ports for use with the
    adjustable and non-adjustable stud ends detailed in ISO 6149-2:2006 and ISO 6149-3:2006.
    Ports in accordance with ISO 6149-1:2006 may be used at working pressures up to
    63 MPa (630 bar) for non-adjustable stud ends and 40 MPa (400 bar) for adjustable
    stud ends. The permissible working pressure depends upon port size, materials,
    design, working conditions, application, etc. See ISO 6149-2:2006 and ISO 6149-3:2006
    for pressure ratings.
