abstract:
- language: en
  script: Latn
  content: This document specifies a conformance test for a vehicle manufacturer assessment
    of self-conformance of the VM RMI system. The conformance test cases follow the
    use case definition of ISO 18541‑1 and the requirements stated in ISO 18541‑2
    and ISO 18541‑3. The primary, but not exclusive, purpose of this document is to
    provide information to the VM RMI system provider to build and test the VM RMI
    system against the conformance test cases. This final step in the development
    process of the VM RMI system is an enabler for all providers that their VM RMI
    system meets a high degree of functional requirements expected by the end user.
    Furthermore, this document defines in Annex A conformance test cases for the use
    cases and requirements versions that apply for granting access to security-related
    RMI following the SERMI scheme. This document is applicable to light passenger
    and commercial vehicles as defined in regulation (EC) 715/2007 Article 2 [9].
