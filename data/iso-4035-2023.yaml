abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of hexagon thin nuts (style 0),
    in steel and stainless steel, with metric coarse pitch thread M1,6 to M64, and
    with product grades A and B. Thin nuts used as jam nuts are to be assembled together
    with a regular or high nut. WARNING — Thin nuts (style 0) have a reduced loadability
    compared to regular nuts or high nuts, and are not designed to provide resistance
    to thread stripping (see ISO 898-2). If in certain cases other specifications
    are requested, stainless steel grades and property classes can be selected from
    ISO 3506-2.
