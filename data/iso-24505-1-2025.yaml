abstract:
- language: en
  script: Latn
  content: This document provides a method for creating conspicuous colour combinations
    for use in visual signs and displays, taking into account viewer age. It is based
    on the perceived similarity of colours at photopic and mesopic lighting conditions.
    This document applies to the design of visual signs and displays in which multiple
    colours are used so that the colours are conspicuous to people of any age, including
    older people who do not have deficient colour vision. The method and data in this
    document are not applicable to the design of visual signs and displays for people
    with colour deficiencies or medical disorders affecting vision. This document
    applies to the reflective or object mode colours but may apply to self-luminous
    mode colours if the colour coordinates are appropriately transferred to those
    of the object mode colours.
