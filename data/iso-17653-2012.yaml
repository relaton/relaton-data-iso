abstract:
- language: en
  script: Latn
  content: 1 Scope This International Standard specifies specimen dimensions, testing
    equipment and the procedure for torsion testing of resistance spot welds with
    single sheet thicknesses ranging from 0,5 mm to 6,0 mm in steels. It can be used
    for non-ferrous materials in certain circumstances. The aim of this International
    Standard is to determine the weld diameter and the failure type of fractured specimens,
    and to evaluate the influence of different steel types, welding parameters and
    other factors on the deformation characteristics of a resistance spot weld.
