abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of hexagon head bolts with
    reduced shank (shank diameter approximately equal to pitch diameter), in steel
    and stainless steel, with metric coarse pitch threads M3 to M20, and with product
    grade B. If in certain cases other specifications are requested, property classes
    and stainless steel grades can be selected from ISO 898-1 or ISO 3506-1, and dimensional
    options from ISO 888 or ISO 4753. NOTE      For hexagon head bolts with full shank,
    see ISO 4014.
