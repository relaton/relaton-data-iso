abstract:
- language: en
  script: Latn
  content: 'ISO 8709:2010 specifies tests and measurement methods for service brake
    systems and, where applicable, associated parking brake systems of two‑wheeled
    mopeds (3‑1) and three‑wheeled mopeds (3‑2) which are intended for use on public
    roads, in order to establish uniform worldwide test procedures for braking systems.
    ISO 8709:2010 does not cover mopeds which: have a maximum speed of less than 25
    km/h; are equipped for disabled riders. ISO 8709:2010 sets out the following types
    of tests: dynamic tests: dry stop test (single brake control actuated); wet brake
    test; parking brake system test; power‑assisted brake system failure test.'
