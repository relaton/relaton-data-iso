abstract:
- language: en
  script: Latn
  content: ISO 3724:2007 specifies a method for determining the resistance of a hydraulic
    filter element to flow fatigue after it has been loaded with particulate contaminant
    and subjected to a uniform varying flow rate and predetermined terminal differential
    pressure. It establishes a uniform method for verifying the ability of a filter
    element to withstand the flexing caused by cyclic differential pressures induced
    by a variable flow rate.
