abstract:
- language: en
  script: Latn
  content: ISO/TS 17576:2004 provides two test methods and concomitant protocols to
    determine the corrosive behaviour of dental amalgams and their tendency to release
    mercury vapour during corrosion. The methods measure 1) the integrated current
    in a potentiostatic corrosion test and 2) the amount of released ions and mercury
    vapour in a static immersion test. ISO/TS 17576:2004 is not intended to set limits
    for the relevant parameters in the two tests described.
