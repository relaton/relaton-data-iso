abstract:
- language: en
  script: Latn
  content: Covers procedures for designing, preparing and using pre cracked specimens
    . Recommendations concerning notched specimens are given in annex A. These specimens
    are not suitable for the evaluation of thin product (sheet or wire); they are
    generally used for plate, bar and forgings. Their advantage is that they allow
    date to be acquired from which critical defect sizes, above which stress corrosion
    cracking may occur, can be estimated.
