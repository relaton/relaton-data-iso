abstract:
- language: en
  script: Latn
  content: This document specifies the determination method for the content of carbon dioxide fixed by carbonation in steel slag using the infrared absorption method. This document is applicable to the determination of carbon dioxide content fixed by carbonation in converter steel slag and electric furnace steel slag, with a determination range of 0.2% - 30.0%. Fixed carbon dioxide content in the cement can also refer to this standard.
