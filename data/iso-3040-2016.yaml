abstract:
- language: en
  script: Latn
  content: ISO 3040:2016 specifies graphical indication applicable to a cone (right-angle
    circular cones) to define its dimensioning or to specify its tolerancing. For
    the purposes of this International Standard, the term "cone" relates to right-angle
    circular cones only (any intersection by a plane perpendicular to the axis of
    the nominal cone is a circle). NOTE 1 For simplicity, only truncated cones have
    been represented in this International Standard. However, this International Standard
    can be applied to any type of cone within its scope. NOTE 2 This International
    Standard is not intended to prevent the use of other methods of dimensioning and
    tolerancing.
