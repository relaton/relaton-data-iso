abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1640:2018-11 specifies the application module for Assembly
    module with macro component. The following are within the scope of ISO/TS 10303-1640:2018-11:
    assembly physical design; detailed specification of joined features of components
    in the design; detailed traceability of design requirements; as designed implementation
    of connection requirement; shape of assembly design; configuration management
    of assembly design; in-process change management of assembly design; macros used
    as components in the assembly; items within the scope of application module Assembly
    module macro definition, ISO/TS 10303-1637; items within the scope of application
    module Assembly module with subassembly, ISO/TS 10303-1641.'
