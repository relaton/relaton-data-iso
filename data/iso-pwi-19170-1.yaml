abstract:
- language: en
  script: Latn
  content: 'This document supports the definition of: —    A Discrete Global Grid
    Systems (DGGS) core comprising: —    an RS using zonal identifiers with structured
    geometry, and —    functions providing import, export and topological query, —   
    Common spatio-temporal classes for geometry, topology, RS using zonal identifiers,
    zonal identifiers and zones, based on ISO 19111 CRS. The spatio-temporal scope
    is constrained to: —    spatial elements that are invariant through all time,
    and —    temporal elements that are invariant across all space. —    Equal-Area
    Earth Reference Systems (EAERSs) for Equal-Area Earth DGGS.'
