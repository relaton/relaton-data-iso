abstract:
- language: en
  script: Latn
  content: ISO 10893-8:2011 specifies requirements for automated ultrasonic testing
    for the detection of laminar imperfections in the pipe body (full peripheral testing)
    of seamless and welded, except submerged arc-welded (SAW), steel tubes, or in
    the area adjacent to the weld seam of welded steel tubes, and, optionally, at
    the ends (full peripheral testing) of seamless and welded tubes. ISO 10893-8:2011
    can also be applicable to the testing of circular hollow sections.
