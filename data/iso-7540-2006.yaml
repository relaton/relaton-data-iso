abstract:
- language: en
  script: Latn
  content: ISO 7540:2006 defines the requirements for ground paprika. A method for
    the determination of the moisture content of ground paprika is given in Annex
    A. Recommendations relative to storage and transport conditions are given in Annex
    B. A list of terms used in different countries for paprika (Capsicum annuum L.)
    is given in Annex C. This International Standard is not applicable to ground chillies
    and capsicums.
