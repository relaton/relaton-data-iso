abstract:
- language: en
  script: Latn
  content: 'This standard is applicable to household and similar air cleaners. This
    standard is applicable but not limited to air cleaners with the following working
    principles: physical filtration, adsorption, complexation, chemical catalysis,
    photo catalysis, electrostatic filtration, plasma and mixed type. This standard
    specifies test methods of ozone reduction for air cleaners, and intends to cover
    the following contents: (1) test method for clean air delivery rate of ozone reduction
    (CADR-Ozone) (2) method for cleaning life span calculation (3) test method for
    recovery of the ozone reduction ability'
