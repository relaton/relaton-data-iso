abstract:
- language: en
  script: Latn
  content: This document provides an overview of operational rules when automated
    driving mode is applied in mainline railway.  The overview describes the process,
    procedure and responsibility in operational activities which are affected by automated
    driving mode application in mainline railway. This document aims to describe the
    possible impacts on existing operational rules for systems not providing any automatic
    driving mode. This document covers the operational rules for automated driving
    mode of passenger train operation in semi-automated driving mode (GOA2) where
    the train driver is onboard. The situations of shunting, freight operation, and
    degraded mode are not covered. This document excludes electrical or mechanical
    requirements and technical aspects of systems providing automatic driving. This
    document is not applicable to UGTS (Urban Guided Transport System).
