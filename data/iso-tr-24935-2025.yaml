abstract:
- language: en
  script: Latn
  content: This document describes use cases and activities for updating software
    in vehicles over the air using mobile cellular network. This document provides
    a case study on the use of International Standards in preparing software update
    packages, managing infrastructure and operation within the vehicles. This document
    includes descriptions of a reference model for software update operations and
    metadata which can be used during the software update operations.
