abstract:
- language: en
  script: Latn
  content: ISO 13666:2011 defines basic terms relating to ophthalmic optics, specifically
    to semi-finished spectacle lens blanks, finished spectacle lenses and fitting
    purposes. Terms relating to processes and materials for fabrication and surface
    treatment (other than some specific terms relating to coatings), and terms relating
    to defects in materials and after optical processing, are given in ISO 9802.
