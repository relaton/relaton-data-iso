abstract:
- language: en
  script: Latn
  content: This document specifies test methods for the determination of the durability,
    height loss and hardness of mattresses with a height ≥100 mm (and mattress pads
    when they form a unit with the mattress). This document applies to adult mattresses
    for domestic and non-domestic use. It does not apply to water mattresses, air
    mattresses or standalone mattress pads. Test methods for the assessment of aging,
    degradation, fire resistance and electrical functions are not included.
