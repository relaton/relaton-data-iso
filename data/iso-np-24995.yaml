abstract:
- language: en
  script: Latn
  content: 'This document specifies minimum performance requirements for overhead
    obstruction detection systems and secondary guarding fitted to mobile elevating
    work platforms (MEWPs). This document is intended to serve as a guide for manufacturers
    and designers of overhead obstruction detection systems and secondary guarding
    to achieve the following objectives: — elimination or reduction of harm due to
    crushing accidents as a result of contact with obstructions; and — establishment
    of criteria for design, manufacture, testing and performance; and — establishment
    and understanding by manufacturers, engineers, and designers of their responsibilities.
    This document is intended to be used in conjunction with ISO 16368. The design
    and manufacturing requirements of this document apply to all secondary guarding
    manufactured on or after the effective date.'
