abstract:
- language: en
  script: Latn
  content: ISO 17262:2012 defines generic numbering and data structures for unambiguous
    identification of equipment used for Intermodal goods transport. These data are
    known as "Intermodal Goods Transport Numbering and Data Structures". It defines
    data independently of the data carrier. The modelling of data is based on Abstract
    Syntax Notation One (ASN.1) as defined in ISO/IEC 8824. It excludes any physical
    aspects such as interfaces, dimensions, etc. Data that form part of transmission
    or storage protocols (headers, frame markers and checksums) are excluded. Data
    defined in ISO 17262:2012 require a system for control and distribution of number
    series independent of the different AVI/AEI systems. This is required in order
    to avoid ambiguity and to provide the necessary level of security where appropriate.
    For this reason the registration authority defined in ISO 14816 applies for ISO
    17262:2012. ISO 17262:2012 enables the use of optimised encoding schemes such
    as ASN.1 Packed Encoding Rules (PER).
