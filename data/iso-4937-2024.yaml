abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of chromium in steel
    and iron by potentiometric or visual titration. The method is applicable to chromium
    contents between 0,25 % (mass fraction) and 35 % (mass fraction). If vanadium
    is present, the visual titration is applicable only to test portions containing
    less than 3 mg of vanadium. NOTE   The visual titration can be applicable to test
    portion containing between 3 mg and 6 mg of vanadium.
