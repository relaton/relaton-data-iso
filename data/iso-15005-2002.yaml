abstract:
- language: en
  script: Latn
  content: This International Standard presents ergonomic principles for the design
    of the dialogues that take place between the driver of a road vehicle and the
    vehicle's transport information and control systems (TICS) while the vehicle is
    in motion. It also specifies compliance verification conditions for the requirements
    related to these principles. This International Standard is applicable to TICSs
    consisting of either single or multiple devices, which can be either independent
    or interconnected. It is not applicable to TICSs without dialogues, TICS failures
    or malfunctions, or controls or displays used for non-TICS functions.
