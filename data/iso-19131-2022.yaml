abstract:
- language: en
  script: Latn
  content: This document describes requirements for the specification of geographic
    data products, based upon the concepts of other International Standards in the
    ISO 19100 family of standards. It also provides guidance in the creation of data
    product specifications, so that they can be easily understood and fit for their
    intended purpose. This document specifies XML encoding of data product specifications.
    This document provides OWL representation of the underlying UML model. See Annex F.
    This document is intended for use by data producers, data providers, service providers
    and potential users of data products.
