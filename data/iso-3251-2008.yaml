abstract:
- language: en
  script: Latn
  content: ISO 3251:2008 specifies a method for determining the non-volatile-matter
    content by mass of paints, varnishes, binders for paints and varnishes, polymer
    dispersions and condensation resins such as phenolic resins (resols, novolak solutions,
    etc.). The method is also applicable to formulated dispersions containing fillers,
    pigments and other auxiliaries (e.g. thickeners and film-forming agents). For
    the method to be usable for unplasticized polymer dispersions and rubber latices,
    the non-volatile residue (which consists essentially of the polymeric material
    and of small quantities of auxiliaries such as emulsifiers, protective colloids,
    stabilizers, solvents added as film-forming agents and — especially for rubber
    latex concentrate — preserving agents) has to be chemically stable under the test
    conditions. For plasticized samples, the residue, by definition, normally includes
    the plasticizer.
