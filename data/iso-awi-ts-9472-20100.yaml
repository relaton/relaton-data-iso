abstract:
- language: en
  script: Latn
  content: This document specifies how personal health navigation (PHN) architectural
    elements are used to support an individual’s health and wellness in the area of
    food and nutrition, and how PHN architectural elements supporting food and nutrition
    can be implemented in health informatics products, systems and processes. It establishes
    how information streams, events and sources of knowledge can be integrated into
    a personal model supporting navigational goals to track and provide guidance in
    relation to a person’s food consumption and nutrition. It also addresses how the
    application of PHN to food and nutrition can assist an individual identify how
    their food consumption impacts the environment, and how their food choices can
    have a positive environmental impact.
