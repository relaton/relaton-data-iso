abstract:
- language: en
  script: Latn
  content: ISO 22667:2013 specifies the communications operation procedure-1 (COP-1).
    This procedure is used with the telecommand (TC) space data link protocol (as
    defined in ISO 22664:2013) to enable the delivery of service data units to the
    receiving end of the layer above, correct and without omission or duplication,
    and in the same sequential order in which they were received from the layer above
    at the sending end. ISO 22667:2013 defines the COP-1 in terms of the interfaces
    with the other procedures, the internal variables used by the protocol entity,
    the actions performed by the protocol entity, and the state transitions of the
    protocol entity. It does not specify individual implementations or products, the
    implementation of service interfaces within real systems, the methods or technologies
    required to perform the procedures, or the management activities required to configure
    and control the protocol.
