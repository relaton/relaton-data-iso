abstract:
- language: en
  script: Latn
  content: ISO 16000-33:2017 specifies the sampling and analysis of phthalates in
    indoor air and describes the sampling and analysis of phthalates in house dust
    and in solvent wipe samples of surfaces by means of gas chromatography/mass spectrometry.
    Two alternative sampling and processing methods, whose comparability has been
    proven in a round robin test, are specified for indoor air[4]. Sampling can take
    place using sorbent tubes with subsequent thermal desorption and GC-MS analysis.
    Alternatively, sampling can take on other types of sorbent tubes that are subsequently
    analysed by solvent extraction with GC-MS. Depending on the sampling method, the
    compounds dimethyl phthalate to diisoundecylphthalate can be analysed in house
    dust as described in Annex C[8]. The investigation of house dust samples is only
    appropriate as a screening method. This investigation only results in indicative
    values and is not acceptable for a final assessment of a potential need for action.
    Dimethyl phthalate to diisoundecylphthalate can be analysed in solvent wipe samples
    as described in Annex B. Solvent wipe samples are suitable for non-quantitative
    source identification. NOTE In principle, the method is also suitable for the
    analysis of other phthalates, adipates and cyclohexane dicarboxylic acid esters,
    but this is confirmed by determination of the performance characteristics in each
    case. General information on phthalates are given in Annex A.
