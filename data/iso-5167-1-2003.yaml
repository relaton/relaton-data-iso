abstract:
- language: en
  script: Latn
  content: ISO 5167-1:2003 defines terms and symbols and establishes the general principles
    for methods of measurement and computation of the flowrate of fluid flowing in
    a conduit by means of pressure differential devices (orifice plates, nozzles and
    Venturi tubes) when they are inserted into a circular cross-section conduit running
    full. ISO 5167-1:2003 also specifies the general requirements for methods of measurement,
    installation and determination of the uncertainty of the measurement of flowrate.
    It also defines the general specified limits of pipe size and Reynolds number
    for which these pressure differential devices are to be used. ISO 5167 (all parts)
    is applicable only to flow that remains subsonic throughout the measuring section
    and where the fluid can be considered as single-phase. It is not applicable to
    the measurement of pulsating flow.
