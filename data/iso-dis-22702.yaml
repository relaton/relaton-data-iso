abstract:
- language: en
  script: Latn
  content: This document specifies requirements for utility lighters to ensure a reasonable
    degree of safety for normal use or reasonably foreseeable misuse of such lighters
    by users. This document applies to all flame-producing consumer products commonly
    known as utility lighters (also known as grill lighters, fireplace lighters, lighting
    rods or gas matches), and similar devices. It does not apply to matches and flame-producing
    products intended for igniting cigars, pipes and cigarettes.
