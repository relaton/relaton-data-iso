abstract:
- language: en
  script: Latn
  content: ISO 3598:2011 provides a basis for a specification applicable to textile
    glass yarns (strands, slivers, single yarns, folded yarns and cable yarns). It
    does not apply to textured yarns, rovings, chopped strands, milled fibres, pre-impregnated
    yarns, etc. It does not cover all requirements for specialized applications. Where
    such other requirements are necessary, they are, or will be, given in other appropriate
    International Standards.
