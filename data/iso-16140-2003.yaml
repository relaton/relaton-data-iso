abstract:
- language: en
  script: Latn
  content: ISO 16140:2003 defines the general principle and the technical protocol
    for the validation of alternative methods in the field of microbiological analysis
    of food, animal feeding stuffs and environmental and veterinary samples for the
    validation of alternative methods which can be used in particular in the framework
    of the official control, and the international acceptance of the results obtained
    by the alternative method. It also establishes the general principles of certification
    of these alternative methods, based on the validation protocol defined in ISO
    16140:2003. Where an alternative method is used on a routine basis for internal
    laboratory use without the requirement to meet (higher) external criteria of quality
    assurance, a less stringent comparative validation of the alternative method than
    that set in ISO 16140:2003 may be appropriate.
