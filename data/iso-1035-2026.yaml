abstract:
- language: en
  script: Latn
  content: 'This document specifies dimensions, shape, mass and tolerances of metric
    series hot-rolled steel bars. This document is applicable to: hot-rolled round
    bars with diameter of 5,5 mm up to 400 mm; hot-rolled square bars with side length
    of 5,5 mm up to 300 mm; hot-rolled flat bars with thickness of 3 mm up to 60 mm
    and width of 10 mm up to 200 mm; hot-rolled hexagonal bars with distance across
    opposite flats of 8 mm up to 70 mm; hot-rolled octagonal bars with distance across
    opposite flats of 16 mm up to 40 mm. NOTE            Wide flats can be covered
    under flat bars for practical reasons.'
