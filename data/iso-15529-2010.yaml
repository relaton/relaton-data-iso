abstract:
- language: en
  script: Latn
  content: ISO 15529:2010 specifies the principal MTFs associated with a sampled imaging
    system, together with related terms, and outlines a number of suitable techniques
    for measuring these MTFs. It also defines a measure for the “aliasing” related
    to imaging with such systems. ISO 15529:2010 is particularly relevant to electronic
    imaging devices such as digital still and video cameras and the detector arrays
    they embody.
