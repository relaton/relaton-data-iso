abstract:
- language: en
  script: Latn
  content: ISO/TS 15666:2003 provides specifications for socio-acoustic surveys and
    social surveys which include questions on noise effects (briefly referred to hereafter
    as "social surveys"). Its scope includes questions to be asked, response scales,
    key aspects of conducting the survey, and reporting the results. ISO/TS 15666:2003
    does not prescribe methods for the analysis of data obtained from these questions.
    It is recognized that specific requirements and protocols of some social and socio-acoustic
    studies may not permit the use of some or all of the present specifications. ISO/TS
    15666:2003 in no way lessens the merit, value or validity of such research studies.
    The scope of ISO/TS 15666:2003 is restricted to surveys conducted to obtain information
    about noise annoyance "at home". Surveys conducted to obtain information about
    noise annoyance in other situations, such as recreational areas, work environments
    and inside vehicles, are not included. ISO/TS 15666:2003 concerns only the questions
    on noise annoyance used in a social survey and the most important additional specifications
    needed to accomplish a high level of comparability with other studies. Other elements
    which are required to provide high-quality social surveys, but which are not specific
    for social surveys on noise (such as sampling methods), can be found in textbooks.
    Compliance with the recommendations of ISO/TS 15666:2003 does not guarantee the
    collection of accurate, precise or reliable information about the prevalence of
    noise-induced annoyance and its relationship to noise exposure. Other aspects
    of study design, as well as uncertainties of estimation and measurement of noise
    exposure, can influence the interpretability of survey findings to a great extent.
