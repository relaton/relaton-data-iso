abstract:
- language: en
  script: Latn
  content: ISO 11161:2007 specifies the safety requirements for integrated manufacturing
    systems (IMS) that incorporate two or more interconnected machines for specific
    applications, such as component manufacturing or assembly. It gives requirements
    and recommendations for the safe design, safeguarding and information for the
    use of such IMSs. ISO 11161:2007 is not intended to cover safety aspects of individual
    machines and equipment that may be covered by standards specific to those machines
    and equipment. Therefore it deals only with those safety aspects that are important
    for the safety-relevant interconnection of the machines and components. Where
    machines and equipment of an integrated manufacturing system are operated separately
    or individually, and while the protective effects of the safeguards provided for
    production mode are muted or suspended, the relevant safety standards for these
    machines and equipment apply.
