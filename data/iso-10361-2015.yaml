abstract:
- language: en
  script: Latn
  content: ISO 10361:2015 describes procedures that use the mechanical action of a
    Vettermann drum or a hexapod tumbler tester to produce changes in appearance (surface
    structure and colour) to all types of textile floor coverings. It does not include
    pilling or colour changes due to other actions. Changes produced by these drum
    testers are assessed in accordance with the applicable assessment standard.
