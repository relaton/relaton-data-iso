abstract:
- language: en
  script: Latn
  content: Personalized behavioral coaching services are imperative in an aging society
    to help combat social isolation and improve quality of life. When using Generative
    AI for personalized behavior intervention, the risks and functional complexities
    are increasing, safety and reliability must still be achieved. This document addresses
    the reliability of Generative AI and the effectiveness of behavioral interventions
    in an integrated manner, so that personalized behavior coach services can be enhanced
    as a crucial technology for self-care management. The standard specifies requirements
    for the development of Personalized Behavior Coaching (PBC) services focused on
    self-healthcare management at home for elderly with cognitive or physical vulnerabilities.
