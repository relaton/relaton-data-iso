abstract:
- language: en
  script: Latn
  content: This document specifies a conformance test for a UVIP server and client
    system developer assessment of self-conformance of the supplier's UVIP server
    and client system. The conformance test cases follow the use cases definition
    of ISO 13185-1 and the requirements stated in ISO 13185-2 and ISO 13185-3. The
    purpose of this document is to provide information to the UVIP server and client
    system provider to build and test the UVIP server and client system against the
    conformance test cases.
