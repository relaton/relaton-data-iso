abstract:
- language: en
  script: Latn
  content: ISO 18385:2016 specifies requirements for the production of products used
    in the collection, storage, and analysis of biological material for forensic DNA
    purposes, but not those consumables and reagents used in post-amplification analysis.
    The consumables and reagents covered by this International Standard include those
    used for evidence collection (sampling kits), such as swabs, containers, and packaging,
    and also products used in the analysis of DNA samples, such as tubes and other
    plasticware, disposable laboratory coats, gloves, and other consumables. ISO 18385:2016
    applies to the production of consumables and reagents which do not require cleaning
    for continued use. This International Standard does not cover technical product
    specifications (i.e. product design). ISO 18385:2016 excludes microbiological
    testing. ISO 18385:2016 specifies a requirement for manufacturers to minimize
    the risk of occurrence of detectable human nuclear DNA contamination in products
    used by the global forensic community.
