abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the rubbing resistance
    of leather and synthetic materials using rubber. The method aims to establish
    testing conditions that are similar to those of the practical use of footwear
    subjected to drastic stress, as is the case of hiking or children's footwear,
    where the upper of one of the shoes is expected to rub with the sole of the other.
    This method is applicable to all types of leather and synthetic materials intended
    for shoe uppers.
