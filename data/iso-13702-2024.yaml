abstract:
- language: en
  script: Latn
  content: 'This document specifies the objectives and functional requirements for
    the control and mitigation of fires and explosions on offshore installations used
    for the development of hydrocarbon resources in oil and gas industries. The object
    is to achieve: safety of personnel; protection of the environment; protection
    of assets; minimization of financial and consequential losses of fires and explosions.
    This document is applicable to the following: fixed offshore structures; floating
    systems for production, storage, and offloading. Mobile offshore units and subsea
    installations are excluded, although many of the principles contained in this
    document can be used as guidance.'
