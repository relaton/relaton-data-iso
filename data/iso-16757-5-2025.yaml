abstract:
- language: en
  script: Latn
  content: 'This document describes how product catalogue data for building services
    products is exchanged by means of ISO 16739-1 (Industry Foundation Classes, IFC)
    and EN 17549-2 from manufacturers to designers of building services systems. This
    document specifies how the product catalogue structures and content are set up
    using the definitions stored in a data dictionary. In scope of this document are:
    —     processes for the provision and exchange of product catalogues; —     rules
    for the geometrical representation of products; —     representation of products,
    product classes, ports, in/outlets, components and accessories by using IFC; —    
    representation of properties in IFC and the use of IFC constraints for the representation
    of product variants; —     representation of parametric geometry and the generation
    of IFC geometries for selected variants; —     calculation of article number.
    The resulting product catalogue can be used by designers to select the desired
    products and integrate them into their model of the building services system.
    The expected audience of this document are software providers for the built environment
    sector and professionals working in the sector who create product catalogues or
    use product catalogues by means of software tools. Not in scope of this document
    is the representation of properties in data dictionaries. The use of data dictionaries
    is described in ISO 16757-4.'
