abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of selected polybrominated
    diphenylethers (PBDE) (see Figure 1 and Table 1) in sediment, suspended particulate
    matter and biota using gas chromatography coupled with tandem mass spectrometry
    (GC-MS/MS) or with high resolution mass spectrometry (GC-HRMS) in the electron
    impact (EI), negative ion chemical ionization (NCI) or atmospheric pressure ionization
    (APCI) mode. The method is applicable to sediment and suspended particulate matter
    samples with limits of quantification of 0,2 µg/kg dry mass (dm) for brominated
    diphenylether (BDE) BDE-28 to BDE-183, of 2 µg/kg dry mass (dm) for BDE‑209. The
    method is applicable as well with lower limits of quantification (LOQ), if specific
    clean-up methods, described in Clause 10, Table 3, method 1 and method 2 in combination
    with measurement methods GC-MS/MS or GC-HRMS after electron impact ionization
    (El) or negative ion chemical ionization (NCI) for BDE-209 are used. Depending
    on the analytical capability of the instrument, limits of quantification down
    to 0,003 µg/kg dm for BDE-28 to BDE-154 and 0,02 µg/kg dm for BDE-183 and 1 µg/kg
    dm for BDE-209 and lower are possible. The method is applicable to biota samples
    with limits of quantification down to 0,000 2 µg/kg fresh mass (fm) (BDE-28 to
    BDE-154) and 0,03 μg/kg fresh mass (fm) (BDE-183), if specific clean-up methods,
    described in Table 4 in combination with measurement methods GC-MS/MS or GC-HRMS
    after electron impact ionization (El) are used. Performance data are listed in
    Annex E.
