abstract:
- language: en
  script: Latn
  content: ISO 11929-5:2004 specifies suitable statistical values which allow an assessment
    of the detection capabilities in ionizing radiation measurements and of the physical
    effect quantified by the measurand. For this purpose, Bayesian statistical methods
    are used to specify characteristic limits. ISO 11929-5:2004 deals with fundamentals
