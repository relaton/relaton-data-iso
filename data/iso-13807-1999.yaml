abstract:
- language: en
  script: Latn
  content: This International Standard specifies a test method for the determination
    of the crack formation temperature of enamels for the chemical industry by subjecting
    enamelled steel specimens to thermal shock using cold water. The value of the
    crack formation temperature measured according to this test method is not valid
    for the finished component (see annex A). It is a parameter of vitreous and porcelain
    enamels for comparing the relative quality of different enamel formulations.
