abstract:
- language: en
  script: Latn
  content: 'This Recommendation | International Standard defines systems management
    protocol machine managed objects, thus allowing the use of the Common Management
    Information Protocol (CMIP), as defined in ITU-T Rec. X.711 | ISO/IEC 9596-1,
    to manage CMISE and SMASE application service elements and invocations. This Recommendation
    | International Standard: ? establishes a model for supporting systems management
    application service elements; ? provides generic and formal definitions for supporting
    systems management application service element managed objects. This Recommendation
    | International Standard does not: ? define new management functions; ? specify
    a framework or methodology for conformance tests. In the context of this Recommendation
    | International Standard, the term systems management is used to refer to SMASE,
    CMISE, and ROSE.'
