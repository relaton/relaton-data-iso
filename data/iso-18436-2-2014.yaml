abstract:
- language: en
  script: Latn
  content: ISO 18436-2:2014 specifies requirements for the training, relevant experience,
    and examination of personnel performing condition monitoring and diagnostics of
    machines using vibration analysis (VA). A certificate or declaration of conformity
    to the requirements of ISO 18436-2:2014 in accordance with ISO 18436-1, provides
    recognition and evidence that individuals are able to perform vibration measurements
    and analysis for machinery condition monitoring and diagnostics using a range
    of vibration measurement equipment. ISO 18436-2:2014 specifies a four-category
    classification programme that is based on the technical areas delineated herein.
