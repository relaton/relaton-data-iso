abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the provision and operation of
    indirect, temperature-controlled refrigerated delivery services for refrigerated
    parcels which contain temperature-sensitive goods (including foods) in land transportation.
    It includes all refrigerated delivery service stages from acceptance (receipt)
    of a chilled or frozen parcel from the delivery service user to its delivery at
    the designated destination, including intermediate transfer of the refrigerated
    parcels between refrigerated vehicles or container and via a geographical routing
    system. This document also includes requirements for resources, operations and
    communications to delivery service users. It is intended for application by refrigerated
    delivery service providers. This document does not cover requirements for: a)
    refrigerated parcel delivery via modes of transport such as airplane, ship or
    train; b) refrigerated parcels that are transported in ambient temperatures due
    to the fact that they contain their own refrigeration materials (for example,
    ice packs, refrigerated foam bricks, dry ice blocks) and are surrounded and enclosed
    by sealed thermo protective packaging that creates a separate refrigerated climate
    to that provided within the delivery service. However, these types of refrigerated
    parcels may be transported through a refrigerated delivery service; c) direct
    refrigerated delivery services in which chilled parcels and frozen parcels are
    collected from the delivery service user and transported directly to a recipient
    without in-transit transfer; d) the quality or the measurement of the temperature
    of the contents of the chilled parcels or frozen parcels being delivered and their
    pre-point of receipt state, however it does set the requirements for the refrigerated
    delivery service carrying them; e) Medical devices and medical equipment and pharmaceuticals
    might be subject to specific legislation and require specific transport requirements
    and are therefore, excluded from the scope of this document. NOTE Resources covered
    by requirements of this document include facilities, refrigerated vehicles, cold
    stores, and staff members. This document is not limited to covering specific sizes
    of vehicles, as long as the performance requirements can be met. Land transport
    refrigerated vehicles which are conveyed in a ship as roll-on/roll-off vehicles
    are covered by this document. While this document does not cover requirements
    directly relating to the quality or safety of the refrigerated parcels being delivered,
    attention is drawn to specific country legislation that might require a refrigerated
    delivery service provider to adhere to additional requirements outside of this
    document, such as monitoring the temperature of the refrigerated parcel itself,
    or specific requirements regarding the segregation of different types of refrigerated
    parcel. It is important to note that the contents of refrigerated parcels referenced
    within this document are not limited to edible or perishable products.'
