abstract:
- language: en
  script: Latn
  content: 'This document specifies the general characteristics of grooved pins, made
    of steel and stainless steel, with nominal diameters 1 mm to 25 mm. These grooved
    pins are designed to fulfil the main following functions, due to the elastic fit
    behaviour of the grooves: —     locking of two (or more) parts, —     positioning
    or guiding, —     relative rotation of the assembled parts.'
