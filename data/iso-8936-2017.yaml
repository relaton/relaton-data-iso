abstract:
- language: en
  script: Latn
  content: 'ISO 8936:2017 specifies requirements, test methods and material performance
    characteristics for vehicle awnings. It applies to awnings intended to be pitched
    and struck. ISO 8936:2017 is not applicable to: a) sun awnings: structure detachable
    from the vehicle which is used to provide shelter from the sun, but is not designed
    or constructed to provide shelter from wind, rain or snow; NOTE 1 A sun awning
    can be used with additional front and side panels to form an enclosure, but this
    enclosure would not meet the requirements of an awning as defined in this document.
    b) external blinds: structure permanently fixed to a vehicle which is used to
    provide shelter from the sun, but is not designed or constructed to provide shelter
    from wind, rain or snow; NOTE 2 An external blind can be used with additional
    front and side panels to form an enclosure, but this enclosure would not meet
    the requirements of an awning as defined in this document. c) fixed awnings: permanent
    awning which is not designed for mobile use. EXAMPLE Awnings equipped with square
    aluminium frames or timber supporting structures and the possibility to install
    living compartment windows and doors.'
