abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and refers to test methods for digital
    operation microscopes used for observation during surgical operation and treatment
    of patients. It further specifies terms and definitions for describing the optical
    performance of the digital imaging path of digital operation microscopes including
    the observation of the image on digital displays. Notes: Requirements for operation
    microscopes with eyepieces are specified in ISO 10936. Terms and definitions for
    non-stereoscopic digital microscopes are specified in ISO 18221.'
