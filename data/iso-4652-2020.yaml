abstract:
- language: en
  script: Latn
  content: 'This document specifies two methods for the determination of the specific
    surface area of types and grades of carbon black for use in the rubber industry:
    — method A: automatic gas chromatography method (carrier gas method); — method
    B: automatic volumetric method. Somewhat different results might be obtained from
    the two methods. The degassing procedure differs between method A and method B,
    and it is important to investigate the possibility of correcting the results by
    using standard reference blacks. The results might also differ from those obtained
    using the multipoint method specified in ISO 18852, which is the preferred method.
    These methods are not applicable to porous carbon blacks.'
