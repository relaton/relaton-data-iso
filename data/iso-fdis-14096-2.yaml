abstract:
- language: en
  script: Latn
  content: This document specifies three film-digitisation quality classes for the
    requirements of non-destructive testing. The user specifies one of these quality
    classes for the respective film digitization task. The digitization parameters
    depend on the radiation energy, the material thickness penetrated and the quality
    level of the original radiographic film. This document does not address signal
    processing, display and storage of the digitised data. For the application of
    this document, ISO 14096‑1 provides definitions and measurement procedures.
