abstract:
- language: en
  script: Latn
  content: Cancels and replaces the first edition (1979). Specifies a method for the
    determination of the tensile breaking force and elongation at break of frayed
    strips of woven textile glass fabrics conditioned in a standard test atmosphere.
    The method is applicable to unimpregnated textile glass fabrics and to textile
    glass fabrics that have been impregnated with sizing or stiffening materials,
    but not to fabrics coated with rubber or plastics.
