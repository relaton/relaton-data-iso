abstract:
- language: en
  script: Latn
  content: ISO 10993-17:2002 specifies the determination of allowable limits for substances
    leachable from medical devices. It is intended for use in deriving standards and
    estimating appropriate limits where standards do not exist. It describes a systematic
    process through which identified risks arising from toxicologically hazardous
    substances present in medical devices can be quantified. ISO 10993-17:2002 is
    not applicable to devices that have no patient contact (e.g. in vitro diagnostic
    devices). Exposure to a particular chemical substance may arise from sources other
    than the device, such as food, water or air. ISO 10993-17:2002 does not address
    the potential for exposure from such sources.
