abstract:
- language: en
  script: Latn
  content: This document defines terms relating to hardware used in windows and pedestrian
    doors. This document mainly defines terms for hardware used for the connection
    between window sash/casement, door leaf and their corresponding frames, as well
    as the hardware used for operating the window sash/casement and door leaf. This
    document does not define terms for fixing elements used as a means of connecting
    the hardware to the door and window sash/casement profile or frame, nor for hardware
    used for connection between the door/window frame and their openings, such as
    screws, bolts, etc. This document does not give physical definitions related to
    performance requirements and associated test methods of the hardware.
