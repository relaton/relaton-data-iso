abstract:
- language: en
  script: Latn
  content: This document describes the general principles of field-flow fractionation
    and specifies parameters, conditions and minimal reporting requirements, as part
    of an integrated measurement system, required to develop and validate methods
    for the application of asymmetrical flow and centrifugal field-flow fractionation
    in the analysis of nano-objects and their aggregates and agglomerates in aqueous
    media. General guidelines and procedures are provided to aid the user.
