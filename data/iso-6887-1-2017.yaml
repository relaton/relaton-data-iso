abstract:
- language: en
  script: Latn
  content: ISO 6887-1:2017 defines general rules for the aerobic preparation of the
    initial suspension and of dilutions for microbiological examinations of products
    intended for human or animal consumption. ISO 6887-1:2017 is applicable to the
    general case and other parts apply to specific groups of products as mentioned
    in the foreword. Some aspects might also be applicable to molecular methods where
    matrices can be associated with inhibition of the PCR steps and consequently affect
    the test result. ISO 6887-1:2017 excludes preparation of samples for both enumeration
    and detection test methods where preparation instructions are detailed in specific
    International Standards.
