abstract:
- language: en
  script: Latn
  content: ISO 11199-3:2005 specifies requirements and methods of testing the static
    stability, braking capabilities, static strength and fatigue of walking tables
    without accessory equipment, unless specified in the particular test procedure.
    It also gives requirements relating to safety, ergonomics and performance, marking,
    labelling and information supplied by the manufacturer. ISO 11199-3:2005 includes
    all walking tables with three or more wheels or tips against the walking surface
    and having arm supports in the shape of a horizontal supporting table or two horizontal
    forearm supports. The requirements and tests are based on everyday usage of walking
    tables as walking aids, for a maximum user mass as specified by the manufacturer.
    ISO 11199-3:2005 includes walking tables specified for a user mass of not less
    than 35 kg.
