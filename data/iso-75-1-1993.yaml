abstract:
- language: en
  script: Latn
  content: The principle of the method specified is subjecting a standard test specimen
    to a bending stress under three-point loading to produce one of the nominal surface
    stresses in the relevant part of this standard, raising the temperature at a uniform
    rate, measuring the temperature, at which a specified deflection occurs. The results
    obtained do not necessarily represent maximum use temperatures.
