abstract:
- language: en
  script: Latn
  content: 'This document provides guidance for producers, exhibitors, and distributors
    on the visual presentation of audio information in audiovisual content using sign
    languages. This document provides recommendations that are intended to support
    users who prefer to use a visual representation of audio information or prefer
    both audio and visual presentations. This document acknowledges the various needs
    and preferences of sign language users as well as the different approaches to
    visual presentation of audio information. It applies to all visual presentations
    of audio information intended to be presented in a sign language. It does not
    apply to the use of sign language within the regular video content. This document
    does not apply to the presentation devices or transmission mechanisms used to
    deliver the content or visual presentations of audio information. These devices
    could include, but are not limited to: televisions, computers, wireless devices,
    projection equipment, DVD and home cinema equipment, video game consoles, or any
    similar devices which use displays for visual presentation and other forms of
    user interfaces technology. This document does not apply to transcoding files
    and formats for the various video outputs. This document gives guidance on visual
    presentations which are translated or interpreted into one or more sign languages.
    This document does not apply to the specific process of sign language interpretation.
    This document does not apply to forms of manual-visual communication systems that
    are not sign languages (e.g. Cued Speech). This document helps to improve accessibility.
    This document does not establish requirements on specific industries (e.g. television
    broadcasting, motion pictures) nor is it intended to supersede specific international
    standards within their domain.'
