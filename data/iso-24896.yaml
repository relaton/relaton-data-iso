abstract:
- language: en
  script: Latn
  content: This standard establishes a consistent semantic notation for business communication
    with written reports, live presentations, and analytic dashboards (referred to
    collectively as “reports”). It specifies requirements for the visual appearance
    of recurring aspects such as the labelling of content, the layout of charts and
    tables, the representation of data values, as well as the visualization of their
    characteristics. All requirements are applicable to reports of all organizations,
    regardless of their type, size, location, or the nature of the services delivered.
