abstract:
- language: en
  script: Latn
  content: ISO 11666:2018 specifies two ultrasonic acceptance levels known as acceptance
    level 2 (AL 2) and acceptance level 3 (AL 3) for full penetration welded joints
    in ferritic steels, which correspond to ISO 5817:2014, quality levels B and C.
    An acceptance level corresponding to ISO 5817:2014, quality level D is not included
    in this document, as ultrasonic testing is generally not requested for this weld
    quality. These acceptance levels are applicable to testing carried out in accordance
    with ISO 17640. ISO 11666:2018 applies to the testing of full penetration ferritic
    steel welds, with thicknesses from 8 mm to 100 mm. It can also be used for other
    types of welds, materials and thicknesses, provided the tests have been performed
    with necessary consideration of the geometry and acoustic properties of the component,
    and an adequate sensitivity can be employed to enable the acceptance levels of
    this document to be applied. The nominal frequency of probes used in this document
    is between 2 MHz and 5 MHz, unless attenuation or requirements for higher resolution
    call for other frequencies. It is important to consider the use of these acceptance
    levels in conjunction with frequencies outside this range carefully.
