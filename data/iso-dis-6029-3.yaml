abstract:
- language: en
  script: Latn
  content: This document specifies procedures and data exchange format interface(s)
    between sensor fusion actors in P-ITS-S (nomadic device), V-ITS-S, R-ITS-S and
    C-ITS-S for seamless positioning by nomadic device. This document defines the
    process for coordinating and sharing PVT datasets among ITS components, including
    P-ITS-S, V-ITS-S, R-ITS-S, and C-ITS-S, for each specific use case. This document
    does not provide data security and authentication protocols.
