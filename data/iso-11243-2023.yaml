abstract:
- language: en
  script: Latn
  content: This document specifies safety and performance requirements for the design
    and testing of both non cycle specific luggage carriers intended for mounting
    (with or without tools) and cycle specific luggage carriers mounted on complete
    cycles. It applies to luggage carriers intended to be positioned above and adjacent
    to the wheels of cycles. This document lays down guidelines for instructions on
    the use and care of such luggage carriers. This document does not apply to removable
    luggage (for example, handlebar bags or baskets that are not permanently attached).
    Toy carrier intended to be mounted on bicycles for young children in the scope
    of ISO 8098 are not covered by this document.
