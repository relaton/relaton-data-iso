abstract:
- language: en
  script: Latn
  content: 'This document specifies safety requirements and the means for their verification
    for driverless industrial trucks (hereafter referred to as trucks) and their systems.
    Examples of driverless industrial trucks (trucks of ISO 5053-1) can also be known
    as: "automated guided vehicle", "autonomous mobile robot", "bots", "automated
    guided cart", "tunnel tugger", "under cart", etc. This document also contains
    requirements for driverless industrial trucks which are provided with: — automatic
    modes which either require operators'' action(s) to initiate or enable such automatic
    operations; — the capability to transport one or more riders (which are neither
    considered as drivers nor as operators); — additional manual modes which allow
    operators to operate the truck manually; or — a maintenance mode which allows
    manual operation of truck functions for maintenance reasons. It is not applicable
    to trucks solely guided by mechanical means (rails, guides, etc.) or to remotely
    controlled trucks, which are not considered to be driverless trucks. For the purposes
    of this document, a driverless industrial truck is a powered truck, which is designed
    to operate automatically. A driverless truck system comprises the control system,
    which can be part of the truck and/or separate from it, guidance means and power
    system. Requirements for power sources are not covered in this document. The condition
    of the operating zone has a significant effect on the safe operation of the driverless
    industrial truck. The preparations of the operating zone to eliminate the associated
    hazards are specified in Annex A. This document deals with all significant hazards,
    hazardous situations or hazardous events during all phases of the life of the
    truck (ISO 12100:2010, 5.4), as listed in Annex B, relevant to the applicable
    machines when it is used as intended and under conditions of misuse which are
    reasonably foreseeable by the manufacturer. It does not give requirements for
    additional hazards that can occur: — during operation in severe conditions (e.g.
    extreme climates, freezer applications, strong magnetic fields); — during operation
    in nuclear environments; — from trucks intended to operate in public zones (in
    particular ISO 13482); — during operation on a public road; — during operation
    in potentially explosive environments; — during operation in military applications;
    — during operation with specific hygienic requirements; — during operation in
    ionizing radiation environments; — during the transportation of (a) person(s)
    other than (the) intended rider(s); — when handling loads the nature of which
    can lead to dangerous situations (e.g. molten metals, acids/bases, radiating materials);
    — for rider positions with elevation function higher than 1 200 mm from the floor/ground
    to the platform floor. This document does not contain safety requirements for
    trailer(s) being towed behind a truck. This document does not contain safety requirements
    for elevated operator trucks. This document is not applicable to trucks manufactured
    before the date of its publication.'
