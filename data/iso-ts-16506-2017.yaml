abstract:
- language: en
  script: Latn
  content: 'ISO/TS 16506:2017 specifies test methods and information of bond strength
    to dentine and physical and chemical performances of dental polymer-based luting
    materials containing adhesive components. The materials are supplied in a form
    suitable for mechanical mixing or hand-mixing, including using auto-mixing tips,
    for self-curing and/or external energy activation, or non-mixing for external
    energy activation. The polymer-based luting materials covered by this document
    are intended to be used for the cementation or fixation of restorations and appliances
    such as inlays, onlays, veneers, posts, crowns and bridges. ISO/TS 16506:2017
    does not cover the following polymer-based luting materials: a) those which do
    not have an adhesive component within the structure of the material (see ISO 4049);
    b) those intended for veneering sub-frames (see ISO 10477).'
