abstract:
- language: en
  script: Latn
  content: ISO 23500:2014 provides dialysis practitioners with guidance on the preparation
    of dialysis fluid for haemodialysis and related therapies and substitution fluid
    for use in online therapies, such as haemodiafiltration and haemofiltration. As
    such, ISO 23500:2014 functions as a recommended practice. ISO 23500:2014 addresses
    the user's responsibility for the dialysis fluid once the equipment used in its
    preparation has been delivered and installed. For the purposes of ISO 23500:2014,
    the dialysis fluid includes dialysis water used for the preparation of dialysis
    fluid and substitution fluid, dialysis water used for the preparation of concentrates
    at the user's facility, as well as concentrates and the final dialysis fluid and
    substitution fluid.
