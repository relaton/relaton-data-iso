abstract:
- language: en
  script: Latn
  content: ISO 6344:2013 specifies a method for determining or testing the grain size
    distribution of electro-fused aluminium oxide and silicon carbide microgrits P240
    to P2500 for coated abrasives as defined in ISO 6344-1. It applies both to those
    grits used in the manufacture of coated abrasive products and to those grits taken
    from products for testing purposes.
