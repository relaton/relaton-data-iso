abstract:
- language: en
  script: Latn
  content: Applies to most geotextiles and also to geogrids, but in this case specimen
    dimensions may need to be altered. The index test method described covers the
    measurement of load elongation characteristics and includes procedures for the
    calculation of secant stiffness, maximum load per unit width and strain at maximum
    load. Singular points in the load-extension curve are also indicated.
