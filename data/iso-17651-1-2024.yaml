abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and recommendations for the design
    of permanent booths for simultaneous interpreting in new or existing buildings.
    This document also ensures the usability and accessibility of booths for all interpreters.
    This document is to be used in conjunction with ISO 20109, which contains requirements
    and recommendations for the equipment necessary for simultaneous interpreting.
    For requirements and recommendations for permanent booths which do not have a
    direct view of the room in which a communicative event takes place, see ISO 17651-3.[1]
    [1]  Under preparation. Stage at the time of publication: ISO/CD 17651-3-2:2024.'
