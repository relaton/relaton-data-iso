abstract:
- language: en
  script: Latn
  content: This document specifies the loads, the load combinations and the design
    procedures for the design of the steel and aluminium alloy structural members
    of conveyances used for the transport of personnel, materials, equipment and rock
    in vertical and decline shafts. The conveyances covered by this document include
    personnel or material cages (or both), skips, kibbles, equipping skeleton cages,
    inspection cages, bridles, crossheads and counterweights. This document is not
    intended to be used for the design of ropes, sheaves or attachments. Rope sizes
    are determined in accordance with other standards. This document does not cover
    chairlifts. This document does not cover matters of operational safety or layout
    of conveyances. This document adopts a limit states design philosophy.
