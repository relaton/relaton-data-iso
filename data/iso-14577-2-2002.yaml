abstract:
- language: en
  script: Latn
  content: ISO 14577-2 specifies the method of verification and calibration of testing
    machines for carrying out the instrumented test in accordance with ISO 14577-1.
    It describes a direct verification method for checking the main functions of the
    testing machine and an indirect verification method suitable for the determination
    of the repeatability of the testing machine. This part of ISO 14577 is also applicable
    for transportable testing machines.
