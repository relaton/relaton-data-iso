abstract:
- language: en
  script: Latn
  content: 'ISO 22262-3:2016 is primarily intended for quantitative analysis of samples
    in which asbestos has been identified at estimated mass fractions lower than approximately
    5 % by weight. ISO 22262-3:2016 extends the applicability and limit of detection
    of quantitative analysis by the use of simple procedures of ashing and/or acid
    treatment prior to XRD quantification. ISO 22262-3:2016 is applicable to the asbestos-containing
    materials identified in ISO 22262‑1. The following are examples of sample matrices:
    a) any building materials in which asbestos was detected by the analysis in ISO
    22262‑1; b) resilient floor tiles, asphaltic materials, roofing felts and any
    other materials in which asbestos is embedded in an organic matrix and in which
    asbestos was detected when using ISO 22262‑1; c) wall and ceiling plasters, with
    or without aggregate, in which asbestos was detected when using ISO 22262‑1. If
    non-asbestiform serpentine or non-asbestiform amphibole minerals are included
    in the matrix, the XRD peaks that are assumed to be "possible peaks of asbestos"
    will represent these minerals. This method is not for application to natural minerals
    that may contain asbestos or any products that incorporate such natural minerals.
    This method is intended only for application to building material samples that
    contain deliberately added commercial grade asbestos including tremolite asbestos.
    ISO 22262-3:2016 is intended for use by analysts who are familiar with X-ray diffraction
    methods and the other analytical procedures specified in the References [5] and
    [6]. It is not the intention of this part of ISO 22262 to provide basic instruction
    in the fundamental analytical procedures.'
