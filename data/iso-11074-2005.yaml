abstract:
- language: en
  script: Latn
  content: 'ISO 11074:2005 defines terms used in the field of soil quality. The terms
    are classified under the following main headings: 1) General terms and definitions
    (terms relating to soil, to soil materials, to land and sites); 2) Description
    of soil (soil characteristics, soil water, properties of soils and substances,
    processes in soil, contamination, background content); 3) Sampling (general terms
    and definitions, sample types/sampling type, sampling stages, execution of sampling,
    quality control samples, sample pre-treatment, terms and definitions related to
    geostatistics); 4) Terms and definitions relating to the assessment of soils (quality,
    assessment of soil and sites with respect to risk, hazard and exposure, soil protection);
    5) Remediation (general terms and definitions, principal remediation types, engineering-based
    methods, process-based treatment methods). An alphabetical index is provided.'
