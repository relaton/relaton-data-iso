abstract:
- language: en
  script: Latn
  content: ISO 3907:2009 specifies a gravimetric method for the determination of the
    mass fraction of total carbon in carbides and hardmetals. This method is applicable
    to carbides of chromium, hafnium, molybdenum, niobium, tantalum, titanium, vanadium,
    tungsten and zirconium, mixtures of these carbides and binder metals, free of
    lubricant, all grade of presintered or sintered hardmetals, produced from these
    carbides, and having a mass fraction of total carbon exceeding 4 %.
