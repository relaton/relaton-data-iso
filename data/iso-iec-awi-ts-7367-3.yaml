abstract:
- language: en
  script: Latn
  content: The standard focuses on the specification of data structures of a mobile
    Technical Inspection Report (mTR) as an mdoc in compliance with ISO/IEC TS 23220-2
    and ISO/IEC 23220-4. The technical inspection report is also known as a roadworthiness
    certificate, vehicle inspection certificate or MOT certificate in some countries.
    In the annex of the standard, use cases are given in which the roadworthiness
    certificate is applied. The standard does not describe the way a technical inspection
    is conducted and the way the inspection is enforced.
