abstract:
- language: en
  script: Latn
  content: ISO 17280:2015 provides a method for the determination of 1,4-dioxane residues
    in surfactants which are synthesized from epoxyethane, such as alkyl ether sulfates
    and alcohol ethoxylates. The method is applicable for samples containing 1,4-dioxane
    more than 5 mg/kg. For samples containing 1,4-dioxane more than 100 mg/kg, the
    sample solutions should be diluted to appropriate concentration.
