abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for an indoor air quality management
    system. It is applicable to any organization that wishes to: a) establish a system
    for the management of the quality of indoor air; b) implement, maintain and continually
    improve the indoor air quality management system; c) ensure conformity to the
    indoor air quality management system; d) demonstrate conformity to this document.
    It is applicable to the indoor environments of all kinds of facilities, installations
    and buildings, except those that are exclusively dedicated to industrial and/or
    agriculture activities. It is applicable to all types of indoor environments occupied
    by all kinds of persons, including regular users, clients, workers, etc.'
