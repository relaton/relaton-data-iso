abstract:
- language: en
  script: Latn
  content: ISO 105-G01:2016 specifies two methods for determining the resistance of
    the colour of textiles of all kinds and in all forms to the action of nitrogen
    oxides produced during combustion of gas, coal, oil, etc., and when air is passed
    over heated filaments. The two tests differ in severity; one or both of them are
    used, depending on the result obtained (7.2.4).
