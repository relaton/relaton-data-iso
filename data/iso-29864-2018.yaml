abstract:
- language: en
  script: Latn
  content: This document specifies methods to measure the breaking strength and elongation
    at break of a self adhesive tape when it is subjected to a tensile force sufficient
    to cause it to break. These test methods describe a procedure for testing 12 mm
    or 24 mm wide samples cut from supplied rolls of self adhesive tapes. Alternatively
    rolls of self adhesive tape up to 50 mm wide can be directly tested in their original
    width. In these circumstances the practical breaking strength and elongation will
    be typical of the manufacturer's cut edges. When newly cut sample pieces are tested,
    because of the better cutting of the edges, the results can be higher than would
    be found on commercial tape.
