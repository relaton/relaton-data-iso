abstract:
- language: en
  script: Latn
  content: This standard specifies a method for determining the adsorbed gas content
    and desorbed gas volume of dry-basis and equilibrium moisture shale samples by
    using the static volumetric method. This standard specifies the principle of the
    method, apparatus and materials, sample preparation, test procedures, data processing,
    rounding of test results, precision requirements, and test report. This standard
    is applicable to the determination of the adsorbed gas content of shale samples
    under reservoir conditions. It is also applicable to the determination of the
    desorbed gas volume as free gas converted from adsorbed gas due to formation pressure
    reduction during shale gas production.
