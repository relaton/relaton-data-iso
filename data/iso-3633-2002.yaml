abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies the requirements for unplasticized
    poly(vinyl chloride) (PVC-U) pipes and fittings for soil and waste discharge (low
    and high temperature) inside buildings, as well as the system itself. It does
    not include buried pipework. It also specifies the test parameters for the test
    methods referred to in this International Standard. This International Standard
    is applicable to PVC-U pipes and fittings, as well as assemblies of such pipes
    and fittings, intended to be used for the following purposes: soil and waste discharge
    pipework for the conveyance of domestic waste waters (low and high temperature);ventilation
    pipework associated with 1;rainwater pipework inside the building.'
