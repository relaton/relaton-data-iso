abstract:
- language: en
  script: Latn
  content: ISO 18558:2015 specifies the testing method for determining the elastic
    modulus and bending strength of ceramic tubes or rings at ambient temperature
    by the compression tests on split ring pieces. Methods for test piece preparation,
    test modes and load rates, data collection, and reporting procedures are addressed.
    This International Standard applies primary to the ceramic materials including
    monolithic fine ceramic, glass, whisker- or particulate reinforced ceramic composites,
    but not available for fibre reinforced ceramic composites. This test method may
    be used for material research, quality control, and characterization and design
    data generation purpose.
