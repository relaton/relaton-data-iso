abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements for rechargeable energy storage
    systems (RESS) of electrically propelled mopeds and motorcycles for the protection
    of persons. It does not provide the comprehensive safety information for the manufacturing,
    maintenance and repair personnel. NOTE      Additional safety requirements can
    apply for RESS that can be recharged by means different from supplying electric
    energy (e.g. redox flow battery).
