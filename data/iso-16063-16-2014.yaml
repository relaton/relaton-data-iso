abstract:
- language: en
  script: Latn
  content: ISO 16063-16:2014 specifies the instrumentation and procedure to be used
    for performing primary calibration of accelerometers using Earth's gravitation.
    It is applicable to rectilinear accelerometers with DC (zero hertz frequency)
    response, such as straingauge, piezoresistive, variable capacitance, and servo
    accelerometer types. ISO 16063-16:2014 is applicable to the calibration of the
    magnitude of the sensitivity, referenced to the acceleration due to the local
    gravitation at 0 Hz. With the use of appropriate calibration equipment, ISO 16063-16:2014
    can be applied to the calibration of the magnitude of the sensitivity, referenced
    to fractional parts of the acceleration due to the local gravitation at 0 Hz.
    The specification of the instrumentation used contains requirements on environmental
    conditions, as well as specific requirements for the apparatus to be used.
