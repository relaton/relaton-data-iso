abstract:
- language: en
  script: Latn
  content: ISO/IEC TR 22446:2017 establishes a continual performance improvement (CPI)
    process that supports service management system (SMS) as defined in the ISO/IEC
    20000 series. This process ensures successful deployment and service performance
    criteria fulfilment. This process is based on a predictive performance evaluation
    method and a related repository. ISO/IEC TR 22446:2017 is not intended to be used
    as a means of certification and does not add any requirements to those specified
    in ISO/IEC 20000-1. ISO/IEC TR 22446:2017 does not provide specific criteria for
    identifying the need for risk analysis, nor does it specify the types of risk
    analysis techniques that are used to support a particular technology. ISO/IEC
    TR 22446:2017 does not offer techniques for implementing the continual performance
    improvement process.
