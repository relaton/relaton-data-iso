abstract:
- language: en
  script: Latn
  content: ISO 17652-2:2003 describes tests for assessing the influence of shop primers
    on the weldability. The following tests are detailed. Rating test This screening
    test provides a method of assessing the relative weldability of a shop primer
    of a specified thickness by making a standard weld and subsequently evaluating
    the severity of the resulting porosity. Rating tests are suitable for declaration
    by suppliers of the influence of particular shop primers and similar purposes.
    Weldability test This test describes a method for evaluating the weldability of
    welding consumables and shop primer combinations, using various arc welding processes.
    A standard size fillet is produced that enables comparison to be made. An overall
    assessment of the quality of the resultant weld is made. Weldability tests may
    be more closely related to actual conditions during production.
