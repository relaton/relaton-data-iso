abstract:
- language: en
  script: Latn
  content: This document specifies the basic dimensions and tolerances, in millimetres,
    of retainers for punches described in ISO 8020. Retainers are available for round
    and shaped punches. This document gives examples of materials and their hardness,
    and specifies the designation of retainers. These retainers are available for
    punches with shank diameters, D1, from 10 mm to 32 mm. The main use of the retainers
    specified in this document is for punching holes in steel sheet. They may also
    be used for punching in other materials.
