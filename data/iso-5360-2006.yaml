- language: en
  script: Latn
  content: ISO 5360:2006 specifies the dimensions of agent-specific filling systems
    for agent-specific anaesthetic vaporizers. This International Standard does not
    specify construction materials. Because of the unique properties of desflurane,
    dimensions for this agent have not been specified in ISO 5360:2006.
