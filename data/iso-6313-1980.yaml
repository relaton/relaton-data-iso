abstract:
- language: en
  script: Latn
  content: Specifies a combined method of measuring disc brake pads to determine their
    dimensional changes in relation to temperature and their resistance to heat transfer.
    Applies to disc brake pads which dimensions should not exceed 80 mm in depth,
    120 mm in width and 20 mm in thickness, being of integral moulded or bonded type,
    and the backing plate of solid type.
