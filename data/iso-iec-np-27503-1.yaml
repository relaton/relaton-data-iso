abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for privacy and personally identifiable
    information (PII) protection in intelligent travel services, especially online
    ride-hailing services. It identifies typical business scenarios, summarizes key
    considerations and best practices to balance between data utilization and privacy
    protection, and provides recommendations for service operators. It specifically
    addresses: 1) Defining data types, data flows, processing methods and conditions
    for full‑lifecycle data‑processing activities, and setting corresponding data-security
    considerations; 2) Providing examples of dedicated security measures for sensitive
    ride-related data, including location, itinerary audio-video and biometric data;
    3) Specifying technical and management recommendations for each business phase,
    considering dynamic changes of participants and business data throughout service
    operations.'
