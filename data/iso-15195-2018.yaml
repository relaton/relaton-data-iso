abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for competence to carry out reference
    measurement procedures in laboratory medicine, using the requirements of ISO/IEC
    17025:2017 as a normative reference and listing additional requirements for calibration
    laboratories to perform their tasks adequately. The relationship between clauses
    in this document and ISO/IEC 17025:2017 are summarized in Annex A. Examinations
    of properties with results reported on a nominal or ordinal scale are not included.
    This document is not applicable to medical laboratories. NOTE Requirements for
    medical laboratories are specified in ISO 15189[1].
