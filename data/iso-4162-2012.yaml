abstract:
- language: en
  script: Latn
  content: ISO 4162:2012 specifies the characteristics of hexagon bolts with flanges,
    small series, of product grade A (except the driving feature which is according
    to product grade B), with threads from M5 up to and including M16, and property
    classes 8.8 to 10.9 and A2‑70. If, in special cases, specifications other than
    those listed in ISO 4162:2012 are required, they can be selected from existing
    International Standards, for example ISO 261, ISO 888, ISO 898‑1, ISO 965‑2 and
    ISO 3506-1.
