abstract:
- language: en
  script: Latn
  content: 'This document specifies the mounting dimensions of the accessories regarding
    interchangeability for 16 MPa (160 bar) compact cylinders conforming to ISO 6020-3.
    The accessories are applied to mounting with cylinders manufactured in accordance
    with ISO 6020-3. This document covers the following accessories of which the identification
    code is specified in ISO 6099: AP2 rod clevis, internal thread (see Figure 1 and
    Table 1); AP4 rod eye, plain, internal thread (see Figure 2 and Table 2); AA4
    - L pivot pin (locking plate) (see Figure 3 and Table 3); AL6 locking plate for
    pivot pin (see Figure 4 and Table 4); AA4 - S and AA4 - R pivot pin plain (see
    Figure 5-6 and Table 5 respectively). The design of these accessories is based
    on the maximum forces derived from pressures and bore diameters of the cylinders
    specified in ISO 2944 and ISO 3320.'
