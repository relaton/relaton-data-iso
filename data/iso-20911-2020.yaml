abstract:
- language: en
  script: Latn
  content: 'This document specifies RFID tyre tag classification of the different
    technologies (embedding, patching, sticking) to benefit the user''s understanding
    of their differences, targets, possible applications as well as their limitations.
    This document includes: — generic description of the main features for each technology;
    — marking recommendation. This document excludes: — references to items related
    to tyre quality and the testing thereof; — detailed references to embedded locations;
    — detailed references to rubber compound properties; — detailed references to
    tyre manufacturing processes.'
