abstract:
- language: en
  script: Latn
  content: ISO 3245:2015 specifies the boundary dimensions and preferred dimensions
    to be used for drawn cup needle roller bearings without inner ring as well as
    the minimum chamfer dimension limits. Also specified are the closed end thickness
    dimensions for bearings with one closed end. In addition, dimensional tolerances
    for the needle roller complement bore diameter and tolerances for the drawn cup
    width are specified. Informative values for the tolerances for shaft raceway and
    housing bore are given in Annex A.
