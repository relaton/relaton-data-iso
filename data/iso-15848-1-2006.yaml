abstract:
- language: en
  script: Latn
  content: ISO 15848-1:2005 specifies testing procedures, for evaluation of external
    leakage of valve stem seals (or shaft) and body joints of isolating valves and
    control valves intended for application in volatile air pollutants and hazardous
    fluids. End connection joints, vacuum application, effects of corrosion and radiation
    are excluded from ISO 15848-1:2005. ISO 15848-1:2005 concerns classification system
    and qualification procedures for type testing of valves.
