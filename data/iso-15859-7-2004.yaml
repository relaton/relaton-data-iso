abstract:
- language: en
  script: Latn
  content: 'ISO 15859-7:2004 specifies limits for the composition and physical properties
    of anhydrous hydrazine (N2H4) and establishes the sampling and test requirements
    applicable for the verification of the anhydrous hydrazine composition. ISO 15859-7:2004
    is applicable to anhydrous hydrazine propellant, intended for use as fuel in propellant
    systems of space systems as well as in both flight hardware and ground facilities,
    systems, and equipment, of grades: standard [normal production and quality control
    (suitable for most uses)], monopropellant [normal product with strict control
    of specified impurities (to be specified only for monopropellant catalytic engines
    where extended life of the catalyst is desired)] and high purity (special production
    with strict control of specified impurities). ISO 15859-7:2004 is applicable to
    influents only within the specified limits herein. Hydrazine may be of the liquid
    type. ISO 15859-7:2004 is applicable to any sampling operation required to ensure
    that, when the fluid enters the launch vehicle or spacecraft, the fluid composition
    complies with the limits provided hereafter or with any technical specification
    agreed to for a particular use.'
