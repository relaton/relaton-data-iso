abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of taper grooved pins with
    full-length progressive grooves (with closed end at the insertion side), in steel
    and stainless steel, and with nominal diameter 1 mm to 25 mm. These grooved pins
    are designed to fulfil the main following function: locking together two or more
    parts, with an easy installation (due to its shape) and a high level of pull-out
    resistance (due to the elastic fit behaviour of the pin). The general requirements
    (including functional principles for grooved pins and assembly) are specified
    in ISO 13669.'
