abstract:
- language: en
  script: Latn
  content: ISO 26443:2008 specifies a method for the qualitative evaluation of the
    adhesion of ceramic coatings up to 20 µm thick by indentation with a Rockwell
    diamond indenter. The formation of cracks after indentation may also reveal cohesive
    failure. The indentations are made with a Rockwell hardness test instrument. The
    method described may also be suitable for evaluating the adhesion of metallic
    coatings. The test is not suitable for elastic coatings on hard substrates.
