abstract:
- language: en
  script: Latn
  content: This document specifies the general guidelines and advisory specifications
    for Ocean Negative Carbon Emissions and Carbon Neutrality (ONCE-CN), including
    terms and definitions, technical scope, data quality, and reporting requirements.
    This document applies to activities involving the research, development, implementation,
    and assessment of ocean carbon sinks. It aims to provide guidance on relevant
    technologies and methods, promoting global cooperation and standardization in
    the field of ocean negative carbon emissions.
