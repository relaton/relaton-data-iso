abstract:
- language: en
  script: Latn
  content: This document specifies requirements for rebreather diver training programmes
    which provide the competencies required to perform dives to 100 m with a rebreather
    using a breathing mixture containing helium and requiring mandatory decompression
    stops. This document specifies evaluation criteria for these competencies. This
    document specifies the requirements under which training is provided, in addition
    to the general requirements for recreational diving service provision in accordance
    with ISO 24803.
