abstract:
- language: en
  script: Latn
  content: ISO 3547-2:2017 specifies the test data for outside and inside diameters
    of wrapped bushes made of mono and multi-layer bearing material for plain bearing
    applications. It also specifies test designations. Since the wall thickness of
    the bush is measured in the free condition, no special test data are required
    for this on the drawing (see ISO 3547‑5 and ISO 3547‑6). NOTE Depending on the
    manufacturing method, the back of the bushes can show isolated light depressions
    and, similarly, bushes with lubrication holes, grooves and bore indentations can
    show distortion. It is therefore suggested to measure the wall thickness away
    from these areas.
