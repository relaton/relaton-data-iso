abstract:
- language: en
  script: Latn
  content: ISO 9022-7:2015 specifies the methods relating to the environmental tests
    of optical instruments including additional assemblies from other fields (e.g.
    mechanical, chemical, and electronic devices), under equivalent conditions, for
    their ability to resist the influence of drip or rain. The purpose of testing
    is to investigate to what extent the optical, climatic, mechanical, chemical,
    and electrical (including electrostatic) performance characteristics of the specimen
    are affected by drip or rain. Contamination of drip or rain water due to impurities
    in the air is to be ignored for the purposes of ISO 9022-7:2015.
