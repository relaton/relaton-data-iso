abstract:
- language: en
  script: Latn
  content: 'ISO 10993-3:2003 specifies strategies for hazard identification and tests
    on medical devices for the following biological aspects: genotoxicity, carcinogenicity,
    and reproductive and developmental toxicity. ISO 10993-3:2003 is applicable for
    evaluation of a medical device whose potential for genotoxicity, carcinogenicity
    or reproductive toxicity has been identified. Guidance on selection of tests is
    provided in ISO 10993-1.'
