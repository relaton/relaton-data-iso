abstract:
- language: en
  script: Latn
  content: This document specifies qualification requirements for coordination personnel
    in industrial manufacturing sites responsible for additive manufacturing of metal
    parts. This document is applicable to all metallic processes that are described
    by ISO 17296-2. In this context, the skills, tasks and responsibilities for different
    levels of AM coordination personnel are typically adapted according to the applicable
    regulations, depending on the process. This document is intended to provide guidance
    and requirements for the qualification of coordination personnel in general-industrial
    applications. Additional requirements are typically needed for specific industries
    or applications (e.g. aerospace, medical) or to meet regulatory requirements.
