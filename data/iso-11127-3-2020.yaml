abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the apparent
    density of non-metallic blast-cleaning abrasives. This document is a part of the
    ISO 11127 series dealing with the sampling and testing of non-metallic abrasives
    for blast-cleaning. The types of non-metallic abrasive and requirements for each
    are contained in the ISO 11126 series. The ISO 11126 and ISO 11127 series have
    been drafted as a coherent set of International Standards on non-metallic blast-cleaning
    abrasives. Information on all parts of both series is given in Annex A.
