abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and provides guidance for the development,
    implementation, and continual improvement of approaches that support an organization’s
    records management awareness and capability development. It applies to organizations
    of all types and sizes across all sectors and is intended for those responsible
    for establishing or improving records management practices. The document promotes
    alignment with ISO 15489 and ISO 30301 and supports embedding records management
    awareness and capabilities within organizational culture. Exclusions: accreditation,
    formal education programs, unrelated awareness activities, IT training without
    RM relevance, and detailed course content.'
