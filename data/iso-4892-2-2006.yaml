abstract:
- language: en
  script: Latn
  content: ISO 4892-2:2006 specifies methods for exposing specimens to xenon-arc light
    in the presence of moisture to reproduce the weathering effects that occur when
    materials are exposed in actual end-use environments in daylight or daylight filtered
    through window glass. The specimens are exposed to filtered xenon-arc light under
    controlled conditions (temperature, humidity and/or wetting). Various types of
    xenon-arc light source and various filter combinations may be used to meet different
    requirements.
