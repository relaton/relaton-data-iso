abstract:
- language: en
  script: Latn
  content: ISO 21505:2017 describes the context in which the governance of projects,
    programmes and portfolios is conducted and provides guidance for the governance
    of projects, programmes and portfolios. ISO 21505:2017 can also be used for assessment,
    assurance or verification of the governance function for projects, programmes
    or portfolios. ISO 21505:2017 is intended for governing bodies and executive and
    senior management who influence, impact or make decisions regarding the governance
    of projects, programmes and portfolios. It is also intended to provide guidance
    to those who direct projects, programmes and portfolios, such as sponsors, steering
    committees, portfolio owners and the project management office. It also can be
    used by project, programme and portfolio managers, as well as stakeholders involved
    in the development and implementation of projects, programmes and portfolios.
    Other audiences who can have an interest in this topic include those advising,
    informing, assisting or working within projects, programmes and portfolios.
