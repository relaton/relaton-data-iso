abstract:
- language: en
  script: Latn
  content: 'ISO 17717:2017 specifies the minimum requirements and test methods for
    meteorological balloons made from natural rubber latex or natural rubber latex
    compounded with synthetic rubber emulsion. ISO 17717:2017 applies to two types
    of balloon: - Type 1: meteorological balloon produced by dipping process; - Type
    2: meteorological balloon produced by moulding process.'
