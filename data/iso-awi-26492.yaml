abstract:
- language: en
  script: Latn
  content: This proposal specifies a method for determining the biochemical methane
    potential (BMP) of organic substrates by measuring methane production and formation
    rate under controlled laboratory conditions. It applies to crop residues, energy
    crops, livestock and human excreta, municipal and industrial organic wastes, and
    other biodegradable materials that do not inhibit the inoculum. The method provides
    an assessment of anaerobic biodegradability and potential methane yield, supporting
    reproducible evaluation for research, industrial, and environmental applications.
    The results can be used for estimating renewable energy recovery and for greenhouse
    gas mitigation or carbon accounting. Adjustments may be made for inhibitory substrates.
