abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the biobanking of bacteria and
    archaea. It includes management of microbial material associated data as well
    as biosafety and biosecurity requirements. This document is applicable to all
    organizations performing biobanking with bacteria and archaea used for research
    and development. This document does not apply to processing methods for microbial
    materials intended for food/feed production, laboratories undertaking food/feed
    analysis or therapeutic use. NOTE      International, national or regional regulations
    or requirements, or multiple of them, can also apply to specific topics covered
    in this document.
