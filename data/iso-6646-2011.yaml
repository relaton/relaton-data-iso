abstract:
- language: en
  script: Latn
  content: ISO 6646:2011 specifies a laboratory method for the determination of the
    yield of husked rice obtained from paddy or parboiled paddy (Oryza sativa L.),
    and for the determination of the yield of milled head rice obtained from paddy
    or parboiled paddy, or from husked rice or husked parboiled rice. ISO 6646:2011
    is only applicable to abrasive milling equipment.
