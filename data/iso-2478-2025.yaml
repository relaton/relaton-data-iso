abstract:
- language: en
  script: Latn
  content: This document specifies two methods for determining the permanent change
    in dimensions of a dense shaped refractory product. Shaped refractories are those
    which have fixed geometry and dimensions when delivered to the user. This document
    is accordingly applicable to standard shape refractory bricks, but also special
    shapes refractory products and pre-cast products. This document does not apply
    to products containing carbon. NOTE   The methods can be applied to materials
    sensitive to oxidation. However, some of these materials can be affected during
    the test in such a way as to make the measurement of the dimensional changes impossible
    to carry out to the required accuracy.
