abstract:
- language: en
  script: Latn
  content: This new work item will develop an International Standard that will address
    the role of Intelligent Transport Systems to assist Public Transport by applying
    automated driving bus. Part 2 focuses on performance requirements for connectivity
    and safety functions that are required for ensuring reliable Public Transport
    services by automated driving bus. A performance test method and procedure are
    required to be developed as an International Standard in order to operate automated
    driving bus safely in Public Transport. This part 2 work item will be developed
    subsequent to Part 1 and be designated in Part 2 of this work item. This series
    of standards and technical reports will be used by Public Transport Operators,
    Bus Information and Management Centers, and others to organize and commit Public
    Transport resources to Automated Driving Buses.
