abstract:
- language: en
  script: Latn
  content: 'The purpose of ISO/TR 24430:2003 is: to give recommendations on how to
    introduce precision statements into an International Standard which specifies
    a test method for paints, varnishes, related materials and coatings derived from
    them;to outline the general principles to be applied when assessing precision
    in order to establish the procedures which will enable a quantitative estimate
    to be made;to outline the general principles under which interlaboratory trials
    should be conducted. It may be applied to paints, varnishes and related products,
    to their raw materials in solid, liquid or powder form and to coatings derived
    from them. It is concerned only with test methods which operate on a continuous
    scale to yield a single numerical figure as the test result. However, this single
    figure may be the outcome of a calculation from a set of measurements. The distribution
    of test results is required to be unimodal and is assumed to be normal. With non-Gaussian
    distributions other evaluation procedures will be necessary. It does not cover
    methods which yield discrete values such as go no-go tests or where a ranking
    scheme is in operation.'
