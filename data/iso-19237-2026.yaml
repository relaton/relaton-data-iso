abstract:
- language: en
  script: Latn
  content: This document specifies the concepts of operation, minimum functionality, system requirements, system interfaces and test procedures for pedestrian detection and collision mitigation systems (PDCMS), which can reduce the likelihood of fatality and severity of injury. A PDCMS requires information about range to pedestrians, motion of pedestrians, motion of the subject vehicle (SV), driver commands and driver actions. It specifies the behaviours that are required for PDCMS, and the system test criteria necessary to verify that a given implementation meets the requirements of this document. Implementation choices are left to system designers wherever possible. Systems that include other countermeasures such as evasive steering are not within the scope of this document. Responsibility for the safe operation of the vehicle remains with the driver. This document applies to light duty passenger vehicles. It does not apply to other vehicle categories such as heavy vehicles or motorcycles. PDCMS are not intended for off-road use.
