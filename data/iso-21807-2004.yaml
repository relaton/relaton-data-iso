abstract:
- language: en
  script: Latn
  content: ISO 21807:2004 gives basic principles and requirements for physical methods
    of determining the water activity of products intended for human consumption and
    the feeding of animals. Water activity can be used to predict microbial growth
    and determine the microbiological stability of a food product, and it also provides
    an important, quantitatively determinable criterion for estimating the times for
    which a foodstuff can be kept.
