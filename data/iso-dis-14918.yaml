abstract:
- language: en
  script: Latn
  content: ISO 14918:2018 specifies procedural instructions for qualification testing
    of thermal sprayers. It defines requirements, ranges of qualification, test conditions,
    acceptance requirements and certification for qualification testing of thermal
    spray performance. ISO 14918:2018 is applicable when the thermal sprayer's qualification
    is required by this document, the purchaser, by inspection authorities or by other
    organizations. The thermal spraying processes referred to in this document include
    those spraying processes which are designated as manual or mechanized. The test
    for mechanised application includes the use of automatically controlled thermal
    spraying, e.g. robotics, scan units.
