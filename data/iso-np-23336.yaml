abstract:
- language: en
  script: Latn
  content: This proposal specifies technical procedures and work items for space science
    payloads re-flight, designed to reduce potential risks and guarantee the safety
    and reliability of performing a successful scientific re-flight mission. The main
    technical points include, but are not limited to, (1) Re-flight sustainability
    assessment, (2) Re-flight configuration analysis, (3) Re-flight risk management,
    (4) Process control of configuration change, (5) Re-flight configuration verification,
    (6) Re-flight evaluation and release. When viewed from the perspective of a specific
    space science program context, the procedures and items defined in this document
    are tailored to match the genuine requirements of a particular profile and circumstances
    of a re-flight mission.
