- language: en
  script: Latn
  content: ISO 13504:2012 specifies general requirements for the manufacture of instruments
    and related accessories used in the placement of dental implants and further manipulations
    of connecting parts in the craniofacial area. It is applicable to single-use and
    reusable instruments, regardless of whether they are manually driven or connected
    to a power-driven system.
