abstract:
- language: en
  script: Latn
  content: This document specifies characteristics to be measured of nanocomposites,
    i.e., nanocomposite test samples prepared using nanodispersions, and their source
    nano-objects which are intended for use in electrical insulating applications.
    It also specifies the relevant measurements of the individual characteristics.
    This document deals with nanoparticles and nanoplates excluding nanofibers.
