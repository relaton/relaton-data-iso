abstract:
- language: en
  script: Latn
  content: 'The document specifies testing procedures for determining calibration
    error for radiosonde humidity sensors sampled from mass production batches based
    on varying the levels of relative humidity at atmospheric upper-air temperatures
    using a laboratory setup. This document provides: technical requirements for a
    laboratory setup to evaluate the calibration errors of radiosonde humidity measurement;
    a test procedure for evaluating calibration error of radiosonde humidity sensors
    for a temperature range1) of −90 °C to 35 °C and for a relative humidity of 1 %rh
    to 100 %rh. Note, this document, is based upon relative humidity calculated by
    the percentage of water vapour pressure divided by saturation water vapour pressure
    over liquid water, not over ice, even at temperatures below 0 °C; hence, the maximum
    relative humidity is less than 100 %rh below 0 °C; a method for evaluating the
    uncertainty for the measured radiosonde humidity calibration errors. 1) Currently,
    the lowest possible temperature of commercially-available climate chambers is
    approximately -75 °C. The temperature range can be adjusted based on the capability
    of the climate chamber used.'
