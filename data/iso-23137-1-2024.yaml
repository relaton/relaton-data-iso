abstract:
- language: en
  script: Latn
  content: This document provides the general requirements associated with the specific
    characteristics of high efficiency particulate air (HEPA) filters used in nuclear
    facilities. This document provides the manufacturer with general requirements
    for the performance, design, construction, acceptance testing and quality assurance
    for HEPA filters used in nuclear facilities (for qualification and production
    tests). All types of HEPA filter used in such applications are covered, from the
    large size HEPA filters in exhaust HVAC systems to small size low flow rate cylindrical
    HEPA filters for glove boxes. The design, fabrication, inspection and testing,
    certificates with regards to their expected performances are mentioned. This document
    does not provide the specific conditions against which the nuclear filters are
    designed, tested and qualified. This document applies only to the filters used
    for nuclear heating ventilation air conditioning (HVAC) or control rooms habitability
    applications or applications related to the exposure to radioactive ionizing radiations
    (e.g. medical or radioactive aerosols applications) in the severe conditions (e.g.
    fire, high radioactive challenge). Filter housing qualification is not part of
    this document.
