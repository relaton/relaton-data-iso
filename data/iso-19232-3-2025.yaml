abstract:
- language: en
  script: Latn
  content: This document specifies the minimum image quality values (using IQIs) to
    ensure a uniform radiographic image quality. This document specifies the minimum
    IQI values for the two testing classes, A and B, of radiographic techniques as
    specified in ISO 5579. This document is applicable to the two types of image quality
    indicators as detailed in ISO 19232-1 for wire-type IQIs and ISO 19232-2 for step/hole-type
    IQIs, and for the two testing, classes A and B, as specified in ISO 5579.
