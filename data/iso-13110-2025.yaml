abstract:
- language: en
  script: Latn
  content: This document specifies a method for the gas chromatographic determination
    of menthol in the total particulate matter (TPM) of mentholated cigarette mainstream
    smoke with a smoking regime according to ISO 3308 (standard smoking regime). The
    smoking of cigarettes and the collection of TPM from the mainstream smoke are
    carried out in accordance with ISO 4387 with some exceptions (see Annex A). Encapsulated
    menthol in specific products can lead to specific handling not described in this
    document.
