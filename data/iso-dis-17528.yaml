abstract:
- language: en
  script: Latn
  content: 'This standard specifies a method for measuring the solar heat gain coefficient
    for fenestration systems (e.g., complete windows, doors, and curtain walls with
    or without shading devices) using natural solar radiation. It applies to the fenestration
    systems which might consist of: a) various types of glazing (e.g. glass or plastic;
    single or multiple glazing; with/without low emissivity coatings, and with spaces
    filled with air or other gases); b) various types of opaque panels (e.g. door
    panel, metallic panel); c) various types of frames (e.g. wood, plastic, metallic
    with/without thermal barrier or any combination of materials); d) various types
    of shading devices (e.g. blind, screen, film or any attachment with shading effects);
    e) various types of active solar fenestration systems (e.g. building-integrated
    PV systems (BIPV) or building-integrated solar thermal collectors (BIST)).'
