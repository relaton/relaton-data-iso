abstract:
- language: en
  script: Latn
  content: This International Standard specifies methods to carry out vibration tests
    on complete, filled transport packages or unit loads using sinusoidal excitation
    at fixed frequency. These tests may be used to assess the performance of packages
    and unit loads in terms of the strength or the protection that they offer to their
    contents when subjected to low frequency vibration. These tests may be performed
    either as a single test to investigate the effects of low frequency vibration
    or as a part of a sequence of tests designed to measure the ability of a package
    or unit load to withstand a distribution system that includes a vibration hazard
    at low frequency or repetitive shocks.
