abstract:
- language: en
  script: Latn
  content: This document outlines the evaluation methods for environmental tests that
    can be conducted on COTS (Commercial-Off-The-Shelf) spacecraft parts intended
    for use on LEO satellites. The radiation effects considered consist of total dosage,
    single event, and displacement damage. In addition, this document describes tests
    that are useful for satellites operating in LEO.
