abstract:
- language: en
  script: Latn
  content: ISO 15609-5:2004 specifies requirements for the content of welding procedure
    specifications for resistance spot, seam, butt and projection welding processes.
    The acceptability of applying the principles of this International Standard to
    other resistance and related welding processes should be established before any
    qualification is undertaken. Variables listed in ISO 15609-5:2004 are those influencing
    either weld dimensions (quality), weld nugget dimension, weld pattern positioning,
    mechanical properties or geometry of the welded joint.
