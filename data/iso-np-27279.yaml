abstract:
- language: en
  script: Latn
  content: This test method aims to assess the acute coral toxicity of environmental
    water samples (e.g. fresh- and marine water, wastewater effluents, untreated wastewater)
    and individual stressors (e.g., pesticides, pharmaceuticals, home and personal
    care products, high nutrient loads) likely entering the Internal coastal marine
    environment. This test uses adult coral fragments from Montipora digitata (Dana,
    1846), which are exposed for 96 hours under standardised laboratory conditions,
    considering both mortality and bleaching as relevant endpoints. This document
    also describes the culture conditions of the test organism, the test setup, data
    evaluation and reporting.
