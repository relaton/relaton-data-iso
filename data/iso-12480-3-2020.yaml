abstract:
- language: en
  script: Latn
  content: This document establishes required practices for the safe use of tower
    cranes. Subjects covered include safe systems of work, management, planning, selection,
    erection and dismantling, special base, operation and maintenance of cranes and
    the selection of operators, slingers and signalers. It does not cover manually
    (non-powered) operated cranes, or cranes in which at least one of its motions
    is manually operated.
