abstract:
- language: en
  script: Latn
  content: 'ISO 10256-2:2016 specifies performance requirements and test methods for
    head protectors for use in ice hockey and is intended to be read in conjunction
    with ISO 10256‑1. Requirements and the corresponding test methods, where appropriate,
    are given for the following: a) construction and protected area; b) shock absorption;
    c) penetration; d) retention system properties; e) field of vision; f) marking
    and information. ISO 10256-2:2016 applies to head protectors worn by - players
    other than goalkeepers, and - certain functionaries (e.g. referees). NOTE 1 The
    requirements of a Clause take precedent over a figure. NOTE 2 The intent of this
    part of ISO 10256 is to reduce the risk of injury to the head without compromising
    the form or appeal of the game.'
