abstract:
- language: en
  script: Latn
  content: 'ISO 41001:2018 specifies the requirements for a facility management (FM)
    system when an organization: a) needs to demonstrate effective and efficient delivery
    of FM that supports the objectives of the demand organization; b) aims to consistently
    meet the needs of interested parties and applicable requirements; c) aims to be
    sustainable in a globally-competitive environment. The requirements specified
    in ISO 41001:2018 are non-sector specific and intended to be applicable to all
    organizations, or parts thereof, whether public or private sector, and regardless
    of the type, size and nature of the organization or geographical location. Annex
    A provides additional guidance on the use of this document.'
