abstract:
- language: en
  script: Latn
  content: 'ISO 6149-4:2017 specifies dimensions and performance requirements for
    external hex and internal hex port plugs for use with ISO 6149‑1 ports. Port plugs
    in accordance with this document can be used at working pressures up to 63 MPa
    (630 bar[1]). The permissible working pressure depends upon the plug end size,
    materials, design, working conditions, application, etc. Conformance to the dimensional
    information in this document does not guarantee rated performance. Each manufacturer
    is expected to perform testing according to the specification contained in this
    document to assure that components comply with the performance ratings. WARNING:
    The use of stud ends conforming to this document with ports conforming to the
    relevant parts of ISO 1179, ISO 9974 and ISO 11926 could lead to a hazardous situation.
    [1] 1 bar = 0,1 MPa = 105 Pa; 1 MPa = 1 N/mm2.'
