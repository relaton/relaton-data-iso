abstract:
- language: en
  script: Latn
  content: This document provides guidance around best practices for cleaning, disinfecting
    and caring for the polyurethane covers for assistive products for tissue integrity
    when lying down (APTIs) where the covers are designed to protect the internal
    components of the APTI from damage. Adherence to this guidance will extend the
    operational life of the APTI and its tissue integrity performance. This document
    gives guidance for cleaning and disinfecting by manual means only. This document
    is not intended to give guidance related to the efficacy of the cleaning and disinfection
    procedures.
