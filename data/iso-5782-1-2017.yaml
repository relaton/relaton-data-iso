abstract:
- language: en
  script: Latn
  content: ISO 5782-1:2017 specifies which characteristics of compressed air filters
    are to be included in the supplier's literature. It also specifies product-marking
    requirements. ISO 5782-1:2017 is applicable to compressed air filters, constructed
    from light alloys (aluminium, etc.), zinc diecast alloys, brass, steel and plastic,
    with a rated pressure of up to 1 600 kPa (16 bar) and a maximum temperature of
    80 °C, designed to remove solid and liquid contaminants from compressed air by
    mechanical means
