abstract:
- language: en
  script: Latn
  content: ISO 19085-3:2017 gives the safety requirements and measures for numerically
    controlled (NC) boring machines, NC routing machines and NC combined boring/routing
    machines (as defined in 3.1), hereinafter referred to as "machines". ISO 19085-3:2017
    deals with all significant hazards, hazardous situations and events, listed in
    Clause 4, relevant to the machines when they are operated, adjusted and maintained
    as intended and under the conditions foreseen by the manufacturer including reasonably
    foreseeable misuse. Also, transport, assembly, dismantling, disabling and scrapping
    phases have been taken into account.
