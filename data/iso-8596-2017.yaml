abstract:
- language: en
  script: Latn
  content: ISO 8596:2017 specifies a range of Landolt ring optotypes and describes
    a method for measuring distance visual acuity under photopic conditions for the
    purposes of certification or licensing. ISO 8596:2017 is neither intended as a
    standard for clinical measurements nor for the certification of blindness or partial
    sight. Other optotypes used for clinical investigations are described in Annex
    A for information.
