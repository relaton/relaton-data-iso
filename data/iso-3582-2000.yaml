abstract:
- language: en
  script: Latn
  content: Cette norme internationale spécifie une méthode d'essai à petite échelle
    en laboratoire, permettant une première comparaison des caractéristiques relatives
    de combustion de petites éprouvettes de matériaux polymères alvéolaires souples,
    lorsqu'elles sont soumises, en position horizontale, à une source de chaleur de
    faible énergie. Elle est prévue uniquement pour l'estimation rapide et simple
    des caractéristiques de combustion des petites éprouvettes de matériaux, considérés
    sans référence aux conditions d'environnement sous lesquelles le matériau, ou
    les produits qui en découlent peuvent être utilisés. En conséquence, il n'est
    pas possible d'établir une corrélation entre les résultats de cet essai et la
    performance de tels matériaux ou produits dans des conditions réelles d'utilisation.
    L'essai est réduit aux éprouvettes d'essai d'une épaisseur supérieure à 5 mm.
    Les résultats des essais sur les éprouvettes d'essai de différentes épaisseurs
    ne sont pas comparables. Cette méthode d'essai ne doit pas être utilisée pour
    estimer le risque potentiel de feu dans les conditions réelles d'emploi.
