abstract:
- language: en
  script: Latn
  content: This document provides the procedure and methods for the preparation, development,
    and assessment of chemical profiles from herbal medicines for the quality control
    using chromatographic fingerprint. This document is applicable to evaluate the
    quality of raw herbal materials, herbal preparations, or finished herbal products,
    when their chemical constituents are not fully defined, or the constituents with
    known therapeutic activity or analytical markers are not determined.
