abstract:
- language: en
  script: Latn
  content: 'The purpose of this International Standard is to provide criteria for
    quality assurance and quality control, evaluation of the performance and the accreditation
    of biological dosimetry by cytogenetic service laboratories using the PCC. This
    International Standard addresses: 1) the confidentiality of personal information,
    for the customer and the laboratory; 2) the laboratory safety requirements; 3)
    the calibration sources and calibration dose ranges useful for establishing the
    reference dose-effect curves that contributes to the dose estimation from the
    frequency of chromosome damage and the minimum resolvable doses; 4) the scoring
    procedure for chromosome damage using premature chromosome condensation used for
    evaluation of exposure; 5) the criteria for converting a measured chromosome damage
    into an estimate of absorbed dose; 6) the reporting of results; 7) the quality
    assurance and quality control; 8) informative annexes containing sample instructions
    for customer, sample questionnaire, sample datasheet for recording damage, sample
    of report and fitting of the low dose-response curve by the method of maximum
    likelihood and calculating the error of dose estimate.'
