abstract:
- language: en
  script: Latn
  content: This document specifies the minimum functional requirements of digital
    safe software in order to ensure the integrity, confidentiality and availability
    of the digital objects it stores. This document does not address system environments
    for the operation of the digital safe, such as physical security (fire extinguishing
    systems, armoured doors, presence detectors, etc.), power supply security (generators
    and transformers) or telecommunication lines.
