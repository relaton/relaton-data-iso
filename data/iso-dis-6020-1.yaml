abstract:
- language: en
  script: Latn
  content: ISO 6020-1:2007 establishes metric mounting dimensions for medium series
    cylinders, 16 MPa (160 bar), as required for interchangeability of commonly used
    hydraulic cylinders. The medium series dimensions are applicable to round head
    cylinders with bores from 25 mm to 200 mm and to both round and square head cylinders
    with bores larger than 200 mm, thus allowing a wider range of applications.
