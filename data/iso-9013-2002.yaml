abstract:
- language: en
  script: Latn
  content: International Standard ISO 9013 applies to materials suitable for oxyfuel
    flame cutting, plasma cutting and laser cutting. It is applicable to flame cuts
    from 3 mm to 300 mm, plasma cuts from 1 mm to 150 mm and to laser cuts from 0,5
    mm to 40 mm. This International Standard includes geometrical product specifications
    and quality tolerances. The geometrical product specifications are applicable
    if reference to ISO 9013 is made in drawings or pertinant documents, e.g. delivery
    conditions. If this International Standard is also to apply, by way of exception,
    to parts which are produced by different cutting processes (e.g. high-pressure
    water jet cutting), this has to be agreed upon separately.
