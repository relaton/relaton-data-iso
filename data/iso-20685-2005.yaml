abstract:
- language: en
  script: Latn
  content: ISO 20685:2005 addresses protocols for the use of 3-D surface-scanning
    systems in the acquisition of human body shape data and measurements defined in
    ISO 7250 that can be extracted from 3-D scans. It does not apply to instruments
    that measure the location and/or motion of individual landmarks. While mainly
    concerned with whole-body scanners, it is also applicable to body-segment scanners
    (head scanners, hand scanners, foot scanners).
