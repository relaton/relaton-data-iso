abstract:
- language: en
  script: Latn
  content: 'This document describes remote support provided to LSADS operated at Level
    4 automation on predefined routes by a remotely located human in order to facilitate
    safe trip continuation. "Remote support" refers to the provision of information,
    or temporary performance of the dynamic driving task (DDT), and remote monitoring
    required for these functions. This document is applicable to RS-LSADS in vehicles
    that provide passenger transport or logistics services on predefined routes. This
    document specifies: —     the terms and definitions related to RS-LSADS and the
    system architecture of RS-LSADS; —     functions of RS-LSADS, which are: remote
    monitoring, remote assistance and remote driving that is operated under very limited
    conditions, and conditions under which they need to be activated; —     the performance
    requirements, system requirements and performance test procedures of RS-LSADS;
    —     the data to be communicated between vehicles and the remote support facility
    (but not protocols or other aspects of communication system). This document is
    applicable to remote support of operational and tactical functions during continuous
    operations, but does not apply to strategic functions or to RS-LSADS daily startup
    or shutdown.'
