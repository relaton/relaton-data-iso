abstract:
- language: en
  script: Latn
  content: This document provides requirements and recommendations for creators, designers,
    producers, exhibitors and distributors of user interfaces using avatars in their
    systems, applications and contents. This document defines the term “avatar” and
    provides a categorization of avatars based on their presentation and function.
    This document also refers to considerations of ethical and usability aspects in
    the design, distribution and operation processes of avatars. This document applies
    to all fields of information technology that use avatars in their content, including
    entertainment and business applications in virtual reality, augmented reality,
    mixed reality, cyber-physical systems, metaverse and interverse.
