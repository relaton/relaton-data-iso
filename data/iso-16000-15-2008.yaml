abstract:
- language: en
  script: Latn
  content: ISO 16000-15:2008 specifies the planning of nitrogen dioxide indoor pollution
    measurements. In the case of indoor air measurements, the careful planning of
    sampling and the entire measurement strategy are of particular significance since
    the result of the measurement may have far-reaching consequences, for example,
    with regard to ascertaining the need for remedial action or the success of such
    an action. An inappropriate measurement strategy may lead to misrepresentation
    of the true conditions or, worse, to erroneous results.
