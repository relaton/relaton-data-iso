abstract:
- language: en
  script: Latn
  content: This document specifies the description and management of peptidomics data,
    encompassing content requirements for data formats, norms and description rules,
    data quality assessment requirements, as well as data sharing, publication, and
    privacy protection. This document applies to the description, storage, exchange,
    and sharing of peptidomics data elements. This document is suitable for the construction
    and operation of information systems, databases, and platforms related to peptidomics
    data, as well as for data acquisition, processing, analysis, and reporting.
