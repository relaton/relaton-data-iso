abstract:
- language: en
  script: Latn
  content: This document specifies the method for determining the content and chemical
    composition of soluble fractions of polyolefin of various temperature ranges from
    room temperature to the complete dissolution temperature in 1,2-dichlorobenzene/1,2,4-trichlorobenzene.
    This document specifies a method for determining the chemical composition distribution
    of semi-crystalline polyolefins by crystallization on an inert column from dilute
    solution in 1,2-dichlorobenzene or 1,2,4-trichlorobenzene and with a subsequent
    sample elution process. This document applies to polyethylene, polypropylene and
    α-olefin copolymers of the same.
