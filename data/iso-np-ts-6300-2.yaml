abstract:
- language: en
  script: Latn
  content: This document supplements ISO 19702 as a tool for the user to interpret
    FTIR data in fire effluents.This document provides practical guidance to complement
    ISO 19702, focusing on the interpretation of Fourier Transform Infrared (FTIR)
    spectroscopy data in the analysis of fire effluents. It covers qualitative and
    quantitative analysis of gases, handling of unknown gases, and the calculation
    of gas yields and concentrations. The document aims to assist users in accurately
    identifying and quantifying toxic gases and vapours generated during combustion,
    ensuring coherence with other parameters such as mass loss rate (MLR) and heat
    release rate (HRR). It is designed to be accessible to practitioners who may not
    have advanced technical expertise but need to understand the principles and applications
    of FTIR in fire safety.
