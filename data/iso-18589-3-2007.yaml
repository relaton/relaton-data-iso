abstract:
- language: en
  script: Latn
  content: ISO 18589-3:2007 specifies the identification and the measurement of the
    activity in soils of a large number of gamma-emitting radionuclides using gamma
    spectrometry. This non-destructive method, applicable to large-volume samples
    (up to about 3 000 cm3), covers the determination in a single measurement of all
    the g-emitters present for which the photon energy is between 5 keV and 3 MeV.
    ISO 18589-3:2007 can be applied by test laboratories performing routine radioactivity
    measurements as a majority of radionuclides is characterized by gamma-ray emission
    between 40 keV and 2 MeV. ISO 18589-3:2007 is suitable for the surveillance of
    the environment and the inspection of a site and allows, in case of accidents,
    a quick evaluation of gamma activity.
