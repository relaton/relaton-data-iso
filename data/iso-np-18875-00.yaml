abstract:
- language: en
  script: Latn
  content: 'This International Standard defines the professional terms throughout
    the entire industrial chain of the coalbed methane (CBM) industry, with core coverage
    of four categories: geology and exploration, engineering and construction, development
    and production, safety and environmental protection. It clarifies the definitions
    and connotations of each term, and is applicable to technical exchanges, engineering
    practices, standard formulation, international trade and cooperation, and other
    related activities in the global coalbed methane sector.'
