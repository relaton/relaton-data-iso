abstract:
- language: en
  script: Latn
  content: ISO 13849-1:2006 provides safety requirements and guidance on the principles
    for the design and integration of safety-related parts of control systems (SRP/CS),
    including the design of software. For these parts of SRP/CS, it specifies characteristics
    that include the performance level required for carrying out safety functions.
    It applies to SRP/CS, regardless of the type of technology and energy used (electrical,
    hydraulic, pneumatic, mechanical, etc.), for all kinds of machinery. It does not
    specify the safety functions or performance levels that are to be used in a particular
    case. ISO 13849-1:2006 provides specific requirements for SRP/CS using programmable
    electronic system(s). It does not give specific requirements for the design of
    products which are parts of SRP/CS. Nevertheless, the principles given, such as
    categories or performance levels, can be used.
