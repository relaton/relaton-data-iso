abstract:
- language: en
  script: Latn
  content: This part of IEC 62264 specifies generic interface content exchanged between
    manufacturing control functions and other enterprise functions. The interface
    considered is between Level 3 manufacturing systems and Level 4 business systems
    in the hierarchical model defined in IEC 62264-1. The goal is to reduce the risk,
    cost, and errors associated with implementing the interface. Since this standard
    covers many domains, and there are many different standards in those domains,
    the semantics of this standard are described at a level intended to enable the
    other standards to be mapped to these semantics. To this end this standard defines
    a set of elements contained in the generic interface, together with a mechanism
    for extending those elements for implementations. The scope of IEC 62264-2 is
    limited to the definition of object models and attributes of the exchanged information
    defined in IEC 62264-1. This part of IEC 62264 standard does not define attributes
    to represent the object relationships.
