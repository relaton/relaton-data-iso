abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the release of lead and cadmium
    from ceramic ware, glass ceramic ware and glass dinnerware intended to be used
    in contact with food, but excluding vitreous and porcelain enamel articles (covered
    by ISO 4531). This document is applicable to ceramic ware, glass ceramic ware
    and glass dinnerware which is intended to be used for the preparation, cooking,
    serving and storage of food and beverages, excluding all articles used in food
    manufacturing industries or in which food is sold.
