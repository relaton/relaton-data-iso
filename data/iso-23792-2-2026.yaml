abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for discretionary lane change
    (DLC) for motorway chauffeur systems (MCS) that perform Level 3 automated driving
    on limited access motorways. It also specifies the test procedures to verify the
    requirements. DLC is an additional functionality that can be added to an MCS conforming
    to the general requirements specified in ISO/TS 23792-1. Means related to setting
    a destination and selecting a route to reach the destination are not in the scope
    of this document. This document applies to the system installed in light vehicles.
