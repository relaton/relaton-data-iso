  script: Latn
  content: ISO/IEC 29341-17-13:2011(E) is a service definition addendum and contains
    recommendations for implementing interfaces between the UPnP QosDevice Service
    and various lower transport layers. Its purpose is to ensure that implementers
    of these interfaces use consistant mapping of methods and parameters from UPnP
    to the lower layers.
