abstract:
- language: en
  script: Latn
  content: This document provides the most important design and metrological characteristics
    of convex spherical material measures, which can be used as a dimensional standard
    and/or as a form standard. NOTE While partial spherical material measures (e.g.
    spherical caps) are included in this document, they are considered outside the
    scope if they are shallow or very limited in extent so as to require special attention
    due to the potential instability of the evaluation results of the metrological
    characteristics. It defines for its standardized metrological characteristics
    their default maximum permissible errors and maximum permissible limits in accordance
    with a specified grade, for spherical material measure having a nominal diameter
    between 0,3 mm and 125 mm.
