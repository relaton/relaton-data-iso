abstract:
- language: en
  script: Latn
  content: ISO 11890-1:2007 is one of a series of standards dealing with the sampling
    and testing of paints, varnishes and related products. It specifies a method for
    the determination of the volatile organic compound (VOC) content of paints, varnishes
    and their raw materials. This part may be used where the expected VOC content
    is greater than 15 % by mass. When the expected VOC content is greater than 0,1
    % by mass and less than 15 % by mass, ISO 11890-2 should be employed. This method
    assumes that the volatile matter is either water or organic. However, other volatile
    inorganic compounds can be present and might need to be quantified by another
    suitable method and allowed for in the calculations.
