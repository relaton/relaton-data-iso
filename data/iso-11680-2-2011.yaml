abstract:
- language: en
  script: Latn
  content: ISO 11680-2:2011 gives safety requirements and measures for their verification
    for the design and construction of portable, hand-held, pole-mounted powered pruners
    with a back-pack power unit and using a drive shaft to transmit power to a cutting
    attachment consisting of a saw chain or reciprocating or circular saw blade. Methods
    for the elimination or reduction of hazards arising from the use of these machines
    and the type of information on safe working practices to be provided by the manufacturer
    are specified. ISO 11680-2:2011, together with the relevant sections of ISO 11680-1,
    deals with all significant hazards, hazardous situations or hazardous events with
    the exception of electric shock from contact with overhead electric lines (apart
    from warnings and advice for inclusion in the instruction handbook) and whole-body
    vibration from the back-pack power unit, relevant to these machines when they
    are used as intended and under conditions of misuse which are reasonably foreseeable
    by the manufacturer.
