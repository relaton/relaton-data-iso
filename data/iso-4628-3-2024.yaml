abstract:
- language: en
  script: Latn
  content: This document specifies methods for assessing the degree of rusting of
    surfaces coated with paints and varnishes (organic coatings), and metallic coating
    plus an organic coating (duplex system), by comparison with pictorial standards.
    The pictorial standards provided in this document show surfaces which have deteriorated
    to different degrees by a combination of rust broken through the coating and visible
    under-rusting. The assessment of the degree of rusting in this document is only
    an estimation of the affected area on specimen. Edges are not included.
