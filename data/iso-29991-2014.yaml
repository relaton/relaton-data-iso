abstract:
- language: en
  script: Latn
  content: ISO 29991:2014 specifies requirements for language learning services outside
    formal education. These include any language learning services that are addressed
    to language learners themselves, as well as to interested parties that are acquiring
    the services for the benefit of learners. The key features of any such service
    are that the goals of learning are defined and evaluated, and that it involves
    interaction with the learner. The instruction can be delivered face-to-face or
    mediated by technology, or it can be a blend of both. Entities interested in using
    ISO 29991:2014 will include language learning service providers of all kinds and
    sizes, as well as associations or consortia of language learning service providers.
    In cases where the language learning services are provided by an organization
    that delivers products (goods and services) or other learning services in addition
    to language learning services, ISO 29991:2014 only applies to language learning
    services. ISO 29991:2014 is not specifically aimed at schools, colleges and universities
    which provide language learning as part of a formal educational system but may
    be useful to them as a tool for reflection and self-evaluation.
