abstract:
- language: en
  script: Latn
  content: ISO 21415-3:2006 specifies a method for the determination of the dry gluten
    content from wet gluten obtained as specified in either ISO 21415-1 or ISO 21514-2.
    In this method, dry gluten is obtained from wet gluten by drying in an oven. The
    method can also be used to determine the moisture content of the wet gluten.
