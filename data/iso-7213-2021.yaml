abstract:
- language: en
  script: Latn
  content: This document specifies a method of obtaining, for test purposes, a gross
    sample representative of a certain lot of pulp. This document applies to all kinds
    of pulp delivered in bales or rolls. It is intended for use when sampling for
    all kinds of testing purposes except for the determination of saleable mass, in
    which case other International Standards apply such as ISO 801-1 and ISO 801-2.
    If, however, the pulp is to be tested for saleable mass in addition to other properties,
    the gross sample obtained according to the appropriate International Standard
    for sampling saleable mass can also be used for the other pulp property tests.
