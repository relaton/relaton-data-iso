abstract:
- language: en
  script: Latn
  content: This document specifies the model tests for ships and offshore structures in snow-covered ice. It covers the physical modelling techniques, test methods, analysis methods of results, and requirements of the facilities and data documentation used in these tests. This document applies to the model test methods used for estimating the ice resistance of ships and ice loads on offshore structures in snow-covered ice.
