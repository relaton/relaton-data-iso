abstract:
- language: en
  script: Latn
  content: ISO 11418-4:2005 specifies the design, dimensions, material and requirements
    of tablet glass bottles. Tablet glass bottles are applicable to primary packs
    used in direct contact with a drug. ISO 11418-4:2005 is applicable to tablet glass
    bottles used in pharmacy. Together with the corresponding closure systems, they
    serve for packaging of pharmaceutical preparations in solid and liquid dosage
    forms which are not intended for parenteral use.
