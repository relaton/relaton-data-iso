abstract:
- language: en
  script: Latn
  content: 'This document: — defines smoking parameters and specifies the conditions
    to be provided for the routine analytical machine smoking of cigarettes under
    specified intense conditions; — specifies the requirements for a routine analytical
    smoking machine conforming with these conditions; — specifies additional test
    methods for machine verification. Annex A gives examples of designs of smoking
    machine enclosures. NOTE The type of analytical smoking machine used could impact
    the mass of total particulate matter collected on the smoke trap. This might be
    due to either incomplete collection or evaporation of water and other volatile
    compounds from the smoke trap.'
