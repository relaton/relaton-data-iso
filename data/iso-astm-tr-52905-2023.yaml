abstract:
- language: en
  script: Latn
  content: 'This document categorises additive manufacturing (AM) defects in DED and
    PBF laser and electron beam category of processes, provides a review of relevant
    current NDT standards, details NDT methods that are specific to AM and complex
    3D geometries and outlines existing non‑destructive testing techniques that are
    applicable to some AM types of defects. This document is aimed at users and producers
    of AM processes and it applies, in particular, to the following: —    safety critical
    AM applications; —    assured confidence in AM; —    reverse engineered products
    manufactured by AM; —    test bodies wishing to compare requested and actual geometries.'
