abstract:
- language: en
  script: Latn
  content: ISO 11073-10101:2004 covers nomenclature architecture for point-of-care
    (POC) medical device communication (MDC). It defines the overall architecture
    of the organization and relationships among nomenclature components and provides
    specifications of semantics and syntaxes. ISO 11073-10101:2004 is intended for
    use within the context of IEEE Std 1073,1 which sets out the relationship between
    this and other documents in the POC MDC series.
