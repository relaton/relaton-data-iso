abstract:
- language: en
  script: Latn
  content: This document specifies quantitative challenge test methods for evaluating
    the antifungal activity of footwear and footwear components. This document is
    applicable only to footwear and components that claim to have antifungal (antimycotic)
    properties or antimicrobial properties. Two methods can be applied. The choice
    of method depends on the material properties and test microorganisms. Dynamic
    challenge test method can be applied to all types of materials. For single absorbent
    materials, static challenge test method is recommended. Brief descriptions of
    each method are given in 11.2 and 11.3.
