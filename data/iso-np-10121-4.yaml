abstract:
- language: en
  script: Latn
  content: 'This document establishes a classification system for GPACDs used in general
    ventilation systems for the treatment of indoor air in systems operating with
    partial or full air recirculation and affected by pollution from indoor sources.
    The classification system is intended to aid in assessing molecular contamination
    in addition to the particulate contamination dealt with by ISO 16890-1 and molecular
    contamination dealt with by ISO 10121-3. This document specifies three reference
    pollutants: ozone, nitrogen dioxide, and toluene that shall be used for the classification
    due to their relevance to the intended application. This document further specifies
    optional reference pollutants, including formaldehyde and isopropanol, which may
    be used for extended performance characterization. This document further specifies
    three duty levels that are assigned for each pollutant reflecting the typical
    performance range of devices intended for the application.'
