abstract:
- language: en
  script: Latn
  content: ISO/TS 28923:2012 specifies the safety requirements and their verification
    for the design and construction of fixed guards to be opened by the use of a tool
    and interlocking movable guards for moving parts of the power transmission on
    self-propelled ride-on machines and mounted, semi-mounted or trailed machines
    used in agriculture. In addition, it specifies the type of information on safe
    working practices (including residual risks) to be provided by the manufacturer.
    It deals with the significant hazards, hazardous situations and events relevant
    for fixed guards to be opened by the use of a tool and interlocking movable guards
    of moving parts of power transmission used as intended and under the conditions
    foreseen by the manufacturer. It is not applicable to guards of moving parts of
    the power transmission of agricultural and forestry tractors, aircraft and air
    cushion vehicles used in agriculture, lawn and garden equipment, or guards for
    PTO drive shafts between agricultural and forestry tractors and mounted or towed
    implements.
