abstract:
- language: en
  script: Latn
  content: 'This document lists the International Standards which are currently available
    for the determination of the chemical composition of nickels, ferronickels and
    nickel alloys (see Clause 4). It provides details on the range of application
    and gives the principle of the method described in each International Standard
    (see Clause 5). Annex A shows graphical representations of the content ranges
    of the methods listed in this document: Figure A.1 represents the fields of application
    of the methods available for the three kinds of matrixes; Figure A.2 gives the
    content ranges of the methods for nickels; Figure A.3 gives the content ranges
    of the methods for ferronickels; Figure A.4 gives the content ranges of the methods
    for nickel alloys. Annex B provides a bilingual key of the abbreviated terms used
    in the figures given in Annex A.'
