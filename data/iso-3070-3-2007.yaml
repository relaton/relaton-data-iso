abstract:
- language: en
  script: Latn
  content: ISO 3070-3:2007 specifies, with reference to ISO 230-1 and ISO 230-2, geometric
    tests, machining tests and tests for checking the accuracy and repeatability of
    positioning by numerical control of general purpose, normal accuracy, horizontal
    spindle boring and milling machines having a movable column and movable table.
    ISO 3070‑3:2007 also specifies the applicable tolerances corresponding to these
    tests. ISO 3070-3:2007 concerns machines having movement of the column or column
    saddle on the bed (X axis), vertical movement of the spindle head (Y axis), movement
    of the boring spindle or ram (Z axis) and, possibly, a feed movement of radial
    facing slide in the facing head (U-axis). Some machines also have an intermediate
    saddle with slideway between column and bed to achieve additional movement of
    the column parallel to the spindle axis (W-axis). ISO 3070-3:2007 deals only with
    the verification of the accuracy of the machine. It does not apply to the operational
    testing of the machine (e.g. vibration, abnormal noise, stick-slip motion of components)
    nor to machine characteristics (e.g. speeds, feeds), as such checks are generally
    carried out before testing the accuracy.
