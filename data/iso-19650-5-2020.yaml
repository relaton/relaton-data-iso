abstract:
- language: en
  script: Latn
  content: This document specifies the principles and requirements for security-minded
    information management at a stage of maturity described as "building information
    modelling (BIM) according to the ISO 19650 series", and as defined in ISO 19650-1,
    as well as the security-minded management of sensitive information that is obtained,
    created, processed and stored as part of, or in relation to, any other initiative,
    project, asset, product or service. It addresses the steps required to create
    and cultivate an appropriate and proportionate security mindset and culture across
    organizations with access to sensitive information, including the need to monitor
    and audit compliance. The approach outlined is applicable throughout the lifecycle
    of an initiative, project, asset, product or service, whether planned or existing,
    where sensitive information is obtained, created, processed and/or stored. This
    document is intended for use by any organization involved in the use of information
    management and technologies in the creation, design, construction, manufacture,
    operation, management, modification, improvement, demolition and/or recycling
    of assets or products, as well as the provision of services, within the built
    environment. It will also be of interest and relevance to those organizations
    wishing to protect their commercial information, personal information and intellectual
    property.
