abstract:
- language: en
  script: Latn
  content: 'This document provides principles and requirements for safe handling and
    storage of solid biofuels pellets in commercial and industrial applications. This
    document is using a risk-based approach to determine what safety measures should
    be considered. Facilities with a storage capacity <100 t are covered by ISO 20023.
    Generally, for end-user facilities with a storage capacity of <1 000 t, ISO 20023
    could also be applicable if storage principle and facility complexity is in-line
    with the objectives of ISO 20023. This document covers the handling and storage
    process of pellets in the following applications: — at a pellet production plant
    from the outlet of the cooler unit until loaded for transportation; — at a commercial
    distributor from the receiving station until loaded for transportation; and —
    at an industrial end-user from the receiving station until fed into the fuel preparation
    or combustion process. Although unloading and loading of e.g. vessels, trains
    or trucks are included in the operational envelops defined above, the safety aspect
    of the transportation itself is beyond the scope of this document. This document
    also gives specific guidance on detection and suppression systems and preparatory
    measures to enable safe and efficient firefighting operations. Guidance on the
    management of fire and explosion incidents is also specified.'
