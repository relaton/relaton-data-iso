abstract:
- language: en
  script: Latn
  content: This document specifies the criteria for controlgear and switchgear for
    generating sets with reciprocating internal combustion engines. This document
    applies to alternating current (a.c.) generating sets driven by reciprocating
    internal combustion (RIC) engines for land and marine use excluding generating
    sets used on aircraft or to propel land vehicles and locomotives. For some specific
    applications (e.g. essential hospital supplies and high-rise buildings), supplementary
    requirements can be necessary. The provisions of this document serve as a basis
    for establishing any supplementary requirements. For generating sets driven by
    other prime movers (e.g. steam engines), this document serves as a basis for establishing
    requirements.
