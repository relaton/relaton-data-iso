abstract:
- language: en
  script: Latn
  content: ISO 6508-1:2016 specifies the method for Rockwell regular and Rockwell
    superficial hardness tests for scales A, B, C, D, E, F, G, H, K, 15N, 30N, 45N,
    15T, 30T, and 45T for metallic materials and is applicable to stationary and portable
    hardness testing machines. For specific materials and/or products, other specific
    International Standards apply (for instance, ISO 3738‑1 and ISO 4498).
