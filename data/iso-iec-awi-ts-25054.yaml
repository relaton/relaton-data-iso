abstract:
- language: en
  script: Latn
  content: 'This document specifies the general requirements for high-throughput sequencing
    (HTS) genotyping systems. It covers: a) The technical procedures for the HTS genotyping
    system, including the workflow and data processing stages. b) Functional requirements
    and performance requirements for the HTS. c) Methods for accuracy testing and
    evaluation using standard samples. The document provides requirements for the
    design, development, testing, and application of high-throughput sequencing genotyping
    systems, ensuring accurate and reliable genotyping results.'
