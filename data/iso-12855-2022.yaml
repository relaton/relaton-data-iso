abstract:
- language: en
  script: Latn
  content: 'This document specifies: —    the interfaces between electronic fee collection
    (EFC) back-office systems for vehicle-related transport services, e.g. road user
    charging, parking and access control; —    an exchange of information between
    the back end system of the two roles of service provision and toll charging, e.g.:
    —    charging-related data (toll declarations, billing details), —    administrative
    data, and —    confirmation data; —    transfer mechanisms and supporting functions;
    —    information objects, data syntax and semantics. This document is applicable
    for any vehicle-related toll service and any technology used for charging. The
    data types and associated coding related to the data elements described in Clause 6
    are defined in Annex A, using the abstract syntax notation one (ASN.1) according
    to ISO/IEC 8824‑1. This document specifies basic protocol mechanisms over which
    implementations can specify and perform complex transfers (transactions). This
    document does not specify, amongst others: —    any communication between toll
    charger (TC) or toll service provider (TSP) with any other involved party; —   
    any communication between elements of the TC and the TSP that is not part of the
    back-office communication; —    interfaces for EFC systems for public transport;
    —    any complex transfers (transactions), i.e. sequences of inter-related application
    data units (ADUs) that can possibly involve several application protocol data
    unit (APDU) exchanges; —    processes regarding payments and exchanges of fiscal,
    commercial or legal accounting documents; and —    definitions of service communication
    channels, protocols and service primitives to transfer the APDUs.'
