abstract:
- language: en
  script: Latn
  content: This document defines important terms which comprehensively covers concepts
    in the fields of the quality requirements, engineering, evaluation, and management
    for systems, software, data, and IT services in general. The terms are used in
    the documents in the Systems and Software Quality Requirements and Evaluation
    (SQuaRE) family. It does not include terms related to qualities outside the scope,
    e.g. process quality, and qualities specialized from the scope, e.g. AI quality.
