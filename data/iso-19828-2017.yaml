abstract:
- language: en
  script: Latn
  content: ISO 19828:2017 specifies the requirements for visual inspection of welds
    in metallic materials and requirements for qualification and certification of
    personnel for visual weld inspection. ISO 19828:2017 is also applicable to the
    visual inspection of the joint prior to or between welding sequences, and of brazed
    joints. In this case, the contents of theoretical and practical training will
    need to be adapted accordingly.
