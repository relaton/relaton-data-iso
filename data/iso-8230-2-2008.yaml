abstract:
- language: en
  script: Latn
  content: 'ISO 8230-2:2008 specifies safety requirements for dry-cleaning machines
    that exclusively use perchloroethylene (or “perc”) as their cleaning medium. It
    is applicable to such dry-cleaning machines, within the scope of ISO 8230-1, when
    they are used as intended and under conditions of misuse that are reasonably foreseeable
    by the manufacturer. ISO 8230-2:2008, in conjunction with ISO 8230-1, deals with
    all significant hazards, significant hazardous situations and significant hazardous
    events that have been identified as being significant to the types of machines
    covered by ISO 8230-2:2008 and which require specific action by the designer or
    manufacturer to eliminate or reduce the risk. It deals with the following significant
    hazards specific to the use of perc, which can lead to the inhalation of unhealthy
    vapours, to perc contact with the skin (including of the feet) or eyes of the
    machine operator and those of other personnel and members of the public, as well
    as to water and ground contamination: perc emission to the workroom, seepage into
    the ground and sewer during operation and maintenance of the water separator;
    perc emission resulting from operation, cleaning and maintenance of the distilling
    installation.'
