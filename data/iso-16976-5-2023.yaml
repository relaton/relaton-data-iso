abstract:
- language: en
  script: Latn
  content: 'This document is one part of a series of International Standards that
    provide information on factors related to human anthropometry, physiology, ergonomics
    and performance for the preparation of standards for design, testing and use of
    respiratory protective devices. This document contains information related to
    thermal effects of respiratory protective devices on the human body. In particular
    information is given for: —    temperatures of surfaces associated with discomfort
    sensation and harmful effects on human tissues; —    thermal effects of breathing
    gas temperatures on lung airways and tissues; —    effects of breathing gas temperature
    and humidity on respiratory heat exchange; —    effects of respiratory protective
    devices on overall body heat exchange. The information represents data for adult
    healthy men and women in the age 20 years to 60 years.'
