abstract:
- language: en
  script: Latn
  content: This document specifies a method for measuring the quantity of oil separated
    from lubricating grease in the test conditions. It can be used to predict the
    behaviour of greases on storage in pails and drums. This method is not applicable
    to very soft greases that, during the test, flow unchanged through the sieve.
