abstract:
- language: en
  script: Latn
  content: This document specifies operational requirements for static vacuum insulated
    vessels designed for a maximum allowable pressure of more than 50 kPa (0,5 bar).
    It can also be used as a guideline for vessels designed for a maximum allowable
    pressure of less than 50 kPa (0,5 bar). This document applies to vessels designed
    for cryogenic fluids specified in ISO 21009-1. Static cryogenic vessels are often
    partly equipped by the manufacturer, but can be installed or re- installed by
    another party, such as the operator, user or owner. NOTE 1        For the installation
    of these vessels, additional requirements can apply. NOTE 2        Some requirements
    of this document can be covered by local regulations, e.g. safety distances, occupational
    safety and health. NOTE 3        Additional requirements can apply to the operation
    of large scale and field-fabricated vessels.
