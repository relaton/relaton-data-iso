abstract:
- language: en
  script: Latn
  content: ISO 20108:2017 sets out requirements for the quality and transmission of
    sound and image input to interpreters and specifies the characteristics of the
    audio and video signals. The components of typical interpreting systems are specified
    in ISO 20109. Together with either permanent (see ISO 2603) or mobile (see ISO
    4043) booths, these interpreting systems form the interpreters' working environment.
    In addition to setting out the requirements for on-site interpreting, where participants
    (speakers and members of the audience) and interpreters are at the same location,
    ISO 20108:2017 specifies requirements for different varieties of distance interpreting
    situations in which the interpreters are not at the same location as one or more
    of the conference participants. ISO 20108:2017 also addresses the work of manufacturers
    and providers of simultaneous interpreting equipment and technical staff. In conjunction
    with either ISO 2603 or ISO 4043, ISO 20108:2017 and ISO 20109 provide the relevant
    requirements both for the quality and transmission of sound and image provided
    to interpreters and for the equipment needed in the booths, the conference room
    and the distant site(s).
