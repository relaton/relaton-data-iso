abstract:
- language: en
  script: Latn
  content: Cancels and replaces the first edition (1985). Specifies a method of measuring
    the tensile strength, stretch at break and tensile energy absorption of paper
    and board using a test instrument operating at a constant rate of elongation.
    Also specifies methods for calculating the tensile index, the tensile energy absorption
    index and the modulus of elasticity. Applies to all papers and boards, including
    papers with a high stretch at break if the results are within the capacity of
    the test instrument. Also applies to the components of corrugated board but not,
    however, to corrugated board itself.
