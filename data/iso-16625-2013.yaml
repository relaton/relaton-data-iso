abstract:
- language: en
  script: Latn
  content: ISO 16625:2013 specifies the minimum practical design factors, Zp, for
    the various classifications of mechanism, rope types, rope duties and types of
    spooling and demonstrates how these are used in the determination of the minimum
    breaking force of the wire rope. It specifies the selection factors for drums
    and sheaves for the various classifications of mechanisms, rope types and rope
    duties and how these are used in the determination of the minimum practical diameters
    of drums and sheaves that work in association with the selected wire rope.
