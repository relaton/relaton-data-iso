abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and test methods for the physical
    properties of powered toothbrushes in order to promote the safety of these products
    for their intended use. There are different technologies of powered toothbrushes.
    Common features of those powered toothbrushes to which this document applies are:
    — a battery; — a motor; — a mechanical or magnetic drive system; — a moving brush
    head with tufted filaments. Powered toothbrushes can have a moving brush head
    with different motions (e.g. oscillating-rotating, side-by-side), frequencies
    and velocities. The requirements listed in this document apply to all types of
    powered toothbrushes. However, there is a possibility that some requirements are
    not applicable for all types, for example brush head plate retention can only
    be applied if the brush has a head portion that might get detached from the brush
    shaft. This document is not applicable to other types of powered oral hygiene
    devices (such as powered interdental brushes) or manual toothbrushes.'
