abstract:
- language: en
  script: Latn
  content: ISO 6469-3:2011 specifies requirements for the electric propulsion systems
    and conductively connected auxiliary electric systems, if any, of electrically
    propelled road vehicles for the protection of persons inside and outside the vehicle
    against electric shock. ISO 6469-3:2011 does not apply to motorcycles and vehicles
    not primarily intended as road vehicles, such as material handling trucks or forklifts.
    ISO 6469-3:2011 applies only to on-board electric circuits with maximum working
    voltages according to voltage class B. ISO 6469-3:2011 does not provide comprehensive
    safety information for manufacturing, maintenance and repair personnel.
