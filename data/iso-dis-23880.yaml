abstract:
- language: en
  script: Latn
  content: 'This document defines individual concepts that together provide a framework
    for a vocabulary common to different stakeholders with interests in municipal
    wastewater sludge recovery, recycling, treatment and disposal. It is intended
    to facilitate common understanding and communication on undertaking such activities.
    The following are within the scope of this document: definition of a vocabulary
    common to the different stakeholders; and definition of key elements and characteristics
    of municipal wastewater sludge recovery, recycling, treatment and disposal activities'
