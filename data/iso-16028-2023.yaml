abstract:
- language: en
  script: Latn
  content: This document specifies the interface dimensions for interchangeability
    and specifies the performance requirements for hydraulic quick-action couplings,
    flush-face type, for use at pressures of 10 MPa (100 bar) to 31,5 MPa (315 bar),
    depending upon the coupling size. Couplings in accordance with this document are
    not designed to connect or disconnect under pressure. Couplings in accordance
    with this document provide for automatic sealing of the fluid pressure on the
    upstream side and on the downstream side when the coupling is disconnected.
