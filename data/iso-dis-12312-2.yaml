abstract:
- language: en
  script: Latn
  content: 'ISO 12312-2:2015 applies to all afocal (plano power) products intended
    for direct observation of the sun, such as solar eclipse viewing. ISO 12312-2:2015
    does not apply to the following: a) afocal (plano power) sunglasses and clip-ons
    for general use intended for protection against solar radiation; b) eyewear for
    protection against radiation from artificial light sources, such as those used
    in solaria; c) eye protectors specifically intended for sports (e.g. ski goggles
    or other types); d) sunglasses that have been medically prescribed for attenuating
    solar radiation; e) prescription sunglass lenses.'
