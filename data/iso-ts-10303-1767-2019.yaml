abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1767:2019 specifies the application module for Composite
    constituent shape. The following are within the scope of ISO/TS 10303-1767:2019:
    definition of the shape of a ply; representation of the shape of composite constituents;
    items within the scope of application module Advanced boundary representation,
    ISO/TS 10303-1514; items within the scope of application module Construction geometry,
    ISO/TS 10303-1131; items within the scope of application module Constructive solid
    geometry 3d, ISO/TS 10303-1068; items within the scope of application module Curve
    swept solid, ISO/TS 10303-1659; items within the scope of application module Edge
    based wireframe, ISO/TS 10303-1501; items within the scope of application module
    Elementary boundary representation, ISO/TS 10303-1329; items within the scope
    of application module Faceted boundary representation, ISO/TS 10303-1512; items
    within the scope of application module Geometrically bounded surface, ISO/TS 10303-1507;
    items within the scope of application module Geometrically bounded wireframe,
    ISO/TS 10303-1510; items within the scope of application module Manifold surface,
    ISO/TS 10303-1509; items within the scope of application module Shell based wireframe,
    ISO/TS 10303-1502; items within the scope of application module Value with unit
    extension, ISO/TS 10303-1753.'
