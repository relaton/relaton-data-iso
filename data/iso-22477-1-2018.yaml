abstract:
- language: en
  script: Latn
  content: 'This document establishes the specifications for the execution of static
    pile load tests in which a single pile is subjected to an axial static load in
    compression in order to define its load-displacement behaviour. This document
    is applicable to vertical piles as well as raking piles. All types of piles are
    covered by this document. The tests considered in this document are limited to
    maintained load tests. Pile load tests with constant penetration rate and cyclic
    load tests are not covered by this document. NOTE This document is intended to
    be used in conjunction with EN 1997-1. EN 1997-1 provides numerical values of
    partial factors for limit states and of correlation factors to derive characteristic
    values from static pile load tests to be taken into account in design. This document
    provides specifications for the execution of static axial pile load tests: a)
    checking that a pile will behave as designed; b) measuring the resistance of a
    pile.'
