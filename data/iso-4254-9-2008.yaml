abstract:
- language: en
  script: Latn
  content: ISO 4254-9:2008, used together with ISO 4254-1, specifies the safety requirements,
    and their verification for design and construction, of mounted, semi-mounted,
    trailed or self-propelled seed drills, including the seeding function of combined
    seed and fertilizer drills, used in agriculture and horticulture. In addition,
    it specifies the type of information on safe working practices (including residual
    risks) to be provided by the manufacturer. When requirements of ISO 4254-9:2008
    are different from those which are stated in ISO 4254-1 the requirements of ISO
    4254-9:2008 take precedence over the requirements of ISO 4254-1. ISO 4254-9:2008
    deals with all the significant hazards (as listed in Annex A), hazardous situations
    and events relevant to seed drills, used as intended and under the conditions
    foreseen by the manufacturer, excepting the hazards arising from external influences
    on electrical equipment, failure of energy supply, failure or malfunction of the
    control system, break-up of parts rotating at high speed, equipment for loading
    seeds (and fertilizer). ISO 4254-9:2008 is not applicable to seed drills with
    integrated and inseparable powered soil-working tools. It is not applicable to
    environmental hazards or electromagnetic compatibility; neither is it applicable
    to hazards related to maintenance or repairs carried out by professional service
    personnel. It is not applicable to machines which are manufactured before the
    date of its publication.
