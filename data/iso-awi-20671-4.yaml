abstract:
- language: en
  script: Latn
  content: This document specifies the process of brand sustainability reporting,
    which includes general requirements, purpose, framework of brand sustainability
    reporting, methods and suggested usage based on the 2030 Agenda for Sustainable
    Development, adopted by all United Nations Member States in 2015 which provides
    a shared blueprint for peace and prosperity for people and the planet, now and
    into the future. Furthermore, the reporting of companies' sustainability performance
    is a priority for the EU CSRD. Information on a wide range of subjects, such as
    the effects on the environment, social and labour affairs, human rights, and anti-corruption
    and bribery issues, must be disclosed. This guarantees thorough and open reporting,
    which aids investors in evaluating and contrasting a company's sustainability
    performance more effectively. Brands can improve transparency and communicate
    sustainability information by using ESG and sustainability reporting standards.
    In order to obtain an understanding of the sustainability of brands, their business
    models, and their supply chains, risks and company impacts related to brand value
    should be addressed. Many of the effects of the brand on people, the environment,
    and the economy are included in this data (for investors to use, for example).
    Additionally, it is important to be transparent about a brand's role in sustainable
    development in order to comprehend the wider effects that it has on society, the
    economy, and the environment as well as how it contributes to the Sustainable
    Development Goals (SDGs) of the UN. Brands play an important role and are the
    drivers of this development and are supposed to be leaders in this movement. The
    implementation of brand sustainability reporting can create strategic and financial
    advantages for an organization and supports brand value growth.
