abstract:
- language: en
  script: Latn
  content: This document specifies, with reference to ISO 230‑1, the geometric tests
    on surface type broaching machines with vertical Z-axis providing the main cutting
    motion. It also specifies the applicable tolerances corresponding to the tests
    mentioned above for normal-accuracy vertical surface type broaching machines.
    This document explains different concepts or configurations and common features
    of vertical surface type broaching machines. It also provides related terminology
    and designation of axes. This document deals only with the verification of the
    accuracy of the broaching machine. It does not apply to the operational testing
    of the broaching machine (e.g. vibration, abnormal noise, stick-slip motion of
    components), nor to broaching machine characteristics (e.g. speeds, feeds) as
    such checks are generally carried out before testing the accuracy.
