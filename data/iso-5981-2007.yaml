abstract:
- language: en
  script: Latn
  content: ISO 5981:2007 specifies two methods of evaluating the resistance to combined
    shear flexing and rubbing of rubber- or plastics-coated fabrics. Rubbing is either
    forced by application of a pressure foot (method A), or is caused by simple contact
    between the faces of the test pieces (method B). Method B (without application
    of the pressure foot) is preferred in all cases where the foot would damage the
    test piece through an abrasive effect where this is not required, e.g. materials
    with sticky surfaces, light coatings such as polyurethanes on rough surfaces.
    The test may be carried out on products as delivered or after pre-treatments such
    as wetting or accelerated ageing. NOTE The results obtained using method A and
    method B cannot be compared as there is no correlation between the two methods.
