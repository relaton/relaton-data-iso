abstract:
- language: en
  script: Latn
  content: ISO 21527-2:2008 specifies a horizontal method for the enumeration of viable
    osmophilic yeasts and xerophilic moulds in products intended for human consumption
    or feeding of animals, having a water activity less than or equal to 0,95 (dry
    fruits, cakes, jams, dried meat, salted fish, grains, cereals and cereals products,
    flours, nuts, spices and condiments, etc.), by means of the colony count technique
    at (25 ± 1) °C. ISO 21527-2:2008 does not apply to dehydrated products with water
    activity less than or equal to 0,60 (dehydrated cereals, oleaginous, spices, leguminous
    plants, seeds, powders for instant drinks, dry products for domestic animals,
    etc.) and does not allow the enumeration of mould spores. Neither the identification
    of fungal flora nor the examination of foods for mycotoxins lie within the scope
    of ISO 21527-2:2008. The method specified in ISO 21527-2:2008 is not suitable
    for enumeration of halophilic xerophilic fungi (i.e. Polypaecilum pisce, Basipetospora
    halophila) found in dried fish.
