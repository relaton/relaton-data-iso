abstract:
- language: en
  script: Latn
  content: ISO/TS 13477:2013 provides guidance for assessing the use of fire zone
    models for calculating gas temperature and concentrations and smoke layer position
    due to fire within an enclosure. It contains general guidance to be read in conjunction
    with specific model documentation provided by the model developers. It is not
    a basis for justifying the use of any particular model. It is important that users
    of fire zone models understand the theoretical basis of a model and are capable
    of assessing the accuracy and validity of the results. Zone models can also include
    additional sub-models for predicting related phenomena such as sprinkler, thermal
    or smoke detector activation, mechanical ventilation, glass fracture or flame
    spread. ISO/TS 13477:2013 is not intended as a basis for regulation.
