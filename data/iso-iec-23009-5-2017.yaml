abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 23009-5:2017 defines the following: - the functional SAND architecture
    which identifies the SAND network elements and the nature of SAND messages exchanged
    among them; - the semantics of SAND messages exchanged between the network elements
    present in the SAND architecture; - an encoding scheme for the SAND messages;
    - the SAND message delivery protocol.'
