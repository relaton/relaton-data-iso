abstract:
- language: en
  script: Latn
  content: ISO 748:2007 specifies methods for determining the velocity and cross‑sectional
    area of water flowing in open channels without ice cover, and for computing the
    discharge therefrom. ISO 748:2007 covers methods of employing current‑meters or
    floats to measure the velocities. It deals only with single measurements of the
    discharge; the continuous recording of discharges over a period of time is covered
    in ISO 1100-1 and ISO 1100-2.
