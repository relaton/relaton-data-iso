abstract:
- language: en
  script: Latn
  content: 'This document describes an analytical procedure for the determination
    of trace elements in Li composite oxides for Li-ion battery (LiB). These are in
    particular the elements: aluminium (Al), barium (Ba), calcium (Ca), copper (Cu),
    iron (Fe), lead (Pb), magnesium (Mg), molybdenum (Mo), phosphorus (P), sodium
    (Na), strontium (Sr), titanium (Ti), zinc (Zn), zirconium (Zr) in Li composite
    oxides. The determination is performed by optical emission spectrometry with inductively
    coupled plasma (ICP-OES).'
