abstract:
- language: en
  script: Latn
  content: 'This document specifies the designation system for technical products
    and technical project documentation. This document specifies the general structure
    and content of the designation sets required for the whole cycle of rolling stock.
    This document applies to railway rolling stock. The designation depends on the
    aspect used individually or in designation set combinations, for example: - function
    breakdown structure (FBS); - system breakdown structure (SBS); - product breakdown
    structure (PBS); - installation site/location.'
