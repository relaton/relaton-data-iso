abstract:
- language: en
  script: Latn
  content: ISO 18278-1:2015 specifies procedures for assessing the generic weldability
    for resistance welding of uncoated and coated metals. It is assumed for this and
    other linked standards that their application is entrusted to appropriately trained,
    skilled, and experienced personnel. For the quality of welded structures, the
    relevant part of ISO 14554 is applicable. The specification of procedures is to
    follow guidelines as in ISO 15609‑5. The purpose of the tests are to a) compare
    the metallurgical weldability of different metals, b) assess the weldability of
    differing component designs, e.g. dimensional configuration, stack-up, projection
    geometry, etc., c) investigate the effect of changes in welding parameters such
    as welding current, weld time, electrode force or complex welding schedules including
    pulse welding, current stepping etc. on weldability, and/or d) compare the performance
    of resistance welding equipment. Precise details of the test procedure to be used
    will depend on which aspect of items a) to d) will be evaluated relative to the
    welding result obtained.
