abstract:
- language: en
  script: Latn
  content: ISO 4049:2009 specifies requirements for dental polymer-based restorative
    materials supplied in a form suitable for mechanical mixing, hand-mixing, or intra-oral
    and extra-oral external energy activation, and intended for use primarily for
    the direct or indirect restoration of cavities in the teeth and for luting. The
    polymer-based luting materials covered by ISO 4049:2009 are intended for use in
    the cementation or fixation of restorations and appliances such as inlays, onlays,
    veneers, crowns and bridges. This International Standard does not cover those
    polymer-based luting materials that have an adhesive component within the structure
    of the material.
