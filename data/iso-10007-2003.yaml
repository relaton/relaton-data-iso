abstract:
- language: en
  script: Latn
  content: ISO 10007:2003 gives guidance on the use of configuration management within
    an organization. It is applicable to the support of products from concept to disposal.
    It first outlines the responsibilities and authorities before describing the configuration
    management process that includes configuration management planning, configuration
    identification, change control, configuration status accounting and configuration
    audit. Since ISO 10007:2003 is a guidance document, it is not intended to be used
    for certification/registration purposes.
