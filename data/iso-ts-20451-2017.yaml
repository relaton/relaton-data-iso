abstract:
- language: en
  script: Latn
  content: ISO/TS 20451:2017 defines the concepts required to associate pharmaceutical
    products with an appropriate set of PhPID(s) in accordance with ISO 11616. Pharmaceutical
    identifiers and elements are to represent pharmaceutical products as represented
    in a Medicinal Product as indicated by a Medicines Regulatory Authority. The suite
    of ISO IDMP standards can be applied to off-label usage of Medicinal Products,
    but is currently outside of the scope of ISO/TS 20451:2017. Reference to ISO 11238,
    ISO 11239, ISO 11240 and ISO 11615 and HL7 messaging standards, HL7 Reference
    Information Model (RIM), HL7 V3 Common Product Model (CPM) and HL7 V3 Structured
    Product Labelling (SPL) can be applied for pharmaceutical product information
    in the context of ISO/TS 20451:2017.
