abstract:
- language: en
  script: Latn
  content: 'ISO 21872-1:2017 specifies a horizontal method for the detection of enteropathogenic
    Vibrio spp., which causes human illness in or via the intestinal tract. The species
    detectable by the methods specified include Vibrio parahaemolyticus, Vibrio cholerae
    and Vibrio vulnificus. ISO 21872-1:2017 is applicable to the following: - products
    intended for human consumption and the feeding of animals; - environmental samples
    in the area of food production and food handling.'
