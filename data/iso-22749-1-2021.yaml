abstract:
- language: en
  script: Latn
  content: 'This document applies to elastomer-mechanical parts designed to be fitted
    on railway vehicles and similar vehicles running on dedicated tracks with permanent
    guide systems, whatever the type of rail and the running surface. Typical applications
    of the elastomer-mechanical parts include: —    vehicle suspension systems; —   
    equipment mounting systems; —    joints (e.g. end-mountings of dampers, rubber-based
    bearings, elastomer-mechanical parts used on mechanical couplings); —    limit
    stops. These parts can be: —    made entirely of elastomer, operating on their
    own or in combination with other elastic parts; —    made up of elastomer and
    other materials, adherent together or not. This document specifies characteristics
    that rubber and rubber to metal parts are to achieve, together with applicable
    inspection and test methods to be carried out for verification. This document
    does not apply to: —    rubber diaphragms for pneumatic suspension springs; —   
    elastic parts of buffing and drawgear springs; —    diaphragms, bellows and seals;
    —    hoses and tubings; —    transmission belts.'
