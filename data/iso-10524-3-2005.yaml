abstract:
- language: en
  script: Latn
  content: 'ISO 10524-3:2005 applies to pressure regulators integrated with cylinder
    valves intended for the administration of medical gases in the treatment, management,
    diagnostic evaluation and care of patients for use with the following medical
    gases: oxygen; nitrous oxide; air for breathing; helium; carbon dioxide; xenon;
    specified mixtures of the gases listed above; air for driving surgical tools;
    nitrogen for driving surgical tools. These pressure regulators integrated with
    cylinder valves are intended to be fitted to cylinders with nominal filling pressures
    up to 25 000 kPa at 15 °C and can be provided with devices that control and measure
    the flow of the medical gas delivered.'
