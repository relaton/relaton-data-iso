abstract:
- language: en
  script: Latn
  content: This document specifies procedures for the removal of corrosion products
    formed on metal and alloy corrosion test specimens during their exposure in corrosive
    environments. For the purpose of this document, the term "metals" refers to pure
    metals and alloys. The specified procedures are designed to remove all corrosion
    products without significant removal of base metal. This allows an accurate determination
    of the mass loss of the metal, which occurred during exposure to the corrosive
    environment. In some cases, these procedures are also applicable to metal coatings,
    providing the possible effects from the substrate are considered.
