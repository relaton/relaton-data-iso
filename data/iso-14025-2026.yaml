abstract:
- language: en
  script: Latn
  content: This document specifies principles and requirements and gives guidance
    on environmental product declaration (EPD) programmes and their associated EPDs.
    This document specifies the use of ISO 14040 and ISO 14044 on life cycle assessment
    (LCA) in the development of EPDs. This document is applicable to EPD programmes
    and their associated EPDs that are intended to address the potential environmental
    impacts and environmental aspects of products, and which can also include related
    social and economic aspects in support of sustainable development. NOTE 1       
    This document does not deal with social or economic LCA indicators. NOTE 2       
    Related social and economic aspects of the products can be reported as additional
    sustainability-related information, where relevant and available. This document
    provides requirements and guidance for the communication of the potential environmental
    impacts and environmental aspects of products to the intended audience of the
    EPD. This document does not apply to sector-specific provisions, which are dealt
    with in other ISO documents. It is intended that sector-specific provisions in
    other ISO documents related to EPDs are based on and use the principles, requirements
    and guidance of this document.
