abstract:
- language: en
  script: Latn
  content: This International Standard gives a method of establishing a flexible life
    cycle model and gives guidance on efficient and easy-to-understand handling technical
    documents during the product life cycle. The product life cycle takes different
    company-specific requirements into account, in accordance with project management
    techniques. For general use in connection with non-company-specific requirements,
    procedures, processes and products, it may be necessary to establish a standardized
    life-cycle model with defined phases. This International Standard is intended
    for use in companies, bodies of authority and other organizations who deal with
    manufactured products, with the compilation and use of technical documents during
    the product life cycle. It is not applicable either to services or software. This
    International Standard is intended to be an aid in controlling and coordinating
    documents, in accordance with ISO 9001, ISO 9002, and ISO 9003.
