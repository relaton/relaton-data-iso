abstract:
- language: en
  script: Latn
  content: This proposed new standard specifies the monitoring methods, measurement
    requirements, calculation procedures, data quality management, and reporting requirements
    for methane emissions in coal mining areas. It covers technical approaches including
    fixed-site monitoring, drone-based mobile monitoring, and ground-based mobile
    monitoring. Emission flux calculations are performed using methods such as eddy
    covariance and mass balance, and methane emission intensity is ultimately determined
    by integrating these calculations with operational activity data from coal mining
    enterprises.
