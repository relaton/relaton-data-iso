abstract:
- language: en
  script: Latn
  content: This document provides the concept of data templates developed to enable
    machine interpretability based on a standardized data structure, carrying the
    alphanumerical information for any object used in the life cycle of assets. This
    document provides a description of how data templates are implemented following
    ISO 12006-3. This document provides a methodology to create and maintain data
    templates in data dictionary. This document provides guidance for linking between
    data templates and classification systems within data dictionaries based on ISO 12006-3.
    This document provides an XML Schema Definition (XSD) representing an implementation
    of the ISO 23387 and ISO 12006-3 data models. It is not within the scope of this
    document to provide the content of any data templates.
