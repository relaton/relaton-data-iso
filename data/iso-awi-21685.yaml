abstract:
- language: en
  script: Latn
  content: This document specifies the method for detection of norovirus in environmental
    water samples including groundwater, rivers, lakes, etc. This consists of concentration
    through a positively charged filter, elution, concentration by organic flocculation,
    ribonucleic acid (RNA) extraction RT-PCR, and confirmation of PCR products. This
    document includes quality control methods for the process from RT-PCR to the confirmation
    of PCR products. Norovirus is a non-enveloped virus that belongs to the Caliciviridae
    family and has single stranded ribonucleic acid (RNA) as its genome. It is typically
    transmitted through person-to-person contact or through contaminated water or
    food, following the typical fecal-oral route. It causes gastrointestinal diseases
    such as food poisoning. Symptoms include abdominal pain, diarrhea, fever, nausea,
    and vomiting, and in severe cases, children or the elderly may die from dehydration.
    Therefore, monitoring norovirus in water is very important for investigating contamination
    status and establishing appropriate response plans for human health. Norovirus
    cannot be cultured. Therefore, the reverse transcription polymerase chain reaction
    (RT-PCR) is used worldwide.
