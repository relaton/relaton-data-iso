abstract:
- language: en
  script: Latn
  content: This document specifies requirements and procedures for the preparation of low-concentration sodium chloride (NaCl)-adjusted water intended for use as feed water or a test medium prior to the generation, sampling, and evaluation of ultrafine bubbles (UFBs). The document is applicable to research, laboratory, and industrial activities where low-concentration NaCl is added to water to control electrical conductivity and to provide reproducible conditions for UFB generation and evaluation. It covers NaCl concentrations from 0.001 % to 0.1 % by mass fraction, including requirements for water quality, sodium chloride purity, preparation procedures, dissolution at room temperature, temperature control, electrical conductivity verification, particle-background suitability, storage conditions, and record keeping. This document does not specify methods for measuring UFB size, number concentration, or other UFB characteristics, nor does it specify the design, selection, or operation of UFB generators or analytical instruments. The generation, sampling, and characterization of UFBs are addressed in other International Standards related to fine bubble technology.
