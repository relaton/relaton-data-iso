abstract:
- language: en
  script: Latn
  content: 'This document is applicable to electrical systems of agricultural machinery and tractors that are used in agricultural and forestry applications. “Agricultural machinery” includes: — self-propelled ride-on machines, — interchangeable towed machinery, — semi-mounted implements, and — mounted implements. Agricultural machinery and tractors are hereafter mentioned as “mobile machinery”. This document applies to all functions of mobile machinery (i.e. manual non-automated, partially automated, semi-autonomous and autonomous). Electrical systems include: — on-board power supply (e.g. power train, REESS / batteries, fuel-cells, generators, auxiliary drives), — off-board power supply (e.g. power interface between agricultural and forestry tractor or self-propelled ride-on machine and mounted or semi-mounted implements and/or interchangeable towed machinery) — on-board and off-board power consumers (e.g. motor drives, inverters/converters, thermal conversion, compressors, actuators). These requirements apply to systems of the VC-B2 voltage class (working voltages above 75 V DC up to and including 1500 V DC and above 50 V AC up to and including 1000 V AC). NOTE A table giving the different voltage classes is provided in 4.1. This document deals with significant hazards, hazardous situations, and events, as listed in Annex A, relevant to this mobile machinery when used as intended and under the conditions of misuse foreseeable by the manufacturer during normal operation and service. This document is not applicable to the following: — externally powered VC-B2 components and systems, which are neither mounted or semi-mounted implements nor interchangeable towed machinery (e.g. welding machines, water pumps); — specific design elements of external interfaces; — stationary electrical generators; — stationary and off-board charging. This document is not applicable to mobile machinery which are manufactured before the date of its publication. This document does not provide specific isolation resistance values.'
