abstract:
- language: en
  script: Latn
  content: 'ISO 11209:2012 gives guidelines for the minimum structural scantling of
    lifting appliances for large yachts. It is applicable to the following lifting
    appliances: · cranes; · access gangways (including side ladders); · access gangways
    when used as a lifting appliance. ISO 11209:2012 is not applicable to lifting
    means for life saving appliances, which are covered by recognized rules and/or
    international regulations. ISO 11209:2012 covers mainly the following aspects:
    · service class; · applied loads; · design criteria; · allowable stress; · strength
    check; · elastic stability check; · connections.'
