abstract:
- language: en
  script: Latn
  content: ISO/TR 945-2:2011 deals with the two-dimensional characterisation of graphite
    form and size in cast irons. A standard method for determining graphite form by
    image analysis had not been developed at the time of this report, but several
    methods are in use in the industry. The purpose of ISO/TR 945-2 is to give an
    illustration of what is possible and to suggest ways in which the technique might
    develop in the future. ISO/TR 945-2:2011 does not apply to the graphite distribution
    of grey (lamellar graphite) cast iron as defined in ISO 945-1. ISO/TR 945-2:2011
    describes procedures used to carry out image analysis of graphite form and size
    and provides a method of comparison to the results obtained using visual analysis
    techniques. It does not specify any particular mathematical description of the
    graphite forms but provides a means for comparison.
