abstract:
- language: en
  script: Latn
  content: This document provides guidance for representatives of the paper value
    chain for the design of printed paper products, with a view to deinkability contributing
    to recyclability in support of the circular economy. It describes relevant deinking
    processes, and the deinking performance of printed paper products produced with
    different printing, finishing and converting technologies in those deinking processes.
    It provides a list of relevant quality characteristics of industrial deinked pulps
    and a list of their possible usages based on those characteristics. This document
    does not include guidance for paper-based products which are not intended to be
    deinked.
