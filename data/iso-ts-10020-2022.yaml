abstract:
- language: en
  script: Latn
  content: This document specifies processes that can be used to govern, manage and
    implement organizational change management (OCM) for organizations, projects or
    smaller activities. It comprises generic process descriptions that describe the
    OCM processes. Supporting diagrams describing the processes are also provided.
    This document is applicable, but not limited, to change sponsors, change agents,
    change team members and project managers, particularly those responsible for governing,
    managing and implementing organizational change.
