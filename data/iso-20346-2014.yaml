abstract:
- language: en
  script: Latn
  content: ISO 20346:2014 specifies basic and additional (optional) requirements for
    protective footwear used for general purpose. It includes, for example, mechanical
    risks, slip resistance, thermal risks, ergonomic behaviour. Special risks are
    covered by complementary job-related standards (e.g. footwear for firefighters,
    electrical insulating footwear, protection against chain saw injuries, protection
    against chemicals and molten metal splash, protection for motor cycle riders).
