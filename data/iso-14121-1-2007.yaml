abstract:
- language: en
  script: Latn
  content: ISO 14121-1:2007 establishes general principles intended to be used to
    meet the risk reduction objectives established in ISO 12100-1:2003, Clause 5.
    These principles of risk assessment bring together knowledge and experience of
    the design, use, incidents, accidents and harm related to machinery in order to
    assess the risks posed during the relevant phases of the life cycle of a machine.
    ISO 14121-1:2007 provides guidance on the information that will be required to
    enable risk assessment to be carried out. Procedures are described for identifying
    hazards and estimating and evaluating risk. It also gives guidance on the making
    of decisions relating to the safety of machinery and on the type of documentation
    required to verify the risk assessment carried out. It is not applicable to risks
    posed to domestic animals, property or the environment.
