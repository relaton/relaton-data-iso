abstract:
- language: en
  script: Latn
  content: ISO 15490:2008 specifies the test method for determining the tensile strength
    under uniaxial loading of monolithic fine ceramics and whisker or particulate-reinforced
    ceramic composites at room temperature. This test method, in which parasitic bending
    is minimized, may be used for material development, material comparison, quality
    assurance, characterization and design data generation.
