abstract:
- language: en
  script: Latn
  content: 'The assessment of human exposure to vibration, to both the hand-arm system
    and the whole body, at the workplace relies on the combined evaluation of both
    vibration magnitudes and exposure times. Determining these values can employ various
    instrumentation types and data sources. ISO/TR 19664:2017 provides guidance and
    explanation of concepts used for the following: - measurement processes; - instrumentation
    types; - vibration magnitude source.'
