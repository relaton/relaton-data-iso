abstract:
- language: en
  script: Latn
  content: 'ISO 3302-2:2008 specifies the following geometrical tolerances for moulded
    and extruded solid rubber products, including those with metal inserts: flatness
    tolerance; parallelism tolerance; perpendicularity tolerance; coaxiality tolerance;
    positional tolerance. The tolerances are primarily intended for use with vulcanized
    rubber but may also be suitable for products made of thermoplastic rubbers.'
