abstract:
- language: en
  script: Latn
  content: This document specifies a test method to determine the qualitative and
    quantitative presence of phthalate compounds (see Annex A) in footwear and footwear
    components. NOTE 1 A list of relevant materials potentially containing phthalates
    can be found in ISO/TR 16178:2012, Annex A or in CEN/TR 16417. NOTE 2 This test
    method can also be used to determine phthalates other than those listed in Annex
    A, subject to validation.
