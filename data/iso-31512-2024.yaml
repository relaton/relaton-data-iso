abstract:
- language: en
  script: Latn
  content: This document specifies requirements and guidelines for refrigerated storage
    services and refrigerated transport services for foods, in the business to business
    (B to B) logistics sector in order to ensure that cold chains are properly maintained.
    This document does not apply to logistics services for cosmetics, cigarettes,
    pharmaceutical and medical products, over-the-counter drugs and commercially available
    medicine. This document does not apply to customs operations. This document applies
    to environments where refrigeration must  be created and maintained, and does
    not apply to environments needing to raise storage temperatures.
