abstract:
- language: en
  script: Latn
  content: 'This document applies only to Dimethyl Ether refuelling connectors hereinafter
    referred to as devices, constructed entirely of new, unused parts and materials.
    Dimethyl Ether refuelling connectors consist of the following components, as applicable:
    a) Nozzle (mounted on dispenser side). b) Receptacle (mounted on vehicle). This
    document applies to devices which use Dimethyl Ether as fuel, hereinafter referred
    to in this document as D15 [see 9.1 c)]. This document applies to devices with
    standardised mating components. This document applies to connectors which prevent
    Dimethyl Ether vehicles from being fuelled by fuel station dispensers for other
    gaseous fuels. This document is applicable to: Dimethyl Ether in accordance with
    ISO 16861. NOTE All references to pressures (kPa) throughout this document are
    considered gauge pressures unless otherwise specified.'
