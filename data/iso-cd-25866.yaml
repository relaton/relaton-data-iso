abstract:
- language: en
  script: Latn
  content: 'This document applies to transparent or translucent specimens with solid
    surfaces. NOTE: In practice, various polymeric materials are transparent or translucent
    (scattering light-transmissive), e.g. tinted, with UV-Absorbers or light-diffusing
    massive films or plates, open-pored and close-pored foams, textiles and nonwovens,
    or carpets with translucent pile and absorbing substrate material. Here, only
    solid surfaces are considered in order to neglect the additional effects of moisture
    penetration. The document only refers to homogeneous plastics. For composites
    and coated plastics, other properties may have to be considered. As weathering
    standards are typically written for opaque plastics, this document specifies additional
    items for inclusion in the test report and gives some guidance on handling transparent
    or translucent specimens in weathering or irradiation.'
