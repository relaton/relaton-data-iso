abstract:
- language: en
  script: Latn
  content: ISO 3266:2010 specifies the general characteristics, performance and critical
    dimensions necessary for interchangeability and compatibility with other components,
    of forged steel eyebolts grade 4 for general lifting purposes. These eyebolts
    can be used for axial and inclined loading. ISO 3266:2010 specifies the dimensions
    of the eyes of eyebolts permitting direct connection with shackles of the same
    working load limit as those defined in ISO 2415. These dimensions also allow designs
    with a larger eye which can permit direct connection with sling hooks of similar
    working load limit. ISO 3266:2010 covers all significant hazards, hazardous situations
    and events relevant to eyebolts grade 4. ISO 3266:2010 is applicable to eyebolts
    grade 4 for use in the temperature range of -20 ºC to 200 ºC. ISO 3266:2010 is
    not applicable to eyebolts which are not forged in one piece. ISO 3266:2010 is
    not applicable to forged steel eyebolts grade 4 manufactured before the date of
    its publication as an International Standard.
