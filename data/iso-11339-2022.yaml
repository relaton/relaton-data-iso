abstract:
- language: en
  script: Latn
  content: This document specifies a T‑peel test for the determination of the peel
    resistance of an adhesive by measuring the peeling force of a T‑shaped bonded
    assembly of two flexible adherends. This test procedure does not provide design
    information. NOTE       This method was originally developed for use with metal
    adherends but other, flexible, adherends can also be used.
