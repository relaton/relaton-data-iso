abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for evaluating the long-term reliability of antiviral activity of non-porous nanocoated surfaces, particularly metal particle-based nanocoatings. The reliability of antiviral activity is evaluated by measuring antiviral activity in accordance with ISO 21702 before and after accelerated aging. This document applies to nanocoatings whose antiviral activity is measurable under the test conditions specified in ISO 21702. Photocatalytic systems requiring light activation (e.g. UV-activated TiO2) are excluded from the scope. This document does not address safety or environmental concerns.
