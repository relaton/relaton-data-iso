- language: en
  script: Latn
  content: 'ISO/TS 10303-1245:2004 specifies the application module for Type of person.
    The following are within the scope of ISO/TS 10303-1245:2004: the definition of
    a type of person; the relationships between definitions of a type of person; the
    association of a type of person in a role with an activity or product data; the
    classification of types of person; the specification of required attributes for
