abstract:
- language: en
  script: Latn
  content: This document provides information to prepare training materials and to
    administer training for operators of rough-terrain trucks (herein referred to
    as trucks). It is applicable to trucks, as defined in ISO 10896-1, ISO 10896-2
    and ISO 20297-1. It is applicable to the handling of suspended loads covered in
    ISO 10896-4 and the use of non-integrated personnel work platforms covered in
    ISO 18479-1. This document does not cover authorization or training requirements
    related to a specific worksite (for example, site rules, emergency procedures,
    safety systems of work). NOTE National or local requirements can apply.
