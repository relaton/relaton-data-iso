- language: en
  script: Latn
  content: ISO 11357-7:2015 specifies two methods (isothermal and non-isothermal)
    for studying the crystallization kinetics of partially crystalline polymers using
    differential scanning calorimetry (DSC). It is only applicable to molten polymers.
    NOTE These methods are not suitable if the molecular structure of the polymer
    is modified during the test.
