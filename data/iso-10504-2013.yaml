abstract:
- language: en
  script: Latn
  content: ISO 10504:2013 describes a high-performance liquid chromatographic (HPLC)
    method for measuring the composition of dextrose solutions, glucose syrups, fructose-containing
    syrups, hydrogenated glucose syrups, sorbitol, mannitol and maltitol. The constituents
    are mainly glucose, maltose, maltotriose, fructose, sorbitol, mannitol, maltitol
    and malto-oligosaccharides. The use of a column packed with cation-exchange resin
    is essential.
