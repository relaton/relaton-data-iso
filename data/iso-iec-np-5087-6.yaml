abstract:
- language: en
  script: Latn
  content: 'This document defines an ontology for service level concepts for energy. It specifies the core concepts and properties necessary to support cross-domain data sharing, establishing a shared energy data model that supports interoperability among city services and enables effective management and coordination of energy data across the city. Note: Service level concepts are used to represent data that is shared by a city service with other services and stakeholders in the city. Service level concepts are distinguished by their data being read but not updated by other city services and stakeholders.'
