abstract:
- language: en
  script: Latn
  content: This document defines general information and use cases for providing road
    safety enhancement services to all types of road users with a nomadic device in
    urban localized areas by sharing status or intent messages between nomadic device
    users and conventional ITS stations. The road users in this document include all
    type of road users with nomadic device such as vulnerable road users (VRU) including
    pedestrians, bicyclists, kickboard users, as well as connected automated mobility
    users including conventional vehicles, automated or connected driving system equipped
    vehicles. In addition, this document considers a sensor-equipped roadside ITS
    station with AI-supported road user behaviour detection function to support overall
    road safety enhancement services by sharing status or intents information of all
    type of road users such as VRUs without a nomadic device and road vehicles without
    equipped ITS stations. This document also specifies general information, such
    as category of nomadic device supported road safety service, overall access technology
    in nomadic device, actors, and communication architecture to support use cases.
    This document also defines safety enhancement use cases to enhance overall road
    safety of all types of road users with nomadic device as well as road users without
    nomadic device with a connectivity of sensor-equipped roadside ITS station. The
    use cases are applicable to provide road safety enhancement service in a specific
    urban localized area such as an un-signalized intersection, T-intersection, roundabout,
    low speed zone, school zone, no turn on red zone, weaving area, etc.
