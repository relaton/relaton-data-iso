abstract:
- language: en
  script: Latn
  content: ISO 12620:2009 provides guidelines concerning constraints related to the
    implementation of a Data Category Registry (DCR) applicable to all types of language
    resources, for example, terminological, lexicographical, corpus-based, machine
    translation, etc. It specifies mechanisms for creating, selecting and maintaining
    data categories, as well as an interchange format for representing them.
