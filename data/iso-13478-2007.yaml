abstract:
- language: en
  script: Latn
  content: ISO 13478:2007 specifies a full-scale test (FST) method for determining
    the arrest or propagation of a crack initiated in a thermoplastics pipe at a specified
    temperature and internal pressure. The method is also suitable for the determination
    of defined critical pressure, critical stress and critical temperature parameters.
    It is applicable to the assessment of the performance of thermoplastics pipes
    intended for the supply of gases or liquids. In the latter case, air could also
    be present in the pipe.
