abstract:
- language: en
  script: Latn
  content: ISO 2921:2011 specifies a method for the determination of the temperature-retraction
    characteristics of stretched vulcanized rubber. It does not cover thermoplastic
    rubbers, as many thermoplastic elastomers have a yield point in the range of 5
    % to 20 % elongation. This fact might affect the result when carrying out temperature-retraction
    tests on thermoplastic rubbers, and the results obtained from such tests should
    be analysed with caution.
