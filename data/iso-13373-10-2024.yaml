abstract:
- language: en
  script: Latn
  content: This document gives guidelines and requirements for the procedures to be
    followed when carrying out vibration diagnostics of 2‑ and 4‑pole electrical generators
    of cylindrical pole design with fluid-film bearings. This document does not apply
    to salient pole generators. This document establishes a practical step-by-step
    vibration-based approach to fault diagnosis. The requirements of this document
    should be considered together with those in ISO 13373-4.
