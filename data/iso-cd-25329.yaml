abstract:
- language: en
  script: Latn
  content: This document provides the requirements for factory-made products of polyester
    fibre thermal insulation mat or board products for buildings. It includes determination
    of product characteristics covering procedures for evaluation of performance,
    conformity, marking, labelling and packaging. This document is limited to man-made
    polyester fibre thermal insulation products containing more than 65% (by mass)
    of man-made polyester fibre, with or without facings. The product is used where
    the continuous service temperature of the insulation substrate is bounded by the
    temperature range −40 °C to + 110 °C. Products covered in this document may also
    be used in prefabricated thermal insulation systems and composite panels; the
    performance of systems incorporating these products is not covered. This document
    does not purport to address all the health and safety aspects associated with
    its use. Anyone using this Standard has the responsibility to consult the appropriate
    authorities and to establish health and safety practices, in conjunction with
    any existing applicable regulatory requirements, prior to its use.
