abstract:
- language: en
  script: Latn
  content: This document specifies a test method for determining the flex resistance
    of rubber- or plastics‑coated fabrics in the folded condition. The test method
    is applicable only to products which can be clamped in the test apparatus used
    and to products with which the fold made in the test specimen can be caused to
    move back and forth along the specimen during the test. The appearance of the
    test specimen, after completion of either the flex number (see 3.1) or a specified
    number of flex cycles, is taken as a measure of the flex resistance in the folded
    condition.
