abstract:
- language: en
  script: Latn
  content: ISO 29481-1:2016 specifies - a methodology that links the business processes
    undertaken during the construction of built facilities with the specification
    of information that is required by these processes, and - a way to map and describe
    the information processes across the life cycle of construction works. ISO 29481-1:2016
    is intended to facilitate interoperability between software applications used
    during all stages of the life cycle of construction works, including briefing,
    design, documentation, construction, operation and maintenance, and demolition.
    It promotes digital collaboration between actors in the construction process and
    provides a basis for accurate, reliable, repeatable and high-quality information
    exchange.
