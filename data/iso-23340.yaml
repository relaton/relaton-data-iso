abstract:
- language: en
  script: Latn
  content: This document specifies the functional requirements for rail vehicle windscreens,
    including type testing, routine testing and inspection methods for main line railway
    and urban guided transport systems. This document applies to windscreens made
    of laminated glass, which is the most commonly used material. This document also
    applies to other materials, subject to the performance requirements being satisfied.
    This document is also applicable to railbound machines in running mode (self-propelled
    or hauled). Railbound machines in travelling mode and working mode are outside
    the scope of this document. This document is not applicable to the determination
    of the size, shape, orientation and position of windscreens. This document does
    not specify requirements for the interfaces between the windscreen and the vehicle.
    This document does not address issues relating to installation, structural integrity
    and crashworthiness.
