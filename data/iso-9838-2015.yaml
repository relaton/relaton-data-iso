abstract:
- language: en
  script: Latn
  content: ISO 9838:2015 defines test soles representing - an alpine ski-boot (form
    A) or at least the bottom part of it to be used for testing alpine ski-bindings
    for alpine skiing in accordance with ISO 9462 and ISO 9465, and - a touring ski-boot
    (form T) or at least the bottom part of it to be used for testing touring ski-bindings
    for touring skiing in accordance with ISO 13992 and ISO 9465. NOTE Ski-boots have
    their own International Standards (ISO 5355 and ISO 9523) that allow relatively
    large tolerances in defining the test sole which are generally believed to be
    suitable for on-slope use by skiers, but too large for reproducible laboratory
    measurements.
