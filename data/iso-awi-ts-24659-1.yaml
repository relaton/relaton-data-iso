abstract:
- language: en
  script: Latn
  content: This document specifies clinical knowledge structure of traditional Chinese
    medicine tongue diagnostic information. It describes tongue diagnostic information
    in a fixed structure based on the relationship between the whole and the part
    in the tongue diagnostic knowledge system. It includes structure of the tongue,
    method of tongue observation, clinical description of tongue conditions, confounding
    factors and other information. It is suit for the storage, processing, exchange
    and sharing of tongue diagnostic information.
