abstract:
- language: en
  script: Latn
  content: 'ISO 13365:2011 specifies a test method for the determination of the content
    of the following preservative agents: 2-(thiocyanomethylthio)-benzothiazole (TCMTB);
    4-chloro-3-methylphenol (PCMC); 2-phenylphenol (OPP); 2-octylisothiazol-3(2H)-one
    (OIT); in leather by liquid chromatography. Preservative agents are necessary
    to protect leather from microbiological attack.'
