abstract:
- language: en
  script: Latn
  content: ISO 17734-2:2013 gives general guidance for the sampling and analysis of
    airborne amines and aminoisocyanates in workplace air. It is strongly recommended
    that the determination of amines and aminoisocyanates is made together with the
    determination of isocyanates in air, using DBA as a reagent (see ISO 17734-1).
    The method can be used for simultaneous determinations of amines, such as 4,4'-methylenediphenyldiamine
    (4,4'-MDA), 2,4- and 2,6-toluenediamine (2,4- and 2,6-TDA), and 1,6-hexamethylenediamine
    (1,6-HDA), and compounds containing both isocyanate and amine groups, such as
    4,4'-methylenediphenyl aminoisocyanate (4,4'-MAI), 2,4-, 4,2-, and 2,6-toluene
    aminoisocyanate (2,4-, 4,2-, and 2,6-TAI), and 1,6-hexamethylene aminoisocyanate
    (1,6-HAI). The method is suitable for collecting amines and aminoisocyanates in
    both the gas and particle phases. The instrumental detection limit for the amines
    is about 5 nmol/sample and for the aminoisocyanate, it is about 0,3 nmol/sample.
    For a 15 l air sample, this corresponds to 0,4 ng⋅m?3 for TDA and 0,03 ng⋅m?3
    for TAI.
