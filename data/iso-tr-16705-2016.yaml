abstract:
- language: en
  script: Latn
  content: ISO/TR 16705:2016 describes the necessary steps for contingency table analysis
    and the method to analyse the relation between categorical variables (including
    nominal variables and ordinal variables). It provides examples of contingency
    table analysis. Several illustrations from different fields with different emphasis
    suggest the procedures of contingency table analysis using different software
    applications. In ISO/TR 16705:2016, only two-dimensional contingency tables are
    considered.
