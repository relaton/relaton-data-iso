abstract:
- language: en
  script: Latn
  content: This edition of ISO 10303-238 will extend an integrated model of product
    and process information to support (1) additive manufacturing for metal-based
    powder bed fusion, (2) drill and fastening of aerospace structures, and (3) process
    recommendations for machining a feature using a cutter. The product information
    shall include powder bed process and technology information for additive regions
    and layers. The drill and fill fastening information shall include the ability
    to update the structural assembly model as the process executes. The process recommendation
    information shall include the ability to define how the tool and process can be
    adjusted and the limits that must be met by combinations of parameters for machining
    a feature.
