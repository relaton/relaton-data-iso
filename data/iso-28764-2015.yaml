abstract:
- language: en
  script: Latn
  content: 'ISO 28764:2015 specifies a method for the production of specimens suitable
    for testing vitreous and porcelain enamel coatings. It specifies two different
    specimens: - specimens taken from production articles; - specially produced specimens.
    NOTE Only the specially produced specimens can be used when the loss in mass per
    unit area of the enamel coating is to be determined quantitatively, as specimens
    cut from enamelled articles can reduce the accuracy of the test method.'
