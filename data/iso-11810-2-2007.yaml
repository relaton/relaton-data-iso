abstract:
- language: en
  script: Latn
  content: ISO 11810-2:2007 is applicable to disposable and re-usable, as well as
    woven and non-woven materials used as surgical drapes and/or patient protective
    covers which claim to be laser-resistant. The purpose of ISO 11810-2:2007 is to
    provide a standardized method for testing and classifying surgical drapes and/or
    patient protective covers with respect to laser-induced hazards. An appropriate
    classification system is given. It is not the purpose of ISO 11810-2:2007 to serve
    as a general fire safety specification. ISO 11810-2:2007 is limited to testing
    the secondary ignition of materials that are rated I1 or I2 from ISO 11810-1.
    All materials reflect portions of the beam and it is necessary for the user to
    decide whether specular reflection may be a hazard. This measurement, however,
    is not covered in ISO 11810-2:2007.
