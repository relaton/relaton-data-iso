abstract:
- language: en
  script: Latn
  content: 'This document defines a framework for visualization of product data using
    AI models. It provides structural guidelines and interoperability considerations
    for combining CAD-based product representations, AI-generated visual information
    (e.g., object detection outputs), and AI model packaging (e.g., ONNX). This standard
    outlines how product-related information can be visualized, shared, and reused
    across manufacturing, maintenance, and recycling scenarios, independently of any
    specific product passport or lifecycle management system, while allowing the use
    of secure data exchange mechanisms such as blockchain. The deliverable includes:
    - Terms related to CAD visualization and AI-based object metadata - Structure
    and visualization of product-related data derived from CAD and AI models - Overview
    of AI-based visualization workflows using vision-based and CAD-linked approaches
    - Interoperability methods for data sharing through blockchain or data space bridges'
