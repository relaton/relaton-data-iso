abstract:
- language: en
  script: Latn
  content: This technical specification describes a set of physiological (Part 1)
    and biochemical (Part 2) parameters allowing to measure sublethal effects in higher
    plants exposed to soil pollutants. It is applicable to soils of unknown quality
    e.g. from contaminated sites, amended soils or soils after remediation either
    in situ or laboratory exposure assays. For in situ experiments the areas to compare
    shall be exposed to the same climatic conditions (humidity, temperature, sunlight).
    This part specifies a toolbox of methods for analysing variations in physiological
    parameters and oxidative balance that may be indicative of stress symptoms in
    higher plants, either monocotyledonous and dicotyledonous species.
