abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of reference measurement standards
    of radioactive surface contamination, traceable to national measurement standards,
    for the calibration of surface contamination monitors. This document relates to
    alpha-emitters, beta-emitters, and photon emitters of maximum photon energy not
    greater than 1,5 MeV. It does not describe the procedures involved in the use
    of these reference measurement standards for the calibration of surface contamination
    monitors. Such procedures are specified in IEC 60325[6], IEC 62363[7], and other
    documents. NOTE Since some of the proposed photon standards include filters, the
    photon standards are to be regarded as reference measurement standards of photons
    of a particular energy range and not as reference measurement standards of a particular
    radionuclide. For example, a 241Am source with the recommended filtration does
    not emit from the surface the alpha particles or characteristic low-energy L X-ray
    photons associated with the decay of the nuclide. It is designed to be a reference
    measurement standard that emits photons with an average energy of approximately
    60 keV. This document also specifies preferred reference radiations for the calibration
    of surface contamination monitors. These reference radiations are realized in
    the form of adequately characterized large area sources specified, without exception,
    in terms of surface emission rate and activity which are traceable to national
    standards.
