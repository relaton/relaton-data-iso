abstract:
- language: en
  script: Latn
  content: This document specifies test methods applicable to fibre-reinforced polymer
    (FRP) bars as reinforcement or pre-stressing tendons in concrete, including physical,
    mechanical, durability, and long-term properties. FRP bars in this document are
    made of fibre and resin matrix. Types of fibres are aramid fibre, basalt fibre,
    carbon fibre or glass fibre. The matrix includes thermosetting resins, such as
    vinylester, unsaturated polyester resins, as well as thermoplastic resins, including
    polypropylene, polyamides, and polymethyl methacrylate.
