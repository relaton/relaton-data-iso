abstract:
- language: en
  script: Latn
  content: 'ISO 25762:2009 gives guidelines for the assessment of the fire characteristics
    and fire performance of fibre-reinforced polymer (FRP) composites, particularly
    in structural applications in buildings and transport. It is applicable to FRP
    composites prepared from thermosetting or thermoplastic resins and reinforced
    with inorganic fibres greater than 7,5 mm in length. It gives guidelines on: the
    applicability of product types (e.g. sheets, laminates, profiled sections and
    some sandwich constructions) to end-use performance; the test methods and performance
    criteria for different physical forms of FRP test specimen.'
