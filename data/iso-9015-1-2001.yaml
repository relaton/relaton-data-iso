abstract:
- language: en
  script: Latn
  content: This part of ISO 9015 specifies hardness tests on transverse sections of
    arc welded joints of metallic materials. It covers Vickers hardness tests in accordance
    with ISO 6507-1, normally with test loads of 49,03 N or 98,07 N (HV 5 or HV 10).
    However, the principles may be applied to Brinell hardness testing (with appropriate
    testing loads of HB 2,5/15,625 or HB 1/2,5) in accordance with ISO 6506-1 and
    micro hardness testing in accordance with ISO 6507-1 and ISO 9015-2. NOTE Testing
    should be carried out to ensure that the highest and the lowest level of hardness
    of both parent metal and weld metal is determined. This part of ISO 9015 does
    not apply to test welds in austenitic stainless steels.
