abstract:
- language: en
  script: Latn
  content: ISO 12108:2012 describes tests for determining the fatigue crack growth
    rate from the fatigue crack growth threshold stress-intensity factor range to
    the onset of rapid, unstable fracture. ISO 12108:2012 is primarily intended for
    use in evaluating isotropic metallic materials under predominantly linear-elastic
    stress conditions and with force applied only perpendicular to the crack plane
    (mode I stress condition), and with a constant stress ratio.
