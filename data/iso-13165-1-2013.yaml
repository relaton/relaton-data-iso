abstract:
- language: en
  script: Latn
  content: ISO 13165-1:2013 specifies the determination of radium-226 (226Ra) activity
    concentration in non-saline water samples by extraction of its daughter radon-222
    (222Rn) and its measurement using liquid scintillation counting. Radium-226 activity
    concentrations which can be measured by this test method utilizing currently available
    liquid scintillation counters goes down to 50 mBq l−1. This method is not applicable
    to the measurement of other radium isotopes.
