abstract:
- language: en
  script: Latn
  content: 'ISO 19115:2003 defines the schema required for describing geographic information
    and services. It provides information about the identification, the extent, the
    quality, the spatial and temporal schema, spatial reference, and distribution
    of digital geographic data. ISO 19115:2003 is applicable to: the cataloguing of
    datasets, clearinghouse activities, and the full description of datasets;geographic
    datasets, dataset series, and individual geographic features and feature properties.
    ISO 19115:2003 defines: mandatory and conditional metadata sections, metadata
    entities, and metadata elements;the minimum set of metadata required to serve
    the full range of metadata applications (data discovery, determining data fitness
    for use, data access, data transfer, and use of digital data);optional metadata
    elements - to allow for a more extensive standard description of geographic data,
    if required;a method for extending metadata to fit specialized needs. Though ISO
    19115:2003 is applicable to digital data, its principles can be extended to many
    other forms of geographic data such as maps, charts, and textual documents as
    well as non-geographic data. NOTE Certain mandatory metadata elements may not
    apply to these other forms of data.'
