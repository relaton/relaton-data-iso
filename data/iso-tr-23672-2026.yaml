abstract:
- language: en
  script: Latn
  content: This document defines adaptive thermal comfort and its mechanisms, and
    describes current approaches to predict adaptive thermal comfort. This document
    applies to human thermal comfort in indoor built environments and seasonal adaptive
    processes. It is applicable to healthy humans exposed to indoor environments where
    thermal comfort is desirable, but where moderate deviations from thermal comfort
    occur, in the design of new environments or the assessment of existing ones.
