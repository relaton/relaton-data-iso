abstract:
- language: en
  script: Latn
  content: 'A series of standards are necessary to provide information to system integrators
    and facility owners on the requirements when integrating robots and infrastructure.
    In specific, the data exchanges between robots and infrastructure to facilitate
    deployment of multiple types of robots within the same premise is essential. Information
    provided within the series would also offer guidelines and best practices in exception
    handling on the operating procedures to be followed by robots, especially in emergency
    situations. The first in the series, Part 1, to be developed separately, will
    address the overarching framework of Infrastructure for Robot Applications. Part
    1 will contain the list of the elements of Infrastructure for Robot Applications,
    including lifts (elevators), automatic doorways, security systems, shared space
    management systems, alarm systems, notification systems, monitoring systems, shared
    marker systems and physical environmental classifications. The subsequent parts
    will provide specific requirements and guidelines for each element of Infrastructure
    for Robot Applications. This document aims to develop Part 2 of the series to
    address the requirements for interfacing with lifts and automatic doorways. Part
    2 will define the minimum set of data exchanges, hardware requirements, safety
    considerations, for robot-lift integration with both digital and discrete lift
    control systems, and for robot-automatic doorway integration. It also covers communications
    between robot-lift and robot-automatic doorway during emergency situations such
    as fire evacuation, and abnormal conditions such as power outage or disruption.
    These requirements in Part 2 aims to harmonise the integration requirements between
    robots and lift/ automatic doorways and will not contradict ISO (DIS) 21423 that
    is being developed by TC299 WG10. The types of lifts that building owners can
    integrate with the robots may vary. Common parameters include the following: a)
    Designated or mixed usage: passenger, cargo or mixed-use lift; b) Number of doors:
    single door or dual door (front and back door); and c) Hosting site of digital
    lift controller: within the building that it serves or in the cloud. For robot-automatic
    doorway integration, the types of power-operated doorways suitable for integration
    include, but are not limited to, swing and sliding doors, as long as they can
    be opened or closed by an automatic door operator. Specific message protocols
    and solutions, and low-energy power-assisted doors, are not within the scope of
    this document.'
