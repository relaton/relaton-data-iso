abstract:
- language: en
  script: Latn
  content: Two methods for evaluating cycle life extension by partial pressure cycles
    based on the Goodman diagram and exponential formula are presented in ISO 19884-1.
    These methods do not rely on fracture mechanical methodology but on pressurizing
    cycle test data, since the framework of ISO 19884-1 is constructed on performance
    demonstrated by pressurizing cycle test data in hydrogen. This document describes
    detailed methods with necessary conditions with example data of their application.
