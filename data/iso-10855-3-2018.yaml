abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the periodic inspection, examination
    and testing of offshore freight and service containers, built in accordance with
    ISO 10855‑1, with maximum a gross mass not exceeding 25 000 kg and their associated
    lifting sets, intended for repeated use to, from and between offshore installations
    and ships. Inspection requirements following damage and repair of offshore containers
    are also included. Recommended knowledge and experience of staff responsible for
    inspection of offshore containers is given in Annex B. Recommended knowledge and
    experience of staff responsible for inspection of lifting sets intended for use
    with offshore containers is given in Annex C.
