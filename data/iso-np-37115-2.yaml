abstract:
- language: en
  script: Latn
  content: This document provides the principles and fundamentals for achieving net
    zero carbon cities. It addresses key aspects including governance structures,
    regional coordination mechanisms, and stakeholder engagement, as well as the integrated
    impacts of related sustainable practices across multiple sectors. Being aligned
    with the ISO 37101 framework, it serves as a strategic guiding document for realising
    net zero carbon development in cities and communities. This document offers practical
    support for all stakeholders, including governments, urban planners, investors,
    construction firms, infrastructure operators, and researchers, that are engaged
    in planning, developing, and managing net zero carbon cities.
