abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for a food loss and waste (FLW) management system to enable an organization that is involved in the food supply chain: to plan, implement, operate, maintain, review, improve and update an FLW management system to minimize FLW within its operations and/or its supply chain; to put in place arrangements to quantify, measure, monitor, document and report its excess food and FLW; to contribute to reducing FLW throughout the food supply chain; to evaluate, assess and collaborate with interested parties within the food supply chain; to effectively communicate FLW issues to interested parties within the food supply chain; to ensure that the organization conforms to its stated FLW policy; to demonstrate continual improvement in its efforts to prevent and minimize FLW to relevant interested parties; to seek certification or registration of its FLW management system by an external organization or make a self-assessment or self-declaration of conformity to this document. All the requirements of this document are generic. This document is applicable to all organizations in the food supply chain regardless of size or complexity. Organizations that are directly or indirectly involved include, but are not limited to, farmers, feed producers, animal food producers, harvesters of wild plants and animals, producers of ingredients, food manufacturers, providers of transportation, storage and distribution services, wholesalers, retailers, food charities, organizations providing food services or catering services and organizations providing food waste management services. This document allows any organization, including small and/or less developed organizations (e.g. a small farm, a small packer-distributor, a small retailer or a food service outlet) to implement externally developed elements in its FLW management system. NOTE 1        Organizations can also choose to address or take steps to reduce consumer food waste within their FLW management system if this is considered a significant FLW hotspot (see Annex A). NOTE 2        Competent authorities seeking to reduce FLW within their jurisdictions can incorporate this document into their activities.'
