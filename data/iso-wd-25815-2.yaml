abstract:
- language: en
  script: Latn
  content: 'This document provides hospitals with best practices to prevent, detect,
    and treat malnutrition in adult and pediatric inpatients. This standard addresses
    processes and protocols to: — Identify patients at risk of malnutrition at admission
    — Diagnose malnutrition — Implement an integrated nutrition care plan to prevent
    and treat malnutrition — Provide nutritious and culturally acceptable food and
    reduce barriers to food intake for patients — Monitor nutrition intake and nutrition
    status changes for patients — Provide treatment for patients with malnutrition
    throughout their hospital stay — Facilitate organizational changes to implement
    and sustain improved nutrition care — Focus on nutrition care in the discharge
    plan when patients are transferred to other care and community settings In this
    standard hospitals are referred to as “the organization”.'
