abstract:
- language: en
  script: Latn
  content: This document outlines the equipment and operator qualification needed
    for laser-arc hybrid welding, and recommends butt, fillet and flange joint preparations
    and consumables suitable for use with this process. It also gives an overview
    of the steps to take during equipment set-up, procedure specification, workpiece
    set-up immediately prior to welding, and after welding once inspecting and testing
    the welds. This document applies to laser-arc hybrid welding of steels, aluminium
    and its alloys. This document does not apply to hybrid processes where laser beam
    welding is hybridized with another welding process not using an electric arc as
    its heat source.
