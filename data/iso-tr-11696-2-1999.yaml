abstract:
- language: en
  script: Latn
  content: This part of ISO/TR 11696 provides guidance on the principles and use of
    fire test data and other relevant information concerning construction products
    and their end-use environment, so that potential fire hazards and/or risks may
    be assessed. It suggests procedures for expressing results and how to interpret
    the data to aid the fire hazard assessment process. The guidance given is aimed
    at materials manufacturers and convertors, designers, wholesalers and retailers,
    specifiers and regulating bodies, and consumer representatives.
