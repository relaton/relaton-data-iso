abstract:
- language: en
  script: Latn
  content: 1.1  This document specifies the requirements for a test method to be utilized
    to establish or confirm a reduced incubation time (RIT) that is shorter than the
    7-day reference incubation time specified in 7.3.2 of ISO 11138-1:2017 for biological
    indicators used to monitor moist heat sterilization processes or ethylene oxide
    (EO) sterilization processes. NOTE: For biological indicators used for EO sterilization,
    the stated RIT is applicable to 100 % EO processes or processes that use EO blends,
    regardless of the product load. 1.2  This document is applicable to manufacturers
    of biological indicators (BIs) and to end users of BIs who intend to, if required
    by their quality system, establish, validate or confirm a RIT. 1.3  This document
    does not apply to biological indicators used to monitor dry heat, low temperature
    steam formaldehyde (LTSF) or vaporized hydrogen peroxide (VH2O2) sterilization
    processes. NOTE      The method described in this document to establish a RIT
    for biological indicators used to monitor moist heat or EO sterilization processes
    has been used extensively for many years. However, there is limited experience
    in use of this method to establish a RIT for biological indicators used to monitor
    dry heat, low temperature steam formaldehyde or vaporized hydrogen peroxide sterilization
    processes. This document, therefore, does not include these sterilization processes.
