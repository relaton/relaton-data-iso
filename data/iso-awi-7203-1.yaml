abstract:
- language: en
  script: Latn
  content: This document specifies the essential properties and performance of liquid
    foam concentrates used to make low-expansion foams for the control, the extinction
    and the inhibition of reignition of fires of water-immiscible liquids. Minimum
    performance on certain test fires is specified. These foams are suitable for top
    application to fires of water-immiscible liquids. The foams that conform with
    ISO 7203-3 are also suitable for top application to fires of water-miscible liquids.
    The foam concentrates can be suitable for use in non-aspirating sprayers or for
    subsurface application to liquid fires, but the requirements specific to those
    applications are outside the scope of this document.
