abstract:
- language: en
  script: Latn
  content: This part of ISO 11359 specifies a test method, using thermodilatometry,
    for the determination of the coefficient of linear thermal expansion of plastics
    in a solid state by thermomechanical analysis (TMA). This part of ISO 11359 also
    specifies the determination of the glass transition temperature using TMA. NOTE
    The coefficient of linear thermal expansion can be measured using various types
    of thermodilatometry apparatus. This part of ISO 11359 concerns only TMA apparatus.
