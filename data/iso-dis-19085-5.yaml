abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and measures for dimension
    saws (defined in 3.1), capable of continuous production use and hereinafter referred
    to also as “machines”. The machines are designed to cut solid wood and material
    with similar physical characteristics to wood. This document deals with all significant
    hazards, hazardous situations and events, listed in Annex A, relevant to the machines,
    when operated, adjusted and maintained as intended and under the conditions foreseen
    by the manufacturer; reasonably foreseeable misuse has been considered too. Transport,
    assembly, dismantling, disabling and scrapping phases have also been taken into
    account. This document is also applicable to machines fitted with one or more
    of the following devices/additional working units, whose hazards have been dealt
    with: a)       device to raise and lower the main saw blade and scoring saw blade;
    b)       device to tilt the main saw blade and scoring saw blade for angled cutting
    in one or both directions; c)        device for scoring; d)       device for grooving
    with milling tool with a width not exceeding 20 mm; e)       demountable power
    feed unit; f)         power-operated sliding table; g)       workpiece clamping.
    This document is not applicable to machines intended for use in potentially explosive
    atmospheres or to machines manufactured prior to the date of its publication.'
