abstract:
- language: en
  script: Latn
  content: 'This document specifies test methods and requirements for the design of
    electrical devices, when under normal operating conditions, on small craft so
    that they can be operated without igniting a surrounding flammable gas atmosphere.
    This document does not apply to ignition protection procedures for: —     devices
    or components that can operate in hydrogen and air mixtures; —     devices with
    dysfunctional issues; —     mechanisms of ignition from external sources, such
    as static electricity, lightning or other factors not related to the equipment
    under test.'
