abstract:
- language: en
  script: Latn
  content: This document specifies a test method to determine the ice adhesion properties
    of ice aggregates adhered to coating systems. In this test method, a horizontal
    shear force is used to shear off this ice aggregate under quasi static load rates.
    Note In practice, ice adhesion is determined by two different measurement principles,
    the centrifugal test (see ISO/TS 19392 6) and the shear test (see this document),
    which differ in dynamic and quasistatic shear rates. This test method is used
    for testing the adhesion of static ice aggregates on the coating system (e.g.
    after down time of a wind turbine rotor blade).
