abstract:
- language: en
  script: Latn
  content: This document specifies a simulating method of test for determination of
    the release of metal-ions from enamelled articles, which are intended to come
    into contact with food. It also specifies limits for the release of metal-ions
    from enamelled articles, which are intended to come into contact with food. It
    is applicable to enamelled articles, including tanks and vessels, which are intended
    to be used for the preparation, cooking, serving and storage of food.
