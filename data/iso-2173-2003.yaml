abstract:
- language: en
  script: Latn
  content: ISO 2173:2003 specifies a refractometric method for the determination of
    the soluble solids in fruit and vegetable products. This method is particularly
    applicable to thick products, to products containing suspended matter, and to
    products rich in sugar. If the products contain other dissolved substances, the
    results will be only approximate; nevertheless, for convenience the result obtained
    by this method can be considered conventionally as the soluble solids content.
