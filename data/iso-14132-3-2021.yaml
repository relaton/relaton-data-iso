abstract:
- language: en
  script: Latn
  content: This document applies to telescopic sights used on hand-held firearms and
    airguns and gives terms and definitions for telescopic sights only. The alphabetical
    indexes of terms that are common for all published parts of ISO 14132 are published
    in ISO 14132-1. The definitions can be changed, if required, by introducing derivative
    attributes into them, revealing the meanings of the terms used, showing the objects
    covered by the scope of the notion being defined. These changes will not affect
    the scope and contents of this document.
