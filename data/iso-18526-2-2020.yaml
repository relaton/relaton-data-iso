abstract:
- language: en
  script: Latn
  content: This document specifies the reference test methods for determining the
    physical optical properties of personal eye and face protectors. This document
    does not apply to any eye and face protection products for which the requirements
    standard(s) specifies other test methods. Other test methods can be used provided
    they have been shown to be equivalent and include uncertainties of measurement
    no greater than those required of the reference method.
