abstract:
- language: en
  script: Latn
  content: This document outlines methodologies for creating and evaluating AACN algorithms,
    using suitable parameters, to predict the level of injury sustained by road users
    in a collision. The injury prediction is used to facilitate emergency response
    after a collision occurs. The methodology is based on onboard vehicle data and
    occupant-related information and applies to vehicle occupants and vulnerable road
    users. This document is applicable to road vehicles having provisions for measuring
    and communicating crash related data. This document provides neither a particular
    AACN injury level prediction algorithm, nor information on how to use the estimated
    probability of injury to decide on further suitable actions (rescue, medical,
    etc.). Data format for sending vehicle information and communication protocol
    between the vehicle and the public service answering point (PSAP) is outside the
    scope of this document.
