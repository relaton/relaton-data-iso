abstract:
- language: en
  script: Latn
  content: This document specifies a standardized laboratory-scale test method for
    evaluating the performance of fine bubble-assisted washing processes for the removal
    of heavy metals from contaminated soils. The method involves batch experiments
    using fine bubble generators to facilitate the desorption and extraction of heavy
    metals from soil particles into a washing solution. The test method is applicable
    to soils contaminated with heavy metals such as lead (Pb), cadmium (Cd), copper
    (Cu), zinc (Zn), arsenic (As), and chromium (Cr). It can be applied to a wide
    range of soil types including sandy, loamy, and clayey soils for comparative evaluation
    of different fine bubble technologies, performance testing, laboratory validation,
    and certification purposes.
