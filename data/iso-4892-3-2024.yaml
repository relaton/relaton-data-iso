abstract:
- language: en
  script: Latn
  content: This document specifies methods for exposing plastic specimens to fluorescent
    UV lamp radiation, heat and water in apparatus designed to simulate the weathering
    effects that occur when plastic materials are exposed in actual end-use environments
    to global solar radiation, or to window-glass filtered solar radiation. Fluorescent
    UV lamp exposures for paints, varnishes and other coatings are described in ISO 16474-3.
