abstract:
- language: en
  script: Latn
  content: 'ISO 16665:2005 provides guidelines on the quantitative collection and
    processing of subtidal soft-bottom macrofaunal samples in marine waters. ISO 16665:2005
    encompasses: development of the sampling programme; requirements for sampling
    equipment; sampling and sample treatment in the field; sorting and species identification;
    storage of collected and processed material. ISO 16665:2005 does not specifically
    address the following, although some elements may be applicable: bioassay sub-sampling;
    deep water (> 750 m) or offshore sampling; in situ faunal studies, e.g. recolonisation
    assays; nonbenthic organisms caught in the sampling device; estuarine sampling;
    intertidal sampling; meiofaunal sampling and analysis; sampling by dredge and
    sledge; Self-Contained Underwater Breathing Apparatus (SCUBA) sampling; statistical
    design. Accuracy of position fixing is determined by the geographical area, equipment
    used and survey objective.'
