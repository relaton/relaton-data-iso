abstract:
- language: en
  script: Latn
  content: This document specifies additional material, design, performance and marking
    requirements for eye and face protectors designed to provide protection for the
    eyes and faces of persons against occupational hazards, such as optical radiation,
    impacts from flying particles and fragments, and hot solids during welding and
    related techniques. The other applicable requirements for welding protectors are
    given in ISO 16321‑1. This document also applies to welding protectors used in
    educational establishments. This document also applies to those eye and face protectors
    used for occupational-type tasks that are performed similarly to an occupation,
    e.g. "do-it-yourself".
