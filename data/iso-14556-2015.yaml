abstract:
- language: en
  script: Latn
  content: ISO 14556:2015 specifies a method of instrumented Charpy V-notch pendulum
    impact testing on metallic materials and the requirements concerning the measurement
    and recording equipment. With respect to the Charpy pendulum impact test described
    in ISO 148‑1, this test provides further information on the fracture behaviour
    of the product under impact testing conditions. General information about instrumented
    impact testing can be found in Reference [1] to Reference [5].
