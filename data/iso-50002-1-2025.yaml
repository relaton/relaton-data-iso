abstract:
- language: en
  script: Latn
  content: 'This document specifies: —     the principles of carrying out energy audits;
    —     the process requirements for carrying out an energy audit in relation to
    energy performance; —     the roles and responsibilities of the organization and
    the energy auditor; —     deliverables for energy audits. It gives guidance on
    determining and/or evaluating the competence of the energy auditor. This document
    is applicable to any organization regardless of its size, complexity, geographical
    location, organizational culture or the products and services it provides, irrespective
    of the quantity, use or types of energy used. This document does not apply to
    selecting and evaluating the competence of bodies providing energy audit services.
    It also does not apply to auditing an organization’s energy management system
    (EnMS), as this is described in ISO 50003. Additional documents provide information
    guidance on applying the energy audit process to buildings (see ISO 50002-2),
    processes (see ISO 50002-3) and other applications or uses.'
