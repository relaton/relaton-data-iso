abstract:
- language: en
  script: Latn
  content: This document specifies a method, by measuring the oxygen demand in a closed
    respirometer, for the determination of the degree of aerobic biodegradability
    of plastic materials, including those containing formulation additives. The test
    material is exposed in an aqueous medium under laboratory conditions to an inoculum
    from activated sludge. If an unadapted activated sludge is used as the inoculum,
    the test simulates the biodegradation processes which occur in a natural aqueous
    environment; if a mixed or pre-exposed inoculum is used, the method is used to
    investigate the potential biodegradability of a test material. The conditions
    used in this document do not necessarily correspond to the optimum conditions
    allowing maximum biodegradation to occur, but this document is designed to determine
    the potential biodegradability of plastic materials or give an indication of their
    biodegradability in natural environments. The method enables the assessment of
    the biodegradability to be improved by calculating a carbon balance (optional,
    see Annex E). The method applies to the following materials. — Natural and/or
    synthetic polymers, copolymers or mixtures thereof. — Plastic materials which
    contain additives such as plasticizers, colorants or other compounds. — Water-soluble
    polymers. — Materials which, under the test conditions, do not inhibit the microorganisms
    present in the inoculum. Inhibitory effects can be determined using an inhibition
    control or by another appropriate method (see, for example, ISO 8192[2]). If the
    test material is inhibitory to the inoculum, a lower test concentration, another
    inoculum or a pre-exposed inoculum can be used.
