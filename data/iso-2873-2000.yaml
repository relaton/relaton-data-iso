abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for subjecting complete,
    filled transport packages and unit loads to conditions of low air pressure similar
    to those encountered in aircraft. This method is applicable to complete, filled
    transport packages and unit loads which are intended to be transported in pressurized
    aircraft flying at any altitude and in unpressurized aircraft flying at 3 500
    m or less.
