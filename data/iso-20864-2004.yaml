abstract:
- language: en
  script: Latn
  content: 'ISO 20864:2004 specifies three methods for determining the shape retention
    properties and compression strength of a domed test specimen. These methods are
    the following and they are applicable to footwear toepuff and stiffener: method
    1: applicable to heat activated materials method 2: applicable to solvent activated
    materials method 3: applicable to non-thermoplastic fibreboard'
