abstract:
- language: en
  script: Latn
  content: This document specifies the standard test method to assess the performance
    of dust collectors utilizing integrated fans (compact type dust collector), at
    the time of manufacture, after being used for a certain period. This document
    adopts the black box concept that the dust collector to be tested is operated
    with the specification determined by the manufacturer except test dust condition
    and the pulse interval during ageing. This document is applicable to small dust
    collectors utilizing cartridge filters including molded filters or bag filters
    with pulse cleaning equipment as filtration media for dry dust collection. Mist
    and fumes collectors are excluded from this test. The performance obtained from
    this test does not guarantee the performance of the system. This document is not
    intended to offer the superiority or inferiority of performance between dust collectors,
    but specifies a standard test method that provides users with performance under
    simulated conditions of use for a certain duration.
