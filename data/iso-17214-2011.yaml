abstract:
- language: en
  script: Latn
  content: ISO 17214:2011 defines services and service interfaces provided by the
    Spacecraft Onboard Interface Services (SOIS) time access service. It specifies
    only the service and not the methods of providing the service, although use of
    the SOIS subnetwork services is assumed. ISO 17214:2011 conforms to the principles
    set out in the SOIS Green Book (CCSDS 850.0-G-1) and it is intended to be applied
    together with it.
