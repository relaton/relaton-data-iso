abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for the determination of
    the heat of combustion of building products at constant volume in a bomb calorimeter.
    This International Standard describes a test method for the measurement of the
    gross heat of combustion (PCS). Annex A describes the calculation of the net heat
    of combustion ( PCI) when required. Information on the precision of the test method
    is given in annex B.
