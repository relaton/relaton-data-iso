abstract:
- language: en
  script: Latn
  content: ISO 15329:2006 specifies an electrochemical method to determine susceptibility
    to intergranular corrosion of solution-heat-treatable aluminium alloys, that is
    2XXX, 6XXX, 7XXX and 8XXX alloys, without protective coatings and in various ageing
    conditions. ISO 15329:2006 is applicable to cast and wrought heat-treatable aluminium
    alloys in the form of castings, forgings, plates, sheets, extrusions, and semi-finished
    or finished parts, in order to carry out a comparative assessment of alloys of
    different grades and thickness depending on their chemical composition and other
    factors, and also to check the thermal processing quality of the tested materials.
    The test results provide information to help to determine the intergranular corrosion
    resistance and thermal processing quality of the tested materials (see Clauses
    8 and 9).
