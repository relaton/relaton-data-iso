abstract:
- language: en
  script: Latn
  content: ISO 28258:2013 describes how to digitally exchange soil-related data. It
    aims to facilitate the exchange of valid, clearly described and specified soil-related
    data between individuals and organizations via digital systems, and enables any
    soil data producer, holder or user to find and transfer data in an unambiguous
    way. It contains definitions of features, several parameter specifications and
    encoding rules that allow consistent and retrievable data exchange. It also allows
    the explicit geo-referencing of soil data by building on other International Standards,
    thus facilitating the use of soil data within geographical information systems
    (GIS). Because soil data are of various origins and are obtained according to
    a huge variety of description and classification systems, ISO 28258:2013 provides
    no attribute catalogue, but a flexible approach to the unified encoding of soil
    data by implementing the provisions of ISO 19156 observations and measurements
    (OM) for use in soil science.
