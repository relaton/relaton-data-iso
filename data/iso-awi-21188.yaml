abstract:
- language: en
  script: Latn
  content: ISO 21188:2018 sets out a framework of requirements to manage a PKI through
    certificate policies and certification practice statements and to enable the use
    of public key certificates in the financial services industry. It also defines
    control objectives and supporting procedures to manage risks. While this document
    addresses the generation of public key certificates that might be used for digital
    signatures or key establishment, it does not address authentication methods, non-repudiation
    requirements or key management protocols. ISO 21188:2018 draws a distinction between
    PKI systems used in closed, open and contractual environments. It further defines
    the operational practices relative to financial-services-industry-accepted information
    systems control objectives. This document is intended to help implementers to
    define PKI practices that can support multiple certificate policies that include
    the use of digital signature, remote authentication, key exchange and data encryption.
    ISO 21188:2018 facilitates the implementation of operational, baseline PKI control
    practices that satisfy the requirements for the financial services industry in
    a contractual environment. While the focus of this document is on the contractual
    environment, application of this document to other environments is not specifically
    precluded. For the purposes of this document, the term "certificate" refers to
    public key certificates. Attribute certificates are outside the scope of this
    document ISO 21188:2018 is targeted for several audiences with different needs
    and therefore the use of this document will have a different focus for each. Business
    managers and analysts are those who require information regarding using PKI technology
    in their evolving businesses (e.g. electronic commerce); see Clauses 1 to 6. Technical
    designers and implementers are those who are writing their certificate policies
    and certification practice statement(s); see Clauses 6 to 7 and Annexes A to G.
    Operational management and auditors are those who are responsible for day-to-day
    operations of the PKI and validating compliance to this document; see Clauses
    6 to 7.
