abstract:
- language: en
  script: Latn
  content: 'ISO 15753:2006 describes two methods for the determination of 15 polycyclic
    aromatic hydrocarbons (PAHs) in animal and vegetable fats and oils: a general
    method, and a method specific for coconut oil and short-chain vegetable oils.
    These methods are not quantitative for the very volatile compounds such as naphthalene,
    acenaphthene and fluorene. Due to interferences provided by the matrix itself,
    palm oil and olive pomace oil cannot be analysed using this method.'
