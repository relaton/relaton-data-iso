abstract:
- language: en
  script: Latn
  content: ISO 9523:2015 specifies the dimensions and characteristics of the interface,
    requirements, test methods, and marking of ski-boots with a rigid sole which are
    used with current systems of touring ski-bindings with attachment at the boot
    toe and boot heel, the proper release function of which depends on the dimensions
    and design of the interfaces. For ski-binding systems that function irrespective
    of the sole shape or that have different requirements for the sole dimensions,
    it is not always necessary for the ski-boot soles to comply with this International
    Standard in order to achieve the desired degree of safety. ISO 9523:2015 is applicable
    to ski-boots of sizes 15,0 and larger in the Mondopoint system. It is applicable
    to rigid touring boots. Boots with softer shells like Telemark boots are excluded
    as they do not have the necessary shell stability to act as part of the release
    systems.
