abstract:
- language: en
  script: Latn
  content: 'This document specifies an additional test for verifying the stability
    of a laden truck whose utilization creates the special operating condition whereby
    the load centre of gravity is substantially offset from the truck''s longitudinal
    centre plane or from the centred position by design. A load is considered to be
    substantially offset if displaced by more than: —    100 mm, for a truck with
    a rated capacity < 5 000 kg; —    150 mm, for a truck with a rated capacity ≥ 5 000 kg
    and ≤ 10 000 kg; —    250 mm, for a truck with a rated capacity > 10 000 kg and
    < 20 000 kg; —    350 mm, for a truck with a rated capacity ≥ 20 000 kg. This
    document is applicable to the following types of trucks as defined in ISO 5053-1:
    a)    counterbalance trucks; b)    reach and straddle trucks; c)    pallet stackers;
    d)    bidirectional and multidirectional trucks; e)    industrial variable-reach
    trucks; f)     rough-terrain trucks with mast; g)    rough-terrain variable reach
    trucks; h)    counterbalance trucks with articulated steering; i)     variable-reach
    container handler; j)     counterbalanced container handler; k)    order-picking
    truck; l)     slewing rough-terrain variable-reach truck.'
