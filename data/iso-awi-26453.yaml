abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of flat washers with inside
    chamfer of the medium series and product grade A: • made of steel, with property
    classes 200HV, 300HV and 380HV, with nominal diameters 1,6 mm to 100 mm; • made
    of stainless steel with property classes 200HV and 300HV, with nominal diameters
    1,6 mm to 39 mm; however dimensions above 39 mm and up to 100 mm are possible
    by agreement between the purchaser and the supplier'
