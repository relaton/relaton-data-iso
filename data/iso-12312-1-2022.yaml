abstract:
- language: en
  script: Latn
  content: 'This document is applicable to all afocal (plano power) sunglasses and
    clip-ons for general use, including road use and driving, intended for protection
    against solar radiation. Information on the use of sunglass filters is given in
    Annex A. Requirements for unmounted filters used as replacement or alternative
    filters are given in Annex C. This document is not applicable to: a) eyewear for
    protection against radiation from artificial light sources; b) eye protectors
    intended for specific sports (e.g. ski goggles or other types – see ISO18527 (all
    parts)); c) sunglasses that have been medically prescribed for attenuating solar
    radiation; d) products intended for direct observation of the sun, such as for
    viewing a partial or annular solar eclipse, for which ISO12312-2 applies; e) products
    intended for occupational eye protection – see, for example, ISO16321 (all parts).'
