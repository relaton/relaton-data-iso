abstract:
- language: en
  script: Latn
  content: The 17739 standard series are related to improve the road safety among
    connected automated mobility including VRUs, connected vehicle, non-connected
    vehicle that have nomadic device on their hand or on top of the vehicle. Especially,
    various use cases and general information are defined in the ISO 17739-1. Based
    on the use cases in ISO 17739-1, this standard specifies common messages and its
    data structure that is essential to implement the use cases defined in ISO 17739-1.
    The messages and its data structure refer to existing standardized V2X messages
    in SAE and ETSI ITS by gap analysis. This standard defines new messages and its
    data structure in case there is not appropriate message in existing standardized
    V2X message.
