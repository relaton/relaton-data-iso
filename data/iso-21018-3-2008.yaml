abstract:
- language: en
  script: Latn
  content: ISO 21018-3:2008 specifies a method for the semi-quantitative determination
    of the particulate contamination level using the filter blockage technique (also
    known as the mesh-obscuration method or the pore-blockage technique) either on-line
    or off-line in containers. ISO 21018-3:2008 also defines procedures for calibrating
    the instruments and verifying their correct operation both in the laboratory and
    in service. In general, the techniques are suitable for monitoring the general
    cleanliness level in hydraulic systems, the progress in flushing operations and
    support equipment and test rigs. The use of ISO 21018-3:2008 is applicable to
    all single- or multi-phase liquid systems.
