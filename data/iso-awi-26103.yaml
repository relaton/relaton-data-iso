abstract:
- language: en
  script: Latn
  content: 'This document applies to passenger body side entrance systems of all newly
    designed railway vehicles. It applies to tram, metro, suburban, main-line and
    high-speed trains that carry passengers. The requirements of this document also
    apply to existing vehicles undergoing refurbishment of the door equipment, as
    far as it is reasonably practicable. This document also specifies the requirements
    for testing of entrance systems. This document makes reference to manual and power
    operated entrance systems. For manual doors, clauses referring to power operation
    are not applicable. This document does not apply to the following: - Entrance
    systems for equipment access, - Inspection or maintenance purposes and for crew
    only use; - Doors on freight wagons; and - Doors or hatches specifically provided
    for escape under emergency conditions.'
