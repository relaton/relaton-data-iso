abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1804:2019 specifies the application module for Product as
    individual assembly and test. The following are within the scope of ISO/TS 10303-1804:2019:
    assembly of physically realized objects; results of testing physically realized
    objects including the activity that leads to the results; items within the scope
    of application module Activity, ISO/TS 10303-1047; items within the scope of application
    module Process plan, ISO/TS 10303-1803; items within the scope of application
    module Product as individual, ISO/TS 10303-1164; items within the scope of application
    module Property assignment, ISO/TS 10303-1030.'
