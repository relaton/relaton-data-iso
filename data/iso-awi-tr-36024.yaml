abstract:
- language: en
  script: Latn
  content: This document provides a systematic review and a preliminary framework
    for the integration and representation of cultural elements in video games, based
    on the analysis of selected case studies. It aims to identify common practices
    and challenges to inform future practices for cross-cultural considerations in
    video game design. This document is informative in nature and does not establish
    requirements. This document is applicable to video game companies and game design
    professionals, which recommends a framework of good practices that can be used
    in responding to future video game design efforts.This document is dedicated to
    the support of global cultural diversity and cross-cultural communication.
