abstract:
- language: en
  script: Latn
  content: ISO 1985:2015 specifies, with reference to ISO 230-1 and ISO 230-7, both
    geometric and machining tests on general purpose, normal accuracy, manually, and
    numerically controlled (NC) surface grinding machines with reciprocating table
    and vertical grinding wheel spindle. It also specifies the applicable tolerances
    corresponding to the above-mentioned tests. ISO 1985:2015 is not applicable to
    surface grinding machines with fixed or rotating tables or to machines having
    longitudinal traverse of the wheelhead. ISO 1985:2015 deals only with the verification
    of the geometric accuracy of the machine. It does not apply to the testing of
    the machine operation (vibrations, abnormal noises, stick-slip motion of components,
    etc.), nor to the checking of its characteristics (such as speeds, feeds, etc.),
    which should generally be checked before testing the accuracy. ISO 1985:2015 provides
    the terminology used for the principal components of the machine and the designation
    of the axes with reference to ISO 841:2001.
