abstract:
- language: en
  script: Latn
  content: This document describes criteria and procedures for acoustic classification
    of dwellings. The purpose of this document is to make it easier for developers
    to specify a classified level of acoustic quality for a dwelling, and help users
    and builders to be informed about the acoustic conditions and define increased
    acoustic quality. The document can also be applied as a general tool to characterize
    the quality of the existing housing stock and includes provisions for classifying
    the acoustic quality before and after renovation has taken place. By the acoustic
    quality for a dwelling is understood the quality of the acoustic performances
    typically included in building regulations, e.g. sound insulation towards neighbouring
    premises and road traffic as well as sound from service equipment. Sound insulation
    and room acoustics internally in a dwelling are not included in the acoustic classes
    defined. This document does not have a legal status in a country, unless decided
    by its own authorities. However, an additional purpose of this document is to
    help national authorities and standardization organisations to develop or revise
    national building regulations and acoustic classification schemes. For the purpose
    of this document, the term ”dwellings” refers to detached and attached dwelling-houses,
    buildings with several flats as well as individual dwellings, and a dwelling is
    the living space for a household.
