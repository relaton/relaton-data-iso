abstract:
- language: en
  script: Latn
  content: ISO 13906:2008 specifies a method for the determination of acid detergent
    fibre (ADF) insoluble residue and acid detergent lignin (ADL) in all types of
    animal feeding stuffs. The limit of determination is 1 % mass fraction for ADF
    and 1,5 % mass fraction for ADL. A gravimetric routine and reference method is
    used.
