abstract:
- language: en
  script: Latn
  content: 'This document provides recommendations for the provision of professional tourist guide services to individuals and groups across a range of tourism contexts. It gives guidance on: • competencies, knowledge and skills of tourist guides; • professional conduct and ethical behaviour; • planning, organization and delivery of guiding services; • communication and interpretation practices; • safety and risk awareness; • cultural, environmental and sustainability considerations; • training and continuous professional development. This document is applicable to: • tourist guides working independently or on behalf of an organization; • on-site, virtual and hybrid guiding services; • guiding activities in cultural, natural, urban, rural and specialized tourism settings • varying durations of guiding services, from several hours to multiple days. This document does not provide requirements for: • licensing or regulatory frameworks established by national or regional authorities; • tour operator management or travel agency services, except where directly related to guiding; • transport, accommodation or other tourism service provision. Furthermore, this document does not apply to AI agent or audios guide or others excluding in-person tourist guide.'
