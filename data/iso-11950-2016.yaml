abstract:
- language: en
  script: Latn
  content: ISO 11950:2016 specifies requirements for single and double cold-reduced
    electrolytic chromium/chromium oxide-coated steel (ECCS) in the form of sheets
    or coils. Single cold-reduced ECCS is generally specified in nominal thicknesses
    that are multiples of 0,005 mm, from 0,150 mm up to and including 0,600 mm. Double
    cold-reduced ECCS is generally specified in nominal thicknesses that are multiples
    of 0,005 mm, from 0,100 mm up to and including 0,360 mm. ISO 11950:2016 applies
    to coils and sheets cut from coils in nominal minimum rolling widths of 600 mm[1].
    [1] Nominal minimum rolling widths of 500 mm may be applied by agreement between
    the purchaser and the manufacturer.
