abstract:
- language: en
  script: Latn
  content: This part of ISO 11841 defines terms for filters and components used in
    road vehicles and internal combustion engines for general use (e.g. marine engines,
    stationary engines). The purpose of ISO 11841 is to standardize definitions, to
    facilitate their understanding, and to create the basis of a uniform translation
    into foreign languages. It is also recommended that this International Standard
    be used when establishing other technical documents.
