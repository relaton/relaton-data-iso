abstract:
- language: en
  script: Latn
  content: 'This International Standard describes a method for the determination of
    the long term sublethal toxicity to Daphnia magna Straus (Cladocera, Crustacea)
    of: a) chemical substances, which are soluble under the conditions of the test,
    or can be maintained as stable suspensions or dispersions under the conditions
    of the test, b) industrial or sewage effluents, treated or untreated, after decanting,
    filtration, or centrifugation, c) surface or ground waters. NOTE This International
    Standard is adapted from OECD Guideline 211[1].'
