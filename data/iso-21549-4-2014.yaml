abstract:
- language: en
  script: Latn
  content: ISO 21549-4:2014 is applicable to situations in which clinical data additional
    to the limited clinical data defined in ISO 21549‑3 is recorded on or transported
    by patient healthcare data cards compliant with the physical dimensions of ID-1
    cards defined by ISO/IEC 7810. ISO 21549-4:2014 specifies the basic structure
    of the data contained within the data object extended clinical data, but does
    not specify or mandate particular data sets for storage on devices.
