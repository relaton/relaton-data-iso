abstract:
- language: en
  script: Latn
  content: This document specifies symbols used to express information supplied for
    a medical device. This document is applicable to symbols used in a broad spectrum
    of medical devices, that are available globally and need to meet different regulatory
    requirements. These symbols can be used on the medical device itself, on its packaging
    or in the accompanying information. The requirements of this document are not
    intended to apply to symbols specified in other standards.
