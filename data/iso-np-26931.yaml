abstract:
- language: en
  script: Latn
  content: This document specifies the dimensions, electrical characteristics and mechanical characteristics of aluminium alloy conductors, for aircraft electrical cables and aerospace applications. It applies to stranded conductors over the nominal cross-sectional area range 9 mm2 to 115 mm2 inclusive. It is not applicable to conductors for conventional copper-based cables, copper-clad aluminium based cables, for fire-resistant cables or for thermocouple extension cables. Conductors for copper-based cables are specified in ISO 2635, for copper-clad aluminium based cables are specified in ISO 13832, for fire-resistant cables are specified in ISO 1967 and for thermocouple extension cables are specified in ISO 8056-1.
