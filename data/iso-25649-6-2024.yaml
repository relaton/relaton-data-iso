abstract:
- language: en
  script: Latn
  content: 'This document specifies safety requirements and test methods related to
    materials, safety, performance and consumer information for classified floating
    leisure articles for use on and in the water according to ISO 25649-1:2024. This
    document is applicable to Class D floating leisure articles for use on and in
    water according to ISO 25649-1:2024 regardless whether the buoyancy is achieved
    by inflation or inherent buoyant material. NOTE 1        Typical products forming
    Class D (see Figure A.1 and Figure A.2): —      inflatable climbing structures
    on the water; —      bouncing platforms; —      inflatable slides; —      water
    trampolines; —      teeter totters; —      obstacle courses. NOTE 2        Typical
    places for application: —      pools; —      lakes, ponds; —      open sea; —     
    sea shore (no offshore winds, no currents).'
