abstract:
- language: en
  script: Latn
  content: ISO 1823:2015 specifies the characteristics of four types of oil suction
    and discharge hose assemblies used for the conveyance of petroleum, including
    crude oils and other liquid petroleum products. Each type being divided into three
    classes depend on the aromatic contents. It is not suitable for liquefied petroleum
    gas and natural gas. Hose assemblies to ISO 1823:2015 can be used in the temperature
    range −20 °C to 80 °C. The hoses specified are in the range of nominal size 50
    to 500 and can be types of smooth bore, rough bore, armoured rough bore, and light
    weight.
