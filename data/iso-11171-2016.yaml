abstract:
- language: en
  script: Latn
  content: 'ISO 11171:2016 specifies procedures for the following: a) primary particle-sizing
    calibration, sensor resolution and counting performance of automatic particle
    counters (APCs) for liquids capable of analysing bottle samples; b) secondary
    particle-sizing calibration using suspensions verified with a primary calibrated
    APC; c) establishing acceptable operation and performance limits; d) verifying
    particle sensor performance using a truncated test dust; e) determining coincidence
    and flow rate limits.'
