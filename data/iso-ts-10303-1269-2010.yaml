abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1269:2010-03 specifies the application module for Resource
    as realized. The following are within the scope of ISO/TS 10303-1269:2010-03:
    the recording of resources used or consumed by activities, organizations; the
    recording of usage or consumption of actual as well as types of resource items;
    the recording of the relationship between the resource as realized and the corresponding
    resource requirement statements; the recording of the relationship between the
    resource as realized and the corresponding resource events.'
