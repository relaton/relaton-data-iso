abstract:
- language: en
  script: Latn
  content: This document specifies how a preliminary welding procedure specification
    is qualified by welding procedure tests. This document applies to material manufactured
    using a welding process with wire feedstock. This document defines the conditions
    for the execution of welding procedure tests and the range of qualification for
    welding procedures for all practical welding operations within the qualification
    of this document. This document applies to automatic welding using process 13
    (gas-shielded metal arc welding) and process subgroups as defined in ISO 4063:2023.
