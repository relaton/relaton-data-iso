abstract:
- language: en
  script: Latn
  content: 'ISO/TR 25257:2009 covers: specifying the international business requirements
    for an international coding system for medicinal products; analysing the most
    significant international coding systems for medicinal products in current use
    and within the context of the objectives that each system was designed to serve;
    assessing the potential ability of each international coding system to fulfil
    the identified international business requirements of an international coding
    system for medicinal products; considering the issues involved in producing a
    unified international coding system which will meet all business requirements;
    recommending next steps for a unified international coding system for medicinal
    products.'
