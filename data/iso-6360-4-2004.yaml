abstract:
- language: en
  script: Latn
  content: ISO 6360-4:2004 specifies the code numbers for specific characteristics
    of rotary diamond instruments and diamond-coated discs for use in dentistry. This
    three-digit number forms the fourth group of three digits in the 15-digit overall
    number, the principles of which are explained in ISO 6360-1 and ISO 6360-2. ISO
    6360-4:2004 also gives a three-digit number which in addition to the 15-digit
    code number may be used to provide additional information for diamond instruments
    and diamond-coated discs, at the discretion of the manufacturer. NOTE In addition
    to terms for rotary instruments and accessories used in two of the three official
    ISO languages (English, French and Russian), ISO 6360-4:2004 gives the equivalent
    terms in the German language; these are published under the responsibility of
    the member body for Germany (DIN). However, only the terms given in the official
    languages can be considered as ISO terms.
