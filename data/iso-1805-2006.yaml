abstract:
- language: en
  script: Latn
  content: ISO 1805:2006 specifies a method of testing the breaking force and knot
    breaking force of netting yarns for fishing nets. Tests may be carried out in
    both the dry and wet states, but tests in the wet state on the knotted yarn are
    considered to be particularly appropriate in indicating the behaviour of the yarn
    in use.
