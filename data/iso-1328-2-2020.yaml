abstract:
- language: en
  script: Latn
  content: This document establishes a gear tooth classification system relevant to
    double flank radial composite deviations of individual cylindrical involute gears
    and sector gears. It specifies the appropriate definitions of gear tooth deviations,
    the structure of the gear tooth flank classification system, and the allowable
    values of the gear tooth deviations. It provides formulae to calculate tolerances
    for individual product gears when mated in double flank contact with a master
    gear. Tolerance tables are not included. This document is applicable to gears
    with three or more teeth that have reference diameters of up to 600 mm. This document
    does not provide guidance on gear design nor does it recommend tolerances.
