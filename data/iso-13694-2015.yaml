abstract:
- language: en
  script: Latn
  content: ISO 13694:2015 specifies methods by which the measurement of power [energy]
    density distribution is made and defines parameters for the characterization of
    the spatial properties of laser power [energy] density distribution functions
    at a given plane. The methods given in this International Standard are intended
    to be used for the testing and characterization of both continuous wave (cw) and
    pulsed laser beams used in optics and optical instruments.
