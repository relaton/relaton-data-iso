abstract:
- language: en
  script: Latn
  content: ISO 9599:2015 specifies a gravimetric loss-in-mass method for the determination
    of the hygroscopic moisture content in analysis samples of copper, lead, zinc,
    and nickel sulfide concentrates. The method is applicable to copper, lead, zinc,
    and nickel sulfide concentrates free from volatile organic flotation reagents,
    for example kerosene, and with hygroscopic moisture contents between 0,05 % (m/m)
    and 2 % (m/m). The hygroscopic moisture content is used to correct the analysis
    results from the equilibrated moisture level to the dry basis. NOTE The result
    of the determination of hygroscopic moisture content using this International
    Standard should not be reported as part of the analysis of a concentrate sample.
    Whenever the bulk moisture content of a commercial shipment of concentrate is
    required, ISO 10251 should be used. The determination of hygroscopic moisture
    content and the determination of bulk moisture content are connected with each
    other. In both determinations, the same state of dryness has to be achieved, in
    order to ascertain the correct metal content of a lot. This method is not applicable
    to sulfide concentrates that are susceptible to oxidation (see 6.3, note 2). Annex
    A sets out a modified procedure, which can be used for sulfide concentrates that
    are susceptible to oxidation.
