abstract:
- language: en
  script: Latn
  content: ISO/PAS 20282-4:2007 specifies a test method for measuring the ease of
    installation of consumer products. The purpose of the test is to provide a basis
    for predicting the ease of installation of a consumer product, including measures
    of its effectiveness and efficiency of installation, and the satisfaction of the
    intended user population in the intended context of its use. The method could
    also be applied to maintenance tasks. The intended users of ISO/PAS 20282-4:2007
    are people with human factors expertise in the design and management of appropriate
    tests, including manufacturers, suppliers, purchasing organizations and third
    parties such as consumer organizations.
