abstract:
- language: en
  script: Latn
  content: ISO 11110:2015 specifies the tests and requirements for devices used to
    determine the release moments of ski-bindings in retail sales, rental, and other
    facilities. It specifies requirements for the design accuracy, operation, maintenance,
    and calibration of the test devices used for determining binding release settings.
    For other requirements, see appropriate standards (e.g. standards on electronic
    measuring devices, safety of electrical apparatus, etc.). It is to be used in
    conjunction with ISO 9462 and ISO 8061.
