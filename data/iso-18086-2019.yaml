abstract:
- language: en
  script: Latn
  content: This document specifies protection criteria for determining the AC corrosion
    risk of cathodically protected pipelines. It is applicable to buried cathodically
    protected pipelines that are influenced by AC traction systems and/or AC power
    lines. In the presence of AC interference, the protection criteria given in ISO
    15589-1 are not sufficient to demonstrate that the steel is being protected against
    corrosion. This document provides limits, measurement procedures, mitigation measures,
    and information to deal with long-term AC interference for AC voltages at frequencies
    between 16,7 Hz and 60 Hz and the evaluation of AC corrosion likelihood. This
    document deals with the possibility of AC corrosion of metallic pipelines due
    to AC interferences caused by conductive, inductive or capacitive coupling with
    AC power systems and the maximum tolerable limits of these interference effects.
    It takes into account the fact that this is a long-term effect, which occurs during
    normal operating conditions of the AC power system. This document does not cover
    the safety issues associated with AC voltages on pipelines. These are covered
    in national standards and regulations (see, e.g., EN 50443).
