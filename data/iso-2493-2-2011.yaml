abstract:
- language: en
  script: Latn
  content: ISO 2493-2:2011 specifies procedures to measure the bending resistance
    of paper and paperboard. ISO 2493-2:2011 is used to determine the bending moment
    required to deflect the free end of a 38 mm wide vertically clamped specimen by
    15° when the load is applied at a bending length of 50 mm. For boards that tend
    to be permanently deformed if bent through 15°, the half bending angle, i.e. 7,5°,
    can be used. The bending resistance is expressed in terms of the bending moment
    and parameters set by the manufacturer of the Taber-type tester. The method is
    primarily used for papers with a high grammage.
