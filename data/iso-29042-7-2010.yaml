- language: en
  script: Latn
  content: ISO 29042-7:2010 specifies a test bench method for the measurement of the
    pollutant concentration parameter of a given airborne hazardous substance from
    a machine, using a test bench under specified operating conditions. The method
    is applicable only to the determination of emitted gases, vapours and respirable
    particles.
