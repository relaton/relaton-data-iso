abstract:
- language: en
  script: Latn
  content: This series of standards applies to safety-related systems that include one or more electrical and/or electronic (E/E) systems that use AI technology and that is installed in series production road vehicles, excluding mopeds. It does not address unique E/E systems in special vehicles, such as E/E systems designed for drivers with disabilities. This series of standards addresses the risk of undesired safety-related behaviour at the vehicle level due to AI errors. This part defines the general requirements in order to achieve AI safety. It defines AI technology and application agnostic requirements along with the AI safety lifecycle. This part serves as the foundation for more detailed requirements in subsequent parts, enabling refinement for specific AI methods, such as machine learning, and application examples while supporting future extensions to new AI methods.
