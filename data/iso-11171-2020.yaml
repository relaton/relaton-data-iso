abstract:
- language: en
  script: Latn
  content: 'This document specifies procedures for the following: a) primary particle-sizing
    calibration for particle sizes 1 µm(c) and larger, sensor resolution and counting
    performance of liquid automatic particle counters that are capable of analysing
    bottle samples; b) secondary particle-sizing calibration using suspensions verified
    with a primary calibrated APC; c) establishing acceptable operation and performance
    limits; d) verifying particle sensor performance using a test dust; e) determining
    coincidence and flow rate limits. This document is applicable for use with hydraulic
    fluids, aviation and diesel fuels, engine oil and other petroleum-based fluids.
    This document is not applicable to particle-sizing calibration using NIST SRM
    2806b primary calibration suspensions.'
