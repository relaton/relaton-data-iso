abstract:
- language: en
  script: Latn
  content: This document specifies a calculation procedure for oil-lubricated hydrostatic
    plain thrust bearings, with complete separation of the thrust collar and pad by
    a film of lubricant, used for designing plain thrust bearings that are reliable
    in operation. This document applies to hydrostatic thrust bearings that employ
    constant pressure oil supply systems through linear flow restrictors under steady-state
    operating conditions. It is applicable to steady-state operating conditions, where
    the load magnitude and direction, as well as the rotational speed (if any), remain
    constant. The method can also be applied to thrust bearings operating under constant
    axial force without shaft rotation. Dynamic effects, such as time-varying loads
    due to vibration or pulsating loads, are not considered in this procedure. NOTE
    Equivalent calculation procedures exist for constant flow rate supply hydrostatic
    thrust bearing systems that enable operating conditions to be estimated and checked
    against acceptable conditions. Many of the formulas presented in this document
    are also applicable to such configurations, although the specific procedures are
    not detailed herein. The use of them is equally admissible.
