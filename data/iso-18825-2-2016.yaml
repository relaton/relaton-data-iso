abstract:
- language: en
  script: Latn
  content: ISO 18825-2:2016 defines the terms used to describe the virtual human body
    which is used in virtual garment systems. Specifically, virtual body landmarks
    and virtual body dimensions are described. It mainly deals with vocabulary and
    terminology of essential virtual body dimensions of the virtual torso, arm, leg,
    head, face, hands and bones and joints of virtual human body. Since there are
    many body landmarks on the head and hand, landmarks on these parts are defined
    separately from those on other parts of the body. It is intended for developers
    of virtual garment systems. Although ISO 18825-2:2016 does not aim at users of
    virtual human body in online communication, the improved reliability of virtual
    human body will benefit them.
