abstract:
- language: en
  script: Latn
  content: This document specifies a method for quick measurement of soil temperature
    using an infrared (IR) thermometer. The method is applicable to a variety of technical
    fields, including geology, geotechnics, biology and agricultural sciences, as
    well as climate change studies and metrological investigation. Note             
    The method designated in this document is recognized as a quick measurement in
    ISO 4974 and meets the definition of screening method as designated in ISO 12404:2021,
    3.2.
