abstract:
- language: en
  script: Latn
  content: ISO 12891-2:2014 specifies methods for the analysis of retrieved surgical
    implants. ISO 12891-2:2014 describes the analysis of retrieved metallic, polymeric
    and ceramic implants. The analysis is divided into three stages which are increasingly
    destructive. ISO 12891-2:2014 can also be applied to other materials, e.g. animal
    tissue implants. ISO 12891-2:2014 can be applied in accordance with national regulations
    or legal requirements regarding the handling and analysis of retrieved implants
    and tissues and associated biological material.
