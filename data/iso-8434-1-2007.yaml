abstract:
- language: en
  script: Latn
  content: ISO 8434-1:2007 specifies the general and dimensional requirements for
    24° cone connectors using cutting ring and O‑ring seal cone (referred to as DKO)
    suitable for use with ferrous and non‑ferrous tubes with outside diameters from
    4 mm to 42 mm inclusive. These connectors are for use in fluid power and general
    applications within the limits of pressure and temperature specified in ISO 8434-1:2007.
    It also specifies a performance and qualification test for these connectors.
