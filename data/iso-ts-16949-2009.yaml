abstract:
- language: en
  script: Latn
  content: ISO/TS 16949:2009, in conjunction with ISO 9001:2008, defines the quality
    management system requirements for the design and development, production and,
    when relevant, installation and service of automotive-related products. ISO/TS
    16949:2009 is applicable to sites of the organization where customer-specified
    parts, for production and/or service, are manufactured. Supporting functions,
    whether on-site or remote (such as design centres, corporate headquarters and
    distribution centres), form part of the site audit as they support the site, but
    cannot obtain stand-alone certification to ISO/TS 16949:2009. ISO/TS 16949:2009
    can be applied throughout the automotive supply chain.
