abstract:
- language: en
  script: Latn
  content: This document specifies a method using an extensograph for the determination
    of the rheological properties of wheat flour doughs in an extension test. The
    recorded load–extension curve is used to assess the general quality of flour and
    its response to improving agents. The method is applicable to experimental and
    commercial flours from wheat (Triticum aestivum L.). NOTE 1        This document
    is related to ICC 114[5] and AACC Method 54-10[6]. NOTE 2        For dough preparation,
    a farinograph is used (see 6.2)
