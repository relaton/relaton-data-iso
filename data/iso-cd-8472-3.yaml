abstract:
- language: en
  script: Latn
  content: This document specifies general requirements for database design, development,
    maintenance, update, and evaluation. This document specifies a schema for data
    interoperability of stem cell databases. This document specifies a schema design
    for database developments, including data storage, data sharing, data analysis,
    data exchanging. This document can be used by stem cell database developers, stem
    cell data/system users, those who are generating, sending, receiving or sharing
    stem cell data, as well as information technology specialists focussing on system
    design or maintenance. NOTE International, national or regional regulations or
    requirements, or multiple of them, can also apply to specific topics covered in
    this document.
