abstract:
- language: en
  script: Latn
  content: ISO/PAS 30004:2011 provides general advice on the application of ISO 30000
    and specifications for management systems for safe and environmentally sound ship
    recycling facilities. It explains the underlying principles of ISO 30000 and describes
    the intent, typical inputs, processes and typical outputs for each requirement
    of ISO 30000 to aid understanding and implementation of ISO 30000. ISO/PAS 30004:2011
    does not create additional requirements to those specified in ISO 30000, nor does
    it prescribe mandatory approaches to the implementation of ISO 30000.
