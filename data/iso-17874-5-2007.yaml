abstract:
- language: en
  script: Latn
  content: The purpose of ISO 17874-5:2007 is to provide guidance for the selection,
    installation and use of manually-operated remote handling tongs within nuclear
    installations. ISO 17874-5:2007 covers only the specific engineering aspects of
    manually-operated remote handling tongs and their interfaces with the nuclear
    facilities in which these devices are to be installed. Specifically, ISO 17874-5:2007
    does not address design options concerning aspects such as the process and general
    maintenance arrangements that lead to the selection of any particular type of
    remote handling device.
