abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines on how to implement an eight-stage process to enhance resilience to disruptions arising from emergencies, disasters or crises. It describes how a local resilience partnership can work with members of the public, civil society and business sectors to address needs in society that have been created by a disruption. The process describes how the local resilience partnership can create a local resilience capability that encourages self-help and helping others, while focusing on the needs of priority groups. This document describes: how the local resilience partnership can co-design and create a capability to enhance resilience to disruption; partnerships and establishing a shared vision to enhance societal resilience; risks, vulnerabilities, needs, and community assets; implementation and management of capability; evaluation and continual improvement. This document takes a whole-of-society approach to enhancing resilience by adopting principles and developing systems to support societal networks, organizations (from private, public, and voluntary sectors), community groups, and individuals. This document is applicable to any organization or group involved in enhancing the resilience of society to disruption.'
