abstract:
- language: en
  script: Latn
  content: ISO 10304-1:2007 specifies a method for the determination of dissolved
    bromide, chloride, fluoride, nitrate, nitrite, orthophosphate and sulfate in water,
    e.g. drinking water, ground water, surface water, waste water, leachates and marine
    water by liquid chromatography of ions. The lower limit of application is greater
    than or equal to 0,05 mg/l for bromide and for nitrite, and greater than or equal
    to 0,1 mg/l for chloride, fluoride, nitrate, orthophosphate, and sulfate. The
    lower limit of application depends on the matrix and the interferences encountered.
    The working range may be expanded to lower concentrations (e.g. greater than or
    equal to 0,01 mg/l) if an appropriate pre‑treatment of the sample (e.g. conditions
    for trace analyses, pre‑concentration technique) is applied, and/or if an UV detector
    (for bromide, nitrate and nitrite) is used.
