abstract:
- language: en
  script: Latn
  content: 'This document specifies the test procedures of electronic fee collection
    (EFC) roadside equipment (RSE) and on-board equipment (OBE) with regard to the
    conformance to standards and requirements for type approval and acceptance testing
    which is within the realm of EFC application specifically. The scope of this document
    is restricted to systems operating within the radio emission, electromagnetic
    compatibility (EMC) regulations, traffic, and other regulations of the countries
    in which they are operated. This document identifies a set of suitable parameters
    and provides test procedures to enable the proof of a complete EFC system, as
    well as components of an EFC system, e.g. OBE, related to the defined requirements
    of an application. The defined parameter and tests are assigned to the following
    groups of parameters: — functionality; — quality; — referenced pre-tests. An overview
    of the tests and parameters provided by this document is given in 5.1 and 5.2.
    This document describes procedures, methods and tools, and a test plan which shows
    the relation between all tests and the sequence of these tests. It lists all tests
    that are required to measure the performance of EFC equipment. It describes which
    EFC equipment is covered by the test procedures; the values of the parameters
    to be tested are not included. It also describes how the tests are to be performed
    and which tools and prerequisites are necessary before this series of tests can
    be undertaken. It is assumed that the security of the system is inherent in the
    communications and EFC functionality tests, therefore they are not addressed here.
    All tests in this document provide instructions to evaluate the test results.
    This document defines only the tests and test procedures, not the benchmark figures
    that these are to be measured against. The test procedures defined in this document
    can be used as input, e.g. by scheme owners, for prototype testing, type approvals,
    tests of installations and periodic inspections. Related to a conceptual model
    of an EFC system, this document relates only to the equipment of the user and
    the service provider. Any other entities are outside the scope of document. EFC
    systems for dedicated short-range communication (DSRC) consist, in principle,
    of a group of technical components, which in combination fulfil the functions
    required for the collection of fees by electronic automatic means. These components
    comprise all, or most, of the following: — OBE within a vehicle; — OBE containing
    the communications and computing sub-functions; — optional integrated circuit
    card which may carry electronic money, service rights, and other secured information;
    — communication between OBE and RSE based on DSRC; — equipment for the fee collection
    at the RSE containing the communications and computing sub-functions; — equipment
    for the enforcement at the roadside; — central equipment for the administration
    and operation of the system. The scope of this document relates solely to OBE
    and RSE and the DSRC interface between OBE and RSE including its functions to
    perform the fee collection. All the equipment used for enforcement (e.g. detection,
    classification, localization, and registration) and central equipment are outside
    the scope of this document.'
