abstract:
- language: en
  script: Latn
  content: This document establishes the specifications for the company code as a
    unique code space for cutting tool data representation and exchange. It specifies
    the construction of the company codes, the rules for assignment, the use of metadata
    to be associated with the company codes allocation, and the administration of
    the company codes. A company code is only used in the connection code as defined
    by ISO/TS 13399-60. NOTE 1        The use of the company code is illustrated in
    Annex B.
