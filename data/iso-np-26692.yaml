abstract:
- language: en
  script: Latn
  content: This document provides guidelines for the handling, identification, collection,
    acquisition, and preservation of digital evidence derived from blockchain and
    distributed ledger technologies. It addresses the unique properties and challenges
    of these technologies and offers detailed procedures for ensuring the integrity,
    traceability authenticity, and reliability of such digital evidence. The standard
    covers technical foundations and processes such as chain of custody, verification
    of blockchain data, tools and techniques for evidence extraction, and methods
    to maintain evidential integrity and reliability, ensuring evidence admissibility
    in legal proceedings, disciplinary actions, and other relevant contexts.
