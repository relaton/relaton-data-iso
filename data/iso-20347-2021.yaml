abstract:
- language: en
  script: Latn
  content: This document specifies basic and additional (optional) requirements for
    occupational footwear used for general purpose. It includes, for example, mechanical
    risks, slip resistance, thermal risks, ergonomic behaviour. It also specifies
    requirements for occupational footwear equipped with customized insocks, customized
    occupational footwear or individual manufactured customized occupational footwear.
    This standard does not cover the property of high visibility because of interaction
    with the clothing (e.g. trousers cover the footwear) and work area conditions
    (e.g. dirt, mud). Special risks are covered by complementary job-related standards
    (e.g. footwear for firefighters, electrical insulating footwear, protection against
    chain saw injuries, protection against chemicals and against molten metal splash,
    protection for motorcycle riders).
