abstract:
- language: en
  script: Latn
  content: ISO 12931:2012 specifies performance criteria and evaluation methodology
    for authentication solutions used to establish material good authenticity throughout
    the entire material good life cycle. It does not specify how technical solutions
    achieve these performance criteria. ISO 12931:2012 is intended for all types and
    sizes of organizations that require the ability to validate the authenticity of
    material goods. It is intended to guide such organizations in the determination
    of the categories of authentication elements they need to combat those risks,
    and the criteria for selection of authentication elements that provide those categories,
    having undertaken a counterfeiting risk analysis. Such authentication elements
    can be part of the material good itself and/or its packaging. The criteria applies
    to the material good and/or its packaging.
