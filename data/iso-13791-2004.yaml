abstract:
- language: en
  script: Latn
  content: ISO 13791:2004 specifies the assumptions, boundary conditions, equations
    and validation tests for a calculation procedure, under transient hourly conditions,
    of the internal temperatures (air and operative) during the warm period, of a
    single room without any cooling/heating equipment in operation. No specific numerical
    techniques are imposed by this standard. Validation tests are included. An example
    of a solution technique is given in Annex A. ISO 13791:2004 does not contain sufficient
    information for defining a procedure able to determine the internal conditions
    of special zones such as attached sun spaces, atria, indirect passive solar components
    (Trombe walls, solar panels) and zones in which the solar radiation may pass through
    the room. For such situations different assumptions and more detailed solution
    models are needed.
