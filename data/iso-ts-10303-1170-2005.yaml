abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1170:2005 specifies the application module for Class of activity
    structure. The following are within the scope of ISO/TS 10303-1170:2005: the existence
    of a class of activity;a mapping between one class of activity and another that
    indicates the nature of a whole-part relationship between two individual activities;a
    mapping between one class of activity and another that indicates the nature of
    a connection relationship between two individual activities;a mapping between
    a class of activity and a class of product, document, organization or person that
    indicates the nature of an involvement in an activity.'
