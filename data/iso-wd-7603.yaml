abstract:
- language: en
  script: Latn
  content: A standard for the design and use of decentralized and self-sovereign identification
    of subjects (legal entities and natural persons) and objects, assets within the
    design of Blockchain and DLT Systems, in conjunction with Verifiable Credentials
    (VCs). The standard will refer to available identification standards from ISO
    as well as other standardization bodies, such as W3C, GLEIF, IETF, ITU, IEEE,
    etc. and non-standardization global consortiums, such as DIF, TOIP, and the Kantara
    Initiative. Purpose is to support developers to deliver cost and time efficient
    development of high quality Blockchain and DLT systems for managing identity across
    a defined architectural stack. To create awareness of available standards of subjects
    (legal entities and natural persons) and objects and to give an overview of existing
    identifier standards.
