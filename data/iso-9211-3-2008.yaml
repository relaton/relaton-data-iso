abstract:
- language: en
  script: Latn
  content: ISO 9211 identifies surface treatments of components and substrates excluding
    ophthalmic optics (spectacles) by the application of optical coatings and gives
    a standard form for their specification. It defines the general characteristics
    and the test and measurement methods whenever necessary. It is not intended to
    define the process method. ISO 9211-3:2008 specifies categories of use for optical
    coatings and identifies which environmental tests are necessary to prove that
    the coatings meet the required specification.
