abstract:
- language: en
  script: Latn
  content: ISO 16641:2014 covers integrated measurement techniques for radon-220 with
    passive sampling only. It provides information on measuring the average activity
    concentration of radon-220 in the air, based on easy-to-use and low-cost passive
    sampling, and the conditions of use for the measuring devices. ISO 16641:2014
    covers samples taken without interruption over periods varying from a few months
    to one year.
