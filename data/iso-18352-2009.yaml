abstract:
- language: en
  script: Latn
  content: ISO 18352:2009 specifies a method for determining the residual compression
    strength of multidirectional polymer matrix composite laminate plates that have
    been damaged by impact prior to the application of in-plane compressive loading.
    The test method is suitable for continuous-fibre-reinforced polymer matrix composites.
    Application of the method is limited to fibre-reinforced plastic laminates with
    multidirectional reinforcements manufactured from unidirectional prepreg tapes/fabrics
    or woven fabrics. The test method is referred to as the compression-after-impact
    (CAI) test when used to determine the residual compression strength of an impacted
    plate. It can be used to obtain data for material specification, material evaluation,
    research and development, or construction of a composite database.
