abstract:
- language: en
  script: Latn
  content: 'This document specifies how to use the Portable Document Format (PDF)
    specified in ISO 32000-2 to construct accessible digital documents using PDF technology.
    This document does not specify: —    processes for converting paper or electronic
    documents to the PDF/UA format; —    technical design, user interface, implementation,
    or operational details of presentation; —    physical methods of storing these
    documents such as media and storage conditions; —    required computer hardware
    and/or operating systems; —    requirements specific to content (beyond facilitating
    programmatic access and textual representation); —    requirements applying to
    specific classes (e.g. invoices, reports, etc.) of documents.'
