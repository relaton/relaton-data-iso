abstract:
- language: en
  script: Latn
  content: ISO 18323:2015 specifies a set of permitted descriptors for the diamond
    industry and is specifically designed to be understood by the consumer. The Standard
    also includes a series of definitions which aim to provide further clarity for
    traders and maintain consumer confidence in the diamond industry as a whole. ISO
    18323:2015 will cover the nomenclature to be used by those involved in the buying
    and selling of diamonds, treated diamonds, synthetic diamonds, composite diamonds
    and imitations of diamonds.
