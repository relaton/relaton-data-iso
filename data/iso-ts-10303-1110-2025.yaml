abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1110 specifies the application module for Surface conditions.
    The following are within the scope of ISO/TS 10303-1110: Coating layer; Contact_ratio;
    Hardness; Association of a Surface condition with a shape; surface irregularities
    such as roughness and waviness; Tactile appearance; Treatment result; Visual appearance;
    items within the scope of application module Dimension tolerance, ISO/TS 10303-1050;
    items within the scope of application module Generic material aspects, ISO/TS
    10303-1681; items within the scope of application module Part view definition,
    ISO/TS 10303-1023; items within the scope of application module Value with unit
    extension, ISO/TS 10303-1753.'
