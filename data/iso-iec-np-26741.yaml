abstract:
- language: en
  script: Latn
  content: 'This document describes a generic framework for describing and characterizing
    an AI system as an object of conformity assessment. It specifies requirements
    and provides guidance for the consistent application of this framework in support
    of all types of conformity assessment activities. The framework provides structured
    elements for describing relevant characteristics of an AI system, including system
    boundaries, intended purpose, operational context, and other attributes necessary
    to enable transparent evaluation against the requirements for which conformity
    is to be achieved. This document does not define conformity assessment procedures.
    It does not replace or modify existing conformity assessment or sector-specific
    standards. The document is applicable to AI systems as defined in ISO/IEC 22989.
    The extent of the application of the document depends on the specific requirements
    and context of the conformity assessment. Note: It can be used within 1st party,
    2nd party, 3rd party conformity assessment system.'
