abstract:
- language: en
  script: Latn
  content: This document specifies a test method for measuring reduction activity
    of plastic and other non-porous products against specific proteins which show
    antigen-antibody reaction. This document only specifies the reduction activity
    against those proteins on the surface of plastics and other non-porous products.
    It does not specify a testing method to evaluate the allergenic reaction against
    human beings. Specific proteins which show antigen-antibody reaction are proteins
    derived from pollen, mite and other sources. Enzyme-linked immunosorbent assay
    (ELISA) is used to quantify the amount of those proteins. This method is applicable
    to non-porous materials.
