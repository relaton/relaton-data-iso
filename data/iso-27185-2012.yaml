abstract:
- language: en
  script: Latn
  content: ISO 27185:2011 specifies requirements for the use of symbols conveying
    information on the safe and effective use of cardiac rhythm management medical
    devices. A listing is given of existing symbols that comply with the requirements
    of ISO 27185:2011. ISO 27185:2011 is applicable to, and limited to, symbols for
    cardiac rhythm management medical devices that can be marketed globally. These
    symbols can be used on the devices themselves or their labelling.
