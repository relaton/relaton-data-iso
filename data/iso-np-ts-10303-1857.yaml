abstract:
- language: en
  script: Latn
  content: Various types of attribute data are widely used in the manufacturing industry.
    The standardization of the attribute data and the equivalence check of the two
    attribute data sets are key concerns for the manufacturing industry. As an initial
    step for challenging this issue, this standard aims at the equivalence validation
    of two display attribute data sets such as colour, visibility, and transparency.
