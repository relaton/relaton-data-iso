abstract:
- language: en
  script: Latn
  content: ISO 10303-45:2008 specifies the integrated generic resources to describe
    the values of the material and other engineering properties of products, as well
    as the conditions in which these property values are valid. 10303-45:2008 also
    includes the resource constructs for describing the composition of products. Property
    and composition values can be identified either as a numerical value or as a mathematical
    function. Numeric values and values as mathematical functions can be further characterized
    as to their type, precision and uncertainty.
