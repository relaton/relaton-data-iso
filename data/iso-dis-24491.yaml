abstract:
- language: en
  script: Latn
  content: 'This document specifies: —the requirements on seats that are fixed to
    the carbody, —the requirements and mechanical performance for passenger seats.
    This document applies to newly developed passenger seats and newly developed passenger
    seat components installed in mainline passenger railway vehicles. This document
    does not apply to trams and metros. This document does not specify: —the structural
    performance for perch seats, —the requirements for the installation of seats to
    the carbody structure, —the requirements for the aesthetics for passenger seats,
    —the ergonomics or comfort performance for passenger seats, —the requirements
    for interior passive crash safety and dynamic structural integrity for passenger
    seats.'
