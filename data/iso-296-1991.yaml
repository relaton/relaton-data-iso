abstract:
- language: en
  script: Latn
  content: This second edition cancels and replaces the first edition (ISO 296:1974).
    Specifies the dimensions of tapers for general use, smaller and larger tapers.
    The standard sizes of these tapers are given in table 2 (in millimetres) and table
    3 (in inches), respectively. Provides for those elements which are threaded, two
    entirely distinct types of product according to the type of thread, M or UNC (see
    figures in clause 4).
