abstract:
- language: en
  script: Latn
  content: This International Standard specifies methods for determining the thickness,
    bulk density, resilience, permanent linear change on heating, thermal conductivity,
    tensile strength and shot content of ceramic fibre products. It applies to ceramic
    fibre bulk, blankets, felts, mats, boards, papers and pre-formed shapes with the
    exception of products delivered in a wet state. The application of the individual
    test methods is given in table 1, with reference to the type of products.
