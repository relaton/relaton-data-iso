abstract:
- language: en
  script: Latn
  content: 'This document defines detailed use-cases, requirements and message specifications
    for registration of indoor maps and indoor positioning references to the central
    ITS station (C-ITS-S). This document defines: a)use-cases and requirements for
    registration of the indoor maps and indoor positioning references data to support
    indoor navigation functionality. b) message specifications for registration of
    the indoor maps and indoor positioning references data regarding with the defined
    use-cases and requirements. - The specifications include the data model and encoding
    of messages for registering the indoor maps and indoor positioning references
    data'
