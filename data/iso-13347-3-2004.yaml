abstract:
- language: en
  script: Latn
  content: ISO 13347-3:2004 applies to industrial fans as defined in ISO 5801 and
    ISO 13349. It is limited to the determination of airborne sound emission for the
    specified set-ups. Vibration is not measured, nor is the sensitivity of airborne
    sound emission to vibration effects determined. The sizes of fan which can be
    tested in accordance with ISO 13347-3:2004 are limited only by the practical aspects
    of the test set-up. Dimensional limitations, test fan dimensions, and air performance
    will control the room size, power and mounting requirements for the test fan.
    The test arrangements in ISO 13347-3:2004 establish the laboratory conditions
    necessary for a successful test. Rarely will it be possible to meet these requirements
    in situ and ISO 13347-3:2004 is not intended for field measurements. Intending
    users are reminded that, in these situations, there may well be additional acoustic
    system effects where inlet and outlet conditions at the fan are less than ideal.
    The enveloping surface methods may be used for the determination of open inlet
    and/or open outlet sound power level of fans for standardized installation types.
    An estimation (with increased uncertainty) of ducted sound power for fans too
    small, or otherwise inconvenient, for testing by the in-duct method described
    in ISO 5136 may also be obtained by the addition of end reflection corrections.
