abstract:
- language: en
  script: Latn
  content: This document defines terms and specifies general test requirements for
    circuit breakers for use in road vehicles with a nominal voltage of 12 V (DC),
    24 V (DC), 48 V (DC) and 450 V (DC). This document is intended to be used in conjunction
    with ISO 10924-2, ISO 10924-3, ISO 10924-4 and ISO 10924-5. The numbering of its
    clauses corresponds to that of the document whose requirements are applicable,
    except where modified by requirements particular to this document. This document
    is not applicable to circuit breaker holders (electrical centres or fuse-holders)
    used in vehicles.
