abstract:
- language: en
  script: Latn
  content: This document specifies the test methods and required results for the ISO
    25750 Secured ship network (SSN). ISO 25750 is the first international standard
    using IPv6 Ethernet standard and secured ship network using authentication, data
    integrity check and data encryption/decryption by TLS/DTLS v1.3 over the Fast
    Ethernet standard of 10Gbps or 100Gbps band width to collect data and information
    from bridge, engine room, cargo area and every spaces for ship safe navigation
    and security. This document specified test methods and required results in following
    important sections to be satisfied the requirements of ISO 25750 standard. Test
    methods and required results for using IPv6 Ethernet protocol Test methods and
    required results for application information and service announcement Test methods
    and required results for transmitting ISO SSD (smart ship datagram) by IPV6 Test
    methods and required results for interoperability with adopted IPv4 legacy standards
    Test methods and required results for procedure to move to security mode and
    back to open mode Test methods and required results for transmitting encapsulating
    security payload(ESP) Security on board has become vital, especially in smart
    and autonomous ships. This document specifies how to test to build up security
    in data acquisition through the network by authentication, integrity checking
    and confidentiality by utilizing recent encryption algorithms and IPv6 Fast Ethernet.
