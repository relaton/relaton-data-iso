abstract:
- language: en
  script: Latn
  content: 'The symbols system is intended for simplifying the preparation of diagrams
    of products in all branches of industry and is to be used in technical documentation
    as well as in technical and educational literature. This part contains the following:
    Motion of links of mechanisms, kinematic pairs, links and connections of their
    components, and N-bar linkages and their components.'
