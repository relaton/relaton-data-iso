abstract:
- language: en
  script: Latn
  content: ISO 8256:2004 specifies two methods (method A and method B) for the determination
    of the tensile-impact strength of plastics under defined conditions. The tests
    can be described as tensile tests at relatively high strain rates. These methods
    can be used for rigid materials (as defined in ISO 472), but are especially useful
    for materials too flexible or too thin to be tested with impact tests conforming
    to ISO 179 or ISO 180. These methods are used for investigating the behaviour
    of specified specimens under specified impact velocities, and for estimating the
    brittleness or the toughness of specimens within the limitations inherent in the
    test conditions. These methods are applicable both to specimens prepared from
    moulding materials and to specimens taken from finished or semi-finished products
    (for example mouldings, films, laminates, or extruded or cast sheets). Results
    obtained by testing moulded specimens of different dimensions may not necessarily
    be the same. Equally, specimens cut from moulded products may not give the same
    results as specimens of the same dimensions moulded directly from the material.
    Test results obtained from specimens prepared from moulding compounds cannot be
    applied directly to mouldings of any given shape, because values may depend on
    the design of the moulding and the moulding conditions. Results obtained by method
    A and method B may or may not be comparable. These methods are not suitable for
    use as a source of data for design calculations on components. Information on
    the typical behaviour of a material can be obtained, however, by testing different
    types of test specimen prepared under different conditions, and by testing at
    different temperatures. The two different methods are suitable for production
    control as well as for quality control.
