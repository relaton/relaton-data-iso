abstract:
- language: en
  script: Latn
  content: This document provides the terms and definitions for breeding and farming
    of triploid oysters, and specifies the technical requirements for germplasm development
    and seed production of triploid and tetraploid oysters. It covers breeding facilities
    and environmental conditions, broodstock selection and maintenance, gamete collection
    and handling, polyploid induction techniques, hybrid breeding techniques, incubation
    management, and ploidy determination methods. This document is applicable to triploid
    and tetraploid seed production, seed propagation, and farming of oysters belonging
    to the Crassostrea and Magallana. Seed production of other oyster species may
    refer to this document.
