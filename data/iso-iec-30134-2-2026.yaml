abstract:
- language: en
  script: Latn
  content: 'This document specifies power usage effectiveness (PUE) as a key performance
    indicator (KPI) to quantify the efficient use of energy. This document: defines
    the PUE of a data centre; introduces PUE measurement categories; describes the
    relationship of this KPI to a data centre’s infrastructure, information technology
    equipment and information technology operations; defines the measurement, the
    calculation and the reporting of the parameter; provides information on the correct
    interpretation of the PUE. PUE derivatives are described in Clause 9.'
