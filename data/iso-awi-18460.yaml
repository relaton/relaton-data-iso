abstract:
- language: en
  script: Latn
  content: 'This Type C Standard specifies safety requirements and their verification
    for autonomous combustion-engine-powered lawnmowers and equipped with: — metallic
    cutting means; and/or — non-metallic cutting means with one or more cutting elements
    pivotally mounted on a generally circular drive unit, where these cutting elements
    rely on centrifugal force to achieve cutting and have a kinetic energy for each
    single cutting element of 10 J or more. This document deals with the significant
    hazards, hazardous situations, and events relevant to lawnmowers with autonomous
    functions when used as intended and under the conditions of misuse foreseeable
    by the manufacturer during normal operation and service. This standard does not
    apply to: — travel on public roads; — grassland mowers; — sickle bar mowers; —
    scrub-clearing machines; — automatic docking and refueling systems. This International
    Standard is neither applicable to machines which were manufactured with an auto-guidance
    system, nor to self-contained auto-guidance retrofit systems which were placed
    on the market before the date of this International Standard.'
