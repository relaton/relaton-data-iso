abstract:
- language: en
  script: Latn
  content: 'This project will specify the governance model for DAOs regarding three
    facets; IN CHAIN FACET: infrastructure level, where DAO membership requires an
    entity to only run a node of the DLT network (e.g. join a permissioned DLT network).
    ON CHAIN FACET: transaction and smart contract level, where DAO membership requires
    an entity to interact with a specific smart contract, or send specific transactions
    (e.g. register with a particular smart contract). OFF CHAIN FACET: non DLT system
    level, where DAO membership requires an entity to perform additional non-DLT activities
    (e.g. protect data privacy). The three facets can be used individually or as a
    blend in any variation for completeness as the minimum governance.'
