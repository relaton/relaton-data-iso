abstract:
- language: en
  script: Latn
  content: 'ISO 2307:2004 specifies, for ropes of different kinds, a method of determining
    each of the following characteristics: linear density, lay length, braided pitch,
    elongation, and breaking force. The linear density, lay length and braided pitch
    are measured with the rope under a specified tension called the reference tension.
    ISO 2307:2004 also provides a method for measuring water repellency, lubrication
    and finish content and heat setting treatment when requested by the customer.'
