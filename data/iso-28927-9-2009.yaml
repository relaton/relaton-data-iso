abstract:
- language: en
  script: Latn
  content: ISO 28927-9:2009 specifies a laboratory method for measuring hand-transmitted
    vibration emission at the handles of hand-held, power-driven scaling hammers and
    needle scalers. It is a type-test procedure for establishing the magnitude of
    vibration in the gripping areas of a machine run under specified test conditions.
    It is intended that the results be used to compare different models of the same
    type of machine. ISO 28927-9:2009 is applicable to engraving pens, scabblers,
    scaling hammers and needle scalers, driven pneumatically or by other means, intended
    for paint, rust or scale removal with reciprocating work tools or needles and
    for all kinds of materials.
