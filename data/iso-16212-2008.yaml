abstract:
- language: en
  script: Latn
  content: ISO 16212:2008 gives general guidelines for enumeration of yeast and mould
    present in cosmetics, by counting the colonies on selective agar medium after
    aerobic incubation. In order to ensure product quality and safety for consumers,
    it is advisable to perform an appropriate microbiological risk analysis, so as
    to determine the types of cosmetic products to which ISO 16212:2008 is applicable.
    Products considered to present a low microbiological risk include those with low
    water activity, hydro-alcoholic products, extreme pH values, etc.
