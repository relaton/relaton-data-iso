abstract:
- language: en
  script: Latn
  content: This document specifies a method of test for the slip resistance of PPE
    footwear. It is not applicable to special purpose footwear containing spikes,
    metal studs or similar. Footwear claiming ?slip resistance' would be deemed an
    item of personal protective equipment. NOTE For product development purposes,
    sole units, outsoles or other soling components such as top pieces may be tested.
