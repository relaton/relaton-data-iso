abstract:
- language: en
  script: Latn
  content: ISO 6980-2:2004 specifies methods for the measurement of the directional
    absorbed-dose rate in a tissue-equivalent slab phantom in the ISO 6980 reference
    beta-particle radiation fields. The energy range of the beta-particle-emitting
    isotopes covered by these reference radiations is 0,066 to 3,54 MeV (maximum energy).
    Radiation energies outside this range are beyond the scope of this standard. While
    measurements in a reference geometry (depth of 0,07 mm at perpendicular incidence
    in a tissue-equivalent slab phantom) with a reference class extrapolation chamber
    are dealt with in detail, the use of other measurement systems and measurements
    in other geometries are also described, although in less detail. The ambient dose
    equivalent, H*(10) as used for area monitoring of strongly penetrating radiation
    is not an appropriate quantity for any beta radiation, even for that penetrating
    a 10 mm thick layer of ICRU tissue (i.e. Emax greater than 2 MeV). If adequate
    protection is provided at 0,07 mm, only rarely will one be concerned with other
    depths, for example 3 mm. ISO 6980-2:2004 is geared towards organizations wishing
    to establish reference-class dosimetry capabilities for beta particles, and serves
    as a guide to the performance of dosimetry with the reference class extrapolation
    chamber for beta-particle dosimetry in other fields. Guidance is also provided
    on the statement of measurement uncertainties.
