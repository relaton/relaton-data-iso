abstract:
- language: en
  script: Latn
  content: ISO 11452-11:2010 specifies a reverberation chamber method for testing
    the immunity (off-vehicle radiation source) of electronic components for passenger
    cars and commercial vehicles, regardless of the propulsion system (i.e. spark-ignition
    engine, diesel engine, electric motor). The device under test (DUT), together
    with the wiring harness (prototype or standard test harness), is subjected to
    an electromagnetic disturbance generated inside the reverberation chamber, with
    peripheral devices either inside or outside the chamber. It is applicable to disturbances
    from continuous narrowband electromagnetic fields. The test is performed using
    the tuned mode method.
