abstract:
- language: en
  script: Latn
  content: 'The test is principally intended for packages which are waterproof or
    which are intended to provide some degree of "waterproofness". The test is performed
    on the package as prepared for transport and may form part of a test sequence.
    Principle: Conditioning of the package, followed by complete immersion in water,
    removal and draining and drying in the conditioning atmosphere. The time of immersion,
    time of draining and drying and the atmospheric conditions are predetermined.'
