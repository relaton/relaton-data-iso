abstract:
- language: en
  script: Latn
  content: ISO 16474-2:2013 specifies methods for exposing specimens to xenon-arc
    light in the presence of moisture to reproduce the weathering effects that occur
    when materials are exposed in actual end-use environments to daylight or to daylight
    filtered through window glass. The specimens are exposed to filtered xenon-arc
    light under controlled conditions (temperature, humidity and/or wetting). Various
    types of xenon-arc lamps and various filter combinations may be used to meet all
    the requirements for testing different materials. Specimen preparation and evaluation
    of the results are covered in other International Standards for specific materials.
    General guidance is given in ISO 16474‑1. Xenon-arc exposures for plastics are
    described in ISO 4892‑2.
