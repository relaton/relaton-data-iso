abstract:
- language: en
  script: Latn
  content: 'This document specifies the most common nominal dimensions, in millimetres,
    of: —    shape type 41: flat cutting-off wheel; —    shape type 42: depressed
    centre cutting-off wheel. These bonded abrasive products are intended to be used
    for cutting‑off of any workpiece using hand-held power tools (e.g. angle grinders
    and straight grinders). In this application, the workpiece is fixed and the hand-held
    power tool is guided by the operator. This document does not specify limit deviations
    and run‑out tolerances, which are given in ISO 13942.'
