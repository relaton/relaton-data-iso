abstract:
- language: en
  script: Latn
  content: This document specifies the conditions for obtaining reproducible and comparable
    measurement results of the airborne sound emitted by vessels of all kinds, on
    inland waterways and in ports and harbours, except powered recreational craft
    as specified in the ISO 14509 series. This document is applicable to sea-going
    vessels, harbour vessels, dredgers, and all watercraft, including non-displacement
    craft, used or capable of being used as a means of transport on water. There are
    no limitations to the application of this document with regard to speed, length
    and height of vessels, as long as the ship is determined to act like a point source
    at the reference distance of 25 m. All noise data obtained in accordance with
    this document are referred to a reference distance of 25 m.
