abstract:
- language: en
  script: Latn
  content: 'This part of ISO 13584 specifies a supplier code to identify the information
    suppliers of the contents of a library and, when the content of this library was
    provided in a standard document, a code that identifies this standard document.
    The following are within the scope of this part of ISO 13584: — a code to identify
    the supplier of information contained in a parts library, and — a code to identify
    a standard document when the content of a parts library are defined in a standard
    document. The following is outside the scope of this part of ISO 13584: — a code
    to identify the supplier of a part. NOTE The supplier code enables the user of
    a library to trace the supplier of any information about a part that has an entry
    in the library and to trace the data given by a particular information supplier.'
