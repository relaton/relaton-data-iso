abstract:
- language: en
  script: Latn
  content: Defines the various terms employed in the calculation of metered petroleum
    quantities. Also specifies the equations which allow the values of correction
    factors to be computed. Also gives rules for the sequence, rounding and significant
    figures to be employed in a calculation. Provides tables which may be used to
    look up specific correction factors should it not be desired to calculate them
    by manual as well as computer methods. The field of application is the volumetric
    measurement of liquid hydrocarbons, including liquefied petroleum gases, by meter
    and prover. It does not include two-phase fluids.
