abstract:
- language: en
  script: Latn
  content: ISO 6246:2017 specifies a method for determining the existent gum content
    of aviation fuels and the gum content of motor gasoline or other volatile distillates.
    It includes the determination of products containing ethanol (up to a volume fraction
    of 85 %) and ether-type oxygenates and deposit control additives. For determination
    of gum content in automotive ethanol (E85) fuel, no precision data is available
    (see 14.1). For non-aviation fuels, a procedure for the determination of the heptane-insoluble
    portion of the residue is also described.
