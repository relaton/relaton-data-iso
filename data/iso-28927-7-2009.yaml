abstract:
- language: en
  script: Latn
  content: ISO 28927-7:2009 specifies a laboratory method for measuring hand-transmitted
    vibration emission at the handles of hand-held, power-driven nibblers and shears.
    It is a type-test procedure for establishing the magnitude of vibration in the
    gripping areas of a machine run under specified test conditions. It is intended
    that the results be used to compare different models of the same type of machine.
    ISO 28927-7:2009 is applicable to nibblers and shears, driven pneumatically or
    by other means, intended for cutting sheet metal or composite materials.
