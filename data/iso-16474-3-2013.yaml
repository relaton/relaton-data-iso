abstract:
- language: en
  script: Latn
  content: ISO 16474-3:2013 specifies methods for exposing coatings to fluorescent
    UV lamps, heat and water in apparatus designed to reproduce the weathering effects
    that occur when materials are exposed in actual end-use environments to daylight,
    or to daylight through window glass. The coatings are exposed to different types
    of fluorescent UV lamps under controlled environmental conditions (temperature,
    humidity and/or water). Different types of fluorescent UV lamp may be used to
    meet all the requirements for testing different materials. Specimen preparation
    and evaluation of the results are covered in other ISO documents for specific
    materials. General guidance is given in ISO 16474‑1. Fluorescent UV lamp exposures
    for plastics are described in ISO 4892‑3.
