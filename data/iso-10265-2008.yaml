abstract:
- language: en
  script: Latn
  content: ISO 10265:2008 specifies minimum performance criteria and test methods
    to enable uniform assessment of the service, secondary and parking brake systems
    of crawler machines. It is applicable to self-propelled crawler machines, as defined
    in ISO 6165 including derivative earth-moving machines with rubber tracks, with
    a maximum design speed of 20 km/h or less. This International Standard does not
    cover those machines that fall under ISO 17063 or wheeled machines equipped with
    over-the-tyre tracks. Crawler machines with maximum design speed greater than
    20 km/h conform to ISO 3450.
