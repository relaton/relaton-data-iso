abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1645:2006 specifies the application module for Assembly module
    with packaged connector component. The following are within the scope of ISO/TS
    10303-1645:2006: assembly physical design; detailed specification of joined features
    of components in the design; detailed traceability of design requirements; as
    designed implementation of connection requirement; shape of assembly design; configuration
    management of assembly design; in-process change management of assembly design;
    connectors used as components in the assembly; items within the scope of application
    module Assembly module design, ISO/TS 10303-1636; items within the scope of application
    module Interface component, ISO/TS 10303-1691.'
