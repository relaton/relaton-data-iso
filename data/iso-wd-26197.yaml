abstract:
- language: en
  script: Latn
  content: This document specifies the performance indicators for innovative logistics,
    including indicator names, explanations, and measurement. This document is applicable
    to logistics services. Different users can select indicators from this document
    to establish indicator systems based on their respective needs. The application
    of this document is beneficial for logistics industry to address the challenges
    of traditional supply chain and logistics. It also enables logistics service providers
    to create more flexibility and agility in their processes to respond more quickly
    to customers and market needs. And this document is not intended to exclude the
    use of any performance indicators which have not been specified herein.
