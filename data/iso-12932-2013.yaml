abstract:
- language: en
  script: Latn
  content: ISO 12932:2013 specifies quality levels of imperfections in laser-arc hybrid
    welded joints for all types of steel, nickel and its alloys. It applies to material
    thickness ≥0,5 mm. Three quality levels are given in order to permit application
    for a wide range of welded fabrication. They are designated by B, C and D. Quality
    level B corresponds to the highest requirement on the finished weld. The quality
    levels refer to production quality and not to the fitness-for-purpose of the product
    manufactured.
