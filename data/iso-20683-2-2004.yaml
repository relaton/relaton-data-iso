abstract:
- language: en
  script: Latn
  content: ISO 20683-2:2004 is applicable to towbarless aircraft towing vehicles (TLTVs)
    interfacing with the nose-landing gear of civil transport aircraft with a maximum
    ramp mass comprised between 10 000 kg and 50 000 kg (22 000 lb and 110 000 lb),
    commonly designated as "regional aircraft". The requirements for main line transport
    aircraft with a higher maximum ramp mass are specified in ISO 20683-1, which is
    not applicable to TLTVs which were manufactured before its date of publication.
    ISO 20683-2:2004 specifies general design requirements, testing and evaluation
    requirements, maintenance, calibration, documentation, records, tracing and accountability
    requirements in order to ensure that the loads induced by the tow vehicle not
    exceed the design loads of the nose gear or its steering system, or reduce the
    certified safe life limit of the nose gear, or induce a stability problem during
    aircraft push back and/or maintenance towing operations. ISO 20683-2:2004 specifies
    requirements and procedures for towbarless tow vehicles (TLTVs) intended for aircraft
    push-back and gate relocation or maintenance towing only. It is not intended to
    allow for dispatch (operational) towing. Dispatch towing imposes greater loads
    on nose gears and aircraft structure due to the combination of speed and additional
    passenger, cargo, and fuel loads. ISO 20683-2:2004 does not apply to towbarless
    towing vehicles interfacing with aircraft main landing gear.
