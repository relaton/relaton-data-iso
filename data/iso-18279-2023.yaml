abstract:
- language: en
  script: Latn
  content: This document details a classification of imperfections that can occur
    in brazing joints. In addition, guidance is provided on quality levels and suggested
    limits for imperfections are detailed. For requirements not covered by this document,
    reference can be made to other sources, such as statutory regulations, codes of
    practice and technical delivery conditions. No information is given on how imperfections
    are to be assessed in individual cases because this depends on the requirements
    for the particular brazed joint. These imperfections are not always detectable
    by the use of non-destructive testing alone. This document covers only imperfections
    that can occur in connection with brazing without the effect of any additional
    service loads. Only the type, shape and position of such imperfections are covered;
    no indication is given of the conditions of occurrence or causes. For requirements
    for brazed joints which are relevant and essential to the particular function
    of the component, reference can be made to the relevant documentation, for example
    manufacturing documents or procedure sheets. It is important that these requirements
    be precisely prescribed and that conformity with them be verifiable. Conformity
    can be established by testing either the brazed assembly itself or a test piece
    produced under comparable conditions. This document does not specify requirements
    for acceptance levels for imperfections, since these will differ very markedly
    depending on the application, but it does suggest some quality levels which can
    be of value in the absence of more detailed information.
