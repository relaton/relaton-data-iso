abstract:
- language: en
  script: Latn
  content: 'ISO/TR 17219:2013 was prepared by an ad hoc Smoking Behaviour Review Team
    to address the following terms of reference: a) to review worldwide human smoking
    behaviour documentation, uptake studies and smoking methods; b) to report maximum
    and minimum values for puff volume, puff duration, puff frequency, ventilation
    blocking, butt lengths and other parameters; c) to recommend one or more sets
    of parameters for potential new practical machine smoking regimes in addition
    to the existing ISO standard (ISO 3308); d) to identify gaps in existing knowledge.'
