abstract:
- language: en
  script: Latn
  content: Specifies an instrumental method for the routine determination of pH using
    a glass electrode in a 1:5 (V/V) suspension of soil in water (pH-H2O), in a solution
    of 1 mol/l potassium chloride (pH-KCl) or in a solution of 0,01 mol/l calcium
    chloride (pH-CaCl2). Is applicable to all types of air-dried soil samples, e.g.
    pretreated according to ISO 11464.
