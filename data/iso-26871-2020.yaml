abstract:
- language: en
  script: Latn
  content: This document specifies criteria and requirements for the use of explosive
    systems and explosive devices commonly used on spacecraft and other space products,
    including launch vehicles and space vehicle systems. It addresses the aspects
    of design, analysis, verification, manufacturing, operations and safety. To the
    greatest extent possible, requirements from past and existing standards have been
    analyzed, selected and tailored to be incorporated herein. In addition, the requirements
    herein include those generated as a result of lessons learned from launch and
    space vehicle programs. NOTE Specific requirements for man-rating are not addressed.
