abstract:
- language: en
  script: Latn
  content: This document specifies a test method to measure the contact angle for
    the determination of the surface free energy of a solid surface. The method can
    be applied for the characterization of substrates and coatings. NOTE 1    For
    the determination of the surface free energy of polymers and coatings, it is preferred
    to use either the method according to Owens, Wendt, Rabel and Kaelble or the method
    according to Wu. NOTE 2    The morphological and chemical homogeneity have an
    influence on the measuring results. The procedures indicated in this document
    are based on the state-of-the-art employing the drop projection method in penumbral
    shadow. Other methods are not excluded. Measuring the contact angle on powders
    is not part of this document.
