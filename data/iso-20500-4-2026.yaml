abstract:
- language: en
  script: Latn
  content: This document, together with ISO 20500-1:2026, deals with all significant
    hazards, hazardous situations and events relevant to compaction machines when
    used as intended and under the conditions of misuse which are reasonably foreseeable
    by the manufacturer (see Annex D) associated with the whole lifetime of the machine
    as described in ISO 12100:2010, 5.4. The requirements of this document are complementary
    to the common requirements formulated in ISO 20500-1:2026. This document does
    not repeat the requirements of ISO 20500-1:2026 but supplements or modifies the
    requirements for compaction machines. This document deals with vibratory plates
    and vibratory rammers only. This document does not deal with compaction machines
    with ride-on operators. Lightning as a significant and relevant hazard is not
    covered in this document. This document is not applicable to compaction machines
    manufactured before the date of its publication.
