abstract:
- language: en
  script: Latn
  content: ISO 26802:2010 specifies the applicable requirements related to the design
    and the operation of containment and ventilation systems of nuclear power plants
    and research reactors taking into account the following. For nuclear power plants,
    ISO 26802:2010 addresses only reactors that have a secondary confinement system
    based on IAEA recommendations. For research reactors, ISO 26802:2010 applies specifically
    to reactors for which accidental situations can challenge the integrity or leak-tightness
    of the containment barrier, i.e. in which a high-pressure or -temperature transient
    can occur and for which the isolation of the containment building and the shut-off
    of the associated ventilation systems of the containment building is required.
    The requirements of ISO 26802:2010 apply to research reactors in which the increase
    of pressure or temperature during accidental situations do not risk damaging the
    ventilation systems, although the requirements applicable for the design and the
    use of ventilation systems are given in ISO 17873.
