abstract:
- language: en
  script: Latn
  content: ISO 12679:2011 includes general guidelines for the workmanlike production
    of metallic, metal-ceramic, oxide-ceramic and plastic coatings, by means of thermal
    spraying on metallic and non-metallic parent materials. ISO 12679:2011 provides
    recommendations for an appropriate and practical spray set-up, faultless manufacturing,
    monitoring, quality assurance and for non-destructive and destructive tests on
    the component and accompanying specimen. It describes details about negative effects
    which can occur. It also gives advice on how to prevent such effects. Permissible
    coating loads and evaluation categories for quality are not the subject of ISO
    12679:2011, as they are dependent on the operating conditions. ISO 12679:2011
    can be used for contract purposes.
