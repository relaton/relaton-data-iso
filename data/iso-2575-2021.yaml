abstract:
- language: en
  script: Latn
  content: This document specifies symbols (i.e. conventional signs) for use on controls,
    indicators and tell-tales applying to passenger cars, light and heavy commercial
    vehicles and buses, to ensure identification and facilitate use. This document
    additionally describes the purpose and application for the symbols. It also indicates
    the colours of possible optical tell-tales, which inform the driver of either
    correct operation or malfunctioning of the related devices.
