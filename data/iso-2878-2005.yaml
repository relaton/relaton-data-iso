abstract:
- language: en
  script: Latn
  content: 'ISO 2878:2005 specifies a method of determining the electrical resistance
    of antistatic and conductive products manufactured wholly or in part from rubber
    whose electrical resistance measured between defined points, when new, does not
    exceed 3 times 108 ohms and whose conductivity is derived from the addition of
    carbon black and/or other appropriate substances to the bulk of the material.
    This International Standard specifies the electrode configuration for basic geometries
    but reference should be made to relevant product specifications for requirements
    for specific products. It does not apply to: products were the relevant surfaces
    are composed of mixtures of insulating and conductive areas;products with a substantial
    surface area of insulating material (except for footwear, which does not normally
    have a conductive or antistatic upper).'
