abstract:
- language: en
  script: Latn
  content: This document establishes requirements and recommendations to ensure consistent
    delivery to end users of high-quality commercial services through the utilization
    of UASs. Since this document makes reference to ISO 21384-3:2023, this document
    does not specify the safety requirements for UAS operations described therein.
    These guidelines are applicable to any commercial services using UASs, irrespective
    of the type or category (as defined in ISO 21895:2020), and regardless of the
    scale of the organizations delivering the commercial services.
