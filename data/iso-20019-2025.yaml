abstract:
- language: en
  script: Latn
  content: This document specifies dimensional requirements for the attachment of
    agricultural, non-balanced trailers and implements by means of hitch rings to
    the rear of towing vehicles equipped with a hook specified in ISO 6489-1. It ensures
    the interchangeability of the mechanical connections on agricultural towed vehicles.
    This document is applicable to rings whose coupling point is below the centre-line
    of the rear axle and the power take-off (PTO) of the tractor.
