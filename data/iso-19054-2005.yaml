abstract:
- language: en
  script: Latn
  content: ISO 19054:2005 specifies basic requirements to ensure compatibility between
    rail systems complying with this International Standard and medical equipment
    in order to facilitate the transfer of medical equipment from one rail system
    to another. The specifications for rail systems include dimensions, strength and
    information to be supplied by the manufacturer. ISO 19054:2005 applies only to
    rail systems intended to be mounted horizontally. ISO 19054:2005 does not specify
    either the structures to which a rail system can be attached or the types of medical
    equipment that can be supported nor does it apply to overhead rail systems for
    supporting curtains and infusion devices.
