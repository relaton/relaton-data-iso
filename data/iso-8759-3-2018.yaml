abstract:
- language: en
  script: Latn
  content: This document gives general specification and location requirements for
    front-mounted power take-offs (PTO) on agricultural tractors. NOTE 1 Further specifications
    for front-mounted power take-offs are given in ISO 8759-1. It is not applicable
    to tractors which are designed to run in two directions, where either end can
    be considered to be the front or the rear. NOTE 2 In this case, ISO 500 (all parts)
    apply.
