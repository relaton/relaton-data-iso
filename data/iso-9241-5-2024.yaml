abstract:
- language: en
  script: Latn
  content: This document specifies ergonomic guiding principles which apply to the
    user requirements, design and procurement of workstation equipment for using interactive
    systems with visual displays. In particular, the general principles and requirements
    specified in this document apply to the standards specifying technical design
    of furniture and equipment constituting the workplace. They are intended for use
    by product and workstation designers and implementers.
