abstract:
- language: en
  script: Latn
  content: 'ISO 12922:2012 specifies the minimum requirements of unused fire-resistant
    and less-flammable hydraulic fluids for hydrostatic and hydrodynamic systems in
    general industrial applications. It is not intended for use in aerospace or power-generation
    applications, where different requirements apply. It provides guidance for suppliers
    and end users of these less hazardous fluids and to the manufacturers of hydraulic
    equipment in which they are used. Of the categories covered by ISO 6743-4, which
    classifies the different types of fluids used in hydraulic applications, only
    the following are detailed in this International Standard: HFAE, HFAS, HFB, HFC,
    HFDR and HFDU.'
