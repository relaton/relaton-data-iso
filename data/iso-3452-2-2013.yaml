abstract:
- language: en
  script: Latn
  content: ISO 3452-2:2013 specifies the technical requirements and test procedures
    for penetrant materials for their type testing and batch testing. ISO 3452-2:2013
    covers the temperature range 10 °C to 50 °C. Additional tests in ISO 3452-5:2008
    or ISO 3452-6:2008 may be required outside this range. On-site control tests and
    methods are detailed in ISO 3452‑1:2013.
