abstract:
- language: en
  script: Latn
  content: This document provides design examples of concrete-filled steel tubular
    (CFST) hybrid structures in accordance with ISO 16521. This document includes
    the design calculation of major structural types in ISO 16521, i.e., trussed CFST
    hybrid structures, concrete-encased CFST hybrid structures. The design examples
    cover the major loading cases for the structures and follow the design procedure
    presented in ISO 16521:2024, Clause 6.
