abstract:
- language: en
  script: Latn
  content: 'This document specifies the application module for AP239 product status
    recording. The following are within the scope of this document: assignment of
    an observed state to an identified product or product group; assignment of an
    observed state to a connection, interface or other relationship between two products;
    relating an activity to the assignment of an observed state; assignment of a justification
    for an observed state; assignment of a location to a product or product group;
    assignment of an activity to the assessment of an observed state; addition of
    an product or product group to the context for an observation; association of
    a translation in a particular language of an observation and observation consequence.'
