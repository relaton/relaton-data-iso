abstract:
- language: en
  script: Latn
  content: This document specifies the methods of test for determination of the properties
    of solid surfacing materials, as defined in Clause 3, in the form of shaped products.
    These methods are primarily intended for testing the materials specified in ISO 19712-1.
    The tests can be carried out on finished products, but are generally carried out
    on test panels of a size sufficient to meet the requirements of the test, and
    of the same material and finish as the finished product.
