abstract:
- language: en
  script: Latn
  content: This document specifies generic system architectures and generic life-cycle
    phases of mobile eID systems in terms of building blocks for mobile eID system
    infrastructures. It standardizes interfaces and services for mdoc apps and mobile
    verification applications. It is applicable to entities involved in specifying,
    architecting, designing, testing, maintaining, administering and operating a mobile
    eID system in parts or entirely.
