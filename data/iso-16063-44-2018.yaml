abstract:
- language: en
  script: Latn
  content: This document specifies the instrumentation and procedure to be used for
    performing calibration of field vibration calibrators (FVCs). It is not applicable
    to FVCs used for the calibration of transducers. These are covered by ISO 16063‑21.
    Procedures and requirements of in situ calibration by FVC are beyond the scope
    of this document. Annex B provides more information on the application of FVC.
