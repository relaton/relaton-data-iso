abstract:
- language: en
  script: Latn
  content: This document specifies the test method for the determination of phosphorus
    content in firework compositions by inductively coupled plasma optical emission
    spectrometry (ICP-AES). Such test is applied to fireworks excluding Christmas
    crackers, party poppers, or snaps according to ISO 25947-5. The use of white phosphorus
    can lead to fireworks of hazardous chemical stability that can be detected by
    possible self-ignition during the thermal conditioning test according to ISO 25947-4:2017,
    6.16 (75,0 ± 2,5 °C for 48 h).
