abstract:
- language: en
  script: Latn
  content: ISO 2360:2017 specifies a method for non-destructive measurements of the
    thickness of non-conductive coatings on non-magnetic electrically conductive base
    metals, using amplitude-sensitive eddy-current instruments. In ISO 2360:2017,
    the term "coating" is used for materials such as, for example, paints and varnishes,
    electroplated coatings, enamel coatings, plastic coatings, claddings and powder
    coatings. This method is particularly applicable to measurements of the thickness
    of most oxide coatings produced by anodizing, but is not applicable to all conversion
    coatings, some of which are too thin to be measured by this method (see Clause
    6). This method can also be used to measure non-magnetic metallic coatings on
    non-conductive base materials. However, the phase-sensitive eddy-current method
    specified in ISO 21968 is particularly usable to this application and can provide
    thickness results with a higher accuracy (see Annex A). This method is not applicable
    to measure non-magnetic metallic coatings on conductive base metals. The phase-sensitive
    eddy-current method specified in ISO 21968 is particularly useful for this application.
    However, in the special case of very thin coatings with a very small conductivity,
    the amplitude-sensitive eddy-current method can also be used for this application
    (see Annex A). Although the method can be used for measurements of the thickness
    of coatings on magnetic base metals, its use for this application is not recommended.
    In such cases, the magnetic method specified in ISO 2178 can be used. Only in
    case of very thick coatings above approximately 1 mm, the amplitude-sensitive
    eddy-current method can also be used for this application (see Annex A).
