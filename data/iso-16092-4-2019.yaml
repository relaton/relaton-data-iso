abstract:
- language: en
  script: Latn
  content: This document, in addition to ISO 16092-1, specifies the technical safety
    requirements and measures to be adopted by persons undertaking the design, manufacture
    and supply of pneumatic presses which are intended to work cold metal or material
    partly of cold metal. This document deals with all significant hazards relevant
    for pneumatic presses, when they are used as intended and under the conditions
    of misuse which are reasonably foreseeable by the manufacturer (see Clause 4).
    All the phases of the lifetime of the machinery as described in ISO 12100:2010,
    5.4, have been taken into consideration.
