abstract:
- language: en
  script: Latn
  content: ISO 16063-45:2017 specifies the calibration of vibration transducers with
    built-in calibration coils in laboratory and in situ. In laboratory, the method
    described can be applied to calibrate the vibration sensitivity and electrical
    sensitivity, and to obtain the coefficient of calibration coil. In situ, it can
    be used to calibrate the electrical sensitivity and vibration sensitivity using
    electrical instrumentation. ISO 16063-45:2017 specifies the instrumentation and
    procedure for performing calibrations of vibration transducers with built-in calibration
    coils in the frequency range typically from 0,1 Hz to 100 Hz. The expanded uncertainty
    can be evaluated using the method given in this document.
