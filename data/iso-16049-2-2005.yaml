abstract:
- language: en
  script: Latn
  content: ISO 16049-2:2005 specifies utilization guidelines and principles to be
    used in strength calculation methods adequate to guarantee the effectiveness and
    ultimate load strength of tie-down/lashing arrangements used to restrain cargo
    on board civil transport aircraft during flight for either cargo loaded and tied
    down onto airworthiness certified air cargo pallets, themselves restrained into
    aircraft lower deck or main deck cargo systems meeting the requirements of ISO
    8097; additional tie-down on aircraft structure when necessitated by pallet maximum
    gross mass or centre of gravity limits; non-unitized individual pieces of cargo,
    or pieces of cargo placed onto an unrestrained ("floating") pallet into either
    lower deck or main deck containerized cargo compartments of an aircraft; or individual
    pieces of load loaded in non containerized (bulk loaded) baggage or cargo compartments.
    ISO 16049-2:2005 is applicable to cargo tie-down/lashing arrangements using exclusively
    air cargo restraint straps conforming to ISO 16049-1. Its general recommendations
    may be used for tie-down arrangements using other means (e.g. steel cables, rope,
    chains, other types of straps), but under the user's responsibility as to their
    adequacy and the strength calculations required. ISO 16049-2:2005 is not applicable
    to the use of chains or other rigid devices for tie-down onto civil transport
    aircraft floor tracks. These devices are generally not recommended for use due
    to the possibility of generating excessive stresses in the aircraft structure,
    except where explicitly approved in the manufacturer's Authority approved Weight
    and Balance Manual. ISO 16049-2:2005 is intended to provide industry recognized
    means of complying with Airworthiness Authorities general regulations applicable
    to load-securing on board civil transport aircraft (see FAR/JAR Parts 25), and
    aircraft manufacturers Authority approved Weight and Balance Manuals for each
    aircraft type as specified therein. It is not the intent of ISO 16049-2:2005 to
    specify when restraint straps should be used, but how they should be used. It
    does not, under any circumstance, supersede the requirements of any of the above
    documents that take precedence at all times.
