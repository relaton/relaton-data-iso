abstract:
- language: en
  script: Latn
  content: 'This document specifies the design, construction and installation of refrigerating
    systems, including piping, components, materials and ancillary equipment directly
    associated with such systems, which are not covered in ISO 5149-1, ISO 5149-3,
    or ISO 5149-4. It also specifies requirements for testing, commissioning, marking
    and documentation. Requirements for secondary heat-transfer circuits are excluded
    except for any safety devices associated with the refrigerating system. This document
    is applicable to new refrigerating systems, extensions or modifications of already
    existing systems, and for used systems, being transferred to and operated on another
    site. This document is applicable to: refrigerating systems, stationary or mobile,
    of all sizes, except vehicle air conditioning systems covered by a specific product
    standard; NOTE            Example of specific product standard is ISO 13043 and
    SAE J 639. secondary cooling or heating systems; the location of the refrigerating
    systems; replaced parts and added components after the adoption of this document,
    if they are not identical in function and in capacity; the conversion of a system
    for another refrigerant. This document does not apply to goods in storage, with
    respect to spoilage or contamination.'
