abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1635:2006 specifies the application module for Assembly functional
    interface requirement. ISO/TS 10303-1635:2006 deals with the representation of
    the information needed to describe the manner by which an electronic assembly
    shall electrically or functionally interface to the next higher assembly. Constraints
    on the signals associated with terminals of the mating connector may be specified.
    Identification of the mating terminals is supported. ISO/TS 10303-1635:2006 defines
    the information needed to describe the physical layer of an engineering operational
    protocol and the mapping of the signals in the protocol definition to a terminal
    in the usage view of the product. Support for functional characterization of the
    host connector, media connector or media is provided. The following are within
    the scope of ISO/TS 10303-1635:2006: signal names for assembly terminals;physical
    layer protocol definition;external functional characterization of a connector
    or media referenced in a protocol definition.'
