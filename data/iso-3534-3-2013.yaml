abstract:
- language: en
  script: Latn
  content: ISO 3534-3:2013 defines the terms used in the field of design of experiments
    and may be used in the drafting of other International Standards. More specifically,
    it defines terms used in the field of design of experiments for which the response
    variable is one-dimensional and continuous and for which the expectation of the
    response variable is linear in the parameters. The terms with regard to the statistical
    analysis are based on the assumption that the error term follows a normal distribution
    with constant variance.
