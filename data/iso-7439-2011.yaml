abstract:
- language: en
  script: Latn
  content: ISO 7439:2010 specifies requirements and tests for single-use, copper-bearing
    contraceptive intrauterine devices (IUDs) and their insertion instruments. (Some
    aspects can be applicable to medicated intrauterine devices and IUDs not containing
    copper.) It is not applicable to IUDs consisting only of a plastics body or whose
    primary purpose is to release progestogens.
