abstract:
- language: en
  script: Latn
  content: 'This document specifies additional specific safety requirements and test
    methods for Class E floating leisure articles for use on and in the water regardless
    whether the buoyancy is achieved by inflation or inherent buoyant material. This
    document is applicable for Class E floating leisure articles as specified in ISO 25649-1:2024,
    Table 1. Class E devices are inflatable boats of a buoyancy of less than 1 800 N
    with a hull length of more than 1,2 m and less than 2,5 m. Class E devices are
    intended for use in bathing areas or in protected and safe shore zones. NOTE 1       
    Typical products forming Class E (see Annex F): —      inflatable boats for rowing
    or paddling of near oval shape with or without transom; —      canoes and kayaks;
    —      inflatable boats made from plastic sheets or from reinforced materials;
    —      motor kit/sail kit as additional option. NOTE 2        Typical applications
    of Class E devices: —      moving from one place to another for pleasure purposes;
    —      staying on the water for relaxing; —      moving from shore to the main
    boat, transportation of persons and load (tender boat).'
