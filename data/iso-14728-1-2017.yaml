abstract:
- language: en
  script: Latn
  content: ISO 14728-1:2017 specifies methods of calculating the basic dynamic load
    rating and basic rating life for linear motion rolling bearings manufactured from
    contemporary, commonly used, high quality, hardened bearing steel in accordance
    with good manufacturing practice and basically of conventional design as regards
    the shape of the rolling contact surfaces. The life of linear motion rolling bearings
    is defined and the conditions are established for reliable life calculations.
    ISO 14728-1:2017 is not applicable to designs where the rolling elements operate
    directly on the slide surface of the machine equipment, unless that surface is
    equivalent in all respects to the raceway of the linear motion rolling bearing
    component it replaces.
