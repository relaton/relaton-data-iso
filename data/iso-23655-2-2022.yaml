abstract:
- language: en
  script: Latn
  content: This document specifies the determination of nickel-59 and nickel-63 (59Ni
    and 63Ni) activity concentration in samples of all types of water using inductively
    coupled plasma mass spectrometry (ICP-MS). Using currently available ICP-MS, this
    test method can measure 59Ni activity concentrations of 300 mBq⋅l−1 and 63Ni activity
    concentrations of 200 Bq⋅l−1. These values can be achieved with a sample volume
    of 1,0 l. Higher activity concentrations can be measured by either diluting the
    sample or using smaller sample aliquots or both. NOTE       These performance
    indicators are wholly dependent on the measurement regimes in individual laboratories;
    in particular, the detection limit is influenced by amount of stable nickel present.
    The range of application depends on the amount of dissolved material in the water
    and on the performance characteristics of the measurement equipment (background
    count rate and counting efficiency). It is the laboratory’s responsibility to
    ensure the suitability of this test method for the water samples tested.
