abstract:
- language: en
  script: Latn
  content: This document specifies the test conditions and the levels of activity
    to determine the bactericidal activity of non-porous surfaces used in a dry environment.
    It defines a protocol to validate the bactericidal character of a surface and
    to measure its performance. It is not intended to be used to substantiate cleaning
    or disinfecting properties. This document is applicable to surfaces claiming to
    have an activity against vegetative bacteria. The obligatory test conditions are
    defined in this document. It does not apply to porous surfaces. It does not refer
    to methods for testing the toxicological and ecotoxicological properties of the
    surfaces. This document is used to measure bactericidal action, not bacteriostatic
    activity of a surface.
