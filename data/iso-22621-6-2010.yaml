abstract:
- language: en
  script: Latn
  content: ISO 22621-6:2010 specifies a code of practice dealing with polyamide (PA)
    piping systems, intended to be buried outside buildings and used for the supply
    of gaseous fuels. It is applicable to mains and service lines, the components
    of which are prepared for jointing by scraping and/or machining, and gives instructions
    for the design, storage, handling, transportation, laying conditions and fusion
    quality control of PA pipes and fittings up to and including 250 mm outside diameter,
    as well as subsequent joint testing, backfilling, pipe system testing, commissioning
    and decommissioning. The jointing methods covered by ISO 22621-6:2010 are butt
    fusion jointing and electrofusion jointing.
