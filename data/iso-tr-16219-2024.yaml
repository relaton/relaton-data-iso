abstract:
- language: en
  script: Latn
  content: This document deals with the likely degradation of air performance of fans
    tested in standardized airways according to ISO 5801 when compared with the performance
    of fans tested under actual site conditions. It deals with the performance of
    a number of generic types of fan and fittings. The results given are intended
    as guidelines and only provide trends, as the system effect depends on the exact
    geometry of the fan and disturbing component. The test data presented in this
    document are taken from an extensive experimental program conducted 20 years ago
    by NEL (National Engineering Laboratory, UK), mainly on axial and centrifugal
    fans. Data are also taken from several research projects financially supported
    by ASHRAE, some of them being carried out in the AMCA laboratory in Chicago, as
    well as from results published previously by individual fan manufacturers.
