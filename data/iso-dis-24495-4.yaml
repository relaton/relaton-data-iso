abstract:
- language: en
  script: Latn
  content: 'This proposed standard is for any organization wishing to certify that
    it uses plain language systematically in its operations by: a.applying the guidance
    of ISO 24495-1 — Part 1: Governing Principles and Guidelines when content is developed,
    and b.cultivating an organizational culture of clarity and accessibility. This
    standard, Part 4 — Requirements for implementing plain language principles, will
    discuss what organizations must do under each section of Part 1 to be certified.
    As is the case with Part 1, the aim is for the standard to work in most written
    languages, and in most sectors. When localizing the standard, national standards
    bodies can adapt and expand the standard to achieve the goals of plain language
    certification.'
