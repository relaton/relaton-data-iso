abstract:
- language: en
  script: Latn
  content: This document gives rules for definition and interpretation of general
    geometrical specifications and general size specifications defined according to
    ISO 8015:2011, 5.12. General specifications defined in other standards, and the
    link to these standards, are not covered by this document. The general geometrical
    specifications and general size (linear or angular) specifications defined in
    this document apply only to integral features (including features of size). These
    specifications do not apply to derived features or integral lines (see ISO 17450-1
    for the definitions of integral features and derived features). Dimensions other
    than linear or angular sizes (see ISO 14405-2) are not covered by this document.
