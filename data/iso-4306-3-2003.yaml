abstract:
- language: en
  script: Latn
  content: ISO 4306 establishes definitions in English, French and Russian for the
    most commonly used terms in the field of cranes. ISO 4306-3:2002 gives the general
    definition of a tower crane and illustrates the terminology used with each type
    of tower crane by the use of figures with referenced term numbers. It is applicable
    to tower cranes that can be assembled and dismantled; permanently erected tower
    cranes; It is not applicable to mobile boom cranes which may be fitted with a
    tower attachment; erection masts, with or without jibs.
