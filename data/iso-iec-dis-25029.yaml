abstract:
- language: en
  script: Latn
  content: This standard applies to nudging mechanisms enhanced by AI systems. This
    document provides definitions, concepts, and guidelines to address AI-enhanced
    nudging mechanisms by organisations. This standard aims to support organisations
    to deal with AI-enhanced nudging mechanisms in alignment with existing AI standards.
    “AI-enhanced nudging mechanisms” are a sub category of digital nudges and which
    are enhanced by AI systems. It provides use-cases to illustrate AI-enhanced nudging
    mechanisms. It provides guidelines and requirements for designing responsible
    AI-enhanced nudging mechanisms. This includes horizontal processes and key indicators
    using specific vertical examples.
