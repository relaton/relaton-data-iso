abstract:
- language: en
  script: Latn
  content: 'The proposed standard will provide Users of Counter UAS technology with
    guidance to support the safe and legal deployment of equipment. The proposed standard
    will be applicable to the CUAS equipment intended to be deployed in all civilian
    environments and on-shore military sites. It will include: • User Terms and Definitions
    • Categories of CUAS equipment (fixed, mobile, DTIE) • Safety considerations •
    Legal considerations • License considerations • Installation considerations •
    User requirements for an effective system o Key functions of a CUAS system o Key
    Performance metric of a CUAS system • Site specific requirements driven by specific
    need • Training • On site Exercising • Maintenance'
