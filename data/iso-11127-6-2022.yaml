abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of water-soluble
    contaminants in non-metallic blast-cleaning abrasives by conductivity measurement.
    This is one of a number of parts in the ISO 11127 series dealing with the sampling
    and testing of non-metallic abrasives for blast-cleaning. The types of non-metallic
    abrasive and requirements on each are contained in the ISO 11126 series. The ISO 11126
    series and the ISO 11127 series have been drafted as a coherent set of International
    Standards on non-metallic blast-cleaning abrasives.
