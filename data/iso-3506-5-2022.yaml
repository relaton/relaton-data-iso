abstract:
- language: en
  script: Latn
  content: 'This document specifies the mechanical and physical properties of bolts,
    screws, studs and nuts, with coarse pitch thread and fine pitch thread, made of
    corrosion-resistant stainless steels (i.e. martensitic stainless steels and precipitation
    hardening austenitic stainless steels) and nickel alloys, intended for use at
    high temperatures up to 800 °C. Tests in accordance with Clause 9 are performed
    at the ambient temperature range of 10 °C to 35 °C, and other tests can be performed
    at higher temperatures, see Clause 10. NOTE       Fasteners specified in this
    document are also suitable when used at low temperatures, typically down to -50 °C.
    For more information, see ISO 3506-6. The term “fasteners” is used in this document
    when bolts, screws, studs and nuts are considered all together. ISO 3506-6 provides
    general rules and additional technical information on suitable stainless steels
    and nickel alloys as well as their properties. This document applies to fasteners:
    —    with ISO metric thread in accordance with ISO 68-1, —    with diameter/pitch
    combinations in accordance with ISO 261 and ISO 262, —    with coarse pitch thread
    M3 to M39, and fine pitch thread M8×1 to M39×3, —    with thread tolerances in
    accordance with ISO 965-1 and ISO 965-2, and —    of any shape but with full loadability.
    Stainless steel and nickel alloy fastener symbols can be used for sizes outside
    the diameter limits of this document (i.e. for bolts, screws and studs with d < 3 mm
    or d > 39 mm and for nuts with D < 5 mm or D > 39 mm), provided that all applicable
    chemical, mechanical and physical requirements are met. Fasteners with reduced
    loadability (i.e. thin nuts and bolts, screws and studs with head or unthreaded
    shank weaker than the threaded shank) are not dealt with in this document. This
    document does not specify requirements for functional properties such as: —   
    torque/clamp force properties, —    shear strength, —    fatigue resistance, —   
    weldability, or —    properties of bolted joints and fasteners in high temperature
    environment (see test methods at high temperature for fasteners in Clause 10).'
