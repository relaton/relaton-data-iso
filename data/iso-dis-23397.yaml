abstract:
- language: en
  script: Latn
  content: This document defines standardized terminology related to ammonia fuel
    systems for ships in accordance with “Guidelines for ships using ammonia as fuel”
    developed by the Carriage of Cargoes and Containers (CCC) Sub-Committee of the
    International Maritime Organization (IMO). This document applies to the use of
    ammonia as fuel on various ship types, but is not applicable to ships carrying
    ammonia as a cargo.
