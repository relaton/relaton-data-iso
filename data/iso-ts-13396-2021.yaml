abstract:
- language: en
  script: Latn
  content: This document comprises a set of essential input parameters that can be
    used to develop or evaluate side impact test procedures for child restraint systems.
    Although children are undoubtedly involved in side impact collisions of differing
    configurations and severities, these input parameters are, in general, associated
    with the impact test scenario in UN Regulation No. 95 (lateral collision protection
    of vehicles). This vehicle type-approval regulation comprises a full-scale crash
    test in which the stationary test vehicle is struck at right angles by a mobile
    deformable barrier travelling at 50 km/h. This test scenario is the basis for
    most of ISO’s previous work on side impact testing for child restraint systems.
    NOTE            Countries and regions that do not recognise UN regulations can
    evaluate vehicles under different conditions and can apply input parameters that
    reflect the vehicle crash tests in their own regulatory jurisdictions.
