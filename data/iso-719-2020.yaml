abstract:
- language: en
  script: Latn
  content: This document specifies a) a method for determining the hydrolytic resistance
    of glass grains at 98 °C. The resistance is measured and expressed by the volume
    of acid required for titration of the alkali extracted from the unit mass of glass,
    and can also be expressed by the amount of sodium oxide equivalent to this volume
    of acid, and b) a classification of glass according to the hydrolytic resistance
    determined by the method of this document. This document is intended for use on
    the less resistant types of glass, such as soda-lime glass. NOTE 1 For the more
    resistant glasses, e.g. borosilicate glass, the method specified in ISO 720 is
    more suited. NOTE 2 It is emphasized that there is no exact correlation between
    the classification laid down in this document and that laid down in ISO 720, and
    it is, therefore, essential to identify which classification is being used.
