abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements for interim checking of
    the torque output of hand torque tools used for controlled tightening of screws
    and nuts. This document applies to hand torque tools which are classified as indicating
    torque tools (Type I) and setting torque tools (Type II). This document does not
    specify requirements of calibration certificates for hand torque tools. These
    are described in ISO 6789-2.
