abstract:
- language: en
  script: Latn
  content: This document specifies the general principles to be followed when test
    specimens of thermoplastic materials are prepared by laser-based powder bed fusion
    (PBF-LB/P), which is commonly known as laser sintering. The (PBF-LB/P) process
    is used to prepare test specimens layer upon layer in which thermal energy selectively
    fuses regions of a powder bed. This document provides a basis for establishing
    reproducible and reportable sintering conditions. Its purpose is to promote uniformity
    in describing the main process parameters, build orientation of the sintering
    process and also to establish uniform practice in reporting sintering conditions.
    This document does not specify the test procedure itself.
