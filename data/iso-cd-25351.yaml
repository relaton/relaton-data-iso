abstract:
- language: en
  script: Latn
  content: 'This document provides a benchmark for evaluation of the design, operation
    and performance of cell cultured food products practices and systems. This document
    is applicable to the design of new production systems. This document is applicable
    only to the upstream and midstream production processes. This document covers
    the following topics: — principles of cell cultured production process systems;
    — process design, construction, operation and maintenance of cell cultured production
    systems; — controlling cell cultured systems parameters.  This document does not
    cover the following topics:  — downstream processes;  — packaging, labelling,
    storage and distribution; — validation; — Quality assurance (QA/QC); — Sustainability;
     — safety and hazards;  — Production area/Clean rooms. This document does not
    apply to precision fermentation (see 5.1). This document does not apply to cell
    cultured products used for in vivo application in humans, clinical applications
    or therapeutic use.  NOTE It is important to note that cell cultured food products
    is a rapidly evolving field, and specific principles and techniques may vary depending
    on the specific product being cultivated and the technological advancements at
    any given time.'
