abstract:
- language: en
  script: Latn
  content: This document specifies fundamental parameters of computed radiography
    (CR) systems with the aim of enabling satisfactory and repeatable results to be
    obtained economically. The techniques are based both on fundamental theory and
    test measurements. This document specifies the performance of CR systems and the
    measurement of the corresponding parameters for the system scanner and storage
    phosphor imaging plate (IP). CR system classes are defined in combination with
    specified metal screens for industrial radiography. This document ensures that
    the quality of the images, as far as they are influenced by the scanner IP system,
    complies with the requirements of ISO 16371-2. This document considers the requirements
    for film radiography specified in ISO 11699-1. This document specifies system
    tests at different levels. More complex manufacturer tests are described, which
    allow the determination of precise system parameters to characterize the performance
    of  CR systems from different suppliers and make them comparable for users. Simpler
    tests are also described, which are designed for fast tests of the quality of
    CR systems and long-term stability monitoring by the user.
