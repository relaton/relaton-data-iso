abstract:
- language: en
  script: Latn
  content: This part of ISO/IEC 9072 specifies the protocol (abstract syntax) and
    procedures for the Remote Operation Service Element (part 1 of this International
    Standard). The ROSE services are provided in conjunction with the Association
    Control Service Element (ACSE) services (ISO 8649) and the ACSE protocol (ISO 8650),
    optionally the Reliable Transfer Service Element (RTSE) services (ISO/IEC 9066-1)
    and the RTSE protocol (ISO/IEC 9066-2), and the presentation-service (ISO 8822).
    The ROSE procedures are defined in terms of a) the interactions between peer ROSE
    protocol machines through the use of RTSE services or the presentation-service;
    b) the interactions between the ROSE protocol machine and its service-user. This
    part of ISO/IEC 9072 specifies conformance requirements for systems implementing
    these procedures.
