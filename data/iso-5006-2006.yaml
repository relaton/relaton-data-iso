abstract:
- language: en
  script: Latn
  content: ISO 5006:2006 specifies a static test method for determining and evaluating
    the operator's visibility on a rectangular 1 m boundary close around the machine
    and on a 12 m visibility test circle. ISO 5006:2006 applies to wheel loaders,
    skid steer loaders, crawler loaders, backhoe loaders, wheel excavators, crawler
    excavators, rigid-frame dumpers, articulated frame dumpers, dumpers (front body),
    crawler dozers, graders, soil and landfill compactors and rollers that are defined
    in ISO 6165 and that have a specific seated operator's position. For machines
    not mentioned, including larger machines, derivative earth-moving machines and
    other types of earth-moving machines, the visibility test procedures can be used.
    ISO 5006:2006 applies to earth-moving machines for operation on work sites and
    for travelling on public roads.
