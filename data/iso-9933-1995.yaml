abstract:
- language: en
  script: Latn
  content: Lays down the technical characteristics of straight fibre-cement profiled
    sheets, of more than 0,9 m length, and their fibre-cement fittings used as roofing
    and cladding materials. Also specifies tests for checking these characteristics
    as well as marking and conditions of acceptance. Does not apply to asbestos-cement
    corrugated or profiled sheets, nor to short fibre-cement sheets.
