abstract:
- language: en
  script: Latn
  content: ISO 10407-2:2008 specifies the required inspection for each level of inspection
    and procedures for the inspection and testing of used drill-stem elements. For
    the purpose of ISO 10407-2:2008, drill stem elements include drill pipe body,
    tool joints, rotary-shouldered connections, drill collar, HWDP and the ends of
    drill-stem elements that make up with them. ISO 10407-2:2008 has been prepared
    to address the practices and technology commonly used in inspection. The practices
    established within ISO 10407-2:2008 are intended as inspection and/or testing
    guidance and are not intended to be interpreted to prohibit the agency or owner
    from using personal judgement, supplementing the inspection with other techniques,
    extending existing techniques or re‑inspecting certain lengths. ISO 10407-2:2008
    specifies the qualification of inspection personnel, a description of inspection
    methods and apparatus calibration and standardization procedures for various inspection
    methods. The evaluation of imperfections and the marking of inspected drill stem
    elements is included. ISO 10407-2:2008 provides the original equipment manufacturers'
    requirements regarding the minimum information needed for the inspection of their
    specialized tools.
