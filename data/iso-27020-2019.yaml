abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods to compare the functional
    dimensions of orthodontic brackets and tubes and their chemical ion release, as
    well as packaging and labelling information. This document is applicable to brackets
    and tubes for use in fixed orthodontic appliances. This document does not specify
    specific qualitative and quantitative requirements for freedom from biological
    hazards; which are covered in ISO 10993‑1 and ISO 7405.
