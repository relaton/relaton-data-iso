abstract:
- language: en
  script: Latn
  content: ISO 19712-1:2008 establishes a classification system for solid surfacing
    materials according to their performance. ISO 19712-1:2008 also specifies property
    requirements for the various types of solid surfacing materials covered by this
    classification. Requirements are specified for the types that are most generally
    used, but additional types may be added as required. The specified limit values
    apply to the most commonly used types of material, but within each classification
    it may be possible to obtain variants having much higher performance values. These
    materials are characterized by their homogeneous appearance, renewable surfaces
    and inconspicuous seams. They are generally classified as solid surface sheets
    (designed for horizontal, vertical, wet and dry applications) and solid surface
    shapes (including, but not limited to, kitchen sinks, bathroom sinks, vanity tops,
    showers, tubs and spas). The important properties of solid surfacing materials
    are water resistance, thermal shock resistance, heat resistance, impact resistance,
    stain and chemical resistance, cigarette burn resistance, colour stability, hardness,
    bacterial and fungal resistance, cleanability, hygiene, seamability and renewability.
