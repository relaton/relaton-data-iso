abstract:
- language: en
  script: Latn
  content: This International Standard specifies methods for comparing computer simulation
    results, generated from a vehicle mathematical model, with measured test data
    obtained according to ISO 13674-1. The purpose of this comparison is to validate
    the simulation tool's accuracy in predicting vehicle behavior for this specific
    test, enabling its application to vehicle variants. It is applicable to passenger
    cars as defined in ISO 3833.
