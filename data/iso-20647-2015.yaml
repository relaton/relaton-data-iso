abstract:
- language: en
  script: Latn
  content: ISO 20647:2015 specifies a method for the quantitative determination of
    total iodine in infant formula and adult nutritional formula.[1] The method is
    applicable to the measurement of total iodine in infant formula and adult nutritional
    formula from 0,5 µg/100g to 1 500 µg/100g reconstituted final product and for
    ready-to-feed products from 2,5 µg/100 g to 1 000 µg/100 g using ICP-MS. Using
    various infant formula and adult nutritional products, the method was subjected
    to an interlaboratory study. Levels obtained ranged from 3,47 µg/100 g to 124
    µg/100 g. For all precision data related to the interlaboratory study, see Table
    A.1 located in Annex A.
