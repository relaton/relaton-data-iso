abstract:
- language: en
  script: Latn
  content: 'This document specifies tests, procedures and a method of presenting the
    results concerning the parameters that define the main characteristics to be included
    in the supplier''s literature of lubricators conforming to ISO 6301‑1. This document
    can be applied: — to facilitate the comparison of lubricators by standardizing
    test methods and presentation of test data; — to assist in the proper application
    of lubricators in compressed-air systems. The tests specified are intended to
    allow comparison between the different types of lubricators; they are not production
    tests to be carried out on each lubricator manufactured.'
