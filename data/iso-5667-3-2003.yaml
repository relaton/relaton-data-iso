abstract:
- language: en
  script: Latn
  content: ISO 5667-3:2003 gives general guidelines on the precautions to be taken
    to preserve and transport all water samples including those for biological analyses
    but not those intended for microbiological analysis. These guidelines are particularly
    appropriate when spot or composite samples cannot be analysed on-site and have
    to be transported to a laboratory for analysis.
