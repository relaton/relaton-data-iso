abstract:
- language: en
  script: Latn
  content: 'ISO 16110-1:2007 applies to packaged, self-contained or factory matched
    hydrogen generation systems with a capacity of less than 400 m3/h at 0 °C and
    101,325 kPa, herein referred to as hydrogen generators, that convert an input
    fuel to a hydrogen-rich stream of composition and conditions suitable for the
    type of device using the hydrogen (e.g. a fuel cell power system or a hydrogen
    compression, storage and delivery system). It applies to hydrogen generators using
    one or a combination of the following input fuels: — natural gas and other methane-rich
    gases derived from renewable (biomass) or fossil fuel sources, e.g. landfill gas,
    digester gas, coal mine gas; — fuels derived from oil refining, e.g. diesel, gasoline,
    kerosene, liquefied petroleum gases such as propane and butane; — alcohols, esters,
    ethers, aldehydes, ketones, Fischer-Tropsch liquids and other suitable hydrogen-rich
    organic compounds derived from renewable (biomass) or fossil fuel sources, e.g.
    methanol, ethanol, di-methyl ether, biodiesel; — gaseous mixtures containing hydrogen
    gas, e.g. synthesis gas, town gas. ISO 16110-1:2007 is applicable to stationary
    hydrogen generators intended for indoor and outdoor commercial, industrial, light
    industrial and residential use. It aims to cover all significant hazards, hazardous
    situations and events relevant to hydrogen generators, with the exception of those
    associated with environmental compatibility (installation conditions), when they
    are used as intended and under the conditions foreseen by the manufacturer.'
