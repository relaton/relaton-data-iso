abstract:
- language: en
  script: Latn
  content: 'This document establishes the requirements and recommendations for the
    transformation of a tourist destination towards a Smart Tourist Destination (STD)
    model. The documents presents a methodology for the transformation process with
    structured phases in which five key cross-cutting aspects are addressed: governance,
    innovation, integration of technologies, universal accessibility and sustainability
    within the context of the tourist destination. This document is aimed at all types
    of tourist destinations, regardless of their size, location, nature or the structure
    of their management entity.'
