abstract:
- language: en
  script: Latn
  content: ISO 20345:2011 specifies basic and additional (optional) requirements for
    safety footwear used for general purpose. It includes, for example, mechanical
    risks, slip resistance, thermal risks, ergonomic behaviour. Special risks are
    covered by complementary job-related standards, e.g. footwear for firefighters,
    electrical insulating footwear, footwear protecting against chain saw injuries,
    chemicals, molten metal splash, and protection for motor cycle riders.
