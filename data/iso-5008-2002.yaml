abstract:
- language: en
  script: Latn
  content: ISO 5008 specifies methods for measuring and reporting the whole body vibration
    to which the operator of an agricultural wheeled tractor or other field machine
    is exposed when operating on a standard test track. The operating conditions of
    the machine and the ordinates of the artificial test tracks are also included.
    This International Standard does not include assessment of vibration reaching
    the operator other than through his/her seat or foot platform (e.g., vibration
    that is sensed by the feet through the controls or by the hands through the steering
    wheel is not considered). The purpose of ISO 5008 is to define the specification
    of instruments, measurement procedures, measurement site characteristics and frequency
    weighting that will allow the whole body vibration of agricultural wheeled tractors
    and field machinery to be made and reported with acceptable precision.
