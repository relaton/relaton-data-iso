abstract:
- language: en
  script: Latn
  content: ISO 22674:2016 classifies metallic materials that are suitable for the
    fabrication of dental restorations and appliances, including metallic materials
    recommended for use either with or without a ceramic veneer, or recommended for
    both uses, and specifies their requirements. Furthermore, it specifies requirements
    with respect to packaging and marking the products and to the instructions to
    be supplied for the use of these materials, including products delivered for sale
    to a third party. ISO 22674:2016 does not apply to alloys for dental amalgam (ISO
    24234), dental brazing materials (ISO 9333), or metallic materials for orthodontic
    appliances (ISO 15841) (e.g. wires, brackets, bands and screws).
