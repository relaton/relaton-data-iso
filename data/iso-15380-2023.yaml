abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for environmentally acceptable
    hydraulic fluids and is intended for hydraulic systems, particularly hydraulic
    fluid power systems. The purpose of this document is to provide guidance and requirements
    for suppliers and users of environmentally acceptable hydraulic fluids, and for
    the direction of original equipment manufacturers of hydraulic systems. This document
    stipulates the requirements for environmentally acceptable hydraulic fluids at
    the time of delivery. Classification of fluids used in hydraulic application is
    defined in ISO 6743-4. This document encompasses the four categories of environmentally
    acceptable fluids covered by ISO 6743-4, namely HETG (triglycerides), HEPG (polyglycols),
    HEES (synthetic esters) and HEPR (polyalphaolefins and other synthetic hydrocarbons).
