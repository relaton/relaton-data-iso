abstract:
- language: en
  script: Latn
  content: ISO 8224-1:2002 specifies the operational characteristics of, and laboratory
    and field test methods for, traveller irrigation machines. It includes user-oriented
    technical information for presentation in the manufacturer's accompanying product
    literature, laboratory test procedures for evaluating the uniformity of water
    application on an irrigated strip by a machine operating within a specified range
    of conditions and for determining the maximum travelling rates the drive mechanism
    is able to achieve in response to specified operating conditions, and field test
    procedures for determining the uniformity of water application on a given irrigated
    strip under local conditions prevailing in the field at time of testing. It is
    applicable only to traveller irrigation machine types, and not to other types
    such as centre-pivot or lateral irrigation machines.
