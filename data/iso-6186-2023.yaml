abstract:
- language: en
  script: Latn
  content: This document specifies two methods, A and B, for determining the pourability
    of plastics in powdered and granular form, by measuring the flow time through
    a funnel under specified conditions. From method A, information concerning the
    processability can be derived, whilst method B is especially designed for process
    control during manufacture. The methods specified are not necessarily applicable
    to all plastics in powdered and granular form.
