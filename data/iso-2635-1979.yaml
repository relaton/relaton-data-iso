abstract:
- language: en
  script: Latn
  content: Gives the values of multi-wire conductors over the nominal cross-sectional
    area range O,15 to 107 mm . Does not apply to conductors for fire-resistant cables
    or for thermocouple extension cables. Conductors of nominal cross-sectional area
    0,25 mm and 0,15 mm are produced in high-strength copper alloy, and conductors
    of nominal cross-sectional areas greater than 0,25 mm are produced in copper of
    electrotechnical quality.
