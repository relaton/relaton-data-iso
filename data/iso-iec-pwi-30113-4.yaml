abstract:
- language: en
  script: Latn
  content: This document outlines a method for defining body gestures to be utilized
    as a user interface. It specifies a descriptive method for movements to clearly
    and distinctly define body gestures recognizable by ICT systems. It provides a
    sufficient descriptive method for capturing the trajectory of body movements.
    It excludes gestures made with only hands and fingers. It does not prescribe specific
    solutions or engine technologies for body gesture processing.
