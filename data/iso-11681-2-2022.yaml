abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements and measures for verification
    for the design, construction, transporting and commissioning for tree service
    of portable, combustion-engine, hand-held chain-saws having a maximum mass of
    4,3 kg (without the guide bar and saw-chain and with tanks empty). The chain-saws
    are intended to be used, with the right hand on the rear handle and left hand
    on the front handle, by a trained operator. Dismantling and scrapping of the product
    is not covered by this document. Methods for the elimination or reduction of hazards
    arising from the use of these machines and the type of information on safe working
    practices to be provided by the manufacturer are specified. This document deals
    with all significant hazards, hazardous situations and hazardous events relevant
    to these machines when they are used as intended and under conditions of misuse
    which are reasonably foreseeable by the manufacturer (see Annex B). This document
    is applicable to chain-saws manufactured after its date of publication. NOTE     
    Figure 1 shows an example of a chain-saw within the scope of this document.
