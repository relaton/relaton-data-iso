abstract:
- language: en
  script: Latn
  content: This part of ISO 6486 specifies permissible limits for the release of lead
    and cadmium from ceramic ware, glassceramic ware and glass dinnerware intended
    to be used in contact with food, but excluding porcelain enamel articles. This
    part of ISO 6486 is applicable to ceramic ware, glass-ceramic ware and glass dinnerware
    which is intended to be used for the preparation, cooking, serving and storage
    of food and beverages, excluding articles used in food manufacturing industries
    or those in which food is sold.
