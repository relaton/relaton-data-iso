abstract:
- language: en
  script: Latn
  content: ISO 17708:2003 describes a test method for the determination of the resistance
    to separation of the upper from the outsole or the resistance to separation of
    adjacent layers of the outsole or resistance to tear failure of the upper or the
    sole. It also defines conditions of ageing that can be used for production control.
    It applies to all types of footwear (produced by cementing, vulcanization, injection
    moulding, etc.) for which evaluation of adhesion of the sole to the upper is needed
    and where the upper is continuously assembled (closed shoes).
