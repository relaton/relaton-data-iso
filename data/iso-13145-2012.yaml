abstract:
- language: en
  script: Latn
  content: ISO 13145:2012 describes a method for the determination of the viscosity
    and stress relaxation of raw or compounded rubber under specified conditions.
    The viscosity determination consists of a constant strain, temperature and frequency
    test in which the elastic and the loss components of the complex shear modulus
    can be determined. The determination of stress relaxation consists of a constant
    static strain and temperature test in which the torque decrease can be determined.
