abstract:
- language: en
  script: Latn
  content: This document gives the specifications for impact attenuation testing equipment
    used to evaluate the impact performance characteristics of playground surfacing.
    Its specifications are aimed at ensuring that developers and manufacturers of
    such instruments meet minimum performance characteristics to allow repeatable,
    reproducible and accurate results. This document does not specify a test method.
    NOTE Such test methods are covered in other standards, e.g. EN 1177, ASTM F1292,
    ASTM F3313, AS 4422, CSA Z614.
