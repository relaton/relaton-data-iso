abstract:
- language: en
  script: Latn
  content: 'ISO 17665-1:2006 specifies requirements for the development, validation
    and routine control of a moist heat sterilization process for medical devices.
    Moist heat sterilization processes covered by ISO 17665-1:2006 include but are
    not limited to: saturated steam venting systems;saturated steam active air removal
    systems;air steam mixtures;water spray;water immersion.'
