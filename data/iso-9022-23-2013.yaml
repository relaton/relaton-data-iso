abstract:
- language: en
  script: Latn
  content: ISO 9022-23:2013 specifies the methods relating to the environmental tests
    of optical instruments including additional assemblies from other fields (e.g.
    mechanical, chemical, and electronic devices), under equivalent conditions, for
    their ability to resist the influence of low air pressure combined with cold,
    including the potential condensation and freezing of water, ambient temperature,
    and dry or damp heat. ISO 9022-23:2013 is applicable to optical instruments including
    additional assemblies from other fields, designed for operation and/or transport
    in high mountainous areas or on board aircraft or missiles.
