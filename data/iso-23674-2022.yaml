abstract:
- language: en
  script: Latn
  content: This document specifies an analytical procedure for direct determination
    of traces of mercury in finished cosmetic products by thermal decomposition –
    atomic absorption spectrometry (mercury analyser). This document aims to provide
    a procedure of quantification of mercury traces in cosmetic products that consumers
    can be exposed to in their usage. This method describes the determination of mercury
    traces in cosmetics by direct solid analysis with no need of prior digestion.
    Total mercury (both inorganic and organic species) can be quantified either in
    solid or liquid samples.
