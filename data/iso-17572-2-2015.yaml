abstract:
- language: en
  script: Latn
  content: 'The ISO 17572 series specifies location referencing methods (LRMs) that
    describe locations in the context of geographic databases and will be used to
    locate transport-related phenomena in an encoder system as well as in the decoder
    side. The ISO 17572 series defines what is meant by such objects and describes
    the reference in detail, including whether or not components of the reference
    are mandatory or optional, and their characteristics. The ISO 17572 series specifies
    two different LRMs: -pre-coded location references (pre-coded profile); -dynamic
    location references (dynamic profile). The ISO 17572 series does not define a
    physical format for implementing the LRM. However, the requirements for physical
    formats are defined. ISO 17572-2:2014 specifies the pre-coded location referencing
    method, comprising -specification of pre-coded location references (pre-coded
    profile), -logical format for VICS link location, -TPEG physical format for ALERT-C-location
    references, -TPEG physical format for Korean node-link ID references, and -logical
    format for Road Section Identification Data set.'
