abstract:
- language: en
  script: Latn
  content: This document specifies a method for testing equipment for the separation
    of welding fume in order to determine whether its separation efficiency meets
    specified requirements. The method specified does not apply to testing of filter
    cartridges independent of the equipment in which they are intended to be used.
    This document applies to equipment that is manufactured after its publication.
    NOTE General ventilation systems are excluded from the Scope of ISO 21904-1.
