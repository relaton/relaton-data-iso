abstract:
- language: en
  script: Latn
  content: This document provides requirements and guidelines on the necessary quality
    assurance required to produce calibration gas mixtures that are demonstrably stable
    and comparable. It shows that this is achieved by demonstrating that the composition
    of the calibration gas mixture is metrologically traceable to the SI. This document
    shows that calibration gas mixtures can be prepared according to methods that
    have measurements that are completely described in SI units. It describes procedures
    for verifying that the composition of such gas mixtures is correct within the
    stated measurement uncertainty. Guidance is given as to how to conduct the evaluation
    of uncertainty in these procedures. This document also shows how a calibration
    gas mixture with unknown composition can be calibrated by reference to traceable
    standard gas mixtures. This document covers the commonalities and differences
    of quality management schemes in use by producers of calibration gas mixtures,
    most notably those described in ISO/IEC 17025 and ISO 17034. These systems lead
    to gas mixtures with different characteristics, and this document explains these
    differences and their implications. Calibration gas mixtures, as prepared and
    certified for composition in accordance with this document, are used for the calibration
    of equipment, the performance evaluation of methods, measurement procedures and
    equipment.
