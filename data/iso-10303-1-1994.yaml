abstract:
- language: en
  script: Latn
  content: 'La présente partie de l''ISO 10303 fournit une vue générale de la Norme
    internationale ISO 10303. La présente Norme internationale fournit une représentation
    de l''information relative au produit ainsi que les mécanismes et définitions
    nécessaires pour permettre l''échange de données de produit. L''échange est réalisé
    entre différents systèmes et environnements informatiques associés à l''intégralité
    du cycle de vie du produit comprenant la conception, la fabrication, l''utilisation,
    la maintenance et la destruction finale du produit. Rentrent dans le domaine d''application
    de l''ISO 10303 : la représentation de l''information relative au produit, comprenant
    les composants et les assemblages ; l''échange des données de produit, comprenant
    le stockage, le transfert, l''accès et l''archivage. La présente partie de l''ISO
    10303 définit les principes de base de la représentation et de l''échange de l''information
    relative au produit utilisés dans l''ISO 10303. Elle spécifie les caractéristiques
    des différentes séries de parties de l''ISO 10303 et les relations existant entre
    elles. Rentrent dans le domaine d''application de la présente partie de l''ISO
    10303 : une vue d''ensemble de la Norme internationale ISO 10303 ; la structure
    de la Norme internationale ISO 10303 ; les définitions des termes employés dans
    l''ensemble de la Norme internat 1086ionale ISO 10303 ; une vue d''ensemble des
    méthodes de spécification de données utilisées dans la présente norme internationale
    incluant le langage EXPRESS de spécification de données ainsi que la représentation
    graphique des modèles d''information de produit ; une présentation des ressources
    intégrées ; une présentation des protocoles d''application utilisés pour définir
    le domaine d''application, le contexte et les exigences d''information d''une
    application, ainsi que la représentation des informations de l''application ;'
