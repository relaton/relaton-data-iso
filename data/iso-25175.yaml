abstract:
- language: en
  script: Latn
  content: This document defines the standard test method for reverse osmosis (RO)
    and nanofiltration (NF) membrane element. It normalize the species and testing
    conditions including test solution composition, operating pressure, temperature,
    pH, and recovery. Water production, membrane permeation,and salt rejection were
    used as the performance index, combining test equipment, procedure, and data processing
    to form standard test method. It will help to eliminate the obstacles encountered
    by seawater desalination practitioners when they choose membrane element suitable
    for the specific application scenarios.
