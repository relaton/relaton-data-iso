abstract:
- language: en
  script: Latn
  content: 'ISO 22650 specifies a method for the determination of the heel attachment
    of footwear and applies to women''s medium- and high-heeled footwear. This test
    method measures three related wear properties: the rigidity of the shoe backpart
    during normal walking;the amount of permanent deformation of the backpart caused
    by a fairly large force applied to the heel in a backward direction;the force
    required to detach the heel.'
