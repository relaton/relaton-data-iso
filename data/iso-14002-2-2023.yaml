abstract:
- language: en
  script: Latn
  content: This document gives general guidelines for organizations seeking to address
    water-related environmental aspects, environmental impacts, environmental conditions,
    and the associated risks and opportunities within an environmental management
    system in accordance with ISO 14001. The document addresses issues for environmental
    management related to water quantity and quality, such as water withdrawal, efficient
    use of water, and water discharge, as well as approaches to cope with water-related
    events such as flooding and droughts. The document considers the interconnections
    of water with other environmental media and takes a holistic approach to the management
    of water due to its impacts on ecosystems, ecosystem services, related biodiversity,
    as well as human life and well-being. This document is applicable to organizations
    irrespective of their size, type, financial resources, location and sector. It
    is applicable to all types of water and considers a life cycle perspective.
