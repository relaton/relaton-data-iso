abstract:
- language: en
  script: Latn
  content: ISO 9236-1:2004 specifies methods for the determination of the sensitometric
    curve shape, average gradient and speed of a single sample of a screen/film/filmholder/processing
    system for medical radiography. It is not applicable to special radiographic applications
    such as mammography, dental radiography and direct-exposing medical radiographic
    systems (see for example ISO 5799). The filmholder can be any means that ensures
    close screen/film contact and prevents the film from being exposed to ambient
    light. In particular, the filmholder can be a light-tight vacuum bag, as often
    used in the laboratory, or a radiographic cassette as used in medical radiography.
