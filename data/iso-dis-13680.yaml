abstract:
- language: en
  script: Latn
  content: 'This document specifies the technical delivery conditions for corrosion-resistant
    alloy seamless products for casing, tubing, coupling stock and accessory material
    (including coupling stock and accessory material from bar) for two product specification
    levels: PSL-1, which is the basis of this document; PSL-2, which provides additional
    requirements for a product that is intended to be both corrosion and cracking
    resistant for the environments and qualification method specified in Annex G and
    in the ISO 15156 series or NACE MR0175. This document contains no provisions relating
    to the connection of individual lengths of pipe. Demonstration of conformance
    to ISO 15156-3:2020 or NACE MR0175-2021 of material affected by end sizing, connection
    manufacture or welding operations is outside the scope of this document. This
    document contains provisions relating to marking of tubing and casing after threading.
    This document is applicable to the following five groups of products: a)      
    group 1, which is composed of stainless alloys with a martensitic or martensitic/ferritic
    structure; b)       group 2, which is composed of stainless alloys with a ferritic-austenitic
    structure, such as duplex and super-duplex stainless alloy; c)        group 3,
    which is composed of stainless alloys with an austenitic structure (iron base);
    d)       group 4, which is composed of nickel-based alloys with an austenitic
    structure (nickel base); e)       group 5, which is composed of bar only (Annex F)
    in age-hardened (AH) nickel-based alloys with austenitic structure.'
