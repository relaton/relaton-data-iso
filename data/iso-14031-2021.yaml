abstract:
- language: en
  script: Latn
  content: This document gives guidelines for the design and use of environmental
    performance evaluation (EPE) within an organization. It is applicable to all organizations,
    regardless of type, size, location and complexity. This document does not establish
    environmental performance levels. It is not intended for use for the establishment
    of any other environmental management system (EMS) conformity requirements. The
    guidance in this document can be used to support an organization's own approach
    to EPE including its commitments to compliance with legal and other requirements,
    the prevention of pollution and continual improvement, among others. NOTE This
    document is a generic standard and does not include guidance on specific methods
    for valuing or weighting different kinds of impacts in different kinds of sectors,
    disciplines, etc. Depending on the nature of the organization's activities, there
    is often a need to also go to other sources for additional information and guidance
    on sector-specific topics, different subject matters or different scientific disciplines.
