abstract:
- language: en
  script: Latn
  content: ISO 22306:2007 specifies the properties of the piping system and its components
    made from fibre-reinforced cement, based upon Portland cement, intended to be
    used for drainage or sewerage systems. ISO 22306:2007 is applicable to fibre-reinforced
    cement pipes and fittings suitable primarily for use in gravity systems at atmospheric
    pressure in buried applications. Pipes satisfying the requirements of ISO 22306:2007,
    although exhibiting some flexible characteristics, are intended for installations
    designed using rigid pipe principles.
