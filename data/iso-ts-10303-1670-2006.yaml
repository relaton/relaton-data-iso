abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1670:2006 specifies the application module for Fabrication
    technology. ISO/TS 10303-1670:2006 deals with the representation of the information
    needed to describe the properties of the fabrication technology selected for the
    interconnect substrate being designed. ISO/TS 10303-1670:2006 also supports description
    of simple and complex templates for layout design, and of technology specific
    layer stackup models able to support multiple material combinations. The following
    are within the scope of ISO/TS 10303-1670:2006: fabrication technology properties;layout
    pattern templates;layout pattern template properties;definition of stratum stack
    model.'
