abstract:
- language: en
  script: Latn
  content: This document describes the types, positions and functions of the rider-operated
    controls on a motorcycle/moped[1], in order to facilitate use. Annex A specifies
    controls, indicators and tell-tales for which identification is obligatory and
    the appropriate graphical symbols. Annex B provides the information for applying
    for electrically propelled motorcycle/moped1). This document applies to those
    controls which, when fitted, are commonly used by the rider of a motorcycle/moped.
    The definition or specification of a control does not signify the mandatory presence
    of each and every control listed in this document on a vehicle. [1] "motorcycle/moped"
    as defined in ISO 3833 but does not include a steering wheel type.
