abstract:
- language: en
  script: Latn
  content: 'This document specifies the model and content of integrated development
    and operation capabilities, establishes a framework, and mainly includes the classification
    of capability domains. Around the six major capability domains of project management,
    process improvement, support and assurance, product development, service management,
    and infrastructure, specific requirements for the capabilities belonging to each
    capability domain and the practical activities supporting different capabilities
    have been defined in detail. This document is applicable to: — Organizations seek
    suppliers to acquire software systems and services for development and operation,
    and require assurance of software development quality, efficiency, and quality
    of post operation and maintenance. — Organizations that wish to demonstrate their
    software development, delivery, and post operation management capabilities. —
    The organization aims to continuously improve the performance of software development,
    delivery, and later operation and maintenance management through the effective
    implementation and operation of this document.'
