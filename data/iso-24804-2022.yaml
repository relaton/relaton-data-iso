abstract:
- language: en
  script: Latn
  content: This document specifies requirements for rebreather diver training programmes
    which provide the competencies required to perform dives with a rebreather to
    a maximum depth of 30 m that do not require mandatory decompression stops using
    a nitrox breathing gas. This document specifies evaluation criteria for these
    competencies. This document specifies the requirements under which training is
    provided, in addition to the general requirements for recreational diving service
    provision in accordance with ISO 24803.
