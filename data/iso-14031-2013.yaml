abstract:
- language: en
  script: Latn
  content: ISO 14031:2013 gives guidance on the design and use of environmental performance
    evaluation (EPE) within an organization. It is applicable to all organizations,
    regardless of type, size, location and complexity. ISO 14031:2013 does not establish
    environmental performance levels. The guidance in ISO 14031:2013 can be used to
    support an organization's own approach to EPE, including its commitments to compliance
    with legal and other requirements, the prevention of pollution, and continual
    improvement.
