abstract:
- language: en
  script: Latn
  content: ISO 8496:2013 specifies a method for a ring tensile test of tubes to reveal
    surface and internal defects by subjecting the test piece to strain until fracture
    occurs. This test may also be used to assess the ductility of tubes. The ring
    tensile test is applicable to tubes having an outside diameter exceeding 150 mm
    and a wall thickness no greater than 40 mm. The inside diameter shall be greater
    than 100 mm.
