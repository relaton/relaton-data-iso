abstract:
- language: en
  script: Latn
  content: ISO 12966-3:2016 specifies a rapid base-catalysed transesterification method
    for fats and oils with trimethylsulfonium hydroxide (TMSH) to prepare fatty acid
    methyl esters. The method is exclusively applicable to the preparation of methyl
    esters of fats and oils for gas liquid chromatographic (GLC) analysis. It is applicable
    to all fats and oils, but excluding those coming from milk and milk products.
    Isomerization of unsaturated fatty acids only occurs to a minor extent and isomerized
    fatty acids are only present at the determination limit. As isomerization takes
    place, the procedure is not recommended for conjugated linoleic acid (CLA). Only
    about 70 % to 80 % of the free fatty acids are esterified. In the case of conjugated
    cyclopropyl and cyclopropenyl fatty acids, side reactions may occur, but these
    do not interfere with the determination of the fatty acids.
