abstract:
- language: en
  script: Latn
  content: This document gives requirements for labels attached to syringes so that
    the contents can be identified just before use during anaesthesia. It covers the
    colour, size, design and general properties of the label and the typographical
    characteristics of the wording for the drug name. NOTE National or regional regulations
    might require additional labelling, which can include bar coding. No requirements
    for this additional labelling are given.
