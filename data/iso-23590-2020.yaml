abstract:
- language: en
  script: Latn
  content: This document covers the requirements for the design, installation, operation,
    maintenance and the safety of Household Biogas Systems (HBSs), producing biogas
    in an amount equivalent to an installation capacity of less than 100 MWh per year.
    The document applies to HBSs comprising of pipeline and equipment with pressure
    levels of less than 5 kPa. Any equipment or appliances connected to an HBS or
    utilizing the biogas energy of an HBS are not a part of the scope of this document.
