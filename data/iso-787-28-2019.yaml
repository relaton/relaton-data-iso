  script: Latn
  content: This document specifies a method for determining the total content of polychlorinated
    biphenyls (PCBs), checking for all 209 possible congeners in pigment materials.
    This document is applicable to a working range from1 mg/kg to 150 mg/kg. The lower
    quantitation limit of this method is 1 mg/kg per congener. Results below 1 mg/kg
    are considered to be qualitative only.
