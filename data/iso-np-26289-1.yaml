abstract:
- language: en
  script: Latn
  content: This document specifies a static image analysis method for evaluating the
    flow properties of fine ceramic powders based on powder pile formation and geometry.
    The method involves lifting a cylindrical container filled with powder at a constant
    speed to form a conical or approximately conical pile. The resulting powder pile
    is captured using an optical imaging system, and its slope angle, aspect ratio,
    and linearity are quantified to characterize and compare powder flow properties.
    Note 1 This method provides a simple and rapid approach for the quantitative evaluation
    and comparison of powder flow properties. Note 2 This method is applicable to
    both free-flowing and poorly flowing ceramic powders, including those that cannot
    be evaluated using ISO 14629, provided that a measurable powder pile can be formed.
