abstract:
- language: en
  script: Latn
  content: ISO16532-2:2007 specifies a method for the determination of grease resistance
    of paper and board. Primarily, it is intended to establish an approximate level
    of grease resistance, by testing the degree of surface repellency and/or antiwicking
    characteristics of paper and board, internally or surface sized with organophobic
    materials such as fluorocarbons. Some packaging paper and board products, designed
    for containing pet foods, food for human consumption and other materials, are
    produced in this way, and any surface stains, due to grease wetting or penetrating
    the paper or board surface, are aesthetically unacceptable. This test is not intended
    to determine the permeability of grease through the paper or board, for which
    ISO 16532-1 applies.
