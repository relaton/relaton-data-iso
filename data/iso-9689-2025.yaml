abstract:
- language: en
  script: Latn
  content: This document specifies a method for testing the resistance of raw optical
    glasses to attack by aqueous alkaline phosphate-containing detergent solutions
    (phosphate solutions) at 50 °C and a classification of optical glasses according
    to the aqueous alkaline phosphate-containing detergent resistance (phosphate resistance)
    determined by this method. This document is applicable to samples of raw optical
    glasses.
