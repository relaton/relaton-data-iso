abstract:
- language: en
  script: Latn
  content: ISO 31000:2018 provides guidelines on managing risk faced by organizations.
    The application of these guidelines can be customized to any organization and
    its context. ISO 31000:2018 provides a common approach to managing any type of
    risk and is not industry or sector specific. ISO 31000:2018 can be used throughout
    the life of the organization and can be applied to any activity, including decision-making
    at all levels.
