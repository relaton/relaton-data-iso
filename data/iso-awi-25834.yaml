abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the tetrahydrofuran
    (THF) content in butanediol-based polyesters, produced through the copolymerization
    of butanediol and dicarboxylic acids, such as polybutylene succinate (PBS), polybutylene
    terephthalate (PBT), poly (butyleneadipate-co-terephthalate) (PBAT), polybutylene
    adipate terephthalate (PBA), polyethylene naphthalate (PBN), polydiethylene glycol
    sebacate (PBSE) and polysebacic acid butyl terephthalate (PBSeT). This document
    is also applicable as a reference method for the determination of THF contents
    in the blend materials containing one or more polyesters mentioned above (such
    as PBT/PC (polycarbonate) blends).
