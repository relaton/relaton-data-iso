abstract:
- language: en
  script: Latn
  content: ISO 23509:2006 specifies the geometry of bevel gears. The term bevel gears
    is used to mean straight, spiral, zerol bevel and hypoid gear designs. If the
    text pertains to one or more, but not all, of these, the specific forms are identified.
    ISO 23509:2006 is intended for use by an experienced gear designer capable of
    selecting reasonable values for the factors based on his knowledge and background.
    It is not intended for use by the engineering public at large.
