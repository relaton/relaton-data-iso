abstract:
- language: en
  script: Latn
  content: The scope of this proposed standard is to provide the information and the guidance needed to carry out the testing activity of liquid hydrogen valve such as ball valve, butterfly valve, check valve, globe valve, gate valve etc. with reference to current hydrogen technology and applicable international recognized standards as well as international shipping regulations. This standard is based on the analysis of the main properties and hazards of hydrogen which influence the method of its operation as well as how to test material and component. This standard specifies test procedures and requirements for the safety and performance test that shall be conducted in order to confirm the mechanical features of the liquid hydrogen valve on board a ship.
