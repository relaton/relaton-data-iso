abstract:
- language: en
  script: Latn
  content: This document provides guidelines for the calculation of carbon footprints
    for calcium silicate cement (CSC) products. It specifies principles, system boundaries,
    functional units, data requirements, and calculation procedures for assessing
    greenhouse gas (GHG) emissions and removals associated with the production and
    use stages of CSC products. The guideline includes provisions for accounting CO₂
    uptake through carbonation and reaction hardening processes unique to calcium
    silicate systems. It aims to ensure consistency, transparency, and comparability
    in the quantification and reporting of carbon footprints among CSC producers and
    users
