abstract:
- language: en
  script: Latn
  content: ISO 13527:2010 defines how the packaging of data and metadata, including
    software, can be put into a single package (e.g. file or message) in order to
    facilitate information transfer and archiving. ISO 13527:2010 also provides a
    detailed specification of core packaging structures and mechanisms, which accommodate
    the current computing environment and meet evolving requirements, and which can
    be implemented to demonstrate practical, near-term results. ISO 13527:2010 is
    applicable to the entire space informatics domain, from operational messaging
    to interfacing with science archives.
