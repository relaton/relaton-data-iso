abstract:
- language: en
  script: Latn
  content: ISO 2719:2002 describes two procedures, A and B, using the Pensky-Martens
    closed cup tester, for determining the flash point of combustible liquids, liquids
    with suspended solids, liquids that tend to form a surface film under the test
    conditions and other liquids. It is applicable for liquids with a flash point
    above 40 degrees C. Procedure A is used for the determination of the flash point
    of paints and varnishes that do not form a surface film, unused lubricating oils
    and other petroleum products not covered by Procedure B. Procedure B is used for
    the determination of the flash point of residual fuel oils, cutback bitumens,
    used lubricating oils, liquids that tend to form a surface film, liquids with
    suspensions of solids and highly viscous materials such as polymeric solutions
    and adhesives. ISO 2719:2002 is not applicable to water-borne paints or liquids
    contaminated by traces of highly volatile materials.
