abstract:
- language: en
  script: Latn
  content: The principle of the procedure specified is to expose a coated test panel
    to specified humid atmospheres containing sulfur dioxide. A volume of 0,2 litre,
    measured at atmospheric pressure, is generally recommended for testing coatings
    of thickness not exceeding approximately 40 µm. The effects of exposure are evaluated
    by criteria agreed in advance between the interested parties, these criteria being
    usually of a subjective nature. Applies to single-coat film or a multi-coat system
    of paints.
