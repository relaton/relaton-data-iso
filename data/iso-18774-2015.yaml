abstract:
- language: en
  script: Latn
  content: ISO 18774:2015 defines and describes rules for an internationally valid
    system for building short names of any kind of financial instrument within a defined
    structure. This International Standard is intended for use in any application
    in the trading and administration of securities globally. The FISN has been developed
    after taking into account the need of human-readability as well as interoperability
    with existing standards and systems.
