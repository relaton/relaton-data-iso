abstract:
- language: en
  script: Latn
  content: This document specifies a method for the gas-chromatographic determination
    of water in the total particulate matter (TPM) from the mainstream smoke with
    a smoking regime according to ISO 3308 (standard smoking regime) . The smoking
    of cigarettes and the collection of TPM are carried out in accordance with ISO
    4387. However, the method of this document is also applicable to the determination
    of water in TPM obtained by non-standard smoking. NOTE In countries not in a position
    to use the gas-chromatographic method, the determination of water in TPM is performed
    using the Karl Fischer method (see ISO 10362-2). In such cases, values obtained
    for water in TPM are used with the addition of a note made in the expression of
    the results.
