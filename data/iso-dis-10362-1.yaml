abstract:
- language: en
  script: Latn
  content: This document specifies a method for the gas-chromatographic determination
    of water in total particulate matter from the mainstream smoke. The smoking of
    cigarettes and collection of mainstream smoke are normally carried out in accordance
    with ISO 4387. However, the method of this document is also applicable to the
    determination of water in total particulate matter from the mainstream smoke obtained
    by non-standard smoking. NOTE In countries not in a position to use the gas-chromatographic
    method, the determination of water in total particulate matter from the mainstream
    smoke is performed using the Karl Fischer method (see ISO 10362-2). In such cases,
    values obtained for water in total particulate matter from the mainstream smoke
    are used with the addition of a note made in the expression of the results.
