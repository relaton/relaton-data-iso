abstract:
- language: en
  script: Latn
  content: 'ISO/TR 27809:2007 considers the control measures required to ensure patient
    safety in respect to health software products. It does not apply to software which
    is: necessary for the proper application of a medical device or an accessory to
    a medical device or a medical device in its own right. ISO/TR 27809:2007 is aimed
    at identifying what standards might best be used or created, and their nature,
    if health software products were to be regulated or controlled in some other formal
    or informal or voluntary manner whether national, regional or local. However,
    it is not the purpose of ISO/TR 27809:2007 to recommend whether or not health
    software products should be regulated. ISO/TR 27809:2007 applies to any health
    software product whether or not it is placed on the market and whether or not
    it is for sale or free of charge. It is addressed to manufacturers of health software
    products.'
