abstract:
- language: en
  script: Latn
  content: ISO 7250-1:2017 provides a description of anthropometric measurements which
    can be used as a basis for comparison of population groups and for the creation
    of anthropometric databases (see ISO 15535). The basic list of measurements specified
    in this document is intended to serve as a guide for ergonomists who are required
    to define population groups and apply their knowledge to the geometric design
    of the places where people work and live. In addition, the list serves as a basis
    for extracting one- and two-dimensional measurements from three-dimensional scans
    (specified in ISO 20685). It serves as a guide on how to take anthropometric measurements,
    but also gives information to the ergonomist and designer on the anatomical and
    anthropometrical bases and principles of measurement which are applied in the
    solution of design tasks. ISO 7250-1:2017 is intended to be used in conjunction
    with national or international regulations or agreements to ensure harmony in
    defining population groups and to allow comparison of anthropometric data among
    member bodies. In its various applications, it is anticipated that the basic list
    will be supplemented by specific additional measurements. Annex A shows the correspondence
    of dimensions described here with their use in ISO 14738 and ISO 15534.
