abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the qualification of welders and
    welding operators for fusion welding of metallic materials for aerospace applications.
    NOTE          Success in the test is an essential precondition for the qualification
    of welders and welding operators in new production and repair work in aerospace.
    However, welding equipment operators do not need to be qualified according to
    this document.
