abstract:
- language: en
  script: Latn
  content: 'This document specifies an additional test for verifying the stability
    of a truck under the special operating condition of stacking with mast tilted
    forward and load in the elevated position. This document is applicable to the
    following types of trucks as defined in ISO 5053-1 when fitted with a tiltable
    mast:  counterbalance lift trucks; reach and straddle trucks; pallet-stacking
    trucks; side-loading trucks; multi-directional lift trucks; rough-terrain trucks;
    articulated counterbalance lift trucks.'
