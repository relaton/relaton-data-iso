abstract:
- language: en
  script: Latn
  content: This document covers the operation and production control of metal powder
    bed fusion (PBF) machines and processes for areas of critical applications. A
    critical application is assumed once failing parts-functionality leads to immediate
    threats. This document is applicable for production of parts and mechanical test
    specimens using powder bed fusion (PBF) with both laser and electron beams. Specifications
    related to specific fields of application are provided in respective standards.
