abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1092:2019 specifies the application module for Maths value.
    The following are within the scope of ISO/TS 10303-1092:2019: a maths value that
    is a real; NOTE 1   A maths value is an object, which can be something simple
    like a real number, or something complicated like a maths space or maths function.
    In this part of ISO 10303, a maths value is regarded as an extensible ''SELECT''
    of different concepts. Only those concepts in this list are included by this part
    of ISO 10303, but others concepts may be added by other application modules, such
    as Maths_space. NOTE 2   The concepts in this list are defined completely in ISO
    10303-50. This part of ISO 10303 merely references them and does not add any additional
    semantics. a maths value that is an integer; a maths value that is a complex number;
    a maths value that is either the Boolean value ''true'' or the ''Boolean value
    ''false''; a maths value that is a tuple of other maths values.'
