abstract:
- language: en
  script: Latn
  content: 'ISO 5492:2008 defines terms relating to sensory analysis. ISO 5492:2008
    applies to all industries concerned with the evaluation of products by the sense
    organs. The terms are given under the following headings: 1) general terminology;
    2) terminology relating to the senses; 3) terminology relating to organoleptic
    attributes; and 4) terminology relating to methods. In addition to terms used
    in the three official ISO languages (English, French and Russian), this document
    gives the equivalent terms in German and Spanish; these are published under the
    responsibilities of the member bodies for Germany (DIN) and for Argentina (IRAM),
    respectively, and are given for information only. Only the terms and definitions
    given in the official languages can be considered as ISO terms and definitions.'
