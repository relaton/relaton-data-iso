abstract:
- language: en
  script: Latn
  content: 'This project aims to specify a reference model for smart contract-based
    B2B electronic transactions. The reference model consists of the following five
    components, which include B2B core components:  ——Transaction party’s authentication
    and responsibility;  ——Transaction procedure and execution;  ——Transaction consensus
    mechanism;  ——Transaction verification mechanism;  ——Security controls.'
