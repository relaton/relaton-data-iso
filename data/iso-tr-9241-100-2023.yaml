abstract:
- language: en
  script: Latn
  content: 'This document provides an overview of ISO 9241 software ergonomic standards
    in the form of executive summaries of these standards, in particular the parts
    in the ISO 9241-1XX family of documents. In addition, it provides executive summaries
    for ISO 9241-11, ISO 9241-210 and ISO 9241-220, which have specific relevance
    to the design of software-based interactive systems. This document is intended
    for the following types of users: —     managers, who are involved in planning
    and managing product, system and/or service development projects, who are to be
    informed on the human-centred design approach and on guidance on software ergonomics;
    —     developers, who will apply the guidance in these documents during the development
    process (either directly, based on training, or by using tools and style guides
    which incorporate the guidance); —     user interface design roles (including
    interaction designers, information architects, user interface designers, visual
    designers and content creators), who will apply the guidance in these documents
    during the creation and design process (either directly, based on training, or
    by using tools and style guides which incorporate the guidance); —     user researchers,
    who are responsible for identifying user needs and inform context of use of a
    product, system or service; —     evaluators, who are responsible for ensuring
    that products, systems or services meet the recommendations contained in these
    documents; —     buyers, who will reference these documents in contracts during
    product procurement; —     designers of user interface development tools and style
    guides to be used by user interface designers and developers. While the documents
    are applicable to all types of interactive systems, they do not cover the specifics
    of every context of use, such as safety critical systems and collaborative work.'
