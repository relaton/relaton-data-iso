abstract:
- language: en
  script: Latn
  content: ISO 17202 specifies a method for the determination of the direction of
    twist in single yarns and the amount of twist, in terms of turns per unit length,
    by the indirect untwist/retwist method. It is applicable to single spun yarns.
    The method is designed primarily for yarns in packages, but by the application
    of special precautions the procedures can be used for yarns taken from fabrics.
