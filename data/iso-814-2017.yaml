abstract:
- language: en
  script: Latn
  content: ISO 814:2017 specifies a method for determining the adhesion strength of
    rubber-to-metal bonds where the rubber part is assembled between two parallel
    metal plates, using the adhesive system under investigation. The method is applicable
    primarily to test pieces, prepared in the laboratory under standard conditions,
    such as can be used to provide data for the development of rubber compounds and
    control of methods of manufacture.
