abstract:
- language: en
  script: Latn
  content: ISO 28927-11:2011 specifies a laboratory method for measuring hand-transmitted
    vibration emission at the handles of hand-held stone hammers. It is a type-test
    procedure for establishing the magnitude of vibration in the gripping areas of
    a stone hammer when operated in laboratory conditions. It is intended that the
    results be used to compare different models of the same type of machine. ISO 28927-11:2011
    is applicable to engraving pens and stone hammers intended for use by stone masons,
    driven pneumatically or by other means. It is not applicable to demolition hammers
    or to chipping hammers primarily intended for use on metal or in construction.
