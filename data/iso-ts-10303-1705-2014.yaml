abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1705:2014-02 specifies the application module for Functional
    usage view. The following are within the scope of ISO/TS 10303-1705:2014-02: the
    representation of information needed to describe the interface to a function and
    a method to represent the behaviour of the function in a computer based experiment
    using a simulation model external to the function detailed definition. characterization
    of behaviour realized by one or more versions of a part or a product, or a subset
    of a product;characterization of behaviour not realized by a real product but
    defined only for experimental purposes;identification of the interface of a functional
    unit.'
