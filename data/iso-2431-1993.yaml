abstract:
- language: en
  script: Latn
  content: Four flow cups of similar dimensions, but having orifice diameters of 3
    mm, 4 mm, 5 mm and 6 mm, are specified, The method for their calibration is given.
    Flow time may be used to control consistency (a method for the adjustment of paints
    to the correct application consistency at the application temperature is described
    in Annex A). The method is limited to testing materials for which the breakpoint
    of the flow from the orifice of the flow cup can be determined with certainty.
    This point is difficult to determine and reproduce for materials with flow times
    in excess of 100 s.
