abstract:
- language: en
  script: Latn
  content: 'ISO 11592-1:2016 specifies the requirements for determination of the maximum
    propulsion power rating and manoeuvring speed for engine-driven small craft with
    a length of hull (LH) of less than 8 m (Lh according to ISO 8666). It is not applicable
    to the following: personal water craft as defined by ISO 13590;[6] canoes and
    kayaks; inflatable boats, as defined by ISO 6185-1, ISO 6185-2, ISO 6185-3, and
    ISO 6185-4, except that ISO 6185‑3 requires rigid inflatable boats (RIBS) capable
    of a maximum speed of 30 kn or more to be tested in accordance to this part of
    ISO 11592; racing boats: craft designed and constructed solely for competitive
    racing. ISO 11592-1:2016 does not specify craft constructional strength requirements
    related to maximum rated power and does not guarantee security from instability
    under all conditions of seaway, wind, wakes and waves.'
