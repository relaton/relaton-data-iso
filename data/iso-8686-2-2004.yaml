abstract:
- language: en
  script: Latn
  content: ISO 8686-2:2004 applies the principles set forth in ISO 8686-1 to mobile
    cranes, as defined in ISO 4306-2, and presents loads and load combinations appropriate
    for use in proof-of-competence calculations for the steel structures of mobile
    cranes. ISO 8686-2:2004 is applicable to mobile cranes used for normal service
    and to mobile cranes used for duty cycle service. NOTE Means for proof-of-competence
    testing will be addressed in another document.
