abstract:
- language: en
  script: Latn
  content: 'ISO 7967-11:2014 establishes a vocabulary for fuel systems of reciprocating
    internal combustion engines. Also, in ISO 7967-11:2014, the terms and the definitions
    are classified as follows: ? fuel supply system (3.1); ? carburetor (3.2); ? fuel
    injection system (3.3). ISO 2710‑1 gives a classification of reciprocating internal
    combustion engines and denotes the basic terms and definitions of such engines
    and their characteristics.'
