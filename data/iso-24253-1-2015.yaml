abstract:
- language: en
  script: Latn
  content: ISO 24253-1:2015 specifies field measurements of spray deposition to determine
    the quantity and distribution of spray in a plane surface area, treated by horizontal
    boom sprayers with downward directed application. ISO 24253-1:2015 allows flexibility
    in the arrangement of field tests, but specifies standardized measurement procedures
    that are useful to be able to compare the results from different field experiments
    or to compare with laboratory tests, such as that described in ISO 5682‑2. ISO
    24253-1:2015 may not be appropriate for those spraying systems which rely on the
    presence of a crop canopy for efficient deposition (for example directed spraying,
    electrostatic charged spraying, very fine spraying, variable rate spraying). ISO
    24253 is not intended for use in or for a regulatory framework.
