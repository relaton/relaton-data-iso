abstract:
- language: en
  script: Latn
  content: 'ISO 17892-4.2016 specifies a method of determining the particle size distribution
    of soils. ISO 17892-4.2016 is applicable to the laboratory determination of the
    particle size distribution of a soil test specimen by sieving, or sedimentation,
    or a combination of both within the scope of geotechnical investigations. The
    particle size distribution is one of the most important physical characteristics
    of soil. Classification of soils is mainly based on the particle size distribution.
    Many geotechnical and geohydrological properties of soil are related to the particle
    size distribution. The particle size distribution provides a description of soil
    based on a subdivision in discrete classes of particle sizes. The size of each
    class can be determined by sieving and/or sedimentation. Coarse soils are usually
    tested by sieving, but fine and mixed soils are usually tested by a combination
    of sieving and sedimentation, depending on the composition of the soil. The sieving
    method described is applicable to all non-cemented soils with particle sizes less
    than 125 mm. Two sedimentation methods are described: the hydrometer method and
    the pipette method. NOTE ISO 17892-4.2016 fulfils the requirements of the particle
    size distribution testing in accordance with EN 1997-2.'
