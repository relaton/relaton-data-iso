abstract:
- language: en
  script: Latn
  content: This part of document ISO 24505 provides a method for creating conspicuous
    colour combinations for general population. This includes individuals with diverse
    colour vision characteristics such as colour deficiency, low vision, and age-related
    changes in colour perception. The basic method is based on that prescribed in
    ISO 24505 and ISO 24505-2, which collectively address the full spectrum of colour
    vision types covered in these referenced standards. This part of document addresses
    the design of visual signs and displays in which multiple colours are used in
    various types of combinations in order to make the combinations visible, conspicuous
    and comprehensive to people with the diversity of colour vision. Moreover, the
    requirements presented in this part, along with those found in ISO 24505 and ISO
    24505-2, are primarily oriented towards reflective or object-mode colours. However,
    they may also be adapted for application to self-luminous-mode colours provided
    that the colour coordinates are appropriately transferred to those of the object-mode
    colours. For the special use of colour for safety, selection of colours and their
    combinations shall comply with ISO 3864-1.
