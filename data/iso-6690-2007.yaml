abstract:
- language: en
  script: Latn
  content: ISO 6690:2007 specifies mechanical tests for milking machine installations
    in order to verify compliance of an installation or component with the requirements
    of ISO 5707. It also stipulates the accuracy requirements for the measuring instruments.
    ISO 6690:2007 is applicable for testing new installations and for periodic checking
    of installations for efficiency of operation. Alternative test methods may be
    applicable if they can be shown to achieve comparable results. The test procedures
    described are primarily for testing in the laboratory. An example of a field test
    procedure which can reduce the time and effort involved in testing is given together
    with the corresponding test report.
