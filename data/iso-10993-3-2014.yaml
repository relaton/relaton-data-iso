abstract:
- language: en
  script: Latn
  content: 'ISO 10993-3:2014 specifies strategies for risk estimation, selection of
    hazard identification tests and risk management, with respect to the possibility
    of the following potentially irreversible biological effects arising as a result
    of exposure to medical devices: genotoxicity; carcinogenicity; reproductive and
    developmental toxicity. ISO 10993-3:2014 is applicable when the need to evaluate
    a medical device for potential genotoxicity, carcinogenicity, or reproductive
    toxicity has been established.'
