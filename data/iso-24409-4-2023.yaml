abstract:
- language: en
  script: Latn
  content: This document establishes design principles for shipboard escape plan signs
    that contain information relevant to escape, embarkation, and fire safety, to
    be used for general information on board ships. These plans are intended to be
    displayed as signs in cabins and public areas, such as required by regulations.
    This document is not intended to cover the plans to be used by crew. The plans
    for crew are described in ISO 17631.
