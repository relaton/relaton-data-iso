abstract:
- language: en
  script: Latn
  content: This document provides background information and a validated methodology
    for optical reflection measurements for flat direct view electronic displays.
    This document includes calculation methods for using measured reflection coefficients
    to predict display performance in specific indoor and outdoor ambient illumination
    conditions. This document demonstrates optical measurements of electrophoretic
    displays (EPDs), as a reflective electronic visual display technology; many methods
    are also applicable to other appropriate reflective and emissive displays. This
    document does not include a methodology for ergonomics evaluation.
