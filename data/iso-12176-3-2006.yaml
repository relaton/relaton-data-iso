abstract:
- language: en
  script: Latn
  content: ISO 12176-3:2006 describes the format and the contents of a fusion operator's
    badge, which is used during the construction of polyethylene (PE) piping systems
    for the supply of gaseous fuels or water to identify the fusion operator and to
    activate or deactivate the fusion-jointing equipment. The objective of this part
    of ISO 12176 is to achieve international interoperability between the operator's
    badge and the card-reading equipment of fusion-jointing equipment conforming to
    ISO 12176-1 or ISO 12176-2.
