abstract:
- language: en
  script: Latn
  content: ISO 10239:2014 covers the installation of permanently installed liquefied
    petroleum gas LPG systems and LPG burning appliances on small craft of up to 24
    m length of hull. It does not cover devices used for LPG-fuelled propulsion engines
    or LPG-driven generators. It covers cooking appliances with internal LPG cartridges,
    with a capacity of 225 g or less (See Annex D). It covers storage of all LPG cylinders
    but is not intended to regulate the technical requirements for such cylinders
    that are subject to national regulations It does not contain procedures for commissioning
    the LPG installation.
