abstract:
- language: en
  script: Latn
  content: ISO 21898:2004 specifies materials, construction and design requirements,
    type test, certification and marking requirements for flexible intermediate bulk
    containers (FIBCs) intended to contain non-dangerous solid materials in powder,
    granular or paste form, and designed to be lifted from above by integral or detachable
    devices. Guidance is also provided on the selection and safe usage of FIBCs.
