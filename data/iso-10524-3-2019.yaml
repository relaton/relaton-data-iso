abstract:
- language: en
  script: Latn
  content: This document specifies design, type testing, and marking requirements
    for cylinder valves with integrated pressure regulators [as defined in 3.26 and
    referred to hereafter as valves with integrated pressure regulators (VIPRs)] intended
    for the administration of medical gases in the treatment, management, diagnostic
    evaluation and care of patients or for gases used for driving surgical tools.
    Examples of gases include oxygen, medical air and oxygen/nitrous oxide mixtures.
    This document applies to VIPRs mounted on refillable cylinders with a working
    pressure up to 30 000 kPa (300 bar) intended to be filled in cylinder filling
    facilities or on self-filling systems as used in homecare applications. VIPRs
    covered by this document are pressure pre-set and provided with a pressure outlet
    and/or pre-set flow outlet(s).
