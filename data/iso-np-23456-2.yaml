abstract:
- language: en
  script: Latn
  content: 'Scope of the proposed deliverable This document specifies visibility and
    safety considerations regarding the installation of dynamic signs, including the
    display contents and signage location. This document provides requirements and
    recommendations concerning dynamic signs from three perspectives: 1) ensuring
    the visibility of dynamic signs, 2) image safety concerns related to videos displayed
    in dynamic signs (e.g., photosensitive seizures (PSS), visually induced motion
    sickness (VIMS)), 3) reducing the impact on pedestrian traffic flow caused by
    the location of dynamic signs. This document applies to pedestrians, not persons
    in vehicles. Furthermore, it does not cover signs for guidance to evacuation sites.'
