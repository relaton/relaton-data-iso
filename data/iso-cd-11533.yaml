abstract:
- language: en
  script: Latn
  content: ISO 11533:2009 specifies a flame atomic absorption spectrometric method
    for the determination of the mass fraction of cobalt in iron ores. This method
    is applicable to a mass-fraction range of 0,000 7 % to 0,06 % of cobalt in natural
    iron ores, iron ore concentrates and agglomerates, including sinter products.
