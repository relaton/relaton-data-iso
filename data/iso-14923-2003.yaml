abstract:
- language: en
  script: Latn
  content: ISO 14923:2003 specifies an overview of the characteristics of coatings
    produced by thermal spraying. It is not possible in ISO 14923:2003 to go into
    details regarding the different types of coatings and large numbers of coatings
    due to the fact that all meltable materials can be processed by thermal spraying
    and that so many and varied thermal spraying processes exist. The tests described
    are procedures and test criteria in general use for thermally sprayed coatings.
    Any test methods not mentioned are only used in special cases or under laboratory
    conditions.
