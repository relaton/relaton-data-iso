abstract:
- language: en
  script: Latn
  content: ISO 15367-1:2003 specifies methods for the measurement of the topography
    of the wavefront of a laser beam by measurement and interpretation of the spatial
    distribution of the phase of that wavefront across a plane approximately perpendicular
    to its direction of propagation. Requirements are given for the measurement and
    analysis of phase distribution data to provide quantitative wavefront parameters
    and their uncertainty in a test report. The methods described in ISO 15367-1:2003
    are applicable to the testing and characterization of a wide range of beam types
    from both continuous wave and pulsed lasers. Definitions of parameters describing
    wavefront deformations are given together with methods for the determination of
    those parameters from phase distribution measurements.
