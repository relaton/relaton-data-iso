abstract:
- language: en
  script: Latn
  content: ISO 5658-2:2006 specifies a method of test for measuring the lateral spread
    of flame along the surface of a specimen of a product orientated in the vertical
    position. ISO 5658-2:2006 provides data suitable for comparing the performance
    of essentially flat materials, composites or assemblies that are used primarily
    as the exposed surfaces of walls in buildings and transport vehicles, such as
    ships and trains. Some profiled products (such as pipes) can also be tested under
    specified mounting and fixing conditions. ISO 5658-2:2006 is applicable to the
    measurement and description of the properties of materials, products or assemblies
    in response to radiative heat in the presence of a pilot flame under controlled
    laboratory conditions. ISO 5658-2:2006 is not suitable to be used alone to describe
    or appraise the fire hazard or fire risk of materials, products or assemblies
    under actual fire conditions.
