abstract:
- language: en
  script: Latn
  content: 'ISO 22745-20:2010 contains procedures for maintenance of an open technical
    dictionary (OTD). It includes procedures to: register a consensus organization
    so that it can contribute terminology to an OTD; add a new concept, with associated
    terminology, to an OTD; add terminology to an existing concept in an OTD; mark
    terminology for an existing concept as deleted; merge concepts.'
