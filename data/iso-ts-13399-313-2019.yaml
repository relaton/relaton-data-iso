abstract:
- language: en
  script: Latn
  content: 'This document defines the concept of how to design tool items, limited
    to any kind of burrs, together with the usage of the related properties and domains
    of values. This document specifies the requirements of simplified 3D models for
    data exchange of burrs. The following are outside the scope of this document:
    — applications where these standard data can be stored or referenced; — creation
    and exchange of 3D models for cutting tools; — creation and exchange of 3D models
    for cutting items; — creation and exchange of 3D models for other tool items not
    described in the scope of this document; — creation and exchange of 3D models
    for adaptive items; — creation and exchange of 3D models for assembly items and
    auxiliary items.'
