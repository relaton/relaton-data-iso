abstract:
- language: en
  script: Latn
  content: 'This document specifies sustainability requirements together with assessment
    methods and evaluation schemes for ceramic tiles and installation materials. This
    document includes relevant criteria across product life cycle from raw material
    through manufacturing, use, and end-of-life management. This document applies
    to ceramic tile installation materials including: ceramic tiles, adhesives, grouts,
    membranes, etc. This document deals with adhesives and other tiling materials.'
