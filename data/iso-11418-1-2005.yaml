abstract:
- language: en
  script: Latn
  content: ISO 11418-1:2005 specifies the design, dimensions, material and requirements
    of drop-dispensing glass bottles. Drop-dispensing glass bottles are applicable
    to primary packs used in direct contact with a drug. ISO 11418-1:2005 is applicable
    to drop-dispensing glass bottles used in pharmacy. Together with the corresponding
    closure systems, they serve for packaging of pharmaceutical preparations which
    are not intended for parenteral use.
