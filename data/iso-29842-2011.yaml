abstract:
- language: en
  script: Latn
  content: ISO 29842:2011 specifies a method for the application of balanced incomplete
    block designs to sensory descriptive and hedonic tests. ISO 29842:2011 applies
    when the number of test samples exceeds the number of evaluations that an assessor
    can perform reliably in a single session. ISO 29842:2011 also specifies the fundamental
    characteristics of balanced incomplete block designs and establishes guidelines
    for their application in sensory evaluation.
