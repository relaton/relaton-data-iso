abstract:
- language: en
  script: Latn
  content: This document specifies the standardized camera messages and data types
    used by a VCIC camera (OSI layer 7). Applications hosted on ECUs want to communicate
    with one or more cameras (e.g. “Ask camera for parameters.”). If the applications
    can use standardized services supported by the cameras (API layer 7), the development
    of a vision application is independent on the camera used. The services can be
    implemented by general libraries. The definition of streaming data is not an issue
    of this API.
