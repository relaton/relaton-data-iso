abstract:
- language: en
  script: Latn
  content: ISO 7176-26:2007 specifies a vocabulary consisting of terms and definitions
    used in the field of manual and electrically powered wheelchairs (including scooters)
    and associated seating systems. ISO 7176-26:2007 includes, but is not limited
    to, the preferred terms used in two or more ISO standards of the ISO 7176, ISO
    10542 and ISO 16840 series, but does not include terms considered to be adequately
    defined in everyday English.
