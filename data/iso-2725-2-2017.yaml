abstract:
- language: en
  script: Latn
  content: ISO 2725-2:2017 specifies dimensions, designation, and marking of machine-operated
    "impact" square drive sockets with operating end having a hexagonal or double
    hexagonal form in accordance with ISO 1174‑2. NOTE Machine-operated "impact" square
    drive sockets covered by this document are the ones identified in ISO 1703 under
    reference numbers 2 2 02 01 0. ISO 2725-2:2017 does not cover technical specifications
    for these products. Technical specifications are given in ISO 1711‑2.
