abstract:
- language: en
  script: Latn
  content: This guidance presents methodologies for the quantification, measurement,
    monitoring and reporting of food loss and waste (FLW), including but not limited
    to, standardizing definitions and terminology, the assessing of the accuracy of
    specific methodologies, describing the equipment required, the benefits and drawbacks
    of implementing measurement methodologies, and their suitability to different
    stages of the food supply chain (from primary production to consumption). The
    selection of useful methodologies is conducted by specific organizations to their
    specific need, depending on e.g., types of business and the objectives of the
    quantification, measurement, monitoring and reporting. This is intended to help
    organizations analyze FLW occurrences, quantities and hotspots in line with the
    organization’s policies and objectives, the root causes of FLW hotspots, monitor
    and report quantities and assess progress over time, and to verify the efficacy
    of FLW reduction actions.
