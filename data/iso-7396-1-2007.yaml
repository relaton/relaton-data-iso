abstract:
- language: en
  script: Latn
  content: 'ISO 7396-1:2007 specifies requirements for design, installation, function,
    performance, documentation, testing and commissioning of pipeline systems for
    compressed medical gases, gases for driving surgical tools and vacuum in healthcare
    facilities to ensure continuous delivery of the correct gas and the provision
    of vacuum from the pipeline system. It includes requirements for supply systems,
    pipeline distribution systems, control systems, monitoring and alarm systems and
    non-interchangeability between components of different gas systems. ISO 7396-1:2007
    is applicable to pipeline systems for the following medical gases: oxygen, nitrous
    oxide, medical air, carbon dioxide, oxygen/nitrous oxide mixtures; to pipeline
    systems for the following gases: oxygen-enriched air, air for driving surgical
    tools, nitrogen for driving surgical tools; and to pipeline systems for vacuum.
    ISO 7396-1:2007 also applies to extensions of existing pipeline distribution systems,
    modifications of existing pipeline distribution systems and modifications or replacement
    of supply systems or sources of supply.'
