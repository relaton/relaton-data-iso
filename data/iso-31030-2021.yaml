abstract:
- language: en
  script: Latn
  content: 'This document gives guidance to organizations on how to manage the risk(s),
    to the organization and its travellers, as a result of undertaking travel. This
    document provides a structured approach to the development, implementation, evaluation
    and review of: policy; programme development; threat and hazard identification;
    opportunities and strengths; risk assessment; prevention and mitigation strategies.
    This document is applicable to any type of organization, irrespective of sector
    or size, including but not limited to: commercial organizations; charitable and
    not-for-profit organizations; governmental organizations; non-governmental organizations;
    educational organizations. This document does not apply to tourism and leisure-related
    travel, except in relation to travellers travelling on behalf of the organization.'
