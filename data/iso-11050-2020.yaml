abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the content of impurities
    of animal origin in wheat flours, with or without additives and having an ash
    yield not exceeding a mass fraction of 0,75 %, and in durum wheat semolinas. This
    method permits the separation and quantification of contamination of animal origin,
    such as insects at all stages of their development and their fragments, rodent
    hairs and their fragments, and mites.
