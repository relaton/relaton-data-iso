abstract:
- language: en
  script: Latn
  content: This part establishes general requirements and minimum screening criteria
    for second-hand goods that are traded, sold, offered for sale, donated or exchanged
    between countries.  This part is intended to help protect health, safety, sustainability
    in which second-hand goods interact, when used by customers.  This part is applicable
    to second-hand goods that are shipped across at least one international border,
    and where the intended end user is a consumer. This part does not apply to goods
    that are remanufactured and rebuilt.
