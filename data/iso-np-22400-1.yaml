abstract:
- language: en
  script: Latn
  content: 'ISO 22400 specifies an industry-neutral framework for defining, composing,
    exchanging, and using key performance indicators (KPIs) for manufacturing operations
    management (MOM), as defined in IEC 62264‑1 for batch, continuous and discrete
    industries. ISO 22400-1:2014: provides an overview of what a KPI is, presents
    concepts of relevance for working with KPIs including criteria for constructing
    KPIs, specifies terminology related to KPIs, and describes how a KPI can be used.'
