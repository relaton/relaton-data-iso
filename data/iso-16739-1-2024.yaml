abstract:
- language: en
  script: Latn
  content: 'This document represents an open international standard for information
    used in Building Information Modeling (BIM) that is exchanged and shared among
    software applications used by the various participants in the construction or
    facility management industry sector. This document includes definitions that cover
    information required for buildings and infrastructure works over their life cycle.
    This edition of the document added coverage of information required for infrastructure
    facilities including bridges, roads, railways, waterways and port facilities.
    This document comprises the publication of a data schema, its documentation, the
    property and quantity set definitions and the mechanism of an exchange file format
    structure. Definitions from this document are used to support different recognized
    work flows in the construction and facility management industry sector, representing
    information deliveries. Such information deliveries can be described according
    to ISO 29481. Different implementation levels of this document can be defined
    to better support multiple information deliveries, they are referred to as a Model
    View Definition (MVD). Each MVD identifies which subset of the definitions of
    this document imposes requirements for implementation in software applications.
    Conforming software applications need to identify the model view definition they
    conform to when applying for software certification. The following are within
    the scope of this edition of this document: BIM exchange format definitions that
    are required during the life cycle phases of buildings and infrastructure: demonstrating
    the need; conception of need; outline feasibility; substantive feasibility study
    and outline financial authority; outline conceptual design; full conceptual design;
    coordinated design; procurement and full financial authority; production information;
    construction; operation and maintenance. BIM exchange format definitions that
    are required by the various disciplines involved within the life cycle phases:
    architecture and civil engineering design; service and utilities engineering;
    structural engineering; procurement; construction planning; facility and utility
    management; project management; client requirement management; industry authorities
    for permits and approval. BIM exchange format definitions including: project structure;
    physical components; spatial components; analysis items; processes; resources;
    controls; actors; context definition.'
