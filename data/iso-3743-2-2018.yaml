abstract:
- language: en
  script: Latn
  content: ISO 3743-2:2018 specifies a relatively simple engineering method for determining
    the sound power levels of small, movable noise sources. The methods specified
    in this document are suitable for measurements of all types of noise within a
    specified frequency range, except impulsive noise consisting of isolated bursts
    of sound energy which are covered by ISO 3744 and ISO 3745. NOTE A classification
    of different types of noise is given in ISO 12001.
