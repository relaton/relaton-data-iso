abstract:
- language: en
  script: Latn
  content: 'This document defines the concept of how to design adaptive items, limited
    to any kind of driven tool units, together with the usage of the related properties
    and domains of values. This document specifies the requirements of simplified
    3D models for data exchange of driven tool units. The following are outside the
    scope of this document: — applications where these standard data can be stored
    or referenced; — concept of 3D models for cutting tools; — concept of 3D models
    for cutting items; — concept of 3D models for tool items; — concept of 3D models
    for other adaptive items not being described in the scope of this document; —
    concept of 3D models for assembly items and auxiliary items.'
