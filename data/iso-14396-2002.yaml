abstract:
- language: en
  script: Latn
  content: ISO 14396 specifies the additional and method requirements for determining
    the power of reciprocating internal combustion (RIC) engines when presented for
    an exhaust emission test in accordance with ISO 8178, to the basic requirements
    defined in the "Core" standard ISO 15550. It also specifies the power correction
    method for the confirmation of engine power for pre-set engines under variable
    atmospheric conditions. These corrections do not apply to the definition of the
    exhaust emission values which are in all cases only related to the uncorrected
    engine power. ISO 14396 applies to RIC engines for land, rail traction and marine
    use excluding engines for motor vehicles primarily designed for on-road use. It
    may be applied to engines used to propel e.g. road construction and earth-moving
    machines, industrial trucks and for other applications.
