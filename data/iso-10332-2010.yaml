abstract:
- language: en
  script: Latn
  content: ISO 10332:2010 specifies requirements for automated ultrasonic shear-wave
    (generated by single element probes or the phased-array technique) testing of
    seamless and welded (except submerged arc-welded) steel tubes, for verification
    of hydraulic leak-tightness. The testing technique is applied for the detection
    of predominantly longitudinal imperfections. Where applicable, Lamb-wave testing
    may be applied at the discretion of the manufacturer. ISO 10332:2010 is applicable
    to the inspection of tubes with an outside diameter greater than or equal to 10
    mm, and with an outside diameter-to-thickness ratio greater than or equal to 5.
