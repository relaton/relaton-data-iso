abstract:
- language: en
  script: Latn
  content: This document specifies performance requirements and test methods under
    prescribed laboratory conditions for the evaluation of diffusive samplers (see
    Reference [1]) and of procedures using these samplers for the determination of
    gases and vapours in workplace atmospheres (see Reference [2]). This document
    is applicable to diffusive samplers and measuring procedures using these samplers,
    such as ISO 16200‑2 and ISO 16017‑2, in which sampling and analysis are carried
    out in separate stages. This document is not applicable to —    diffusive samplers
    which are used for the direct determination of concentrations, and —    diffusive
    samplers which rely on sorption into a liquid. This document addresses requirements
    for method developers and/or manufacturers. NOTE      For the purposes of this
    document a manufacturer can be any commercial or non-commercial entity.
