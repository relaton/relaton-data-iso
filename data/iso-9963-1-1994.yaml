abstract:
- language: en
  script: Latn
  content: Specifies a method for the titrimetric determination of alkalinity. Intended
    for the analysis of natural and treated water, and waste water, and can be used
    directly for waters having an alkalinity concentration of up to 20 mmol/l. For
    samples containing higher concentrations of alkalinity, a smaller test portion
    can be used for analysis. The recommended lower limit is 0,4 mmol/l.
