abstract:
- language: en
  script: Latn
  content: 'ISO 25745-2:2015 specifies a method to estimate energy consumption based
    on measured values, calculation, or simulation, on an annual basis for traction,
    hydraulic and positive drive lifts on a single unit basis, and an energy classification
    system for new, existing, and modernized traction, hydraulic, and positive drive
    lifts on a single unit basis. It applies to passenger and goods passenger lifts
    with rated speeds greater than 0,15 m/s and only considers the energy performance
    during the operational portion of the life cycle of the lifts. For other types
    of lifts (e.g. service lifts, lifting platforms, etc.), it can be taken as a reference.
    It does not cover energy aspects, which affect the measurements, calculations,
    and simulations, such as the following: hoistway lighting; heating and cooling
    equipment in the lift car; machine room lighting; machine room heating, ventilation,
    and air conditioning; non-lift display systems, CCTV security cameras, etc.; non-lift
    monitoring systems (e.g. building management systems, etc.); effect of lift group
    dispatching on energy consumption; environmental conditions; consumption through
    the power sockets; lifts whose travel includes an express zone (an express zone
    is unlikely to affect the average car load but can significantly affect the average
    travel distance).'
