abstract:
- language: en
  script: Latn
  content: ISO 6292:2008 specifies performance, test methods, controls, control forces
    and component strength for brake systems fitted to powered industrial trucks of
    all capacities, industrial tractors with rated capacities up to and including
    20 000 N drawbar pull, burden carriers and industrial trucks handling freight
    containers, as defined in ISO 5053. Loss of electrical power and loss of any other
    form of power assistance is not covered by ISO 6292:2008. It does not cover braking
    used in emergency situations (e.g. activating the emergency switch or control
    system shut down). ISO 6292:2008 only includes requirements for newly manufactured
    trucks.
