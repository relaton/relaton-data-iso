abstract:
- language: en
  script: Latn
  content: 'This document defines terminology and concepts for learning, education,
    and training systems developed using VR/AR/MR technologies. With such systems,
    educators and learners should be familiar with and use a consistent set of VR/AR/MR-related
    terminologies. Unique and consistent terminology is provided to avoid misunderstandings
    between educators and learners in virtual education. This document will: • define
    terminology for VR/AR/MR-based information systems for learning, education, and
    training • define concepts necessary to understand and conduct education using
    the systems • define system requirements for educators and learners • define necessary
    interfaces with systems, educators, and learners • define a method of organizing
    education scenarios • define a method to integrate education content with the
    system'
