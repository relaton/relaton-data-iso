abstract:
- language: en
  script: Latn
  content: |-
    This International Standard specifies recommended storage conditions for unprocessed silver halide containing photographic materials. It is not applicable to processed films and prints.
    This International Standard is applicable to black-and-white and colour photographic materials (negative films, positive films, reversal films, positive papers, and X-ray films).
