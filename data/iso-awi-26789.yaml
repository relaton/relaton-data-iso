abstract:
- language: en
  script: Latn
  content: This standard applies to the determination of hydrogen sulfide content in natural gas using the lead acetate reaction rate method, with a measurable range of 0.1×10-6 to 100×10-6 (φ). By diluting the samples, the detection range can be extended to higher concentrations. This method is suitable for testing in natural gas processing plants, transmission and distribution stations, CNG refueling stations, as well as for product quality supervision and production monitoring in quality inspection agencies, laboratories, and manufacturing units.
