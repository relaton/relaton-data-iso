abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and testing of overhead guards,
    operator’s leg(s)/feet protection for industrial trucks and overturning testing
    of industrial variable-reach trucks with operator position not protected by the
    boom (hereafter referred to as "trucks") requiring an overhead guard according
    to ISO 3691‑1 and ISO 3691‑2. This document is not applicable to rough-terrain
    variable-reach trucks and slewing rough-terrain variable-reach trucks.
