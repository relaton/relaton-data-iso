abstract:
- language: en
  script: Latn
  content: ISO 10272-1:2017 specifies a horizontal method for the detection by enrichment
    or direct plating of Campylobacter spp. It is applicable to - products intended
    for human consumption, - products intended for animal feeding, - environmental
    samples in the area of food and feed production, handling, and - samples from
    the primary production stage such as animal faeces, dust, and swabs.
