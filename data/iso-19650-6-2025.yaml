abstract:
- language: en
  script: Latn
  content: 'This document specifies concepts and principles for classifying, sharing
    and delivering health and safety information collaboratively, to secure the economic,
    environmental and social benefits. This document: a)       specifies requirements
    for the collaborative sharing of structured health and safety information throughout
    project and asset life cycles; b)       supports the digitization of structured
    health and safety information in project and asset life cycles progressively from
    the outset; c)        provides specification on how health and safety information
    is shared for use throughout project and asset life cycle; d)       sets out a
    health and safety information cycle framework for the identification, use, sharing
    and generalization of health and safety information through information management
    processes. This document is applicable to individuals and organizations that contribute
    to and influence the procurement, design, construction, use (including maintenance)
    and end-of-life of building and infrastructure assets. The principles and requirements
    of this document can be applied equally to delivery or in-use phases not using
    BIM.'
