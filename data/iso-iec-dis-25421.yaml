abstract:
- language: en
  script: Latn
  content: This document specifies a method of describing whole-body movement sequences,
    which based on skeleton’s relative angle movements. It is applicable to user interfaces
    used in many domains including immersive systems, health care content, education
    content, and entertainment content and so on. In this document, whole-body movement
    sequences are formed by the motion between major postures of the body. Movements
    involving details of hands, feet, fingers, or toes involve are excluded in this
    document. This document also does not deal with sign language.
