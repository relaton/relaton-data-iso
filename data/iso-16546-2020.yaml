abstract:
- language: en
  script: Latn
  content: This document specifies the equipment and test method for determining the
    effects of successive cycling from dry conditions at −20 °C to wet conditions
    at 20 °C on the mechanical properties and moisture content of thermal insulating
    products. This document is intended to simulate the freeze?thaw effects on thermal
    insulating products which are frequently exposed to water and low temperature
    conditions, e.g. inverted roofs and unprotected ground insulation.
