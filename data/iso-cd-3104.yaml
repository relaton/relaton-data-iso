abstract:
- language: en
  script: Latn
  content: This document specifies Procedure A, using manual glass viscometers, and Procedure B, using glass capillary viscometers in an automated assembly, for the determination of the kinematic viscosity, ν, of both transparent and opaque products. The scope includes liquid petroleum products, fatty acid methyl ester (FAME), paraffinic diesel, hydrotreated vegetable oil (HVO), gas to liquid (GTL) and biofuel diesel mixtures up to 50 % FAME. The kinematic viscosity is determined by measuring the time for a volume of liquid to flow under gravity through a calibrated glass capillary viscometer. The dynamic viscosity, η, is obtained by multiplying the measured kinematic viscosity by the density, ρ, of the liquid. The range of kinematic viscosities covered in this test method is from 0,2 mm2/s to 300 000 mm2/s over the temperature range –20 °C to +150 °C. NOTE       The result obtained from this document is dependent upon the behaviour of the sample and is intended for application to liquids for which primarily the shear stress and shear rates are proportional (Newtonian flow behaviour). If, however, the viscosity varies significantly with the rate of shear, different results can be obtained from viscometers of different capillary diameters. The procedure and precision values for residual fuel oils, which under some conditions exhibit non-Newtonian behaviour, have been included.
