abstract:
- language: en
  script: Latn
  content: 'ISO 15614-12:2004 specifies the tests which may be used for qualification
    of welding procedure specifications for spot, seam and projection welding processes.
    ISO 15614-12:2004 defines the conditions for carrying out tests and the limits
    of validity of a qualified welding procedure for all practical welding operations
    covered by this International Standard. Tests shall be carried out in accordance
    with this International Standard unless more severe tests are specified by the
    relevant application standard or contract when these shall apply. The acceptability
    of applying the principles of this International Standard to other resistance
    welding processes should be established before any qualification is undertaken.
    ISO 15614-12:2004 covers the following resistance welding processes: - spot welding;
    - indirect spot welding; - direct spot welding; - seam welding; - lap seam welding;
    - mash seam welding; - fail butt-seam welding; - seam welding with strip; - projection
    welding; - indirect projection welding; - direct projection welding.'
