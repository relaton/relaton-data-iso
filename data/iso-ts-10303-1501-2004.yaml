abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1501:2004 specifies the application module Edge based wireframe.
    The following are within the scope of ISO/TS 10303-1501:2004: the representation
    of wireframe models that are described by a graph of edges and vertices where
    the edges intersect only at their vertices; the representation of a wireframe
    model by one or more connected edge sets that shall not overlap or intersect except
    at their vertices or edges; the representation of points defined in a three-dimensional
    coordinate space; the representation of curves, including b-splines, defined in
    a three-dimensional coordinate space; the representation of a single wireframe
    model or an assembly of wireframe model.'
