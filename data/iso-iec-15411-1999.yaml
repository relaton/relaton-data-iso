abstract:
- language: en
  script: Latn
  content: 'This International Standard defines the differing requirements necessary
    when considering the various types of segmented keyboards. The scope of this International
    Standard encompasses the three-dimensional layout of segmented, traditional style
    keyboards classified as having: a. Adjustable alphanumeric segments; b. Fixed
    angle alphanumeric segments. This International Standard covers the following
    keyboard areas: - Alphanumeric area - Function area - Text editing area - Numeric
    area - Cursor control area'
