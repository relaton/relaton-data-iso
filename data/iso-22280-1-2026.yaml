abstract:
- language: en
  script: Latn
  content: This document sets out the fundamental principles and procedure of determining the groundwater remediation targets for post in situ leach (also referred as in situ recovery) uranium mining. It also delineates the environmental investigation requirements for groundwater remediation, stakeholder identification and engagement, groundwater remediation technical options and their analysis of effectiveness, and considerations for setting and adjusting the groundwater remediation target values. This document is applicable to controlling and mitigating groundwater impact and conducting groundwater remediation for in situ leach uranium mining. It can also serve as a reference for contamination control, mitigation and remediation of groundwater for other in situ leach metal mining projects.
