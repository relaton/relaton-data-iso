abstract:
- language: en
  script: Latn
  content: Gives guidelines to ensure that the homogenization and the sampling system
    supply representative samples from a batch of plutonium dioxide and to ensure
    that the said sample remains representative until aliquoting. Possible mass change
    of the sample during transport and storage is also considered. The guidelines
    apply to PuO2 powder with a specific surface area lower than 25 m^2/g.
