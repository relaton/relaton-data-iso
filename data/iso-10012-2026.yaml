abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for a measurement management
    system when an organization: needs to demonstrate its ability to consistently
    ensure confidence in validity and reliability of measurement results and thereby
    to provide a consistent level of measurement quality for an organization’s products
    and services; aims to rely on reliable and valid measurement results useful to
    enhance customer satisfaction and effectively apply its measurement management
    system processes; implements processes for a measurement management system that
    enhance conformity with customer, statutory and regulatory requirements. All the
    requirements of this document are generic. This document is applicable to any
    organization, regardless of its type or size, or the products and services it
    provides. This includes organizations manufacturing products and providing engineering
    services (except for calibration and test services included within the scope of
    ISO/IEC 17025). This document is not intended to substitute requirements for,
    or to add requirements to, the general requirements for the competence of testing
    and calibration laboratories specified in ISO/IEC 17025. NOTE            For organizations
    that operate internal testing and calibration laboratories, the competence of
    those functions can be evaluated in accordance with ISO/IEC 17025.'
