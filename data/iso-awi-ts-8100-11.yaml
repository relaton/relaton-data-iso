abstract:
- language: en
  script: Latn
  content: 'Scope of the technical specification is to define ontology for the interoperability
    covering following use cases:  Remote monitoring of the lift system  Remote
    call registration  Building automation interfacing  Robot interfacing (AGV and
    MAR). The document also specifies safety related functions and aspect related
    to interoperability. In the document, oneM2M and OPC UA are used as examples how
    to apply the ontology.'
