abstract:
- language: en
  script: Latn
  content: ISO 10303-59:2014 specifies the integrated resource constructs for quality
    of product shape data. ISO 10303-59:2014 provides structured representation of
    criteria together with measurement requirement, and inspection results of the
    data quality of product shape and related data. It is designed for use in quality
    declaration, quality assurance and for representing quality inspection result
    of product shape data and related data, thus enabling quality guaranteed product
    data exchange.
