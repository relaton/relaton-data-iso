abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the release of lead and cadmium
    from glass hollowware that is intended to be used in contact with food. This document
    is applicable to glass hollowware intended for use in the preparation, cooking,
    serving and storage of food and beverages, excluding glass ceramic ware and glass
    flatware. This document is also applicable to glass articles used for packaging
    in the food industry.
