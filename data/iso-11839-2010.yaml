abstract:
- language: en
  script: Latn
  content: ISO 11839:2010 specifies test procedures and performance requirements for
    determining the protective ability of panel materials used in forestry-machinery
    operator enclosures intended to protect the operator against sawteeth thrown by
    circular-saw components. This particular type of hazard is specifically defined
    by the size and velocity of the sawteeth and is unique to these cutting devices.
    ISO 11839:2010 is applicable to panel materials for forestry machines defined
    in ISO 6814 that include an integrated or attached circular sawing device, controlled
    or powered by the primary machine (e.g. topping saws, felling saws or bucking
    saws).
