abstract:
- language: en
  script: Latn
  content: This document specifies materials, dimensions, quality, and performance
    requirements, as well as relevant test methods. This document also specifies components
    that are part of the sterilized subassembled syringe ready for filling. This document
    is applicable to —     tubing-glass barrels (single-chamber design) for injection
    preparations, and —     sterilized subassembled syringes ready for filling. Glass
    barrels and sterilized subassembled syringes ready for filling in accordance with
    this document are intended for single use only. Components to complete the subassembled
    syringe, such as plunger stopper and plunger rod, are outside the scope of this
    document. NOTE            National or regional regulations such as Ph.Eur., USP,
    or JP can apply.
