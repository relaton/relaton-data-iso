abstract:
- language: en
  script: Latn
  content: This part of ISO 16000 specifies a laboratory test method using test chambers
    defined in ISO 16000-9 and evaluation procedures for the determination of odours
    emitted from newly produced building products under defined climate conditions.
    The method can also, in principle, be applied to aged products. This part of ISO
    16000 is applicable to various test chambers used for the determination of emissions
    from building products. NOTE This part of ISO 16000 can also be used for other
    products or materials. Sampling, transport and storage of materials under test,
    as well as preparation of test specimens are described in ISO 16000-11.
