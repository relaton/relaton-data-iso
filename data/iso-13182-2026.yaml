abstract:
- language: en
  script: Latn
  content: This document specifies discrete polymer fibres with a nominal length of
    80 mm or less mixed in concrete and mortar. The quality and performance specified
    in this standard are the raw material resin of discrete polymer fibres, nominal
    fibre diameter and its allowable range, nominal fibre length and its allowable
    range, fibre cross-sectional shape, fibre longitudinal shape, grade of fibre strength,
    and grade of fibre elasticity. There are a wide variety of discrete polymer fibres
    used to reinforce cement composites. Currently, in discrete polymer fibres products
    distributed as industrial products, there are many types of raw material resins
    and various shapes. In addition, the applications that have been used in practical
    fields are so wide, from structural applications that require high mechanical
    reinforcement performance to crack control and peeling prevention that are easier
    to use. Therefore, to select an appropriate product from a wide variety of discrete
    polymer fibres, the characteristics of discrete polymer fibres need to be classified
    and revealed based on a unified evaluation method. This document allows manufacturers
    to ensure the performance of discrete polymer fibres are in accordance with an
    adequate standard in response to various user requests.
