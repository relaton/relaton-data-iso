abstract:
- language: en
  script: Latn
  content: 'ISO 18217:2015 deals with all significant hazards, hazardous situations,
    and events as listed in Clause 4, which are relevant to edge banding machines
    fed by chains with manual loading and unloading and maximum work-piece height
    capacity of 100 mm, when they are used as intended and under the conditions foreseen
    by the manufacturer, including reasonably foreseeable misuse. The work-piece is
    fed through the processing units by an integrated feed. Feeding chains also include
    "feeding belts". For the purpose of this International Standard, an edge banding
    machine fed by chains is hereinafter referred to as "machine". The machine is
    designed to process in one pass, one end (single end machine), or both ends (double
    end machine) panels of wood materials with similar physical characteristics as
    wood, as well as gypsum plaster boards. Edges to be applied by the machine can
    be made of paper, melamine, plastic or composite materials, aluminium or light
    alloy, veneer or solid wood. ISO 18217:2015 also applies to machines fitted with
    the following: ? auxiliary devices essential for edge banding machines fed by
    chains (see 3.1); ? sanding belt units; ? fixed or movable workpiece support;
    ? automatic tool changing; ? automatic panel returner. ISO 18217:2015 also includes
    information to be provided by the manufacturer to the user. ISO 18217:2015 does
    not deal with any hazards relating to the following: a) systems for loading and
    unloading of the work-piece to a single machine other than automatic panel returner;
    b) single machine being used in combination with any other machine (as part of
    a line); c) wireless mobile control sets; d) additional equipment for grooving
    and for cutting by circular saw blade, installed out of the integral enclosure
    and/or whose tools protrude out of the integral enclosure; e) plasma unit, power
    laser unit, and hot-air-jet unit. ISO 18217:2015 applies to machines that are
    manufactured after the date of issue of this International Standard.'
