abstract:
- language: en
  script: Latn
  content: This document specifies the general principles and basic requirements of
    design for small hydropower (SHP) projects up to 30 MWe, mainly including hydrology,
    geology, energy calculations, project layout, hydraulics, electromechanical equipment
    selection, construction planning, project cost estimates, economic appraisal,
    social and environmental assessments. Application of this document is intended
    to be site specific, with the principles and requirements of design applied in
    accordance with the needs of proposed hydropower plant.
