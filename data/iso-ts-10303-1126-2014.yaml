abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1126:2014-02 specifies the application module for Document
    properties. The following are within the scope of ISO/TS 10303-1126:2014-02: assignment
    of properties to a particular representation of a document version; assignment
    of properties to a file; specification of document-specific properties; specification
    of the representation of document-specific properties; items within the scope
    of application module Document definition, ISO/TS 10303-1123; items within the
    scope of application module File identification, ISO/TS 10303-1127; items within
    the scope of application module Foundation representation, ISO/TS 10303-1006;
    items within the scope of application module Measure representation, ISO/TS 10303-1118;
    items within the scope of application module Property assignment, ISO/TS 10303-1030.'
