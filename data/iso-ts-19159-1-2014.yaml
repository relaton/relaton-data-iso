abstract:
- language: en
  script: Latn
  content: ISO/TS 19159-1:2014 defines the calibration and validation of airborne
    and spaceborne remote sensing imagery sensors. The term "calibration" refers to
    geometry, radiometry, and spectral, and includes the instrument calibration in
    a laboratory as well as in situ calibration methods. The validation methods address
    validation of the calibration information.
