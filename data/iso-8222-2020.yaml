abstract:
- language: en
  script: Latn
  content: This document describes the design, use and calibration of volumetric measures
    (capacity measures) which are intended for use in fixed locations in a laboratory
    or in the field. This document gives guidance on both standard and non-standard
    measures. It also covers portable and mobile measures. This document is applicable
    to the petroleum industry; however, it may be applied more widely to other applications.
    This document excludes measures for cryogenic liquids and pressurized measures
    as used for liquid petroleum gas (LPG) and liquefied natural gas (LNG). Volumetric
    measures are classified as test measures or prover tanks depending on capacity
    and design. Measures described in this document are primarily designed, calibrated
    and used to measure volumes from a measure which is wetted and drained for a specified
    time before use and designated to deliver. Many of the provisions, however, apply
    equally to measures which are used to measure a volume using a clean and dry measure
    and designated to contain. Guidance is given regarding commonly expected uncertainties
    and calibration specifications. The document also provides, in Annex A, reference
    formulae describing the properties of water and other fluids and materials used
    in volumetric measurement more generally.
