abstract:
- language: en
  script: Latn
  content: ISO 2106:2011 specifies a gravimetric method for determining the mass per
    unit area (surface density) of anodic oxidation coatings on aluminium and its
    alloys. The method is applicable to all oxidation coatings formed by anodizing
    aluminium and its alloys, either cast or wrought, and is suitable for most aluminium
    alloys, except those in which the copper content is greater than 6 %.
