abstract:
- language: en
  script: Latn
  content: 'This document specifies the limiting values for the adjustment of centres
    of two transmission pulleys. It is applicable to: — crowned pulleys for flat belts;
    — grooved pulleys for V-belts, either single, multiple or joined; — grooved pulleys
    for V-ribbed belts; — toothed pulleys for synchronous belts.'
