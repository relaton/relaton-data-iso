abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements and methods for the clinical
    performance verification of me equipment used for estimating arterial blood pressure
    providing a single set of blood pressure parameters from a number of heart beats
    without the need of arterial puncture and without the need of creating an arterial
    occlusion at each reading. This document covers sphygmomanometers that require
    calibration and those that do not require calibration. This document covers sphygmomanometers
    intended for use in all patient populations (e.g. all age and weight ranges),
    and all conditions of use (e.g. ambulatory blood pressure monitoring, stress testing
    blood pressure monitoring and blood pressure monitors for the home healthcare
    environment for self-measurement as well as use in a professional healthcare facility).
    This document specifies additional disclosure requirements for the accompanying
    documents of sphygmomanometers that have passed a clinical performance verification
    according to this document. This document is not applicable to clinical performance
    verification of: - non-automated sphygmomanometers as given in ISO 81060-1; -
    continuous automated sphygmomanometers as given in ISO 81060-3; or - invasive
    blood pressure monitoring equipment as given in IEC 60601-2-34.'
