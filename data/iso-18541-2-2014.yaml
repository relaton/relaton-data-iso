abstract:
- language: en
  script: Latn
  content: ISO 18541-2:2014 includes technical requirements which are related to automotive
    repair and maintenance information (RMI) systems in order to standardize access
    to RMI for independent operators. ISO 18541-2:2014 specifies the minimum set of
    technical requirements related to a vehicle manufacturer's RMI system. These requirements
    will reflect the deriving needs from the use cases as specified in ISO 18541‑1.
