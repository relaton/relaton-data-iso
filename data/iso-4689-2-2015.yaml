abstract:
- language: en
  script: Latn
  content: ISO 4689-2:2015 specifies a combustion/titration method for the determination
    of the sulfur content of iron ores. This method is applicable to sulfur contents
    between 0,002 % (mass fraction) and 0,25 % (mass fraction) in natural iron ores,
    iron ore concentrates, and agglomerates, including sinter products. The results
    are not affected by the presence of fluoride.
