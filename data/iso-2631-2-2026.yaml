abstract:
- language: en
  script: Latn
  content: This document concerns human exposure to whole-body vibration and shock
    in buildings with respect to the comfort and annoyance of the occupants based
    on both measurements and simulations. It specifies a method for measurement and
    evaluation, comprising the determination of the measurement direction and measurement
    location. It defines the frequency weighting, Wm, which is applicable in the frequency
    range 1 Hz to 80 Hz where the posture of an occupant does not need to be defined,
    see Annex A. NOTE 1        The frequency weightings given in ISO 2631-1 can be
    used if the posture of the occupant is defined. Whilst it is often the case that
    a building will be available for experimental investigation, many of the concepts
    contained within this document would apply equally to a building in the design
    process or where it will not be possible to gain access to an existing building.
    In these cases, reliance will have to be placed on the prediction of the building
    response by some means. This document does not provide guidance on the likelihood
    of structural damage, which is discussed in ISO 4866. Further, it is not applicable
    to the evaluation of effects on human health and safety. Acceptable magnitudes
    of vibration are not stated in this document, but guidance is provided in Annex
    C in the form of exposure-response curves for the estimation of annoyance when
    vibration originates from various sources, including railway, construction activities
    and blasting. NOTE 2        The exposure-response curves are based on the most
    recent evidence which suggests that human response to vibration in buildings is
    dependent on the magnitude, frequency, duration and temporal characteristics of
    the vibration[4]. In addition, it is known that other factors not directly related
    to the vibration characteristics have a significant influence on the annoyance
    response. These are identified in Annex B and include consideration of some parallel
    effects, subjective impressions and socio-demographic factors which need to be
    accounted for when collecting vibration data. NOTE 3        Several national standards
    have been proposed to define methods for assessing exposure to vibration in buildings
    as well as reference values for judging the annoyance resulting from exposure.
    These standards generally present significant differences in terms of metrics
    and methods used to quantify exposure as well as on the guideline values to prevent
    adverse effects. Some standards define limit values that are based on experimental
    field data leading to exposure-response relationships such as those proposed in
    Annex C. Other standards base their limit values on estimations that take into
    account vibration perception thresholds and situational factors. Some standards
    also consider the magnitude of vibration that can present a risk of damage to
    the buildings, particularly when blasting is involved.
