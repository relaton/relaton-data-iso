abstract:
- language: en
  script: Latn
  content: This document specifies the measurement method used for calculating the
    temperature coefficient of the refractive index by measuring the refractive index,
    which changes with the temperature of the optical glass using the minimum deviation
    method. The intended temperature range for the specified measurement method is
    –40 °C to +80 °C. The intended wavelength range for the specified measurement
    method is 365 nm to 1 014 nm. The intended accuracy for the specified measurement
    method is 1 × 10-6 K-1.
