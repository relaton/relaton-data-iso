abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the tensile strength,
    tensile modulus of elasticity and strain at the maximum force of a resin-impregnated
    yarn specimen at ambient temperature. This method is applicable to yarns of ceramic
    fibres that are used as reinforcements in composite materials. The test results
    obtained by this method are applicable for quality control and comparison of the
    ceramic fibres. The outputs of this method are not to be mixed up with the strength
    of filaments derived from tensile tests on dry tows specified in ISO 22459.
