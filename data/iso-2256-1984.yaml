- language: en
  script: Latn
  content: Covers the requirements for leaves of this spice in whole, broken or rubbed
    form. The term `dried mint'included dehydrated mint, i.e. artificially dried mint.
    Does not apply to dried peppermint for which requirements are given in ISO 5563.
    Describes sampling, method of test, packing and marking. Recommendations concerning
    storage and transport conditions are given in an annex.
