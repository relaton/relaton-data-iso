abstract:
- language: en
  script: Latn
  content: 1.1 This practice describes the operation and production control of metal
    powder bed fusion (PBF) machines and processes to meet critical applications such
    as commercial aerospace components and medical implants. The requirements contained
    herein are applicable for production components and mechanical test specimens
    using powder bed fusion (PBF) with both laser and electron beams. 1.2 This standard
    does not purport to address all of the safety concerns, if any, associated with
    its use. It is the responsibility of the user of this standard to establish appro-priate
    safety, health, and environmental practices and deter-mine the applicability of
    regulatory limitations prior to use. 1.3 This international standard was developed
    in accor-dance with internationally recognized principles on standard-ization
    established in the Decision on Principles for the Development of International
    Standards, Guides and Recom-mendations issued by the World Trade Organization
    Technical Barriers to Trade (TBT) Committee.
