abstract:
- language: en
  script: Latn
  content: ISO 19023:2018 specifies requirements and test methods for orthodontic
    anchor screws used in orthodontic treatment. ISO 19023:2018 gives details of methods
    to compare physical and mechanical properties of orthodontic anchor screws together
    with test methods and packaging and labelling information. NOTE Orthodontic anchor
    screws are used to provide temporary intraoral skeletal anchorage during orthodontic
    treatment and are removed at the end of the orthodontic treatment. Similar to
    endosseous dental implants, they are, therefore inserted into the maxillo-facial
    bone structures.
