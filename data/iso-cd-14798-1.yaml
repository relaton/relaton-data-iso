abstract:
- language: en
  script: Latn
  content: ISO 14798:2009 establishes general principles and specific procedures for
    assessing risk. Its purpose is to provide a process for making decisions relevant
    to the safety of lifts during the design, construction, installation and servicing
    of lifts, lift components and systems, development of generic procedures for the
    use, operation, testing, compliance verification and servicing of lifts, and development
    of technical specifications and standards affecting the safety of lifts. While
    the examples given in ISO 14798:2009 refer primarily to risks of harm to persons,
    the risk assessment procedure it specifies can be equally effective for assessing
    other types of risk relevant to lifts, such as the risk of damage to property
    and environment.
