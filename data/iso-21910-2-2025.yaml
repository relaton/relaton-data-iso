abstract:
- language: en
  script: Latn
  content: |-
    This document specifies the principle, devices and operations for measuring bubble size distribution of microbubbles in liquid media using the in-situ dynamic image method.
    This document is applicable to microbubbles, as well as to bubbles in the size range of 100 μm to 500 μm, dispersed in transparent liquid media, mostly in water.
