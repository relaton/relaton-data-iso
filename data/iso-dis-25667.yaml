abstract:
- language: en
  script: Latn
  content: This standard specifies the basis, principles, processes, contents, and
    science requirements document （SRD）of the requirements analysis for space experiments.
    This standard is applicable to space life science and human research, microgravity
    physics, space astronomy and earth science and Space technology and utilization.
    Space experiments in other fields can be referred to and executed. This standard
    is led by scientists, transforming scientific needs into engineering language,
    establishing communication bridges for project management, scientific researchers,
    and experimental facility developers, and providing services for engineering implementation.
    The deployment of this standard aims to promote international space cooperation
    and provide technical guidance for international projects. The main audience of
    this standard includes but is not limited to the requirements management/system
    engineering process owners of the customs and suppliers, programme/project managers
    managing the space programmes, the chief engineers and the quality managers.
