abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements of Roadheaders for mining and
    tunneling applications related to their physical properties and intended use.
    The safety requirements specified in this document apply to hazards arising during
    all phases of the machine life cycle as defined in ISO 12100:2010. This document
    is primarily intended to address safety aspects of Roadheaders for mining and
    tunneling applications, and the hazards not involved in this document are consistent
    with those addressed in ISO 12100. This document is applicable to Roadheaders
    for mining and tunneling applications used in both coal mining and non-coal mining
    operations.
