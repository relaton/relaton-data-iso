abstract:
- language: en
  script: Latn
  content: This document specifies, with reference to ISO 230-1, the geometric tests
    on vertical internal type broaching machines with vertical Z-axis providing the
    main cutting motion. This document also specifies the applicable tolerances corresponding
    to the tests mentioned above for normal-accuracy vertical internal type broaching
    machines. This document explains the concepts, configurations and common features
    of vertical internal type broaching machines. This document also provides related
    terminology and designation of axes. This document covers only the verification
    of the accuracy of the broaching machine. This document does not apply to the
    operational testing of the machine (e.g. vibration, abnormal noise, stick-slip
    motion of components) nor to machine characteristics (e.g. speeds, feeds) as such
    checks are generally carried out before testing the accuracy.
