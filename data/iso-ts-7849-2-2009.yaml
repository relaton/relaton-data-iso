abstract:
- language: en
  script: Latn
  content: ISO/TS 7849-2:2009 gives basic requirements for a reproducible method for
    the determination of the sound power level of the noise emitted by machinery or
    equipment by using surface vibration measurements, together with the knowledge
    of the machinery specific sound radiation factor in the frequency bands. The method
    is only applicable to noise which is emitted by vibrating surfaces of solid structures
    and not to noise generated aerodynamically. This vibration measurement method
    is especially applicable in cases where accurate direct airborne noise measurements,
    e.g. as specified in ISO 3746, ISO 3747, and ISO 9614 (all parts), are not possible
    because of high background noise or other parasitic environmental interferences;
    or, if a distinction is required between the total radiated sound power and its
    structure vibration generated component. The methods described in ISO/TS 7849-2:2009
    apply mainly to processes that are stationary with respect to time. Recommendations
    on the selection of frequency bands are given in an annex.
