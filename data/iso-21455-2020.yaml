abstract:
- language: en
  script: Latn
  content: This document specifies the performance requirements, location, marking
    and method of operation related to operator's controls on mobile elevating work
    platforms (hereafter referred to as MEWPs) and takes into account operator safety
    and ergonomics. It applies to all controls used by an operator and includes provisions
    for finger, thumb, hand, and foot operated controls.
