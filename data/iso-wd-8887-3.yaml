abstract:
- language: en
  script: Latn
  content: The UK would like to put forward the third part of the national BS 8887
    series as an ISO standard for development in the existing ISO/TC 10 working group,
    WG20, which has previously developed the first part of the series, ISO 8887-1:2017,
    and is currently working on the second part of the series, ISO 8887-2. This document
    provides options for the selection of the general policies and specific decisions
    to be made when considering the potential for manufactured products and/or their
    components, to be designed to have a recoverable value at the end of their life
    in service. Guidance is also given on the factors to be considered during the
    design process which influence further life.
