abstract:
- language: en
  script: Latn
  content: ISO/TS 19218-1:2011 specifies requirements for a hierarchical coding structure
    for describing adverse events relating to medical devices. The codes are intended
    for use by medical device users, manufacturers, regulatory authorities, health
    care facilities and other organizations. The codes can be used for coding events
    that are not related to death or serious injury, or malfunctions that could lead
    to death or serious injury. ISO/TS 19218-1:2011 is not intended to be used to
    decide whether an incident is reportable or not.
