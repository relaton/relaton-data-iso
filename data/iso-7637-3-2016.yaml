abstract:
- language: en
  script: Latn
  content: 'ISO 7637-3:2016 defines bench test methods to evaluate the immunity of
    devices under test (DUTs) to transient pulses coupled to lines other than supply
    lines. The test pulses simulate both fast and slow transient disturbances caused
    by the switching of inductive loads and relay contact bounce. The following three
    test methods are described in ISO 7637-3:2016: - capacitive coupling clamp (CCC)
    method; - direct capacitive coupling (DCC) method; - inductive coupling clamp
    (ICC) method. ISO 7637-3:2016 applies to road vehicles fitted with nominal 12
    V or 24 V electrical systems. For transient pulses immunity, Annex B provides
    recommended test severity levels in line with the functional performance status
    classification (FPSC) principle described in ISO 7637‑1.'
