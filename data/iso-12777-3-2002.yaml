abstract:
- language: en
  script: Latn
  content: ISO 12777-3 specifies methods of determining the resistance of pallet joints
    primarily to static load by determining the strength and stiffness of nailed or
    stapled joints, wood to wood, wood to wood-based materials, wood to plastics or
    plastics to plastics. This part of ISO 12777 is applicable to joints with all
    types of nails up to 7 mm diameter (including plain shank, helical, annular ring,
    barbed and twisted) and with staples.
