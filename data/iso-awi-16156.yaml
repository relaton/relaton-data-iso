abstract:
- language: en
  script: Latn
  content: This document specifies the safety requirements and protective measures applicable to design, construction, supply, transport, and maintenance of machine tool workholding devices (including assembly and disassembly, with special precautions for transport and maintenance). It applies to hand-operated and power-operated, rotating and non-rotating clamping devices that generate clamping force by displacing at least one part/component and are intended for use on cutting machine tools and/or their handling equipment. This document addresses the significant hazards, hazardous situations, and hazardous events that apply to clamping devices when used as intended and when subjected to reasonably foreseeable misuse. It does not apply to clamping devices for use in potentially explosive atmospheres (according to the ATEX Directive).
