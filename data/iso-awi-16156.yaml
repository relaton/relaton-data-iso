abstract:
- language: en
  script: Latn
  content: ISO 16156:2004 sets out the requirements and/or measures to remove the hazards and limit the risk on work holding chucks. It covers all the hazards relevant to this component. The requirements concern designers, manufacturers, suppliers and importers of work holding chucks. It also includes information which the manufacturer shall provide for the user. It is primarily directed to components which are manufactured after its date of issue.
