abstract:
- language: en
  script: Latn
  content: ISO 15384:2003 specifies methods of test and minimum performance requirements
    for protective clothing to be worn in wildland firefighting and associated activities.
    This clothing is not intended to provide protection during fire entrapment. ISO
    15384:2003 applies to the general design of the garment, the minimum level of
    performance for the materials employed and the methods of test to determine these
    levels. ISO 15384:2003 is not applicable to clothing for use in risk situations
    where clothing complying with ISO 11613 or ISO 15538 is more suitable, nor does
    ISO 15384:2003 cover clothing to protect against chemical, biological, electrical
    or radiation hazards. ISO 15384:2003 is not applicable to protection of the head
    (it may cover the neck), eyes, hand, feet and respiratory system. These aspects
    may be dealt with in other International Standards.
