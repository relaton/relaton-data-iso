abstract:
- language: en
  script: Latn
  content: ISO 20339:2017 identifies the functional characteristics of eddy current
    array probes and their interconnecting elements and provides methods for their
    measurement and verification. The evaluation of these characteristics permits
    a well-defined description and comparability of eddy current array probes. Where
    relevant, this document gives recommendations for acceptance criteria for the
    characteristics.
