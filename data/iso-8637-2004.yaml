abstract:
- language: en
  script: Latn
  content: ISO 8637:2004 specifies requirements for haemodialysers, haemodiafilters,
    haemofilters and haemoconcentrators, hereinafter collectively referred to as 'the
    device', for use for humans. ISO 8637:2004 is not applicable to extracorporeal
    blood circuits, plasmafilters, haemoperfusion devices, vascular access devices,
    blood pumps, pressure monitors for the extracorporeal blood circuit, air detection
    devices, systems to prepare, maintain or monitor dialysate, systems used to perform
    haemofiltration or haemoconcentration, reprocessing procedures and equipment.
    Requirements for the extracorporeal blood circuit for haemodialysers, haemodiafilters,
    and haemofilters are specified in ISO 8638.
