abstract:
- language: en
  script: Latn
  content: 'ISO 15614-3:2008 specifies how a preliminary welding procedure specification
    (pWPS) for production and repair welding of non-alloyed and low-alloyed cast irons
    is qualified by fusion welding procedure tests. ISO 15614-3:2008 defines the conditions
    for execution of the welding procedure tests and the range of qualification for
    welding procedures for all practical welding operations within the range of a
    defined list of variables. ISO 15614-3:2008 is applicable to all new welding procedures.
    However, it does not invalidate previous welding procedure tests made to former
    national standards or specifications. Where additional tests have to be carried
    out to make the qualification technically equivalent, it is only necessary to
    do the additional tests on a test piece made in accordance with ISO 15614-3:2008.
    Additional tests may be required by application standards. ISO 15614-3:2008 is
    applicable to welding non-alloyed and low-alloyed grey cast iron castings according
    to: EN 1561; EN 1562; EN 1563; and EN 1564. The principles of ISO 15614-3:2008
    are also applicable for welding cast iron to steel or to other unalloyed and low-alloyed
    cast iron materials.'
