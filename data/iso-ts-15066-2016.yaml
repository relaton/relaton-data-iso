abstract:
- language: en
  script: Latn
  content: ISO/TS 15066:2016 specifies safety requirements for collaborative industrial
    robot systems and the work environment, and supplements the requirements and guidance
    on collaborative industrial robot operation given in ISO 10218‑1 and ISO 10218‑2.
    ISO/TS 15066:2016 applies to industrial robot systems as described in ISO 10218‑1
    and ISO 10218‑2. It does not apply to non-industrial robots, although the safety
    principles presented can be useful to other areas of robotics. NOTE This Technical
    Specification does not apply to collaborative applications designed prior to its
    publication.
