abstract:
- language: en
  script: Latn
  content: ISO 8559-1:2017 provides a description of anthropometric measurements that
    can be used as a basis for the creation of physical and digital anthropometric
    databases. The list of measurements specified in this document is intended to
    serve as a guide for practitioners in the field of clothing who are required to
    apply their knowledge to select population market segments and to create size
    and shape profiles for the development of all garment types and their equivalent
    fit mannequins. The list provides a guide for how to take anthropometric measurements,
    as well as give information to clothing product development teams and fit mannequin
    manufacturers on the principles of measurement and their underlying anatomical
    and anthropometrical bases. Annex A describes the use of the pictogram (standardized
    and modified) based on the selection of most usual body dimensions used for clothing
    size designation. ISO 8559-1:2017 is intended to be used in conjunction with national,
    regional or international regulations or agreements to ensure harmony in defining
    population groups and to allow comparison of anthropometric data sets.
