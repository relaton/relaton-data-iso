abstract:
- language: en
  script: Latn
  content: ISO 22068:2012 specifies the requirements for the chemical composition
    and the mechanical and physical properties of sintered metal injection-moulded
    materials. It is intended to provide design and materials engineers with necessary
    information for specifying materials in components manufactured by means of the
    Metal Injection Moulding (MIM) process only. It does not apply to structural parts
    manufactured by other powder metallurgy routes, such as press-and-sinter or powder-forging
    technologies.
