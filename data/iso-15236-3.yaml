abstract:
- language: en
  script: Latn
  content: ISO 15236-3:2017 specifies the performance and constructional requirements
    applicable to conveyor belts for underground mining having steel cords in the
    longitudinal direction as reinforcement. The requirements for design and construction
    apply to the design of single belts, as well as the design of complete type series
    such as those covered in ISO 15236‑2. Steel cord belts in accordance with this
    document are intended for use underground in coal mines and in other applications
    where the highest demands for safety against fire and explosion hazards have to
    be complied with. NOTE At present, the requirements can only be met by the use
    of compounds based on chloroprene rubber for the covers, as well as for the bonding
    rubber.
