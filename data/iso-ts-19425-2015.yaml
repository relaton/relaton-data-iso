abstract:
- language: en
  script: Latn
  content: ISO/TS 19425:2015 specifies the measurement method and requirements for
    combustion air inlet noise of air cleaners which are installed on reciprocating
    internal combustion engines, including laboratory measurement (engineering method
    and survey method) and site measurement (survey method). ISO/TS 19425:2015 applies
    to all air cleaners installed on reciprocating internal combustion engines (reciprocating
    internal combustion engine is referred to as engine except particular explanation
    in the following text) falling within the field of application of ISO 3046‑1 and/or
    other air induction installation.
