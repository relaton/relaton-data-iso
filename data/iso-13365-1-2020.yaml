abstract:
- language: en
  script: Latn
  content: 'This document specifies a test method by acetonitrile solvent extraction
    for the determination of the total content (solvent extractible) of the following
    preservative agents in leather by liquid chromatography: — 2-(thiocyanomethylthio)-benzothiazole
    (TCMTB); — 4-chloro-3-methylphenol (PCMC); — 2-phenylphenol (OPP); — 2-octylisothiazol-3(2H)-one
    (OIT); This method can also be used to determine breakdown products of these preservative
    agents, which protect leather from microbiological attack.'
