abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard is one of a series on message
    handling. The entire set provides a comprehensive blueprint for a Message Handling
    System (MHS) realized by any number of cooperating open systems. The purpose of
    an MHS is to enable users to exchange messages on a store-and-forward basis. A
    message submitted on behalf of one user, the originator, is conveyed by the Message
    Transfer System (MTS) and subsequently delivered to the agents of one or more
    additional users, the recipients. Access Units (AU) link the MTS to communication
    systems of other kinds (e.g. postal systems). A user is assisted in the preparation,
    storage, and display of messages by a User Agent (UA). Optionally, it is assisted
    in the storage of messages by a Message Store (MS). The MTS comprises a number
    of Message Transfer Agents (MTA) which collectively perform the store-and-forward
    message transfer function. This Recommendation | International Standard defines
    the message handling application called EDI messaging (EDIMG), a form of message
    handling tailored for exchange of Electronic Data Interchange (EDI) information,
    a new message content type and associated procedures known as Pedi. It is designed
    to meet the requirements of users of ISO 9735 (EDIFACT), and other commonly used
    EDI systems. This Recommendation | International Standard is one of a series on
    message handling. ITU-T Rec. X.402 | ISO/IEC 10021-2 constitutes the introduction
    to the series and identifies the other documents in it. The architectural basis
    and foundation for message handling are defined in still other Recommendations
    | International Standards. ITU-T Rec. X.402 | ISO/IEC 10021-2 identifies those
    documents as well.
