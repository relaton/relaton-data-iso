abstract:
- language: en
  script: Latn
  content: ISO 10041-2:2010 specifies the test procedures and a method of presenting
    the results concerning the parameters that define the main characteristics to
    be included in the supplier's literature of electro-pneumatic continuous flow
    control valves. ISO 10041-2:2010 is intended to facilitate the comparison of these
    types of valves by standardizing test methods and the presentation of test results
    and assist in the proper application of these valves in pneumatic systems.
