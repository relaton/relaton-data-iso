abstract:
- language: en
  script: Latn
  content: This document specifies labelling information on battery pack or system
    for electrically propelled vehicles. It also specifies the methods for installing
    labelling. The labelling information includes unique identifiers, barcodes and
    QR codes. Installing methods include visible labels and engravings. This document
    does not apply to battery pack or system under 25 kg. This standard also can be
    applied to battery modules. NOTE This document is also applicable to battery pack
    or system in re-used and remanufactured status.
