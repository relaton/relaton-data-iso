abstract:
- language: en
  script: Latn
  content: This document specifies the structure and properties of the Earth’s atmosphere
    from 30 km to 120 km for aerospace use. It provides internationally accepted empirical
    models that specify the details of the atmosphere. Additionally, it describes
    assimilative models widely used for meteorological forecasting. It also refers
    to widely-accepted physical models providing insight into the physical and chemical
    processes driving the response of the atmosphere
