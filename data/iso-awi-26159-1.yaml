abstract:
- language: en
  script: Latn
  content: A series of standards is proposed to provide information for system integrators
    and facility owners regarding robot and infrastructure integration design and
    best practices, specifically on operating procedures and data exchanges to achieve
    compatibility, safety, security, and reliability in the interaction of multiple
    robots with infrastructures. The information provided within the series also offers
    guidelines on the operating procedures to be followed by robots, as well as on
    what messages to exchange and how to sequence them, thereby ensuring compatible,
    safe, secure, and reliable operation between robots and infrastructures. The first
    in the series, Part 1 will address the overarching framework of Infrastructure
    for Robot Applications (INFRA). Part 1 will contain the list of the elements of
    INFRA, including lifts (elevators), automatic doors, security systems, shared
    space management systems, alarm systems, notification systems, monitoring systems,
    shared marker systems and physical environmental classifications. The following
    parts will provide specific requirements and guidelines for each element of INFRA.
    Part 2, proposed in parallel to Part 1, will address the requirements for interfacing
    with lifts and automatic doors. Subsequent parts will be developed in order of
    market needs.
