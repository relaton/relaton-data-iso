abstract:
- language: en
  script: Latn
  content: Specifies the coded representation of video for digital storage media and
    the decoding process. Is primarily applicable to digital storage media supporting
    a continuous transfer rate up to about 1,5 Mbit/s, such as compact disc, digital
    audio tape, and magnetic hard disc, and for non-interlaced video formats having
    approximately 288 lines of 352 pels and picture rates around 24 Hz to 30 Hz. Nevertheless
    it can be used more widely than this because of the generic approach taken.
