abstract:
- language: en
  script: Latn
  content: 'This document specifies a test method which is intended to determine the
    fogging characteristics of rubber- or plastics-coated fabrics that are used as
    trim materials in the interior of motor vehicles. The method can also apply to
    fluid, pasty, powdered or solid raw materials which are the basis for such trim
    materials or from which the materials are manufactured. The method can also apply
    to other materials and finished products. The procedure is applicable to the measurement
    of fog condensate on glass surfaces within the limits of the test conditions.
    This test cannot measure accurately those cases in which: —    the surface tension
    of the condensate is low, resulting in early coalescing into a thin transparent
    film; —    the condensate is present in such a large quantity that the droplets
    coalesce and form a heavy oily/clear film (this heavy film gives false readings).
    In such cases, the gravimetric method is preferred.'
