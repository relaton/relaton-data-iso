abstract:
- language: en
  script: Latn
  content: 'This document specifies a gravimetric method for the determination of
    the moisture content in rare earth solid concentrate, rare earth oxides and rare
    earth fluorides. The specified measurement ranges for moisture are shown in Table
    1. This document is not applicable to: a)          lanthanum oxide and neodymium
    oxide; b)          rare earth oxides containing lanthanum oxide or neodymium oxide,
    such as lanthanum-cerium oxide, praseodymium-neodymium oxide, etc. This document
    does not involve sampling. NOTE   Since the lanthanum oxide and neodymium oxide
    will react with water and carbon dioxide in the air, moisture cannot be accurately
    determined. However, this method can also be a guidance for the determination
    of the moisture in these materials.'
