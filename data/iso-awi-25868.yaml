abstract:
- language: en
  script: Latn
  content: The document intends to specify terms and definitions commonly used in
    the physical security and secure storage industry. The list of terms focuses on,
    but is not limited to, technical terms for which the definition is considered
    necessary for correct and adequate understanding of the terminology as well as
    reconcile variant terms in use, thereby clarifying the use of terms in this field.
    It is intended to facilitate communication and promote common understanding. The
    definitions given in the document correspond to the practical usage in this field
    and do not necessarily coincide with those used in other fields, nevertheless,
    this document may be used in other fields where desired.
