abstract:
- language: en
  script: Latn
  content: 'This document specifies, tests for the evaluation of thermal distortions
    of the machine tool structure and positioning system, for machining centres with
    vertical spindle, with numerically controlled linear axes of lengths up to 5 000 mm
    for the X-axis and up to 2 000 mm for the Y- and Z-axis. It also applies to machining
    centres with horizontal spindle with numerically controlled linear axes of lengths
    up to 5 000 mm for the X-axis, 3 200 mm for the Y-axis and 2 000 mm for the Z-axis.
    This document specifies four tests: —    environmental temperature variation error;
    —    thermal distortion caused by a rotating spindle; —    thermal distortion
    caused by moving linear axes; —    thermal distortion caused by rotary motion
    of components. This document is intended to be used with ISO 230-3.'
