abstract:
- language: en
  script: Latn
  content: This standard provides guidance for sustainable aspect of human resource
    management by an organization by underlining the importance of sustainability
    in managing human resources, organizations long term viability and business performance.
    This document also provides organization’s interactions and impact on its employees,
    stakeholders and communities in order to establish sustainable human resource
    management. This document applies to all organizations of all types and sizes
    regardless of their sectors and activities. This document can be used throughout
    the life of the organization and can be applied to any activity, internal or external,
    at all levels.
