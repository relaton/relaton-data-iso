abstract:
- language: en
  script: Latn
  content: This document provides specifications related to the ITS-S access layer
    for a communication interface (CI) named "ITS-LTE-V2X". ITS-LTE-V2X CIs are based
    on the evolved-universal terrestrial radio access (E-UTRA) vehicle-to- everything
    (LTE-V2X) technology standardized at 3GPP. This document enables usage of the
    LTE-V2X technology as an ITS access technology in an ITS station by reference
    to respective specifications from 3GPP, and by specifying details of the "Communication
    Adaptation Layer" (CAL) and the "Management Adaptation Entity" (MAE) of communication
    interfaces specified in ISO 21218.
