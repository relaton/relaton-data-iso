abstract:
- language: en
  script: Latn
  content: 'This document: —     provides the general part of the method to calculate
    the greenhouse gas (GHG) emissions throughout the liquefied natural gas (LNG)
    chain, a means to determine their carbon footprint; —     defines preferred units
    of measurement and necessary conversions; —     recommends instrumentation and
    estimation methods to monitor and report GHG emissions. Some emissions are measured;
    and some are estimated. This document covers all facilities in the LNG chain.
    The facilities are considered “under operation”, including emissions associated
    with initial start-up, maintenance, turnaround and restarts after maintenance
    or upset. The construction, commissioning, extension and decommissioning phases
    are excluded from this document but can be assessed separately. This document
    covers all GHG emissions. These emissions spread across scope 1, scope 2 and scope
    3 of the responsible organization. Scope 1, 2 and 3 are defined in this document.
    All emissions sources are covered including flaring, combustion, cold vents, process
    vents, fugitive leaks and emissions associated with imported energy. This document
    describes the allocation of GHG emissions to LNG and other hydrocarbon products
    where other products are produced (e.g. LPG, domestic gas, condensates, sulfur).
    This document does not cover specific requirements on natural gas production and
    transport to LNG plant, liquefaction, shipping and regasification. This document
    is applicable to the LNG industry.'
