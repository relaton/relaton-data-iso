abstract:
- language: en
  script: Latn
  content: This document provides specific requirements and guidance for the design
    and operation of floating LNG storage and regasification units (FSRU) described
    in ISO 20257-1. This document is applicable to offshore, near-shore or docked
    FSRUs and to both new-built and converted FSRUs. This document includes requirements
    to the jetty when an FSRU is moored to a jetty.
