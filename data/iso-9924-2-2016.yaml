abstract:
- language: en
  script: Latn
  content: 'ISO 9924-2:2016 specifies a thermogravimetric method for the determination
    of the total organic content, carbon black content, carbonaceous residue and ash
    in vulcanizates and uncured compounds containing polymers which form a carbonaceous
    residue on pyrolysis (see 1.2). The loss in mass at around 300 °C is an approximate
    guide to the volatile-matter content of the compound. The method is suitable for
    the analysis of rubber compounds and vulcanizates containing the hydrocarbon polymers
    covered by ISO 9924‑1 plus the following copolymers with polar groups which form
    a carbonaceous residue on pyrolysis: a) acrylonitrile-butadiene copolymers (NBRs);
    b) carboxylated acrylonitrile-butadiene copolymers (XNBRs); c) hydrogenated acrylonitrile-butadiene
    copolymers (HNBRs); d) chlorinated isobutylene-isoprene copolymers (CIIRs); e)
    brominated isobutylene-isoprene copolymers (BIIRs).'
