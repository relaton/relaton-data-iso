abstract:
- language: en
  script: Latn
  content: 'ISO 4023:2009 specifies test methods in which a rubber hose test piece
    or hose assembly is exposed to saturated steam, thus simulating service conditions.
    Four methods are specified, namely: method A: vertical rack method; method B:
    horizontal rack method; method C: flexing test, vertical arrangement; method D:
    flexing test, horizontal arrangement.'
