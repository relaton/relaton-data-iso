abstract:
- language: en
  script: Latn
  content: This document specifies a method to determine the total organic carbon
    (TOC), dissolved organic carbon (DOC), total bound nitrogen (TNb) and dissolved
    bound nitrogen (DNb) in the form of free ammonia, ammonium, nitrite, nitrate and
    organic compounds capable of conversion to nitrogen oxides. Cyanide, cyanate and
    particles of elemental carbon (soot), when present in the sample, can be determined
    together with the organic carbon. Dissolved nitrogen gas (N2) is not determined.
    NOTE            Generally, the method can be applied for the determination of
    total carbon (TC) and total inorganic carbon (TIC) – see Annex A. The method is
    applicable to water samples (e.g. drinking water, raw water, ground water, surface
    water, sea water, waste water, leachates). This document is applicable to determination
    of TOC and DOC ≥1 mg/l and TNb and DNb ≥1 mg/l. The upper working range is restricted
    by instrument-dependent conditions (e.g. injection volume). Higher concentrations
    can be determined after appropriate dilution of the sample. The determination
    of concentrations <1 mg/l is dependent on instrument conditions applying appropriate
    calibration. For samples containing volatile organic compounds (e.g. industrial
    waste water), the application of the difference method can be considered – see
    Annex A. The procedure is carried out by automated analysis.
