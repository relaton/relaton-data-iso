abstract:
- language: en
  script: Latn
  content: ISO 16128-1:2016 provides guidelines on definitions for natural and organic
    cosmetic ingredients. In addition to natural and organic ingredients, other ingredient
    categories which may be necessary for natural and organic product development
    are defined with associated restrictions. ISO 16128 does not address product communication
    (e.g. claims and labelling), human safety, environmental safety and socio-economic
    considerations (e.g. fair trade), and the characteristics of packaging materials
    or regulatory requirements applicable for cosmetics.
