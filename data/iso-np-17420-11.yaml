abstract:
- language: en
  script: Latn
  content: This document specifies specific requirements for the performance and testing of respiratory protective devices (RPD) in accordance with their classification and for use by children to protect from particles in hazardous atmospheres and/or environments. The requirements are based on human factors and are for the complete respiratory systems. Requirements for marking and information supplied by the RPD manufacturer are included. Requirements for ensuring the fit capability of RPD on developing, e.g. growing faces are also included.
