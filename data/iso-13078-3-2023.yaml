abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the calibration of resistance-heated
    high temperature sintering furnaces that are suitable for the sintering of dental
    restorations in the temperature range up to 1 700 °C. NOTE       A test method
    for the calibration of dental furnaces that are suitable for the heat treatment
    of silica-based dental ceramic restorations in the temperature range between 600 °C
    and 1 050 °C is specified in ISO 13078:2013. ISO 13078:2013 does not include the
    calibration of sintering furnace used for sintering of oxide ceramics or sintered
    metal, in whose firing chamber restorations are sintered at temperatures of 1 000 °C
    to 1 700 °C.
