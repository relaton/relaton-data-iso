abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for the determination of
    castor oil seed (Ricinus communis) husks in single and compound animal feeding
    stuffs and, in particular, in oilseed residues. The limits of detection is 5 mg/kg.
    The method requires final microscopical identification of the isolated husks.
    This last phase therefore requires a specialist who has had sufficient experience
    in this type of identification and who is experienced in microscopic techniques.
