abstract:
- language: en
  script: Latn
  content: This document describes a method in which 3D body scan range data, collected
    for a representative sample of a population can be segmented and subsequently
    analysed, to generate average body shapes for use in a wide range of clothing
    applications. The document also describes the type of knowledge required by the
    intended audience is those statisticians and computer scientists who have the
    expertise to capture and create body scan data bases and to analyse 1D,2D and
    3D body scan data. The output of these analyses more accurately represents the
    3D body shape, the shape variation of a nation or the shape of a given market
    segment, and they are unvaluable to clothing companies, including those responsible
    for creating fit-mannequin, product design and the development of clothing.
