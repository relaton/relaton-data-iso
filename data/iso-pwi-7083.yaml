abstract:
- language: en
  script: Latn
  content: This document specifies the recommended proportions for the symbols used
    in technical product documentation. It gives recommended dimensions based on the
    grid related to the line width to be used. This document does not apply to symbols
    used in process plant documentation, which are covered in ISO 81714-1. The proportions
    of the symbols are based on the standard heights of lettering given in ISO 3098-1.
