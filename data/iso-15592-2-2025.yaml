abstract:
- language: en
  script: Latn
  content: This document specifies an atmosphere for conditioning and testing samples
    of fine-cut tobacco and test pieces made from it. It is applicable to tests on
    fine-cut tobacco and products and materials used in the manufacture of fine-cut
    smoking articles for which a prior conditioning is necessary. It is not applicable
    in the case of test methods for which particular test conditions are laid down
    elsewhere, for example other tobacco products which are given in ISO 3402.
