abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for screening, optimization and
    evaluation of the aptamers. This document specifies the evaluation parameters
    and methods for the aptamer. This document is applicable to aptamer targets at
    different levels, such as metal ions, small molecules, macromolecules, cells and
    particles, tissues, and mixed targets. This document is intended to be used by
    researchers, manufacturers and customs involved in the design, screening, optimization,
    and evaluation of nucleic acid aptamers for various applications.
