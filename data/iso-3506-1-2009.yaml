abstract:
- language: en
  script: Latn
  content: ISO 3506-1:2009 specifies the mechanical properties of bolts, screws and
    studs made of austenitic, martensitic and ferritic steel grades of corrosion-resistant
    stainless steels, when tested over an ambient temperature range of 10 °C to 35
    °C. Properties vary at higher or lower temperatures. ISO 3506-1:2009 applies to
    bolts, screws and studs - with nominal thread diameter d ≤ 39 mm, - of triangular
    ISO metric threads with diameters and pitches in accordance with ISO 68-1, ISO
    261 and ISO 262, and - of any shape. It does not apply to screws with special
    properties, such as weldability.
