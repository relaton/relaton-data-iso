abstract:
- language: en
  script: Latn
  content: This document specifies the maximum external gas leakage rates which are
    acceptable for equipment used for welding, cutting and allied processes and provides
    the procedures of measurement. It applies to individual components which are used
    in the gas supply to a blowpipe from the connecting point of the hose (outlet
    of the cylinder valve or connecting point to a gas supply plant). It does not
    apply to gas supply plant. NOTE Specific requirements on the test method and conditions/procedure
    for measurement of the maximum external leakages can be given in individual standards,
    e.g. ISO 9012 for air-aspirated hand blowpipes. Concerning the method and the
    conditions to be applied, the individual standard takes precedence over this document.
    The maximum external leakages according to this document apply.
