abstract:
- language: en
  script: Latn
  content: ISO 17366:2013 defines the basic features of RFID for use in the supply
    chain when applied to product packaging. In particular it a) provides specifications
    for the identification of the product packaging, b) makes recommendations about
    additional information on the RF tag, c) specifies the semantics and data syntax
    to be used, d) specifies the data protocol to be used to interface with business
    applications and the RFID system, e) specifies the minimum performance requirements,
    f) specifies the air interface standards between the RF interrogator and RF tag,
    and g) specifies the reuse and recyclability of the RF tag.
