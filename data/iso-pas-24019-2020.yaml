abstract:
- language: en
  script: Latn
  content: This document specifies requirements and recommendations for using simultaneous
    interpreting delivery platforms in settings where the interpreters are, or are
    not, in the same room as participants and speakers at a communicative event. In
    conjunction with ISO 20108, this document provides the relevant requirements and
    recommendations for the quality and transmission of sound and image to interpreters
    and from interpreters to participants, and for the configuration of the interpreter's
    working environment.
