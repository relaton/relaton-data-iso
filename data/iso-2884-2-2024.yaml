abstract:
- language: en
  script: Latn
  content: This document specifies a general procedure for determining the viscosity
    of paints, varnishes and related products, as well as binders. The method is primarily
    used to determine the relative viscosity of a product and to monitor this while
    thinning during a manufacturing process. It describes a relative measurement of
    viscosity using disc or ball spindles at specified speeds. The method specified
    in this document is suitable for all paints and varnishes whether they are Newtonian
    in behaviour or not. It can also be applied to materials containing dispersions
    of particles.
