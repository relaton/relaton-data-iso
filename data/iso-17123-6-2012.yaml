abstract:
- language: en
  script: Latn
  content: ISO 17123-6:2012 specifies field procedures to be adopted when determining
    and evaluating the precision (repeatability) of rotating lasers and their ancillary
    equipment when used in building and surveying measurements for levelling tasks.
    Primarily, these tests are intended to be field verifications of the suitability
    of a particular instrument for the immediate task at hand and to satisfy the requirements
    of other standards. ISO 17123-6:2012 differentiates between different measures
    of accuracy and objectives in testing, like repeatability and reproducibility
    (between-day repeatability), and gives a thorough assessment of all possible error
    sources.
