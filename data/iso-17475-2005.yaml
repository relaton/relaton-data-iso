abstract:
- language: en
  script: Latn
  content: ISO 17475:2005 applies to corrosion of metals and alloys, and describes
    the procedure for conducting potentiostatic and potentiodynamic polarization measurements.
    The test method can be used to characterise the electrochemical kinetics of anodic
    and cathodic reactions, the onset of localised corrosion and the repassivation
    behaviour of a metal.
