abstract:
- language: en
  script: Latn
  content: ISO 5270:2012 specifies the relevant International Standards to be used
    for the determination of physical properties of laboratory sheets made of all
    kind of pulps. It is applicable to laboratory sheets prepared in accordance with
    ISO 5269-1, ISO 5269-2 or ISO 5269-3. In ISO 5270:2012, it is left to the pulp
    producer and the pulp user to agree upon which properties are relevant to be tested.
    The results are, if applicable, reported in index form.
