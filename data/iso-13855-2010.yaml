abstract:
- language: en
  script: Latn
  content: 'ISO 13855:2010 establishes the positioning of safeguards with respect
    to the approach speeds of parts of the human body. It specifies parameters based
    on values for approach speeds of parts of the human body and provides a methodology
    to determine the minimum distances to a hazard zone from the detection zone or
    from actuating devices of safeguards. The values for approach speeds (walking
    speed and upper limb movement) in ISO 13855:2010 are time tested and proven in
    practical experience. ISO 13855:2010 gives guidance for typical approaches. Other
    types of approach, for example running, jumping or falling, are not considered
    in ISO 13855:2010. Safeguards considered in ISO 13855:2010 include: - electro-sensitive
    protective equipment, including light curtains and light grids (AOPDs), and laser
    scanners (AOPDDRs) and two-dimensional vision systems; - pressure-sensitive protective
    equipment, especially pressure-sensitive mats; - two-hand control devices; - interlocking
    guards without guard locking.'
