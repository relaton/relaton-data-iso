abstract:
- language: en
  script: Latn
  content: This document specifies the characterization parameters, test method and
    procedures, calculation and evaluation of results, as well as reporting requirements
    for the axial tensile properties of curved-edge triangular thin-walled tubes made
    of fiber-reinforced composites. This document applies to the testing, characterization,
    and evaluation of axial tensile properties of triangular thin-walled tubular components
    with curved-edged structures, based on fiber-reinforced polymer matrix composites.
    The document can be used for research and development, quality control in production,
    performance verification, and academic studies related to such products.
