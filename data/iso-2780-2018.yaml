abstract:
- language: en
  script: Latn
  content: 'This document specifies the dimensions for interchangeability between
    milling cutters with tenon drive and the cutter seating of cutter arbors. It is
    applicable only to milling cutters of the metric series. It gives the interchangeability
    dimensions for: — the milling cutters; — the cutter seating on the arbor; — the
    cutter retaining screw on the cutter arbor.'
