abstract:
- language: en
  script: Latn
  content: This document specifies selection criteria for, and describes the design
    characteristics of, the various electrical- and fluid-circuit penetration components
    mounted on leaktight or shielded containment enclosures. This document is applicable
    to electrical components, including connectors, fixed or removable wall penetrations,
    distribution boxes and lighting devices, and fluid components, including fixed
    or removable wall penetrations, fittings and junctions, and control devices for
    process or effluent circuits. NOTE            The elements constituting the framework
    of containment enclosures (e.g. metallic walls, framework and transparent panels)
    are dealt with in ISO 10648-1.
