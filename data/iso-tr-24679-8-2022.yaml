abstract:
- language: en
  script: Latn
  content: This document provides an example of a probabilistic assessment of a concrete
    building by revisiting the structural fire analysis of the concrete building presented
    in ISO/TR 24679-6, using probabilistic approaches. Specifically, the most heavily-loaded
    concrete column is analysed probabilistically, using the evaluation in ISO/TR 24679-6
    as a starting point. This report only addresses the fire safety objectives related
    to the structural performance. The analysis within this document therefore forms
    only part of the overall building fire safety strategy.
