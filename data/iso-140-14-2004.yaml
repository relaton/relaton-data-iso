abstract:
- language: en
  script: Latn
  content: ISO 140-14:2004 concerns field measurements of airborne sound insulation
    and impact sound insulation, and is to be used as a supplement to ISO 140-4 and
    ISO 140-7. It contains guidelines on sound insulation measurements in special
    situations in the field not directly covered by ISO 140-4 and ISO 140-7. The basic
    standards ISO 140-4 and ISO 140-7 specify the measurement procedure in detail
    under ideal conditions, but give only little information on how to establish a
    suitable measurement set-up in rooms differing from simple box-shaped rooms of
    normal living room size. When it comes to very large rooms, long and narrow rooms,
    staircases, coupled rooms, etc., no guidance is given in the basic standards,
    which is why the guidelines in ISO 140-14:2004 have been prepared. Use of the
    guidelines will contribute to improvement in the reproducibility of building acoustics
    field measurements and furthermore facilitate the performance of measurements
    by avoiding time-consuming considerations in actual measurement situations. ISO
    140-14:2004 is primarily applicable to measurements in rooms in dwellings, schools,
    hotels, etc., with volumes less than 250 m3.
