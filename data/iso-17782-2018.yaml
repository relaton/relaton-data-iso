abstract:
- language: en
  script: Latn
  content: 'This document establishes a procedure for verifying that the manufacturer
    of special materials for the petroleum, petrochemical and natural gas industries
    has sufficient competence and experience of the relevant material grades of metal,
    and the necessary facilities and equipment, to manufacture these materials in
    the required shapes and sizes with acceptable properties according to the applicable
    standard, material specification and/or material data sheet specified by the purchaser.
    This document is applicable to manufacturers of various materials, product forms
    and manufacturing processes when specified by the purchaser. This document has
    been established considering especially, but not exclusively: a) duplex stainless
    steel; b) high alloyed austenitic stainless steel; c) nickel-based alloys; d)
    titanium and its alloys. This document is also applicable to the processes of
    induction bending and strain-hardened products.'
