abstract:
- language: en
  script: Latn
  content: ISO 14314:2004 specifies the safety requirements for RIC engine re-coil
    starting equipment intended for use on reciprocating internal combustion engines
    for land, rail and marine use, excluding engines intended for use to propel road
    vehicles and aircraft. It may be applied to engines intended for use to propel
    construction and earth-moving machines and for other applications where no other
    suitable International Standards exist. In addition to the technical safety requirements,
    it also contains the method of checking the adherence to these requirements. This
    International Standard only addresses the hazards associated with the installation
    and operation of re-coil starting equipment. It is primarily directed at machines
    which are manufactured after the date of publication of this International Standard.
