abstract:
- language: en
  script: Latn
  content: This standard applies to coals and products of their processing (coals
    brown and lignites, hard coals, anthracites, sorted and enriched coals, agglomerated
    fuel, coke, semi-coke - hereinafter referred to as solid fuel) and sets methods
    for determining the ignition temperature and self-ignition of solid fuel. The
    ignition and self-ignition temperature are determined in order to ensuring fire
    safety and explosion safety of production conditions, storage, transportation
    and use of solid fuels. The standard is intended for use by manufacturers (suppliers)
    and consumers, government agencies, conformity assessment bodies and testing laboratories,
    research organizations, other legal entities and individuals working with solid
    fuels.
