abstract:
- language: en
  script: Latn
  content: 'This document specifies how a preliminary welding procedure specification
    (pWPS) is qualified by welding procedure tests. This document is applicable to
    production welding and repair welding. This document is applicable to fusion welding
    of steels covered by groups 1, 2, 3 and 8 in accordance with ISO 15608 in a hyperbaric
    wet environment. This document is applicable to the following welding processes,
    in accordance with ISO 4063:2023, applicable in hyperbaric wet environments: —    
    111 manual metal arc welding (metal arc welding with covered electrode); —    
    114 self-shielded tubular-cored arc welding. The principles of this document can
    be applied to other steel groups and fusion welding processes not listed. This
    document specifies three weld quality levels, A, B, and Z in order to permit application
    to a wide range of weldments. Each weld quality level defines a set of criteria
    for weldment properties that are established during qualification. This document
    does not address the selection of the weld quality level to meet the requirements
    of a particular application.'
