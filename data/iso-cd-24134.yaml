abstract:
- language: en
  script: Latn
  content: 'ISO 24134:2006 specifies the safety requirements for controls and control
    systems for the following automated functions of industrial trucks: steering (excluding
    direct mechanical guidance); travel; lifting and lowering operations; load manipulations,
    e.g. rotation, reach, slewing, tilting, clamping; combination and/or sequence
    of these movements. ISO 24134:2006 is intended for use in conjunction with one
    or more of the applicable parts of ISO 3691. It is not applicable to, and does
    not include, requirements for the following: safety equipment (e.g. devices for
    height limitation, speed limitation) used to override driver control; operation
    in severe conditions (e.g. extreme climates, freezer applications, strong magnetic
    fields); operation in environments subject to special rules (e.g. potentially
    explosive atmospheres); electromagnetic compatibility; transportation of passengers;
    handling of loads, the nature of which could lead to dangerous situations (e.g.
    molten metals, acids/bases, radiating materials). Limitations in the scopes of
    the applicable parts of ISO 3691 also apply to ISO 24134:2006.'
