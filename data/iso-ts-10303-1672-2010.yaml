  script: Latn
  content: 'ISO/TS 10303-1672:2010-07 specifies the application module for Fill area
    style. The following are within the scope of ISO/TS 10303-1672:2010-07: solid
    fill; tile fill; hatch fill; items within the scope of application module Basic
    curve, ISO/TS 10303-1651; items within the scope of application module Curve appearance,
    ISO/TS 10303-1003; items within the scope of application module Extended basic
    geometry, ISO/TS 10303-1667; items within the scope of application module Value
