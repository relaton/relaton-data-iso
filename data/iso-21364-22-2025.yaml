abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for safety, construction and materials
    of domestic gas ovens and compartment grills. NOTE 1        For general requirements
    regarding safety, construction and materials of gas ovens and compartment grills,
    see ISO 21364-1. This document is applicable to the following: —     the following
    gas cooking appliances being built-in, table top or part of a cooking range: —   
    ovens with natural or forced convection; —    pyrolytic-self-cleaning ovens and
    pyrolytic-self-cleaning compartment grills; —    compartment grills. —     oven
    accessories. It is not applicable to gas ovens and compartment grills intended
    for either outdoor use or commercial use, or both, as well as electrical heated
    elements as part of the appliance. NOTE 2        For requirements regarding electrical
    safety, refer to the IEC 60335 series. NOTE 3        Attention is drawn to the
    fact that: —      for appliances intended to be used in vehicles or on board ships
    or aircraft, additional requirements can apply; —      in many countries, additional
    requirements are specified by the national health authorities, the national water
    supply authorities and similar authorities. This document does not cover requirements
    relating to gas cylinders, their pressure regulators and their connections. This
    document does not cover requirements for gas installation.'
