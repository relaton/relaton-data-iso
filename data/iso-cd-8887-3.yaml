abstract:
- language: en
  script: Latn
  content: This document provides options for the selection of the general policies
    and specific decisions to be made when considering the potential for manufactured
    products and/or their components, to be designed to have a recoverable value at
    the end of their life in service. Guidance is also given on the factors to be
    considered during the design process which influence further life. NOTE For further
    information on the environmental case, the business case, and the marketing case
    see annex A.
