abstract:
- language: en
  script: Latn
  content: This document specifies the relative angular movement between articulating
    components, the pattern of the applied force, speed and duration of testing, sample
    configuration and test environment to be used for the wear testing of total ankle-joint
    prostheses in wear-testing machines with load or displacement control. NOTE This
    document is based on the method described by ISO 14243‑1 and ISO 14243‑3 and allows
    for the use of the same test equipment as for total knee replacement wear testing.
