abstract:
- language: en
  script: Latn
  content: ISO 16000-31:2014 specifies a test method for the sampling and analysis
    of the phosphoric acid esters in indoor air and in test chamber air through gas
    chromatography/mass spectrometry. Both principle methods of the low-resolution
    mass spectrometry and the high-resolution mass spectrometry are described. The
    methods described in ISO 16000-31:2014 are not suitable for the determination
    of the phosphoric acid esters in materials.
