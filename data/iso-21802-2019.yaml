abstract:
- language: en
  script: Latn
  content: This document specifies principles of cognitive accessibility within the
    area of daily time management. This document gives guidelines for design application
    for features and functions known to increase the accessibility of products and
    systems used to support daily time management for people with cognitive impairment
    regardless of age. This document does not provide test methods and specific instructions
    for measuring and reporting. NOTE ANSI/RESNA CA-1:2016 specifies features, measurement
    methods, and documentation for reporting the universal design specifications that
    support inclusion of individuals with cognitive impairment that might be applicable
    and beneficial to use for evaluating products and systems used to support daily
    time management.
