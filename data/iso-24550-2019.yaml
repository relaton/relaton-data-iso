abstract:
- language: en
  script: Latn
  content: This document specifies design requirements and recommendations for indicator
    lights, mainly LED sourced, on consumer products for use by older people and people
    with visual disabilities. It does not consider the needs of persons who are blind.
    Indicator lights include those that inform users visually about the conditions,
    changes in functional status and settings, and malfunction of products. They convey
    information by light on/off, time-modulated intensity, blinking, colour, luminance
    level, and layout. This document addresses household and home appliances. It excludes
    electronic displays presenting characters and graphics, machinery, and appliances
    in special use for professional, technical, and industrial applications.
