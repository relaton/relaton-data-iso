abstract:
- language: en
  script: Latn
  content: This document specifies the form, dimensions and capacities of glass vials
    for injectable preparations. It also specifies the material from which such containers
    are made and the performance requirements of those containers. This document is
    applicable to colourless or amber glass containers made from borosilicate or soda-lime
    glass, made from glass tubing, whether internally surface-treated or not, and
    intended to be used in the packaging, storage or transportation of products intended
    for injection.
