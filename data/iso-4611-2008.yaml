abstract:
- language: en
  script: Latn
  content: ISO 4611:2008 specifies the conditions of exposure of plastics to damp
    heat; water spray; salt mist; and the methods for the evaluation of the change
    in some significant characteristics after given exposure stages. It is, in general,
    suitable for all plastics in the form of standard test specimens, and finished
    articles or parts thereof. It considers separately methods for the determination
    of change in mass; change in dimensions and appearance; change in physical properties.
