abstract:
- language: en
  script: Latn
  content: ISO 17558:2006 specifies procedures for the molten metal and resin socketing
    of steel wire ropes. It also specifies a type testing method for assessing the
    performance of a socketing system. The procedures described in ISO 17558:2006
    are for use with sockets having a strength exceeding that of the minimum breaking
    force of the rope to be socketed and made from a material that remains unchanged
    when the socketing media is hot metal.
