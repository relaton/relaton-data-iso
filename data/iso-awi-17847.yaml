abstract:
- language: en
  script: Latn
  content: It defines the marine economy and ocean industry, and stipulates the classification
    and codes of the ocean industry and its related industries. The draft divides
    the ocean industry and its related industries into 121 divisions, 28 classes in
    five categories based on the nature of marine economic activities. This classification
    is applicable to the classification of marine economic activities in marine economy
    survey, monitoring, statistics, accounting, evaluation and other areas, and is
    used for information processing and information exchange.
