abstract:
- language: en
  script: Latn
  content: This part of ISO 22915 specifies tests for verifying the stability of —
    pallet stackers, — double stackers, and — order-picking trucks with an operator
    position elevating up to and including 1 200 mm lift height, measured from the
    ground to the floor of the platform. It is applicable to these types of industrial
    truck, whether with tilting or non tilting masts or fork arms, having a rated
    capacity up to and including 5 000 kg. It is also applicable to such trucks operating
    under the same conditions when equipped with load-handling attachments and to
    order-picking trucks with an elevating operator's position up to and including
    1 200 mm lift height when equipped with an additional load lifting device(s).
