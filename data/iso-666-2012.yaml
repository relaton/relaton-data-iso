abstract:
- language: en
  script: Latn
  content: This International Standard specifies the essential requirements, especially
    the dimensions, for hub flanges for plain grinding wheels according to ISO 603-1,
    ISO 603-2, ISO 603-4, ISO 603-6, ISO 603-7 and ISO 603-8, with a ratio of the
    bore diameter to the outside diameter H/D > 0,2. It is also applicable to super
    abrasives with vitrified or metal core having the same diameters as the grinding
    wheels in accordance with the according to the aforementioned parts of ISO 603,
    independently from the material of the core. It applies to grinding wheels with
    peripheral speeds up to 50 m/s and driving powers of the wheel spindle up to 30
    kW. It is not applicable to mounting devices for cutting-off wheels.
