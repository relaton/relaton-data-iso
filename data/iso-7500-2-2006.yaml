abstract:
- language: en
  script: Latn
  content: ISO 7500-2:2006 specifies the verification of testing machines used for
    uniaxial creep testing in tension in accordance with ISO 204. The verification
    consists of a general inspection of the testing machine, anda verification of
    the force applied by the testing machine. ISO 7500-2:2006 applies to dead-weight
    machines, lever-type creep testing machines and direct-spring-loading machines.
    Machines with a force-measuring system should be verified in accordance with ISO
    7500-1.
