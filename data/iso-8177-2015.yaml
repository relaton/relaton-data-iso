abstract:
- language: en
  script: Latn
  content: ISO 8177:2015 specifies maximum and minimum dimensions for omega clamps
    (saddle clamps) installed by means of two bolts with nominal diameters of 5 mm.
    The specified dimensions define a dimensional envelope. This International Standard
    shall not be considered as an inter-changeability standard. The tolerances for
    each type of clamp are to be defined in the parts standards drawings.
