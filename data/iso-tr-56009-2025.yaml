abstract:
- language: en
  script: Latn
  content: 'This document provides illustrative examples of how organizations of different
    kinds, sizes and innovation objectives can implement innovation operation measurements
    by using ISO 56008. This document is applicable to: —     organizations that are
    seeking to define and implement an innovations operations measurement approach;
    —     organizations and interested parties seeking to improve the areas of accountability,
    transparency and evidence-based assessment of innovation operations; —     providers
    of training in innovation operations and measurements, including assessment of
    and consultancy for achieving results; —     experts in innovation operations
    evaluation and impact assessment, favouring the use of a harmonized guidance International
    Standard.'
