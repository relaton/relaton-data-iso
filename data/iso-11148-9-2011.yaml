abstract:
- language: en
  script: Latn
  content: ISO 11148-9:2011 specifies safety requirements for hand-held non-electric
    power tools fitted with collets (hereinafter "die grinders") intended for grinding
    and surface finishing and chamfering using mounted points, burrs and files and
    small wire brushes and other accessories mounted on shanks. The die grinders can
    be powered by compressed air, hydraulic fluid or internal combustion engines and
    are intended to be used by one operator and supported by the operator's hand or
    hands, with or without a suspension, e.g. a balancer. ISO 11148-9:2011 is applicable
    to angle die grinders, reciprocating files, rotary files and straight die grinders.
    ISO 11148-9:2011 deals with all significant hazards, hazardous situations or hazardous
    events relevant to die grinders when they are used as intended and under conditions
    of misuse which are reasonably foreseeable by the manufacturer, with the exception
    of the use of die grinders in potentially explosive atmospheres.
