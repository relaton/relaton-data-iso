abstract:
- language: en
  script: Latn
  content: This document specifies a test method for determining the resistance to
    elevated temperature cycling of thermoplastics piping systems for non‑pressure
    applications, inside buildings or buried in the ground within the building structure.
    This document is applicable to piping systems with components of nominal outside
    diameters up to and including 200 mm. Although limited to nominal outside diameters
    up to and including 200 mm, the test results may be extrapolated to products of
    larger nominal outside diameters from the same range.
