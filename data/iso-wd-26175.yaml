abstract:
- language: en
  script: Latn
  content: This document presents guidelines to wellbeing for healthy ageing in the
    context of community-based oral health programmes for community members based
    on the framework presented in ISO 25554. This document is applicable to communities
    and their members that take action to improve and maintain oral health for continuous
    promotion of wellbeing. This document is applicable to any community, regardless
    of size, type and nature. Management of occupational safety and health is outside
    of the scope of this document. This document does not cover economic and financial
    aspects.
