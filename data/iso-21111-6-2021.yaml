abstract:
- language: en
  script: Latn
  content: 'This document specifies advanced features of an ISO/IEC/IEEE 8802-3 automotive
    Ethernet PHY (often also called transceiver), e.g. for diagnostic purposes for
    automotive Ethernet PHYs. This document specifies: —    advanced PHY features;
    —    wake-up and sleep features; —    PHY test suite; —    PHY control IUT requirements
    and conformance test plan; —    PCS test suite; —    PCS IUT requirements and
    conformance test plan; —    PMA test suite; and —    PMA IUT requirements and
    conformance test plan.'
