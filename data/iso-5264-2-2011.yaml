abstract:
- language: en
  script: Latn
  content: ISO 5264-2:2011 specifies a method for the laboratory beating of pulp using
    a PFI mill. The description is limited to the sampling, preparation and beating
    of the pulp and the beating equipment. In principle, this method is applicable
    to all kinds of chemical and semi-chemical pulps. In practice, the method might
    not give satisfactory results with certain pulps having extremely long fibres.
