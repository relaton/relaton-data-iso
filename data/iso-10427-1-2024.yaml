abstract:
- language: en
  script: Latn
  content: This document specifies testing, performance, and marking requirements
    for casing bow-spring centralizers to be used in oil and natural gas well construction.
    The procedures give guidance on verification testing for the manufacturer’s design,
    materials, and process specifications, and periodic testing to confirm the consistency
    of product performance. This specification is not applicable to other devices,
    such as rigid centralizers and cement baskets, or bow-spring centralizers used
    for other purposes (e.g., wireline tools, gravel pack, inner string). This document
    is a supplement to API Spec 10D 7th edition (2021), the requirements of which
    are applicable with the exceptions specified in this document.
