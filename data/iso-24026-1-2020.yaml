abstract:
- language: en
  script: Latn
  content: 'This document establishes a system of designation for poly(methyl methacrylate)
    (PMMA) thermoplastic material, which can be used as the basis for specifications.
    The types of PMMA plastic are differentiated from each other by a classification
    system based on appropriate levels of the designatory properties: a) Vicat softening
    temperature; b) melt mass-flow rate; c) viscosity number (optional); and on information
    about the intended application and/or method of processing, important properties,
    additives and colorants. This document is applicable to all poly(methyl methacrylate)
    homopolymers and to copolymers of methyl methacrylate (MMA) containing at least
    a mass percentage of 80 % of MMA and not more than a mass percentage of 20 % of
    acrylic esters or other monomers. This document applies to materials ready for
    normal use in the form of beads, granules and pellets and to materials unmodified
    or modified by colorants, additives, etc. It does not apply to PMMA modified with
    elastomers. It is not intended to imply that materials having the same designation
    give necessarily the same performance. This document does not provide engineering
    data, performance data or data on processing conditions which might be required
    to specify a material for a particular application and/or method of processing.
    If such additional properties are required, they are, if suitable, determined
    using the test methods specified in ISO 24026-2. In order to specify a thermoplastic
    material for a particular application or to ensure reproducible processing, additional
    requirements can be given in data block 5 (see 4.1).'
