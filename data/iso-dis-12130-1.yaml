abstract:
- language: en
  script: Latn
  content: This document specifies a calculation method for oil-lubricated hydrodynamic
    plain bearings with complete separation of the thrust collar and tilting pad thrust
    bearing surfaces by a film of lubricant. This document applies to plain thrust
    bearings with tilting-type sliding blocks (tilting pads), where a wedge-shaped
    lubrication clearance gap is automatically formed during operation. The ratio
    of width to length of one pad can be varied in the range B/L = 0,5 to 2. This
    document is not applicable to heavily loaded tilting pad thrust bearings. NOTE      
    Equivalent calculation procedures exist that enable operating conditions to be
    estimated and checked against acceptable conditions. The use of them is equally
    admissible.
