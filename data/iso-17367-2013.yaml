abstract:
- language: en
  script: Latn
  content: ISO 17367:2013 defines the basic features of RFID for use in the supply
    chain when applied to product tagging. In particular it a) provides specific recommendations
    about the encoded identification of the product, b) makes recommendations about
    additional information about the product on the RF tag, c) makes recommendations
    about the semantics and data syntax to be used, d) makes recommendations about
    the data protocol to be used to interface with business applications and the RFID
    system, and e) makes recommendations about the air interface standards between
    the RF interrogator and RF tag. ISO 17367:2013 only addresses product tagging
    and does not address product packaging.
