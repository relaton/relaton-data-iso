abstract:
- language: en
  script: Latn
  content: 'ISO 24617-6:2016 specifies the approach to semantic annotation characterizing
    the ISO Semantic annotation framework (SemAF). It outlines the SemAF strategy
    for developing separate annotation schemes for certain classes of semantic phenomena,
    aiming in the long term to combine these into a single, coherent scheme for semantic
    annotation with wide coverage. In particular, it sets out the notions of both
    an abstract and a concrete syntax for semantic annotations, mirroring the distinction
    between annotations and representations that is made in the ISO Linguistic Annotation
    Framework. It describes the role of these notions in relation to the specification
    of a metamodel and a semantic interpretation of annotations, with a view to defining
    a well-founded annotation scheme. ISO 24617-6:2016 also provides guidelines for
    dealing with two issues regarding the annotation schemes defined in SemAF-parts:
    a) conceptual and terminological inconsistencies that may arise due to overlaps
    between annotation schemes and b) the treatment of semantic phenomena that cut
    across SemAF-parts, such as negation, modality and quantification. Instances of
    both issues are identified, and in some cases, direction is given as to how they
    may be tackled.'
