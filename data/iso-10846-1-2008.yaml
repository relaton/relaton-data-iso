abstract:
- language: en
  script: Latn
  content: ISO 10846-1:2008 explains the principles underlying ISO 10846-2, ISO 10846-3,
    ISO 10846-4 and ISO 10846-5 for determining the transfer properties of resilient
    elements from laboratory measurements, and provides assistance in the selection
    of the appropriate part of this series. It is applicable to resilient elements
    that are used to reduce the transmission of audiofrequency vibrations (structure-borne
    sound, 20 Hz to 20 kHz) to a structure which may, for example, radiate fluid-borne
    sound (airborne, waterborne, or other), and the transmission of low-frequency
    vibrations (typically 1 Hz to 80 Hz), which may, for example, act upon human subjects
    or cause damage to structures of any size when the vibration is too severe.
