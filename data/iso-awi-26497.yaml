abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of free acid content
    of lithium hexafluorophosphate (LiPF6) by potentiometric titration. This document
    is applicable to the determination of free acid (expressed as hydrofluoric acid)
    in LiPF6 product within the range from 20 mg/kg to 2000 mg/kg. The limit of detection
    is 20 mg/kg.
