abstract:
- language: en
  script: Latn
  content: 'This document establishes the tyre size designation, the dimensional calculation
    formulae, the markings and the tyre and rim coordination for the metric series
    of tyres primarily intended for use on agricultural and forestry tractors, machines,
    equipment and trailers and for construction machines. It applies to diagonal,
    bias-belted and radial tyres mounted on 5° and 15° tapered rims. NOTE Code designated
    series of: — diagonal (ply rating marked) tyres for agricultural tractors and
    machines are specified in ISO 4251-1 and ISO 4251-2; — radial (service description
    marked) tyres for agricultural tractor-drive-wheel tyres are specified in ISO
    8664; — tyres for logging and forestry machines are specified in ISO 18807[1];
    — tyres for construction/industrial tractors are specified in ISO 13442. [1] Under
    preparation. Stage at the moment of publication ISO/DIS 18807:2018.'
