abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for materials, design parameters,
    performance characteristics, and test methods for equipment known as Shirodhara
    Yantra, used for administering continuous, controlled flow of medicated liquids
    on the forehead during Ayurvedic therapeutic procedures. It covers aspects related
    to materials, construction, flow-control mechanisms, heating/temperature-maintenance
    systems (where applicable), safety, hygiene, durability and stability. This document
    applies to Shirodhara Yantra made of metal, ceramic, copper alloys, stainless
    steel, or composite constructions used in clinical, institutional, wellness, and
    professional Panchakarma practice settings. It does not apply to general-purpose
    liquid-dispensing devices or equipment not intended for Ayurveda therapeutic procedures.
