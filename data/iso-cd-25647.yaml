abstract:
- language: en
  script: Latn
  content: This International Standard specifies the chemical analysis method of boron
    carbide fine powder used as a raw material for fine ceramics. This International
    Standard specifies the analysis method of total boron, free boron, boron oxide,
    total carbon, free carbon, oxygen, nitrogen, trace metal impurities in boron carbide
    powders for fine ceramics. Total boron is determined by using either a fusion–titration
    method or fused-inductively coupled plasma-optical emission spectroscopy (ICP-OES).
    Free boron is determined by acid digestion-ICP-OES. Boron oxide is determined
    by water-dissolution-ICP-OES. Total carbon is determined by high frequency induction
    furnace-infrared absorption spectroscopy. Free carbon is determined by wet oxidation-coulomb
    method. Oxygen is measured by using inert gas fusion-IR absorption spectroscopy.
    Nitrogen is measured by thermal conductivity. Trace metal impurities is determined
    by fused-ICP-OES，DCArc-OES or ETV-ICP-OES.
