abstract:
- language: en
  script: Latn
  content: ISO 21010:2017 specifies gas/material compatibility requirements (such
    as chemical resistance) for cryogenic vessels, but it does not cover mechanical
    properties (e.g. for low-temperature applications). ISO 21010:2017 provides general
    guidance for compatibility with gases and detailed compatibility requirements
    for oxygen and oxygen-enriched atmospheres. This document also defines the testing
    methods for establishing oxygen compatibility of materials (metallic and non-metallic)
    to be used for cryogenic vessels and associated equipment. ISO 21010:2017 focuses
    on materials that are normally with or could be in contact with cryogenic fluids.
