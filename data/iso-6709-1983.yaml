abstract:
- language: en
  script: Latn
  content: Describes a variable-length format for the representation of latitude,
    longitude and altitude for use in data interchange. Allows the use of normal sexagesimal
    notations involving degrees, minutes and seconds as well as various combinations
    of sexagesimal and decimal notations. Uses numeric characters 0 to 9, graphic
