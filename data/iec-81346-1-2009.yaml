abstract:
- language: en
  script: Latn
  content: '  [if gte mso 9]><xml> <o:DocumentProperties> <o:Author>ig</o:Author> <o:LastAuthor>ig</o:LastAuthor> <o:Revision>2</o:Revision> <o:TotalTime>5</o:TotalTime> <o:Created>2009-08-03T09:31:00Z</o:Created> <o:LastSaved>2009-08-03T09:31:00Z</o:LastSaved> <o:Pages>1</o:Pages> <o:Words>215</o:Words> <o:Characters>1226</o:Characters> <o:Company>IEC</o:Company> <o:Lines>10</o:Lines> <o:Paragraphs>2</o:Paragraphs> <o:CharactersWithSpaces>1439</o:CharactersWithSpaces> <o:Version>10.6845</o:Version> </o:DocumentProperties> </xml><![endif] [if gte mso 9]><xml> <w:WordDocument> <w:SpellingState>Clean</w:SpellingState> <w:GrammarState>Clean</w:GrammarState> <w:BrowserLevel>MicrosoftInternetExplorer4</w:BrowserLevel> </w:WordDocument> </xml><![endif] [if gte mso 10]> <style> /* Style Definitions */ table.MsoNormalTable {mso-style-name:"Table Normal"; mso-tstyle-rowband-size:0; mso-tstyle-colband-size:0; mso-style-noshow:yes; mso-style-parent:""; mso-padding-alt:0cm 5.4pt 0cm 5.4pt; mso-para-margin:0cm; mso-para-margin-bottom:.0001pt; mso-pagination:widow-orphan; font-size:10.0pt; font-family:"Times New Roman";} </style> <![endif] [if gte mso 9]><xml> <o:shapedefaults v:ext="edit" spidmax="3074"/> </xml><![endif] [if gte mso 9]><xml> <o:shapelayout v:ext="edit"> <o:idmap v:ext="edit" data="1"/> </o:shapelayout></xml><![endif] IEC 81346-1:2009, published jointly by IEC and ISO, establishes general principles for the structuring of systems including structuring of the information about systems. Based on these principles, rules and guidance are given for the formulation of unambiguous reference designations for objects in any system. The reference designation identifies objects for the purpose of creation and retrieval of information about an object, and where realized about its corresponding component. This edition includes the following substantial changes with respect to the previous one:- a new introductory clause providing a description and explanation to the concepts used elsewhere in the publication;- a more comprehensive description of the structuring principles and rules for structuring are provided;- ''other aspects'' are introduced, and the prefix sign # is assigned to these aspects;- the concept of reference designation group has been deleted;- the specific term ''transition'' has been avoided and been replaced by an improved textual description of this phenomenon in annex D;- a new clause about labelling is introduced;- the old annexes have been removed with the exception of the annex showing an example of the application of reference designations within a system;- a new annex explaining the manipulation of objects is introduced;- 4 new annexes are introduced as rearrangement of detailed examples or explanatory information.'
