abstract:
- language: en
  script: Latn
  content: ISO 1211|IDF 1:2010 specifies the reference method for the determination
    of the fat content of milk of good physicochemical quality. The method is applicable
    to raw cow milk, raw sheep milk, raw goat milk, reduced fat milk, skimmed milk,
    chemically preserved milk, and processed liquid milk. It is not applicable when
    greater accuracy is required for skimmed milk, e.g. to establish the operating
    efficiency of cream separators.
