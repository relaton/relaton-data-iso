abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1232:2018-11 specifies the application module for Design
    material aspects. The following are within the scope of ISO/TS 10303-1232:2018-11:
    identification of the material of a product; identification of the material of
    a shape of a product; identification of the material of an element of a shape
    of a product; identification of product properties derived from the material composition
    of a product; representation of the value of a material property as specified
    or measured in a particular environment.'
