abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods of rollators being
    used as assistive products for walking with wheels, manipulated by both arms,
    without accessories, unless specified in the particular test procedure. This document
    also gives requirements relating to safety, ergonomics, performance and information
    supplied by the manufacturer including marking and labelling. The requirements
    and tests are based on every-day use of rollators as assistive products for walking
    for a maximum user mass as specified by the manufacturer. This document includes
    rollators specified for a user mass of no less than 35 kg. This document is not
    applicable to rollators with horizontal forearm supports, classified as walking
    tables, for which ISO 11199-3 is applicable.
