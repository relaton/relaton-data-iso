abstract:
- language: en
  script: Latn
  content: 'This document specifies a generic test method to determine the abrasion
    wear characteristics of hardmetals. The test is appropriate for use in situations
    where test laboratories have a need to simulate abrasive damage. The procedure
    includes information which enables the test to be used in a variety of different
    conditions: a) with counterface wheels of different stiffness (for example steel
    and rubber); b) wet and dry; c) different abrasive sizes; d) different chemical
    environments.'
