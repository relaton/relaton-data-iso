abstract:
- language: en
  script: Latn
  content: ISO 17398:2004 specifies requirements for a performance-related classification
    system for safety signs according to expected service environment, principal materials,
    photometric properties, means of illumination, fixing methods and surface. Performance
    criteria and test methods are specified in ISO 17398:2004 so that properties related
    to durability and expected service life can be characterized and specified at
    the time of the product's delivery to the purchaser. ISO 17398:2004 does not cover
    electrical power supplies, their components or electrically powered elements.
    It also does not cover properties of illuminating components, but the photometric
    properties for the particular types of safety signs are covered.
