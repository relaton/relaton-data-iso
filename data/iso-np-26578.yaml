abstract:
- language: en
  script: Latn
  content: This document provides a framework for biomass feedstock logistics, covering
    the processes from collection at the source to delivery at the processing plant.
    The document applies to solid, semi-solid, and liquid biomass feedstocks, including
    but not limited to agricultural residues, forestry waste, industrial organic by-products,
    and segregated biodegradable municipal waste. The standard does not cover cultivation
    or production, processing at the plant, end-use applications, waste disposal,
    and post-delivery operations.
