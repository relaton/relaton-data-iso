abstract:
- language: en
  script: Latn
  content: 'ISO 12647-2:2004 specifies a number of process parameters and their values
    to be applied when preparing colour separations for four-colour offset printing
    or when producing four-colour prints by one of the following methods: heat-set
    web, sheet-fed or continuous forms process printing, or proofing for one of these
    processes; or offset proofing for half-tone gravure. The parameters and values
    are chosen in view of the complete process covering the process stages colour
    separation, film setting, making of the printing forme, proof production, production
    printing and surface finishing. ISO 12647-2:2004 is directly applicable to proofing
    and printing processes that use colour separation films as input;directly applicable
    to proofing and printing from printing formes produced by filmless methods as
    long as direct analogies to film production systems are maintained;applicable
    to proofing and printing with more than four process colours as long as direct
    analogies to four-colour printing are maintained, such as for data and screening,
    for print substrates and printing parameters;applicable by analogy to line screens
    and non-periodic screens.'
