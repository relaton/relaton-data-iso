abstract:
- language: en
  script: Latn
  content: This document specifies quality-related aspects of terminology database
    maintenance. It provides a list of criteria to describe, compare and evaluate
    the design, usability and content of terminological data collections, with emphasis
    on data quality evaluation (completeness, consistency, reliability, relevance,
    accuracy, correctness). This document provides guidance for terminology managers
    responsible for the maintenance of termbases as well as for external experts that
    are assigned to evaluate the data quality of terminology resources and the usability
    of termbase applications. It outlines principles for assuring data quality and
    evaluating terminological data collections for purposes of continuous improvement.
    The application/applicability of this standard depends on/is influenced by the
    type of terminology management (monolingual vs. multilingual), the organizational
    and IT environment as well as the intended user group involved in elaborating
    the terminological entries and using the termbase application. It goes beyond
    the scope of this document to discuss the detailed use of corpora and term extraction
    tools.
