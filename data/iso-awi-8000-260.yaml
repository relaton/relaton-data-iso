abstract:
- language: en
  script: Latn
  content: 'This document specifies the framework for sensor data lifecycle management
    (SDLM) and its stage-specific requirements that reflect the unique characteristics
    of sensor data used in AI applications and monitoring and diagnostics environments.
    The following are within the scope of this document: — characteristics of sensor
    data and their lifecycle management — application architecture for sensor data
    life cycle management — sensor data life cycle management framework — requirements
    for each stage in the framework — case examples of stage-specific sensor data
    life cycle management in monitoring and diagnostics — comparison with existing
    data lifecycle management The following are outside the scope of this document:
    — analogue data that are captured by sensors — signal processing that converts
    or modifies analogue data to create digital data'
