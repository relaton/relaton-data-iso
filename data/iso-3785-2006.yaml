abstract:
- language: en
  script: Latn
  content: ISO 3785:2006 specifies a method for designating test specimen axes in
    relation to product texture by means of an X-Y-Z orthogonal coordinate system.
    The system applies equally to unnotched and notched (or precracked) test specimens.
    The method is intended only for metallic materials with uniform texture that can
    be unambiguously determined.
