abstract:
- language: en
  script: Latn
  content: This International Standard specifies the manufacturing characteristics,
    the shapes, the dimensions, the tolerances, the quality requirements and the inspection
    methods for quality control and delivery conditions, the measurement and the marking
    of solid wood paving blocks. NOTE 1 The classification of raw parquet blocks according
    to specific characteristics and wood defects, as well as the possible defects,
    are specified, for the different species of wood, in the relevant International
    Standards referring to the classification of each wood species or of each group
    of species. This International Standard specifies the quality requirements of
    solid wood paving blocks made of hardwood and softwood species. This International
    Standard applies to solid wood paving blocks intended for use in indoor and outdoor
    spaces. NOTE 2 Paving blocks made of Fagus sylvatica wood are intended for use
    only in indoor spaces
