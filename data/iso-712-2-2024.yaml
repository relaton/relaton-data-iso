abstract:
- language: en
  script: Latn
  content: This document specifies an automatic method for the reference method (see
    ISO 712-1) for the determination of moisture content of cereals and cereal products
    using an automatic drying oven. This document is applicable to wheat, rice (paddy,
    husked and milled), barley, millet (Panicum miliaceum), rye, oats, triticale,
    sorghum in the form of grains, milled grains, semolina and flour. The method does
    not apply to maize and pulses. NOTE            For moisture content determination
    in maize, see ISO 6540, and for pulses, see ISO 24557.
