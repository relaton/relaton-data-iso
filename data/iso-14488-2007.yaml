abstract:
- language: en
  script: Latn
  content: ISO 14488:2007 specifies methods for obtaining a test sample from a defined
    bulk of particulate material (powder, paste, suspension or dust) that can be considered
    to be representative of that bulk with a defined confidence level. It is particularly
    relevant to the measurement of particle size, size distribution and surface area.
