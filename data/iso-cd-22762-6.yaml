abstract:
- language: en
  script: Latn
  content: This document specifies specifications and test methods for elastomeric
    seismic isolators used for buildings to guarantee high durability and high performance.
    It is applicable to elastomeric seismic isolators used to provide buildings with
    protection from earthquake damage. The isolators covered consist of alternate
    elastomeric layers and reinforcing steel plates. They are placed between a superstructure
    and its substructure to provide both flexibility for decoupling structural systems
    from ground motion, and damping capability to reduce displacement at the isolation
    interface and the transmission of energy from the ground into the structure at
    the isolation frequency.
