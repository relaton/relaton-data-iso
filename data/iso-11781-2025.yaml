abstract:
- language: en
  script: Latn
  content: This document specifies minimum requirements and minimum performance criteria
    for conducting a single-laboratory validation study for qualitative (binary) real-time
    polymerase chain reaction (PCR) methods applied to the detection of specific DNA
    sequences present in foods. The document is applicable to any single-laboratory
    validation of a qualitative real-time PCR method used for the detection of specific
    DNA sequences in food and food products (e.g. for the detection of genetically
    modified foodstuffs and for species determination, including species known to
    produce allergenic proteins). The document does not apply to single laboratory
    validation of qualitative microbiological real-time PCR methods. The document
    does not apply to the evaluation of applicability and practicability with respect
    to the specific scope of the PCR method.
