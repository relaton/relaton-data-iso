abstract:
- language: en
  script: Latn
  content: 'ISO 1641-2:2011 specifies the general dimensions and designation of the
    following milling cutters with Morse taper and having a tapped hole: - end mills,
    flat-ended or ball-nosed - standard series and long series; - slot drills - short
    series and standard series. Morse taper shanks are in accordance with ISO 296
    and ISO 5413.'
