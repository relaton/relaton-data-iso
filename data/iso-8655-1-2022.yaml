abstract:
- language: en
  script: Latn
  content: This document specifies general requirements for piston-operated volumetric
    apparatus (POVA). It is applicable to pipettes, burettes, dilutors, dispensers
    and manually operated precision laboratory syringes. It furthermore defines terms
    for the use of piston-operated volumetric apparatus and gives user recommendations.
    This document does not apply to medical products intended for use on humans, e.g.
    for medical syringes.
