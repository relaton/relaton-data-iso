abstract:
- language: en
  script: Latn
  content: 'ISO 15830-4:2005 specifies requirements for assembling and disassembling
    of the WorldSID 50th percentile side impact dummy, a standard anthropomorphic
    dummy for side impact testing of road vehicles. It is applicable to impact tests
    involving: passenger vehicles of categories M1 and goods vehicles of categories
    N1,impacts to the side of the vehicle structure, andimpact tests involving the
    use of an anthropometric dummy as a human surrogate for the purpose of evaluating
    compliance with vehicle safety standards.'
