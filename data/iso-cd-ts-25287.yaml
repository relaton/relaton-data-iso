abstract:
- language: en
  script: Latn
  content: This technical specification will review the existing IoT equipment which
    is applied on containers, evaluate its specifications and compatibility with the
    operational environment to define the terminology of “Smart Container”. This working
    item will also specify the technical requirements for IoT systems in smart containers,
    focusing on interoperability, security, and data privacy. Establishment of operations
    principles that accommodate the unique features of smart containers, ensuring
    safe and efficient transport will be also guiding the work of the experts during
    this working item.
