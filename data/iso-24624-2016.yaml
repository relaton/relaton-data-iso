abstract:
- language: en
  script: Latn
  content: ISO 24624:2016 specifies rules for representing transcriptions of audio-
    and video-recorded spoken interactions in XML documents based on the guidelines
    of the TEI. As a secondary objective, the document aims to relate transcribed
    data with standards for annotated corpora. It is applicable to transcription data
    for studies in sociolinguistics, conversation analysis, dialectology, corpus linguistics,
    corpus lexicography, language technology, qualitative social studies and other
    transcription data of recorded spoken language. It is not applicable to other
    forms of transcription, most importantly transcriptions of hand-written manuscripts.
    Annex A gives a fully encoded example and Annex B provides an element index and
    an attribute index.
