abstract:
- language: en
  script: Latn
  content: This document is intended to provide guidelines for preventive measures
    for fighting fires in rural and wildland areas, to protect life and property,
    thus helping to reduce social, economic and environmental damages and losses.
    This document is intended to be applied to rural and wildland areas subject to
    the occurrence of fires, as for instance public or private environmental preservation
    areas, areas destinated to agriculture and livestock, and tree plantations areas
    for industry.
