abstract:
- language: en
  script: Latn
  content: This document specifies requirements for rubber- or plastics-covered conveyor
    belting of textile construction for use in underground mines and disposed on flat
    or troughed idlers. It is not applicable to light conveyor belts as described
    in ISO 21183-1. This document does not include requirements for plastics covers.
    These are agreed upon by the manufacturer and purchaser, taking into account the
    type of plastics to be used. Related items that are not requirements of this document,
    but which it is recommended be agreed upon by the manufacturer and purchaser,
    are included in Annex A. Details recommended to be supplied by the purchaser of
    belting with an enquiry are given in Annex B. The ability of a belt to run straight
    cannot be assessed until the belt is installed. Requirements for this are, therefore,
    outside the scope of this document; nevertheless, recommendations for lateral
    drift are given in Annex C. Attention is drawn to local regulations for safety
    which might be in place where the belts are to be used.
