abstract:
- language: en
  script: Latn
  content: This test method (biaxial bulge test method) is a biaxial tensile test
    method for sheet metals. This document specifies the test method for measuring
    the biaxial true stress-plastic strain curves, forming limit strains, and forming
    limit stresses of a sheet metal by applying axial force and internal pressure
    to a cylindrical test piece (hereinafter referred to as test piece) made by bending
    and welding the sheet metal, and by generating the biaxial stresses in the axial
    and circumferential directions at the centre of the test piece.
