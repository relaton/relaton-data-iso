abstract:
- language: en
  script: Latn
  content: 'IEC 60601-1-11:2015 applies to the basic safety and essential performance
    of medical electrical equipment and medical electrical systems for use in the
    home healthcare environment. It applies regardless of whether the medical electrical
    equipment or medical electrical system is intended for use by a lay operator or
    by trained healthcare personnel. The home healthcare environment includes: - the
    dwelling place in which a patient lives; - other places where patients are present
    both indoors and outdoors, excluding professional healthcare facility environments
    where operators with medical training are continually available when patients
    are present. This second edition cancels and replaces the first edition of IEC
    60601-1-11, published in 2010, and constitutes a technical revision. The most
    significant changes with respect to the previous edition include the following
    modifications: - correction of test method for relative humidity control at temperatures
    above 35 °C; - redrafting of subclauses that altered instead of adding to the
    general standard or other collateral standards; and - harmonizing with the changes
    to the amendments to the general standard and other collateral standards.'
