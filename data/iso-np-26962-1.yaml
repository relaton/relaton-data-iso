abstract:
- language: en
  script: Latn
  content: This part of the document includes normative references, terms, and definitions for the ISO 21678 series of documents. This document also establishes categories of mobility devices, standard principles for interaction between air carrier agents and persons with reduced mobility and required staff training to ensure the safe and effective accomplishment of the ISO 21678 series objectives and to ensure proper treatment of both passenger and mobility device.
