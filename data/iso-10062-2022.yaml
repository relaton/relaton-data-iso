abstract:
- language: en
  script: Latn
  content: This document specifies tests which are intended to determine the influence
    of one or more flowing polluting gas(es) at volume fractions less than or equal
    to 10−6 on test samples and/or articles of metals and alloys with or without corrosion
    protection under determined conditions of temperature and relative humidity. This
    document is applicable to a) metals and their alloys, b) metallic coatings (anodic
    and cathodic), c) metals with conversion coatings, d) metals with anodic oxide
    coatings, and e) metals with organic coatings.
