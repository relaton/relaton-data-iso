abstract:
- language: en
  script: Latn
  content: 'This document specifies performance, requirements, methods of test and
    marking requirements for the following equipment for use in automatic fire protection
    systems: —     wet alarm valves; —     retard devices; —     water motor alarms;
    —     dry pipe valves; —     accelerators; —     deluge valves; —     preaction
    valves; —     check valves. Performance and test requirements for trim valves
    for alarm valves are not covered by this document. The requirements for pressure
    reducing valves and fire pump relief valves are provided by ISO 6182-16 and ISO 6182-17.'
