abstract:
- language: en
  script: Latn
  content: This document specifies a method for the chemical analysis of metallic
    impurities present in magnesium oxide (MgO) powders used as raw materials for
    fine ceramics. The method covers the determination of aluminium (Al), calcium
    (Ca), chromium (Cr), iron (Fe), manganese (Mn), nickel (Ni), strontium (Sr), titanium
    (Ti), and vanadium (V) by inductively coupled plasma optical emission spectrometry
    (ICP-OES) after acid decomposition of the sample. This standard is applicable
    to magnesium oxide powders used for advanced ceramic components, particularly
    those employed in plasma processing environments for semiconductors and electronic
    devices, where trace metallic impurities critically affect performance, reliability,
    and lifetime of the products.
