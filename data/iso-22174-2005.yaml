abstract:
- language: en
  script: Latn
  content: ISO 22174:2004 gives the general requirements for the in vitro amplification
    of nucleic acid sequences (DNA or RNA). It is applicable to the testing of foodstuffs
    and isolates obtained from foodstuffs for food-borne pathogens using the polymerase
    chain reaction (PCR) The minimum requirements laid down in ISO 22174:2004 are
    intended to ensure that comparable and reproducible results are obtained in different
    laboratories. ISO 22174:2004 has been established for food-borne pathogens in
    or isolated from food and feed matrices, but is also applicable to other matrices
    (e.g. environmental samples) and for the detection of non-pathogenic microorganisms.
