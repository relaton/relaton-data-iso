abstract:
- language: en
  script: Latn
  content: This document describes a method for systematically collecting material
    loss from fabrics under laundering test conditions to achieve comparable and accurate
    results. There is no direct correlation to material loss during domestic and commercial
    laundering. The method is designed to assess material loss of all types. NOTE     
    In this document, any collected debris is assumed to be fibre fragments. For the
    identification of the nature/composition of this debris, the method described
    in ISO 4484-2 can be used.
