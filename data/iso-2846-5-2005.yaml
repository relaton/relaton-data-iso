abstract:
- language: en
  script: Latn
  content: ISO 2846-5:2005 specifies the colour and transparency to be produced by
    each ink in a process colour ink set (including extender) intended for four-colour
    flexographic printing, when printed under specified flexographic printing conditions.
    It also describes the conformance test method. ISO 2846-5:2005 does not specify
    pigments (or spectral reflectance), in order not to preclude developments that
    may enable different pigment combinations to be used advantageously, while still
    achieving the colorimetric requirements specified in this part of ISO 2846.
