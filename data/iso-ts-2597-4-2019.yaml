abstract:
- language: en
  script: Latn
  content: This document specifies a potentiometric titration method for the determination
    of total iron content of iron ores, using potassium dichromate as titrant after
    reduction of the iron(III) by tin(II) chloride and titanium(III) chloride. The
    excess reductant is then oxidized by potassium dichromate solution. This method
    is applicable to total iron contents between a mass fraction of 29,04 % and a
    mass fraction of 72,02 % in natural iron ores and iron ore concentrates and agglomerates
    including sinter products.
