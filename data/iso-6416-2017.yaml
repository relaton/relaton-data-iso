abstract:
- language: en
  script: Latn
  content: ISO 6416 describes the establishment and operation of an ultrasonic (transit-time)
    gauging station for the continuous measurement of discharge in a river, an open
    channel or a closed conduit. It also describes the basic principles on which the
    method is based, the operation and performance of associated instrumentation and
    procedures for commissioning. It is limited to the "transit time of ultrasonic
    pulses" technique, and is not applicable to systems that make use of the "Doppler
    shift" or "correlation" or "level-to-flow" techniques. ISO 6416 is not applicable
    to measurement in rivers with ice. NOTE ISO 6416 focuses on open channel flow
    measurement. IEC 60041 covers the use of the technique for full pipe flow measurement.
