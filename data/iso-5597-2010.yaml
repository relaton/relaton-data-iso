abstract:
- language: en
  script: Latn
  content: 'ISO 5597:2010 establishes the preferred range of nominal dimensions and
    associated tolerances for a series of hydraulic cylinder rod and piston seal housings
    for reciprocating applications in the following range of dimensions: cylinders
    16 mm to 500 mm and rods 6 mm to 360 mm. An additional range of seal housings
    is detailed in ISO 5597:2010 to meet the reduced envelope requirements of the
    160 bar (16 MPa) compact series of ISO 6020-2; these smaller section seals require
    stricter piston rod and cylinder bore tolerances. The range of dimensions are
    as follows: cylinders 25 mm to 200 mm and rods 12 mm to 140 mm. ISO 5597:2010
    does not give details of seal design, since the manner of construction of seals
    varies with each manufacturer. The design and material of the seal and any incorporated
    anti-extrusion component are determined by conditions such as temperature and
    pressure. ISO 5597:2010 applies only to the dimensional criteria of products manufactured
    in conformity with ISO 5597:2010; it does not apply to their functional characteristics.'
