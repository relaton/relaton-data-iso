abstract:
- language: en
  script: Latn
  content: 'This document specifies the application module for Requirement management.
    The following are within the scope of this document: representation of the data
    that identify a requirement and its versions; the assignment of a requirement
    to a product or other item; the identification of the source of a requirement;
    relationships between requirements; characterization of a version of a requirement,
    suitable for one or more application domains and one or more life-cycle stages;
    identification of a universe of discourse suitable for the description of requirements;
    relationships between requirements that are expressed at the view definition level;
    assignment of date and time properties to requirements, requirement definitions,
    requirement versions, relationships between requirement versions, sources, relationships
    between requirement collections, requirement tracing relationships, and requirement
    assignments; assignment of approval data to requirements, requirement definitions,
    requirement versions, relationships between requirement versions, sources, relationships
    between requirement collections, requirement tracing relationships, and requirement
    assignments; assignment of identification and alias identification data to requirements,
    requirement definitions, requirement versions, relationships between requirement
    versions, sources, relationships between requirement collections, requirement
    tracing relationships, and requirement assignments; assignment of person and organization
    data to requirements, requirement definitions, requirement versions, relationships
    between requirement versions, sources, relationships between requirement collections,
    requirement tracing relationships, and requirement assignments; assignment of
    contract data to requirements, requirement definitions, requirement versions,
    relationships between requirement versions, sources, relationships between requirement
    collections, requirement tracing relationships, and requirement assignments; assignment
    of security classification data to requirements, requirement definitions, requirement
    versions, relationships between requirement versions, sources, relationships between
    requirement collections, requirement tracing relationships, and requirement assignments;
    assignment of language data to requirements, requirement definitions, requirement
    versions, relationships between requirement versions, sources, relationships between
    requirement collections, requirement tracing relationships, and requirement assignments;
    representation proxy.'
