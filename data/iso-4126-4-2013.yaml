abstract:
- language: en
  script: Latn
  content: ISO 4126-4:2013 specifies general requirements for pilot operated safety
    valves, irrespective of the fluid for which they are designed. In all cases, the
    operation is carried out by the fluid in the system to be protected. It is applicable
    to pilot operated safety valves having a valve flow diameter of 4 mm and above
    which are for use at set pressures of 0,1 bar gauge and above. No limitation is
    placed on temperature. ISO 4126-4:2013 is a product standard and it is not applicable
    to applications of pilot operated safety valves.
