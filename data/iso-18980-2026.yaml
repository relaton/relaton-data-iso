abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and provides recommendations for campsite facilities and services, covering the following: campsite layout and design; sanitation and other important facilities; sustainability; inclusivity and accessibility; safety and security. This document aims to ensure that campsite facilities, amenities, services and management practices meet basic safety and environmental requirements, while providing a good quality camping experience for guests. This document applies to campsites in natural or developed areas that are designed and managed to provide pitches for guests using their own camping units (such as tents, leisure accommodation vehicles including caravans, motor caravans or camper vans) and/or static or semi-permanent accommodation units (such as camping houses, mobile homes, rental caravans, safari tents or similar) supplied by the campsite operator. This document applies to campsite owners, operators and regulators.'
