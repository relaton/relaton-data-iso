abstract:
- language: en
  script: Latn
  content: ISO/TR 17671-7:2004 may be used for the electron beam welding (process
    No. 51 in accordance with ISO 4063) of weldable metallic materials in accordance
    with ISO/TR 15608. It does not contain data on permissible stresses on weld seams
    or on the testing and evaluation of weld seams. Such data can either be seen from
    the relevant user standards or should be separately agreed upon between the contracting
    parties. A requirement for the application of ISO/TR 17671-7:2004 is that the
    recommendations be used by appropriately trained and experienced personnel.
