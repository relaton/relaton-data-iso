abstract:
- language: en
  script: Latn
  content: This document specifies rules for indicating the tolerance for surface
    form deviation, in the ISO 10110 series, which standardizes drawing indications
    for optical elements and systems. NOTE            The terminology of interferometry
    employing the unit “fringe spacings” is widely used for the specification of tolerances.
    However, the usage of non-interferometric methods for testing of optical parts
    has recently become more important. Therefore, unlike in the earlier versions
    of this document, nanometres are now the preferred and standard unit to express
    surface form deviations. The usage of fringe spacings is still permitted, provided
    that the base wavelength is explicitly stated. This document applies to surfaces
    of plano, spherical, aspheric, cylindric, and toric form as well as to surfaces
    of other non-spherical shape such as generally described surfaces. It also applies
    to the substrates of diffractive surfaces; for transmitted or reflected wavefront
    specifications see ISO 10110-16 and ISO 10110-14.
