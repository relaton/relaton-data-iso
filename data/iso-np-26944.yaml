abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for the safe, sustainable, and standardized use of urban reclaimed water for vehicle washing. It specifies requirements for water quality, supplemental treatment by water suppliers, onsite treatment and onsite reuse of vehicle washing wastewater, operation management, monitoring, and emergency response. This document is applicable to: — The use of centralized urban reclaimed water for washing various vehicles in urban areas, including passenger cars, commercial vehicles, public transport buses, trains, subways, urban rail transit, aircraft, and other motorized and non‑motorized vehicles. — The supplemental treatment, terminal disinfection, and quality control of reclaimed water at vehicle washing sites. — The design, construction, operation, and maintenance of onsite vehicle washing wastewater reuse systems. This document considers graded requirements based on personnel exposure risk and washing methods, and applies to both external centralized reclaimed water supply and onsite wastewater recycling systems. This document is not applicable to Industrial vehicle washing involving hazardous pollutants that require specialized treatment.'
