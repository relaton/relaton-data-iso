abstract:
- language: en
  script: Latn
  content: ISO 2409:2007 describes a test method for assessing the resistance of paint
    coatings to separation from substrates when a right-angle lattice pattern is cut
    into the coating, penetrating through to the substrate. The property measured
    by this empirical test procedure depends, among other factors, on the adhesion
    of the coating to either the preceding coat or the substrate. This procedure is
    not to be regarded, however, as a means of measuring adhesion. The method described
    may be used either as a pass/fail test or, where circumstances are appropriate,
    as a six-step classification test. When applied to a multi-coat system, assessment
    of the resistance to separation of individual layers of the coating from each
    other may be made. The test can be carried out on finished objects and/or on specially
    prepared test specimens. The method is not suitable for coatings of total thickness
    greater than 250 micrometres or for textured coatings.
