abstract:
- language: en
  script: Latn
  content: Carbon black for the rubber industry is generally pelletized to reduce
    dust and to improve handling and incorporation into polymers. Variations in pellet
    size distribution can affect dispersion in polymers, bulk handling, and conveying
    properties. ISO 8511:2011 specifies a method for the determination of the pellet
    size distribution of carbon black.
