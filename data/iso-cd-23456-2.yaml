abstract:
- language: en
  script: Latn
  content: This document describes the design requirements and recommendations for
    dynamic signs from the perspectives of visibility, safety, and accessibility,
    based on ISO 23456-1. The design requirements and recommendations includes “How
    to Design,” “How to Display Moving Elements,” and “Where to Place” dynamic signs.
    “How to Design” describes how to design a sign that ensures visibility. It also
    describes the legible display design requirements for people with special requirements
    such as low vision as well as the elderly. “How to Display Moving Elements” describes
    the requirements for ensuring visibility and image-related safety, including VIMS
    and photosensitive seizures. “Where to Place” describes the placement requirements
    for ensuring visibility and enabling users to safely move around the facility
    while looking at the signs. The sign placement requirements for people who have
    difficulty moving around the facility, including wheelchair users and people with
    low vision, are also described. This standard applies to dynamic sign designers
    and layout planners. This document applies to dynamic signs for pedestrians, not
    persons in vehicles. This document does not cover emergency signs for escape routes.
