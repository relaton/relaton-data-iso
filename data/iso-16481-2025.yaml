abstract:
- language: en
  script: Latn
  content: 'This document aims at achieving sustainability goals of the local community.
    It applies to the digital governance part of the mobility system of a city engaged
    in sustainability. This document applies to the digital governance part of the
    mobility system of a city committed to sustainability. It aims at achieving sustainability
    goals of the local community. It targets urban mobility and its connections with
    intercity and other long-distance transport solutions. It applies to the mobility
    of people and goods. An urban mobility system is a system of transport systems
    which: —     contributes to the dimensioning and governance of mobility as a whole;
    —     contributes to transport solutions: orchestrated, on demand, shared or not;
    —     provides mobility services.'
