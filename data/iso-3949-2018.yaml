abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for three types of textile-reinforced
    thermoplastics hose and hose assembly of nominal size from 3,2 to 25. Each type
    is divided into two classes dependent on electrical conductivity requirements.
    They are suitable for use with: — oil-based hydraulic fluids HH, HL, HM, HR and
    HV as defined in ISO 6743‑4 at temperatures ranging from −40 °C to +93 °C; — water-based
    fluids HFC, HFAE, HFAS and HFB as defined in ISO 6743‑4 at temperatures ranging
    from 0 °C to +60 °C — water at temperatures ranging from 0 °C to +60 °C. This
    document does not include requirements for end fittings. It is limited to the
    performance of hoses and hose assemblies. NOTE It is the responsibility of the
    user, in consultation with the hose manufacturer, to establish the compatibility
    of the hose with the fluid to be used.'
