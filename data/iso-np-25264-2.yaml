abstract:
- language: en
  script: Latn
  content: 'This document is part of a series standard and defines the data categories,
    data flow, platform and function of photovoltaic power supply management system
    for highway mobility services. The following are within the scope of this document:
    a) General data categories and data categories in typical service scenarios for
    photovoltaic power supply applications; b) Data flow process in providing photovoltaic
    power supply management services; c) Functions of the photovoltaic power supply
    management and service platform for providing photovoltaic power supply services.'
