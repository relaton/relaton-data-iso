abstract:
- language: en
  script: Latn
  content: 'ISO 16732-1:2012 provides the conceptual basis for fire risk assessment
    by stating the principles underlying the quantification and interpretation of
    fire-related risk. These fire risk principles apply to all fire-related phenomena
    and all end-use configurations, which means these principles can be applied to
    all types of fire scenarios. The principles and concepts in ISO 16732-1:2012 can
    be applied to any fire safety objectives, including the five typical objectives
    listed as examples in Clause 1 of ISO 23932:2009: safety of life conservation
    of property continuity of business and safety operations protection of the environment
    preservation of heritage'
