abstract:
- language: en
  script: Latn
  content: ISO 4305:2014 specifies the conditions to be taken into consideration when
    verifying the stability of a mobile crane by calculation, assuming that the crane
    is operating on a firm and level surface (up to 1 % gradient). It applies to mobile
    cranes as defined in ISO 4306-2, i.e. appliances mounted on wheels (tires) or
    crawlers, with or without outriggers with the exception of loader cranes.
