abstract:
- language: en
  script: Latn
  content: ISO 12917-1:2017 specifies manual methods for the calibration of nominally
    horizontal cylindrical tanks, installed at fixed locations. The methods in this
    document are applicable to insulated and non-insulated tanks, either when they
    are above-ground or underground. The methods are applicable to pressurized tanks
    and to both knuckle-dish-end and flat-end cylindrical tanks as well as elliptical
    and spherical head tanks. ISO 12917-1:2017 is applicable to tanks inclined from
    the horizontal, provided a correction is applied for the measured tilt. Although
    this document does not impose any limits on the maximum tank diameter and maximum
    tank tilt to which this document is applicable, the practical limits would be
    about 4 m in diameter and 10° in tilt.
