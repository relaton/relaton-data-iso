abstract:
- language: en
  script: Latn
  content: 'This document specifies characteristics for adhesives for floor coverings,
    which comprise: — resilient floor coverings (such as those manufactured from plastics,
    linoleum or rubber); — textile floor coverings. Adhesives for floor coverings
    are intended for use within a building according to the manufacturer''s specification.
    This document specifies requirements for establishing performance characteristics
    of adhesives for floor coverings with regard to their determination, evaluation
    and expression. This document comprises all kinds of adhesives for floor coverings
    irrespective of the chemical composition and the mechanism of setting. Products
    according to this document can be put on the market as liquids, pastes and film
    adhesives for floor coverings. The products can be one-component or multi-component.
    This document also defines a special kind of adhesives for floor coverings, which
    facilitate the easy removal of the floor covering after the utilization and where
    the need for a permanent bond is not always required. These types of floor covering
    adhesives are referred to as low peel strength, release bond adhesives. This document
    does not: — cover adhesives for bonding parquet to the subfloor, adhesives for
    bonding laminate floor coverings and adhesives for ceramic tiles; — make provisions
    for testing the bond strength of low peel strength, release bond adhesives for
    floor coverings; — take account of all influences which may occur in practice.'
