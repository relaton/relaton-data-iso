abstract:
- language: en
  script: Latn
  content: ISO 11296-1:2018 specifies the requirements and test methods for plastics
    piping systems intended to be used for the renovation of underground non-pressure
    drainage and sewerage networks, which are operated as gravity systems and subjected
    to a maximum surcharge pressure of 0,5 bar[1]. It is applicable to pipes and fittings,
    as manufactured, as well as to the installed lining system. It is not applicable
    to the existing pipeline or any non-structural sprayed coatings or annular filler.
    ISO 11296-1:2018 gives the general requirements common to all relevant renovation
    techniques. [1] 1 bar = 0,1 MPa = 0,1 N/mm2 = 105 N/m2.
