abstract:
- language: en
  script: Latn
  content: This project is proposed to develop specifications for FRP bars and grids
    for upgrading the performance of new and existing concrete members. The methodologies
    expressing the mechanical properties, long-term properties, durability and physical
    properties as characteristic values, appearance and dimensions, and sampling test
    will be specified in this proposed deliverable. FRP bars and grids covered by
    this standard shall meet the limits for mechanical, long-term, durability and
    physical properties described herein. FRP bars and grids in this standard are
    made of fibre and resin. Types of fibres are aramid fibre, basalt fibre, carbon
    fibre or E-glass fibre, and resins include epoxy, vinylester, and unsaturated
    polyester resins. This standard does not include FRP bars and grids made of more
    than one type of fibre. In this standard, FRP bars and grids are classified by
    the type of fibre, surface treatment, tensile strength, Young’s modulus, and alkali
    resistance.
