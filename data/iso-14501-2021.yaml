abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of aflatoxin M1
    content in milk and milk powder. The lowest level of validation is 0,08 µg/kg
    for whole milk powder, i.e. 0,008 µg/l for reconstituted liquid milk. The limit
    of detection (LOD) is 0,05 μg/kg for milk powder and 0,005 μg/kg for liquid milk.
    The limit of quantification (LOQ) is 0,1 μg/kg for milk powder and 0,01 μg/kg
    for liquid milk. The method is also applicable to low-fat milk, skimmed milk,
    low-fat milk powder and skimmed milk powder.
