abstract:
- language: en
  script: Latn
  content: ISO 6885:2016 specifies a method for the determination of the anisidine
    value in animal and vegetable fats and oils. This is a measure of the amount of
    aldehydes present (principally α, β-unsaturated aldehydes). Milk and milk products
    (or fat coming from milk and milk products) are excluded from the scope of this
    International Standard.
