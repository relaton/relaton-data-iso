abstract:
- language: en
  script: Latn
  content: This standard applies to the product obtained by extracting bioactive components
    in raw propolis with alcohol, alcohol derivative (Ethyl alcohol, Propylene glycol,
    Polyethylene glycol, Glycerol), oil and aqueous as solvents and the undesirable
    components are removed. Such propolis extract presents as propolis liquid, dry/soft
    or powder extract. This standard specifies the requirements of quality, analytical
    methods, storage and transportation condition and packing mark of it. This standard
    does not apply to mixture products in which propolis is added as an ingredient.
