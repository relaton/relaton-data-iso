abstract:
- language: en
  script: Latn
  content: 'This document establishes a general methodological framework that applies
    to the measurement and verification of CO2 emission reduction from solar energy
    utilization. This document specifies the following in the context of CO2 emission
    reduction of solar energy utilization: --generic terminology --basic concept of
    CO2 emission reduction --common methodology for determination of CO2 emission
    reduction --principles for reporting of results of CO2 emission reduction This
    document will be applicable to other specific documents in the field of measurement
    and verification of CO2 emission reduction from solar energy utilization at different
    levels such as organizations, projects and products. The development of the specific
    methodology for measurement and verification of CO2 emission reduction from solar
    energy utilization at different levels such as organizations, projects and products
    is not in the scope of this document.'
