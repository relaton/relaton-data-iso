abstract:
- language: en
  script: Latn
  content: ISO 12625-8:2010 specifies a basket-immersion test method for the determination
    of water-absorption time and water-absorption capacity of tissue paper and tissue
    products. It is expressly stated that the detection of impurities and contraries
    in tissue paper and tissue products be applied according to ISO 15755. For the
    determination of moisture content in tissue paper and tissue products, ISO 287
    is applicable.
