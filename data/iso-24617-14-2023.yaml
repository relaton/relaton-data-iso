abstract:
- language: en
  script: Latn
  content: 'This document extends ISO 24617-7:2020, which specifies ways of annotating
    spatial information in natural language such as English, by establishing a formal
    semantics for its abstract syntax. The task of the proposed semantics is of two
    kinds: a)       translation of annotation structures to semantic forms; b)      
    model-theoretic interpretation of semantic forms. Semantic forms are represented
    in a type-theoretic first-order logic. These semantic forms are then interpreted
    with respect to a model for part of the world to which an annotated language is
    referentially, or denotationally, anchored. NOTE            The basic framework
    and content of this document is based on Reference [1].'
