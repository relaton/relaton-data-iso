abstract:
- language: en
  script: Latn
  content: ISO/PAS 21195:2018 specifies technical requirements for systems designed
    to detect a person who has gone overboard from a passenger ship. This document
    addresses how a system is expected to perform in various environmental conditions
    and a wide variety of incident profiles. ISO/PAS 21195:2018 does not cover man
    overboard (MOB) detection systems that require the passengers or crew to wear
    or carry a device to trigger an MOB event.
