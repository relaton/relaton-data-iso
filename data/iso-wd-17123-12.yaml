abstract:
- language: en
  script: Latn
  content: This standard specifies field procedures to be adopted when evaluating
    the uncertainty in the centring of topographic and geodetic instruments, and their
    ancillary equipment, in any type of surveying measurement, including building
    and industrial measurements. These instruments include all those that have a plumb
    system (plumb bob, centring rod, optical or laser plummet) to set up on the desired
    ground point materialized by a survey mark, including theodolites, total stations
    or GNSS receivers. In the case of GNSS receivers, the procedures are applicable
    as long as the plumb is located on the tribrach and is interchangeable, so that
    a theodolite or total station can be mounted on it. The tests performed are primarily
    intended to be used as field verification of the suitability of a particular instrument
    for the specific and immediate task and to satisfy the requirements of other standards.
    They are not proposed as tests for acceptance or performance evaluations, which
    are more comprehensive in nature. These field procedures have been developed specifically
    for in situ applications without the need for special ancillary equipment.
