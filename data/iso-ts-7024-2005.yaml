abstract:
- language: en
  script: Latn
  content: 'ISO/TS 7024:2005 gives the recommended practice for installation of thermoplastic
    piping systems in the field of soil and waste discharge (low and high temperature)
    inside buildings (marked with "B"). ISO/TS 7024:2005 is applicable to thermoplastic
    pipes and fittings as specified in the associated standards ISO 3633 (PVC-U),
    ISO 7671 (PP), ISO 7682 (ABS), ISO 8770 (PE-HD), ISO 19220 (SAN+PVC) and ISO 7675
    (PVC-C), their joints and to joints with components of other plastic and non-plastic
    materials intended to be used for the following purposes: soil and waste discharge
    pipework for the conveyance of domestic waste waters (low and high temperature);ventilating
    pipework associated with 1);rainwater pipework within the building structure.
    If specified in the relevant associated standard, ISO/TS 7024:2004 also covers
    soil and waste discharge pipework fixed externally on to the building. It is not
    applicable to pipework that passes under the building without any connection from
    the discharge system.'
