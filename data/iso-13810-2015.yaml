abstract:
- language: en
  script: Latn
  content: ISO 13810:2015 establishes general requirements for industrial tourism
    offered by service providers intending to transmit knowledge of production, scientific
    and technical activities, both present and past, based on processes, know-how,
    products or services. The requirements in ISO 13810:2015 are applicable to all
    the services of industrial tourism (visits and additional offer), dealing with
    living industry, industrial heritage, or a combination of both, including the
    facilities and equipment related to such services, as well as their internal operation.
    Technical specifications regarding tools and equipment used in these services
    are excluded.
