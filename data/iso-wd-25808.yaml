abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for padel courts, in terms of
    structural safety and user safety. This includes the specification of relevant
    aspects regarding the manufacture, testing and inspection of the different elements
    that make up the court, such as the structure, the enclosure, the playing surface,
    the playing net and lighting, among others, as well as the court as a whole. This
    document is not applicable to the sports building or hall.
