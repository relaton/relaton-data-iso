abstract:
- language: en
  script: Latn
  content: 'This document specifies guidance for developing mdoc schema for developing
    a new mdoc data specification, which will be developed as a part of ISO/IEC 7367
    series of standards but not limited to. A definition of mdoc schema includes:
    — Data format in terms of doctype, namespaces and data elements described in CDDL
    specified in RFC 8610 — Semantics of those data elements under each namespace
    — Access condition, usage of mdoc data in terms of protocols — Specific technical
    requirements of mdoc schema specification that can be unambiguously verified,
    e.g., Registration Authority according to ISO/IEC 23220-7 — Pointer to respective
    authority responsible for s specific mdoc, who owns this doctype This document
    specifies — How to apply ISO/IEC 23220-2 namespace and data elements — How to
    group attributes (single data element vs data elements with multiple attributes)
    — How to design namespaces — Life-cycle of mdoc — Certificate profile and crypto
    suites — Guidance for registration structure (see Annex B in ISO/IEC 23220-7)'
