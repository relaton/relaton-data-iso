abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the density of coating
    powders by liquid displacement in a measuring cylinder. The method is based on
    a determination of the mass and the volume of a test portion. It can be used for
    all types of coating powders. NOTE      If the powder does not swell in contact
    with the displacement liquid used and if the displacement liquid replaces the
    air between the powder particles, it can then be used and compared with the method
    described in ISO 8130-3.
