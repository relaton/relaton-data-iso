abstract:
- language: en
  script: Latn
  content: This document specifies a method for testing the bioaccessibility of substances
    from contaminated soil and soil-like materials. The method is not applicable for
    volatile contaminants. Furthermore, the method is only applicable if suitable
    analytical methods for extraction and detection of substances and/or elements
    from complex digestion assays are available. NOTE          During the in vivo
    validation with minipigs, the PAHs naphthalene, acenaphthylene, acenaphthene and
    fluorene were not evaluated due to their volatility. However, the results of the
    overall recovery indicate if volatilisation has occurred during the test.
