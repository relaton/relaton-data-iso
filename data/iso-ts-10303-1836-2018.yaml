abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1836:2018-11 specifies the application module for Vertex
    colours for tessellated geometry. The following are within the scope of ISO/TS
    10303-1836:2018-11: association of colour information with vertices of a Tessellated_face;
    association of colour information with vertices of a Tessellated_surface_set;
    association of colour information with vertices of a Tessellated_shell; association
    of colour information with vertices of a Tessellated_solid; specification of colours
    using integer triples to represent RGB colours or integer quadruples to represent
    RGBT colour values with transparency.'
