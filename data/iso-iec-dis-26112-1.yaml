abstract:
- language: en
  script: Latn
  content: The scope of JPEG XE is the creation of a standard for the representation
    of Events in an efficient way allowing interoperability between sensing, storage,
    and processing, targeting machine vision and other relevant applications. An Event
    is the message that signals the result of an observation at a precise point in
    time. It is typically triggered by a detected change in the physical world. Examples
    are contrast detection (CD) events from an event-based vision sensor or inertial
    measurement unit (IMU) readings.
