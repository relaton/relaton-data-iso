abstract:
- language: en
  script: Latn
  content: ISO 20957-5:2016 specifies safety requirements for stationary exercise
    bicycles and upper body crank training equipment in addition to the general safety
    requirements of ISO 20957‑1. ISO 20957-5:2016 is applicable to stationary training
    equipment type stationary exercise bicycles and upper body crank training equipment
    (type 5) as defined in Clause 3 within the classes S, H, I and A, B, C according
    to ISO 20957‑1. Any attachment provided with the stationary exercise bicycles
    and upper body crank training equipment for the performance of additional exercises
    are subject to the requirements of ISO 20957‑1. ISO 20957-5:2016 is not applicable
    to roller stands as they cannot be made safe in a reasonable way.
