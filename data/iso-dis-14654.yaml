abstract:
- language: en
  script: Latn
  content: This International Standard specifies requirements for fusion-bonded epoxy-coated
    post-fabricated and prefabricated steel bar, wire and welded fabric for the reinforcement
    of concrete. This International Standard permits the application of either flexible
    (type A) or nonflexible (type B) coatings. Steel reinforcing bar, wire and welded
    fabric coated with a nonflexible (type B) coating shall not be fabricated after
    coating.
