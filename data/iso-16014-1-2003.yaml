abstract:
- language: en
  script: Latn
  content: ISO 16014-1:2003 specifies a general method for determining the average
    molecular mass and the molecular mass distribution of polymers using size-exclusion
    chromatography (SEC). The average molecular mass and the molecular mass distribution
    are calculated from a calibration curve constructed using polymer standards. Therefore
    this method is classified as a relative method.
