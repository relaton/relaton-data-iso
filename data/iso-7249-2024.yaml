- language: en
  script: Latn
  content: This document specifies a test method for the determination of burning
    behaviour of textile fibres by oxygen index. This document is only used for the
    purpose of testing burning behaviour of textile fibres under conditions of this
    test, controlling quality of the products, or studying the factors causing the
    fire of some particular textile fibres. It is not used for assessing fire risk
