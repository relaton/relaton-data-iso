abstract:
- language: en
  script: Latn
  content: This International Standard specifies dimensions and performance requirements
    for ports and stud ends with parallel threads for pneumatic fluid power applications.
    It specifies reusable, positively retained seals for leak-free connections, for
    use at pressures from ? 0,09 MPa (? 0,9 bar 1)) up to 1,6 MPa (16 bar). Only this
    International Standard is applicable for threaded ports and stud ends specified
    in new designs in pneumatic fluid power applications. Ports and stud ends conforming
    to this International Standard are not intended to connect with ports and stud
    ends that conform to ISO 1179 or threads that conform to ISO 7-1.
