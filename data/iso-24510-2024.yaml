abstract:
- language: en
  script: Latn
  content: 'This document specifies the elements of drinking water and wastewater
    services of relevance and interest to users. It also provides guidance on how
    to identify users’ needs and expectations and how to assess whether these are
    being met. The following are within the scope of this document: —     the definition
    of a language common to the different stakeholders; —     the definition of key
    elements and characteristics of the service to users; —     the objectives for
    the service with respect to users’ needs and expectations; —     guidelines for
    satisfying users’ needs and expectations; —     assessment criteria for service
    to users; —     introduction to performance indicators; —     examples of performance
    indicators. The following are outside the scope of this document: —     methods
    of design and construction of drinking water and wastewater systems; —     the
    regulating management structure and methodology of operation and management of
    activities relating to drinking water and wastewater services, including contracting;
    —     topics relating to the system inside buildings.'
