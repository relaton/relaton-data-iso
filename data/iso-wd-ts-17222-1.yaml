abstract:
- language: en
  script: Latn
  content: 'This document specifies the permissible feedstocks for the production
    of pyrogenic biocarbon, the test methods to be used and properties for pyrogenic
    biocarbon. The specification of properties is divided in a first part including
    basic specifications independent of any application and in a second part. Whether
    the specification of one of these properties is required depends on the application
    for which the material is intended: e.g. carbon storage, application with carbon
    storage, short-term material uses and combined material and energetic use. The
    feedstock can originate from forestry and arboriculture, agriculture and horticulture
    as well as from aquaculture. These feedstocks may contain organic, including fossil,
    and/or inorganic impurities. This document does not apply to fossil carbons and
    peat. Substances from the hydrothermal conversion or torrefaction of biomass are
    also considered as within the scope of the ISO 17222-series. The solely energetic
    use of any pyrogenic biocarbon is not within the scope of ISO 17222-series. Note
    1: For energetic use of thermally treated biomass, e. g. by torrefaction or HTC,
    see ISO 17225-8. Note 2: Pyrogenic biocarbon are typically produced by thermal
    treatment (e.g. pyrolysis) in the absence of oxygen and at temperatures above
    400°C. Note 3: Torrefaction is the mild thermal pre-treatment of biomass at temperatures
    of typically 200-300°C.'
