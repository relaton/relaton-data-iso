abstract:
- language: en
  script: Latn
  content: This part of ISO 11024 describes general guidelines on the determination
    of the chromatographic profile of an essential oil by gas chromatography on a
    capillary column. The chromatographic profile is one of the specifications which
    enables assessment of the quality of an essential oil in the same way as the physico-chemical
    characteristics. It is determined at the time of finalizing the standard on the
    essential oil. It is not a determination of the true concentration of the components,
    it is only an evaluation of its relative proportions. NOTE Refer also to ISO 11024-21)
    for use of chromatographic profiles of samples of essential oils.
