abstract:
- language: en
  script: Latn
  content: This document, in conjunction with ISO 11297‑1, specifies requirements
    and test methods for close-fit lining systems intended to be used for the renovation
    of underground drainage and sewerage networks under pressure. It applies to pipes
    and fittings, as manufactured, as well as to the installed lining system. It is
    applicable to polyethylene (PE) pipes of either solid wall single layer or co-extruded
    layer construction, which is reduced in the factory or on site to provide a close-fitting
    independent or interactive pressure pipe liner, as well as associated fittings
    and joints for the construction of the lining system. It is not applicable to
    PE coated pipes having a peelable, contiguous, thermoplastic additional layer
    on the outside of the pipe. It is applicable to PE pipes, fittings and assemblies
    intended to be used at an operating temperature of 20 °C as the reference temperature.
    NOTE For applications operating at constant temperatures greater than 20 °C and
    up to 40 °C, see ISO 4427‑1:2007, Annex A.
