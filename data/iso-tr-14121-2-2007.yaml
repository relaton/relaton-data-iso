abstract:
- language: en
  script: Latn
  content: ISO/TR 14121-2:2007 gives practical guidance on the conducting of risk
    assessments for machinery in accordance with ISO 14121-1 and describes various
    methods and tools for each step in the process. It also provides practical guidance
    on risk reduction (in accordance with ISO 12100) for machinery, giving additional
    guidance on the selection of appropriate protective measures for achieving safety.
    The intended users of ISO/TR 14121-2:2007 are those involved in the integration
    of safety into the design, installation or modification of machinery (e.g. designers,
    technicians, safety specialists).
