abstract:
- language: en
  script: Latn
  content: ISO 2812-1:2007 specifies general methods for determining the resistance
    of an individual-layer or multi-layer system of coating materials to the effects
    of liquids, other than water, or paste-like products (included implicitly in test
    liquids mentioned in the text). These methods enable the testers to determine
    the effects of the test liquid on the coating and, if necessary, to assess the
    damage to the substrate.
