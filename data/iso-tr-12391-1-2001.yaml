abstract:
- language: en
  script: Latn
  content: This part of ISO/TR 12931 applies to seamless steel refillable cylinders
    of all sizes from 0,5 l up to and including 150 l water capacity produced of steel
    with tensile strength (Rm) greater than 1 100 MPa. It can also be applied to cylinders
    produced of steels used at lower tensile strengths. In particular, it provides
    the technical rationale and background to guide future alterations of existing
    ISO standards or for developing advanced design standards.
