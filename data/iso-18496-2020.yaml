abstract:
- language: en
  script: Latn
  content: This document specifies the classification of fluxes used for brazing metals
    and characterizes these fluxes on the basis of their properties and use, and gives
    technical delivery conditions and health and safety precautions. This document
    covers two classes of flux, FH and FL. Class FH is used for the brazing of heavy
    metals (steels, stainless steels, copper and its alloys, nickel and its alloys,
    precious metals, molybdenum and tungsten). Class FL is used for the brazing of
    aluminium and its alloys.
