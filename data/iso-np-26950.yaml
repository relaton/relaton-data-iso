abstract:
- language: en
  script: Latn
  content: This standard primarily specifies the parameter classification, parameter definitions, and specific assessment methods involved in monitoring and assessing the operational status and service performance of GNSS systems. This standard applies to the monitoring and assessment of GNSS system service performance, as well as system operational status analysis and fault diagnosis. It is particularly relevant for the operation and maintenance of GNSS systems, and for GNSS performance monitoring and assessment in key application sectors such as civil aviation, maritime, transportation, power, and communications. Considering the complexity and diversity of methods for monitoring individual performance parameters, this standard only specifies the general requirements for monitoring conditions and sampling of performance parameters, without prescribing specific monitoring methods for each parameter.
