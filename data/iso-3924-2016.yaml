abstract:
- language: en
  script: Latn
  content: ISO 3924:2016 specifies a method for the determination of the boiling range
    distribution of petroleum products. The method is applicable to petroleum products
    and fractions with a final boiling point of 538 °C or lower at atmospheric pressure
    as determined by this International Standard. This International Standard is not
    applicable to gasoline samples or gasoline components. The method is limited to
    products having a boiling range greater than 55 °C and having a vapour pressure
    sufficiently low to permit sampling at ambient temperature. The method has successfully
    been applied to samples containing fatty acid methyl esters (FAME) up to 10 %
    (V/V).
