abstract:
- language: en
  script: Latn
  content: This document specifies an operational profile which is common for large
    yachts and can therefore function as benchmark for various purposes. This International
    Standard describes an average operational profile split up into six different
    sailing conditions over the span of 12 months; - Harbour (shore power if available)
    - At anchor (stabilized / DP) - Loitering / manoeuvring - Cruising (range speed)
    - Cruising fast - Maximum speed This International Standard is intended for large
    yachts with a load line length equal or over 30 meters.
