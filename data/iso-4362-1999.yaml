abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method of steady-flow measurement
    in open channels using a trapezoidal broad-crested weir under modular and non-modular
    conditions. Consideration is given to the use of the weir in both rectangular
    and trapezoidal channels. Limitations to the use of the weir are given in 7.6
    and 8.6.
