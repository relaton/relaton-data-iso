abstract:
- language: en
  script: Latn
  content: ISO 9606-2:2004 specifies the requirements for qualification of welders
    for fusion welding of aluminium and aluminium alloys. ISO 9606-2:2004 provides
    a set of technical rules for systematic qualification of welders, which are independent
    of product type, location and examiner/examining body. The welding processes referred
    to in ISO 9606-2:2004 include those fusion welding processes which are designated
    as manual or partly mechanized welding. It does not qualify fully mechanized and
    automated welding processes.
