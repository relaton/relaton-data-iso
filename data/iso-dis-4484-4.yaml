abstract:
- language: en
  script: Latn
  content: This document specifies a thermal method and a gravimetric method for a
    quantitative determination of the certain synthetic materials (polyester, polyamide,
    acrylic, elastane, polypropylene and polyethylene) released from fabrics under
    washing test conditions. This method is applicable to synthetic fabric and synthetic/natural
    blended fabric - Synthetic/cellulosic fabrics (e.g. PET/Cotton, Nylon/Cotton,
    Acrylic/Cotton) - Synthetic/protein fabrics (e.g. PET/Wool, Nylon/Wool, Acrylic/Wool)
