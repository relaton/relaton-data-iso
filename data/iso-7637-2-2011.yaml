abstract:
- language: en
  script: Latn
  content: ISO 7637-2:2011 specifies test methods and procedures to ensure the compatibility
    to conducted electrical transients of equipment installed on passenger cars and
    commercial vehicles fitted with 12 V or 24 V electrical systems. It describes
    bench tests for both the injection and measurement of transients. It is applicable
    to all types of road vehicles independent of the propulsion system (e.g. spark
    ignition or diesel engine, electric motor). Function performance status classification
    for immunity to transients is also provided.
