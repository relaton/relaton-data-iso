abstract:
- language: en
  script: Latn
  content: This document provides an evaluation screening method for assessing the
    resistance to hydrogen embrittlement in high-pressure hydrogen atmospheres for
    steel pipes. The compatibility for use in a high-pressure hydrogen atmosphere
    is evaluated using two types of specimens with drilled holes according to various
    steel pipe sizes.
