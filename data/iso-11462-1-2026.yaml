abstract:
- language: en
  script: Latn
  content: This document gives guidance on the implementation of a statistical process control (SPC) system and an overview of tools and techniques to assist an organisation in planning, implementing and evaluating an effective statistical process control (SPC) system. This document specifies SPC system guidelines for use when a supplier's capability to reduce variation in processes associated with design or production needs to be proven or improved, or when a supplier is beginning SPC implementation to achieve such capability. This document considers the complete industrial supply chain. It describes some essential statistical methods that can be used to continuously improve capability or performance and stability of production processes. The bottom line is that production processes are controlled economically, promptly and effectively. As a result, a predefined level of quality can be realised. The improvement of stability and performance or capability of the production processes effectively reduces waste and machine downtime or increases productivity. If defective production parts are found in a random sample, they can be sorted out and, if necessary, further measures can be initiated.
