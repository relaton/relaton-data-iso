abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory method for measuring the vibration
    at the handle of fastener driving tools. It is a type test procedure for establishing
    the vibration value on the handle of a hand-held power tool operating under a
    specified load. This document is applicable to fastener driving tools driven pneumatically
    or by other means, using nails, staples or pins. This document is applicable to
    tools with single sequential actuation, contact actuation, contact actuation with
    automatic reversion or continual contact actuation (see Figures 1 to 3). This
    document is not applicable to tools operating in full sequential mode due to their
    much longer intervals in between individual actuations. However, to provide an
    indication for comparison of different tools of this type (see Figures 4 and 5),
    Annex C provides informative guidance. NOTE       Today current knowledge does
    not allow any conclusions regarding physiological and pathological effects between
    isolated shocks and continuous shock sequences, and their repetition rates.
