abstract:
- language: en
  script: Latn
  content: ISO 4628-10:2016 specifies a method for assessing the amount of filiform
    corrosion developed from a scribed mark by measuring the length of the longest
    filament L and the most frequent length M of filaments. Pictorial examples provided
    in Annex A of this part of ISO 4628 illustrate different ratings for the length
    of the longest filament L and the most frequent length M of the filaments. A comparison
    of the test panels with the 12 pictures in Annex A does not supersede the obligatory
    numerical assessment (method 1 or 2). ISO 4628-1 defines a system used for designating
    the quantity and size of defects and the intensity of uniform changes in appearance
    of coatings and outlines the general principles of the system. This system is
    intended to be used, in particular, for defects caused by ageing and weathering,
    and for uniform changes such as colour changes, for example yellowing.
