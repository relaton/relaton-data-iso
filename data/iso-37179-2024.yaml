abstract:
- language: en
  script: Latn
  content: This document specifies the principles and general requirements for the
    implementation of smart community infrastructures contributing to disaster risk
    reduction (DRR). It is intended to be used by stakeholders relevant to smart community
    infrastructures, including community managers, planners, funders, and providers
    or administrators of community infrastructure services who aim to reduce disaster
    risk and enhance the resilience of communities and their infrastructures.
