abstract:
- language: en
  script: Latn
  content: ISO 6931-1:2016 specifies the grades of stainless steels which are generally
    used in the cold drawn condition in the form of wire of circular cross-section
    up to 10,00 mm in diameter, for the production of springs and spring parts exposed
    to corrosive effects and sometimes to slightly increased temperatures (see Annex
    A). Certain steel grades covered by ISO 16143‑2 are also used for springs, although
    to a much lesser extent. In these cases, the mechanical properties (tensile strength,
    etc.) will be agreed between purchaser and supplier. Similarly, diameters between
    10,00 mm and 15,00 mm can be ordered according to the specifications of this part
    of ISO 6931, in which case the parties will agree upon the required mechanical
    characteristics. In addition to the specifications of this part of ISO 6931, the
    general technical delivery requirements of ISO 404 are applicable.
