abstract:
- language: en
  script: Latn
  content: This document specifies a vibration test code for determining, efficiently
    and under standardized conditions, the magnitude of vibration at the handles of
    portable hand-held, internal-combustion-engine-powered forest and garden machinery,
    including chain-saws, brush-cutters, grass-trimmers, edgers, pole-mounted powered
    pruners, hedge-trimmers and garden-blowers. Although the magnitudes measured are
    obtained in an artificial operation, they nevertheless give an indication of the
    values to be found in a real work situation. Vibration test codes, as described
    in this document, enable the manufacturer to verify the effort regarding low vibration
    design.
