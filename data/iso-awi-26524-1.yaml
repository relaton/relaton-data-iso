abstract:
- language: en
  script: Latn
  content: This document specifies the design method of porous aerostatic plain bearings
    without surface restriction. The performances of the bearings are influenced by
    the bearing structure and porous permeability. The design method described in
    this document enable designing the porous aerostatic journal and thrust bearings
    with considering different influence to obtain the desired static performance.
    This document applies to the calculation of porous aerostatic plain bearings under
    steady-state conditions.
