abstract:
- language: en
  script: Latn
  content: 'This document specifies the application module for Risk management. The
    following are within the scope of this document: facility to assign property type
    information to risk management data; facility to assign product type information
    to risk management data; facility to assign activity type information to risk
    management data; facility to assign activity method type information to risk management
    data; facility to assign resource type information to risk management data; facility
    to assign document type information to risk management data; facility to assign
    person and organization type information to risk management data; facility to
    assign event type information to risk management data; facility to assign condition
    type information to risk management data; facility to assign justification type
    information to risk management data; facility to assign value with unit type information
    to risk management data; facility to assign approval type information to risk
    management data; facility to assign state definition type information to risk
    management data; facility to assign date and time type information to risk management
    data.'
