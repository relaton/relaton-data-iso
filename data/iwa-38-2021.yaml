abstract:
- language: en
  script: Latn
  content: This document provides requirements and recommendations for the rapid construction
    of emergency medical facilities, including various categories of public health
    emergencies, for handling large numbers of casualties and patients. The functional
    composition of emergency medical facilities is determined by the characteristics
    of the emergencies. This document is applicable to new projects built on new sites
    or within existing medical institutions, where emergency medical facilities are
    constructed rapidly from steel-frames and prefabricated standard plates or box
    structures.
