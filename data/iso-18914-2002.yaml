abstract:
- language: en
  script: Latn
  content: This International Standard specifies a laboratory test method for determining
    the resistance of photographic emulsions or gelatin backings to abrasion damage
    during processing. This method may be used to determine the effects of variations
    in processing solutions, gelatin layer properties, processing solution temperatures
    and times, or a combination of these factors, on the wet scratch resistance of
    gelatin layers. This method is applicable to the determination of the physical
    integrity of photographic emulsions when wet, but it is not applicable to the
    evaluation of the scratch resistance of the support material.
