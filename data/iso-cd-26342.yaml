abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and test methods for silver and
    silver alloy coatings prepared by magnetron sputtering for electrical, electronic,
    optical and other engineering applications. In this document, engineering applications
    refer to uses that are not intended for decorative purposes. This document does
    not specify the condition, finish, or surface roughness of the basis material
    prior to deposition. Nevertheless, the appearance and performance of magnetron
    sputtered silver and silver alloy coatings depend on the surface characteristics
    of the basis material. Accordingly, in order to ensure compliance with the specified
    coating requirements, the purchaser shall specify the basis material’s surface
    condition, including its finish and roughness, prior to coating application.
