abstract:
- language: en
  script: Latn
  content: 'This document provides guidance on the characterization of wood chips
    produced from raw materials, as defined in ISO 17225-4, for the following aspects:
    —    quality classes and specifications; —    sampling, sample preparation and
    test methods for physical characteristics which can be conducted on site; —   
    practical information about testing to be carried out by external laboratories.
    This document provides additional information about the type and frequency of
    testing at an energy plant site, starting from the planning and start-up stages
    of a project and throughout its regular operation. This document is applicable
    for assessing changes in properties on a relative basis when testing is done routinely.
    This document is not applicable for demonstrating conformance with the referenced
    International Standards.'
