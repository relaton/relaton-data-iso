abstract:
- language: en
  script: Latn
  content: This part of ISO 2426 specifies the nature and limits of characteristics
    inherent in wood and manufacturing defects enabling the visual assessment of the
    plywood for allocation to an appearance class. This part of ISO 2426 applies to
    plywood, the surface veneers of which are made from softwood species. It does
    not apply to overlaid panels.
