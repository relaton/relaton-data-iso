abstract:
- language: en
  script: Latn
  content: ISO 17378-1:2014 specifies a method for the determination of arsenic and
    antimony. The method is applicable to drinking water, surface water, ground water
    and rain water. The linear application range of ISO 17378-1:2014 is from 0,02
    µg/l to 100 µg/l. Samples containing arsenic or antimony at higher concentrations
    than the application range can be analysed following appropriate dilution. Generally
    sea water is outside the scope of ISO 17378-1:2014. Sea water samples can be analysed
    using a standard additions approach providing that this is validated for the samples
    under test. The method is unlikely to detect organo-arsenic compounds or organo-antimony
    compounds. The sensitivity of this method is dependent on the selected operating
    conditions.
