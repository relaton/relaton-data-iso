abstract:
- language: en
  script: Latn
  content: 'ISO 10218-2:2011 specifies safety requirements for the integration of
    industrial robots and industrial robot systems as defined in ISO 10218-1, and
    industrial robot cell(s). The integration includes the following: the design,
    manufacturing, installation, operation, maintenance and decommissioning of the
    industrial robot system or cell; necessary information for the design, manufacturing,
    installation, operation, maintenance and decommissioning of the industrial robot
    system or cell; component devices of the industrial robot system or cell. ISO
    10218-2:2011 describes the basic hazards and hazardous situations identified with
    these systems, and provides requirements to eliminate or adequately reduce the
    risks associated with these hazards. ISO 10218-2:2011 also specifies requirements
    for the industrial robot system as part of an integrated manufacturing system.
    ISO 10218-2:2011 does not deal specifically with hazards associated with processes
    (e.g. laser radiation, ejected chips, welding smoke). Other standards can be applicable
    to these process hazards.'
