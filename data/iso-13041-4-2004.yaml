  script: Latn
  content: ISO 13041-4:2004 specifies, with reference to ISO 230-2:1997, the tolerances
    which apply to the positioning tests for linear axes, up to 2 000 mm in length,
    and rotary axes of numerically controlled turning machines and turning centres.
    ISO 13041-4:2004 does not deal with environmental conditions, warm-up of the machine
    and measuring methods already described in ISO 230-2:1997.
