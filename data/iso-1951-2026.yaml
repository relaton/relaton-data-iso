abstract:
- language: en
  script: Latn
  content: This document specifies the presentation of lexicographic entries in general
    language dictionaries, whether monolingual, bilingual or multilingual, following
    a lexicographic lemma-oriented approach, and intended for human end-users. Concerning
    the modelling of the underlying data, this document follows the ISO 24613 series.
    The document provides recommendations for addressing the heterogeneous structures
    of data presentation in lexicographic entries, both in printed and digital dictionaries.
    This document also establishes core concepts related to the broader scope of lexicographic
    work.
