abstract:
- language: en
  script: Latn
  content: 'This document specifies the minimum functional components for a Digital
    Object Storage Component, for the management of the integrity of stored objects.
    Requirements concerning confidentiality and availability are not addressed in
    detail in this specification. For the purposes of this document, a Digital Object
    Storage Component (DOSC) may be: - a software package operating on one or more
    hardware platforms, - a software and hardware package operating as a unit. This
    document is intended for: - designers or integrators of a solution or implementation,
    - service providers, - publishers or manufacturers of hardware and/or software
    providing a solution or implementation, - consultants and auditors. This document
    does not address system environments that may be necessary for the operation of
    the DOSC, such as physical security (fire extinguishing system, armoured doors,
    presence detectors, etc.), power supply security (generators and inverters) or
    telecommunication lines. Nor does the present document address the operating procedures
    for a DOSC. These are the responsibility of the DOSC system operator. This document
    does not address: - backup management of a DOSC, - confidentiality needs, - availability
    needs, - technical and / or organizational context for a DOSC.'
