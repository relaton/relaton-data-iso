abstract:
- language: en
  script: Latn
  content: ISO 18066:2015 specifies a test method for the determination of the boiling
    water shrinkage of non-textured and textured multifilament yarns (made of polyester,
    polyamide, polypropylene, cellulose fibre, etc.) Only automatic method is specified
    in this International Standard. This International Standard is applicable to manmade
    filament yarns of linear density less than 3 000 dtex. This International Standard
    is not applicable to partially oriented yarns.
