abstract:
- language: en
  script: Latn
  content: 'ISO 19617:2018 specifies the general requirements for manufacturing processes
    to ensure the quality of finished products used in traditional Chinese medicine
    (TCM). This document covers premises, documentation, personnel, training, manufacturing
    control and quality control. This document applies to the manufacturing of natural
    products used in and as TCM. ISO 19617:2018 does not conflict with general pharmaceutical
    good manufacturing practices (GMPs). ISO 19617:2018 applies to all materials of
    natural origin: medicinal plants, medicinal animals, medicinal minerals, crude
    drugs or crude drug preparations.'
