abstract:
- language: en
  script: Latn
  content: ISO 9816:2006 specifies open-loop test methods to determine the reactions
    of a vehicle in a turn to a sudden drop in motive power resulting from release
    of the accelerator pedal. It applies to passenger cars as defined in ISO 3833.
    The open-loop manoeuvre specified in this test method is not representative of
    real driving conditions, but is useful to obtain measures of a vehicle's power-off
    behaviour resulting from specific types of control inputs under closely controlled
    test conditions.
