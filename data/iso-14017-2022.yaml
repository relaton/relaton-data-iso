abstract:
- language: en
  script: Latn
  content: This document specifies principles, requirements and guidelines for the
    verification and validation of water statements. It is applicable to organizational,
    product and project water statement verification and validation, and can also
    be used to provide confidence in reported water information on a local, regional
    or national level. This document is programme neutral. If a programme is applicable,
    requirements of that programme are additional to the requirements of this document.
    NOTE       Legislation can differ from jurisdiction to jurisdiction. It is the
    user’s responsibility to determine how applicable legal requirements relate to
    this document.
