abstract:
- language: en
  script: Latn
  content: ISO 16100-3:2005 specifies requirements for interface services and protocols
    used to access and edit capability profiles and associated templates used in the
    capability profiling method defined in Clause 5 of ISO 16100-2. The detailed services
    for accessing capability profiles and performing the matching process on these
    profiles are defined in ISO 16100-3:2005. ISO 16100-3:2005 is applicable only
    for the interoperability of software units used in the manufacturing domain. Concerns
    regarding interchangeability of manufacturing software units are outside the scope
    of this part of ISO 16100.
