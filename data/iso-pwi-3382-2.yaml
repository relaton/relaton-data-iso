abstract:
- language: en
  script: Latn
  content: ISO 3382-2:2008 specifies methods for the measurement of reverberation
    time in ordinary rooms. It describes the measurement procedure, the apparatus
    needed, the required number of measurement positions, and the method for evaluating
    the data and presenting the test report. The measurement results can be used for
    correction of other acoustic measurements, e.g. sound pressure level from sound
    sources or measurements of sound insulation, and for comparison with requirements
    for reverberation time in rooms.
