abstract:
- language: en
  script: Latn
  content: This document describes procedures for evaluating the accuracy of colorimetric
    rendering intents in ICC profiles. It applies to v4 ICC profiles made according
    to ISO 15076-1. It does not apply to subjective tests of ICC profiles, such as
    for perceptual or saturation rendering intents, and it does not apply to high
    dynamic range colour media or spaces.
