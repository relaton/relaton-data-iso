abstract:
- language: en
  script: Latn
  content: This document specifies the general layout of drawings and provides examples
    of indications in the ISO 10110 series, which standardizes drawing indications
    for optical elements and systems. This document specifies the presentation in
    drawings of the characteristics, including the tolerances, of optical elements
    and systems. This document also includes the popular tabular format, formerly
    presented in ISO 10110‑10. This tabular format, now described in 5.1, is the preferred
    format for ISO 10110 drawings. Rules for preparation of technical drawings as
    well as for dimensioning and tolerancing are given in various ISO Standards. These
    general standards apply to optical elements and systems only if the necessary
    rules are not given in the various parts of ISO 10110.
