abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the determination of propylene
    oxide and trace impurities in propylene oxide for industrial use by gas chromatography.
    This document is suitable for the determination of propylene oxide which is produced
    by ethylbenzene co-oxidation (PO/SM), isobutane co-oxidation (PO/TBA), cumene
    co-oxidation (CHPPO), hydrogen peroxide oxidation (HPPO) and chlorohydrin. This
    document is applicable for determination of propylene oxide with a purity ≥ 99,70 %
    and impurity content ≥ 0,000 3 %.
