abstract:
- language: en
  script: Latn
  content: Existing models for large outdoor fires will be reviewed that purport to
    be able to predict fire spread for wildland-urban interface fires, urban fires,
    including post-earthquake urban fires, and informal settlement fires. The resulting
    literature review will be used to develop a technical specification for large
    outdoor fires models that may be used in the event of future large outdoor fire
    disasters. A technical specification, at the international level is required to
    be able to assess and compare fire spread models across all these large outdoor
    fire types.
