abstract:
- language: en
  script: Latn
  content: 'This part of ISO 10303 specifies the abstract test suite to be used in
    the conformance testing of implementations of ISO 10303-232. The following are
    within the scope of this part of ISO 10303: — the specification of the test purposes
    associated with ISO 10303-232; — the verdict criteria to be applied during conformance
    testing of an implementation of ISO 10303- 232 using ISO 10303-21 or ISO 10303-22;
    NOTE The verdict criteria are used to ascertain whether a test purpose has been
    satisfactorily met by an implementation under test (IUT) within the context of
    a given test case. — the abstract test cases to be used as the basis for the executable
    test cases for conformance testing. The following are outside the scope of this
    part of ISO 10303: — the creation of executable test cases; — test specifications
    for tests other than conformance testing such as interoperability or acceptance
    testing; — other implementation methods.'
