abstract:
- language: en
  script: Latn
  content: ISO 8655-1:2002 specifies the general requirements for piston-operated
    volumetric apparatus. It is applicable to piston pipettes, piston burettes, dilutors
    and dispensers. It furthermore defines terms for the use of piston-operated volumetric
    apparatus and gives a list of equivalent terms. It also gives user recommendations.
    ISO 8655-1:2002 is not applicable to medical products intended for use on human
    beings, e.g. for medical syringes.
