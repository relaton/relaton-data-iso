abstract:
- language: en
  script: Latn
  content: The 17739 standard series define the infrastructure supported location-based
    services for improving the road safety for vulnerable road users (VRUs) and vehicles.
    These services are provided through status and/or intent sharing on nomadic devices.
    This document, as a part of these series, specifies the functional requirements,
    data exchange procedures and test procedures of roadside infrastructure (sensor-equipped
    RSU) supported location-based service through status and/or intent sharing on
    nomadic devices for unprotected turn at junctions with traffic signals (UTJTS).
    UTJTS is a traffic regulation allowing a driver make a turn at a signalized intersection
    after yielding to oncoming traffic in the opposite direction and to pedestrians
    in the crosswalk when the solid green for through traffic is on. It is highly
    required for vehicles making an unprotected turn to be fully aware of surrounding
    moving objects’ status and intent and wait for a safe gap in the traffic in order
    to avoid accidents that could cause significant injuries or fatalities. In the
    real world, however, it is not easy for drivers to have full awareness of possible
    conflicts along the turning path without any assistance, especially on a real-time
    basis. Road users with nomadic devices can share their status and/or intent of
    maneuver through networked communication, localized communication, or hybrid communication.
    Therefore, the sensor-equipped RSU keeps road users’ status and intent updated
    through either sensors or communication using nomadic devices, and generates and
    provides intent-customized information to the drivers on nomadic devices so that
    they can find a safe break between the vehicles in the opposite direction as well
    as the VRUs in the crosswalk to avoid the potential risks. The sensor-equipped
    RSU analyses the gap acceptance in the road as well as in the crosswalk so as
    to come up with timely appropriate information, i.e., intent-customized information
    based on the shared intent from the drivers using the nomadic device where the
    planned path (intent) is updated from central ITS stations or its own computing
    power. **Please see attachment for diagram**
