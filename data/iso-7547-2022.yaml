abstract:
- language: en
  script: Latn
  content: This document specifies design conditions and methods of calculation for
    air-conditioning and ventilation of accommodation spaces on board seagoing merchant
    ships for all conditions, except those encountered in extremely cold or hot climates
    (i.e. with lower or higher conditions than those stated in 4.2 and 4.3). This
    document also provides special considerations for machinery control-rooms, wheelhouse,
    and dry provision store rooms in Annexes C, D and E. NOTE      Statutory requirements,
    rules and regulations can be applicable to the individual ships concerned.
