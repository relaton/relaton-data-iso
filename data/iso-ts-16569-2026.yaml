abstract:
- language: en
  script: Latn
  content: This document specifies a standardized data set for exercise recommendations to facilitate data exchange between healthcare providers and patients. This document specifically focuses on degenerative arthritis and backpain because these conditions commonly require long-term structured rehabilitation exercise exchange. This document defines the structure of exercise recommendation data for electronic exchange between healthcare providers and patients with degenerative arthritis and back pain. This document focuses on data exchange of exercise recommendations for backache and degenerative arthritis; other musculoskeletal disorders are outside the scope of this document. This document is not intended to provide a data set for symptoms of other musculoskeletal disorders, or for the patient’s pain intensity. This document does not cover medication orders, observation data measured by personal health devices, or other information that can be relevant in the context of recommendations for musculoskeletal disorders.
