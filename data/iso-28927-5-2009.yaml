abstract:
- language: en
  script: Latn
  content: ISO 28927-5:2009 specifies a laboratory method for measuring hand-transmitted
    vibration emission at the handles of hand-held, power-driven drills and impact
    drills. It is a type-test procedure for establishing the magnitude of vibration
    in the gripping areas of a drill fitted with a drill bit. It is intended that
    the results be used to compare different models of the same type of machine. ISO
    28927-5:2009 is applicable to straight drills, drills with a pistol‑grip and angle
    drills intended for drilling holes with rotating or impact action in all kinds
    of materials (see Clause 5), driven pneumatically or by other means. It is not
    applicable to heavy-duty drills with a screw feed or drills driven by a combustion
    engine.
