abstract:
- language: en
  script: Latn
  content: This International Standard specifies basic technical characteristics for
    the magnetic sound test films for checking, adjusting and measuring sound reproducing
    channels of dubbing motion-picture installations. It also specifies types and
    technical characteristics of magnetic test films made on 35 mm, 17,5 mm and 16
    mm motion-picture films. This International Standard includes test films intended
    for the checking, adjusting and measuring of a) inclination angle (azimuth) of
    the magnetic head gaps; b) output level balance of multi-channel systems; c) frequency
    response of the sound reproduction channel; d) non-uniformity of film velocity
    (flutter).
