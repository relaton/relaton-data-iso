abstract:
- language: en
  script: Latn
  content: 'The primary focus of this International Standard is to present methods
    for incorporating the consequences of potentially harmful accidental fires into
    models of environmental impact. This International Standard provides information
    on how to extend existing frameworks such as various “footprints”, Environmental
    Risk Assessment (ERA), and Life Cycle Assessment (LCA) to include the impacts
    associated with accidental fires. With respect to ERA and LCA this International
    Standard provides additional requirements to those standards published by ISO
    TC 207 and ISO TC 59 for increasing understanding and addressing the impact of
    accidental fire to the environment. This International Standard also addresses
    the uncertainty associated with including accidental fires in models of environmental
    impact. An analysis of the quality of the model input is necessary to establish
    the potential usefulness of the results and determine whether it is advisable
    to undertake the effort of including accidental fires in the models. The concept
    of the economic costs of the environmental impact of accidental fire is not within
    the scope of this document; however, the reader is referred to ISO 14008:2019
    Monetary valuation of environmental impacts and related environmental aspects.
    The impact of fire on human toxicology is also not within the scope of this document.
    The reader is referred to ISO 13571 and ISO 13344. This International Standard
    builds heavily on previous standards in this series: ISO 26367-1, ISO 26367-2,
    and ISO 26367-3.'
