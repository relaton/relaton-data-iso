abstract:
- language: en
  script: Latn
  content: The purpose of this document is to set out the general principles pertaining
    to the sampling strategy, to the collection and conditioning of samples, to their
    transport to the laboratory and to the pre-treatment operations to be carried
    out prior to analysis. It is intended for the use of organisations that implement
    a sampling programme as well as organisations responsible for collecting samples
    of bioindicators. These principles are not directly applicable to accident or
    post-accident situations. These principles can apply to biological matrices in
    the environment.
