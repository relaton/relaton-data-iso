abstract:
- language: en
  script: Latn
  content: |-
    The purpose of this document is to set out the general principles pertaining to the sampling strategy, to the collection and conditioning of samples, to their transport to the laboratory and to the pre-treatment operations to be carried out prior to analysis.
    It is intended for the use of organisations that implement a sampling programme as well as organisations responsible for collecting samples of bioindicators.
    These principles are not directly applicable to accident or post-accident situations. These principles can apply to biological matrices in the environment.
- language: fr
  script: Latn
  content: |-
    Le présent document a pour objet d’énoncer les principes généraux relatifs à la stratégie d’échantillonnage, à la collecte des échantillons, à leur conditionnement, à leur transport vers le laboratoire et aux opérations de prétraitement avant analyse.
    Il s’adresse aux organisations qui mettent en place un programme d’échantillonnage et aux organisations prélevant des bioindicateurs.
    Ces principes ne sont pas directement applicables aux situations accidentelles ou post-accidentelles. Ces principes peuvent s’appliquer à d’autres matrices biologiques de l’environnement.
