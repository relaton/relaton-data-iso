abstract:
- language: en
  script: Latn
  content: 'ISO 29061-4:2017 provides criteria for judgement of usability of child
    restraint systems (CRS) with regard to the securing of a child in the child seat
    and other daily handling aspects. ISO 29061-4:2017 provides criteria for judgement
    of: - ease of availability of instructions; - clarity of instruction manual and
    labelling; and - the ease of use of design related features of the CRS related
    to securing the child or child dummy in a CRS installed in vehicle. ISO 29061-4:2017
    can be used in conjunction with either ISO 29061-1 or ISO 29061-3 for making a
    complete usability evaluation of child restraint systems attached to the vehicle
    with ISOFIX/LATCH or vehicle seat belts. NOTE Booster system usability evaluation,
    including securing of a child in the booster system, is covered by ISO 29061-5.'
