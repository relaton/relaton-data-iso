abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for a secure interface for the
    provision of telematics applications for regulated commercial freight vehicles
    (TARV) application services data to jurisdictions and other relevant parties within
    the following scenarios: a)       a secure credential management system (SCMS)
    already exists for ITS data management and access in the location of the service
    provision; b)       an SCMS does not yet exist for ITS data management and access
    in the location of the service provision.'
