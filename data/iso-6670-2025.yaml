abstract:
- language: en
  script: Latn
  content: '1.1        This document specifies a sampling method for a consignment
    of instant coffee, shipped in 10 package units or more. This document is applicable
    to cases which have inner linings of moisture-resistant material hermetically
    sealed because of the hygroscopic nature of instant coffee and which are in package
    units greater than 10 kg net mass, typically up to 50 kg. This document is also
    applicable to units of more than 50 kg, usually called “big bags” or “supersacks”.
    The cases are generally made of cardboard of appropriate strength and the big
    bags are made of suitable plastic material. 1.2        This document is also applicable
    to the selection and preparation of a sufficiently representative sample of the
    consignment, which is intended: a)          to serve as a basis for an offer for
    sale; b)          for examination to verify that the instant coffee to be offered
    for sale satisfies the producer’s sales specification; c)          for examination
    to determine one or more of the characteristics of the instant coffee for technical,
    commercial, administrative and arbitration purposes; d)          for retention
    as a reference sample for use, if required, in litigation. 1.3        This document
    is applicable to all types of instant coffee, as defined in ISO 3509, contained
    in all types of units with liners, with the exception stated in 1.4. 1.4       
    For bulk density and particle size, this document is applicable to spray-dried
    powder and freeze-dried instant coffees only, as defined in ISO 3509, due to the
    intrinsic fragility of particles of agglomerated instant coffee, which leads to
    greater breakdown and headspace in the final packed units for the consumer.'
