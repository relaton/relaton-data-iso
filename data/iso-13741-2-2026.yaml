abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of residual monomers and other volatile organic components (unsaturated or saturated) in aqueous polymer dispersions and lattices, as well as in related products by headspace capillary-column gas chromatography (HS-GC). This document is applicable to the determination of residual monomers and other volatiles, include acrylic and methacrylic esters, butadiene, styrene vinyl acetate, as well as by-products such as ethylbenzene.
