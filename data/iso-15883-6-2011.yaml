abstract:
- language: en
  script: Latn
  content: ISO 15883-6:2011 specifies particular requirements for washer-disinfectors
    (WDs) intended for use when the level of assurance of disinfection that is necessary
    can be achieved by cleaning and thermal disinfection (A0 not less than 60) and
    does not require an independent automated record of critical processes to be kept.
    It is intended to be used in conjunction with ISO 15883-1, which gives general
    requirements for WDs. The range of products on which WDs of this particular type
    can be used is restricted to devices and equipment which are non-invasive and
    non-critical (i.e. not penetrating skin or contacting mucosal surfaces).
