abstract:
- language: en
  script: Latn
  content: ISO 18522:2016 specifies the procedures for determining the cross direction
    profiles of physical properties of paper and board using automated off-line testers.
    Where available for a given measurement, the relevant International Standard is
    referred to. It is applicable to most kinds of paper and board, but is not relevant
    for tissue and corrugated board. In ISO 18522:2016, it is left to the paper and
    board producer and the customer to agree upon which properties are relevant. The
    results are reported as mean values or as profiles across the machine. Some properties
    are reported in index form. The result obtained using the relevant ISO standard
    based on stand-alone equipment is used in case of challenge or dispute, if not
    otherwise agreed.
