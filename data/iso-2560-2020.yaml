abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the classification of covered
    electrodes and deposited metal in the as-welded condition and in the post-weld
    heat-treated condition for manual metal arc welding of non-alloy and fine grain
    steels with a minimum yield strength of up to 500 MPa or a minimum tensile strength
    of up to 570 MPa. This document is a combined specification providing for classification
    utilizing a system based on the yield strength and the average impact energy of
    47 J of all-weld metal, or utilizing a system based on the tensile strength and
    the average impact energy of 27 J of all-weld metal. a) Clauses, subclauses and
    tables which carry the suffix letter "A" are applicable only to covered electrodes
    classified to the system based on the yield strength and the average impact energy
    of 47 J of all weld metal in this document. b) Clauses, subclauses and tables
    which carry the suffix letter "B" are applicable only to covered electrodes classified
    to the system based on the tensile strength and the average impact energy of 27
    J of all weld metal in this document. c) Clauses, subclauses and tables which
    do not have either the suffix letter "A" or the suffix letter "B" are applicable
    to all covered electrodes classified in this document.
