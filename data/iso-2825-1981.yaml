abstract:
- language: en
  script: Latn
  content: Basis for this method is the laboratory sample obtained by the method specified
    in ISO 948. The principle of determination consists in grinding the laboratory
    sample, which has been previously mixed, to obtain particles of the size specified
    in the International Standard appropriate to the spice or condiment concerned
    or, if not so specified, to obtain particles of size approximately 1 mm.
