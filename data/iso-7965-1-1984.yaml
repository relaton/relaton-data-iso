abstract:
- language: en
  script: Latn
  content: 'Principle: The filled sack is raised above a rigid plane surface and released
    to strike this surface after free fall, the atmospheric conditions, the height
    of drop and the position of the package being set in advance. Various kinds of
    dropping are described. Test methods with progressive and constant drop height
    and limit height are specified. Annexes show examples of apparatus for drop testing,
    identification of surfaces of sacks and example of format for a drop test report.'
