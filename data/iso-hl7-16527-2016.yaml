abstract:
- language: en
  script: Latn
  content: 'ISO/HL7 16527 PHR-S FM:2016 defines a standardized model of the functions
    that may be present in PHR Systems. It is beyond the scope of the PHR system to
    control the use (or intended use) of PHR data. On the contrary, it is within the
    scope of the PHR system to manage the authorization of an individual (or other
    application). Those parties are then responsible for using the data for appropriate
    (or intended) purposes. The system manufacturers specify "intended and permitted
    use of PHR data" in their Terms of Service and Terms of Use agreements. This Functional
    Model is not: - a messaging specification; - an implementation specification;
    - a conformance specification; - a specification for the underlying PHR (i.e.
    the record itself); - an exercise in creating a definition for a PHR; - a conformance
    or conformance testing metric; - a requirement specification for a single PHR
    system (see Annex D, Anticipated Uses). The information exchange enabled by the
    PHR-S supports the retrieval and population of clinical documents and summaries,
    minimum data sets, and other input/outputs.'
