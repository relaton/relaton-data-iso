abstract:
- language: en
  script: Latn
  content: ISO 11148-6:2010 applies to hand-held non-electric power tools (hereafter
    referred to as “assembly power tools for threaded fasteners”) intended for tightening
    or installing of threaded fasteners. The assembly power tools for threaded fasteners
    can be powered by compressed air, hydraulic fluid or internal combustion engines
    and are intended for use by one operator and supported by the operator's hand
    or hands, with or without a suspension, e.g. a balancer. ISO 11148-6:2010 covers
    air-hydraulic impulse wrenches, impact wrenches, fastener installation tools,
    nutrunners, open-ended spanners (crow-foot with open-ended socket or tube nut
    wrench), ratchet wrenches and screwdrivers. ISO 11148-6:2010 does not cover special
    requirements and modifications of assembly power tools for threaded fasteners
    for the purpose of mounting them in fixtures. ISO 11148-6:2010 deals with all
    significant hazards, hazardous situations or hazardous events when the tools are
    used as intended and under conditions of misuse which are reasonably foreseeable
    by the manufacturer, with the exception of the use of assembly power tools for
    threaded fasteners in potentially explosive atmospheres.
