abstract:
- language: en
  script: Latn
  content: This document specifies two methods of testing for checking the leaktightness
    of assembled joints between mechanical fittings and plastic pressure pipes with
    diameters up to and including 63 mm. The test applies regardless of the design
    and material of the fitting used for jointing plastics pipe. This test method
    is not applicable to fusion-welded joints.
