abstract:
- language: en
  script: Latn
  content: 'This standard will provide requirements, for organizations and its travellers,
    for managing risks as a result of undertaking travel for the organization. It
    will complement the guidance provided in ISO 31030:2021 – Travel risk management
    – Guidance for organizations. Travel Risk Management (TRM) is a multi-faceted,
    cross-functional discipline that requires a variety of stakeholder input and actions
    from across an organization. This includes Operations, Finance, Procurement, Legal,
    Leadership, People Management, Compliance, Security (including cyber security),
    Global Mobility and more. The document will provide a structured approach to travel
    risk management for the development, implementation, evaluation and review of
    policy, programme development, threat and hazard identification, risk assessment,
    and prevention and mitigation strategies. It will support existing management
    system frameworks enabling organizations to minimize risks and reduce incidents
    to people travelling on behalf of their organizations. This document will be used
    in full or part in order to systematically improve the organization’s duty of
    care responsibilities, worker wellbeing, delivery of its strategic objectives,
    resilience and continuity. It is applicable to all organizations that require
    its staff to travel regardless of type, size or nature. Note: As part of the Preliminary
    Work to investigate the viability of this proposal, BSI has consulted widely with
    relevant stakeholders. (Please see Justification Study). Should this proposal
    be approved, BSI would continue to engage with these groups, and others, to develop
    the standard. BSI would also seek to establish Twinning arrangements.'
