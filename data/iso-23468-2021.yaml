abstract:
- language: en
  script: Latn
  content: This document specifies an analytical method for determining heavy water
    isotopic purity by Fourier transform infrared spectroscopy (FTIR). It is applicable
    to the determination of the whole range of heavy water concentration. The method
    is devoted to process controls at the different steps of the process systems in
    heavy water reactor power plant or any other related areas. The method can be
    applied for heavy water isotopic purity measurements in a heavy water reactor
    power plant or research reactor, heavy water production factory and heavy water
    related areas.
