abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety protection requirements during the
    design process to ensure the safe and reliable operation of these systems under
    various operating conditions. This document applies to the following types of
    Marine engineering platform jacking system: --Lift-up drilling platform lift system
    --Lift-up wind power installation platform lifting system --Related lifting facilities
    for other types of jack-up Marine engineering platforms --Newly built jack-up
    Marine platform lifting system, as well as the renovation and upgrading of the
    existing systems.'
