abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the qualification of welders and
    welding operators for the fusion welding of metallic materials for aerospace applications.
    NOTE Success in the test is an essential precondition for the qualification of
    welders (3.2) and welding operators (3.3) in new production and repair work in
    aerospace. However, welding equipment operators (3.4) do not need to be qualified
    according to this document.
