abstract:
- language: en
  script: Latn
  content: ISO 7675:2003 specifies the requirements for chlorinated poly(vinyl chloride)
    (PVC-C) pipes and fittings for soil and waste discharge (low and high temperature)
    inside buildings, as well as the system itself. It does not include buried pipework.
    It is applicable to pipes and fittings designed for jointing by means of elastomeric
    sealing rings, solvent cementing or integral dual-purpose sockets, i.e. for elastomeric
    ring seal joints and/or for solvent cement joints.
