abstract:
- language: en
  script: Latn
  content: 'This document establishes a standardized notation with consistent design
    requirements for the results of business reporting, including written reports,
    presentations and dashboards. The notation specifies requirements for the visual
    appearance of: recurring visual aspects, such as the layout of charts, tables
    and text; their characteristics; the labelling of content. This document is applicable
    to business reporting regardless of an organization’s type, size, location or
    the nature of products and services delivered. For further guidance on accessibility
    requirements, refer to Web Content Accessibility Guidelines 2.2 and ISO/IEC 23859:2023.'
