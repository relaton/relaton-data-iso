abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of reaction temperatures
    and times, enthalpies of reaction, and degrees of conversion using conventional
    differential scanning calorimetry (DSC) as specified in ISO 11357-1. The method
    applies to monomers, prepolymers, and polymers in the solid or liquid state. The
    material can contain fillers and/or initiators in the solid or liquid state. This
    document is not applicable to fast DSC as specified in ISO 23976.[1]
