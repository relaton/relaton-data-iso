abstract:
- language: en
  script: Latn
  content: ISO 14954:2005 normalizes the exchange of mathematical models between spacecraft
    contractors (SCC) and launch service providers (LSP). It identifies standard methods
    for modelling the dynamic behaviour of both launch vehicles (LV) and spacecraft
    (SC) particularly when they are coupled prior to launch and during the early moments
    of the launch phase. In standard mode, the delivered models represent dynamic
    and static behaviour at the launcher interface. The requirements provided in ISO
    14954:2005 are the minimum necessary for dynamic coupled analysis. They may be
    not sufficient for stress analysis. ISO 14954:2005 does not include the validation
    of spacecraft models.
