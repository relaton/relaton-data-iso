abstract:
- language: en
  script: Latn
  content: This document defines an ontology for service level concepts for public
    health emergencies using terms specified in ISO/IEC 5087-1 and 5087-2. Service
    level concepts are used to represent data that is shared across multiple services
    and stakeholders in the city. Service level concepts are distinguished by their
    data being read but not updated by multiple city services and stakeholders.
