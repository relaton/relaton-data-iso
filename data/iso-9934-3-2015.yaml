abstract:
- language: en
  script: Latn
  content: 'ISO 9934-3:2015 describes three types of equipment for magnetic particle
    testing: - portable or transportable equipment; - fixed installations; - specialized
    testing systems for testing components on a continuous basis, comprising a series
    of processing stations placed in sequence to form a process line. Equipment for
    magnetizing, demagnetizing, illumination, measurement, and monitoring are also
    described. This part of ISO 9934 specifies the properties to be provided by the
    equipment supplier, minimum requirements for application and the method of measuring
    certain parameters. Where appropriate, measuring and calibration requirements
    and in-service checks are also specified.'
