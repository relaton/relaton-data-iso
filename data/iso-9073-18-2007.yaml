abstract:
- language: en
  script: Latn
  content: ISO 9073-18:2007 specifies a grab tensile test procedure for determining
    the breaking strength and elongation of most nonwoven materials. It includes instructions
    for the testing of wet specimens. This grab tensile test procedure is applicable
    for most nonwovens, but is not recommended for nonwovens which have a high percentage
    of stretch.
