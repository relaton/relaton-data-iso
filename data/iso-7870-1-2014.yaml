abstract:
- language: en
  script: Latn
  content: ISO 7870-1:2014 presents key elements and philosophy of the control chart
    approach, and identifies a wide variety of control charts (including those related
    to the Shewhart control chart, those stressing process acceptance or online process
    adjustment, and specialized control charts). It presents an overview of the basic
    principles and concepts and illustrates the relationship among various control
    chart approaches to aid in the selection of the most appropriate standard for
    given circumstances. It does not specify statistical control methods using control
    charts. These methods will be specified in future parts of ISO 7870.
