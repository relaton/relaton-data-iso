abstract:
- language: en
  script: Latn
  content: This document specifies the diagnostic protocol data unit application programming
    interface (D‑PDU API) as a modular vehicle communication interface (MVCI) protocol
    module software interface and common basis for diagnostic and reprogramming software
    applications. This document covers the descriptions of the application programming
    interface (API) functions and the abstraction of diagnostic protocols, as well
    as the handling and description of MVCI protocol module features. Sample MVCI
    module description files accompany this document. The purpose of this document
    is to ensure that diagnostic and reprogramming applications from any vehicle or
    tool manufacturer can operate on a common software interface and can easily exchange
    MVCI protocol module implementations.
