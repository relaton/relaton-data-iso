abstract:
- language: en
  script: Latn
  content: This document specifies requirements concerning safety systems raised by
    the application of superconducting magnets in fusion facilities. Safety systems
    include confinement systems (both static and dynamic types), shielding barriers,
    penetrations, and supporting systems such as instrumentation and control. The
    requirements are applicable to both normal and abnormal operation of a fusion
    facility. For instance, the radiation protection shall be adequate in order to
    permit the hands-on operation to the electronics and parts for inspection, maintenance
    and replacement; the hazards associated with superconducting magnets, such as
    the loss of superconductivity (quench), Paschen breakdown following helium and
    voltage leakage, shall be prevented from breaching the integrity of safety systems.
    This document will facilitate the design and assessment of the safety systems
    in a fusion facility with superconducting magnets for all configurations, such
    as tokamak, stellarator and magneto-inertial fusion devices. Based on the advancement
    and maturity of the tokamak configuration, this document outlines safety requirements
    mostly derived from the tokamak configuration but also applicable to other configurations
    and layouts that may be adopted by future fusion devices.
