abstract:
- language: en
  script: Latn
  content: ISO 11451-1:2015 specifies general conditions, defines terms, gives practical
    guidelines, and establishes the basic principles of the vehicle tests used in
    the other parts of ISO 11451, for determining the immunity of passenger cars and
    commercial vehicles to electrical disturbances from narrowband radiated electromagnetic
    energy, regardless of the vehicle propulsion system (e.g. spark-ignition engine,
    diesel engine, electric motor). The electromagnetic disturbances considered are
    limited to continuous narrowband electromagnetic fields. A wide frequency range
    (0,01 MHz to 18 000 MHz) is allowed for the immunity testing in this and the other
    parts of ISO 11451.
