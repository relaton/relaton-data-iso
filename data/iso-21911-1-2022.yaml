abstract:
- language: en
  script: Latn
  content: This document specifies an analytical method for quantification of the
    spontaneous heat generation from solid recovered fuels using isothermal calorimetry.
    This document gives guidance on the applicability and use of the specified analytical
    method. It further establishes procedures for sampling and sample handling of
    solid recovered fuels prior to the analysis of spontaneous heat generation. The
    test procedure given in this document quantifies the thermal power (heat flow)
    of the sample during the test. It does not identify the source of self-heating
    in the test portion analysed.
