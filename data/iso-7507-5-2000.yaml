abstract:
- language: en
  script: Latn
  content: This part of ISO 7507 specifies a method for the calibration of non-insulated
    vertical cylindrical tanks having diameters greater than 5 m, by means of external
    measurement using an electro-optical distance-ranging method (EODR), and for the
    subsequent compilation of tank capacity tables. This part of ISO 7507 is applicable
    to tanks with cone-up or cone-down bottoms as well as to tanks with flat bottoms.
