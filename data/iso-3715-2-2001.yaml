abstract:
- language: en
  script: Latn
  content: This part of ISO 3715 gives terms and definitions applicable exclusively
    to continuously variable and hydraulic operated controllable-pitch propeller units.
    It does not cover controllable-pitch propeller units for which only a few specified
    pitch settings apply. General vocabulary for the geometry of screw propellers
    is given in ISO 3715-1 and is also valid for controllablepitch propellers.
