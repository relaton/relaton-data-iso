abstract:
- language: en
  script: Latn
  content: 'ISO 4301-1:2016 establishes a general classification of cranes and mechanisms
    based on the service conditions, mainly expressed by the following: - the total
    number of working cycles to be carried out during the specified design life of
    the crane; - the load spectrum factor which represents the relative frequencies
    of loads to be handled; - the average displacements.   Additional information
    for the user: This version uses the cycle - based classification method. If you
    need to use the time - based classification method please use the 1986 version.'
