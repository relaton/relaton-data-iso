abstract:
- language: en
  script: Latn
  content: This document presents considerations for using VR content in the learning,
    education and training (LET) domain for reducing reality and virtual reality crossover
    confusion among users and assisting users to effectively use these emerging technologies.
    This document addresses VR content that uses a head-mounted display (HMD) in the
    LET domain. It does not address VR content using immersive technology and does
    not address augmented reality, mixed or merged reality content.
