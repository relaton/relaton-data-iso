abstract:
- language: en
  script: Latn
  content: 'This document specifies principles, requirements and procedures for bunkering
    of ammonia-fuelled vessels. The document covers the main elements as follows:
    - Operational procedures, equipment requirements and bunker checklists to ensure
    safe, reliable and efficient bunkering operations - Risk assessment criteria,
    bunkering zones requirements (such as hazardous areas, safety zones, toxic areas/spaces,
    monitoring zones, security zones) - Emergency procedures - Simultaneous operations
    (SIMOPS) requirements - Training and competency'
