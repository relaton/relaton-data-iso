abstract:
- language: en
  script: Latn
  content: ISO 17786:2015 specifies a procedure of test for high temperature (105
    °C) evaporation residue in DME used as fuel by the mass analysis method. This
    procedure is applicable to determine the amount of high temperature (105 °C) evaporation
    residue up to the value specified in ISO 16861. Several tests can be applied to
    determine amount of evaporation residue in liquefied products. Among them, this
    International Standard specifies the method that has detection limit sufficient
    for a DME specification in ISO 16861, using less resource compared to other methods.
    When more precise quantitative test is required, use of ISO 13757 instead of this
    International Standard is recommended. Because of the procedure applied, the evaporation
    residue which has a boiling point lower than 105 °C will not be determined. NOTE
    The precision of this method has been studied for a limited set of samples and
    content levels by a limited amount of labs. It allows establishment of a quality
    specification of DME but cannot be considered as a full precision determination
    in line with the usual statistical methodology as in ISO 4259.
