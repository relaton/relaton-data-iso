abstract:
- language: en
  script: Latn
  content: This document describes the measurement elements of workforce availability
    for organizations. This document provides the formula for comparable measures
    for internal and external reporting. This document also highlights issues that
    need to be considered when interpreting compliance data, especially when deciding
    on appropriate interventions internally and when reporting these to external stakeholders
    (e.g. regulators, investors). This document pertains to the working capacity of
    the permanent and temporary workforce, and does not consider their existing allocated
    work, skills or suitability for taking on specific work efforts. These subjects
    are addressed in ISO 30409.
