abstract:
- language: en
  script: Latn
  content: This document specifies interface content exchanged between manufacturing
    control functions and other enterprise functions as interrelated information models.
    The information models are represented as an interrelated collection of conceptual
    object models which can be used for the implementation of applications with logical
    data and physical data models. The data exchanges in interfaces are scoped as
    between Level 3 manufacturing operations and Level 4 business systems in the hierarchical
    model defined in IEC 62264-1. The purpose of this document is to reduce the risk,
    cost, and errors associated with interface implementation. Since this document
    covers many manufacturing operations and enterprise domains and there are many
    different standards for those domains, the semantics of this data exchange standard
    are described at a conceptual level intended to enable the other standards to
    be mapped to these semantics. To this end, this document defines a set of elements
    contained in the generic interface, together with a mechanism for extending the
    interface content for implementations. The scope is limited to the definition
    of object models and attributes of the exchanged information defined in the IEC 62264-1.
