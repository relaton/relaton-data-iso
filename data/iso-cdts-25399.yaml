abstract:
- language: en
  script: Latn
  content: This TS first presents a review of the different worldwide existing tests
    to assess the resistance of building components (mainly vents and roofs) under
    the thermal flux exposure during a large outdoor fire. Then a methodology is proposed
    to harmonize these tests into a single international ISO standard.
