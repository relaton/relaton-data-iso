abstract:
- language: en
  script: Latn
  content: This document specifies a method for the detection of Anisakidae L3 larvae
    commonly found in marine and anadromous fishes. The method is applicable to fresh
    fish and/or frozen fish, as well as lightly processed fish products, such as marinated,
    salted or smoked. It is also suitable for visceral organs as a confirmatory method
    for a visual inspection scheme. The artificial digestion method[4][5][6] is applicable
    to quantifying parasitic infections by estimating the number of parasites in the
    fish musculature and, when applied to fresh fish or lightly processed fish products
    (never frozen before processing), determining the viability of Anisakidae L3,
    which can be present. This method does not apply to determining the species or
    genotype of detected parasites. Final identification is made by morphological
    and/or molecular methods.
