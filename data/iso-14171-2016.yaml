abstract:
- language: en
  script: Latn
  content: ISO 14171:2016 specifies the requirements for the classification of electrode/flux
    combinations and weld metal in the as-welded condition and in the post-weld heat-treated
    condition for submerged arc welding of non-alloy and fine grain steels with minimum
    yield strength of up to 500 MPa or a minimum tensile strength of up to 570 MPa.
    One flux can be classified with different solid wire electrodes and tubular cored
    electrodes. The solid wire electrode is also classified separately based on chemical
    composition. It is a combined specification providing for classification utilizing
    a system based upon the yield strength and the average impact energy for weld
    metal of 47 J, or utilizing a system based upon the tensile strength and the average
    impact energy for weld metal of 27 J. a) Paragraphs and tables which carry the
    suffix letter "A" are applicable only to electrode/flux combinations and wire
    electrodes classified using the system based upon the yield strength and the average
    impact energy for weld metal of 47 J, in accordance with ISO 14171:2016. b) Clauses
    and tables which carry the suffix letter "B" are applicable only to electrode/flux
    combinations and wire electrodes classified using the system based upon the tensile
    strength and the average impact energy for weld metal of 27 J, in accordance with
    ISO 14171:2016. c) Clauses and tables which do not have either the suffix letter
    "A" or the suffix letter "B" are applicable to all electrode/flux combinations
    and wire electrodes classified in accordance with ISO 14171:2016. Fluxes for the
    single-run and two-run techniques are classified on the basis of the two-run technique.
