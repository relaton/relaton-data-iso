abstract:
- language: en
  script: Latn
  content: This document specifies the composition, functional and performance requirements
    for a payload interface of civil unmanned aircraft systems (UAS), with the maximum
    take-off mass of 0,25 kg to 25 kg which relates to level II through IV according
    to ISO 21895. This document is applicable to the design and manufacture of physically
    independent payload interfaces which connect an external payload to an unmanned
    aircraft (UA).
