abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for the implementation of pressurized
    sprinkler, micro-sprinkler and sprayer irrigation systems [hereinafter: system(s)].
    It is applicable to both small-scale family agriculture and large-scale commercial
    agriculture, in open field or within protected crops structure (e.g., greenhouse,
    net-house or tunnel). This document is intended for the use of agriculture ministries,
    agronomists, irrigation planners, farmers and end-users. This document is not applicable to centre pivots, linear systems, travellers, and side roll sprinkler
    irrigation systems.'
