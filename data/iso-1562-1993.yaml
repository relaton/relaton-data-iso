abstract:
- language: en
  script: Latn
  content: Gives the classification of, and specifies requirements and test methods
    for gold-based dental casting alloys with a content of at least 75 % (m/m) of
    gold and platinum group metals. Applies to casting alloys suitable for the fabrication
    of dental restorations and appliances. Does not apply to alloys intended for use
    as the substructure of a metallo-ceramic restoration (ISO 9693) nor to dental
    casting alloys with noble metal content of 25 % up to but not including 75 % (ISO
    8891).
