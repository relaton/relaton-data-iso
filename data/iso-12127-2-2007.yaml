abstract:
- language: en
  script: Latn
  content: ISO 12127-2:2007 specifies a test method designed to evaluate the heat
    transfer and the behaviour of materials used for protective clothing when such
    materials are struck by high temperature metal particles, especially when these
    are trapped in the folds of the garment in working situations. The results obtained
    by this method permit the comparison of the behaviour of different materials which
    have undergone this test under standardized conditions. They do not permit conclusions
    to be drawn with respect to contacts with large splashes of molten cast iron or
    other metal, nor do they allow the behaviour of complete garments under industrial
    conditions to be predicted.
