abstract:
- language: en
  script: Latn
  content: ISO 16269-4:2010 provides detailed descriptions of sound statistical testing
    procedures and graphical data analysis methods for detecting outliers in data
    obtained from measurement processes. It recommends sound robust estimation and
    testing procedures to accommodate the presence of outliers. ISO 16269-4:2010 is
    primarily designed for the detection and accommodation of outlier(s) from univariate
    data. Some guidance is provided for multivariate and regression data.
