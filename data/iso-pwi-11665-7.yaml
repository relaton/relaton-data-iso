abstract:
- language: en
  script: Latn
  content: ISO 11665-7:2012 gives guidelines for estimating the radon-222 surface
    exhalation rate over a short period (a few hours), at a given place, at the interface
    of the medium (soil, rock, laid building material, walls, etc.) and the atmosphere.
    This estimation is based on measuring the radon activity concentration emanating
    from the surface under investigation and accumulated in a container of a known
    volume for a known duration. This method is estimative only, as it is difficult
    to quantify the influence of many parameters in environmental conditions. ISO
    11665-7:2012 is particularly applicable, however, in case of an investigation,
    a search for sources or a comparative study of exhalation rates at the same site.
    ISO 11665-7:2012 does not cover calibration conditions for the rate estimation
    devices.
