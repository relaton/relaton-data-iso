abstract:
- language: en
  script: Latn
  content: This document specifies profiles with a set of auditable outcomes for ITES-BPO
    VSEs with guidance, and applies to service delivery within ITES-BPO VSEs. It defines
    processes to plan, establish, implement, operate, monitor, review, maintain and
    improve its services. It contains process definitions across the lifecycle, described
    in terms of process purpose, outcomes, practices, tasks, and information items
    to guide ITES-BPO VSEs in performing lifecycle processes. This document is applicable
    to ITES-BPO VSEs and covers IT enabled business processes that are outsourced.
    This document is not intended to address IT processes, but includes references
    to them at key touchpoints for completeness.
