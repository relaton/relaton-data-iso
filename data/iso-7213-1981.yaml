abstract:
- language: en
  script: Latn
  content: Applies to all kinds of pulp delivered in bales or rolls, and is recommended
    for use when sampling for all kinds of testing purposes except for the determination
    of saleable mass. If the pulp is to be tested for saleable mass, in addition to
    other properties, the gross sample obtained according to the appropriate International
    Standard for sampling saleable mass may also be used for the other pulp property
    test.
