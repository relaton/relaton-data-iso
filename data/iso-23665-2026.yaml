abstract:
- language: en
  script: Latn
  content: 'This document specifies the procedures for training personnel who will be involved in the operation of uncrewed aircraft systems (UAS). This document defines: knowledge, skill, attitude and qualification criteria required for UAS remote pilots (RP), remote pilot in command (rPIC) and UAS training organizations (UTO) that provide training to UAS remote pilots and other personnel involved in UAS operations; training curriculum and contents for specific learning courses; qualification and criteria for verification of achieved competence by the training organizations; general procedures for providing training of UAS personnel. NOTE 1        An UTO can include additional topics or learning objectives, such as when required by legally binding rules in the applicable jurisdiction. NOTE 2        A UAS operator can also act as the UTO, providing that possible conflict of interest between training and operations is properly managed.'
