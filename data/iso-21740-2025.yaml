abstract:
- language: en
  script: Latn
  content: This document establishes the general safety launch collision avoidance
    (safety LCOLA) requirements for the avoidance of collision between the collection
    of newly launched objects resulting from a space launch [including launch vehicle
    stage(s) and payloads or released objects] and human-inhabited or human-habitable
    space stations and space vehicles. The document specifies the requirements for
    the analysis of launch times and procedures for identifying safe launch opportunities.
    It also describes the assessment and constraints for collision avoidance risk
    evaluation metrics (launch collision probability and standoff distance).
