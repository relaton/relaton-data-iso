abstract:
- language: en
  script: Latn
  content: This document specifies the basic specifications and testing requirements
    for ISO series 1 tank containers suitable for the carriage of gases, liquids and
    solid substances (dry bulk) which can be loaded or unloaded as liquids by gravity
    or pressure discharge, for international exchange and for conveyance by road,
    rail and sea, including interchange between these forms of transport. Except where
    otherwise stated, the requirements of this document are minimum requirements.
