abstract:
- language: en
  script: Latn
  content: B-rep shape data is frequently discretized into triangulated shape data
    for various purposes, such as visualisation, FEM analysis, and NC cutter path
    calculation, etc. How discretized triangulated shape data is close to the original
    B-rep shape data is a critical industry concern. This standard mainly focuses
    on the equivalence check of triangulated shape data with the original B-rep shape
    data. The equivalence check of two tringulated shape data sets may also be in
    isope if there is a clear industry need.
