abstract:
- language: en
  script: Latn
  content: ISO 2137:2007 specifies several methods for the empirical estimation of
    the consistency of lubricating greases and petrolatum by measuring the penetration
    of a standardized cone. Four procedures are specified for determining the consistency
    of lubricating greases by measuring the penetration of a full-scale cone for unworked,
    worked, prolonged worked and block penetrations for penetrations of up to 500
    units. ISO 2137:2007 specifies methods for determining the consistency of lubricating
    greases when only small samples are available, by the use of cones a half-scale
    or quarter-scale for the listed methods, applicable to greases having penetrations
    of 175 units to 385 units using the full-scale cone.
