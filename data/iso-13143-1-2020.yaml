abstract:
- language: en
  script: Latn
  content: This document specifies the test suite structure (TSS) and test purposes
    (TPs) for evaluating the conformity of on-board equipment (OBE) and roadside equipment
    (RSE) to ISO 12813. It provides a basis for conformance tests for dedicated short-range
    communication (DSRC) OBE and RSE to support interoperability between different
    equipment supplied by different manufacturers. ISO 12813 defines requirements
    on the compliance check communication (CCC) interface level, but not for the RSE
    or OBE internal functional behaviour. Consequently, tests regarding OBE and/or
    RSE functional behaviour remain outside the scope of this document.
