abstract:
- language: en
  script: Latn
  content: This document defines the detailed interface services and protocols used
    in a matching method based on multiple capability class structures. This document
    also defines a CPTI (Capability Profile Template Interface) Service Group, an
    Extended CPI (Capability Profile Interface) Service Group and an Extended Matcher
    Interface Service Group, which is extensions of the Type 1, Type 2 and Type 3
    services, respectively, specified in ISO 16100-3:2005,5.4. This document also
    defines the CCSI (Capability Class Structure Interface) Service Group, an additional
    service group used to create, register, access and modify a capability class structure
    for the reference manufacturing domain models specified in ISO 16100-5:2009, Clause
    6. This document also specifies detailed contents of the specific part of a capability
    profile template defined in ISO 16100-5:2009, Clause 7.
