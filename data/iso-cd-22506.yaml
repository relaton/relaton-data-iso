abstract:
- language: en
  script: Latn
  content: This document specifies the essential safety requirements for the design
    and construction of extruder machines as well as integrated ancillary equipment
    which form part of, or are used in combination with the extruder, for the processing
    of plastics and/or rubber and provides information for their safe use. This document
    deals with all significant hazards, hazardous situations and events relevant to
    extruders when they are used as intended and under conditions of misuse which
    are reasonably foreseeable by the manufacturer during the life cycle of the machinery.
