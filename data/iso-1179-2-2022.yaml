abstract:
- language: en
  script: Latn
  content: This document specifies the dimensions, performance requirements and test
    procedures for heavy-duty (S series) and light-duty (L series) stud ends with
    threads, and the elastomeric sealing (type E) that is used with them as defined
    in ISO 228-1. Heavy-duty (S series) stud ends with type E sealing in accordance
    with this document can be used at working pressures up to 63 MPa (630 bar). Light-duty
    (L series) stud ends with type E sealing in accordance with this document can
    be used at working pressures up to 25 MPa (250 bar). The permissible working pressure
    depends upon size, materials, design, working conditions, application, etc. This
    document is applicable to connectors detailed in ISO 8434-1, ISO 8434-2 and ISO 8434-6.
    NOTE      The Introduction gives recommendations for ports and stud ends to be
    used for new designs in hydraulic and pneumatic fluid power applications.
