abstract:
- language: en
  script: Latn
  content: 'ISO 18286:2004 specifies requirements for tolerances for hot-rolled stainless
    steel plates (quarto plates) made on a reversing mill with the following characteristics:
    nominal thickness equal to or greater than 4 mm and equal to or less than 250
    mm; nominal width equal to or greater than 600 mm. Tolerances for plate of width
    less than 600 mm cut or slit from plate should be agreed upon between manufacturer
    and purchaser at the time of enquiry and order. ISO 18286:2004 does not include
    round plates, custom-made plates, checker plate or bulb plate for flooring or
    wide flats. It does not include continuous process plates (plate made with coiling).'
