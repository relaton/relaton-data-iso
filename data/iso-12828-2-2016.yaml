abstract:
- language: en
  script: Latn
  content: ISO 12828-2:2016 describes tools and techniques for use in validating the
    analysis of fire gases when an analytical method is developed in a laboratory.
    It complements ISO 12828‑1, which deals with limits of quantification and detection.
    The tools and techniques described can be applied to the measurement of quantities,
    concentrations (molar and mass), volume fractions, and concentration or volume
    fraction versus time analyses. Fire effluents are often a complex matrix of chemical
    species, strongly dependent on the materials involved in the fire, but also dependent
    on fire scenario parameters (see ISO 19706). With such a wide variety of conditions,
    the analytical techniques available will differ in terms of the influence of the
    matrix on the methods and on the concentration ranges which can be measured. The
    analytical techniques available are likely to differ significantly in several
    respects, such as their sensitivity to the matrix and the range of concentrations/volume
    fractions which can be reliably measured. For these reasons, a unique reference
    analytical technique for every fire effluent of interest is, in practical terms,
    difficult or impossible to achieve. The tools in this document allow verification
    of the reliable measurement ranges and conditions for the analysis of fire effluents,
    thereby enabling a comparison among various analytical techniques. Examples of
    existing International Standards where the information contained in this document
    can be used are the analytical chemical methods in ISO 19701, ISO 19702, ISO 5660‑1,
    and the chemical measurements in the methods discussed in ISO/TR 16312‑2, ISO
    16405, or their application to fire toxicity assessment using ISO 13571 and ISO
    13344. NOTE 1 The variable "concentration" is used throughout this document, but
    it can be replaced in all places with "volume fraction" without altering the meaning.
    This does not apply to the Annexes. NOTE 2 Concentration can be calculated from
    volume fraction by multiplying by the density of the relevant gas at the relevant
    temperature and pressure.
