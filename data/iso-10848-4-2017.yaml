abstract:
- language: en
  script: Latn
  content: ISO 10848 (all parts) specifies measurement methods to characterize the
    flanking transmission of one or several building components. ISO 10848-4:2017
    specifies laboratory and field measurements of buildings where at least one of
    the elements that form the construction under test is a Type A element (defined
    in ISO 10848‑1). Laboratory measurements are used to quantify the performance
    of the junction with suppressed flanking transmission from the laboratory structure.
    Field measurements are used to characterize the in situ performance and it is
    not usually possible to suppress unwanted flanking transmission sufficiently;
    hence, the results are primarily representative of the performance of that junction
    when installed in that particular building structure. The measured quantities
    can be used to compare different products, or to express a requirement, or as
    input data for prediction methods, such as ISO 12354‑1 and ISO 12354‑2.
