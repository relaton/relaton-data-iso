abstract:
- language: en
  script: Latn
  content: ISO 10958-2:2015 specifies requirements and test methods for snowboards
    as sports equipment on which bindings are attached by means of inserts that are
    not removable and screws. It contains data for the manufacturer of snowboards,
    bindings and retention devices concerning dimensions, tests and other specifications
    for the binding mounting area. For dimensions with no tolerance indicated, a tolerance
    of ±1 mm is valid.
