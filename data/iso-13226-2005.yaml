abstract:
- language: en
  script: Latn
  content: ISO 13226:2005 specifies requirements for vulcanized rubbers in sheet form
    for use as standards in characterizing the effect of test liquids and service
    fluids. Details of the individual standard reference elastomers are listed in
    the annexes. The compounding and preparation ensure that the property profile
    agrees sufficiently with that of the material group represented, while the simple
    formulation ensures reliable reproducibility. The specified property changes of
    the SRE when in contact with a fluid under specified conditions may be included
    as supplementary data in specifications for the fluid concerned. The standard
    is not designed to provide formulations of elastomeric-product compositions for
    actual service.
