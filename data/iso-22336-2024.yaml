abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines on the design and development of an
    organizational resilience policy and strategy. It includes: —     how to design
    and formulate a resilience policy; —     how to design strategy to achieve the
    objectives of a resilience policy; —     how to determine priorities for implementation
    of the organization’s resilience initiatives; —     how to establish a cooperative
    and coordinated capability to enhance resilience. This document is applicable
    to organizations seeking to enhance resilience. It is not specific to any industry
    or sector. It can be applied throughout the life of an organization to enhance
    resilience. This document does not provide guidance on the development of an organizational
    resilience capability.'
