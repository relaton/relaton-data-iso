abstract:
- language: en
  script: Latn
  content: ISO 16474-1:2013 provides information and general guidance relevant to
    the selection and operation of the methods of exposure described in detail in
    subsequent parts. It also describes general performance requirements for devices
    used for exposing paints and varnishes to laboratory light sources. Information
    about such performance requirements is required only by producers of artificial
    accelerated weathering or artificial accelerated irradiation devices. ISO 16474-1:2013
    also provides information on the interpretation of data from artificial accelerated
    weathering or artificial accelerated irradiation exposures.
