abstract:
- language: en
  script: Latn
  content: ISO 28003:2007 contains principles and requirements for bodies providing
    the audit and certification of supply chain security management systems according
    to management system specifications and standards such as ISO 28000. It defines
    the minimum requirements of a certification body and its associated auditors,
    recognizing the unique need for confidentiality when auditing and certifying/registering
    a client organization. Requirements for supply chain security management systems
    can originate from a number of sources, and ISO 28003:2007 has been developed
    to assist in the certification of supply chain security management systems that
    fulfil the requirements of ISO 28000, Specification for security management systems
    for the supply chain, and other supply chain security management system International
    Standards. The contents of ISO 28003:2007 may also be used to support certification
    of supply chain security management systems that are based on other specified
    supply chain security management system requirements. ISO 28003:2007 provides
    harmonized guidance for the accreditation of certification bodies applying for
    ISO 28000 (or other specified supply chain security management system requirements)
    certification/registration; defines the rules applicable for the audit and certification
    of a supply chain security management system complying with the supply chain security
    management system standard's requirements (or other sets of specified supply chain
    security management system requirements); provides the customers with the necessary
    information and confidence about the way certification of their suppliers has
    been granted.
