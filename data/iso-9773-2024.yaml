abstract:
- language: en
  script: Latn
  content: This document specifies a small-scale laboratory screening procedure for
    comparing the relative burning behaviour of vertically oriented thin and relatively
    flexible plastics specimens exposed to a low-energy-level flame ignition source.
    NOTE  These specimens cannot be tested using method B of IEC 60695-11-10:2013
    since they distort or shrink away from the applied flame source without igniting.
    This test method determines the afterflame and afterglow times of specimens. The
    classification system described in Annex A is intended for quality control and
    the preselection of component materials for products. The classification established
    by this method of test is applicable only to the material used for the specimens.
    NOTE  Test results are influenced by material components, e.g. pigments, fillers,
    concentrations of fire retardants.
