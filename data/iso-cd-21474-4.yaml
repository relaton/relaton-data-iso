abstract:
- language: en
  script: Latn
  content: This document gives the general requirements for detection of pathogens
    by multiplex molecular tests which simultaneously identify two or more nucleic
    acid target sequences of interest. This document is applicable to all multiplex
    methods used for examination using IVD medical devices and laboratory developed
    tests (LDTs). It provides information for both of qualitative/quantitative detection
    of nucleic acid target sequences. This document is intended as guidance for multiplex
    examinations that detect and/or quantify microbial pathogen nucleic acid target
    sequences from human clinical specimens. This document is applicable to any molecular
    in vitro diagnostic examination performed by medical laboratories. It is also
    intended to be used by laboratory customers, in vitro diagnostic developers and
    manufacturers, biobanks institutions, and commercial organizations performing
    biomedical research and regulatory authorities. This document is not applicable
    to metagenomics.
