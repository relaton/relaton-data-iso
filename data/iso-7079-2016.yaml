abstract:
- language: en
  script: Latn
  content: ISO 7079:2016 specifies the dimensions of core drills with parallel shanks
    and with Morse taper shanks. It includes two tables for each of the above specified
    types, giving respectively - the dimensions for the preferred diameter (see Tables
    1 and 2), and - the corresponding lengths defined in terms of diameter ranges
    (see Tables 3 and 4). The tables show only metric dimensions which are alone recommended
    in the future for this type of drill. Unless otherwise stated, these drills will
    be right-hand cutting drills.
