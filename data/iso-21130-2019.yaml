abstract:
- language: en
  script: Latn
  content: This document specifies the technical requirements, test methods, inspection
    rules and markings for major components of emergency towing arrangements (ETA)
    provided for tankers, gas carriers (LPG, LNG, etc.) and chemical vessels no less
    than 20 000 deadweight tonnes (DWT). It is only applicable to emergency towing
    arrangements as defined in 3.1. NOTE For any other applications, such as for mooring
    at a single point mooring (SPM) facility, the appropriate standards need to be
    referred to.
