abstract:
- language: en
  script: Latn
  content: This document focuses on the performance evaluation of uniform SERS substrates
    containing nanostructures. It outlines the characteristics and specifications
    of these substrates and provides testing methods for their performance evaluation.
    The standard applies to substrates with a uniform distribution of nanostructures
    that ensure reproducible SERS signals, and it may not apply to other types of
    SERS substrates with irregular or non-uniform features.
