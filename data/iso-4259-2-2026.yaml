abstract:
- language: en
  script: Latn
  content: This document specifies the methodology for applying precision estimates
    of a test method derived from the processes specified in ISO 4259-1. In particular,
    it specifies the procedures for setting the property specification limits based
    upon test method precision where the property is determined using a specific test
    method, and determines the specification conformance status when there are conflicting
    results between supplier and receiver. Other applications of this test method
    precision are briefly described in principle without the associated procedures.
    The procedures in this document have been designed specifically for petroleum
    and petroleum-related products, which are normally homogeneous. However, the procedures
    described in this document can also be applied to other types of homogeneous products.
    This document is not applicable to non-homogenous products.
