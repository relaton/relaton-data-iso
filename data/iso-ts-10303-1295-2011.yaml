abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1295:2011-10 specifies the application module for AP239 properties.
    The following are within the scope of ISO/TS 10303-1295:2011-10: the specification
    of a property definition; specification of property values; single numerical property
    values with units; ranges of numerical values; text as property value; specification
    of a property that is a list of properties; qualification of the property as to
    type, uncertainty, or meaning; specification of the definitions needed to assign
    management resource information to a class of properties; specification of the
    definitions needed to classify properties; classification of property definitions
    and values.'
