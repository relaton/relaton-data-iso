abstract:
- language: en
  script: Latn
  content: This document describes a coupling-force-dependent weighting of the r.m.s.
    value to the frequency-weighted acceleration, ahw. The procedure only applies
    to normal gripping situations (embracing a handle). If only part surfaces of the
    hand are exposed to vibration, the procedure is not applicable. The evaluation
    methods defined in this document are intended to enable research. This document
    provides guidance on an additional procedure to that defined in ISO 5349-1 for
    measuring and reporting hand-transmitted vibration exposures by taking into account
    the coupling force exerted on the vibrating surface. This document is intended
    to facilitate future research on hand-arm vibration risks and to complement data
    collected using the ISO 5349-1 methodology. This document does not apply as an
    alternative to ISO 5349-1. The data derived from this document does not apply
    to perform tasks in accordance with national regulations, guidelines or recommendations
    for workplace vibration or machinery vibration emissions. This document does not
    apply to the legal obligations related to the protection of workers from hand-arm
    vibration in the workplace and the declaration of vibration emissions from machinery.
    The methodology defined in this document is based only on biomechanical relationships
    between vibration transmission to the hand-arm system as a function of total forces.
    The influence of contact force and pressure on the surface of the hand remains
    unconsidered and requires further research.
