abstract:
- language: en
  script: Latn
  content: ISO 10104:2018 specifies the overall length and the maximum head thickness
    for double-headed box wrenches, deep offset (Form B) and modified offset (Form
    A). NOTE The wrenches covered by this document are the ones identified in ISO
    1703:2005 under reference numbers 1 1 02 06 0 and 1 1 02 05 0. ISO 10104:2018
    does not cover technical specifications for these products. Technical specifications
    are given in ISO 1711‑1:2016, series A.
