abstract:
- language: en
  script: Latn
  content: ISO 4492:2013 specifies a method by which the dimensional changes associated
    with compacting and sintering of metallic powders are compared with those of a
    reference powder when processed under similar conditions. The method applies to
    the determination of three types of dimensional changes involved with the processing
    of metallic powders, excluding powders for hardmetals.
