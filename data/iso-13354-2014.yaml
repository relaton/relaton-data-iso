abstract:
- language: en
  script: Latn
  content: 'ISO 13354:2014 specifies requirements for the selection of the diverter
    equipment for rigs used to drill shallow-gas-bearing formations. It covers both
    onshore and offshore drilling operations, and considers also the auxiliary equipment
    associated with floating rigs. The specified requirements concern the following
    diverter equipment: annular sealing devices; vent outlets; diverter valves; diverter
    piping. ISO 13554:2014 highlights the concerns associated with the selection of
    a marine floating drilling support. It covers safety issues concerning key rig
    equipment, and important steps of action required prior to starting the drilling
    operations. It provides only general guidelines regarding the response to be given
    to a shallow-gas flow.'
