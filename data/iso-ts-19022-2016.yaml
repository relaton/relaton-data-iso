abstract:
- language: en
  script: Latn
  content: ISO/TS 19022:2016 specifies a test method which allows predicting the aging
    rate of material specimens, e.g. plastics, under interest independent of the aging
    mechanisms as a function of radiant exposure. The UV irradiance of a simulated
    solar radiation (with a laboratory radiation source) will be extended above the
    normal maximum level on earth surface while keeping all relevant temperature parameters
    fixed. NOTE For translucent plastics, the surface temperatures are below the white
    standard temperature. In addition, the maximum temperature is not on the irradiated
    surface, it is somewhere inside the plastic material.
