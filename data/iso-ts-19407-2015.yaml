abstract:
- language: en
  script: Latn
  content: 'ISO/TS 19407:2015 comprises three shoe size conversion tables covering
    the major shoe sizing systems (Mondopoint, European and United Kingdom, as well
    as China, Japan and United States). The tables are based on measurement of foot
    length, this being the logical starting point for any shoe size marking system.
    The tables contain the following information: Table 1 ? Adults'' technical shoe
    size conversion; Table 2 ? Adults'' recommended shoe size marking (simplified);
    Table 3 ? Children''s size conversion.'
