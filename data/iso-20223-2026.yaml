abstract:
- language: en
  script: Latn
  content: This document defines, if needed, how to represent the situation features of an integral surface, or of a collection of integral surfaces, and how to identify them uniquely by an alphanumerical label in a technical product documentation (TPD). It also defines how to indicate the type of each situation feature or the type of each minimum set of situation features, and how to represent the positive direction of a situation feature. Annex A defines the cases where the representation of situation features is not required. Annex B defines how to represent the intrinsic mobilities inside a minimum set of situation features. Annex C defines the proportions and dimensions of the graphical symbols to be used.
