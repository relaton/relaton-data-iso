abstract:
- language: en
  script: Latn
  content: This document specifies a steam distillation and ion chromatography method
    for the determination of the mass fraction of total fluorine and chlorine in iron
    ore as follows. a) This method is applicable to the determination of mass fractions
    of fluorine from 0,005 % to 0,50 %. b) This method is applicable to the determination
    of mass fractions of chlorine from 0,008 % to 0,50 %. Ion chromatography (IC)
    appeared as a simple and efficient analytical technique that has been widely used
    for the routine analysis of ions especially halogens, nitrates, sulphate etc.
    IC offer green method for the analysis of inorganic ions, cause it need only water
    and small amount of alkali solution as an eluent. Moreover, it offer multiple
    advantages such as its low cost, selectivity, sensitivity, and most importantly
    its accessibility to most of the developing countries laboratories as compared
    to other expensive and heavy analytical techniques. Therefore, this standard describes
    an option for the sensitive and cost-effective method for the simultaneous determination
    of fluorine and chlorine contents in complex iron ore samples. This standard is
    cost-effective, green and simple to conduct.
