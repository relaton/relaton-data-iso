abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for project specific product and
    process qualification of field applied wet thermal insulation systems applied
    at interfaces (e.g. field joints) and pre-fabricated insulation in the petroleum
    and natural gas industries. This document is applicable to wet thermal insulation
    systems submerged in seawater. This document is not applicable to: —     the project
    qualification of anticorrosion coatings or the requirements for application thereof;
    —     thermal insulation in the annulus of a steel pipe-in-pipe system.'
