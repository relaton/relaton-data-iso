abstract:
- language: en
  script: Latn
  content: ISO/TS 10798:2011 establishes methods to characterize the morphology, and
    to identify the elemental composition of catalysts and other inorganic impurities
    in raw and purified single-wall carbon nanotube (SWCNT) powders and films, using
    scanning electron microscopy and energy dispersive X-ray spectrometry analysis.
    The methods described in ISO/TS 10798:2011 for SWCNTs can also be applied to the
    analysis of multiwall carbon nanotubes (MWCNTs).
