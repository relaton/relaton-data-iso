abstract:
- language: en
  script: Latn
  content: 'This document specifies quality measures for quantitatively measuring
    quality characteristics that are specified by ISO 8000-210 for use with sensor
    data. The following are within the scope of this document: —     fundamental principles
    and assumptions for measuring the quality of sensor data; —     quality measures
    for sensor data, in respect of corresponding quality characteristics and data
    anomalies; —     requirements for using data quality characteristics and data
    quality measures for measuring the quality of sensor data. The following are outside
    the scope of this document: —     analogue, image, video and audio data that are
    captured by sensors; —     signal processing that converts or modifies analogue
    data to create digital data; —     methods to measure and improve data quality.'
