abstract:
- language: en
  script: Latn
  content: |-
    This document defines functional and technical requirements for solutions addressing the classification, marking, handling and sharing of sensitive documents. It complements ISO 4669-1, which specifies requirements for information classification, marking and handling (ICMH).
    This document addresses solutions that control and distribute content in digital format, both inside and outside the organization owning the content.
    The distribution of content by means of physical media is beyond the scope of this document.
