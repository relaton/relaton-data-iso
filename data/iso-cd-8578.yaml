abstract:
- language: en
  script: Latn
  content: ISO 8578:2012 specifies the format for the marking of data or symbols for
    optical characteristics on microscope objectives and eyepieces and the positioning
    of the data. It makes recommendations for the marking of additional information,
    particularly colour coding of rings designating the magnification of objectives
    and the immersion media with which they are used.
