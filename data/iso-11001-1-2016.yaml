abstract:
- language: en
  script: Latn
  content: ISO 11001-1:2016 specifies the essential dimensions for the attachment
    of three-point hitch implements to agricultural wheeled and track-laying tractors
    equipped with a three-point free link hitch according to ISO 730 or ISO 8759‑1
    and a U-frame hitch coupler. NOTE In general the dimensions associated with the
    tractor and implement for use with hitch couplers are the same as those for the
    three-point linkage specified in ISO 730 or ISO 8759‑1, and those for the clearance
    zone specified in ISO 2332. The three-point hitch coupler systems constitute a
    special method of implement mounting. The hitch couplers are an additional component
    located between the three-point linkage and the implement, making it possible
    to hitch and unhitch from the operator's seat. Due to the special construction
    and function of hitch couplers, it can be necessary to vary the length of the
    upper and lower links indicated in the referenced standards. ISO 11001-1:2016
    applies to categories 1, 2N, 2, 3N, 3, 4N, and 4 of agricultural wheeled and track-laying
    tractors as defined in ISO 730 or ISO 8759‑1.
