abstract:
- language: en
  script: Latn
  content: This International Standard specifies minimum requirements for instruments
    and systems that fall into the class of corneal topographers (CTs). It also specifies
    tests and procedures to verify that a system or instrument complies with this
    International Standard and thus qualifies as a CT according to this International
    Standard. It also specifies tests and procedures that allow the verification of
    capabilities of systems that are beyond the minimum requirements for CTs. This
    International Standard defines terms that are specific to the characterization
    of the corneal shape so that they may be standardized throughout the field of
    vision care. This International Standard is applicable to instruments, systems
    and methods that are intended to measure the surface shape of the cornea of the
    human eye. NOTE The measurements can be of the curvature of the surface in local
    areas, three-dimensional topographical measurements of the surface or other more
    global parameters used to characterize the surface. It is not applicable to ophthalmic
    instruments classified as ophthalmometers.
