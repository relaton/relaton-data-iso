abstract:
- language: en
  script: Latn
  content: ISO/TS 22595-2:2008 applies to compressor units for dental air and specifies
    quality requirements for dental air, fittings, pipe lines and valves in the plant
    area, used to source compressed air for the dental units, dental instruments and
    technical dental lab equipment. ISO/TS 22595-2:2008 gives recommended guidelines
    for performance as well as test procedures for compressor units for dental air
    with at least a compressor motor set including compressor head, air receiver,
    air dryer system, condensed water tap, pressure switch, valves, pipes, fittings
    and quality requirements for dental air.
