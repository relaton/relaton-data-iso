abstract:
- language: en
  script: Latn
  content: ISO/TS 16922 gives the guidelines for the methods and odorants to be used
    in the odorization of natural gas. ISO/TS 16922 also specifies the general requirements
    for odorants, the physical and chemical properties of commonly used sulfur-containing
    odorants, the principles for the determination of odour intensity, the odorization
    technique (including handling and storage of odorants) and the control of odorization
    of natural gas.
