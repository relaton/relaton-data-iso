abstract:
- language: en
  script: Latn
  content: 'ISO 12677-2:2007 specifies traditional ("wet") methods for the chemical
    analysis of aluminosilicate refractory products and raw materials. The methods
    are applicable to the determination of the following: silicon(IV) oxide (SiO2)aluminium
    oxide (Al2O3)iron(III) oxide (total iron oxide calculated as Fe2O3)titanium(IV)
    oxide (TiO2)manganese(II) oxide (MnO)calcium oxide (CaO)magnesium oxide (MgO)sodium
    oxide (Na2O)potassium oxide (K2O)chromium(III) oxide (Cr2O3)zirconium oxide (ZrO2)phosphorous(V)
    oxide (P2O5) This part of ISO 12677 gives alternatives to the X-ray fluorescence
    (XRF) method given in ISO 12677:2003.'
