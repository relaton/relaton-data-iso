abstract:
- language: en
  script: Latn
  content: This document outlines the minimum skill requirements and competencies
    necessary for the various trades employed in surface preparation and liquid paint
    application. The document is not intended to be a training manual or training
    course and does not include trade certification. NOTE Furthermore, the document
    contents can be used by training providers, colleges, certification bodies, institutions,
    etc., to ensure the minimum skill levels are achieved and a consistent framework
    is established across various industries in numerous countries (to move into introduction/Foreword).
