abstract:
- language: en
  script: Latn
  content: 'ISO 22262-2:2014 specifies procedures for quantification of asbestos mass
    fractions below approximately 5 %, and quantitative determination of asbestos
    in vermiculite, other industrial minerals and commercial products that incorporate
    these minerals. ISO 22262-2:2014 is applicable to the quantitative analysis of:
    a) any material for which the estimate of asbestos mass fraction obtained using
    ISO 22262-1 is deemed to be of insufficient precision to reliably classify the
    regulatory status of the material, or for which it is considered necessary to
    obtain further evidence to demonstrate the absence of asbestos; b) resilient floor
    tiles, asphaltic materials, roofing felts and any other materials in which asbestos
    is embedded in an organic matrix; c) wall and ceiling plasters, with or without
    aggregate; d) mineral products such as wollastonite, dolomite, calcite, talc or
    vermiculite, and commercial products containing these minerals. It is not the
    intent of ISO 22262 to provide instruction in the fundamental microscopical and
    analytical techniques.'
