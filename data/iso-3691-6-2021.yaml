abstract:
- language: en
  script: Latn
  content: 'This document gives safety requirements and the means for their verification
    for self-propelled carriers designed for carrying burdens without lifting, as
    defined in ISO 5053‑1:2020, and/or personnel carriers, having three or more wheels,
    a maximum speed not exceeding 56 km/h and a load capacity not exceeding 5 000 kg
    (hereafter referred to as carriers or trucks). This document is applicable to
    trucks equipped with a platform (which can be tilting) for the purpose of carrying
    materials or with a number of seats for the purpose of transporting passengers.
    It is not applicable to: —    vehicles intended primarily for earth-moving or
    over-the-road hauling; —    driverless trucks; —    pedestrian controlled trucks;
    —    golf cars; —    tractors with a drawbar pull up to and including 20 000 N
    equipped with a platform for the purpose of carrying materials. This document
    deals with all significant hazards, hazardous situations or hazardous events,
    as listed in Annex A, relevant to the applicable machines when used as intended
    and under conditions of misuse which are reasonably foreseeable by the manufacturer.
    This document does not deal with hazard due to the risk of break-up during operation.
    It does not establish requirements for hazards that can occur when using trucks
    on public roads or when operating in potentially explosive atmospheres. It does
    not establish requirements to provide fire extinguishers. Regional requirements,
    additional to the requirements given in this document, are addressed in EN 16307‑6:2014
    and ISO/TS 3691‑8:2019.'
