abstract:
- language: en
  script: Latn
  content: This document specifies a method for the generation of tyre and road wear
    particles (TRWP) in a road simulator laboratory that is representative of actual
    driving conditions. Guidance is provided for the road simulator system, test pavement
    and tyres, vacuum collection system, monitoring and reporting. This method is
    applicable for the collection of TRWP from a known pavement and tyre type under
    realistic driving conditions without the inference of road surface contaminants
    (e.g. brake dust, exhaust, grease). There is a possibility that this method is
    not relevant for studded tyres.
