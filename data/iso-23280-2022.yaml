abstract:
- language: en
  script: Latn
  content: This document specifies a test method to evaluate energy performance of
    electric motorcycles and mopeds by measuring performance of a test motor system
    (3.4) to be installed to an electric moped or motorcycle under consideration.
    The test is carried out on a motor dynamometer test bench where the traction motor
    system is connected to a load motor system (3.3) that simulates resistance torque
    arising from running resistance of vehicle and drive train friction loss and inertia
    effect. This method provides estimates of specific energy consumption and range
    of an electric moped or motorcycle to which the traction motor system is intended
    to be applied. This document is only applicable to two-wheeled motorcycles and
    mopeds. NOTE      This test method is applicable to motorcycle or moped regardless
    of types of power transmission devices, such as chains, belts, gears, ratio controllable
    CVTs, shaft drives, direct drives, etc., once gear ratios (ratio of input to output
    speed) and transmission efficiencies (ratio of input to output torque) are provided.
