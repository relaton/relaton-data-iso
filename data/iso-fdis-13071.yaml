abstract:
- language: en
  script: Latn
  content: 'This document specifies the test conditions for the determination of the tensile properties of flat, monolayer fibre-reinforced plastics, based upon the general principles given in ISO 527-1. Two methods are described: Method A - Reduced force clamping, and Method B - Direct clamping. The methods are used to investigate the tensile behaviour of test specimens and for determining the tensile strength, tensile modulus, and failure strain under the specified conditions when loaded in the fibre direction. The methods are applicable to monolayer materials consisting of fibre reinforced thermoset or thermoplastic composites manufactured from pre impregnated materials (prepregs) The reinforcement fibres covered by this test method include glass fibres, carbon fibres, aramid fibres, and other comparable synthetic or natural fibres.'
