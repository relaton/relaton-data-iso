abstract:
- language: en
  script: Latn
  content: 'This document outlines: descriptions of use cases for identified application domains that benefit from additional semantic metadata support in office documents; descriptions of semantic metadata requirements from experts of identified application domains; specifications of possible technical strategies for associating domain-specific semantic metadata with office documents entities. This document applies to users of office documents, for example, publishers, librarians, archivists, data scientists and other document users, as well as office software developers and service system integrators. This document focuses on the methods of supporting various kinds of metadata, rather than on metadata itself.'
