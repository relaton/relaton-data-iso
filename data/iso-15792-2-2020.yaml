abstract:
- language: en
  script: Latn
  content: This document specifies the preparation of butt weld test pieces and specimens.
    The test pieces and specimens are used to determine the strength and impact properties
    of welded joints when testing welding consumables with single-run and two-run
    techniques. This document is applicable to welding consumables for arc welding
    of steel. This document is not suitable for electro-slag or electro-gas welding.
