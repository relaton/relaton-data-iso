abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1669:2006 specifies the application module for Fabrication
    requirement. ISO/TS 10303-1669:2006 deals with the representation of requirements
    for fabrication that are typically defined by the design organization, in addition
    to generic fabrication technology requirements, including a generic capability
    for sourcing requirements that are applicable to fabrication. The following are
    within the scope of ISO/TS 10303-1669:2006: substrate thickness requirements;substrate
    line width classification;substrate land width classification;substrate line width
    class requirements;substrate land width class requirements.'
