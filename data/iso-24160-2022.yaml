abstract:
- language: en
  script: Latn
  content: This document specifies methods for preventing the spread of waste odour
    and the leakage of leachate during the collection and transportation of waste
    in refuse collection vehicles (RCVs), when the control of the spread of waste
    odour and leakage of leachate is required in order to protect the surrounding
    environment. This document is not applicable in cases when it is not necessary
    to provide control of waste odour or leachate due to the composition or packaging
    of waste and there is no influence on the environment due to the loaded waste.
