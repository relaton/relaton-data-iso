abstract:
- language: en
  script: Latn
  content: ISO 19880-1:2020 covers the requirement of the hydrogen fuelling stations
    for risk management, hydrogen supply safety and operation, equipment and components,
    dispensing systems, hydrogen quality, electrical, instrumentation and control
    system, station inspection and tests, operation, technical documentation, inspection
    and maintenance. But some requirements may not apply to mobile hydrogen stations.
    Thus, ISO 19880-1:2020 will be used as a guidance and a reference document for
    the future Technical Specification.
