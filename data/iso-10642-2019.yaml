abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of hexagon socket countersunk
    head screws with reduced loadability due to head design, in steel and stainless
    steel, with metric coarse pitch threads M2 to M20, and with product grade A. NOTE
    1 Other dimensional options are given in ISO 888, ISO 965-1 and ISO 4753. NOTE
    2 The reduced loadability (related to the countersunk head dimensions in combination
    with penetration of the hexagon socket specified in this document) implies a limitation
    of ultimate tensile load; see Table 5. NOTE 3 Particular attention is needed to
    ensure alignment of the countersunk head with the bearing surface of the countersink
    in the assembly.
