abstract:
- language: en
  script: Latn
  content: ISO/TS 22745-40:2010 is a specialization of ISO/TS 29002-10 that specifies
    a conceptual information model and an exchange file format for catalogues. A catalogue
    is a collection of master data records. A master data record is made up of characteristic
    data expressed as property value pairs, where the property is identified by reference
    to a concept in an open technical dictionary. The conceptual information model
    is in Unified Modeling Language (UML). The physical file format is specified via
    an Extensible Markup Language (XML) schema.
