abstract:
- language: en
  script: Latn
  content: ISO 19072-2:2013 defines the performance criteria and requirements of a
    three-way connection interface, including ground connection, linking the pyrotechnic
    device and harness connector built into a road vehicle. Performance criteria and
    requirements are also defined for a sealed variant of the pyrotechnic device/initiator
    harness connector assembly. Performance criteria and requirements are also defined
    for a two-way (without ground) variant of the pyrotechnic device/initiator harness
    connector assembly.
