abstract:
- language: en
  script: Latn
  content: ISO 24801-1:2014 specifies the competencies required of a scuba diver in
    order to obtain a scuba diver qualification from a training organization attesting
    that he/she has met or exceeded scuba diver level 1 ("Supervised diver"), and
    specifies evaluation criteria for these competencies. It also specifies the conditions
    under which training is provided, in addition to the general requirements for
    recreational diving service provision in accordance with ISO 24803. ISO 24801-1:2014
    applies to training and evaluation in recreational scuba diving.
