abstract:
- language: en
  script: Latn
  content: ISO 7206-6:2013 specifies test methods and the fatigue performance for
    the endurance properties, under specified laboratory conditions, of the neck region
    of stemmed femoral components of total hip joint prostheses and stemmed femoral
    components used alone in partial hip joint replacement. It is applicable to modular
    and non-modular designs made of metallic or non-metallic materials. It also specifies
    the test conditions so that the important parameters that affect the hip femoral
    components are taken into account and describes how the specimen is set up for
    testing.
