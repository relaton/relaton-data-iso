abstract:
- language: en
  script: Latn
  content: This International Standard is intended as a guideline for clinical researchers
    working with condoms. It suggests a series of laboratory tests to be conducted
    on the products to be used in any clinical investigation, so that it will be easier
    to relate the clinical results to the design and quality of the condoms used.
    This International Standard is not applicable to the design of clinical investigations.
