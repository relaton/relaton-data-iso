abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of samples of silica with ordered
    nanopore array (SONA) to be measured in powder form and the industrially available
    measurement methods used to determine said characteristics. This document provides
    a sound base for the research, development and commercialization of SONA for various
    applications. This document excludes silica-gel, fumed silica and chemically modified
    SONA. NOTE       The pore size of SONA ranges usually from one nanometre to several
    tens of nanometres.
