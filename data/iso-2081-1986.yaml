abstract:
- language: en
  script: Latn
  content: 'This second edition cancels and replaces the first edition (i. e. ISO
    2081:1973). Is not applicable to coatings applied to sheet, strip or wire in the
    unfabricated form, to close-coiled springs, for other than protective or decorative
    purposes. Includes information to be supplied by the purchaser to the electroplater
    and requirements for heat treatment. Coating thickness of threaded components:
