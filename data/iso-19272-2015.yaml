abstract:
- language: en
  script: Latn
  content: ISO 19272:2015 specifies a glow discharge optical emission spectrometric
    (GD-OES) method for determination of the mass fraction Carbon, Silicon, Manganese,
    Phosphorus, Sulfur, Chromium, Nickel, Aluminium, Titanium and Copper in low alloyed
    steels. The content ranges to which the method is applicable are shown in Table
    1. Table 1 ? Content ranges Element Content ranges mass fraction % C 0,060 to
    0,35 Si 0,14 to 1,50 Mn 0,090 to 0,70 P 0,010to 0,070 S 0,005 to 0,050 Cr 0,008
    to 0,65 Ni 0,050 to 0,50 Al 0,006 to 0,90 Ti 0,014 to 0,13 Cu 0,005 to 1,00
