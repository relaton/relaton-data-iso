abstract:
- language: en
  script: Latn
  content: Specifies criteria for access systems - steps, ladders, walkways, platforms,
    grab rails (handrails), grab handles, guardrails and enclosure entrance and exit
    openings as they relate to aiding the operator and servicemen in performing their
    functions on the machinery. Applies to access systems to the operator's station
    and to service points on earth-moving machinery as defined in ISO 6165 while the
    machinery is parked in accordance with manufacturer's instructions.
