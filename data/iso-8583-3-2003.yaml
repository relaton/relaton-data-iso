abstract:
- language: en
  script: Latn
  content: ISO 8583-3:2003 establishes the role of the maintenance agency (MA) and
    specifies the procedures for adding messages and data elements to ISO 8583-1 and
    to codes listed in Annex A of ISO 8583-1. The responsibilities of the MA relate
    to all message type identifiers and classes, data elements and sub-elements, dataset
    identifiers and codes within ISO 8583-1, with the exception of Institution Identification
    Codes.
