abstract:
- language: en
  script: Latn
  content: This document specifies, in conjunction with ISO 22002-100, requirements
    for establishing, implementing and maintaining prerequisite programmes (PRPs)
    to control feed safety hazards in feed and animal food, and materials intended
    for use in the production of feed and animal food. Feed safety hazards in this
    context relate to attributes that have a potential to affect adversely animal
    and/or human health. This document is applicable to all organizations, regardless
    of size or complexity. This document does not apply to other parts of the food
    supply chain. Exclusions to requirements can be supported by a sufficient justification
    that ensures that the exclusion does not adversely impact food safety.
