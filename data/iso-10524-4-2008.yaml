abstract:
- language: en
  script: Latn
  content: 'ISO 10524-4:2008 applies to the types of low-pressure regulators listed
    below and intended to be used with the following medical gases in the treatment,
    management, diagnostic evaluation and care of patients: oxygen; nitrous oxide;
    medical air; helium; carbon dioxide; xenon; specified mixtures of the gases listed
    above; air for driving surgical tools; nitrogen for driving surgical tools; oxygen-enriched
    air. The types of low-pressure regulators covered by ISO 10524-4:2008 are as follows:
    low-pressure regulators intended to be connected to terminal units of medical
    gas pipeline systems complying with ISO 7396-1; low-pressure regulators with integral
    flow-metering devices intended to be connected to terminal units of medical gas
    pipeline systems complying with ISO 7396-1; low-pressure regulators intended to
    be connected to terminal units attached to pressure regulators complying with
    ISO 10524-1 or ISO 10524-3; operator-adjustable low-pressure regulators for air
    or nitrogen for driving surgical tools that are an integral part of a medical
    gas pipeline system complying with ISO 7396-1.'
