abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-410:2006 specifies the application module for AP210 electronic
    assembly interconnect and packaging design. ISO/TS 10303-410:2006 deals with the
    representation of requirements for, design of, and application of electrical and
    electrotechnical components, interconnect, and assemblies. Included are capabilities
    to represent the various requirements and sources levied on these items, as well
    as constraints arising from manufacturing processes. Network and other analysis
    of proposed or actual design is supported, as is applications that map from the
    network listing to the layout. Two dimensional and three dimensional assembly
    and interconnect design is supported, as is microwave and embedded design. The
    following are within the scope of ISO/TS 10303-410:2006: the hierarchical description
    of the functionality of the electronic assembly or interconnect or devices that
    are used in an electronic assembly or interconnect; the hierarchical description
    of the functional objects that are combinations of one or more functional objects;
    the configuration management of the functional objects that are being developed
    concurrently;the configuration management of analytical models that are being
    developed concurrently;the explicit interface to analytic models that are used
    to define the behaviour of a functional object, a device, a physical object, an
    electronic assembly, or an interconnect; the description of the connection among
    the functional objects;the description of the connection among the devices used
    in the electronic assembly or interconnect; the description of the requirements
    for physical interconnection;the physical layout of the electronic assembly, including
    a description of the placement of the physical objects in the electronic assembly;
    the description of the bare interconnect, including the conductive and non-conductive
    materials and patterns; the functional and physical description of devices or
    physical objects, including material characteristics and composition; the functional
    usage and physical usage description of devices or physical objects, including
    material characteristics and composition; the functional and physical description
    of devices or physical objects realized as part of the interconnect, including
    material characteristics and composition; the functional usage and physical usage
    description of devices or physical objects realized as part of the interconnect,
    including material characteristics and composition; the description of the requirements
    and constraints on the design of the electronic assembly that assure product performance,
    incorporate quality, and enhance manufacturing process capabilities; the description
    of the requirements and constraints on the design of the interconnect that assure
    product performance, incorporate quality, and enhance manufacturing process capabilities;
    the configuration management of electronic assembly design descriptions;the configuration
    management of interconnect design descriptions;the allocation of certain details
    of the interconnect design description to the usage description of a physical
    object; the allocation of certain details of the electronic assembly design description
    to the usage description of a physical object; the description of electronic assemblies
    to implement various functional domains including, but not limited to, analogue,
    digital, video, radio frequency, and microwave; the description of interconnect
    to implement various functional domains including, but not limited to, analogue,
    digital, video, radio frequency, and microwave; the configuration management of
    constituent parts that are electronic assemblies or interconnect and that are
    being concurrently developed; the configuration management of documents that contain
    requirements;the allocation of requirements to functional objects, physical objects,
    and the physical implementation; the allocation of requirements from functional
    objects to their physical implementation;the allocation of each specific connection
    among the devices used in the electronic assembly to the component or group of
    components that realizes that connection; the association of characteristics to
    functional objects, physical objects, and analytical models; the identification
    of planned parameters for functional objects, electronic assemblies, interconnect,
    components, and analytical models; the identification of actual parameters for
    functional objects, electronic assemblies, interconnect, components, and analytical
    models.'
