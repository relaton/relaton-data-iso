abstract:
- language: en
  script: Latn
  content: Establishes the types, positions and functions of the driver operated controls
    on a two-wheeled motorcycle, in order to facilitate use. Annex A gives individual
    requirements for levers and pedals, including the maximum and minimum dimensions
    and clearances. Annex B specifies controls, indicators and tell-tales for which
    identification is obligatory and the appropriate graphical symbols.
