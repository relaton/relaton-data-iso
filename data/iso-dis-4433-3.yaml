abstract:
- language: en
  script: Latn
  content: The classification method in this part of ISO 4433 is used to determine
    the chemical resistance of pipes, fittings and valve components made of PVC-U,
    PVC-HI, PVC-M, PVC-A, PVC-O and PVC-C designed for the transport of chemicals
    in the absence of pressure and stresses, such as earth loads and dynamic internal
    stresses. To determine chemical resistance, the method uses the change in mass
    and changes in tensile properties that result from storing test pieces, taken
    from such pipes, fittings and valve components, in chemicals. The test is performed
    in accordance with ISO 4433-1. This part of ISO 4433 is also applicable to PVC-U,
    PVC-HI, PVC-M, PVC-A, PVC-O and PVC-C sheets, as appropriate.
