abstract:
- language: en
  script: Latn
  content: ISO/TR 19057:2017 reviews the use and application of acellular in vitro
    tests and methodologies implemented in the assessment of the biodurability of
    nanomaterials and their ligands in simulated biological and environmental media.
    ISO/TR 19057:2017 is intended to focus more on acellular in vitro methodologies
    implemented to assess biodurability and, therefore, excludes the general review
    of relevant literature on in vitro cellular or animal biodurability tests.
