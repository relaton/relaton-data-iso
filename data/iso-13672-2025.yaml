abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of parallel grooved pins with
    half-length diamond grooves (with closed ends), in steel and stainless steel,
    and with nominal diameters 1 mm to 25 mm. These grooved pins are designed to fulfil
    the main following functions: —     positioning or guiding, and —     relative
    rotation of the assembled parts, with a more significant insertion force (due
    to its shape) and a high level of pull-out resistance (due to the elastic fit
    behaviour of the pin). The general requirements (including functional principles
    for grooved pins and assembly) are specified in ISO 13669.'
