abstract:
- language: en
  script: Latn
  content: 'ISO 2929:2002 specifies the requirements for two groups of rubber hoses
    and rubber hose assemblies for loading and discharge of liquid hydrocarbon fuels
    with a maximum working pressure of 10 bar (1,0 MPa). Both groups of hoses are
    designed for: use with hydrocarbon fuels having an aromatic-hydrocarbon content
    not exceeding 50 % by volume and containing up to 15 % of oxygenated compounds;operation
    within the temperature range of -30 °C to +70 °C, undamaged by climatic conditions
    of -50 °C to +70 °C when stored in static conditions. ISO 2929:2002 is not applicable
    to hoses and hose assemblies for LPG systems, aviation fuel systems, fuel station
    systems or marine applications.'
