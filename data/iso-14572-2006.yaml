abstract:
- language: en
  script: Latn
  content: ISO 14572:2006 specifies test methods and requirements for basic and high-performance
    round, screened and unscreened, multi-core sheathed cables, intended for use in
    road vehicle applications. The unscreened, single-core cables must be in accordance
    with ISO 6722. Other cores may be used but, in these cases, the construction and
    tests required to ensure functionality of these cores must be agreed between the
    customer and supplier. See ISO 6722 for temperature classes.
