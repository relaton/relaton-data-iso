abstract:
- language: en
  script: Latn
  content: 'This document specifies the minimum requirements for the training, competence, and assessment of seafarers serving on board ships ships using battery energy storage systems. This document applies to: ●Ships utilizing lithium-ion batteries or energy-type supercapacitors as a main or auxiliary power source. ●Ships where the total capacity of the power battery group exceeds 100 kWh. ●Ships equipped with a Direct Current (DC) integrated electric propulsion system.'
