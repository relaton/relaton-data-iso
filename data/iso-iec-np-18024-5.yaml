abstract:
- language: en
  script: Latn
  content: 'Access to the data stored in a SEDRIS transmittal is through an Application
    Program Interface (API). The abstract specification for this API is defined in
    ISO/IEC 18023-1. Each part of ISO/IEC 18024 defines the binding of that abstract
    specification to a particular programming language. ISO/IEC 18024-5 will define
    a standard binding for the C++ programming language. This work will: • Leverage
    the existing standard 18024-4, SEDRIS language bindings – Part 4: C • Include
    other improvements that may be identified by JTC 1/SC 24 during the development
    of this work item'
