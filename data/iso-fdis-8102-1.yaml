abstract:
- language: en
  script: Latn
  content: This document specifies the emission limits in relation to electromagnetic
    disturbances and test conditions for lifts, escalators and moving walks, which
    are intended to be permanently installed in buildings. It is possible, however,
    that these limits do not provide full protection against disturbances caused to
    radio and TV reception when such equipment is used within distances given in Table
    1. This document is not applicable for apparatus which are manufactured before
    the date of its publication
