abstract:
- language: en
  script: Latn
  content: This International Standard presents general terms and definitions relevant
    to the field of spherical plain bearings. It deals with bearings, bearing parts
    and features, movements, angles and rod ends. NOTE — In addition to terms and
    definitions used in the three official ISO languages (English, French and Russian),
    this International Standard givesthe equivalent terms and definitions in the German
    language; these are published under the responsibility of the member body for
    Germany (DIN).However, only the terms and definitions given in the official languages
    can be considered as ISO terms and definitions.
