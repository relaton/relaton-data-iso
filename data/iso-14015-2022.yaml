abstract:
- language: en
  script: Latn
  content: 'This document gives guidance on how to conduct an environmental due diligence
    (EDD) assessment through a systematic process of identifying environmental aspects,
    issues and conditions as well as determining, if appropriate, their business consequences.
    This document does not provide guidance on how to conduct other types of environmental
    assessment, such as: a) environmental audits; b) environmental impact assessments;
    c) environmental performance, efficiency, or reliability assessment; d) intrusive
    environmental investigations and remediation.'
