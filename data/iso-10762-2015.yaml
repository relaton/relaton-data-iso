abstract:
- language: en
  script: Latn
  content: ISO 10762:2015 establishes mounting dimensions for cylinders for use at
    10 MPa [100 bar[1]], as required for interchangeability of these cylinders. NOTE
    This International Standard allows manufacturers of hydraulic equipment flexibility
    in the design of 10 MPa (100 bar) cylinders and does not restrict technical development;
    however, it does provide basic guidelines. [1] 1 bar = 0,1 MPa = 105 Pa; 1 MPa
    = 1 N/mm2.
