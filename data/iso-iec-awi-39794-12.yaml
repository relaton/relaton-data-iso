abstract:
- language: en
  script: Latn
  content: 'This document defines a data extension for ISO/IEC 39794-4 representation
    block, to include the information needed by forensic applications to record and
    analyse fingermarks, and specifies: — An extension of the generic extensible data
    interchange formats for the representation of friction ridge image data to include
    additional data related to fingermarks; — a tagged binary data format based on
    an extensible specification in ASN.1; — a textual data format based on an XML
    schema definition that are both capable of holding the same information; — examples
    of data record contents; — application specific requirements, recommendations,
    and best practices in data acquisition; and — conformance test assertions and
    conformance test procedures applicable to this document.'
