abstract:
- language: en
  script: Latn
  content: ISO 10896-6:2015 specifies safety requirements and means of verification
    for tilting operator's cabs of trucks covered by ISO 10896‑1 and ISO 10896‑2,
    where the seat index point (SIP) height is lifted not more than 400 mm when the
    cab is fully tilted. ISO 10896-6:2015 only deals with significant hazards, hazardous
    situations or hazardous events relevant to the tilting cab affixed to trucks.
