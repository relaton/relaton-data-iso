abstract:
- language: en
  script: Latn
  content: ISO 21150:2015 gives general guidelines for the detection and identification
    of the specified microorganism Escherichia coli in cosmetic products. Microorganisms
    considered as specified in this International Standard might differ from country
    to country according to national practices or regulations. In order to ensure
    product quality and safety for consumers, it is advisable to perform an appropriate
    microbiological risk analysis, so as to determine the types of cosmetic products
    to which this International Standard is applicable. Products considered to present
    a low microbiological (see ISO 29621) risk include those with low water activity,
    hydro-alcoholic products, extreme pH values, etc. The method described in this
    International Standard is based on the detection of Escherichia coli in a non-selective
    liquid medium (enrichment broth), followed by isolation on a selective agar medium.
    Other methods may be appropriate, depending on the level of detection required.
    NOTE For the detection of Escherichia coli, subcultures can be performed on non-selective
    culture media followed by suitable identification steps (e.g. using identification
    kits). Because of the large variety of cosmetic products within this field of
    application, this method might not be suited to some products in every detail
    (e.g. certain water-immiscible products). Other International Standards (ISO 18415)
    may be appropriate. Other methods (e.g. automated) can be substituted for the
    test presented here provided that their equivalence has been demonstrated or the
    method has been otherwise shown to be suitable.
