abstract:
- language: en
  script: Latn
  content: ISO 13078-2:2016 determines a degree of firing to be implemented by the
    user. It represents a test method for adapting the firing program of a dental
    furnace by determining the degree of firing of fired test specimens for a dental
    ceramic. The test method is suitable for powdered dental ceramics according to
    ISO 6872, Type I. The test method enables monitoring of the temperature control
    in the dental furnace by evaluating the firing degree of a dental ceramic. The
    test method is also suitable for evaluating the reproducibility of the firings
    in a dental furnace or for comparing several dental furnaces.
