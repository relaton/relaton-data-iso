abstract:
- language: en
  script: Latn
  content: This document provides guidance on fulfilling the requirements contained
    in ISO 6183:2009, 6.4.1 and 7.4.1 and ISO 14520-1:2015, 5.2.1 h and 5.3 h, in
    respect to over and under pressurisation venting and post discharge extract. It
    considers the design, selection and installation of vents to safeguard the structural
    integrity of enclosures protected by fixed gaseous extinguishing systems and the
    post discharge venting provisions where used.
