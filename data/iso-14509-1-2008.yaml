abstract:
- language: en
  script: Latn
  content: ISO 14509-1:2008 specifies the conditions for obtaining reproducible and
    comparable measurement results of the maximum sound pressure level of airborne
    sound generated during the passage of powered recreational craft of up to 24 m
    length of hull, including inboards, stern drives, personal watercraft (PWC) and
    outboard motors. It also specifies standard craft based type tests for stern drives
    with integral exhaust systems and for outboard motors. It also specifies the procedure
    to be followed if, in addition to the maximum sound pressure level, the determination
    of the sound exposure level is desired. The accuracy grade of the acoustical test
    procedures specified in ISO 14509-1:2008 is engineering grade (grade 2).
