abstract:
- language: en
  script: Latn
  content: ISO 15143-2:2010 specifies a data dictionary for the exchange of data in
    worksite data‑controlled construction operations as specified in ISO 15143-1.
    It also gives definitions of terms used in relation to the data dictionary. For
    the purposes of data exchange between different systems, it includes identification,
    definition and specification of common items of data to be exchanged on typical
    earth-moving construction worksites, definition of application schema, metadata
    describing the attributes of each data element, and basic normative data elements
    with their attributes (in tabular format).
