abstract:
- language: en
  script: Latn
  content: 'This document specifies for passenger lifts and goods passenger lifts:
    the verification of door locking devices; the verification of safety gears; the
    verification of overspeed governors; the verification of buffers; the verification
    of safety circuits and SIL-rated circuits; the verification of ascending car overspeed
    protection means; the verification of unintended car movement protection means;
    the verification of rupture valves and one-way restrictors; the verification of
    suspension and compensation means; the discard criteria for suspension means and
    sheaves; the calculation of guide rails; the calculation of rams, cylinders, rigid
    pipes and fittings; the evaluation of the traction; the evaluation of the safety
    factor on suspension means; the pendulum shock tests; the fault exclusion for
    electric and electronic components; the design rules for SIL-rated circuits. This
    document is not applicable to passenger lifts, goods passenger lifts or lift components,
    which are installed or manufactured before the date of its publication.'
