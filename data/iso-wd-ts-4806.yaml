abstract:
- language: en
  script: Latn
  content: This document provides a general guideline to evaluate number concentration
    of mono-dispersed or narrowly-size-distributed suspended particles in mainly aqueous
    liquid. Guide to prepare working references by including dilution as well as it
    to evaluate concentration by using calibration curve fitting method with working
    references are described. This guideline is intended for users of a commercial
    measurement equipment, whose method complies with ISO standards for particle characterization,
    in order to evaluate the equivalent concentration within their error allowance
    for their industrial application. The points to note about data conversion between
    number and mass concentration as well as error sources are also described.
