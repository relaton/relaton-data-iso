abstract:
- language: en
  script: Latn
  content: ISO 376:2004 covers the calibration of force-proving instruments used for
    the static verification of uniaxial testing machines (e.g. tension/compression
    testing machines) and describes a procedure for classifying these instruments.
    ISO 376:2004 generally applies to force-proving instruments in which the force
    is determined by measuring the elastic deformation of a loaded member or a quantity
    which is proportional to it.
