abstract:
- language: en
  script: Latn
  content: 'ISO 5359:2014 specifies requirements for low-pressure hose assemblies
    intended for use with the following medical gases: oxygen, nitrous oxide, medical
    air, helium, carbon dioxide, xenon, specified mixtures of the gases listed above,
    oxygen-enriched air, air for driving surgical tools, nitrogen for driving surgical
    tools, and for use with vacuum. It applies to hose assemblies operating at pressures
    up to 1 400 kPa and for vacuum systems at pressures not greater than 60 kPa absolute.
    It does not specify the dimensions and allocation of the gas-specific inlet and
    outlet connectors for the hose assemblies.It does not specify requirements for
    coaxial hoses used for the supply and removal of air for driving surgical tools.Nor
    does it specify the intended uses of hose assemblies.'
