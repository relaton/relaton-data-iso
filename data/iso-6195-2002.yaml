abstract:
- language: en
  script: Latn
  content: 'ISO 6195:2002 specifies dimensions and tolerances of housings for wiper
    rings used in reciprocating rod applications for fluid power cylinders. The range
    of rod diameters is from 4 mm to 360 mm. ISO 6195:2002 is applicable to the following
    four housing designs. Type A: recessed housings with undercut or separate cover
    to retain elastomeric wipers (these are the preferred housings for single lip
    wipers without integral rigid enforcement).Type B: open recessed housings for
    wipers with integral rigid enforcement, that are a press-fit in the housing.Type
    C: recessed housings with undercut to retain elastomeric wipers (these are the
    preferred housings for double lip wipers without integral rigid enforcement).Type
    D: recessed housings with undercut to retain elastomer-energized, plastic-faced
    wipers. ISO 6195:2002 does not otherwise specify the style, configurations, materials,
    or performance ratings for the wiper ring.'
