abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for tube-type tyres
    in automotive vehicles that require rubber flaps, in order to ensure they are
    protected against damages to the inner tube caused by the rim or tyre. This document
    is applicable to tyres for road vehicles. It does not apply to 2/3 wheeler and
    non-road tyres. Requirements and test methods for rubber flaps for non-road tyres
    are provided in Annex E.
