abstract:
- language: en
  script: Latn
  content: This document offers guidelines for the management of Healthcare Organizations,
    inclusive of healthcare suppliers and manufacturers of Autonomous Mobile Robots
    (AMRs). It is applicable when these organizations implement internal logistics
    in hospitals using AMRs. The document delineates the fundamental guidelines for
    the establishment and the operation of a Centralized Control System (CCS) required
    for AMR operation. It includes the key components necessary to ensure the safe
    and reliable logistics of pharmaceuticals within the hospital. The document encompasses
    the roles of the CCS in a unexpected functional failure response procedures, real-time
    monitoring information, managing hardware operation, communication targets, schedule
    management and task allocation, as well as record-keeping.
