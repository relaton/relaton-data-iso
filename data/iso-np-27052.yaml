abstract:
- language: en
  script: Latn
  content: This standard specifies a method for the calibration of tanks other than vertical cylindrical tanks having dimensions greater than 1.6 m by means of internal or external measurements using a Terrestrial laser scanner (TLS) and Point Cloud processing software, and for the subsequent compilation of tank capacity tables. This method is known as “3D scanning of non-vertical tanks” and is suitable for use as a working method or a referee method. The operation of 3D scanning, the corrections to be made and the calculations leading to the compilation of the tank capacity table are described. This method can be applied to abnormally deformed tanks, e.g. dented or non-circular tanks, and to tanks in service. This standard applies to horizontal tanks, spherical tanks, prismatic tanks and tanks with irregular geometrical shape, meant to store liqui(fied) products. For this method, there is no limitation with respect of the tilt of the tank, for the tilt deviation of the tank according to the vertical and the tilt correction have to be applied according to the method of calculation.
