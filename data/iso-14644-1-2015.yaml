abstract:
- language: en
  script: Latn
  content: ISO 14644-1:2015 specifies the classification of air cleanliness in terms
    of concentration of airborne particles in cleanrooms and clean zones; and separative
    devices as defined in ISO 14644‑7. Only particle populations having cumulative
    distributions based on threshold (lower limit) particle sizes ranging from 0,1
    µm to 5 µm are considered for classification purposes. The use of light scattering
    (discrete) airborne particle counters (LSAPC) is the basis for determination of
    the concentration of airborne particles, equal to and greater than the specified
    sizes, at designated sampling locations. ISO 14644-1:2015 does not provide for
    classification of particle populations that are outside the specified lower threshold
    particle-size range, 0,1 µm to 5 µm. Concentrations of ultrafine particles (particles
    smaller than 0,1 µm) will be addressed in a separate standard to specify air cleanliness
    by nano-scale particles. An M descriptor (see Annex C) may be used to quantify
    populations of macroparticles (particles larger than 5 µm). ISO 14644-1:2015 cannot
    be used to characterize the physical, chemical, radiological, viable or other
    nature of airborne particles.
