abstract:
- language: en
  script: Latn
  content: 'This document gives guidelines for determining the average surface density
    over a measured area of anodic oxide or of a coating deposited autocatalytically,
    mechanically, by chemical conversion, by electrodeposition, by hot dip galvanizing
    and by chemical or physical vapour deposition using gravimetric and other chemical
    analysis procedures that have attained some degree of national or international
    standardization. A variety of procedures are described and include: — gravimetric
    procedures for chemical or electrochemical dissolution of the coating or the substrate
    to determine the coating surface density; — gravimetric procedures for weighing
    the uncoated substrate and the coated (finished) specimen to determine the coating
    surface density; — analytical procedures that utilize dissolution of the coating
    for determination of the coating surface density by instrumental chemical analysis
    methods. With the exception of the gravimetric method as described in ISO 3892,
    this document does not give the measurement uncertainties of the methods cited.'
