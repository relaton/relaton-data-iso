abstract:
- language: en
  script: Latn
  content: ISO 11148-1:2011 specifies safety requirements for hand-held non-electric
    power tools (hereinafter "assembly power tools for non-threaded mechanical fasteners")
    intended for installation, tightening or removal of both breakstem and non-breakstem
    rivets, bolts, plugs and fasteners from one side of a workpiece into metals, plastics
    and other materials. The assembly power tools for non-threaded mechanical fasteners
    can be powered by compressed air, hydraulic fluid or internal combustion engines
    and are intended to be used by one operator and supported by the operator's hand
    or hands, with or without a suspension, e.g. a balancer. ISO 11148-1:2011 is applicable
    to breakstem fastener, rivet or plug tools, breakstem lockbolt tools, mandrel
    loaded riveting tools and rivet nut setters. ISO 11148-1:2011 is not applicable
    to special requirements and modifications of hand-held power tools for the purpose
    of mounting them in a fixture. ISO 11148-1:2011 deals with all significant hazards,
    hazardous situations or hazardous events relevant to assembly power tools for
    non-threaded mechanical fasteners when they are used as intended and under conditions
    of misuse which are reasonably foreseeable by the manufacturer, with the exception
    of the use of power tools in potentially explosive atmospheres.
