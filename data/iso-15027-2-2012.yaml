abstract:
- language: en
  script: Latn
  content: ISO 15027-2:2012 specifies performance and safety requirements for abandonment
    suits in emergency situations in work and leisure activities to protect the body
    of a user against the effects of cold water immersion, such as cold shock and
    hypothermia, including head, hand and feet protection. It is applicable for dry
    and wet abandonment suits. Constant wear suits are not covered by ISO 15027-2:2012.
    The requirements of constant wear suits are given in ISO 15027-1. Test methods
    are given in ISO 15027-3.
