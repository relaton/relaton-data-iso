abstract:
- language: en
  script: Latn
  content: This document specifies boundary dimensions, tolerances, internal clearances,
    and other technical requirements for self-lubricating spherical plain bearings
    of PTFE fabric liner type. Three types of these bearings are included as below：
    1) self-lubricating radial spherical plain bearings only with split outer ring;
    2) self-lubricating angular contact spherical plain bearings; 3) self-lubricating
    thrust spherical plain bearings.
