abstract:
- language: en
  script: Latn
  content: This document provides guideline for aligning geometrical representation
    from BIM to GIS and GIS to BIM. As a part of the framework for BIM-GIS information
    exchange and a technology roadmap on data sharing, this document provides a way
    of filtering out and aligning the types from different conceptual models defined
    in published ISO standards relating to geometric representation in both GIS and
    BIM domains. It illustrates the constraint when various geometric types are used
    and represented in different contexts such as curvature terrain or 2D vertical
    profile in linear reference system.
