abstract:
- language: en
  script: Latn
  content: This document specifies a method for the calibration of reference blocks
    to be used for the indirect and daily verification of Rockwell hardness testing
    machines and indenters, as specified in ISO 6508-2. This document also specifies
    requirements for Rockwell machines and indenters used for calibrating reference
    blocks and specifies methods for their calibration and verification. Attention
    is drawn to the fact that the use of hard metal for ball indenters is considered
    to be the standard type of Rockwell indenter ball.
