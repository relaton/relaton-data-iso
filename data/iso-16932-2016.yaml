abstract:
- language: en
  script: Latn
  content: ISO 16932:2016 determines resistance of security glazing products to natural
    threats characterized by simulated destructive-windstorm events. Classification
    is intended as a basis for judging the ability of glazing to remain essentially
    without openings during a tropical cyclone with wind speed of 50 m/s or greater.
    Impact by missile(s) and subsequent cyclic static-pressure differentials simulate
    conditions representative of windborne debris and pressures in a destructive windstorm.
    Glazing is tested in a standard frame. Classification is based on the potential
    hazard to human life using the appropriate wind speed, pressure and level of protection.
    The test method determines the performance of security glazing for use in fenestration
    assemblies under conditions representative of events that occur in severe, destructive-windstorm
    environments using simulated missile impact(s) followed by the application of
    cyclic static-pressure differentials. A missile-propulsion device, an air pressure
    system and a test chamber are used to model some conditions that can be representative
    of windborne debris and pressures in a windstorm environment. The performance
    determined by this test method relates to the ability of glazing in the building
    envelope to remain without openings during a windstorm.
