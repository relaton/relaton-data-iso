abstract:
- language: en
  script: Latn
  content: ISO 10326-1:2016 specifies basic requirements for the laboratory testing
    of vibration transmission through a vehicle seat to the occupant. These methods
    for measurement and analysis make it possible to compare test results from different
    laboratories for equivalent seats. It specifies the test method, the instrumentation
    requirements, the measuring assessment method and the way to report the test result.
    ISO 10326-1:2016 applies to specific laboratory seat tests which evaluate vibration
    transmission to the occupants of any type of seat used in vehicles and mobile
    off-road machinery. Application standards for specific vehicles refer to this
    document when defining the test input vibration that is typical for the vibration
    characteristics of the type or class of vehicle or machinery in which the seat
    is to be fitted. NOTE Examples of application standards are given in the bibliography.
