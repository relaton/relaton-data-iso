abstract:
- language: en
  script: Latn
  content: 'This document supports supply chain interoperability and integration and
    provides the fundamental structure for exchanging verified data in an industrial
    internet. Identifiers, like part numbers, are the shorthand for datasets throughout
    the supply chain. This document provides methods to verify identifiers and datasets
    behind identifiers used in the supply chain, specifically the format of and automated
    request types (verify, resolve, and search) and replies to those requests. The
    following are within the scope of this document: the syntax requirements and application
    protocol interface (API) for a request and response to a request for the verification
    of identifiers formatted in accordance with ISO 8000-115 (verify); the syntax
    requirements and API for a request and response to a request for a dataset of
    an identifier formatted in accordance with ISO 8000-115 (resolve); the syntax
    requirements and API for a request and response to a request to search for an
    identifier formatted in accordance with ISO 8000-115 given characteristic data
    (search). The following are outside the scope of this document: the methods used
    for the resolution of identifiers by the identifier issuer; the data elements
    required for resolution of identifiers.'
