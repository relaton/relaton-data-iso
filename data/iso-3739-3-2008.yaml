abstract:
- language: en
  script: Latn
  content: ISO 3739-3:2008 specifies the main requirements, including size designation
    and marking, of 5° tapered and flat base rims, with diameters not exceeding rim
    diameter code 15 for pneumatic tyres and for solid tyres for pneumatic tyre rims,
    primarily intended for industrial vehicles for use on prepared surfaces. ISO 3739-1
    gives the designation, dimensions and marking, and ISO 3739-2 gives the load ratings,
    of pneumatic tyres (metric series). ISO 10499-1 covers the designation, dimensions
    and marking of rubber solid tyres (metric series) for pneumatic tyre rims. Rim
    dimensions are specified for size and contour only. The tyre and wheel/rim manufacturers
    are consulted for confirmation of the suitability of the tyre/rim combinations,
    particularly with regard to rim profile and wheel strength.
