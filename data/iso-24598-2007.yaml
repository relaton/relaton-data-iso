abstract:
- language: en
  script: Latn
  content: ISO 24598:2007 specifies requirements for classification of solid wire
    electrodes, tubular cored electrodes and electrode/flux combinations (all-weld
    metal deposits) for submerged arc welding of creep-resisting and low-alloy elevated-temperature
    steels. One flux can be tested and classified with different electrodes. One electrode
    can be tested and classified with different fluxes. The solid wire electrode is
    also classified separately based on its chemical composition. ISO 24598:2007 is
    a combined specification providing for classification utilizing a system based
    upon the chemical composition of the solid wire electrode and all-weld metal deposit,
    or utilizing a system based upon the tensile strength of the all-weld metal deposit
    and the chemical composition of the solid wire electrode and all-weld metal deposit
    obtained with the electrode/flux combination.
