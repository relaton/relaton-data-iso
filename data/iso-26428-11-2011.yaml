abstract:
- language: en
  script: Latn
  content: ISO 24628-11:2011 defines additional frame rates for digital cinema of
    25, 30, 50 and 60 frames per second. These additional frame rates supplement the
    primary frame rates of 24 and 48 frames per second and are defined in order to
    ensure that the artistic intent of the content producer can be maintained at the
    point of delivery. ISO 24628-11:2011 defines the image characteristics of the
    additional frame rates individually at 25, 30, 50 and 60 frames per second, and
    also defines the resulting audio samples per edit unit.
