abstract:
- language: en
  script: Latn
  content: 'This document complies with the ISO 22166-1, ISO 22166-201 and FDIS 22166-202
    family standards providing requirements and guidelines on specifications on modularity
    for service robots focusing on robot application sectors; and in this context
    the document presents requirements and guidelines for modularity of physical assistant
    robots (or wearable exoskeletons). The document is targeted at the following user
    groups: — modular exoskeleton robot framework developers who specify performance
    frameworks in an unambiguous way; — exoskeleton module designers and/or manufacturers
    who supply end users or exoskeleton system integrators; — exoskeleton robot integrators
    who choose applicable modules for building a modular exoskeleton system. This
    document includes guidelines on how to apply existing safety and security standards
    to exoskeleton robot modules. This document is not a safety standard. This document
    applies specifically to wearable exoskeleton robots, although the modularity principles
    presented in this document can be utilized by framework developers, module manufacturers,
    and module integrators from other fields not necessarily restricted to robotics.'
