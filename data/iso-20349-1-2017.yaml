abstract:
- language: en
  script: Latn
  content: ISO 20349-1:2017 specifies requirements and test methods for footwear protecting
    users against risks, such as those encountered in foundries. Footwear complying
    with this document also offers other protection as defined in ISO 20345. NOTE
    Gaiters over boot and clothing intended to provide protection to the feet and
    legs against molten metal are addressed by ISO 11612.
