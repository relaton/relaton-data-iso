abstract:
- language: en
  script: Latn
  content: ISO 10087:2006 establishes a coding system to achieve identification of
    any small craft in terms of identification code of the country of the manufacturer;identification
    code of the manufacturer;serial number;month and year of manufacture;model year.
    It applies to small craft of all types and materials, of hull length up to 24
    m. It does not apply to beach or bathing toys.
