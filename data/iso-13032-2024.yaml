abstract:
- language: en
  script: Latn
  content: 'This document specifies an energy dispersive X-ray fluorescence (EDXRF)
    test method for the determination of sulfur content in automotive fuels. This
    document is applicable to: —    gasoline containing up to 3,7 % oxygen by mass
    (including those blended with ethanol up to 10 % by volume) having sulfur contents
    in the range of 6,9 mg/kg to 56,7 mg/kg, —    diesel fuels including those containing
    up to about 30 % fatty acid methyl ester (FAME) by volume, paraffinic diesel fuel,
    and neat FAME, having sulfur contents in the range of 5,0 mg/kg to 60,2 mg/kg.
    The sulfur content in other products can be determined according to the test method
    specified in this document; however, no precision data for products other than
    automotive fuels and for results outside the specified range have been established
    for this document. For reasons of spectral overlap, this document is not applicable
    to leaded automotive gasoline, gasoline having a content of greater than 8 mg/kg
    lead or to product and feedstock containing lead, silicon, phosphorus, calcium,
    potassium or halides at concentrations greater than one tenth of the concentration
    of sulfur measured, or more than 10 mg/kg, whichever is the greater.'
