abstract:
- language: en
  script: Latn
  content: ISO 14064-3:2006 specifies principles and requirements and provides guidance
    for those conducting or managing the validation and/or verification of greenhouse
    gas (GHG) assertions. It can be applied to organizational or GHG project quantification,
    including GHG quantification, monitoring and reporting carried out in accordance
    with ISO 14064-1 or ISO 14064-2. ISO 14064-3:2006 specifies requirements for selecting
    GHG validators/verifiers, establishing the level of assurance, objectives, criteria
    and scope, determining the validation/verification approach, assessing GHG data,
    information, information systems and controls, evaluating GHG assertions and preparing
    validation/verification statements.
