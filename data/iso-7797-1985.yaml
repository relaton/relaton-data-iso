abstract:
- language: en
  script: Latn
  content: Specifies a method for determination of the resistance of defined parts
    of cross-country skis to breaking when quasistatically loaded. The test is applicable
    to all sizes of cross-country skis for adults, juniors and children. The test
    procedure shall not be used for determination of breaking load of ski structures
    with relatively high plastic deformation (for example skis with steel edges or
    skis with aluminium skins).
