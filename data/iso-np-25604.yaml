abstract:
- language: en
  script: Latn
  content: 'Standardization for the monitoring and assessment of mine wastewater across
    all life stages of resource development in coal and metal mines. This standard
    includes but is not limited to: (1) terminology, (2) water monitoring framework
    addressing potential hazardous effects during the mine life cycle, (3) effluent
    assessing protocols and pollutant thresholds, and (4) data reporting. This standard
    focuses on the water quality of mining-impacted water systems, and would not cover
    water quantity. Excluded: —Terminology for water quality, covered by ISO/TC 147/SC
    1: Terminology. —General analytical methods to measure physical, chemical and
    biochemical parameters for water quality determination, covered by ISO/TC 147/SC
    2: Physical, chemical and biochemical methods. —General methods to assess substance
    toxicity and conduct ecological assessment for water systems, covered by ISO/TC
    147/SC 5: Biological methods. —Requirements for the collection, storage and preservation
    of water samples, covered by ISO/TC 147/SC 6: Sampling (general methods). —Industrial
    wastewater treatment and reuse, covered by ISO/TC 282/SC 4: Industrial water reuse.
    — Mine closure and reclamation vocabulary, planning, and legacy management, covered
    by ISO/TC 82/SC 7: Sustainable mining and mine closure.'
