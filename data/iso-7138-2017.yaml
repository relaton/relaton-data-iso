abstract:
- language: en
  script: Latn
  content: ISO 7138:2017 specifies laboratory measurement methods for mass and location
    of the balance point of cross-country skis. If laboratory measurement data are
    determined and published by manufacturers or other institutions, standard measurement
    procedures can be used to ensure comparability. ISO 7138:2017 is not the purpose
    of this document to evaluate the measurement data with regard to their influence
    on the quality of the ski.
