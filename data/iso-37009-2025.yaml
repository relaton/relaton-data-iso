abstract:
- language: en
  script: Latn
  content: This document provides guidance to organizations on how to identify, assess,
    resolve and monitor conflict of interest based on the principles of trust, integrity,
    transparency and accountability. The guidance in this document is generic and
    intended to be applicable to all organizations, regardless of type, size and nature
    of activity and whether in the public, private or not-for-profit sectors. It distinguishes
    between actual, apparent and potential conflict of interest.
