abstract:
- language: en
  script: Latn
  content: This International Standard describes the basic principles for the expression
    of dimensional deviation in building, and defines the basic terms and definitions
    relating to the evaluation, specification and verification of accuracy. It is
    applicable to the manufacture of building components (standard or purpose made),
    the setting out process, erection and assembly, and the building as a whole. Annex
    A gives equivalent terms in French and German. Annex B lists International Standards
    related to dimensions and dimensional accuracy in building.
