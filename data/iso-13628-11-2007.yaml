abstract:
- language: en
  script: Latn
  content: ISO 13628-11:2007 provides guidelines for the design, analysis, manufacture,
    testing, installation and operation of flexible pipes and flexible pipe systems
    for onshore, subsea and marine applications. ISO 13628-11:2007 supplements ISO
    13628-2 and ISO 13628-10, which specify minimum requirements for the design, material
    selection, manufacture, testing, marking and packaging of unbonded and bonded
    flexible pipes, respectively. ISO 13628-11:2007 applies to flexible pipe assemblies,
    consisting of segments of flexible pipe body with end fittings attached to both
    ends. Both bonded and unbonded pipe types are covered. In addition, ISO 13628-11:2007
    applies to flexible pipe systems, including ancillary components. The applications
    covered by ISO 13628-11:2007 are sweet- and sour-service production, including
    export and injection applications. ISO 13628-11:2007 applies to both static and
    dynamic flexible pipe systems used as flowlines, risers and jumpers. ISO 13628-11:2007
    does cover, in general terms, the use of flexible pipes for offshore loading systems.
    ISO 13628-11:2007 does not cover flexible pipes for use in choke and kill lines
    or umbilical and control lines.
