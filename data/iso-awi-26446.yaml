abstract:
- language: en
  script: Latn
  content: This document specifies spherical ceramic thermal storage media, including
    solid, hollow, and perforated spheres, typically with diameters around 20 mm.
    In addition to the quantity of heat stored, this document also considers the quality
    of heat,expressed in terms of exergy, as a key indicator for evaluating performance.
    These media are primarily used in regenerative burner systems (RBS) for industrial
    furnaces,where alternating flows of hot gases and combustion air pass through
    packed beds of spheres to achieve rapid thermal storage and release. Furthermore,
    such media are applicable to large-scale energy systems such as solar thermal
    power plants and Carnot battery-type storage.
