abstract:
- language: en
  script: Latn
  content: ISO/IEEE 11703-20601:2010 defines a common framework for making an abstract
    model of personal health data available in transport-independent transfer syntax
    required to establish logical connections between systems and to provide presentation
    capabilities and services needed to perform communication tasks. The protocol
    is optimized to personal health usage requirements and leverages commonly used
    methods and tools wherever possible. ISO/IEEE 11703-20601:2010 addresses a need
    for an openly defined, independent standard for converting the information profile
    into an interoperable transmission format so the information can be exchanged
    to and from personal telehealth devices and computer engines (e.g., cell phones,
    personal computers, personal health appliances and set top boxes).
