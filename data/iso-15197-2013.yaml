abstract:
- language: en
  script: Latn
  content: ISO 15197:2013 specifies requirements for in vitro glucose monitoring systems
    that measure glucose concentrations in capillary blood samples, for specific design
    verification procedures and for the validation of performance by the intended
    users. These systems are intended for self-measurement by lay persons for management
    of diabetes mellitus. ISO 15197:2013 is applicable to manufacturers of such systems
    and those other organizations (e.g. regulatory authorities and conformity assessment
    bodies) having the responsibility for assessing the performance of these systems.
