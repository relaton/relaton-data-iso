abstract:
- language: en
  script: Latn
  content: '1.1 Purpose This International Standard defines a method for automating
    the counting of Function Points that is generally consistent with the Function
    Point Counting Practices Manual, Release 4.3.1 (IFPUG CPM) produced by the International
    Function Point Users Group (IFPUG). Guidelines in this International Standard
    may differ from those in the IFPUG CPM at points where subjective judgments have
    to be replaced by the rules needed for automation. The IFPUG CPM was selected
    as the anchor for this International Standard because it is the most widely used
    functional measurement specification with a large supporting infrastructure maintained
    by a professional organization. 1.2 Applicability This International Standard
    is applicable to the functional sizing of transaction-oriented software applications,
    and in particular those with data persistency. To be consistent with the IFPUG
    CPM, the International Standard provides details on the support of applications
    using relational databases. However, the International Standard can be used and
    extended for any type of transactional application with data persistency. 1.3
    Limitations This International Standard does not address the sizing of enhancements
    to an application or maintained functionality (often called Enhancement Function
    Points). Extensions of the automated counting methods described in this International
    Standard such as Automated Enhancement Function Points will be addressed in future
    addendums to this International Standard. This International Standard does not
    address sizing for the non-functional components of a software application. Non-functional
    components (as defined by IFPUG) include: — Structural Quality Constraints Reliability,
    Security, Performance Efficiency, Maintainability, etc. — Organizational Constraints
    locations for operations, target hardware, compliance to standards, etc. — Environmental
    Constraints interoperability, security, privacy, safety, etc. — Implementation
    Constraints development language, delivery schedule, etc.'
