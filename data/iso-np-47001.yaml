abstract:
- language: en
  script: Latn
  content: 'This document provides requirements and recommendations for the provision of rights-based child helplines. It is intended to enable organizations to provide child helpline services that are: rights-based advocates for children facilitators of meaningful child and youth participation reliable safe accessible child centred accountable responsibly and effectively operated in emergency settings. This document is intended for use by any organization providing child helplines, including government agencies, non-governmental organizations, charities and the private sector.'
