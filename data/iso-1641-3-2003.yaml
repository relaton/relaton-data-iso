abstract:
- language: en
  script: Latn
  content: 'ISO 1641-3:2002 specifies the general dimensions of the following milling
    cutters with 7/24 taper shanks: end mills, flat-ended or ball-nosed -- standard
    series and long series (manual changers); slot drills -- short series and standard
    series (manual changers); end mills, flat-ended -- standard series and long series
    (automatic changers). Characteristics of 7/24 taper are in accordance with ISO
    297 for manual changers and ISO 7388-1 for automatic changers.'
