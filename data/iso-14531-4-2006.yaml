abstract:
- language: en
  script: Latn
  content: ISO 14531-4:2006 provides guidance for the design, construction, installation
    and on-site testing of PE-X pipeline systems. The standard deals with trenchless
    and open-trench installation methods. ISO 14531-4:2006, when used in conjunction
    with the other parts of ISO 14531, provides the basis for the design, manufacture
    and installation of PE-X piping systems (PE-X pipes, and PE-X and PE heat-fusion
    fittings and mechanical fittings) for the supply of category D and category E
    hydrocarbon-based fuels.
