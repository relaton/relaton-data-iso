abstract:
- language: en
  script: Latn
  content: ISO 16672:2003 applies to ocular endotamponades (OEs), a group of non-solid
    implants used in ophthalmology to flatten and position a detached retina onto
    the choroid, or to tamponade the retina. With regard to the safety and efficacy
    of OEs, ISO 16672:2003 specifies requirements for their intended performance,
    design attributes, pre-clinical and clinical evaluation, sterilization, product
    packaging, product labelling and the information supplied by the manufacturer.
