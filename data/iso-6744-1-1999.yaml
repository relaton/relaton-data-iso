abstract:
- language: en
  script: Latn
  content: This part of ISO 6744 describes general methods of test for alkyd resins
    for use in paints, varnishes and similar products. It is also applicable to those
    solutions and similar preparations made from alkyd resins that are intended for
    use as binders for paints and varnishes. The test methods to be used for an individual
    alkyd resin shall be the subject of agreement between the interested parties.
