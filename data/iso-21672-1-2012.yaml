abstract:
- language: en
  script: Latn
  content: 1 Scope This part of ISO 21672 specifies general requirements and test
    methods for periodontal probes. It is applicable to periodontal probes made of
    austenitic and martensitic stainless steel. It is not applicable to periodontal
    probes with working ends made completely of plastics, nor to HAUER probes and
    periodontal probes with a defined probing force.
