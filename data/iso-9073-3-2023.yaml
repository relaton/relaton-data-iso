abstract:
- language: en
  script: Latn
  content: 'This document specifies a test method for the determination of the breaking
    force and elongation of nonwovens using a strip method in conditioned or wet state.
    This test method describes two procedures, Option A (width of test specimen: 25 mm)
    and Option B (width of test specimen: 50 mm). This document specifies methods
    using constant rate of specimen extension (CRE) tensile testers. Constant rate
    of loading (CRL) instruments is covered, for information, in ISO 2062:2009, Annex A,
    in recognition of the fact that these instruments are still in use and can be
    used by agreement.'
