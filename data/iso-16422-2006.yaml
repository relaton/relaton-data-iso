abstract:
- language: en
  script: Latn
  content: ISO 16422:2006 specifies the general aspects of pipes and joints made of
    oriented unplasticized poly(vinyl chloride) (PVC-O), for piping systems intended
    to be used underground or above-ground where not exposed to direct sunlight, for
    water mains and services, pressurized sewer systems and irrigation systems. The
    piping system according to ISO 16422:2006 is intended for the conveyance of cold
    water under pressure, for drinking water and for general purposes up to and including
    45 degrees Celsius, and especially in those applications where special performance
    requirements are needed, such as impact loads and pressure fluctuations, up to
    pressure ratings of 25 bar.
