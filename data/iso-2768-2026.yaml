abstract:
- language: en
  script: Latn
  content: This document establishes a system of tolerance limits utilizing tolerance
    classes for linear and angular sizes. This document is applicable to general size
    specifications for features with a nominal linear size from 0,5 mm up to and including
    4 000 mm, and to features with any nominal angular size. The given tolerance limits
    are intended to be used with the default specification operators from the ISO
    GPS system. NOTE 1        See ISO 14405-1 and ISO 14405-3 for further information
    regarding sizes including default specification operators. This document does
    not apply to other types of dimensional specifications, such as linear and angular
    distances etc. NOTE 2        See ISO 14405-2 for further information regarding
    distances and other types of dimensions. This document is applicable on its own,
    in conjunction with ISO 22081 or any other document for general specifications
    as long as the interactions are unambiguously described. NOTE 3        See ISO
    8015 for information about the responsibility principle, the general specification
    principle, etc.
