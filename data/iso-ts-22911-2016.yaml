abstract:
- language: en
  script: Latn
  content: ISO/TS 22911:2016 concerns animal tests relevant to the functional assessment
    of dental implant systems, using both macroscopic and microscopic parameters.
    It is intended for use only when risk analysis indicates a need for additional
    information that only animal testing can provide. ISO/TS 22911:2016 is not intended
    to provide information on the mechanical strength of implantable materials themselves,
    but rather a qualitative evaluation of the implant-bone interface.
