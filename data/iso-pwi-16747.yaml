abstract:
- language: en
  script: Latn
  content: 'The proposed standard will provide manufacturers of Counter UAS equipment
    with guidance to support the production of effective and usable equipment. The
    proposed standard will be applicable to the CUAS equipment intended to be deployed
    in all civilian environments and on-shore military sites. It will include: • Product
    Terms and Definitions • Categories of CUAS equipment (fixed, mobile, DTIE) • Safety
    considerations • Security considerations • Legal considerations • Key functional
    requirements • Performance requirements o Threat definitions o Performance Metrics
    • Testing • Maintenance considerations'
