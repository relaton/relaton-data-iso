abstract:
- language: en
  script: Latn
  content: 'This document defines the terms in the field of biodiversity. These include
    terms related to: — the drivers of biodiversity loss; — quantification; — impact
    on species or ecosystems; — the means of action to protect biodiversity to create
    a regenerative and resilient ecosystem. The components of biodiversity covered
    within this document are genetic, species, ecosystem and functional diversity.
    This document is applicable to entities either working directly in the field of
    biodiversity or whose work involves considerations related to biodiversity.'
