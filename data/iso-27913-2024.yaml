abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and recommendations for the transportation
    of CO2 streams from the capture site to the storage facility where it is primarily
    stored in a geological formation or used for other purposes (e.g. for enhanced
    oil recovery or CO2 use). This document applies to the transportation of CO2 streams
    by —     rigid metallic pipelines, —     pipeline systems, —     onshore and offshore
    pipelines for the transportation of CO2 streams, —     conversion of existing
    pipelines for the transportation of CO2 streams, and —     transportation of CO2
    streams in the gaseous and dense phases. This document also includes aspects of
    CO2 stream quality assurance, as well as converging CO2 streams from different
    sources. Health, safety and environment aspects specific to CO2 transport and
    monitoring are also considered in this document. Transportation of CO2 via ship,
    rail or on road is not covered in this document.
