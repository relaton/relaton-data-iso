abstract:
- language: en
  script: Latn
  content: ISO 5149-3:2014 is applicable to the installation site (plant space and
    services). It specifies requirements for the site for safety, which could be needed
    because of, but not directly connected with, the refrigerating system and its
    ancillary components. ISO 5149-3:2014 is applicable to new refrigerating systems,
    extensions or modifications of existing systems, and for used systems being transferred
    to and operated on another site. It also applies in the case of the conversion
    of a system for another refrigerant.
