abstract:
- language: en
  script: Latn
  content: This document specifies guidelines for testing metallic sheet materials
    to determine the stress-strain characteristics at high strain rates. This document
    covers the use of elastic-bar-type systems. This test method covers the strain-rate
    range above 102 s−1. NOTE            This testing method is also applicable to
    tensile test-piece geometries other than the flat test pieces considered here.
