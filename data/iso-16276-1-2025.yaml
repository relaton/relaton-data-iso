abstract:
- language: en
  script: Latn
  content: This document specifies procedures for assessing the fracture strength
    of a protective paint coating of any thickness on a steel substrate of thickness
    not less than 3 mm. The procedures given in document are based on methods used
    with different types of pull-off test equipment. The results obtained using such
    different types of equipment are not comparable. This document is only applicable
    if a fracture strength value is specified, together with the type of test equipment
    and the manufacturer of the equipment. Usually, this information is included in
    contract documentation. This document also specifies suitable equipment and defines
    inspection areas, sampling plans and acceptance/rejection criteria. It does not
    give any values of the fracture strength of different protective paint coatings.
