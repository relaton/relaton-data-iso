abstract:
- language: en
  script: Latn
  content: This document specifies the syntax and structure of the International Standard
    Content Code (ISCC), as an identification system for digital assets (including
    encodings of text, images, audio, video or other content across all media sectors).
    It also describes ISCC metadata and the use of ISCC in conjunction with other
    schemes, such as DOI, ISAN, ISBN, ISRC, ISSN and ISWC. An ISCC applies to a specific
    digital asset and is a data-descriptor deterministically constructed from multiple
    hash digests using the algorithms and rules in this document. This document does
    not provide information on registration of ISCCs.
