abstract:
- language: en
  script: Latn
  content: This document gives guidelines for assessing the risks related to the potential
    impacts of climate change. It describes how to understand vulnerability and how
    to develop and implement a sound risk assessment in the context of climate change.
    It can be used for assessing both present and future climate change risks. Risk
    assessment according to this document provides a basis for climate change adaptation
    planning, implementation, and monitoring and evaluation for any organization,
    regardless of size, type and nature.
