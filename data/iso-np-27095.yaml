abstract:
- language: en
  script: Latn
  content: This document provides guidelines for safety coordination during exhibition booth build-up and breakdown in business events. It applies to exhibition booths, booth-related temporary structures, booth services and related installations within exhibition venues. It is intended for organisers, venues, exhibitors, booth contractors, service providers and other relevant parties. The document covers coordination processes for planning, information exchange, document submission and review, approval, on-site control, inspection, monitoring, handover, breakdown and close-out records including processes that can be implemented through digital tools or platforms. This document does not specify technical requirements for structural design, electrical installation, rigging, lifting equipment, fire protection systems, occupational health and safety management systems, construction works, or software and data interface requirements for digital platforms.
