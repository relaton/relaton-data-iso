abstract:
- language: en
  script: Latn
  content: The principle of the method specified is placing a weighed test portion
    in a crucible and subjecting to destructive distillation. The residue undergoes
    cracking and coking reactions during a fixed period of severe heating. At the
    end of the specified heat period, the test crucible containing the carbonaceous
    residue is cooled in a desiccator and weighed. The residue remaining is calculated
    as a mass percentage of the original test portion. The method may be used to determine
    amounts of carbon residues in the range of 0,01 % (m/m) to 30,0 % (m/m), left
    after evaporation and pyrolysis.
