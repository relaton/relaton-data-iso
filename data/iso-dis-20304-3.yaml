abstract:
- language: en
  script: Latn
  content: This document describes an evaluation method to guide the pilot test of ozone dosage determination, evaluating the effectiveness of ozone fine bubbles in the treatment of industrial wastewater. It is applicable to determine ozone dosage in fine bubble ozonation experiments for treating real wastewater. This document does not address the health and environmental effects of ozone.
