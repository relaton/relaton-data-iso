abstract:
- language: en
  script: Latn
  content: Specifies a method for evaluating oxidation stability of inhibited steam-turbine
    oils in the presence of oxygen, water, and metallic copper and iron at an elevated
    temperature. The method is also used for testing other oils such as hydraulic
    oils and circulating oils having a relative density less than that of water and
    containing rust and oxidation inhibitors. This method is used for specification
    purposes and is considered of value in evaluating the oxidation stability of lubricants,
    especially those that are prone to water contamination.
