  script: Latn
  content: ISO 14451-9:2013 specifies the types and order of tests to be applied to
    the actuators and sets out the associated acceptance criteria and means of categorization.
    ISO 14451-9:2013 applies to type tests. ISO 14451-9:2013 is not applicable to
