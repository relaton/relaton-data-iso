abstract:
- language: en
  script: Latn
  content: ISO 10110-5:2015 specifies the presentation of design and functional requirements
    for optical elements and systems in technical drawings used for manufacturing
    and inspection. ISO 10110-5:2015 specifies rules for indicating the tolerance
    for surface form deviation. NOTE The terminology of interferometry employing the
    unit "fringe spacings" is widely used for the specification of tolerances. However,
    the usage of non-interferometric methods for testing of optical parts has recently
    become more important. Therefore, unlike in the earlier versions of this part
    of ISO 10110, nanometres shall now be the preferred and standard unit to express
    surface form deviations. The usage of fringe spacings is still permitted given
    that the base wavelength is explicitly stated. ISO 10110-5:2015 applies to surfaces
    of plano, spherical, aspheric, circular and non-circular cylindric, and toric
    form as well as to surfaces of other non-spherical shape such as generally described
    surfaces. It does not apply to diffractive surfaces, Fresnel surfaces, and micro-optical
    surfaces.
