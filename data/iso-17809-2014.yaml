abstract:
- language: en
  script: Latn
  content: Delta Differential One-Way Ranging (Delta-DOR) operations are applicable
    to space agencies that operate deep space missions that require accurate determination
    of the spacecraft position in the plane of the sky. For operations where these
    requirements do not capture the needs of the participating agencies, Delta-DOR
    operations may not be appropriate. ISO 17809:2014 addresses rationale, requirements
    and criteria that Delta-DOR operations processes should be designed to meet.
