abstract:
- language: en
  script: Latn
  content: This international standard, ISO 8559-6, provides a description of anthropometric
    measurements that can be used as a basis for the creation of physical and digital
    anthropometric databases. The list of measurements specified in this part ISO
    8559-6 is intended to serve as a guide for practitioners in the field of clothing
    who are required to apply their knowledge to select population market segments
    and to create size and shape profiles for the development of all innerwear garment
    types which extend from the torso and shoulder to the breast and their equivalent
    fitness. The list provides a guide for how to take anthropometric measurements,
    as well as give information to clothing product development teams and innerwear
    manufacturers on the principles of measurement and their underlying anatomical
    and anthropometrical bases. It is intended to use this part ISO 8559-6 in conjunction
    with national, regional or international regulations or agreements to ensure harmony
    in defining population groups and to allow comparison of anthropometric data sets.
