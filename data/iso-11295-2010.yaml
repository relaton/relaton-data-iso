abstract:
- language: en
  script: Latn
  content: ISO 11295:2010 defines and describes families of techniques for the renovation
    of non‑pressure and pressure pipelines through the use of plastics pipes, fittings
    and ancillary components. For each technique family, it identifies areas of application
    from the range covered by existing renovation product standards, which include
    underground drainage and sewerage, and underground water and gas supply networks.
    ISO 11295:2010 provides information on the principles of, but not the detailed
    methodologies for, the design of plastics piping systems applied as linings to
    existing pipelines.
