abstract:
- language: en
  script: Latn
  content: This International Standard specifies the requirements for environmentally
    acceptable hydraulic fluids and is intended for hydraulic systems, particularly
    hydraulic fluid power systems. The purpose of this International Standard is to
    provide guidance for suppliers and users of environmentally acceptable hydraulic
    fluids, and for the direction of original equipment manufacturers of hydraulic
    systems. This International Standard stipulates the requirements for environmentally
    acceptable hydraulic fluids at the time of delivery. Classification of fluids
    used in hydraulic application is defined in ISO 6743-4. Of the categories covered
    by ISO 6743-4, only four types of environmentally acceptable fluids are embraced
    in this International Standard. These categories are HETG, HEPG, HEES and HEPR.
