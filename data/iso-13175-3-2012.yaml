abstract:
- language: en
  script: Latn
  content: 1 Scope This part of ISO 13175 specifies requirements for monophasic hydroxyapatite
    bone substitutes, monophasic β-tricalcium phosphate bone substitutes and biphasic
    hydroxyapatite/β-tricalcium phosphate bone substitutes in the form of blocks or
    granules. This part of ISO 13175 is not applicable to cell-seeded bone void fillers,
    calcium phosphate cements or bone void fillers containing materials other than
    hydroxyapatite and β-tricalcium phosphate.
