abstract:
- language: en
  script: Latn
  content: Test method for determination of oxidation of coal. Сreating a classification
    of oxidized coals and determining the directions of their effective use. This
    standard applies to low and medium rank coals (brown coal and lignites,) hard
    coal, by-products and sets up petrographic oxidation stage test method and coal
    oxidation level. The standard is intended for use by manufacturers (suppliers)
    and coal consumers, government agencies, certification bodies compliance, testing
    laboratories, research and development organizations, other legal entities and
    individuals working with coal
