abstract:
- language: en
  script: Latn
  content: This document provides a process for the integration of wearable physical assistance devices and robots, like exoskeletons. It focuses on the interaction between the user and the exoskeleton with which he is equipped in the work situation identified as requiring physical assistance. It concerns all sectors of activity and all sizes of organisation. It is aimed at user organisations, as well as designers, manufacturers and integrators. NOTE The concept of an organisation includes, but is not limited to, companies, public authorities, associations, charities or institutions under public or private law. It applies to work situations but does not apply to exoskeletons for medical, rehabilitation, games, sport and leisure purposes. It does not address quality control during design stage of the exoskeletons, nor does it provide information for its certification.
