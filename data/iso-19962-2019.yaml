abstract:
- language: en
  script: Latn
  content: This document specifies procedures for determining the spectroscopic forward
    scattering characteristics of coated and uncoated optical surfaces over a specified
    wavelength range between 350 nm and 850 nm using a double-beam spectrophotometer
    with an integrating sphere. This document is also applicable to the forward scattering
    properties at a single wavelength. This document is applicable to spectroscopic
    forward scattering measurements with collection angles larger than 2,7 degrees.
    ISO 13696 provides a measurement method for smaller collection angles.
