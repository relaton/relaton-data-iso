abstract:
- language: en
  script: Latn
  content: This International Standard describes an open-loop test method for determining
    vehicle reactions during a straightline braking manoeuvre on a surface having
    a split coefficient of friction. It applies to passenger cars as defined in ISO
    3833. The method is valid for all braking efforts up to full ABS operation for
    vehicles so equipped, or just up to the locking limit of the wheels on the high-friction
    surface for vehicles without ABS.
