abstract:
- language: en
  script: Latn
  content: ISO 4064-3:2005 specifies the test methods and means to be employed in
    determining the principal characteristics of water meters. ISO 4064-3:2005 is
    applicable to cold potable water and hot water concentric and combination meters,
    which can withstand maximum admissible working pressures equal to at least 1 MPa
    (10 bar) (0,6 MPa (6 bar) for meters greater than DN 500 and a maximum admissible
    temperature for cold potable water meters of 30 °C and for hot water meters of
    up to 180 °C, depending on the class. ISO 4064-3:2005 also applies to water meters
    based on electrical or electronic principles and to water meters based on mechanical
    principles incorporating electrical devices, used to meter the actual volume flow
    of cold potable water and hot water.
