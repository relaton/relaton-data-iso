abstract:
- language: en
  script: Latn
  content: 'This document provides requirements and guidance on the terminology, properties,
    risk factors, processes, methods, techniques and architectures relating to: -
    use of AI technology within a safety-related function; - use of safety-related
    function based on conventional technology to ensure safety of a system using AI
    technology; - use of AI technology to design, develop and verify safety-related
    functions. This document includes general considerations on how security threats
    can affect safety of an AI system. Unless differently specified, this document
    is applicable to all types of AI technologies. It includes specific details on
    machine learning (ML).'
