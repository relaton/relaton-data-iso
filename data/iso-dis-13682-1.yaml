abstract:
- language: en
  script: Latn
  content: This document defines fundamental terms, symbols and units of measure for
    the characterization of ultrashort-pulse lasers (picosecond and femtosecond pulses,
    respectively). The main purpose of this document is a standardization of these
    terms and the provision of clear definitions for the same. The definitions in
    this document are applicable for all cases where no direct electronic measurements
    are available anymore.
