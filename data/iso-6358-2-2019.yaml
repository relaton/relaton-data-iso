abstract:
- language: en
  script: Latn
  content: This document specifies a discharge test and a charge test as alternative
    methods for testing pneumatic fluid power components that use compressible fluids,
    i.e. gases, and that have internal flow passages that can be either fixed or variable
    in size to determine their flow-rate characteristics. However, this document does
    not apply to components whose flow coefficient is unstable during use, i.e. components
    that exhibit remarkable hysteretic behaviour (because they can contain flexible
    parts that deform under the flow) or that have an internal feedback phenomenon
    (such as regulators), or components that have a cracking pressure such as non-return
    (check) valves and quick-exhaust valves. In addition, it does not apply to components
    that exchange energy with the fluid during flow-rate measurement, e.g. cylinders,
    accumulators. NOTE This document does not provide a method to determine if a component
    has hysteretic behaviour; ISO 6358‑1 does provide such a method.
