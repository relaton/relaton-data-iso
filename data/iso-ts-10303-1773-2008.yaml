abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1773:2008 specifies the application module for Basic data
    representation. The following are within the scope of ISO/TS 10303-1773:2008:
    definition of an element of representation that has a value that is true or false;
    definition of an element of representation that has a value that is an integer;
    definition of an element of representation that has a value that is a rational
    number; definition of an element of representation that has a value that is a
    real number; definition of an element of representation that has a value that
    is a sequence of representation elements; definition of an element of representation
    that has a value that is a set of representation elements; items within the scope
    of application module Extended date, ISO/TS 10303-1776; items within the scope
    of application module Foundation representation, ISO/TS 10303-1006.'
