abstract:
- language: en
  script: Latn
  content: ISO 11114-3:2010 specifies a test method to determine the autogenous ignition
    temperature of non-metallic materials in pressurized gaseous oxygen. The autogenous
    ignition temperature is one criterion for ranking materials, and can be used to
    assist with the choice of materials used in the presence of gaseous oxygen. A
    comprehensive bibliography of the published material on which ISO 11114-3:2010
    is based is included. It is intended that ISO 11114-3:2010 be used for the selection
    of non-metallic materials for gas cylinders and accessories, for example to select
    the materials in order to meet the requirement for type testing for oxygen compatibility
    of all cylinder valves for highly oxidizing gases as specified in ISO 10297.
