abstract:
- language: en
  script: Latn
  content: This International Standard is applicable to freight containers as defined
    in ISO 668 as well as other associated containers and transport equipment. This
    International Standard defines how freight container logistic transparency and
    efficiency can be improved through use of an RFID cargo shipment tag system and
    an Internet-based software package. Such an RFID cargo shipment tag system can
    co-exist with, but is separate from, a container security and identification RFID
    framework using container "license plate" tags, described in ISO 10374 and ISO/TS
    10891, and electronic seals ("e-seals"), described in ISO 18185 (all parts). In
    all cases, operation of and information from ISO/TS 10891 and ISO 18185 devices
    is independent from the operation and information of the cargo shipment tag and
    information from these devices is passed in discrete messages that are not routed
    via the RFID cargo shipment tag.
