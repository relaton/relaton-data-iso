abstract:
- language: en
  script: Latn
  content: 'This document specifies a merged in vitro test method for the determination
    of sun protection parameters, specifically for: • Sun Protection Factor (SPF)
    • UVA Protection Factor (UVA-PF) • Critical wavelength • Water resistance The
    method is applicable to sunscreen formulations, excluding products in the form
    of loose or compressed powders. The document provides specifications for sample
    preparation, product application, irradiation conditions, spectral measurements,
    water exposure procedures, data processing, and reporting, enabling determination
    of the above parameters in a reproducible and comparable manner. The document
    is intended for laboratory use and does not establish regulatory requirements,
    minimum protection thresholds, or labelling rules, which remain under the responsibility
    of relevant authorities.'
