abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for permanent paper intended for
    documents. It is applicable to unprinted papers. It is not applicable to boards.
    NOTE 1        The terms paper and board are defined in ISO 4046-3. This document
    is not intended for judging the permanence of papers stored under hostile conditions,
    such as high humidity that can promote microbiological attack, excessive heat,
    radiation (light or other), high levels of atmospheric pollutants, or the influence
    of water. NOTE 2        For information on International Standards on paper permanence
    (ISO 9706), on archival paper permanence and durability (ISO 11108), and on paper
    stability for general graphic applications (ISO 20494), refer to Annex D.
