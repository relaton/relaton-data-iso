abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides recommendations for reporting
    of forensic work. This document is applicable to the reporting of forensic work
    performed at a scene and within a facility. The requirements facilitate the preparation
    and issuing of reports that are accurate, clear, transparent, complete, unambiguous,
    impartial and suitable for their intended use. This document also includes requirements
    relating to the review of case records and reports, the issuance and control of
    reports, and requirements related to testimony.
