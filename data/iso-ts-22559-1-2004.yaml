abstract:
- language: en
  script: Latn
  content: 'ISO/TS 22559-1:2004 specifies global essential safety requirements (GESRs)
    for lifts (elevators), their components and functions, and establishes a system
    and provides methods for minimizing safety risks that may arise in the course
    of, the operation and use of, or work on, lifts. ISO/TS 22559-1:2004 is applicable
    to lifts that: a) are intended to carry persons, and that can be located in any
    permanent and fixed structure or building, except lifts located in private residences
    (single family units), and means of transport (e.g. ships); b) have any rated
    load, size of load carrying unit and speed, and travel distance and number of
    landings; c) be affected by fire in the load-carrying unit (LCU), earthquake,
    weather or flood; d) be misused (e.g. overloaded) but not vandalized. ISO/TS 22559-1:2004
    does not specifically cover all needs of users with disabilities, or risks arising
    from work on lifts under construction or during alterations and dismantling, or
    the use of lifts for fire fighting and emergency evacuation, or vandalism, and
    fire outside the LCU.'
