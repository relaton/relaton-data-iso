abstract:
- language: en
  script: Latn
  content: 'ISO 16812:2007 specifies requirements and gives recommendations for the
    mechanical design, material selection, fabrication, inspection, testing and preparation
    for shipment of shell-and-tube heat exchangers for the petroleum, petrochemical
    and natural gas industries. ISO 16812:2007 is applicable to the following types
    of shell-and-tube heat exchangers: heaters, condensers, coolers and reboilers.
    ISO 16812:2007 is not applicable to vacuum-operated steam surface condensers and
    feed-water heaters.'
