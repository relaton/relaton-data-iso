abstract:
- language: en
  script: Latn
  content: 'ISO 17292:2015 specifies the requirements for a series of metal ball valves
    suitable for petroleum, petrochemical, natural gas plants, and related industrial
    applications. It covers valves of the nominal sizes DN: - 8, 10, 15, 20, 25, 32,
    40, 50, 65, 80, 100, 150, 200, 250, 300, 350, 400, 450, 500, 600; corresponding
    to nominal pipe sizes NPS: - ¼, ⅜, ½, , 1, 1 ¼, 1 ½, 2, 2 ½, 3, 4, 6, 8, 10, 12,
    14, 16, 18, 20, 24; and applies for pressure designations: - Class 150; 300; 600;
    800 (Class 800 applies only for valves with threaded and socket welding end);
    - PN 16, 25, 40, 63, 100. It includes provisions for testing and inspection and
    for valve characteristics as follows: - flanged and butt-welded ends, in sizes
    15 ≤ DN ≤ 600 (½ ≤ NPS ≤ 24); - socket welding and threaded ends, in sizes 8 ≤
    DN ≤ 50 (¼ ≤ NPS ≤ 2); - body seat openings designated as full bore, reduced bore,
    and double reduced bore; - materials.'
