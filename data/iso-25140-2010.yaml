abstract:
- language: en
  script: Latn
  content: ISO 25140:2010 specifies the principle, the essential performance criteria,
    and quality assurance and quality control procedures for an automatic method for
    measuring methane in the waste gas of stationary sources using flame ionisation
    detection. It is applicable to measurements of methane in dry or wet waste gases.
    The method allows continuous monitoring with permanently installed measuring systems
    as well as intermittent measurements of methane emissions. ISO 25140:2010 does
    not specify an independent method of measurement.
