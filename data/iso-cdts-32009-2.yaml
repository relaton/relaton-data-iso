- language: en
  script: Latn
  content: 'This document specifies how to extend the ISO 32000-2:2020 specification
    by adding support for multi-lingual text strings for all text strings defined
    in PDF. This document does not specify the following: — specific processes for
    converting paper or electronic documents to the PDF file format; — specific technical
