abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of selected carbonyls
    (formaldehyde, acetaldehyde, acetone, acrolein, propionaldehyde, crotonaldehyde,
    2-butanone and n-butyraldehyde) as their 2,4-dinitrophenylhydrazones in mainstream
    smoke using reversed phase HPLC-UV/DAD. This method is applicable to cigarettes
    with nicotine-free dry particulate matter (NFDPM) yields between 1 mg/cigarette
    and 15 mg/cigarette using reversed phase HPLC-UV/DAD.
