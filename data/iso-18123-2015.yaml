abstract:
- language: en
  script: Latn
  content: ISO 18123:2015 aims to define the requirements and method used to determine
    the volatile matter content of solid biofuels. It is intended for persons and
    organisations that manufacture, plan, sell, erect or use machinery, equipment,
    tools, and entire plants related to solid biofuels, and to all persons and organisations
    involved in producing, purchasing, selling, and utilizing solid biofuels. The
    volatile matter content is determined as the loss in mass, less that due to moisture,
    when solid biofuel is subject to partial pyrolysis under standardized conditions.
