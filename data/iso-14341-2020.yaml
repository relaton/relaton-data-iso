abstract:
- language: en
  script: Latn
  content: This document specifies requirements for classification of wire electrodes
    and weld deposits in the as-welded condition and in the post-weld heat-treated
    condition for gas shielded metal arc welding of non alloy and fine grain steels
    with a minimum yield strength of up to 500 MPa or a minimum tensile strength of
    up to 570 MPa. One wire electrode can be tested and classified with different
    shielding gases. This document constitutes a combined specification providing
    classification utilizing a system based upon the yield strength and the average
    impact energy of 47 J of all-weld metal, or utilizing a system based upon the
    tensile strength and the average impact energy of 27 J of all-weld metal. a) Clauses
    and tables which carry the suffix letter "A" are applicable only to wire electrodes
    classified to the system based on the yield strength and the average impact energy
    of 47 J of all-weld metal in accordance with this document. b) Clauses and tables
    which carry the suffix letter "B" are applicable only to wire electrodes classified
    to the system based on the tensile strength and the average impact energy of 27
    J of all-weld metal in accordance with this document. c) Clauses and tables which
    have neither the suffix letter "A" nor the suffix letter "B" are applicable to
    all wire electrodes classified in accordance with this document.
