abstract:
- language: en
  script: Latn
  content: ISO 16135:2006 specifies requirements for the design, functional characteristics
    and manufacture of ball valves made of thermoplastics materials intended for isolating
    service, for control service, and to divert/mix fluids, their connection to the
    pipe system, the body materials and their pressure/temperature rating between
    -40 degrees Celsius and + 120 degrees Celsius, for a lifetime of 25 years, and
    also specifies their tests. ISO 16135:2006 is applicable to hand- or power-operated
    valves to be installed in industrial pipe systems, irrespective of the field of
    application and the fluids to be conveyed. It is concerned with the ranges DN
    8, DN 10, DN 15, DN 20, DN 25, DN 32, DN 40, DN 50, DN 65, DN 80, DN 100, DN 125
    and DN 150, and the ranges PN 6, PN 10, PN 16 and PN 25, and Class 150 and Class
    300.
