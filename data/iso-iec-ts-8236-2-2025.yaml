abstract:
- language: en
  script: Latn
  content: 'This document specifies a standardized method of optimizing facility provisioning
    within data centres by utilizing KPIs that enable the development of facility
    profiles for individual systems or platforms. The combination of the system and
    platform KPIs are used to establish a facility provisioning profile, establishing
    standard forecasting methods to optimize data centre resource effectiveness. This
    document: a)       defines a method for identifying benchmarks and trends in facility
    provisioning; b)       provides capability assessment/indicators of facility infrastructure
    over the infrastructure life-cycle including preparatory, commissioning, expansion/contraction
    and/or retirement of IT equipment; c)        describes the relationship of DCfP
    to dPUE (ISO/IEC 30134-2), providing a common methodology to base dPUE.'
