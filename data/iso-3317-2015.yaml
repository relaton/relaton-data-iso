abstract:
- language: en
  script: Latn
  content: ISO 3317:2015 prescribes the technical specifications for square drive
    adaptor hexagon or cylindrical flat inserts for power socket wrenches. It applies
    to square drive adaptor with hexagon drive or with cylindrical flat end drive
    as defined in ISO 1173, and to driving squares for power socket wrenches as defined
    in ISO 1174‑2. Square drive adaptors with hexagon drive for power socket wrenches
    are listed under number 5 2 00 02 0 in ISO 1703.
