abstract:
- language: en
  script: Latn
  content: ISO 10675-1:2016 specifies acceptance levels for indications from imperfections
    in butt welds of steel, nickel, titanium and their alloys detected by radiographic
    testing. If agreed, the acceptance levels can be applied to other types of welds
    or materials. The acceptance levels can be related to welding standards, application
    standards, specifications or codes. This document assumes that the radiographic
    testing has been carried out in accordance with ISO 17636‑1 and ISO 17636‑2. When
    assessing whether a weld meets the requirements specified for a weld quality level,
    the sizes of imperfections permitted by standards are compared with the dimensions
    of indications revealed by a radiograph made of the weld.
