abstract:
- language: en
  script: Latn
  content: This document defines the safety specifications for gas refill bottles
    intended to refill refillable gas lighters, refillable gas utility lighters and
    refillable gas lighters equipped with flame-lock systems (NWIP to be proposed),
    to ensure a reasonable degree of safety for normal use or reasonably foreseeable
    misuse of such gas refill bottles by users. This document does not apply to fluid
    refill bottles intended to refill fluid lighters (as defined in ISO 9994).
