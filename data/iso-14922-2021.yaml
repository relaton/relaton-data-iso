abstract:
- language: en
  script: Latn
  content: This document specifies quality requirements for manufacturers of thermal
    sprayed coatings to ensure quality assurance for activities in the field of production.
    NOTE      It is independent of the availability of a quality management system,
    e.g. ISO 9001, ISO 14001 and ISO 45001, which concern the concept and organization
    of the quality management. This document defines the quality requirements that
    are of importance for the manufacturing route. This document is applicable to
    thermal spraying including all the pre- and post-treatments of the whole coating
    process for new parts, for repairs and maintenance (e.g. after service) at the
    workshop or on site.
