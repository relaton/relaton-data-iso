abstract:
- language: en
  script: Latn
  content: 'This document specifies an acid digestion and flame atomic absorption
    spectrometric (AAS) method, or inductively coupled plasma optical emission spectrometric
    (ICP-OES) method for the determination of the mass fraction of silver in copper
    and zinc sulfide concentrates. The method is applicable to concentrates having
    silver contents in the following ranges. —     copper concentrates: 10 g/t to
    800 g/t ; —     zinc concentrates: 10 g/t to 800 g/t'
