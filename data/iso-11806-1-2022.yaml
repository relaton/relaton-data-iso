abstract:
- language: en
  script: Latn
  content: This document gives safety requirements and measures for their verification
    for the design and construction of portable hand-held, powered brush-cutters and
    grass-trimmers (hereafter called machines) having an integral combustion engine
    as their power unit and mechanical power transmission between the power source
    and the cutting attachment. Methods for the elimination or reduction of hazards
    arising from the use of these machines and the type of information on safe working
    practices to be provided by the manufacturer are specified. This document deals
    with all significant hazards, hazardous situations and hazardous events relevant
    to these machines, as well as when they are used as intended and under conditions
    of misuse which are reasonably foreseeable by the manufacturer. This document
    is not applicable to machines equipped with metallic cutting attachments consisting
    of more than one piece, such as pivoting chains or flail blades. NOTE       See
    Annex C for a list of significant hazards. This document is applicable to portable,
    hand-held, powered brush-cutters and grass-trimmers manufactured after its date
    of publication.
