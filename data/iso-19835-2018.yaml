abstract:
- language: en
  script: Latn
  content: This document describes the acoustic emission (AE) testing technique used
    to perform structural integrity evaluation on steel structures of overhead travelling
    cranes and portal bridge cranes. This document applies to the testing of steel
    structures of in-service overhead travelling cranes and portal bridge cranes.
    Testing of other kinds of cranes can refer this document. This testing method
    is not intended to be an alone NDT standard method for the evaluation of the structural
    integrity of overhead travelling cranes and portal bridge cranes. Other NDT methods
    are used to verify and supplement the AT results. This document does not establish
    evaluation criteria.
