abstract:
- language: en
  script: Latn
  content: This document provides regional case studies of good practices in land
    management to prevent or minimize land degradation and desertification in support
    of ISO 14055-1:2017. The case studies are presented to facilitate the application
    of ISO 14055-1 across a wide of range of geographical and local conditions. NOTE      
    The cases studies are presented as different ways of applying good practice and
    do not preclude alternative ways of applying good practices in accordance with
    ISO 14055-1.
