abstract:
- language: en
  script: Latn
  content: Gives examples of the various kinds of hazards connected with chain conveyors
    with supporting rods or rollers, push rods, single load carriers etc., suitable
    clearances as well as other safety measures and devices. Explains the various
    Standards for loose materials and unit loads. All remarks apply also to jointed
    apron conveyors especially in respect of external pressure edges, where crushing
    can take place.
