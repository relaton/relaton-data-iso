abstract:
- language: en
  script: Latn
  content: ISO 287:2017 specifies an oven-drying method for the determination of the
    moisture content of a lot of paper and board. The procedure in Clause 8, describing
    how the test pieces are drawn from the lot, is performed at the time of sampling.
    ISO 287:2017 is applicable to every type of lot of paper and board, including
    corrugated board and solid board, provided that the paper or board does not contain
    any substances, other than water, that are volatile at the temperature specified
    in this document. NOTE For determination of the dry matter content of a sample
    of paper or board, e.g. for calculation of the dry mass of the sample, ISO 638[1]
    can be used.
