abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for mandatory lane change (MLC) for Motorway Chauffeur Systems (MCS) that perform Level 3 automated driving [1] on limited access motorways and the test procedures to verify the requirements. The MLC is an additional functionality that can be added to an MCS compliant with the general requirements specified in ISO 23792-1. In comparison to the discretionary lane change (DLC) as defined in ISO 23792-2, the MLC is being performed in situations where lane change becomes time-critical for trip continuation. A typical situation for a MLC is when the current lane of travel is about to end. Means related to setting a destination and selecting a route to reach the destination are not in the scope of this document. This document applies to the system installed in light vehicles
