abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for central compressed
    air source equipment supplying dental air for dental units and various dental
    air consuming devices in the dental office. It also specifies quality requirements
    and test methods for the dental air produced by the central compressed air source
    equipment, such as requirements for the purity level of dental air. It also specifies
    requirements for information to be supplied by the manufacturer on the performance,
    installation, operation and maintenance of the central compressed air source equipment.
    This document applies only to central compressed air source equipment located
    outside of the dental treatment room. This document does not apply to central
    compressed air source equipment located in the dental treatment room and facility
    piping. This document does not include requirements for dental laboratory applications
    (e.g. CAD/CAM systems).
