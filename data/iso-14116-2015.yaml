abstract:
- language: en
  script: Latn
  content: ISO 14116:2015 specifies the performance requirements for the limited flame
    spread properties of all materials, all material assemblies, and protective clothing
    in order to reduce the possibility of the clothing burning when in occasional
    and brief contact with small flames and thereby constituting a hazard. Additional
    requirements for clothing are also specified, including design requirements, mechanical
    requirements, marking, and information supplied by the manufacturer. When protection
    against heat hazards is necessary, in addition to protection against flame, this
    International Standard is not appropriate. International Standards such as ISO
    11612 are to be used instead. A classification system is given for materials,
    material assemblies, and garments which are tested according to ISO 15025, Procedure
    A.
