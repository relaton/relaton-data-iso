abstract:
- language: en
  script: Latn
  content: 'ISO 10243:2010 establishes the technical specifications for compression
    springs made from rectangular wires. It is applicable to springs which are set.
    It does not attempt to specify the quality of the springs themselves, nor all
    of their dimensions (e.g. cross-section), their material or their length of life.
    The springs are classified into spring rates: light, medium, strong and extra
    strong, and a colour code is given for each spring rate.'
