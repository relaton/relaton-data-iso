abstract:
- language: en
  script: Latn
  content: ISO 10893-2:2011 specifies requirements for automated eddy current testing
    of seamless and welded tubes with the exception of submerged arc-welded (SAW)
    tubes, for the detection of imperfections according to the different acceptance
    levels. It is applicable to the inspection of tubes with an outside diameter greater
    than or equal to 4 mm. It can also be applicable to the testing of hollow sections.
