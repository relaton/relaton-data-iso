abstract:
- language: en
  script: Latn
  content: ISO 1099:2006 specifies the conditions for carrying out axial, constant-amplitude,
    force-controlled fatigue tests at ambient temperature on metallic specimens, without
    deliberately introduced stress concentrations. The object of testing is to provide
    fatigue information, such as the relation between applied stress and number of
    cycles to failure for given materials at various stress ratios. While the form,
    preparation and testing of specimens of circular and rectangular cross-section
    are described, component testing and other specialized forms of testing are not
    included in ISO 1099:2006.
