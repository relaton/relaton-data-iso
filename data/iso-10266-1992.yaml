abstract:
- language: en
  script: Latn
  content: Applies to earth-moving machines as given in ISO 6165. Specifies laboratory
    test procedures evaluating the limiting performance parameters. Fluid systems
    include engine, power train, fuel system, oil system, etc. The preferred test
    method is with the machine on a tilt platform or on a prepared slope. An alternative
    method is testing on a test bench. Annex A shows a model test report.
