abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of the fitness for purpose
    of crosslinked polyethylene (PE-X) piping systems intended to be used for hot
    and cold water installations within buildings for the conveyance of water whether
    or not intended for human consumption (domestic systems), and for heating systems,
    under design pressures and temperatures appropriate to the class of application
    (see ISO 15875-1:2025, Table 1). This document also specifies the test parameters
    for the test methods referred to herein. This document is applicable to joints
    between pipes conforming to ISO 15875-2 and fittings made of plastics and non-plastics
    materials conforming to ISO 15875-3, for hot and cold water installations.
