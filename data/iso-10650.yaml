abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for powered polymerization
    activators in the 380 nm to 515 nm wavelength region intended for chairside use
    in polymerization of dental polymer-based materials. This document applies to
    quartz-tungsten-halogen lamps and light-emitting diode (LED) lamps. Powered polymerization
    activators could have internal power supply (rechargeable battery powered) or
    be connected to external (mains) power supply. Lasers or plasma arc devices are
    not covered by this standard. This document does not cover powered polymerization
    activators used in laboratory fabrication of indirect restorations, veneers, dentures
    or other oral dental appliances.
