abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies the test to be performed for: -                
    Calculation of the apparent density of unused cylindrical cork stoppers, semi-finished,
    semi-finished or finished ready for use, as defined in ISO 633, made exclusively
    of agglomerated cork or micro-agglomerated cork, with or without expansion aids.
    -                 Calculation of the apparent density of the cork body (part)
    of unused cylindrical cork stoppers, semi-finished, semi-finished or finished
    ready for use, as defined in ISO 633, made exclusively of agglomerated cork or
    micro-agglomerated cork, with or without expansion aids.   It doesn’t apply to
    cork stopper after bottling.'
