abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the bound styrene content
    of emulsion-polymerized styrene-butadiene rubbers (SBR) by correlation with the
    measured refractive index of an extracted sample according to a table of refractive
    indices versus percentage mass fractions styrene. The method is also applicable
    to extracted oil-extended emulsion-polymerized SBR as long as it produces a film
    suitable for refractive index measurements. It is not applicable to solution-polymerized
    SBR.
