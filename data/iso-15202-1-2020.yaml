abstract:
- language: en
  script: Latn
  content: This document specifies a method for collecting samples of airborne particulate
    matter for subsequent determination of metals and metalloids using inductively
    coupled plasma — atomic emission spectrometry (ICP-AES). Samples obtained using
    the method described herein can also be subsequently analysed for elemental composition
    by other instrumental methods, such as atomic absorption spectrometry (AAS) or
    inductively coupled plasma mass spectrometry (ICP-MS). The method is not applicable
    to the sampling of mercury, which is present in air in the vapour phase at ambient
    temperatures; inorganic compounds of metals and metalloids that are permanent
    gases, e.g. arsine (AsH3); or inorganic compounds of metals and metalloids that
    are present in the vapour phase at ambient temperatures, e.g. arsenic trioxide
    (As2O3). NOTE Although the method does not describe a means of collecting inorganic
    compounds of metals and metalloids that are present in the vapour phase, in most
    instances this is relatively easily to achieve by using a back-up filter which
    has been pre-treated to trap the compound(s) of interest, e.g. a back-up paper
    pad impregnated with sodium carbonate is suitable for collecting arsenic trioxide
    (see ISO 11041[2]). The method is applicable to personal sampling of the inhalable,
    thoracic or respirable fraction of airborne particles, as defined in ISO 7708,
    and to static sampling. This document excludes sampling of surfaces or bulk materials.
    Guidance on collection of samples for surfaces may be found in ASTM D7659[7].
