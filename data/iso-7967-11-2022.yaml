abstract:
- language: en
  script: Latn
  content: 'This document establishes a vocabulary for liquid fuel systems of reciprocating
    internal combustion engines. The terms and definitions are classified as follows:
    —    fuel supply system (3.1); —    carburettor (3.2); —    fuel injection system
    (3.3). Note: ISO 2710-1 gives a classification of reciprocating internal combustion
    engines and denotes the basic terms and definitions of such engines and their
    characteristics.'
