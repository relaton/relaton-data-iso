abstract:
- language: en
  script: Latn
  content: ISO 15745 defines an application integration framework - a set of elements
    and rules for describing integration models and application interoperability profiles.
    ISO 15745-1:2003 defines the generic elements and rules for describing integration
    models and application interoperability profiles, together with their component
    profiles - process profiles, information exchange profiles, and resource profiles.
    NOTE Parts 2, 3 and 4 of ISO 15745 define the technology specific elements and
    rules for describing both communication network profiles and the communication
    related aspects of device profiles based upon particular fieldbus technologies;
    these parts can be used in conjunction with this part to form an application integration
    framework for a specific fieldbus technology. This International Standard is applicable
    to industrial automation applications such as discrete manufacturing, process
    automation, electronics assembly, semiconductor fabrication, and wide-area material
    handling. It may also be applicable to other automation and control applications
    such as utility automation, agriculture, off-road vehicles, medical and laboratory
    automation, and public transport systems.
