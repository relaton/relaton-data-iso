abstract:
- language: en
  script: Latn
  content: 'ISO 1641-1:2016 specifies the general dimensions of the following milling
    cutters with plain cylindrical, flatted cylindrical and threaded shanks: - end
    mills, flat-ended or ball-nosed: standard series and long series; - slot drills
    : short series and standard series. The dimensional characteristics of cylindrical
    shanks are in accordance with ISO 3338‑1, ISO 3338‑2 and ISO 3338‑3. NOTE These
    same milling cutters with Morse taper shanks having a tapped hole are dealt with
    in ISO 1641‑2, those with 7/24 taper shanks in ISO 1641‑3. ISO 1641-1:2016 does
    not apply to solid hard metal end mills and slot drills.'
