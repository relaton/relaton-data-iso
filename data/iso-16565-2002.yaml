abstract:
- language: en
  script: Latn
  content: This International Standard specifies the methods to be used to determine
    the content of 5-ethylidenenorbornene (ENB) or dicyclopentadiene (DCPD) in ethylene-propylene-diene
    (EPDM) terpolymers in the 0,1 % to 15 % range. ENB and DCPD are dienes introduced
    into ethylene-propylene rubbers to generate specific cure properties. Since high
    precision for diene content determination is important, a Fourier transform infrared
    spectroscopic (FT-IR) method is utilized. NOTE The procedures for % ENB content
    and % DCPD content differ only in the location in the infrared (IR) peak being
    quantified.
