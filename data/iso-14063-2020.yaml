abstract:
- language: en
  script: Latn
  content: This document gives guidelines to organizations for general principles,
    policy, strategy and activities relating to both internal and external environmental
    communication. It uses proven and well-established approaches for communication,
    adapted to the specific conditions that exist in environmental communication.
    It is applicable to all organizations regardless of their size, type, location,
    structure, activities, products and services, and whether or not they have an
    environmental management system in place. It can be used in combination with any
    of the ISO 14000 family of standards, or on its own. NOTE 1 A reference table
    to the ISO 14000 family is provided in Annex A. NOTE 2 ISO 14020, ISO 14021, ISO
    14024, ISO 14025 and ISO 14026 provide specific environmental communication tools
    and guidance relating to product labels and declarations.
