abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the alkalinity
    of natural rubber latex concentrate. The method is not necessarily suitable for
    latices from natural sources other than Hevea brasiliensis or for synthetic rubber
    latices, compounded latex, vulcanized latex or artificial dispersions of rubber.
    NOTE A method for the determination of the alkalinity of polychloroprene latex
    is specified in ISO 13773.
