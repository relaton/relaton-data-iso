abstract:
- language: en
  script: Latn
  content: ISO 8539:2009 specifies general requirements for forged steel components
    of Grade 8 up to 63 t working load limit, mainly for use in chain slings, steel
    wire rope slings, and textile slings intended for lifting objects, materials or
    goods. ISO 8539:2009 is not applicable to hand-forged components and welded links,
    and neither is it applicable to other welded components.
