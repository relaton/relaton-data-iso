abstract:
- language: en
  script: Latn
  content: This part of ISO 19144 specifies a methodology for the registration of
    Land Cover and Land Use classification systems, together with a mechanism of registration
    of the elements needed to extend either of the Land Cover or Land Use metalanguages
    as described in ISO 19144-2 (LCML) and ISO 19144-3 (LUML). In addition, this part
    of ISO 19144 describes supporting implementation aspects that assist in the recording
    of registered systems or elements, and for the encoding of the description of
    these systems and elements for inclusion in an ISO register. It is anticipated
    that the project will refer to ISO 19135 procedures for item registration. The
    revision of ISO 19135 is expected to start the DIS stage within the next two months.
    The project team will draft ISO 19144-4 to conform to the new ISO 19135 edition.
