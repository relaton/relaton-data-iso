abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and measures for single
    spindle vertical moulding machines (defined in 3.1), capable of continuous production
    use and hereinafter referred to also as “machines”. The machines are designed
    to cut solid wood and material with similar physical characteristics to wood.
    This document deals with all significant hazards, hazardous situations and events
    as listed in Annex A, relevant to the machines when they are operated, adjusted
    and maintained as intended and under the conditions foreseen by the manufacturer
    including reasonably foreseeable misuse. Transport, assembly, dismantling, disabling
    and scrapping phases have also been taken into account. This document is also
    applicable to machines fitted with one or more of the following devices/additional
    working units, whose hazards have been dealt with: a)       device to adjust the
    arbor vertically; b)       device to tilt the arbor; c)        device to fit a
    manually operated tenoning sliding table; d)       glass bead saw unit; e)      
    adjustable table insert; f)         device for changing the direction of rotation
    of the spindle; g)       device for fixing shank mounted tools on the arbor; h)      
    interchangeable arbor; i)         quick tool/arbor change system; j)         demountable
    power feed unit; k)       support for the demountable power feed unit with power-driven
    adjustments. This document does not apply to —     machines equipped with outboard
    bearings, —     machines equipped with powered movements of a front extension
    table and/or a tenoning sliding table. This document is not applicable to machines
    intended for use in potentially explosive atmospheres or to machines manufactured
    prior to the date of its publication.'
