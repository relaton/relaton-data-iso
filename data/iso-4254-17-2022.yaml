abstract:
- language: en
  script: Latn
  content: 'This document, intended to be used together with ISO 4254-1, specifies
    the safety requirements and their verification for the design and construction
    of the following types of root crop harvesting machines trailed, mounted or self-propelled:
    —    sieving harvesters, —    root lifting harvesters, —    top lifting harvesters,
    which carry out more than one of the following operations: haulm/leaf topping,
    digging/taking-in/lifting, cleaning, conveying and unloading of root crops. This
    document is also applicable for haulm/leaf toppers used individually. This document
    is not applicable to cleaner-loaders which operate from a heap of beet. For these
    type of machines, additional hazards are, at present, not dealt with in this document.
    In addition, it specifies the type of information on safe working practices to
    be provided by the manufacturer. The list of significant hazards covered in this
    document is given in Annex A. It also indicates the hazards which have not been
    dealt with. Environmental aspects have not been considered in this document. Noise
    has been considered partly in this document. This document applies primarily to
    machines which are manufactured after the date of its publication.'
