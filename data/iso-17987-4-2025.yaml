abstract:
- language: en
  script: Latn
  content: This document specifies the 12 V and 24 V electrical physical layers (EPL)
    of the LIN communications system. The electrical physical layer for LIN is designed
    for low-cost networks with bit rates up to 20 kbit/s to connect automotive electronic
    control units (ECUs). The medium that is used is a single wire for each receiver
    and transmitter with reference to ground. Annex A provides recommendations on
    the LIN physical layer peripheral interface design of type UART and frame controller
    for commander and responder nodes. This document includes the definition of electrical
    characteristics of the transmission itself and also the documentation of basic
    functionality for bus driver devices. This document also provides the physical
    layer definitions for nodes with LIN AA capabilities according to one of the procedures
    C, D and E. All parameters in this document are defined for the ambient temperature
    range from −40 °C to 125 °C.
