abstract:
- language: en
  script: Latn
  content: ISO 4528:2015 is a guide to the selection of test methods for evaluating
    the performance of vitreous and porcelain enamelled finishes in different applications.
    It references the test methods available for measuring the properties of these
    finishes and correlates these properties to the requirements of specific enamelled
    articles. It is limited for the most part to test methods that are described in
    International Standards or European Standards and does not provide acceptance
    criteria or performance limits for the properties. ISO 4528:2015 applies to all
    enamelled articles irrespective of their basis metals.
