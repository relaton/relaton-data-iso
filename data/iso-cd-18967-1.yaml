abstract:
- language: en
  script: Latn
  content: This Document establishes the requirements for the design, material, manufacturing,
    packaging, labeling and performance of bone anchoring system of the type suture
    anchors. This Document applies to suture anchors designed to be attached to the
    bone tissue by threading, by expansion or by impact. This Document does not apply
    to knot fixations used as bone anchoring systems, which consists exclusively of
    wire or tape.
