abstract:
- language: en
  script: Latn
  content: 'This document specifies the planning issues, requirements and procedures
    for the conversion and/or migration of digital records in order to preserve the
    authenticity, reliability, integrity and usability of such records as evidence
    of business functions, processes, activities and transactions. These procedures
    do not comprehensively cover: —    backup systems; —    preservation of digital
    records; —    functionality of trusted digital repositories; —    the process
    of converting analogue formats to digital formats and vice versa.'
