abstract:
- language: en
  script: Latn
  content: 'This document outlines the visualization elements for data exchange between
    the Product Lifecycle Management and Manufacturing Execution System (PLM-MES)
    or Manufacturing Operations Management (MOM). The following are within the scope
    of this document: —     the need for a PLM-MES interface; —     the technical
    elements that make up the PLM-MES interface; —     the visualization elements
    of the PLM-MES interface. The following is outside the scope of this document:
    —     application of the PLM-MES interface and its visualization elements.'
