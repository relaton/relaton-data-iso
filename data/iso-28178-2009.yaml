abstract:
- language: en
  script: Latn
  content: ISO 28178:2009 defines an exchange format for colour and process control
    data (and the associated metadata necessary for its proper interpretation) in
    electronic form using either XML or ASCII formatted data files. It maintains human
    readability of the data as well as enabling machine readability. It includes a
    series of predefined tags and keywords, and provides extensibility through provision
    for the dynamic definition of additional tags and keywords as necessary. It is
    focused primarily on spectral measurement data, colorimetric data, and densitometric
    data. ISO 28178:2009 is intended to be used in conjunction with other standards
    that will define the required data, and tags or keywords for specific data exchange
    applications.
