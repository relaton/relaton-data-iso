abstract:
- language: en
  script: Latn
  content: 'This document provides guidance for the design, construction, inspection,
    commissioning, acceptance, operation, maintenance, and management of swimming
    pool circulation systems. It applies to the design, construction, inspection,
    commissioning, acceptance, operation, maintenance, and management of newly built,
    expanded, or renovated swimming pools. The objective is to achieve advanced technology,
    energy and water conservation, economic rationality, and ensure public safety
    and health. This document covers key aspects of swimming pool circulation systems,
    including circulation and water replenishment, pool water purification, pool water
    disinfection, pool water heating, pool energy efficiency, water quality monitoring
    and control, drainage and recycling, construction and installation, system monitoring
    and commissioning, acceptance, operation, maintenance, and management. It offers
    specific design methods, process recommendations, and parameter guidelines that
    can be directly applied to guide engineering implementation. The document includes
    the following sections: 1) Scope 2) Normative references 3) Terms and definitions
    4) Pool water circulation and replenishment 5) Pool water purification 6) Pool
    water disinfection technology 7) Pool water heating technology 8) Pool energy
    efficiency technology 9) Water quality monitoring and control 10) Drainage and
    recycling 11) Construction and installation requirements 12) System monitoring
    and commissioning 13) Acceptance criteria 14) Operation, maintenance, and management'
