abstract:
- language: en
  script: Latn
  content: This document deals with the classification of fan power consumption and
    efficiency for many fan types given in the ISO12759 series. In addition, it details
    specific application efficiency classification information. These procedures are
    described in ISO 12759-3, ISO 12759-4, ISO 12759-5 and ISO 12759‑6. This document
    does not describe a method to compare these classifications and minimum efficiency
    limits (MELs). This document applies to the fans, not to the system in which they
    are installed. Air curtains are excluded from this standard.
