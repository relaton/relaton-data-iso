abstract:
- language: en
  script: Latn
  content: ISO 7195:2005 specifies requirements for packaging of uranium hexafluoride
    (UF6) for transport. It applies to packages designed to contain uranium hexafluoride
    in quantities of 0,1 kg or more; design, manufacture, inspection and testing of
    new cylinders and protective packagings; maintenance, repair, inspection and testing
    of cylinders and protective packagings; and in-service inspection and testing
    requirements for cylinders and protective packagings.
