abstract:
- language: en
  script: Latn
  content: La présente partie de l'ISO 10303 spécifie les ressources élémentaires
    relatives à la représentation géométrique et topologique explicite de la forme
    d'un produit. Le domaine d'application est déterminé par les exigences relatives
    à la représentation explicite d'un modèle de produit idéal ; les tolérances et
    les formes implicites de représentation, en termes de caractéristiques, ne font
    pas partie du domaine d'application. La géométrie décrite à l'article 4 et la
    topologie décrite à l'article 5 peuvent être utilisées indépendamment, tout comme
    elles sont utilisées largement par les différentes formes de modèle géométrique,
    décrites à l'article 6. En outre, la présente partie de l'ISO 10303 précise les
    spécialisations des concepts de représentation, où les éléments de représentation
    sont géométriques.
