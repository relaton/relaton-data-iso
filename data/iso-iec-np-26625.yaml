abstract:
- language: en
  script: Latn
  content: This document is intended to provide information to users to help facilitate
    selecting printer consumables that meet their requirements. It also provides a
    method for both consumers and regulators to receive relevant information. It specifies
    required and optional elements to be included via package, a traditional data
    sheet or delivered via a combination of packaging and a digitally accessible data
    sheet. This document applies to printer consumables that could be operated in
    a home, enterprise or office environment. Printer consumables requiring a maintenance
    provider for service or installation are not considered in this document. This
    document does not seek to dictate the specific customer experience or method of
    information delivery, only what elements are available when claiming compliance
    with this standard.
