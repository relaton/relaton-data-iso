abstract:
- language: en
  script: Latn
  content: ISO 14156|IDF 172:2001 specifies methods for the extraction or separation
    of a representative part of the fat, containing lipids and liposoluble compounds,
    from milk and milk products. The method is applicable to pretreatment of samples
    for the methods described in ISO 15884 and ISO 15885. It should be noted that
    free fatty acids are not part of extracted fat as described in methods for the
    fat determination in milk, condensed milk, dried milk products, cream and fermented
    milk.
