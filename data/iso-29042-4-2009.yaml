abstract:
- language: en
  script: Latn
  content: ISO 29042-4:2009 specifies a method based on a tracer technique for measuring
    the capture efficiency of an exhaust system installed on a machine. It is applicable
    to all types of test environment — test bench, room or field (see ISO 29042-1)
    — but is only applicable if the tracer shows aerodynamic behaviour comparable
    to that of the real pollutant.
