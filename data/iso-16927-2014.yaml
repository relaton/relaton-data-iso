abstract:
- language: en
  script: Latn
  content: ISO 16927:2014 specifies a method for testing the overcoatability and recoatability
    of unaged single-coat or multi-coat systems using a coating material which is
    intended for repairing damaged areas during or after installation. Since the testing
    of overcoatability and recoatability can be conducted under different conditions,
    this International Standard only specifies one procedure and indicates the basic
    parameters. The existing single-coat or multi-coat system is indicated as coating
    A and the new single-coat or multi-coat system as coating B. The same applies
    analogously for the respective coating material.
