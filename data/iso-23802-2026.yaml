abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and gives recommendations for the
    periodic inspection and testing of permanently mounted tubes of: composite with
    seamless metallic liners; composite with non-load-sharing liners; seamless steel;
    in battery vehicles and multiple element gas containers (MEGCs) including frames
    and associated equipment (these components are also inspected); and large tubes
    of: composite with seamless metallic liners; composite with non-load-sharing liners;
    in modules including frames and associated equipment (these components are also
    inspected).'
