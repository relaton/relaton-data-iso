abstract:
- language: en
  script: Latn
  content: 'This document establishes the service description, the tyre load ratings
    for basic and special applications and reference inflation pressure for the metric
    series of tyres primarily intended for agricultural tractors, machines, equipment
    and their trailers. It applies to diagonal, bias belted and radial tyres mounted
    on 5° and 15° tapered rims. NOTE The service description, the tyre load ratings
    for basic and special applications and reference inflation pressure for the metric
    series of: — tyres for logging and forestry machines are specified in ISO 18807;
    — tyres for construction/industrial tractors are specified in ISO 13442.'
