abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of the content of blowing agents in cellular plastics, including rigid polyurethane foam (PUR), polyisocyanurate foam (PIR), extruded polystyrene foam (XPS), and expanded polystyrene foam (EPS), by headspace-gas chromatography (HS-GC). Two variants of the method are specified: — Method A (Chemical degradation combined with HS-GC): This method is applicable to PUR and PIR, . — Method B (Physical dissolution combined with HS-GC): This method is applicable to XPS and EPS.'
