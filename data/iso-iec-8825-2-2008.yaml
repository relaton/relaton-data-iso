abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 8825-2:2008 specifies a set of Packed Encoding Rules that can
    be used to derive a transfer syntax for values of types defined in ISO/IEC 8824-1.
    These Packed Encoding Rules can also be applied for decoding such a transfer syntax
    in order to identify the data values being transferred. The encoding rules specified
    in ISO/IEC 8825-2:2008: are used at the time of communication; are intended for
    use in circumstances where minimizing the size of the representation of values
    is the major concern in the choice of encoding rules; allow the extension of an
    abstract syntax by addition of extra values, preserving the encodings of the existing
    values, for all forms of extension described in ISO/IEC 8824-1; can be modified
    in accordance with the provisions of ISO/IEC 8825-6.'
