abstract:
- language: en
  script: Latn
  content: 'ISO 11365:2017 is applicable to the use of triaryl phosphate esters as
    fire-resistant fluids for turbine control and other hydraulic systems in power
    generation. These fluids fall under category HFDR of ISO 6743‑4[1]. ISO 11365:2017
    is intended to: - assist the power equipment operator to maintain the fluid in
    a condition that will ensure the safe and reliable operation of the turbine while
    maximizing fluid life; - recommend procedures for examining consignments of new
    fluid and monitoring the fluid in use; - provide information on the safe handling,
    storage and disposal of the fluid; - offer background information on the causes
    of fluid degradation.'
