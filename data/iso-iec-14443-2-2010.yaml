abstract:
- language: en
  script: Latn
  content: ISO/IEC 14443-2:2010 specifies the characteristics of the fields to be
    provided for power and bi-directional communication between proximity coupling
    devices (PCDs) and proximity cards or objects (PICCs). It does not specify the
    means of generating coupling fields, nor the means of compliance with electromagnetic
    radiation and human exposure regulations, which can vary according to country.
