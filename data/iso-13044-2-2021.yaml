abstract:
- language: en
  script: Latn
  content: This document specifies the mechanical, electrical/electronic and pneumatic
    characteristics of a fully automated fifth wheel coupling system to ensure interchangeability
    between a towing vehicle and a coupled semi-trailer(s) with 24 V nominal supply
    voltage. The two vehicles together constitute an articulated vehicle or are part
    of a vehicle combination. This document also supports the step-by-step introduction
    of fully automated fifth wheel coupling systems in the market. It specifies features
    necessary for mixed mode operation, i.e. the combination of a fully automated
    coupling system (FACS) equipped towing vehicle with a conventional semi-trailer,
    and vice versa, the combination of a conventional towing vehicle with a FACS-equipped
    semi-trailer.
