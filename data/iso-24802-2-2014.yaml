abstract:
- language: en
  script: Latn
  content: ISO 24802-2:2014 specifies the competencies required of a scuba instructor
    in order to obtain a scuba instructor qualification from a training organization
    attesting that he/she has met or exceeded scuba instructor level 2, and specifies
    evaluation criteria for these competencies. It also specifies the conditions under
    which training is provided, in addition to the general requirements for recreational
    diving service provision in accordance with ISO 24803. ISO 24802-2:2014 applies
    to training and evaluation in recreational scuba diving.
