abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the thermal and energy performance of refrigerated food lockers in given environmental conditions and intended for the temporary cold storage of chilled or frozen pre-ordered or pre-selected foodstuff until the final collection by the consumer. This document also covers construction characteristics relevant for thermal and energy performance. This document specifies tests conditions and methods for checking the requirements to be satisfied as well as the classification of refrigerated lockers, their marking and the list of characteristics to be declared by the manufacturer. This document is not applicable to refrigerated vending machines. It is also not applicable to: commercial beverage coolers covered by ISO 22044; ice cream freezers covered by ISO 22043; refrigerated display cabinets covered by ISO 23953-1 and ISO 23953-2; cabinets intended for storage or cabinets intended for use, e.g. in catering or non-retail refrigerated applications. This document does not cover health and safety aspects and ergonomic principles. The document does not cover safe storage temperatures for any specific perishable foodstuff. The refrigeration system, providing the cooling function, is either fully or partially integrated or completely remote from the refrigerated food locker and connected by interconnecting pipe-work.'
