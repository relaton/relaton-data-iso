abstract:
- language: en
  script: Latn
  content: 'This document describes the coupling parameters between the hands of a
    machine operator and a vibrating surface of the machine. The coupling between
    the hand and the vibrating surface can be described using different parameters
    and component parts of these parameters: —    force parameters, such as push,
    pull and grip; —    parameters such as pressure exerted on skin. In addition,
    Annexes A, B, C, D and E provide guidelines for measuring procedures, the measurement
    of the force and pressure parameters, and information on the requirements for
    measuring instrumentation, as well as a calibration method. This document does
    not deal with forces which act tangentially to the hand.'
