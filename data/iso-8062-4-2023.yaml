abstract:
- language: en
  script: Latn
  content: This document specifies the rules for geometrical dimensioning and tolerancing
    of final moulded parts and parts machined out of moulded parts. It also specifies
    rules and conventions for the indications of these requirements in technical product
    documentation and specifies the proportions and dimensions of the graphical symbols
    to be used. This document provides symbols for identifying the relative completeness
    of the moulded features and parts. These graphical symbols differ from the graphical
    symbols for surface texture according to ISO 1302[1], which are notably larger.
    This document specifies general geometrical tolerances using surface profile tolerances
    related to a general datum system that remains on the final part. It also specifies
    machining allowances and draft angles (tapers) for castings in all cast metals
    and their alloys produced by various casting manufacturing processes. This document
    establishes the general principles for presentation of general geometrical tolerances
    that apply to 2D technical drawings in all disciplines and trades but which are
    also applicable to 3D applications. NOTE            All figures are shown in 2D
    views only. When cast datum surfaces are machined, this document is not applicable.
    [1]Cancelled and replaced by ISO 21920-1.
