abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the wet strength
    of paper and board by measuring its bursting strength after it has been immersed
    in water for a specified period. The method is applicable to most kinds of paper
    and board, provided that an appropriate immersion time is agreed between the interested
    parties. Different results can be found if the sample is re-tested after a period
    of time.
