abstract:
- language: en
  script: Latn
  content: 'This document provides requirements to and recommendations for the periodic
    inspection and testing of permanently mounted tubes of:  • Composite with seamless
    metallic liners, • Composite with non-loadsharing liners, • Seamless steel. and
    large tubes of: ·   Composite with seamless metallic liners, • Composite with
    non-loadsharing liners,  including frames and associated equipment.   NOTE 1: 
    This scope includes battery vehicles and multi-element gas containers as defined
    in ISO 10286 using tubes and large tubes that are permanently mounted.'
