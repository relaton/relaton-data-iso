abstract:
- language: en
  script: Latn
  content: This Standard covers energy performance calculation of water based storage
    sub-systems used for heating, for domestic hot water or for combination of these.
    This standard does not cover sizing or inspection of such storage systems. This
    standard will provide a certain flexibility with regard to the methods, the required
    input data and references to other EPB standards, by the introduction of a normative
    template in Annex A and Annex B with informative default choices.
