abstract:
- language: en
  script: Latn
  content: Two methods for the determination of the modulus or rubber in pure shear
    from measurements of the stress-strain behavior of a test piece under biaxial.
    In the first method the test piece, in the form of a sheet, is strained directly
    by the application of two orthogonal forces in the plane of the sheet. In the
    second, the test piece is clamped against a circular orifice in such a manner
    as to provide a fluid tight seal and restrain the sheet when a pressure is applied
    to one side. Provision is made to apply a pressure to one side of the sheet to
    produce which is effectively pure shear. In both cases , the deformation of the
    rubber is measured as a function of the stress applied to the sheet.
