abstract:
- language: en
  script: Latn
  content: ISO 21500:2012 provides guidance for project management and can be used
    by any type of organization, including public, private or community organizations,
    and for any type of project, irrespective of complexity, size or duration. ISO
    21500:2012 provides high-level description of concepts and processes that are
    considered to form good practice in project management. Projects are placed in
    the context of programmes and project portfolios, however, ISO 21500:2012 does
    not provide detailed guidance on the management of programmes and project portfolios.
    Topics pertaining to general management are addressed only within the context
    of project management.
