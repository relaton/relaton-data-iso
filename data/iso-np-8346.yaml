abstract:
- language: en
  script: Latn
  content: 'This standard will provide guidance on the development of Data Quality
    Objectives, relating to the provision of data in support of the management of
    radioactive waste. This Standard describes the main reasons why data are provided
    in support of Radioactive Waste Management, provides examples of data and information
    which may applicable and provides guidance on the application of DQO for the specification
    and provision of that data. The scope of the guidance provided in this standard
    is divided into three broad areas: waste; waste characteristics and data collection
    objectives. Specific techniques for the collection of data are outside of the
    scope of this guidance.'
