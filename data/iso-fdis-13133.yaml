abstract:
- language: en
  script: Latn
  content: This document contains a security reference model for digital currency
    hardware wallets and requirements and recommendations regarding the security of
    digital currency hardware wallets. It includes security requirements for (i) data
    management, (ii), communication, and (iii) access control requirements between
    different modules of the hardware wallets; security requirements for the running
    environment of the software operating in the hardware wallet; and security policies
    for service operation of the hardware wallet. The security reference model will
    be formed by the related security domains and security controls. The non-security
    aspects of digital currency hardware wallets, such as business processes and financial
    transactions are out of scope.
