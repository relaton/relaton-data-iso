abstract:
- language: en
  script: Latn
  content: This document specifies the information accompanying geosynthetics to enable
    the user on site to identify the goods as being identical to the goods ordered.
    The positive identification, e.g. of unwrapped or rolled-out geosynthetics, is
    an important aim of this document. The information specified does not replace
    a technical data sheet and cannot be used to verify the conformance of the product
    with the technical requirements.
