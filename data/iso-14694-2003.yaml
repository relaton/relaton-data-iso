abstract:
- language: en
  script: Latn
  content: ISO 14694:2003 gives specifications for vibration and balance limits of
    fans for all applications except those designed solely for air circulation, for
    example, ceiling fans and table fans. However, it is limited to fans of all types
    installed with a power of less than 300 kW or to commercially available standard
    electric motor with a maximum power of 355 kW (following an R20 series). For fans
    of greater power than this, the applicable limits are those given in ISO 10816
    - 3. Where the fans in an installation have varying powers both above and below
    300 kW, and have been the subject of a single contract, then the manufacturer
    and purchaser shall agree on the appropriate standard to be used. This should
    normally be based on the majority of units. Fan-equipment foundations and installation
    practices are beyond the scope of ISO 14694:2003. Foundation design and fan installation
    are not normally the responsibilities of the fan manufacturer. It is fully expected
    that the foundations upon which the fan is mounted will provide the support and
    stability necessary to meet the vibration criteria of the fan as it is delivered
    from the factory. ISO 14694:2003 is intended to cover only the balance or vibration
    of the fan and does not take into account the effect of fan vibration on personnel,
    equipment or processes.
