abstract:
- language: en
  script: Latn
  content: ISO 11130:2010 specifies a method for assessing the corrosion resistance
    of metals by an alternate immersion test in salt solution, with or without applied
    stress. The test is particularly suitable for quality control during the manufacture
    of metals including aluminium alloys and ferrous materials, and also for assessment
    purposes during alloy development. Depending upon the chemical composition of
    the test solution, the test can be used to simulate the corrosive effects of marine
    splash zones, de-icing fluids and acid salt environments. The term “metal” as
    used in ISO 11130:2010 includes metallic materials with or without corrosion protection.
    The alternate immersion test applies to metals and their alloys, certain metallic
    coatings (anodic and cathodic with respect to the substrate), certain conversion
    coatings, certain anodic oxide coating, and organic coatings on metals. ISO 11130:2010
    is not applicable to stainless steel.
