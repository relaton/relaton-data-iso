abstract:
- language: en
  script: Latn
  content: ISO 17052:2007 specifies a method for the determination of residual monomers
    and other volatile low-molecular-mass compounds in raw rubber by capillary column
    gas chromatography using a thermal desorption (also known as dynamic headspace)
    method. It includes a generic section that is applicable to all types of raw rubber
    and two annexes specific to particular rubber types. This method has the advantages
    of not requiring a solvent, of concentrating the volatile compounds and of introducing
    them to the chromatograph in a very precise manner. The compounds found in the
    raw rubber which are to be determined are defined as residual monomers, solvents
    and other low-molecular-mass compounds in the boiling point range of C4 to C12
    hydrocarbons. NOTE The limit of detection is 1 microgram per gram.
