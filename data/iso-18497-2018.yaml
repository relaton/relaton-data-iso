abstract:
- language: en
  script: Latn
  content: 'This document specifies principles for the design of highly automated
    aspects of highly automated machines and vehicles (e.g. agricultural tractors,
    tractor implement systems, implements and self-propelled machinery) during agricultural
    field operations. In addition, it provides guidance on the type of information
    on safe working practices (including information about residual risks) to be provided
    by the manufacturer. The purpose of this document is to assist in the provision
    of safety requirements, means of verification and information for use to ensure
    an appropriate level of safety for agricultural and forestry tractors and self-propelled
    machines with functions allowing highly automated operations (see 3.7). This document
    deals with all the significant hazards, hazardous situations and events (as listed
    in Annex A), relevant to agricultural and forestry tractors and self-propelled
    machines allowing highly automated field operations when used as intended and
    under the conditions of misuse foreseeable by the manufacturer during normal operation
    and service. NOTE 1 While this document gives principles for the design, verification,
    validation and provision of information for use of a highly automated agricultural
    machine (HAAM), the detailed specification of requirements for a specific application
    will be dependent on the machine and its operating conditions. Therefore, the
    principles for design given in this document need to be extended for specific
    HAAM by the use of relevant specific (type-C) standards, when available, or by
    the manufacturer of the machine using risk assessment. Such additional specification
    of requirements, for design, verification, validation or information for use are
    outside the scope of this document. NOTE 2 Safety requirements for specific machines
    not related to their highly automated operations can be available in machine-specific
    type-C standards. This document is not applicable to: — forestry applications;
    — mobile, semi-mobile or stationary machinery used for farm yard or barn operations;
    — operations on public roads including relevant requirements for braking and steering
    systems. NOTE 3 With respect to implements (e.g. their specific design, functions)
    and the communication between tractors and implements, additional risks can be
    relevant and can require additional measures. Such additional measures are outside
    the scope of this document and are the responsibility of the manufacturer. This
    document is not applicable to agricultural and forestry tractors, tractor implement
    systems, implements and self-propelled machines which are manufactured before
    the date of its publication.'
