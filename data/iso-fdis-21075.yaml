abstract:
- language: en
  script: Latn
  content: 'This international standard describes the steps of designing the whole-building
    ventilation system for residential buildings and the points to be taken into account
    regarding the indoor environment and energy consumption. This standard allows
    the designer to plan a whole-building ventilator that improves indoor air quality,
    the auditory environment, and thermal comfort, and that also uses energy in a
    practical way. They also touch on the performance of the building in order to
    operate a whole-building ventilator well. Excluded: - Criteria for indoor air
    quality - Criteria for indoor thermal comfort (covered by ISO/TC 159) - Criteria
    for auditory environment (covered by ISO/TC 43) - Evaluation method of energy
    performance of heating or cooling equipment - Evaluation method of energy performance
    of ventilators (covered by ISO/TC 86) - Evaluation method of energy performance
    of heat recovery components (covered by ISO/TC 86) - Evaluation method of building
    performance (covered by ISO/TC 163) - Design steps and evaluation method of localized
    ventilation equipment - Ventilation systems using natural driving force in all
    ventilation airflow path'
