abstract:
- language: en
  script: Latn
  content: This document specifies a quality model and an assessment framework for retrieval-augmented generation (RAG) systems. The quality model defines quality characteristics and sub-characteristics relevant to RAG systems, while the assessment framework provides guidance on assessing these characteristics using criteria, measures, methods, and reporting approaches. The document supports the specification, measurement and assessment of RAG systems quality across different application contexts and addresses quality aspects specific to RAG systems.
