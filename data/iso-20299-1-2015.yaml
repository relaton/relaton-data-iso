abstract:
- language: en
  script: Latn
  content: 'ISO 20299-1:2015 specifies the material and physical property requirements
    for non-strippable film for wrapping general-purpose synthetic rubber bales, intended
    to keep the bales separate during storage, for example for wrapping: ? styrene-butadiene
    rubber (SBR); ? butadiene rubber (BR). Certain applications or processing methods
    require the removal of the film. This part of ISO 20299 does not deal with strippable
    films.'
