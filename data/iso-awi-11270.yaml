abstract:
- language: en
  script: Latn
  content: Currently, LKAS is equipped in many vehicles, and since its launch, the
    accident scene covered by LKAS has been expanded. The scope of this document is
    extended to cover the various LKAS systems currently available on the market.
    This document defines the system classification, minimum functional and performance
    requirements, and test procedures for Lane keeping assistance system (LKAS). LKAS
    is an active safety system aiming to support manual driving to prevent lane/road
    edge departure of the equipped vehicle. LKAS is not a driving automation system
    aiming to reduce the steering operation load by providing sustained lateral control.
    LKAS is intended to operate on paved roads and reacts automatically when unintentional
    deviations from solid or dashed lane markings as well as road edges are detected
    or predicted. However, the driver’s decision and operation take priority at all
    times. This document is applicable to systems integrated into passenger cars,
    commercial vehicles, and buses.
