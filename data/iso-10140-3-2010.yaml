abstract:
- language: en
  script: Latn
  content: ISO 10140-3:2010 specifies laboratory methods for measuring the impact
    sound insulation of floor assemblies. The test results can be used to compare
    the sound insulation properties of building elements, classify elements according
    to their sound insulation capabilities, help design building products which require
    certain acoustic properties and estimate the in situ performance in complete buildings.
