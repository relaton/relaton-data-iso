abstract:
- language: en
  script: Latn
  content: ISO 6877:2006 specifies the dimensions and compositional requirements for
    prefabricated metal or polymeric points or cones suitable for use in the obturation
    of the dental root-canal, but not for support of a coronal restoration. It also
    specifies numerical systems and a colour coding system for designating the sizes.
    Dental root-canal obturating points are marketed sterilized or unsterilized. ISO
    6877:2006 covers the physical attributes expected of such products as supplied.
    Requirements for sterility are not included, and any claim that the product is
    sterile is the responsibility of the manufacturer.
