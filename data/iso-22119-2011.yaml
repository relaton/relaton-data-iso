abstract:
- language: en
  script: Latn
  content: ISO 22119:2010 defines terms for the detection of food-borne pathogens
    in foodstuffs, and isolates obtained from them, using the polymerase chain reaction
    (PCR). ISO 22119:2010 specifies requirements for the amplification and detection
    of nucleic acid sequences (DNA or RNA after reverse transcription) by real-time
    PCR. The minimum requirements laid down in ISO 22119:2010 provide the basis for
    comparable and reproducible results within individual and between different laboratories.
    ISO 22119:2010 is also applicable, for example, to the detection of food-borne
    pathogens in environmental samples and in animal feeding stuffs.
