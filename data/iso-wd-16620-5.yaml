abstract:
- language: en
  script: Latn
  content: ISO 16620-5:2017 specifies the requirements for the declarations and labels
    of the biobased carbon content, the biobased synthetic polymer content and the
    biobased mass content in plastic products. ISO 16620-5:2017 is applicable to plastic
    products and plastic materials, polymer resins, monomers or additives, which are
