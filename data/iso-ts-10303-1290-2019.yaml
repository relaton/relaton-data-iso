abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1290:2019 specifies the application module for Document management.
    The following are within the scope of ISO/TS 10303-1290:2019: facility to assign
    documents to product or activity data; NOTE 1   The definition of the product
    or activity data to which the document is assigned is provided by extending the
    select, documented_element_select, in a further module. facility to assign parts
    or sections of documents to product or activity data; NOTE 2   The definition
    of the product or activity data to which the document is assigned is provided
    by extending the select, documented_element_select, in a further module. assignment
    of properties to a file; assignment of properties to a particular representation
    of a document version; definition of a document version in a digital format such
    as an electronic file; definition of a document version in a non-digital format
    such as paper copy; identification of a digital file, such as a file on a computer
    system; identification of a document; identification of a physical file, such
    as a stack of paper; identification of a version of a document; identification
    of Document_definitions in a digital or physical storage system; identification
    of Files in a digital or physical storage system; relationships between document
    definitions; relationships between files; specification of document-specific properties;
    specification of locations of Document_definitions in a digital or physical storage
    system; specification of locations of Files in a digital or physical storage system;
    specification of the representation of document-specific properties.'
