abstract:
- language: en
  script: Latn
  content: 'ISO 9999:2016 establishes a classification and terminology of assistive
    products, especially produced or generally available, for persons with disability.
    Assistive products used by a person with disability, but which require the assistance
    of another person for their operation, are included in the classification. The
    following items are specifically excluded from this International Standard: -
    items used for the installation of assistive products; - solutions obtained by
    combinations of assistive products that are individually classified in this International
    Standard; - medicines; - assistive products and instruments used exclusively by
    healthcare professionals; - non-technical solutions, such as personal assistance,
    guide dogs or lip-reading; - implanted devices; - financial support.'
