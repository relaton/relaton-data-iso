abstract:
- language: en
  script: Latn
  content: ISO 16871:2003 specifies a method for exposing plastics pipes and fittings,
    individually or assembled, or as pieces therefrom, to natural weathering in order
    to assess changes. The exposure is considered appropriate for evaluating components
    subject to yard storage prior to installation and use without further exposure
    to direct weathering, and is quantified to promote rationalization of exposure
    doses and comparability of data. For exposures appropriate to tropical or equatorial
    conditions, attention is drawn to ISO 877.
