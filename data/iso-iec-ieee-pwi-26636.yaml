abstract:
- language: en
  script: Latn
  content: This document outlines the framework of low-code development tools, proposes
    specific tool capabilities and method requirements, and aims to guide the practice
    of low-code development tools in the software development process. This document
    is applicable to the demanders, suppliers, maintainers, and independent evaluators
    of low-code development tools, aiming to facilitate the better adoption of low-code
    development tools in the processes of software development, including research
    and development, design, testing, evaluation, and implementation.
