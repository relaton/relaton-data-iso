abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements and means of verification for
    wetlaid-nonwoven machinery. This document applies to wetlaid-nonwoven machines,
    including approach flow system, headbox, wire section and jet head, hydroentangling
    unit, dryer, finishing, quality control system (QCS), winder, drives and control
    system. Annex C illustrates general wetlaid-nonwoven machinery and their components.
    It deals with all significant hazards, hazardous situations and hazard events
    relevant to wetlaid-nonwoven machines, when used as intended and under the conditions
    foreseeable by the manufacturer. This document does not deal with pressure hazards
    in steam-heated drying cylinders and does not apply to equipment under pressure.
    This document does not apply to machines which are intended for use in explosive
    atmospheres. This document does not apply to wetlaid-nonwoven machines which have
    been manufactured before the date of publication of this document.
