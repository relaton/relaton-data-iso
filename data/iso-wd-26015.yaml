abstract:
- language: en
  script: Latn
  content: This document specifies the design of the physical and logical interface
    for the electrical power transfer between electrically propelled road vehicles
    and electrical loads e.g. consumer or consumer system. This standard describes
    the physical and functional requirements for an interface for electric power transfer
    between a power system (PS) of an electrified vehicle propulsion system e.g. battery
    electric truck and an electrical consumer system (CS) e.g. trailer. Furthermore
    the document details the systems interaction e.g. functional procedures and safety
    measures. These applications are summarized under the title “electrical power-take-off”
    (ePTO). This specification covers the implementation on a customer pluggable DC
    high power interface operating at up to 1500 VDC. Electrical, geometrical and
    test requirements are defined within this document.
