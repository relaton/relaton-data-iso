abstract:
- language: en
  script: Latn
  content: 'ISO 16964:2015 provides specification and testing requirements for high
    pressure flexible hose assemblies intended to be connected to gas cylinders, bundles
    of cylinders or trailers for use when filling and emptying gas at production sites
    and also for customer use. This International Standard applies to flexible hose
    assemblies with rated pressures up to 1 000 bar for use in the temperature range
    of −40° C to +65° C. This International Standard is not applicable to: -rubber
    and plastics flexible hose assemblies for welding, cutting and related processes
    up to 45 MPa (450 bar) for customer use (see ISO 14113); -high pressure flexible
    hose assemblies for use with medical gas systems for customer use (see ISO 21969);
    -low pressure hose assemblies for use with medical gases, for customer use (see
    ISO 5359); -rubber and thermoplastic low pressure hose assemblies for welding,
    cutting and related processes for customer use (see ISO 3821 or ISO 12170); -flexible
    hose assemblies for cryogenic applications (see ISO 21012); -flexible hose assemblies
    for liquid petroleum gas (LPG). NOTE Flexible hose assembly designs which pass
    the type test approval test described in this International Standard can have
    a lower ratio of burst pressure to rated pressure than stated in other standards.'
