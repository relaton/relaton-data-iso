abstract:
- language: en
  script: Latn
  content: ISO 10987-3:2017 gives requirements and relevant information for evaluating
    used earth-moving machines. It provides the means to evaluate a used machine,
    relative to the information provided by the manufacturer in the operator's manual,
    in order to verify that the used machine is functional as intended by the manufacturer.
    ISO 10987-3:2017 is applicable to earth-moving machines as defined in ISO 6165
    that are used and are planned to be resold. NOTE The used machine might not meet
    all current standards and regulations (e.g. roading and hazardous environments).
