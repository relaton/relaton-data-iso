abstract:
- language: en
  script: Latn
  content: ISO 14723:2009 specifies requirements and gives recommendations for the
    design, manufacturing, testing and documentation of ball, check, gate and plug
    valves for subsea application in offshore pipeline systems meeting the requirements
    of ISO 13623 for the petroleum and natural gas industries. ISO 14723:2009 is not
    applicable to valves for pressure ratings exceeding PN 420 (Class 2500).
