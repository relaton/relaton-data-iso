abstract:
- language: en
  script: Latn
  content: This document specifies an atomic absorption spectrometric method for the
    determination of the iron content of rubbers. The method is applicable to raw
    rubber, rubber products and latex having iron contents of 5 mg/kg to 1 000 mg/kg.
    Higher concentrations can be determined, provided that suitable adjustments are
    made to the mass of the test portion and/or the concentrations of the solution
    used.
