abstract:
- language: en
  script: Latn
  content: 'This document specifies the most common nominal dimensions, in millimetres,
    of: —    shape type 41: flat cutting-off wheel; —    shape type 42: depressed
    centre cutting-off wheel. These bonded abrasive products are intended to be used
    for cutting‑off of any workpiece using stationary or mobile cutting-off machines,
    both manually and mechanically guided. In the application that is manually guided,
    the workpiece is firmly clamped or stabilized by its own weight. The cutting‑off
    wheel is guided by the operator and the workpiece is fixed, or vice versa. This
    document does not specify limit deviations and run‑out tolerances, which are given
    in ISO 13942.'
