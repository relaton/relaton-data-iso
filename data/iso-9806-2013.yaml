abstract:
- language: en
  script: Latn
  content: ISO 9806:2013 specifies test methods for assessing the durability, reliability
    and safety for fluid heating collectors. It also includes test methods for the
    thermal performance characterization of fluid heating collectors, namely steady-state
    and quasi-dynamic thermal performance of glazed and unglazed liquid heating solar
    collectors and steady-state thermal performance of glazed and unglazed air heating
    solar collectors (open to ambient as well as closed loop). It is also applicable
    to hybrid collectors generating heat and electric power. However it does not cover
    electrical safety or other specific properties related to electric power generation.
    ISO 9806:2013 is also applicable to collectors using external power sources for
    normal operation and/or safety purposes. ISO 9806:2013 is not applicable to those
    collectors in which the thermal storage unit is an integral part of the collector
    to such an extent that the collection process cannot be separated from the storage
    process for the purpose of making measurements of these two processes.
