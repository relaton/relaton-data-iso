abstract:
- language: en
  script: Latn
  content: ISO 7488:2018 specifies requirements for electrically-powered mixing machines
    for mixing dental amalgam alloy, and dental mercury in capsules to produce dental
    amalgam. ISO 7488:2018 specifies the test methods used to determine conformity
    with these requirements. ISO 7488:2018 refers to those machines that mix by an
    oscillating action and which are sold by the manufacturer for the purpose of mixing
    dental amalgam whether or not they are intended for mixing any other type of product.
    ISO 7488:2018 does not specify requirements for removable mixing-capsules, as
    are used in many machines to contain the material to be mixed, although considered
    as part of the machine when in use or under test.
