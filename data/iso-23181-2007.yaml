abstract:
- language: en
  script: Latn
  content: ISO 23181:2007 specifies a method for determining the resistance of a hydraulic
    filter element to flow fatigue when subjected to high viscosity fluid, using a
    uniformly varying flow rate up to a predetermined terminal differential pressure
    and a controlled waveform. It establishes a method for verifying the ability of
    a filter element to withstand the flexing caused by cyclic differential pressures
    induced by a variable flow rate.
