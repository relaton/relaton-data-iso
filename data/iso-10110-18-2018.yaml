abstract:
- language: en
  script: Latn
  content: This document specifies the indication of tolerances for four categories
    of imperfections within optical materials — stress birefringence, bubbles and
    inclusions, homogeneity, and striae — in the ISO 10110 series, which standardizes
    drawing indications for optical elements and systems. Tolerances are applied either
    to a finished optical part, a finished system of optical parts, or to the raw
    material used to manufacture an optical part.
