abstract:
- language: en
  script: Latn
  content: ISO 15382:2015 provides procedures for monitoring the dose to the skin,
    the extremities, and the lens of the eye. It gives guidance on how to decide if
    such dosemeters are needed and to ensure that individual monitoring is appropriate
    to the nature of the exposure, taking practical considerations into account. National
    regulations, if they exist, provide requirements that need to be followed. ISO
    15382:2015 specifies procedures for individual monitoring of radiation exposure
    of the skin, extremities (hands, fingers, wrists, forearms, feet and ankles),
    and lens of the eye in planned exposure situations. It covers practices which
    involve a risk of exposure to photons in the range of 8 keV to 10 MeV and electrons
    and positrons in the range of 60 keV to 10 MeV. ISO 15382:2015 gives guidance
    for the design of a monitoring program to ensure compliance with legal individual
    dose limits. It refers to the appropriate operational dose quantities, and it
    gives guidance on the type and frequency of individual monitoring and the type
    and positioning of the dosemeter. Finally, different approaches to assess and
    analyse skin, extremity, and lens of the eye doses are given. It is not in the
    scope of this International Standard to consider exposure due to alpha or neutron
    radiation fields.
