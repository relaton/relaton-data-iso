abstract:
- language: en
  script: Latn
  content: ISO 8061:2015 specifies methods for the selection of the release torques
    for alpine ski-bindings. It gives information necessary to determine the release
    torques; these are to be recommended for use by ski-binding manufacturers in their
    instructions for installation and use, and by ski shops for the adjustment of
    already mounted ski-bindings. It applies to alpine ski-bindings in current use.
    It might be inappropriate for non-mechanical bindings or bindings used with boots
    which reach more than half-way up the lower leg. Manufacturers may use either
    of the two specified methods, or a combination of the two, as the basis for their
    recommended release torques. The methods apply to torque-measuring binding test
    machines. If force-measuring test machines are used, it is necessary to report
    the release force, calculated as shown in Clause 3. In recommending the release
    torques, it is necessary to take into account the abilities of the skier concerned
    by applying skier-type correction factors. For this purpose, three types of skier
    are defined, as described in Annex A.
