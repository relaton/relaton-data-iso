abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the time for a thermosetting
    coating powder to gel at a specified temperature. A method is described for checking
    batch to batch variation and for the quality control of a given coating powder.
    The method is not applicable to coating powders with ultra-short gel times (less
    than 15 s).
