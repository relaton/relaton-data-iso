abstract:
- language: en
  script: Latn
  content: This document provides requirements for water injection equipment-water
    distributor tools used in the petroleum and natural gas industry including low-carbon
    energy. This document includes the specifying, selecting, designing, manufacturing,
    quality control, testing, and transportation preparation of water layered injection
    tools. This document is applicable to those components meeting the definition
    of layered injection tools for water injection equipment, including mandrels and
    flow control devices. This document does not include measurement and adjustment
    devices, logging cables, and surface control devices.
