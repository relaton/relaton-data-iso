abstract:
- language: en
  script: Latn
  content: ISO 19833:2018 specifies test methods for determining the stability, strength
    and durability of all types of fully assembled beds including bed frames and bed
    bases. ISO 19833:2018 applies to adult beds for domestic and non-domestic use.
    It does not apply to waterbeds, airbeds, foldaway beds, bunk beds and beds for
    people with special needs, nor to beds for healthcare and medical purposes. Test
    methods for the assessment of ageing, degradation, fire resistance and electrical
    functions are not included in this document. Other methods for the strength and
    durability of storage components, seating surfaces and other features associated
    with beds are covered by other standards. Where a bed incorporates additional
    functions such as storage, electrical adjustability or conversion from a sofa
    to a bed, additional tests are applicable. ISO 19833:2018 does not specify requirements
    for the choice of loads, cycles or forces. These can be specified in a requirements
    document. If this is not available, suggested loads and cycles can be found in
    Annex A (informative). The tests are not intended to assess the durability of
    upholstery, e.g. filling materials and covers.
