abstract:
- language: en
  script: Latn
  content: ISO 9680:2014 specifies requirements and test methods for operating lights
    used in the dental office and intended for illuminating the oral cavity of patients.
    It also contains specifications on manufacturers' instructions for use, marking
    and packaging. ISO 9680:2014 applies to operating lights, irrespective of the
    technology of the light source. ISO 9680:2014 excludes auxiliary light sources,
    e.g. from dental handpieces and dental headlamps and also operating lights which
    are specifically designed for use in oral surgery.
