abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for the planning and design of centralized
    water reuse systems and water reuse applications in urban areas. This document
    addresses centralized water reuse systems in their entirety and is applicable
    to any water reclamation system component (e.g. source water, treatment, storage,
    distribution, operation and maintenance and monitoring). This document provides:
    —     system components and possible models of a centralized water reuse system;
    —     design principles of a centralized water reuse system; —     common assessment
    criteria and related examples of water quality indicators, all without setting
    any target values or thresholds; —     specific aspects for consideration and
    emergency response. This document excludes design parameters and regulatory values
    of a centralized water reuse system.'
