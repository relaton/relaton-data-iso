abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics and their respective measurement
    methods of graphene-related 2D materials in sheet and particle forms for commercial
    applications with the aim of classification of the materials. The classification
    framework consists of the following elements: a)       relevant material characteristics
    for commercial use; b)       identification of applicable measurement methods;
    c)        a range of the characteristic measured values when applicable; d)      
    syntax to guide consistent naming and descriptions; e)       an applicable technical
    data sheet template.'
