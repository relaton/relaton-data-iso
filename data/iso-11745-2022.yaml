abstract:
- language: en
  script: Latn
  content: This document specifies a qualification test for brazers engaged in manual
    brazing of parts and brazing operators in aerospace construction. NOTE      Success
    in the test is an essential precondition for the qualification of brazers and
    brazing operators in new production and repair work in aerospace. However, brazing
    equipment operators need not be qualified in accordance with this document. This
    document does not apply to general brazing applications covered by ISO 13585.
