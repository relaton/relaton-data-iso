abstract:
- language: en
  script: Latn
  content: This document specifies additional test methods for routine analytical
    cigarette-smoking machines intended to check the conformity of these machines
    with ISO 3308 and ISO 20778. It only establishes additional test methods for smoking
    machines and does not deal with actual smoking, which is described in other International
    Standards. It is composed of four sections relating to — the determination of
    pressure drop (Clause 4); — the determination of significant puff profile parameters
    (Clause 5); — the verification of restricted smoking (Clause 6); — the description
    of the soap film bubble flowmeter for the determination of the puff volume (Clause
    7). NOTE There are more possibilities for determining the aforementioned parameters.
    Systems giving the same results and accuracies can be used. The certificate of
    conformity with this standard can be obtained from the machine manufacturer.
