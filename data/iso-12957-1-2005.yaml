abstract:
- language: en
  script: Latn
  content: ISO 12957-1:2005 describes a method of determining the friction characteristics
    of geotextiles and geotextile-related products in contact with a standard sand,
    i.e. sand with a specified density and moisture content, under a normal stress
    and at a constant rate of displacement, using a direct shear apparatus. The procedure
    can also be used for testing geosynthetic barriers.
