abstract:
- language: en
  script: Latn
  content: 'This document describes requirements on factors related to human physiology,
    ergonomics and performance for the preparation of standards for performance requirements,
    testing and use of respiratory protective devices (RPD). This document gives guidance
    on the generic ergonomic factors related to RPD. It specifies principles relating
    to —    the biomechanical interaction between RPD and the human body, and —   
    the interaction between RPD and the human senses: vision, hearing, smell, taste
    and skin contact. This document does not cover requirements related to specific
    hazards for which RPD are designed.'
