abstract:
- language: en
  script: Latn
  content: ISO 9994:2005 establishes requirements for lighters to ensure a reasonable
    degree of safety for normal use or reasonably foreseeable misuse of such lighters
    by users. The safety specification given in this International Standard applies
    to all flame-producing products commonly known as cigarette lighters, cigar lighters
    and pipe lighters. It does not apply to matches, nor does it apply to other flame-producing
    products intended solely for igniting materials other than cigarettes, cigars,
    and pipes. Lighters, being flame-producing devices, can, as do all flame sources,
    present a potential hazard to users. The safety specification given in this International
    Standard cannot eliminate all hazards, but is intended to reduce potential hazards
    to users.
