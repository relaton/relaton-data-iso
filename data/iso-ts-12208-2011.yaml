abstract:
- language: en
  script: Latn
  content: ISO/TS 12208:2011 describes a method to estimate energetic proton fluences
    in geosynchronous earth orbit (GEO) over a long duration (beyond the 11-year solar
    cycle), and presents guidelines for the selection of a confidence level in a model
    of solar proton fluences to estimate solar cell degradation. Many of the proton
    data observed in GEO are archived, for example GMS (Japan), METEOSAT (ESA) and
    GOES (USA). This method is a direct integration of these fluence data (or the
    observed data over 11 years is used periodically). As a result, the confidence
    level can be selected from a model of solar proton fluences. ISO/TS 12208:2011
    is an engineering-oriented method used for specific purposes such as estimating
    solar panel degradation.
