abstract:
- language: en
  script: Latn
  content: 'This document establishes a tolerance classification system for the manufacture and conformity assessment of tooth flanks of individual bevel gears with and without axle offset. It specifies definitions for gear flank tolerance terms, the structure of the flank tolerance class system, and allowable values.    This part of ISO 1328 provides the gear manufacturer and the gear buyer with a mutually advantageous reference for uniform tolerances.    Twelve flank tolerance classes are defined, numbered 1 to 12, in order of increasing tolerance. These tolerances apply to the following ranges: — 0,5 mm ≤ mm ≤ 50 mm; — 2 ≤ z ≤ 400; — 3 mm ≤ dm ≤ 3 500 mm.'
