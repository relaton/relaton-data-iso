abstract:
- language: en
  script: Latn
  content: 'This document specifies the interface dimensions and basic performance
    requirements for two series of hydraulic quick-action couplings. Both series are
    in widespread use and have similar technological advantages: —    Series A is
    used predominantly in Europe and is preferred worldwide for agricultural and forestry
    machinery. This document specifies additional requirements for Series A for use
    in the agricultural machinery applications given in ISO 5675. —    Series B is
    used predominantly in North America and in the chemical industry.'
