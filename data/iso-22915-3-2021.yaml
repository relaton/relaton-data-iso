abstract:
- language: en
  script: Latn
  content: This document specifies the tests for verifying the stability of reach
    trucks (with retractable mast or fork arm carriage) and straddle trucks, equipped
    with tilting or non-tilting masts or fork arms and having a rated capacity up
    to and including 5 000 kg. It is also applicable to such trucks operating under
    the same conditions when equipped with load-handling attachments.
