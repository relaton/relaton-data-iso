abstract:
- language: en
  script: Latn
  content: The purpose of this document is to provide background information on driver
    state monitoring (DSM) in the context of partial driving automation (SAE L2).
    It describes existing DSM implementations (including system interventions), the
    underlying design guidelines and provisions by relevant stakeholders in the field,
    as well as considerations on how to validate the effectiveness of driver state-related
    system interventions. Moreover, the document introduces a conceptual framework
    for “driver readiness and intervention management” for the purpose of providing
    a comprehensive view of relevant aspects of driver readiness and harmonizing terms
    and definitions in this field. It is believed that this framework can be helpful
    when comparing different approaches for driver state assessment. The document
    does not contain any specific technical requirements for current or future system
    implementations of driver state monitoring.
