abstract:
- language: en
  script: Latn
  content: 'This International Standard provides the complementary product category
    rules to quantify the carbon footprints of steel and aluminium products based
    on general requirements and guidance defined in ISO 14067:2017. This Standard
    provides for the adoption of basic requirements and guidance for development of
    product category rules as defined in ISO/TS 14027:2017. NOTE: ISO 14067:2017 “Greenhouse
    gases - Carbon footprint of products – Requirements and guidelines” is currently
    under revision in ISO/TC207/SC7/JWG8 as ISO/AWI 14067. This International Standard
    defines the system boundaries of product life cycle and scenario development for
    life cycle modules for construction products based on ISO 21930:2017'
