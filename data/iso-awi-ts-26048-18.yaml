abstract:
- language: en
  script: Latn
  content: Cooperative Intelligent Transport Systems (C-ITS) is a surface transportation
    environment where connected devices, such as vehicles or mobile devices (e.g.,
    smartphones) interact or "talk" directly with each other, and the road infrastructure.
    This environment could dramatically reduce the number of fatalities and injuries
    on the roadways, while improving mobility and environmental impacts. The roadside
    units (RSU) is a key enabling component of the C-ITS environment - it serves as
    an interface, also known as vehicle-to-infrastructure (V2I) interface, between
    connected devices and the roadway infrastructure. This standard specifies the
    logical interface between an RSU and the controlling management stations. This
    standard defines information that may be exchanged across this interface. This
    standard identifies the relevant RSU users and their needs, defines requirements
    that enable information exchanges that supports those needs, and finally defines
    the data objects including the relative structure of that data, necessary to meet
    these requirements.
