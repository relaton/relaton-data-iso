abstract:
- language: en
  script: Latn
  content: This document defines a methodology to evaluate scenarios and provides
    a procedure for extending test scenarios to test cases. This document also defines
    the necessary characteristics of test cases, which include but are not limited
    to unified identifiers, test objectives, inputs, steps, platforms and expected
    results. This document describes methods and criteria to evaluate test cases (e.g.
    frequency, criticality, complexity of a scenario), the coverage concerning functional
    and technical requirements, operational domain (OD), test criteria, and also the
    optimization of sets of prioritized test cases. This document is applicable to
    Level 3 and higher ADSs as defined in ISO/SAE PAS 22736. The focus of this document
    is on scenarios, which will be tested to evaluate safety (functional safety and
    safety of the intended functionality (SOTIF)). The content, in general, is also
    applicable to non-safety related test scenarios.
