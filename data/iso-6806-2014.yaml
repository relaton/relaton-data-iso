abstract:
- language: en
  script: Latn
  content: 'ISO 6806:2014 specifies the minimum requirements for rubber hoses and
    hose assemblies for use in oil burners. The following two types of hose assembly
    are specified. Type 1: Hose assemblies for flux and reflux, but not for insertion
    between the oil burner pump and the atomizing connection; maximum working pressure
    1,0 MPa (10 bar); maximum oil temperature 100 °C. Type 2: Hose assemblies for
    insertion between the oil burner pump and the atomizing connection; working pressure
    4,0 MPa (40 bar); maximum oil temperature 100 °C.'
