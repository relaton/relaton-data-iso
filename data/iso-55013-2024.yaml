abstract:
- language: en
  script: Latn
  content: This document gives guidance on managing data to support an organization
    in meeting its asset management objectives and by extension its organizational
    objectives. This document is applicable to any organization, regardless of its
    type or size. This document does not provide methodologies to derive or appraise
    value for data assets. This document does not provide methodologies to derive
    financial values for data assets. This document does not provide direction to organizations on
    the need (or not) for calculating financial values for asset data.
