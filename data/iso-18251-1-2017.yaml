abstract:
- language: en
  script: Latn
  content: 'ISO 18251-1:2017 describes the main components, and their characteristics,
    constituting an infrared (IR) imaging system and related equipment used in non-destructive
    testing (NDT). It also aims to assist the user in the selection of an appropriate
    system for a particular measurement task. The following items are specified: -
    objective lens; - detector; - image processor; - display; - thermal stimulation
    source; - accessories.'
