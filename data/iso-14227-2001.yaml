abstract:
- language: en
  script: Latn
  content: This International Standard specifies the general requirements for the
    construction as well as the performance of type tests of magnetic compasses on
    board small craft of hull length up to 24 m. It refers to liquid magnetic compasses,
    which can be inspected (e.g. not sealed), either equipped with a direct reading
    system, or of the reflecting/projecting type. This International Standard also
    covers magnetic compasses (3.1) not supported on gimbals. The requirements relating
    to gimbals do not refer to such magnetic compasses. This International Standard
    does not cover  dry card compasses, or  types of compasses designed on principles
    different from those stated above or not complying with the description given
    in this clause (e.g. transmitting compasses).
