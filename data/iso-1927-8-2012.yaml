abstract:
- language: en
  script: Latn
  content: ISO 1927-8:2012 specifies methods for the determination of the properties
    of unshaped refractory materials from test pieces prepared and stored in accordance
    with ISO 1927-5. The methods complement those described in ISO 1927-6. The methods
    have been adapted from standards for shaped refractory products to make them applicable
    to dense and insulating castables, and ramming materials as defined in ISO 1927-1,
    before and after firing.
