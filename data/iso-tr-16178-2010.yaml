abstract:
- language: en
  script: Latn
  content: ISO/TR 16178:2010 establishes a list of critical chemical substances potentially
    present in footwear and footwear components. ISO/TR 16178:2010 describes the critical
    chemical substances, their potential risks, in which materials they could be found,
    and which test method(s) can be used to quantify them. It does not include requirements;
    it is the responsibility of the user of ISO/TR 16178:2010 to fix his level of
    acceptance, e.g. using a defined concentration or detection limit or quantification
    limit. ISO/TR 16178:2010 applies to any kind of footwear and footwear material.
