abstract:
- language: en
  script: Latn
  content: The scope of 4448-16 includes the capabilities, characteristics and certification
    of ground based automated mobility (such as public and automated mobile robots
    (PMRs and AMRs), automated return-to-base micromobility, automated wheelchairs
    etc,) required for safe operation in public spaces. This is focused on safety
    aspects of service robots operating in pedestrianized spaces and is exclusive
    of road-scaled motor vehicles for passenger and goods transport. It also describes
    the procedures that shall be performed in emergency situations.
