abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides guidance for certification
    bodies providing audit and certification of an ITAMS in accordance with ISO/IEC
    19770-1. It does not change the requirements specified in ISO/IEC 19770-1. This
    document can also be used by accreditation bodies for the accreditation of certification
    bodies. However, this document does not specify requirements or provides guidance
    for accreditation bodies to audit certification bodies. A certification body providing
    ITAMS certification is expected to be able to demonstrate fulfilment of the requirements
    specified in this document, in addition to the requirements in ISO/IEC 17021-1.
