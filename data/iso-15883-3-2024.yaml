abstract:
- language: en
  script: Latn
  content: This document specifies requirements for washer-disinfectors (WD) that
    are intended to be used for emptying, flushing, washing and thermal disinfection
    of non-critical devices in the form of human waste containers by one operating
    cycle. This document is intended to be used in conjunction with the general requirements
    specified in ISO 15883-1:2024, except for those specified in 4.1.1, and with the
    requirements of ISO 15883-5:2021, except for those specified in 4.1.2.
