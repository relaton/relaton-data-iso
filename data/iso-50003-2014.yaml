abstract:
- language: en
  script: Latn
  content: ISO 50003:2014 specifies requirements for competence, consistency and impartiality
    in the auditing and certification of energy management systems (EnMS) for bodies
    providing these services. In order to ensure the effectiveness of EnMS auditing,
    ISO 50003:2014 addresses the auditing process, competence requirements for personnel
    involved in the certification process for energy management systems, the duration
    of audits and multi-site sampling. ISO 50003:2014 is intended to be used in conjunction
    with ISO/IEC 17021:2011. The requirements of ISO/IEC 17021:2011 also apply to
    ISO 50003:2014.
