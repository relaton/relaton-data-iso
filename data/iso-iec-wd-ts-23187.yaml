abstract:
- language: en
  script: Latn
  content: 'This document provides an overview of and guidance on interactions between
    cloud service partners (CSNs), specifically cloud service brokers, cloud service
    developers and cloud auditors, and other cloud service roles based on the ISO/IEC
    22123 series. In addition, this document provides guidance on how cloud service
    agreements (CSAs) and cloud service level agreements (cloud SLAs) are used to
    address those interactions including the following: a) Definitions of terms and
    concepts, and provision of an overview for interactions between CSNs and CSCs
    and CSPs; b) Definition and specification of CSN sub-roles; c) Specification of
    types of CSNs interactions; d) Specification of the interaction between CSNs and
    CSCs; e) Specification of the interaction between CSNs and CSPs; f) Specification
    of elements of CSAs and Cloud SLAs for CSN interactions, both with CSPs and with
    CSCs.'
