abstract:
- language: en
  script: Latn
  content: ISO 4885:2017 defines important terms used in the heat treatment of ferrous
    materials. NOTE The term ferrous materials include products and workpieces of
    steel and cast iron. Annex A provides an alphabetical list of terms defined in
    this document, as well as their equivalents in French, German, Chinese and Japanese.
