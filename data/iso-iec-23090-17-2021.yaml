abstract:
- language: en
  script: Latn
  content: This document specifies the conformance and reference software for omnidirectional
    media format (specified in ISO/IEC 23090‑2). This document describes the reference
    software modules and the features that is supports. It also provides a description
    of how the reference software can be utilized. In addition, the document lists
    and describes test vectors comprising ISO base media file format files, media
    presentation descriptions, segments and combinations thereof that conform to ISO/IEC 23090‑2.
