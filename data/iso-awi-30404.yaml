abstract:
- language: en
  script: Latn
  content: 'This document provides the following: (a) An explanation of defining metric
    types as input, process, output, or outcome metrics and how to use this information.
    (b) An explanation of the impact of metric outcomes on economy, efficiency, or
    effectiveness outcomes and how to apply this knowledge. (c) A framework of data
    points to help organizations measure their own existing and future data points.
    (d) A framework and explanation of the workforce activity flow within an organization
    — a “workforce lifecycle”. (e) An explanation of the basics of applying root cause
    principles when using metrics as investigative tools to solve (complex) organizational
    challenges. (f) A framework that allows HR practitioners, managers, and business
    owners to understand the linkages between data, function and metrics and apply
    this knowledge to positively impact outcomes within organizations.'
