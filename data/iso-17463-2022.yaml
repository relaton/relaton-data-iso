abstract:
- language: en
  script: Latn
  content: This document gives guidelines on how to perform accelerated cyclic electrochemical
    technique (ACET) with organic protective coatings on metals. This document specifies
    the execution of an ACET test and the considerations relative to the samples and
    electrochemical cell, test parameters and procedure. This document also provides
    guidelines for the presentation of experimental results such as Bode plots and
    relaxation curves and other types of information obtained. Some typical examples
    are shown in Annex A.
