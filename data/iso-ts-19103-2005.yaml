abstract:
- language: en
  script: Latn
  content: ISO TS 19103:2005 provides rules and guidelines for the use of a conceptual
    schema language within the ISO geographic information standards. The chosen conceptual
    schema language is the Unified Modeling Language (UML). ISO TS 19103:2005 provides
    a profile of UML for use with geographic information. In addition, it provides
    guidelines on how UML should be used to create standardized geographic information
    and service models.
