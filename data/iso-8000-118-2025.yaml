abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for natural location identifiers.
    These requirements supplement those of ISO 8000-115. The following are within
    the scope of this document: —     requirements for the prefix element and a single
    sub-domain element in a location identifier; —     requirements for representing
    latitude, longitude and storey or elevation of a location. The following are outside
    the scope of this document: —     methods to identify latitude, longitude and
    elevation.'
