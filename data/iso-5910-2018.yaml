abstract:
- language: en
  script: Latn
  content: 1.1 This document applies to all heart valve repair systems that have an
    intended use to repair and/or improve the function of native human heart valves
    by acting either on the valve apparatus or on the adjacent anatomy (e.g. ventricle,
    coronary sinus). 1.2 This document outlines an approach for verifying/validating
    the design and manufacture of a heart valve repair system through risk management.
    The selection of appropriate verification/validation tests and methods are derived
    from the risk assessment. The tests include assessments of the physical, chemical,
    biological, and mechanical properties of components and materials of heart valve
    repair systems. The tests also include preclinical in vivo evaluation and clinical
    investigation of the finished heart valve repair system to assess the safety and
    effectiveness of the heart valve repair system. NOTE For the purposes of this
    document, effectiveness endpoint includes clinical performance and benefits. 1.3
    This document defines operational conditions and performance requirements for
    heart valve repair systems where adequate scientific and/or clinical evidence
    exists for their justification. 1.4 This document excludes Cardiac Resynchronization
    Therapy (CRT) devices, paravalvular leakage closure devices, systems that do not
    leave an implant in place (e.g. ablation, radio frequency annuloplasty), apical
    conduits and devices with components containing viable cells. This Standard also
    excludes materials not intended for repairing and/or improving the function of
    human heart valves according to its intended use (e.g. patch material and sutures
    used in general surgical practice). NOTE A rationale for the provisions of this
    document is given in Annex A.
