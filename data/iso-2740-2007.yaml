abstract:
- language: en
  script: Latn
  content: 'ISO 2740:2007 is applicable to all sintered metals and alloys, excluding
    hardmetals. ISO 2740:2007 specifies: the die cavity dimensions used for making
    tensile test pieces by pressing and sintering, and by Metal Injection Moulding
    (MIM) and sintering;the dimensions of tensile test pieces machined from sintered
    and powder forged materials.'
