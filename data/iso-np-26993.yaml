- language: en
  script: Latn
  content: This document specifies the requirements, analytical methods, and harvesting, straining, packaging, labelling, marking, storage and transportation conditions for stingless bees honey. This document is applicable to stingless bees honey collected from honey pots. It does not apply to honey from Apis species and stingless bees honey blended with honey from Apis Species.
