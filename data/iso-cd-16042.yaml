- language: en
  script: Latn
  content: ISO 16042:2007 describes recommended procedures for the use of CRMs that
    have been prepared and certified in accordance with ISO 11459. Such CRMs are used
    by laboratories to carry out the trueness tests as specified in the various International
    Standards for the chemical analysis of iron ores, to verify the analysis of shipment
