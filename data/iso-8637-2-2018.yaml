abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the blood circuit for devices
    used in extracorporeal blood filtration therapies such as, but not limited to,
    haemodialysis, haemodiafiltration, haemofiltration and transducer protectors (integral
    and non-integral) intended for use in such circuits. This document does not apply
    to: — haemodialysers, haemodiafilters or haemofilters; — plasmafilters; — haemoperfusion
    devices; — vascular access devices; — blood pumps; — pressure monitors for the
    extracorporeal blood circuit; — air detection devices; — systems to prepare, maintain
    or monitor dialysis fluid; — systems or equipment intended to perform haemodialysis,
    haemodiafiltration, haemofiltration or haemoconcentration. NOTE 1 Requirements
    for haemodialysers, haemodiafilters, haemofilters and haemoconcentrators are specified
    in ISO 8637‑1, and requirements for plasmafilters are specified in ISO 8637‑3.
    NOTE 2 Extracorporeal blood tubing sets can also be used for other extracorporeal
    therapies such as haemoperfusion, plasmafiltration and plasma adsorption.'
