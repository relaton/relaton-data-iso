abstract:
- language: en
  script: Latn
  content: ISO 14119:2013 specifies principles for the design and selection ? independent
    of the nature of the energy source ? of interlocking devices associated with guards.It
    covers the parts of guards which actuate interlocking devices. It does not necessarily
    provide all the specific requirements for trapped key systems. ISO 14119:2013
    provides measures to minimize defeat of interlocking devices in a reasonably foreseeable
    manner.
