abstract:
- language: en
  script: Latn
  content: This document specifies an accelerated corrosion test method for evaluation
    of the galvanic corrosion of crevice parts where 2 types of dissimilar materials
    are in contact, and is applicable to metals and their alloys, metal coatings,
    and conductive resins under atmospheric corrosion environments assuming the use
    of de-icing salts. The test method includes cyclic dry and wet conditions at constant
    absolute humidity. It also specifies devices, reagents, procedures and measurement
    method used to perform this test method. This document does not specify the dimensions
    or types of test samples, the test period when using a specific product, or the
    interpretation of the results. Such details shall be described in the appropriate
    product specification. This test method is suitable for ascertaining the galvanic
    corrosivity of 2 dissimilar materials. It is not intended for use in evaluating
    the corrosion protection performance of paints or secondary materials (sealers,
    waxes, etc.) of 2 dissimilar materials.
