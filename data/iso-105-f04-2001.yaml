abstract:
- language: en
  script: Latn
  content: This part of ISO 105 specifies an undyed polyester adjacent fabric which
    may be used for the assessment of staining in colour fastness tests. The staining
    properties of the polyester adjacent fabric under test are assessed against a
    polyester reference adjacent fabric, using a polyester dyed reference fabric,
    both of which are available from a specified source.
