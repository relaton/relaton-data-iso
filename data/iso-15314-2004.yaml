abstract:
- language: en
  script: Latn
  content: ISO 15314:2004 describes three methods for the exposure of plastics in
    a marine environment. Method A covers exposures where specimens float on the surface,
    method B covers exposures where specimens are partially immersed and method C
    covers exposures where specimens are completely immersed. Although intended for
    marine (salt water) exposure, the methodology might be used with outdoor brackish
    water and fresh-water exposures as well. Method A is particularly applicable to
    enhanced-degradability plastics where the environmental degradation under marine
    floating exposure is expected to be accelerated relative to that of regular plastic
    materials. The standard specifies the general requirements for the apparatus,
    and procedures for using the test methods described. It lists properties that
    may be used to evaluate changes in plastics subjected to marine exposure. More
    specific information about methods for determining the changes in properties of
    plastics on exposure and reporting these results is given in ISO 4582, Plastics
    -- Determination of changes in colour and variations in properties after exposure
    to daylight under glass, natural weathering or laboratory light sources.
