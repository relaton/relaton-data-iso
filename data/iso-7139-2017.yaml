abstract:
- language: en
  script: Latn
  content: ISO 7139:2017 specifies laboratory measurement methods to determine the
    elastic properties of cross-country skis. Its purpose is to calculate the resistance
    of defined parts of the ski to bending. ISO 7139:2017 applies to cross-country
    skis with a nominal length greater than or equal to 150 cm. The standard measurement
    procedures can be used to ensure comparability between laboratory measurement
    data, determined and published by ski manufacturers, institutions or others. In
    ISO 7139:2017, no attempt is made to relate the measurement data to the quality
    of the ski
