abstract:
- language: en
  script: Latn
  content: ISO 14520-2:2005 gives specific requirements for gaseous fire-extinguishing
    systems, with respect to the CF3I extinguishant. It includes details of physical
    properties, specification, usage and safety aspects and is applicable to systems
    operating at a nominal pressure of 25 bar. This does not preclude the use of other
    systems.
