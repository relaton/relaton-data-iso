abstract:
- language: en
  script: Latn
  content: '1.1 This International Standard specifies domestic washing and drying
    procedures for textile testing. The procedures are applicable to textile fabrics,
    garments or other textile articles which are subjected to appropriate combinations
    of domestic washing and drying procedures. This International Standard also specifies
    the reference detergents and ballasts for the procedures. 1.2 Provision is made
    for a) 13 different washing procedures based on the use of the reference washing
    machine Type A: horizontal axis, front-loading type, b) 11 procedures based on
    the use of the reference washing machine Type B: vertical axis, top-loading agitator
    type, and c) 7 procedures based on the use of the reference washing machine Type
    C: vertical axis, top-loading pulsator type. 1.3 Each washing procedure represents
    a single domestic wash. 1.4 This International Standard also specifies six drying
    procedures: A — Line dry B — Drip line dry C — Flat dry D — Drip flat dry E —
    Flat press F — Tumble dry 1.5 A complete test consists of a washing and drying
    procedure. NOTE Use of different parameters (washing machine type, detergent type
    and type of tumble drier) may affect test results for any test using this International
    Standard. Therefore, parties using this standard are strongly encouraged to agree
    on the parameters to be used.'
