abstract:
- language: en
  script: Latn
  content: This document specifies titanium and titanium alloy commonly used in manufacturing dental instruments. It is applicable to titanium and titanium alloy materials used to manufacturer either an entire instrument or part of the instrument. It is applicable to single-use and reusable dental instruments, whether it is or it is not connected to a power-driven system. This document is not applicable to devices and instruments used long-term in the mouth of the patient (e.g. crown, bridge, implants fixture) or to devices and instruments not made of titanium and titanium alloy. It contains a current selection of titanium and titanium alloy suitable for use in the manufacturer of dental instruments.
