abstract:
- language: en
  script: Latn
  content: ISO 9043:2008 specifies a measuring method for determining the moments
    of inertia of the moped and of the moped/rider combination. It applies to two-wheeled
    mopeds. Other measuring methods can be used if it is demonstrated that the results
    are equivalent. Measurement results obtained exclusively by the method described
    in ISO 9043:2008 cannot be used for an evaluation of vehicle stability because
    they deal with only one aspect of this very complex phenomenon.
