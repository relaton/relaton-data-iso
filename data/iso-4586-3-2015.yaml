abstract:
- language: en
  script: Latn
  content: ISO 4586‑3:2015 applies to laminates less than 2 mm thick normally intended
    for bonding to supporting substrates to produce HPL composite panels and establishes
    a classification system for high-pressure decorative laminates according to their
    performance and main recommended fields of application, including materials with
    special characteristics, for example formability or defined reaction to fire.
    ISO 4586‑3:2015 also specifies requirements for the properties of the various
    types of laminates covered by this classification system.
