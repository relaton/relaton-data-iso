abstract:
- language: en
  script: Latn
  content: This document provides selection criteria for standardization and safe
    usage of graphics, icons or pictograms across healthcare systems by specifying
    technical requirements of the design to include pixel size in digital systems,
    shape and colour to ensure easy readability and functionality across devices.
    In addition, it defines methods which help ensure that each graphic has a well-defined
    meaning across various categories of users. The document will have a few sample
    images with possible linkages to standard terminologies or information models
    as well as related challenges as an aid to users and designers.
