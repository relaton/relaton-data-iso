abstract:
- language: en
  script: Latn
  content: This document specifies a protocol for the evaluation and validation of
    alternative quantitative methods of milk analysis. This document is also applicable
    for the validation of new alternative methods where, due to a limited number of
    operational instruments, the execution of an interlaboratory study and ISO 8196-1 | IDF 128-1
    is not feasible. The protocol is applicable to milk parameters such as, for example,
    fat, protein, lactose, urea and somatic cells in milk. It can also be extended
    to other parameters. This document also establishes the general principles of
    a procedure for granting international approvals for the performance of the alternative
    methods. These principles are based on the validation protocol defined in this
    document.
