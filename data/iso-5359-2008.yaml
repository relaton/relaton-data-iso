abstract:
- language: en
  script: Latn
  content: 'ISO 5359:2008 specifies requirements for low-pressure hose assemblies
    intended for use with the following medical gases: oxygen; nitrous oxide; medical
    air; helium; carbon dioxide; xenon; specified mixtures of the gases listed above;
    oxygen-enriched air; air for driving surgical tools; nitrogen for driving surgical
    tools; vacuum. It is intended in particular to ensure gas-specificity and to prevent
    cross-connection between systems conveying different gases. These hoses assemblies
    are intended for use at maximum operating pressures less than 1 400 kPa. ISO 5359:2008
    specifies the allocation of non-interchangeable screw-threaded (NIST) connectors,
    diameter-index safety system (DISS) connectors and sleeve indexed system (SIS)
    connectors to medical gases and specifies the dimensions of non-interchangeable
    screw-threaded (NIST) connectors.'
