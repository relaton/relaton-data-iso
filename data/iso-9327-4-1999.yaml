abstract:
- language: en
  script: Latn
  content: '1.1 This part of ISO 9327 applies to forgings and rolled or forged bars
    in thicknesses up to 250 mm manufactured from fine grain steels (see NOTE) given
    in Table 1 and to be delivered according to the specifications given in ISO 9327-1.
    The steels are classified into room temperature grades (P...), elevated temperature
    grades (PH...), low temperature grades (PL...), low and elevated temperature grades
    (PLH...). NOTE Fine grain steels are here understood as steels with grain size
    6 or finer according to the grain size charts in ISO 643. 1.2 This part of ISO
    9327 covers the following data: a) In Table 1 the limits for the chemical composition
    according to the cast analysis; the tensile properties at room temperature; the
    indications on the usual heat treatment condition at the time of delivery; b)
    in Table 2 the permissible product analysis tolerances on the limiting values
    given for the cast analysis; c) in Table 3 the minimum impact energy values; d)
    in Table 4 the minimum elevated temperature proof strength values.'
