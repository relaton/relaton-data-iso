abstract:
- language: en
  script: Latn
  content: 'This document gives guidance on the development of a facility management
    (FM) organization working on the strategic, tactical and operational management
    levels to: satisfy the needs and objectives of the demand organization and users
    of its facility; meet the needs of stakeholders and applicable FM requirements
    consistently; provide a safe, healthy, secure and efficient environment that enhances
    the workplace experience for users; protect the asset value and resource value
    of the facility; provide appropriately specified, responsive and cost-effective
    facility services; implement measures to minimize the impact of climate change
    on the facility; contribute to goals and targets consistent with sustainable development;
    improve the usefulness and benefits provided by the FM system.'
