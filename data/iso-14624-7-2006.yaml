abstract:
- language: en
  script: Latn
  content: ISO 14624-7:2006 specifies test equipment and techniques used to identify
    interactions resulting from exposure of a material to an aerospace fluid. ISO
    14624-7:2006 can be used to determine the reactivity of materials with aerospace
    fluids. It provides a means to determine the effects of minor amounts of aerospace
    fluids, such as in a splash or spill, on materials used in ground support processing
    operations, and in the selection of personal safety equipment.
