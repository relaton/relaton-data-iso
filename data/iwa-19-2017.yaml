abstract:
- language: en
  script: Latn
  content: IWA 19:2017 provides a global framework for the sustainable management
    of secondary metals. The framework includes sustainability and traceability requirements
    for metals recovered. IWA 19:2017 guides economic operators of secondary metals
    value chains, including those engaged in the informal sector, in the efficient
    and credible implementation of improved recycling practices, in particular in
    emerging and developing economies.
