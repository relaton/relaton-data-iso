abstract:
- language: en
  script: Latn
  content: ISO 11901-1:2003 specifies the dimensions, in millimetres, nominal initial
    forces and type of gas springs. It applies to gas springs of type 900 to 100 000,
    pressurized with nitrogen with a nominal initial force of between 900 N and 100
    600 N, for use in press tools. ISO 11901-1:2003 also specifies marking, technical
    delivery conditions and designation.
