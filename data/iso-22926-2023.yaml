abstract:
- language: en
  script: Latn
  content: This document provides requirements and recommendations for specification
    and verification of synthetic anatomical bone models for use in testing of implants.
    The anatomical source of the synthetic model can be digital data from computed
    tomography (CT) scanning or any other sources such as from cadaveric specimens
    or statistically determined shape data. The specifications covered in this document
    are 3D shape and mechanical characteristics. Other characteristics, such as colour
    or cosmetic features, are not considered in this document.
