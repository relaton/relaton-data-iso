abstract:
- language: en
  script: Latn
  content: This document gives guidance on the selection of test methods for evaluating
    the performance of vitreous and porcelain enamelled finishes in different applications.
    This document references the test methods available for measuring the properties
    of these finishes and correlates these properties to the requirements of specific
    enamelled articles. This document is limited for the most part to test methods
    in ISO documents or European standards but does not provide acceptance criteria
    or performance limits for the properties. This document is applicable to all enamelled
    articles, irrespective of their basis metals.
