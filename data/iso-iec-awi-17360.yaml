abstract:
- language: en
  script: Latn
  content: 'This document defines the basic features of RFID for use in the supply
    chain when applied to product tagging, product packaging, transport units and
    returnable transport items (RTIs) and returnable packaging items (RPIs). This
    document: —    provides specifications for the identification of the items, —   
    makes recommendations about additional information on the RF tag, —    specifies
    the semantics and data syntax to be used, —    specifies the data protocol to
    be used to interface with business applications and the RFID system, —    specifies
    the minimum performance requirements, —    specifies the air interface standards
    between the RF interrogator and RF tag, and —    specifies the reuse and recyclability
    of the RF tag.'
