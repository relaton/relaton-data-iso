abstract:
- language: en
  script: Latn
  content: 'The proposed standard provides recommended coating systems for ductile
    iron pipelines based on evaluation of soil characteristics, with details of the
    manner the data may be collected and the details of the soil testing methods.
    This standard provides guidance on: Identification of the influencing parameters,
    the methods of testing the soil to evaluate the influence of those parameters
    and to provide recommended coating systems based on the results of that testing.'
