abstract:
- language: en
  script: Latn
  content: 'ISO 16001:2008 specifies general requirements and describes methods for
    evaluating and testing the performance of hazard detection systems (HDS) and visual
    aids (VA) used on earth-moving machines. It covers the following aspects: detection
    of people in the detection zone; visual and/or audible warning(s) to the operator
    and/or to the persons in the detection zone; operational reliability of the system;
    compatibility and environmental specifications of the system. It is applicable
    to machines as defined in ISO 6165. HDS and/or VA can be used to augment the operator''s
    direct vision (see ISO 5006) or indirect vision using mirrors (see ISO 14401)
    or to provide additional means of hazard detection, for example, where ergonomic
    considerations limit the effectiveness of direct vision, e.g. to avoid repeated
    turning of the head and upper body.'
