abstract:
- language: en
  script: Latn
  content: ISO/TS 22595-1:2006 is applicable to dental suction equipment in the plant
    area, used to source suction for the dental equipment specified in ISO 10637.
    ISO/TS 22595-1:2006 gives recommended guidelines for performance as well as test
    procedures for dental suction equipment including suction machines, amalgam separators,
    filters, valves, pipes, fittings and exhaust requirements. ISO/TS 22595-1:2006
    is limited to the performance of the suction system at the suction line connection
    point.
