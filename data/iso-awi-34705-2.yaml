abstract:
- language: en
  script: Latn
  content: 'This document specifies a data model to describe crops (considered as
    plant species or varieties being grown/managed/insured/registered in each area
    during a given time interval) in the context of agrifood systems. This document
    covers aspects such as but not limited to: - Differentiating between cultivated
    plants and wild vegetation. - Classification criteria based on usage (e.g. seed
    corn vs. grain corn vs. corn silage; food, feed, fibre, biofuel, industrial crops).
    - Differentiating among parts of the plant being harvested. - Classification based
    on management methods (e.g. genetically modified, organic, and conventionally
    grown crops; irrigated vs dryland). - Accounting for cultural and regional variations
    in crop classification and terminology, to support alignment across diverse national
    and local systems. Scope includes, but is not limited to, comparing and mapping
    the proposed model with existing resources in the industry: - European and Mediterranean
    Plant Protection Organization (EPPO) plant list - National crop lists for trade
    and regulation - Codex Alimentarius: Food safety-related plant classifications.
    - FAO Guidelines: Agricultural and statistical definitions. - Existing ISO standards
    on agriculture: Ensuring alignment with ISO standards related to seeds, plant
    health, and farming practices.'
