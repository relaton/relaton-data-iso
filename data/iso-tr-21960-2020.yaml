abstract:
- language: en
  script: Latn
  content: This document summarizes current scientific literature on the occurrence
    of macroplastics and microplastics, in the environment and biota. It gives an
    overview of testing methods, including sampling from various environmental matrix,
    sample preparation and analysis. Further, chemical and physical testing methods
    for the identification and quantification of plastics are described. This document
    gives recommendations for three steps necessary for the standardization of methods
    towards harmonized procedures for sampling, sample preparation and analysis. This
    document does not apply indoor and health related aspects. NOTE The collection
    of plastics or microplastics in the environment by citizen social monitoring projects
    is not in the scope of this document. Although such projects can help sensitize
    the society to environmental problems and can even reduce the entry and presence
    of plastics in the environment, this monitoring concept is not considered suitable
    for a robustly representative and scientific analysis of microplastics in the
    environment via standardization.
