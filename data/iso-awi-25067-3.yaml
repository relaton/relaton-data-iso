abstract:
- language: en
  script: Latn
  content: This document provides a framework and consistent terminology for specifying
    the user-system interaction and the user interface of an interactive system in
    terms of conceptual design, user-system interaction design, and user interface
    design. This document aids the development and evaluation of usable interactive
    systems. This document is applicable to all kinds of interactive systems, i.e.
    combinations of hardware and/or software and/or services and/or people that users
    interact with in order to achieve specific goals. This document is intended to
    be used by those specifying and designing interactive systems, including user
    experience professionals, software architects and engineers, business analysts,
    product managers, and product owners. This document does not prescribe any kind
    of method, lifecycle or process. The specification of user-system interaction
    and user interface can be used in iterative development, which includes the elaboration
    and evolution of requirements (e.g. as in agile development). The specification
    of user-system interaction and user interface is part of system documentation
    resulting from the human-centred design activities specified in ISO 9241-210 and
    the human-centred design processes in ISO 9241-220. The content elements are consistent
    with the design guidance provided in ISO 9241-115. ISO/IEC/IEEE 12207 and ISO/IEC/IEEE
    15288 refer to ISO 9241-210 and ISO 9241-220 for information on human-centred
    design and usability.
