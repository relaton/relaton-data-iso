abstract:
- language: en
  script: Latn
  content: 'This document specifies particular requirements for safety, construction
    and materials of domestic gas ovens and compartment grills. For general requirements
    for safety, construction and materials of gas ovens and compartment grills, ISO/TS 21364-1:2021
    applies. This document covers the following gas cooking appliances: —    ovens
    with natural or forced convection; —    pyrolytic-self-cleaning ovens and pyrolytic-self-cleaning
    compartment grills; —    compartment grills being built-in, table top or part
    of a cooking range. —    oven accessories It does not cover gas ovens and compartment
    grills intended for outdoor use and/or commercial use as well as electrical heated
    elements as part of the appliance. It does also not cover appliances with automatic
    burner control systems. NOTE 1    For requirements of electrical safety refer
    to the IEC60335 standards series. NOTE 2    Attention is drawn to the fact that
    —     for appliances intended to be used in vehicles or on board ships or aircraft,
    additional requirements may be necessary; —     in many countries additional requirements
    are specified by the national health authorities, the national water supply authorities
    and similar authorities. This document does not cover requirements relating to
    gas cylinders, their pressure regulators and their connections. This document
    does not cover requirements for gas installation.'
