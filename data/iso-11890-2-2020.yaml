abstract:
- language: en
  script: Latn
  content: This document is applicable for the determination of VOC and SVOC with
    an expected VOC and/or SVOC content greater than 0,01 % by mass up to 100 % by
    mass. The method given in ISO 11890-1 is used when the VOC is greater than 15
    % by mass. This document (method ISO 11890-2) applies when the system contains
    VOC and SVOC as the VOC result of ISO 11890-1 can be influenced by the SVOC. For
    VOC content smaller than 0,1 %, the head space method described in ISO 17895 is
    used as an alternative. ISO 11890-1 and ISO 17895 cannot be used for the determination
    of the SVOC content. NOTE 1 Some ingredients of coating materials and their raw
    materials can decompose during analysis and cause artificial VOC and/or SVOC signals.
    When determining VOC and/or SVOC for coating materials and their raw materials,
    these signals are artefacts of the method and are not taken into account (examples
    are given in Annex B). This method assumes that the volatile matter is either
    water or organic. However, other volatile inorganic compounds can be present and
    might need to be quantified by another suitable method and allowed for in the
    calculations. The method defined in this document is not applicable for determination
    of water content. NOTE 2 If organic acids or bases and their corresponding salts
    are present in the coating material or its raw materials, the amount that is quantified
    by this method might not be accurate due to a change in the acid or base equilibrium.
