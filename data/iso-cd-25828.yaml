abstract:
- language: en
  script: Latn
  content: This document specifies the quality and safety requirements and test methods
    of Corydalis yanhusuo tuber [the dried tuber of Corydalis yanhusuo W. T. Wang],
    including raw and processed Corydalis yanhusuo tuber. This document is applicable
    to raw and processed Corydalis yanhusuo tuber that are sold and used as natural
    medicines in international trade, including Chinese materia medica (whole medicinal
