abstract:
- language: en
  script: Latn
  content: 'This document establishes requirements for the design, material selection
    and characterization, fabrication, testing and inspection of all structural items
    in space systems, including expendable and reusable launch vehicles, satellites
    and their payloads. This document applies to all structural items, including fracture-critical
    hardware used in space systems during all phases of the mission, with the following
    exceptions: adaptive structures, propulsion systems, nuclear systems, and thermal
    protection systems.'
