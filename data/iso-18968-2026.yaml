abstract:
- language: en
  script: Latn
  content: This document gives guidance on authoring, editing and evaluating specialized source language content intended for translation. In addition, this document addresses handover recommendations in connection with the production and translation of specialized content. This document is meant as a practical guidance and recognizes that not all clauses are equally applicable to every use case. This document is applicable to authors and editors of specialized content intended for translation. It also enables translators and translation service providers to assess the suitability of specialized content for translation. This document is also applicable to tool providers (e.g. to develop and improve automatic source language testing and verification procedures). This document does not apply to authoring, editing and evaluating fictional, journalistic, advertising and other non-specialized content.
