abstract:
- language: en
  script: Latn
  content: ISO 17493:2016 describes a test method for evaluating the heat resistance
    of protective clothing materials or items and equipment when exposed in a hot
    air circulating oven. The method is intended to evaluate physical changes in a
    material at a given exposure temperature. Materials are evaluated for defined
    visible changes including the measurement of shrinkage. Different procedures are
    provided depending on the type of the protective clothing material or item being
    tested.
