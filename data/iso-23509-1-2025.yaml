abstract:
- language: en
  script: Latn
  content: This document specifies the macro geometry of bevel gears. The term "bevel
    gears" is used to mean straight, skew, spiral, Zerol bevel and hypoid gear designs.
    If the text pertains to one or more, but not all, of these, the specific forms
    are identified. The manufacturing process of forming the desired tooth form is
    not intended to imply any specific process, but rather to be general in nature
    and applicable to all methods of manufacture. The geometry for the calculation
    of factors used in bevel gear rating, such as ISO 10300 (all parts), is also included.
    This document is intended for use by an experienced gear designer capable of selecting
    reasonable values for the factors based on his or her knowledge and background.
    It is not intended for use by the engineering public at large. Annex A provides
    a structure for the calculation of the methods provided in this document.
