abstract:
- language: en
  script: Latn
  content: This document specifies the qualitative and quantitative analysis methods
    for the determination of the presence and content of zirconium with a particle
    size of less than 40 µm in pyrotechnic compositions by specific colour-rendering
    reactions and Inductively Coupled Plasma Optical Emission Spectrometry (ICP-OES),
    with a minimum detection limit of 100 mg/kg. The determination of the presence
    of zirconium with a particle size of less than 40 µm is required for application
    of ISO 25947-5. Quantitative analysis may bring complementary information if necessary.
