abstract:
- language: en
  script: Latn
  content: This document evaluates the use of the Bresle test (as defined in ISO 8502-9) for assessing soluble salt contamination on steel surfaces prepared with single-use abrasive blasting media. It presents comparative data from field and laboratory measurements using different analytical methods to determine whether conductivity values obtained from the Bresle test can be correlated to chloride and other salt concentrations.
