abstract:
- language: en
  script: Latn
  content: This document describes general workflows and protocols for the validation
    and the verification of (semi-)quantitative screening tests for the detection
    of Aflatoxin M1 in liquid milk (raw, pasteurized, UHT and reconstituted milk powders
    and whey protein extracts). This guideline applies to methods of which the result
    of the measurement is a numerical value, for example a (relative) response from
    a dip-stick reader, and that normal statistics apply. This guideline does not
    apply to methods that do not give numerical values (e.g. only a line that is present
    or absent), which require different validation approaches. This guideline does
    not cover the validation of aflatoxin M1 analysis by HPLC, UHPLC or LC-MS/MS.
    This document is intended to be useful for manufacturers of screening test kits,
    laboratories validating screening methods or tests, competent authorities and
    dairies or end users of reagents or tests for the detection of Aflatoxin M1 in
    milk products. This document facilitates and improves the validation and verification
    of (semi-)quantitative screening methods. The goals of this document are a harmonization
    in validation of methods or tests kits in order that all stakeholders have full
    trust on the result of a mycotoxin screening and to limit overlap and multiplication
    of validation work in different laboratories by sharing the validation results
    generated by an independent laboratory. Furthermore, a harmonized validation and
    verification procedure allows for comparison of the performance of different screening
    methods. This document does not imply that all end users are forced to perform
    all verification work proposed. The verification of the correct use of reagents/kits
    for the detection of antimicrobials is not part of the scope of this document.
