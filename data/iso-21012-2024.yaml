abstract:
- language: en
  script: Latn
  content: 'This document specifies design, construction, type and production testing,
    and marking requirements for both non-insulated cryogenic flexible hoses and insulated
    vacuum jacketed hoses used for the transfer of cryogenic fluids within the following
    range of operating conditions: —     working temperature range: from −270 °C to
    +65 °C; —     nominal size (DN): from 10 to 100. End fittings for mounting of
    any couplings are within the scope of this document, but the couplings are subject
    to other standards.'
