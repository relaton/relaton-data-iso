abstract:
- language: en
  script: Latn
  content: ISO 17742:2015 provides a general approach for energy efficiency and energy
    savings calculations with indicator-based and measure-based methods for the geographical
    entities countries, regions, and cities. ISO 17742:2015 considers all end-use
    sectors, such as households, industry, tertiary (services, etc.), agriculture,
    and transport. It does not incorporate calculation of energy efficiency and energy
    savings in energy supply sectors, such as power plants, refineries, and coal mines.
