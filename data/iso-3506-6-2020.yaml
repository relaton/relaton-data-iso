abstract:
- language: en
  script: Latn
  content: This document specifies general rules and provides technical information
    on stainless steels and their properties, which are relevant when using other
    parts of the ISO 3506 series. It includes specifications for corrosion-resistant
    stainless steels and nickel alloys, which are suitable for the manufacture of
    fasteners. It applies to austenitic, martensitic, ferritic and duplex (austenitic-ferritic)
    stainless steel grades and nickel alloys for fasteners, and is intended to be
    used together with the relevant parts of the ISO 3506 series. Common designations
    of stainless steels and nickel alloys used for fasteners are given in Annex A.
