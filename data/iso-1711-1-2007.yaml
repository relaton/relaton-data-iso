abstract:
- language: en
  script: Latn
  content: 'ISO 1711-1:2007 specifies minimum values for Rockwell hardness and torsional
    strength for hand-operated wrenches and sockets. It covers three series of torsion
    torques: Series A: usual box wrenches and socket wrenches; Series C: open end
    wrenches; Series E: hand-operated square drive sockets.'
