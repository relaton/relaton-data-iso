abstract:
- language: en
  script: Latn
  content: ISO 24443:2012 specifies an in vitro procedure to characterize the UVA
    protection of sunscreen products. Specifications are given to enable determination
    of the spectral absorbance characteristics of UVA protection in a reproducible
    manner. In order to determine relevant UVA protection parameters, the method has
    been created to provide a UV spectral absorbance curve from which a number of
    calculations and evaluations can be undertaken. This method relies on the use
    of in vivo SPF results for scaling the UV absorbance curve.
