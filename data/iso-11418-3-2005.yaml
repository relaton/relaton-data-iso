abstract:
- language: en
  script: Latn
  content: ISO 11418-3:2005 specifies the design, dimensions, material and requirements
    of screw-neck glass bottles (veral) for pharmaceutical preparations in solid and
    liquid dosage forms. Screw-neck glass bottles are applicable to primary packs
    used in direct contact with a drug. ISO 11418-3:2005 is applicable to screw-neck
    glass bottles (veral) used in pharmacy. Together with the corresponding closure
    systems, they serve for packaging of pharmaceutical preparations in solid and
    liquid dosage forms which are not intended for parenteral use.
