abstract:
- language: en
  script: Latn
  content: ISO 14555:2014 covers arc stud welding of metallic materials subject to
    static and fatigue loading. It specifies requirements that are particular to stud
    welding, in relation to welding knowledge, quality requirements, welding procedure
    specification, welding procedure qualification, qualification testing of operators
    and testing of production welds. ISO 14555:2014 is appropriate where it is necessary
    to demonstrate the capability of a manufacturer to produce welded construction
    of a specified quality. ISO 14555:2014 has been prepared in a comprehensive manner,
    with a view to it being used as a reference in contracts. The requirements contained
    within it can be adopted in full, or partially, if certain requirements are not
    relevant to a particular construction.
