abstract:
- language: en
  script: Latn
  content: ISO/TS 24679:2010 provides a methodology for assessing the performance
    of structures in the built environment when exposed to a real fire. ISO/TS 24679:2010,
    which follows the principles outlined in ISO 23932, provides a performance-based
    methodology for engineers to assess the level of fire safety of new or existing
    structures.
