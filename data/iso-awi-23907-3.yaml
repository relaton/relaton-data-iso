abstract:
- language: en
  script: Latn
  content: This document specifies requirements, recommendations and test methods
    for the design of sharps containers intended to hold only secured sharps medical
    waste possessing a passive/automatic sharps injury protection mechanism remaining
    active until recycling. Other medical wastes and especially liquid, have to be
    disposed in other appropriate containers. It provides instruction for the labelling
    and the instruction for use of the container so as guidance for evaluating the
    secure medical waste it can hold safely. This document is applicable to containers
    for secure sharps medical waste that are supplied complete by the manufacturer
    and to those that are supplied as components intended to be assembled by the user.
    It is not applicable to single use sharps containers (refer to ISO 23907-1) and
    reusable sharps container (refer to ISO 23907-2) that can hold potentially hazardous
    sharps medical waste without functional sharps injury protection mechanisms.
