abstract:
- language: en
  script: Latn
  content: This document defines the concepts of a reference temperature and the standard
    reference temperature and specifies the standard reference temperature value for
    the specification of geometrical and dimensional properties of an object. Some
    examples of geometrical and dimensional properties include size, location, orientation
    (including angle), form and surface texture of a workpiece. This document is also
    applicable to the definition of the measurand used in verification or calibration.
