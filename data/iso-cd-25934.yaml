abstract:
- language: en
  script: Latn
  content: This document specifies a structured process for the development of verification
    procedures for autonomous navigation systems used in Maritime Autonomous Surface
    Ships (MASS), in accordance with ISO standards related to safety and system reliability
    assessment. The procedure is intended to ensure the systematic verification of
    safety and reliability of the constituent systems of MASS, with particular attention
    to the safe navigation system. The guidelines apply to various modes of operation
    of MASS and are intended to support manufacturers, ship operators, and regulatory
    authorities in formulating verification procedures adapted to MASS specific operational
    requirements.
