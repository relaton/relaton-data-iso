abstract:
- language: en
  script: Latn
  content: This document specifies the component performance and manufacturing requirements
    for prefabricated wood-based I-beams used as structural members in bending applications.
    It does not cover fire performance, formaldehyde requirements and biological durability.
    This document gives requirements for manufacturing, in-house quality assurance
    and periodic re-evaluation of prefabricated wood-based I-beams. Wood-based I-beams
    tested according to this document are intended for use in covered conditions and
    utilizing components that are able to resist the effects of moisture on structural
    performance due to construction delays or other conditions of similar severity,
    but not permanently exposed to the weather. NOTE The service conditions are similar
    to "Service class 2" as defined in ISO 20152‑1. Testing, evaluation and performance
    characterization requirements for prefabricated wood-based I-beams are covered
    in ISO 22389‑1. This document does not purport to address all of the safety concerns,
    if any, associated with its use. It is the responsibility of the user of this
    document to establish appropriate health and safety practices and determine the
    applicability of regulatory limitations prior to use.
