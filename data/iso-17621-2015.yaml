abstract:
- language: en
  script: Latn
  content: ISO 17621:2015 specifies requirements and test methods under prescribed
    laboratory conditions for length-of-stain detector tubes and their associated
    pump (detector tube measurement system) used for short-term measurements of the
    concentration of specified chemical agents in workplace air. ISO 17621:2015 is
    not applicable to measurements made to demonstrate compliance with long-term limit
    values to personal exposure with a reference period of more than 15 min.
