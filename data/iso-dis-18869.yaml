abstract:
- language: en
  script: Latn
  content: ISO 18869:2017 specifies methods for testing and evaluating the performance
    of quick-action couplings for use in hydraulic fluid power applications. This
    document does not apply to the testing of tube connections, stud ends for ports
    and flange connections, which are covered by ISO 19879. Test methods covered in
    this document are independent of each other and outline the method to follow for
    each test. See the respective connector standard for which tests to conduct and
    for performance requirements. It is not intended that all tests be carried out
    for every application; it is up to the user of this document to select the applicable
    tests. For qualification of the coupling, the minimum number of samples specified
    in this document is to be tested, unless otherwise specified in the relevant coupling
    standard or as agreed upon by the manufacturer and the user.
