abstract:
- language: en
  script: Latn
  content: ISO 1927-5:2012 specifies methods for the preparation and treatment (curing,
    drying and firing) of test pieces from monolithic (unshaped) refractory materials.
    The methods are applicable to dense and insulating castables and to ramming materials
    with the four types of chemical composition defined in ISO 1927-1:2012. The dimensions
    of the test pieces are specified and the preparation of the mixture, compaction
    methods, storage and post-treatment of the test pieces are described.
