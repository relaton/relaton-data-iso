abstract:
- language: en
  script: Latn
  content: This document specifies the necessary dimensions to permit the installation
    of passenger lifts of class I, II, III and VI. These dimensions reflect the requirements
    for the apparatus. This document is applicable to all new lift installations,
    irrespective of drive systems, including a car with one entrance, to be installed
    in a new building. However, for arrangements with counterweight at the side, a
    through-entrance configuration is possible. Where relevant, this document is also
    applicable to an installation in an existing building. This document is not applicable
    to lifts of rated speed greater than 6,0 m/s. NOTE It is the responsibility of
    the user to consult the manufacturer for such installations.
