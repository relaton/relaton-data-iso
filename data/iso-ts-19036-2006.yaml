abstract:
- language: en
  script: Latn
  content: ISO/TS 19036:2006 gives guidance for the estimation and expression of measurement
    uncertainty (MU) associated with quantitative results in food microbiology. It
    is applicable to the quantitative analysis of products intended for human consumption
    and the feeding of animals, and of environmental samples in the area of food production
    and food handling, typically carried out by enumeration of microorganisms using
    a colony-count technique, but applicable also to quantitative analysis by alternative
    instrumental methods. ISO/TS 19036:2006 is not applicable to enumeration using
    a most probable number technique, or the analysis of low levels of microorganisms.
