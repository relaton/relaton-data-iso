abstract:
- language: en
  script: Latn
  content: 'This document specifies safety requirements and their verification, environmental
    requirements and related test methods, and minimum performance limits, for the
    design and construction of knapsack combustion engine-driven airblast sprayers
    as defined in 3.9. It describes methods for the elimination or reduction of hazards
    arising from their use. In addition, it specifies the type of information on safe
    working practices to be provided by the manufacturer. It addresses general operating
    parameters as well as the potential deposition of spray droplets under specified
    controlled conditions. This document deals with all significant hazards, hazardous
    situations and events, excepting those arising from vibration transmitted to the
    back of the operator. It is applicable to knapsack combustion engine-driven airblast
    sprayers when they are used as intended and under the conditions foreseeable by
    the manufacturer (see Table A.1). It is not applicable to: — hydraulic pressure
    sprayers; — thermal sprayers; — cold foggers; — sprayers adapted for the application
    of dry material. It is not applicable to knapsack combustion engine-driven airblast
    sprayers manufactured before the date of its publication. The requirements of
    this document applies to products manufactured 18 months after publication.'
