abstract:
- language: en
  script: Latn
  content: This document specifies requirements for 8-strand braided ropes, for 12-strand
    braided ropes, and for covered rope constructions for general purpose made of
    high modulus polyethylene (HMPE), and gives rules for their designation. Many
    different types and grades of HMPE fibre exist which are commonly used to produce
    rope products. This document does not cover all variations in strength or product
    performance. The rope manufacturer is consulted to ensure the intended design
    meets the requirements of the application.
