abstract:
- language: en
  script: Latn
  content: ISO 12215-5:2008 applies to the determination of design pressures and stresses,
    and to the determination of the scantlings, including internal structural members
    of monohull small craft constructed from fibre reinforced plastics, aluminium
    or steel alloys, glued wood or other suitable boat building material, with a length
    of hull in accordance with ISO 8666, between 2,5 m and 24 m. It only applies to
    boats in the intact condition and to craft with a maximum speed equal to or less
    than 50 knots in fully loaded, ready for use conditions.
