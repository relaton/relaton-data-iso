abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of loss of mass
    on stoving of coating powders that are to be applied by electrostatic spraying
    or flock spraying or fluidized bed. The method described in this document is a
    simple, practical test which provides sufficiently accurate results for coating
    powders that lose approximately 2 % (by mass) on stoving (heating). Above 2 %,
    accuracy decreases with an increasing loss in mass. This method determines the
    amount of all volatile matter, including water. Thermogravimetric testing as described
    in the ISO 11358 series can be used as a comparative method.
