abstract:
- language: en
  script: Latn
  content: ISO 15011-4:2017 covers health and safety in welding and allied processes.
    It specifies requirements for determination of the emission rate and chemical
    composition of welding fume in order to prepare fume data sheets. ISO 15011-4:2017
    applies to all filler materials used for joining or surfacing by arc welding using
    a manual, partly mechanized or fully automatic process, depositing unalloyed steel,
    alloyed steel and non‑ferrous alloys. Manual metal arc welding, gas‑shielded metal
    arc welding with solid wires, metal‑cored and flux‑cored wires and arc welding
    with self‑shielded flux‑cored wires are included within the scope of this document.
