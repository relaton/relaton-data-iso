abstract:
- language: en
  script: Latn
  content: ISO 4823:2015 specifies the requirements and tests that the state-of-the
    art body of knowledge suggests for helping determine whether the elastomeric impression
    materials, as prepared for retail marketing, are of the quality needed for their
    intended purposes. NOTE This International Standard does not address possible
    biological hazards associated with the materials. Therefore, interested parties
    are encouraged to explore ISO 7405 and ISO 10993 for assessment of such hazards.
