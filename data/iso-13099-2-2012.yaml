abstract:
- language: en
  script: Latn
  content: 'This part of ISO 13099 specifies two methods of measurement of electrophoretic
    mobility of particles suspended in a liquid: video microscopy and electrophoretic
    light-scattering. Estimation of surface charge and determination of zeta-potential
    can be achieved from measured electrophoretic mobility using proper theoretical
    models, which are described in detail in ISO 13099-1.'
