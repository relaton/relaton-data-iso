abstract:
- language: en
  script: Latn
  content: ISO 14780:2017 defines methods for reducing combined samples (or increments)
    to laboratory samples and laboratory samples to sub-samples and general analysis
    samples and is applicable to solid biofuels. The methods defined in this document
    can be used for sample preparation, for example, when the samples are to be tested
    for calorific value, moisture content, ash content, bulk density, durability,
    particle size distribution, ash melting behaviour, chemical composition, and impurities.
