abstract:
- language: en
  script: Latn
  content: 'This document specifies the terminology, technical requirements, testing
    methods, and marking requirements for hydronic heating appliances designed for
    solid biofuels, both manually and automatically stoked, with a nominal heat output
    of up to 1500 kW. The document is applicable to the design, manufacture, testing
    of such appliances. This document does not cover: •Hydronic heating appliances
    with a nominal heat output exceeding 1500 kW; •Appliances designed for fuels other
    than solid biofuels; •Manual stoked straw bale boilers; and •Design and construction
    of external fuel storage and transportation devices prior to the safety devices
    of the boiler.'
