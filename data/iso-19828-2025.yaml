abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for visual inspection of welds
    in metallic materials and requirements for qualification and certification of
    personnel for visual weld inspection. This document is also applicable to the
    visual inspection of the joint prior to or between welding sequences. In this
    case, the contents of theoretical and practical training will need to be adapted
    accordingly. This document can also be applied for brazed joints.
