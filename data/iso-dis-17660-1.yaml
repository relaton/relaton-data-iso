abstract:
- language: en
  script: Latn
  content: ISO 17660-1:2006 is applicable to the welding of weldable reinforcing steel
    and stainless reinforcing steel of load-bearing joints, in workshops or on site.
    It specifies requirements for materials, design and execution of welded joints,
    welding personnel, quality requirements, examination and testing. ISO 17660-1:2006
    also covers welded joints between reinforcing steel bars and other steel components,
    such as connection devices and insert anchors, including prefabricated assemblies.
    Non load-bearing joints are covered by ISO 17660-2. ISO 17660-1:2006 is not applicable
    to factory production of welding fabric and lattice girders using multiple spot
    welding machines or multiple projection welding machines. The requirements of
    ISO 17660-1:2006 are only applicable to static loaded structures.
