abstract:
- language: en
  script: Latn
  content: This document specifies an annual severity classification system for atmospheric
    corrosion using continuous electrochemical measurements. The continuous atmospheric
    corrosion measurements include the local environment, single-alloy free corrosion,
    and galvanic corrosion, as specified in ISO 22858. It is applicable to the environmental
    severity and corrosivity of exposure conditions found within laboratory test chambers,
    outdoor exposure sites, and service environments5. It specifies the classification
    of an exposure condition based on the local environmental severity (alloy-independent)
    or corrosivity (alloy-dependent), including an alloy and galvanic couple. The
    addition of other alloys or galvanic couples for determining annual severity is
    specified. This document specifies an annual severity classification system using
    environmental severity or corrosivity measurements. This document is not applicable
    to the severity classification of indoor environments, which is specified in ISO
    11844-1, ISO 11844-2, and ISO 11844-3, nor does it address the corrosion management
    planning of applicable environments, based on the severity classification of an
    exposure condition.
