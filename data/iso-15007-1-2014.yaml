abstract:
- language: en
  script: Latn
  content: ISO 15007-1:2014 defines key terms and parameters applied in the analysis
    of driver visual behaviour focused on glance and glance-related measures. These
    terms and parameters can be applied in environments from real-world driving experiments
    to laboratory-based driving simulator studies. The procedures described in this
    part of ISO 15007 could also apply to more general assessments of driver visual
    behaviour without the introduction of TICS-specific systems. The parameters and
    definitions described below are intended to assist development of a common source
    of reference for driver visual behaviour data. Minimum requirements for reporting
    the results of Transport Information and Control Systems (TICS) evaluations are
    provided. Further guidance including the specification of how to analyse and present
    the results of studies of visual behaviour is available in other ISO publications
    (see, for example, ISO 2854 and ISO/TR 13425:2006). However, data collected and
    analysed according to this standard will allow comparisons to be performed across
    different TICS applications and experimental scenarios.
