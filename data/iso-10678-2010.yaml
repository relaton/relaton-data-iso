abstract:
- language: en
  script: Latn
  content: ISO 10678:2010 specifies a method for the determination of the photocatalytic
    activity of surfaces by degradation of the dye molecule methylene blue (MB) in
    aqueous solution using artificial ultraviolet (UV) radiation, and characterizes
    the ability of photoactive surfaces to degrade dissolved organic molecules on
    ultraviolet radiation. The test method specified is also applicable to evaluation
    of the specific photocatalytic self-cleaning activity of surfaces covered with
    respective coatings. This method is not applicable to characterizing the photoactivity
    of surfaces on visible illumination, regarding direct soiling, degradation of
    gaseous molecules and the determination of antimicrobial photoactivity of surfaces.
