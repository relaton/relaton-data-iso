abstract:
- language: en
  script: Latn
  content: This document specifies a gravimetric method for the determination of the
    silicon content in steel and cast iron. The method is applicable to silicon contents
    between 0,10 % (mass fraction) and 5,0 % {mass fraction). NOTE For samples containing
    molybdenum, niobium, tantalum, titanium, tungsten, zirconium or high levels of
    chromium, the results are less accurate than for unalloyed matrixes.
