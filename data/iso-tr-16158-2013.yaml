abstract:
- language: en
  script: Latn
  content: ISO/TR 16158:2013 is a guide for establishing essential collaborative enterprises
    to sustain the space environment and employ it effectively. This requires diligent
    collaboration among all who operate satellites. ISO/TR 16158:2013 describes some
    widely used techniques for perceiving close approaches, estimating collision probability,
    estimating the cumulative probability of survival, and manoeuvring to avoid collisions.
