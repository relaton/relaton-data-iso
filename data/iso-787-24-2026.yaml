abstract:
- language: en
  script: Latn
  content: 'This document specifies photometric methods of test for comparing in the visible spectrum: the tinting strength of two similar coloured pigments dispersed in an alkyd resin without a drier; the scattering power of two white pigments of the same type dispersed in an alkyd resin without a drier. This document does not apply to the comparison of coloured pigments that on reduction differ greatly in colour.'
