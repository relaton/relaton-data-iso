abstract:
- language: en
  script: Latn
  content: ISO 10581:2011 specifies the characteristics of homogeneous floor coverings,
    based on poly(vinyl chloride), supplied in either tile or roll form. Products
    may contain a transparent, non-PVC factory finish. To encourage the consumer to
    make an informed choice, ISO 10581:2011 includes a classification system (see
    ISO 10874) based on intensity of use, which shows where these floor coverings
    should give satisfactory service. ISO 10581:2011 also specifies requirements for
    marking.
