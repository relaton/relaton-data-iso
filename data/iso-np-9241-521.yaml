abstract:
- language: en
  script: Latn
  content: This document provides ergonomic principles for activity-based working (ABW). It addresses key concepts, contextual factors, and evaluation approaches relevant to work systems in which individuals select work environments based on the activities being performed. This document is applicable to organizations implementing or transitioning toward ABW, hybrid work, or other distributed work models. It may also support professionals involved in workplace design, facility management, human factors, and organizational transformation. This document focuses on principles and considerations rather than prescriptive design requirements. It does not specify detailed workstation dimensions or technical performance criteria.
