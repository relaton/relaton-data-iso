abstract:
- language: en
  script: Latn
  content: ISO 20326:2016 specifies requirements and test methods for floor panels/assembly
    for domestic and commercial levels of use, which have surface layers consisting
    of resilient floor covering. ISO 20326:2016 is not applicable to heterogeneous
    polyvinyl chloride floor panels/assembly for floating installation covered by
    ISO 10582 or to floor panels/assembly that are subject to frequent wetting, such
    as bathrooms, laundry rooms and saunas.
