abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the bond strength of a
    butt joint when subjected to tensile force. The method can be applied to all types
    of adhesives. Although primarily intended for use under ambient conditions, the
    basic method can also be applied to testing under a wide range of temperature
    and other environmental conditions. The method is for rigid adherends that can
    be produced to the required dimensional tolerances and that will withstand the
    forces applied to them during the test.
