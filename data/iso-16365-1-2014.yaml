abstract:
- language: en
  script: Latn
  content: ISO 16365-1:2014 establishes a system of designation for thermoplastic
    polyurethane elastomers, which is based on ISO 1043 (all parts) and ISO 11469.
    The designation system may be used as the basis for specifications. It is applicable
    to all thermoplastic polyurethane elastomers. It applies to materials ready for
    normal use in the form of powder, granules or pellets, unmodified or modified
    by colourants, fillers or other additives, etc.
