abstract:
- language: en
  script: Latn
  content: ISO 22118:2010 specifies minimum requirements of performance characteristics
    for the detection of nucleic acid sequences (DNA or RNA) by molecular methods.
    ISO 22118:2010 applies to the detection of food-borne pathogens in foodstuffs
    and isolates obtained from them using molecular detection methods based on the
    polymerase chain reaction (PCR). ISO 22118:2010 is also applicable, for example,
    to the detection of food-borne pathogens in environmental samples and in animal
    feeding stuffs.
