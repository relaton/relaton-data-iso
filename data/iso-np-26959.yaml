abstract:
- language: en
  script: Latn
  content: This proposed project aims to develop an international standard for the evaluation of water permeability measurement technology using mass spectrometry. The standard will define water permeability measurement methods applicable to various substrates such as OLED display, Photovoltaics, and Coolant package, and specify key test procedures and performance criteria. This work supports the international harmonization of qualification procedures for water permeability measurement, enhances technical interoperability among different fields, and strengthens global competitiveness in advanced manufacturing and testing technology fields.
