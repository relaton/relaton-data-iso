  script: Latn
  content: 'ISO/TS 10303-1806:2014-02 specifies the application module for Form feature
    in panel. The following are within the scope of ISO/TS 10303-1806:2014-02: features
    in sheet metal parts; items within the scope of application module Basic geometry,
    ISO/TS 10303-1652; items within the scope of application module Elemental topology,
    ISO/TS 10303-1005; items within the scope of application module Machining features,
    ISO/TS 10303-1814; items within the scope of application module Shape feature,
    ISO/TS 10303-1764; items within the scope of application module Value with unit
    extension, ISO/TS 10303-1753.'
