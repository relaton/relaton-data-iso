abstract:
- language: en
  script: Latn
  content: 'ISO 14289-1:2014 specifies the use of ISO 32000‑1:2008 to produce accessible
    electronic documents. This part of ISO 14289 is not applicable to: - specific
    processes for converting paper or electronic documents to the PDF/UA format; -
    specific technical design, user interface, implementation, or operational details
    of rendering; - specific physical methods of storing these documents, such as
    media and storage conditions; - required computer hardware and/or operating systems.'
