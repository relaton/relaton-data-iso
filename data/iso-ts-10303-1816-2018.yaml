- language: en
  script: Latn
  content: 'ISO/TS 10303-1816:2018-11 specifies the application module for Model based
    3D geometrical dimensioning and tolerancing representation. The following are
    within the scope of ISO/TS 10303-1816:2018-11: identification of model based nominal
