abstract:
- language: en
  script: Latn
  content: This part of ISO 9455 specifies a method for the determination of the efficacy
    of a soft soldering flux. The method is known as the solder spread method of filler
    metal and is applicable to all flux classes defined in ISO 9454-1. NOTE An alternative
    method for the determination of the flux efficacy, applicable to liquid fluxes
    only, known as the wetting balance method, is specified in ISO 9455-16.[3]
