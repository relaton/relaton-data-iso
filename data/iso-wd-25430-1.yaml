abstract:
- language: en
  script: Latn
  content: This document provides standardised terms and definitions for in vitro,
    three-dimensional multicellular structures known as organoids. It aims to establish
    a consensus definition of the term “organoid” based on key characteristics such
    as 3D structure, self-organisation, and cellular composition. This document harmonizes
    terminology related to normal, abnormal (such as neoplastic organoids) and specific
    disease organoid models to ensure consistency across research and applications.
    This document establishes a hierarchical classification system for organoids,
    based on factors like tissue/organ system, health status, species, cell of origin,
    and derivation method. This document introduces a flexible, extensible naming
    convention to categorize organoids in a consistent and adaptable way, supporting
    clear communication and collaboration across various fields. This document is
    applicable to the stakeholders of organoids in biotechnology, including biological
    researchers, industry professionals, and regulatory bodies.
