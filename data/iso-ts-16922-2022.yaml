abstract:
- language: en
  script: Latn
  content: This document gives the specifications and guidelines for the methods to
    be used in the odorization of natural gas and other methane rich gases delivered
    through natural gas networks to gas applications under a safety point of view.
    This document also specifies the principles for the odorization technique (including
    handling and storage of odorants) and the control of odorization of natural gas
    and other methane rich gases. NOTE      The general requirements for odorants,
    and the physical and chemical properties of commonly used odorants are specified
    in ISO 13734.
