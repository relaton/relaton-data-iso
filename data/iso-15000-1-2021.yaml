abstract:
- language: en
  script: Latn
  content: 'This document provides a communication-protocol neutral method for exchanging
    electronic business messages. It defines specific enveloping constructs supporting
    reliable, secure delivery of business information. Furthermore, this document
    defines a flexible enveloping technique, permitting messages to contain payloads
    of any format type. It specifies each of the following: ? Messaging model ? Message
    pulling and partitioning ? Processing modes ? Message packaging ? Error handling
    ? Security module ? Reliable messaging module This document is applicable to all
    types of organizations (e.g., commercial enterprises, government agencies, not-for-profit
    organizations) that exchange documents or data electronically using messaging.'
