abstract:
- language: en
  script: Latn
  content: 'ISO 20106:2015 defines, in an abstract manner, the COM in terms of: a)
    the operations necessary to provide the service; b) the parameter data associated
    with each operation; c) the required behaviour of each operation; d) the use of
    the model. It does not specify: a) individual implementations or products; b)
    the implementation of entities or interfaces within real systems; c) the methods
    or technologies required for communications.'
