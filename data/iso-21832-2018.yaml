abstract:
- language: en
  script: Latn
  content: This document specifies performance requirements and test methods for the
    evaluation of procedures for measuring metals and metalloids in airborne particles
    sampled onto a suitable collection substrate. This document specifies a method
    for estimating the uncertainties associated with random and systematic errors
    and combining them to calculate the expanded uncertainty of the measuring procedure
    as a whole, as prescribed in ISO 20581. This document is applicable to measuring
    procedures in which sampling and analysis is carried out in separate stages, but
    it does not specify performance requirements for collection, transport and storage
    of samples, since these are addressed in EN 13205-1 and ISO 15767. This document
    does not apply to procedures for measuring metals or metalloids present as inorganic
    gases or vapours (e.g. mercury, arsenic) or to procedures for measuring metals
    and metalloids in compounds that could be present as a particle/vapour mixture
    (e.g. arsenic trioxide).
