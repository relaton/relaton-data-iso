abstract:
- language: en
  script: Latn
  content: 'This document specifies methods for: —    determining the composition
    of a calibration gas mixture by comparison with appropriate reference gas mixtures;
    —    calculating the uncertainty of the composition of a calibration gas mixture
    in relation to the known uncertainty of the composition of the reference gas mixtures
    with which it was compared; —    checking the composition attributed to a calibration
    gas mixture by comparison with appropriate reference gas mixtures; —    consistency
    testing and outlier search in suites of calibration gas mixtures of closely related
    composition. NOTE 1    In principle, the method described in this document is
    also applicable to the analysis of (largely) unknown samples instead of prospective
    calibration gas mixtures (i.e. gas mixtures which are intended for use as calibration
    gas mixtures). Such applications, however, need appropriate care and consideration
    of additional uncertainty components, for example, concerning the effect of matrix
    differences between the reference gases used for calibration and the analysed
    sample. NOTE 2    Comparison methods based on one- and two-point calibration are
    described in ISO 12963.'
