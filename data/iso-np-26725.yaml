abstract:
- language: en
  script: Latn
  content: This document specifies the method for determining the characteristic parameters
    of crystal structure of natural gas hydrates using laser Raman spectroscopy, including
    specific requirements for the principle, instruments, materials, operational procedures,
    and data processing. This document is applicable to the structural determination
    of both naturally occurring and laboratory-synthesized natural gas hydrate samples,
    as well as the calculation of cage occupancy and hydration number.
