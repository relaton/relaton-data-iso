abstract:
- language: en
  script: Latn
  content: 'This document describes good practices for the incineration and other
    organic matter treatment by thermal processes of sludges. Thermal conditioning
    is excluded. This document applies to sludges specifically derived from: —   
    storm water handling; —    night soil; —    urban wastewater collecting systems;
    —    urban wastewater treatment plants; —    treating industrial wastewater similar
    to urban wastewater. It includes all sludge that may have similar environmental
    and/or health impacts but excludes hazardous sludge from industry and dredged
    sludge.'
