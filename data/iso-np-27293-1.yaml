abstract:
- language: en
  script: Latn
  content: This International Standard establishes minimum international requirements
    for the design, installation, operation, maintenance and lifecycle management
    of Internet of Things (IoT) equipment installed on, integrated into, or temporarily
    attached to ISO freight containers. The document specifies harmonised requirements
    intended to ensure that smart container IoT equipment operates safely and securely
    throughout international multimodal transport while maintaining interoperability
    between manufacturers, service providers and regulatory authorities.
