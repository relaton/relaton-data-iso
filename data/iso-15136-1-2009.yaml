abstract:
- language: en
  script: Latn
  content: ISO 15136-1:2009 provides requirements for the design, design verification
    and validation, manufacturing and data control, performance ratings, functional
    evaluation, repair, handling and storage of progressing cavity pumps for use in
    the petroleum and natural gas industry. ISO 15136-1:2009 is applicable to those
    products meeting the definition of progressing cavity pumps (PCP) included herein.
    Connections to the drive string and tubulars are not covered in ISO 15136-1:2009.
    ISO 15136-1:2009 establishes requirements for characterization and testing of
    stator elastomer material, design validation and functional evaluation and provides
    information for PCP elastomer selection and testing, installation, start-up and
    operation guidelines, equipment selection and application guidelines, functional
    specification form, used pump evaluation, drive string selection and use, repair
    and reconditioning procedures and auxiliary equipment. Equipment not covered by
    the requirements of ISO 15136-1:2009 includes bottom-drive systems except for
    the PCP components, drive-string components and auxiliary equipment such as tag
    bars, gas separators and torque anchors.
