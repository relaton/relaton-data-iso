abstract:
- language: en
  script: Latn
  content: ISO 7989-1:2006 specifies the requirements for the coating mass per unit
    area, for other properties and also for testing of non-ferrous metallic coatings
    on steel wire products, of circular or other cross-section. ISO 7989-1:2006 deals
    with general application requirements, and is of use for those coatings for which
    no particular requirements have been laid down in ISO 7989-2. Deviations are possible,
    particularly if required for well-defined products. In such cases, appropriate
    requirements are part of the relevant product standard.
