abstract:
- language: en
  script: Latn
  content: This document specifies the methods of preparation of test specimens and
    the test methods to be used in determining the properties of poly(phenylene sulfide)
    (PPS) moulding and extrusion materials. Requirements for handling test material
    and for conditioning both the test material before moulding and the specimens
    before testing are given. Procedures and conditions are described for the preparation
    of test specimens, and procedures for measuring properties of the materials from
    which these specimens are made are given. Properties and test methods which are
    suitable and necessary to characterize poly(phenylene sulfide) moulding and extrusion
    materials are listed. The properties have been selected from the general test
    methods in ISO 10350‑1. Other test methods in wide use for, or of particular significance
    to, these moulding and extrusion materials are also included in this document
    as are the designatory properties specified in ISO 20558‑1 (melt mass-flow rate
    or melt viscosity, density and tensile modulus). In order to obtain reproducible
    and comparable test results, it is intended to use the methods of preparation
    and conditioning, the specimen dimensions and the test procedures specified in
    this document. Values determined will not necessarily be identical to those obtained
    using specimens of different dimensions or prepared using different procedures.
