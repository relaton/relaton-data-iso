abstract:
- language: en
  script: Latn
  content: 'This document specifies: a)       a method for determining the hydrolytic
    resistance of the interior surfaces of glass containers when subjected to attack
    by water at (121 ± 1) °C for (60 ± 1) min. The resistance is measured by titration
    of a known aliquot portion of the extraction solution produced with hydrochloric
    acid solution, in which case the resistance is inversely proportional to the volume
    of acid required; b)       a classification of glass containers according to the
    hydrolytic resistance of the interior surfaces determined by the methods specified
    in this document.'
