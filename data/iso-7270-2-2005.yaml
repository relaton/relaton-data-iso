abstract:
- language: en
  script: Latn
  content: ISO 7270-1:2005 specifies the principles and procedures for determining,
    by pyrolysis and subsequent gas chromatography, the styrene (STY)/butadiene (BD)/isoprene
    (IP) ratio in copolymers, or blends of homopolymers and/or copolymers, in raw
    rubbers or vulcanized or unvulcanized compounds. It is applicable to copolymers/terpolymers
    consisting of styrene, butadiene and isoprene, and blends of these polymers.
