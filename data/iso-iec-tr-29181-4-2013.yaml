abstract:
- language: en
  script: Latn
  content: ISO/IEC TR 29181-4:2013 describes the problem statements of current network
    and the requirements for Future Network in the mobility perspective. It mainly
    specifies problems of the current network in mobile environment, and requirements
    for mobility support in Future Network. In addition, ISO/IEC TR 29181-4:2013 gives
    information on existing mobility control schemes in the current network, examples
    of high-level mobility control architecture for Future Network, distributed mobility
    control in the Proxy Mobile IPv6 networks, and additional considerations for Future
    Network mobility.
