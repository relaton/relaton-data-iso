abstract:
- language: en
  script: Latn
  content: 'This document defines an information model that defines necessary information
    when virtual environments using physical sensors are generated. All MAR objects
    including 3D virtual objects, sensors, physical properties, and physical interfaces,
    that should be represented in virtual environments are defined. This document
    specifies an information data model and interfaces that can be used to implement
    sensor representation in mixed and augmented reality defined in ISO/IEC 18038-1.
    This document will specify: • A data model for representing sensor information
    that should be defined in 3D virtual environments; • Definition and manipulation
    of sensor properties in 3D virtual environments; • Functionalities and base components
    for defining sensor information in 3D virtual environments; • Interfaces with
    sensor information through virtual and real worlds; and • Use cases'
