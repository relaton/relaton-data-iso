abstract:
- language: en
  script: Latn
  content: 'This document specifies the dimensions of hollow taper shanks with flange
    contact surface (HSK). These shanks are the male part of the interface to the
    machine tools (e. g. milling/drilling, turning and grinding machines). This document
    specifies five types of shanks: —     types A, AB and EB have a peripherally grooved
    flange for automatic tool change; —     types C and CB have a flange without peripheral
    groove and can only be changed manually. HSK types A and AB can also be changed
    manually via radial access bore holes in the hollow shank tapers. This document
    provides information for dynamically balanced HSK‑AB and HSK‑CB shanks balancing
    according to ISO 16084.'
