abstract:
- language: en
  script: Latn
  content: ISO 10862:2009 specifies requirements and test methods for quick release
    devices as a component of the small sailing-craft trapeze system worn whilst afloat.
    The quick release device is intended to quickly release the wearer from entrapment
    and minimize the risk of drowning in the event of a failure to release from the
    sailing-craft trapeze system by other means. The quick release device is intended
    to be easily accessible and operated in all conditions that might occur whilst
    in use, including when a craft is capsized or inverted.
