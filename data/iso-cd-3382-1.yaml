abstract:
- language: en
  script: Latn
  content: This document specifies methods for the measurement of reverberation time
    and other room acoustical parameters in spaces for music, speech and other performance
    spaces. The measurement methods may also be applied for open-air performance spaces.
    It describes the measurement procedure, the apparatus needed, the coverage required,
    and the method of evaluating the data and presenting the test report. It is intended
    for the application of modern digital measuring techniques and for the evaluation
    of room acoustical parameters derived from impulse responses.
