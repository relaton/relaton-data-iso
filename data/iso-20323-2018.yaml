abstract:
- language: en
  script: Latn
  content: 'ISO 20323:2018 specifies the conditions for the determination of tensile
    properties of ceramic matrix composite tubes with continuous fibre-reinforcement
    at ambient temperature in air atmospheric pressure. This document is specific
    to the tubular geometries since fibre architecture and specimen geometry factors
    are distinctly different in composite tubes than in flat specimens. ISO 20323:2018
    provides information on the uniaxial tensile properties and tensile stress-strain
    response such as tensile strength and strain, tensile elastic modulus and Poisson''s
    ratio. The information may be used for material development, control of manufacturing
    (quality insurance), material comparison, characterization, reliability and design
    data generation for tubular components. ISO 20323:2018 addresses, but is not restricted
    to, various suggested test piece fabrication methods. It applies primarily to
    ceramic and/or glass matrix composite tubes with a continuous fibrous-reinforcement:
    unidirectional (1D filament winding and tape lay-up), bi-directional (2D braid
    and weave) and tri-directional (xD, with 2 < x < 3), loaded along the tube axis.
    Values expressed in this document are in accordance with the International System
    of Units (SI). NOTE In most cases, ceramic matrix composites to be used at high
    temperature in air are coated with an antioxidation coating.'
