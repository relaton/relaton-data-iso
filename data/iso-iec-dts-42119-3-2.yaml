abstract:
- language: en
  script: Latn
  content: This document describes approaches and provides guidance on processes for
    the verification and validation analysis of AI systems (comprising AI system components
    and the interaction of non-AI components with the AI system components) including
    formal methods, simulation and evaluation. This document is applicable for AI
    systems verification and validation in the context of the AI system life cycle
    stages described in ISO/IEC 22989. This document is applicable to all types of
    organizations engaged in the development, deployment and use of AI systems.
