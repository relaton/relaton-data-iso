abstract:
- language: en
  script: Latn
  content: This test method specifies a procedure primarily for determining the fracture
    toughness of pipeline metals and alloys used in gaseous hydrogen or hydrogen-blended
    environments. It considers both constant and increasing loading modes. The procedure
    is applicable to steel pipeline systems transporting pure hydrogen or natural
    gas blended with hydrogen, operating at temperatures below 200°C. Other metallic
    materials used in containment vessel applications may also benefit from adherence
    to this standard.
