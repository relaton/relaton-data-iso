abstract:
- language: en
  script: Latn
  content: ISO 11494:2008 describes a method for the determination of platinum in
    platinum jewellery alloys, preferably within the range of fineness specified in
    ISO 9202, by means of inductively coupled plasma (ICP) emission spectrometry.
    The preferred platinum content of the alloys lies between 850 ‰ (parts per thousand)
    and 950 ‰ platinum. Platinum jewellery alloys can contain silver, indium, gallium,
    copper, cobalt, nickel, tin and ruthenium. The presence of these alloying elements
    has not been observed to interfere with the determination method. If other elements
    are alloyed, a check is made as to whether any interference occurs.
