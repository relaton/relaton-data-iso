abstract:
- language: en
  script: Latn
  content: ISO 27850:2013 sets forth the test procedures and performance requirements
    for a falling-object protective structure, in the event such a structure is installed
    on an agricultural or forestry tractor ISO 27850:2013 is applicable to agricultural
    and forestry tractors having at least two axles for pneumatic tyred wheels or
    having tracks instead of wheels. It does not apply to forestry machinery as defined
    in ISO 6814.
