abstract:
- language: en
  script: Latn
  content: ISO/TS 12911:2012 establishes a framework for providing specifications
    for the commissioning of building information modelling (BIM). It is applicable
    to any range of modelling of buildings and building-related facilities, from a
    portfolio of assets at a single site or multiple sites, to assets at a single
    small building and at any constituent system, subsystem, component or element.
    It is applicable to any asset type, including most infrastructure and public works,
    equipment and material. BIM processes are applicable across the entire life cycle
    of a portfolio, facility or component, which can span inception to end-of-use.
    The main user of the framework is the information manager, who utilizes the framework
    to assist in structuring an international-, national-project- or facility-level
    BIM guidance document. The framework can also be used for BIM guidance provided
    by application providers.
