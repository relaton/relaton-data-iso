abstract:
- language: en
  script: Latn
  content: ISO 23210:2009 specifies a standard reference method for the determination
    of PM10 and PM2,5 mass concentrations at stationary emission sources by use of
    two-stage impactors. The measurement method is especially suitable for measurements
    of mass concentrations below 40 mg/m3 as half-hourly averages in standard conditions
    (273 K, 1 013 hPa, dry gas). It is an acceptable method for the measurement in
    the flue gas of different installations, such as cement and steel production plants,
    as well as combustion processes. ISO 23210:2009 is not applicable to the sampling
    of flue gases that are saturated with water vapour. ISO 23210:2009 is not applicable
    where the majority of the particles are likely to exceed PM10, for example, in
    the case of raw gases or plant operating failures. ISO 23210:2009 cannot be used
    for the determination of the total mass concentration of dust. ISO 23210:2009
    describes the design, use and theory of round-nozzle impactors. It does not exclude
    other types of impactors, provided these systems meet the performance criteria
    specified in ISO 23210:2009 in a validation of the impactor performed by an independent
    testing laboratory.
