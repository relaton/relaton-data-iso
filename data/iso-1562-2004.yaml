abstract:
- language: en
  script: Latn
  content: ISO 1562:2004 gives the classification of, and specifies requirements for
    dental casting gold alloys with at least 60 % mass fraction of gold and at least
    75 % mass fraction of gold plus specified platinum group metals (platinum, palladium,
    iridium, ruthenium and rhodium). Test methods are given for providing information
    on corrosion resistance, tarnishing resistance and electrochemical behaviour.
    ISO 1562:2004 is applicable to casting alloys suitable for the fabrication of
    dental restorations and appliances without ceramic veneer.
