abstract:
- language: en
  script: Latn
  content: This part of ISO 12217 specifies methods for evaluating the stability and
    buoyancy of intact (i.e. undamaged) boats. The flotation characteristics of craft
    vulnerable to swamping are also encompassed. The evaluation of stability and buoyancy
    properties using this part of ISO 12217 will enable the boat to be assigned to
    a design category (C or D) appropriate to its design and maximum load. This part
    of ISO 12217 is applicable to boats of hull length less than 6 m, whether propelled
    by human or mechanical power, except habitable sailing multihulls. Boats of hull
    length less than 6 m, which are fitted with a full deck and quick-draining cockpit(s)
    complying with ISO 11812, may alternatively be assessed using ISO 12217-1 or ISO
    12217-2 (for non-sailing and sailing boats respectively), in which case higher
    design categories may be assigned. This part of ISO 12217 excludes aquatic toys,
    canoes, kayaks, or other boats with a beam of less than 1,1 m, inflatable and
    rigid-inflatable boats up to 8 m covered by ISO 6185, personal watercraft covered
    by ISO 13590, hydrofoils and hovercraft when operating in the dynamically supported
    mode, and submersibles. It does not include or evaluate the effects on stability
    of towing, fishing, dredging or lifting operations, which should be separately
    considered if appropriate.
