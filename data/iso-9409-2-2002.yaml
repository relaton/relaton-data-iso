abstract:
- language: en
  script: Latn
  content: ISO 9409-2:2002 defines the main dimensions, designation and marking for
    a shaft with cylindrical projection as mechanical interface. It is intended to
    ensure the exchangeability and to keep the orientation of hand-mounted end effectors.
    ISO 9409-2:2002 does not contain any correlation of load-carrying ranges. The
    mechanical interfaces specified in ISO 9409-2:2002 will also find application
    in simple handling systems which are not covered by the definition of manipulating
    industrial robots, such as pick-and-place or master-slave units.
