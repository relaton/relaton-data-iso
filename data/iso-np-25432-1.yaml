abstract:
- language: en
  script: Latn
  content: 'This document provides general requirements for design and information disclosure for assistive products with monitoring, warning, and emergency alert functions, which - are installed in places where users live; or - are carried on the user; or - are attached to user when the user is active outside of the place where the user lives. This document is not applicable for products that diagnose, prevent, treat, or monitor diseases in the medical field. Note 1: Places the user lives may include, but are not limited to, homes, smart homes, hospitals, geriatric clinics, residential nursing homes, advanced and long-term care facilities and group homes.'
