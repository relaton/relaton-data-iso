abstract:
- language: en
  script: Latn
  content: ISO/TS 13471-1:2017 specifies procedures for determining the effect of
    temperature on tyre/road noise emission. Temperatures considered are tyre, road
    and ambient air temperatures. The noise emission for which this document is applicable
    is measured by means of ISO 11819‑2, or similar methods such as the on-board sound
    intensity (OBSI) method specified in Reference [1]. Measurement results obtained
    at a certain temperature, which may vary over a wide range, are normalized to
    a designated reference temperature (20 °C) using a correction procedure specified
    in this document.
