abstract:
- language: en
  script: Latn
  content: The visibility of a road traffic signal depends on many factors, the most
    important of which are the colour, luminous intensity and luminous intensity distribution
    of the light. This Standard deals with the colour, luminous intensity and luminous
    intensity distribution for 200 mm road traffic signals. The serious problem of
    sun phantom, which can affect the correct recognition of the light, is included
    in the Standard. Reference documents relating to the colour of road traffic signals
    are detailed.
