abstract:
- language: en
  script: Latn
  content: This document describes a test method for conservation materials which
    can evaluate their impact on cellulose as the main constituent of paper-based
    collections caused by emission of their volatile compounds. NOTE This test can
    be extended to museum artefacts. This document is applicable to papers and boards
    used for conservation and storage of cellulose based items. It is not applicable
    to parchment-based items. It does not evaluate the effects due to direct contact
    between the papers and boards used for conservation and the collections.
