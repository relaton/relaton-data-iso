abstract:
- language: en
  script: Latn
  content: 'The document will specify a method for retrieving credential information
    from an Issuing Authority’s server, based upon a presentation of a (mobile) document.
    The following apply: (1) 23220-8 will be a solution for retrieving information
    from an Issuing Authority’s server, that works the same way regardless of whether
    the input is via a mobile device or via a physical card (2) the solution will
    be based on the OIDC option (i.e. not WebAPI retrieval mechanism) as in 18013-5:2021,
    with minor corrections to solve known issues, and (3) 23220-8 will focus on the
    protocol, not its application.'
