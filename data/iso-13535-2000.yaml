abstract:
- language: en
  script: Latn
  content: 'La présente Norme internationale définit les exigences pour la conception,
    la fabrication et les essais des équipements de levage utilisables pour les opérations
    de forage et de production. La présente Norme internationale couvre les équipements
    de levage utilisés pour le forage et la production suivants : a) poulies de levage
    b) moufles mobiles et fixes c) adaptateurs entre moufles et crochets d) pièces
    de connexion et d''adaptation pour bras élévateurs e) crochets de forage ; f)
    crochets pour tubes de production et barres de pompage g) bras élévateurs ; h)
    élévateurs pour tubes de cuvelage, de production, tiges et masse-tiges de forage
    i) élévateurs pour barres de pompage ; j) adaptateurs d''oeillets de têtes d''injection
    k) têtes d''injection (rotary swivels) ; l) têtes d''injection motorisées (powerswivels)
    m) raccords motorisés (powersubs) ; n) cales à coins lorsqu''elles peuvent être
    utilisées comme élévateurs o) réas ; p) compensateurs de pilonnement en ligne
    q) équipements de vissage de tiges carrées lorsqu''ils peuvent être utilisés comme
    équipement de levage r) réservoirs sous pression et tuyauterie installés sur des
    équipements de levage s) colliers de sûreté lorsqu''ils peuvent être utilisés
    comme équipement de levage t) chariots rétractables (doilies) (annexe B). La présente
    Norme internationale établit des exigences correspondant à deux niveaux de spécification
    de produits (PSL). Ces deux appellations PSL définissent différents niveaux d''exigences
    techniques. Toutes les exigences des chapitres 4 à 11 sont applicables à PSL 1,
    à moins d''être expressément identifié comme PSL 2. PSL 2 comprend toutes les
    exigences de PSL 1 plus des pratiques complémentaires prescrites dans le présent
    document. Des exigences supplémentaires ne s''appliquent que lorsqu''elles sont
    spécifiées. L''annexe A donne un nombre d''exigences supplémentaires normalisées.'
