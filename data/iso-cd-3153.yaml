abstract:
- language: en
  script: Latn
  content: This document specifies a methodology for assessing the health risk of
    individuals exposed to whole-body vibration (WBV) that includes the addition of
    posture effects. This document defines an accumulative posture index that is applied
    to the daily overall frequency-weighted root-mean-square (r.m.s.) acceleration
    to establish a combined daily vibration exposure for assessing health risk. This
    document is limited to the seated person subjected to WBV and health risk assessment
    using the ISO 2631-1 basic evaluation method. It does not apply to standing or
    recumbent (supine) persons, given the limitations in ISO 2631-1 and ISO 2631-1:1997/Amd
    1:2010 for assessing health risk in these positions. There are many contributing
    factors that can affect the stability and health of the spine during WBV. These
    factors may include a person’s static and dynamic postures during the exposure,
    the type of vibration exposure (periodic oscillatory motion, vibration with shock,
    etc.), the magnitudes and frequency content of the exposure, and muscle activity
    (to name a few). NOTE ISO 2631-1 is currently under revision.
