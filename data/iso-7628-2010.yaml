abstract:
- language: en
  script: Latn
  content: ISO 7628:2010 specifies the minimum requirements for mono wall and multilayer
    tubing used in air braking systems on road vehicles. The conformity of production
    is the responsibility of the tubing manufacturer. The marking of the tubing does
    not automatically imply that the tube assembly (i.e. tube with end fittings) is
    appropriate for its use on a vehicle.
