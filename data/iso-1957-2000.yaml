abstract:
- language: en
  script: Latn
  content: This International Standard specifies a procedure to be followed when specimens
    are cut from samples if such specimens are to be used for physical tests. The
    reference method for selection of the sample from the bulk material is given in
    informative annex A. Unless selected in accordance with annex A it is accepted
    that the sample taken may not necessarily be completely representative of the
    bulk. It is recommended that the method of sampling be previously agreed by the
    parties interested in the results of the test. The procedure is applicable to
    machine-made textile floor coverings with or without pile.
