abstract:
- language: en
  script: Latn
  content: 'This document specifies the Semantic Similarity Markup Language (SSML) for the uniform and interoperable representation of semantic similarity information across languages, granularities, corpora and methods. SSML provides a formal specification for representing three core of a semantic similarity assertion. With respect to annotation granularity, this document applies to semantic similarity annotation at various levels: lexical (words, phrases), sentential (clauses, sentences), discoursal (paragraphs, sections, and documents), and non-textual (vectors). This document does not prescribe methods for computing semantic similarity, normalisation strategies, aggregation algorithms, or evaluation procedures. Also, it does not prescribe the content of semantic similarity annotation guidelines, nor does it define particular similarity measurement tasks or evaluation benchmark formats.'
