abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the classification and grading of civil uncrewed aircraft systems (UAS). This document applies to heavier-than-air aircraft as well as aerostats of any possible architecture. This document applies to the industrial conception, development, design, production and delivery of civil UAS. It also applies to operations, modification, repair and maintenance of civil UAS. NOTE            The characteristics in this document can be used individually or in combination, to meet specific needs of the classification and grading of civil UAS. This document does not apply to taxonomies of: automation levels; vertiports; UTM services.'
