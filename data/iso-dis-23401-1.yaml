abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for acrylic hard type materials
    used as chairside denture lining materials and the test methods to determine compliance
    with these requirements. This document also specifies requirements for packaging
    and marking the products and for the instructions for use to be supplied by the
    manufacturer. Dentures which are relined by hard type denture lining materials
    specified by this document are limited to those of acrylic. This document is not
    applicable to soft type denture lining materials.
