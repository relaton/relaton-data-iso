abstract:
- language: en
  script: Latn
  content: 'This document specifies compatibility requirements for end-effectors with
    nominal power requirements of up to 200W. The document covers the requirements
    for electrical connections at the robot, their related characteristics, designation
    and marking. This document also provides means for interfacing with safety related
    functions provided in external equipment. The following is excluded from the scope
    of this document: 1. mechanical requirements of the end-effector interface besides
    those related to the electrical connectors (the mechanical interface of end-effectors
    is covered by ISO 9409-1 and -2). 2. communication protocols at the network, transport,
    session, presentation or application layer 3. safety related performance requirements.
    4. the electrical connection requirements at the end-effector side; this document
    focuses on the robot side. 5. aspects related to cyber security Note: See ISO
    10218-1:2025 and ISO 10218-2:2025 for cyber security requirements.'
