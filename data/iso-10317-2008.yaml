abstract:
- language: en
  script: Latn
  content: ISO 10317:2008 establishes a system for the designation of metric size
    tapered roller bearings produced in accordance with ISO 355. The system covers
    designations for single-row bearings, double-row bearings, and bearings with flanged
    outer rings. ISO 10317:2008 also establishes designations for separate inner subunits
    (inner ring, tapered rollers and cage) and outer rings of such bearings. ISO 10317:2008
    does not apply to bearings or inner subunits or outer rings which in any respect
    deviate from ISO 355.
