abstract:
- language: en
  script: Latn
  content: This document gives guidance on methods for understanding and extending
    the principles of business continuity embodied in ISO 22301 and ISO 22313 to the
    management of supplier relationships. It enables an organization to develop and
    document the strategy to be better prepared to manage supply chain continuity.
    This document is generic and applicable to all organizations. It is applicable
    to suppliers of products, services and resources, both upstream and downstream.
    Supply chain continuity management (SCCM) specifically considers the issues faced
    by an organization which relies on the continuity of supply of resources as well
    as the ability to continue delivery of its products and services. The objective
    of SCCM is to protect the organization’s business activities from supply chain
    disruption.
