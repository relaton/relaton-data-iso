abstract:
- language: en
  script: Latn
  content: This document specifies the general principles, common elements, scenario adaptation, and service improvement for accessibility services in events. This document is applicable to the whole process of accessibility services — including planning, preparation, implementation and close-out. It covers, but is not limited to, sports events, exhibitions and trade fairs, Performing arts events, large conferences, festival celebrations, and public welfare events. This document does not specify technical requirements for permanent buildings, information and communication technologies, or tourism destinations, which are addressed respectively in ISO 21542, ISO/IEC 30071-1 and ISO 21902.
