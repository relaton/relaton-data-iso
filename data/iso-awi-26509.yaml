abstract:
- language: en
  script: Latn
  content: 'This document describes a business maturity model in terms of sustainable
    tourism applicable to the organization responsible for tourism services or destinations,
    which wishes to: a) Implement measures to minimize negative impacts or maximize
    positive impacts on sustainability related to the services provided; b) Provide
    tourism services more sustainable; c) Demonstrate that the tourism services provided
    meet applicable sustainability requirements. This document applies to any tourism
    organization, regardless of the nature (public or private), size, location, and
    related tourism services (or activities). This document specifies the sustainability
    requirements and recommendations of tourism services applicable to the environmental,
    social, and economic dimensions.'
