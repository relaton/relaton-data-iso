abstract:
- language: en
  script: Latn
  content: Adopts both the veiling glare index (VGI) and the glare spread function
    (GSF) as measures of the veiling glare characteristics of optical and electrooptical
    imaging systems. Laboratory measurement techniques are described in general terms
    and recommendations are made regarding the performance of the main subunits of
    the equipment. The measurement techniques described are chiefly valid for the
    visual spectral range. Also gives guidelines for the operation of measuring equipment
    such that accurate results can be achieved.
