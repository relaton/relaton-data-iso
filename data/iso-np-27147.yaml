abstract:
- language: en
  script: Latn
  content: This document specifies principles and general requirements for the provision and management of unmanned aircraft systems (UAS) logistics services, including service assurance, service provision, risk management, emergency response, service evaluation and continual improvement. This document is applicable to organizations responsible for providing UAS logistics services, and to the operational activities and management carried out at one or more segments of a logistics service chain, for the purpose of using UAS to transport goods from the place of supply to the place of receipt. This document does not specify requirements for the design, manufacture, airworthiness certification or technical performance of UAS, or requirements for airspace classification, flight authorization and UAS traffic management.
