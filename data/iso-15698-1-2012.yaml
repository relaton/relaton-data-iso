abstract:
- language: en
  script: Latn
  content: This part of ISO 15698 specifies requirements for headed steel bars to
    be used as reinforcement of concrete structures. This part of ISO 15698 is a product
    standard and not an application standard. It is intended to cover a large variety
    of products and also to support the development of new products. This part of
    ISO 15698 specifies requirements for headed reinforcing bars with heads made of
    steel. Heads or head-bar connections made using other materials, including metal-filled
    sleeves, are not covered by this part of ISO 15698. End anchorages consisting
    of a steel bar or other steel component positioned orthogonally at the end(s)
    of a bar and welded on-site to the bar are outside the scope of this part of ISO
    15698. This part of ISO 15698 is intended to cover products which are manufactured
    in a continuous production that allows the products to be tested in accordance
    with a defined testing regime. Requirements and testing for headed bars under
    impact loading are outside the scope of this part of ISO 15698.
