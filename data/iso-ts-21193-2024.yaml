abstract:
- language: en
  script: Latn
  content: 'This document defines requirements to support information exchanges among
    related entities of a common payment scheme. It defines: a)       EFC-related
    functional requirements for a common payment medium; b)       an application structure
    in a common payment medium; c)        EFC application data in a common payment
    medium. The following is outside the scope of this document: —     requirements
    and data definitions for any other transport services such as public transport;
    —     a complete risk assessment for an EFC system using a common payment medium;
    —     security issues arising from an EFC application among all transport services;
    —     the technical trust relationship between a CSRP and a service user; —    
    concrete implementation specifications for implementation of security for an EFC
    system; —     detailed specifications required for privacy-friendly EFC implementations;
    —     any financial transactions of the CSRP.'
