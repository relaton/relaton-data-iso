abstract:
- language: en
  script: Latn
  content: ISO 12696:2011 specifies performance requirements for cathodic protection
    of steel in cement-based concrete, in both new and existing structures. It covers
    building and civil engineering structures, including normal reinforcement and
    prestressed reinforcement embedded in the concrete. It is applicable to uncoated
    steel reinforcement and to organic-coated steel reinforcement. ISO 12696:2011
    applies to steel embedded in atmospherically exposed, buried, immersed and tidal
    elements of buildings or structures.
