- language: en
  script: Latn
  content: ISO 13428:2005 describes an index test for the determination of the protection
    efficiency of a geosynthetic on a hard surface, exposed to the impact load of
    a hemispherical object. The index test measures the change in thickness of a thin
    lead plate lying between the geosynthetic and a rigid support.
