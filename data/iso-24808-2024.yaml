abstract:
- language: en
  script: Latn
  content: This document specifies requirements for rebreather instructor training
    programmes which provide the competencies required to be able to train rebreather
    divers. This document specifies evaluation criteria for these competencies and
    specifies the requirements for four levels of rebreather instructors. This document
    specifies the requirements under which training is provided, in addition to the
    general requirements for recreational diving service provision according to ISO 24803.
