abstract:
- language: en
  script: Latn
  content: This document specifies the principles, requirements, and structure for
    reporting and declaring the carbon and environmental footprint of biobased plastic
    products. It defines minimum information to be included in such reports and declarations,
    including the Carbon Intensity Factor (CIF) for the declared unit or functional
    unit, to ensure transparency, comparability, and avoidance of misleading claims.
    The document provides formats for product-specific and comparative declarations,
    the latter enabling comparison of biobased products with their fossil-based equivalents
    in accordance with EN 18027. The requirements apply to business-to-business (B2B)
    and business-to-consumer (B2C) communications. This document does not specify
    methods for calculating carbon footprints, which are covered in ISO 22526-2, ISO
    22526-3, and ISO 22526-4, and it excludes mass balance and other attributional
    allocation methods.
