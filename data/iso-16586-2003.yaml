abstract:
- language: en
  script: Latn
  content: ISO 16586:2003 specifies a method for the gravimetric determination of
    soil water content as a volume fraction on the basis of the ratio of measured
    water content mass to known dry bulk density. ISO 16586:2003 is applicable to
    all types of non-swelling or non-shrinking soils. It is used as a reference method
    (e.g. the calibration of indirect methods for determination of water content).
