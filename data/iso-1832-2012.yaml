abstract:
- language: en
  script: Latn
  content: ISO 1832:2012 establishes a code for the designation of the usual types
    of indexable inserts for cutting tools in hard cutting materials or any other
    cutting materials, in order to simplify orders and specifications for such inserts.
    It also specifies the designations for cubic boron nitride (BL, BH, BC) inserts,
    tipped and solid, as well as polycrystalline diamond (DP) inserts, tipped.
