abstract:
- language: en
  script: Latn
  content: ISO 10785:2011 specifies general and detailed requirements for bellows
    used in space systems. It establishes requirements with regard to material, design,
    analysis, fabrication, material, testing, inspection and operation for space use.
    ISO 10785:2011 is applicable to metallic bellows which are used as pressure bearing
    components and are integrated into a pressure system. ISO 10785:2011 is not applicable
    to engine bellows or valve bellows.
