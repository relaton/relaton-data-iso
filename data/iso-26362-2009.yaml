abstract:
- language: en
  script: Latn
  content: ISO 26362:2009 specifies the terms and definitions, as well as the service
    requirements, for organizations and professionals who own and/or use access panels
    for market, opinion and social research. It develops the criteria against which
    access panel providers can be evaluated and against which the quality of access
    panels can be assessed. ISO 26362:2009 is applicable to all types of access panels,
    whether recruited and used online (e.g. via internet) or offline (e.g. via telephone,
    post or face-to-face interaction).
