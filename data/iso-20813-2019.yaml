abstract:
- language: en
  script: Latn
  content: This document specifies minimum requirements of performance characteristics
    for the detection of nucleic acid sequences (DNA) by molecular methods, such as
    the polymerase chain reaction (PCR), including different post-PCR detection methods,
    real-time PCR, single and/or multiple probe-based detection techniques as well
    as the combination of such methods. The document is applicable to the detection,
    identification and quantification of DNA from animal species of higher and lower
    taxonomic groups in foodstuffs, and the validation of applicable methods. It is
    applicable to mammals, birds, reptiles, amphibians, fishes, molluscs, crustaceans
    and insects. Typical examples for each are listed in Annex A.
