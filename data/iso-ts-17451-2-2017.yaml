- language: en
  script: Latn
  content: ISO/TS 17451-2:2017 specifies a common XML structure for the transmission
    of inventory information for shipments of household goods and personal effects
    between moving companies and their external partners. The Inventory XSD defined
    in Clause 5 specifies the XML structure to be used. Each XML document corresponds
    to one shipment carried by land, sea or air.
