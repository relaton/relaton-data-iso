abstract:
- language: en
  script: Latn
  content: This document specifies the syntax and semantics of description schemes to represent data exchanged by media analysers for distributed artificial intelligence (AI) processing. Moreover, it specifies the application programming interfaces (APIs) to exchange these data between media things. This document does not specify how analysis is carried out, but defines the interfaces between the media things.
