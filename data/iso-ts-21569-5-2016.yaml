abstract:
- language: en
  script: Latn
  content: ISO/TS 21569-5:2016 specifies a procedure for the detection of a DNA sequence
    used in genetically modified (GM) plants by means of a real-time PCR (polymerase
    chain reaction). The method detects a 78 base pairs long segment of the Figwort
    mosaic virus 34S promoter DNA sequence. This segment in some GM plants is indicated
    as FMV promoter (P-FMV) and in other GM plants as FMV enhancer (E-FMV). The method
    was developed and validated for the analysis of DNA extracted from foodstuffs.
    It may be suitable also for analysis of other products such as feedstuffs and
    seeds. The procedure requires the extraction of an adequate quantity and quality
    of amplifiable DNA from the test sample. The DNA sequence amplified by the P-FMV
    element-specific method can be detected in samples which contain DNA of the naturally
    occurring Figwort mosaic virus. For this reason, it is necessary to confirm a
    positive screening result. Further analyses are required using construct-specific
    or event specific methods.
