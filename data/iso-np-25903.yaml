abstract:
- language: en
  script: Latn
  content: 'This standard is used to measure object content of cast steel microstructures
    using fully automated image analysis from images produced by a microscope. The
    object content in the images must be clearly delineated by etching and recognized
    by experts.It includes the following contents: (1) Requirements for the functions
    and parameters of the equipment in this standard; (2) The accuracy evaluation
    method for intelligent analysis software; (3) The minimum accuracy requirements
    for intelligent analysis software; (4) The operate procedures using intelligent
    analysis software.'
