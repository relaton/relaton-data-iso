abstract:
- language: en
  script: Latn
  content: This document specifies a testing method for determining the elastic modulus
    of glazed and unglazed ceramic tiles, substrate and glaze layer at ambient temperature
    by three-point bending tests. This document also specifies procedures for test
    specimen preparation, test modes, load rates, data collection and reporting. This
    test method can be used for material research, quality control, characterization
    and design data-generation purposes of ceramic tiles with a plate shape. See Annex A
    for more information. This method is not applicable to the ceramic tiles with
    profiled structures from which the test specimen cannot be machined.
