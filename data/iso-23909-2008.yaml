abstract:
- language: en
  script: Latn
  content: 'ISO 23909:2008 specifies a method for the preparation of laboratory samples
    from large samples. In accordance with ISO 11464 and ISO 14507, the following
    analyses are considered: determination of physico-chemical parameters, determination
    of moderate volatile organic contaminants, and determination of non-volatile contaminants.
    ISO 23909:2008 is not applicable when volatile organic compounds have to be analysed.'
