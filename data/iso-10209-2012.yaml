abstract:
- language: en
  script: Latn
  content: ISO 10209:2012 establishes and defines terms used in technical product
    documentation relating to technical drawings, product definition and related documentation
    in all fields of application. This vocabulary is based on all terms contained
    within ISO/TC 10 standards and other documents that are relevant to technical
    product documentation irrespective of disciplines. The terms have been classified
    into specific fields of application. In addition to terms and definitions used
    in English and French, two of the three official ISO languages, ISO 10209:2012
    gives the equivalent terms in German; these are published under the responsibility
    of the member body for Germany (DIN), and are given for information only. Only
    the terms and definitions given in the official languages can be considered ISO
    terms and definitions.
