abstract:
- language: en
  script: Latn
  content: This document specifies the method for determining the content of metal
    ions in Lithium Bis(fluorosulfonyl)imide (LiFSI) using Inductively Coupled Plasma
    Optical Emission Spectrometry (ICP-OES). This method is applicable to the quantification
    of aluminium (Al), calcium (Ca), cadmium (Cd), chromium (Cr), copper (Cu), iron
    (Fe), potassium (K), magnesium (Mg), sodium (Na), nickel (Ni), and lead (Pd) in
    Lithium Bis(fluorosulfonyl)imide.
