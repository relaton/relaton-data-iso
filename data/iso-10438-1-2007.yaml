abstract:
- language: en
  script: Latn
  content: ISO 10438-1:2007 specifies general requirements for lubrication systems,
    oil-type shaft-sealing systems, dry-gas face-type shaft-sealing systems and control-oil
    systems for general- or special-purpose applications. General-purpose applications
    are limited to lubrication systems. These systems can serve equipment such as
    compressors, gears, pumps and drivers. ISO 10438-1:2007 is intended to be used
    in conjunction with ISO 10438-2, ISO 10438-3 or ISO 10438-4, as appropriate.
