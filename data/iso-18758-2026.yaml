abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements for rock drill rigs and
    rock reinforcement rigs designed for the following underground or surface operations:
    blast hole drilling; rock reinforcement and consolidation (injection holes, pipe
    roofing, netting, bolting); drilling for secondary breaking; dimensional stone
    drilling; mineral prospecting, e.g. utilizing core drilling or reverse circulation
    drilling; water and methane drainage drilling; raise boring; when used by a well-trained
    operator in accordance with the information for use and where sufficient measures
    have been taken to prevent unauthorized entry of persons to the area where machines
    are working. NOTE            Machines can be designed for more than one of the
    operations above. See ISO 22932-4 and ISO 22932-5 for vocabulary. This document
    is not applicable to the following machines: drill rigs for soil and rock mixture,
    Kelly drill rigs and casing drivers, cable tool drill rigs, pre-armouring machines,
    sonic drill rigs, shaft sinking drill rigs, crane attached drill rigs, drill rigs
    on derricks, scaling machines. This document deals with the relevant and significant
    hazards, hazardous situations, or hazardous events, as listed in Annex C, when
    the machine is used as intended and under the conditions of misuse which are reasonably
    foreseeable by the manufacturer. This document is not applicable to machines manufactured
    before the date of its publication.'
