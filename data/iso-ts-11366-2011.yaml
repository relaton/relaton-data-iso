abstract:
- language: en
  script: Latn
  content: ISO/TS 11366:2011 applies to mineral oils used as lubricating oils and
    to control fluids used to lubricate steam, gas and combined cycle turbines in
    service. The lubricants considered in ISO/TS 11366:2011 are those classified in
    ISO 6743-5 and specified in ISO 8068. ISO/TS 11366:2011 is intended to help power
    equipment operators evaluate the conditions of the oil in their equipment and
    maintain the oils in serviceable conditions; help users understand how the oils
    deteriorate and carry out a meaningful programme of sampling and testing of oils
    in use. ISO/TS 11366:2011 also gives instructions with respect to the corrective
    actions that are taken to maximize service life.
