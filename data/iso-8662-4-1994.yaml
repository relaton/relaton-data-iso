abstract:
- language: en
  script: Latn
  content: The method specified is a laboratory type-test procedure for establishing
    the magnitude of vibration in the handle of a power tool fitted with a specified
    test wheel. Applies to power tools that may be pneumatically driven or driven
    by other means. It is intended that the results be used to compare different models
    of the same type of power tool, i.e. power tools intended for use with the same
    grinding wheel (same diameter and same maximum peripheral speed).
