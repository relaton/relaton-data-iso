abstract:
- language: en
  script: Latn
  content: ISO 6878:2004 specifies methods for the determination of orthophosphate,
    orthophosphate after solvent extraction, hydrolysable phosphate plus orthophosphate,
    and total phosphorus after decomposition. The methods are applicable to all kinds
    of water including seawater and effluents. Phosphorus concentrations within the
    range of 0,005 mg/l to 0,8 mg/l may be determined in such samples without dilution.
    A solvent extraction procedure allows smaller phosphorus concentrations to be
    determined with a detection limit of about 0,000 5 mg/l.
