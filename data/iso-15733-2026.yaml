abstract:
- language: en
  script: Latn
  content: This document specifies the conditions for determining the tensile properties
    (including tensile modulus, Poisson’s ratio, strength, strain at maximum force
    and fracture strain) of ceramic matrix composite materials with continuous fibre
    reinforcement at room temperature. This document applies to all ceramic matrix
    composites with a continuous fibre reinforcement, including unidirectional (1D),
    bi-directional (2D), and multi-directional (xD, with x > 2), reinforcement, loaded
    along a principal axis of reinforcement. NOTE            In most cases, ceramic
    matrix composites to be used at high temperature in air are coated with an antioxidation
    coating.
