abstract:
- language: en
  script: Latn
  content: ISO 17349:2016 contains provisions for design of topside facilities for
    offshore plants handling CO2-rich streams at high pressures; i.e. CO2 molar concentration
    above 10 %. The surface systems include usual offshore process unit operations,
    as shown in Figure 1. ISO 17349:2016 is applicable only to topside facilities
    of fixed and floating oil and gas production offshore units up to the last barrier,
    such as an ESDV. Subsea production systems and Cryogenic CO2 separation are not
    covered.
