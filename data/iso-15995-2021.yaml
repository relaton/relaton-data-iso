abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for design, specification, type
    testing and production testing and inspection of dedicated LPG manually operated
    cylinder valves for use with and directly connected to transportable refillable
    LPG cylinders. It also includes requirements for associated equipment for vapour
    and liquid service. Bursting discs and/or fusible plugs are not covered in this
    document. Annex B identifies requirements for production testing and inspection.
    This document excludes other LPG cylinder devices which are not an integral part
    of the dedicated manually operated cylinder valve. This document does not apply
    to cylinder valves for fixed automotive installations and ball valves. NOTE     
    For self-closing LPG cylinder valves see ISO 14245. For cylinder valves for compressed,
    dissolved and other liquefied gases see ISO 10297,[2] ISO 17871[6] or ISO 17879[7].
