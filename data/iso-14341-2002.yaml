abstract:
- language: en
  script: Latn
  content: ISO 14341:2002 specifies requirements for classification of wire electrodes
    in the as-welded condition and in the post weld heat-treated condition for gas
    shielded metal arc welding of non alloy and fine grain steels with a minimum yield
    strength of up to 500 N/mm2 or a minimum tensile strength of up to 570 N/mm2.
    One wire electrode can be tested and classified with different shielding gases.
    This document constitutes a combined specification providing classification utilizing
    a system based upon the yield strength and the average impact energy of 47 J of
    all-weld metal, or utilizing a system based upon the tensile strength and the
    average impact energy of 27 J of all-weld metal.
