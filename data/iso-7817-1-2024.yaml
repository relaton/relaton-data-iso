abstract:
- language: en
  script: Latn
  content: This document specifies concepts and principles to establish a methodology
    for specifying level of information need and information deliveries in a consistent
    way when using building information modelling (BIM). This document specifies the
    characteristics of different levels used for defining the detail and extent of
    information required to be exchanged and delivered throughout the life cycle of
    built assets. It gives guidelines for principles required to specify information
    needs. The concepts and principles in this document can be applied for a general
    information exchange and while in progress, for a generally agreed way of information
    exchange between parties in a collaborative work process, as well as for an appointment
    with specified information delivery. This document is applicable to the whole
    life cycle of any built asset, including strategic planning, initial design, engineering,
    development, documentation and construction, day-to-day operation, maintenance,
    refurbishment, repair and end-of-life.
