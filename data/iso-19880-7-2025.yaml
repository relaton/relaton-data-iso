abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for rubber O-rings and their housing
    dimensions, which seal gaseous hydrogen, in high-pressure hydrogen devices for
    gaseous hydrogen fuelling stations, such as valves, filters, joints, breakaways
    and other such devices. This document is applicable to O-rings suitable for sealing
    hydrogen gas of up to 70 MPa nominal working pressure, in the operating temperature
    range of −40 °C to 65 °C. This document contains safety requirements for the design
    of O-rings and their housing dimensions, compound design, and test methods for
    seal systems. This document applies to newly manufactured O-rings for hydrogen
    gas seal in high-pressure hydrogen devices used in hydrogen fuelling stations.
    NOTE 1        This document was developed using the ISO 3601 series. NOTE 2       
    This document was developed based on several temperature classes of rubber O-rings
    suitable for use with high-pressure hydrogen seals in devices for gaseous hydrogen
    stations. NOTE 3        The operating temperature is not a temperature of the
    hydrogen gas to be sealed by the O-ring gas seal system. Regardless of the operating
    temperature, the hydrogen gas temperature to be sealed can rise up to 180 °C.
    NOTE 4        The O-ring seal system for the high-pressure hydrogen devices are
    designed by the device manufacturers. The detailed specifications of the O-rings
    and design of static or non-static high-pressure hydrogen seal systems for the
    high-pressure hydrogen devices are determined as agreed upon between the interested
    parties by referring to this document.
