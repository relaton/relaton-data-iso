abstract:
- language: en
  script: Latn
  content: ISO 17804:2005 defines the grades and the corresponding requirements for
    ausferritic spheroidal graphite cast irons. ISO 17804:2005 specifies five grades
    of ausferritic spheroidal graphite cast iron by a classification based on mechanical
    properties measured on machined test pieces prepared from separately cast samples
    or cast-on samples, and samples cut from a casting. ISO 17804:2005 also specifies
    two grades by a classification as a function of hardness.
