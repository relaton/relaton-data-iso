abstract:
- language: en
  script: Latn
  content: This document specifies the technical requirements for product data protection
    of an additive manufacturing service platform (AMSP). The following elements are
    within the scope of this document. —     Classification of product data information
    of an AMSP and the protection levels. —     Product data protection at four data-processing
    stages, i.e. data collection, data display, data transfer and data deletion. —    
    Responsibilities and obligations of different entities. This document is applicable
    when individuals or organizations (e.g. commercial enterprises, government agencies
    and non-profit organizations) build an AMSP or improve existing ones to provide
    additive manufacturing (AM) and other services specific to the submission, design,
    and creation of AM parts.
