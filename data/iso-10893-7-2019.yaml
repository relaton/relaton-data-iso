abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for digital radiographic X-ray
    testing by either computed radiography (CR) or radiography with digital detector
    arrays (DDAs) of the longitudinal or helical weld seams of automatic fusion arc-welded
    steel tubes for the detection of imperfections. This document specifies acceptance
    levels and calibration procedures. It can also be applicable to the testing of
    circular hollow sections. NOTE As an alternative, see ISO 10893-6 for film-based
    radiographic X-ray testing.
