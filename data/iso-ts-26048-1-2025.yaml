abstract:
- language: en
  script: Latn
  content: Field devices are a key component in intelligent transport systems (ITS).
    Field devices include traffic signals, message signs, weather stations, traffic
    sensors, roadside equipment for connected ITS environments, etc. The ISO 26048
    series defines data that can be used to manage field devices, including device
    configuration, control and monitoring. Field devices can be quite complex, necessitating
    the standardization of many data concepts for exchange. As such, the ISO 26048
    series is divided into several individual parts. This document (ISO/TS 26048-1)
    introduces the ISO 26048 series, provides content that is normatively referenced
    in subsequent parts, and defines data that is applicable to the management of
    a wide range of field devices. The scope of the ISO 26048 series does not define
    the logic used by the management station, the underlying protocols used to exchange
    the defined data elements, or internal design of the field device. However, the
    ISO 26048 series does define functional requirements on the interface and assumes
    an interface based on an SNMPv3 environment as specified by ISO 15784-2. NOTE           
    Many of the concepts defined in this document were derived from NTCIP 1103[1]
    and NTCIP 1201[2], however, the design has been updated to better address security
    concerns. It is expected that future versions of NTCIP will migrate to the design
    defined in this document.
