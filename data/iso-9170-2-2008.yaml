abstract:
- language: en
  script: Latn
  content: ISO 9170-2:2008 specifies the requirements and dimensions for terminal
    units intended for use in anaesthetic gas scavenging disposal systems in accordance
    with ISO 7396-2. ISO 9170-2:2008 specifies two types of terminal unit according
    to whether the power device is upstream or downstream of the terminal unit. ISO
    9170-2:2008 also specifies requirements and dimensions for the mating counterpart
    (probe) of the type-specific connection point which is part of the terminal unit.
