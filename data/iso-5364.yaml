abstract:
- language: en
  script: Latn
  content: ISO 5364:2016 specifies requirements for oropharyngeal airways of plastics
    materials and/or rubber, including those with a reinforcement insert made of plastics
    materials and/or metal. ISO 5364:2016 is not applicable to metal oropharyngeal
    airways, nor to requirements concerning flammability of oropharyngeal airways.
    Flammability of oropharyngeal airways, for example, if flammable anaesthetics,
    electrosurgical units, or lasers are used, is a well-recognized hazard. It is
    addressed by appropriate clinical management, which is outside the scope of this
    International Standard. ISO 5364:2016 is not applicable to supralaryngeal airways
    without an internal, integral sealing mechanism.
