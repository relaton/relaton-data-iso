abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1281:2011-10 specifies the application module for Resource
    item characterized. The following are within the scope of ISO/TS 10303-1281:2011-10:
    the identification of resource items; the association of approvals, certifications,
    dates, times, people, security classification, and other management data with
    resource items; the specification of conditions affecting the validity of information
    about a resource item; the association of documents with a resource item; the
    association of a justification with a resource item; the association of properties
    with a resource items.'
