abstract:
- language: en
  script: Latn
  content: ISO 7787-3:2017 specifies dimensional and other requirements for the three
    most commonly used carbide cutters for milling machines which are predominantly
    used in the dental laboratory. Other characteristics of laboratory cutters (for
    example, spiralled blades or cross-cut) are not covered by this document. Cutters
    intended for use with CAD/CAM systems are excluded from the scope of this document.
