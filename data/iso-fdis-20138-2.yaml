abstract:
- language: en
  script: Latn
  content: This document specifies the methodologies for calculation of braking performance
    for railway rolling stock. This document describes the general algorithms/formulae
    using instantaneous value inputs to perform calculations of brake equipment and
    braking performance, in terms of stopping/slowing distances, braking power and
    energy for all types of rolling stock, either as vehicles or units. The calculations
    can be performed at any stage of the assessment process (design, manufacture,
    testing, verification, investigation, etc.) of railway rolling stock. This document
    does not set out specific acceptance criteria (pass/fail). This document is not
    intended to be used as a design guide for the selection of brake systems and does
    not specify performance requirements. This document does not provide a method
    to calculate the extension of stopping distances when the level of demanded adhesion
    exceeds the available adhesion (wheel slide activity). This document contains
    examples of the calculation of brake forces for different brake equipment types
    and examples of the calculation of stopping distance for vehicles or units.
