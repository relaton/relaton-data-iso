abstract:
- language: en
  script: Latn
  content: This document specifies a method for the gas-chromatographic determination
    of the qualitative and quantitative composition of solvents contained in a product.
    The method is applicable to coating materials containing solely organic solvents
    (generally called conventional coating materials) and binder solutions and non-aqueous
    dispersions containing solely organic solvents. The method defined in this document
    is not applicable for determination of volatile organic compounds (VOC) and semi-volatile
    organic compounds (SVOC) content. NOTE For determination of VOC and SVOC, see
    ISO 11890-2.
