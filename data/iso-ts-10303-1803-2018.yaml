abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1803:2018-11 specifies the application module for Process
    plan. The following are within the scope of ISO/TS 10303-1803:2018-11: process
    plan and its decomposition into process operations; relationship between raw materials,
    in-process items and final items; relationship between the items and the tools
    used to manufacture them; items within the scope of application module Activity
    method, ISO/TS 10303-1049; items within the scope of application module Item definition
    structure, ISO/TS 10303-1345; items within the scope of application module Part
    occurrence, ISO/TS 10303-1715; items within the scope of application module Product
    view definition, ISO/TS 10303-1019; items within the scope of application module
    Shape property assignment, ISO/TS 10303-1032; items within the scope of application
    module Specification control, ISO/TS 10303-1112; items within the scope of application
    module Support resource, ISO/TS 10303-1800.'
