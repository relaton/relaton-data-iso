abstract:
- language: en
  script: Latn
  content: This document specifies three methods (the octave-band, HML and SNR methods)
    of estimating the A-weighted sound pressure levels effective when hearing protectors
    are worn. The methods are applicable to either the sound pressure level or the
    equivalent continuous sound pressure level of the noise. Although primarily intended
    for steady noise exposures, the methods are also applicable to noises containing
    impulsive components. It is possible that these methods could not be suitable
    for use with peak sound pressure level measurements. The octave-band, H, M, L
    or SNR values are suitable for establishing sound attenuation criteria for selecting
    or comparing hearing protectors, and/or setting minimum acceptable sound attenuation
    requirements.
