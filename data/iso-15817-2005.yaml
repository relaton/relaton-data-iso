abstract:
- language: en
  script: Latn
  content: ISO 15817:2005 specifies the safety requirements for wireless and/or wired
    remote control systems, used on earth-moving machinery as defined in ISO 6165.
    ISO 15817:2005 does not apply to autonomous control systems that enable a machine
    to work without the assistance of an operator, but is applicable to machines controlled
    remotely by an operator. It does not apply to the remote control of attachments
    on non-remote controlled machines. ISO 15817:2005 does not specify performance
    criteria for the remote control system.
