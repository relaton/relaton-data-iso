abstract:
- language: en
  script: Latn
  content: ISO 16000-16:2008 specifies requirements for long-term (0,5 h to several
    hours) sampling of moulds in indoor air by filtration. Following the instructions
    given, a sample is obtained for subsequent detection of moulds by cultivation
    after suspension according to ISO 16000-17, which is part of the complete measurement
    procedure. ISO 16000-16:2008 is not suitable for personal sampling.
