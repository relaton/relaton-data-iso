abstract:
- language: en
  script: Latn
  content: This document specifies the determination of polyglutamic acid content
    in fertilizers by high-performance liquid chromatography-tandem mass spectrometry
    (HPLC-MS), pre-column derivatization high-performance liquid chromatography (HPLC)
    with dansyl chloride and amino acid analyzer. This document applies to fertilizers,
    soil conditioners and Beneficial Substances that contain polyglutamic acid and
    do not contain other components that produce glutamic acid upon hydrolysis.
