abstract:
- language: en
  script: Latn
  content: ISO 3302-1:2014 specifies classes of dimensional tolerances and their values
    for moulded, extruded, and calendared solid rubber products. The relevant test
    methods necessary for the establishment of compliance with ISO 3302-1:2014 are
    also specified. The tolerances are primarily intended for use with vulcanized
    rubber but can also be suitable for products made of thermoplastic rubbers. ISO
    3302-1:2014 does not apply to precision toroidal sealing rings or to calendared
    composite products such as rubber-coated fabrics or products where a rubber coating
    is applied by the process of topping or skim coating.
