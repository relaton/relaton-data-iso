abstract:
- language: en
  script: Latn
  content: 'This document specifies the general requirements for evaluating the vibration of various coupled industrial machine types with operating speeds between 120 r/min and 30 000 r/min when measurements are made in-situ. This document gives guidelines for applying evaluation criteria for measurements taken on non-rotating and rotating parts under normal operating conditions. The guidelines are presented in terms of both steady running vibration values and in terms of changes to vibration values which can occur in these steady values. This document is applicable to these machine types: steam turbines and generators with outputs ≤40 MW; steam turbines and generators with output power >40 MW and operating speeds other than 1 500 r/min, 1 800 r/min, 3 000 r/min or 3 600 r/min (although generators seldom fall into this category); rotary compressors; industrial gas turbines with output power ≤3 MW; turbofans; electric motors of any type, if the coupling is flexible. When a motor is rigidly coupled to a machine type covered by any other part of the ISO 20816 series, see also that other part; rolls and mills; conveyors; blowers or fans with a rated power greater than 300 kW or which are not flexibly supported, see also ISO 14694. This document is applicable to machines including a gear unit. ISO 20816-9 contains information for special acceptance tests related to gear units. This document is applicable to in-situ broad-band vibration measurements taken on the shafts, bearings, bearing pedestals or housings of machines close to bearings under steady-state operating conditions within their operating speed range. The requirements relate to both acceptance tests and operational monitoring. The evaluation criteria apply to both continuous and non-continuous monitoring. This document is applicable to machines which have gears or rolling bearings but does not address the diagnostic evaluation of the condition of those gears or bearings. This document is applicable only for the vibration produced by the machine set itself and not for vibration that is transmitted to the machine set from external sources.'
