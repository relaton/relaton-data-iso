abstract:
- language: en
  script: Latn
  content: This document specifies the test method for assessing the morphology of
    ultra-high-molecular-weight polyethylene (UHMWPE) moulded forms as defined in
    ISO 5834-2. The assessment of morphology of UHMWPE moulded forms is not required
    in routine monitoring of validated moulding process because alternative test methods
    defined in ISO 5834-2, such as density and mechanical properties, already provide
    reasonable, redundant assurance of successful consolidation. This document is
    not applicable to UHMWPE powder forms, which are described in ISO 5834-1. NOTE           
    Performance requirements for this test method have not been established.
