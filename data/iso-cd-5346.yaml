abstract:
- language: en
  script: Latn
  content: This document specifies the categorial structure within the field of traditional
    Chinese medicine clinical decision support system by defining a set of domain
    constraints of sanctioned characteristics, each composed of a relationship and
    an applicable information model. This document is not applicable to Western medicine
    and Japanese Kampo medicine. It is not applicable to the design and management
    of artificial intelligence diagnosis and treatment.
