abstract:
- language: en
  script: Latn
  content: This document specifies requirements for 14 grades of high-carbon cast-steel
    shot and 11 grades of high-carbon cast-steel grit, as supplied for blast-cleaning
    processes. Values are specified for hardness, density, defect/structural requirements
    and chemical composition. The requirements specified in this document apply to
    abrasives supplied in the "new" condition only. They do not apply to abrasives
    either during or after use. Test methods for metallic blast-cleaning abrasives
    are given in the various parts of ISO 11125. High-carbon cast-steel shot and grit
    are used in both static and site blasting equipment. They are most often selected
    where a facility exists for the recovery and re-use of the abrasive. NOTE 1 Information
    on commonly referenced national standards for metallic abrasives and their approximate
    relationship with ISO 11124 is given in Annex A. NOTE 2 Although this document
    has been developed specifically to meet requirements for preparation of steelwork,
    the properties specified will generally be appropriate for use when preparing
    other material surfaces, or components, using blast-cleaning techniques. These
    techniques are described in ISO 8504‑2.
