abstract:
- language: en
  script: Latn
  content: 'ISO 3452-3:2013 describes two types of reference blocks: Type 1 reference
    blocks are used to determine the sensitivity levels of both fluorescent and colour
    contrast penetrant product families; Type 2 reference blocks are used for routine
    assessment of the performance of both fluorescent and colour contrast penetrant
    testing. The reference blocks are to be used in accordance with ISO 3452-1:2013.'
