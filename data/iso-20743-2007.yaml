abstract:
- language: en
  script: Latn
  content: 'ISO 20743:2007 specifies quantitative test methods to determine the antibacterial
    activity of antibacterial finished textile products including nonwovens. ISO 20743:2007
    is applicable to all textile products, including cloth, wadding, thread and material
    for clothing, home furnishings and miscellaneous goods regardless of the type
    of antibacterial agent used (organic, inorganic, natural or man-made) or the method
    of application (built-in, after-treatment or grafting). Based on the intended
    application and on the environment in which the textile product is to be used,
    the user can select the most suitable of the following three methods on determination
    of antibacterial activity: a) absorption method (an evaluation method in which
    test bacterial suspension is inoculated directly onto samples); b) transfer method
    (an evaluation method in which test bacteria are placed on an agar plate and transferred
    onto samples); c) printing method (an evaluation method in which test bacteria
    are placed on a filter and printed onto samples). The colony plate count method
    and the ATP (Adenosine Tri-phosphate) luminescence method are also specified for
    measuring the enumeration of bacteria.'
