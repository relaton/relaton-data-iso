abstract:
- language: en
  script: Latn
  content: 'This part of standard defines identification data structure, data carrier,
    tagging requirements for concrete, steel, and timber structural prefabricated
    components, which includes walls, pillars, girders (beams), piles, plates (boards),
    stairs during their whole life-cycle. —provides unique identification for prefabricated
    component items —specifies the semantics and data syntax to be used. —specifies
    the data carriers to be used on items of various categories, substitutes, and
    sizes. —recommendations for the labelling and marking of AIDC data carriers. Standardization
    in the field of industrial construction excluded: — Technical product documentation
    (TPD) (covered by ISO/TC 10); — Buildings and civil engineering works (covered
    by ISO/TC59); — Doors and windows (covered by ISO/TC162) — Steel and aluminium
    structures (covered by ISO/TC167)'
