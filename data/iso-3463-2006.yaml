abstract:
- language: en
  script: Latn
  content: ISO 3463:2006 specifies a dynamic test method and the acceptance conditions
    for roll-over protective structures (cab or frame) of wheeled tractors for agriculture
    and forestry. It is applicable to tractors having at least two axles for wheels
    mounted with pneumatic tyres, or having tracks instead of wheels, with an unballasted
    tractor mass of not less than 600 kg, but generally less than 6 000 kg, and with
    a minimum track width of the rear wheels greater than 1 150 mm.
