- language: en
  script: Latn
  content: This document gives guidance on impacts, risks and information technology within the domain of sustainable finance. It establishes the guiding frameworks for climate finance software services, tokenized green bond issuance, and sustainable-finance-related artificial intelligence (AI) agents. It also provides examples of use cases, which show how information technology is being leveraged to advance sustainable finance practices.
