abstract:
- language: en
  script: Latn
  content: 'This document will specify a part of a maritime ICT reference architecture
    (MIRA) that describes important and generalized features of digital interfaces
    between ships and ports. This includes the description of the properties of the
    physical ICT architectures and other related ICT artefacts, such as common object
    identifiers and generalized message exchanges, that are necessary to implement
    the processes described in ITPCO port call process. This document does will not
    cover other parts of a complete MIRA, such as communication between ship and ship
    operator related to voyage orders and noon reports, handling of ship or crew certificates
    etc. NOTE 1: MIRA is not a physical architecture but can be used as pattern for
    development of new architectures or a framework for description of existing architectures.
    NOTE 2: The port call part of MIRA, as specified in this document is based on
    the ITPCO port call process [5] and related documents.'
