abstract:
- language: en
  script: Latn
  content: This document provides currently available technical information concerning
    the lubrication of industrial gear drives with pitch line velocities up to 30
    m/s. It gives guidance on and is a source of information about different lubrication
    methods for gears and rolling element bearings used in gear drives, and types
    of lubricants used in enclosed gear drives and open gearing applications. It informs
    about possible modifications to the selection and application of lubricants as
    a function of duty cycle. This document is addressed to gear manufacturers, gearbox
    users and gearbox service personnel, inclusive of manufacturers and distributors
    of lubricants. In addition, this document addresses aspects related to sustainability
    when selecting lubricants and designing gear drive lubrication systems. This document
    is not applicable to gear drives for automotive transmissions.
