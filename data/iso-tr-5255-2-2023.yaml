abstract:
- language: en
  script: Latn
  content: 'This document: —    examines and analyses the safety environment for low-speed
    automated driving services (LSADS); —    describes the safety role supplement
    to the functional model described in ISO/TS 5255-1; —    describes the supplemental
    safety points for LSADS; —    describes role for the functional model of service
    applications for LSADS. This document can contribute to the development of future
    automated driving system service safety requirement use cases, other than the
    one described in ISO/TS 5255-1. This document is applicable to services using
    LSADS-equipped vehicles only. In-vehicle control system is not in scope of this
    document.'
