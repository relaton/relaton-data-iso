abstract:
- language: en
  script: Latn
  content: 'This document defines individual concepts that together constitute a vocabulary
    common to different stakeholders with interests in water service provision. It
    is intended to facilitate common understanding and communication on the provision
    and management of service activities relating to drinking water supply, wastewater
    and stormwater systems. The following are within the scope of this document: —
    definition of a vocabulary common to the different stakeholders; — definition
    of key elements and characteristics of the service to users; — definition of the
    components of drinking water supply, wastewater and stormwater systems.'
