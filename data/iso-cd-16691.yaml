abstract:
- language: en
  script: Latn
  content: 'ISO 16691:2014 defines general requirements for thermal control coatings
    (TCC) that are applied on metallic and/or non-metallic surfaces of spacecraft
    and payloads in order to provide the following thermo-optical properties: αs:
    solar absorptance; ε: emittance. The function of TCC is to reduce external heat
    absorption and/or to regulate radiant heat exchange between on-board equipment
    on spacecraft.'
