abstract:
- language: en
  script: Latn
  content: 'This document specifies the design and installation of alternating current
    (AC) and direct current (DC) electrical systems used for the purpose of electrical
    propulsion and/or the electrical part of a hybrid propulsion system (system with
    both a rechargeable battery and a fuelled power source). This document is applicable
    to electrical propulsion systems operated in the following ranges either individually
    or in combination: direct current of less than 1 500 V DC; single-phase alternating
    current up to AC 1 000 V; three-phase alternating current up to AC 1 000 V. This
    document is applicable to electrical propulsion systems installed in small craft
    up to 24 m length of the hull (LH in accordance with ISO 8666).'
