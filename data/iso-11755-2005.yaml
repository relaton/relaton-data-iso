abstract:
- language: en
  script: Latn
  content: ISO 11755:2005 specifies the requirements for inspection before, during
    and after the time of filling for cylinder bundles for compressed and liquefied
    gases, also referred to as bundles. ISO 11755:2005 does not apply to acetylene
    bundles. ISO 11755:2005 does not apply to bundles when they are a part of a battery
    vehicle.
