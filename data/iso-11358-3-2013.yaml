abstract:
- language: en
  script: Latn
  content: ISO 11358-3:2013 specifies an analysis method for determining the activation
    energy using the Ozawa-Friedman plot. It also specifies the preparation of master
    plots for verification of the reaction kinetics determined by thermogravimetry.
    The Ozawa-Friedman plot (logarithm of the rate of mass loss versus the reciprocal
    of absolute temperature at a given mass loss) is a derivative method that can
    be applied to data obtained by any mode of temperature change in thermal analysis;
    e.g. isothermal, constant heating rate, sample-controlled thermal analysis, temperature
    jump, and repeated temperature scanning.
