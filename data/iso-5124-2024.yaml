abstract:
- language: en
  script: Latn
  content: This document provides requirements and recommendations for the design,
    construction and operation of newly installed liquefied natural gas (LNG) railway
    loading and unloading facilities for use on onshore LNG terminals, LNG satellite
    plants, handling LNG tank wagons or tank containers engaged in international trade.
    The designated boundary limits of this document are between the LNG terminal’s
    inlet/outlet piping headers at the beginning of the rail loading or unloading
    area and the rail track area used for LNG tank wagons and containers. It is applicable
    to all rail loading bays, weighbridge(s) and related subsystems.
