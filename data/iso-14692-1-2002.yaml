abstract:
- language: en
  script: Latn
  content: ISO 14692-1:2002 gives terms and definitions, describes the philosophy
    and provides guidance on the range of suitable applications, and defines limitations
    to the materials of construction for the specification, manufacture, testing and
    installation of glass-reinforced plastic (GRP) piping installations associated
    with offshore applications on both fixed and floating topsides facilities for
    oil and gas industry production and processing. It is intended to be used in conjunction
    with the other parts of ISO 14692. ISO 14692-1:2002 also describes the pressure
    terminology used in ISO 14692 (all parts).
