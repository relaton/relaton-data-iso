abstract:
- language: en
  script: Latn
  content: 'This document gives guidance to organizations on addressing climate-related environmental aspects, environmental conditions, and the associated risks and opportunities within an environmental management system (EMS) in accordance with ISO 14001 [26]. It addresses the environmental topic area of climate from both perspectives: mitigation and adaptation. This document is applicable to any organization, regardless of type, size or nature. It includes consideration of the organization’s activities, products and services that the organization determines it can either control or influence, taking a life cycle perspective.'
