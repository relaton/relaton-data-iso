abstract:
- language: en
  script: Latn
  content: This document lays down rules for the representation of modular sizes,
    lines and grids on construction drawings. The basic module M is 100 mm (see ISO
    1006). Generally, modular sizes are for use on design drawings, but can also be
    added to production drawings for manufacturing, orientation and location.
