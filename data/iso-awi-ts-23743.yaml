abstract:
- language: en
  script: Latn
  content: This Technical Specification (TS) aims to provide an objective test method
    for gas-phase air cleaning technologies that take into account emissions from
    occupants (bio-effluents) as a source of indoor air pollution. This document includes
    human participants both as pollution sources and for measuring perceived air quality.
    It can be used to verify if a given gas-phase air cleaner will improve or disimprove
    indoor air quality. The TS can be used to estimate the Clean Air Delivery Rate
    for a gas-phase air cleaner, which may improve indoor air quality or allow a decrease
    in ventilation air.
