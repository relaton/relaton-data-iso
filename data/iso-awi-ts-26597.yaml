abstract:
- language: en
  script: Latn
  content: 'This document specifies two dynamic test methods for evaluating nonlinear
    viscoelastic behavior, filler network integrity, and rubber–filler interactions
    of vulcanized rubbers and thermoplastics. Method A: Determination of nonlinear
    viscoelastic response using Fourier-transform rheology (FTR) under large-amplitude
    oscillatory shear. Method B: Determination of filler–filler and rubber-filler
    interactions using dynamic mechanical analysis (DMA) through strain-sweep testing
    (Payne effect). NOTE: Rubber that vulcanizates with more than 80 IRHD hardness
    will show slippage behaviour at very high strain analysis.'
