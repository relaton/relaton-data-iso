abstract:
- language: en
  script: Latn
  content: This document provides guidance for the use of machine vision to objectively
    assess grades of surface imperfections as defined on a drawing using ISO 10110-7
    with equivalent results as those obtained by applying the inspector-based methods
    described in ISO 14997-1. This document also gives guidelines on how to setup
    a machine vision device regarding fidelity, repeatability and reproducibility,
    based on the dark field detection principles of ISO 14997-1.
