abstract:
- language: en
  script: Latn
  content: ISO 10110 specifies the presentation of design and functional requirements
    for optical elements in technical drawings used for manufacturing and inspection.
    This part of ISO 10110 specifies rules for the indication of the surface texture
    of optical elements. Surface texture is the characteristic of a surface that can
    be effectively described with statistical methods. Typically, surface texture
    is associated with high spatial frequency errors (roughness) and mid-spatial frequency
    errors (waviness). This part of ISO 10110 is primarily intended for the specification
    of polished optics. This part of ISO 10110 describes a method for characterizing
    the residual surface that is left after detrending by subtracting the surface
    form.
