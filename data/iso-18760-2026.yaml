abstract:
- language: en
  script: Latn
  content: This document specifies the delivery conditions for longitudinally welded
    pipes of circular cross-section, made of high-manganese austenitic steel, intended
    for cryogenic temperature applications under pressure. This document is applicable
    to all pressure-retaining components and any non-pressure-retaining components,
    such as members of pipe supports, which are welded directly to a pressure-retaining
    component.
