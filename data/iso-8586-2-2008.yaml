abstract:
- language: en
  script: Latn
  content: ISO 8586-2:2008 specifies criteria for choosing people with particular
    sensory skills from selected assessors or from product, process or marketing specialists
    who themselves satisfy the selection criteria specified in ISO 8586-1. It specifies
    principles and procedures for choosing them and expanding their knowledge and
    abilities to the levels required of expert sensory assessors. ISO 8586-2:2008
    sets out requirements for expert sensory assessors to establish sensory profiles
    of products and materials through the use of descriptors. Specific knowledge of
    products or materials by expert sensory assessors is not necessary to fulfil these
    requirements. ISO 8586-2:2008 supplements the information given in ISO 6658.
