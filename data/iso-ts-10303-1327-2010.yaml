abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1327:2010-03 specifies the application module for Compound
    shape representation. The following are within the scope of ISO/TS 10303-1327:2010-03:
    representation of a topologically connected three dimensional geometry model with
    elements of different dimensionality including wireframe models, manifold and
    non manifold surfaces models; items within the scope of application module Edge
    based wireframe, ISO/TS 10303-1501; items within the scope of application module
    Non manifold surface, ISO/TS 10303-1324.'
