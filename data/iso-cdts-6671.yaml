abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements and test methods applicable to
    Thermal preinsulated ductile iron pipes, fittings, accessories and their joints
    for the construction of pipelines : — to convey hot water up to 130℃; — to be
    operated with pressure up to 25Bar; — to be installed below or above ground; —
    to limit temperature variations of the conveyed fluids. This document specifies
    materials, dimensions and tolerances, mechanical properties, standard coatings,
    thermal properties of the thermal insulation layer and external casing of preinsulated
    ductile iron pipes, fittings and accessories. It also gives performance requirements
    for all components including joints and gaskets. This document covers preinsulated
    ductile iron pipes, fittings and accessories of a size range extending from DN
    100 to DN 1600 inclusive, which are — manufactured with socket, flanged or spigot
    ends, — preinsulated in the works, and — normally delivered internally and externally
    coated.'
