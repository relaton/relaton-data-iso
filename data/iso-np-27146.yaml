abstract:
- language: en
  script: Latn
  content: The objective of the standard is to bridge the digital gap in the field
    of health for older users of digital health products and services, to ensure accessibility
    of these and equal access to technical solutions both at home, in hospitals and
    in care institutions. The document will outline requirements and recommendations
    to achieve this purpose. It focuses on accessibility aspects specific to digital
    healthcare processes and user interaction - such as digital consultation, access
    to medical records, digital prescriptions and health guidance - and considers
    the interface between assistive technologies and mainstream digital health systems
    to support inclusive access for older persons and people with e.g. cognitive or
    sensory impairments. The document does not specify interoperability, data structures,
    or general ergonomic design principles, which are covered by ISO/TC 215 and ISO/TC
    159 respectively. For the purpose of this document, "health-related products"
    are understood as digital tools used in the context of accessing or providing
    health information and services, not medical device design or performance.
