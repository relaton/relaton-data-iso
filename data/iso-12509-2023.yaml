abstract:
- language: en
  script: Latn
  content: This document specifies requirements for installation and performance of
    lighting, signalling and marking lights, and reflex reflectors. It is applicable
    to ride-on self-propelled wheeled or crawler earth-moving machines as defined
    in ISO 6165, and rough-terrain variable-reach trucks as defined in ISO 10896-1
    and ISO 10896-2, hereafter known as “machines”. These machines are used off-road
    and can occasionally be driven on the road. NOTE 1   Meeting the requirements
    of this document does not ensure conformance to national or regional on-road regulations.
    NOTE 2   Rough-terrain trucks with mast as defined in ISO 3691-1 and rough-terrain
    lorry-mounted trucks as defined in ISO 20297-1 are not specifically covered by
    this document, but this document can be used for guidance.
