abstract:
- language: en
  script: Latn
  content: This document specifies requirements and recommendations for the selection
    and installation of lithium-ion batteries for boats, as well as requirements for
    the safety information provided by the manufacturer. This document is applicable
    to lithium-ion batteries and battery systems with a capacity greater than 500 Wh
    used on small craft for providing power for general electrical loads and/or to
    electric propulsion systems. It is primarily intended for manufacturers and battery
    installers.
