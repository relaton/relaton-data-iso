abstract:
- language: en
  script: Latn
  content: ISO 15686-2:2012 describes procedures that facilitate service life predictions
    of building components, based on technical and functional performance. It provides
    a general framework, principles and requirements for conducting and reporting
    such studies. It does not cover limitation of service life due to obsolescence
    or other non-measurable or unpredictable performance states.
