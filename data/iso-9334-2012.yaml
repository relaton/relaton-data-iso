abstract:
- language: en
  script: Latn
  content: ISO 9334:2012 de­fines terms relating to the optical transfer function
    and indicates, where pertinent, the mathematical relationships between those terms.
    It also defines important parameters that should be speci­fied in connection with
    optical transfer function testing. The terms and parameters de­fined in ISO 9334:2012
    apply to all measurements of the optical transfer function for optical, electro‑optical
    and other imaging systems.
