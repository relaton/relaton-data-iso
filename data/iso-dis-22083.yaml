abstract:
- language: en
  script: Latn
  content: In order to reduce the impact of predictable natural hazards on railway
    operation, this document specifies a general concept and basic requirements for
    the planning of railway operation in the events of predictable natural hazards,
    focusing on rainfall and strong wind. The given concepts and basic requirements
    do not apply to regions where the consequences of the addressed predictable hazards
    for railway operation are low or non-existent. The definition of such regions
    is out of the scope of this document. This document includes measures directly
    related to railway operation to reduce the impact in the events of predictable
    natural hazards. Furthermore, this document does not include specific measures
    which ensure passenger safety or which provide protection against railway-operational
    damage caused by the predictable natural hazards. Therefore, residual risk can
    remain.
