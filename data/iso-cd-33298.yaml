abstract:
- language: en
  script: Latn
  content: 'This document is applicable to helical steel suspension springs used in
    the suspension of railway vehicles. It deals specially with helical compression
    springs made from round section steel bars of constant diameter and with constant
    inclination of coiling. It deals also with helical springs with different shapes(e.g.
    conical and/or inclination of coiling not constant and/or steel bar with other
    cross sections,etc.). This document gives guidance for: — design; — specification
    of technical and quality requirements; — the approval procedure and quality assurance
    of production methods; — the examinations and tests to be carried out; — the delivery
    conditions'
