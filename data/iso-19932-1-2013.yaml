abstract:
- language: en
  script: Latn
  content: 'ISO 19932-1:2013 specifies the safety and environmental requirements and
    their means of verification for the design and construction of knapsack sprayers
    carried on the back or shoulder of the operator for use with plant protection
    products. In addition, it specifies the type of information on safe working practices
    (including residual risks) to be provided by the manufacturer. It is applicable
    to lever-operated knapsack sprayers, knapsack compression sprayers and knapsack
    sprayers driven by an engine or electric motor using hydraulic pressure atomisation
    of the spray liquid, with a nominal volume of more than 3 l, for their intended
    use primarily in agriculture and horticulture. It does not apply to knapsack mistblowers
    according to ISO 28139. ISO 19932-1:2013 deals with all significant hazards, hazardous
    situations and hazardous events relevant to knapsack sprayers when they are used
    as intended and under conditions of misuse which are reasonably foreseeable by
    the manufacturer, excepting the hazards arising from: static electricity; explosion
    or fire from chemicals for spraying; and insufficient structural integrity. ISO
    19932-1:2013 is not applicable to knapsack sprayers which are manufactured before
    the date of its publication.'
