abstract:
- language: en
  script: Latn
  content: ISO 16063-33:2017 specifies a method, procedures and the specifications
    for an apparatus to be used for testing the magnetic field sensitivity of vibration
    and shock transducers. It is applicable to all kinds of vibration and shock transducers.
    ISO 16063-33:2017 is applicable for a reference test sinusoidal magnetic field
    having a root mean square (r.m.s.) value more than 10?3 T at 50 Hz or 60 Hz. Typically,
    a test magnetic field of 10?2 T at 50 Hz or 60 Hz is used. ISO 16063-33:2017 is
    primarily intended for those who are required to meet internationally standardized
    methods for the measurement of magnetic field sensitivity under laboratory conditions.
    NOTE 1 T (tesla) = 1 Wb/m2.
