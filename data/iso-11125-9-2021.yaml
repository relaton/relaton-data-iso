abstract:
- language: en
  script: Latn
  content: This document specifies three procedures to test the service life of a
    blast-cleaning abrasive under laboratory conditions. The performance of an abrasive
    is also measured by its ability to clean, via transmission of kinetic energy to
    the substrate in the blasting process. This document also specifies the procedures
    that can be performed in the same testing machines to help evaluate abrasive performance
    under laboratory conditions. This document applies to the testing of virgin metallic
    blasting media in the delivery state by centrifugal blasting under laboratory
    conditions.
