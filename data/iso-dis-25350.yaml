abstract:
- language: en
  script: Latn
  content: This proposal specifies a method for the determination of sorbic acid in
    meat, fish and their products by liquid chromatography. It is applicable to livestock
    meat, poultry meat, fish and other meat products. In this standard, samples are
    extracted by water, high-fat samples are degreased by n-hexane and high-protein
    samples are precipitated by adding protein precipitant. After that, samples are
    separated by liquid chromatography, detected by PDA detector, and quantified by
    external standard method.
