abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of, and corresponding test
    methods for, wrought stainless steel containing a mass fraction of 0,25 % to 0,50
    % nitrogen for use in the manufacture of surgical implants for which high levels
    of strength and corrosion resistance are required. NOTE 1 The mechanical properties
    of a sample obtained from a finished product made of this alloy can differ from
    those specified in this document. NOTE 2 Requirements for other stainless steels
    for implants for surgery can be found in ISO 5832-1.
