abstract:
- language: en
  script: Latn
  content: 'This document is Part 2 of a series of standards, defining the service
    architecture, data support requirements, model and algorithm requirements, platform
    requirements, collaboration requirements, and risk response related to artificial
    intelligence and big data technologies in urban mobility services, with the aim
    of supporting sustainable mobility and transportation. The following content wereincludedin
    the scope of this document: a) This standard specifies the concepts and reference
    architectureforapplying artificial intelligence and big data in urban mobility
    services, including key layers suchasbusiness support and service support, as
    well as their interrelationships; b) This standard specifiesthe data resource
    requirements necessary to support the services, including data types, quality,
    interoperability, and interfaces; it also specifies requirements for data-driven
    artificial intelligenceandbig data models and algorithms used in the services;
    c) This standard specifies the functional andperformance requirements for artificial
    intelligence and big data service platforms, as well as theapplication service
    requirements based on such platforms; it specifies the collaborative interoperabilityrequirements
    between different systems or platforms, to support the operation of diverse urbanandcommunity
    mobility and transportation services; d) This standard specifies requirements
    for theidentification, assessment, and intervention measures regarding potential
    technical, ethical, andsecurity risks during the application of AI and big data,
    so as to reduce application risks.'
