abstract:
- language: en
  script: Latn
  content: 'ISO 29061-3:2017 specifies the criteria for judgement of usability of
    child restraint systems (CRS) when installing them with the vehicle seat belts.
    ISO 29061-3:2017 provides criteria for judgement of: - ease of availability of
    instructions; - clarity of instruction manual and labelling; and - ease of use
    of design related features of the CRS related to the installation in a vehicle.
    NOTE Booster system usability evaluation is covered by ISO 29061-5.'
