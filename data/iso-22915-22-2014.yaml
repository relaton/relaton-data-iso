abstract:
- language: en
  script: Latn
  content: ISO 22915-22:2014 specifies the tests to verify the stability of lateral-
    and front-stacking trucks, as defined in ISO 5053-1, with and without elevating
    operator position. It applies to trucks fitted with fork arms, shuttle forks,
    and/or integrated attachments under normal operating conditions. It applies to
    trucks fitted with a load carrier that can be shifted laterally or pivoted out
    of the longitudinal centre plane of the truck.
