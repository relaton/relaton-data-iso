abstract:
- language: en
  script: Latn
  content: This International Standard specifies dimensions to ensure interchangeability
    between a tractor vehicle and a coupled semi-trailer, the two together constituting
    an articulated vehicle. It specifies certain interchangeability dimensions, including
    those of the gooseneck contour, as well as operating dimensions related to angle
    values. The specifications permit the same semi-trailer to be used with either
    two- or three-axle tractors. Annex A gives interface technical specifications
    for tractors designed for towing high-cube semi-trailers, including ISO containers
    having an external height of 2,9 m. This International Standard covers articulated
    vehicles used in commercial cargo transport of the greatest possible variety.
    However, it may not be applicable to special combination types such as low-bed
    or tipper vehicles. This International Standard does not provide limitations of
    maximum gross mass and overall dimensions, which are generally laid down by legislative
    requirements.
