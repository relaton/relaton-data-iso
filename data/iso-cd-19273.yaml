abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for extraoral suction
    equipment used in the treatment room for the purpose of aspirating and removing
    aerosols, that spread outside the oral cavity during dental treatment. This document
    applies to extraoral suction equipment with a built-in suction source as well
    as to extraoral suction equipment that is connected to a central suction source
    by way of facility pipeline. This document does not apply to equipment intended
    to be used for intraoral suction or room air purification systems. Also excluded
    from this document are small extraoral suction devices intended to be positioned
    directly outside of the oral cavity, such as devices connected to the dental unit
    suction system.
