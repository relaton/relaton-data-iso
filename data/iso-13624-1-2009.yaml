abstract:
- language: en
  script: Latn
  content: ISO 13624-1:2009 pertains to the design, selection, operation and maintenance
    of marine riser systems for floating drilling operations. Its purpose is to serve
    as a reference for designers, for those who select system components, and for
    those who use and maintain this equipment. It relies on basic engineering principles
    and the accumulated experience of offshore operators, contractors, and manufacturers.
    The marine drilling riser is best viewed as a system. It is necessary that designers,
    contractors, and operators realize that the individual components are recommended
    and selected in a manner suited to the overall performance of that system. For
    the purposes of ISO 13624-1:2009, a marine drilling riser system includes the
    tensioner system and all equipment between the top connection of the upper flex/ball
    joint and the bottom of wellhead conductor outer casing. It specifically excludes
    the diverter. Also, the applicability of ISO 13624-1:2009 is limited to operations
    with a subsea BOP stack deployed at the seafloor. ISO 13624-1:2009 is directly
    applicable to most floating drilling operations, to special situations dealing
    with deepwater drilling and collapse, to the special considerations required for
    guidelineless drilling and to operations in cold-weather conditions and H2S considerations.
    It is important that all riser primary-load-path components addressed in this
    International Standard be consistent with the load classifications specified in
    ISO 13625.
