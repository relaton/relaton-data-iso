abstract:
- language: en
  script: Latn
  content: 'This document specifies a reference dictionary for tool items, together
    with their descriptive properties and domains of values. This document specifies
    a reference dictionary containing: —    definitions and identifications of the
    classes of tool items and their features, with an associated classification scheme;
    —    definitions and identifications of the data element types that represents
    the properties of tool items and their features; —    definitions and identifications
    of domains of values for describing the above-mentioned data element types. The
    following are within the scope of this document: —    standard data that represent
    the various classes of tool items and tool item features; —    standard data that
    represent the various properties of tool items and tool item features; —    standard
    data that represent domains of values used for properties of tool items and tool
    item features; —    definition of cutting operations; —    definitions of reference
    systems for tool items and their properties; —    one implementation method by
    which the standard data defined in this document can be exchanged. NOTE 1    The
    implementation method by which the standard data defined in this document can
    be exchanged is specified in ISO 10303-21. The following are outside the scope
    of this document: —    specialized or expert knowledge in the design and use of
    cutting tools; —    rules to determine what information should be communicated;
    —    applications where these standard data can be stored or referenced; —   
    implementation methods other than the one defined in this document by which the
    standard data can be exchanged and referenced; —    information model for cutting
    tools; —    definitions of classes and properties for cutting items; —    definitions
    of classes and properties for adaptive items; —    definitions of classes and
    properties for assembly items; —    definitions of classes and properties for
    connection systems; —    definitions of classes and properties for reference systems.
    NOTE 2    The information model for cutting tools is defined in ISO 13399-1. NOTE 3   
    The definitions of classes and properties for cutting items, adaptive items, and
    assembly items are provided in ISO/TS 13399-2, ISO/TS 13399-4, and ISO/TS 13399-5,
    respectively. NOTE 4    The definitions of classes and properties for connection
    systems and reference systems are provided in ISO/TS 13399-50.'
