abstract:
- language: en
  script: Latn
  content: This document specifies the types, nominal sizes, dimensions and materials,
    as well as construction, manufacturing and marking requirements, for double cruciform
    bollards suitable for installation on sea-going vessels to meet normal mooring
    and towing requirements. This document lays down the materials and construction
    for a range of nominal size 70 to 500 and states the maximum loading for which
    the bollards are intended.
