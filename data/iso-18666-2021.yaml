abstract:
- language: en
  script: Latn
  content: This document specifies the general requirements for configuration, materials,
    performance and safety requirements of moxibustion devices. It also specifies
    the minimum requirements for moxibustion materials used in moxibustion devices.
    It is applicable across a wide range of moxibustion devices that use moxa floss
    as the main combustion material and can remain on or over the body throughout
    the moxibustion process. It is applicable to moxibustion devices for both single
    and repeated usage. This document does not apply to devices that imitate moxibustion,
    such as electro-moxibustion and infrared moxibustion devices that do not involve
    the use of moxa floss. It also does not apply to moxa floss used in direct moxibustion.
