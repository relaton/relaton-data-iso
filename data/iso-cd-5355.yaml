abstract:
- language: en
  script: Latn
  content: This document specifies the requirements, test methods and marking of ski-boots
    which are used with current systems of alpine ski-bindings with attachment at
    the boot toe and boot heel, the proper release function of which depends on the
    dimensions and design of the interfaces. For ski-binding systems that function
    irrespective of the sole shape or that have different requirements for the sole
    dimensions, it is not always necessary for the ski-boot soles to comply with this
    document in order to achieve the desired degree of safety. It applies to ski-boots
    of sizes 15,0 and larger [types A (for adults) and C (for children)] in the Mondopoint
    system (see Annex A).
