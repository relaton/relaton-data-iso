abstract:
- language: en
  script: Latn
  content: ISO 6194-3:2009 describes seals utilizing elastomeric sealing elements.
    They are considered suitable for use under low-pressure condition. ISO 6194-3:2009
    gives users of lip-type seals requirements and guidance on the careful storage,
    handling and proper installation of rotary shaft lip-type seals; attention is
    drawn to the hazards involved and ways of avoiding them.
