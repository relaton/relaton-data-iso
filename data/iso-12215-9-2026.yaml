abstract:
- language: en
  script: Latn
  content: 'This document defines the loads and specifies the scantlings of sailing craft appendages on monohull sailing craft with a length of hull (LH) measured in accordance with ISO 8666 or a load line length (see ISO 12215-5:2019, Clause 1, NOTE 1) of up to 24 m. It gives: design stresses; the structural components to be assessed; load cases and design loads for keel, centreboard and their attachments; computational methods and modelling guidance; the means for compliance with its provisions.'
