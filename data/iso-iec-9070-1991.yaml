abstract:
- language: en
  script: Latn
  content: This International Standard applies to the assignment of unique owner prefixes
    to owners of public text conforming to ISO 8879. It describes the procedures whereby
    such assignments are made, and the method of constructing registered owner names
    from them. Procedures for self-assignment of owner prefixes by standards bodies
    and other organizations are also specified. NOTE 2 Examples of registered public
    text are given in annex A. Further examples may be found in annexes to ISO 8879.
