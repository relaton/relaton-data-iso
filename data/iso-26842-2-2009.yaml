abstract:
- language: en
  script: Latn
  content: ISO 26842-2:2009 gives guidelines for the selection, by means of delamination-resistance
    tests, of adhesives for use in wood products placed in severe environments, indoors
    or during transport, in which the products are exposed to extreme changes of temperature
    and humidity. A series of exposure cycles at various temperatures and humidities
    is provided to verify that the adhesive selected, or a product bonded with the
    adhesive, meets the necessary requirements for resistance to delamination. ISO
    26842-2:2009 is intended to help the user not only to select a suitable adhesive
    but also to evaluate adhesives and adhesively bonded wood products. It is not
    intended for use in the qualification of structural components.
