abstract:
- language: en
  script: Latn
  content: 'ISO/ASTM 51310 covers the handling, testing and procedure for using a
    radiochromic optical waveguide dosimetry system to measure absorbed doses in materials
    irradiated by photons in terms of absorbed dose in water. This practice applies
    to radiochromic optical waveguide dosimeters that can be used within part or all
    of the specified ranges as follows: absorbed dose range from 1 Gy to 10 000 Gy
    for photons; absorbed dose rate from 0,001 Gy/s to 1 000 Gy/s; radiation energy
    range for photons from 0,1 MeV to 10 MeV; irradiation temperature range from -
    78 °C to + 60 °C.'
