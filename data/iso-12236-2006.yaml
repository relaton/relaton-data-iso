abstract:
- language: en
  script: Latn
  content: ISO 12236:2006 specifies a method for the determination of the puncture
    resistance by measuring the force required to push a flat-ended plunger through
    geosynthetics. The test is normally carried out on dry specimens conditioned in
    the specified atmosphere. The test is applicable to most types of products, but
    not to materials with apertures greater than 10 mm.
