abstract:
- language: en
  script: Latn
  content: This technical specification (TS) provides an optimized BALF analysis method
    in inhalation toxicity studies of nanomaterials. This technical specification
    will include the collection and preparation method for the BALF analysis in the
    aspect of inflammatory cell counts and levels of lactate dehydrogenase, total
    protein, and inflammatory mediators. In addition, this TS includes nanomaterial-specific
    considerations, such as inflammation patterns, proposed inflammatory mediators,
    and interferences in measurements. This TS is optimized for half-lung lavage of
    Sprague-Dawley (SD) rats but also provides information for the lavage volume of
    different strains and volume-determining parameters.
