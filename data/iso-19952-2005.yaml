abstract:
- language: en
  script: Latn
  content: ISO 19952:2005 defines terms used in the footwear industry, in English,
    French, Spanish and Italian. The terms and their definitions are listed alphabetically
    in English. In the annexes, all the terms are listed alphabetically in English,
    French, Spanish and Italian, so that the user of this International Standard can
    easily find the corresponding definition and the equivalent terms in the different
    languages. ISO 19952:2005 is intended to facilitate communication in the footwear
    sector.
