abstract:
- language: en
  script: Latn
  content: 'This part of ISO 21175 specifies a technology-neutral message meta-model and associated exchange formats for collaborative distributed simulation on different manufacturing platforms within a Collaborative Modelling and Simulation Environment (CMSE). It defines: — an abstract message meta-model for the identification, addressing, timing and payload structure of messages exchanged during a simulation run; — standardized message sets and their semantics for simulation lifecycle management, time management, model input and output exchange, monitoring, logging and error reporting; — a normative JSON-based serialization binding for representing these messages in a machine-readable and interoperable form; — general transport-binding principles for conveying such messages over message-oriented middleware or event-streaming infrastructures. This document applies to collaborative simulation configurations in which a coordinator and a set of runners exchange messages in order to initialize, synchronize, execute, observe and terminate a joint simulation run. It is intended to support interoperability between heterogeneous simulation frameworks and platforms while preserving the semantics of logical time, message ordering and port-based interaction. This document complements ISO 21175-1 by refining the message-based interaction mechanisms required to realize the Collaborative Modelling and Simulation Environment defined in that part.'
