abstract:
- language: en
  script: Latn
  content: This document establishes the performance requirements for outsole components
    for footwear, in order to assess the suitability for the end use. It also establishes
    the test methods to be used to evaluate the compliance with the requirements.
    This document applies to outsoles for all kinds of footwear as defined in Table 1.
