abstract:
- language: en
  script: Latn
  content: ISO/TS 19708:2007 specifies a test method for the determination, using
    a roller compactor for bituminous mixtures, of the damage to a geosynthetic used
    as a separator in interlocking-concrete-block pavements. The geosynthetic is placed
    between a cushion-sand course and a base coarse material. The roller compactor
    simulates highway traffic load and pedestrian load. After the roller compactor
    test, the cushion sand retained is determined. ISO/TS 19708:2007 can be used for
    selecting a geosynthetic.
