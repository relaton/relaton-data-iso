abstract:
- language: en
  script: Latn
  content: This document provides general guidelines for design and manufacture of
    an energy saving device installed in front of marine propellers. This document
    can also apply to the design and manufacture of energy saving devices installed
    in front of other types of marine propulsion. According to the specific geometrical
    shape of the propeller and other specifications, it is suggested that energy saving
    devices installed in front of a marine propeller is used in merchant ships.
