abstract:
- language: en
  script: Latn
  content: This document specifies rules for an international method for building
    financial instrument short names (FISNs) for any kind of financial or referential
    instrument within a defined structure. Financial or referential instruments include,
    but are not limited to, those described by ISO 10962. This document is applicable
    to any application in the trading and administration of financial or referential
    instruments in the financial services. The FISN code takes into account the need
    for human-readability as well as interoperability with existing standards and
    systems.
