abstract:
- language: en
  script: Latn
  content: This document describes a procedure for the determination of statistics
    for estimating the capability or performance of processes, particularly when the
    of process does not remain in statistical control. The process results of these
    quality characteristics are categorized into eight possible distribution types.
    The statistical methods described in this document only apply to continuous quality
    characteristics. They are applicable to processes in any industrial or economical
    sector. NOTE            This method is usually applied in case of a great number
    of serial process results, but it can also be used for small series (a small number
    of process results).
