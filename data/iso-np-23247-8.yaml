abstract:
- language: en
  script: Latn
  content: 'This part of ISO 23247 specifies the Verification, Validation, and Uncertainty
    Quantification (VVUQ) of digital twins in manufacturing by defining overarching
    principles, requirements, methodologies, procedures, and illustrative use cases
    for digital twins throughout their lifecycle. It covers: — Applying VVUQ concepts,
    definitions, and principles to digital twins, — Integrating a VVUQ entity into
    the existing ISO 23247 framework, — Specifying requirements, methods, procedures,
    metrics and key performance indicators to enable VVUQ of digital twins, — Mapping
    VVUQ functionalities to the digital twin framework entities, — Applying VVUQ to
    digital twins across their lifecycle stages, including requirements, development,
    commissioning, operation and maintenance, and decommissioning, and — Demonstrating
    the application of VVUQ through digital twin case studies.'
