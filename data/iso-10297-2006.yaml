abstract:
- language: en
  script: Latn
  content: ISO 10297:2006 specifies valve design, production and marking requirements,
    and type test methods for valves intended to be fitted to gas cylinders which
    convey compressed, liquefied or dissolved gases. ISO 10297:2006 does not apply
    to valves for cryogenic equipment, for fire extinguishers or for liquefied petroleum
    gas (LPG). Additional specific requirements for valves fitted with pressure-reducing
    devices (see ISO 22435 and EN 738-3), residual pressure-retaining devices and
    non-return devices (see ISO 15996), and bursting discs and pressure-relief devices
    (see ISO 4126 and prEN 14513) are not covered by ISO 10297:2006. NOTE Requirements
    for valves for liquefied petroleum gas (LPG) are specified in ISO 14245 and EN
    13152, and in ISO 15995 and EN 13153. Requirements for valves for cryogenic vessels
    are specified in ISO 21011. Further specific requirements for valves for breathing
    apparatus are specified in EN 144-1, EN 144-2 and EN 144-3.
