abstract:
- language: en
  script: Latn
  content: 'This document specifies the integrated generic resource constructs for
    isogeometric analysis representation. These constructs support the representation
    of geometric models using isogeometric analysis methods, including NURBS-based
    surfaces and volumes, parametric representations, and analysis-suitable geometric
    descriptions. The following are within the scope of this document: * the specification
    of isogeometric analysis geometric models and their parametric representations;
    * the definition of NURBS surfaces, volumes, and curves suitable for analysis;
    * the specification of control point structures and weight definitions for isogeometric
    elements; * the association of parametric spaces with physical coordinates for
    analysis purposes; * the definition of knot vectors and basis function specifications;
    * the specification of refinement operations for isogeometric analysis meshes;
    * the representation of boundary conditions and constraints in parametric domains;
    * the specification of material property assignments within isogeometric representations;
    * the definition of analysis-specific geometric transformations and mappings.
    The following are outside the scope of this document: * the definition of specific
    analysis solvers or numerical methods; * the specification of analysis results
    or solution data; * the implementation details of isogeometric analysis algorithms;
    * the definition of specific CAD system geometric representations; * the specification
    of visualization or rendering methods for analysis results; * the definition of
    specific file formats for isogeometric analysis data; * constraints on the mathematical
    validity of NURBS representations.'
