abstract:
- language: en
  script: Latn
  content: 'ISO 2303 specifies, for general purpose non-oil-extended, solution-polymerized
    rubbers (IR): physical and chemical tests on raw rubbers;standard materials, standard
    test formulation, equipment and processing methods for evaluating the vulcanization
    characteristics. Two mill-mixing procedures are described in this Internatioanl
    Standard and an internal mixer-mill mixing procedure is described in an informative
    annex.'
