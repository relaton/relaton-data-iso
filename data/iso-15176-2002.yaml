abstract:
- language: en
  script: Latn
  content: ISO 15176:2002 provides guidance on the range of tests that may be necessary
    to characterize soil materials intended to be excavated and re-used with, or without,
    preliminary treatment. Soil materials include excavated soil, dredged materials,
    fill materials, manufactured soils and soil treated to remove or destroy contaminants.
    It takes into account the different requirements of top-soil, sub-soil and other
    soil materials such as sediments or treated soils. International Standard methods
    are listed where available. The test methods are intended to cover a range of
    possible end uses, such as play areas for small children, including nursery schools,
    kindergardens, etc.; schools; gardens and other residential areas; allotments;
    horticulture; agriculture; forestry; recreational areas, e.g. parks, sport fields;
    restoration of damaged ecosystems; construction sites. It is intended to be of
    use in determining the suitability of soil materials for re-use, and the assessment
    of the environmental impacts that might arise from re-use. ISO 15176:2002 is not
    applicable to the placement of soil materials in the water environment or to restore
    underground workings. It does not address geotechnical requirements when soil
    materials are to be used as construction material.
