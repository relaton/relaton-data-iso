abstract:
- language: en
  script: Latn
  content: 'This part of ISO/IEC 14776 defines the command set extensions to facilitate
    operation of SCSI stream devices. This standard in conjunction with ANSI INCITS
    351-2001 fully specifies the standard command set for the SCSI stream device class.The
    objective of this standard (SSC) is to provide the following: a) permit an application
    client to communicate over a SCSI service delivery subsystem, with a logical unit
    that declares itself to be a sequential access device or printer device in the
    device type field of the INQUIRY command response data;b) define commands unique
    to each type of SCSI stream device;c) define commands to manage the operation
    of SCSI stream devices; andd) define the differences between the types of SCSI
    stream devices.'
