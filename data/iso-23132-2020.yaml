abstract:
- language: en
  script: Latn
  content: This document defines the classification methodology of time-constrained
    situations and their requirements, that are to be addressed by the "ExVe time
    critical interfaces" described in ISO 20077‑1. Time-constrained situations include
    safety-critical situations. It is important for the design of the vehicle to have
    priority management of "ExVe time critical interface" resources in order to comply
    with time constrained situations requirements. The methodology provides a classification,
    which determines application priorities for optimal vehicle resource allocation.
