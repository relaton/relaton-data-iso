abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the design, materials, construction,
    installation and testing of permanently installed fuel systems as installed for
    internal combustion engines. It applies to all parts of permanently installed
    diesel and petrol fuel systems as installed, from the fuel fill opening to the
    point of connection with the propulsion or auxiliary engine(s) on inboard- and
    outboard-powered small craft. Requirements for the design and testing of petrol
    and diesel fuel tanks for internal combustion engines that are intended to be
    permanently installed in small craft are given in ISO 21487:2022.
