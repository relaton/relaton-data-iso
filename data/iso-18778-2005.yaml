abstract:
- language: en
  script: Latn
  content: ISO 18778:2005 specifies requirements for the safety and essential performance
    of monitors used to detect apparent life-threatening events in sleeping or resting
    children under three years of age. This International Standard applies to devices
    used in home care applications. These monitors are generally used without continual
    professional supervision. ISO 18778:2005 also applies to the accessories, e.g.
    probes and cables necessary to apply the monitor to the patient. It does not apply
    to monitors intended for use in health care facilities/institutions.
