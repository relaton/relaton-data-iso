abstract:
- language: en
  script: Latn
  content: 'ISO 11540:2014 specifies requirements to reduce the risk of asphyxiation
    from caps for writing and marking instruments. It relates to such instruments
    which in normal or foreseeable circumstances are likely to be used by children
    up to the age of 14 years. ISO 11540:2014 is not applicable to the following:
    writing and marking instruments which are designed or only intended for use by
    adults (e.g. jewellery pens, expensive fountain pens, professional technical pens);
    transit caps for refills.'
