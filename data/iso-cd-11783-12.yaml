abstract:
- language: en
  script: Latn
  content: ISO 11783, as a whole, specifies a serial data network for control and
    communications on forestry or agricultural tractors and mounted, semi-mounted,
    towed, or self-propelled implements. Its purpose is to standardize the method
    and format of transfer of data between sensors, actuators, control elements and
    information storage, and display units, whether mounted on, or part of, the tractor
    or implement. This document describes the network's diagnostic system. NOTE The
    name and contact information of the Maintenance Agency for this document can be
    found at http://www.iso.org/mara.
