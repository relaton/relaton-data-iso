abstract:
- language: en
  script: Latn
  content: ISO 16122-1:2015 defines the general requirements to be fulfilled for the
    inspection of all types of sprayers for plant protection products used in agriculture,
    horticulture, forestry and other areas, except knapsack sprayers (see ISO 19932?1
    and ISO 19932?2). The specific requirements for the different types of sprayers
    are defined in the relevant specific parts of ISO 16122. When used in conjunction
    with the relevant sprayer specific part, ISO 16122-1:2015 specifies the requirements
    and test methods for the in use inspection of sprayers. The requirements relate
    mainly to the condition of the sprayer with respect to potential risks for the
    environment and its performance to achieve a good application. ISO 16122-1:2015
    also includes minimum requirements for the preparation of the sprayer for the
    inspection and the minimum safety requirements with respect to the safety of the
    inspector (test operator) during the inspection.
