abstract:
- language: en
  script: Latn
  content: ISO 6182-10:2006 specifies performance requirements, test methods and marking
    requirements for domestic sprinklers. These sprinklers are intended to provide
    control of fires in domestic occupancies, to prevent flashover (total involvement)
    in the room of fire origin and to improve the probability for successful escape
    or evacuation of the occupants.
