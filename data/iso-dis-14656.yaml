abstract:
- language: en
  script: Latn
  content: This International Standard specifies requirements for epoxy powders for
    use in preparing fusion-bonded epoxycoated steel reinforcing bar, wire and welded
    fabric. This International Standard also includes requirements for sealing material
    used to repair damaged areas and cut ends on reinforcing steel. This International
    Standard defines a flexible (type A) coating and a nonflexible (type B) coating.
    The adhesion and moisture resistance of fusion-bonded epoxy powder coatings can
    be enhanced by certain formulation designs. These coating enhancements typically
    result in a reduction of the coating's flexibility.
