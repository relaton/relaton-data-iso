abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the percentage of matter
    which can be extracted from crystalline propylene plastics by boiling n-heptane
    under standard conditions of testing. Isotactic index is determined by conventional
    chemical extraction as an absolute method. This method provides for the identification
    and coding of types H, B and R propylene plastics according to ISO 19069-1[1].
    This method is suitable only for base polymers and is not applicable for mixtures.
    This method starts with solid propylene plastics in the form of particles of specified
    fineness.
