abstract:
- language: en
  script: Latn
  content: This document specifies requirements and gives guidelines for designing
    accessible software for people with the widest range of physical, sensory and
    cognitive abilities, including those who are temporarily or situationally disabled,
    and the elderly. It addresses software considerations for accessibility that complement
    general design for usability as addressed by parts of the ISO 9241 series, especially
    ISO 9241-11 and ISO 9241-210. This document is applicable to the accessibility
    of interactive systems. It addresses a wide range of software (e.g. home, mobile,
    office, web, learning support and library systems). It promotes the increased
    usability of systems for a wider range of users in the widest range of contexts
    of use. This document does not apply to the behaviour of, or requirements for,
    assistive technologies (including assistive software), but it does address the
    use of assistive technologies as an integrated component of interactive systems.
    It is intended for use by those responsible for the specification, design, development,
    evaluation and procurement of software platforms and software applications.
