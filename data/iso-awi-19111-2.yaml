abstract:
- language: en
  script: Latn
  content: 'This document defines the conceptual schema for the description of referencing
    by coordinates. It describes the minimum data required to define coordinate reference
    systems. This document supports the definition of: — spatial coordinate reference
    systems where coordinate values do not change with time. The system may: — be
    geodetic and apply on a national or regional basis, or — apply locally such as
    for a building or construction site, or — apply locally to an image or image sensor;
    — be referenced to a moving platform such as a car, a ship, an aircraft or a spacecraft.
    Such a coordinate reference system can be related to a second coordinate reference
    system which is referenced to the Earth through a transformation that includes
    a time element; — spatial coordinate reference systems in which coordinate values
    of points on or near the surface of the earth change with time due to tectonic
    plate motion or other crustal deformation. Such dynamic systems include time evolution,
    however they remain spatial in nature; — parametric coordinate reference systems
    which use a non-spatial parameter that varies monotonically with height or depth;
    — temporal coordinate reference systems which use dateTime, temporal count or
    temporal measure quantities that vary monotonically with time; — mixed spatial,
    parametric or temporal coordinate reference systems. The definition of a coordinate
    reference system does not change with time, although in some cases some of the
    defining parameters can include a rate of change of the parameter. The coordinate
    values within a dynamic and in a temporal coordinate reference system can change
    with time. This document also describes the conceptual schema for defining the
    information required to describe operations that change coordinate values. In
    addition to the minimum data required for the definition of the coordinate reference
    system or coordinate operation, the conceptual schema allows additional descriptive
    information - coordinate reference system metadata - to be provided. This document
    is applicable to producers and users of geographic information. Although it is
    applicable to digital geographic data, the principles described in this document
    can be extended to many other forms of spatial data such as maps, charts and text
    documents.'
