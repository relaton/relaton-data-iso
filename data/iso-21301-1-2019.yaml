abstract:
- language: en
  script: Latn
  content: '1.1 This document establishes a system of designation for ethylene-vinyl
    acetate thermoplastic material, which can be used as the basis for specifications.
    1.2 The types of ethylene-vinyl acetate (EVAC) plastic are differentiated from
    each other by a classification system based on appropriate levels of the following
    designatory properties: a) vinyl acetate content; b) melt mass-flow rate; and
    on information about the intended application and/or method of processing, important
    properties, additives, colorants, fillers and reinforcing materials. 1.3 This
    document is applicable to all ethylene vinyl acetate copolymers containing from
    a mass fraction from 3 % to 50 % (approximately 25 % molar) of vinyl acetate.
    It applies to materials ready for normal use in the form of powder, granules or
    pellets and to materials unmodified or modified by colorants, additives, fillers,
    etc. 1.4 It is not intended to imply that materials having the same designation
    give necessarily the same performance. This document does not provide engineering
    data, performance data or data on processing conditions which can be required
    to specify a material for a particular application and/or method of processing.
    If such additional properties are required, they are determined in accordance
    with the test methods specified in ISO 21301-2, if suitable. 1.5 In order to specify
    a thermoplastic material for a particular application or to ensure reproducible
    processing, additional requirements can be given in data block 5 (see 4.1).'
