abstract:
- language: en
  script: Latn
  content: This document specifies frequency and methods for the verification of pendulum
    impact-testing machines used for the Charpy impact test, Izod impact test, and
    tensile impact test described in ISO 179-1, ISO 180 and ISO 8256, respectively.
    Verification of instrumented impact machines is covered insofar as the geometrical
    and physical properties of instrumented machines are identical to non-instrumented
    machines. The force/work verification of instrumented machines is not covered
    in this document. This document is applicable to pendulum-type impact-testing
    machines, of different capacities and/or designs, with the geometrical and physical
    properties specified in Clause 5. Methods are specified for verification of the
    geometrical and physical properties of the different parts of the test machine.
    These methods are for use when the machine is being installed, has been repaired,
    has been moved, or is undergoing periodic checking.
