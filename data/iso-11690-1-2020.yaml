abstract:
- language: en
  script: Latn
  content: This document outlines strategies to be used in dealing with noise problems
    in existing and planned workplaces by describing basic concepts in noise control
    (noise reduction, noise emission, noise immission and noise exposure). It is applicable
    to all types of workplaces and all types of sources of sound which are met in
    workplaces, including human activities. It includes those important strategies
    to adopt when buying a new machine or equipment. This document deals only with
    audible sound.
