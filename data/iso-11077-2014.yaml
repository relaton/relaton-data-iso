abstract:
- language: en
  script: Latn
  content: ISO 11077:2014 specifies the general functional, performance, and safety
    requirements for a self-propelled vehicle equipped with a boom type aerial device
    and aircraft de-icing/anti-icing fluid (ADF) spraying systems, hereinafter designated
    as "de-icer". ISO 11077:2014 does not specify a comprehensive set of technical
    design criteria for aircraft de-icing/anti-icing vehicles, but only those relating
    to the main functional, safety, and performance requirements. ISO 11077:2014 is
    not applicable to stationary equipment, e.g. gantries, cranes, used to perform
    de-icing/anti-icing operations on aircraft.
