abstract:
- language: en
  script: Latn
  content: This document specifies the activities and responsibilities of the AM operators
    in the field of the additive manufacturing (AM) technologies dealing with metallic
    parts production. This document is intended to provide guidance for qualification
    of AM machine operators in general industrial applications. Where industry-specific
    requirements exist for the qualification of AM operators, such as ISO/ASTM 52942
    for aerospace applications, those industry-specific standards are used instead
    of this document.
