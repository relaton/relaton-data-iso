abstract:
- language: en
  script: Latn
  content: This document provides guidance to advance the adoption of asset management
    through public policy, specifically focused on the external context of all organizations
    that manage assets. This guidance defines and describes an enabling environment
    for asset management, and outlines how it can be created, sustained and improved
    through the use of public policy (see Clause 4). It outlines how participants
    in that environment can act and interact with one another to influence the development
    and deployment of public policies to enable asset management in their countries
    and jurisdictions (see Annexes A and B). This document provides a consistent approach
    (see Annexes C and D) to the development of public policy instruments (see 5.2.1)
    that enable asset management and help achieve government objectives. These can
    include implementing a framework of recommended practices for effective public
    investment (see Table 1), achieving the United Nations Sustainable Development
    Goals (UN SDGs), and otherwise generating greater value to society.
