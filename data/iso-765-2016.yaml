abstract:
- language: en
  script: Latn
  content: ISO 765:2016 gives a list of certain pesticide chemicals with reasonably
    short and distinctive chemical names or trivial names already known, to which
    it is deemed unnecessary to assign recommended common names at present. The intention
    is that all the members of the group of isomers of the same pesticide are included
    in this list, and in consequence it is not necessary to add any locants to the
    chemical names.
