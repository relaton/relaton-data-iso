abstract:
- language: en
  script: Latn
  content: This standard applies to extractables of propolis derived from raw propolis
    from Apis mellifera bees, that may be offered as liquid or solid propolis extracts.
    This standard applies to propolis extracts where propolis is the only ingredient.
    Propolis extracts shall be safe for animal and human consumption. This standard
    establishes the requirements for authenticity, quality, analytical methods and
    bioactivity. Further, the standard describes storage and transportation conditions,
    and packing mark requirements.
