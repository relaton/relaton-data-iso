abstract:
- language: en
  script: Latn
  content: This document details the methods for characterising the structural properties
    of CVD-grown graphene. The methods used are optical microscopy, Raman spectroscopy
    and transmission electron microscopy (TEM). The properties determined are the
    percentage of substrate coverage of graphene, number of layers, the level of disorder
    and layer stacking. Sample preparation routines, measurement protocols and data
    analysis for the characterisation of CVD-grown graphene are provided.
