abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for resistance spot welding in the
    fabrication of assemblies of uncoated and metallic-coated or weldable non-metallic-coated
    low-carbon steel, comprising two or three sheets of metal, where the maximum single-sheet
    thickness of components to be welded is within the range 0,4 mm to 3,0 mm. This
    document is applicable to welding of sheets of the same or unequal thickness,
    where the thickness ratio is less than or equal to 3:1. Welding with the following
    types of equipment is within the scope of this document: a)       pedestal welding
    equipment; b)       portable welding guns; c)        automatic welding equipment
    where the components are fed by robots or automatic feeding equipment; d)      
    multi-spot-welding machines; e)       robotic welding machines.'
