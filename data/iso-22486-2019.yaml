abstract:
- language: en
  script: Latn
  content: This document — defines smoking parameters and specifies the standard conditions
    to be provided for the routine analytical machine smoking of water pipe tobacco,
    where the water pipe tobacco sample is electrically heated only and not combusted;
    — specifies the requirements for a routine analytical smoking machine complying
    with the standard conditions. This document is only applicable for water pipe
    tobacco used in devices known as "arghile", "hookah", "nargile" or "shisha" in
    which tobacco is heated, not combusted. Other types of water pipe tobacco that
    are used in other devices such as "Chinese water pipe" are not covered.
