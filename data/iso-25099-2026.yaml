  script: Latn
  content: This document specifies requirements and test methods for Curcuma rhizome
    (Curcuma phaeocaulis, Curcuma kwangsiensis and Curcuma wenyujin rhizome). It is
    applicable to the Curcuma rhizome that is sold and used as a natural medicine
