abstract:
- language: en
  script: Latn
  content: 'ISO 4802-1:2016 specifies: a) a method for determining the hydrolytic
    resistance of the interior surfaces of glass containers when subjected to attack
    by water at 121 °C ± 1 °C for 60 min ± 1 min. The resistance is measured by titration
    of a known aliquot portion of the extraction solution produced with hydrochloric
    acid solution, in which case the resistance is inversely proportional to the volume
    of acid required; b) a classification of glass containers according to the hydrolytic
    resistance of the interior surfaces determined by the methods specified in ISO
    4802-1:2016.'
