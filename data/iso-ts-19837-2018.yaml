abstract:
- language: en
  script: Latn
  content: ISO/TS 19837:2018 specifies principles for the design, selection and application
    of trapped key interlocking devices and systems for machinery applications, independent
    of the type of energy used to control them or that they control. The requirements
    of this document apply to the safety related aspects of trapped key interlocking
    devices and systems. ISO 14119 always applies unless an exception is given in
    this document. ISO/TS 19837:2018 is intended to be used in conjunction with ISO
    14119. ISO/TS 19837:2018 does not provide testing requirements. NOTE Documents
    addressing testing requirements can be found in the Bibliography.
