abstract:
- language: en
  script: Latn
  content: 'ISO 19147:2015 specifies the data types and code lists associated with
    those types for the implementation of transfer nodes and their services in transport
    modelling and location based services. It includes the following: ? defines transfer
    nodes in a multimodal way so that the definition is general and valid for all
    types of transport means and modes; ? links transfer nodes to a location; ? focuses
    on the attributes defining the transfer node in relation to nodes in mode-specific
    networks; ? defines the attributes of transfer nodes that are relevant for travel
    planning and modelling of interoperable transport systems by transport planners;
    ? defines a set of services and facilities that may be related to transfer nodes
    and a way to provide information on accessibility, deviations and restrictions
    related to these services and facilities. ISO 19147:2015 is applicable for transport
    infrastructure owners and operators when defining and/or describing their transport
    infrastructure and for transport-related Service Providers when providing information
    to travellers and others. It is limited to the transport of persons and is also
    limited to the static getting-on and getting-off points. The main focus is on
    transfer nodes being part of public transport networks, that are located in road
    networks, but this International Standard is also applicable for transfer nodes
    in rail networks and in air and sea transport networks.'
