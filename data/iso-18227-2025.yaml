abstract:
- language: en
  script: Latn
  content: 'This document specifies the procedure for a quantitative determination
    of major and trace element concentrations in homogeneous solid waste, soil, soil-like
    material and sludge by energy dispersive X-ray fluorescence (EDXRF) spectrometry
    or wavelength dispersive X-ray fluorescence (WDXRF) spectrometry using a calibration
    with matrix-matched standards. This document is applicable for the following elements:
    Na, Mg, Al, Si, P, S, Cl, K, Ca, Ti, V, Cr, Mn, Fe, Co, Ni, Cu, Zn, As, Se, Br,
    Rb, Sr, Y, Zr, Nb, Mo, Ag, Cd, Sn, Sb, Te, I, Cs, Ba, Ta, W, Hg, Tl, Pb, Bi, Th
    and U. Concentration levels between a mass fraction of approximately 0,000 1 %
    and 100 % can be determined depending on the element and the instrument used.
    An optional XRF screening method for solid and liquid material as waste, sludge
    and soil is added in Annex A which provides a total element characterization at
    a semi-quantitative level, where the calibration is based on matrix-independent
    calibration curves, previously set up by the manufacturer.'
