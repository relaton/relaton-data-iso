abstract:
- language: en
  script: Latn
  content: 'This document specifies an interoperable, open and extensible information
    structure for recording PII principals'' consent to PII processing. This document
    provides requirements and recommendations on the use of consent receipts and consent
    records associated with a PII principal''s PII processing consent, aiming to support
    the: —    provision of a record of the consent to the PII principal; —    exchange
    of consent information between information systems; —    management of the life
    cycle of the recorded consent.'
