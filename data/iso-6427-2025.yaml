abstract:
- language: en
  script: Latn
  content: This document specifies methods for the determination of components in
    plastics that can be extracted by hot organic liquids near their boiling points.
    It also specifies a special extraction method called cold-extraction. The extractable
    components can be monomers, oligomers, polymers, plasticizers, stabilizers, etc.
    The kind and percentage of extractable matter influence the properties of plastics.
    This document does not apply to plastics that come into contact with food or drinking
    water, because special regulations for those plastics are established in many
    countries. The methods of this document are not intended to be used for migration
    tests. If this document is used to test plastics other than those mentioned in
    Table 1, the operating conditions are intended to be agreed upon by the interested
    parties.
