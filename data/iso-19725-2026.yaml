abstract:
- language: en
  script: Latn
  content: This document specifies necessary but not sufficient safety requirements
    for the use of SbW systems in passenger cars and light commercial vehicles for
    series application. This document does not replace the full application of the
    ISO 26262 series of standards and their implementation in safety-related measures.
    This document defines requirements for manual driving where the driver holds the
    steering wheel. NOTE            Misuse of hands-free driving is not considered.
    This document does not contain any requirements for the use of automated lateral
    vehicle control functions. The requirements consider systems consisting of a road
    wheel actuator (RWA), hand wheel actuator (HWA), and a steering wheel for driver
    input. Deviating concepts need to be analysed by the user for transferability.
