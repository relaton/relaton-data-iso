abstract:
- language: en
  script: Latn
  content: This document gives guidelines for certificate management issues involved
    in deploying digital certificates in healthcare. It specifies a structure and
    minimum requirements for certificate policies, as well as a structure for associated
    certification practice statements. This document also identifies the principles
    needed in a healthcare security policy for cross-border communication and defines
    the minimum levels of security required, concentrating on aspects unique to healthcare.
