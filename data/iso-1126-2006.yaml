abstract:
- language: en
  script: Latn
  content: 'ISO 1126:2006 specifies methods for determining the loss on heating of
    carbon black for use in the rubber industry. This loss on heating is due primarily
    to loss of moisture, but traces of other volatile materials may also be lost.
    The methods are not applicable to treated carbon blacks which contain added volatile
    materials. The following methods are described: method 1: gravity-convection oven
    method;method 2: moisture balance method;method 3: infrared irradiation method
    (rapid method).'
