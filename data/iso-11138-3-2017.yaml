abstract:
- language: en
  script: Latn
  content: ISO 11138-3:2017 specifies requirements for test organisms, suspensions,
    inoculated carriers, biological indicators and test methods intended for use in
    assessing the performance of sterilization processes employing moist heat as the
    sterilizing agent. NOTE 1 Requirements for validation and control of moist heat
    sterilization processes are provided by the ISO 17665 series. NOTE 2 National
    or regional regulations can provide requirements for work place safety.
