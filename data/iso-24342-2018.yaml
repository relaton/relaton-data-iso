abstract:
- language: en
  script: Latn
  content: This document describes methods for determining side lengths, straightness
    of edges and squareness of resilient or textile floor tiles and planks. The side
    lengths, straightness and squareness of resilient or textile floor tiles and planks
    are important considerations because installed flooring will have an objectionable
    appearance if these performance criteria are not followed. This can cause the
    installed tiles/planks to line up unevenly, producing unsightly seams and corners
    that do not match.
