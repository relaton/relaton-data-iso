abstract:
- language: en
  script: Latn
  content: This standard specifies the test method for the determination of the thermal
    conductivity of high-temperature thermal insulation by means of a guarded hot
    plate. The thermal conductivity of high-temperature thermal insulation is tested
    in the temperature range of 100 °C to 800 °C. This standard is used to measure
    the thermal conductivity of high-temperature thermal insulation consisting of
    homogeneous materials.
