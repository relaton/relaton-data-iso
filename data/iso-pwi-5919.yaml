abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the contents
    of residual monomers in ABS by headspace-gas chromatography (HS-GC). This document
    is applicable to the determination of residual monomers including styrene, acrylonitrile
    and 4-vinyl-1-cyclohexene (the dimer of butadiene) in ABS. This document is also
    applicable to determination of other volatile aromatic hydrocarbons, such as toluene,
    o-xylene, isopropyl benzene in ABS, as well as residue monomers in styrene-acrylonitrile
    copolymer (SAN) and methyl methacrylate-acrylonitrile-butadiene-styrene copolymer
    (MABS).
