abstract:
- language: en
  script: Latn
  content: This guidance covers the use of the results of the ISO 12782-series and other data in geochemical modelling to model and predict the leaching and speciation of metals and metalloids in soils and soil-like materials. Relationships between the results obtained from laboratory leaching tests and the mobility of these constituents in field scenarios are complex. Geochemical models are important additional tools that help to understand the causal relationships and enable predictions of the mobility of constituents beyond the conditions of the specific tests.
