abstract:
- language: en
  script: Latn
  content: This document specifies acceptance levels for the phased array ultrasonic
    testing technique (UT-PA) of full-penetration welds in low-alloy and/or fine-grained
    steels in the wall thickness range from 3,2 mm to 8 mm which correspond to the
    quality levels of ISO 5817. These acceptance levels are applicable to indications
    detected according to ISO 20601.
