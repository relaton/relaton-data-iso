abstract:
- language: en
  script: Latn
  content: This document allows the calculation of peak cooling capacity of Thermo
    Active Building Systems (TABS) – Type V according to ISO 11855-1, based on heat
    gains, such as solar gains, internal heat gains, and ventilation, and the calculation
    of the cooling power demand on the water side, to be used to size the cooling
    system, as regards, e.g. the chiller size, fluid flow rate. This document defines
    a detailed method aimed at the calculation of heating and cooling capacity in
    non-steady state conditions.
