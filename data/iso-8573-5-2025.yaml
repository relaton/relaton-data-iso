abstract:
- language: en
  script: Latn
  content: This document specifies the test method for determining the content of
    oil vapour in compressed air using pressurized sampling and gas chromatography.
    This document elaborates sampling, measurement, evaluation, uncertainty considerations
    and reporting in respect of the compressed air purity class for oil, in accordance
    with ISO 8573-1. For organic vapours and other gaseous contaminants, the same
    sampling procedure can be used, however the analysis method will be different
    depending on the target component. As guidance, ISO 8573-6 and ISO 16000-6 can
    be used.
