abstract:
- language: en
  script: Latn
  content: ISO 11609:2017 specifies requirements for the physical and chemical properties
    of dentifrices and provides guidelines for suitable test methods. It also specifies
    requirements for the marking, labelling and packaging of dentifrices. ISO 11609:2017
    applies to dentifrices, including toothpastes, destined to be used by the consumers
    on a daily basis with a toothbrush to promote oral hygiene. Specific qualitative
    and quantitative requirements for freedom from biological and toxicological hazards
    are not included in this document. These are covered in ISO 7405[1] and ISO 10993‑1[2].
