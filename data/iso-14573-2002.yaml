abstract:
- language: en
  script: Latn
  content: This International Standard specifies the essential requirements of snowboard
    strap bindings for soft boots (see 3.1), hereafter referred to as snowboard bindings.
    This International Standard is applicable to snowboard strap bindings for adults
    and children, but covers also strap bindings for soft boots, which may have step-in
    function. This International Standard does not apply to antiskid pads. NOTE 1
    For snowboard plate bindings without a release mechanism, see ISO 14790. NOTE
    2 For the binding mounting area of snowboards without inserts see ISO 10958-1
    and with inserts see ISO/DIS 10958-2.
