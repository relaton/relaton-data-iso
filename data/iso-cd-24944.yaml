abstract:
- language: en
  script: Latn
  content: Post-fire data collection for large outdoor fires will be reviewed based
    on available studies conducted for wildland-urban interface fires, urban fires,
    including post-earthquake urban fires, and informal settlement fires. These studies
    will be used to develop a standardized data collection methodology for large outdoor
    fires that may be used in the event of future large outdoor fire disasters. A
    standardized approach, at the international level, will is required to be able
    to assess and compare fire spread and damage across all these large outdoor fire
    types.
