abstract:
- language: en
  script: Latn
  content: 'This document deals with legal communication, and it builds on the foundation
    for plain language in ISO 24495-1. It establishes guidelines and techniques to
    help authors make sure that readers can readily understand legal communication
    and exercise their legal rights and obligations. This document explains how to
    apply principles from ISO 24495-1 in legal contexts that require authors to achieve
    these goals: —     reach multiple audiences with different needs; —     adhere
    to legally required structural and design requirements; —     explain complex
    and nuanced legal concepts; —     explain processes that readers must navigate
    to exercise legal rights and obligations. This document applies to legal documents
    in all sectors, including the legal, governmental, non-governmental and health
    sectors. Similarly to ISO 24495-1, it aims to work for most languages, but it
    provides examples only in English. It reflects research on plain legal language
    and the experience of experts in the field (see Reference [3]). To the extent
    possible, this document allows for differences in legal systems. Although this
    document applies mainly to written communication, it can apply to oral communication
    in some contexts, such as discussions with clients and explanations in court proceedings.'
