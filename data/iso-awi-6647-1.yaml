abstract:
- language: en
  script: Latn
  content: This document specifies a reference method for the determination of the
    amylose content of milled rice, non-parboiled. The method is applicable to rice
    with an amylose mass fraction higher than 5 %. This document can also be used
    for husked rice, maize, millet and other cereals if the extension of this scope
    has been validated by the user. NOTE Amylose values determined with this document
    can be compared with PDO and PGI legislation.
