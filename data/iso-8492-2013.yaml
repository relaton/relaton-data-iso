abstract:
- language: en
  script: Latn
  content: ISO 8492:2013 specifies a method for determining the ability of metallic
    tubes of circular cross-section to undergo plastic deformation by flattening.
    It may also be used to reveal the defects in the tubes. ISO 8492:2013 is applicable
    to tubes having an outside diameter no greater than 600 mm and a thickness no
    greater than 15 % of the outside diameter. The range of the outside diameter or
    thickness, for which this International Standard is applicable, may be more exactly
    specified in the relevant product standard.
