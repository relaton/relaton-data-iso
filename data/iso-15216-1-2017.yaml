abstract:
- language: en
  script: Latn
  content: ISO 15216-1:2017 specifies a method for the quantification of levels of
    HAV and norovirus genogroup I (GI) and II (GII) RNA, from test samples of foodstuffs
    (soft fruit, leaf, stem and bulb vegetables, bottled water, BMS) or food surfaces.
    Following liberation of viruses from the test sample, viral RNA is then extracted
    by lysis with guanidine thiocyanate and adsorption on silica. Target sequences
    within the viral RNA are amplified and detected by real-time RT-PCR. This method
    is not validated for detection of the target viruses in other foodstuffs (including
    multi-component foodstuffs), or any other matrices, nor for the detection of other
    viruses in foodstuffs, food surfaces or other matrices.
