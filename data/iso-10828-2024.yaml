abstract:
- language: en
  script: Latn
  content: This document describes the thread profiles of the five most common worm
    profile types and provides formulae of their axial profiles. The five worm profile
    types covered in this document are designated by the letters A, C, I, K and N.
    This document provides the formulae to calculate the path of contact, the conjugate
    profile of the worm wheel, the lines of contact, the radius of curvature and the
    velocities at points of contact. The application of those formulae to calculate
    parameters used in load capacity calculations are provided in 11.11.
