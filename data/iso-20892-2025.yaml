abstract:
- language: en
  script: Latn
  content: 'This document specifies procedures in the preparation and carrying out
    of the modernization process of launch complexes and their components. These procedures
    are devised in case there is a need to make changes in existing configuration
    of launch complexes. This document establishes the following: a)       modernization
    stages; b)       modernization performance requirements; c)        functions of
    the main participants of the modernization process and their interactions. This
    document is applicable to organizations involved in the modernization of the launch
    complexes.'
