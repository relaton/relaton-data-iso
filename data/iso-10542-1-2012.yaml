abstract:
- language: en
  script: Latn
  content: This part of ISO 10542 specifies design and performance requirements and
    associated test methods for wheelchair tiedown and occupant-restraint systems
    (WTORS), as well as requirements for product marking and labelling and manufacturers'
    instructions and warnings to installers and consumers. It is applicable to all
    WTORS that use belt-type occupant restraints that are intended for occupied wheelchairs
    used as forward-facing seats by passengers and drivers of motor vehicles. This
    part of ISO 10542 is applicable to WTORS intended for use with all types of manual
    and powered wheelchairs, including three- and four-wheeled scooters, used by children
    and adults with a body mass equal to or greater than 22 kg. It is applicable also
    to WTORS designed for limited use with a particular make or model of wheelchair.
    This part of ISO 10542 is applicable primarily to complete WTORS, but portions
    can also be applied to components and subassemblies sold separately and for replacement
    parts.
