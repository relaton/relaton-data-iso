abstract:
- language: en
  script: Latn
  content: This document specifies a gravimetric method for the determination of the
    loss on ignition (LOI) in solid rare earth oxides, carbonates and oxalates. This
    document is applicable to the determination of the LOI in the range from 0,10 %
    to 15,00 % in rare earth oxides, from 25,00 % to 80,00 % in rare earth carbonates,
    and from 35,00 % to 75,00 % in rare earth oxalates.
