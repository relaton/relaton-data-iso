abstract:
- language: en
  script: Latn
  content: ISO 27065 establishes minimum performance, classification, and marking
    requirements for protective clothing worn by operators handling pesticide products
    as well as re-entry workers. For the purpose of ISO 27065, the term pesticide
    applies to insecticides, herbicides, fungicides, and other substances applied
    in liquid form that are intended to prevent, destroy, repel, or reduce any pest
    or weeds in agricultural settings, green spaces, roadsides, etc. It does not include
    biocidal products used for agricultural and non-agricultural settings. Pesticide
    handling includes mixing and loading, application, and other activities such as
    cleaning contaminated equipment and containers. Concentrated pesticides are typically
    handled during mixing and loading. Protective clothing covered by ISO 27065includes,
    but is not limited to, shirts, jackets, trousers, coveralls, aprons, protective
    sleeves, caps/hats and other headwear (excluding hard hats made of rigid materials,
    e.g. hats worn by construction workers), and accessories used under knapsack/backpack
    sprayers. ISO 27065 does not address items used for the protection of the respiratory
    tract, hands, and feet. ISO 27065 does not address protection against fumigants.
