abstract:
- language: en
  script: Latn
  content: ISO 2240:2003 specifies the method for determining the ISO speed of colour
    reversal camera films producing continuous-tone pictorial images that are intended
    to be viewed on transparency illuminators or by projection as slides. It also
    applies to 8 mm and 16 mm motion-picture films used in non-professional applications.
    ISO 2240:2003 is not applicable to professional motion-picture films regardless
    of their applications.
