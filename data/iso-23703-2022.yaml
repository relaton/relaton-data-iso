abstract:
- language: en
  script: Latn
  content: This document describes the guidelines for misorientation analysis to assess
    mechanical damage such as fatigue and creep induced by plastic and/or creep deformation
    for metallic materials by using electron backscatter diffraction (EBSD) technique.
    This international standard defines misorientation parameters and specifies measurement
    conditions for such mechanical damage assessment. This document is recommended
    to evaluate mechanical damage of austenitic stainless steel, which is widely used
    for various components of power plants and other facilities. In this document,
    the mechanical damage refers to the damage which causes the fracture of structural
    materials due to external overload, fatigue and creep; excepting the chemical
    and thermal damages themselves.
