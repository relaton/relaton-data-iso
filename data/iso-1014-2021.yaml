abstract:
- language: en
  script: Latn
  content: This document specifies methods for a) determining the true relative density
    of coke, crushed to <212 µm, in relation to water; NOTE         “True relative
    density” varies according to the displacement liquid used. b) determining the
    apparent relative density of coke, i.e. the ratio of the mass of a volume of dry
    coke to the mass of an equal volume of water; c) calculating the porosity of the
    coke.
