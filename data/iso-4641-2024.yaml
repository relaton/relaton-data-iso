abstract:
- language: en
  script: Latn
  content: 'This document specifies the minimum requirements for textile-reinforced,
    smooth-bore rubber water-suction and discharge hoses and hose assemblies. Three
    types of hoses and hose assemblies are specified according to their operating
    duty requirements, i.e. their ambient and water temperature ranges: —     ambient
    temperatures: −25 °C to +70 °C; —     water temperatures during operation: 0 °C
    to +70 °C.'
