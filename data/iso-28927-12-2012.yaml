abstract:
- language: en
  script: Latn
  content: ISO 28927-12:2012 specifies a laboratory method for measuring hand-transmitted
    vibration emission at the handles of hand-held power driven portable die grinders.
    It is a type-test procedure for establishing the magnitude of vibration in the
    gripping areas of the machines where operating under type test conditions. It
    is intended that the results be used to compare different models of the same type
    of machine. ISO 28927-12:2012 is applicable to hand-held machines, driven pneumatically
    or by other means, equipped with a collet and intended for deburring operations
    using hard metal burrs or mounted points, on different materials ranging from
    hard steel to plastics. It is also applicable to low-speed die grinders using
    flap wheels or cylindrical sleeves.
