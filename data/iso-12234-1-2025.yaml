abstract:
- language: en
  script: Latn
  content: This document specifies a basic reference model for digital photography
    systems, including digital cameras. The reference model includes image file formats
    for storing image data and metadata, file system requirements for storing and
    retrieving the image files using internal or removable memory, and media profiles
    which are specific to a given storage technology. The reference model allows the
    image data and metadata to be interchanged among the various components of a digital
    photography system.
