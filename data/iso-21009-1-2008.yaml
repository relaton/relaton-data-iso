abstract:
- language: en
  script: Latn
  content: ISO 21009-1:2008 specifies requirements for the design, fabrication, inspection
    and testing of static vacuum-insulated cryogenic vessels designed for a maximum
    allowable pressure of more than 0,5 bar. It applies to specified static vacuum-insulated
    cryogenic vessels for fluids, and does not apply to vessels designed for toxic
    fluids. For static vacuum-insulated cryogenic vessels designed for a maximum allowable
    pressure of not more than 0,5 bar, ISO 21009 may be used as a guide.
