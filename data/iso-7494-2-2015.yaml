abstract:
- language: en
  script: Latn
  content: ISO 7494-2:2015 specifies requirements and test methods concerning a) the
    configuration of dental unit connections to the compressed air supply, water supply,
    suction supply, and wastewater drain plumbing, b) the materials, design, and construction
    of the compressed air and water system within the dental unit, c) the quality
    for incoming water and air, and d) the performance of dental unit suction system.
    ISO 7494-2:2015 also specifies requirements for instructions for use and technical
    description. ISO 7494-2:2015 is limited to dental units that are not used for
    life support treatment of ambulatory patients or for oral surgery treatment requiring
    sterile air and water supplies. Amalgam separators are not included in ISO 7494-2:2015.
