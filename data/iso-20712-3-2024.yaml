abstract:
- language: en
  script: Latn
  content: This document gives guidance for the selection and use of water safety
    signs as specified in ISO 7010 and beach safety flags as specified in ISO 20712-2
    in aquatic environments. It provides guidance on their location, mounting positions,
    lighting and maintenance. It also provides guidance on the design and location
    of multiple signs. This document does not apply to traffic signs for use on the
    public highway or maritime signalling. It is not applicable to flags for use on
    firing ranges or to flags used to indicate water quality. It does not cover means
    of escape signs or their possible illumination. NOTE            This document
    refers to water safety signs which were originally specified in ISO 20712-11)
    .These water safety signs have been integrated in ISO 7010, but are not specifically
    identified as water safety signs. 1) Cancelled and replaced by ISO 7010.
