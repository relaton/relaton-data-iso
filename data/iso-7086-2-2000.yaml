abstract:
- language: en
  script: Latn
  content: This part of ISO 7086 specifies permissible limits for the release of lead
    and cadmium from glass hollowware that is intended to be used in contact with
    food. This part of ISO 7086 is applicable to glass hollowware intended for use
    in the preparation, cooking, serving and storage of food and beverages, excluding
    glass ceramic ware, glass flatware, and all articles used in food manufacturing
    industries or those in which food is sold.
