abstract:
- language: en
  script: Latn
  content: 'ISO 8029:2014 specifies the requirements for four types of textile-reinforced
    thermoplastics collapsible water hoses for general applications for use in the
    temperature range of −10 °C to 55 °C. Such hoses are classified into four types,
    as follows: low pressure, designed for a maximum working pressure of up to 0,4
    MPa (4,0 bar) at 23 °C and up to 0,2 MPa (2,0 bar) at 55 °C; medium pressure,
    for a maximum working pressure of up to 0,7 MPa (7,0 bar) at 23 °C and up to 0,36
    MPa (3,6 bar) at 55 °C; high pressure, for a maximum working pressure of up to
    1,0 MPa (10,0 bar) at 23 °C and up to 0,51 MPa (5,1 bar) at 55 °C; extra-high
    pressure, for a maximum working pressure of up to 1,55 MPa (15,5 bar) at 23 °C
    and up to 0,79 MPa (7,9 bar) at 55 °C.'
