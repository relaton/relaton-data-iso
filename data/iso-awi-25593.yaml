abstract:
- language: en
  script: Latn
  content: This standard specifies the requirements, methodologies, and acceptance
    criteria for conducting leakage test on double-containment annulus utilizing the
    mass point method. It applies to leakage tests of the annulus in nuclear power
    plants, where leakage varies significantly with pressure differentials and the
    gas properties within the annulus are unstable. This standard may also serve as
    a reference for leakage measurements of other sealed structures under positive
    or negative pressure conditions exhibiting similar characteristics. Additionally,
    during the Preparatory stage and Committee stage, based on the actual needs of
    participating countries, this proposal may also need to include the design and
    construction requirements for the sealing of the annulus boundaries, including
    the displacement compensator, cable hole sealing, watertight door, ventilation
    system, process pipe, and other important local sealing requirements.
