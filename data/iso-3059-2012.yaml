abstract:
- language: en
  script: Latn
  content: ISO 3059:2012 specifies the control of the viewing conditions for magnetic
    particle and penetrant testing. It includes minimum requirements for the illuminance
    and UV-A irradiance and their measurement. It is intended for use when the human
    eye is the primary detection aid. ISO 3059:2012 does not cover the use of actinic
    blue light sources.
