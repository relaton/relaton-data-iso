abstract:
- language: en
  script: Latn
  content: This document specifies a method, using an absorbent medium, for determining
    the resistance of an individual-layer or multi-layer system of coating materials
    to the effects of liquids or paste-like products. This method enables the tester
    to determine the effects of the test substance on the coating and, if necessary,
    to assess the damage to the substrate.
