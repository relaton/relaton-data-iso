abstract:
- language: en
  script: Latn
  content: This document describes the use of modal acoustic emission (MAE) testing
    during periodic inspection and testing of hoop wrapped and fully wrapped composite
    transportable gas cylinders and tubes, with aluminium-alloy, steel or non-metallic
    liners or of linerless construction, intended for compressed and liquefied gases
    under pressure. This document addresses the periodic inspection and testing of
    composite cylinders constructed to ISO 11119‑1, ISO 11119‑2, ISO 11119‑3, ISO
    11515 and ISO/TS 17519 and can be applied to other composite cylinders designed
    to comparable standards when authorized by the competent authority. Unless noted
    by exception, the use of "cylinder" in this document refers to both cylinders
    and tubes.
