abstract:
- language: en
  script: Latn
  content: This document provides guidance on using ISO 26000:2010 in the food chain
    by focusing on the major aspects from its seven core subjects, namely organizational
    governance, human rights, labour practices, environment, fair operating practices,
    consumer issues and community involvement and development The main objective is
    to help organizations in the food chain, regardless of their size or location,
    to draw up a list of recommendations and move towards a more socially responsible
    behaviour.
