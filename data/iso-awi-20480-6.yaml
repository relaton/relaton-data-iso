abstract:
- language: en
  script: Latn
  content: This document specifies terminology and definitions used in fine bubble
    technology. It covers vocabulary related to bubble morphology and confinement
    states in various media, including free, surface-supported, sandwiched, shell-encapsulated,
    and wall-trapped bubbles. This document is applicable to the standardization of
    the terminology used in industry, research, development, and regulation of fine
    bubble technologies.
