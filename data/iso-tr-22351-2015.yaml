abstract:
- language: en
  script: Latn
  content: ISO/TR 22351:2015 describes a message structure for the exchange of information
    between organizations involved in emergency management. An organization can ingest
    the received information, based on the message structure, in its own operational
    picture. The structured message is called Emergency Management Shared Information
    (EMSI). ISO/TR 22351:2015 describes the message structure built in order to facilitate
    interoperability between existing and new information systems. The intended audience
    of ISO/TR 22351:2015 is control room engineers, information systems designers
    and decision makers in emergency management. NOTE The EMSI can be used complementary
    to other message protocols, as for example the common alert protocol (CAP).
