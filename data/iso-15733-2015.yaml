abstract:
- language: en
  script: Latn
  content: ISO 15733:2015 specifies the conditions for determination of tensile properties
    of ceramic matrix composite materials with continuous fibre reinforcement at room
    temperatures. This International Standard applies to all ceramic matrix composites
    with a continuous fibre reinforcement, unidirectional (1D), bi-directional (2D),
    and tri-directional (xD, with 2 < x ≤ 3), loaded along one principal axis of reinforcement.
    NOTE In most cases, ceramic matrix composites to be used at high temperature in
    air are coated with an antioxidation coating.
