abstract:
- language: en
  script: Latn
  content: 'ISO 20760-2:2017 provides guidelines for the management of centralized
    water reuse systems and water reuse applications in urban areas. ISO 20760-2:2017
    is applicable to practitioners and authorities who intend to implement management
    concepts, principles and supports on centralized water reuse in a safe, reliable
    and sustainable manner. ISO 20760-2:2017 addresses centralized water reuse systems
    in their entirety and is applicable to any water reclamation system component
    (e.g. source water, treatment, storage, distribution, operation and maintenance
    and monitoring). ISO 20760-2:2017 provides: - standard terms and definitions;
    - principles and methodology of reclaimed water management; - management issues
    in each system component of a centralized water reuse system; - specific aspects
    for consideration and emergency response. Monitoring parameters and regulatory
    values of a centralized water reuse system are out of the scope of this document.'
