abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1129:2008 specifies the application module for External properties.
    The following are within the scope of ISO/TS 10303-1129:2008: identification of
    a kind of property defined in a property library that is not structured according
    to ISO 13584-42; identification of a kind of property defined in a library structured
    according to ISO 13584-42; items within the scope of application module External
    library, ISO/TS 10303-1778; items within the scope of application module Identification
    assignment, ISO/TS 10303-1021; items within the scope of application module Independent
    property, ISO/TS 10303-1036; items within the scope of application module Plib
    class reference, ISO/TS 10303-1291.'
