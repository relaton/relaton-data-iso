abstract:
- language: en
  script: Latn
  content: This document specifies a method of determining the mass per unit area
    of hot dip galvanized coatings on ferrous materials. Since an exact knowledge
    of the area of the surface is essential, this document is mainly applicable to
    shapes whose areas are easy to determine. If, with heavy samples, the specifications
    of Clause 7 cannot be met, then the hot dip galvanized coating mass is determined
    by another method.
