abstract:
- language: en
  script: Latn
  content: ISO 8178-8:2015 specifies the parameters to be applied for the determination
    of which engine specifications can be included in an engine group and for the
    selection of the parent engine of the group. It can be applied for applications
    that might require modification or adjustment to suit at-site operating conditions.
    Such applications include stationary engines and engines for shipping.
