abstract:
- language: en
  script: Latn
  content: ISO 2808:2007 describes a number of methods that are applicable to the
    measurement of the thickness of coatings applied to a substrate. Methods for determining
    wet-film thickness, dry-film thickness and the film thickness of uncured powder
    layers are described. Reference is made to individual standards where these exist.
    Otherwise the method is described in detail. The standard also defines terms concerning
    the determination of film thickness.
