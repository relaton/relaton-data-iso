abstract:
- language: en
  script: Latn
  content: This technical specification identifies and clarifies lighting properties
    for digital building design and maintenance. This document provides all the needed
    properties to design and to describe lighting systems. These properties are intended
    to be used for mapping between data providers and requesters. The mapping of the
    identifiers enables the exchange of luminaire and sensing device data within different
    databases. The unambiguous mapping and description of properties improves the
    data quality, reduces misinterpretations and the processing time in digital environments.
    Therefore, the properties listed in this document establish the essential description
    of lighting systems in BIM systems and databases. The listed properties in this
    document are used to structure the product data sheet which is complemented with
    real product information.
