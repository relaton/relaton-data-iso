abstract:
- language: en
  script: Latn
  content: ISO 7170:2005 specifies test methods for determining the strength and durability
    of storage units that are fully assembled and ready for use, including their movable
    and non-movable parts. The tests consist of the application, to various parts
    of the unit, of loads, forces and velocities simulating normal functional use,
    as well as misuse, that might reasonably be expected to occur. The test results
    are only valid for the unit/component tested. These results may be used to represent
    the performance of production models provided that the tested model is representative
    of the production model. Tests carried out according to ISO 7170:2005 are intended
    to demonstrate the ability of the item to give satisfactory service in its intended
    environment. The tests have been developed for units/components that have not
    been in use. However, when properly justified, they may be used for fault investigation.
    Assessment of ageing and degradation is not included.
