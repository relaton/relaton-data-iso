abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for the parallel determination of glycidol
    together with 2-MCPD and 3-MCPD present in bound or free form in oils and fats.
    The method is based on alkaline-catalysed ester cleavage, transformation of the
    released glycidol into monobromopropanediol (MBPD) and derivatisation of the derived
    free diols (MCPD and MBPD) with phenylboronic acid (PBA). Though free MCPD and
    glycidol are supposed to be present in fats and oils in low to negligible quantities
    only, in the event that free analytes are present, they would contribute proportionately
    to the results. The results always being the sum of the free and the bound form
    of a single analyte. This method is applicable to solid and liquid fats and oils.
    This document can also apply to animal fats and used frying oils and fats, but
    a validation study is undertaken before the analysis of these matrices. Milk and
    milk products (or fat coming from milk and milk products) are excluded from the
    scope of this document.
