abstract:
- language: en
  script: Latn
  content: ISO 6106:2013 specifies a method for determining or checking the grain
    size of superabrasives (diamond or cubic boron nitride) as used for the manufacture
    of industrial products, such as grinding wheels and saws. It is applicable to
    the grain size designations defined. It describes the grain size designations,
    the size limits, the sieves for use in determining them and the procedure to be
    adopted for checking the grain size exclusive of any coating.
