abstract:
- language: en
  script: Latn
  content: This document specifies requirements for quantitative analysis of rare
    earth minerals’ elemental composition by electron probe microanalyzer, including
    the equipment and materials, specimen preparation, reference materials, analytical
    procedures (including qualitative analysis, selection of analytical conditions,
    peak overlap correction, etc.), processing of results and test report. This document
    is applicable for electron probe quantitative analysis of rare earth minerals
    stabilized under electron beam bombardment. This document is applicable for quantitative
    analysis with an electron probe, as well as for quantitative analysis with a scanning
    electron microscope equipped with a wavelength dispersive spectrometer (WDS).
