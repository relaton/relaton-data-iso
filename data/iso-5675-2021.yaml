abstract:
- language: en
  script: Latn
  content: This document specifies the essential interface dimensions and the operating
    requirements for hydraulic couplers employed to transmit hydraulic power from
    agricultural tractors to agricultural machinery. It is applicable to couplers
    used in hydraulic lines other than those used for braking circuits. NOTE      
    All hydraulic couplers are intended to be connected and disconnected frequently
    to allow the transfer of machinery from one tractor to another without the use
    of tools or special devices.
