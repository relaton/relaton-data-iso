abstract:
- language: en
  script: Latn
  content: This document establishes the vocabulary of industrial trucks. For the
    purposes of this document, industrial trucks are wheeled vehicles having at least
    three wheels with a powered or non-powered driving mechanism — except those running
    on rails — which are designed either to carry, tow, push, lift, stack or tier
    in racks any kind of load, and which are controlled either by an operator or by
    driverless automation.
