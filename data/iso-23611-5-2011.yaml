abstract:
- language: en
  script: Latn
  content: ISO 23611-5:2011 specifies a method for sampling, extracting and preserving
    macro-invertebrates from soils, including the litter zone. The proposed method
    is a prerequisite for using these animals as bio-indicators (e.g. to assess the
    quality of a soil as a habitat for organisms). The main premise of this method
    is rapid assessment (completing the sampling of a plot in one or two days with
    only basic equipment and a small number of field assistants), in order to be able
    to address all the taxonomic groups of soil macro-invertebrates at the same time
    and in the same place. The Tropical Soil Biology and Fertility (TSBF) method has
    evolved and some modifications have been introduced in order to use it in temperate
    regions. The sampling and extraction methods in ISO 23611-5:2011 are applicable
    to almost all types of soils, with the exception of soils in extreme climatic
    conditions (hard, frozen or flooded soils) and matrices other than soil, e.g.
    tree trunks, plants or lichens. Sampling design is specified in ISO 23611-6.
