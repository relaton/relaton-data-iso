abstract:
- language: en
  script: Latn
  content: ISO 4254-1:2013 specifies the safety requirements and the means of their
    verification for the design and construction of self-propelled ride-on machines,
    mounted, semi-mounted and trailed machines used in agriculture in order to deal
    with the hazards which are typical for most of the machines. In addition, it specifies
    the type of information on safe working practices including information about
    residual risks to be provided by the manufacturer. This document deals with significant
    hazards, hazardous situations and events relevant to this agricultural machinery
    when used as intended and under the conditions of misuse foreseeable by the manufacturer
    during normal operation and service. ISO 4254-1:2013 is not applicable to ? agricultural
    or forestry tractors, ? aircraft and air-cushion vehicles used in agriculture,
    ? lawn and garden equipment, ? machine-specific components or functions (e.g.
    working tools and/or processes). ISO 4254-1:2013 is not applicable to hazards
    related to periodic service, machine conversion and repairs intended to be carried
    out by professional service personnel, environmental hazards, road safety (e.g.
    steering, braking), or to the power take-off (PTO) drive shaft; neither is it
    applicable to guards of moving parts for power transmission except for strength
    requirements for guards and barriers. ISO 4254-1:2013 is not applicable to machines
    which are manufactured before the date of its publication. Not all of the hazards
    dealt with by ISO 4254-1:2013 are necessarily present on a particular machine.
    A risk assessment should be carried out by the manufacturer to determine the hazards
    that are applicable and any hazards in addition to those dealt with by this part
    or a relevant machine-specific part. The requirements of a machine-specific part
    of ISO 4254 take precedence over the requirements of this part.
