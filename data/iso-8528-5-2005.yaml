abstract:
- language: en
  script: Latn
  content: ISO 8528-5:2005 defines terms and specifies design and performance criteria
    arising out of the combination of a Reciprocating Internal Combustion (RIC) engine
    and an Alternating Current (a.c.) generator when operating as a unit. It applies
    to a.c. generating sets driven by RIC engines for land and marine use, excluding
    generating sets used on aircraft or to propel land vehicles and locomotives. For
    some specific applications (e.g. essential hospital supplies and high-rise buildings),
    supplementary requirements may be necessary. The provisions of ISO 8528-5:2005
    should be regarded as a basis for establishing any supplementary requirements.
    For generating sets driven by other reciprocating-type prime movers (e.g. steam
    engines), the provisions of ISO 8528-5:2005 should be used as a basis for establishing
    these requirements.
