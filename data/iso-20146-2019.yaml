abstract:
- language: en
  script: Latn
  content: This document defines terms related to capacitance diaphragm gauges (CDGs),
    specifies which parameters have to be given for CDGs, details their calibration
    procedure and describes which measurement uncertainties have to be considered
    when operating these gauges. This document complements ISO 3567 and ISO 27893
    when calibrating CDGs and using them as reference standards.
