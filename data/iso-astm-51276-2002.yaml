abstract:
- language: en
  script: Latn
  content: 'ISO/ASTM 51276:2002 covers procedures for using hermetically sealed polymethylmethacrylate
    (PMMA) dosimeters for measuring absorbed dose in materials irradiated by photons
    or electrons in terms of absorbed dose in water. This practice covers systems
    that permit absorbed dose measurements under the following conditions: absorbed
    dose range is 0,1 kGy to 100 kGy; absorbed dose rate is 1 × 10-2 to 1 × 107 Gy·s-1;
    radiation energy range for photons is 0,1 MeV to 50 MeV, and for electrons 3 MeV
    to 50 MeV;. irradiation temperature is - 78 °C to + 50 °C.'
