abstract:
- language: en
  script: Latn
  content: This document specifies methods for determining the ring creep properties
    for glass-reinforced thermosetting plastics (GRP) pipes. Properties include the
    creep factor and the long-term specific creep stiffness. Testing is performed
    under either wet (total immersion in water) or dry conditions. Dry creep testing
    is typically performed for the assessment and control of raw material consistency.
    Wet creep testing is typically undertaken to determine the long-term creep performance
    in simulated use conditions.
