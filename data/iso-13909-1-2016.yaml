abstract:
- language: en
  script: Latn
  content: ISO 13909-1:2016 defines the basic terms used in the sampling of solid
    mineral fuels, describes the general principles of sampling and details the information
    to be provided in the documentation and the sampling report. It also lists the
    other parts and gives guidance on the selection of the appropriate part. It does
    not include sampling of brown coals and lignites, or sampling from coal seams,
    for which guidance is given in ISO 14180. Manual sampling of coal and coke is
    covered in ISO 18283.
