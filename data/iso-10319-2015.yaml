abstract:
- language: en
  script: Latn
  content: ISO 10319:2015 describes an index test method for the determination of
    the tensile properties of geosynthetics (polymeric, glass, and metallic), using
    a wide-width strip. It is applicable to most geosynthetics, including woven geotextiles,
    nonwoven geotextiles, geocomposites, knitted geotextiles, geonets, geomats, and
    metallic products. It is also applicable to geogrids and similar open-structure
    geotextiles, but specimen dimensions might need to be altered. It is not applicable
    to polymeric or bituminous geosynthetic barriers, while it is applicable to clay
    geosynthetic barriers. ISO 10319:2015 specifies a tensile test method that covers
    the measurement of load elongation characteristics and includes procedures for
    the calculation of secant stiffness, maximum load per unit width and strain at
    maximum load. Singular points on the load-extension curve are also indicated.
    Procedures for measuring the tensile properties of both conditioned and wet specimens
    are included in ISO 10319:2015.
