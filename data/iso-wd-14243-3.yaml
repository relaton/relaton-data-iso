abstract:
- language: en
  script: Latn
  content: ISO 14243-3:2014 describes a test method that specifies flexion/extension
    relative angular movement between articulating components, the pattern of the
    applied force, speed and duration of testing, sample configuration and test environment
    to be used for the wear testing of total knee-joint prostheses in wear-testing
    machines having axial load control, flexion/extension angular motion control,
    AP displacement control and tibial rotation control. The kinematics of this part
    of ISO 14243-3:2014 may not be applicable to knee designs with a high degree of
    constraint, which could result in damage to the articulating components in the
    early stages of the test that would not be representative of clinical service.
