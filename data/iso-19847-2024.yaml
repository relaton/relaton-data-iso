abstract:
- language: en
  script: Latn
  content: This document specifies requirements for shipboard data servers that are
    used to collect data from other shipboard machinery and systems, and to further
    share the collected data in a safe and efficient manner. This document specifies
    communication protocols with reference to the data structure of ISO 19848. This
    document is intended for users and developers of shipboard data servers, as well
    as users and developers of systems that record data on, or retrieve data from,
    shipboard data servers.
