abstract:
- language: en
  script: Latn
  content: This document specifies, with reference to ISO 230-1, the geometric tests
    on numerically controlled (NC) broaching machines of normal accuracy, with vertical
    axis acting for cutting operation. The accuracy of rotary axes, if available,
    is checked with reference to ISO 230-7. This document also specifies, with reference
    to ISO 230-2, the positioning tests on vertical surface type broaching machines
    for both linear and rotary axes. This document proposes test pieces containing
    broached slots and grooves with reference to ISO 230-1, cutting tests under finishing
    conditions. It also specifies the characteristics and dimensions of the test pieces
    themselves. This document is intended to supply minimum requirements for assessing
    the cutting accuracy of the machine. This document also establishes the tolerances
    for the test results corresponding to general purpose and normal accuracy vertical
    surface type broaching machines equipped with numerical control. This document
    explains different concepts or configurations and common features of NC vertical
    surface type broaching machines which are normally used in the manufacturing of
    turbine disks. It also provides a terminology and designation of controlled axes
    with reference to ISO 841. This document deals only with the verification of the
    accuracy of the broaching machine. It does not apply to the operational testing
    of the machine (e.g. vibration, abnormal noise, stick-slip motion of components),
    nor to machine characteristics (e.g. speeds, feeds) as such checks are generally
    carried out before testing the accuracy.
