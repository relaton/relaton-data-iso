abstract:
- language: en
  script: Latn
  content: Focusing on the product carbon footprint quantification methods for upstream
    lithium raw materials, primarily battery-grade lithium carbonate, battery-grade
    lithium hydroxide, and battery-grade lithium chloride, while also applicable to
    lithium concentrate and lithium sulfate. It provides the scope definition, system
    boundary, functional unit, and carbon footprint allocation methods for main and
    by-products.
