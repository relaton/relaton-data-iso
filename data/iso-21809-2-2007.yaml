abstract:
- language: en
  script: Latn
  content: ISO 21809-2:2007 specifies the requirements for qualification, application,
    testing and handling of materials for plant application of single-layer fusion-bonded
    epoxy (FBE) coatings applied externally for the corrosion protection of bare steel
    pipe for use in pipeline transportation systems for the petroleum and natural
    gas industries as defined in ISO 13623. High-temperature coatings with a glass
    transition of above 120 °C or FBE primer coatings for three- or multi-layer polyethylene
    or polypropylene coatings are not covered by ISO 21809-2:2007. Pipes coated in
    accordance with ISO 21809-2:2007 are considered suitable for additional protection
    by means of cathodic protection.
