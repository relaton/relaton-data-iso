abstract:
- language: en
  script: Latn
  content: This document specifies a system framework for assessing the quality of
    2D graphics assets and 3D graphics models used in computer graphics, image processing,
    environmental data representation, digital twins, immersive media, learning, education
    and training environments, and related ICT integration systems. It specifies terms
    and definitions for 2D/3D graphics model quality assessment; assessment targets
    and quality dimensions applicable to 2D images, 3D polygonal models, point clouds,
    volumetric models, and hybrid graphics assets; a quality assessment workflow covering
    input characterization, assessment profile selection, metric computation, score
    aggregation, and reporting; quality characteristics and metric families for geometry,
    topology, appearance, function, interoperability, semantics, and metadata; functional
    components of a quality assessment system, including assessment profile management,
    metric execution, result reporting, traceability, and optional AI-assisted assessment;
    a learning, education and training (LET) use case and LET assessment profile (see
    Clause 10); and minimum information elements for recording and exchanging assessment
    results. For a profile declaring learning, education and training (LET) use, it
    also specifies instructional context, accessibility checks against declared functional
    needs and delivery conditions, and traceable resource metadata mappings using
    the LET terminology, metadata and accessibility models of the documents listed
    in Clause 2 of the attached draft. This document does not specify product-shape
    data quality representation models and application modules for industrial product
    data; dedicated 3D shape descriptor definitions and shape-similarity or fidelity
    metrics for industrial product data; phantom-based evaluation of 3D printing modelling
    software; codec-oriented media quality assessment methods or subjective image
    quality evaluation procedures; generic AI system quality models, AI data quality
    management frameworks, or AI risk management; additive manufacturing process parameters,
    file formats, or process quality management; a single mandatory scoring formula
    that is universally applicable to all sectors; certification schemes, regulatory
    approval criteria, or sector-specific acceptance thresholds; learning outcome
    measurement, curriculum or instructional design methodology, learner assessment,
    or competence certification of learners; or a particular AI model architecture,
    training dataset, or vendor implementation.
