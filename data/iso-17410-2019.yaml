abstract:
- language: en
  script: Latn
  content: This document specifies a horizontal method for the enumeration of psychrotrophic
    microorganisms that are able to grow and form colonies on a solid agar culture
    medium after aerobic incubation at 6,5 °C. This document is applicable to — products
    intended for human consumption, — products intended for animal feeding, — environmental
    samples in the area of food and feed production, handling, and — samples from
    the primary production stage. NOTE Annex B specifies a rapid method for the estimated
    enumeration of psychrotrophic microorganisms in raw and pasteurized milk.
