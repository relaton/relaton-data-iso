abstract:
- language: en
  script: Latn
  content: ISO 12122-3:2016 gives methods for the determination of characteristic
    values for a defined population of glued laminated timber products, calculated
    from test values. It presents methods for the determination of a) characteristic
    value of mean-based properties, and b) characteristic value of 5th percentile-based
    properties. NOTE Annex B gives information on the methods that have been successfully
    used to estimate the characteristic values of glued laminated timber products
    from properties of the laminates.
