abstract:
- language: en
  script: Latn
  content: The proposed work specifies the standardized method of representing, interpreting
    and exchanging the quality information of images used in biometric identification
    or verification technology using human vascular biometric images, gives the defect
    factors of the quality of vascular image and the classification of the quality
    of vascular image collected from different parts of the human body, gives guidelines
    for analysing the quality of vascular image, and gives the definition of unified
    quality score. The proposed work is applicable to the development and evaluation
    of vascular image quality algorithm.
