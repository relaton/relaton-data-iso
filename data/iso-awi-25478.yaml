abstract:
- language: en
  script: Latn
  content: This document establishes requirements for adventure tourism involving
    4x4 wheel drive, buggy, UTV, quadricycle and tricycle , relating to the operational
    safety of participants, leaders and assistants. This document applies to 4x4 wheel
    drive, buggy, UTV, quadricycle and tricycle that are offered as tourism products.
    Tourism product design involves a product planning and development phase that
    is not subject to this document. Some tourism products include 4x4 wheel drive,
    buggy, UTV, quadricycle and tricycle together with other tourism services (e.g.
    transfers, meals, lodging), but this document applies only to 4x4 wheel drive,
    buggy, UTV, quadricycle and tricycle , the additional tourism services being excluded
    from the scope. This document is applicable to any kind of adventure tourism activity
    provider that offers tourism products consisting of 4x4 wheel drive, buggy, UTV,
    quadricycle and tricycle.
