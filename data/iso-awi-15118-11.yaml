abstract:
- language: en
  script: Latn
  content: This document specifies conformance tests in the form of an abstract test
    suite (ATS) for a system under test (SUT) implementing an electric-vehicle or
    supply-equipment communication controller (EVCC or SECC) with support for wired
    Ethernet based high-level communication (HLC) according to ISO 15118-10. These
    conformance tests specify the testing of capabilities and behaviours of an SUT,
    as well as checking what is observed against the conformance requirements specified
    in ISO 15118-10 and against what the implementer states the SUT implementation's
    capabilities are. The capability tests within the ATS check that the observable
    capabilities of the SUT are in accordance with the static conformance requirements
    defined in ISO 15118-10
