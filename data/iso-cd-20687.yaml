abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements for rigid plastic safety
    glazing for use in earth-moving machinery, as defined in ISO 6165. The document
    also specifies the requirements needed for a front screen to withstand closeup
    detonations and falling or thrown objects. The enhanced windscreen arrangements
    can replace traditional front- or top guard solutions in steel. The document defines
    protection levels based on the achieved operator protection through various types
    of safety glazing. The document provides guidance on hazardous situations and
    what protection to use, and it gives guidance on marking, labelling and documentation.
    This document does not include fastening methods or gluing principles and do not
    cover the use of laminated glass.
