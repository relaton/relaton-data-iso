abstract:
- language: en
  script: Latn
  content: ISO 7368:2016 specifies only geometrical data relating to cavities in which
    two-port hydraulic slip-in cartridge valves are mounted in order to ensure interchangeability.
    NOTE For example, this document does not specify rated pressures. It applies to
    cavities for two-port hydraulic slip-in cartridge valves which are generally applicable
    to industrial equipment.
