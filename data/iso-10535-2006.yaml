abstract:
- language: en
  script: Latn
  content: 'ISO 10535:2006 specifies requirements and test methods only for hoists
    and body-support units intended for the transfer of disabled persons as classified
    in ISO 9999:2002: 12 36 03 Mobile hoists with sling seats12 36 04 Standing mobile
    hoists12 36 06 Mobile hoists with solid seats12 36 09 Hoist trolleys12 36 12 Stationary
    hoists fixed to the wall/walls, floor and/or ceiling12 36 15 Stationary hoists
    fixed to, mounted in or on another product12 36 18 Stationary free-standing hoists12
    36 21 Body-support units for hoists The requirements of ISO 10535:2006 are formulated
    with regard to the needs of both the disabled persons being hoisted and the attendant
    using the hoist.'
