abstract:
- language: en
  script: Latn
  content: ISO 9591:2004 specifies a method for the determination of resistance to
    stress corrosion cracking (SCC) of aluminium alloys. It covers the method of sampling,
    the types of specimens, the loading procedure, the type of environment and the
    interpretation of results. This International Standard is aimed at determining
    resistance to SCC as a function of the chemical composition, the method of manufacture
    and heat treatment of aluminium alloys. It applies to cast and wrought aluminium
    alloys in the form of castings, semi-finished products, parts and weldments. Since
    most natural and many artificial environments contain chlorides, ISO 9591:2004
    can be used to compare the performance of products employed under marine atmospheres
    and in environments containing chlorides, providing that the failure mechanism
    is not changed.
