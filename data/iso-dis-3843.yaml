abstract:
- language: en
  script: Latn
  content: This document specifies a test method for measuring the forces needed for
    the placement and removal of dental attachments (frictional retention elements
    of ball head-, snap-on, prefabricated telescopic and bar systems used for the
    attachment, support and stabilization of crowns and bridges, single attachments,
    removable partial dentures, complete dentures, and other superstructures on dental
    implant systems (including monopart implants)and, if not other justified, on natural
    teeth and root post copings). If not otherwise justified, this document can also
    be used for tests on custom-made or patient matched devices (e.g. laboratory manufactured).
    This test method is not applicable to retention devices for which normal placement
    and removal requires any off-axis rotation for the path of least resistance. This
    test method is not applicable to dental magnetic attachments, these are specified
    in ISO 13017.
