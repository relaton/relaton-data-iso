abstract:
- language: en
  script: Latn
  content: 'This document specifies the operation and maintenance requirements of
    marine cranes, including electro-hydraulic cylinder luffing cranes, electro-hydraulic
    wire rope luffing cranes and electric wire rope luffing cranes. This document
    is applicable to the following types of marine cranes operating in harbour or
    sheltered water conditions: — deck cranes mounted on ships for handling equipment,
    cargo or containers in harbour or sheltered water conditions; — floating cranes
    mounted on barges or pontoons for handling loads in harbour or sheltered water
    conditions; — grab cranes mounted on ships, barges or pontoons for operating in
    harbour or sheltered water conditions; — engine room, stores cranes, etc. mounted
    on ships for handling equipment and stores in harbour or sheltered water conditions.
    For other marine cranes not covered by the above descriptions or for other environmental
    conditions this document can be referred.'
