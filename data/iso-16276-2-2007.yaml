abstract:
- language: en
  script: Latn
  content: ISO 16276-2:2007 specifies procedures for rating the resistance of coating
    systems when a cut in the form of a right-angle lattice pattern (cross-cut) or
    in the form of an X (X-cut) is made into the coating, penetrating through to the
    substrate. It also specifies suitable equipment and defines inspection areas,
    sampling plans and acceptance/rejection criteria. It does not specify ratings
    for particular coating systems.
