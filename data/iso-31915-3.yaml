abstract:
- language: en
  script: Latn
  content: This document deals with whole body vibration as a significant hazard.
    It also specifies the methods for determining the vibration emission transmitted
    to the whole body of drivers standing and/or seated on freely moveable GSE, when
    driving for purposes of type evaluation, declaration and methods of verifying
    vibration emission. The test results are not applicable to the determination of
    whole body vibration exposure of persons.
