abstract:
- language: en
  script: Latn
  content: This document describes the determination of the residue (ash content)
    on ignition of paper, board, pulps and cellulose nanomaterials. This document
    is applicable to all types of paper, board, pulp and cellulose nanomaterial. This
    document provides measurement procedures to obtain a measurement precision of
    0,01 % or better for residue (ash content) on ignition at 900 °C. In the context
    of this document, the term "cellulose nanomaterial" refers specifically to cellulose
    nano-object (see 3.2 to 3.4). Owing to their nanoscale dimensions, these cellulose
    nano-objects can have intrinsic properties, behaviours or functionalities that
    are distinct from those associated with paper, board and pulps.
