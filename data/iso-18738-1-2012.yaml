abstract:
- language: en
  script: Latn
  content: This part of ISO 18738 specifies requirements and methodology for the measurement
    and reporting of lift ride quality during lift motion. It does not specify acceptable
    or unacceptable ride quality. NOTE Lift performance parameters are often referenced
    in conjunction with lift ride quality. Parameters relevant to lift performance
    include jerk and acceleration. This part of ISO 18738 defines and uses performance
    parameters where they are integral to the evaluation of ride quality.
