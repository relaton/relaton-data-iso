abstract:
- language: en
  script: Latn
  content: 'This international standard specifies the maximum allowable values of
    the consumption current, energy consumption grade, test methods and energy consumption
    grade marking of analogue quartz clocks (hereinafter referred to as “the quartz
    clock”). This international standard is applicable to the quartz clock with a
    crystal frequency of 32 768 Hz and a nominal working voltage of DC 1.50 V. Quartz
    clock movements may also refer to it. This international standard does not include
    the current consumed by the additional functions of the quartz clock. This international
    standard is not applicable to the following quartz clocks: — Clocks for specific
    use on aircraft, ships, cars and other equipment; — Clocks for equipping other
    products; — Clocks using radio wave signals as clock source, such as radio-controlled
    clocks and Bluetooth clocks, etc.'
