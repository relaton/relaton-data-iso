abstract:
- language: en
  script: Latn
  content: ISO 21968:2005 describes a method of using phase-sensitive eddy-current
    instruments for non-destructive measurements of the thickness of non-magnetic
    metallic coatings on metallic and non-metallic basis materials such as zinc, cadmium,
    copper, tin or chromium on steel, as well as copper or silver on composite materials.
    The phase-sensitive method can be applied without thickness errors to smaller
    surface areas and to stronger surface curvatures than the amplitude-sensitive
    eddy-current method described in ISO 2360, and is less affected by the magnetic
    properties of the basis material. However, the phase-sensitive method is more
    affected by the electrical properties of the coating materials.
