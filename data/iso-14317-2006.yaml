abstract:
- language: en
  script: Latn
  content: ISO 14317:2006 specifies a method for the determination of the compressive
    yield strength of sintered metal materials, excluding hardmetals. This method
    is applicable to sintered materials, excluding hardmetals, that may or may not
    have been subjected to heat treatment after sintering, and also to materials that
    have been sized or coined after sintering.
