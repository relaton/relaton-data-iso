abstract:
- language: en
  script: Latn
  content: Specifies symbols for proofreading such as of manuscripts, typescripts
    and printer's proofs. Does not apply to symbols of graphic art such as used in
    photo-engraving plants. Symbols for the correction of mathematical texts and colours
    illustrations are excluded. The total number of symbols specified is 16, each
    in English, French and Russian.
