abstract:
- language: en
  script: Latn
  content: ISO 24431:2016 specifies the inspection requirements at the time of filling,
    and applies to seamless or welded transportable gas cylinders made of steel or
    aluminium-alloy (Type 1), and for composite transportable gas cylinders (Types
    2 to 5 inclusive) for liquefied or compressed gases of a water capacity up to
    150 l. It may be applicable to cylinders and tubes with a water capacity between
    150 l and 450 l, provided they are inspected and filled as individual cylinders
    and tubes. ISO 24431:2016 does not apply to acetylene cylinders, bundles of cylinders,
    tubes, multiple-element gas container (MEGCs) or battery vehicles. ISO 24431:2016
    may also be applicable to LPG. For specific LPG applications, refer to ISO 10691.
    For cylinders manifolded in bundles, refer to ISO 11755.
