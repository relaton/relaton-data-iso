abstract:
- language: en
  script: Latn
  content: This document specifies test methods for measuring the performance of electrically powered household and similar air cleaners intended for the reduction of gas-phase pollutants. This document is intended for measuring the reduction of the concentration of specific gas-phase pollutants. This does not necessarily correlate with the reduction of odour intensity in the case of odorous gas-phase pollutants. Such a reduction can only be tested by olfactory tests, which are not part of this document.
