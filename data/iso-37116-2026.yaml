abstract:
- language: en
  script: Latn
  content: This document provides organizations seeking or providing finance with
    principles and general requirements for financing ex-ante investment in risk reduction,
    including disaster preparedness, in cities and communities (hereinafter the financing
    is referred to as “ex-ante DRR finance”). This document also provides principles
    and general requirements for the ex-ante DRR finance related to projects, assets
    and activities. This document contains requirements that can be used to assess
    conformity of projects, assets or activities, and organization’s ability, to this
    document. This document is intended to be used by all types and sizes of organizations
    in cities and communities. NOTE            The ex-ante DRR finance under this
    document is debt instruments. It does not include insurance or risk transfer instruments.
    This document can also be utilized with insurance or risk transfer instruments,
    equity instruments, grants, or any other financial instruments.
