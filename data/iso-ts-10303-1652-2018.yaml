abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1652:2018-11 specifies the application module for Basic geometry.
    The following are within the scope of ISO/TS 10303-1652:2018-11: geometric primitives;
    EXAMPLE 1   Points, lines, and planes are used to construct more complex geometry
    that represents the shape of products and features of products. EXAMPLE 2   Points,
    lines, and planes can represent the derived centers of ideal symmetric features
    of size found in product definitions. EXAMPLE 3   Points, curves, and surfaces
    can represent the derived centers of imperfect features of size measured on real
    workpieces. geometry used in the construction of two-dimensional and three-dimensional
    shape representations; items within the scope of application module Elemental
    geometric shape, ISO/TS 10303-1004.'
