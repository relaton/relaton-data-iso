abstract:
- language: en
  script: Latn
  content: This document specifies dimensional characteristics, deviation limits from
    nominal values, and tolerance values to define the interface (except chamfers)
    of thrust rolling bearings. Nominal boundary dimensions are defined in ISO 104[1].
    This document is not applicable to certain thrust bearings (e.g. thrust needle
    roller bearings) or for particular fields of application (e.g. special thrust
    precision bearings). Tolerances for such bearings are given in the relevant International
    Standards. Chamfer dimension limits are given in ISO 582[3].
