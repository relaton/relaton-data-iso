abstract:
- language: en
  script: Latn
  content: Specification of dimensions and requirements for types of transfusions
    bottles for medical use in order to ensure functional interchangeability of the
    equipment. The specifications relate also to the quality and performance of materials
    used in transfusion equipment. A second aim of this standard is the unified presentation
    of terms and designations for such equipment. This second edition of the standard
    constitutes a minor revision of the 1986 first one.
