abstract:
- language: en
  script: Latn
  content: This International Standard specifies the terms and definition, classification
    and the basic requirements of jasmine tea which is manufactured by blending tea
    and fresh jasmine flowers for consumption as a beverage and the chemical requirements
    for jasmine tea that are used to indicate that jasmine tea have been produced
    in accordance with good production practices. This International Standard also
    specifies the packing and marking requirements for jasmine tea in containers.
    This International Standard is applicable for fresh jasmine flowers scenting green
    teas. This International Standard is not applicable to scented green teas with
    flowers apart from jasmine flowers, and flavored with essential oils of jasmine
    flowers.
