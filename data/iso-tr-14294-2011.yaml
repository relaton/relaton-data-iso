abstract:
- language: en
  script: Latn
  content: 'ISO/TR 14294:2011 provides general considerations for the assessment of
    dermal exposure in workplaces. It offers guidance on dermal exposure assessment
    and the commonly used approaches for measuring dermal exposure. An understanding
    of the advantages and limitations of each approach assists in the selection of
    the appropriate method(s) to meet the assessment objective. ISO/TR 14294:2011,
    however, is not intended to provide expert guidance, such as in the case of exposure
    scenarios or chemical agents. ISO/TR 14294:2011 is intended to assist occupational
    hygiene practitioners and researchers in developing a dermal exposure assessment
    strategy in agreement with its intended purpose. More importantly, it promotes
    adaptation of a consistent approach to assessing dermal exposure, and provides
    a framework for the assessment and validation of method performance. ISO/TR 14294:2011
    describes the requirements against which sampling methods for determining dermal
    exposure need to be assessed; methodologies and specifications are proposed for
    the following procedures (not all requirements may be applicable to all methods):
    a) sampling efficiency; b) recovery efficiency; c) sample stability; d) capacity;
    e) bias, precision, uncertainty; f) core information; g) contextual information.'
