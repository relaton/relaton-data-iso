abstract:
- language: en
  script: Latn
  content: ISO 8312:2015 defines stearic acid (including blends of stearic and palmitic
    acid) for use as a compounding ingredient in the rubber industry and specifies
    the test methods for describing its properties. Classification of stearic acid
    and stearic acid/palmitic acid blends according to iodine value and typical chemical
    and physical properties for such materials for use in the rubber industry are
    given in Annex L. Annex L is given for information only. In this International
    Standard, the atomic absorption spectrometric method is the preferred method.
