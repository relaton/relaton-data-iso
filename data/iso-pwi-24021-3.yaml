abstract:
- language: en
  script: Latn
  content: This document defines terms and vocabulary related to the aerosol cans
    and establishes a classification for aerosol cans. This document is applicable
    to non-refillable rigid containers that can withstand predetermined deformation
    pressure and burst pressure, and contain aerosols and sprays and other products.
    The rigid containers are used in daily-used chemical, food, pharmaceutical and
    other fields and are made of tinplate or chrome plated sheet steel, coated iron,
    aluminum alloy and other materials with a nominal wall thickness no more than
    0,49 mm and volume no more than 1 000 mL.
