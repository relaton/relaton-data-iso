abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for a series of compact steel
    gate, globe and check valves for petroleum and natural gas industry applications.
    It is applicable to valves of: — nominal sizes DN 8, 10, 15, 20, 25, 32, 40, 50,
    65, 80 and 100, — corresponding to nominal pipe sizes NPS ¼, ⅜, ½, , 1, 1¼, 1½,
    2, 2½, 3 and 4, — pressure designations PN 16, 25, 40, 63, 100, 250 and 400, and
    — pressure designations Class 150, 300, 600, 800, 1 500 and 2 500. Class 800 is
    not a listed class designation, but is an intermediate Class number widely used
    for socket welding and threaded end compact valves covered by this document. There
    is no equivalent PN designation. This document includes provisions for the following
    valve characteristics: — outside screw with rising stems (OS & Y): in sizes 8
    ≤ DN ≤ 100; — inside screw with rising stems (ISRS): in sizes 8 ≤ DN ≤ 65 with
    a pressure designation PN ≤ 100 or Class ≤ 800; — socket welding or threaded ends:
    in sizes 8 ≤ DN ≤ 65; — flanged or butt-welding ends excluding flanged end Class
    800; — bonnet joint construction that is bolted, welded or threaded with seal
    weld; — bonnet joint construction that uses a union nut with a pressure designation
    PN ≤ 45 or Class ≤ 800; — body seat openings; — materials: as specified; — testing
    and inspection. This document covers valve end flanges in accordance with EN 1092-1
    and ASME B16.5 and valve body ends having tapered pipe threads in accordance with
    ISO 7-1 or ASME B1.20.1. It is applicable to extended body construction in sizes
    15 ≤ DN ≤ 50 with pressure designations Class 800 and Class 1 500 and to bellows
    and bellows assembly construction adaptable to gate or globe valves in sizes 8
    ≤ DN ≤ 50. Also covered are requirements for bellows stem seal type testing.'
