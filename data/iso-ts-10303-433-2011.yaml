abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-433:2011-10 specifies the application module for AP233 systems
    engineering. The following are within the scope of ISO/TS 10303-433:2011-10: items
    within the scope of application module Decision support; items within the scope
    of application module Function based behaviour; items within the scope of application
    module Issue management; items within the scope of application module Organization
    structure; items within the scope of application module Product data management;
    items within the scope of application module Program management; items within
    the scope of application module Project breakdown; items within the scope of application
    module Project management; items within the scope of application module Requirement
    management; items within the scope of application module Risk management; items
    within the scope of application module Schedule; items within the scope of application
    module State based behaviour; items within the scope of application module System
    behaviour; items within the scope of application module System modelling; items
    within the scope of application module System structure; items within the scope
    of application module Work structure; analysis and analysis representation; trade
    studies with measures of effectiveness; verification and validation; facility
    to assign system modelling information to systems engineering data; facility to
    assign program management information to systems engineering data.'
