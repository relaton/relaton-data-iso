abstract:
- language: en
  script: Latn
  content: ISO 18095:2018 gives guidelines for the monitoring techniques to be considered
    when setting up a condition monitoring programme for power transformers and includes
    references to associated standards required in this process. It is intended to
    help in the implementation of a coherent condition monitoring and condition-based
    maintenance programme, such as described following ISO 17359. ISO 18095:2018 is
    applicable to single-phase alternating current power transformers of ≥ 1 kVA and
    three phase alternating current power transformers of ≥ 5 kVA.
