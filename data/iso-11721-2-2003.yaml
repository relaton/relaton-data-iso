abstract:
- language: en
  script: Latn
  content: ISO 11721-2:2003 describes a test procedure for identification of the long-term
    resistance of a rot-retardant finish against the attack of microorganisms in the
    soil. It permits a distinction to be made between rot-retardant finishes with
    no long-term resistance, with regular long-term resistance and with increased
    long-term resistance, in order to assess the suitability for use in the tropics.
    As the soil burial test is a biological process and the test soil not accurately
    defined, ISO 11721-2:2003 only covers the comparison of finished and unfinished
    specimens.
