abstract:
- language: en
  script: Latn
  content: ISO 16031-1 specifies the inside diameters, cross-sections, tolerances
    and size identification codes for inch O-rings used in aerospace fluid systems.
    The dimensions and high precision tolerances specified in ISO 16031-1 are suitable
    for nitrile and ethylene propylene materials intended for use in high pressure
    hydraulic fluid systems provided that suitable tooling be available.
