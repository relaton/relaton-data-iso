abstract:
- language: en
  script: Latn
  content: ISO 11121:2017 specifies minimum programme content requirements for training
    organizations for introductory scuba experiences in recreational scuba diving.
    Under no conditions are these requirements considered to be a standard for the
    training and qualification of scuba divers. ISO 11121:2017 applies to programmes
    that include participants being taken into an open water environment. It does
    not apply to programmes that are exclusively conducted in a confined water environment
    (e.g. swimming pools). ISO 11121:2017 also specifies the conditions under which
    this service is to be provided, which supplement the general requirements for
    recreational diving services specified in ISO 24803.
