abstract:
- language: en
  script: Latn
  content: ISO 17132:2007 describes a method of evaluating the flexibility and adhesion
    of an organic coating on a metallic substrate by observing the cracking or loss
    of adhesion when a coated test panel is bent. The method can be used to confirm
    whether paints, varnishes or related products meet a given test requirement in
    a pass/fail test, or to determine the minimum bending diameter at which cracking
    does not occur.
