abstract:
- language: en
  script: Latn
  content: ISO 10069-1:2008 specifies the dimensions, in millimetres, of elastomer
    pressure springs intended for use in press tools, and the diameters, in millimetres,
    of counterbores for these pressure springs. It also gives information concerning
    materials and their hardness, and specifies the designation of springs that are
    in accordance with its requirements, together with the marking of their packages.
    Examples of suitable applications are given in Annex A. Dimensions of accessories
    (spring collars and pilot pins) are specified in ISO 10069-2.
