abstract:
- language: en
  script: Latn
  content: ISO 11334-1:2007 specifies requirements and test methods for elbow crutches
    fully equipped with handgrip and tip. The methods specify testing of separation,
    static load capacity, fatigue and resistance to low temperature embrittlement.
    ISO 11334-1:2007 also gives the requirements relating to safety, ergonomics, performance,
    and information to be supplied by the manufacturer, including marking and labelling.
    The requirements and tests are based on every-day usage of elbow crutches when
    performing the through-swing gait, for a maximum user mass as specified by the
    manufacturer. ISO 11334-1:2007 is applicable to elbow crutches specified for a
    user mass of not less than 35 kg. Requirements and test methods for friction of
    rubber tips against the walking surface are dealt with separately.
