abstract:
- language: en
  script: Latn
  content: This part of ISO 11269 describes a method to assess the quality of an unknown
    soil and the soil habitat function by determining the emergence and early growth
    response of at least two terrestrial plant species compared to reference or standard
    control soils. It is applicable to soils of unknown quality, e.g. from contaminated
    sites, amended soils or soils after remediation.
