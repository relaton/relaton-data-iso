abstract:
- language: en
  script: Latn
  content: 'This document specifies a transport protocol and network layer services
    tailored to meet the requirements of LIN‑based vehicle network systems on local
    interconnect networks. The protocol specifies an unconfirmed communication. The
    LIN protocol supports the standardized service primitive interface as specified
    in ISO 14229-2. This document provides the transport protocol and network layer
    services to support different application layer implementations such as: —    
    normal communication messages, and —     diagnostic communication messages. The
    transport layer defines transportation of data that is contained in one or more
    frames. The transport layer messages are transported by diagnostic frames. A standardized
    API is specified for the transport layer. Use of the transport layer is targeting
    systems where diagnostics are performed on the backbone bus (e.g. CAN) and where
    the system builder wants to use the same diagnostic capabilities on the LIN sub-bus
    clusters. The messages are in fact identical to ones in ISO 15765-2 and the PDUs
    carrying the messages are very similar. The goals of the transport layer are:
    —     to have low load on commander node, —     to provide full (or a subset thereof)
    diagnostics directly on the responder nodes, and —     to target clusters built
    with powerful LIN nodes (not the mainstream low cost).'
