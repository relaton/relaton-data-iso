abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for supporting strategic intelligence
    within innovation management. It aims at addressing the following areas concerning
    strategic intelligence at strategic and operational levels: —    creating a strategic
    intelligence management strategy to support innovation in an organization; —   
    establishing strategic intelligence management in support of the innovation activities
    and initiatives within the innovation management system and the related innovation
    processes; —    applying strategic intelligence tools and methods in support of
    the innovation activities and initiatives within the innovation management system
    and the related innovation processes. Strategic intelligence is transversal and
    cross-sectorial by nature. It is not limited to innovation activities and can
    apply to all areas where knowledge is required for strategic decision-making and
    consequent actions. This document is not applicable to: —    certification; —   
    data protection.'
