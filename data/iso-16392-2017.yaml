abstract:
- language: en
  script: Latn
  content: ISO 16392:2017 describes a test method to measure the electrical resistance
    of pneumatic and solid tyres, under load, on a test rig. Static charges on a vehicle
    sometimes need to be dissipated by way of the tyre. Electrical resistance inversely
    measures the ability of the tyre to dissipate static charge from the vehicle.
    The method specifies procedures and equipment such that electrical resistance
    can be accurately determined for tyres with values up to 1012 Ω. Annex A specifies
    the limit values in ohms (Ω) for both dissipative and conductive tyres. Annex
    B specifies additional conditions for measurement on a vehicle. Annex C specifies
    simplified test conditions for production control routine.
