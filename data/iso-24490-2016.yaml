abstract:
- language: en
  script: Latn
  content: ISO 24490:2016 specifies the minimum requirements for the design, manufacture
    and testing of pumps for cryogenic service. ISO 24490:2016 is applicable to centrifugal
    pumps. However, it can be applied to other types of cryogenic pumps (e.g. reciprocating
    pumps), where applicable. This International Standard also gives guidance on the
    design of installations (see Annex A). It does not specify requirements for operation
    or maintenance. NOTE For cryogenic fluids, see ISO 21029‑1, ISO 20421‑1 and/or
    ISO 21009‑1.
