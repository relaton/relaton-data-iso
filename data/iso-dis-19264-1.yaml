abstract:
- language: en
  script: Latn
  content: This document describes a method for analysing imaging systems quality
    in the area of cultural heritage imaging. The method described analyses multiple
    imaging systems quality characteristics from a single image of a specified test
    target. The specification states which characteristics are measured, how they
    are measured, and how the results of the analysis need to be presented. This specification
    applies to scanners and digital cameras used for digitization of cultural heritage
    material. NOTE       This document addresses imaging of reflective originals,
    a future part two will address imaging of transparent originals.
