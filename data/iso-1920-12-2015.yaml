abstract:
- language: en
  script: Latn
  content: This procedure specified in ISO 1920-12:2015 is a method for evaluating
    the carbonation resistance of concrete using an accelerated carbonation test.
    After a period of preconditioning, the test is carried out under controlled exposure
    conditions using an increased level of carbon dioxide to which, the vertical sides
    of the specimen are exposed. The test results are not designated to set performance
    requirements but to compare the carbonation resistance of different concretes
    of the same strength class, which are used in the same environmental conditions.
