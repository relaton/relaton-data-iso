abstract:
- language: en
  script: Latn
  content: The scope of ISO/TR 17427-8:2015 is an informative document to identify
    potential critical liability issues that C-ITS service provision may introduce;
    to consider strategies for how to control, limit or mitigate such liability issues;
    and to give pointers, where appropriate, to standards deliverables existing that
    provide specifications for all or some of these aspects, and to limit the risk
    of exposure to the financial consequences of liability issues. The objective of
    ISO/TR 17427-8:2015 is to raise awareness of and consideration of such issues.
    This Technical Report does not provide specifications for solutions of these issues.
