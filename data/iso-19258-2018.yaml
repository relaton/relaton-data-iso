abstract:
- language: en
  script: Latn
  content: This document gives guidelines for the principles and main methods for
    the determination of background values for inorganic and organic substances in
    soils at a local/regional scale. The site scale is excluded. It gives guidelines
    for sampling and data processing strategies. It identifies methods for sampling
    and analysis. This document does not apply to the determination of background
    values for groundwater and sediments.
