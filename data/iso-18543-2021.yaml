abstract:
- language: en
  script: Latn
  content: This document specifies the accelerated ageing test and requirements for
    electrochromic glazings intended to either control direct or indirect solar transmission,
    or both. The electrochromic glazings can be assembled as insulating glass unit,
    laminated glass or combination of both. The test method described in this document
    is only applicable to chromogenic glazings that can be switched between different
    transmission states using an electrical stimulus. This test method is not applicable
    to other chromogenic glazings such as photochromic and thermochromic glazings,
    which do not respond to electrical stimulus. This test method is applicable to
    any electrochromic glazing fabricated for use in buildings such as in doors, windows,
    skylights, exterior wall systems and glazing exposed to solar radiation. The materials
    used for constructing the electrochromic glazing and for electrochromically changing
    its optical properties can be inorganic or organic materials.
