abstract:
- language: en
  script: Latn
  content: This document specifies general technical requirements of portable remote
    pilot station (RPS). Function requirements include flight control, emergency handling,
    monitoring and control, mission planning, data recording and processing, etc.
    Performance requirements cover processor speed, software boot time, communication
    distance, mean time between failure (MTBF), environmental adaptability, electromagnetic
    compatibility, etc. This document is applicable to the category of civil small
    and light UAS, which applies to maximum take-off mass (MTOM) level I through IV
    according to ISO 21895.
