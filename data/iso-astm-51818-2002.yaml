abstract:
- language: en
  script: Latn
  content: ISO/ASTM 51818 covers dosimetric procedures to be followed in order to
    determine the performance of low energy (300 keV or less) single-gap electron
    beam radiation processing facilities. Other practices and procedures related to
    facility characterization, product qualification and routine processing are also
    discussed. The electron energy range covered in this International Standard is
    from 80 keV to 300 keV. Such electron beams can be generated by single-gap self-contained
    thermal filament or plasma source accelerators.
