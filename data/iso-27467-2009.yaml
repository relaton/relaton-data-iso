abstract:
- language: en
  script: Latn
  content: ISO 27467:2008 specifies areas that it is important to study when analyzing
    potential criticality accidents. It is important that a criticality accident analysis
    be performed each time a criticality accident is considered credible, due either
    to criticality contingencies (double batching, procedural violations, etc.) or
    to the failure of safety provisions (effectiveness of neutron absorber reduced
    by fire, etc.). It is important that the criticality safety specialist be mindful
    that the process of evaluation developed in ISO 27467:2008 does not cater to the
    unforeseen, since any actually occurring criticality accident will probably result
    from a scenario not envisioned or from failure to comply with prevailing regulations.
    ISO 27467:2008 does not address detailed administrative measures, for which the
    responsibility lies with the public authorities, nor does it deal with criteria
    used to justify the accident criticality analysis of a nuclear facility. ISO 27467:2008
    does not apply to nuclear power plants.
