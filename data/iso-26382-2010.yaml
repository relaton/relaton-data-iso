abstract:
- language: en
  script: Latn
  content: ISO 26382:2010 describes the technical declarations for a cogeneration
    system (CGS) that simultaneously supplies electric power and heating and/or cooling,
    for planning, evaluation and procurement. It applies to the identification of
    investigation items for project evaluation, CGS evaluation, and primary information
    works for CGS procurement. It also specifies necessary check items in CGS planning,
    provides a procedure to obtain the satisfactory configuration of the CGS for each
    project, and includes a detailed process diagram of the key development steps.
