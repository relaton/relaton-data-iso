abstract:
- language: en
  script: Latn
  content: 'This document provides the followings: CPS conceptual model and its specific
    characteristics – a conceptual model of cyber-physical systems (CPS) and its general
    features; – specific characteristics of CPS compared to other related concepts;
    Concerns and security frameworks – security concerns as the basis for the discussion
    of security risks and security controls for the CPS based on the conceptual model;
    – several security frameworks to address those security concerns; Practical use
    cases for CPS – use cases based on the respective security frameworks for CPS;
    – provision of visibility of use cases into the specific use of the security frameworks,
    etc. This document does not provide specific security controls needed in cyber-physical
    systems. This document applies to all sectors where CPS are or will be present,
    which encapsulate a diverse set of sectors ranging from industrial (e.g., manufacturing)
    to public (e.g., smart cities).CPS stakeholders such as users, developers, and
    operators can have a common understanding of CPS (e.g., concepts, risks, security
    framework) through this document.'
