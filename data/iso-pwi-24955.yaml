abstract:
- language: en
  script: Latn
  content: The main scope of this standard is the technical requirements for offshore
    steam injection boilers and auxiliary systems, mainly including the boiler body,
    boiler body auxiliary equipment such as boiler feed pump, boiler feed preheater,
    blower, dilatation, boiler safety protection system, etc. The boiler auxiliary
