abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for data exchange at the interface
    between earth-moving machinery, as defined in ISO 6165, mobile road construction
    machinery, as defined in ISO 22242, and the worksite information systems. It focuses
    on data for management of a worksite and the assets specific to that worksite.
    This document includes: a)       methods of local position correction and localization,
    including standardization of RTK corrections; b)       method of implementation
    of a common design model; c)        types of data and methods of data exchange
    between servers. This includes application programming interfaces (APIs) to exchange
    data between servers regardless of vendor. These APIs focus on project data, as-built
    data, and production data. Field-equipment-to-server and machine-to-machine are
    not included. This document covers both hardware mounted on earth-moving equipment
    and field measurement equipment. This document does not define methods of on-machine
    data collection, on-machine communication protocol (e.g. CAN bus), wireless transmission
    of data to the vendor’s server, or wireless transmission of data directly between
    machines onsite. This document also does not include design software requirements
    or other areas related to building information management (BIM). Data formats
    and transfer methods from design software to the SMS are not in scope.'
