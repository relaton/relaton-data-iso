abstract:
- language: en
  script: Latn
  content: ISO/TS 22391-7:2011 gives guidance on the assessment of conformity of products
    and assemblies in accordance with other applicable part(s) of ISO 22391 intended
    to be included in the manufacturer's quality plan as part of the quality management
    system and for the establishment of third-party certification procedures. In conjunction
    with the other parts, ISO/TS 22391-7:2011 is applicable to hot and cold water
    installations within buildings for the conveyance of water, whether or not intended
    for human consumption (domestic systems), under design pressures and temperatures
    appropriate to the class of application.
