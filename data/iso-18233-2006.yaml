abstract:
- language: en
  script: Latn
  content: ISO 18233:2006 gives guidelines and specifies requirements for the application
    of new methods for the measurement of the acoustic properties of buildings and
    building elements. Guidelines and requirements for selection of the excitation
    signal, signal processing and environmental control are given, together with requirements
    for linearity and time-invariance for the systems to be tested. ISO 18233:2006
    is applicable to such measurements as airborne sound insulation between rooms
    and of façades, measurement of reverberation time and other acoustic parameters
    of rooms, measurement of sound absorption in a reverberation room, and measurement
    of vibration level differences and loss factor. ISO 18233:2006 specifies methods
    to be used as substitutes for measurement methods specified in standards covering
    classical methods, such as ISO 140 (all parts), ISO 3382 (all parts) and ISO 17497-1.
