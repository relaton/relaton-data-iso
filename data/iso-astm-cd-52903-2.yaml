abstract:
- language: en
  script: Latn
  content: This document describes a method for defining requirements and assuring
    component integrity for plastic parts created using material extrusion based additive
    manufacturing processes. It relates to the process, equipment and operational
    parameters. Processes include all material extrusion based additive manufacturing
