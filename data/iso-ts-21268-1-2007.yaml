abstract:
- language: en
  script: Latn
  content: ISO/TS 21268-1:2007 specifies a test providing information on leaching
    of soil and soil materials under the experimental conditions specified hereafter,
    and particularly at a liquid to solid ratio of 2 l/kg dry matter. It applies to
    soil and soil material with a particle size less than or equal to 4 mm. ISO/TS
    21268-1:2007 has been developed to measure the release of inorganic and organic
    constituents from soil and soil material and the ecotoxicological effects of eluates
    with respect to micro-organisms, fauna and flora. The test is not suitable for
    constituents that are volatile under ambient conditions. For ecotoxicological
    testing, see ISO 15799. The test procedure specified in ISO/TS 21268-1:2007 produces
    eluates, which are subsequently characterised by existing physical, chemical and
    ecotoxicological standard methods. This procedure is not applicable to materials
    with a dry-matter-content ratio lower than 33 %. This test is mainly aimed at
    being used for routine and control purposes, and it cannot be used alone to describe
    all leaching properties of a soil. Additional leaching tests are needed for that
    extended goal. ISO/TS 21268-1:2007 does not address issues related to health and
    safety. It only determines the leaching properties.
