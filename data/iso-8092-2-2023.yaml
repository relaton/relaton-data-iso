abstract:
- language: en
  script: Latn
  content: This document provides terminology and specifies test methods for general
    performance requirements of voltage class A connectors used in electrical wiring
    harnesses on road vehicles. This document applies to connectors which, after mounting
    in the vehicle, are designed to only be disconnected in connection with repair
    and maintenance. This document does not apply to internal connections for electronic
    devices. This document does not apply to signal communication quality or data
    integrity.
