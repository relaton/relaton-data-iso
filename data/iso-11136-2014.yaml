abstract:
- language: en
  script: Latn
  content: ISO 11136:2014 describes approaches for measuring, within a controlled
    area, the degree to which consumers like or relatively like products. It uses
    tests based on collecting consumers' responses to questions, generally on paper
    or via a keyboard or a touch screen. Tests of a behavioural nature (such as recording
    quantities consumed ad libitum by the consumers) do not fall within the scope
    of ISO 11136:2014.
