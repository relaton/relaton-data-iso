abstract:
- language: en
  script: Latn
  content: ISO 11413:2008 specifies a method for the preparation of test pieces assembled
    from polyethylene (PE) pipes or spigot-ended fittings and electrofusion fittings
    (e.g. socket fittings such as couplers, or saddles). The assembly criteria specified
    include parameters such as ambient temperature, fusion conditions, fitting and
    pipe dimensions, pipe configuration (coiled or straight pipe), taking into account
    the limiting service conditions specified by the relevant product standards. ISO
    11413:2008 can apply to other shapes, e.g. re-rounded pipes, dependent on the
    manufacturer's instructions.
