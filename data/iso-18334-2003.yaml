abstract:
- language: en
  script: Latn
  content: ISO 18334:2003 gives guidance on the minimum quality criteria concerning
    the assembly of new wooden pallets. This includes component placement accuracy,
    fastener schedules and fastener placement, the clinching of fasteners and guidelines
    for the placement of component characteristics which limit their affect on pallet
    performance. ISO 18334:2003 does not address the safety problems, if any, associated
    with pallet assembly.
