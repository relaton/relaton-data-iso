abstract:
- language: en
  script: Latn
  content: The document investigates the establishment of a method to distinguish
    the species of origin of herbal medicines in the genetic aspect and to develop
    a genetic analysis method (DNA barcode). Species identification and classification
    through DNA analysis is a method of decoding an organism's genes to find similarities
    and specific parts. Through this, it is possible to 1) confirm the similarity
    between the species and origins of the herbs, 2) identify the nucleotide sequence
    that can distinguish the species, and 3) develop a species identification method
    based on this analysis.
