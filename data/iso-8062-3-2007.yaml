abstract:
- language: en
  script: Latn
  content: 'ISO 8062-3:2007 specifies general dimensional and geometrical tolerances,
    as well as machining allowance grades, for castings as delivered to the purchaser
    in accordance with ISO 8062-2. It is applicable for the tolerancing of dimensions
    and geometry, and required machining allowance of castings in all cast metals
    and their alloys produced by various casting manufacturing processes. ISO 8062-3:2007
    applies to both general dimensional and general geometrical tolerances, unless
    otherwise specified. The dimensional tolerances covered by ISO 8062-3:2007 are
    tolerances for linear dimensions. The geometrical tolerances covered by ISO 8062-3:2007
    are: tolerances for straightness, flatness, roundness, parallelism, perpendicularity,
    symmetry, and coaxiality. ISO 8062-3:2007 can be used for the selection of tolerance
    values for individual indications.'
