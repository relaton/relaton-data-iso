- language: en
  script: Latn
  content: ISO 12634 specifies the test procedure for determining the tack value of
    neat paste inks and vehicles which have low volatility and are unreactive under
    normal room conditions during the timespan required for testing. ISO 12634 contains
    a basic description of Inkometer® and Inkomat® (Geometry A) and TackOscope® and
    TackTester® (Geometry B).
