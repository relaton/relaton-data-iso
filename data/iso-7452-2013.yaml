abstract:
- language: en
  script: Latn
  content: 'ISO 7452:2013 specifies requirements for tolerances for hot-rolled steel
    plates made on a reversing mill with the following characteristics: nominal thickness:
    3 mm ≤ t ≤ 400 mm; nominal width: w ≥ 600 mm. ISO 7452:2013 does not apply to
    stainless steel. ISO 7452:2013 does not include continuous mill products, custom-made
    plate, checker plate or bulb plate for flooring or wide flats.'
