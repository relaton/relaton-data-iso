abstract:
- language: en
  script: Latn
  content: This document describes the procedure for the determination of the speed
    of sound in a fluid enclosed in a pipe, by measurements from pressure transducers
    mounted in the pipe. This document is applicable to all types of hydraulic circuit
    operating under steady state conditions, irrespective of size, for pressure pulsations
    over a frequency range from 10 Hz to 3 kHz.
