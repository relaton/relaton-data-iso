abstract:
- language: en
  script: Latn
  content: This document gives requirements and recommendations for non-destructive
    testing (NDT) training organizations, with the intention of harmonizing and maintaining
    the general standard of training of NDT personnel for industrial needs. It also
    establishes the minimum requirements for effective structured training of NDT
    personnel to ensure eligibility for qualification examinations leading to third-party
    certification according to recognized standards. NOTE ISO/TS 25107 gives requirements
    and recommendations for NDT training syllabuses intended for training.
