abstract:
- language: en
  script: Latn
  content: ISO 7507-2:2005 specifies a method for the calibration of tanks above eight
    metres in diameter with cylindrical courses that are substantially vertical. It
    provides a method for determining the volumetric quantity contained within a tank
    at gauged liquid levels. The optical (offset) measurements required to determine
    the circumferences can be taken internally or externally. The method specified
    in ISO 7507-2:2005 is suitable for tilted tanks with up to 3 % deviation from
    the vertical provided that a correction is applied for the measurement tilt, as
    described in ISO 7507-1. This method is an alternative to other methods such as
    strapping (ISO 7507-1) and the optical-triangulation method (ISO 7507-3).
