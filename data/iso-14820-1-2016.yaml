abstract:
- language: en
  script: Latn
  content: ISO 14820-1:2016 specifies sampling plans and methods of representative
    sampling of fertilizers and liming materials to obtain samples for physical and
    chemical analysis, from packages and containers up to and including 1 000 kg,
    from fluid products and from fertilizers in bulk provided the product is in motion.
    It is applicable to the sampling of lots of fertilizer or liming material supplied
    or ready for supply to third parties, as such, or in smaller lots, each of which
    would be subject to local, national or regional legislation. Where legislation
    so requires, samples are taken in accordance with this part of ISO 14820. NOTE
    The term "fertilizer" is used throughout the body of this document and is taken
    to include liming materials unless otherwise indicated. This part of ISO 14820
    does not cover complete, statistical sampling plans.
