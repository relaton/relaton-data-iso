abstract:
- language: en
  script: Latn
  content: This document applies to nuclear power plants with a double containment
    concept as shown in B.1.1, Figure B.1. This document applies to the inner containment
    of all kinds of reactor types. The containment vessel within this scope is made
    of reinforced or prestressed concrete and fitted with a steel liner, connected
    to the concrete using suitable steel connectors, where the liner-concrete system
    is treated as a load bearing composite structure. The containment vessel constitutes
    the load-bearing structural part of the reactor containment system but has also
    to ensure leaktightness using a steel liner. This document deals with the design
    of containment vessels, including all penetrations insofar as their function needs
    to be taken into account to enable the consequences of accidents to be controlled.
    Containment vessels need to be able to withstand the structural, dynamic and thermal
    loads (such as forces, internal and external excess pressures and temperatures)
    without exceeding the leakage rate on which their design is based. Procedures
    are made available to verify the leaktightness (liner integrity) and the bearing
    capacity of the concrete containment structure (structural integrity) using composite
    models. This document also applies to structural elements that affect the structural
    stability of the containment vessel.
