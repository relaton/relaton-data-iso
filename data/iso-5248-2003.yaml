abstract:
- language: en
  script: Latn
  content: 'This International Standard presents an illustrated vocabulary of the
    most common ancillary devices placed before, between and after dyeing and finishing
    machines. The terms thus defined are placed under the following headings: 1         
    Feeding of material 2          Guiding of material 3          Control of speed
    of material 4          Accumulation of material 5          Treatment of material
    6          Delivery of material 7          Transport of material NOTE   In addition
    to terms and definitions in the two official ISO languages (English and French),
    the equivalents are given in German, under the responsibility of the member body
    for Germany. However, only the terms and definitions given in the official languages
    are to be considered as ISO terms and definitions.'
