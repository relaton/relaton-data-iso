abstract:
- language: en
  script: Latn
  content: 'This standard identifies augmented mutual space representation that supports
    the efficient creation of shared spaces in remote AR(Augmented Reality), VR(Virtual
    Reality), and MR(Mixed Reality) collaboration scenarios, along with its purpose
    and use cases. The space representation forms a hierarchical graph structure in
    consideration of vertical and horizontal relationships between objects. This draft
    defines the components for augmented mutual space representation and the details
    of each type of relationship as edge data. The properties of edges are decided
    through semantic and geometric information of the objects in the input digital
    twin. This standard details the specific information about each object needed
    to construct node data, as well as how to construct it based on that information.
    Furthermore, this draft covers the system architecture and specific use cases
    that support the creation of collaborative spaces using the described spatial
    data. Various cases are presented that enable efficient spatial configuration
    and interaction in remote collaborative environments through this spatial data
    representation. Overall, this draft addresses the concepts, syntax, and semantics
    of augmented mutual space representation for AR/MR/XR remote collaboration. It
    specifies: - a data representation model for expressing indoor scene data, - the
    data types and classes that together constitute the data representation model,
    - an application program interface that supports the generation of remote collaboration
    space between dissimilar spaces, using the data representation model, and - examples
    of generating remote collaboration spaces through augmented mutual space representation
    between dissimilar spaces.'
