abstract:
- language: en
  script: Latn
  content: This document specifies a method of sampling precious metals and precious
    metal alloys for the determination of their precious metal content and for the
    assessment of their homogeneity. The document is applicable to raw materials,
    semi-finished products and finished products and is intended to be used only for
    the sampling of entirely metallic materials. NOTE 1   Standards for determination
    of precious metals contents for different metals are listed in the Bibliography.
    NOTE 2   For assaying techniques different from the listed ones other sampling
    procedures can be required. NOTE 3   For the purpose of production control or
    lot inspections the International Standards for the sampling indicated in the
    Bibliography or corresponding guidelines can be applied in addition.
