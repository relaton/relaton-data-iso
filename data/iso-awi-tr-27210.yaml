abstract:
- language: en
  script: Latn
  content: 'This Technical Report systematically reviews three mainstream air tightness
    test methods applicable to reusable flexible fabric bags for industrial live working
    tools used in power maintenance, including vacuum decay method, pressure decay
    method and bubble emission underwater test. It carries out quantitative analysis
    on the impact of various reclosable closures (zippers, hook-and-loop fasteners,
    drawstrings) and repeated open-close cycles on long-term sealing durability. The
    report identifies prominent standardization gaps in the current ISO/IEC/ASTM international
    standard system and puts forward tiered technical recommendations for subsequent
    standardization development. This document explicitly excludes the following contents:
    Air tightness testing for single-use sterile packaging specified in ISO 11607 series;
    Raw material gas permeability testing in accordance with ISO 15105-1 (only material
    performance, not finished bag integrity); Rigid and semi-rigid packaging containers
    made of plastic, metal or composite hard materials; Electrical insulation performance
    requirements of live working tools covered by IEC 60832; Independent temperature
    & humidity storage cabinets separated from fabric protective bags.'
