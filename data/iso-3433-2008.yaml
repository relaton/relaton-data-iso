  content: ISO 3433│IDF 222:2008 specifies the Van Gulik method for the determination
    of the fat content, as a mass fraction, of cheese. This method is applicable to
    all types of cheese. However, it may not give completely satisfactory results
    when applied to cheeses with an internal mould (blue-veined cheeses).
