abstract:
- language: en
  script: Latn
  content: This document specifies coupling between handpieces and motors that are
    connected to dental units. For the purposes of this document, the couplings described
    in this document are not equipped with electronic terminal(s). This document specifies
    the nominal dimensions, tolerances and extraction force of coupling systems for
    use between handpieces and motor which supply the handpiece with water, air and
    light and rotation energy.
