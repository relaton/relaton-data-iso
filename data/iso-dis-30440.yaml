abstract:
- language: en
  script: Latn
  content: 'The proposed standard would enable organizations to mitigate the human
    capital risks and capitalize on the opportunities of technology with guidance
    for its use and adoption for organizational leadership for: • changes to the nature
    of HR processes and practices; • eliminating or changing the nature of job roles;
    • technological change impacting the worker (e.g., surveillance, sensors, automation);
    and • technology impacts related to distress or anxiety among workers. Capturing
    and managing personal data is outside of scope of this proposed standard. This
    document is applicable to all organizations regardless of type, size, location,
    structure or purpose. This document does not include cyber security risks, data
    privacy, or the capture and management of personal data.'
