abstract:
- language: en
  script: Latn
  content: This document specifies the standardized access to repair and maintenance
    information (RMI) systems to provide repair and maintenance information for vehicles
    used in agriculture and forestry. It provides — general information and basic
    principles, — use case definitions (functional requirements), and — technical
    requirements as guidelines for manufacturers intending to establish such an information
    system. Annex A includes procedures to ensure the conformance of such information
    systems with the requirements specified by this document.
