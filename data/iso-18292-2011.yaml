abstract:
- language: en
  script: Latn
  content: ISO 18292:2011 specifies a procedure for calculation of the energy performance
    of fenestration systems used in residential buildings, for rating of fenestration
    systems, doors and skylights, including the effects of frame, sash, glazing, and
    shading components. ISO 18292:2011 specifies procedures for the calculation of
    the heating and cooling energy use in residential buildings, internal and external
    climatic conditions, and relevant building characteristics. These procedures can
    accommodate all climatic conditions and installation details. It is the responsibility
    of the appropriate regulatory authority to identify the clauses of ISO 18292:2011
    to be applied in their area of jurisdiction and the climatic data and reference
    building specification(s) to be used.
