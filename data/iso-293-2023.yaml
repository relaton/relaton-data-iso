abstract:
- language: en
  script: Latn
  content: This document specifies the general principles and the procedures to be
    followed with thermoplastics in the preparation of compression-moulded test specimens,
    and sheets from which test specimens can be machined or stamped. NOTE       In
    order to obtain mouldings in a reproducible state, the main steps of the procedure,
    including eight different cooling methods, are standardized. For each material,
    the required moulding temperature and cooling methods are given in the appropriate
    International Standard for the material or as agreed between the interested parties.
    This document is not applicable to reinforced thermoplastics.
