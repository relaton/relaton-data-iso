abstract:
- language: en
  script: Latn
  content: This document specifies three methods to determine the permeability to
    gas by measuring the volume of gas diffusing through a rubber or plastics hose
    or length of tubing used for gas applications in a specified time. —     Method 1
    is for determining the permeability of the complete hose wall or length of tubing
    wall, excluding end fittings, to the test gas. —     Method 2 is for determining
    the permeability at the hose and fitting interface to the test gas. —     Method 3
    is for precisely determining the permeability of the complete hose or length of
    tubing, including end fittings.
