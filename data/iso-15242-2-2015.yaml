abstract:
- language: en
  script: Latn
  content: ISO 15242-2:2015 specifies vibration measuring methods for single-row and
    double-row radial ball bearings, with a contact angle up to and including 45°.
    It covers radial ball bearings with cylindrical bore and outside surface, except
    bearings with filling slots and three- and four-point-contact ball bearings.
