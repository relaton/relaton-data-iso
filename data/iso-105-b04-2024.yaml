abstract:
- language: en
  script: Latn
  content: This document specifies a method intended for determining the effect on
    the colour of textiles of all kinds, except loose fibres, to the action of weather
    as determined by exposure to simulated weathering conditions in a test chamber
    equipped with a xenon arc lamp. This document focuses on textiles (such as apparel)
    where the main evaluation criterium is the colour fastness. This method can be
    used to determine if a textile is sensitive to the combined effect of light and
    water. NOTE 1        General information on colour fastness to light is given
    in Annex A. NOTE 2        ISO 105-B10 provides guidance on testing textiles or
    technical textiles, which are permanently exposed to an outdoor environment and/or
    require mechanical testing (such as tensile strength determination).
