abstract:
- language: en
  script: Latn
  content: This document provides a semantic base that allows the representation of relevant information related to tourism destinations, including resources and services within the destination, travel experiences, and the destination itself. It establishes the terminology, hierarchy, and the minimum properties and relationships required for the definition of a reference semantic structure, ensuring the interoperability of local, territorial and country tourism information technology (IT) platforms with third-party digital systems. This document provides tourism destinations with semantic data structures that primarily benefit final users (i.e. tourists and other interested parties), as these structures allow destinations to provide access to relevant information in an intuitive and agile way, and improve the interaction between tourists and the systems that manage, publish, carry transactions and accompany tourists during their journey. Furthermore, destination managers, data managers and data publishers, applying this document can also benefit from such implementation.
