abstract:
- language: en
  script: Latn
  content: This document specifies the equipment requirements, execution of and reporting
    on self-boring pressuremeter (SBP) tests. NOTE This document fulfils the requirements
    for self-boring pressuremeter test as part of the geotechnical investigation services
    according to EN 1997-1 and EN 1997-2. Tests with the self-boring pressuremeter
    cover the measurement in situ of the deformation of soils and weak rocks by the
    expansion and contraction of a cylindrical flexible membrane under pressure.
