abstract:
- language: en
  script: Latn
  content: 'ISO 12052:2017, within the field of health informatics, addresses the
    exchange of digital images and information related to the production and management
    of those images, between both medical imaging equipment and systems concerned
    with the management and communication of that information. ISO 12052:2017 facilitates
    interoperability of medical imaging equipment by specifying: - for network communications,
    a set of protocols to be followed by devices claiming conformance to this document;
    - the syntax and semantics of Commands and associated information which can be
    exchanged using these protocols; - for media communication, a set of media storage
    services to be followed by devices claiming conformance to this document, as well
    as a File Format and a medical directory structure to facilitate access to the
    images and related information stored on interchange media; - information that
    is to be supplied with an implementation for which conformance to this document
    is claimed. ISO 12052:2017 does not specify: - the implementation details of any
    features of the DICOM standard on a device claiming conformance; - the overall
    set of features and functions to be expected from a system implemented by integrating
    a group of devices each claiming conformance to this document; - a testing/validation
    procedure to assess an implementation''s conformance to this document. ISO 12052:2017
    pertains to the field of medical informatics. Within that field, it addresses
    the exchange of digital information between medical imaging equipment and other
    systems. Because such equipment may interoperate with other medical devices and
    information systems, the scope of this document needs to overlap with other areas
    of medical informatics. However, this document does not address the full breadth
    of this field. ISO 12052:2017 has been developed with an emphasis on diagnostic
    medical imaging as practiced in radiology, cardiology, pathology, dentistry, ophthalmology
    and related disciplines, and image-based therapies such as interventional radiology,
    radiotherapy and surgery. However, it is also applicable to a wide range of image
    and non-image related information exchanged in clinical, research, veterinary,
    and other medical environments. ISO 12052:2017 facilitates interoperability of
    systems claiming conformance in a multi-vendor environment, but does not, by itself,
    guarantee interoperability.'
