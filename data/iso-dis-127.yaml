abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the KOH number
    of natural rubber latex concentrate which is preserved wholly or in part with
    ammonia. The method is applicable to latices containing boric acid. The method
    is not applicable to latices preserved with potassium hydroxide. It is not necessarily
    suitable for latices from natural sources other than Hevea brasiliensis, or for
    latices of synthetic rubber, compounded latex, vulcanized latex or artificial
    dispersions of rubber.
