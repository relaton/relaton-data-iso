abstract:
- language: en
  script: Latn
  content: This international standard provides guidance and requirements regarding
    the methods for incorporating various Chain of Custody (CoC) models identified
    in ISO 22095, Chain of custody — General terminology and models into life cycle
    assessment (LCA) approaches identified in the ISO 14040 and 14044 standards. It
    also provides a protocol for LCA experts and includes terms, definitions, calculations,
    and methodologies that are necessary for properly implementing CoC into LCA. This
    standard is a complement to ISO 22095 and any additional guidance emerging from
    the series on CoC.
