abstract:
- language: en
  script: Latn
  content: 1.1 This International Standard specifies basic technical characteristics
    for the international exchange of analogue photographic sound test films intended
    for checking, adjusting and measuring motion-picture projector sound systems and
    sound reproducing channels of motion-picture installations for monophonic or stereophonic
    reproduction. 1.2 This International Standard specifies types and technical characteristics
    of test films made on 35 mm and 16 mm motion-picture films. 1.3 This International
    Standard includes test films intended for the checking, adjusting and measuring
    of a) focusing and azimuth of the scanning beam, b) scanning beam width and its
    position relative to the reference edge of the film, c) uniformity of the scanning
    beam illumination, d) level output balance of several motion-picture projectors,
    e) frequency response of the sound reproduction channel, and f) non-uniformity
    of film travel.
