abstract:
- language: en
  script: Latn
  content: ISO 9231|IDF 139:2008 specifies a method for the determination of the benzoic
    and sorbic acid contents in milk and milk products. The method is applicable to
    milk, dried milk, yogurt and other fermented milks, and cheese and processed cheese,
    and is suitable for measuring the contents of both compounds at levels of more
    than 5 mg/kg.
