abstract:
- language: en
  script: Latn
  content: 'This document specifies the implementation of a condition monitoring system
    for wind turbines, with particular focus on monitoring of the drivetrain. Guidance
    for a practical implementation of the FMSA is provided, as well as guidance for
    specifying best practices and minimum recommendations regarding the condition
    monitoring system used for failure mode detection, diagnostics and prognostics
    of the direct drive and geared wind turbine drivetrain, including: a) main bearing(s);
    b) gearbox, if applicable; and c) generator (mechanical aspects). This also includes
    subcomponents such as coupling and the lubrication system. This document provides
    an overview of the important aspects of condition monitoring of wind turbines
    and makes references to other standards where in-depth information on the subjects
    is available.'
