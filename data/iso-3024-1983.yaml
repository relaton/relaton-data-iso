abstract:
- language: en
  script: Latn
  content: This International Standard gives specifications for the Camera run length,
    Perforation Cut-out notch, and end-of-run notch in film supplied in - 8 mm type
    S model I motion-picture film Camera cartridges of 15 m (50 ft) and 60 m (200
    ft) nominal capacity; - and 8 mm type S model I Sound motion-picture film Camera
    cartridges of 15 m (50 ft) and 60 m (200 ft) nominal capacity. lt also gives specifications
    for the length of film returned to the customer. The purpose of this International
    Standard is to provide a uniform basis for the Operation of footage counters in
    cameras.
