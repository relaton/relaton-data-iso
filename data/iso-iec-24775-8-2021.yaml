abstract:
- language: en
  script: Latn
  content: This version of the specification models various details of the following
    objects of the media library for monitoring. Library Drives Changer Devices Slots
    IO Slots SCSI Interfaces and SCSI and FC Target Ports Physical Tapes Physical
    Package Magazines In general, a CIM client can monitor the health and status of
    the above objects as well as get alert, status change and lifecycle CIM indications.
    In addition, a client can control the movement of media in a library using this
    specification.
