abstract:
- language: en
  script: Latn
  content: This document gives requirements and guidance on the selection, accuracy,
    installation, commissioning, calibration and verification of automatic tank thermometers
    (ATTs) in fiscal/custody transfer applications. The ATT is used for measuring
    the temperature of petroleum and liquid petroleum products having a Reid vapour
    pressure less than 100 kPa, stored in atmospheric storage tanks. This document
    is not applicable to the measurement of temperature in caverns or in refrigerated
    storage tanks.
