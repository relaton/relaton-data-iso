abstract:
- language: en
  script: Latn
  content: This document establishes a framework to support stakeholders in supply
    and value chains to ensure the chain of trustworthiness regarding the properties
    of their products and production processes. This document provides guidelines
    to identify information relevant to trustworthiness to be exchanged between supply
    and value chain stakeholders. It also provides an interoperable data structure
    that is required for supply and value chain stakeholders to negotiate and exchange
    information relevant to trustworthiness. The guidelines set out in this document
    are generic and are intended to be applicable to all organizations and products,
    regardless of type, size or nature.
