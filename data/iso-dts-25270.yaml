abstract:
- language: en
  script: Latn
  content: 'A core terminology for Simulation Data Management (SDM) that can be used
    to define meta-data for engineering simulation. NOTE 1 An engineering simulation
    is carried out using simulation models of a system, product, phenomenon, or process
    to:  determine whether a design satisfies its technical requirements; or  predict
    operational behaviour. NOTE 2 Engineering simulation is often carried out for
    mechanical products such as automobiles or aircraft, and structures such as buildings
    and bridges. However, engineering simulation is broader and is used to investigate
    a wide range of processes such as:  simulations of battery charging and other
    electro-chemical or dynamic molecular processes;  manufacturing of consumer products,
    including processes such as forming and welding. The following are within the
    scope:  the terms used to describe an engineering simulation of discrete products
    and manufacturing processes; the properties, inputs and outputs of the engineering
    simulation;  the terms used to describe a simulation model, its properties, provenance
    and actual use;  the terms used to describe the maturity and appropriateness
    of a simulation model and simulation results for a possible use, including verification,
    validation and uncertainty quantification;  the terms used to describe the content
    of an engineering simulation data set, its properties, provenance and actual or
    possible use;  a mapping of these terms on to existing top level ontologies.
    The following are outside the scope:  simulations of distributed networks, such
    as electrical power networks;  simulation of process plants for the validation,
    optimisation and certification of operating scenarios;  system simulations for
    operator training.  comprehensive lists of terms that are specific to a single
    kind of engineering simulation, such as CFD or crack growth;  a format for the
    representation of meta-data; NOTE 3 Comprehensive lists of terms that are specific
    to a single kind of engineering simulation and a format for the representation
    of meta-data can be addressed by companion standards.'
