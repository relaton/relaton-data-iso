abstract:
- language: en
  script: Latn
  content: 'This standard includes: — Home-use quantitative tests (like tests of a
    washing powder or of a cooking process at the consumer’s home) — Tests in other
    usage situations that are not controlled (like tests in situ, for example in a
    bar, in a shop, in a public place, in transportation) — Tests in usage situations
    that are simulated in controlled conditions (like tests in reproduced situations
    with physical stimuli, virtual environments, etc. or tests in virtual reality
    (for example with VR goggles or in VR caves)) This standard is about consumer’s
    perception of a product’s sensory characteristics, functionality or performance
    as well as the consumer’s affective, emotional or perceptual response to a product
    and/or its packaging before, during or after its use or consumption. This general
    guidance applies to all types of products and/or packaging.'
