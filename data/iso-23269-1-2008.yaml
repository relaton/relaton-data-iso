abstract:
- language: en
  script: Latn
  content: ISO 23269-1:2008 provides performance specifications for emergency escape
    breathing devices (EEBD) required by regulation in Part D of chapter II-2 of the
    1974 International Convention for the Safety of Life at Sea (SOLAS), as amended
    in 2000, and chapter 3 of the IMO International Code for Fire Safety Systems (FSS
    Code). These devices are intended to supply air or oxygen needed to escape from
    accommodation and machinery spaces with a hazardous atmosphere. They are not intended
    for use in fighting fires, entering oxygen-deficient voids or tanks, or to be
    worn by fire-fighters.
