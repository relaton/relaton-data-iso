abstract:
- language: en
  script: Latn
  content: 'This document aims to specify a categorial structure in the field of pattern
    representation in traditional Chinese medicine (TCM) by defining a set of domain
    constraints for use within terminological resources. It contains a concept detailing
    the domains of five subcategories: principle, causative agent, function, body
    part, and pathological process. This document does not include: — a comprehensive
    categorial structure for TCM; — a treatment procedure for TCM; — relevant devices;
    — decoction patterns; — terms or descriptions for subcategories of principle,
    causative agent, function, body part, or pathological process.'
