abstract:
- language: en
  script: Latn
  content: This document specifies a determination procedure of energy resolution
    in the scanning transmission electron microscope or the transmission electron
    microscope equipped with the electron energy loss (EEL) spectrometer. This document
    is applicable to both in-column type EEL spectrometer and post-column type EEL
    spectrometer. These EEL signal detecting systems are applicable to a parallel
    detecting system and a serial detecting system.
