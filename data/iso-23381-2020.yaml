abstract:
- language: en
  script: Latn
  content: This document specifies the test procedure for the determination of the
    salt out temperature (SOT), also known as the crystallization temperature (CT)
    of liquid (fluid) fertilizers, using an inexpensive and simple technique. This
    method might not be applicable to the binary and ternary fertilizers, especially
    with regards to the last crystal to disappear (LCTD). Some of these exceptions
    are discussed in the procedure (Clause 8).
