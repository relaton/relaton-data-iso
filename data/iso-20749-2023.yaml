abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and test methods for dental amalgam
    products supplied to the user in capsules, pre-dosed with dental amalgam alloy
    powder and dental mercury in quantities suitable for the creation of a single
    dental restoration. This document specifies the requirements and test methods
    for the capsule and the requirements for packaging and marking. This document
    is not applicable to other metallic materials in which an alloy powder reacts
    with an alloy that is liquid at ambient temperature to produce a solid metallic
    material intended for dental restoration. This document is restricted to dental
    amalgam products marketed in pre-capsulated form, alone. Other products intended
    for use in the production of dental amalgam restorations (dental amalgam alloy
    as a free-flowing powder supplied in bulk masses, dental amalgam alloy powder
    supplied as compressed tablets and dental mercury sachets) are described in ISO
    24234.
