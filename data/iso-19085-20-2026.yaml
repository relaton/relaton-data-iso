abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and measures for horizontal
    cutting cross-cut sawing machines with one saw unit (radial arm saws) with manual
    loading or unloading of the workpiece or both and capable of continuous production
    use, hereinafter referred to also as “machines”. The machines are designed to
    cut solid wood and material with similar physical characteristics to wood, as
    well as: aluminium profiles also filled or composed with plastic or foam or rubber
    based insulating materials; composite materials, with core consisting of, for
    example, polyurethane or mineral material, laminated with light alloy; polymer‐matrix
    composite materials and reinforced with thermoplastic or thermoset or elastomeric
    materials; fibreglass; composite bars made from the materials listed above. This
    document deals with all significant hazards, hazardous situations or hazardous
    events, listed in Annex A, relevant to the machines, when it is used as intended
    and under conditions of misuse which are reasonably foreseeable by the manufacturer.
    This document is also applicable to the other life cycle phases of the machines:
    transport, assembly, adjustment, maintenance, dismantling and scrapping. This
    document does not apply to: machines designed for cross cutting of logs; bmachines
    designed for either sawing or milling roof timber frames, or both; machines fitted
    with hydraulic braking systems; machines fitted with hydraulically powered machine
    actuators; machines fitted with power-operated workpiece positioning system; machines
    fitted with the facility for either milling (including trenching and grooving),
    sanding or drilling, or all; machines able to perform cuts parallel to the fence;
    machines intended for use in potentially explosive atmosphere; machines manufactured
    prior to the publication of this document.'
