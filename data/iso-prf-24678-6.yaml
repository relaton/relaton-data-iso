abstract:
- language: en
  script: Latn
  content: 'ISO 24678-6:2016 provides requirements to govern the application of explicit
    algebraic formula sets to the calculation of flashover-related phenomena. It is
    an implementation of the general requirements provided in ISO 16730‑1 for the
    case of fire dynamics calculations involving sets of explicit algebraic formulae.
    ISO 24678-6:2016 is arranged in the form of a template, where specific information
    relevant to algebraic flashover formulae are provided to satisfy the following
    types of general requirements: a) description of physical phenomena addressed
    by the calculation method; b) documentation of the calculation procedure and its
    scientific basis; c) limitations of the calculation method; d) input parameters
    for the calculation method; e) domain of applicability of the calculation method.'
