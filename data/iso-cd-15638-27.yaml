abstract:
- language: en
  script: Latn
  content: The ISO 15638 series (Parts 1 to 26) define the framework for online fleet
    management of regulated/unregulated commercial freight vehicles utilizing data
    communication between in-vehicle systems and an application service provider via
    an on-board communication unit interfacing with road monitoring infrastructure
    and roadside sensors. This document defines an unregulated service architecture
    framework for automated driving freight vehicle fleet operation status information
    collecting architecture. This statement does not preclude the regulated service
    where road authority requires such a function. The objective of this document
    is to provide an automated driving freight vehicle fleet operation information
    collecting service function or application for non-enforcement applications [and
    sometimes for regulated application services (RAS)]. This is intended for the
    safe and sustainable road transport management purposes of regulated commercial
    freight vehicle movements using automated vehicle monitoring system. This document
    is intended to reinforce vehicle efficient and safe operation for non-enforcement
    and other purposes by collecting automated driving fleet operation information
    of heavy vehicles. Collected information can also be used for other purposes such
    as road usage fee collection, and fleet management purposes which are outside
    of this document. This document covers only on automated driving operation status
    monitoring applications. The information exchange with other entities such as
    road usage fee payment purpose is outside of this document. This document defines
    the framework for automated driving fleet operation status information collecting
    for non-enforcement and the conceptual operation of the management purpose applications.
