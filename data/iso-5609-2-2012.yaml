- language: en
  script: Latn
  content: ISO 5609-2:2012 specifies the characteristics of tool holders for internal
    turning with cylindrical shank, style F, i.e. with reduced shank and cutting edge
    angle equal to 90°. These tool holders are primarily intended for indexable inserts
    made of hardmetal, ceramic of other cutting materials to be mounted by clamping
    and to be used for internal turning operations.
