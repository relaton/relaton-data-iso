abstract:
- language: en
  script: Latn
  content: 'This document specifies the abstract class of a media thing (MThing),
    which is a basic component to construct the Internet of media things. The MThing
    class contains the basic APIs to: —    discover other MThing(s) in the network;
    —    connect/disconnect MThing(s); —    support transactions (e.g. payments) using
    media tokens between MThings.'
