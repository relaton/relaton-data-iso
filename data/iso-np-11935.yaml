abstract:
- language: en
  script: Latn
  content: This international standard establishes the general test requirements for
    all the test work of liquid propellant launch vehicles at launch site. The specified
    basic test requirements at functional part, subsystem level and over-all LV system
    test can be used as the baseline for the test work of liquid propellant launch
    vehicles at launch site. This standard does not prescribe specific test methods
    and evaluation principles of test results. It is only used to guide various countries
    to establish test items and content for liquid propellant launch vehicles at launch
    site. This international standard is applicable to the pre-launch test and evaluation
    for liquid propellant launch vehicles at launch site. Solid propellant launch
    vehicles can use this standard as a reference.
