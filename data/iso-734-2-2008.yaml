abstract:
- language: en
  script: Latn
  content: ISO 734-2:2008 specifies an extraction method which may be used to assess
    the efficiency of a de-oiling process by comparing the oil content of the oilseed
    with the residual oil content of the corresponding extraction meals, pellets and
    expeller cakes. It is not applicable to disputed cases, for which ISO 734-1 is
    applicable. It is applicable to oilseed meals obtained from oilseeds by expelling
    or by extraction with a solvent, as well as to the pellets made from the residues.
