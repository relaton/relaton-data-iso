abstract:
- language: en
  script: Latn
  content: Specifies requirements for two types and five grades; suitable for use
    on portable and wheeled fire extinguishers, on wall-mounted fire hose reels and
    as booster hoses on five apparatus. The types differ according to the temperature
    of chemicals, the grade in dependence on the working pressure. Contains five tables
    with special details and three annexes for determination of cover and lining thickness.
