abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the viscosity
    number of dilute solutions of polyamides in certain specified solvents. The method
    is applicable to the polyamides designated PA 46, PA 6, PA 66, PA 69, PA 610,
    PA 612, PA 11, PA 12, PA 6T/66, PA 6I/6T, PA 6T/6I/66, PA 6T/6I, PA 6I/6T/66 and
    PA MXD6 as defined in ISO 16396-1, as well as to copolyamides, compounds of polyamides
    and other polyamides that are soluble in one of the specified solvents under the
    specified conditions. The method is not applicable to polyamides produced by anionic
    polymerization of lactams or produced with cross-linking agents; such polyamides
    are normally insoluble in the specified solvents. The viscosity number is determined
    by the general procedure specified in ISO 1628‑1, observing the particular conditions
    specified in this document.
