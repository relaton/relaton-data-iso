abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1601:2006 specifies the application module for Altered package.
    ISO/TS 10303-1601:2006 deals with the representation of the physical properties
    of a piece part that has had some preparation work done to it by the assembly
    manufacturer, which modifies the form or fit or material properties of the piece
    part from the condition as received by that manufacturer. The preparation is necessary
    to facilitate installation or support alternate mounting arrangements. The following
    are within the scope of ISO/TS 10303-1601:2006: representation of physical properties
    of a piece part and its modification;representation of modification of terminals.'
