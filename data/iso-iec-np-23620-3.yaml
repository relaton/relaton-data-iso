abstract:
- language: en
  script: Latn
  content: 'This document presents data modelling approaches and interfaces for virtual
    environments in VR/AR/MR systems integration. It defines semantic data processing
    interfaces that enable the creation and manipulation of semantic virtual environments
    composed of virtual objects and natural environment elements. Additionally, it
    specifies data interfaces for individual semantic objects, including classified
    properties, as well as properties of natural environments. This work will: • Define
    data modelling approaches and interfaces for specifying data structures and operations
    to generate and manage virtual environments composed of virtual objects including
    natural environmental properties. • Specify semantic virtual environments that
    enable access to individual objects and their functional and physical properties.
    • Classify and define virtual object properties for semantic information processing
    with virtual environments and enable efficient management and access. • Provide
    use case examples demonstrating data modelling and operations for virtual environments
    using the proposed interfaces Device hardware technologies for VR/AR/MR systems
    integration are excluded from this document.'
