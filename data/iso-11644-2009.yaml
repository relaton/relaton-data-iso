abstract:
- language: en
  script: Latn
  content: ISO 11644:2009 specifies a method for measuring the adhesion of the finish
    to leather or the adhesion between two adjacent layers of the finish. The method
    is valid for all finished leathers with a smooth surface that can be bonded to
    an adherent-plate without the adhesive penetrating into the finish. Preliminary
    experiments might be necessary to determine whether these conditions are met.
    This test method is valid for finished leathers with a finish-coat thickness of
    at least 15 µm.
