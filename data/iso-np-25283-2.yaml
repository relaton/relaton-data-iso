abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides guidance for the calculation and modelling of changes in ocean carbon pools, carbon stocks and carbon fluxes caused by ocean negative carbon emissions (ONCE) activities. It covers the determination of quantification objectives and intended uses; the establishment of spatial, temporal and process boundaries; the establishment of baseline scenarios; the identification of relevant carbon pools and carbon fluxes; data selection, processing and quality assessment; the calculation of carbon stocks, carbon fluxes and net carbon changes; model selection, development, calibration, validation and application; sensitivity and uncertainty assessment; quality control; and the reporting and retention of results and records. This document is applicable to scientific research, engineering assessment, implementation monitoring and effectiveness assessment of ONCE activities. It is also applicable to the quantification and modelling of ocean negative carbon emissions, ocean carbon sink enhancement, and changes in ocean carbon pools and carbon fluxes associated with maritime activities. This document does not specify the engineering design of specific ONCE technologies, the assessment of impacts on ecosystems and biodiversity, carbon credit eligibility criteria, carbon credit issuance or trading rules, or requirements for validation and verification bodies. It does not specify the calculation of greenhouse gas emissions from ship operations, transport chains, marine fuel life cycles, ship energy efficiency or port energy use.
