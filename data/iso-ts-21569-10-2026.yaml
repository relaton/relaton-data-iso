abstract:
- language: en
  script: Latn
  content: This document specifies procedures for the detection of a DNA sequence
    of a construct used to (genetically) enhance the growth of fish commonly found
    in aquaculture. The genetically modified AquAdvantage Atlantic salmon (Salmo salar)
    carries the construct expressing CS-GHc2 growth hormone and can be detected based
    on a real-time polymerase chain reaction (PCR) targeting either the border between
    the growth hormone coding sequence (CS-GHc2) of Oncorhynchus tshawytscha (Chinook
    salmon) and the antifreeze terminator (T-AFP) of (Macro-) Zoarces americanus (ocean
    pout), i.e. with the construct-specific method, or the border between the Atlantic
    salmon genomic DNA and the antifreeze promoter (P-AFP) of ocean pout, i.e. with
    the event-specific method. These methods can be applied to identify the genetically
    modified (GM) fish or for screening purposes. This document is applicable for
    the analysis of DNA extracted from foodstuffs. It can also be suitable for the
    analysis of DNA extracted from other products such as feedstuffs. The application
    of these methods requires the extraction of an adequate amount of amplifiable
    DNA from the relevant matrix.
