abstract:
- language: en
  script: Latn
  content: 'The Audit Data Collection ISO 21378:2019 defines the functional requirements
    for exchanging audit data in flat file tables. In line with the development of
    a subsequent new version of ISO 21378:2019, the study group ISO TC 295 SG1 proposes
    the definition of a development framework consisting of the following components:
    1.Developing a semantic data model; 2.Developing a logical/hierarchical data model
    based on the semantic data model; 3.Developing exchange formats based on the logical/hierarchical
    data model. This new work item proposal concerns the development of a semantic
    data model (which is part 1 of the framework).'
