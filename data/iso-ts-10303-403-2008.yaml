abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-403:2008 specifies the application module for AP203 configuration
    controlled 3D design of mechanical parts and assemblies. The following are within
    the scope of ISO/TS 10303-403:2008: products that are mechanical parts and assemblies;
    product definition data and configuration control data pertaining to the design
    phase of a product''s development; representation of an instance of a part in
    an assembly through its usage in a sub-assembly; three dimensional shape representations
    of a part that includes: geometrically and topologically bounded wireframe models;geometrically
    bounded surface models;topologically bounded solid models with facetted, elementary
    and advanced faces;non surface bounded solid models including constructive solid
    geometry, curve swept and other swept solids, thickened face solid; solids with
    construction history;topologically bounded manifold surface and subsurface and
    non manifold surface models;topologically bounded compound models; geometric validation
    properties to allow the translation of geometric shape representations (advanced
    boundary representation and faceted boundary representation solids) to be checked
    for quality; geometric and dimensional tolerances applied to geometric shape representations;
    materials and their composition of chemical substance; composite material structure
    and shape; catalogue data characterized by property value pairs; three dimensional
    presentation of product data: arranging geometric elements in layers and groups
    and assigning colours;presentation styles for points, curves, surfaces and sections,
    including hatching and tiling;saved views of particular camera positions and sections;textual
    annotation and notes applied to geometric elements;presentation of geometric and
    dimensional tolerances; technical drawings as two dimensional presentation of
    product data.'
