abstract:
- language: en
  script: Latn
  content: ISO 20488:2018 provides requirements and recommendations for the principles
    and methods for review administrators to apply in their collection, moderation
    and publication of online consumer reviews. ISO 20488:2018 is applicable to any
    organization that publishes consumer reviews online, including suppliers of products
    and services that collect reviews from their own customers, a third party contracted
    by the supplier, or an independent third party. It is recognized that the different
    processes related to the collection, moderation and publication can at various
    times be performed by different organizations. This document is applicable to
    reviews published online, collected by any methodology.
