abstract:
- language: en
  script: Latn
  content: ISO 230-1:2012 specifies methods for testing the accuracy of machine tools,
    operating either under no-load or under quasi-static conditions, by means of geometric
    and machining tests. The methods can also be applied to other types of industrial
    machines. It covers power-driven machines, which can be used for machining metal,
    wood, etc., by the removal of chips or swarf material or by plastic deformation.
    It does not cover power-driven portable hand tools. ISO 230-1:2012 relates to
    the testing of geometric accuracy. It is not applicable to the operational testing
    of the machine tool (vibrations, stick-slip motion of components, etc.) or to
    the checking of characteristics (speeds, feeds). It does not cover the geometric
    accuracy of high-speed machine motions where machining forces are typically smaller
    than acceleration forces.
