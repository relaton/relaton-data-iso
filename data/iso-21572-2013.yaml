abstract:
- language: en
  script: Latn
  content: ISO 21572:2013 provides general guidelines and performance criteria for
    methods for the detection and/or quantification of specific proteins or protein(s)
    of interest [POI(s)] in a specified matrix. These general guidelines address existing
    antibody based methods. Methods other than those described in Annex A or Annex
    B can also detect the POI. The same criteria as outlined in ISO 21572:2013 apply
    generally.
