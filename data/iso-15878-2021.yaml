abstract:
- language: en
  script: Latn
  content: This document establishes the content for commercial specifications for
    paver-finishers used in road construction and maintenance processes for the placement
    and pre-compaction of paving materials. It covers the machine and its components
    and establishes parameters for technical characteristics for both. This document
    does not cover commercial specifications for road wideners which can perform similarly
    to a paver-finisher under certain conditions.
