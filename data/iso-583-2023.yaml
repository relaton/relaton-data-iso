abstract:
- language: en
  script: Latn
  content: This document specifies test methods for the determination of total belt
    thickness and the thickness of constitutive elements of conveyor belts having
    a textile carcass. The constitutive elements include the covers, the carcass and
    interlayers, i.e. the material between adjoining plies. This document does not
    apply to light conveyor belts as described in ISO 21183‑1.
