abstract:
- language: en
  script: Latn
  content: This proposed standard specifies normative references, terms and definitions,
    rating requirements, rating methods and minimum data requirements for published
    ratings of sound and vibration of positive displacement refrigerant compressors.
    This standard applies to positive displacement refrigerant compressors and their
    presentation of rating in air-conditioning, heating, refrigeration, and dehumidification
    applications. Single stage, two-stage, and refrigerant-injected compressors without
    intermediate temperature load (only one evaporator) are included in this standard.
    Subcritical operation and transcritical operation are included in this standard.
