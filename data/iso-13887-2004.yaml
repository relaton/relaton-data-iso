abstract:
- language: en
  script: Latn
  content: ISO 13887:2004 establishes a system of testing for improved formability
    and strength of cold-reduced steel sheet in the seven grades listed in Table 1.
    It is suitable for applications where the surface of the sheet is of prime importance.
    This International Standard is not applicable to steels designated as commercial
    quality or drawing qualities (see ISO 3574), steels of structural quality (see
    ISO 4997) or steels of high tensile strength and low yield point with improved
    formability (see ISO 14590).
