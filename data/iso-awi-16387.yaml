abstract:
- language: en
  script: Latn
  content: This document specifies one of the methods for evaluating the habitat function
    of soils and determining effects of soil contaminants and substances on the reproduction
    of Enchytraeus sp. by dermal and alimentary uptake in a chronic test. It is applicable
    to soils and soil materials of unknown quality, for example, from contaminated
    sites, amended soils, soils after remediation, agricultural or other sites under
    concern and waste materials. This document provides information on how to use
    this method for testing substances under temperate conditions. The method is not
    applicable to substances, for which the air/soil partition coefficient is greater
    than 1, or to substances for which the vapour pressure exceeds 300 Pa at 25 °C.
    NOTE      No provision is made in the test method for monitoring the persistence
    of the substance under test.
