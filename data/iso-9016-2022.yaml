abstract:
- language: en
  script: Latn
  content: This document specifies the method to be used when describing test specimen
    location and notch orientation for the testing and reporting of impact tests on
    welded butt joints. This document applies to impact tests on metallic materials
    in all forms of product made by any fusion and pressure welding process. It is
    used in addition to the ISO 148 series and includes test specimen denomination
    and additional reporting requirements.
