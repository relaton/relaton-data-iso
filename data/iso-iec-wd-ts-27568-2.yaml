abstract:
- language: en
  script: Latn
  content: This document provides a guidance for organizations to address security
    and privacy risks in digital twin systems. The guidance in this document helps
    organizations identify security and privacy risks throughout the digital twin
    systems lifecycles system lifecycle, and establishes mechanisms to evaluate the
    consequences of such risks and treat risks them. This document is applicable to
    all types and sizes of organizations, including public and private companies,
    government entities, academia, research institutions and not-for- profit organizations,
    that develop or use digital twin systems.
