abstract:
- language: en
  script: Latn
  content: ISO 15548-3:2008 identifies the functional characteristics of a general-purpose
    eddy current system and provides methods for their measurement and verification.
    The evaluation of these characteristics permits a well-defined description and
    comparability of an eddy current equipment. By careful choice of the characteristics,
    a consistent and effective eddy current examination system can be designed for
    a specific application. Where accessories are used, these are characterised using
    the principles of ISO 15548-3:2008. ISO 15548-3:2008 does not give the extent
    of verification nor acceptance criteria for the characteristics. These are given
    in the application documents.
