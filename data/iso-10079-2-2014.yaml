abstract:
- language: en
  script: Latn
  content: ISO 10079-2:2014 specifies safety and performance requirements for medical,
    manually powered suction equipment intended for oro-pharyngeal suction. It covers
    equipment operated by foot or by hand or both. Annex C illustrates the three parts
    of ISO 10079 by providing a schematic for typical systems. ISO 10079-2:2014 has
    additional requirements for suction equipment intended for field use or transport
    use.
