abstract:
- language: en
  script: Latn
  content: 'This document specifies the concepts, reference architecture, functional
    architecture, functional elements, information models, and implementation guidelines
    for Cyber-Physically Controlled Smart Robotic Manufacturing (CPSRM). CPSRM provides
    a standardized architecture for AI-driven cyber-physical robotic manufacturing
    systems through the integration of robotic manufacturing systems, cyber-supporting
    systems, digital twins, manufacturing intelligence, and interoperable manufacturing
    information systems. Specifically, this document addresses: • Cyber-Physically
    Controlled Robotic Manufacturing (CPCR); • Cyber-Supporting Systems for Robotic
    Manufacturing (CSSR); • Monitoring, analysis, planning and execution for robotic
    manufacturing; • Behavior modeling and behavior orchestration for robotic manufacturing
    systems; • Coordination and collaboration among robotic manufacturing systems,
    shop-floor devices, and shop-floor control systems; • Interoperability and integration
    with manufacturing information systems; • Digital-twin-enabled robotic manufacturing
    systems; • Information and communication models for cyber-physical robotic manufacturing;
    • Implementation requirements and implementation use cases for robotic manufacturing
    systems. This document is applicable to robotic manufacturing systems including:
    • Subtractive manufacturing; • Additive manufacturing; • Hybrid manufacturing;
    • Assembly; • Inspection; • Material handling; • Logistics; • Autonomous robotic
    production systems; • Human-robot collaborative manufacturing systems. This document
    does not specify: • Robot mechanisms; • Robot programming languages; • Robot safety
    requirements; • Robot communication protocols; • Robot performance metrics; •
    Artificial intelligence algorithms. Instead, this document provides a cyber-physical
    manufacturing architecture and implementation framework that complements such
    standards and enables interoperable, intelligent, and autonomous robotic manufacturing
    systems.'
