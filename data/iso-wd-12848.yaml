abstract:
- language: en
  script: Latn
  content: The document imposes restrictions on mine hoists and mine winders in respect
    of physical performance and intended use. The document is applicable to electrically-powered
    or hydraulically-driven non explosion-proof and explosion-proof friction mine
    hoists, mine drum hoists, disc braking mine winders and block braking mine winders
    (hereinafter referred to as hoists and hoisting winders). The document is not
    applicable to band braking mine winders.
