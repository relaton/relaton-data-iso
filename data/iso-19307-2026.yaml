abstract:
- language: en
  script: Latn
  content: This document specifies the procedure for the measurement of a one-dimensional
    parameter approximating the translucency magnitude of flat materials that absorb
    and scatter light. This one-dimensional material property is called ‘translucency
    alpha’ and can be used in appearance-based 3D reproduction workflows ensuring
    accurate translucency. While the measurement conditions and virtual reference
    materials used to define translucency alpha are designed for 3D printing workflows,
    the use of translucency alpha is not limited to reproducing objects with additive
    manufacturing technologies.
