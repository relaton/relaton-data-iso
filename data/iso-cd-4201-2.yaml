abstract:
- language: en
  script: Latn
  content: This document specifies the selection of flame arresters and draws requirements
    for inspection and maintenance of oil and gas industries’ safety devices. The
    specific processes of oil and gas industries require individualized safety measures.
    The selection and location of flame arresters for specific application as well
    as the maintainability of operating conditions plays an essential role in the
    device efficiency. Flame arresters are devices to prevent explosion propagation
    through pipework and mitigate the consequences of their devastating effects. Oil
    and gas industries including low carbon energies widely use flame arresters as
    ultimate safety device. Flame arresters are passive safety barriers and thus bring
    the highest level of safety when tested and installed for its intended use (see
    ISO 4201-1).
