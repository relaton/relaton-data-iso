abstract:
- language: en
  script: Latn
  content: This document specifies the gas chromatographic (GC) method for the determination
    of saturated, olefinic and aromatic hydrocarbons in automotive motor gasoline,
    small engine petrol and ethanol (E85) automotive fuel. Additionally, the benzene
    and toluene content, oxygenated compounds and the total oxygen content can be
    determined. Although specifically developed for the analysis of automotive motor
    gasoline that contains oxygenates, this test method can also be applied to other
    hydrocarbon streams having similar boiling ranges, such as naphthas and reformates.
