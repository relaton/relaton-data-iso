abstract:
- language: en
  script: Latn
  content: This document provides information on recent discussions and changes in
    recommendations and guidance on environmental management within the cultural heritage
    field. Conservation research on preventive methodologies and passive control provided
    by specific construction methods and renovations, developments in technology for
    controlling the environment, and energy and climate change issues are included.
    This document is intended for archives and libraries and other institutions with
    large volumes of collections that are based on paper. Archives and libraries also
    have collections that include film, magnetic media, leather, and other organic,
    inorganic or composite materials. These institutions have a unique challenge of
    extending the lifespan of these materials for access and use in the present and
    for future generations. The environment plays a key role in extending the lifespan
    of all of these materials. This document is intended for use in preservation planning
    and ongoing environmental management of permanent storage conditions for archives
    and library collections and applies to all collections being permanently stored
    for an institution.
