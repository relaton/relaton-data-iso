abstract:
- language: en
  script: Latn
  content: This document defines the top-level semantic architecture of traditional
    Chinese medicine (TCM) informatics as a discipline. It establishes a unified framework
    for representing and organizing TCM knowledge – including theoretical concepts,
    diagnostic reasoning, treatment principles and related terminology – in a form
    understandable to both humans and computer systems. The framework incorporates
    a categorial structure to formalize the relationships among concepts and knowledge
    entities within TCM, providing the semantic basis for data interoperability, knowledge
    sharing, and computational reasoning. This document supports consistent exchange
    and integration of TCM information across clinical documentation, research databases,
    education systems and AI-driven decision-support applications.
