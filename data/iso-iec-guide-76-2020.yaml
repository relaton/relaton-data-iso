abstract:
- language: en
  script: Latn
  content: This document provides guidance on how to meet the needs of consumers in
    the development of service standards. This document can be used by anyone involved
    in the development of service standards and can be applied to any service. This
    document is relevant to the full range of services, whether or not a formal contract
    is entered into or purchase price paid. It also has relevance for public or charitable
    services, e.g. education, health and care provision, where a financial transaction
    has not necessarily taken place. This document relates to the provision of services
    and therefore does not include specific reference to management systems or professional
    competence requirements.
