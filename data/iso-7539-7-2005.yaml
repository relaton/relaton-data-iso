abstract:
- language: en
  script: Latn
  content: ISO 7539-7:2005 covers procedures for conducting slow strain rate tests
    for investigating susceptibility of a metal to stress corrosion cracking, including
    hydrogen-induced failure. The term "metal" as used in this part of ISO 7539 includes
    alloys. Slow strain rate tests are adaptable for testing a wide variety of product
    forms, including plate, rod, wire, sheet and tubes, as well as composites of these
    and parts joined by welding. Notched specimens may be used, as well as initially
    plain specimens. The principal advantage of the test is the rapidity with which
    susceptibility to stress corrosion cracking of a particular metal/environment
    combination can be assessed.
