abstract:
- language: en
  script: Latn
  content: This document establishes requirements and recommendations for the design
    format and data content of a drone or UAS remote pilot and remote crew licence,
    encompassing both visual human-readable features and machine-readable technologies.
    By establishing a common basis, this document aims to standardize drone or UAS
    remote pilot and remote crew licence without impeding the efforts of individual
    national or regional drone or UAS-related authorities. NOTE            Not all
    jurisdictions require drone or UAS remote pilot and remote crew licences.
