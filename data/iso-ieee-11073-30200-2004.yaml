abstract:
- language: en
  script: Latn
  content: ISO/IEEE 11073-30200:2004 describes an IrDA-based, cable-connected local
    area network (LAN) for the interconnection of computers and medical devices and
    is suitable for new device designs, but is particularly targeted to modifications
    of legacy devices. The term legacy devices refers to equipment that is already
    in use in clinical facilities;in active production at the facilities of medical
    device manufacturers;beyond the initial stages of engineering development.
