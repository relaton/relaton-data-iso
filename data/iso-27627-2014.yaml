abstract:
- language: en
  script: Latn
  content: ISO 27627:2014 specifies the technical delivery condition, manufacturing
    process, material requirements, configuration and dimensions, and verification
    and inspection procedures for aluminium alloy drill pipes manufactured in accordance
    with ISO 15546. ISO 27627:2014 also specifies the gauging procedure for taper
    buttress thread (right and left) and adjoining tapered stabilizing shoulders (bores)
    made of aluminium alloy drill pipes and related steel tool joints.
