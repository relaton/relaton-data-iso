abstract:
- language: en
  script: Latn
  content: 'ISO/TS 15876-7:2003 gives guidance for the assessment of conformity to
    be included in the manufacturer''s quality plan as part of the manufacturer''s
    quality system. It includes: requirements for materials, components, joints and
    assemblies given in the applicable part(s) of ISO 15876;requirements for the manufacturer''s
    quality system;definitions and procedures to be applied if third-party certification
    is involved. In conjunction with the other parts of ISO 15876, ISO/TS 15876-7
    is applicable to polybutylene (PB) piping systems intended to be used for hot
    and cold water installations, within buildings, for the conveyance of water which
    may or may not be intended for human consumption (domestic systems) or for heating
    systems, under design pressures and temperatures appropriate to the class of application.'
