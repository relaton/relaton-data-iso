abstract:
- language: en
  script: Latn
  content: This document specifies a high performance liquid chromatography (HPLC)
    or ultra-high performance liquid chromatography (UHPLC) method for the determination
    of content of the four major theaflavins of tea. It is applicable to both leaf
    and instant black and oolong teas. The method is currently not validated for ready-to-drink
    (RTD) beverages.
