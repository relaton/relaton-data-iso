abstract:
- language: en
  script: Latn
  content: This part of ISO 8980 specifies requirements and test methods to enable
    validation of specific claims for properties of uncut and edged finished spectacle
    lenses. This International Standard applies to those claims that are additional
    to the requirements and test methods in the other ISO spectacle lens standards.
    This standard can be applied at all stages of the supply chain from the manufacturer
    to the intended wearer.
