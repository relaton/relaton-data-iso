abstract:
- language: en
  script: Latn
  content: 'ISO 17268:2006 applies to design, safety and operation verification of
    Compressed Hydrogen Surface Vehicle (CHSV) refuelling connection devices hereinafter
    referred to as nozzle and receptacle. CHSV Refuelling nozzles and receptacles
    consist of the following components, as applicable: Receptacle and protective
    cap (mounted on vehicle); andNozzle. ISO 17268:2006 applies to devices which have
    working pressures of 25 MPa and 35 MPa, hereinafter referred to as the following:
    H25 - 25 MPa at 15 °CH35 - 35 MPa at 15 °C ISO 17268:2006 applies to nozzles and
    receptacles which (1) prevent hydrogen fuelled vehicles from being refuelled by
    dispenser stations with working pressures higher than the vehicle; (2) allow hydrogen
    vehicles to be refuelled by dispenser stations with working pressures equal to
    or lower than the vehicle fuel system working pressure; (3) prevent hydrogen fuelled
    vehicles from being refuelled by other compressed gases dispensing stations; and
    (4) prevent other gaseous fuelled vehicles from being refuelled by hydrogen dispensing
    stations.'
