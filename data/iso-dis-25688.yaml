abstract:
- language: en
  script: Latn
  content: This document provides guidelines that should be considered for the safety of unmanned stores. The objective of this standard is to prevent and respond to harm to the lives, bodies, and property of customers and unmanned stores, as well as damage to facilities in the store. This standard specifies the strategies, operations and contents of for the identification of hazards, risk assessment, risk reduction, and safety measures addressing various hazards in unmanned stores.
