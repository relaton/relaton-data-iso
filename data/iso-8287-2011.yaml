abstract:
- language: en
  script: Latn
  content: ISO 8287:2011 specifies the chemical composition of cast unalloyed magnesium.
    It specifies classification, designation, testing rules, marking, packing, transportation,
    storage, and information contained in the contract. ISO 8287:2011 is for cast
    unalloyed magnesium produced by the silicon-thermo process or molten salt electrolysis
    process.
