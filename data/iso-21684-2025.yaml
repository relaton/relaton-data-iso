abstract:
- language: en
  script: Latn
  content: 'This document specifies laboratory testing methods for electrically powered
    air circulating fan heads and ceiling fans when air is used as the test gas. This
    document is applicable to air circulating fans with an input power greater than
    or equal to 125 W, except for ceiling fans that are larger than 1 800 mm, which
    do not have a lower input power limit. The diameter of the fan being tested is
    limited by the minimum dimensions as shown in the applicable test figures. See
    annex A for information on common names used for various air circulating fans.
    This document does not apply to: —    jet fans; —    powered roof ventilators,
    induced flow fans, laboratory exhausts; —    positive pressure ventilators as
    defined in ISO 24660:2024; —    compressors; —    positive displacement machines.'
