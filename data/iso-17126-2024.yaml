abstract:
- language: en
  script: Latn
  content: This document specifies test procedures for the determination of effects
    of contaminated soils or other contaminated samples on the emergence of lettuce
    seeds. This document is applicable to contaminated soils, soil materials, compost,
    sludge and chemical testing. It is also applicable to the measurement of effects
    of substances deliberately added to the soil and to the comparison of soils of
    known and unknown quality. This document is not applicable for volatile contaminants.
