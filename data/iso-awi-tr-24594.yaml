abstract:
- language: en
  script: Latn
  content: 'This proposed report deals with the different corrective activities related
    to water loss reduction and ongoing management, while applying the IWA WLSG methods
    as introduced in ISO 24528, as well as implementation of solutions for: - Water
    loss status analysis: Calculation NRW components and performance indicators, -
    Analysis of water loss reduction targets: meeting current targets and establishing
    short- and long-term targets, - Analysis of effectiveness of the corrective activities
    including methods and technologies, - Manpower organization and management, -
    Financial analysis of NRW.'
