abstract:
- language: en
  script: Latn
  content: This document gives guidance on how to establish, use and maintain energy
    performance indicators (EnPIs) and energy baselines (EnBs) to evaluate energy
    performance in any organization including those using ISO 50001. Additional guidance
    is given on how to measure and monitor energy performance and demonstrate energy
    performance improvement. This document is applicable to any organization, regardless
    of its type, size, complexity, geographical location, organizational culture,
    the products and services it provides or its level of maturity in the field of
    energy management.
