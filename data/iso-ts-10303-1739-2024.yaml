abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1739 specifies the application module for Production rule.
    The following are within the scope of ISO/TS 10303-1739: rules that define a constraint
    by relating two elements based upon characteristics of a design; production rules
    structure and semantics; management of rules; items within the scope of application
    module Activity, ISO/TS 10303-1047; items within the scope of application module
    Date time assignment, ISO/TS 10303-1014; items within the scope of application
    module Identification assignment, ISO/TS 10303-1021; items within the scope of
    application module Product identification, ISO/TS 10303-1017; items within the
    scope of application module Software, ISO/TS 10303-1746; items within the scope
    of application module Specification document, ISO/TS 10303-1747.'
