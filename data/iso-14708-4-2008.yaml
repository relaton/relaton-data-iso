abstract:
- language: en
  script: Latn
  content: ISO 14708-4:2008 is applicable to active implantable medical devices intended
    to deliver medicinal substances to site-specific locations within the human body.
    ISO 14708-4:2008 is also applicable to some non-implantable parts and accessories
    of the devices. The tests that are specified in ISO 14708-4:2008 are type tests
    intended to be carried out on a sample of a device to show compliance, and are
    not intended to be used for the routine testing of manufactured products.
