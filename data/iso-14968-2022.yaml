abstract:
- language: en
  script: Latn
  content: This document specifies a method for the measurement of curl in cut-size
    office papers. The test method is typically used in evaluating papers of the type
    described in ISO 216. This method is limited to papers with a maximum dimension
    of 300 mm in both directions. The measurement can be made on papers as received,
    after conditioning, or after processing in a copier or printing device.
