abstract:
- language: en
  script: Latn
  content: ISO 15005:2017 specifies ergonomic principles for the design of the dialogues
    that take place between the driver of a road vehicle and the vehicle's transport
    information and control systems (TICS) while the vehicle is in motion. It also
    specifies compliance verification conditions for the requirements related to these
    principles. ISO 15005:2017 is applicable to TICS consisting of either single or
    multiple devices, which can be either independent or interconnected. It is not
    applicable to TICS without dialogues, TICS failures or malfunctions, or controls
    or displays used for non-TICS functions. The requirements and recommendations
    of this document can be reconsidered for drivers with special needs.
