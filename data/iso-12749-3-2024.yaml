abstract:
- language: en
  script: Latn
  content: This document deals with the terminological data used in the standards
    regarding the standardization and promotion of good practices associated with
    the planning, design, construction, operation and decommissioning of installations,
    processes and technologies involving radioactive materials. The vocabulary of
    nuclear installations, processes and technologies includes fuel cycle, ex-reactor
    nuclear criticality safety, analytical methodologies, transport of radioactive
    materials, materials characterization, radioactive waste management and decommissioning.
    NOTE            See Annex A for the methodology used to develop the vocabulary.
