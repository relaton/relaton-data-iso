abstract:
- language: en
  script: Latn
  content: 'ISO 5971:2017 establishes a system for designating the sizes of tights.
    The system is based on three criteria: - identification of dimensions; - description
    of the methods of determining size designations from survey data; and - indication
    of size designations for garment labelling. Examples of size designations are
    given in Annex B.'
