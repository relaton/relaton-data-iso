abstract:
- language: en
  script: Latn
  content: ISO 9005:2007 specifies an analytical method for the determination of the
    oxygen/uranium ratio in uranium dioxide powder and sintered pellets. The method
    is applicable to reactor grade samples of hyper-stoichiometric uranium dioxide
    powder and pellets. The presence of reducing agents or residual organic additives
    invalidates the procedure.
