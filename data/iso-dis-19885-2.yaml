abstract:
- language: en
  script: Latn
  content: 'A multipart set of documents is envisioned as part of the 19885 series,
    Gaseous hydrogen -- Fuelling protocols for hydrogen-fuelled vehicles. The 19885
    documents will address the general design and development process for the definition
    and verification of fuelling protocols and the implementation of the protocols
    for dispensing fuel to hydrogen vehicles rated up to 70 MPa nominal working pressure
    (NWP). This NP proposes the following project: 19885-2: Gaseous hydrogen – Fuelling
    protocols for hydrogen fuelled vehicles – Part 2: Definition of communications
    between the vehicle and dispenser control systems Focus is on the communication
    system needed to implement the fueling protocols defined in ISO 19885 series to
    fuel hydrogen vehicles. Approach: • To be written in the context anticipated use
    as the document proceeds industry application, • Coordinate with 19885-3 to establish
    the communications to utilize versatile high-flow hydrogen fuelling protocol(s)
    for 35 or 70 MPa NWP compressed gaseous hydrogen-powered heavy-duty road vehicles
    (10-200 kg hydrogen capacity). • Specific systems to be given as examples but
    applying the communication protocol will not be limited to a particular system.
    The definition of communications systems in ISO 19885-2 is intended to address
    the different communications UCDC levels referenced in hydrogen fuelling protocol(s)
    standards ISO 19885-1 and 19885-3.'
