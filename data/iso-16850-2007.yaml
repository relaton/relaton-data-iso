abstract:
- language: en
  script: Latn
  content: ISO 16850:2007 specifies a test method to simulate the child head impact
    of a child pedestrian to the bonnet top of passengers vehicles or some light truck
    vehicles, as defined in ISO 3833. The purpose of this test method is to simulate
    frontal impact of a vehicle, laterally to a pedestrian. The impact device to be
    used in this test method will be robust for a vehicle impact velocity of up to
    11 m/s. While the test method specified addresses the reduction of a child pedestrian
    head injury risk, it does not test for injuries to other regions of the pedestrian.
    The evaluation of injury risk to other pedestrian body regions is determined using
    other test methods. This test method does not consider downward pitching of the
    vehicle due to pre impact braking. This test method and the corresponding HIC
    measurement utilize a free flight head form impactor, and does not consider the
    kinematics of the pedestrian body as a whole, nor does it consider the subsequent
    post-impact kinematics and potential injury risk.
