abstract:
- language: en
  script: Latn
  content: ISO 5172:2006 specifies specifications and tests for blowpipes for gas
    welding, heating and cutting of metals. It applies to manual blowpipes for welding
    and heating with a nominal thermal power up to 32 000 kcal/h, and manual and machine
    cutting blowpipes with a cutting range up to 300 mm. ISO 5172:2006 does not apply
    to air-aspirated blowpipes which are covered in ISO 9012.
