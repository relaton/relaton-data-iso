abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of, and corresponding test
    methods for, the wrought titanium 15-molybdenum 5-zirconium 3-aluminium alloy
    for use in the manufacture of surgical implants. This document applies to materials
    in bar form up to a maximum diameter of 100 mm. NOTE The mechanical properties
    of a sample obtained from a finished product made of this alloy can differ from
    those specified in this document.
