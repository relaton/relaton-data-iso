abstract:
- language: en
  script: Latn
  content: ISO 14270:2016 specifies specimen dimensions and a testing procedure for
    mechanized peel testing of single spot, seam and embossed projection welds, in
    overlapping sheets, in any metallic material of thickness 0,5 mm to 3 mm, where
    the welds have a maximum diameter of 7√t (where t is the sheet thickness in mm).
    For welds of diameter between 5√t and 7√t, the peel strength values obtained may
    be lower than expected when using the recommended test specimen dimensions because
    the test specimen width is designed for welds of diameter of 5√t or less. The
    object of mechanized peel testing is to determine the peel strength that the test
    specimen can sustain.
