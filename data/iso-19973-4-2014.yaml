abstract:
- language: en
  script: Latn
  content: ISO 19973-4:2014 provides test procedures for assessing the reliability
    of pneumatic pressure regulators by testing and the methods of reporting the results
    of testing. General test conditions and the calculation method are provided in
    ISO 19973-1. The methods specified in ISO 19973-1 apply to the first failure,
    as obtained with the three-points moving average (3PMA) method, without repairs,
    but excluding outliers. ISO 19973-4:2014 applies to manually adjustable and remote-piloted
    pressure regulators, both relieving and non-relieving. It does not apply to pressure
    regulators that have a permanent bleed. ISO 19973-4:2014 also specifies test equipment
    and failure criteria (threshold levels) for tests to assess the reliability of
    pneumatic pressure regulators.
