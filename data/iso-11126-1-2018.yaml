abstract:
- language: en
  script: Latn
  content: This document describes a classification of non-metallic blast-cleaning
    abrasives for the preparation of steel substrates before application of paints
    and related products. It specifies the characteristics which are required for
    the complete designation of such abrasives. This document applies to abrasives
    supplied in the "new" or unused condition only. It does not apply to abrasives
    either during or after use. NOTE Although this document has been developed specifically
    to meet requirements for preparation of steelwork, the properties specified will
    generally be appropriate for use when preparing other material surfaces, or components,
    using blast-cleaning techniques. These techniques are described in ISO 8504‑2.
