abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of a serial communication
    protocol (Open System Protocol - OSP) which supports distributed real-time control
    of up to 1007 nodes. This serial communication system enables both daisy-chain
    or loop-through operation modes, where either each node can be addressed directly
    or by dedicated broadcast or multicast communication. This document comprises
    the following three open system interconnect (OSI) layers (see ISO/IEC 7498 series):
    • network layer • data link layer • physical layer OSP is initially intended for
    automotive lighting applications but is not limited to this application.'
