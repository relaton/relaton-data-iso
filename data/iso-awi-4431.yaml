abstract:
- language: en
  script: Latn
  content: This International Standard will specify requirements and test methods
    for performance criteria for non-wire manual interdental brushes consisting of
    a handle portion and a cleaning portion with emanating parts. It also specifies
    the accompanying information such as manufacturer’s instructions for use and labelling
    of the packaging. Excluded are interdental brushes containing metal such as wire.
    This International Standard is not applicable to powered interdental brushes,
    manual toothbrushes, dental floss, tapes, and strings, or to interdental brushes
    covered by ISO 16409.
