abstract:
- language: en
  script: Latn
  content: This document specifies reference methods for the size analysis of coal
    by manual sieving (wet or dry), using test sieves of aperture sizes between 90 mm
    and 45 μm. A guide to sampling is given in Annex A. This document is applicable
    to all coals. It is not applicable to coke. In the case of pulverized coal which
    has been ground so that a high proportion passes through the test sieve of the
    smallest aperture size, the methods of this document determine only the mass fraction
    oversize expressed as a percent.
