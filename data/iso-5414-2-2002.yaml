abstract:
- language: en
  script: Latn
  content: 'ISO 5414-2 specifies the dimensions of tool chucks (end mill holders)
    with clamp screws for tools with flatted cylindrical shanks in accordance with
    ISO 3338-2. It also specifies the designations of these chucks. ISO 5414-2 defines
    two types of connection: chucks with 7/24 taper shanks in accordance with ISO
    297 for manual changers and with ISO 7388-1 for automatic changers, for tool shanks
    with either single flat or a double flat for manual and automatic changers; chucks
    with Morse taper shanks in accordance with ISO 296 and ISO 5413 for tool shanks
    with a single flat only.'
