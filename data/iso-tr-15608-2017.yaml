abstract:
- language: en
  script: Latn
  content: 'ISO/TR 15608:2017 provides guidelines for a uniform system for grouping
    materials for welding purposes. It can also be applied for other purposes, such
    as heat treatment, forming and non-destructive testing. It covers grouping systems
    for the following standardized materials: ? steels; ? aluminium and its alloys;
    ? copper and its alloys; ? nickel and its alloys; ? titanium and its alloys; ?
    zirconium and its alloys; ? cast irons.'
