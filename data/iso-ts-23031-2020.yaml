abstract:
- language: en
  script: Latn
  content: This document describes procedures for the assessment and validation of
    the performance of an optical spectrometer intended for use in capturing the spectral
    reflectance factor or the spectral radiance factor of printed areas comprised
    of non-fluorescent or fluorescent materials, respectively. While it does not describe
    the application to transmitting materials directly, many of the procedures can
    be applied to transmitting systems by backing them with a reflective white backing
    material. This document does not address spectral measurements appropriate to
    other specific application needs, such as those used during the production of
    materials (e.g. printing paper and proofing media), which are well described by
    ISO standards under the jurisdiction of ISO/TC 6. It does not describe the special
    requirements for testing instruments that make in-process or online colour measurements.
