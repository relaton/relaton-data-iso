abstract:
- language: en
  script: Latn
  content: ISO 10998:2008 specifies performance and safety requirements for both normal
    and emergency steering modes of agricultural tractors. It is applicable to those
    tractors having a maximum design speed, measured in accordance with ISO 3965,
    not exceeding (60 ± 3) km/h. It is not applicable to track-laying tractors equipped
    with steel tracks having a maximum design speed, measured in accordance with ISO
    3965, not exceeding (15 ± 3) km/h.
