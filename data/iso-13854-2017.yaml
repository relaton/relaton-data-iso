abstract:
- language: en
  script: Latn
  content: ISO 13854:2017 enables the user (e.g. standard makers, designers of machinery)
    to avoid hazards from crushing zones. It specifies minimum gaps relative to parts
    of the human body and is applicable when adequate safety can be achieved by this
    method. ISO 13854:2017 is applicable to risks from crushing hazards only and is
    not applicable to other possible hazards, e.g. impact, shearing, drawing-in. NOTE
    For impact, shearing, drawing-in hazards, additional or other measures are to
    be taken.
