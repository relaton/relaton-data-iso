abstract:
- language: en
  script: Latn
  content: This document identifies the capabilities and responsibilities required
    for the qualification of the AM operators on the field of the additive manufacturing
    technologies dealing with metallic parts production, specifically for the employment
    of powder bed fusion – electron beam for metals (PBF-EB/M). This document identifies
    criteria for the theoretical and practical assessment of personnel operating PBF-EB/M
    machines. The activities and procedures foreseen to be performed by the PBF-EB
    operator are also part of this document. This document is intended to provide
    guidance for qualification of machine operators in general industrial applications.
