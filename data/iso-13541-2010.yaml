abstract:
- language: en
  script: Latn
  content: 'ISO 13541:2010 specifies two standard message formats for use in transferring
    spacecraft attitude information between space agencies: the attitude parameter
    message (APM) and the attitude ephemeris message (AEM). Such exchanges are used
    for: preflight planning for tracking or attitude estimation support; scheduling
    attitude and data processing support; carrying out attitude operations; performing
    attitude comparisons; carrying out attitude propagations and/or sensor predictions;
    and testing to initialize sub-system simulators (communications, power, etc.).
    ISO 13541:2010 includes sets of requirements and criteria that the message formats
    have been designed to meet. For exchanges where these requirements do not capture
    the needs of the participating agencies, another mechanism may be selected.'
