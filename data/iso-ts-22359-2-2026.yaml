abstract:
- language: en
  script: Latn
  content: 'This document provides functional requirements and methods for verification of performance for protective equipment and systems necessary to guarantee a desired protection level of hardened protective shelters. The document covers six functional categories of protective equipment available for the protection of a hardened protective shelter: —     blast protection; —     gas tightness; —     tightness of penetrations; —     ground shock isolation; —     CBRN (chemical, biological, radiological, nuclear) protection; and —     carbon dioxide (CO2) removal and oxygen (O2) addition. The document is intended for use by the owners of the hardened protective shelters, architects and engineers designing them, industries producing the targeted equipment, and procurement organizations in the construction industry sourcing such equipment.'
