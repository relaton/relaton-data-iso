abstract:
- language: en
  script: Latn
  content: ISO 5814:2012 specifies an electrochemical method for the determination
    of dissolved oxygen in water by means of an electrochemical cell which is isolated
    from the sample by a gas permeable membrane. Measurement can be made either as
    a concentration of oxygen in milligrams per litre, percentage saturation (% dissolved
    oxygen) or both. The method measures oxygen in water corresponding to 1 % to 100
    % saturation. However, most instruments permit measurement of values higher than
    100 %, i.e. supersaturation. The method measures oxygen in water with a saturation
    higher than 100 %, when special arrangements to prevent the outgassing of oxygen
    during the handling and measurement of the sample are made. The method is suitable
    for measurements made in the field and for continuous monitoring of dissolved
    oxygen, as well as measurements made in the laboratory. It is the preferred method
    for highly coloured and turbid waters, and also for analysis of waters not suitable
    for the Winkler titration method because of iron- and iodine-fixing substances,
    which can interfere in the iodometric method specified in ISO 5813. The method
    is suitable for drinking waters, natural waters, waste waters, and saline waters.
    If used for saline waters, such as sea or estuarine waters, a correction for salinity
    is essential.
