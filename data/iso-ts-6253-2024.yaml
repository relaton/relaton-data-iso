abstract:
- language: en
  script: Latn
  content: This document specifies requirements and recommendations for the core competences
    taught in training programmes in community interpreting. This document also identifies
    the core competences of educators who deliver training programmes in community
    interpreting. This document is applicable to signed languages and spoken languages,
    and addresses consecutive interpreting and simultaneous interpreting, including
    whispered interpreting, as well as sight translation.
