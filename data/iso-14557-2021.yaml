abstract:
- language: en
  script: Latn
  content: This document establishes the requirements and test methods for rubber
    and plastics suction hoses for fire-fighting purposes. These hoses can also be
    used manually to supply unpressurized water to the pump or for water discharge.
    NOTE       All pressures are expressed in megapascals and in bar (1 MPa = 10 bar).
    Additional requirements are specified for hose assemblies, that is, hoses with
    couplings already fitted, where this is carried out by the hose manufacturer (see
    Clause 8). Type A (rubber) hoses are intended for use at a minimum temperature
    of −20 °C and Type B (thermoplastics) hoses are intended for use at a minimum
    temperature of −10 °C.
