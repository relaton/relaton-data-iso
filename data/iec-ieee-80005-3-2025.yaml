abstract:
- language: en
  script: Latn
  content: 'This document specifies provisions for the design, installation and testing
    of low-voltage shore connection (LVSC) systems, onboard ships and on shore, to
    supply the ship with electrical power from shore. This document is applicable
    to: –            ships requiring up to 1 MVA while at berth; –            three-phase
    shore connection systems rated 250 A and above, and with a nominal voltage rating
    of 400 V AC to 1 000 V AC; –            shore-side connection systems; –           
    shore-to-ship connection and interface equipment; –            transformers and
    reactors; –            semiconductor and rotating frequency convertors; –           
    ship-side connection systems; –            protection, control, monitoring, interlocking
    and power management systems. This document does not apply to: –            inland
    navigation vessels; –            high-voltage shore connection systems, including
    ships built in accordance with the annexes of IEC/IEEE 80005-1; –            the
    electrical power supply during docking periods, for example dry docking and other
    out-of-service maintenance and repair; –            systems to be operated by
    ordinary persons as defined in 3.19. NOTE 1 Other standards are available specifically
    for inland navigation vessels in Europe. NOTE 2 IEC 60092-507 is applicable to
    small vessels. NOTE 3 Additional or alternative requirements can be imposed by
    national administrations or the authorities within whose jurisdiction the ship
    is intended to operate and by the owners or authorities responsible for a shore
    power supply or distribution system. NOTE 4 High-voltage shore connection systems
    are covered by IEC/IEEE 80005-1. NOTE 5 Some existing 380 V AC ship systems can
    be supplied by 400 V AC.'
