abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the forensic process focusing
    on recognition, recording, collection, transport and storage of items of potential
    forensic value. It includes requirements for the assessment and examination of
    scenes but is also applicable to activities that occur within the facility. This
    document also includes quality requirements. This document is not applicable to
    procedures for the recovery of data from digital storage media which is covered
    by ISO/IEC 27037. However, the storage medium itself can yield additional items
    of forensic value (e.g. fingerprints or DNA). Annex D shows the applicability
    of this document to the forensic process.
