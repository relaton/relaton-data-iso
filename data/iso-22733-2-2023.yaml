abstract:
- language: en
  script: Latn
  content: This document specifies test methods to evaluate performance of the autonomous
    emergency braking system (AEBS) in car to pedestrian collision situations. Forward
    collision warning system (FCWS) is part of AEBS when it provides warning before
    braking intervention. Vehicle to pedestrian accidents occur when a vehicle under
    test (VUT) drives in straight line and either a pedestrian walks longitudinal
    on the same road or the pedestrian is approaching perpendicular the road. A system
    requiring a driver intervention is not in scope of this document. NOTE           
    Depending on accidentology only a part of the scenarios can be used for an evaluation
    of performance.
