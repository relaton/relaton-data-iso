- language: en
  script: Latn
  content: 'The document also specifies the methods to be used for the following tests:
    measurements of colour; determination of density at 20 °C; determination of water
    content; determination of iodine value (applicable to diallyl phthalate only);
    determination of refractive index; determination of flash point; determination
