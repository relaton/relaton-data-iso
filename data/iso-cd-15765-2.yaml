abstract:
- language: en
  script: Latn
  content: 'This document specifies a transport and network layer protocol with transport
    and network layer services tailored to meet the requirements of CAN-based vehicle
    network systems on controller area networks as specified in ISO 11898-1. The diagnostic
    communication over controller area network (DoCAN) protocol supports the standardized
    abstract service primitive interface as specified in ISO 14229-2 (UDS). This document
    supports different application layer protocols such as: —     enhanced vehicle
    diagnostics (emissions-related system diagnostics beyond legislated functionality,
    non-emissions-related system diagnostics); —     emissions-related on-board diagnostics
    (OBD) as specified in the ISO 15031 series and SAE J1979 series; —     world-wide
    harmonized on-board diagnostics (WWH-OBD) as specified in the ISO 27145 series;
    and —     end of life activation of on-board pyrotechnic devices (the ISO 26021
    series). The transport protocol specifies an unconfirmed communication. NOTE         
    This document does not determine whether CAN CC, CAN FD or both are recommended
    or required to be implemented by other standards referencing this document.'
