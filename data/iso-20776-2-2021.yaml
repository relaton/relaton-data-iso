abstract:
- language: en
  script: Latn
  content: This document establishes acceptable performance criteria for antimicrobial
    susceptibility test (AST) devices that are used to determine minimum inhibitory
    concentrations (MIC) of bacteria to antimicrobial agents in medical laboratories.
    This document specifies requirements for AST devices and procedures for assessing
    performance of such devices. It defines how a performance evaluation of an AST
    device is to be conducted. This document has been developed to guide manufacturers
    in the conduct of performance evaluation studies.
