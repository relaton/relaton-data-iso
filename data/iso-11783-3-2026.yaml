abstract:
- language: en
  script: Latn
  content: This document specifies the open system interconnections (OSI) application
    layer, the transport, and the network layer, as well as the mapping to the controller
    area network (CAN) data link layer protocol as specified in ISO 11898-1. The application
    layer specifies messages, which are mapped to CAN CC data frames using the classic
    extended frame format (CEFF). For messages exceeding the length of the CEFF-formatted
    data frames, this document specifies transport layer and network layer protocols
    based on the SAE J1939-21 recommended practice.
