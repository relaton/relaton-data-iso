abstract:
- language: en
  script: Latn
  content: ISO 16119-2:2013 specifies requirements and the means for their verification
    for the design and performance of horizontal boom sprayers, as defined in 3.1,
    with regard to minimizing the potential risk of environmental contamination during
    use, including misuse foreseeable by the manufacturer. It is intended to be used
    with ISO 16119-1, which gives general requirements common to all the sprayer types
    covered by ISO 16119. It does not cover safety aspects (see ISO 4254-6). ISO 16119-2:2013
    is not applicable to sprayers manufactured before the date of its publication.
