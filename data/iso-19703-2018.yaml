abstract:
- language: en
  script: Latn
  content: This document provides definitions and equations for the calculation of
    toxic product yields and the fire conditions under which they have been derived
    in terms of equivalence ratio and combustion efficiency. Sample calculations for
    practical cases are provided. The methods are intended to be used to produce either
    instantaneous or averaged values for those experimental fires in which time-resolved
    data are available. This document is intended to provide guidance to fire researchers
    for — recording appropriate experimental fire data, — calculating average yields
    of gases and smoke in fire effluents in fire tests and fire-like combustion in
    reduced scale apparatus, — characterizing burning behaviour in experimental fires
    in terms of equivalence ratio and combustion efficiency using oxygen consumption
    and product generation data. This document does not provide guidance on the operating
    procedure of any particular piece of apparatus or interpretation of data obtained
    therein (e.g. toxicological significance of results).
