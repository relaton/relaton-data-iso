abstract:
- language: en
  script: Latn
  content: This International Standard specifies the essential dimensional requirements
    for size "S" fuel nozzles used in diesel engines. These requirements allow the
    assembly and interchangeability of the nozzles in the corresponding nozzle holders.
    This International Standard is applicable to size "S" nozzles, which comprise
    hole type, long-stem nozzles (types A1 and A2) and pintle nozzles (type B). NOTE
    Type A1 and type B nozzles are the preferred types. The non-preferred hole type,
    short-stem nozzle, type C, is shown in annex A.
