abstract:
- language: en
  script: Latn
  content: This document specifies the fast service announcement protocol (FSAP) for
    general purposes in ITS. It references and supports all features of ISO/TS 16460,
    especially supporting the service response message (SRM) and related features
    in addition to the service announcement message (SAM), which enables only very
    basic features. FSAP supports locally advertised ITS services uniquely identified
    by an ITS application identifier (ITS-AID). This document specifies message formats
    and related basic protocol procedures by reference to ISO/TS 16460, and further
    related protocol requirements for operation of FSAP in the context of an ITS station
    specified in ISO 21217. This document illustrates its relations to service announcement
    protocols specified by ETSI TC ITS and IEEE.
