abstract:
- language: en
  script: Latn
  content: 'ISO 19902:2007 specifies requirements and provides recommendations applicable
    to the following types of fixed steel offshore structures for the petroleum and
    natural gas industries: caissons, free-standing and braced; jackets; monotowers;
    towers. In addition, it is applicable to compliant bottom founded structures,
    steel gravity structures, jack-ups, other bottom founded structures and other
    structures related to offshore structures (such as underwater oil storage tanks,
    bridges and connecting structures), to the extent to which its requirements are
    relevant. It contains requirements for planning and engineering of the following
    tasks: design, fabrication, transportation and installation of new structures
    as well as their future removal; in-service inspection and integrity management
    of both new and existing structures; assessment of existing structures; evaluation
    of structures for reuse at different locations.'
