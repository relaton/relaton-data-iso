abstract:
- language: en
  script: Latn
  content: 'This document provides an assessment model to assist organizations in
    assessing their current capability to manage records processes. In particular,
    it: • specifies steps in assessing processes to determine records management capability
    • provides guidance on the key process areas against which records processes capability
    can be assessed; • provides guidance for those implementing process assessment;
    and • provides guidance on how to integrate the records management capability
    assessment into an organization’s operations.'
