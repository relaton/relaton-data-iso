abstract:
- language: en
  script: Latn
  content: ISO 11495:2014 describes a method for the determination of palladium in
    palladium jewellery alloys, preferably within the range of fineness specified
    in ISO 9202, by means of inductively coupled plasma optical emission spectrometry
    (ICP-OES). The preferred palladium content of the alloys lies between 500 ? (parts
    per thousand) and 950 ? palladium. NOTE This method can be used to analyse other
    contents of palladium. This method is intended to be used as the recommended method
    for the determination of fineness in alloys covered by ISO 9202.
