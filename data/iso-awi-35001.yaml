abstract:
- language: en
  script: Latn
  content: This document defines a process to identify, assess, control, and monitor
    the risks associated with hazardous biological materials. This document is applicable
    to any laboratory or other organization that works with, stores, transports, and/or
    disposes of hazardous biological materials. This document is intended to complement
    existing International Standards for laboratories. This document is not intended
    for laboratories that test for the presence of microorganisms and/or toxins in
    food or feedstuffs. This document is not intended for the management of risks
    from the use of genetically modified crops in agriculture.
