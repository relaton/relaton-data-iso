abstract:
- language: en
  script: Latn
  content: ISO 14910-1:2013 establishes a system of designation for thermoplastic
    polyester/ester and polyether/ester elastomers, which may be used as the basis
    for specifications. The types of thermoplastic polyester/ester and polyether/ester
    elastomer are differentiated from each other by a classification system based
    on appropriate levels of the designatory properties hardness; melting temperature;
    tensile/flexural modulus of elasticity; and on information about the intended
    application and/or method of processing, important properties, additives, colour,
    fillers and reinforcing materials. ISO 14910-1:2013 is applicable to all thermoplastic
    polyester/ester and polyether/ester elastomers. It applies to materials ready
    for normal use in the form of powder, granules or pellets, unmodified or modified
    by colourants, fillers or other additives.
