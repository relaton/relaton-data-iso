abstract:
- language: en
  script: Latn
  content: Organizations with responsibility for managing facilities, including arrangements
    for the delivery of facility services, can operate from within a demand organization
    or be external to it, i.e. on the supply side. The facility management organization,
    or FMO as it is termed, is the focus of attention for this new standard, which
    is aimed at providing guidance, with recommendations, on the development of the
    FMO. The standard will cover governance, leadership, accountability, management
    oversight, value drivers, risk, organizational structure, stakeholder engagement,
    social responsibility and ethical behaviour with respect to all FMOs, as well
    as factors influencing their successful operation. It will also cover the practical
    matter of the external multi-service provider that aspires to offer management-led
    facility management over and above the day-to-day delivery of operational facility
    services.
