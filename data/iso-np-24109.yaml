abstract:
- language: en
  script: Latn
  content: This document specifies the measurement of impedance by frequency using
    the two-electrode method for symmetric button cell of conductive oxide ceramics
    at high temperatures up to 1 000℃. Impedance measurements using a symmetric cell
    provide basic data for analyzing reactions occurring at the electrodes. The test
    method is applicable to fine ceramic materials used for fuel cells, water electrolytic
    cells, electrochemical sensors, etc.
