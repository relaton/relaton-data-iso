abstract:
- language: en
  script: Latn
  content: This document specifies a field procedure for the verification that a given
    Global Navigation Satellite System (GNSS)-based system and measurement procedure
    meets a required measurement uncertainty at the location and time of interest.
    The field procedure uses three-dimensional coordinates which are compared to reference
    coordinates. It is designed to be applicable to the technically versatile geodetic
    and surveying GNSS systems on the market and can be used for any kind of GNSS-based
    applications to determine coordinates. It is independent of the technology used
    in the GNSS measuring instrument, the satellite data streams, and any correction
    data used. The procedure is applicable to GNSS instruments under operating condition
    in the field in such a way that the main parameters affecting the determination
    of coordinates are included in the result of the test. This document defines several
    delimitation criteria, which allows for versatile applicability. As a result,
    the verification procedure can be regularly performed in the field with limited
    economic impact.
