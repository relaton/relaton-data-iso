abstract:
- language: en
  script: Latn
  content: This document specifies procedures for determination of in-plane shear strength and in-plane shear modulus of continuous fibre reinforced ceramic composites at ambient temperature by the Iosipescu test. This method applies to all ceramic matrix composites with a continuous fibre reinforcement, uni- directional(1D), bidirectional (2D) and multi-directional (xD,with x> 2). This method also applies to carbon-fibre-reinforced carbon matrix composites (also known as carbon/carbon or C/C).
