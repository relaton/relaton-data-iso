abstract:
- language: en
  script: Latn
  content: ISO 8820-9:2014 specifies fuse-links with shortened tabs (Type K) for use
    in road vehicles. It establishes, for these fuse-link types, the rated current,
    test procedures, performance requirements, and dimensions. ISO 8820-9:2014 is
    applicable to fuse-links with a rated voltage of 58 V, a current rating of ≤ 30
    A, and a breaking capacity of 1 000 A intended for use in road vehicles. ISO 8820-9:2014
    is intended to be used in conjunction with ISO 8820‑1 and ISO 8820‑2.
