abstract:
- language: en
  script: Latn
  content: This document specifies a conceptual schema for locations relative to a
    one-dimensional object as measurement along (and optionally offset from) that
    object. It defines a description of the data and operations required to use and
    support linear referencing. This document is applicable to transportation, utilities,
    environmental protection, location-based services and other applications which
    define locations relative to linear objects. For ease of reading, most examples
    discussed in this document come from the transportation domain.
