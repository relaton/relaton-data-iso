abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for producing and testing a general
    purpose chemical conversion coating on aluminium alloys. The chemical conversion
    coating is used in the manufacture of aerospace products in order to improve paint
    adhesion and resistance to corrosion. This process can also be used for touch-up
    of anodic coatings.
