abstract:
- language: en
  script: Latn
  content: 'ISO 13012-1:2009 specifies the boundary dimensions, other relevant dimensions
    and their tolerances of accessories for sleeve type linear ball bearings which
    are specified in ISO 10285. ISO 13012-1:2009 applies to: housings — closed and
    adjustable flangeless housings for series 1 sleeve type linear ball bearings,
    closed and adjustable flanged housings for series 3 sleeve type linear ball bearings,
    open flanged housings for series 3 sleeve type linear ball bearings, closed and
    adjustable flangeless housings for series 3 sleeve type linear ball bearings,
    open and open adjustable flangeless housings for series 3 sleeve type linear ball
    bearings; shaft support rails — standard height shaft support rails for series
    3 sleeve type linear ball bearings, low height shaft support rails for series
    3 sleeve type linear ball bearings; shaft support blocks — flanged shaft support
    blocks for series 1 and 3 sleeve type linear ball bearings, flangeless shaft support
    blocks for series 1 and 3 sleeve type linear ball bearings; shafts — solid and
    tubular shafts for series 1 and 3 sleeve type linear ball bearings.'
