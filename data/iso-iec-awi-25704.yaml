abstract:
- language: en
  script: Latn
  content: This document provides a process assessment model as a basis for the assessment
    of AI process capability based on the process measurement framework for the processes
    performed during AI system life cycle stages in ISO/IEC 22989:2022. The processes
    performed during AI system life cycle stages are defined in ISO/IEC 5338:2023.
    Based on ISO/IEC 33020:2019, the process measurement framework provides a set
    of indicators for measuring performance and capability of those processes. These
    indicators are used as a basis for collecting evidence that enable an organization
    to determine its process capability level. This document applies to any type of
    organization, that provides, develops, or uses products or services that utilize
    AI systems.
