abstract:
- language: en
  script: Latn
  content: This document provides a material-based classification of pyrogenic biocarbon.
    This document defines a methodology based on a selection of relevant parameters
    enabling to characterize basic property classes of a large panel of material-based
    pyrogenic biocarbon produced with raw and processed materials originating according
    to the list stated in ISO 17225-1. This document considers pyrogenic biocarbon
    material as such without any consideration regarding the technology or the processing
    it may imply for generating such materials, nor any specification that its end-uses
    require. The proposed classification focuses on basic properties required for
    enabling minimal transparency and confidence that producers and end-users need
    to agree on for making a deal.
