abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and test methods for components of condensed aerosol firefighting systems. It gives recommendations for the design, installation, testing, maintenance and safety of these systems, as well as their application in buildings, plants or other structures. The characteristics of the extinguishants in the condensed aerosol firefighting systems are also specified, as well as the types of fire for which they are a suitable extinguishing medium. This document covers total flooding systems primarily related to buildings, plants and other specific applications, utilizing electrically non-conducting condensed aerosol fire extinguishants for which there are sufficient data currently available to enable validation of performance characteristics by an appropriate independent authority. Local applications of condensed aerosol extinguishing systems are not covered by this document. Any local applications require a pre-engineered and pre-designed system which has been tested and approved for a specific application by a relevant authority.
