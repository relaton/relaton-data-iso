abstract:
- language: en
  script: Latn
  content: This document proposes criteria that will enable authors of digital content
    to target individual qualified microcontent objects in the form of terminological
    and lexicographic entries and other similar structures using a system of paired
    concept and term identifiers together with coordinated links designed to retrieve
    specific concept-oriented information. This approach entails careful coordination
    with resource owners to enable safe, controlled access via appropriate digital
    portals. The document describes requirements for ensuring the qualified status
    of targeted resources as well as general principles for identifier and link mechanisms.
    Procedures for ensuring reliable access are presented, along with examples of
    qualified microcontent objects.
