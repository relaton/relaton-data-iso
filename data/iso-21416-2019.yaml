abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for service providers with regard
    to responsible practices for the provision of their services. This document applies,
    but is not limited, to recreational-diving-related activities, for example: —
    scuba diving; — snorkelling; — free diving (breath hold diving). Further, this
    document provides guidance to all stakeholders involved in recreational-diving-related
    activities on best practice to minimize negative impact on the aquatic environment
    and to optimize positive outcomes. NOTE In this document the term "aquatic" refers
    to all bodies of water. This document helps stakeholders to identify and compare
    service providers who follow environmental best practice.'
