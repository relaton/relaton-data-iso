abstract:
- language: en
  script: Latn
  content: This document provides requirements for the design, manufacturing, and
    layout of onshore and offshore pig traps allowing entry to a pipeline for the
    launching and receiving of pigs, inspection tools and other equipment to be run
    through a pipeline, together with the associated pipework, valves and instrumentation.
    This document does not apply to installations for automatic launchers or to self-contained
    pigging valves. This document does not apply to temporary pig traps used only
    for construction phase.
