abstract:
- language: en
  script: Latn
  content: Specifies the minimum requirements to allow efficient lashing and securing
    of semi-trailers, as defined in ISO 3833, on board Ro/Ro ships, indicating in
    particular the lashing arrangements on the semi-trailer and the securing method
    to be used. Annex A gives, for information to semi-trailer designers, the securing
    point arrangements generally used on Ro/Ro ships, annex B describes for information
    some design indications to decrease damage during handling.
