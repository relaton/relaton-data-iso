abstract:
- language: en
  script: Latn
  content: ISO 18170:2017 establishes the general requirements for electric motor
    driven, variable delivery, hydraulic pumps suitable for use in aircraft hydraulic
    systems. ISO 18170:2017 includes the general requirements for Alternating Current
    (AC) induction electric motor powered units. The AC power electrical power supply
    can be either controlled to provide a Constant Frequency (CF) or uncontrolled
    to provide a Variable Frequency (VF) AC supply to the electric motor. ISO 18170:2017
    is intended to be used in conjunction with the detail specification that is particular
    to each application.
