abstract:
- language: en
  script: Latn
  content: This document specifies test methods for evaluating the antiviral activity
    of glazed and unglazed ceramic tile surfaces with incorporated antiviral agents
    and survival of viruses on ceramic surfaces. Any results obtained with this International
    Standard will always refer to this document and the conditions used. Results obtained
    with this document indicate antiviral activity under the specified experimental
    conditions used herein, and do not reflect activity under other circumstances
    where a variety of factors, such as temperature, humidity, different virus-host
    systems, host cell growth conditions, etc., are considered.
