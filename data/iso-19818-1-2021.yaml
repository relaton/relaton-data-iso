abstract:
- language: en
  script: Latn
  content: This document is applicable to protectors intended to provide protection
    against accidental exposure to laser radiation within the wavelength range 180 nm
    to 1 mm. It specifies the requirements, test methods and marking. Protectors intended
    for adjustment work on lasers are included in the scope of this document and are
    marked in the same way as other protectors, but selection of appropriate eyewear
    for a specific application is a choice of the user. Laser protective filters used
    as viewing windows in laser equipment machinery or incorporated into optical instruments
    such as operating microscopes and loupes that may be used for deliberate viewing
    of laser radiation as part of their function are outside the scope of this document.
    Laser radiation in the wavelength range below 180 nm is absorbed in air, therefore
    eye and face protection should not be required. This document is applicable to
    devices intended for patient protection during medical laser procedures except
    for treatment in the periorbital area. Guidance on eye protectors for patients
    (including those used for periorbital treatment) is given in ISO/TR 22463.
