abstract:
- language: en
  script: Latn
  content: ISO 12924:2010 specifies the requirements of greases used for the lubrication
    of equipment, components of machines, vehicles, etc. The purpose of ISO 12924:2010
    is to provide guidance suppliers and end users of greases and to equipment manufacturers
    of grease-lubricated equipment. ISO 12924:2010 is written in a general form so
    that its application can accommodate various climatic conditions throughout the
    world. ISO 12924:2010 also stipulates the requirements for the lubricating grease
    at the time of the delivery. The classification of family X (greases), which belongs
    to class L (lubricants, industrial oils and related products), is specified in
    ISO 6743-9. In this classification, a grease cannot have more than one symbol.
    This symbol is expected to correspond to the most severe conditions of temperature,
    water contamination and load in which the grease can be used. It is intended that
    ISO 12924:2010 be read in conjunction with ISO 6743-9.
