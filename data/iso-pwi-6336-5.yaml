abstract:
- language: en
  script: Latn
  content: ISO 6336-5:2016 describes contact and tooth-root stresses and gives numerical
    values for both limit stress numbers. It specifies requirements for material quality
    and heat treatment and comments on their influences on both limit stress numbers.
    Values in accordance with ISO 6336-5:2016 are suitable for use with the calculation
    procedures provided in ISO 6336‑2, ISO 6336‑3 and ISO 6336‑6 and in the application
    standards for industrial, high-speed and marine gears. They are applicable to
    the calculation procedures given in ISO 10300 for rating the load capacity of
    bevel gears. ISO 6336-5:2016 is applicable to all gearing, basic rack profiles,
    profile dimensions, design, etc., covered by those standards. The results are
    in good agreement with other methods for the range indicated in the scope of ISO
    6336‑1 and ISO 10300‑1.
