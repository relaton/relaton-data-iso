abstract:
- language: en
  script: Latn
  content: ISO 17780:2015 specifies a method for the determination of saturated aliphatic
    hydrocarbons from C10 to C56 of natural origin present in vegetable oils, and
    for detecting the presence of mineral oil and diesel oil. The method is applicable
    to all types of crude and refined edible oils and fats, for concentrations of
    mineral oils from 50 mg/kg to 1 000 mg/kg. A rapid method for refined and virgin
    (or cold-pressed) oils is proposed in Annex C. This rapid method is not adapted
    for crude oils due to a lack of retention of triglycerides observed for some samples.
    A method for fat recovery from food samples by soxhlet extraction with a blend
    of solvents is proposed in Annex D.
