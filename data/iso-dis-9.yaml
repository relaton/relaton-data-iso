abstract:
- language: en
  script: Latn
  content: Cancels and replaces the first edition (1986). Establishes a system for
    the transliteration into Latin characters of Cyrillic characters constituting
    the alphabets of Slavic and non-Slavic languages. Table 3 includes in a single
    sequence, listed in the Cyrillic alphabetic order, the 118 single or diacritic-carrying
    characters that appear in one or another of the considered alphabets.
