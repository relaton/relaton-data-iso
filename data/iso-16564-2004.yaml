abstract:
- language: en
  script: Latn
  content: ISO 16564:2004 specifies a method of determining the average molecular
    mass and the molecular-mass distribution of raw natural rubber dissolved in tetrahydrofuran.
    A set of polystyrene standards is used for calibration purposes (i.e. the method
    is a relative one). An alternative method, using cyclohexane as solvent and polyisoprene
    standards, is included in an informative annex.
