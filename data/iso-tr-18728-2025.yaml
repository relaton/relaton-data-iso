abstract:
- language: en
  script: Latn
  content: This document showcases existing practices to monitor supply chains as
    implemented in the healthcare supply chains, by making use of medicines verification
    or authentication systems, or both, traceability tools, safe communication technology
    solutions, and more. This document also discusses the potential benefits of expanding
    the identification of medicinal products (IDMP) to provide global identifiers
    for medicinal products, ingredients and batches. It also addresses potential pathways
    to a global registration system.
