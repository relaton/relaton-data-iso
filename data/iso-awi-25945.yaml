abstract:
- language: en
  script: Latn
  content: Standardization in the field of petroleum and related products, including,
    but not limited to, principle, reagents, equipment and its operation, test procedure
    and expression of results. This document specifies a test method for measuring
    the salt content in crude oil and heavy distillates by ion chromatography. This
    document applies to the determination of the salt content ranging from 0.5 mg/L
    to 600 mg/L (calculated as sodium chloride) in crude oil and its heavy products.
