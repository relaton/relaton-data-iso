abstract:
- language: en
  script: Latn
  content: 'The tests specified in ISO 22899 1 and ISO 22899 3 are designed to give
    an indication of how passive fire protection materials and systems will perform
    in a jet fire. This part of ISO 22899 provides: — guidance on the selection of
    applicable method of test; — guidance on the combination of results from hydrocarbon
    tests and resistance to jet fire tests. ISO 22899 1 and ISO 22899-3 tests report
    the thickness of fire protection material or system (sometimes referred to as
    passive fire protection; PFP) required to resist the application of a ‘jet fire’.
    This part of ISO 22899 provides information on selection of the applicable test
    method and how to combine jet fire test results with other hydrocarbon fire test
    results.'
