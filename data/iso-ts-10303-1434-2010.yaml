abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1434:2010-03 specifies the application module for Project
    management resource information. The following are within the scope of ISO/TS
    10303-1434:2010-03: facility to assign approval information to project management
    resource data; facility to assign certificate information to project management
    resource data; facility to assign classification information to project management
    resource data; facility to assign condition and condition relationships information
    to project management resource data; facility to assign contract information to
    project management resource data; facility to assign date and time interval information
    to project management resource data; facility to assign document information to
    project management resource data; facility to assign effectivity information to
    project management resource data; facility to assign file information to project
    management resource data; facility to assign identification information to project
    management resource data; facility to assign independent property information
    to project management resource data; facility to assign justification information
    to project management resource data; facility to assign location information to
    project management resource data; facility to assign language information to project
    management resource data; facility to assign person and organization information
    to project management resource data; facility to assign product information to
    project management resource data; facility to assign project information to project
    management resource data; facility to assign representation information to project
    management resource data; facility to assign security information to project management
    resource data; facility to assign value with unit information to project management
    resource data.'
