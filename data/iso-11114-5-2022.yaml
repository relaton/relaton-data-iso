abstract:
- language: en
  script: Latn
  content: This document specifies some gas compatibility test methods to evaluate
    plastic materials suitable for use in the manufacture of composite gas cylinder
    liners. It is also applicable to the evaluation of the suitability of plastic
    matrix materials used for Type 5 cylinders. Some fluids like water, used for cylinders
    testing, can react positively or negatively when in contact with plastic liners.
    This compatibility issue is not covered by this document.
