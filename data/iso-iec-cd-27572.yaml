abstract:
- language: en
  script: Latn
  content: 'This document specifies a reference architecture of Brain-computer Interfaces
    (BCI) that will focus on the function layer constitution and the functionalities
    of each layer. The Reference architecture is intended to: • Provide a standardized
    framework for designing and developing BCI systems; • Facilitate the interoperability,
    scalability, and reusability of BCI systems; • Provide a common language for various
    stakeholders; • Include consideration of output from JTC 1/AG8 meta reference
    architecture.'
