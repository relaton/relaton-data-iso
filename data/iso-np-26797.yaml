abstract:
- language: en
  script: Latn
  content: This document provides guidelines for performance assessment method for
    seawater desalination reverse osmosis (RO) system, including assessment principles,
    assessment preparation, assessment requirements, and summary of assessment. The
    performance assessment mainly includes integrity, technical indicators, economic
    indicators, safety, and environmental protection performance. This document is
    applicable to the performance assessment of seawater desalination RO systems and
    can also be used as a reference for assessing the performance of RO systems for
    other purposes besides seawater desalination.
