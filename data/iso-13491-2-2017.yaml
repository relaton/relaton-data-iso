abstract:
- language: en
  script: Latn
  content: ISO 13491-2:2017 specifies checklists to be used to evaluate secure cryptographic
    devices (SCDs) incorporating cryptographic processes as specified in ISO 9564‑1,
    ISO 9564‑2, ISO 16609, ISO 11568‑1, ISO 11568‑2, and ISO 11568‑4 in the financial
    services environment. Integrated circuit (IC) payment cards are subject to the
    requirements identified in this document up until the time of issue after which
    they are to be regarded as a "personal" device and outside of the scope of this
    document. ISO 13491-2:2017 does not address issues arising from the denial of
    service of an SCD. In the checklists given in Annex A to Annex H, the term "not
    feasible" is intended to convey the notion that although a particular attack might
    be technically possible, it would not be economically viable since carrying out
    the attack would cost more than any benefits obtained from a successful attack.
    In addition to attacks for purely economic gain, malicious attacks directed toward
    loss of reputation need to be considered.
