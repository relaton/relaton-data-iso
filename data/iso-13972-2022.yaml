abstract:
- language: en
  script: Latn
  content: 'This document: —    Specifies clinical information models (CIMs) as health
    and care concepts that can be used to define and to structure information for
    various purposes in health care, also enabling information reuse; —    Describes
    requirements for CIMs content, structure and context and specification of their
    data elements, data element relationships, meta-data and versioning, and provides
    guidance and examples; —    Specifies key characteristics of CIMs used in conceptual
    and logical analysis for use cases such as (reference) architectures, information
    layers, EHR and PHR systems, interoperability, systems integration in the health
    domain, and secondary use of data including for public health reporting; —   
    Defines a Quality Management System (QMS) for a systematic and effective governance,
    quality management, and measurement of CIMs through their lifecycle of development,
    testing, distribution, application and maintenance; —    Provides principles for
    the transformation and application of clinical information models through the
    wide variation of health information technology. This document excludes: —   
    Requirements on the content or application of any particular clinical information
    model or clinical information modelling methodology; —    Specific applications
    of clinical information models such as for dynamic modelling of workflow; —   
    Specifications for modelling entire domains or aggregates of many CIMs such as
    complete assessment documents or discharge summaries. It does not specify CIMs
    compositions; —    Specification of how to involve specific clinicians, how to
    carry out governance including information governance, or how to ensure patient
    safety.'
