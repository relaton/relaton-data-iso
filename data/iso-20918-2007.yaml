abstract:
- language: en
  script: Latn
  content: ISO 20918:2007 describes a method to evaluate the braking threshold of
    heavy commercial vehicle combinations with pneumatic braking systems, by means
    of a roller brake tester. ISO 20918:2007 describes procedures for workshops and
    garages and provides a recommended pressure range of the system threshold pressure
    for motor vehicles and trailers, and a recommended practice for determining the
    system threshold pressure. ISO 20918:2007 covers neither high-pressure compatibility,
    including the control of the coefficient of friction between lining/pad and drum/disc,
    nor dynamic influences. ISO 20918:2007 is not for use at Type Approval.
