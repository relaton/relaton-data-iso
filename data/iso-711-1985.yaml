abstract:
- language: en
  script: Latn
  content: The method is not applicable to maize, for which an identical method is
    specified in the annex to ISO 6540. The method is idended to serve as a standard
    for checking and perfecting routine methods. It consists in , if necessary, grinding
    of a sample, after conditioning, if required, drying of a test portion under reduced
    pressure, at a temperatur between 45 and 50 C and in the presence of a desiccant,
    until constant mass is reached. Two figures show diagrams of a suitable metal
    dish and of a suitable drying tube.
