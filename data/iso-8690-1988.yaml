abstract:
- language: en
  script: Latn
  content: Is designed to obtain data allowing the comparison of the ease of decontamination
    of different surface materials and can be used for comparative tests with any
    radionuclide in aqueous solution. Comparison is based on the mean residual pulse
    rates. In order to allow the general qualifications of a surface material as a
    single product, a method based on contamination by solutions containing Co-60
    and Cs-137 is specified. Decontaminability data obtained are not applicable to
    technical systems.
