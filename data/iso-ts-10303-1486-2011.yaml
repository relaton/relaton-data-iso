abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1486:2011-10 specifies the application module for Decision
    support. The following are within the scope of ISO/TS 10303-1486:2011-10: items
    within the scope of application module Requirement management; items within the
    scope of application module Justification; analysis and analysis representation;
    trade studies with measures of effectiveness; verification and validation; facility
    to assign activity information to decision support data; facility to assign analysis
    and condition information to decision support data; facility to assign authorization
    information to decision support data; facility to assign classification and identification
    information to decision support data; facility to assign date and time information
    to decision support data; facility to assign documentation information to decision
    support data; facility to assign person and organization information to decision
    support data; facility to assign project information to decision support data;
    facility to assign property information to decision support data; facility to
    assign verification evidence information to decision support data.'
