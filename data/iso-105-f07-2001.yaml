abstract:
- language: en
  script: Latn
  content: This part of ISO 105 specifies an undyed secondary acetate adjacent fabric
    which may be used for the assessment of staining in colour fastness tests. The
    staining properties of the secondary acetate adjacent fabric under test are assessed
    against a secondary acetate reference adjacent fabric using a secondary acetate
    dyed reference fabric, both of which are available from a specified source.
