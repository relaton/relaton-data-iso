abstract:
- language: en
  script: Latn
  content: This document specifies a framework and requirements for protecting sensitive visual elements — including people, objects, backgrounds, and on-screen text — before they are rendered or delivered to recipients in metaverse environments and metaverse-related immersive systems. It specifies core protection technologies (face and person transformation, object replacement, background alteration, text obfuscation, and visual suppression); a two-stage technical framework comprising a data process and a display process, including a protection object data model; technology-neutral target detection; recipient-specific rendering based on protection rules and authorization; fail-safe behaviour and protection event records; protection measures for representative use cases; and conformance provisions. This document does not specify cryptographic mechanisms, general-purpose de-identification techniques, biometric information protection mechanisms, or media-format privacy and security signalling, which are addressed by other ISO/IEC standards.
