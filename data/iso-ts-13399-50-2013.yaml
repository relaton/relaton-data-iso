abstract:
- language: en
  script: Latn
  content: 'ISO 13399-50:2013 specifies a reference dictionary for reference systems
    for cutting tools, together with their descriptive properties and domains of values.
    ISO 13399-50:2013 specifies a reference dictionary containing: definitions and
    identifications of the classes of reference systems for cutting tools, with an
    associated classification scheme; definitions and identifications of the data
    element types that represent the properties of reference systems for cutting tools;
    definitions and identifications of domains of values for describing the above-mentioned
    data element types. The following are within the scope of ISO 13399-50:2013: standard
    data that represent the various classes of connection systems for cutting tools;
    standard data that represent the various properties of connection systems for
    cutting tools; standard data that represent domains of values used for properties
    of connection systems for cutting tools; standard data that represent the various
    classes of reference systems for cutting tools; standard data that represent the
    various properties of reference systems for cutting tools; standard data that
    represent domains of values used for properties of reference systems for cutting
    tools; one implementation method by which the standard data defined in ISO 13399-50:2013
    can be exchanged (ISO 10303-21).'
