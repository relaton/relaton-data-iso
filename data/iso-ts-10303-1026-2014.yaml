abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1026:2014-02 specifies the application module for Assembly
    structure. The following are within the scope of ISO/TS 10303-1026:2014-02: specification
    of the use of a product version as a component of an assembly; specification of
    a parent-child assembly relationship; identification of a component of an assembly
    with respect to an upper level in the assembly structure; items within the scope
    of application module Product view definition, ISO/TS 10303-1019; items within
    the scope of application module Value with unit, ISO/TS 10303-1054.'
