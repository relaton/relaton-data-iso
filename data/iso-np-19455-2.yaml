abstract:
- language: en
  script: Latn
  content: 'This standard specifies a planning method for functional performance testing (FPT) when undertaking commissioning as specified in ISO 24359-1. FPT is the process conducted to verify that commissioned systems perform in accordance with the owner’s project requirements (OPR), with procedures developed by the commissioning provider or other responsible parties. This standard specifies an FPT planning method for air-handling unit (AHU) fans, systems, and associated controls in heating, ventilation and air-conditioning (HVAC) systems. In particular, this standard defines: - what information regarding the system shall be documented (e.g. design documents, drawings, and product specifications); - what data shall be measured (concrete measurement techniques are not specified in this document); - how the measured data shall be analysed to confirm that the OPR has been met. By clearly defining these elements, this standard enables commissioning providers to prepare and plan FPT effectively and to ensure the reliable execution of high-quality tests.'
