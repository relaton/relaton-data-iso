abstract:
- language: en
  script: Latn
  content: This document specifies emotion representation to support annotation, recognition,
    strategy and presentation of emotions for affective computing user interfaces
    (AUIs). This document describes the expression of emotion representation, including
    discrete emotion category, dimensional emotion space and the relationship between
    them. This document focuses on emotion representation of AUIs which meets the
    emotional needs of diverse users. This document is applicable to designers and
    developers of information systems that consider emotions.
