abstract:
- language: en
  script: Latn
  content: ISO 16119-4:2014 specifies requirements and the means for their verification
    for the design and performance of fixed and semi-mobile sprayers, as defined in
    3.1 and 3.2, with regard to minimizing the potential risk of environmental contamination
    during use, including misuse foreseeable by the manufacturer. This type of spraying
    system is generally a combination of separate elements (main tank, pump and application
    unit) that can be assembled in fixed installations (fixed sprayers) or with moving
    parts (semi-mobile sprayers). ISO 16119-4:2014 does not apply to application equipment
    for space/spatial treatments. ISO 16119-4:2014 is intended to be used with ISO
    16119‑1, which gives general requirements common to all the sprayer types covered
    by ISO 16119. When requirements of ISO 16119-4:2014 are different from those stated
    in ISO 16119‑1, the requirements of ISO 16119-4:2014 take precedence over the
    requirements of ISO 16119‑1 for machines within the scope of ISO 16119-4:2014.
    ISO 16119-4:2014 does not cover safety aspects (see ISO 4254‑6). ISO 16119-4:2014
    is not applicable to sprayers manufactured before the date of its publication.
