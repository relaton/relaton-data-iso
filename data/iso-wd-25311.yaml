abstract:
- language: en
  script: Latn
  content: This document specifies a small punch creep test method that involves the
    use of small disc-shaped test specimens for porous ceramics-metal composites.
    This document can be applied to evaluate the creep characteristics of the materials
    used for the SOFC fuel electrode and to serve other purposes such as long-term
    strength reliability evaluations, quality assurance and material development.
