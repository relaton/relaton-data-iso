abstract:
- language: en
  script: Latn
  content: ISO/IEC 19788 specifies metadata elements and their attributes for the
    description of learning resources. ISO/IEC 19788-2:2011 provides a base-level
    data element set for the description of learning resources, from the ISO 15836:2009
    Dublin Core metadata element set, using the framework provided in ISO/IEC 19788-1:2011.
    Those data elements being cast into the metadata learning resources framework
    can be used with data elements defined in other parts, in order to address specific
    user communities' needs for extensions, modularization or refinement.
