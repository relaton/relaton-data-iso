abstract:
- language: en
  script: Latn
  content: ISO 11205:2003 specifies an engineering method (grade 2 accuracy) to determine
    the emission sound pressure level of machines in situ, at the work station or
    at other specified positions, using sound intensity. It is an alternative to ISO
    11201, ISO 11202 and ISO 11204 for in situ measurements. It is applicable to all
    kinds of test environments provided that the requirements on background noise
    and field indicators are fulfilled. ISO 11205:2003 is applicable to equipment
    emitting stationary broadband noise. The noise can differ between operational
    cycles and can be with or without discrete frequency or narrow band components.
