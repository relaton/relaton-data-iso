abstract:
- language: en
  script: Latn
  content: ISO 20213:2015 is one of a family of documents specifying the Spacecraft
    Onboard Interface Services (SOIS)-compliant services to be provided in support
    of onboard applications. ISO 20213:2015 is to define services and service interfaces
    provided by the SOIS Message Transfer Service. Its scope is to specify the service
    only and not to specify methods of providing the service, although use of the
    SOIS subnetwork services is assumed. ISO 20213:2015 conforms to the principles
    set out in the SOIS Green Book (reference [C2]) and should not be applied without
    first consulting this reference.
