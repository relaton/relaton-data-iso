abstract:
- language: en
  script: Latn
  content: 'This document specifies conformance tests for a system under test (SUT) implementing hydrogen vehicle and hydrogen dispenser according to the generic fuelling communication requirements defined in ISO 19885 2 and the fueling-protocol specific communication requirements defined in ISO 19885-3. The test system will comprise: - a hydrogen vehicle tester to verify the communication behaviour of a hydrogen vehicle SUT; - a hydrogen dispenser tester to verify the communication behaviour of a hydrogen dispenser SUT; - a public key infrastructure (PKI) and other secondary actors to verify the security behaviour of a hydrogen vehicle SUT and a hydrogen dispenser SUT; and - a fueling control system, implementing a fueling protocol, to verify the communication behaviour of a hydrogen vehicle SUT and a hydrogen dispenser SUT under the control of a fueling protocol This document specifies test cases for the requirements defined in ISO 19885-2 and the fueling-protocol specific communication protocol requirements defined in ISO 19885-3, covering the following aspects: - use cases other than those performed by physical or data-link layer of fueling communication or pairing communication; - fueling-protocol-specific requirements of each fueling protocol; and - interaction of the communication module with underlying fueling system or fueling protocol The test cases will focus on black-box testing of the communication module of a hydrogen vehicle or dispenser, while relevant secondary actors, such as PKI or fuelling system, are under the control of the test system to ensure reproduceable test results.'
