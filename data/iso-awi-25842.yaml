abstract:
- language: en
  script: Latn
  content: This document specifies the test procedures applicable to fuel cells for
    use onboard ships. Test procedures are intended to assess suitability for the
    marine environment and cover all fuel cells onboard ships, regardless of whether
    they are main or ancillary equipment. The main object for testing is fuel cell
    elements themselves, including stacks. This document does not apply to the fuel
    storage system and fuel supply system for fuel cells.
