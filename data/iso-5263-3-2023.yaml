abstract:
- language: en
  script: Latn
  content: This document specifies an apparatus and the procedures for the laboratory
    wet disintegration of mechanical pulps that exhibit latency except when brightness
    is measured. This apparatus and procedure can be used for preparation of the test
    portion in other International Standards dealing with pulps. This document is
    applicable to all kind of mechanical pulps (i.e. mechanical, semi-chemical and
    chemi-mechanical pulps) exhibiting latency.
