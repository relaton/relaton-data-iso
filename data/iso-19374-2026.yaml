abstract:
- language: en
  script: Latn
  content: 'This document establishes a designation system of recycled carbon fibres,
    which can be used as the basis for specification. This designation system is applicable
    to recycled carbon fibres used for polymer composites. The types of recycled carbon
    fibres are differentiated by a designation system based on appropriate levels
    of the designatory properties: tensile modulus of elasticity. tensile strength.
    NOTE            One to five designatory property(s) that differentiate recycled
    carbon fibre types from each other is (are) assigned.'
