abstract:
- language: en
  script: Latn
  content: This document provides common requirements and recommendations met by training
    programs or classes in martial arts training service for recreation and performing
    purposes (MATS-RP), which not specified in ISO 29992 or ISO 29993. It excludes
    the requirements and recommendations for sports and other recreational facilities
    and equipment which are under the scope of ISO/TC 83. It is applicable to the
    organization providing MATS-RP. In cases where the MATS-RP are provided by an
    organization that also delivers other services, this document only applies to
    MATS-RP.
