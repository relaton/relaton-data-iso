abstract:
- language: en
  script: Latn
  content: This part of ISO 9241 provides requirements and recommendations on interaction
    techniques, their nature, use and guidance on when to use them. This part of ISO
    9241 is concerned with software components of interactive systems to make human-system
    interaction usable as far as the most basic interaction aspects are concerned.
    This part of ISO 9241 provides a comprehensive list of generic interaction techniques
    regardless of a specific visualization and implementation technology. It gives
    guidance and recommendations on selection, usage and dependencies of interaction
    techniques and their applications in various contexts. It does not provide detailed
    coverage of the methods and techniques required for design and implementing of
    interaction techniques, the design or structure of information, nor does it address
    health or safety aspects in detail. The information in this part of ISO 9241 is
    intended for use by those responsible for developing user interfaces, but also
    for planning and managing platform specific aspects of user interface design.
    It therefore addresses technical issues only to the extent necessary to allow
    such individuals to understand the relevance and importance of a consistent interaction
    technique use in the design process as a whole. It also provides a framework for
    human factors and usability professionals involved in human-centred design. Detailed
    human factors, ergonomics, usability and accessibility issues are dealt with more
    fully in a number of standards including other parts of ISO 9241 and ISO 26800
    which sets out the broad principles of ergonomics (see Bibliography).
