abstract:
- language: en
  script: Latn
  content: Le présent document spécifie les exigences et les critères d’acceptation
    pour les essais de type, conformes aux conditions de conception, des robinets
    à tournant sphérique métalliques et robinets à papillon métalliques utilisés pour
    des services de sectionnement pour toutes les applications industrielles, et sert
    à valider la conception des produits sur 205 cycles. Le présent document exclut
    les essais de dispositifs de sécurité, de robinets de régulation, de robinets
    en matériaux thermoplastiques, et des robinets pour l’alimentation en eau destinée
    à la consommation humaine et en eaux usées (par exemple la série EN 1074). Le
    présent document définit la procédure permettant d’étendre la qualification de
    l’appareil de robinetterie soumis à l’essai à des désignations de dimensions et
    de pression non soumises à l’essai de la même gamme de produits. Cet essai de
    type a pour objet de valider la performance de siège pour la relation pression/température
    précisée par le fabricant, qui figure dans la documentation technique du produit
    donnée par le fabricant. Cet essai de type vérifie les exigences de couple et
    le couple de manœuvre maximale admissible (MAST), tels que donnés dans la documentation
    technique du fabricant. Cet essai de type valide la durabilité de la performance
    de siège et le couple de manœuvre grâce à des cycles mécaniques et thermiques.
