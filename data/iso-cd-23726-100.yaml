abstract:
- language: en
  script: Latn
  content: 'This document describes the ontology for schedule data and is a Web Ontology
    Language (OWL) ontology. The schedule data ontology builds on the Industrial data
    ontology (IDO) and specifies the vocabulary for schedule data and information.
    It is intended for industrial schedule data and information, employing reference
    data libraries and exploit OWL DL. The core of the ontology covers schedule, schedule
    activity, work pattern for schedule execution, the relationships between schedule
    activities within schedules (e.g. succession, activity link) and resource. The
    schedule data ontology is intended for use in all lifecycle phases of industrial
    assets and processes. The following are within the scope of this document: • General
    overview of the schedule data ontology and of the main principles; • Normative
    definitions of the schedule ontology classes and relations; • Principles (including
    governance) for schedule data ontology extensions and reference data to accommodate
    industry needs; • Informative examples of the use of schedule ontology terminology
    in context; The following are outside the scope of this document: • specification
    of data modelling languages, such as RDF and OWL used in ontology development;
    and • specification of methods for reasoning with ontologies.'
