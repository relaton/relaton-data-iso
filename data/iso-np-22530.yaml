abstract:
- language: en
  script: Latn
  content: 'This document specifies all kinds of defect atlas characteristic for the
    visual inspection of industrial endoscope (hereinafter referred to as the endoscope).
    This document is applicable to the metal or non-metal industrial products evaluation
    of the internal structure, internal surface morphology characteristics, the surface
    defect of indirect visual inspection etc. Note: The atlas given in this document
    is used as the evaluation reference of the defect image. The morphology of the
    defect is analysed and evaluated by comparing the example atlas with the reference
    atlas.'
