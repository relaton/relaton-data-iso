abstract:
- language: en
  script: Latn
  content: This document describes a procedure for the detection of the DNA transition
    sequence between the 35S promotor (P35S) from Cauliflower mosaic virus and a modified
    phoshinothricin-acetyltransferase gene (pat) from Streptomyces viridochromogenes.
    The P35S-pat construct is frequently found in genetically modified plants with
    tolerance for phosphinothricin-containing herbicides. The P35S-pat construct specific
    method is based on a real-time PCR and can be used for qualitative and quantitative
    screening purposes. For identification and quantification of a specific event,
    a follow-up analysis can be carried out. This document is applicable to the analysis
    of DNA extracted from foodstuffs. It can also be suitable for the analysis of
    DNA extracted from other products such as feedstuffs and seeds. The application
    of this method requires the extraction of an adequate quantity and quality of
    amplifiable DNA from the relevant matrix.
