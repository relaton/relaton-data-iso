abstract:
- language: en
  script: Latn
  content: ISO 6888-3:2003 specifies a horizontal method for the enumeration and detection
    of coagulase-positive staphylococci, using the most probable number (MPN) technique.
    It is applicable to products intended for human consumption and the feeding of
    animals, andenvironmental samples in the area of food production and food handling.
    This method is recommended for products where staphylococci are expected to be
    stressed and in low numbers as, for example, in dried products. Coagulase-positive
    staphylococci will primarily be Staphylococcus aureus but Staphylococcus intermedius
    and some strains of Staphylococcus hyicus also produce coagulase.
