abstract:
- language: en
  script: Latn
  content: ISO 4073:2009 specifies an information system for the location of items
    of dental equipment that are used at the working place of the team of the oral
    health care provider where examination, treatment and other clinical procedures,
    with the patient directly involved, are carried out. The identification system
    provides the means of giving general information about the presence of items and
    of describing relevant characteristics concerning dimensional flexibility and
    adaptability of the items and parts of their accessories. In addition, ISO 4073:2009
    provides definitions for general terms used in the area of dental equipment.
