abstract:
- language: en
  script: Latn
  content: This document specifies the minimum requirements and test methods of Areca
    catechu seeds [the dried ripe seeds of Areca catechu L. (Fam. Palmae)]. This document
    applies to Areca catechu seeds that are sold and used as natural medicines in
    international trade, including Chinese materia medica (whole medicinal materials)
    and decoction pieces. Processed decoction pieces of Areca catechu seeds are not
    applied in this document.
