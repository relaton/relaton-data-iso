abstract:
- language: en
  script: Latn
  content: This document specifies requirements for boxes, file covers and other enclosures
    made of cellulosic material, to be used for long term storage of documents on
    paper or parchment. This document is applicable to boxes made of solid or corrugated
    board and to file covers and other enclosures made of paper or board. This document
    can also be applicable to other types of enclosures for long term storage such
    as cases, portfolios, tubes and envelopes made of cellulosic material. This document
    is not applicable to storage of photographic materials. NOTE       ISO 18902 contains
    requirements on storage materials for photographs.
