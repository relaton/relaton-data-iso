abstract:
- language: en
  script: Latn
  content: ISO/TS 10272-3:2010 describes a horizontal method for the semi-quantitative
    determination of Campylobacter spp. It is applicable to products intended for
    human consumption or for the feeding of animals, and to environmental samples
    in the area of food production and food handling. However, it is possible that
    ISO/TS 10272-3:2010 is not appropriate in every detail for certain products, deviations
    from it being made necessary for technical reasons. It is possible that ISO/TS
    10272-3:2010 is not applicable at all to some other products.
