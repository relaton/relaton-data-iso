abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for pipes and fittings which are part of piping systems for the rehabilitation of underground non-pressure and pressure drains and sewers, and of water supply networks which transport water intended for human consumption, including raw water intake pipelines. This document is applicable to the renovation technique family "lining with cured-in-place pipes (CIPP)". It is not applicable to lining with discrete pipes or lining with pipe segments using glass-reinforced thermosetting plastics (GRP) material, as defined by ISO 11295. It is not applicable to short lengths of CIPP used for patch repair only of local pipe defects. It applies to the use of thermoset composite materials with various thermosetting resin systems, in combination with compatible fibrous carrier materials, reinforcement, and thermoplastics membranes (see 5.1). It is applicable to pipes and fittings, as manufactured, as well as to the installed system. It applies for service temperatures up to 50 °C for drains and sewers and up to 25 °C for water supply networks. For pressurised networks, this document applies to independent (fully structural, class A) and interactive (semi structural, class B) pressure pipe liners, as defined in ISO 11295, which do not rely on adhesion to the existing pipeline. It does not include requirements or test methods for resistance to abrasion, jetting, cyclic loading or impact, which are outside the scope of this document.
