abstract:
- language: en
  script: Latn
  content: ISO 7902-1:2013 specifies a calculation procedure for oil-lubricated hydrodynamic
    plain bearings, with complete separation of the shaft and bearing sliding surfaces
    by a film of lubricant, used for designing plain bearings that are reliable in
    operation. It deals with circular cylindrical bearings having angular spans, Ω,
    of 360°, 180°, 150°, 120° and 90°, the arc segment being loaded centrally.
