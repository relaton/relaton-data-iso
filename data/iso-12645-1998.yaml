abstract:
- language: en
  script: Latn
  content: This International Standard defines requirements for a half-tone certified
    reference material which may be used for the opaque area percentage calibration
    of transmission densitometers or colorimeters for use in the graphic arts. This
    International Standard is not applicable to the calibration of transmission densitometers
    in terms of ISO standard diffuse density. NOTE Test methods for determining the
    opaque area percentage are given in the informative annex A.
