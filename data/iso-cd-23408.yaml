abstract:
- language: en
  script: Latn
  content: The primary objective of this document is to define standard methods to
    measure three-dimensional relationships between road vehicle foot controls and
    the enclosing structures such as the floor, side-walls and lower instrument panel.
    This standard provides methods for the design or the competitive assessment of
    the layout, spacing, and clearances between foot controls and their surrounding
    components. It will include terms and definitions encountered in the design, development
    and evaluation of foot controls, in both static and dynamic use. This standard
    also provides guidelines to create requirements for the three-dimensional space
    between, above, below, and to the side of a foot control system, including use-cases
    and factors that influence the design of foot controls, such as foot position
    and foot size based on vehicle type, environmental considerations, and differences
    between Heavy Trucks and Buses, and Passenger Cars, Sports Utility Vehicles and
    Light Trucks. This document will include but not be limited to lateral spacing
    of foot controls (ISO 3409), and will address several deficiencies in ISO 3409,
    including a modern format with definitions and external references. An addendum
    will also outline dynamic usability considerations both for manual and semi-autonomous
    driving, such as the differences between dynamic and static heel points, heel-toe,
    misapplication, simultaneous push A-B pedals, the effect of driver anthropometry,
    driver positioning geometry, and design considerations for entry / exit as a function
    of vehicle type. This standard assumes foot controls of different types for controlling
    different functions, corresponding both to what exists and will come.
