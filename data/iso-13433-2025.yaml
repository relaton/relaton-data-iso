abstract:
- language: en
  script: Latn
  content: This document specifies a method to determine the resistance of geosynthetics
    to dynamic penetration by a steel cone dropped from a fixed height. The method
    is generally applicable to geosynthetics. However, the applicability of this test
    for some types of products (such as e.g. GGR,GCE, GST,GBR) should be considered
    carefully .
