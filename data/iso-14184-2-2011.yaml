abstract:
- language: en
  script: Latn
  content: ISO 14184-2:2011 specifies a method for determining the amount of formaldehyde
    released under the conditions of accelerated storage from textiles in any form
    by means of a vapour absorption method. The procedure is intended for use in the
    range of releasable formaldehyde on the fabric between 20 mg/kg and 3 500 mg/kg
    when determined by this method. The lower limit is 20 mg/kg. Below this limit,
    the result is reported as "not detectable". A method for determination of free
    formaldehyde and formaldehyde extracted partly through hydrolysis in aqueous solution
    is given in ISO 14184-1:2011.
