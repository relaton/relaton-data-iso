abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1732:2019 specifies the application module for Physical unit
    usage view. The following are within the scope of ISO/TS 10303-1732:2019: identification
    of a part usage in it''s next assembly; identification of a distinctive aspect
    of a part; identification of a definition of a part''s feature template; items
    within the scope of application module Analytical model, ISO/TS 10303-1603; items
    within the scope of application module Feature and connection zone, ISO/TS 10303-1671;
    items within the scope of application module Part shape, ISO/TS 10303-1807; items
    within the scope of application module Item definition structure, ISO/TS 10303-1345;
    items within the scope of application module Part feature location, ISO/TS 10303-1714;
    items within the scope of application module Requirement assignment, ISO/TS 10303-1233;
    items within the scope of application module Shape composition, ISO/TS 10303-1742.'
