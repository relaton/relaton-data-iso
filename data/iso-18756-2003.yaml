abstract:
- language: en
  script: Latn
  content: ISO 18756:2003 describes a test method that covers the determination of
    fracture toughness of monolithic ceramic materials at room temperature by the
    surface crack in flexure (SCF) method. This International Standard is intended
    for use with monolithic ceramics and whisker- or particulate-reinforced ceramics
    that are regarded as macroscopically homogeneous. It does not include continuous-fiber
    reinforced ceramic composites. The test method is applicable to materials with
    either flat or rising crack growth resistance curves.
