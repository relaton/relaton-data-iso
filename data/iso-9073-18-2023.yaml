abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the determination of the breaking
    force of nonwovens using a grab method in conditioned or wet state. This test
    method is not applicable to materials which have a high percentage of stretch.
    Comparing test results from tensile testing machines operating on different principles
    is not applicable. This document specifies methods using constant rate of specimen
    extension (CRE) tensile testers. Constant-rate-of-loading (CRL) instruments is
    covered, for information, in ISO 2062:2009, Annex A, in recognition of the fact
    that these instruments are still in use and can be used by agreement.
