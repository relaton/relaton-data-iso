abstract:
- language: en
  script: Latn
  content: 'ISO 11114-4: 2017 specifies test methods and the evaluation of results
    from these tests in order to qualify steels suitable for use in the manufacture
    of gas cylinders (up to 3 000 l) for hydrogen and hydrogen bearing embrittling
    gases. This document only applies to seamless steel gas cylinders. The requirements
    of this document are not applicable if at least one of the following conditions
    for the intended gas service is fulfilled: - the working pressure of the filled
    embrittling gas is less than 20 % of the test pressure of the cylinder; - the
    partial pressure of the filled embrittling gas of a gas mixture is less than 5
    MPa (50 bar) in the case of hydrogen and other embrittling gases, with the exception
    of hydrogen sulphide and methyl mercaptan; in such cases, the partial pressure
    shall not exceed 0,25 MPa (2,5 bar). NOTE In such cases, it is possible to design
    the cylinder as for ordinary (non-embrittling) gases.'
