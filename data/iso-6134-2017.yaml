abstract:
- language: en
  script: Latn
  content: ISO 6134:2017 specifies requirements for two types of hoses and hose assemblies,
    low pressure with a maximum working pressure of 6 bar and high pressure with a
    maximum working pressure of 18 bar, made of rubber and hose fittings made of metal,
    designed to convey saturated steam and hot water condensate. Each type is divided
    into two classes having either an oil resistant or non-oil resistant cover. NOTE
    Information on the frequency of testing of hose assemblies in use and storage
    is given in Annex A and Annex B.
