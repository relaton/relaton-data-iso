abstract:
- language: en
  script: Latn
  content: The method of classification given in this part of ISO 4433 serves to determine
    the chemical resistance of PVDF and ECTFE pipes, fittings and valve components
    designed for the conveyance of fluids in the absence of pressure and stress (e.g.
    due to earth loads or traffic loads, dynamic or internal stresses). To determine
    the chemical resistance, the method uses the change in mass and the changes in
    tensile properties which result from the storage of test pieces in chemicals.
    The storage test is carried out in accordance with ISO/DIS 4433-1. This part of
    ISO 4433 is also applicable to PVDF and ECTFE sheets as appropriate
