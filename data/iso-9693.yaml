abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods to assess the thermomechanical
    compatibility between a veneering ceramic and a metallic or ceramic substructure
    material used for dental restorations. This document applies only to the materials
    used in combination. Conformity cannot be claimed for a single material. For requirements
    for ceramic materials, see ISO 6872. For requirements for metallic materials see
    ISO 22674.
