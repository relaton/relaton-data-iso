abstract:
- language: en
  script: Latn
  content: This document describes a non-destructive method to verify (confirm) the
    precious metal fineness of finished and semifinished jewellery item(s) considered
    homogeneous by ED-XRF (energy dispersive X-ray fluorescence), including alloys
    according to ISO 9202. This document is not suitable for any coated items. WD-XRF
    (wavelength dispersive X-ray fluorescence) equipment cannot be used.
