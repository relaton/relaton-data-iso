abstract:
- language: en
  script: Latn
  content: This document defines the test methods for validating the conformance of
    RFID enabled tyres with the minimum reading distance specifications given in ISO
    20909. The two presented methodologies give comparable test results only when
    the same radio frequency and energy power parameters are used. Unless otherwise
    specified, the tests in this document are to be applied exclusively to a standalone
    RFID enabled tyre. This document is not intended to set any requirement on mass
    production quality control, nor on the frequency for testing.
