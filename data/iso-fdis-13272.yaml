abstract:
- language: en
  script: Latn
  content: 'ISO 13272:2011 specifies the definitions and requirements for buried manholes
    and inspection chambers (circular or non-circular) installed to a maximum depth
    of 6 m from ground level to the invert of the main chamber and manufactured from
    unplasticized poly(vinyl chloride) (PVC-U), polypropylene (PP), polypropylene
    with mineral modifiers (PP-MD) or polyethylene (PE). These products are intended
    for use in traffic areas and underground installations conforming to the general
    requirements given in EN 476 and are used outside the building structure (application
    area code "U"). They are therefore marked accordingly with a "U". ISO 13272:2011
    is only applicable to those chamber/manhole items where the manufacturer has clearly
    stated in the documentation how the components shall be assembled to create a
    complete manhole or inspection chamber. The inspection chambers covered by ISO
    13272:2011 comprise the following: inspection chambers providing access to the
    drainage or sewerage system by means of inspection and cleaning equipment; chambers
    designated as manholes providing man access to the drainage or sewerage system.'
