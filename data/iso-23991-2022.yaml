abstract:
- language: en
  script: Latn
  content: This document specifies the design factor, technical requirements, test
    methods, installation technologies and operation advices applicable to ductile
    iron pipes, fittings and accessories used in piped irrigation applications. NOTE     
    In this document, all pressures are relative pressures expressed in bars. This
    document also specifies materials, dimensions and tolerances, mechanical properties
    and standard coatings of pipes, fittings and accessories. It also gives performance
    requirements for all components including joints. Joint design and gasket shapes
    are outside the scope of this document. This document applies to pipes, fittings
    and accessories cast by any type of foundry process or manufactured by fabrication
    of cast components.
