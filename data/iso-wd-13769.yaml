abstract:
- language: en
  script: Latn
  content: 'This document specifies stamp marking of transportable gas cylinders of
    volumes greater than 0,12 l and up to or equal to 150 l and tubes of volumes up
    to or equal to 3 000 l, including: - steel and aluminium-alloy gas cylinders;
    - composite gas cylinders; - acetylene cylinders; - liquefied petroleum gas (LPG)
    cylinders (see Annex A); and - small cylinders (see Annex B). Unless noted by
    exception, the use of "cylinder" in this document refers to the above types of
    cylinders. Non-refillable cylinders are addressed by this standard.'
