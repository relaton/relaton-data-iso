abstract:
- language: en
  script: Latn
  content: 'Automation systems and integration – Industrial digital twin interface
    architecture specifies the architectural components of industrial digital twin
    systems that are composed of the digital twin, the physical twin and the interface
    between these two twins. The followings are within the scope of this standard:
    a) Elements of industrial digital twin systems that represent the unique architecture
    b) Interactions among the three elements of industrial digital twin systems c)
    Characteristics of industrial digital twin systems which are different from similar
    concepts or technologies d) Typical use cases of the three element architecture
    are examined. The following are outside the scope of this standard a) Applications
    of industrial digital twin systems'
