abstract:
- language: en
  script: Latn
  content: 'SCOPE The guideline addresses all companies that purchase raw materials
    as a decision-making aid for sourcing raw materials where they are mined /extracted
    in a particularly biodiversity-friendly manner. The guideline is as well a decision
    making aid for companies extracting raw material. Target groups: - Companies purchasing
    raw materials - Companies extracting raw material - Political decision makers
    in sourcing regions To evaluate the impact of raw material extraction on biodiversity,
    it is essential not only to look at one single extractive company or supplier,
    but to evaluate the impact on landscape level, that means the sourcing region.
    One mining company has limited impact on biodiversity, but many mines or extraction
    sites will have a destructive impact on ecosystems and related biodiversity. The
    guidelines will provide advice on which aspects should be considered to evaluate
    the biodiversity performance of a sourcing region and which supporting instruments
    are available.'
