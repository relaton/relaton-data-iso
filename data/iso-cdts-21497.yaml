abstract:
- language: en
  script: Latn
  content: This technical specification describes a method to remove carbon-based
    nanomaterials, such as carbon nanotubes, nano-graphene, and carbon nanohorns from
    industrial and research wastewater by using hypochlorite compounds, such as sodium
    hypochlorite. This method is applicable to aqueous solutions of carbon nanomaterials
    of concentrations lower than 100 ppm (~100 mg/L). For high concentration solutions,
    additional process(es) may be required.
