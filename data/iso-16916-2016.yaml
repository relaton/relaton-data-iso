abstract:
- language: en
  script: Latn
  content: ISO 16916:2016 defines the description and specification of injection moulds
    to be used when requesting tools (stage of tender) and ordering tools. This International
    Standard gives data for material acquisition, equipment, structural design of
    injection moulds including the surfaces of the tool. Information relating to machine-specific
    data, types of operation and warranty is also contained in this specification
    sheet. ISO 16916:2016 does not apply to compression moulds and die casting dies.
