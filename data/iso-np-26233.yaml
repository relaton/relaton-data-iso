abstract:
- language: en
  script: Latn
  content: This method describes the procedure for the analysis by X-Ray Fluorescence Spectrometry (XRFS) of Rare Earth related products and materials. The present procedure will be just focused in the XRFS characterization of Rare Earth Ores and Concentrates using Borate Fusion as sample preparation, Rare Earths (REE) and non-rare earths (non-REE) elements expressed as oxides under the range of concentration defined in Table Nº 1. Rare Earth Ores and Concentrates included come be from Monazite and Bastnaesite Mineralization. This method is not applicable to the analysis of materials containing elements other than for which matrix corrections has been calculated. Such concomitants may invalidate results obtained if this method is used without modifications. This method is used for process control and inventory analysis. This method is suitable for process control and inventory analysis. Use for contractual/sales purposes is subject to agreement between parties Table 1 — Concentration range of application of this method Oxide Range of Concentration (%) Oxide Range of Concentration (%) Y2O3 0.01 – 20 SiO2 0.01 – 50 La2O3 0.01 – 20 P2O5 0.005 – 10 CeO2 0.01 – 30 SO3 0.05 – 10 Pr6O11 0.01 – 10 K2O 0.01 – 10 Nd2O3 0.01 – 15 CaO 0.01 – 5 Sm2O3 0.01 – 10 TiO2 0.01 – 5 Eu2O3 0.01 – 10 MnO 0.01 – 5 Gd2O3 0.01 – 10 Fe2O3 0.01 – 40 Tb4O7 0.01 – 5 CuO 0.01 – 1 Dy2O3 0.01 – 5 ZnO 0.01 – 1 Ho2O3 0.01 – 1 BaO 0.01 – 5 Er2O3 0.01 – 1 SrO (*) 0.005 – 5 Tm2O3 0.01 – 1 ZrO2 (*) 0.005 – 2 Yb2O3 0.01 – 1 Nb2O5 (*) 0.01 – 1 Lu2O3 0.01 – 1 Ta2O5 (*) 0.01 – 1 Sc2O3 (*) 0.01 – 1 PbO (*) 0.005 – 2 Na2O 0.01 – 5 As2O3 (*) 0.005 – 2 MgO 0.01 – 10 ThO2 0.005 – 0.5 Al2O3 0.01 – 30 U3O8 0.005 – 0.5
