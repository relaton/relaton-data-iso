abstract:
- language: en
  script: Latn
  content: 'This document defines terms and definitions, and common test methods applicable
    to combustion engine powered pedestrian-controlled and ride-on snow throwers.
    The ISO 8437 series deals with significant hazards, hazardous situations and events
    relevant to snow throwers used as intended and under the conditions reasonably
    foreseeable by the manufacturer. It does not apply to the following: electrically
    powered and battery powered snow throwers; hand-held snow throwers; airport or
    highway snow removal machines and equipment; machines intended for use in potentially
    explosive atmospheres. It does not deal with hazards related to the following:
    battery circuits exceeding 42 V; mains connected starting motor; magneto grounding
    circuits; working environment; electromagnetic compatibility. The ISO 8437 series
    is not applicable to machines that were manufactured before the date of its'
