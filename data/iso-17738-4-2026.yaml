abstract:
- language: en
  script: Latn
  content: This document provides the requirements for site verification that an installed
    system of EIFS, (exterior insulation and finish system), conforms with the requirements
    of ISO 17738-1, is installed in conformance with ISO 17738-2 and designed in conformance
    with ISO 17738-3. The document further covers EIFS installed on prefabricated
    panels being produced offsite and then installed on site. This document does not
    purport to address all the safety concerns, if any, associated with its use.
