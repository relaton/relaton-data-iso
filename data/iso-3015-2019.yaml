abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the cloud point
    of petroleum products which are transparent in layers 40 mm in thickness and have
    a cloud point below 49 °C, amongst which are diesel fuels with up to 30 % (V/V)
    of fatty acid methyl ester (FAME)[2], paraffinic diesel fuels with up to 7 % (V/V)
    FAME[3], 100 % FAME[5] and lubricants. NOTE For the purposes of this document,
    the term "% (V/V)" is used to represent the volume fraction (φ) of a material.
