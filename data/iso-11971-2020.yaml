abstract:
- language: en
  script: Latn
  content: '1.1 This document covers the acceptance criteria for the visual testing
    of the surface of steel and iron castings. 1.2 Acceptance levels utilize Bureau
    de Normalisation des Industries de la Fonderie (BNIF) and Steel Castings Research
    and Trade Association (SCRATA) or Casting Technology International (CTI) reference
    comparators for the visual determination of surface roughness and surface discontinuities
    described as follows: — surface roughness; — thermal dressing; — mechanical dressing;
    — non-metallic inclusions; — gas porosity; — fusion discontinuities; — expansion
    discontinuities; — metal inserts.'
