abstract:
- language: en
  script: Latn
  content: ISO/IEC 17000:2004 specifies general terms and definitions relating to
    conformity assessment, including the accreditation of conformity assessment bodies,
    and to the use of conformity assessment to facilitate trade. A description of
    the functional approach to conformity assessment is included as a further aid
    to understanding among users of conformity assessment, conformity assessment bodies
    and their accreditation bodies, in both voluntary and regulatory environments.
    ISO/IEC 17000:2004 does not set out to provide a vocabulary for all of the concepts
    that may need to be used in describing particular conformity assessment activities.
    Terms and definitions are given only where the concept defined would not be understandable
    from the general language use of the term or where an existing standard definition
    is not applicable.
