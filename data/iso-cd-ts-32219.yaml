abstract:
- language: en
  script: Latn
  content: The intended document establishes terminology that describes the impact,
    risk and applicable information technology in the field of sustainable finance
    in support of the concept of sustainability as defined in the Brundtland Report/ISO
    20400:2017) This document can be used in the development of other standards and
    in support of communications among diverse, interested parties or stakeholders,
    including experts and professionals in the fields of sustainability management,
    financial service, information technology and data analysis. The focus is on industry
    sectors that provide already or are expected to increase significant contributions
    to environmental sustainability, biodiversity conservation, financial inclusion,
    circular economy, energy resilience, infrastructure accessibility, public health,
    etc. This document is applicable to all types of organizations and individuals
    that aim to utilize information technology capability to advance and scale up
    sustainable finance (e.g. financial institutions, information solution providers,
    fintech companies, digital infrastructure providers, entrepreneurs, carbon credit
    traders, industrial associations, government, not-for-profit organizations, innovators,
    agencies, etc.) Given the quick evolution and continuous innovation in the field
    of sustainable finance, this document is not intended to be an exhaustive terminology
    standard. This terminology document will focus on the clarification of a minimum
    set of measurable/verifiable/definable outcome indicators and information technology
    already in-use, such as Internet of Things (IoT), Artificial Intelligence (AI)
    and blockchain. In accordance with the market development, this working group
    will update the standard regularly.
