abstract:
- language: en
  script: Latn
  content: This document provides recommendations for human-centred design principles
    to be applied throughout the design lifecycle of products and services. In addition,
    it provides recommendations for human-centred design activities to achieve human-centred
    design. The principles and activities address the needs of people directly interacting
    with the outputs of the design process as well as other people who are stakeholders
    in their operation. While the document is not intended to be directly applicable
    to organizational design and the design of work systems, it can be adapted for
    these purposes.
