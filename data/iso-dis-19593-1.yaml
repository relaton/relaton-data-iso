abstract:
- language: en
  script: Latn
  content: 'This document describes a method for storing data in a PDF file that correspond
    to the processing steps of printed products. This method has three parts: 1) metadata
    identifying processing steps; 2) limitations on the interaction between PDF graphics
    objects that are part of a processing step and other PDF graphics objects; 3)
    limitations on PDF graphics objects in processing steps. This method is intended
    to be generic, i.e. not specific to packaging and labels. In addition, this document
    defines the following packaging- and label-specific groups of processing-steps
    data: — data corresponding to finishing steps, such as cutting, folding or glueing;
    — Braille; — information panels; — indications of physical dimensions; — indications
    of intended positions of graphical elements; — printed white, for example on transparent
    or metallic surfaces; — printed varnish; — primer; — printing plate making.'
