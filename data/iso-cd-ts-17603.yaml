  script: Latn
  content: This Technical Specification gives recommendations for good practice in
    the use of electrical sensing zone measurements for particle characterization.
    These recommendations address sample preparation, verification of functioning
    of the instrumentation, data interpretation and data quality assessment. This
    Technical Specification is appropriate for use in the measurement of solid particles,
