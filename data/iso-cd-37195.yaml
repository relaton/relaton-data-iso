abstract:
- language: en
  script: Latn
  content: This document provides the process, methods and requirements for identifying
    safety risks during the operation and maintenance stage of urban utility tunnels.
    In addition, it also includes a detailed list of safety risk identification contents
    for the utility tunnels as detailed as possible for reference. The “risks” mentioned
    in this document means negative risks. This document is applicable to the safety
    risk identification during the daily operation and maintenance stage of utility
    tunnels after they are put into operation, including the safety risk identification
    of the structural body, ancillary facilities, pipelines, personnel, management,
    environment of the utility tunnels. The “risks” mentioned in this document means
    negative risks.
