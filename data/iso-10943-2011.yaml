abstract:
- language: en
  script: Latn
  content: ISO 10943:2011 specifies minimum requirements and test methods for hand-held,
    spectacle-type, and head-worn indirect ophthalmoscopes for observing indirect
    images of the eye fundus. ISO 10943:2011 is not applicable to condensing lenses
    used for indirect ophthalmoscopy or to accessories. ISO 10943:2011 is not applicable
    to table-mounted instruments such as Gullstrand ophthalmoscopes and their derivatives,
    nor to ophthalmoscopes primarily intended for image capture and/or processing
    such as those based on scanning laser techniques.
