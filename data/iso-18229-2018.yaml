abstract:
- language: en
  script: Latn
  content: 'ISO 18229:2018 defines the essential technical requirements that are addressed
    in the process of design and construction of Generation IV (GEN IV) nuclear reactors.
    It does not address operation, maintenance and in-service inspection of reactors.
    Six reactor concepts are considered for GEN IV: the sodium fast reactor, the lead
    fast reactor, the gas fast reactor, the very high temperature reactor, the supercritical
    water reactor and the molten salt reactor. Annex A details the main characteristics
    for the different concepts. The scope of application of this document is limited
    to mechanical components related to nuclear safety and to the prevention of the
    release of radioactive materials ? that are considered to be important in terms
    of nuclear safety and operability, ? that play a role in ensuring leaktightness,
    partitioning, guiding, securing and supporting, and ? that contain and/or are
    in contact with fluids (such as vessels, pumps, valves, pipes, bellows, box structures,
    heat exchangers, handling and driving mechanisms).'
