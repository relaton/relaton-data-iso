abstract:
- language: en
  script: Latn
  content: ISO 27327-1:2009 establishes uniform methods for laboratory testing of
    air curtain units to determine aerodynamic performance in terms of airflow rate,
    outlet air velocity uniformity, power consumption and air velocity projection,
    for rating or guarantee purposes. ISO 27327-1:2009 is not applicable to the specification
    of test procedures to be used for design, production or field testing.
