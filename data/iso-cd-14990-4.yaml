abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements specific to arc flash hazards
    for the electrical equipment and its components incorporated into earth-moving
    machines (EMMs) as defined in ISO 6165, and addresses the safety of operators,
    technicians, service/maintenance personnel and bystanders. It is applicable to
    those machines using on-board voltages in the ranges of 50 V–36 kV AC r.m.s. at
    any frequency and 75 V–36 kV DC — including any repetition rate of pulsating DC
    — intended for outdoor use. It is applicable to both low and high voltages, except
    where its applicability to high- or low-voltage equipment only is indicated. Voltages
    occurring within devices are not considered to be on-board voltages and are thus
    not within its scope. This document covers potential arc flash hazards relevant
    to the voltage range for earth-moving machinery within its scope when the machinery
    is used as intended or under conditions of misuse reasonably foreseeable by the
    manufacturer. It specifies appropriate technical measures to assess arc flash
    hazards and for eliminating or reducing risks associated with these hazards. It
    is not applicable to machines manufactured before the date of its publication.
