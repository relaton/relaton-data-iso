abstract:
- language: en
  script: Latn
  content: This document specifies procedures for the evaluation of basic performance
    parameters of the radiographic film digitisation process, such as spatial resolution
    and spatial linearity, density range, density contrast sensitivity and characteristic
    transfer curve, which are applied in ISO 14096 part 2. These procedures can be
    integrated into the system software and together with a standard reference film
    (see Annex B) used for quality control of the digitisation process. This reference
    film provides a series of test targets for performance evaluation. The test targets
    are suitable for evaluating a digitisation system with a basic spatial resolution
    down to 10 µm, a density contrast sensitivity down to 0,02 optical density, a
    density range of 0,5 to 4,5 and a film size capacity of (350×430) mm2. This document
    does not address signal processing and display of the digitised data.
