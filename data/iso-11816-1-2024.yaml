abstract:
- language: en
  script: Latn
  content: This document specifies a fluorimetric method for the determination of
    alkaline phosphatase (ALP) (EC 3.1.3.1) activity in raw and heat-treated whole
    milk, semi-skimmed milk, skimmed milk and flavoured milks. This method is applicable
    to milk and milk-based drinks from cows, sheep and goats. It is also applicable
    to milk powder after reconstitution. The instrument used for the determination
    of ALP can read activities up to 7 000 milliunits per litre (mU/l). If the activity
    is higher than 7 000 mU/l, it is diluted with ALP-free milk so as to obtain a
    measurement not higher than 7 000 mU/l.
