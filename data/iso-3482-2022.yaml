abstract:
- language: en
  script: Latn
  content: This document specifies the technical requirements for system makeup, ocean
    bottom seismometer (OBS) instruments, active sources, field design, exploration
    operation, data processing for active source exploration with OBS, and their relative
    terms. This document is applicable to active source exploration with OBS, but
    also a useful reference to the passive source exploration with OBS. It can be
    used in seabed resource exploration, geological disaster surveillance and submarine
    geoscience research.
