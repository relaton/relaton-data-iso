abstract:
- language: en
  script: Latn
  content: 'This International Standard describes objectives, functional requirements
    and guidelines for emergency response (ER) measures on installations used for
    the development of offshore hydrocarbon resources. It is applicable to fixed offshore
    structures or floating production, storage and off-take systems. NOTE For mobile
    offshore units, the ER plans developed in conformance with the requirements and
    recommendations of the International Maritime Organization (IMO) are generally
    adequate for the normal, independent operation of the unit in most locations.
    The following aspects of ER planning are generally not addressed by IMO and should
    be specially considered: _ area evacuation, e.g. precautionary evacuation in areas
    of tropical revolving storms; _ combined operations wherein an integrated command
    and ER system should be developed; _ arctic operations; _ uncontrolled flow from
    a well.'
