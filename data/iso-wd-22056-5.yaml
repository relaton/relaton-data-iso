abstract:
- language: en
  script: Latn
  content: This part of ISO 22056 describes a method for verifying the collapse/burst
    pressure rating of an aerospace lubricant fluid filter element. This represents
    the capability of a filter element to withstand a designated differential pressure
    in the normal (intended) direction of flow, created by flowing contaminated lubricant
    fluid through the filter element until either collapse/burst occurs or the maximum
    expected differential pressure is reached without filter element failure. The
    collapse/burst pressure test can be conducted as a continuation of an efficiency
    test performed according to ISO 22056-3 or as a continuation of a dirt holding
    capacity test performed according to ISO-22056-4. This can be achieved by continuing
    the contaminant injection until the designated filter element differential pressure
    is reached. This test procedure describes the laboratory conditions for tests
    and will need to be augmented by system level testing including actual conditions
    of use, for example the operating fluid or contamination. The test data resulting
    from application of this part of ISO 22056 can be used to compare the performance
    of aerospace lubricant filter elements.
