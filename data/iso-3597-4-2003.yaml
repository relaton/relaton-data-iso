abstract:
- language: en
  script: Latn
  content: ISO 3597-4:2003 specifies a method for determining the apparent interlaminar
    shear strength of composite rods of circular cross-section made of roving-reinforced
    resin. The test may be carried out on "as-moulded" rods, or on rods that have
    been pretreated by immersion in boiling water (or another medium) for a specified
    time. The test is intended for inspection and quality control of rovings or for
    evaluating their suitability for use in a resin system. The results obtained are
    not intended for the generation of design data.
