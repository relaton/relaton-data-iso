abstract:
- language: en
  script: Latn
  content: 'La présente partie de l''ISO 13628 s''applique aux éléments suivants :
    tête de puits immergée, tête de puits de conduite de boue classique, forage par
    tête de puits de conduite de boue, têtes de production immergées conventionnelles
    et horizontales. Elle concerne également les outils associés nécessaires à la
    manipulation, aux essais et à l''installation des équipements. Elle spécifie les
    domaines relatifs à la conception, aux matériaux, au soudage, au contrôle de la
    qualité (y compris les essais de réception en usine), au marquage, au stockage
    et à l''expédition des sous-ensembles particuliers (utilisés pour construire les
    têtes de production immergées complètes) et des têtes de production immergées
    complètes.Le cas échéant, la présente partie de l''ISO 13628 s''applique également
    aux équipements montés en satellite, en grappe et sur châssis de guidage (template)
    multipuits.Les équipements compris dans le domaine d''application de la présente
    partie de l''ISO 13628 sont les suivants :a) Têtes de production immergées ;b)
    Têtes de puits immergées ;c) Systèmes de support de conduite de boue classiques
    ;d) Forage par systèmes de support de conduite de boue ;e) Systèmes de suspension
    des tubes de production ; f) Équipements divers.Équipements hors du domaine d''application
    de la présente partie de l''ISO 13628:- BOP de tube d''intervention/câble métallique
    sous-marins ;- tubes prolongateurs (risers) de reprise (workover) et de production
    ;- asservissements et modules de commande ;- raccordements de plate-forme ;- structures
    de protection primaire ;- équipement de traitement sous-marin ; - manifold immergé;-
    outils de tête de puits immergée ;- réparation et reprise ;- structures de châssis
    de guidage (template) multipuits ;- tubes prolongateurs (risers) haute pression
    de support de conduite de boue ;- conduite de châssis de guidage (template) ;-
    interfaces de châssis de guidage (template).'
