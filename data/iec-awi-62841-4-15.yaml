abstract:
- language: en
  script: Latn
  content: 'This International Standard deals with the safety of electric motor-operated
    or magnetically driven rechargeable battery-powered ride-on lawnmowers equipped
    with –metallic cutting means; and/or –rigid non-metallic cutting means; and/or
    –non-metallic cutting means with one or more cutting elements pivotally mounted
    on a generally circular drive unit, where these cutting elements rely on centrifugal
    force to achieve cutting and the battery packs for machinery. The above listed
    categories are hereinafter referred to as “machines”. This standard does apply
    to ride-on lawnmowers that can be operated as stand-on lawnmowers or used in pedestrian-controlled
    mode. The maximum rated voltage for machines and battery packs is 250 V d.c. This
    document deals with the hazards presented by machines which are encountered by
    all persons in the normal use and reasonably foreseeable misuse of the machines.
    Machines with electric heating elements are within the scope of this document.
    When evaluating a battery pack for protection against electric shock during charging,
    creepage distances, clearances and distances through insulation, the relevant
    requirements of this document are applicable with the battery pack fitted to the
    intended charger. Since battery packs for machines are submitted to different
    use patterns (such as rough use, high charging and discharging currents) their
    safety can be evaluated only by this document and not by using other standards
    for battery packs, such as IEC 62133-1:2017 or IEC 62133-2:2017, unless otherwise
    indicated in this document. All relevant aspects related to the safety of batteries
    are addressed in this document, such that the requirements of IEC 62133-1:2017
    or IEC 62133-2:2017 need not be separately applied. When evaluating the risk of
    fire associated with battery packs, consideration has been given to the fact that
    these battery packs are unattended energy sources and have been evaluated as such
    in this document. Requirements in other standards regarding the risk of fire due
    to the charging of these battery packs are therefore considered to be fulfilled.
    Automotive-type charging interfaces are not addressed in this standard. This document
    also addresses requirements covering the use of lithium-ion cells employed in
    battery systems in machines. The following is considered within the context of
    these requirements: –These requirements address the risk of fire or explosion
    of these batteries and not any possible hazards associated with toxicity nor potential
    hazards associated with transportation or disposal. –Battery systems covered by
    these requirements are not intended to be serviced by the end user. –These requirements
    are intended to provide comprehensive evaluation of a battery only if used in
    products covered by this document. –These requirements address the safety of lithium-ion
    battery systems during storage and use including discharge and charge. These requirements
    are only considered to be supplementary requirements in regards to battery charger
    fire and electric shock. –These requirements refer to and require parameters supplied
    in reference to the cells that establish conditions for safe use of those cells.
    Those parameters form the basis of acceptance criteria for a number of tests contained
    herein. This standard does not independently evaluate the safety of cells. These
    parameters, taken as a set, constitute the “Specified Operating Region” for a
    cell. There may be several sets of specified operating region(s). This document
    is not intended to apply to machines using general purpose batteries installed
    by the user and this document alone will not be sufficient to ensure all hazards
    are considered for these products. This document does not apply to the safety
    of battery chargers themselves. However, this document covers the safe functioning
    of lithium-ion battery systems. Mains-powered circuits for battery charging, preheating
    or other non-motor functions are covered under Annex CC. This document does not
    apply to –machines supplied by mains power or power from non-isolated sources
    that permit the machine to be operated while connected to such power supplies
    for purposes other than charging; –pedestrian controlled walk-behind lawnmowers;
    –seated or standing sulky attachments; –robotic battery powered electrical lawnmowers;
    –remote-controlled machines; –flail mowers or flail-type attachments; –scissors
    type lawnmowers; –grassland mowers; –sickle bar mowers; –towed/semi-mounted grass-cutting
    machines; –scrub-clearing machines; –lawn trimmers and lawn edge trimmers; –edgers;
    –grass trimmers; –brush cutters; –brush saws; –agricultural machinery or their
    attachments; –non-powered lawnmowers; –combustion engine powered lawnmowers; –hybrid
    and fuel cell powered machines and associated charging systems; and –machines
    intended to be used in the presence of explosive atmosphere (dust, vapour or gas).'
