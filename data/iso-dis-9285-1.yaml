abstract:
- language: en
  script: Latn
  content: 'This International Standard deals with the chemical analysis of abrasive
    grains or crude based on fused aluminium oxide. lt applies to commercially available
    products but not necessarily to products which have been altered by use. lt includes
    the following determinations: -Loss on ignition -Silicon dioxide -lron oxide -Titanium
    dioxide -Calcium oxide -Magnesium oxide -Zirconium oxide -Aluminium oxide -Analysis
    by atomic absorption spectrometry -Potassium oxide and sodium oxide (flame photometric
    method) -Analysis by X-ray fluorescence spectroscopy -Carbon and sulfur (solid
    infrared absorption method)'
