abstract:
- language: en
  script: Latn
  content: This document deals with electroplating process evaluation for fasteners,
    including fastener expected coating properties. This document is a complement
    to CQI-11 in order to deal with fastener specific aspects not fully covered by
    CQI-11, and to clarify some questions/items when they are not fully suitable for
    fasteners. This document is a guide applicable to all parties involved in the
    supply chain for coated fasteners, i.e. fastener manufacturers, chemical suppliers,
    electroplaters and purchasers. The requirements for electroplating fasteners specified
    in this document are essentially based on ISO 4042, ISO/TR 20491 and ISO 16047.
    NOTE Requirements for electroplating fasteners are also given in ASTM F1941/F1941M.
