abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides recommendations applicable
    to fixed, floating and grounded concrete offshore structures for the petroleum
    and natural gas industries and for structures supporting nationally-important
    power generation, transmission or distribution facility. This document specifically
    addresses — the design, construction, transportation and installation of new structures,
    including requirements for in-service inspection and possible removal of structures,
    — the assessment of structures in service, and — the assessment of structures
    for reuse at other locations. This document is intended to cover the engineering
    processes needed for the major engineering disciplines to establish a facility
    for offshore operation.
