abstract:
- language: en
  script: Latn
  content: 'This document specifies the general purpose, methods, performance requirements for equipment, and evaluation methods for inspection results related to the inspection of drinking water pipes from the inside, while the pipe is still in service. This information enables water utilities to understand the condition of internal pipes and maintain them properly. The scope of this document includes the following: — objectives of internal inspection — items of internal inspection — methods of internal inspection — data processing and reporting, — evaluation of inspection results — required performance of inspection equipment — principles of operating and maintaining such systems. — Quality assurance (QA) and Quality control (QC). This document does not cover: — inspection of dry water pipes.'
