abstract:
- language: en
  script: Latn
  content: ISO 9022-8:2015 specifies the methods relating to the environmental tests
    of optical instruments including additional assemblies from other fields (e.g.
    mechanical, chemical, and electronic devices), under equivalent conditions, for
    their ability to resist the influence of high pressure, low pressure, or immersion.
    The purpose of testing is to investigate to what extent the optical, climatic,
    mechanical, chemical, and electrical performance characteristics of the specimen
    are affected by high pressure, low pressure, or immersion.
