abstract:
- language: en
  script: Latn
  content: ISO 9444 specifies the tolerances on dimensions and form for continuously
    hot-rolled stainless steel narrow strip in actual widths of less than 600 mm.
    It also applies to cut lengths taken from such strip. This International Standard
    also specifies the tolerances on dimensions and form for continuously hot-rolled
    stainless steel wide strip in actual widths from 600 mm to 2 500 mm and for plate/sheet
    cut from such strip.
