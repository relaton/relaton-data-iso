abstract:
- language: en
  script: Latn
  content: ISO 22935-3¦IDF 99-3:2009 gives guidance on a general method for evaluation
    of compliance with product specifications for sensory properties based on sensory
    scoring and the use of a common nomenclature of terms. The method is especially
    applicable in process and quality control performed regularly on a larger number
    of samples and/or with some time pressure and/or with a limited number of expert
    assessors available. The results from the method may be part of product classification
    systems for domestic and international trade. Classification systems are not covered
    by ISO 22935-3¦IDF 99-3:2009.
