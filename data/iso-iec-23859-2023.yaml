abstract:
- language: en
  script: Latn
  content: This document provides requirements and recommendations on all written
    text so that it is easy to read and understand in any user interface, regardless
    of its format. This document addresses the process of creation, adaptation and
    evaluation of written text that is easy to read and understand. This document
    does not consider devices or transmission mechanisms used to deliver written text.
    It does not provide language-specific guidance.
