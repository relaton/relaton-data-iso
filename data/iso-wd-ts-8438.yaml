abstract:
- language: en
  script: Latn
  content: Different guidelines and standards address the need to assess driver distraction
    caused by in-vehicle functionalities. This assessment of the potential visual
    demand, manual demand, total task time and resulting driver distraction by an
    in-vehicle interface via participant testing causes high efforts and is only applicable
    with existing interactive prototypes. This document describes an approach and
    procedure to assess the distraction potential of a specified interaction concept
    based on the idea of task analysis describing subtasks in combination with tabled
    data for different unit interaction tasks and subtasks. The application of this
    approach improves an interaction design early in the development process, ideally
    before its implementation and participant testing.
