abstract:
- language: en
  script: Latn
  content: This International Standard describes a method for the determination of
    the force required to separate the plies of textile floor coverings. It is applicable
    to all types of textile floor coverings with a secondary or foam backing. The
    results obtained by this method are useful as a control of production but cannot
    be considered to be a reliable indication of in-use performance.
