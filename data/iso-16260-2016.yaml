abstract:
- language: en
  script: Latn
  content: ISO 16260:2016 describes a method to measure the energy required to rapidly
    delaminate a test piece of paper or board. Rupture of the test piece in the "Z"
    or thickness direction is initiated by a pendulum having a defined mass, moving
    at a defined velocity. The procedure is suitable for both single- and multi-ply
    papers and boards, including coated sheets and those that are laminated with synthetic
    polymer films. It is particularly suitable for papers and boards that may be subjected
    to Z-direction[2],[5] rapid impacts, impulses, or shock loads during printing
    or conversion. The test procedure entails the adherence of double-sided adhesive
    tape to both sides of the test piece under pressure. For this reason, the method
    may be unsuitable for materials that might be structurally damaged by compression
    or are porous enough to permit migration of the tape adhesive into or through
    the test piece.
