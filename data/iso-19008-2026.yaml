abstract:
- language: en
  script: Latn
  content: 'This document specifies the standard cost coding system (SCCS) that classifies
    costs, work hours and quantities for the assets and operations associated with
    the oil and gas industries including lower carbon energy activities. This document
    covers all life cycle phases of the assets and operations. The SCCS is applicable
    to: cost estimation; benchmarking; cost monitoring and reporting; collection of
    quantities, work hours and cost data; exchange of cost data among organizations;
    implementation in cost systems. This document also provides a basis for the establishment
    of: cost classification relevant to cost accounting rules, specific contractual
    agreements, local requirements for cost reporting to national bodies, government
    rules and tax regulations, authorization for expenditure, billing purposes, etc.;
    unique project breakdown structures (e.g. work breakdown structures, contract
    breakdown structures and organizational breakdown structures) or asset breakdown
    structures (e.g. tag or system codes and area or module breakdown structures).
    This document is intended for the following users: operators or owners; contractors;
    vendors, manufacturers or suppliers; authorities or regulatory bodies; benchmarking
    companies; consultants.'
