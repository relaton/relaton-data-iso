abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of metal ions content
    of lithium hexafluorophosphate (LiPF6) by inductively coupled plasma optical emission
    spectrometry (ICP-OES). The document is applicable to the determination of the
    content of aluminium (Al), calcium (Ca), cadmium (Cd), chromium (Cr), copper (Cu),
    iron (Fe), potassium(K), magnesium (Mg), sodium (Na), nickel (Ni) palladium(Pd)
    and zinc (Zn) in LiPF6. This method is suitable for the laboratory operation of
    LiPF6 producer, final user and independent test institute.
