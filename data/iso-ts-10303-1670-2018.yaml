abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1670:2018-11 specifies the application module for Fabrication
    technology. The following are within the scope of ISO/TS 10303-1670:2018-11: the
    representation of the information needed to describe the properties of the fabrication
    technology selected for the interconnect substrate being designed. This part of
    ISO 10303 also supports description of simple and complex templates for layout
    design. This part of ISO 10303 also supports definition of technology specific
    layer stackup models able to support multiple material combinations. fabrication
    technology properties;layout pattern templates;layout pattern template properties;definition
    of stratum stack model.'
