abstract:
- language: en
  script: Latn
  content: ISO/IEC TR 9573-11:2004 defines the document structures and style specifications
    for standards document interchange (in particular, ISO standards). Element types
    and attributes for ISO standards are defined and two profiles (a database-oriented
    profile and a document-oriented profile) are provided. The document structures
    are described by an SGML (ISO 8879) DTD,an XML DTD, anda RELAX NG (ISO/IEC 19757-2)
    schema. The style specifications are described by DSSSL (ISO/IEC 10179),XSLT,
    andXSL. Rendering examples and a list of processing tools are provided for information.
