abstract:
- language: en
  script: Latn
  content: This document specifies a set of indicators and tools, associated with
    the key pillars of a smart tourist destination (governance, innovation, technology,
    universal accessibility, sustainability). It is designed for use by smart tourist
    destinations, to support effective decision-making by destination management organizations
    and those responsible for relevant processes or activities, ultimately contributing
    to the continuous improvement of these destinations This document establishes
    a logical model applicable to any tourist destination undergoing digitalization
    and technological enhancement of its processes and services. It also provides
    a framework for measuring its performance in a comparable and verifiable way,
    regardless of the destination’s size or location.
