abstract:
- language: en
  script: Latn
  content: 'This document specifies a flame atomic absorption spectrometric method
    for the determination of the mass fraction of cadmium in copper, lead and zinc
    sulfide concentrates as follows: a) for copper sulfide concentrates, the method
    is applicable to the determination of mass fractions of cadmium from 0,01 % to
    0,30 %; b) for lead sulfide concentrates, the method is applicable to the determination
    of mass fractions of cadmium from 0,01 % to 0,30 %; c) for zinc sulfide concentrates,
    the method is applicable to the determination of mass fractions of cadmium from
    0,05 % to 0,30 %.'
