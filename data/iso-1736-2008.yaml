abstract:
- language: en
  script: Latn
  content: ISO 1736|IDF 9:2008 specifies the reference method for the determination
    of the fat content of dried milk and dried milk products. The method is applicable
    to dried milk with a fat content of 40 % mass fraction or more, dried whole, dried
    partially skimmed, and dried skimmed milk, dried whey, dried buttermilk and dried
    butter serum. The method is not applicable when the powder contains hard lumps
    which do not dissolve in ammonia solution or free fatty acids in significant quantities.
