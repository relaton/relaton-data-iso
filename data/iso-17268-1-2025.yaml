abstract:
- language: en
  script: Latn
  content: 'This document specifies the design, safety and operation characteristics
    of gaseous hydrogen land vehicle (GHLV) refuelling connectors. GHLV refuelling
    connectors consist of the following components, as applicable: —     receptacle
    and protective cap (mounted on vehicle); —     nozzle; —     communication hardware.
    This document is applicable to refuelling connectors which have nominal working
    pressures or hydrogen service levels up to 70 MPa and maximum flow rates up to
    120 g/s. This document is not applicable to refuelling connectors dispensing blends
    of hydrogen with natural gas.'
