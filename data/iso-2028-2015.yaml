abstract:
- language: en
  script: Latn
  content: ISO 2028:2015 specifies four methods for the isolation of dry polymer from
    synthetic polymer latices containing anionic surfactants, for the purpose of subsequent
    testing. Tests to be performed include the determination of the Mooney viscosity,
