abstract:
- language: en
  script: Latn
  content: This document provides a complete example to illustrate ISO 23932-1. The
    example is a dry-cleaning store, for which the fire safety objective is life safety,
    for both people located inside or outside the shop, in the event of a fire within
    the shop. NOTE Generally, an FSE study is not needed for such a small shop. However,
    this example was chosen to demonstrate the application of ISO 23932-1 in detail
    while keeping the documentation provided sufficiently brief.
