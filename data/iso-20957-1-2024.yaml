abstract:
- language: en
  script: Latn
  content: This document specifies general safety requirements and test methods for
    indoor stationary training equipment. Other parts of the ISO 20957 series can
    modify the requirements contained in this document. This document also covers
    environmental aspects. It also specifies a classification system (see Clause 4).
    This document is applicable to all stationary training equipment. This includes
    equipment for use in training areas of organizations such as sport associations,
    educational establishments, hotels, sport halls, clubs, rehabilitation centres
    and studios (classes S and I) where access and control is specifically regulated
    by the owner (person who has the legal responsibility), equipment for domestic
    use (class H) and other types of equipment including motor driven equipment as
    defined in 3.1. The requirements of other parts of the ISO 20957 series take priority
    over the corresponding requirements of this general standard. This document does
    not apply to stationary training equipment intended for outdoor use. It also does
    not apply to stationary training equipment intended for use by children under
    the age of 14 years, unless such stationary training equipment is intended for
    educational purposes in schools and other pedagogical contexts for children under
    the supervision of a qualified adult instructor.
