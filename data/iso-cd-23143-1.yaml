abstract:
- language: en
  script: Latn
  content: 'The scope of this project is to provide guidelines for information exchange
    between BIM and GIS. As part of a series of proposed international standards for
    BIM-GIS information exchange, Part 01: core principles and specifications will
    provide guidance on how to use existing standards adequately so that each domain
    can provide and request information properly. This work needs to be sufficiently
    broad by integrating ISO Standards and the latest developments from OGC and buildingSMART.
    The work will also cover the core principles of working with BIM and GIS, namely
    ensuring the Georeferencing of BIM models.'
