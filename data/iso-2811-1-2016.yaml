abstract:
- language: en
  script: Latn
  content: ISO 2811-1:2016 specifies a method for determining the density of paints,
    varnishes and related products using a metal or Gay-Lussac pycnometer. The method
    is limited to materials of low or medium viscosity at the temperature of test.
    The Hubbard pycnometer (see ISO 3507) can be used for highly viscous materials.
