abstract:
- language: en
  script: Latn
  content: This document provides definitions and requirements for scientifically substantiated “beneficially bioactive substances” contained in fresh agricultural produce or minimally processed agricultural products. This document provides examples of representative agricultural produce, their beneficially bioactive substances, and evidence of expected effects. This document describes beneficially bioactive substances that are intrinsic to fresh produce or enhanced through agricultural practices like biofortification, but does not describe synthetic compounds that are used in dietary supplements or added to foodstuffs. This document does not describe the labelling of beneficially bioactive substances in the final products, and individual methods for testing beneficially bioactive substances. This document does not include Bee products.
