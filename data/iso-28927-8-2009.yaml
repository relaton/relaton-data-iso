abstract:
- language: en
  script: Latn
  content: ISO 28927-8:2009 specifies a laboratory method for measuring hand-transmitted
    vibration emission at the handles of hand-held, power-driven saws, polishing and
    filing machines with reciprocating action and small saws with oscillating or rotating
    action. It is a type-test procedure for establishing the magnitude of vibration
    in the gripping areas of a machine run under specified test conditions. It is
    intended that the results be used to compare different models of the same type
    of machine. ISO 28927-8:2009 is applicable to reciprocating files intended for
    surface finishing equipped with a file or polishing tool, saws intended for parting
    sheets, plaster for medical use or wood, or equipped with a saw blade for use
    on all kinds of materials, and small circular saws primarily intended for cutting
    metal or composite materials, whether driven pneumatically or by other means.
    It is not applicable to files that are normally used with one hand on the file
    blade, nor to large circular saws intended for cutting wood.
