abstract:
- language: en
  script: Latn
  content: 'ISO 1711-1:2016 specifies minimum values for Rockwell hardness and torsional
    strength for hand-operated wrenches and sockets. It covers the following three
    series of torsion torques: - Series A: usual box wrenches and socket wrenches;
    EXAMPLE 1 Reference nos. 1 1 02 01 0; 1 1 02 02 0 and 1 1 02 02 1; 1 1 02 03 0;
    1 1 02 04 0; 1 1 02 05 0; 1 1 02 06 0; 1 1 02 09 0; 1 1 02 10 0; 1 1 02 11 0;
    1 1 02 12 0; 1 1 02 13 0 and 1 1 02 13 1; 1 1 02 14 0; 1 1 02 15 0; 1 1 08 01
    0; 1 1 08 02 0. - Series C: open end wrenches; EXAMPLE 2 Reference nos. 1 1 01
    01 0; 1 1 01 01 1; 1 1 01 02 0; 1 1 01 03 0; 1 1 01 04 0. - Series E: hand-operated
    square drive sockets. EXAMPLE 3 Reference nos. 2 1 02 01 0 and 2 1 02 01 1.'
