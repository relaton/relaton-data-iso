abstract:
- language: en
  script: Latn
  content: 'ISO 17088:2008 specifies procedures and requirements for the identification
    and labelling of plastics, and products made from plastics, that are suitable
    for recovery through aerobic composting. The four following aspects are addressed:
    biodegradation; disintegration during composting; negative effects on the composting
    process and facility; negative effects on the quality of the resulting compost,
    including the presence of high levels of regulated metals and other harmful components.
    This specification is intended to establish the requirements for the labelling
    of plastic products and materials, including packaging made from plastics, as
    “compostable” or “compostable in municipal and industrial composting facilities”
    or “biodegradable during composting” (for the purposes of this International Standard,
    these three expressions are considered to be equivalent). The labelling will,
    in addition, have to conform to any international, regional, national or local
    regulations (e.g. European Directive 94/62/EC).'
