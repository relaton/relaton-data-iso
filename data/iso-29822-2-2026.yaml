abstract:
- language: en
  script: Latn
  content: This document specifies the determination of the absolute value of diacylglycerols
    as well as the degree of isomerization of diacylglycerols in vegetable fats and
    oils. 1,2-diacylglycerols are transformed to the more stable 1,3-isomers during
    storage or due to acidic catalysed reaction. NOTE            Results obtained
    using this document have not been compared with results obtained using ISO 29822.
