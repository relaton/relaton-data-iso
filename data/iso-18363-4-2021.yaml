abstract:
- language: en
  script: Latn
  content: This document specifies a rapid procedure for the simultaneous determination
    of 2-MCPD esters (bound 2-MCPD), 3‐MCPD esters (bound 3‐MCPD) and glycidyl esters
    (bound glycidol) in a single assay, based on alkaline catalysed ester cleavage
    and derivatization of cleaved (free) analytes with phenylboronic acid (PBA) prior
    to GC-MS/MS analysis. Glycidyl ester overestimation is corrected by addition of
    an isotopic labelled ester bound 3-MCPD which allows the quantification of 3-MCPD
    induced glycidol during the procedure. This method is applicable to solid and
    liquid fats and oils. This document also applies to animal fats and used frying
    oils and fats, but these matrices were not included in the validation. For all
    three analytes the limit of quantification (LOQ) is 0,1 mg/kg and the limit of
    detection (LOD) is 0,03 mg/kg. Milk and milk products (or fat coming from milk
    and milk products), infant formulas, emulsifiers, free fatty acids and other fats-
    and oils-derived matrices are excluded from the scope of this document.
