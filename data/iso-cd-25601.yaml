abstract:
- language: en
  script: Latn
  content: This document specifies the test method for testing the axial linear expansion
    coefficient of straight plastic pipes by using the jacking rod differential method.
    Plastic pipes include pure plastic pipes, fiber reinforced pipes and metal reinforced
    pipes et.. The test temperature range specified in this document is 20℃~95℃.This
    document does not apply to plastic pipes with axial expansion coefficient less
    than 110-3mm/m℃.
