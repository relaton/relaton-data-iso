abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method that is applicable for the
    specific detection of C. cayetanensis oocyst DNA in food products that are described
    herein as fresh leafy green vegetables and berry fruits. With suitable controls,
    the standard may also be applicable for the examination of other items in the
    fresh produce and fruits category. When this document is next reviewed, account
    will be taken of all information then available regarding the extent to which
    this horizontal method has been followed and the reasons for deviations from this
    method in the case of products. This method does not rely on microscopic detection
    of C. cayetanensis oocysts that might be present in the samples, nor it does determine
    viability or infectivity of C. cayetanensis oocysts. This method does not characterize
    C. cayetanensis beyond the species level. The results are reported as C. cayetanensis
    DNA detected or not detected.
