abstract:
- language: en
  script: Latn
  content: 'This standard provides guidelines and establishes parameters for the design,
    performance, and user interaction of Head-Mounted Displays (HMDs), referred to
    as ''eyewear displays'' within certain contexts. It addresses the current needs
    and challenges in human–machine interaction, reflecting the evolution and growing
    popularity of HMDs. The document covers, but is not limited to: - Alignment: Including
    image clarity adjustment, mitigation of ''hot spots,'' anti-slippage measures.
    - Heat Considerations: Guidelines for contact heat and moderate heat, potential
    effects on the viewer''s body. Additionally, this standard aligns with and supplements
    existing IEC standards related to eyewear displays, providing a comprehensive
    framework for suppliers, users, and all parties involved with HMDs. NOTE: This
    document does not address specific proprietary technologies or individual manufacturer''s
    products and may be used in conjunction with other relevant standards, such as
    ISO 9241-303 and ISO 9241-305, which previously addressed HMDs.'
