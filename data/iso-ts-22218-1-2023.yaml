abstract:
- language: en
  script: Latn
  content: 'This document specifies the measurement data output formats for devices
    used in general ophthalmic examiniations, including the following modalities:
    —    Refractometer (REF)   Refraction —    Keratometer (KM)        Corneal curvature
    —    Tonometer (TM)            Intraocular pressure —    Lensmeter (LM)             Spectacle
    lens power —    Phoroptor (PHOR)         Visual acuity This document only addresses
    text-based device reporting of ophthalmic examination device data (OEDD). Images
    generated as needed during an ophthalmic examination are outside the scope of
    this document.'
