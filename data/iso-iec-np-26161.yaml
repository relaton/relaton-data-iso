abstract:
- language: en
  script: Latn
  content: This document specifies the user interfaces (UIs) for automatic speech translation systems across multiple scenarios. The scenarios addressed in this document are characterized by different numbers of communication participants acting as sources and receivers, including one-to-one, one-to-many, many-to-one, many-to-many.
