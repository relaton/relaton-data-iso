abstract:
- language: en
  script: Latn
  content: This document specifies test methods for metric self-locking nuts with
    MJ threads intended for use in aerospace applications at maximum operating temperature
    greater than 425 °C. It describes the test device and the method for each test.
    It applies to self-locking nuts as defined above, provided that the relevant documents
    (dimensional standard, product standard, drawing, procurement specification, etc.)
    refer to this document.
