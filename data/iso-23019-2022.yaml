abstract:
- language: en
  script: Latn
  content: This document specifies requirements for railway driving simulators for
    drivers' training. It defines the minimum functions and performances for a driver
    training simulator. This document is applicable to all guided transport systems,
    including for mainlines, metros, tramways and light rails, as part of public/private
    transport systems. These vehicles are intended for the operation of intercity,
    urban and suburban passenger or freight services with self-propelled systems and
    operated on either segregated or not segregated paths. Annexes A to D provide
    additional information.
