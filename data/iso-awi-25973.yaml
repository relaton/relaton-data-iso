abstract:
- language: en
  script: Latn
  content: This document details the method for shear testing of metallic materials
    and procedure to obtain flow curve from this test. It is applicable to monotonous
    path for large strain and anisotropy characterizations and to reversed path for
    Bauschinger effect characterization. Fracture characterization is not considered.
    This standard is not intended nor for sandwich sheet with polymer and other materials
    except metals nor for assembly characterization (welding, bonding, riveting…).
