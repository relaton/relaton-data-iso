abstract:
- language: en
  script: Latn
  content: This document deals with the energetic consideration and improvement of
    pneumatic distribution network. Before applying this standard, the system should
    be designed properly and according to good engineering practice/state of the art.
    This document provides general procedures and calculation methods for assessing
    the energy efficiency of compressed air distribution network. The consideration
    of this part focuses on the transmission power circuits to assist the system designer
    in the design stage or in the rebuilding stage of the pneumatic system.
