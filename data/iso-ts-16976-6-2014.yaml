abstract:
- language: en
  script: Latn
  content: ISO/TS 16976-6:2014 provides information on the psycho-physiological effects
    related to the wearing of respiratory protective devices (RPD) and it is intended
    for the preparation of standards for selection and use of RPD. It specifies for
    the writers of RPD standards, principles relating to the interaction between RPD
    and the human physiological and psychological perception, the acceptance by the
    wearer, and the need for training to improve acceptance of the RPD by the wearer.
    ISO/TS 16976-6:2014 does not cover requirements related to the specific hazard
    for which the RPD is designed.
