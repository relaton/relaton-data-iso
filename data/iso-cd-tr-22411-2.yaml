abstract:
- language: en
  script: Latn
  content: This document provides ergonomic design considerations and related knowledge
    on human abilities for use in the application of ISO/IEC Guide 71:2014 as a supporting
    document for the Guide. The intention underlying is to help standards developers
    and designers of products, services, environments use the Guide71 to implement
    accessibility into their developing standards or designing products etc by providing
    further necessary information. The contents of this document are closely related
    to those in ISO/IEC Guide 71:2014 with more elaborated and updated information
    on design considerations and human abilities. Some of the information is based
    on the human data part of the 2nd edition of the ISO/TR 22411:2021 (part 1). Design
    considerations are mostly adopted from ISO/TR 22411:2008 (1st edition) to retain
    its relevant information while adding more information currently available on
    accessible design. Examples of good practice are also included, which are popular
    as accessible design in our current daily lives.
