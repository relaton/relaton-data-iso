abstract:
- language: en
  script: Latn
  content: 'This document specifies the determination of the concentration of alkanolamines
    in biomethane. The measurement method involves thermal desorption gas chromatography
    with flame ionization and/or mass spectrometry detectors (TD-GC-MS/FID). The described
    method is specifically developed for the analysis of five amine compounds, namely:
    —    monoethanolamine (MEA); —    diglycolamine (DGA); —    diethanolamine (DEA);
    —    N-methyldiethanolamine (MDEA); —    piperazine (PZ). Information about the
    compounds is given in Annex A.'
