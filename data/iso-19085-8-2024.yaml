abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and measures for wide
    belt sanding machines (defined in 3.1) and for surface treating machines (defined
    in 3.2) capable of continuous production use, altogether referred to as “machines”.
    This document deals with all significant hazards, hazardous situations and events,
    as listed in Annex A, relevant to the machines, when operated, adjusted and maintained
    as intended and under the conditions foreseen by the manufacturer, including reasonably
    foreseeable misuse. Transport, assembly, dismantling, disabling and scrapping
    phases are also taken into account. This document is also applicable to machines
    fitted with one or more of the following devices/additional working units, whose
    hazards have been dealt with: —     transversal sanding unit; —     cleaning brushing
    unit; —     satining roller unit; —     disk brushing unit; —     texturing brushing
    roller unit; —     texturing brushing belt unit; —     cutterblock unit; —    
    texturing band saw unit; —     spiked roller unit; —     multi blade unit; —    
    conveyor directly controlled by the machine; —     additional workpiece vacuum
    clamping device; —     antistatic bar unit. NOTE 1        An antistatic bar is
    a device that eliminates electrostatic charges on the workpiece to ease its subsequent
    cleaning from dust by airflow. This document is also applicable to machines fitted
    with a laser engraving unit, but the specific hazards of this unit have not been
    dealt with. The machines are designed to process workpieces with flat surface
    and even thickness, in shape of panels or beams or frames, consisting of: a)      
    solid wood; b)       material with similar physical characteristics to wood (see
    ISO 19085-1:2021, 3.2); c)        gypsum boards, gypsum bounded fibreboards; d)      
    composite materials with core consisting of, e.g. polyurethane or mineral material;
    e)       composite boards made from the materials listed above; f)         all
    materials listed above, already lacquered. This document does not deal with hazards
    related to: —     specific devices other than those listed above; —     access
    through in-feed and out-feed openings of machines with a work piece height capacity
    greater than 700 mm; —     systems for powered loading or unloading, or both,
    of the workpiece to or from a single machine; NOTE 2        Loading the machine
    manually includes manually placing the workpiece onto a conveyor directly controlled
    by the machine. Unloading the machine manually includes manually removing the
    workpiece from a conveyor directly controlled by the machine. —     out-feed workpieces
    on machines with feed speed higher than 60 m/min; —     interfacing of the machine
    with any other machine. This document is not applicable to machines intended for
    use in a potentially explosive atmosphere and to machines manufactured prior to
    the date of its publication.'
