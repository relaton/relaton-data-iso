abstract:
- language: en
  script: Latn
  content: 'This document provides a range of options to measure the quality of hire
    that can be aligned to various business and organizational conditions. The QoH
    structure includes: — purpose; — formula; — definition; — how to use the metric:
    — intended users; — contextual factors for interpretation. This document excludes
    measuring the "Impact of Hire" and "Retention of Hire" as these are covered by
    separate technical specification documents. QoH is intended to be scalable to
    the needs of any organization regardless of size, industry or sector and is relevant
    to people with an interest in workforce planning, organizational design and development,
    talent management succession planning, recruitment and human capital reporting.'
