abstract:
- language: en
  script: Latn
  content: This International Standard specifies the general requirements for the
    design, installation, and testing of shaft generator systems installed on ships,
    with the objective of ensuring their safe and reliable operation. This document
    addresses the design and installation aspects of shaft generator systems, including
    the main system components such as shaft generators, power conversion devices,
    transformers, control and protection systems, as well as the requirements for
    their installation and integration within the ship’s propulsion shaft line and
    electrical power system. In addition, this document specifies test and evaluation
    requirements intended to verify operational stability, functional performance,
    and safety of shaft generator systems under defined operating conditions. This
    International Standard provides a common technical framework for the assessment
    and verification of shaft generator systems used as onboard electrical power sources.
