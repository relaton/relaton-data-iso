abstract:
- language: en
  script: Latn
  content: 'This Recommendation | International Standard provides the specification
    of management information within an Open System related to those operations of
    the OSI Physical Layer specified by the specifications in this Recommendation
    | International Standard. Specifics on how Physical Layer management is accomplished
    is beyond the scope of this Recommendation | International Standard. Physical
    Layer management is defined by specifying: ? the managed object class definition
    of Physical Layer Managed Objects following guidelines put forth by the Structure
    of Management Information (see ITU-T Recs. X.720 | ISO/IEC 10165-1 to X.723 |
    ISO/IEC 10165-5; ? the relationship of the Managed Objects and attributes to both
    the operation of the layer and to other objects and attributes of the layer; and
    ? the action type operations on the attributes of Physical Layer Managed Objects
    that are available to OSI Systems Management.'
