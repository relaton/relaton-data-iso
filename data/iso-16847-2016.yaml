abstract:
- language: en
  script: Latn
  content: ISO 16847:2016 specifies a method for assessing the matting appearance
    of the napped fabrics (fleece fabrics) tested, after one or several cleansing
    treatments. This method has been developed for use primarily with Type B domestic
    washing machines, as defined in ISO 6330, in the cleansing process. However, it
    is possible to use it with Type A machines, as defined in ISO 6330. This test
    method can be used for judging matting appearance after other cleansing processes.
