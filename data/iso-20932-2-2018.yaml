abstract:
- language: en
  script: Latn
  content: 'This document specifies the test methods which can be used to measure
    elasticity and related properties of fabrics when they undergo a deformation of
    their surface. Two methods are specified: a dynamic method (method A) and a static
    method (method B). This document does not apply to narrow fabrics. The results
    obtained cannot be compared. The choice of test method are agreed between parties
    and indicated in the test report.'
