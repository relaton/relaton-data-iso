abstract:
- language: en
  script: Latn
  content: 'This document defines a reference model for the visualization of natural
    environments in virtual environments. This work will: • Define a reference model
    to be used for representing, analysing and visualizing natural environmental data
    in virtual environments; • Define the functional components for representing,
    analysing, and visualizing natural environmental data in a virtual environment;
    • Specify a data model that defines the components and properties of natural environmental
    data for the representation and visualization of environmental phenomena; and
    • Provide use cases demonstrating the application of the reference model to domain-specific
    systems and information services. This document excludes the representation and
    visualization of built environments, synthetic environments, and other non-natural
    environments.'
