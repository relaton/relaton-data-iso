abstract:
- language: en
  script: Latn
  content: This document identifies good practice case studies of smart city responses
    to COVID-19 through the use of smart technologies, smart data, smart decision-making
    and smart ways of working. In particular, it aims to demonstrate how the principles
    for smart city operating models recommended in ISO 37106 can deliver improved
    outcomes in public-health emergency management (PHEM), at every stage of the command-and-control
    process for emergency management and incident response set out in ISO 22320. This
    document is intended to inform ISO 37113, which recommends a framework of good
    practices that can be used in responding to future public-health emergencies.
