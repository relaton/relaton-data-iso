abstract:
- language: en
  script: Latn
  content: This document specifies the symbols, i.e. conventional signs, used to identify
    certain controls, indicators and tell-tales on a motorcycle/moped[1] and to facilitate
    their usage. This document also indicates the colours of possible optical tell-tales
    which warn the rider of the operation or malfunctioning of the related devices
    and equipment. This document is applicable to those controls, indicators and tell-tales,
    which, when used, are fitted on the instrument panel or in the immediate vicinity
    of the motorcycle/moped rider. [1] "Motorcycle/moped" as defined in ISO 3833 but
    does not include a steering wheel type.
