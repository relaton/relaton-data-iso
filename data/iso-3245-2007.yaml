abstract:
- language: en
  script: Latn
  content: ISO 3245:2007 specifies the boundary dimensions and preferred dimensions
    to be used for drawn cup needle roller bearings without inner ring as well as
    the minimum chamfer dimension limits. Also specified are the closed end thickness
    dimensions for bearings with closed end drawn cups. In addition, dimensional tolerances
    and methods for checking the needle roller complement bore diameter are specified.
