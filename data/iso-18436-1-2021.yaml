abstract:
- language: en
  script: Latn
  content: This document specifies sector specific requirements for organizations
    ("certification body") operating conformity assessment systems for personnel who
    perform machinery system condition monitoring, identify machine faults, and recommend
    corrective action. Procedures for the certification of condition monitoring and
    diagnostic personnel are specified. NOTE            These requirements are in
    addition to those of ISO/IEC 17000 and ISO/IEC 17024.
