- language: en
  script: Latn
  content: 'This standard will include the following: - approaches to support quality
    engineering, such as processes, methods, techniques, measures and tools, at an
    enterprise, project, product and team level; - how quality engineering applies
    to life cycle processes; - the relationship between quality engineering, software
    engineering, systems engineering, quality assurance and testing; and - responsibilities,
    activities, tasks and documentation used in quality engineering. The standard
