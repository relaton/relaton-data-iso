abstract:
- language: en
  script: Latn
  content: 'This document specifies the test conditions for the determination of the
    tensile properties of monolayer flat fibre reinforced plastics, based upon the
    general principles given in ISO 527-1. The methods are used to investigate the
    tensile behaviour of the test specimens and for determining the tensile strength,
    tensile modulus under the defined conditions when loaded in fibre direction. The
    test method is suitable for use with monolayer materials made of fibre-reinforced
    thermosetting and thermoplastic composites incorporating preimpregnated materials
    (prepregs). The monolayer has a unidirectional (e.g. tapes) or multidirectional
    (e.g. fabric) reinforcement. The reinforcement fibres covered include glass fibres,
    carbon fibres, aramid fibres and other similar synthetic or natural fibres. Two
    methods are described (A: Reduced force clamping, B: Parallel clamping)'
