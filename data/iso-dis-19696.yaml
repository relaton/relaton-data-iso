abstract:
- language: en
  script: Latn
  content: This International Standard specifies a test method for mechanical properties
    of electrical insulation material of superconducting magnet, the main electrical
    insulation material is polymer matrix composites with fibre glass reinforced.
    The composite materials include glass fiber and resin, or sometimes include polyimide
    tape. This test method is including tensile strength, short beam shear strength,
    compression shear strength, push-out strength, etc.
