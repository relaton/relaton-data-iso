abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of inulin-type fructans
    (including oligofructose, fructooligosaccharides) in infant formula and adult
    nutritionals (both powder and liquid) containing 0,03 g/100 g to 5,0 g/100 g of
    fructans in the product as prepared ready for consumption. The method has been
    validated in a multi laboratory study[1] with reconstituted standard reference
    material (SRM), infant/adult nutritional formula at a level of 0,204 g/100 g,
    adult nutritionals ready-to-feed (RTF) at levels of 1,28 g/100 g and 2,67 g/100
    g, infant formula RTF at a level of 0,300 g/100 g, reconstituted follow-up formula
    at levels of 0,209 g/100 g to 0,275 g/100 g, reconstituted infant formula at levels
    from 0,030 8 g/100 g to 0,264 g/100 g. During the single laboratory validation
    study[2], spike-recovery experiments were performed up to 5 g/100 g in reconstituted
    infant formula powders (milk-based, partially hydrolysed milk-based and soy-based),
    adult nutritional RTF and reconstituted adult nutritional powders.
