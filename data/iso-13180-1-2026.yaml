abstract:
- language: en
  script: Latn
  content: This document specifies a test method for evaluating direct tensile resistance
    of strain hardening fibre-reinforced cementitious composites (FRCCs) using tensile
    parameters. This test method provides tensile stress versus strain curve, first
    cracking strength, post cracking strength, strain capacity (strain at post cracking
    point), and the number of cracks within gauge length. This test method is primarily
    intended for use with FRCCs that exhibit strain hardening behaviour. This test
    method is not intended for materials that exhibit strain-softening behaviour.
