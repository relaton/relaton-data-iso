abstract:
- language: en
  script: Latn
  content: 'The document creates a common language that embeds records management
    concerns and requirements into enterprise architecture with the twin goals of
    building consensus — among records managers, enterprise architects and solution
    architects, and — across the domains of records management, enterprise architecture
    and solution architecture. NOTE This common understanding of Records Management
    enables Enterprise Architects to understand the motivations, concerns and goals
    of Records Managers, recognize them as influential key business stakeholders during
    organizational transformation, and use this understanding to influence systems
    planning and design. As a result, Records Management becomes an organizational
    capability at governance, strategic and operational levels. This document provides
    a records management viewpoint, with architecture principles and corresponding
    architectural views of records. It explains records management for enterprise
    architects and other related professionals, so that they can achieve the competency
    needed to support collaborative initiatives. This document provides support to
    enterprise architects in areas including: — understanding and identifying records
    management principles, goals and requirements significant for the architectural
    representation, — facilitating consultations with records managers during the
    project lifecycle, — identifying opportunities to reuse existing records management
    analyses and tools. This document provides scenarios and models for solution architects
    and those who have responsibility for infrastructure overview. This document also
    provides a common language to records managers for collaboration with enterprise
    architects to position records management requirements in the architecture development
    process.'
