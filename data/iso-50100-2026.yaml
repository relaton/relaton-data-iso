abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and provides guidance that enable
    an organization to reduce its energy-related greenhouse gas (GHG) emissions (ERGE).
    This document is applicable: to any organization regardless of its type, size,
    complexity, geographical location, organizational culture or the products and
    services it provides; to energy-related Scope 1 emissions and Scope 2 emissions;
    irrespective of the quantity, use or types of energy consumed. This document requires
    demonstration of absolute ERGE reduction aligned with ERGE target(s). Annex A
    provides information on the relationship between ISO 50001:2018 and this document.
    Annex B provides information on GHG emissions and GHG emission factors. Annex C
    provides guidance related to the decarbonization planning.'
