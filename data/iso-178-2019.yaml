abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for determining the flexural properties
    of rigid and semi-rigid plastics under defined conditions. A preferred test specimen
    is defined, but parameters are included for alternative specimen sizes for use
    where appropriate. A range of test speeds is included. The method is used to investigate
    the flexural behaviour of the test specimens and to determine the flexural strength,
    flexural modulus and other aspects of the flexural stress/strain relationship
    under the conditions defined. It applies to a freely supported beam, loaded at
    midspan (three-point loading test). The method is suitable for use with the following
    range of materials: — thermoplastic moulding, extrusion and casting materials,
    including filled and reinforced compounds in addition to unfilled types; rigid
    thermoplastics sheets; — thermosetting moulding materials, including filled and
    reinforced compounds; thermosetting sheets. In agreement with ISO 10350-1[5] and
    ISO 10350-2[6], this document applies to fibre-reinforced compounds with fibre
    lengths ≤7,5 mm prior to processing. For long-fibre-reinforced materials (laminates)
    with fibre lengths >7,5 mm, see ISO 14125[7]. The method is not normally suitable
    for use with rigid cellular materials or sandwich structures containing cellular
    material. In such cases, ISO 1209-1[3] and/or ISO 1209-2[4] can be used. NOTE
    1 For certain types of textile-fibre-reinforced plastic, a four-point bending
    test is used. This is described in ISO 14125. The method is performed using specimens
    which can be either moulded to the specified dimensions, machined from the central
    section of a standard multipurpose test specimen (see ISO 20753) or machined from
    finished or semi-finished products, such as mouldings, laminates, or extruded
    or cast sheet. The method specifies the preferred dimensions for the test specimen.
    Tests which are carried out on specimens of different dimensions, or on specimens
    which are prepared under different conditions, can produce results which are not
    comparable. Other factors, such as the test speed and the conditioning of the
    specimens, can also influence the results. NOTE 2 Especially for injection moulded
    semi-crystalline polymers, the thickness of the oriented skin layer, which is
    dependent on the moulding conditions, also affects the flexural properties. The
    method is not suitable for the determination of design parameters but can be used
    in materials testing and as a quality control test.'
