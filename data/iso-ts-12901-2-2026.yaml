abstract:
- language: en
  script: Latn
  content: This document establishes and gives guidance on the use of a control banding
    approach for controlling the risks associated with occupational exposures to nano-objects
    and their aggregates and agglomerates greater than 100 nm (NOAA), even if knowledge
    regarding their toxicity and quantitative exposure estimations is limited or lacking.
    This document applies to inhalation control, for which the control banding tool
    is specifically designed. NOTE            Some guidance for skin and eye protection
    is given in ISO/TS 12901-1. This document does not apply to materials of biological
    origin. This document is intended to help businesses and others, including research
    organizations engaged in the manufacturing, processing, or handling of NOAA, by
    providing an easy-to-understand, pragmatic approach to controlling occupational
    exposures.
