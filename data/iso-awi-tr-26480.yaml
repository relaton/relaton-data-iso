abstract:
- language: en
  script: Latn
  content: This document describes the types, positions and functions of the rider-operated
    controls for driving backwards on a motorcycle/moped, in order to facilitate use.
    This document applies to controls for driving backwards which, when fitted, are
    commonly used by the rider of a motorcycle/moped. The definition or specification
    of a control does not signify the mandatory presence of each and every control
    listed in this document on a vehicle.
