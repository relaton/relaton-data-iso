abstract:
- language: en
  script: Latn
  content: ISO 9972:2015 is intended for the measurement of the air permeability of buildings or parts of buildings in the field. It specifies the use of mechanical pressurization or depressurization of a building or part of a building. It describes the measurement of the resulting air flow rates over a range of indoor-outdoor static pressure differences. ISO 9972:2015 is intended for the measurement of the air leakage of building envelopes of single-zone buildings. For the purpose of this International Standard, many multi-zone buildings can be treated as single-zone buildings by opening interior doors or by inducing equal pressures in adjacent zones. ISO 9972:2015 does not address evaluation of air permeability of individual components.
