abstract:
- language: en
  script: Latn
  content: This document specifies the test methods and minimum performance requirements
    for evaluating the functional reliability of telescopic ladders made of fiber-reinforced
    plastics under low-temperature conditions (ranging from -40 °C to -10 °C). This
    document is applicable for verifying the safety and performance of telescopic
    ladders after storage and use in low-temperature environments (-40 °C to -10 °C),
    covering mechanical functions, structural integrity, and operational safety.
