abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and test methods for plastics
    piping systems intended to be used for the renovation of underground gas supply
    networks. It is applicable to pipes and fittings, as manufactured, as well as
    to the installed lining system. It is not applicable to the existing pipeline
    or any sprayed coatings or annular filler. This document gives the general requirements
    common to all relevant renovation techniques.
