abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the fat acidity
    of milled cereal products. It is applicable to flours and semolinas obtained from
    wheat and durum wheat, and to pasta. NOTE This document appears to be applicable
    also to grains, flours and semolinas obtained from maize, and rye flour and oat
    flakes, but a further interlaboratory test is necessary before confirming this
    extension of the field of application.
