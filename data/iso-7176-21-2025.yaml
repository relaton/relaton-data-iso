abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for electromagnetic
    emissions and for electromagnetic immunity of electrically powered wheelchairs
    and scooters, intended for indoor or outdoor use, or both, by people with disabilities.
    It is also applicable to manual wheelchairs with an add-on power kit. It is not
    applicable to vehicles designed to carry more than one person. This document also
    specifies requirements and test methods for the electromagnetic compatibility
    of battery chargers intended for use with electrically powered wheelchairs and
    scooters. A reference configuration is specified for adjustable wheelchairs and
    scooters in order to enable test results to be used for comparison of performance.
