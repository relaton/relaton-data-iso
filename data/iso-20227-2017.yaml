abstract:
- language: en
  script: Latn
  content: ISO 20227:2017 specifies a method for the determination of the inhibition
    of the growth of the first fronds of Spirodela polyrhiza germinated from turions,
    by substances and mixtures contained in water or waste water, including treated
    municipal waste water and industrial effluents. The test is also applicable to
    pure chemicals and in particular, plant protection products and pesticides.
