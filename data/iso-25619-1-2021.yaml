abstract:
- language: en
  script: Latn
  content: This document specifies index test methods for determining the compressive
    creep properties of geosynthetic products. The test specimens are subjected either
    to normal compressive loading or to a combination of normal compressive loading
    and shear loading. The test method with a normal load only (see Clause 5) is the
    standard method. The test method in which combined normal and shear loads are
    applied (see Clause 6) is intended for products that are sensitive to shear failure,
    i.e. which have a columnar or cuspated structure. The tests are carried out on
    dry specimens or on specimens immersed in water. The test is intended to be carried
    out with the specimen immersed in water when any part of the geosynthetic product
    contains a hydrophilic polymer.
