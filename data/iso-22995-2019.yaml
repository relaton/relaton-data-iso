abstract:
- language: en
  script: Latn
  content: This document specifies a method to determine cloud point using a step-wise
    cooling technique that is executed by means of automated equipment types with
    optical detection mode. The method is applicable to distillate fuels, fatty-acid
    methyl esters (FAME) and paraffinic diesel fuels, including blends thereof, as
    well as those containing flow-improvers or other additives, intended for use in
    diesel engines and domestic heating installations. The method can be applied to
    other products such as vegetable oils or lubricants, but these kinds of products
    have not been evaluated during the interlaboratory study (ILS), no precision data
    are available.
