abstract:
- language: en
  script: Latn
  content: This document specifies testing conditions for use when constructing a
    forming-limit curve (FLC) at ambient temperature and using linear strain paths.
    The material considered is flat, metallic and of thickness between 0,3 mm and
    4 mm. NOTE The limitation in thickness of up to 4 mm is proposed, giving a maximum
    allowable thickness to the punch diameter ratio.
