abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for factory made, self-supporting, double skin metal‑faced insulating sandwich panels where the insulating core materials are intended to be but not limited to cellular plastics and mineral wool as defined below. The sandwich panels are intended for discontinuous laying in the following applications: roofs and roof cladding; external walls and wall cladding. The insulating core materials covered by this document are rigid polyurethane foam (PUR), polyisocyanurate foam (PIR), expanded polystyrene foam (EPS), extruded polystyrene foam (XPS), phenolic foam (PF) and mineral wool. Sandwich panels with edge details that utilize different materials from the main insulating core are included in this document. Sandwich panels used in outdoor cold storage applications are included in this document. This document does not cover the following: sandwich panels with a declared thermal conductivity for the insulating core material greater than 0,06 W/m·K at 10 °C, or greater than 0,06 W/m·K at 23 °C; sandwich panels consisting of two or more clearly defined layers of different insulating core materials (multi-layered); sandwich panels consisting of more than one metal sheet per face; sandwich panels with perforated facing(s); curved sandwich panels; indoor cold storage applications.'
