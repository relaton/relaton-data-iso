abstract:
- language: en
  script: Latn
  content: This document specifies the design of arc-shaped tube specimens, fixtures,
    and fatigue testing methods for uniaxial fatigue performance evaluation. A stress
    mapping coefficient k is introduced to characterize the mapping relationship between
    the fatigue performance of individual tubes and that of tube assemblies. The proposal
    provides a unified basis and guidance for characterizing and decoupling the fatigue
    performance of small-diameter, thin-walled metallic tubes.
