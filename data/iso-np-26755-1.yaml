abstract:
- language: en
  script: Latn
  content: 'technology into industrial production, but also a process for new business
    being created by the integration. The purpose of the transformation is to improve
    productivity and resource allocation, thus achieve sustainable industry. The purposes
    of this document include is to provide industrial enterprises guidance for: —assessing
    the current situation of DX; —finding weakness within the DX; —identifying ways
    to improve DX. The intended users of this document can be grouped into the following
    categories: —independent third-party, e.g. a consulting company or government
    department, that assesses the maturity of DX; —organization in charge of production
    management department, quality management department, inventory management department,
    etc., which sponsors an assessment of itself or a subordinate organization; —any
    other enterprises who have interest in digital transformation.'
