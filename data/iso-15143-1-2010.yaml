abstract:
- language: en
  script: Latn
  content: ISO 15143-1:2010 specifies system architecture for the exchange of data
    related to the use of earth‑moving machinery, as defined in ISO 6165, and mobile
    road construction machinery, as defined in ISO 22242 when used for work similar
    to earth-moving, in worksite data‑controlled construction operations. It also
    gives definitions of terms related to worksite data exchange. It covers only the
    application layer of the OSI reference model according to ISO/IEC 7498-1, and
    does not cover the presentation, session, transport, network, data link or physical
    layers of the model. Specific agreement (selection of applicable specifications,
    standards, etc.) relating to those layers will therefore be needed if data exchange
    is to be facilitated.
