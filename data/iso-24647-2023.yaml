abstract:
- language: en
  script: Latn
  content: This document specifies the necessary system hardware components, the characteristics,
    the component requirements and conditions for the application of robotic ultrasonic
    test systems. This document specifies the general requirements and acceptance
    criteria for robotic ultrasonic test systems. This document is applicable to robotic
    ultrasonic test systems composed of one or more robot(s). Some of the characteristics
    of a robot ultrasonic testing system can be application-specific. This document
    is applicable to conventional straight-beam probes and immersion technique. This
    document is also applicable for phased array equipment, but additional tests can
    be necessary.
