abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for the powered wheelchairs
    systems associated with automated driving functions employing intended performance
    of sensing, planning and action without human intervention in wheelchair driving
    tasks. This document provides a classification for levels of automated driving
    functions and their intended performance associated with the levels of automated
    driving functions, and test methods to verify the automated driving functions.
