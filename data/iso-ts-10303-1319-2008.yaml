abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1319:2008 specifies the application module for Solid with
    local modification. The following are within the scope of ISO/TS 10303-1319:2008:
    3D solid models; axis placements; solid models modified by the application of
    operations to their edges; solid models with constant radius edge blends; solid
    models with variable radius edge blends; solid models with chamfers; solid models
    modified by the creation of positioned and oriented local shape configurations
    (`features''); surfaces, faces and connected assemblies of faces; solid models
    modified by the application of operations to their faces; solid models modified
    by the removal of material from one side of an intersecting generalised surface;
    solid models modified by adding material to, or subtracting material from, existing
    faces via offsets; solid models modified by the deletion of some faces and the
    addition of material to the remaining faces; solid models with depressions; solid
    models with protrusions; solid models with circular or rectangular patterns made
    up of replicates of previously created depressions, protrusions or patterns; solid
    models with circular or rectangular patterns in which some replicates have been
    suppressed; items within the scope of application module Basic geometric topology,
    ISO/TS 10303-1323; items within the scope of application module Procedural solid
    model, ISO/TS 10303-1318; items within the scope of application module Topologically
    bounded surface, ISO/TS 10303-1511.'
