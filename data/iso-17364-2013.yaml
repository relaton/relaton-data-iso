abstract:
- language: en
  script: Latn
  content: This International Standard defines the basic features of RFID for use
    in the supply chain when applied to returnable transport items (RTIs). In particular
    it — provides specifications for the identification of the RTI and the returnable
    packaging item (RPI), — makes recommendations about additional information on
    the RF tag, — specifies the semantics and data syntax to be used, — specifies
    the data protocol to be used to interface with business applications and the RFID
    system, — specifies the minimum performance requirements, — specifies the air
    interface standards between the RF interrogator and RF tag, and — specifies the
    reuse and recyclability of the RF tag.
