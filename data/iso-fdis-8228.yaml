abstract:
- language: en
  script: Latn
  content: 'The standard is applicable to the toxicological evaluation and classification
    of chemical pollutants in sludge/biosolids for land application including aerobic
    compost sludge, anaerobic digestion sludge, sludge-based biochar, etc. In particular,
    in this document: (1) The food chain agricultural application mainly refers to
    the use of sludge in crop farms that enter the human food chain, such as grain,
    corn, and vegetables. (2) The non-food chain agricultural application mainly refers
    to the use of sludge in any land/soil from which the plants grown up without entering
    the human food chain, such as energy crops and fibre crops. (3) Landscape application
    includes human-accessible and human-inaccessible area. (4) Sandy soil and exposed
    mine remediation application include remediation of sandy soil and remediation
    of mines. (5) The procedure of sludge classification will be provided.'
