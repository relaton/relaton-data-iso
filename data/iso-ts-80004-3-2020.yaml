abstract:
- language: en
  script: Latn
  content: This document defines terms related to carbon nano-objects in the field
    of nanotechnologies. It is intended to facilitate communication between organizations'
    and individuals' research, industry and other interested parties and those who
    interact with them. Additional terms and definitions for graphene and two-dimensional
