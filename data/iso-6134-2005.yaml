abstract:
- language: en
  script: Latn
  content: ISO 6134:2005 specifies requirements for two types of hose and hose assembly,
    low pressure with a maximum working pressure of 6 bar and high pressure with a
    maximum working pressure of 18 bar, made of rubber with hose fittings made of
    metal, designed to convey saturated steam and hot water condensate. Each type
    is divided into two classes having either an oil-resistant or a non-oil-resistant
    cover. Information is also given on the frequency of testing of such hose assemblies
    in use and storage.
