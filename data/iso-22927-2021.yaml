abstract:
- language: en
  script: Latn
  content: This document specifies requirements and recommendations for the packaging
    and labelling of rare earth ores, concentrates, compounds, metals and alloys that
    are intended for sale or free distribution. It defines the performance and structure
    of packaging, and specifies the information to include on the labelling. These
    requirements and recommendations are designed to ensure quality assurance, enhance
    safety and prevent environmental pollution during the transportation and storage
    of rare earth products. This document is applicable to packaging and labelling
    during transactions between companies. It does not include packaging by companies
    during storage in their own plant. The method of labelling defined in this document
    enhances safety by indicating properties of rare earth products and ensures appropriate
    management of the product by indicating the identity of suppliers.
