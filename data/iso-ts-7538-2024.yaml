abstract:
- language: en
  script: Latn
  content: 'This document identifies the purpose and benefits of disposition and provides
    organizations with guidance about how to manage disposition-related processes.
    In particular, it: —     specifies responsibilities for records disposition processes;
    —     provides guidance on the key areas against which records disposition processes
    can be assessed; —     provides requirements and guidance for those implementing
    disposition processes; and —     provides guidance on how to integrate records
    disposition processes into an organization’s operations.'
