abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1796:2019 specifies the application module for Kinematic
    motion representation. The following are within the scope of ISO/TS 10303-1796:2019:
    definition of a kinematic motion as a sequence of discretised positions and orientations;
    definition of motion of one or several objects in 3D space along paths, coordinated
    by a parameter; items within the scope of application module B spline geometry,
    ISO/TS 10303-1801; items within the scope of application module Contextual shape
    positioning, ISO/TS 10303-1027; items within the scope of application module Kinematic
    state, ISO/TS 10303-1798; items within the scope of application module Parametric
    representation, ISO/TS 10303-1813.'
