abstract:
- language: en
  script: Latn
  content: This document provides procedures for monitoring the dose to the skin,
    the extremities, and the lens of the eye. It gives guidance on how to decide if
    such dosemeters are needed and to ensure that individual monitoring is appropriate
    to the nature of the exposure, taking practical considerations into account. This
    document specifies procedures for individual monitoring of radiation exposure
    of the skin of the body, extremities (skin of the hands, fingers, wrists, forearms
    including elbow, lower leg including patella, feet and ankles), and lens of the
    eye in planned exposure situations. It covers practices which involve a risk of
    exposure to photons in the range of 8 keV to 10 MeV, electrons and positrons in
    the range of 0,07 MeV to 1,2 MeV mean beta energies being equivalent to 0,22 MeV
    and 3,6 MeV beta maximum energy - in accordance to the ISO 6980 series, and neutrons
    in the range of thermal to 20 MeV. This document gives guidance for the design
    of a monitoring programme to ensure compliance with legal individual dose limits.
    It refers to the appropriate operational dose quantities, and it gives guidance
    on the type and frequency of individual monitoring and the type and positioning
    of the dosemeter. Finally, different approaches to assess and analyse skin, extremity,
    and lens of the eye doses are given. It is not in the scope of this document to
    consider exposure due to alpha radiation fields. NOTE 1        The requirements
    for the monitoring of the occupational exposure may be given in national regulations.
    NOTE 2        Dose to the lens of the eye due to intake of tritium is not in the
    scope of this document. Moreover, the situation of the workers that work in contaminated
    atmosphere and can have alpha and/or radon eye lens dose is also not in the scope.
