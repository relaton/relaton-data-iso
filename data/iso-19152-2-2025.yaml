abstract:
- language: en
  script: Latn
  content: 'This document: —     defines a reference land administration domain model
    (LADM) covering basic information-related components of land registration (including
    elements above and below the surface of the Earth); —     provides an abstract,
    conceptual model with three packages and one sub-package related to: —    parties
    (people and organizations); —    basic administrative units, rights, responsibilities
    and restrictions (RRRs); —    spatial units (parcels, and the legal space of buildings
    and utility networks and other geometry) with a sub-package on surveying and spatial
    representation (geometry and topology); —     provides terminology for land administration
    (LA), based on various national and international systems, that is as simple as
    possible in order to be useful in practice. The terminology allows a shared description
    of different formal or informal practices and procedures in various jurisdictions;
    —     provides a platform for comparison and monitoring that is based on indicators;
    —     provides a basis for national and regional profiles; and —     enables the
    combination of land administration information from different sources in a coherent
    manner. The following is outside the scope of this document: —     interference
    with (national) land administration laws with potentially legal implications;
    and —     construction of external databases with party data, address data, land
    cover data, physical utility network data, archive data and taxation data. However,
    the LADM provides stereotype classes for these data sets to indicate which data
    set elements the LADM expects from these external sources, if available. This
    document provides the concepts and the detailed structure for standardization
    in the land administration domain.'
