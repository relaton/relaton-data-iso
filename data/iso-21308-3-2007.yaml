abstract:
- language: en
  script: Latn
  content: ISO 21308-3:2007 provides codes for the exchange of general, mass and administrative
    information. It applies to commercial vehicles, as defined in ISO 3833, having
    a maximum gross vehicle mass above 3 500 kg. The process of exchanging the above
    information can involve the chassis manufacturer,the chassis importer,the chassis
    dealer,one or more bodywork manufacturers, andbodywork component suppliers, e.g.
    manufacturers of demountable bodies, cranes and loading equipment, tipping equipment.
