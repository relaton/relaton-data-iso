abstract:
- language: en
  script: Latn
  content: ISO 10972-5:2006 establishes the particular requirements relating to mechanisms
    for bridge and gantry cranes as defined in ISO 4306-1. The general requirements
    for mechanisms for cranes are given in ISO 10972-1. These particular requirements
    concern the general layout and design of mechanisms, the selection and/or design
    requirements of components and the instructions for manufacturing, mounting, installation
    and testing. Rules for proof of competence calculations regarding different limit
    states (yield strength, fatigue, wear) are excluded from ISO 10972-5:2006.
