abstract:
- language: en
  script: Latn
  content: 'This document specifies a test procedure to confirm that the force necessary
    to pull the anchorage of a rail fastening assembly out of the sleeper or other
    supporting element is greater than a prescribed value (i.e. it is a "proof load"
    test). This test is for components of the fastening system which are: a) cast
    into concrete during the manufacture of sleepers or other supporting elements;
    b) glued into the cast or drilled holes in concrete; or c) screwed or otherwise
    attached to wood, polymeric composite or steel sleepers or other supporting elements.
    This test is not applicable to embedded rails.'
