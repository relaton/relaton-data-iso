abstract:
- language: en
  script: Latn
  content: This document specifies the elements, among those defined in XAdES digital
    signatures, that enable verification of a digital signature over a long period
    of time. It does not give new technical specifications about the digital signature
    itself, nor new restrictions of usage of the technical specifications about the
    digital signatures which already exist. NOTE      XAdES digital signatures is
    the widely-used extended specification of “XML-Signature Syntax and Processing”.
