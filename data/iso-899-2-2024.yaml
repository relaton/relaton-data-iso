abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the flexural creep of
    plastics in the form of standard test specimens under specified conditions such
    as those of pre-treatment, temperature and humidity. It is only applicable to
    a simple freely supported beam loaded at mid-span (three-point-loading test).
     The method is suitable for use with rigid and semi-rigid non-reinforced, filled
    and fibre-reinforced plastics materials (see ISO 472 for definitions) test specimens
    moulded directly or machined from sheets or moulded articles. NOTE           
    The method can be unsuitable for certain fibre-reinforced materials due to differences
    in fibre orientation The method is intended to provide data for engineering-design,
    quality control, research and development purposes. The method might not be applicable
    for determining the flexural creep of rigid cellular plastics (attention is drawn
    in this respect to ISO 1209-1 and ISO 1209-2).
