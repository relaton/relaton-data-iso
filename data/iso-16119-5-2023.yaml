abstract:
- language: en
  script: Latn
  content: This document specifies requirements and the means for their verification
    for the design and performance of aerial fixed wing and rotary aircraft spray
    systems for agriculture, forestry, turf, and vegetation control in transport access
    ways (such as gas and electric lines) with regard to minimizing the potential
    risk of environmental contamination during use, including misuse foreseeable by
    the manufacturer. It is intended to be used with ISO 16119-1:2013, which gives
    general requirements common to all the sprayer types covered by ISO 16119. When
    requirements of this document are different from those stated in ISO 16119-1:2013,
    the requirements of this document take precedence over the requirements of ISO 16119-1:2013
    for machines within the scope of this document. This document does cover safety
    of aerial spray equipment not covered by ISO 4254 series. This document is not
    applicable to sprayers manufactured before the date of its publication, or unmanned
    aerial vehicles (such as drones).
