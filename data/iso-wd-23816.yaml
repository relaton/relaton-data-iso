abstract:
- language: en
  script: Latn
  content: 'This secured ship network based on IPv6 Ethernet network contains the
    minimum requirements for the implementation of the secured interconnection of
    marine electronic equipment on board the ship. This standard will support connectivity
    and data transfer to and from all existing international standards and industrial
    standards about ship network interfaces such as IEC 61162-450 and Modbus TCP based
    on IPv4 Ethernet network. Utilizing IPv6 allows this standard to provide robust,
    secure and huge amount of data communication on ship, between ship to ship, ship
    to shore and shore to ship. It supports bi-directional data communication between
    multi-talker and/or multi-listeners at a speed of 100MB to 10GB/sec. This NP (Secured
    Ship Network based on IPv6 Ethernet network) covers interfacing and connection
    of all ship systems including bridge equipment, engine, cargo and other ship systems.
    Equipment designed to this standard will have the ability to share data, including
    command and status between ship and shore, ship to ship and shore to ship and
    the network of IPv4 only and IPv6 only. This NP provides faster transmission of
    data with inherently improved protection against cyberattacks with message authentication,
    confidentiality and integrity with data encryption. Cyber Security built-n from
    the beginning not a 3rd party add-on. Smart Shipping in concert with E-Navigation
    and Autonomous ship is being developed globally. Further, advancements to Information
    and Communication Technology (ICT) are being made to enhance navigation safety,
    improve protection of the sea environment, expand economic opportunities and optimize
    the commerce of the shipping industry. Successful implementation of Smart Shipping,
    e-Navigation and Autonomous ship includes: information exchange between ship and
    shore; ship automation using advanced technologies such as Internet of Things
    (IoT), Ocean of Things (OoT) and Machine to Machine (M2M); situational awareness
    and remote ship infrastructure monitoring and control by streaming and image data
    from the Radar and CCTV; big data analysis for optimal ship operation and cyber
    security for protection of data. Big data analytics can provide fault diagnosis
    and predictive maintenance of engines, systems and equipment. Whole these technologies
    are able to be implemented under assumption of secure network operation and fast
    data exchange. An IPv6 network infrastructure supports the future needs of big
    data transfer between ship and shore. IPv6 was developed from the onset to provide
    enhancements to IPv4 resulting in a more robust, secure, and extensible protocol,
    including native Quality of Service (QoS) functionality. IPv6 marine electronic
    equipment is being developed in the recreational and light commercial maritime
    industry. To integrate big data, secure communication, and safe navigation between
    ship to ship, ship to shore, and shore to ship, vessels of all sizes including
    SOLAS class ships will need IPv6. The various use cases of IPv6 in maritime industries
    was illustrated by the activity of study group established under ISO TC8 WG10
    and identified to be matured enough in equipment on board, VTS(Vessel Traffic
    Service), satellite communication, network infrastructure and in electronic chip
    set to be utilised for developing embedded system of equipment in maritime industries.'
