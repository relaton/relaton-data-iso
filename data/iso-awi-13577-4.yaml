abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for protective systems used in
    industrial furnaces and associated processing equipment (TPE). The functional
    requirements to which the protective systems apply are specified in ISO 13577-1
    ISO 13577-2 and ISO 13577-3. This document is not applicable to blast furnaces,
    converters (in steel plants), boilers, fired heaters (including reformer furnaces)
    in the petrochemical and chemical industries. This document is not applicable
    to electrical cabling and power cabling upstream of the TPE control panel/protective
    system. This document is not applicable to the protective systems manufactured
    before the date of its publication.
