abstract:
- language: en
  script: Latn
  content: 'This document describes two key experimental considerations when evaluating
    water insoluble nanoparticle (a kind of nanoproduct) performance of intracellular
    uptake in-vitro: In this document, two experimental considerations address the
    composition of the cell culture medium (with or without fetal bovine serum), and
    the cell culture method (2D and 3D cell culture). The NPs discussed in this report
    mainly refer to silica nanoparticles.'
