abstract:
- language: en
  script: Latn
  content: This document specifies a taxonomy and classification for smart contracts.
    It includes a taxonomy of smart contracts concepts, a taxonomy of smart contracts
    for DLT systems, and a taxonomy of smart contracts application domains, use case
    purposes, and economic activity sections. It also highlights smart contracts challenges
    and risks. The audience includes but is not limited to academics, architects,
    customers, users, tool developers, regulators, auditors and standards development
    organizations.
