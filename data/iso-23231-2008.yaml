abstract:
- language: en
  script: Latn
  content: ISO 23231:2008 specifies a test method for an accelerated procedure for
    determination of the dimensional change of fabrics which will then be made into
    garments or other end-use articles that will be laundered in a variety of settings.
    The procedure uses an apparatus with programmable settings that simulate multiple
    domestic or industrial laundering actions as well as wet processing operations
    in fabric manufacturing. This method is less suitable for heavy, tightly woven
    fabrics, such as denim, and fabrics with water-repellent finish. This method and
    the apparatus are not to be used to develop care labels. While ISO 23231:2008
    is intended to measure the same dimensional property as in ISO 5077, its application
    is as an accelerated test for use in a production environment.
