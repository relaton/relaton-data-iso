abstract:
- language: en
  script: Latn
  content: 'ISO/TR 8550-2:2007 provides guidance for acceptance sampling of products
    that are supplied in lots and that can be classified as consisting of discrete
    items (i.e. discrete articles of product). Each item in a lot can be identified
    and segregated from the other items in the lot and has an equal chance of being
    included in the sample. Each item of product is countable and has specific characteristics
    that are measurable or classifiable as being conforming or nonconforming (to a
    given specification). Standards on acceptance sampling by attributes are applicable
    to a wide variety of inspection situations. These include, but are not limited
    to, the following: end items, such as complete products or sub-assemblies; components
    and raw materials; services; materials in process; supplies in storage; maintenance
    operations; data or records; administrative procedures. Although ISO/TR 8550-2:2007
    is written principally in terms of manufacture and production, it is applicable
    to the selection of sampling systems, schemes and plans for all types of product
    and processes as defined in ISO 9000.'
