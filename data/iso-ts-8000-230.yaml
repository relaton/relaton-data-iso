abstract:
- language: en
  script: Latn
  content: 'This document specifies guidelines for cleansing data that are recorded
    by sensors as a stream of single, discrete digital values, based on quality characteristics
    and quality measures defined in ISO 8000-210 and 220, respectively. The following
    are within the scope of this document: — principles for sensor data cleansing;
    — the process of sensor data cleansing; — implementation requirements for sensor
    data cleansing; — cleansing methods for data anomalies; — examples of sensor data
    cleansing. The following are outside the scope of this document: — detailed algorithms
    or methods to detect and repair data anomalies.'
