abstract:
- language: en
  script: Latn
  content: This document specifies a method for evaluating the resistance of a lubricating
    grease to washout by water from a bearing, when tested at 38 °C or 79 °C under
    specified laboratory test conditions. This test method estimates the resistance
    of greases to washout from ball bearings under specified conditions. No formal
    correlation with field service has been established so far. This document is used
    for development and specification purposes. NOTE      For the purposes of this
    document, the term “% (m/m)” is used to represent the mass fraction.
