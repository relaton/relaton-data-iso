abstract:
- language: en
  script: Latn
  content: This document describes the technical requirements and testing methods
    for liquid hydrogen pumps used in hydrogen refueling station to meet high pressure
    onboard storage requirements which is typically with pressure of H35 or H70. The
    document is applicable to cryogenic reciprocating pump, including internal type
    and external type. The pump components include cold-end cylinder assembly, warm-end
    drive, and cold- and warm- end connection. The cold-end cylinder assembly consisting
    of key components such as the piston, piston rings, cylinder, and suction and
    discharge valves; through which the LH2 passes and is elevated in pressure. The
    warm-end drive is usually rated for the pressure and flow rate expected for the
    cold end, is used to drive the cold end and control the piston's forwards and
    backwards movements via a drive mechanism. The cold- and warm-end connection ensures
    both correct alignment and transmission of forces, and also ensures that any leakage
    of cryogenic liquid is kept away from the warm end. It is not applicable to liquid
    transfer pumps for fuelling liquid hydrogen vehicles.
