abstract:
- language: en
  script: Latn
  content: This document specifies the maximum electrical resistance of a conveyor
    belt and the corresponding test method. The test is intended to ensure that the
    belt is sufficiently conductive to avoid the accumulation of electrical static
    charge which can be developed during service use. This document is not suitable
    or applicable to light conveyor belts as described in ISO 21183-1, the static
    electrical properties of which are measured by ISO 21178.
