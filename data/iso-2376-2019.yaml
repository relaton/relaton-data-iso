abstract:
- language: en
  script: Latn
  content: This document specifies test methods for the determination of the breakdown
    voltage and withstand voltage of anodic oxidation coatings on aluminium and its
    alloys, on flat or near-flat surfaces and on round wire. The methods are applicable
    to anodic oxidation coatings used primarily as electrical insulators. The methods
    are not applicable to coatings in the vicinity of cut edges, the edges of holes,
    or sharp changes of angle on, for example, extruded shapes. NOTE 1 Breakdown voltage
    and withstand voltage are affected by relative humidity. NOTE 2 The methods described
    do not give satisfactory results for unsealed coatings because they are affected
    by the humidity in particular.
