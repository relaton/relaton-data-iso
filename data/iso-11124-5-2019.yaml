abstract:
- language: en
  script: Latn
  content: This document specifies requirements for 13 grades of cut steel wire abrasives,
    as supplied for blast-cleaning processes. It specifies ranges of particle sizes,
    together with corresponding grade designations. Values are specified for hardness,
    density, defect/structural requirements, metallographic structure and chemical
    composition. This document is suitable for cut steel wire supplied for blast-cleaning
    processes which is made by cutting new cold drawn wire. The requirements specified
    in this document apply to abrasives manufactured from virgin wire supplied in
    the new and unconditioned state only. They do not apply to abrasives either during
    or after use. NOTE 1 Information on commonly referenced national standards for
    cut steel wire abrasives and their approximate relationship with ISO 11124 is
    given in Annex A. NOTE 2 Although this document has been developed specifically
    to meet requirements for preparation of steelwork, the properties specified will
    generally be appropriate for use when preparing other material surfaces, or components,
    using blast-cleaning techniques.
