abstract:
- language: en
  script: Latn
  content: 'This document identifies: - principles for determining critical positions
    by using workforce segmentation approaches [see ISO 30409]; - measures to determine
    the impact of critical positions, and the performance of people hired into these
    positions, on organizational value creation and performance. This document is
    intended to be scalable to the needs of any organization regardless of size, industry
    or sector and is relevant to people with an interest in workforce planning; organizational
    design and development; talent management, succession planning, and recruitment;
    and metrics and human capital reporting.'
