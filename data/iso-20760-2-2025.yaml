abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for the management of centralized water
    reuse systems and water reuse applications in urban areas. This document addresses
    centralized water reuse systems in their entirety and is applicable to any water
    reclamation system component (e.g. source water, treatment, storage, distribution,
    operation and maintenance and monitoring). This document provides: —     principles
    and methodology of reclaimed water management; —     management issues in each
    system component of a centralized water reuse system; —     water quality monitoring;
    —     specific aspects for consideration and emergency response. This document
    excludes monitoring parameters and regulatory values (e.g. water quality limits)
    of a centralized water reuse system.'
