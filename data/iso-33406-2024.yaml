abstract:
- language: en
  script: Latn
  content: This document notes the requirements of ISO 17034 and provides guidance
    on the implementation of ISO 17034 in the production of RMs having one or more
    assigned qualitative property values, for expressing uncertainties for qualitative
    property values, and for establishing traceability. NOTE            The concepts
    of traceability and uncertainty address characteristics similar to those addressed
    by the concepts of traceability and measurement uncertainty as used in the metrology
    of quantitative properties. This document therefore does not describe aspects
    related to the production of RMs with quantitative property values. NOTE           
    Annex A provides examples of types of RMs within the scope of this document.
