abstract:
- language: en
  script: Latn
  content: 'This document establishes a policy for the multiple parties handling of
    trustworthiness documents and an information system model for content creation,
    use, management, and disposal to enable trusted business content through multiple
    parties’ governance. It ensures the consistent processing of business content
    among all parties involved and helps to manage the authenticity, integrity, reliability,
    ease of use, confidentiality, and privacy of the content. This document is applied:
    • as part of the function of the information system, • in a technology-independent
    manner, and • in a manner that is neutral to the business processes and models
    used.'
