abstract:
- language: en
  script: Latn
  content: This document specifies the conceptual and logical data model in addition
    to the physical encoding formats for geographic databases for Intelligent Transport
    Systems (ITS) applications and services. This document includes a specification
    of potential contents of such databases (data dictionaries for Features, Attributes
    and Relationships), a specification of how these contents are to be represented,
    and how relevant information about the database itself can be specified (metadata).
    This document further defines map data used in automated driving systems, Cooperative-ITS,
    and Multi-modal transport. The focus of this document is firstly on emerging ITS
    applications and services, such as Cooperative-ITS and automated driving systems,
    and it emphasizes road, lane and relevant information on road and lane. However,
    ITS applications and services also require other information in addition to road
    and road-related information, which are provided as external databases to connect
    with GDF and to complement each other. Highly defined public transport databases,
    for instance, are indispensable in multi-modal transport applications and services
    in particular. Thus, this document focuses secondly on an expansion of the specification
    to connect with externally existing databases. It is particularly designed to
    connect a Transmodel (EN 12896-1 and EN 12896-2) conformant public transport database.
    Typical ITS applications and services targeted by this document are in-vehicle
    or portable navigation systems, traffic management centres, or services linked
    with road management systems, including public transport systems. The conceptual
    data model specified here has a broader focus than ITS applications and services.
    It is application independent, allowing for future harmonization of this model
    with other geographic database standards.
