abstract:
- language: en
  script: Latn
  content: This document describes the test process, related documentation and test
    approaches for data migration testing. It defines requirements and guidance on
    the application of ISO/IEC/IEEE 29119-1, ISO/IEC/IEEE 29119-2, ISO/IEC/IEEE 29119-3,
    ISO/IEC/IEEE 29119-4 and ISO/IEC 20246 to data migration testing. This document
    requires a risk-based approach to data migration testing, and uses risks associated
    with data migration to identify suitable treatments in the form of various test
    approaches (including test levels, test types, test practices, static testing,
    and test design techniques and measures). This document is applicable to data
    migration testing within any system, from inception to release, through to maintenance,
    support and decommissioning, including in traditional and agile lifecycles. This
    document is intended for professional testers (including juniors, seniors and
    test managers) who are involved in data migration testing. This document can also
    benefit delivery leads, developers and project managers that are responsible for
    governing, managing and implementing data migration.
