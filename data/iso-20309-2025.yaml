abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the biobanking of deep-sea biological
    material including the collection, processing, transportation and storage of deep-sea
    biological material. This document is applicable only to deep-sea biological material
    that can be used for biomolecular processing, e.g. nucleic acids, proteins, and
    metabolites. This document is applicable to all organizations performing research
    and development on deep-sea biological material. This document does not apply
    to the collection of deep-sea biological material intended for environmental impact
    assessment for sea floor mining. NOTE            International, national or regional
    regulations or requirements or a multiple of these can also apply to specific
    topics covered in this document.
