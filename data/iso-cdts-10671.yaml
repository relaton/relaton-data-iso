abstract:
- language: en
  script: Latn
  content: This document presents a high-level information model for dispensing records
    of decocted herbal medicinal preparations that employ decoction pieces. This document
    delineates a conceptual model for dispensing records of decocted herbal preparations,
    detailing the attributes and properties thereof. It does not include the following.
    - Generation and management of controlled vocabulary and codes - Specific clinical
    information such as patient information and medication information - Drug identification
    and monitoring of information
