abstract:
- language: en
  script: Latn
  content: ISO 10882-1:2011 specifies a procedure for sampling airborne particles
    in the breathing zone of a person who performs welding and allied processes (the
    operator). It also provides details of relevant standards that specify required
    characteristics, performance requirements and test methods for workplace air measurement,
    and augments guidance provided in EN 689 on assessment strategy and measurement
    strategy. ISO 10882-1:2011 also specifies a procedure for making gravimetric measurements
    of personal exposure to airborne particles generated by welding and allied processes
    (welding fume) and other airborne particles generated by welding-related operations.
    Additionally, it provides references to suitable methods of chemical analysis,
    specified in other standards, to determine personal exposure to specific chemical
    agents present in welding fume and other airborne particles generated by welding-related
    operations. The general background level of airborne particles in the workplace
    atmosphere influences personal exposure and therefore the role of fixed-point
    sampling is also considered.
