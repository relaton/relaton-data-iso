abstract:
- language: en
  script: Latn
  content: 'This document is applicable to valve outlets for MEGCs in hydrogen service,
    with a working pressure up to 1000 bar. NOTE 1 The type of connections covered
    by this document covers several ranges of flows. NOTE 2 In this document the unit
    bar is used, due to its universal use in the field of technical gases. It should,
    however, be noted that bar is not an SI unit, and that the corresponding SI unit
    for pressure is Pa (1 bar = 10 5 Pa = 10 5 N/m 2 ). This document specifies: —
    basic dimensions such as thread and internal diameter; — requirements for material
    selection, mechanical properties; This document can be beneficial to define outlet
    connections for battery- vehicles.'
