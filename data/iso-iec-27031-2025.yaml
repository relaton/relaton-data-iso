abstract:
- language: en
  script: Latn
  content: 'This document describes the concepts and principles of information and
    communication technology (ICT) readiness for business continuity (IRBC). It provides
    a framework of methods and processes to identify and specify aspects for improving
    an organization''s ICT readiness to ensure business continuity. This document
    serves the following business continuity objectives for ICT: —    minimum business
    continuity objective (MBCO), —    recovery point objective (RPO), —    recovery
    time objective (RTO) as part of the ICT business continuity planning. This document
    is applicable to all types and sizes of organizations. This document describes
    how ICT departments plan and prepare to contribute to the resilience objectives
    of the organization.'
