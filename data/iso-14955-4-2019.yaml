abstract:
- language: en
  script: Latn
  content: 'This document specifies technical requirements and measures for testing
    procedures for evaluation of energy required to be adopted by persons undertaking
    the design, manufacture and supply of metal forming and laser processing machine
    tools in order to achieve reproducible data about the energy supplied under specified
    conditions. Furthermore, it provides methods for quantifying the energy supplied
    to components in order to assign their share to generalized machine tool functions
    as described in ISO 14955‑1. Along with ISO 14955‑1 and ISO 14955‑2, it covers
    all significant energy requirements relevant to hydraulic (servo) and mechanical
    (servo) presses, turret punch presses and press brakes, pipe benders, laser processing
    machine tools, when they are used as intended and under the conditions foreseen
    by the manufacturer. Examples of how to perform energy evaluation on metal-forming
    machine tools are given in the annexes. This document is applicable to machine
    tools which transmit force mechanically or transmit energy by laser light to cut,
    form, or work metal or other materials by means of dies attached to or operated
    by slides, punches or beams as well as to lasers ranging in size from small high
    speed machine tools producing small work-pieces to large relatively slow speed
    machine tools and large work-pieces. This document covers machine tools whose
    primary intended use is to work metal, but which can be used in the same way to
    work other materials (e.g. cardboard, plastic, rubber, leather, etc.). It also
    applies to auxiliary devices supplied as an integral part of the machine tool
    and to machine tools which are part of an integrated manufacturing system where
    the energy required is comparable to those of machine tools working separately.
    This document does not give test procedures for the energy requirements of tools
    or dies attached to the machine tools. It is not applicable to machine tools whose
    principal designed purpose is: — metal-cutting by milling, drilling or turning;
    — metal-cutting by oxygen or water cutting; — attaching a fastener, e.g. riveting,
    stapling or stitching; — bending or folding by folding machine tools; — straightening;
    — extruding; — drop forging or drop stamping; — compaction of metal powder; —
    single purpose punching machine tools designed exclusively for profiles, e.g.
    used in the construction industry; — working by pneumatic hammer; — working by
    pneumatic presses. NOTE Mechanical servo presses are also known as servo electric
    presses.'
