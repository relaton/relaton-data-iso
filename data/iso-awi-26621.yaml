abstract:
- language: en
  script: Latn
  content: This standard specifies test specimens, test equipment, and test methods
    for evaluating the single-cell polarization of solid oxide fuel cells (SOFC) and
    solid oxide electrolysis cells (SOEC), with the purpose of evaluating the performance
    of electrode materials, electrolyte materials, and their interfaces. The electrolyte
    is presumed to be oxide-ion-conductive ceramics in the electrolytic domain where
    the transference number of oxide ion exceeds 0.99. The polarization test method
    includes direct current versus potential measurements along with electrochemical
    impedance spectroscopy and current interruption techniques, which are used to
    break down the polarization into ohmic losses and electrode overpotentials, and
    further into specific causes of the overpotentials. The tests are intended to
    be conducted with small disk-shaped cells often referred to as “button cells”,
    and they do not evaluate the performance of single cells designed by the supplier
    to be incorporated into cell-stacks used in hot units of SOFC/SOEC systems. The
    performance test of the cell/stack assembly units integrated with peripheral components,
    such as current collectors and gas manifolds, shall refer to IEC 62282-7-2 or
    IEC 62282-8-101. This standard is intended to serve as a guideline for appropriately
    conducting the performance tests implemented in the development of the materials,
    the development of single cells, the development of their manufacturing methods,
    and in commercial transactions involving these materials and technologies of single
    cells. It also aims to ensure the acquisition of data necessary for research on
    electrode materials. This standard does not provide guidance on the interpretation
    of data. This document assumes that the sample specimens provided for testing
    are configured to function as a single cell of SOFC or SOEC and are tested under
    the conditions of their operations. However, the measurement methods specified
    in this standard and in its Annex are also applicable to tests where only one
    side of the electrode material or its interface is the subject of the evaluation.
    In such cases, the descriptions regarding the material and gas supply, etc. of
    the opposite electrode side can be appropriately adapted and used.
