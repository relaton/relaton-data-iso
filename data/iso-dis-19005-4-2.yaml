abstract:
- language: en
  script: Latn
  content: 'This document specifies the use of the Portable Document Format (PDF)
    2.0, as formalized in ISO 32000-2:—, for preserving the static visual representation
    of page based electronic documents over time in addition to allowing any type
    of other content to be included as an embedded file or attachment. This document
    does not apply to: — specific processes for converting paper or electronic documents
    to the PDF/A format; — specific technical design, user interface, implementation,
    or operational details of rendering; — specific physical methods of storing these
    documents such as media and storage conditions; — required computer hardware and/or
    operating systems.'
