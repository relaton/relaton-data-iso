abstract:
- language: en
  script: Latn
  content: ISO 3864-2:2016 establishes additional principles to ISO 3864‑1 for the
    design of safety labels for products, i.e. any items manufactured and offered
    for sale in the normal course of commerce, including but not limited to consumer
    products and industrial equipment. The purpose of a product safety label is to
    alert persons to a specific hazard and to identify how the hazard can be avoided.
    ISO 3864-2:2016 is applicable to all products in all industries where safety-related
    questions can be posed. However, it is not applicable to safety labels used -
    for chemicals, - for the transport of dangerous substances and preparations and
    - in those sectors subject to legal regulations which differ from certain provisions
    of this document. The design principles incorporated in this document are intended
    to be used by all ISO Technical Committees and anyone designing product safety
    labels in the development of product safety label standards for their industries
    or services.
