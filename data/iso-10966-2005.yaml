abstract:
- language: en
  script: Latn
  content: 'ISO 10966:2005 specifies the most important material characteristics for
    woven fabrics for awnings and camping tents. It can also be applied to other types
    of fabric. To meet the needs arising from different climatic conditions, different
    national habits in tent usage or different durability-expectations of the customer,
    the material requirements are split into two levels: A and B. Level A requirements
    apply to awning and camping tent fabrics intended for use where severe strain
    is caused by wind, weather or long-term use; level B requirements are lower than
    level A and apply to fabrics intended for less severe use. ISO 10966:2005 follows
    the awning and camping tent classification given in ISO 8937 and ISO 5912, as
    follows: awnings: type SN: snow awning;type R: residential awning;type T: touring
    awning; camping tents: type S: sleeping tent;class st: standard-weight tents;class
    l: light-weight tents;type T: touring tent; type R: residential tent.'
