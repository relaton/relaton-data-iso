abstract:
- language: en
  script: Latn
  content: This document specifies the normal phase liquid chromatography (NPLC) separation
    method for the qualitative and quantitative analysis of extractable alkylphenol
    ethoxylates (APEO) in textiles and textile products. This method provides several
    instrument options for the determination of alkylphenol ethoxylates (APEO) such
    as normal phase liquid chromatograph with mass spectrometer (NPLC/MS), normal
    phase liquid chromatograph with fluorescence detector (NPLC/FLD), normal phase
    liquid chromatograph with charged aerosol detector (NPLC/CAD) and normal phase
    liquid chromatograph with evaporative light scattering detector (NPLC/ELSD).
