abstract:
- language: en
  script: Latn
  content: 'This part of ISO 10303 specifies a C programming language late binding
    of the capability specified in ISO 10303-22 - Standard data access interface (SDAI).
    This binding is a late binding and as such, none of the constants, data types,
    and functions depend on the application schema being accessed. The following are
    within the scope of this part of ISO 10303: — access to and manipulation of data
    types and entities which are specified in ISO 10303-22; — convenience functions
    suitable to this language binding; — late binding requirements specified in ISO
    10303-22. The following are outside the scope of this part of ISO 10303: — memory
    arrangement of data structures used by implementations of this part of ISO 10303;
    — early binding requirements as specified in ISO 10303-22; — all items listed
    as out of scope in ISO 10303-22.'
