abstract:
- language: en
  script: Latn
  content: ISO 6980-3:2006 describes procedures for calibrating and determining the
    response of dosemeters and doserate meters in terms of the International Commission
    on Radiation Units and Measurements (ICRU) operational quantities, that is, the
    directional dose equivalent and the personal dose equivalent, for radiation protection
    purposes. In addition to the description of calibration procedures, this part
    of ISO 6980-3:2006 includes recommendations for appropriate phantoms and the way
    to determine appropriate conversion coefficients. Guidance is provided on the
    statement of measurement uncertainties and the preparation of calibration records
    and certificates.
