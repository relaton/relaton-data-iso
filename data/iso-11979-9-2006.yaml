abstract:
- language: en
  script: Latn
  content: ISO 11979-9:2006 is applicable to any intraocular lens whose optic provides
    two or more rotationally symmetric powers and whose primary indication is the
    correction of aphakia with the added benefit of useful vision at more than one
    distance (e.g. far and near). The term "near vision" as used in ISO 11979-9:2006
    includes useful vision at a distance of claimed benefit; e.g. near and/or intermediate
    distances.
