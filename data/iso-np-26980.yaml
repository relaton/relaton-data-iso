abstract:
- language: en
  script: Latn
  content: This document specifies the test apparatus, solution, procedure, data acquisition and analysis, and test report for waterline corrosion testing of metals and alloys in water/atmospheric environments using coupled multi-electrode arrays. This document is applicable to corrosion tests of metals and alloys in the waterline region in water/atmospheric environments. It can be used to analyze the location and degree of waterline corrosion of metals in specific water environments, and screen materials resistant to waterline corrosion.
