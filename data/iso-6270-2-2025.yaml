abstract:
- language: en
  script: Latn
  content: This document specifies the general conditions and procedures observed
    when testing coated test specimens by exposing them to constant condensation-water
    atmospheres or alternating condensation-water atmospheres, in a cabinet with a
    heated water reservoir. These conditions and procedures ensure that the results
    of tests carried out in different laboratories are reproducible. This document
    does not cover the shape and preparation of the test specimens, the duration of
    the test and the assessment of the test results.
