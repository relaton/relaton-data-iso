abstract:
- language: en
  script: Latn
  content: This document is applicable to the determination of gadolinium as Gd2O3
    in powder blends and sintered pellets of Gd2O3 + UO2 and ((U, Gd) O2) from mass
    fraction 10 g/kg to 100 g/kg (i.e. 1 % to 10 %), using a suitable ICP-AES instrument.
    This methodology is capable of demonstrating compliance with agreed upon fuel
    specifications and associated data quality objectives provided the user has performed
    qualification measurements under their established measurement control program
    to demonstrate that measurement uncertainty requirements will be met with the
    desired level of confidence at the specification.
