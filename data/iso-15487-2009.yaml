abstract:
- language: en
  script: Latn
  content: ISO 15487:2009 specifies a method of test for evaluating the smoothness
    appearance of flat fabric and seams, and the retention of pressed-in creases in
    garments and other textile products after one or several domestic washing and
    drying treatments. It is applicable to any washable textile end product of any
    fabric construction. Techniques for seaming and creasing are not included since
    the purpose is to evaluate textile end products as they are supplied from the
    manufacturer or as ready-to-use. Techniques for seaming and creasing are controlled
    by fabric properties. This method has been developed for use primarily with domestic
    washing machines of Type B as defined in ISO 6330, but it may be possible to use
    it with machines of Type A defined in the same International Standard. It is recognized
    that prints and patterns may mask the wrinkled appearance present in textile end
    products. The rating process is, however, based on the visual appearance of specimens
    including such effects.
