abstract:
- language: en
  script: Latn
  content: The Immersive Haptics format provides a framework for the description of
    spatial and interactive Haptics allowing applications to create, distribute, render
    and interact across different applications, services and devices. This specification
    will define a generic and extensible representation of a haptic graph describing
    how objects, users and environment interact together to provide physical effects
    to the user, based on the physical properties of the scene and the user actions.
    The specification will rely on other standards for the encoding/compression of
    specific media (inc. haptic signals/effects) and for the global scene representation.
    Specific implementation of this generic framework to existing scene description
    will be also provided. The scope of the work of this specification is fully aligned
    with the MPEG-I requirements and scope of the MPEG Immersive project.
