abstract:
- language: en
  script: Latn
  content: ISO 1996-2:2007 describes how sound pressure levels can be determined by
    direct measurement, by extrapolation of measurement results by means of calculation,
    or exclusively by calculation, intended as a basis for assessing environmental
    noise. Recommendations are given regarding preferable conditions for measurement
    or calculation to be applied in cases where other regulations do not apply. ISO
    1996-2:2007 can be used to measure with any frequency weighting or in any frequency
    band. Guidance is given to evaluate the uncertainty of the result of a noise assessment.
