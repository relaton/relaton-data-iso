abstract:
- language: en
  script: Latn
  content: 'This document specifies the criteria and requirements for the in-field
    application of coatings, coating repair and coating rehabilitation on buried pipelines.
    This document specifies: — coating assessment (new and existing); — removal of
    degraded coatings; — surface preparation; — on site or in situ application of
    external coatings. It is applicable to petroleum or natural gas pipelines, with
    or without a cathodic protection system. The pipelines could be operational during
    the removal, preparation and application process. This document states qualification/testing
    for field contractors and site applied coatings to all of the pipeline components,
    including bends, tees, fittings, valves and interfaces between different coatings
    in soil-to-air pipeline sections. Technical and performance characteristics of
    the repair and rehabilitation coating materials are referenced to ISO 21809-3.
    The coating of field joints is outside the scope of this document. Field joint
    coatings are dealt with in ISO 21809-3. This document excludes the application
    of coatings when the pipeline is immersed (submerged).'
