abstract:
- language: en
  script: Latn
  content: This document gives guidelines and recommendations for the general principles
    of design appropriate to articles to be hot dip galvanized after fabrication (e.g.
    in accordance with ISO 1461) for the corrosion protection of, for example, articles
    that have been manufactured in accordance with EN 1090-2. This document does not
    apply to hot dip galvanized coatings applied to continuous wire or sheet (e.g.
    to EN 10346).
