abstract:
- language: en
  script: Latn
  content: This proposed document specifies a method for measuring the impact toughness
    index including the ambient toughness index (TI) and the thermal impact toughness
    index (TTI) of superabrasives, D (diamond) or B (cubic boron nitride), in which
    the terms and definitions, the principle, apparatus, test conditions, sample preparation
    and testing procedures are described. This proposal sets out a measurement method
    for use in the manufacture of saw blades, grinding wheels and other industrial
    products for determining the impact toughness index or the thermal impact toughness
    index of various superabrasives grains. The measurement standard set forth herein
    applies to the synthetic diamond for sizes D 46 to D 851, and the cubic boron
    nitride for sizes B 46 to B 601.
