abstract:
- language: en
  script: Latn
  content: 'This standard specifies the requirements of contents, methods, timing
    and result recording for polarity check of launch vehicles. This standard can
    be used to guide the polarity-related check and test for launch vehicles throughout
    the whole phases before launch, including the inspection of parameters polarity
    during the design phase, and the check of installation polarity, plug-in polarity,
    etc., during the assembly and testing phase in the integration and launch site.
    The main framework of this standard is as follows: 1) General requirements: the
    top requirements for the items of polarity check, timing and methods. 2) Contents
    of polarity check: detailed requirements, what should be checked for each kind
    of polarity. 3) Timing and methods selection: when and how to conduct the polarity
    check. 4) Results recording: what should be recorded for the polarity check, and
    related format.'
