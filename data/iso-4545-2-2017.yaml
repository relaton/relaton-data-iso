abstract:
- language: en
  script: Latn
  content: ISO 4545-2:2017 specifies the method of verification and calibration of
    testing machines for determining Knoop hardness for metallic materials in accordance
    with ISO 4545‑1. A direct method of verification and calibration is specified
    for the testing machine, indenter, and the diagonal length measuring system. An
    indirect verification method using reference blocks is specified for the overall
    checking of the machine. If a testing machine is also to be used for other methods
    of hardness testing, it will be verified independently for each method.
