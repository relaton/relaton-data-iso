abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of homogeneous floor coverings,
    based on poly(vinyl chloride), supplied in either tile or roll form. Products
    can contain a transparent, non-PVC factory finish. To encourage the consumer to
    make an informed choice, this document also includes a classification system (see
    ISO 10874) based on intensity of use, which shows where these floor coverings
    give satisfactory service. It also specifies requirements for marking.
