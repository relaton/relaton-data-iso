abstract:
- language: en
  script: Latn
  content: 'This document: —     describes the functionality of a "local dynamic map"
    (LDM) in the context of the "bounded secured managed domain" (BSMD); —     specifies:
    —    general characteristics of LDM Data Objects (LDM-DOs) that can be stored
    in an LDM, i.e. information on real objects such as vehicles, road works sections,
    slow traffic sections, special weather condition sections, which are as a minimum
    requirement location-referenced and time-referenced; —    service access point
    functions providing interfaces in an ITS station (ITS-S) to access an LDM for:
    —     secure add, update and delete access for ITS-S application processes; —    
    secure read access (query) for ITS-S application processes; —     secure notifications
    (upon subscription) to ITS-S application processes; —     management access: —    
    secure registration, de-registration and revocation of ITS-S application processes
    at LDM; —     secure subscription and cancellation of subscriptions of ITS-S application
    processes; —    procedures in an LDM considering: —     means for maintaining
    the content and integrity of the data store; —    mechanisms supporting several
    LDMs in a single ITS station unit.'
