abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1676:2010-08 specifies the application module for Functional
    decomposition to design. The following are within the scope of ISO/TS 10303-1676:2010-08:
    the representation of the information needed to describe the assignment of a functional
    unit in a hierarchical network definition to an element in the physical design
    definition. Usually, this information is provided by a packaging application.
    the pin mapping between the functional view and the packaged view that is normally
    stored in a library and which the packaging application traverses during execution.
    identification of swapping of the allocation of functional unit to a physical
    design component with a different allocation;identification of swapping of the
    allocation of terminals of a functional unit to a physical design component with
    a different allocation.'
