abstract:
- language: en
  script: Latn
  content: ISO 16831:2012 specifies methods and acceptance criteria for assessing
    the performance of instruments for measuring thickness using pulse-echo ultrasound.
    ISO 16831:2012 covers both direct (digital) reading and waveform display types
    using single or dual element probes. ISO 16831:2012 can be used for verifying
    equipment covered by EN 12668 when used for thickness measurement.
