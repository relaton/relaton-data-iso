abstract:
- language: en
  script: Latn
  content: 'Establishment of the governance and principles which are the foundations
    of quality data for healthcare to support specification collection and use of
    quality data in healthcare. This includes: ● Data Governance o Organisation of
    governance, including strategy development and implementation o Skills and scope
    of members needed for governance activities o Monitoring role, leadership, and
    ongoing improvement o Reduce data silos - share don’t compete o Coordination across
    data boundaries and organizational levels (local, regional, national, international)
    ● Data Quality Foundation o Data quality principles ▪ Definitions ▪ If data is
    not suitable or useful at source - it will not be fit for purpose ▪ Automate aggregation
    and data selection leveraging EHR to reduce duplication, improve consistency and
    reduce costs ▪ Identify patterns of data - do not create new concepts if a similar
    one exists, identify variations ▪ represent the concepts deeded through the supply
    chain, including identification of follow up actions ▪ Openly available definitions
    and open discussion ▪ Data for life of the individual - understand the impact
    of changes It is not intended that this work defines the requirements for quality
    information or data models – however the document will indicate where such models
    impact the quality of the data.'
