abstract:
- language: en
  script: Latn
  content: This document specifies the principles of inductively coupled plasma mass
    spectrometry (ICP-MS) and provides general requirements for the use of this technique
    to determine elements in water, digests of sludges and sediments (e.g. digests
    of water as described in ISO 15587-1 or ISO 15587-2). Generally, the measurement
    is carried out in water, but gases, vapours or fine particulate matter can be
    introduced too. This document applies to the use of ICP-MS for aqueous solution
    analysis. The ultimate determination of the elements is described in a separate
    International Standard for each series of elements and matrix. The individual
    clauses of this document refer the user to these guidelines for the basic principles
    of the method and the configuration of the instrument.
