abstract:
- language: en
  script: Latn
  content: ISO 16634-1:2008 specifies a method for the determination of the total
    nitrogen content and the calculation of crude protein content of oilseeds and
    animal feeding stuffs. This method, like the Kjeldahl method, does not distinguish
    between protein nitrogen and non-protein nitrogen. For the calculation of protein
    content, various conversion factors are used. This method is not applicable to
    milk and milk products.
