abstract:
- language: en
  script: Latn
  content: This document is intended for organizations seeking to address climate-related
    environmental aspects, environmental conditions, and the associated risks and
    opportunities within an environmental management system according to ISO 14001.
    Organizations contribute to climate change due to their direct and indirect emissions
    of greenhouse gases and are affected by climate change due to the physical and
    transitional threats it poses on their operations and value chains. This document
    addresses the environmental topic area climate from both perspectives, the management
    of greenhouse gas emissions (mitigation) and climate-related risks and opportunities
    (including adaptation). This document follows the intention of the ISO 14002 series
    to provide guidance for dealing with an environmental topic area by supporting
    a systematic approach compatible with "Plan-Do-Check-Act". This document is applicable
    to organizations irrespective of their size, type, financial resources, location
    and the sector they belong to.
