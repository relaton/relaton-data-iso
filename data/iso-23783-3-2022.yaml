abstract:
- language: en
  script: Latn
  content: This document provides guidance and establishes requirements for collecting
    and examining volumetric performance data of automated liquid handling systems
    (ALHS). It specifies how to index and track volumetric performance data and provides
    descriptive statistics for the evaluation of these data. This document also specifies
    reporting requirements of ALHS volumetric performance. This document is applicable
    to all ALHS with complete, installed liquid handling devices, including tips and
    other essential parts needed for delivering a specified volume, which perform
    liquid handling tasks without human intervention into labware. NOTE       For
    terminology and general requirements of automated liquid handling systems, see
    ISO 23783-1. Measurement procedures for the determination of volumetric performance
    are given in ISO 23783-2.
