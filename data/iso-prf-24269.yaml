abstract:
- language: en
  script: Latn
  content: This document specifies the performance requirements and testing methods
    for nonwoven nonmedical masks for general use that prevent droplets containing
    bacteria from scattering into the air and prevent microparticles, bacterial droplets,
    and virus droplets from entering the body. IMPORTANT — Nonwoven general use face
    coverings specified in this document are not medical face masks (EN14683), medical
    devises (MD), nor are personal protective equipment (PPE) in the scope of ISO/TC94/SC15,
    Respiratory protective devices (RPD). The following properties are specified for
    filtration property, －sub-micron filtration efficiency（PFE） －water aerosol filtration
    efficiency with bacteria（BFE） －water aerosol filtration efficiency with viruses（VFE）
    －pollen particle filtration efficiency －Differential pressure For safety items
    are as follow, －free formaldehyde －specific azo dye －Heavy metals －pH All tests
    shall be carried out on finished products or samples cut from finished products.
    In case of that the products do not have enough size for the tests, the tests
    shall be carried out same materials and same layers of the products. NOTE 1　The
    examples of these cases are general use face coverings for children, three-dimensional
    type, etc. NOTE 2 The required performance of filtration is expected when no air
    leakage is occurred from the general use face covering wearer in practical use.
