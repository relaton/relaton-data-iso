abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory method for the extraction of microplastics
    from compost matrices originating from industrial or home composting. The method
    outlines various extraction steps assuring polymer stability, and high recovery
    rate. This extraction process separates microplastics from the compost matrix
    that can be further analysed either by number-based or by mass-based techniques.
    The method is applicable for microplastics up to 1 mm in size. The method is applicable
    for microplastics with densities lower than 1,4 g/cm3. This document will not
    specify downstream detection methods for the identification and quantification.
    The method in this document has not been validated for microplastic extraction
    from other matrices, except for composts.
