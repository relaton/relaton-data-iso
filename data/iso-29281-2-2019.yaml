abstract:
- language: en
  script: Latn
  content: 'This document specifies elements of communications for localized communications
    in ITS. In particular, the following architectures, procedures and protocols are
    specified: — support of communication interfaces (DSRC-CI) using the DSRC application
    layer specified in ISO 15628; — support of ISO 15628 DSRC applications via an
    ITS access technology suited for localized communications.'
