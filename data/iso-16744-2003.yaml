abstract:
- language: en
  script: Latn
  content: ISO 16744:2003 gives the classification of, and specifies requirements
    and test methods for metallic materials with a base metal as the main constituent.
    It applies to base metal materials suitable for use in fabrication of fixed dental
    restorations. ISO 16744:2003 is not applicable to base metal materials intended
    for use in the fabrication of removable appliances, for which ISO 6871-2 and ISO
    6871-2 apply.
