abstract:
- language: en
  script: Latn
  content: This document describes a method for analysing imaging systems quality
    in the area of cultural heritage imaging. The method describes the analysis of
    multiple imaging systems quality characteristics from images of a set of specified
    test targets. The specification states which characteristics are measured, how
    they are measured, and how the results of the analysis need to be presented. This
    standard applies to scanners and digital cameras used for digitization of transmissive
    cultural heritage material. It does not cover materials that contain copies of
    cultural heritage like microfilm and specific materials that are typically not
    used for cultural heritage like x-ray film.
