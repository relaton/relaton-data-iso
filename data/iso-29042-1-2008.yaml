- language: en
  script: Latn
  content: ISO 29042-1:2008 specifies parameters which can be used for the assessment
    of the emission of pollutants from machines or the performance of the pollutant
    control systems integrated in machines. It gives guidance on the selection of
    appropriate test methods according to their various fields of application and
