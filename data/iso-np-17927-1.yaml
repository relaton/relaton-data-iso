abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for fusion welding of aerospace hardware. It is to be used in conjunction with the design/engineering authority’s design documents or their accepted data. This document covers the processes given in Table 1 and material groups given in Table 2. Table 1 — Fusion welding processes covered by this document Process Process number (ISO 4063) Oxyfuel welding 31 Gas-shielded arc welding with non-consumable tungsten electrode, Gas tungsten arc welding 14 Plasma arc welding 15 Electron beam welding 51 Laser welding, Laser beam welding 52 Table 2 — Material groups covered by this document (see ISO 24394:2024, 4.5) Material group Description A Unalloyed steel, low-alloyed steels, high-alloyed ferritic steels B Austenitic, martensitic and precipitation hardening steels C Titanium and titanium alloys, niobium, zirconium and other reactive metals D Aluminium and magnesium alloys E Materials that do not conform to other material groups (e.g. molybdenum, tungsten, copper alloys) F Nickel alloys, cobalt alloys.
