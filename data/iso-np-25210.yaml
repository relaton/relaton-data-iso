abstract:
- language: en
  script: Latn
  content: This document describes star tracker performance evaluation methodologies
    on orbit. Accuracy, detection capability and reliability are the most important
    performance indicators that need to be evaluated on orbit, and the evaluation
    results are affected by orbit environment, including radiation environment, stray
    light, satellite disturbance and other factors. Other performance indicators of
    star trackers are less related to the orbital environment, and their evaluation
    methodologies are not included in the scope. This document is applicable to all
    kinds of star trackers used in Satellites.
