abstract:
- language: en
  script: Latn
  content: This document describes electrical requirements and tests for the electrical
    and electronic systems and components for road vehicles operating at nominal DC
    supply voltages of 12 V, 24 V and 48 V. This part contains electrical requirements
    and tests for DC/DC converter supplied systems and components. This document is
    not intended to apply to systems and components of motorcycles and mopeds. Electromagnetic
    compatibility (EMC) is not covered by this document.
