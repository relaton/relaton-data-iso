abstract:
- language: en
  script: Latn
  content: ISO/PAS 28004:2006 provides generic advice on the application of ISO/PAS
    28000:2005, Specification for security management systems for the supply chain.
    It explains the underlying principles of ISO/PAS 28000 and describes the intent,
    typical inputs, processes and typical outputs, for each requirement of ISO/PAS
    28000. This is to aid the understanding and implementation of ISO/PAS 28000. ISO/PAS
    28004:2006 does not create additional requirements to those specified in ISO/PAS
    28000, nor does it prescribe mandatory approaches to the implementation of ISO/PAS
    28000.
