abstract:
- language: en
  script: Latn
  content: The document provides guidance on the planning of smart city ICT infrastructure.
    The document gives general principles, basic processes for the planning of smart
    city ICT infrastructure. It focuses on the procedure, suggestions, good practices
    and basic interoperability demands of the planning activities including demand
    analysis, overall architecture design, and implementation roadmap planning. It
    guides the stakeholders in implementing the city level ICT infrastructure planning.
