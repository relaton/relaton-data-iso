abstract:
- language: en
  script: Latn
  content: This document specifies the conditions for conducting the plane bending
    fatigue test on an axial machine, constant-amplitude, force or displacement controlled,
    at room temperature (ideally between 10 °C and 35 °C) on metallic specimens, without
    deliberately introduced stress concentrations. This document does not include
    the reversed/partially loading test. The purpose of the test is to provide relevant
    results, such as the relation between applied stress and number of cycles to failure
    for a given material condition, expressed by hardness and microstructure, at various
    stress ratios. Although the shape, preparation and testing of specimens of rectangular
    and bevelled cross-section are specified, component testing and other specialized
    forms of testing are not included in this document. Fatigue tests on notched specimens
    are not covered by this document since the shape and size of notched test pieces
    have not been specified in any standard so far. Guidelines are given in Annex A.
    However, the fatigue-test procedures described in this document can be used for
    testing such notched specimens. It is possible for the results of a fatigue test
    to be affected by atmospheric conditions. Where controlled conditions are required,
    ISO 554:1976, 2.1 applies.
