abstract:
- language: en
  script: Latn
  content: 'This document specifies general safety requirements and test methods related
    to materials, safety and performance for classified floating leisure articles
    for use on and in water. This document is not applicable to: —     aquatic toys
    (use in shallow waters/use under supervision); —     inflatable boats with a buoyancy > 1 800 N;
    —     buoyant aids for swimming instructions; —     air mattresses that are not
    specifically designed or intended for use on the water (e.g. velour bed, self-inflating
    mattress and rubberized cotton air mattress); —     floating seats for angling
    purposes; —     surf sports type devices (e.g. body boards, surf boards, stand-up-paddles
    boards); —     water ski, wakeboard or kite surfing board; —     devices made
    from rigid materials e.g. wood, aluminium, hard or non-deformable plastic; —    
    devices that are kept in shape by permanent air flow; —     rings intended for
    use on water slides; —     wading devices.'
