abstract:
- language: en
  script: Latn
  content: 'This standard will provide guidance for the establishment, implementation,
    management, and continual improvement of an innovation ecosystem as the organizational
    structure. It is applicable to systems composed of more than two interested parties
    and/or organizations working in a synergistic manner and who collectively, collaboratively,
    and sometimes even competitively codevelop and enable innovations. This can be
    at different levels such as regional or local frameworks focused on innovation
    initiatives. The degree of management of this organizational structure could vary
    from loosely to tightly interconnected networks. The parties could be for-profit,
    non-profit, or public, and could represent any of the helices: Industry, Academia,
    Government, and Community. The standard will cover: Context (the innovation ecosystem’s
    context that needs to be considered in the strategic direction of the ecosystem). 
    The establishment of a structured approach to managing innovation ecosystems,
    ensuring a capability to sustain and grow the ecosystem’s value creation and realization
    over time aligned with the ecosystem''s strategic objectives.  Guidelines for
    planning and the selection and prioritization of ecosystem parties, as well as
    of innovation initiatives, ensuring they are in sync with market needs and parties’
    and/or ecosystem capabilities.  Operations of the innovation processes, ensuring
    they are in sync with market needs and allow both an effective value co-creation
    and value-sharing between ecosystem parties.  Support for ecosystem party selection
    and closing, alignment of parties, effective knowledge sharing and collaboration,
    value-realization, value-sharing, IP management, resource allocation and risk
    management  Monitoring, evaluating, and improving the performance of innovation
    activities, as well as of parties, and total ecosystem value realization, including
    the use of both quantitative and qualitative metrics to assess progress and impact.
    The standard will draw upon best practices in innovation ecosystem management,
    guiding organizations across various sectors and sizes. By adopting this standard,
    organizations can ensure that their innovation ecosystem activities are strategically
    managed and contribute to their long-term success and resilience. Further, a standardized
    framework for managing innovation ecosystems will reduce fragmentation of ecosystem
    practices and thereby, ensure increased interoperability, efficient collaboration,
    and scalability across sectors and countries.'
