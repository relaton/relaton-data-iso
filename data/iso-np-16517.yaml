abstract:
- language: en
  script: Latn
  content: This standard provides the sampling and real-time RT-PCR assay for detection
    of SARS-CoV-2 in food and food packaging surface. It includes detection reagents,
    instruments and devices, experimental procedures, analysis results, laboratory
    biosafety. The standard is applied to the detection of SARS-CoV-2 on food and
    food packaging surface, including the surface of aquatic products (including live
    aquatic animals), the surface of other animal products, the surface of plant food,
    and the surface of internal and external packages.
