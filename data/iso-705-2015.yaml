abstract:
- language: en
  script: Latn
  content: ISO 705:2015 specifies a method for the determination of the density of
    natural rubber latex concentrate between the temperatures of 5 °C and 40 °C. ISO
    705:2015 is intended for use when density determinations are used to calculate
    the mass of a measured volume of latex in locations where it is not practical
    to weigh directly or to control the temperature of the laboratory.
