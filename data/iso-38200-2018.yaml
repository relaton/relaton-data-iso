abstract:
- language: en
  script: Latn
  content: This document specifies requirements for a chain of custody (CoC) of wood
    and wood-based products, cork and lignified materials other than wood, such as
    bamboo, and their products. NOTE The term "material" will henceforth be used throughout
    this document to denote "raw materials and products from wood, cork and lignified
    materials other than wood, such as bamboo", as defined in 3.8. This document is
    applicable to material that originates from different categories of input material
    and can be derived from mechanical, chemical, biological and/or thermal processing
    or a combination thereof. A chain of custody relies on a control system to track
    and handle material throughout the entire supply chain or parts of the supply
    chain, including transportation, receipt, production, sale, resale and output
    declaration. This document is intended to enable tracking of material from different
    categories of source to finished products. Furthermore, this document also specifies
    minimum requirements for input material. This document is not applicable to forest
    management.
