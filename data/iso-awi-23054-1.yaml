abstract:
- language: en
  script: Latn
  content: This document defines track geometry parameters and specifies the minimum
    requirements for track geometry measurements and the evaluation method for track
    geometry quality. This document is applicable to 1 435 mm and wider track gauges.
    The urban/light rail systems, tramways and any track gauge narrower than 1 435 mm
    are excluded from the scope of this document, however it can be used as a reference.
