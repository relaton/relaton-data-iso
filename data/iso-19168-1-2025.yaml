abstract:
- language: en
  script: Latn
  content: This document specifies the behaviour of Web APIs that provide access to
    features in a dataset independently of the underlying data store. This document
    defines discovery and query operations. Discovery operations enable clients to
    interrogate the API, including the API definition and metadata about the feature
    collections provided by the API, to determine the capabilities of the API and
    retrieve information about available distributions of the dataset. Query operations
    enable clients to retrieve features from the underlying data store based upon
    simple selection criteria, defined by the client.
