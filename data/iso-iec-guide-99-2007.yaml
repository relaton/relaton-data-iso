abstract:
- language: en
  script: Latn
  content: ISO/IEC Guide 99:2007 provides a set of definitions and associated terms,
    in English and French, for a system of basic and general concepts used in metrology,
    together with concept diagrams to demonstrate their relations. Additional information
    is given in the form of examples and notes under many definitions. This Vocabulary
    is meant to be a common reference for scientists and engineers, as well as teachers
    and practitioners, involved in planning or performing measurements, irrespective
    of the level of measurement uncertainty and irrespective of the field of application.
    It is also meant to be a reference for governmental and inter-governmental bodies,
    trade associations, accredi­tation bodies, regulators and professional societies.
