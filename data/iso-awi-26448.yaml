abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of impurity elements
    in recycled carbon fibre (rCF) using inductively coupled plasma mass spectrometry
    (ICP-MS). Two pretreatment techniques are covered: microwave-assisted acid digestion
    and laser ablation. The method employing microwave-assisted acid digestion is
    applicable to the determination of thirteen non-volatile elements (Na, Mg, Al,
    K, Ca, Ti, Cr, Fe, Co, Ni, Cu, Zn and Pb), while the method employing laser ablation
    is applicable to two volatile elements (Br and Hg). This document describes the
    analytical procedure, including reagents, apparatus and sample preparation. It
    is intended to support the evaluation of the potential harmfulness and quality
    of rCF with respect to impurity elements.'
