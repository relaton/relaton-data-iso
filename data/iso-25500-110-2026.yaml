abstract:
- language: en
  script: Latn
  content: 'For the verification of certificates, this document specifies the requirements
    for three request types (verify certificate, resolve certificate, and search certificate)
    and the responses to these requests. The following are within the scope of this
    document: the syntax requirements and application protocol interface (API) for
    a request and response to a request to verify a certificate with an identifier
    formatted in accordance with ISO 8000-115 (verify certificate); the syntax requirements
    and API for a request and response to a request to verify a dataset of a certificate
    with an identifier formatted in accordance with ISO 8000-115 (resolve certificate);
    the syntax requirements and API for a request and response to a request to search
    for a certificate identifier formatted in accordance with ISO 8000-115 given a
    certificate recipient’s name (search certificate). The following are outside the
    scope of this document: the methods used for the resolution of certificates by
    the entity that issued the identifier.'
