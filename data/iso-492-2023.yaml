abstract:
- language: en
  script: Latn
  content: This document specifies dimensional and geometrical characteristics, deviation
    limits from nominal sizes, and tolerance values to define the interface (except
    chamfers) of radial rolling bearings. Nominal boundary dimensions are defined
    in ISO 15, ISO 355[2] and ISO 8443[4]. This document does not apply to certain
    radial bearings of particular types (e.g. needle roller bearings) or for particular
    fields of application (e.g. airframe bearings). Tolerances for such bearings are
    given in the relevant International Standards. Chamfer dimension limits are given
    in ISO 582[3].
