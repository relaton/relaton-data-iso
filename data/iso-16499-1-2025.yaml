abstract:
- language: en
  script: Latn
  content: 'This document establishes a basic role model, as a common platform for
    smart city instantiation, of smart city automated mobility services. It provides
    a paradigm describing: a)       a framework architecture for the provision of
    an automated mobility service; b)       a description of the concept of operations,
    and the role models; c)        a conceptual architecture between actors involved
    in the provision/receipt of automated mobility service applications; d)      
    references for the key documents on which the architecture is based; e)      
    a taxonomy of the organization of generic procedures. In-vehicle control system
    is not in the scope of this document. The scope of this document is limited to
    automated mobility services using physical and digital infrastructure.'
