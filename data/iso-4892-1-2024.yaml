abstract:
- language: en
  script: Latn
  content: This document provides general guidance and requirements relevant to the
    selection and operation of the methods of exposure described in detail in subsequent
    parts of the ISO 4892 series. It also specifies general performance requirements
    for devices used for exposing plastics to laboratory light sources. Information
    regarding performance requirements is for producers of artificial accelerated
    weathering or artificial accelerated irradiation devices. This document also provides
    information on the interpretation of data from artificial accelerated weathering
    or artificial accelerated irradiation exposures. More specific information about
    methods for determining the change in the properties of plastics after exposure
    and reporting these results is not part of this document.
