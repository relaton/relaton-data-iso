abstract:
- language: en
  script: Latn
  content: 'ISO/TR 12116:2008 describes four methods designed to simulate, by means
    of laboratory colour-fastness tests, the colour changes which take place in clothing
    during actual wear. The four methods are applicable to the following types of
    clothing: sports clothing (method 1); smocks and other shirt-like outer garments
    worn outdoors (method 2); indoor clothing and underwear (method 3); military uniforms
    (method 4).'
