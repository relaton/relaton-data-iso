abstract:
- language: en
  script: Latn
  content: ISO 24516-1:2016 specifies guidelines for technical aspects, tools and
    good practices for the management of assets of drinking water networks to maintain
    value from existing assets. ISO 24516-1:2016 does not apply to the management
    of assets of waterworks (including catchment and treatment, pumping and storage
    in the network), which are also physically part of the drinking water system and
    can influence the management of assets of the pipe network. ISO 24516-1:2016 focuses
    on the assets typically owned or operated by drinking water utilities (networked
    drinking water systems) that are expected to meet customer needs and expectations
    over longer (multi-generational) periods. ISO 24516-1:2016 includes examples for
    good practice approaches on the strategic, tactical and operational levels. ISO
    24516-1:2016 is applicable to all types and sizes of organization and/or utilities
    operating drinking water systems, and all different roles/functions for the management
    of assets within a utility (e.g. asset owner/responsible body, asset manager/operator,
    service provider/operator).
