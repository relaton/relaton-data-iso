abstract:
- language: en
  script: Latn
  content: This document describes methodologies for radioactivity characterization
    of very low-level waste (VLLW) generated from the operation or decommissioning
    of nuclear facilities. The purpose is to differentiate VLLW from low-level radioactive
    solid waste and waste below clearance levels. The aim is to effectively characterize
    and to demonstrate that it satisfies the criteria for VLLW. This document focuses
    specifically on characterization methods of radioactive solid waste. Clearance
    and exemption monitoring are not covered within this document. Additionally, the
    characterization of liquid and gaseous wastes is also excluded from this document.
