abstract:
- language: en
  script: Latn
  content: ISO 17994:2014 specifies an evaluation procedure for comparing two methods
    with established performance characteristics according to ISO/TR 13843 and intended
    for the quantification of the same target group or species of microorganisms.
    It provides the mathematical basis for the evaluation of the average relative
    performance of two quantitative methods against chosen criteria for the comparison.
    It does not provide data for assessment of the precision of the methods being
    compared. It is appropriate that the precision of methods is assessed as part
    of their performance characterization. ISO 17994:2014 does not provide methods
    for the verification of method performance characterization in a single laboratory.
