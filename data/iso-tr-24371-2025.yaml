abstract:
- language: en
  script: Latn
  content: This document provides an overview of regulatory, business and best practice
    risk mitigation specifications that apply to the implementation, operation and
    governance of natural person identifier (NPI) policies, procedures and mechanisms
    necessary to support the lifecycle of all NPIs. The purpose of this document is
    to provide the basis for the development of one or more international standards
    related to the safe creation, use and management of NPIs with maximum global interoperability.
    For the structure of the NPI, see ISO 24366. For reference, ISO 24366 specifies
    a machine-readable, unambiguous NPI and the relevant reference data to uniquely
    identify the natural person relevant to any financial transaction rather than
    the personal identifying information.
