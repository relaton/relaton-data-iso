abstract:
- language: en
  script: Latn
  content: This document specifies system requirements and test methods for lane change
    decision aid systems (LCDAS). LCDAS are intended to warn the driver of the subject
    vehicle against potential collisions with vehicles either to the side or to the
    rear in the adjacent lanes of the subject vehicle and moving in the same direction
    as the subject vehicle for lane change manoeuvres. This document addresses LCDAS
    for use on forward-moving cars, vans and straight trucks. This document does not
    address LCDAS for use on motorcycles or articulated vehicles such as tractor/trailer
    combinations and articulated buses.
