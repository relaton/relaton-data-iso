abstract:
- language: en
  script: Latn
  content: 'This Technical Specification has been prepared with the following purposes:
    _ to facilitate the application of the ISO 6743-7 classification standard and
    to precisely state the characteristics to be taken into account to establish specifications
    for a given application; _ these characteristics could serve as a basis for discussion
    between the end user and the supplier. This Technical Specification does not cover
    specified requirements which should be examined separately with a view to a common
    agreement between the end user and the product supplier. This Technical Specification
    also does not cover the health, safety, disposal and environmental areas which
    should be dealt with separately, according to the regulations or laws in force
    in each country.'
