abstract:
- language: en
  script: Latn
  content: 'This document establishes a digital ledger technology (DLT) agnostic, decentralized identifier (DID) framework for representing physical assets using tokens. This includes: A DID generation method: An algorithmic data method for generating DIDs from assets with immutable unique identifiers, e.g. serial numbers. A cryptographic method to tie asset data objects to the DID: An algorithmic hash tree data method for transferring a set of asset data objects that are cryptographically tied together, agnostic to any specific DLT or blockchain system. A DID method scheme: A DID method scheme to enable DID registry interoperability, so the digital representation can be stored, resolved or transferred to any compliant DID registry. Real world trust anchor processes: Processes for utilizing off-chain trust anchors to establish proof of real-world human and machine generated events and information that tie a real-world asset to its digital representation.'
