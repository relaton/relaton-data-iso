abstract:
- language: en
  script: Latn
  content: ISO 11681-2:2011 gives safety requirements and measures for their verification
    for the design and construction for tree service of portable, combustion-engine,
    hand-held chain-saws having a maximum mass, without guide bar or saw chain and
    with tanks empty, of 4,3 kg, intended to be used, with the right hand on the rear
    handle and left hand on the front handle, by a trained operator for pruning and
    dismantling standing tree crowns, and by persons having read and understood the
    safety requirements provided in the instruction handbook, using the appropriate
    personal protective equipment (PPE). Methods for the elimination or reduction
    of hazards arising from the use of these machines and the type of information
    on safe working practices to be provided by the manufacturer are specified. ISO
    11681-2:2011 deals with all significant hazards, hazardous situations and hazardous
    events relevant to these machines when they are used as intended and under conditions
    of misuse which are reasonably foreseeable by the manufacturer.
