abstract:
- language: en
  script: Latn
  content: This document specifies conditions and test methods for the durability
    of assistive products for tissue integrity (APTI) when lying down. These methods
    are additional to the ones in ISO 20342-1. This document is applicable to both
    reactive and active APTIs, such as mattresses and overlays, and includes single-patient
    multiple-use products. This document does not apply to single-use products. NOTE           
    This document is intended to help differentiate the durability characteristics
    between APTIs. It is not intended for determining overall performance or for ranking
    or scoring of such APTIs.
