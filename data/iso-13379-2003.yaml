abstract:
- language: en
  script: Latn
  content: ISO 13379:2003 gives guidance for data interpretation and diagnostics of
    machines. It is intended to allow the users and manufacturers of condition monitoring
    and diagnostics systems to share common concepts in the fields of machine diagnostics;
    to enable users to prepare the necessary technical characteristics that will be
    used for the further diagnosis of the condition of the machine; and to give an
    appropriate approach to achieve a diagnosis of machine faults. Since it gives
    general guidelines, a list of the machine types addressed is not included. However,
    the machine sets covered by ISO 13379:2003 will normally include industrial machines
    such as turbines, compressors, pumps, generators, electrical motors, blowers and
    fans.
