abstract:
- language: en
  script: Latn
  content: 'This document specifies communication requirements in support of the Smart
    Digital Tachograph (SDT) as identified by Regulation 2016/799 of the European
    Union[23]. The specification covers: —    the physical layer at 5,8 GHz for SDT
    communications (SDTC); —    the data link layer (DLL) of SDTC; —    the application
    layer of SDTC; —    SDTC profiles which provide coherent sets of communication
    tools for applications based on SDTC. This document provides further information
    beneficial for the design and development of SDTC equipment.'
