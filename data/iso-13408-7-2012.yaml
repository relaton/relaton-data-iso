abstract:
- language: en
  script: Latn
  content: ISO 13408-7:2012 specifies requirements and provides guidance on alternative
    approaches to process simulations for the qualification of the aseptic processing
    of medical devices and combination products that cannot be terminally sterilized
    and where the process simulation approach according to ISO 13408-1 cannot be applied.
    ISO 13408-7:2012 describes how risk assessment can be used during the development
    of an aseptic process to design a process simulation study for medical devices
    and combination products in those cases where a straightforward substitution of
    media for product during aseptic processing is not feasible or would not simulate
    the actual aseptic process.
