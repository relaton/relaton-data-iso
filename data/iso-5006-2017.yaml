abstract:
- language: en
  script: Latn
  content: ISO 5006:2017 specifies a static test method for determining and evaluating
    the operator's field of view on a rectangular boundary around the machine and
    on a 12 m visibility test circle (VTC). It is applicable to the earth-moving machines
    as defined in ISO 6165 that have a seated operator, and which are intended to
    operate on work sites and travel on public roads. It provides visibility performance
    criteria for machines up to the maximum operating mass according to ISO 6016,
    depending on the type of machine family listed in Table 1. For those machines
    not listed ? including larger machines, derivative and other types of earth-moving
    machinery ? the visibility test procedures can be used along with the risk assessment
    process defined in 10.4.
