abstract:
- language: en
  script: Latn
  content: 'ISO PAS 11154:2006 specifies the minimum safety requirements for all roof
    load carriers intended for mounting on or above the roofs of passenger cars and
    light commercial vehicles with a maximum authorized total mass up to 3,5 t (ISO
    M08) as defined in ISO 1176. It applies to: mechanically attached general-use
    roof bars suitable for carrying load,accessories and their attachments to roof
    bars for special purpose applications,mechanically attached specific purpose roof
    devices suitable for carrying a defined load,magnetic fixing devices suitable
    for carrying a defined load.'
