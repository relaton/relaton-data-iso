abstract:
- language: en
  script: Latn
  content: 'This document gives guidelines for assisting organizations in establishing,
    documenting, implementing, maintaining and continually improving material circulation
    in their design and development in a systematic manner, using an environmental
    management system (EMS) framework. These guidelines are intended to be used by
    those organizations that implement an EMS in accordance with ISO 14001. The guidelines
    can also help in integrating material circulation strategies in design and development
    when using other management systems. The guidelines can be applied to any organization
    regardless of its size or activity. This document provides guidelines for design
    strategies on material circulation to achieve the material efficiency objectives
    of an organization, by focusing on the following aspects: — type and quantity
    of materials in products; — product lifetime extension; — recovery of products,
    parts and materials. In design and development, many aspects are considered, such
    as safety, energy efficiency, performance and cost. Although important, they are
    not addressed in this document.'
