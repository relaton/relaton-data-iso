abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for rubber tubing and hoses used in diesel fuel circuits for internal combustion engines. The diesel fuels covered include “bio-diesels” which consist of the methyl ester of rape seed oil at levels up to 20 % by volume in conventional diesel fuels. NOTE            See Annex E for a detailed description of the “line call-out” used in tests for specific original equipment manufacturer (OEM) applications.
