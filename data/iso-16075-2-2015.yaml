abstract:
- language: en
  script: Latn
  content: 'ISO 16075-2:2015 covers the following issues: criteria for the design
    of treated wastewater (herinafter: TWW) irrigation projects intended to prevent
    public health risks within the population that has been in direct or indirect
    contact with the TWW or with any product that has come in contact with the TWW;
    specifications of the following: the quality of the TWW that can be used for irrigation;
    the types of crops that can be irrigated with TWW; the combination of the qualities
    of the irrigated TWW and the types of crops that can be irrigated; the strategy
    of using barriers that can reduce the risks that arise from TWW irrigation; the
    correlation between the quality of the TWW, the irrigated crops, and the types
    of barriers that can be used; the distance required between the TWW irrigation
    areas and residential areas.'
