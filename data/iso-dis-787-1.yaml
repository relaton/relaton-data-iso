abstract:
- language: en
  script: Latn
  content: Procedure for comparing the colour of a coloured pigment with that of an
    agreed sample. The procedures described in this document are acceptable but the
    method using an automatic muller is the reference method. The binder is not specified.
    It shall be agreed between the interested parties. If no binder is agreed, linseed
    oil, complying with the specification in ISO 150, should be used. - Replaces ISO/R
    787/1:1968.
