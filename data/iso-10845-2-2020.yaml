abstract:
- language: en
  script: Latn
  content: 'This document establishes, in respect of supply, services and construction
    contracts, at both main and subcontract levels, a) a format for the compilation
    of 1) calls for expressions of interest, 2) tender and contract documents, and
    b) the general principles for compiling procurement documents. NOTE 1: Annex A
    contains commentary on the clauses in this document. NOTE 2: This document can
    also be used, with some adaptation, in the formatting and compilation of concession
    contracts, design, build and operate contracts and contracts involving disposals.
    NOTE 3: ISO 10845-1:2020, Annex G provides guidance on the development of auction
    data.'
