abstract:
- language: en
  script: Latn
  content: "​​​This document describes information on steps, conditions and protocols
    for dismantling, safe maintenance and repair to facilitate remanufacturing, re-use
    and preparation for repurposing of battery systems, battery packs and battery
    modules designed for EV applications. This document also includes informative
    guidance on design and assembly techniques that facilitate the maintenance, repair,
    re-use and preparation for repurposing of EV battery systems, battery packs and
    battery modules. ​NOTE Individual cell replacement is only permitted when it is
    specifically allowed and described by the EV battery system, battery pack and
    battery module manufacturer. In this case, the manufacturer provides the necessary
    instructions for cell replacement.​​"
