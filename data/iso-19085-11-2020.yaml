abstract:
- language: en
  script: Latn
  content: 'This document gives the safety requirements and measures for stationary
    and displaceable combined woodworking machines, having at least two separately
    usable working units and with manual loading and unloading of the workpiece, hereinafter
    referred to as "machines". The integrated working units can be of these types
    only: — a sawing unit; — a moulding unit; — a planing unit. The machines are designed
    to cut solid wood and material with similar physical characteristics to wood.
    NOTE 1 For the definitions of stationary and displaceable machines, see ISO 19085‑1:2017,
    3.4 and 3.5. This document deals with all significant hazards, hazardous situations
    and events as listed in Clause 4, relevant to the machines, when operated, adjusted
    and maintained as intended and under the conditions foreseen by the manufacturer
    including reasonably foreseeable misuse. Also, transport, assembly, dismantling,
    disabling and scrapping phases have been taken into account. NOTE 2 For relevant
    but not significant hazards, e.g. sharp edges of the machine frame, see ISO 12100:2010.
    This document does apply to machines also equipped with the devices/additional
    working units listed in the Scopes of ISO 19085‑5:2017, ISO 19085‑6:2017, ISO
    19085-7:2019 and ISO 19085-9:2019. This document does not apply to: a) machines
    incorporating only a planing unit and a mortising device; NOTE 3 Such machines
    are dealt with in ISO 19085-7:2019. b) combined machines incorporating a band
    saw unit; c) machines with a mortising unit with a separate drive other than the
    planing unit drive; d) machines intended for use in potentially explosive atmosphere;
    e) machines manufactured before the date of its publication as an International
    Standard.'
