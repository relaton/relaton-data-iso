abstract:
- language: en
  script: Latn
  content: ISO 20182:2008 describes the procedure for the preparation of test panels
    from refractory materials by gunning through pneumatic-nozzle mixing type guns
    at ambient temperatures. ISO 20182:2008 does not apply to plastic gunning mixes,
    and might not apply to those mixes that contain aggregates that are susceptible
    to hydration. It also does not apply to shotcrete type mixes.
