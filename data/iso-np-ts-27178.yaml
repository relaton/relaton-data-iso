abstract:
- language: en
  script: Latn
  content: 'This standard establishes a common methodology for the quantification and reporting of GHG emissions arising from ship building. It covers cradle-to-gate GHG emissions arising from: • Raw material extraction and upstream processing of such materials (e.g. steel, composites, plastics, coatings) • Use of recycled material (e.g. steel) • Manufacturing of components and systems (e.g. propulsion systems, bridge equipment and systems) • Transportation of materials to and within the shipyard • Coating activities • On-site assembly and construction at the shipyard • Energy consumption during the building of the ship • Waste handling • Launching • Testing and sea trial. This standard can also be used when quantifying GHG emissions arising from major conversions, major repairs and installation of new equipment, which may occur during the ship’s operational lifetime, i.e. from gate-to-gate. It does not cover GHG emissions arising from the operations and day-to-day maintenance of the ship after it has left the shipyard. It also does not cover GHG emissions after the ship arrives for recycling'
