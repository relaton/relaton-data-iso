abstract:
- language: en
  script: Latn
  content: This document specifies the appropriate technical measures to eliminate or reduce risks arising from significant hazards during setting, operation, troubleshooting, and maintenance of the gob forming equipment. This document deals with all significant hazards, hazardous situations, or hazardous events, except for commissioning, installation, dismantling, and disposal, when it is used as intended and under conditions of misuse which are reasonably foreseeable by the manufacturer. Noise is not a significant hazard for this type of machine. This European Standard specifies the appropriate technical measures to eliminate or reduce risks arising from the significant hazards during commissioning, operation and maintenance. It applies to the design and construction of gob forming equipment. This standard does not deal with heating system. This document does not deal with additional equipment for gob forming equipment. Gob distributor platforms and feeder platforms are complementary structures of the building. These parts are not in the scope of the machinery supplier and shall be built under the exclusive responsibility of the end-user, in compliance with the safety requirements prescribed by the applicable regulations.
