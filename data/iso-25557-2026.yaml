abstract:
- language: en
  script: Latn
  content: This document specifies requirements and recommendations for the provision
    of health and social care services for older persons by healthcare and social
    care workforce, irrespective of whether the service is provided in the persons
    own home or in a care home. The services concerned also include short-term care
    e.g. respite care, enablement, and rehabilitation. Care services are provided
    in a variety of settings. While this document focuses on services provided in
    care facilities and care at home, including preventive, responsive, palliative
    and end of life care, many of the requirements and recommendations can be applied
    to the provision of care services in any setting. Service provision is based on
    the individual needs and preferences of the older person to assist self-determination,
    participation, safety, and security. The document encompasses the holistic needs
    of older persons receiving care at home and at care homes and the workforce, taking
    into consideration principles of equity, diversity, and inclusion. This document
    applies to all providers of care and support to older persons irrespective of
    size, structure, legal set up, or funding model (i.e. public, private or non-profit).
    This document does not cover standardization of clinical guidelines, medical devices
    and building codes (engineering and structural).
