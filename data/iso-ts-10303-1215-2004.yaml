abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1215:2004 specifies the application module for Physical breakdown.
    The following are within the scope of ISO/TS 10303-1215:2004: the identification
    of physical breakdowns of a product; the identification of the physical elements
    that comprise a product breakdown; the identification of parent-child relationships
    between physical breakdown elements; the relationships between elements in different
    physical breakdowns.'
