abstract:
- language: en
  script: Latn
  content: ISO 4869-3:2007 specifies a method for measuring the insertion loss of
    ear-muff type hearing protectors using an acoustic test fixture. The method is
    applicable to the investigation of production spreads of performance as part of
    type approval or certification procedures, and to the investigation of the change
    of performance with age. It is intended to ensure that ear-muff hearing protector
    samples submitted for subjective testing of attenuation according to ISO 4869-1
    have performances typical of the type. The method specified in ISO 4869-3:2007
    is not applicable as the basic test for type approval. Performance data obtained
    by this method are not intended to be quoted as representing the real-ear sound
    attenuation of an ear-muff, nor the protection provided by the ear-muff.
