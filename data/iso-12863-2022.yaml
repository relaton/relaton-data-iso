abstract:
- language: en
  script: Latn
  content: This document specifies a test method for testing the capability of a cigarette,
    positioned on one of three standard substrates, to extinguish or to generate sufficient
    heat to continue burning, and thus potentially cause ignition of bedding or upholstered
    furniture. This document is only applicable to factory-made cigarettes that burn
    along the length of a tobacco column. This is a performance-based document; it
    does not prescribe any design features of the cigarette that can lead to improved
    or degraded performance in the test method. The output of this method has been
    correlated with the potential for cigarettes to ignite upholstered furniture.
