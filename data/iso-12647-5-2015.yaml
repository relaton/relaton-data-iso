abstract:
- language: en
  script: Latn
  content: ISO 12647-5:2014 specifies the requirements for the screen printing of
    four-colour process-colour material used for display, signage, and graphics using
    flat bed or cylinder printing equipment. Both the size and resolution of the finished
    product are unrestricted. The process stages included are data preparation and
    delivery, proof production, printing forme preparation, and production printing.
