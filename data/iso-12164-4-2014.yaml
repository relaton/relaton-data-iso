abstract:
- language: en
  script: Latn
  content: ISO 12164-4:2014 specifies dimensions for receivers with taper and flange
    contact surfaces for hollow taper shanks in accordance with ISO 12164-3 to be
    applied to machine tools (e.g. turning machines, turning-mill machines). A range
    of sizes is specified. ISO 12164-4:2014 specifies the receiver of type T. It is
    for automatic tool exchange and manual clamping, which is achieved via holes in
    both the receiver and the tool shank. The torque is transmitted via the tail end
    of the shank through keys as well as friction.
