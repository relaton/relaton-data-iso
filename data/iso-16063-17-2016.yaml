abstract:
- language: en
  script: Latn
  content: ISO 16063 comprises a series of documents dealing with methods for the
    calibration of vibration and shock transducers. ISO 16063-17:2016 lays down detailed
    specifications for the instrumentation and procedure to be used for primary calibration
    of accelerometers using centrifuge calibration. ISO 16063-17:2016 is applicable
    to rectilinear accelerometers with zero-frequency response, mainly of the strain
    gauge or piezoresistive type, and to primary standard and working transducers.
    It is applicable for a calibration range from 10 m/s2 to 20 000 m/s2 (higher accelerations
    possible) at 0 Hz. The limits of uncertainty applicable are ±1 % of reading.
