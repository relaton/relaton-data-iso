abstract:
- language: en
  script: Latn
  content: This document addresses how artificial intelligence machine learning can
    impact the safety of machinery and machinery systems. This document describes
    how hazards being associated with artificial intelligence (AI) applications machine
    learning in machinery or machinery systems, and designed to act within specific
    limits, can be considered in the risk assessment process. This document is not
    applicable to machinery or machinery systems with AI applications machine learning
    designed to act beyond specified limits that can result in unpredictable effects.
    This document does not address safety systems with AI, for example, safety-related
    sensors and other safety-related parts of control systems.
