abstract:
- language: en
  script: Latn
  content: ISO 12867:2010, together with ISO 15004‑1, specifies minimum requirements
    and test methods for trial frames for holding trial case lenses, complying with
    ISO 9801, in front of a subject's eyes in order to assess visual acuity and facilitate
    optical correction of vision. ISO 12867:2010 is applicable to lens holders mounted
    on headbands, bracket-mounted frames and frames mounted in the manner of spectacles
    with supports on the ears and the bridge of the nose. It is applicable to all
    types of trial frame, including half-eye and rotating lens holders. ISO 12867:2010
    takes precedence over ISO 15004‑1, if differences exist.
