abstract:
- language: en
  script: Latn
  content: ISO 23900-2:2015 specifies a method of determining the colouristic properties
    of a test pigment relative to a standard, and the ease of dispersion DHPVC-P of
    pigments from the differences in colour strength on dispersing colouring materials
    under various conditions in plasticized polyvinyl chloride (PVC-P) compounds.
    The method is appropriate for use with organic and inorganic black and colour
    pigments and for pigment preparations.
