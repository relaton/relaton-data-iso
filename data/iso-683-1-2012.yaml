abstract:
- language: en
  script: Latn
  content: ISO 683-1:2012 specifies the technical delivery requirements for semi-finished
    products, hot formed (e.g. blooms, billets, slabs), bars, wire rod, finished flat
    products and hammer or drop forgings manufactured from the direct hardening non-alloy
    steels and the non-alloy flame and induction hardening steels listed (in Table
    3) and supplied in one of the heat-treatment conditions given for the different
    types of products (in Table 1) and in one of the surface conditions given (in
    Table 2). The steels are, in general, intended for the manufacture of quenched
    and tempered or austempered and flame- or induction-hardened machine parts, but
    can also be partly used in the normalized condition. The requirements for mechanical
    properties given in ISO 683-1:2012 are restricted to the sizes given (in Tables
    9 and 10). In addition to ISO 683-1:2012, the general technical delivery requirements
    of ISO 404 are applicable.
