abstract:
- language: en
  script: Latn
  content: 'This part of ISO 10097 specifies the nomenclature and the leading dimensions
    necessary for the interchangeability of the following wireline drilling equipment
    for drilling holes of diameter 1,890 in to 3,790 in, yielding cores of diameter
    1,063 in to 2,500 in. The equipment is illustrated in Figure 1 and comprises the
    following: a) core bit; b) reaming shell; c) core lifter; d) core lifter case;
    e) outer tube; f) inner tube; g) drill rod (smooth pipe only).'
