abstract:
- language: en
  script: Latn
  content: This part of ISO 17123 specifies test procedures for the preliminary assessment
    of the validity of an entire workflow involving photography with UAV photo measurement
    systems (Unmanned Aerial Vehicles with cameras – or also known as drone systems)
    used for specific surveying tasks, such as determining land surfaces, monitoring
    earthworks, monitoring and measuring all kind of structural designs and civil
    construction sites, calculating volumes and many other similar surveying applications. Primarily,
    these tests are intended to be field verifications of the suitability of a particular
    UAV system, including camera and processing software, and the survey results resulting
    from the synthesis of pre-planned shooting conditions to meet the accuracy requirements
    for a particular survey task. The focus for the test procedures is set to simplicity
    - they shall allow a quick judgement, if the system can obtain the desired accuracy
    given by the job. They are not intended for the calibration of UAV photo measurement
    systems. Both the full and the simplified test procedure require a minimal set
    of markers on the ground with known coordinates, to be used as ground control
    points and check points.
