abstract:
- language: en
  script: Latn
  content: 'ISO 13850:2015 Standard specifies functional requirements and design principles
    for the emergency stop function on machinery, independent of the type of energy
    used. It does not deal with functions such as reversal or limitation of motion,
    deflection of emissions (e.g. radiation, fluids), shielding, braking or disconnecting,
    which can be part of the emergency stop function. The requirements for this International
    Standard apply to all machines, with exception to: - machines where an emergency
    stop would not reduce the risk; - hand-held or hand-operated machines. NOTE The
    requirements for the realization of the emergency stop function based on electrical/electronic
    technology are described in IEC 60204‑1.'
