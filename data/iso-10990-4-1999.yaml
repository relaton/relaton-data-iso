abstract:
- language: en
  script: Latn
  content: 'This part of ISO 10990 specifies methods for use in performance testing
    of: traps used on land to kill mammals; traps used in submersion sets to kill
    semi-aquatic mammals. The performance testing includes methods for evaluation
    of effective killing, pathological evaluation, mechanical properties (see note),
    selectivity, capture efficiency and user safety. NOTE ISO/TC 191 recognizes that
    other trapping systems are under development but are at a preliminary stage. Consequently,
    inclusion of appropriate mechanical tests for such traps is premature at this
    time. Nevertheless, the committee recommends and supports the development of new
    types of traps and trapping systems together with appropriate testing methodologies.
    ISO/TC 191 further recommends that the issue receives in-depth (re)consideration
    at the five-year review and that all appropriate advances in technology are incorporated
    through the deliberations of the committee at that time.'
