abstract:
- language: en
  script: Latn
  content: This document is intended to help reference material producers (RMPs) in
    preparing clear and concise documentation to accompany a reference material (RM).
    It lists and explains mandatory, recommended and other categories of information
    to be considered in the preparation of product information sheets and RM certificates.
    This information can be used by RM users and other stakeholders in confirming
    the suitability of an RM or certified reference material (CRM). This document
    also contains the minimum requirements for a label attached to the container of
    an individual RM unit.
