abstract:
- language: en
  script: Latn
  content: 'This document describes the software (SW) layer called “proxy”. It supports
    the programming interface to security devices and the application using this API
    to access the application related security devices defined in ISO/IEC TS 23465-2.
    This document is applicable to: —     proxy requirements, functionality and layers;
    —     resolving mechanisms for API functions; —     data structures related to
    security device handling; —     translation for security device communication;
    —     serialization/de-serialization syntax and methods.'
