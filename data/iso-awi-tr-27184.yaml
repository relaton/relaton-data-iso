abstract:
- language: en
  script: Latn
  content: This document gives an overview of spectral characteristics for irradiation behind glass. The influence of the spectral transmittance of glass is discussed. It is investigated what spectral transmittance of window glass in almost all weathering standards can be used to achieve a good agreement to the target spectra for weathering applications behind glass. In an annex, a spectral transmittance is proposed as information, with which a very good agreement with the target spectrum can be achieved in almost all weathering applications behind glass.
