abstract:
- language: en
  script: Latn
  content: ISO 26143:2013 defines the space link extension (SLE) return operational
    control fields (ROCF) service in accordance with the SLE Reference Model (ISO
    15396:2007). The ROCF service is an SLE transfer service that delivers to a mission
    user all operational control fields from one master channel or one virtual channel.
    ISO 26143:2013 defines the ROCF service in terms of the operations necessary to
    provide the service, the parameter data associated with each operation, the behaviors
    that result from the invocation of each operation, and the relationship between,
    and the valid sequence of, the operations and resulting behaviors. It does not
    specify individual implementations or products, the implementation of entities
    or interfaces within real systems, the methods or technologies required to acquire
    telemetry frames from signals received from a spacecraft, the methods or technologies
    required to provide a suitable environment for communications, or the management
    activities required to schedule, configure, and control the ROCF service.
