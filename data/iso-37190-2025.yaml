abstract:
- language: en
  script: Latn
  content: This document provides guidance on identifying risks that can hinder the
    proper functioning of smart community infrastructures in smart cities, in accordance
    with the ISO 37155 guideline series, and on implementing mitigation measures.
    The guidance is particularly for regulatory authorities at both national and community
    supervisory levels. Authorities can check that the adoption of appropriate measures
    and the assignment of specification requirements in each component of the system
    is ensures in the life cycle of smart community infrastructure. To accomplish
    this, the framework and perspectives on what (documents, sites, etc.) can be used
    to ensure accountability for the implementation and its adequacy are presented.
    The framework ensures the interactions of smart community infrastructures are
    managed by adequate specification requirements and the adoption of adequate measures
    for planning and operation, as described in ISO 37155-1. Additionally, it aims
    for consistency between different systems of smart community infrastructures by
    allocating specification requirements to each component of a system and validating
    the allocating procedures, as described in ISO 37155-2. NOTE            This document
    describes a management case (not a management system), i.e. specific processes
    that an organization follows to meet specific objectives of this document.
