abstract:
- language: en
  script: Latn
  content: This document provides requirements for the format of icons or pictograms
    to ensure their consistency and safe usage in healthcare systems, particularly
    through their inclusion in terminological resources. The scope includes graphics
    design, the exact concept or code it will be linked to, including details of the
    terminology name, version as well as positioning within the hierarchical model,
    if the same exists. Steps to be followed if there is a change or expiry of the
    linked terminology or concept will be defined. Exact design aspects, for example,
    size and colour scheme of the specific image. Issues regarding easy readability,
    comprehensibility and consistency across different operating systems and screens
    are covered in Part 1 of this document.
