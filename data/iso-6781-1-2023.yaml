abstract:
- language: en
  script: Latn
  content: This document specifies requirements and methodologies for infrared thermographic
    services for detection of heat, air and moisture irregularities in buildings that
    help users to specify and understand a)       the extent of thermographic services
    required, b)       the type and condition of equipment available for use, c)       
    the qualifications of equipment operators, image analysts, and report authors
    and those making recommendations, and d)       the reporting of results. It provides
    guidance to understanding and utilizing the final results stemming from provision
    of the thermographic services. This document is applicable to the general procedures
    for infrared thermographic methods as can be applied to residential, commercial,
    and institutional and special use buildings.
