abstract:
- language: en
  script: Latn
  content: ISO 4395:2009 establishes a basic series for piston rod end types for application
    on cylinders used in hydraulic and pneumatic fluid power systems. ISO 4395:2009
    specifies thread dimensions and configurations for use with hydraulic and pneumatic
    cylinder piston rod ends, as well as the dimensions of wrench flats and hook wrench
    holes that are sometimes necessary for the assembly of the cylinder piston rod's
    threaded end to accessories.
