abstract:
- language: en
  script: Latn
  content: ISO 10390:2005 specifies an instrumental method for the routine determination
    of pH using a glass electrode in a 1:5 (volume fraction) suspension of soil in
    water (pH in H2O), in 1 mol/l potassium chloride solution (pH in KCl) or in 0,01
    mol/l calcium chloride solution (pH in CaCl2). ISO 10390:2005 is applicable to
    all types of air-dried soil samples, for example pretreated in accordance with
    ISO 11464.
