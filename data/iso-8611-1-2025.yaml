abstract:
- language: en
  script: Latn
  content: This document specifies the test methods available for evaluating new flat
    pallets for materials handling. The test methods are split into groups for —    
    nominal load testing, —     maximum working load testing, and —     durability
    comparison testing. This document does not apply to pallets with a fixed superstructure
    or a rigid, self-supporting container that can be mechanically attached to the
    pallet and which contributes to the strength of the pallet. NOTE   Specific tests
    for determining load capacity do not replace the value of conducting field tests
    on specific pallet designs.
