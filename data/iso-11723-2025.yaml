abstract:
- language: en
  script: Latn
  content: This document specifies a method using Eschka's mixture during ashing,
    extraction of the ash residue with acid, and hydride generation atomic absorption
    spectrometry or hydride generation atomic fluorescence spectrometry, for the determination
    of arsenic and selenium in solid mineral fuels. The method is also applicable
    for the determination of the analytes by hydride generation inductively coupled
    plasma atomic emission spectrometry.
