abstract:
- language: en
  script: Latn
  content: This document covers the measurements of particles on the test bench for
    both kinds of friction pairs (Disc and pads, wheel and brake shoes). This document
    specifies minimum test conditions and minimum requirements. This document also
    specifies apparatus and method. This document defines environmental requirements
    and sets a standard type of test programs and also test reports. This document
    defines the requirements for the test bench.
