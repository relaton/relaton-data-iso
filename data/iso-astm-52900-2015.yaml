abstract:
- language: en
  script: Latn
  content: ISO/ASTM 52900:2015 establishes and defines terms used in additive manufacturing
    (AM) technology, which applies the additive shaping principle and thereby builds
    physical 3D geometries by successive addition of material. The terms have been
    classified into specific fields of application. New terms emerging from the future
    work within ISO/TC 261 and ASTM F42 will be included in upcoming amendments and
    overviews of this International Standard.
