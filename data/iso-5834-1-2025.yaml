abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and corresponding test methods
    for ultra-high-molecular-weight polyethylene (UHMWPE) powder moulding materials
    for use in the manufacturing of moulded forms that are subsequently used in the
    manufacturing of surgical implants. This document is not applicable to UHMWPE
    moulding materials that were blended with any additives or different forms of
    polyethylene.
