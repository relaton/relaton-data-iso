abstract:
- language: en
  script: Latn
  content: ISO 15959:2016 specifies a method for the determination of phosphorus in
    fertilizer extracts. The method is applicable to all extracts of fertilizers for
    the determination of the different forms of phosphorus as phosphorus soluble in
    mineral acids, water soluble phosphorus, phosphorus soluble in solutions of ammonium
    citrate, phosphorus soluble in 2 % citric acid and phosphorus soluble in 2 % formic
    acid.
