abstract:
- language: en
  script: Latn
  content: ISO 25110:2017 defines the data transfer models between roadside equipment
    (RSE) and integrated circuit card (ICC) and the interface descriptions between
    the RSE and on-board equipment (OBE) for on-board accounts using the ICC. It also
    provides examples of interface definitions and transactions deployed in several
    countries.
