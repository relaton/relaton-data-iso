abstract:
- language: en
  script: Latn
  content: 'ISO 14644-7:2004 specifies the minimum requirements for the design, construction,
    installation, test and approval of separative devices, in those respects where
    they differ from cleanrooms as described in ISO 14644-4 and 14644-5. The application
    of ISO 14644-7:2004 takes into account the following limitations: user requirements
    are as agreed by customer and supplier; application-specific requirements are
    not addressed; specific processes to be accommodated in the separative-device
    installation are not specified; fire, safety and other regulatory matters are
    not considered specifically; where appropriate, national and local regulations
    apply. ISO 14644-7:2004 is not applicable to full-suits.'
