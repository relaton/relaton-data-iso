abstract:
- language: en
  script: Latn
  content: ISO 4753:2011 specifies the form and dimensions of ends of parts with external
    ISO metric screw thread (e.g. bolt, screw and stud ends) recommended for use.
    They apply to standardized or non-standardized threaded parts. For each end type,
    a symbol is specified and it is intended that these symbols be used when specifying
    one of the ends for threaded fasteners.
