  content: ISO/IEC TR 19763-9:2015 specifies a technical guideline on how to use the
    Role and Goal, Process, and Service (RGPS) metamodels to select appropriate combinations
    of models and/or services to support user-requests. The scope of ISO/IEC TR 19763-9
