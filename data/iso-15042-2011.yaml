abstract:
- language: en
  script: Latn
  content: ISO 15042:2011 establishes performance testing and rating criteria for
    factory-made residential, commercial and industrial, electrically-driven, mechanical-compression,
    air-cooled air-conditioners and air-to-air heat pumps, described as basic multi-split
    systems, modular multi-split systems and modular heat recovery multi-split systems.
    These multi-split systems include air-to-air systems with non-ducted and/or ducted
    indoor units with integral fans and indoor units supplied without fans. ISO 15042:2011
    is limited to single and multiple circuit split-systems which utilize one or more
    compressors with no more than two steps of control of the outdoor unit. It is
    also limited to split-systems with a single refrigeration circuit which utilize
    one or more variable-speed compressors or alternative compressor combinations
    for varying the capacity of the system by three or more steps. These split-systems
    are designed to operate with a combination of one or more outdoor units and two
    or more indoor units designed for individual operation, and such modular systems
    that are capable of transferring recovered heat from one or more indoor units
    to other units in the same system.
