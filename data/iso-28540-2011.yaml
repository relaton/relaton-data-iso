abstract:
- language: en
  script: Latn
  content: ISO 28540:2011 specifies a method for the determination of at least 16
    selected PAH (see Table 1) in drinking water and ground water in mass concentrations
    above 0,005 µg/l and surface water in mass concentrations above 0,01 µg/l (for
    each individual compound). ISO 28540:2011 can be used for samples containing up
    to 150 mg/l of suspended matter. This method is, with some modification, also
    suitable for the analysis of waste water. It is possible that this method is applicable
    to other PAH, provided the method is validated for each case.
