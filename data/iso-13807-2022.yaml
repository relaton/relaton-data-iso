abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the determination of the crack
    formation temperature of enamels for the chemical industry by subjecting enamelled
    steel specimens to thermal shock using cold water. The value of the crack formation
    temperature measured according to this test method does not apply to the finished
    component (see Annex A). It is a parameter of vitreous and porcelain enamels for
    comparing the relative quality of different enamel formulations.
