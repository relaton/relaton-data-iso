abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1217:2004 specifies the application module for Zonal breakdown.
    The following are within the scope of ISO/TS 10303-1217:2004: the identification
    of zonal breakdowns of a product; the identification of the elements that comprise
    a zonal breakdown; the identification of parent-child relationships between zonal
    breakdown elements; the relationships between elements in different zonal breakdowns;
    the representation of how a zonal breakdown element is realized by a product.
    EXAMPLE    The zonal breakdown element ''engine room'' might be realized by set
    of steel partitions.'
