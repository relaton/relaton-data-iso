abstract:
- language: en
  script: Latn
  content: ISO 18185-1:2007 provides a system for the identification and presentation
    of information about freight container electronic seals. The identification system
    provides an unambiguous and unique identification of the container seal, its status
    and related information. The presentation of this information is provided through
    a radio-communications interface providing seal identification and a method for
    determining whether a freight container's seal has been opened. ISO 18185-1:2007
    specifies a read-only, non-reusable freight container seal identification system,
    with an associated system for verifying the accuracy of use, having a seal status
    identification system,a battery status indicator,a unique seal identifier including
    the identification of the manufacturer,seal (tag) type. ISO 18185-1:2007 is used
    in conjunction with the other parts of ISO 18185. It applies to all electronic
    seals used on freight containers covered by ISO 668, ISO 1496-1 to ISO 1496-5,
    and ISO 8323. Wherever appropriate and practicable, it also applies to freight
    containers other than those covered by these International Standards.
