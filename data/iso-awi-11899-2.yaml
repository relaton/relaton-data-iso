abstract:
- language: en
  script: Latn
  content: This document specifies a test method to evaluate filters for use in controlling
    the characteristic of ultrafine bubble diluent for industrial process and measurement.
    Application of single filtering mode, series application mode of multiple filter
    and application mode of washing after a single filtering are described as typical
    case. Ultra-fine bubbles, unlike solid particles, are easily compressed and expanded,
    split, dissolved. When the water passage through micropores, it is investigated
    whether UFBs behave similarly to solid particles or not.
