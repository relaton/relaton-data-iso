abstract:
- language: en
  script: Latn
  content: This document provides requirements and best practices for planning, conducting
    and documenting in-water cleaning (IWC) operations safely, efficiently and in
    an environmentally sound manner. Additionally, this document provides requirements
    and best practices for reporting on the effectiveness of IWC operations. This
    document addresses all forms of IWC of external submerged surfaces, which are
    hull and niche areas, all types and levels of biofouling, which means biofilms,
    microfouling and macrofouling, conducted both with or without capture. It does
    not address internal piping. The document has been established to inform ports,
    regulatory agencies, ship biofouling IWC service providers, inspection service
    providers, IWC equipment manufacturers, coating manufacturers, shipowners, ship
    managers, ship operators and other relevant stakeholders.
