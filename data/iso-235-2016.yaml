abstract:
- language: en
  script: Latn
  content: 'ISO 235:2016 specifies the dimensions of the following three types of
    drills: a) parallel shank drills, stub series; b) parallel shank drills, jobber
    series; c) Morse taper shank drills. It comprises, for each type of drill mentioned
    above, three tables giving, respectively: a) the dimensions in millimetres; b)
    the dimension in inches; c) the corresponding lengths, in millimetres and in inches,
    set out as functions of diameter steps.'
