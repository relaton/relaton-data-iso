abstract:
- language: en
  script: Latn
  content: ISO 12966-4:2015 specifies a method for the determination of fatty acid
    methyl esters (FAMEs) derived by transesterification or esterification from fats,
    oils, and fatty acids by capillary gas chromatography (GLC). Fatty acid methyl
    esters from C8 to C24 can be separated using this part of ISO 12966 including
    saturated fatty acid methyl esters, cis- and trans-monounsaturated fatty acid
    methyl esters, and cis- and trans-polyunsaturated fatty acid methyl esters. The
    method is applicable to crude, refined, partially hydrogenated, or fully hydrogenated
    fats, oils, and fatty acids derived from animal and vegetable sources. This method
    is not suitable for the analysis of dairy, ruminant fats and oils, or products
    supplemented with conjugated linoleic acid (CLA). Milk and milk products (or fat
    coming from milk and milk products) are excluded from the scope of this part of
    ISO 12966. ISO 12966-4:2015 is not applicable to di-, tri-, polymerized and oxidized
    fatty acids, and fats and oils.
