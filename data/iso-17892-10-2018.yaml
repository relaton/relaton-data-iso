abstract:
- language: en
  script: Latn
  content: This document specifies two laboratory test methods for the determination
    of the effective shear strength of soils under consolidated drained conditions
    using either a shearbox or a ring shear device. This document is applicable to
    the laboratory determination of effective shear strength parameters for soils
    in direct shear within the scope of geotechnical investigations. The tests included
    in this document are for undisturbed, remoulded, re-compacted or reconstituted
    soils. The procedure describes the requirements of a determination of the shear
    resistance of a specimen under a single vertical (normal) stress. Generally three
    or more similar specimens from one soil are prepared for shearing under three
    or more different vertical pressures to allow the shear strength parameters to
    be determined in accordance with Annex B. Special procedures for preparation and
    testing the specimen, such as staged loading and pre-shearing or for interface
    tests between soils and other materials, are not covered in the procedure of this
    document. NOTE This document fulfils the requirements of the determination of
    the drained shear strength of soils in direct shear for geotechnical investigation
    and testing in accordance with EN 1997-1 and EN 1997-2.
