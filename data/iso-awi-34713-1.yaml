abstract:
- language: en
  script: Latn
  content: This document describes the basic concepts of controlled environment agriculture
    (CEA) systems (a term that includes greenhouses), specifies a framework for their
    control—including functional requirements—and defines the data produced and consumed
    by these systems. It is applicable to both soil-based and soilless cultivation
    systems (e.g., hydroponics) and covers various facility types such as greenhouses
    and vertical farms. It can also be applied to systems with different levels of
    automation, ranging from manually operated to fully automated systems. This document
    is intended for systems that implement data-driven environmental control, including
    agricultural automation.
