abstract:
- language: en
  script: Latn
  content: 'ISO 10256-4:2016 covers performance requirements for head and face protectors
    to be used by ice hockey goalkeepers. It is intended to be read in conjunction
    with ISO 10256‑1, ISO 10256‑2 and ISO 10256‑3. Performance requirements are established,
    where appropriate for the following: a) materials, assembly, and design; b) protected
    areas (coverage) and penetration resistance; c) shock absorption; d) puck impact
    resistance; e) retention; f) optical quality. NOTE 1 The requirements of a clause
    take precedent over a figure. NOTE 2 The intent of this part of ISO 10256 is to
    reduce the risk of injury to the head and face of ice hockey goalkeepers without
    compromising the form and appeal of the game.'
