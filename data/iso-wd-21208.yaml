abstract:
- language: en
  script: Latn
  content: The document sets out requirements and information for the design, application,
    selection, and operational integration of gas filtration in an operator enclosure
    that is environmentally controlled. It specifically addresses the removal of gas
    contaminants from the air using carbon-based filtration technologies. Gases that
    cannot be effectively removed by these technologies are not covered by this document.
