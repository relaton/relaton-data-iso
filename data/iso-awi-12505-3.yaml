abstract:
- language: en
  script: Latn
  content: This part of ISO 12505 specifics test methods for characteristics of convex
    face plates of skin barriers for ostomy aids. It does not cover medical properties
    (cytotoxicity, sensitization, irritation/intracutaneous reactivity, buffering
    effect, microbiological effects, etc.). The test methods do not individually or
    collectively define or recommend a product of a specific design, style or size,
    and do not recommend medical affairs such as treatment, nursing, etc.
