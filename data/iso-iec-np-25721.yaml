abstract:
- language: en
  script: Latn
  content: This document specifies a method for enabling the use of the same application by adopting the adaptable user interface, regardless of the user, device, or operating environment. An adaptable user interface is an interface that allows users to adjust the complexity of operations according to their needs and devices they use. The functionality provided by the adaptable interface includes key bindings for all input operations, structured of operation transitions, and operation using automatic scanning and looping functions. The method specified in this document is expected to accommodate differences among devices and improve ease of use in various environment of the user.
