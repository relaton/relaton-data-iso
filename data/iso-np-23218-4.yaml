abstract:
- language: en
  script: Latn
  content: This document specifies the general requirements of intelligent functions of NC systems, the reference architecture, the base platform and intelligent functions, guiding the intelligent development of the NC system. This document is applicable to NC systems used in machine tools (including metal cutting machine tools, metal forming machine tools and woodworking machine tools, etc.) and to partial assemblies of machine tools (including cabinets and auxiliary devices). It is also applicable to other production equipment using NC systems. This standard is applicable to the design, manufacture, production, use and maintenance of NC systems. This standard does not cover function, performance, or other properties of the NC system for machine tools that not related to intelligent; Intelligent functions should not unacceptably affect the basic capabilities of the NC system. The basic capabilities of the NC system, including functions, performance, and safety of NC system, which shall be in accordance with the relevant ISO/IEC standards.
