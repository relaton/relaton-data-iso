abstract:
- language: en
  script: Latn
  content: This document establishes a method for radioactivity measurement and determination
    of the storage periods of the radioactive wastes produced as a result of the medical
    application of radioisotopes based on counting measurements using a detector and
    decay correction of the initial activity concentration of the radioisotopes contained
    in the waste stream. It provides a set of controls and measurements for the self-clearance
    of the radioactive wastes by which the medical facility can be assured of meeting
    the clearance level. This document can also be used by testing laboratories or
    radioactive waste disposal operators. This document can also be useful for the
    guidance of the regulatory body. NOTE Due to the nature of the tests outlined,
    this document cannot be applied to pure beta emitting nuclides nor to alpha emitting
    nuclides with low energy gamma rays.
