abstract:
- language: en
  script: Latn
  content: This document specifies requirements for procedures that use the mechanical
    action of a Vettermann drum tester to produce changes in appearance (surface,
    structure and colour) to all types of textile floor coverings. It does not include
    pilling or colour changes due to other actions. NOTE            Changes produced
    by these drum tester are assessed in accordance with the applicable assessment
    standards.
