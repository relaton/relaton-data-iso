abstract:
- language: en
  script: Latn
  content: This document provides guidance and recommendations for the quantification
    of the carbon footprint of natural gas products in the natural gas upstream area.
    It sets out relevant information on the definition of the quantification objective
    and scope, life cycle inventory analysis, product carbon footprint impact assessment
    and interpretation of results, as well as product carbon footprint reporting.
    This document is applicable to the quantification, assessment, and reporting of
    the CFP and partial CFP of onshore and offshore natural gas produced from subsurface
    geological reservoirs in the upstream area, including shale gas, tight gas, and
    coalbed methane. It is intended for use as a reference by governments, relevant
    organizations, institutions, and other stakeholders in related activities.
