abstract:
- language: en
  script: Latn
  content: 'The proposed standard is the second part of a comprehensive series of
    international standards related to energy performance of underfloor air distribution
    systems. This standard shall stipulate in-situ measurement method of air stratification,
    a critical feature of UFAD system which is not covered by previous works. The
    new series of ISO standards will be composed of multiple parts as follows (tentatively).
    - Part 1: General overview (under publication) Part 2: In-situ measurement of
    room air stratification Part 3: In-situ measurement of thermal decay Part 4: Determination
    of air permeability of underfloor plenum This standard does not cover the conventional
    displacement ventilation system.'
