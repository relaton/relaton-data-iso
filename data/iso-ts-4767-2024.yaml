abstract:
- language: en
  script: Latn
  content: This document specifies methods for an accelerated photo-degradation test
    using an electrodeless plasma radiation source. This method is suitable for evaluating
    or predicting degradation and failure caused by the photo-degradation of a material
    and a product within a short-term period. Specimen preparation and evaluation
    of the results are covered in other International Standards for specific materials.
