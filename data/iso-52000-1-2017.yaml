abstract:
- language: en
  script: Latn
  content: ISO 52000-1:2017 establishes a systematic, comprehensive and modular structure
    for assessing the energy performance of new and existing buildings (EPB) in a
    holistic way. It is applicable to the assessment of overall energy use of a building,
    by measurement or calculation, and the calculation of energy performance in terms
    of primary energy or other energy-related metrics. It takes into account the specific
    possibilities and limitations for the different applications, such as building
    design, new buildings 'as built', and existing buildings in the use phase as well
    as renovation. NOTE Table 1 in the Introduction shows the relative position of
    ISO 52000-1:2017 within the set of EPB standards in the context of the modular
    structure as set out in ISO 52000-1:2017.
