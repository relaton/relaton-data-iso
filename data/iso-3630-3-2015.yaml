- language: en
  script: Latn
  content: ISO 3630-3:2015 specifies requirements and test methods for endodontic
    instruments used as pluggers and spreaders, used to compact endodontic filling
    materials not cited in ISO 3630‑1, ISO 3630‑2, ISO 3630‑4, or ISO 3630‑5. ISO
