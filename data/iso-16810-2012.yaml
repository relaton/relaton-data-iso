abstract:
- language: en
  script: Latn
  content: 'ISO 16810:2012 defines the general principles required for the ultra­sonic
    examination of industrial products that permit the trans­mis­sion of ultrasound.
    The specific conditions of application and use of ultrasonic examination, which
    depend on the type of product examined, are described in documents which could
    include: a) product standards; b) specifications; c) codes; d) contractual documents;
    e) written procedures. Unless otherwise specified in the referencing documents
    the minimum requirements of ISO 16810:2012 are applicable. ISO 16810:2012 does
    not define: 1) extent of examination and scanning plans; 2) acceptance criteria.'
