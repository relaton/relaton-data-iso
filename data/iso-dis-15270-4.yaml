abstract:
- language: en
  script: Latn
  content: This document specifies the terms, definitions, methodologies, and calculations
    that are necessary for the recovery of plastic waste through chemical recycling.
    The document defines the different types of chemical recycling technologies used
    in the recovery and subsequent recycling of plastics waste arising from post-industrial
    and post-consumer sources.  This document also specifies the requirements and
    calculations that should be considered in evaluating chemical recycling inputs
    and outputs and determining output classifications for the recycling operation
    and the downstream integration points. Further, this document gives guidance on
    the general quality requirements to be considered in all steps of the recovery
    process, and provides general recommendations for inclusion in material standards,
    test standards and product specifications.  The process stages, requirements,
    recommendations and terminology presented in this document are intended to be
    of general applicability.
