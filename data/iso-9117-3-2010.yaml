abstract:
- language: en
  script: Latn
  content: 'ISO 9117-3:2010 specifies a test method for determining the surface-drying
    characteristics of a coating of a paint or varnish which dries by the action of
    air or by chemical reaction of its components. The method is not intended to apply
    to stoving products. The method described may be carried out: as a "go/no go"
    test, by determining the surface-drying state after a specified time, to assess
    compliance with a particular requirement; by determining the surface-drying state
    at suitable intervals until the surface-drying time is obtained.'
