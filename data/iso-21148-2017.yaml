abstract:
- language: en
  script: Latn
  content: ISO 21148:2017 gives general instructions for carrying out microbiological
    examinations of cosmetic products, in order to ensure their quality and safety,
    in accordance with an appropriate risk analysis (e.g. low water activity, hydro-alcoholic,
    extreme pH values). Because of the large variety of products and potential uses
    within this field of application, these instructions might not be appropriate
    for some products in every detail (e.g. certain water-immiscible products).
