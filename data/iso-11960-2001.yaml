abstract:
- language: en
  script: Latn
  content: 'La présente Norme Internationale est applicable aux assemblages suivants
    conformément à l''ISO 10422 ou à l''API Spec 5B : - tube de cuvelage à filetage
    rond court (STC) - tube de cuvelage à filetage rond long (LC) - tube de cuvelage
    à filetage Buttress (BC) - tubes de cuvelage extreme-line (XC) ; - tube de production
    sans refoulement (NU) - tube de production à refoulement extérieur (EU) - tube
    de production à joint intégral (W). Pour ces assemblages, la présente Norme Internationale
    spécifie les conditions techniques de livraison des manchons et des protecteurs
    de filetage. Pour les tubes couverts par la présente Norme internationale, les
    éléments suivants sont définis : dimensions, masses, épaisseurs, grades et types
    de finition d''extrémité applicables. La présente Norme Internationale peut être
    aussi appliquée à des produits tubulaires avec des assemblages non définis dans
    des normes ISO/API. Les quatre groupes de produits, auxquels la présente Norme
    internationale est applicable, comprennent les nuances suivantes : - Groupe 1
    Tous les tubes de cuvelage et de production de nuances H, J, K et N - Groupe 2
    Tous les tubes de cuvelage et de production de nuances C, L, M et T - Groupe 3
    Tous les tubes de cuvelage et de production de nuance P - Groupe 4 Tous les tubes
    de cuvelage de nuance Q. Les dimensions de tubes de cuvelage supérieures à Label
    1:4-1/2 mais inférieures à Label 1:10-3/4 peuvent être spécifiées par l''acheteur
    en tant que «service comme tubes de production» ; voir les Tableaux CA, C.24,
    C.30 et C.31 ou les Tableaux E.1, E.24, E.30 et E.31.'
