abstract:
- language: en
  script: Latn
  content: 'The information in ISO/TS 16829:2017 covers all kinds of ultrasonic testing
    on components or complete manufactured structures for either correctness of geometry,
    for material properties (quality or defects), and for fabrication methodology
    (e.g. weld testing). ISO/TS 16829:2017 enables the user, along with a customer
    specification, or a given test procedure or any standard or regulation to select:
    - ultrasonic probes, probe systems and controlling sensors; - manipulation systems
    including controls; - electronic sub-systems for the transmission and reception
    of ultrasound; - systems for data storage and display; - systems and methods for
    evaluation and assessment of test results. With regard to their performance, ISO/TS
    16829:2017 also describes procedures for the verification of the performance of
    the selected test system. This includes - tests during the manufacturing process
    of products (stationary testing systems), and - tests with mobile systems.'
