abstract:
- language: en
  script: Latn
  content: ISO/TS 21268-4:2007 specifies a test method to obtain information on the
    short- and long-term leaching behaviour and characteristic properties of materials.
    It applies to the determination of the influence of pH on the leachability of
    inorganic and organic constituents from soil and soil material, and the ecotoxicological
    effects of eluates with respect to microorganisms, fauna and flora. The test is
    not suitable for constituents that are volatile under ambient conditions. The
    test procedure specified in ISO/TS 21268-4:2007 produces eluates that are subsequently
    characterized by physical, chemical and ecotoxicological standard methods.
