abstract:
- language: en
  script: Latn
  content: 'The objective of this document is to analyse gaps in geospatial standards
    for indoor-outdoor seamless navigation. This document is intended to be used by
    designers, developers and providers of outdoor or indoor navigation services.
    This document: a)       specifies the concepts for the indoor-outdoor seamless
    navigation; b)       outlines conceptual architecture and scenarios (or use-cases)
    for indoor-outdoor seamless navigation; c)        analyses the gap of the current
    geospatial standards for implementing the indoor-outdoor seamless navigation;
    d)       highlights standardization items to be proceeded to get more interoperability.'
