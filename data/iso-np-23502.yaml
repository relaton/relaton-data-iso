abstract:
- language: en
  script: Latn
  content: This standard specifies a method for the laboratory determination, using
    a weighing digital liquid density meter (WDDM), of the density of crude petroleum,
    liquid petroleum products, and mixtures of petroleum and non-petroleum products
    normally handled as liquids and having a Reid vapour pressure (RVP) of 100 kPa
    or less. This standard is suitable for determining the density of liquids with
    sufficient fluidity at the test temperature and pressure.
