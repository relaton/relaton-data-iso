abstract:
- language: en
  script: Latn
  content: 'This proposal specifies an inductively coupled plasma mass spectrometric
    method (ICP-MS) for simultaneous determination of 15 impurity elements contents
    in copper cathode, involving chromium (Cr), manganese (Mn), iron (Fe), cobalt
    (Co), nickel (Ni), zinc (Zn), arsenic (As), selenium (Se), silver (Ag), cadmium
    (Cd), tin (Sn), antimony (Sb), tellurium (Te), lead (Pb) and bismuth (Bi). This
    standard is applicable to the determination of content ranges (mass fraction)
    of the impurity elements in copper cathode given below: Cr:0,00008 to 0,0015 Ag:0,00050
    to 0,010 Mn:0,00005 to 0,0015 Cd:0,00005 to 0,0015 Fe:0,00020 to 0,0030 Sn:0,00005
    to 0,0015 Co:0,00005 to 0,0020 Sb:0,00010 to 0,0020 Ni:0,00005 to 0,0020 Te:0,00005
    to 0,0015 Zn:0,00005 to 0,0020 Pb:0,00050 to 0,0050 As:0,00010 to 0,0020 Bi:0,00005
    to 0,0015 Se:0,00010 to 0,0015'
