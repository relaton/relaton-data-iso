abstract:
- language: en
  script: Latn
  content: This document is applicable to compressors, partially completed compressor units and compressor units having an operating pressure greater than 50 kPa and designed to compress air, nitrogen or inert gases. This document deals with all significant hazards, hazardous situations and events relevant to the design, installation, operation, maintenance, dismantling and disposal of compressors and compressor units when they are used as intended and under conditions of misuse which are reasonably foreseeable by the manufacturer (see Clause 4). This document includes under the general term compressor units those machines which comprise the compressor, a drive system, and any component or device which is necessary for operation. This document covers compressors driven by any power media, including battery powered and which are fitted in or used with motor vehicles. The significant hazards dealt with in this document are identified in Annex A. This document does not cover requirements for compressors and compressor units used in potentially explosive atmospheres. This document is not applicable to compressors and compressor units which are manufactured before the date of publication of this document. This document does not cover compressors and compressor units for processing petroleum, petrochemicals, or chemicals within the scope of ISO/TC 67. This document does not give performance levels or safety integrity levels for safety related parts of control systems.
