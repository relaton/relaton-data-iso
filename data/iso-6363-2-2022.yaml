abstract:
- language: en
  script: Latn
  content: 'This document specifies the mechanical properties of wrought aluminium
    and aluminium alloy rods/bars, tubes and wires for general engineering applications
    (except aeronautical rivets). It is applicable to products which are extruded
    and then cold drawn. It does not apply to: —    products which are rolled and
    then cold drawn, including seam-welded tubes; —    forging stock, wire for drawing
    stock; —    drawn wires for aeronautical application, electrical or welding purposes.'
