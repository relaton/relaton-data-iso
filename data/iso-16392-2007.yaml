abstract:
- language: en
  script: Latn
  content: ISO 16392:2007 describes a test method to measure the electrical resistance
    of pneumatic and solid tyres, under load, on a test rig. Static charges on a vehicle
    sometimes need to be dissipated by way of the tyre. Electrical resistance inversely
    measures the ability of the tyre to dissipate static charge from the vehicle.
    The method specifies procedures and equipment such that electrical resistance
    can be accurately determined for tyres with values up to 1012 ohms.
