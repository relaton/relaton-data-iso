abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for pipes and fittings
    which are part of piping systems for the rehabilitation of non-pressure underground
    drains and sewers. NOTE            It is not applicable to use of PVC-U material
    for rehabilitation of pipes under pressure. It is applicable to unplasticized
    poly (vinyl chloride) (PVC-U) pipes, fittings and assemblies, as manufactured
    and as installed with service temperature not exceeding 35 °C. It is not applicable
    to the existing pipeline. This document is applicable to the renovation technique
    family “lining with close-fit pipes”.
