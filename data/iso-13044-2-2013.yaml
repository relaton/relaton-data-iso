abstract:
- language: en
  script: Latn
  content: ISO 13044-2:2013 specifies the mechanical, electrical/electronic and pneumatic
    characteristics of a fully automated fifth wheel coupling system to ensure interchangeability
    between a tractor vehicle and a coupled semi-trailer(s) with 24 V nominal supply
    voltage. The two vehicles together constitute an articulated vehicle. ISO 13044-2:2013
    also supports the smooth introduction of fully automated fifth wheel coupling
    systems in the market. It specifies features necessary for mixed mode operation;
    i.e. the combination of a fully automated coupling system (FACS) equipped tractor
    vehicle with a conventional semi-trailer, and vice versa, the combination of a
    conventional tractor vehicle with a FACS-equipped semi-trailer.
