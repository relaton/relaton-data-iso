abstract:
- language: en
  script: Latn
  content: 'This document provides the principles and procedures for environmental
    management of the end-of-life phase of concrete and concrete structures. The end-of-life
    phase comprises three modules: demolition, intermediate treatment, and final disposal.
    This document also covers comprehensive environmental management of the entire
    end-of-life phase of concrete and concrete structures, with consideration of the
    next generations, including recovery within the scope of environmental management.'
