abstract:
- language: en
  script: Latn
  content: ISO 9022-14:2015 specifies the methods relating to the environmental tests
    of optical instruments including additional assemblies from other fields (e.g.
    mechanical, chemical, and electronic devices) under equivalent conditions, for
    their ability to resist the influence of dew, hoarfrost or ice. The purpose of
    testing is to investigate to what extent the optical, climatic, mechanical, chemical,
    and electrical (including electrostatic) performance characteristics of the specimen
    are affected by dew, hoarfrost, or ice.
