abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the change of
    mass and the change of volume of self-levelling and non-sagging sealants used
    in joints in building construction. NOTE            This test procedure is not
    intended to determine the absolute maximum value of loss of mass and volume of
    a tested sealant, but it is an indicative measurement of the loss of mass and
    volume under specified parameters.
