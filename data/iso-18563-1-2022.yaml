abstract:
- language: en
  script: Latn
  content: This document specifies the functional characteristics of multi-channel
    ultrasonic phased array instruments used for array probes and provides methods
    for their measurement and verification. This document is also applicable to ultrasonic
    phased array instruments in automated systems; but other tests can be needed to
    ensure satisfactory performance. When the phased array instrument is a part of
    an automated system, the acceptance criteria can be modified by agreement between
    the parties involved. This document also can partly be applicable to FMC instruments
    and TFM instruments. This document gives the extent of the verification and defines
    acceptance criteria within a frequency range of 0,5 MHz to 10 MHz.
