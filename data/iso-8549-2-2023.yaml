abstract:
- language: en
  script: Latn
  content: This document defines terms used to describe external limb prostheses.
    The terms related to the amputation level used to in this document are described
    in ISO 8549‑4. The types of component used in the construction of prostheses are
    classified and described in ISO 13405‑1, ISO 13405‑2 and ISO 13405‑3. For the
    purposes of this document, the abbreviated term ‘prosthetics’ and its derivatives
    only apply to external limb prosthetics.
