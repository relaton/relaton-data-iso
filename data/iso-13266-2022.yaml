abstract:
- language: en
  script: Latn
  content: This document specifies a method of testing the resistance of the upper
    assembly of inspection chambers and manhole components against surface and traffic
    loading. It is not applicable to requirements for testing the cover and frame.
    Those requirements are specified in EN 124-1 or other standards, depending on
    the material. NOTE    Upper assembly components normally include shafts or risers,
    cones, telescopic adapters and near surface components.
