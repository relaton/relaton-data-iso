abstract:
- language: en
  script: Latn
  content: This document establishes the general specifications, requirements and
    tests for decomposition blockers located on the high-pressure side in battery
    vehicles and gas containers as defined in EN 13807 or in acetylene bundles as
    defined in ISO 10961. NOTE 1       The terms “upstream” and “downstream” refer
    to the normal direction of gas flow in the decomposition blocker. 1 bar = 0,1 MPa
    = 105 Pa; 1 Pa = 1 N/m2. All pressures are expressed in gauge pressures. NOTE
    2       This document can be used as a guideline for decomposition blocker for
    filling centre application.
