abstract:
- language: en
  script: Latn
  content: This document specifies requirements and principles for the design and application of location plans, maps and diagrams used in public areas and workplaces to assist users to understand the environment, locate facilities and determine appropriate routes to reach those facilities. These location plans, maps and diagrams are referred to as location plans in this document. Location plans are intended for use in, for example, shopping centres, stores, hospitals, bus and train stations, airports, sporting and entertainment complexes, urban areas, parks, gardens and countryside, public attractions, museums and office complexes. This document is not applicable to the design of escape plans, nor does it cover the design of location signs, direction signs, information index signs, and installation and assessment of wayfinding systems. NOTE 1        The design of escape plans is covered in ISO 23601. NOTE 2        The design of location signs and direction signs is covered in ISO 28564-2. The design of information index signs is covered in ISO 28564-3. The installation and assessment of wayfinding systems are covered in ISO 28564-4.
