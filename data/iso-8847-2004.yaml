abstract:
- language: en
  script: Latn
  content: ISO 8847:2004 specifies the minimum level of requirements for operation,
    construction and installation of cable and pulley steering systems on sailing
    craft of hull length up to 24 m , with or without an auxiliary engine. ISO 8847:2004
    sets requirements for the design and construction of all components of a steering
    system from the wheel to, and including, the steering arm. It applies only to
    cable and pulley steering systems, whether for pedestal or bulkhead types. The
    design and specifications for the rudder shaft and rudder blade are within the
    province of the naval architect and are assumed to be appropriate to the size
    and speed of the boat.
