abstract:
- language: en
  script: Latn
  content: 'This part of ISO 6363 specifies the technical conditions for the inspection
    and delivery of wrought aluminium and aluminium alloys rods/bars, tubes and wires
    for general engineering applications. It applies to products which are extruded
    and then cold drawn. It does not apply to: — products which are rolled and then
    cold drawn, including seam-welded tubes; — forging stock, wire for drawing stock;
    — drawn wires for aeronautical application, electrical or welding purposes.'
