abstract:
- language: en
  script: Latn
  content: ISO 12715:2014 introduces two metal reference blocks, the hemicylindrical-stepped
    (HS) block and the side-drilled-hole (SDH) block. ISO 12715:2014 establishes procedures
    for measuring the sound beam profiles generated by probes in contact with the
    test object. The probes include straight-beam, angle-beam (refracted compressional
    and refracted shear wave), focused beam, and dual-element probes. The side dimension
    of the probe has to be no greater than 25 mm. The methodology of ISO 12715:2014
    provides guidelines for probes to be used for different metals including forged
    or rolled steel, aluminium, or titanium alloy products. The frequency range of
    the probes used in ISO 12715:2014 extends from 1 MHz to 15 MHz, where 1 MHz to
    5 MHz is best suited for steels and 5 MHz to 15 MHz is best for fine grain structured
    alloys such as aluminium products.
