abstract:
- language: en
  script: Latn
  content: 'ISO 10360-5:2010 specifies acceptance and periodic reverification tests
    of CMM performance with contacting probing systems and is only applicable to CMMs
    using any type of contacting probing system, a discrete point probing mode, and
    spherical or hemispherical stylus tip(s). It complements ISO 10360-7, which is
    the module for CMMs with video probing systems, and ISO 10360-2, which is universal,
    i.e. not probe-type specific. ISO 10360-5:2010 applies to CMMs supplied with any
    of the following: single-stylus probing system; multi-stylus probing systems with
    fixed multiple styli attached to a single probe (e.g. “star” stylus); multiple
    probing systems such as those with a stylus for each of their probes; systems
    with articulating probing; stylus and probe changing systems; manual (non-driven)
    CMMs. ISO 10360-5:2010 is not applicable to non-contacting probing systems, which
    require different testing procedures.'
