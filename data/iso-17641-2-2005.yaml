abstract:
- language: en
  script: Latn
  content: 'ISO 17641-2:2005 specifies the required specimens, the test piece dimensions
    and the procedures to be followed to carry out self-restraint hot cracking tests.
    The following tests are described: T-joint weld cracking test;weld metal tensile
    test;longitudinal bend test. The tests are designed to provide information about
    the hot cracking sensitivity of weld metals. The tests are not suitable for the
    assessment of parent materials. This International Standard applies primarily
    to fully austenitic stainless steels; nickel, nickel-base and nickel-copper weld
    metals. It can also be used for other weld metals. ISO 17641-2:2005 describes
    only how to carry out the tests and report the results. It does not give any acceptance
    criteria.'
