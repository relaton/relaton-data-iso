abstract:
- language: en
  script: Latn
  content: Organisations need a general framework to avoid data and information silos
    in order to share and create knowledge and ensure data and information quality.
    This framework should be aligned with organization strategy and culture. Information
    Governance (ISO definition) offer a general framework of processes by which an
    organization obtains assurance that the risks to its information, and thereby
    the operational capabilities and integrity of the organization, are effectively
    identified and managed. It makes easy implement common practices to create a homogenous
    organisational information culture, and easy access to the information. Nowadays
    there is a lack about this framework, although there are different initiatives,
    and different terminologies are used. Hence, the scope of this proposal is to
    establish the common concepts and principles and to develop a new series of standard
    in the field of information governance. This International Standard provides guiding
    principles for members of governing bodies of organizations (which can comprise
    owners, directors, partners, executive managers, or similar) on the effective,
    efficient, compliant, secure, transparent and accountable creation, use, maintenance,
    preservation and disposition of data and information within their organizations.
    It also provides guidance to those advising, informing, or assisting governing
    bodies. This International Standard applies to the governance of the organization's
    current and future use of information, data and Knowledge assets including management
    processes and decisions related to the current and future use of information.
    These processes can be controlled by the specialists within the organization,
    external service providers, or business units within the organization. This International
    Standard defines information governance as a subset or domain of organizational
    governance, or in the case of a corporation, corporate governance. Information
    governance is closely coupled with other management systems standards, information
    and documentation standards, governance of IT and information security. Specific
    issues in these domains are covered in other ISO/IEC standards, and are out of
    scope of this International Standard. This International Standard is applicable
    to organizations of all sizes in all the sectors, including public and private
    companies, government entities, and not-for-profit organizations.
