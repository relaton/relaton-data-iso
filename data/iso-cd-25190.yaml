abstract:
- language: en
  script: Latn
  content: This standard specifies the monitoring requirements, and methodologies
    for intake and assessment of internal dose to individuals occupationally exposed
    to plutonium. This Standard specifies the minimum requirements for the design
    of monitoring programmes using direct and indirect methods, criteria for selection
    of radiation workers, interpretation of monitoring data, quality assurance and
    requirements for recording and reporting of internal doses. This standard is not
    applicable to members of the public.
