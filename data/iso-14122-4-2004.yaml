abstract:
- language: en
  script: Latn
  content: ISO 14122-4:2004 applies to all machinery (stationary and mobile) where
    fixed means of access are necessary. The purpose of the standard is to define
    the general requirements for safe access to machines mentioned in ISO 12100-2.
    ISO 14122-1 gives advice about the correct choice of access means when the necessary
    access to the machine is not possible directly from the ground level or from a
    floor. The standard applies to fixed ladders which are a part of a machine. It
    may also be applied to ladders fixed to that part of the building where the machine
    is installed, providing the main function of that part of the building is to provide
    a means of access to the machine. It also applies to ladders which are not permanently
    fixed to the machine and which may be removed, moved to the side or pivoted (swivel-mounted)
    for some operations of the machine (e.g. changing tools in a large press).
