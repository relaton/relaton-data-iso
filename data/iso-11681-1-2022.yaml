abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements and measures for verification
    for the design, construction, transporting and commissioning of portable, combustion-engine,
    hand-held chain-saws. The chain-saws are intended to be used for forest work by
    only one operator, with the right hand on the rear handle and left hand on the
    front handle. Dismantling and scrapping of the product is not covered by this
    document. Methods for the elimination or reduction of hazards arising from the
    use of these machines and the type of information on safe working practices to
    be provided by the manufacturer are specified. This document deals with all significant
    hazards, hazardous situations and hazardous events, with the exception of kickback
    and balance for machines with an engine displacement of more than 80 cm3, relevant
    to these machines when they are used as intended and under conditions of misuse
    which are reasonably foreseeable by the manufacturer (see Annex A). This document
    is applicable to chain-saws manufactured after its date of publication.
