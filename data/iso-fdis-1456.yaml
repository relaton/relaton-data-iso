abstract:
- language: en
  script: Latn
  content: ISO 1456:2009 specifies requirements for decorative nickel, nickel plus
    chromium, copper plus nickel and copper plus nickel plus chromium coatings that
    are applied to iron, steel, zinc alloys, copper and copper alloys, and to aluminium
    and aluminium alloys, to provide an attractive appearance and enhanced corrosion
    resistance. Coating designations are specified that differ in thickness and type,
    and guidance is given on selecting the coating designation appropriate for the
    service conditions to which the coated product will be exposed. ISO 1456:2009
    does not specify the surface condition required by the basis metal prior to the
    coating process, and is not applicable to coatings on sheet, strip or wire in
    the non-fabricated form nor to threaded fasteners or coil springs.
