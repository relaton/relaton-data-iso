abstract:
- language: en
  script: Latn
  content: 'This document provides requirements and guidance for the structural design
    and/or assessment of floating offshore platforms used by the petroleum and natural
    gas industries to support the following functions: — production; — storage and/or
    offloading; — drilling and production; — production, storage and offloading; —
    drilling, production, storage and offloading. NOTE 1 Floating offshore platforms
    are often referred to using a variety of abbreviations, e.g. FPS, FSU, FPSO (see
    Clauses 3 and 4), in accordance with their intended mission. NOTE 2 In this document,
    the term "floating structure", sometimes shortened to "structure", is used as
    a generic term to indicate the structural systems of any member of the classes
    of platforms defined above. NOTE 3 In some cases, floating platforms are designated
    as "early production platforms". This term relates merely to an asset development
    strategy. For the purposes of this document, the term "production" includes "early
    production". This document is not applicable to the structural systems of mobile
    offshore units (MOUs). These include, among others, the following: — floating
    structures intended primarily to perform drilling and/or well intervention operations
    (often referred to as MODUs), even when used for extended well test operations;
    — floating structures used for offshore construction operations (e.g. crane barges
    or pipelay barges), for temporary or permanent offshore living quarters (floatels),
    or for transport of equipment or products (e.g. transportation barges, cargo barges),
    for which structures reference is made to relevant recognized classification society
    (RCS) rules. This document is applicable to all possible life-cycle stages of
    the structures defined above, such as: — design, construction and installation
    of new structures, including requirements for inspection, integrity management
    and future removal, — structural integrity management covering inspection and
    assessment of structures in-service, and — conversion of structures for different
    use (e.g. a tanker converted to a production platform) or re‑use at different
    locations. The following types of floating structure are explicitly considered
    within the context of this document: a) ship-shaped structures and barges; b)
    semi-submersibles; c) spars; d) shallow-draught cylindrical structures. In addition
    to the structural types listed above, this document covers other floating platforms
    intended to perform the above functions, consisting of partially submerged buoyant
    hulls made up of any combination of plated and space frame components. These other
    structures can have a great range of variability in geometry and structural forms
    (e.g. tension leg platforms) and, therefore, can be only partly covered by the
    requirements of this document. In other cases, specific requirements stated in
    this document can be found not to apply to all or part of a structure under consideration.
    NOTE 4 Requirements for topsides structures are presented in ISO 19901-3. In the
    above cases, conformity with this document requires the design to be based upon
    its underpinning principles and to achieve a level of safety equivalent, or superior,
    to the level implicit in it. NOTE 5 The speed of evolution of offshore technology
    often far exceeds the pace at which the industry achieves substantial agreement
    on innovation in structural concepts, structural shapes or forms, structural components
    and associated analysis and design practices, which are continuously refined and
    enhanced. On the other hand, International Standards can only capture explicit
    industry consensus, which requires maturation and acceptance of new ideas. Consequently,
    advanced structural concepts can, in some cases, only be partly covered by the
    requirements of this document. This document is applicable to steel floating structures.
    The principles documented herein are, however, considered to be generally applicable
    to structures fabricated in materials other than steel.'
