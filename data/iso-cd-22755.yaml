abstract:
- language: en
  script: Latn
  content: This document specifies the test methods for measuring the contact angle
    of powders. The sessile drop method is used for contact angles larger or equal
    to 90°. The Wilhelmy plate and liquid penetration (Washburn) methods are used
    for contact angles smaller than 90°. Time dependent effects are not considered
    in this document. The powders should not be soluble in the test liquid.
