abstract:
- language: en
  script: Latn
  content: This document specifies requirements and provides guidance for organizations
    to prevent and combat violence against women. The requirements specified in this
    document are applicable to all forms of violence against women and pertains to
    all activities of an organization, including externally provided processes. This
    document is intended for use by all types of organizations regardless of the type,
    size and nature of the activity, as well as whether the organization is from the
    public, private or non-profit sectors, whether large or small, and whether operating
    in developed or developing countries.
