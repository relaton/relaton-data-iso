abstract:
- language: en
  script: Latn
  content: This document specifies criteria for construction, establishes performance
    test methods and defines acceptance criteria for telescopic mechanical screw-
    and nut-type drawbar jacks and hydraulic drawbar jacks intended to be fitted on
    the implement tongue of interchangeable towed machinery [here after referred to
    as "implement(s)"] as original equipment or as replacement jacks. In addition,
    it specifies minimum markings and information for use to be provided by the jack
    manufacturer. These jacks are used specifically for — supporting the hitch points
    of implements during storage; — lifting and lowering of implement tongues to facilitate
    attaching to or disconnecting from an agricultural tractor; and — levelling an
    implement for stationary use.
