abstract:
- language: en
  script: Latn
  content: This document establishes required practices for the safe use of mobile
    cranes, as defined in ISO 4306-2. This document is intended to be used in conjunction
    with ISO 12480-1. Subjects covered include safe systems of work, management, planning,
    selection, erection and dismantling, operation and maintenance of cranes, the
    selection of operators, slingers and signalers. It does not cover manually operated
    (non-powered) cranes, cranes in which at least one of its motions is manually
    operated and cranes mounted on water-borne vessels, except in those circumstances
    where a land-based crane is temporarily affixed to a vessel.
