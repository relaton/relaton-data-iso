abstract:
- language: en
  script: Latn
  content: This document specifies a method for quantitative determination of various
    perfluorinated hydrocarbons by means of High-Performance Liquid Chromatography
    (HPLC) and mass spectrometry in soil, sludge, sediment and waste (see Table 1).
    For many substances to which this document applies a limit of quantification (LOQ)
    of 0.1 to 10 μg/kgdm can be achieved. The method can be applied to the analysis
    of additional PFAS not specified in the scope, if validity is proven by proper
    in-house validation protocols. For each target compound both, eventually occurring
    branched, isomers and the respective non-branched isomer are quantified together.
    In this method the amount of linear and branched PFAS is quantified using the
    response factor of the linear PFAS in the calibration standard and the total area
    of the linear and branched PFAS (Annex 1 gives more explanation)
