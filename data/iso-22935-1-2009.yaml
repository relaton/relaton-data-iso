abstract:
- language: en
  script: Latn
  content: ISO 22935-1¦IDF 99-1:2009 gives general guidance for the recruitment, selection,
    training, and monitoring of assessors for sensory analysis of milk and milk products.
    It specifies criteria for the selection, and procedures for the training and monitoring,
    of selected assessors and expert sensory assessors for milk and milk products.
    It supplements the information given in ISO 8586-1 and parts of ISO 8586-2 that
    deal with expert sensory assessors.
