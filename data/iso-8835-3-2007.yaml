abstract:
- language: en
  script: Latn
  content: ISO 8835-3:2007 specifies requirements for transfer and receiving systems
    of active anaesthetic gas scavenging systems (active AGSSs) intended to reduce
    exposure of healthcare personnel to anaesthetic gases and vapours while providing
    patient protection (e.g. against excessive flow and pressure). ISO 8835-3:2007
    also specifies requirements for transfer and receiving systems of active anaesthetic
    gas scavenging systems in which the power device is integral with the transfer
    and receiving system.
