abstract:
- language: en
  script: Latn
  content: This document specifies two test methods for the determination of the flexing
    durability of whole shoes. The two methods might not give comparable results.
    NOTE The selected test method depends on agreement between relative parties who
    use this test method or product standards which reference this test method. These
    methods are not applicable to the whole shoes with heel height more than 50 mm,
    or the thickness of flexing area of the soles more than 25 mm, or flexing angle
    less than 45° according to ISO 17707:2005, Clause 6.
