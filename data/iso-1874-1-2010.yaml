abstract:
- language: en
  script: Latn
  content: ISO 1874-1:2010 establishes a system of designation for polyamide (PA)
    thermoplastic materials, which may be used as the basis for specifications. It
    covers polyamide homopolymers for moulding and extrusion based on PA 6, PA 66,
    PA 69, PA 610, PA 612, PA 11, PA 12, PA MXD6, PA 46, PA 1212, PA 4T, PA 6T and
    PA 9T and copolyamides of various compositions for moulding and extrusion. The
    types of polyamide plastic are differentiated from each other by a classification
    system based on appropriate levels of the designatory properties viscosity number,
    tensile modulus of elasticity and presence of nucleating agent, and on information
    about chemical structure, intended application, method of processing, important
    properties, additives, colour, fillers and reinforcing materials. The designation
    system is applicable to all polyamide homopolymers and copolymers. It applies
    to materials ready for normal use, unmodified and modified by colorants, additives,
    fillers, reinforcing materials, polymer modifiers, etc. It does not apply to monomer
    casting-type polyamides of PA 6 and PA 12.
