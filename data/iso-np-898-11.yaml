abstract:
- language: en
  script: Latn
  content: 'This document specifies the mechanical and physical properties of bolts,
    screws and studs with nominal diameters above 39 mm and up to 100 mm, made of
    low-alloy steel. Fasteners (the term used when bolts, screws and studs are considered
    all together) conforming to the requirements of this document are tested at the
    ambient temperature range of 10 °C to 35 °C (except impact test which is carried
    out at –20 °C). It is possible that they do not retain the specified mechanical
    and physical properties at elevated and/or lower temperatures. This document applies
    to bolts, screws and studs with full loadability and with: — triangular ISO metric
    thread in accordance with ISO 68-1, — diameter/pitch combinations in accordance
    with ISO 261, — coarse pitch thread for M42 to M68, — fine pitch thread for M423
    to M1006, — thread tolerances in accordance with ISO 965-1, -2 or -4. This document
    does not specify requirements for functional properties such as: — torque/clamp
    force properties (see ISO 16047 for test method), — resistance to shear stress,
    — corrosion resistance (see e.g. ISO 4042, ISO 10683 or ISO 10684), — fatigue
    resistance, or — weldability.'
