abstract:
- language: en
  script: Latn
  content: This document describes a wavelength dispersive X-ray fluorescence (XRF)
    spectrometric method for the determination of the content of selected impurity
    elements in aluminium oxide (Al₂O₃). The method is applicable to smelting-grade
    aluminium oxide as used as the raw material for aluminium metal production. The
    elements are selected from what elements have significance for the quality of
    the aluminium oxide as the raw material for aluminium metal. When using this method,
    the choice of calibration reference materials is critical for the analysis level
    of each individual element. Sources of the calibration reference materials are
    not further specified in this method. NOTE There are commercially available calibration
    reference materials and users of the method that need to compare with other users
    should consider using the same calibration reference materials for comparisons.
    This document does not purport to address all safety issues relevant when applying
    this standard. Users are reminded to read material safety sheets for chemicals
    in use and, also in the handling of any equipment, to adhere to the relevant safety
    measures.
