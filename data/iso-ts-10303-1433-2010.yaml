  script: Latn
  content: 'ISO/TS 10303-1433:2010-03 specifies the application module for Project
    management. The following are within the scope of ISO/TS 10303-1433:2010-03: items
    within the scope of application module Organization structure; items within the
    scope of application module Project breakdown; items within the scope of application
