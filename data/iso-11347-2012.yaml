abstract:
- language: en
  script: Latn
  content: This International Standard specifies technical requirements for the measurement
    and assessment of the visual appearance of the superficial coating of large yachts
    in terms of gloss, colour and any other superficial defects. This International
    Standard is applicable to large yachts, of length, LH, as defined in ISO 8666,
    higher than or equal to 24 m, and in use for sport or pleasure and commercial
    operations. It describes the technical properties within which the final finish
    is to be evaluated before its acceptance.
