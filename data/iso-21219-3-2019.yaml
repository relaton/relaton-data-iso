abstract:
- language: en
  script: Latn
  content: TPEG applications are modelled in UML to provide an application description
    that is independent of a physical format representation. By separating semantics
    from application description, applications can easily be developed at a functional
    level. Different physical format representations can be generated following a
    well defined set of rules on how to convert UML classes to different physical
    formats. This document specifies the rules for converting UML models of TPEG application
    to the TPEG binary format. It contains the binary format definition of the abstract
    data types defined in ISO 21219-2. Rules for converting compound data types are
    also defined.
