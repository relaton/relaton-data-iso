abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1616:2006 specifies the application module for AP210 functional
    specification. ISO/TS 10303-1616:2006 deals with the representation of functional
    specification. This data provides information sufficient to allow communication
    of the behavioural specification of product functions. Formal encapsulation of
    external data type definitions is made for parametric data and signal characterization.
    Configuration management information and design change management information
    is provided. The following is within the scope of ISO/TS 10303-1616:2006: behavioural
    specification of a functional unit based on observed signals within a functional
    testbench.'
