abstract:
- language: en
  script: Latn
  content: This International Standard specifies methods of horizontal impact testing
    (horizontal or inclined plane test and pendulum test) on a complete, filled transport
    package or a unit load. The test may be performed either as a single test to investigate
    the effects of horizontal impact or as part of a sequence of tests designed to
    measure the ability of a package or a unit load to withstand a distribution system
    that includes a horizontal impact hazard.
