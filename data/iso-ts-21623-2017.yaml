abstract:
- language: en
  script: Latn
  content: ISO/TS 21623:2017 describes a systematic approach to assess potential occupational
    risks related to nano-objects and their agglomerates and aggregates (NOAA) arising
    from the production and use of nanomaterials and/or nano-enabled products. This
    approach provides guidance to identify exposure routes, exposed body parts and
    potential consequences of exposure with respect to skin uptake, local effects
    and inadvertent ingestion. ISO/TS 21623:2017 also considers occupational use of
    products containing NOAA by professionals, e.g. beauticians applying personal
    care products, cosmetics or pharmaceuticals, but does not apply to deliberate
    or prescribed exposure to these products by consumers. ISO/TS 21623:2017 is aimed
    at occupational hygienists, researchers and other safety professionals to assist
    recognition of potential dermal exposure and its potential consequences.
