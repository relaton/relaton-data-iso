abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for defining a strategic approach
    and means for improving harbour cleanliness and for the protection of the environment
    and biodiversity. This document applies to: —     yacht harbours, maritime or
    inland (lake, river, canal, etc.); —     mixed purpose harbours (recreational
    and fishing/trade); —     dry stacks. This document is applicable regardless of
    the public authorities and type of management in charge of the yacht harbour.
    The relevant coverage zone defined is the yacht harbour area.'
