abstract:
- language: en
  script: Latn
  content: This document is one of the family of standards (ISO 15799, ISO 19204)
    providing guidance on the characterization of soils and soil materials in relation
    to their retention and habitat functions and uses. It is appropriate to use it
    in conjunction with the two other standards in this family. It provides guidance
    on the choice and evaluation of tests applied for ecotoxicological characterization
    of soils and soil materials. Recommendations for test strategies with respect
    to the protection of ground and surface waters and the maintenance of the habitat
    function of soil are included. The tests recommended represent a minimum test
    battery that can be complemented by additional tests, or even be replaced by others,
    according to the intended uses or protection goals envisaged. The effect values
    indicated in this document do not refer to regulation but represent the lowest
    level at which an adverse effect is considered likely to occur.
