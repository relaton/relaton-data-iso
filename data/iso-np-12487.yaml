abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and methods for the clinical investigation
    of clinical thermometers used to measure the body temperature of human patients
    in indirect measurement mode. This document covers both intermittently and continuously
    measuring clinical thermometers. This document is not intended for clinical thermometers
    measuring the body temperature in direct measurement mode. NOTE 1 For clinical
    thermometers in direct measurement mode determining the technical accuracy in
    accordance with IEC 80601-2-56 is typically sufficient. NOTE 2 For clinical thermometers
    in direct measurement mode with measurement times shorter than 60 s (for oral
    or rectal measurement), or shorter than 5 min (for axillary measurement) further
    evidence might be necessary to show these measurement times can be achieved in
    practice. This document specifies additional disclosure requirements for clinical
    thermometers. This document is not applicable to the clinical investigation of
    a screening thermographs for human febrile temperature screening whose laboratory
    accuracy requirements are described in IEC 80601-2-59.
