abstract:
- language: en
  script: Latn
  content: ISO 15876-1:2017 specifies the general aspects of polybutene-1 (PB-1) piping
    systems intended to be used for hot and cold water installations within buildings
    for the conveyance of water whether or not intended for human consumption (domestic
    systems) and for heating systems, under design pressures and temperatures according
    to the class of application (see Table 1). The designation polybutene is used
    together with the abbreviation PB throughout this document. ISO 15876-1:2017 covers
    a range of service conditions (application classes) and design pressure and pipe
    dimension classes. Values of TD, Tmax and Tmal in excess of those in Table 1 do
    not apply. NOTE It is the responsibility of the purchaser or specifier to make
    the appropriate selections from these aspects, taking into account their particular
    requirements and any relevant national regulations and installation practices
    or codes. It also specifies the test parameters for the test methods referred
    to in this document. In conjunction with the other parts of ISO 15876, this document
    is applicable to PB pipes, fittings, their joints and to joints with components
    of other plastics and non-plastics materials intended to be used for hot and cold
    water installations.
