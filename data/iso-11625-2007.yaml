abstract:
- language: en
  script: Latn
  content: ISO 11625:2007 specifies requirements for safe handling, use and storage
    of gas cylinders for compressed, liquefied or dissolved gases. This International
    Standard applies only to single gas cylinders of sizes from 0,5 l to 150 l water
    capacity. For specific gas applications such as welding, diving, inerting, etc.,
    additional requirements apply which are not covered in ISO 11625:2007. Maintenance,
    repair, marking, labelling, inspection and retesting of gas cylinders, which are
    normally under the responsibility of the gas cylinder owner, are also not included
    in ISO 11625:2007.
