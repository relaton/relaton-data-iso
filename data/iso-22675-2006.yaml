abstract:
- language: en
  script: Latn
  content: ISO 22675:2006 primarily specifies a cyclic test procedure for ankle-foot
    devices and foot units of external lower limb prostheses, distinguished by the
    potential to realistically simulate those loading conditions of the complete stance
    phase of walking from heel strike to toe-off that are relevant to the verification
    of performance requirements such as strength, durability and service life. In
    addition, ISO 22675:2006 specifies a static test procedure for prosthetic ankle-foot
    devices and foot units, consisting of a static proof test and a static ultimate
    strength test, distinguished, besides other features, by the potential to generate
    heel and forefoot forces at lines of action conforming to those occurring at the
    instants of maximum heel and forefoot loading during the cyclic test.
