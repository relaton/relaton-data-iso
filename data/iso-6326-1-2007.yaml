abstract:
- language: en
  script: Latn
  content: ISO 6326-1:2007 gives a brief description of standardized methods that
    can be used for the determination of sulfur compounds in natural gas. The principle
    of each method is described generally, the range of concentrations for which the
    method is suitable is indicated, and the analytical range and precision of each
    method is given. It should enable the user to select judiciously the proper method
    for the application being considered. Sulfur analysis is performed in order to
    determine total sulfur, sulfur contained in specific groups [e.g. thiols (mercaptans)],
    individual sulfur compounds and specific groups of sulfur compounds. The available
    standardized methods in the field of sulfur analysis are the Wickbold combustion
    method for total sulfur determination (ISO 4260); the Lingener combustion method
    for total sulfur determination (ISO 6326-5); gas chromatography for determination
    of individual sulfur compounds (ISO 19739); potentiometry for determination of
    hydrogen sulfide, carbonyl sulfide and thiol compounds (ISO 6326-3).
