abstract:
- language: en
  script: Latn
  content: ISO 3503:2015 specifies a method for checking the leak tightness under
    internal pressure of assembled joints between mechanical fittings and plastic
    pressure pipes when subjected to bending. It defines the calculation method for
    the average bending radius and how to perform this bending. Checking of the leak
    tightness under internal pressure is carried out in accordance with the method
    given in ISO 3458. This test method is not applicable to fusion-welded joints.
