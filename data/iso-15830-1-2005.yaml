abstract:
- language: en
  script: Latn
  content: 'ISO 15830-1:2005 provides the definitions, symbols and rationale used
    in all parts of ISO 15830for the WorldSID 50th percentile side impact dummy, a
    standard anthropomorphic dummy for side impact testing of road vehicles. It is
    applicable to impact tests involving: passenger vehicles of category M1 and goods
    vehicles of category N1,impacts to the side of the vehicle structure, andimpact
    tests involving use of an anthropomorphic dummy as a human surrogate for purpose
    of evaluating compliance with vehicle safety standards.'
