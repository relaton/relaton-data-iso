abstract:
- language: en
  script: Latn
  content: This document gives specification of tungsten powder produced from tungsten
    scrap materials. This standard specifies a method for determining the performance
    characteristics of tungsten powder. Tungsten has the advantages of high melting
    point, high hardness, excellent corrosion resistance, and good electrical and
    thermal conductivity; it has become one of the most important functional materials
    in modern industry, national defence, and high-tech applications. Tungsten powder
    is used as a base metal in heavy tungsten alloys. It is applicable for high-speed
    steel, as an additive, refractory metal, weight balance, electrical, electronic,
    medical and finally military fields. The mentioned tungsten powder is not applicable
    for medical, sanitary, and cosmetic purposes.
