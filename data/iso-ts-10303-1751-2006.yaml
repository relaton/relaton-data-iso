abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1751:2006 specifies the application module for Test requirement
    allocation. ISO/TS 10303-1751:2006 deals with the representation of test requirement
    allocation to a product where there is a reference simulation model provided or
    where there is a functional specification provided. The specific usage is to allow
    representation of items in an abstract test harness using the nodal formulation
    provided in this standard. The following are within the scope of ISO/TS 10303-1751:2006:
    component data sheet functional performance representation;identification of test
    requirement based on a simulation model;identification of test requirement based
    on a functional specification.'
