abstract:
- language: en
  script: Latn
  content: ISO 14405-2:2011 illustrates the use of geometrical tolerancing for dimensions
    that are not linear sizes to avoid the ambiguity that the use of ± tolerances
    on these dimensions causes. Both linear and angular dimensions, except size of
    features of size, are covered. Dimensional tolerancing can be indicated by ± tolerancing
    or geometrical tolerancing. The ambiguity caused by using ± tolerances for dimensions
    other than linear sizes is explained in an informative annex.
