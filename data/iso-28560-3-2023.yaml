abstract:
- language: en
  script: Latn
  content: This document provides a data model and encoding rules for the use of radio
    frequency identification (RFID) tags for items appropriate for the needs of all
    types of libraries (including national, academic, public, corporate, special,
    and school libraries). This document specifies the rules for encoding —    a subset
    of data elements taken from the total set of data elements listed in ISO 28560‑1
    into a basic block, and —    other data elements into extension blocks onto the
    RFID tag. A source of additional information about implementation issues is provided
    in Annex A.
