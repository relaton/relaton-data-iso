abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for solid, flat extruded sheets
    of polycarbonate (PC) for general applications. It applies specifically to sheets
    made of poly(p,p′-isopropylidene-diphenyl carbonate). The sheets can be coloured
    or colourless, and they can be transparent, translucent or opaque. The sheets
    can also be those that have a special weather-protective layer on one or both
    surfaces. This document applies only to thicknesses equal to or greater than 1,5
    mm.
