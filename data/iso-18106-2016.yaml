abstract:
- language: en
  script: Latn
  content: ISO 18106:2016 specifies the method for measuring relative snow grip performance
    index of a candidate tyre compared to a reference, under loaded conditions for
    new tyres intended to be used on passenger car, commercial vehicle, truck and
    bus vehicles on a snow packed surface. The methods developed here are meant to
    reduce the variability of the performance measurement. The use of the proper reference
    tyres is necessary to limit the variability of the testing method procedures.
    ISO 18106:2016 applies to all passenger car, commercial vehicle, truck and bus
    tyres.
