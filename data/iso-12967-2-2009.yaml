abstract:
- language: en
  script: Latn
  content: ISO 12967-2:2009 specifies the fundamental characteristics of the information
    model to be implemented by a specific architectural layer (i.e. the middleware)
    of the information system to provide a comprehensive and integrated storage of
    the common enterprise data and to support the fundamental business processes of
    the healthcare organization, as defined in ISO 12967-1. The information model
    is specified without any explicit or implicit assumption on the physical technologies,
    tools or solutions to be adopted for its physical implementation in the various
    target scenarios. The specification is nevertheless formal, complete and non-ambiguous
    enough to allow implementers to derive an efficient design of the system in the
    specific technological environment that will be selected for the physical implementation.
    This specification does not aim at representing a fixed, complete, specification
    of all possible data that can be necessary for any requirement of any healthcare
    enterprise. It specifies only a set of characteristics, in terms of overall organization
    and individual information objects, identified as fundamental and common to all
    healthcare organizations, and that is satisfied by the information model implemented
    by the middleware.
