abstract:
- language: en
  script: Latn
  content: This International Standard establishes general principles for the design
    and application of safety signs and hazard pictorials permanently affixed to all
    types of industrial truck including those defined in ISO 5053. This International
    Standard outlines safety sign objectives, describes the basic safety sign formats
    and colours, and provides guidance on developing the various panels that together
    constitute a safety sign.
