abstract:
- language: en
  script: Latn
  content: This document defines terms and establishes classifications, characteristics
    and marking requirements for ceramic tiles of the best commercial quality (first
    quality). This document is not applicable to tiles made by other than normal processes
    of extrusion or dry pressing. It is not applicable to decorative accessories or
    trim such as edges, corners, skirting, capping, coves, beads, steps, curved tiles
    and other accessory pieces or mosaics (i.e. any piece that can fit into a square,
    the side of which is less than 7 cm). NOTE ISO 10545 (all parts) describes the
    test procedures required to determine the product characteristics listed in this
    document. ISO 10545 is a multi-part standard, each part describes a specific test
    procedure or related matter.
