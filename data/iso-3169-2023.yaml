abstract:
- language: en
  script: Latn
  content: This document specifies methods for the chemical analysis of impurities
    present in aluminium oxide powders used as a raw material for fine ceramics. Aluminium
    oxide powders are decomposed by acid pressure decomposition, acid decomposition
    or alkali fusion. The calcium, chromium, copper, iron, magnesium, manganese, potassium,
    silicon, sodium, titanium, zinc and zirconium contents in the test solution are
    determined by an inductively coupled plasma-optical emission spectrometer (ICP-OES).
