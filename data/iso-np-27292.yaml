abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for stormwater reuse systems, with a
    focus on non potable end uses. It systematically covers the following key aspects:
    a) Water quantity assessment based on stormwater reuse demand; b) Water quality
    grading of different stormwater catchment surfaces; c) End uses of reclaimed stormwater
    and selection of treatment processes; d) Terminal water distribution and utilization;
    e) Smart operation and maintenance of stormwater reuse systems. This document
    applies to stormwater reuse systems for non-potable purposes in Buildings and
    properties, communities, parks, squares, etc. This document does not apply to
    combined sewer systems. This document does not address the management of water
    quality standard limits for drinking water, nor does it involve the management
    of stormwater drainage for flood control and waterlogging prevention.'
