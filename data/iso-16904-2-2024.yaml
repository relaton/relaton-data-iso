abstract:
- language: en
  script: Latn
  content: This document gives general guidelines for the design, material selection,
    qualification, certification, and testing details of hose assemblies for Liquefied
    Natural Gas (LNG) marine transfer applications. The transfer hose assemblies are
    part of transfer systems (it means that they may be fitted with ERS, QCDC, handling
    systems, hydraulic and electric components etc.) To avoid unnecessary repetition,
    cross-references to EN ISO 16904 and EN 1474-3 are made for all compatible items,
    and for references, definitions and abbreviations. Where additional references,
    definitions and abbreviations are required specifically for LNG hose assemblies,
    they are listed in this document.
