abstract:
- language: en
  script: Latn
  content: ISO 15312:2003 defines the thermal speed rating for oil bath lubricated
    rolling bearings and defines calculation principles for the determination of this
    parameter. The parameter determined in accordance with this International Standard
    applies to rolling bearings of the given series and sizes of standard design or
    of a design that, from a frictional point of view, can be related to a standard
    design bearing. Thrust ball bearings are excluded from ISO 15312:2003 as kinematic
    effects do not allow the thermal speed rating defined in this International Standard
    to be applied.
