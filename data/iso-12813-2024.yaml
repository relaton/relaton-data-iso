abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for short-range communication for
    the purposes of compliance checking in autonomous electronic fee collecting systems.
    Compliance checking communication (CCC) takes place between a road vehicle''s
    on-board equipment (OBE) and an interrogator [fixed and mobile roadside equipment
    (RSE) or hand-held unit] and serves to establish whether the data that are delivered
    by the OBE correctly reflect the road usage of the corresponding vehicle according
    to the rules of the pertinent toll regime. The operator of the compliance checking
    interrogator is assumed to be part of the toll charging role as defined in ISO 17573-1.
    The CCC permits identification of the OBE, vehicle and contract, and verification
    of whether the driver has fulfilled their obligations and the checking status
    and performance of the OBE. The CCC reads, but does not write, OBE data. This
    document is applicable to OBE in an autonomous mode of operation. It is not applicable
    to compliance checking in dedicated short-range communication (DSRC)-based charging
    systems. It specifies data syntax and semantics, but not a communication sequence.
    All the attributes specified herein are required in any OBE claimed to be compliant
    with this document, even if some values are set to “not specified” in cases where
    a certain functionality is not present in an OBE. The interrogator is free to
    choose which attributes are read in the data retrieval phase, as well as the sequence
    in which they are read. In order to achieve compatibility with existing systems,
    the communication makes use of the attributes specified in ISO 17573-3 wherever
    useful. The CCC is suitable for a range of short-range communication media. Specific
    definitions are given for the CEN-DSRC as specified in EN 15509, as well as for
    the use of ISO CALM IR, the Italian DSRC as specified in ETSI ES 200 674-1, ARIB
    DSRC, and WAVE DSRC as alternatives to the CEN-DSRC. The attributes and functions
    specified are for compliance checking by means of the DSRC communication services
    provided by DSRC application layer, with the CCC attributes and functions made
    available to the CCC applications at the RSE and OBE. The attributes and functions
    are specified on the level of application data units (ADUs). The definition of
    the CCC includes: —     the application interface between OBE and RSE (as depicted
    in Figure 2); —     use of the generic DSRC application layer as specified in
    ISO 15628 and EN 12834; —     CCC data type specifications given in Annex A; —    
    a protocol implementation conformance statement (PICS) proforma is given in Annex B;
    —     use of the CEN-DSRC stack as specified in EN 15509, or other equivalent
    DSRC stacks as described in Annex C, Annex D, Annex E and Annex F; —     security
    services for mutual authentication of the communication partners and for signing
    of data (see Annex H); In addition, an example CCC transaction is presented in
    Annex G and Annex I highlights how to use this document for the European Electronic
    Toll Service (EETS). Test specifications are not within the scope of this document.'
