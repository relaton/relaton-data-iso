abstract:
- language: en
  script: Latn
  content: This International Standard specifies the physical and magnetic characteristics
    of a 3,81 mm wide magnetic tape cartridge to enable interchangeability of such
    cartridges. It also specifies the quality of the recorded signals, the recorded
    format and the recording method, thereby allowing data interchange between drives
    by means of such magnetic tape cartridges. The format used is known as DATA/DAT-DC.
    This International Standard specifies two types of cartridges which, for the purpose
    of this International Standard, are referred to as Type A and Type B. For Type A,
    the magnetic tape has a nominal thickness of 13 μm and a nominal length of up
    to 60,5 m. For Type B, the magnetic tape has a nominal thickness of 9 μm a length
    of up to 92,0 m. Information interchange between systems by means of this International
    Standard also requires the use, at a minimum, of a labelling and file structure
    and an interchange code which are agreed upon by the interchange parties. It is
    not within the scope of this International Standard to specify the labelling and
    file structure, or the interchange code.
