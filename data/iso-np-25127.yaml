abstract:
- language: en
  script: Latn
  content: 'This document describes the procedure and evaluation of an algae photosystem
    II inhibition assay, which is an experimental method for detecting the inhibitory
    effects of environmental chemicals or samples on the photosystem II of unicellular
    green algae after 2 h exposure, and optionally on their growth during 24 h. This
    assay procedure is suitable for the analysis of individual or mixtures of substances
    as well as native and extracted aqueous environmental samples, such as: • treated
    municipal and industrial waste water • fresh water • aqueous extracts and leachates
    • eluates of soils and fresh water sediments • pore water of fresh water sediments'
