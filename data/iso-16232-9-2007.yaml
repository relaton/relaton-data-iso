abstract:
- language: en
  script: Latn
  content: ISO 16232-9:2007 defines methods for determining the size distribution
    of particulate contaminants extracted from automotive components using techniques
    described in ISO 16232-3, ISO 16232-4 and ISO 16232-5, using automatic light extinction
    particle counter instruments (APC). ISO 16232-9:2007 only applies to the analysis
    of the whole volume of extraction liquid.
