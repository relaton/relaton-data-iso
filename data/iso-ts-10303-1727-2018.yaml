abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1727:2018-11 specifies the application module for Physical
    unit 3D shape. The following are within the scope of ISO/TS 10303-1727:2018-11:
    generic analysis input; generic analysis output; shock analysis input; shock analysis
    output; design; vibration analysis input; vibration analysis output; electromagnetic
    compatibility analysis input; electromagnetic compatibility analysis output; thermal
    analysis input; thermal analysis output; extruded shape class; manhattan shape
    class; generic shape class; three dimensional part shape; three dimensional part
    application constraint shapes; items within the scope of application module Non
    feature shape element, ISO/TS 10303-1706.'
