abstract:
- language: en
  script: Latn
  content: This document specifies minimum requirements and test methods for elastomeric
    seismic elastomeric isolators used for buildings and the rubber material used
    in the manufacture of such elastomeric isolators. It is applicable to elastomeric
    seismic elastomeric isolators used to provide buildings with protection from earthquake
    damage. The elastomeric isolators covered consist of alternate elastomeric layers
    and reinforcing steel plates. They are placed between a superstructure and its
    substructure to provide both flexibility for decoupling structural systems from
    ground motion, and damping capability to reduce deflection at the isolation interface
    and the transmission of energy from the ground into the structure at the isolation
    frequency.
