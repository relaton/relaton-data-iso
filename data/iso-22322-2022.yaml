abstract:
- language: en
  script: Latn
  content: This document gives guidance on developing, managing and implementing public
    warning before, during and after incidents. This document is applicable to any
    organization responsible for public warning. It is applicable at all levels, from
    local up to international. Before planning and implementing the public warning
    system, the risks and consequences of potential hazards are assessed. This process
