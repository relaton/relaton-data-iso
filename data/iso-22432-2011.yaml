abstract:
- language: en
  script: Latn
  content: ISO 22432:2011 defines general terms and types of features for geometrical
    features of specifications for workpieces. These definitions are based on concepts
    developed in ISO/TS 17450-1. ISO 22432:2011 is not intended for industrial use
    as such among designers, but is aimed to serve as the "road map" mapping out the
    interrelationship between geometrical features, thus enabling future standardization
    for industry and software makers in a consistent manner.
