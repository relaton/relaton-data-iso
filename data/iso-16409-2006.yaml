abstract:
- language: en
  script: Latn
  content: ISO 16409:2006 specifies requirements and test methods for performance
    criteria for manual interdental brushes with a round cross-section of the brush
    head. It also specifies the accompanying information, such as the manufacturer's
    instructions for use and labelling of the packaging. ISO 16409:2006 is not applicable
    to powered interdental brushes, manual toothbrushes, dental floss, tapes, and
    strings, nor is it applicable to interdental cleaners that do not include filaments.
