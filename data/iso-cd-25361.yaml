abstract:
- language: en
  script: Latn
  content: 'This standard specifies the technical requirement and test methods for
    hydrogen recirculation pumps, especially applied to Roots’ type ones. This standard
    describes requirement and test method to assist in evaluating the performance
    of hydrogen recirculation pump. It should cover the following: 1. General requirement
    and test method 2. Operating and mechanical properties requirement and test method
    3. Electrical characteristics requirement and test method 4. Environment adaptability
    5. Safety 6. Durability requirement and test method'
