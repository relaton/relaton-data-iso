abstract:
- language: en
  script: Latn
  content: This document specifies the essential characteristics of a test track surface
    intended to be used for measuring rolling sound emission of vehicles and their
    tyres. The surface design given in this document —    produces consistent levels
    of tyre or road sound emission under a wide range of operating conditions including
    those appropriate to vehicle sound testing, —    minimizes inter-site variation,
    —    limits absorption of the vehicle sound sources, and —    is consistent with
    road-building practice.
