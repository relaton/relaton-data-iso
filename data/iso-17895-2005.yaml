abstract:
- language: en
  script: Latn
  content: ISO 17895:2005 specifies a gas-chromatographic method of quantitatively
    determining the volatile organic compound (VOC) content (i.e. the content of organic
    compounds with boiling points up to 250 °C) under standard conditions (101,325
    kPa) of low VOC content emulsion paints (in-can VOC). The method is applicable
    to VOC contents between 0,01 % and 0,1 % (by mass). The main purpose of the method
    is to qualify low-VOC emulsion paints, not routine quality control.
