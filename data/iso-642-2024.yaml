abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the hardenability of steel
    by end quenching (Jominy test) by using a test piece 25 mm in diameter and at
    least 100 mm long. By agreement and for a defined field of application, the test
    described in this document can be replaced by the calculation of the Jominy curve
    according to an accepted mathematical model.
