abstract:
- language: en
  script: Latn
  content: ISO 11665-2:2012 describes integrated measurement methods for short-lived
    radon-222 decay products. It gives indications for measuring the average potential
    alpha energy concentration of short-lived radon-222 decay products in the air
    and the conditions of use for the measuring devices. ISO 11665-2:2012 covers samples
    taken over periods varying from a few weeks to one year. ISO 11665-2:2012 is not
    applicable to systems with a maximum sampling duration of less than one week.
