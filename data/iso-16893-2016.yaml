abstract:
- language: en
  script: Latn
  content: ISO 16893:2016 specifies a classification matrix and the related mandatory
    tests and thickness ranges to be applied to wood-based particleboard for general
    purposes, furniture, load-bearing applications and heavy-duty load-bearing applications.
    It then provides the manufacturing property requirements for these types of uncoated
    particleboard. The values listed in this International Standard relate to product
    properties used to classify particleboards into one of four grades (P-GP, P-FN,
    P-LB or P-HLB, see Clause 3), for use in three service conditions (REG, MR1 and
    MR2). The values are not characteristic values to be used for design purposes.
