abstract:
- language: en
  script: Latn
  content: This document specifies a winding test method for hybrid fiber reinforced
    plastics core sandwiched slender rods. It includes test principles, test conditions,
    equipment requirements, test procedures, and evaluation criteria. This method
    applies to core sandwiched slender rods with a diameter of not less than 2 mm,
    and is used to test the interfacial bonding strength between different fiber-resin
    layers within the rods and to verify the radius of the matched spool reel.
