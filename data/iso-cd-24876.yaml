abstract:
- language: en
  script: Latn
  content: In the context of a distributed ledger technology (DLT)-based identity
    management system, this document identifies the various types of trust anchors
    and analyzes the personally identifiable information (PII) of a data subject,
    processed by trust anchors. It examines the complete cycle of PII processing by
    trust anchors within a DLT-based identity management system. Additionally, it
    outlines privacy considerations, detailing both technical and organizational controls
    to protect the PII of data subjects managed by trust anchors. Furthermore, the
    document provides examples of PII protection measures within a DLT-based identity
    management system.
