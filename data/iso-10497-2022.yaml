abstract:
- language: en
  script: Latn
  content: 'This document specifies fire type-testing requirements and a fire type-test
    method for soft- and metal-seated isolation valves with one or more obturators.
    It is not applicable to the testing requirements for valve actuators other than
    manually operated gearboxes or similar mechanisms when these form part of the
    normal valve assembly. Other types of valve actuators (e.g. electrical, pneumatic
    or hydraulic) can need special protection to operate in the environment considered
    in this valve test, and the fire testing of such actuators is outside the scope
    of this document. This document specifies the measurement and assessment criteria
    for: a) through-seat leakage; b) external leakage; c) cavity overpressure relief
    of double-seated valves; d) operability. This document specifies the rules whereby
    the fire-type testing qualification for a valve can be extended to untested sizes,
    pressure ratings and materials of construction of the same basic design type.
    Fire test reports of valves tested according to previous editions of this document
    are acceptable when submitted together with the full and compliant fire test report
    as per 6.7 of the edition under which it was tested. Any data missing as required
    from 6.7 within the fire test report are accepted or rejected at the purchaser’s
    discretion. NOTE       For the purposes of this document, the terms “fire type-test”
    and “fire test” are synonymous.'
