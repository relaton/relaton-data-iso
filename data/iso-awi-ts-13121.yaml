abstract:
- language: en
  script: Latn
  content: This Technical Specification describes a process for identifying, evaluating,
    addressing, making decisions about, and communicating the potential risks of developing
    and using manufactured nanomaterials, in order to protect the health and safety
    of the public, consumers, workers and the environment. While the overall product
    stewardship and risk management process set forth in this Technical Specification
    is not unique to nanomaterials, it supplements recognized approaches by providing,
    where possible, a focus on information and issues specific to nanotechnologies.
    It offers guidance on the information needed to make sound risk evaluations and
    risk management decisions, as well as how to manage in the face of incomplete
    or uncertain information by using reasonable assumptions and appropriate risk
    management practices. Further, it includes methods to update assumptions, decisions,
    and practices as new information becomes available, and on how to communicate
    information and decisions to stakeholders. This Technical Specification suggests
    methods organizations can use to be transparent and accountable in how they manage
    nanomaterials. To that end, it describes a process of organizing, documenting,
    and communicating what information organizations have about nanomaterials. This
    includes acknowledging where information is incomplete, explaining how information
    gaps were addressed, and explaining the rationale behind the organization's risk
    management decisions and actions.
