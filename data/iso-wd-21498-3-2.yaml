abstract:
- language: en
  script: Latn
  content: This document applies to voltage class B electric propulsion systems of
    electrically propelled road vehicles. It applies to electric circuits and components
    in these systems. This document can also apply to other systems and components
    connected to voltage class B AC in the vehicle. This document focuses on the characteristics
    at the AC voltage class B terminals of these components as specified in ISO 21498-1.
    It describes testing methods, test conditions and test requirements for components
    exposed to electrical behavior caused by operation of electric loads and power
    sources. This document does not cover electrical safety and does not apply to
    AC charging inlet (see ISO 6469, ISO 5474).
