abstract:
- language: en
  script: Latn
  content: New Work Item Proposal (NWIP) for a new International Standard under TC333
    that is focused on sustainability aspects of lithium value chain that include
    separation, processing, and recycling. For the purposes of this NWIP, sustainability
    will be defined to conform with the ISO Guidelines on Addressing Sustainability
    in Standards (Guide 82:2019), which defines sustainability as the “state of the
    global system, including environmental, social and economic aspects, in which
    the needs of the present are met without compromising the ability of future generations
    to meet their own needs.” The definition also notes that the environmental, social
    and economic aspects interact, are interdependent and are often referred to as
    the three dimensions of sustainability.
