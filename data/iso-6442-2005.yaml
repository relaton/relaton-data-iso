abstract:
- language: en
  script: Latn
  content: ISO 6442:2005 can be applied to all rectangular door leaves. ISO 6442:2005
    specifies the method to be used to measure the deviations in general and local
    flatness of door leaves. In ISO 6442:2005, the concept of local flatness deviation
    is limited to defects considered to be prejudicial to the appearance of the door
    leaf.
