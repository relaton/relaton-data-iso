abstract:
- language: en
  script: Latn
  content: ISO 3166-3:2013 provides principles and maintenance arrangements of a code
    for the representation of country names removed from editions 1 to 7 of ISO 3166
    and the subsequent editions of ISO 3166-1. Clauses 8 and 9 contain lists of all
    formerly used country names removed from ISO 3166 (now ISO 3166‑1) since 1974,
    together with the code element for each one of them.
