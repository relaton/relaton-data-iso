abstract:
- language: en
  script: Latn
  content: Describes the selection process, general considerations influencing a selection,
    making a comparison of the methods for sampling inspection, other methods sometimes
    adopted in practice, market and production conditions - effect on the selection
    process, the final selection. Is applicable to a wide variety of inspection situations
    including end items (e.g. complete products or sub-assemblies), components and
    raw materials, services, materials in process, supplies in storage, maintenance
    operations, data or records.
