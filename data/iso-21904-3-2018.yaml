abstract:
- language: en
  script: Latn
  content: ISO 21904-3:2018 defines a laboratory method for measuring the welding
    fume capture efficiency of on-torch extraction systems. The procedure only prescribes
    a methodology, leaving selection of the test parameters to the user, so that the
    effect of different variables can be evaluated. ISO 21904-3:2018 is applicable
    to integrated on-torch systems and to systems where a discrete extraction system
    is attached to the welding torch close to the arc area. The methodology is suitable
    for use with all continuous wire welding processes, all material types and all
    welding parameters. The method can be used to evaluate the effects of variables
    such as extraction flow rate, extract nozzle position, shielding gas flow rate,
    welding geometry, welding torch angle, fume emission rate, etc., on capture efficiency.
