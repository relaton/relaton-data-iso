abstract:
- language: en
  script: Latn
  content: ISO 15239:2005 sets out practices for the evaluation of the measurement
    performance of all types of on-line analysers for solid mineral fuel. It presents
    information on the different types of analyser currently available and describes
    procedures for the evaluation of various aspects of measurement performance, appropriate
    methods of test and techniques for the statistical assessment of the data collected.
