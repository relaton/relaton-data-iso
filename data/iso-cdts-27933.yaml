abstract:
- language: en
  script: Latn
  content: This technical specification provides guidelines to determine, assess,
    and quantify CO2 captured for long-term storage in the form of thermodynamically
    stable mineral carbonates, achieved through the application of mineral carbonation
    technology to greenhouse gas (GHG) emitting facilities. This technical specification
    applies to ex-situ mineral carbonation technologies that capture CO2 from exhaust
    gas from GHG-intensive industries such as power generation, incinerators, cement
    production, steel production, petrochemical industries, and hydrogen production
    by installing mineral carbonation facility for long-term capture and storage of
    CO2. The scope of application of this document does not consider the stage of
    storage of carbonates underground. NOTE Ex-situ mineral carbonation technology
    refers to processes that captures CO2 in the form of stable carbonates, regardless
    of geological characteristics, by facilitating reactions with CO2 at the surface-level
    plants. These technologies provide a robust solution for CO2 capture and storage,
    ensuring durability and flexibility across various industrial applications.
