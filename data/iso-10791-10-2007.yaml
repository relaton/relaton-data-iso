abstract:
- language: en
  script: Latn
  content: 'ISO 10791-10:2007 specifies, with reference to ISO 230-3, tests for the
    evaluation of thermal distortions of the machine structure and positioning system,
    up to 2 000 mm in length, of machining centres. It gives three test methods: environmental
    temperature variation error, thermal distortion caused by rotating spindle, and
    thermal distortion caused by moving linear axes. There is no intention of assigning
    any numerical tolerances associated with the tests specified.'
