abstract:
- language: en
  script: Latn
  content: ISO 606:2015 specifies the characteristics of short-pitch precision roller
    and bush chains with associated sprockets suitable for the mechanical transmission
    of power and allied applications. It covers dimensions, tolerances, length measurement,
    preloading, minimum tensile strengths and minimum dynamic strength. Although Clause
    5 applies to chain sprockets for cycles and motor cycles, this International Standard
    is not applicable to their chains, which are covered by ISO 9633 and ISO 10190,
    respectively.
