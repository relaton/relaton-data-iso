abstract:
- language: en
  script: Latn
  content: This document covers trunnion systems used for tie-down, tilting and/or
    lifting of a package of radioactive material during transport operations. Aspects
    included are the design, manufacture, maintenance, inspection and management system.
    Regulations which can apply during handling operation in nuclear facilities are
    not addressed in document. This document does not supersede any of the requirements
    of international or national regulations, concerning trunnions used for lifting
    and tie-down.
