abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the preparation of test specimens
    from zinc coated low alloy steel sheets and components made thereof, as well as
    the subsequent determination of hydrogen content. The method is applicable to
    both cold and hot-rolled steel used in the automotive industry and aims to support
    reproducible and reliable hydrogen content evaluation in materials susceptible
    to hydrogen embrittlement. NOTE Materials susceptible to hydrogen embrittlement
    are steel grades delivered according to EN 10268, EN 10338 and EN 10346. The method
    defines procedures for zinc de-coating, sample handling, storage, and timing to
    minimize variability in hydrogen content measurements, particularly focusing on
    weakly trapped hydrogen. This document is applicable to standard hydrogen determination
    methods, such as: • Thermal Desorption Spectroscopy (TDS) • Carrier Gas Hot Extraction
    (CGHE)'
