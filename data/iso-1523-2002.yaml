abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method to determine the flash point
    of paints, varnishes, paint binders, solvents, petroleum or related products.
    This International Standard is not applicable to water-borne paints which may,
    however, be tested using ISO 3679. The method is suitable for use over the temperature
    range - 30 °C to 110 °C, depending on the use of different apparatus listed in
    Table 1. The interpretation of results obtained from solvent mixtures containing
    halogenated hydrocarbons should be considered with caution, as these mixtures
    can give anomalous results.
