abstract:
- language: en
  script: Latn
  content: ISO 9713:2002 describes characteristics of self-closing aneurysm clips
    intended for permanent intracranial implantation and specifies requirements for
    marking, packaging, sterilization and for labelling and accompanying documentation.
    In addition it gives a method for the measurement of closing force. ISO 9713:2002
    is not applicable to malleable clips, or clips intended to be used during the
    course of surgery and removed before wound closure (temporary clips).
