abstract:
- language: en
  script: Latn
  content: This document specifies test procedures to evaluate the measuring performance
    of probing systems integrated with a numerically controlled machine tool. Test
    procedures for touch trigger probing systems and scanning probing systems operating
    in discrete-point measurement mode are specified in 7.1. Test procedures are specified
    for scanning probing systems in 7.2, for bore gauge systems in 7.3, for contacting
    tool measuring systems in 8.1, and for non-contacting tool measuring systems using
    the laser light barrier principle in 8.2. The evaluation of the performance of
    the machine tool, used as a coordinate measuring machine (CMM), is outside the
    scope of this document. Such performance evaluation involves traceability issues,
    is strongly influenced by machine tool geometric accuracy and can, in addition
    to the machine tool probing system tests specified in this document, be evaluated
    according to ISO 10360-2 and ISO 10360-5. Descriptions of test procedures in this
    document are referred to machining centres. However, tests apply in principle
    to most NC machine tools.
