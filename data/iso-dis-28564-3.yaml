abstract:
- language: en
  script: Latn
  content: This document specifies requirements and gives a range of guidelines for
    various stages of preparation, design, construction, inspection and updating that
    comprise an information index signs used in public places. This document is applicable
    to the design and use of information index signs used in public places such as
    bus and railway stations, airports, shopping centres, stores, hospitals, exhibition
    halls, sporting and entertainment complexes, urban areas, parks, gardens and countryside,
    public attractions, museums and commercial office buildings. The design and use
    of information index signs in working areas can also use the content of this document
    for reference. This document is not applicable to those sectors (for example,
    traffic signs on a public highway) which are subject to regulations or specified
    design principles. However, in a given public environment or within a wayfinding
    and signing design brief, where there is sometimes a need for public information
    to be associated with other messaging, many of the principles contained in this
    document can be relevant in the planning of a coordinated scheme.
