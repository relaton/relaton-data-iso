abstract:
- language: en
  script: Latn
  content: This standard of vocabulary taken from the multi-part ISO/IEC 2382 standard
    is presented in language-specific order and is intended to facilitate international
    communication in information technology. It presents, in two languages, terms
    and definitions of selected concepts relevant to this field. In order to facilitate
    their translation into other languages, the definitions are drafted so as to avoid,
    as far as possible, any peculiarity attached to a language.
