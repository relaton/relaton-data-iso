abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for testing the flexural
    fatigue resistance of piping assemblies under pressure. The method is applicable
    to polyethylene (PE) tapping tees, PE/metal transition fittings and PE branch
    saddles, intended for use with PE pipes having a nominal outside diameter de u
    63 mm. NOTE The test is based on simulating the stresses generated in practice
    on buried piping networks, i.e. combined bending and tensile stresses, at ambient
    temperature. The test is accelerated by magnifying the displacements observed
    in practice.
