abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and test methods for endodontic
    compactors (pluggers and spreaders) which are used for the compaction of endodontic
    filling materials, and also heat-carriers (which are not specified in the other
    parts of the ISO 3630 series). This document specifies the requirements for size,
    marking, product designation, safety considerations, and their labelling and packaging.
