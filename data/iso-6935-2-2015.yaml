abstract:
- language: en
  script: Latn
  content: ISO 6935-2:2015 specifies technical requirements for ribbed bars to be
    used as reinforcement in concrete. ISO 6935-2:2015 is applicable to steel delivered
    in the form of bars, coils and de-coiled products. It includes both weldable and
    non-weldable steels. The production process is at the discretion of the manufacturer.
    It is not applicable to ribbed bars produced from finished products, such as plates
    and railway rails.
