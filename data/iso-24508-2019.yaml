abstract:
- language: en
  script: Latn
  content: This document provides design guidelines and requirements for tactile symbols
    and characters used for information and marking for people who need non-visual
    or non-auditory information. It is applicable to products, facilities and equipment
    in housing and transportation, services and packaging, where tactile symbols and
    characters may be used. This document specifies the physical characteristics of
    tactile symbols and characters for ease of legibility by touch taking into account
    human abilities of tactile sense and their aging effect. It does not specify semantic
    characteristics of tactile symbols and characters. This document is applicable
    to tactile symbols and characters of convex-type touched by fingers. It is not
    applicable to specifically coded tactile symbols or characters such as those of
    Braille, nor to those with vibratory or temporal changes.
