abstract:
- language: en
  script: Latn
  content: ISO/ASTM 51956:2013 covers procedures for the use of thermoluminescence
    dosimeters (TLDs) to measure the absorbed dose in materials irradiated by photons
    or electrons in terms of absorbed dose to water. Thermoluminescence-dosimetry
    systems (TLD systems) are generally used as routine dosimetry systems. The thermoluminescence
    dosimeter (TLD) is classified as a type II dosimeter on the basis of the complex
    effect of influence quantities on the dosimeter response. ISO/ASTM 51956:2013
    is one of a set of standards that provides recommendations for properly implementing
    dosimetry in radiation processing, and describes a means of achieving compliance
    with the requirements of ISO/ASTM 52628 "Practice for Dosimetry in Radiation Processing"
    for a TLD system. It is intended to be read in conjunction with ISO/ASTM 52628.
