abstract:
- language: en
  script: Latn
  content: This document specifies tests for determining the strength and wear resistance
    of guards for power take-off (PTO) drive- shafts on tractors and machinery used
    in agriculture and forestry, and their acceptance criteria. It is intended to
    be used in combination with ISO 5673-1:2005. It is applicable to the testing of
    PTO drive- shaft guards and their restraining means. It is not applicable to the
    testing of guards designed and constructed to be used as steps. This document
    is not applicable to guards for power take-off drive shafts that are manufactured
    before the date of publication of this document.
