abstract:
- language: en
  script: Latn
  content: This document specifies chromatographic methods for the determination of
    the inorganic free sulfur (Sx) not consumed during the vulcanization of the rubber.
    This method is used primarily to compare the free sulfur content in different
    samples. NOTE 1 In this document, "free sulfur" is used instead of "inorganic
    free sulfur". NOTE 2 The residual curing agent containing sulfur is not concerned
    by this measure.
