abstract:
- language: en
  script: Latn
  content: ISO 25239-5:2011 specifies a method for determining the capability of a
    manufacturer to use the friction stir welding (FSW) process for production of
    products of the specified quality. It specifies quality requirements, but does
    not assign those requirements to any specific product group. In ISO 25239-5:2011,
    the term "aluminium" refers to aluminium and its alloys. ISO 25239-5:2011 does
    not apply to friction stir spot welding.
