abstract:
- language: en
  script: Latn
  content: 'ISO 1083:2004 defines the grades and the corresponding requirements for
    spheroidal graphite cast irons. It specifies a classification based on mechanical
    properties measured on machined test pieces prepared either from: separately cast
    samples;cast-on samples;samples cut from a casting. ISO 1083:2004 also specifies
    a classification as a function of hardness. It does not apply to spheroidal graphite
    cast iron used for pipes, fittings and accessories nor to highly alloyed (austenitic)
    spheroidal cast irons or to ausferritic cast irons.'
