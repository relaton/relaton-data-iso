abstract:
- language: en
  script: Latn
  content: This International Standard describes the requirements for automated, controlled
    shot-peening of metallic articles prior to electrolytic or autocatalytic deposition
    of nickel or chromium, or as a final finish, using shot made of cast steel, conditioned
    cut wire, ceramic shot or glass beads. The process is applicable to those materials
    on which test work has shown it to be beneficial within given intensity ranges.
    It is usually not suitable for brittle materials. Handpeening and rotary flap-peening
    are specifically excluded. Shot-peening induces residual compressive stresses
    in the surface and near surface layers of metallic articles, and changes the surface
    microstructure (including phase transformation), thereby controlling or limiting
    the reduction in fatigue properties that occurs from nickel or chromium plating
    of the article, or increasing the fatigue properties of unplated articles.
