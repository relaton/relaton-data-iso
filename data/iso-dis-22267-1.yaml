abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for calculating the embodied carbon
    of ceramic tile. This document includes relevant criteria for using global warming
    potential (GWP) across a product’s reference service life (RSL) from raw material
    through manufacturing, use and end-of-life management within the context of a
    building estimated service life (ESL) of 75 years. Calculation of operational
    carbon is not within the scope of this document.
