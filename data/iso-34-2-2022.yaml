abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the tear strength
    of small test pieces (Delft test pieces) of vulcanized or thermoplastic rubber.
    NOTE      The method does not necessarily give results agreeing with those given
    by the method described in ISO 34-1, which uses trouser, angle and crescent test
    pieces. It is used in preference to ISO 34-1 when the amount of material available
    is limited, and can be particularly suitable for testing small finished products.
