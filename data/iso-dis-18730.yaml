abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for waste volatile anaesthetic agent
    capture systems that may or may not include the recycling of the collected volatile
    anaesthetic agent for reuse. NOTE 1: Waste volatile agent capture systems, that
    are part of a medical gas pipeline system as specified in ISO 7396-1 [4], are
    outside the scope of this document. NOTE 2: Nitrous oxide is not considered to
    be a volatile anaesthetic agent.'
