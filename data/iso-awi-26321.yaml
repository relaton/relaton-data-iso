abstract:
- language: en
  script: Latn
  content: 1.1 This document establishes a designation system for kenaf fibres, which
    may be used as the basis for specifications. 1.2 This designation system is applicable
    to kenaf fibres used for making polymer composites. 1.3 The types of kenaf fibres
    are differentiated by a designation system based on appropriate levels of the
    designatory properties. a) Tensile strength b) Young’s modulus c) Elongation at
