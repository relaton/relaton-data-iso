abstract:
- language: en
  script: Latn
  content: 'This document provides context, motivation and use case descriptions for
    a set of Moving Picture Experts Group (MPEG) standards that collectively deliver
    media directly to render-based applications such as game engines with a renderer
    component, or standalone renderers. Emerging examples where such applications
    are especially relevant include metaverse applications and immersive displays
    where such displays provide an interface to renderers. This document: —     describes
    the motivators leading to the development of new MPEG standards that facilitate
    the streaming of media to render-based applications; —     differentiates between
    visual media distributed for video-based applications and visual media distributed
    to render-based applications; —     provides an overview of a media workflow from
    content production to content distribution; —     provides general information
    on relevant components of render-based systems including game engines and renderers
    —     identifies key components and resources (compute, storage, or network) comprising
    a heterogeneous set of immersive displays and other render-based applications;
    —     and documents use cases for end-to-end interoperability, including audio,
    video, graphics and systems aspects for render-based systems and applications.'
