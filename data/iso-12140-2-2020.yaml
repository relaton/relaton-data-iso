abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements, test procedures, and establishes
    minimum acceptance criteria for the application of telescopic mechanical screw-
    and nut-type drawbar jacks and hydraulic drawbar jacks intended to be fitted on
    the implement tongue of interchangeable towed machinery and hereafter referred
    to as "implement(s)" as original equipment or jacks fitted with a jack attachment
    mount. This document applies to implement mounted jacks or jacks fitted with a
    jack attachment mount. These jacks are used specifically for supporting the hitch
    points of implements during storage, lifting and lowering of implement tongues
    to facilitate attaching to or disconnecting from an agricultural tractor and levelling
    of machinery for stationary use. The drawbars are those which are designed to
    couple with the mechanical connections of towing vehicles.
