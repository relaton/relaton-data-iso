- language: en
  script: Latn
  content: ISO 9538:2017 specifies a flexure test procedure for reconnectable and
    permanent hydraulic tube joints. This procedure is intended for conducting flexure
    tests on fittings with high-strength hydraulic tubes made of corrosion-resisting
    steel, titanium and aluminium for use on commercial and military aircraft.
