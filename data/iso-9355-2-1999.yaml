abstract:
- language: en
  script: Latn
  content: This part of ISO 9355 gives guidance on the selection, design and location
    of displays to avoid potential ergonomic hazards associated with their use. It
    specifies ergonomics requirements and covers visual, audible and tactile displays.
    It applies to displays used in machinery (e.g. devices and installations, control
    panels, operating and monitoring consoles) for occupational and private use. Specific
    ergonomics requirements for visual display terminals (VDTs) used for office tasks
    are given in the standard ISO 9241.
