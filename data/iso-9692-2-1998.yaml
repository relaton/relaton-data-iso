abstract:
- language: en
  script: Latn
  content: This part of IS0 9692 applies to types of joint preparation for submerged
    arc welding with one wire electrode (process 121 according to IS0 4063) on steel.
    This part of IS0 9692 covers only the welding positions PA and PB according to
    IS0 6947. In case PC is used, special preparation will be necessary. It applies
    to fully penetrated welds. For partly penetrated welds, types of joint preparation,
    shapes and dimensions may differ from the listed proposals if they are specified
    in the relevant application standard or agreed by parties concerned. If the root
    is welded by a different arc welding process (see IS0 40631, the joint preparation
    according to IS0 9692 should be taken into account.
