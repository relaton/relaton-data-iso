abstract:
- language: en
  script: Latn
  content: ISO 17836:2017 specifies a test procedure to determine the deposition efficiency
    for thermal spraying. It provides a reliable comparison method between different
    spray processes and different feed stock. It is applicable for all thermal spray
    processes (see ISO 14917) and all wire, rod, cord and powder spray materials.
    It is applicable when data concerning the deposition efficiency of a spray process
    in connection with a defined spray material are required.
