abstract:
- language: en
  script: Latn
  content: ISO 16698:2013 specifies the methods used for estimating geomagnetic indices
    for time intervals ranging from short-term (hours to a few months) to the long-term
    (months to years). Geomagnetic indices are used to describe the activity levels
    of the disturbance of the geomagnetic field. These indices can be used to estimate
    upper atmospheric and plasmaspheric densities and many other space environment
    models. They are also used as the input parameters for orbital lifetime prediction
    and worst-case environment analysis of electrostatic charging. ISO 16698:2013
    is useful for users who want to predict future geomagnetic indices and space environment.
