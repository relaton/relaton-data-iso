abstract:
- language: en
  script: Latn
  content: ISO 19011:2002 provides guidance on the principles of auditing, managing
    audit programmes, conducting quality management system audits and environmental
    management system audits, as well as guidance on the competence of quality and
    environmental management system auditors. It is applicable to all organizations
    needing to conduct internal or external audits of quality and/or environmental
    management systems or to manage an audit programme. The application of ISO 19011
    to other types of audits is possible in principle provided that special consideration
    is paid to identifying the competence needed by the audit team members in such
    cases.
