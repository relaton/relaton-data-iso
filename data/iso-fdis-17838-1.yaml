abstract:
- language: en
  script: Latn
  content: This document specifies the general principles and requirements for the
    design and performance evaluation of emergency core cooling system (ECCS) strainer
    of the pressurized water reactor (PWR) nuclear power plant, including the debris
    source walkdown, upstream analysis, the design of the sump strainer equipment,
    and the debris head loss test and analysis, Chemical effect test and analysis,
    downstream effects (in- vessel) test and analysis, and downstream effects (ex-vessel)
    analysis. This document is applicable to design and performance evaluation of
    ECCS strainer of PWR nuclear power plant. Other reactor types can be implemented
    by reference.
