abstract:
- language: en
  script: Latn
  content: This document establishes requirements and test procedures for determining
    the performance of spark arrestor exhaust systems of multi position small engines
    used in portable applications, such as chain-saws, brush-cutters, grass-trimmers,
    pole-mounted pruners, edgers and similar shaft-drive machines, hedge trimmers
    and hand-held and back-pack blowers. It is not applicable to spark arrestors used
    in vehicles or stationary equipment.
