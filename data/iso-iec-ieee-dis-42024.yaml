abstract:
- language: en
  script: Latn
  content: 'This document specifies the foundational vocabulary, concepts and principles
    associated with an architecture and used within the architecting practice for
    various entities, including software, systems, enterprises, missions, systems
    of systems, families of systems, infrastructures, products (goods or services),
    product lines, service lines, technologies and business domains. The vocabulary,
    concepts and principles apply to: — organizations that develop architectures;
    — organizations seeking sustained success through the implementation of architecture
    practices; — organizations and interested parties seeking to improve communication
    through a common understanding of the vocabulary, concepts and principles used
    in architecture description; — organizations performing conformity assessments
    against the requirements of architecture-related standards and specifications;
    — providers of architecture descriptions, guidelines, training, education, evaluation
    or recommendations in architecture practices; — developers of architecture-related
    standards, architecture description languages, architecture modelling languages,
    reference architectures, reference models related to architecture, architecture
    frameworks and architecture-related tools/technologies. The application areas
    of this document include, but are not limited to, the following: artificial intelligence
    (AI), machine learning (ML), Internet of Things (IoT), cloud computing, big data,
    smart cities, smart manufacturing, cybersecurity, digital twin, telecommunications,
    aerospace, defense, banking, finance, insurance, energy, automotive, hospitality,
    healthcare, supply chain, transportation, manufacturing, agriculture, production,
    and infrastructure. This document addresses generic architecture-related terms
    and definitions and does not address domain-specific terms and definitions. This
    document does not address concepts and principles related to architecture competencies.
    The proposed deliverable is another document in the existing group of architecture
    related standards (e.g. ISO/IEC/IEEE 42010, ISO/IEC/IEEE 42020, ISO/IEC/IEEE 42030).'
