abstract:
- language: en
  script: Latn
  content: This document specifies methods for specifying decorative and protective
    powder coatings on aluminium and its alloys. It defines the characteristic properties
    of powder coatings and provides testing methods with minimum performance requirements,
    with reference to the application and the aggressiveness of the environment in
    which the coated aluminium exists. This document does not apply to coil coatings
    on aluminium.
