abstract:
- language: en
  script: Latn
  content: This part of ISO 4433 specifies a method for carrying out a preliminary
    evaluation of the behaviour of thermoplastics pipes, fittings, sheets and valve
    components in relation to the chemicals transported. This method provides information
    on the suitability of pipes, fittings, sheets and valve components for transporting
    chemicals in the absence of pressure or stresses such as earth loads, dynamic
    stresses and internal stresses. NOTE     An additional indication about test method
    to evaluate the compatibility of plastic materials against liquids, gases, their
    mixtures or multiphase fluids is reported in ISO 23936-1. A full procedure for
    carrying out the test is also reported in ISO 175, which is devoted to plastics
    in general, and not specifically to thermoplastics pipes, fittings, sheets and
    valve components. Fatigue resistance, permeability, resistance to rapid gas decompression
    are not taken into account in this document.
