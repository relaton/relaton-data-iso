abstract:
- language: en
  script: Latn
  content: ISO 14005:2010 provides guidance for all organizations, but particularly
    small- and medium-sized enterprises, on the phased development, implementation,
    maintenance and improvement of an environmental management system. It also includes
    advice on the integration and use of environmental performance evaluation techniques.
    ISO 14005:2010 is applicable to any organization, regardless of its level of development,
    the nature of the activities undertaken or the location at which they occur.
