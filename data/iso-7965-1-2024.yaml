abstract:
- language: en
  script: Latn
  content: This document specifies a method of vertical impact testing on a filled
    paper sack by dropping. It is performed either as a single test to investigate
    the effects of vertical impact or as part of a sequence of tests designed to measure
    the ability of a sack to withstand a distribution system that includes a vertical
    impact hazard. This document specifies the testing procedure and how the results
    of tests are presented. It is based on ISO 2248 but is specifically related to
    paper sacks.
