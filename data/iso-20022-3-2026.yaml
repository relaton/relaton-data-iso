abstract:
- language: en
  script: Latn
  content: This document describes the modelling workflow, complementing ISO 20022-1
    and ISO 20022-2. The modelling workflow describes the required steps a modeller
    follows in order to develop and maintain standardized BusinessTransactions and
    InterfaceDefinitions/MessageSets. This document does not describe the permissible
    artefacts and/or documents to be submitted to the Registration Authority (this
    information is contained in ISO 20022-7). Examples are provided only to illustrate
    the modelling methodology and are not normative.
