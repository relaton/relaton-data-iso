abstract:
- language: en
  script: Latn
  content: 'This document specifies the system framework, operational sequences, logical
    communication interfaces, and performance requirements for Low-Speed Automated
    Vehicle Parking Service (LSAPS) systems. It includes specifications for sub-system
    functions, management processes, environmental conditions within the operation
    zone, and test procedures for minimum performance verification. This document
    is applicable to systems operating at SAE Level 4 (L4) automated driving and remote
    driving of unoccupied vehicles within a designated operation zone. It applies
    to vehicle-centric and distributed-intelligence system architectures. This document
    applies to: ● passenger cars; ● light commercial vehicles. This document specifies
    system architectures and logical communication interfaces between sub-systems;
    it does not assign sub-systems or operational roles to specific commercial or
    business entities. This document does not apply to: ● the transportation of passengers;
    ● Heavy duty vehicles; ● dynamic driving tasks executed outside the prescribed
    operation zone; ● high-speed automated driving functions.'
