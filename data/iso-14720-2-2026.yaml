abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of sulfur in non-oxidic
    ceramic raw materials and ceramic materials, which are completely oxidized at
    a higher temperature in an oxygen atmosphere, e.g. carbon and graphite materials.
    For materials which are not completely oxidizable under these conditions, it is
    possible to determine sulfur that can be released under these conditions, e.g.
    the adherent sulfur. This document is applicable for materials with mass fractions
    of sulfur ≤ 10 % and mass fractions of ash < 20 %, The defined method is limited
    for materials with mass fractions of barium < 10 mg/kg, because the sulfur bonded
    in barium sulfate is not detectable with this method. For the lower detection
    limit of this method, a mass fraction of sulfur of 0,5 mg/kg in the case of inductively
    coupled plasma optical emission spectrometry (ICP-OES) and 5 mg/kg in the case
    of ion chromatography (IC) can be considered as a practical value.
