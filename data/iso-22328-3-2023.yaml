abstract:
- language: en
  script: Latn
  content: This document gives guidelines for the implementation of a community-based
    disaster early warning system (EWS) for tsunamis. It complements the generic guidelines
    in ISO 22328-1[5]. It describes the methods, procedures, implementation measures
    and activities specifically related to tsunamis. This document is applicable to
    communities vulnerable to tsunamis, without taking secondary/indirect effects
    into consideration.
