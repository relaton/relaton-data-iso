abstract:
- language: en
  script: Latn
  content: 'ISO 18595:2007 specifies requirements for resistance spot welding in the
    fabrication of assemblies of aluminium sheet, extrusions (both work- and age-hardening
    alloys) and/or cast material comprising two or three thicknesses of metal, where
    the maximum single (sheet) thickness of components to be welded is within the
    range 0,6 mm to 6 mm. ISO 18595:2007 is applicable to the welding of sheets or
    plates of dissimilar thickness where the thickness ratio is less than or equal
    to 3:1. It applies to the welding of three thicknesses where the total thickness
    is less than or equal to 9 mm. Welding with the following types of machines is
    within the scope of ISO 18595:2007: pedestal welding machines; gun welders; automatic
    welding equipment where the components are fed by robots or automatic feeding
    equipment; multi-welders; robotic welders. The welding of coated material, e.
    g. zinc coated or anodised material, is not within the scope of ISO 18595:2007.'
