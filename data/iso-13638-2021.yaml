abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the ability of
    sealants to resist differing degrees of exposure to water under conditions of
    service. The method assesses the effects of water immersion, for specified durations
    of time, on the ability of the sealant to fulfil its essential functions, principally
    to withstand joint movement.
