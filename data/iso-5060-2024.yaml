abstract:
- language: en
  script: Latn
  content: This document gives guidance on the evaluation of human translation output,
    post-edited machine translation output, and unedited machine translation output.
    It also provides guidance on the qualifications and competences of evaluators.
    The role of sampling is also discussed in this document. This document focuses
    on an analytic translation evaluation approach using error types and penalty points
    configured to produce an error score and a quality rating. A further focus is
    the human evaluation of translation output only. This document follows an approach
    designed to reflect minimum complexity. The rationale behind this approach is
    to keep this document applicable for as many users as possible in the translation
    sector. The guidance provided in this document can also support the evaluation
    of source texts intended for translation. This document is applicable to translation
    service providers (TSPs), including individual translators, translation companies
    or in-house translation services, their clients and other interested parties in
    the translation sector, such as translator education and training institutions.
    This document does not apply to related elements such as the processes of assuring
    the quality of translation output and corrective actions. This document does not
    apply to interpreting.
