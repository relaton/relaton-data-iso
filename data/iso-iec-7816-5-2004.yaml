abstract:
- language: en
  script: Latn
  content: ISO/IEC 7816-4 defines how to use an application identifier to ascertain
    the presence of and/or perform the retrieval of an application in a card. ISO/IEC
    7816-5:2004 shows how to grant the uniqueness of application identifiers through
    the international registration of a part of this identifier, and defines the registration
    procedure,the authorities in charge thereof,the availability of the register which
    links the registered parts of the identifiers and the relevant application providers.
