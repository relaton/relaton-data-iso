abstract:
- language: en
  script: Latn
  content: ISO 10889-3:2016 specifies dimensions, designations, and complementary
    technical delivery conditions for tool holders with a rectangular radial seat
    of types B1 to B8 with cylindrical shank in accordance with ISO 10889‑1. ISO 10889
    is applicable to tool holders with cylindrical shank for machine tools with non-rotating
    tools, preferably for turning machines. For non-standardized tool holders with
    a rectangular radial seat such as the tool holders shown in the figures, it is
    advisable to apply the corresponding specifications of this part of ISO 10889.
