abstract:
- language: en
  script: Latn
  content: ISO 7768:2009 specifies a method for assessing the retention of the original
    smooth appearance, after one or several cleansing treatments, of the fabrics tested.
    This method has been developed for use primarily with Type B domestic washing
    machines, as defined in ISO 6330, in the cleansing process. However, it may be
    possible to use it with Type A machines, as defined in the same International
    Standard. This test method could be used for judging smoothness appearance after
    other cleansing processes.
