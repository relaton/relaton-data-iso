abstract:
- language: en
  script: Latn
  content: This document specifies a framework introducing the approaches that can
    be applied to assess the risks linked to dermal exposure to chemical substances
    in the workplace. This document provides guidance on the different steps to be
    taken when performing qualitative and quantitative dermal exposure assessments.
    This document is not applicable to inhalation, oral, ocular and mucous membranes
    exposure, biological agents, wet work and mechanical stressors.
