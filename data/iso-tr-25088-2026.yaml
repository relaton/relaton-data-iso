abstract:
- language: en
  script: Latn
  content: This document provides an overview of low-carbon technologies for the entire
    production process of the iron and steel industry, sets application in sintering,
    pelletizing, coking, ironmaking, steelmaking, continuous casting, rolling and
    other production processes. NOTE            Low-carbon technologies in the iron
    and steel industry are constantly evolving. This document describes processes
    in different stages of maturity. There is heterogeneity in the decarbonization
    pathways among the steel enterprises. Therefore, not all low-carbon technologies
    covered in this document are equally applicable to all steel plants. Low-carbon
    technologies in the iron and steel industry are not limited to those listed in
    this document. This document will be revised as appropriate as technologies evolve.
