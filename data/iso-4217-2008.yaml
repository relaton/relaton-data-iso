abstract:
- language: en
  script: Latn
  content: ISO 4217:2008 specifies the structure for a three-letter alphabetic code
    and an equivalent three-digit numeric code for the representation of currencies
    and funds. For those currencies having minor units, it also shows the decimal
    relationship between such units and the currency itself. ISO 4217:2008 also establishes
    procedures for a Maintenance Agency, and specifies the method of application for
    codes. ISO 4217:2008 is intended for use in any application of trade, commerce
    and banking, where currencies and, where appropriate, funds are required to be
    described. It is designed to be equally suitable for manual users and for those
    employing automated systems.
