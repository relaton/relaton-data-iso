abstract:
- language: en
  script: Latn
  content: This document specifies a test method based on a FZG four-square test machine
    to determine the relative load-carrying capacity of lubricating oils defined by
    the gear-surface damage known as scuffing. High surface temperatures due to high
    surface pressures and sliding velocities can initiate the breakdown of the lubricant
    films. This test method can be used to assess such lubricant breakdown under defined
    conditions of temperature, high sliding velocity and stepwise increased load.
    NOTE            This method is technically equivalent to ASTM D 5182-19 and CEC L-07-A-95.
