abstract:
- language: en
  script: Latn
  content: This document, in conjunction with ISO 11296-1, specifies requirements
    and test methods for pipes which are formed on site by spirally winding and jointing
    a pre-manufactured profiled plastics strip, or a profiled plastics strip and integral
    locking joiner strip, and used for the renovation of underground non-pressure
    drainage and sewerage networks. It applies to spirally-wound pipes of fixed or
    variable diameter made of profiled plastics strips, with or without steel stiffening
    elements, and installed by one of two methods. The first method employs a dedicated
    winding machine in front of the open end of an existing pipeline, e.g. in a manhole.
    The pipes thus formed are simultaneously inserted into the existing pipeline by
    the winding forces, and by certain techniques can also be expanded in diameter
    after or during insertion. The second method employs a dedicated winding machine
    which forms the pipe as it traverses the existing pipeline from one manhole to
    the next. It applies to profiled plastics strips of unplasticized poly(vinyl chloride)
    (PVC U) with integral locking mechanism, or of high density polyethylene (HDPE)
    with integrally welded joints.
