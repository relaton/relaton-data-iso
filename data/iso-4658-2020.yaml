abstract:
- language: en
  script: Latn
  content: 'This document specifies, for acrylonitrile-butadiene rubbers (NBRs): —
    physical and chemical tests on raw rubbers; — standard materials, a standard test
    formulation, equipment and processing methods for evaluating the vulcanization
    characteristics. The mixing preferred method is the single stage mixing with LIM
    (laboratory internal mixer).'
