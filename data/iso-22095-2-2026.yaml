abstract:
- language: en
  script: Latn
  content: 'This document provides requirements and guidelines for the application
    of the mass balance chain of custody model, as defined in ISO 22095, to any material
    or product flow within mass balance systems, including how to attribute specified
    characteristics to flows of such processes. This document provides requirements
    and guidelines for the following matters, amongst others: differentiations from
    controlled blending and book and claim models; general requirements for organizations
    active in a mass balance chain of custody model; system boundaries including geography
    and time; conversion factors; the rolling average percentage method;  the credit
    method;  transparency, communication and claims.'
