abstract:
- language: en
  script: Latn
  content: This document specifies procedures for the determination of volumetric
    performance of automated liquid handling systems (ALHS), including traceability
    and estimations of measurement uncertainty of measurement results. This document
    is applicable to all ALHS with complete, installed liquid handling devices, including
    tips and other essential parts needed for delivering a specified volume, which
    perform liquid handling tasks without human intervention into labware. NOTE      
    For terminology and general requirements of automated liquid handling systems,
    see ISO 23783-1. Determination, specification, and reporting of volumetric performance
    of automated liquid handling systems is described in ISO 23783-3.
