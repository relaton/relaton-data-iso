abstract:
- language: en
  script: Latn
  content: ISO/TS 14198:2012 provides procedures that can be used as a secondary task
    in a dual task setting to determine whether that evaluation setting is standardized
    and valid for purposes of assessing driver attentional demand due to the use of
    an in-vehicle system. It does not define calibration procedures for other evaluation
    activities that a laboratory might undertake. ISO/TS 14198:2012 provides advice
    on the selection of an appropriate candidate calibration task, given an attentional
    demand evaluation procedure that uses primary driving-like task settings and procedures
    which are defined outside of ISO/TS 14198:2012.
