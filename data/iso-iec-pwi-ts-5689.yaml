abstract:
- language: en
  script: Latn
  content: 'This document provides the followings: CPS conceptual model – a conceptual
    model of cyber-physical systems (CPS) and its general features. Concerns and security
    frameworks – security concerns, which serves as the basis for the discussion of
    security risks and security controls for the CPS based on the conceptual model.
    – several security frameworks to overcome those security concerns. This document
    does not provide specific security controls needed in cyber-physical systems.
    This document ensures that all sectors involved in CPS, which include diverse
    actors not only industrial sector also public sector such as “smart cities”, have
    a common understanding of its concept and security concerns with framework description
    based on the conceptual model.'
