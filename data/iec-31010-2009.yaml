abstract:
- language: en
  script: Latn
  content: 'IEC 31010:2009 is a dual logo IEC/ISO, single prefix IEC, supporting standard
    for ISO 31000 and provides guidance on selection and application of systematic
    techniques for risk assessment. This standard is not intended for certification,
    regulatory or contractual use. NOTE: This standard does not deal specifically
    with safety. It is a generic risk management standard and any references to safety
    are purely of an informative nature. Guidance on the introduction of safety aspects
    into IEC standards is laid down in ISO/IEC Guide 51.'
