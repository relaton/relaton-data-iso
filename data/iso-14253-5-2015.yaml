abstract:
- language: en
  script: Latn
  content: ISO 14253-5:2015 specifies concepts and terms for evaluating the uncertainties
    of the test values derived according to a test protocol agreed upon by the parties
    and relative to instrument indication(s), obtained in verification testing of
    GPS indicating measuring instruments. NOTE The uncertainty of the test values,
    referred to as test value uncertainty, is not to be confused with the measurement
    uncertainty associated with using that indicating measuring instrument to measure
    workpieces. The former only is covered in this part of ISO 14253; for guidance
    on the latter see the ISO/IEC Guide 98‑3 (GUM) and ISO 14253‑2. When a test of
    an indicating measuring instrument comprises several test values, some relative
    to the instrument indication and some to other metrological characteristics, this
    part of ISO 14253 is concerned with the uncertainty of the former only. This part
    of ISO 14253 does not provide guidelines to ensure the adequacy of a test protocol;
    rather, once a test protocol is given, it describes how to evaluate the consequent
    test value uncertainty.
