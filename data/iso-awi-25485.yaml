abstract:
- language: en
  script: Latn
  content: This document establishes requirements for adventure tourism involving
    aerial adventure courses, relating to the operational safety of participants,
    leaders and assistants. This document applies to aerial adventure courses that
    are offered as tourism products. Tourism product design involves a product planning
    and development phase that is not subject to this document. Some tourism products
    include aerial adventure courses together with other tourism services (e.g. transfers,
    meals, lodging), but this document applies only to Aerial adventure courses, the
    additional tourism services being excluded from the scope. This document is applicable
    to any kind of adventure tourism activity provider that offers tourism products
    consisting of aerial adventure courses.
