abstract:
- language: en
  script: Latn
  content: This part of ISO/IEC 14776 defines a protocol for the transport of commands
    and data over High Performance Serial Bus. The transport protocol, Serial Bus
    Protocol 2 or SBP-2, requires implementations to conform to the requirements of
    this standard as well as to ISO/IEC 13213:1994 and permits the exchange of commands,
    data and status between initiators and targets connected to Serial Bus.
