abstract:
- language: en
  script: Latn
  content: 'IEC 62430:2019 describes principles, specifies requirements and provides
    guidance for organizations intending to integrate environmental aspects into the
    design and development in order to minimize the adverse environmental impacts
    of their products. This document applies to processes on how ECD (environmentally
    conscious design) are integrated into the design and development. This document
    applies to any organization, regardless of its size, type or sector. This document
    does not provide requirements for assessing the conformity of individual products.
    This horizontal standard is primarily intended for use by technical committees
    in the preparation of standards in accordance with the principles laid down in
    IEC Guide 108. One of the responsibilities of a technical committee is, wherever
    applicable, to make use of horizontal standards in the preparation of its publications.
    The contents of this horizontal standard will not apply unless specifically referred
    to or included in the relevant publications. IEC 62430:2019 cancels and replaces
    the first edition published in 2009. This edition constitutes a technical revision.
    This edition includes the following significant technical changes with respect
    to the previous edition: a) Scope is extended from electrotechnical product and
    systems to all products including services. b) As a consequence of the scope expansion,
    non-electrotechnical products, services in particular, are taken into account
    to modify requirements. c) Clause 6 is added as a guidance.'
