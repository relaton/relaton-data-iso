abstract:
- language: en
  script: Latn
  content: This document specifies procedures for classifying droplet size spectra
    from atomizers used in spraying for crop protection. It provides a reference system
    for defining classes of droplet size spectra. Depending on their function principle
    and individual setup, measuring systems for droplet sizing can give different
    results. This document provides a means of comparing measured droplet size spectra
    to reference spectra and enables relative comparisons of droplet size spectra
    obtained from different measuring systems.
