abstract:
- language: en
  script: Latn
  content: This document defines the general labelling information required by the clinician for the selection of a suitable dental implant for the surgical procedure. This document designates the terms for the parts of an implant body or a monopart implant that are used in oral implantology and specifies the dimensions and their data on the packaging of a dental implant. This document does not apply to non-root form implants such as zygomatic implants or subperiosteal implants.
