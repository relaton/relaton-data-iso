abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of trace elements in selective catalytic reduction (SCR) denitration catalysts by inductively coupled plasma optical emission spectrometry (ICP-OES). This document is applicable to the determination of potassium (K), sodium (Na), magnesium (Mg), iron (Fe), phosphorus (P), arsenic (As), chromium (Cr), mercury (Hg), lead (Pb), thallium (Tl), and beryllium (Be) in fresh SCR catalysts, spent SCR catalysts, regenerated SCR catalysts, and fresh SCR catalysts containing regenerated catalyst materials.
