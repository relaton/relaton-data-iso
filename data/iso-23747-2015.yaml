abstract:
- language: en
  script: Latn
  content: ISO 23747:2015 specifies requirements for a peak expiratory flow meter
    (pefm) intended for the assessment of pulmonary function in spontaneously breathing
    humans. ISO 23747:2015 covers all medical devices that measure peak expiratory
    flowrate in spontaneously breathing humans either as part of an integrated lung
    function medical device or as a stand-alone medical device. Planning and design
    of products applying to this International Standard are to consider the environmental
    impact from the product during its life cycle. Environmental aspects are addressed
    in Annex E. NOTE Additional aspects of environmental impact are addressed in ISO
    14971.
