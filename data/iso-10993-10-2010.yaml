abstract:
- language: en
  script: Latn
  content: 'ISO 10993-10:2010 describes the procedure for the assessment of medical
    devices and their constituent materials with regard to their potential to produce
    irritation and skin sensitization. ISO 10993-10:2010 includes: pretest considerations
    for irritation, including in silico and in vitro methods for dermal exposure;
    details of in vivo (irritation and sensitization) test procedures; key factors
    for the interpretation of the results. Instructions are given for the preparation
    of materials specifically in relation to the above tests and several special irritation
    tests are described for application of medical devices in areas other than skin.'
