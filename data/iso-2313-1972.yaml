abstract:
- language: en
  script: Latn
  content: Creases in textile fabrics diminish at varying rates on the removal of
    the creasing forces. The magnitude of the crease recovery angle is an indication
    of the ability of a fabric to recover from accidental creasing. The results obtained
    by this method for textile fabrics of very different kinds cannot be compared
    directly.
