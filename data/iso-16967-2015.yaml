abstract:
- language: en
  script: Latn
  content: 'ISO 16967:2015 describes methods for the determination of major elements
    of solid biofuels respectively of their ashes, which are Al, Ca, Fe, Mg, P, K,
    Si, Na, Ti. The determination of other elements such as barium (Ba) and manganese
    (Mn) is also possible with the methods described in ISO 16967:2015. ISO 16967:2015
    includes two parts: Part A describes the direct determination on the fuel, this
    method is also applicable for sulfur and minor elements, Part B gives a method
    of determination on a prepared 550 °C ash.'
