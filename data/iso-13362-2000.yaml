abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for determining the compression
    set of flexible cellular materials under humid conditions. This method consists
    of maintaining the test piece under specified conditions of time, temperature,
    humidity and constant compressive strain and determining the effect on the thickness
    of the test piece after a specified recovery period.
