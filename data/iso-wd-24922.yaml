abstract:
- language: en
  script: Latn
  content: This Document specifies a fire assay enrichment - inductively coupled plasma
    optical emission spectrometry (ICP-OES) procedure for determination of the mass
    fraction of platinum and palladium in nickel sulfide concentrates. This document
    is applicable to the determination of mass fractions of platinum and palladium
    contents in nickel sulfide concentrates from 0.50 g/t to 20 g/t and from 0.50
    g/t to 10 g/t respectively
