abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1654:2018-11 specifies the application module for Characteristic.
    The following are within the scope of ISO/TS 10303-1654:2018-11: identification
    of characteristics data in tabular form; identification of scalar characteristic;
    identification of tolerance characteristic; identification of range characteristic;
    identification of measurements in which there is an associated uncertainty; items
    within the scope of application module Basic data representation, ISO/TS 10303-1773;
    items within the scope of application module Document assignment, ISO/TS 10303-1122;
    items within the scope of application module Extended measure representation,
    ISO/TS 10303-1106; items within the scope of application module External library,
    ISO/TS 10303-1778; items within the scope of application module External properties,
    ISO/TS 10303-1129; items within the scope of application module Property assignment,
    ISO/TS 10303-1030; items within the scope of application module Value with unit
    extension, ISO/TS 10303-1753.'
