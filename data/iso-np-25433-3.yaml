abstract:
- language: en
  script: Latn
  content: This document specifies special requirements for maritime searchlights
    intended to be installed on vessels navigating the Suez Canal, reflecting the
    operational conditions during Suez Canal transit. It applies to searchlights used
    to support safe navigation during night-time and restricted visibility operations
    in the canal area. General requirements for maritime searchlights are in accordance
    with ISO 25433-1. This document covers searchlights using different light sources,
    and in particular includes LED-based maritime searchlights installed on vessels
    navigating the Suez Canal, for which harmonized requirements and appropriate criteria
    for conformity assessment are currently not sufficiently established in existing
    international standards.
