abstract:
- language: en
  script: Latn
  content: This document establishes a uniform method of laboratory testing for the
    determination of airflow propelled through an open personnel door by a positive
    pressure ventilator. NOTE            The test described by this document is not
    entirely in accordance with ISO 5801, though it references several subclauses
    of ISO 5801 (such as the measurement of pressure and airflow). This document does
    not specify a testing procedure for the design, production or field test of any
    PPV, nor is it the purpose for this document to serve as a manual for the construction,
    validation or calibration of the test facility. This document does not apply to
    any item of equipment designed or intended for applications other than positive
    pressure ventilation.
