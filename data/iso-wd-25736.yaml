abstract:
- language: en
  script: Latn
  content: The scope of this proposed standard is to provide the general guidelines
    for selection of metallic materials that suit the conditions required for cargo
    containment systems for liquid hydrogen in marine applications. This standard
    identifies materials that can be used in a liquid hydrogen atmosphere and the
    conditions required for them, and analyzes material compatibility test methods
    currently applied in a wide range of liquid hydrogen storage applications. This
    standard is based on the analysis of the main properties and hazards of liquid
    hydrogen, which influence the method of its operation as well as how to test metallic
    materials.
