abstract:
- language: en
  script: Latn
  content: ISO 248:2005 specifies two methods, a hot-mill method and an oven method,
    for the determination of moisture and other volatile-matter content in raw rubbers.
    These methods are applicable to the determination of the volatile-matter content
    in the R-group of rubbers listed in ISO 1629 which are rubbers having an unsaturated
    carbon chain, for example, natural rubber and synthetic rubbers derived at least
    partly from diolefins. ISO 248:2005 may also be applicable to other rubbers, but
    in these cases it is necessary to prove that the change in mass is due solely
    to loss of original volatile matter and not to rubber degradation. The hot-mill
    method is not applicable to natural and synthetic isoprene rubbers or to rubbers
    too difficult to handle on a hot mill or to rubbers in powdered or chip form.
