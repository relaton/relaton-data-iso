abstract:
- language: en
  script: Latn
  content: ISO/TS 21569-3:2015 describes a procedure for the detection of the DNA
    transition sequence between the 35S promotor (P35S) from Cauliflower mosaic virus
    and a modified phoshinothricin-acetyltransferase gene (pat) from Streptomyces
    viridochromogenes. ISO/TS 21569-3:2015 is applicable for the analysis of DNA extracted
    from foodstuffs. It may also be suitable for the analysis of DNA extracted from
    other products such as feedstuffs and seeds.
