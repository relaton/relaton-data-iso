abstract:
- language: en
  script: Latn
  content: This technical report inventories the available reference methods for physical
    and chemical characterization of sludge. Identification of reference methods dedicated
    to the sludge analysis was conducted by questioning standards databases, and at
    first base of the European Committee for Standardization (CEN), as it represents
    a compendium of methods developed by CEN/TC 308 "sludge characterization" in response
    to the directive 86-276/CE. CEN/TC 400 “Sludge, treated biowaste and soil” and
    CEN/TC 292 “Characterization of waste” (characterisation methods) merged in 2016
    in CEN / TC 444 “analytical laboratory methods for environmental solid matrices”,
    which is now co-responsible with CEN/TC308 for the maintenance of existing corpus
    and the development of new methods, if needed. At the international level, the
    absence up to 2013 of ISO Standardization Committee dedicated to sludge makes
    identification of ISO standardized methods applicable to this matrix more difficult,
    as sludge has sometimes covered by other committees as related to their matrix,
    water and water suspended solids (ISO / TC 147 “water quality”) or soil (ISO /
