abstract:
- language: en
  script: Latn
  content: ISO 10889-5:2016 specifies dimensions, designations and complementary technical
    delivery conditions for tool holders with more than one rectangular seat of types
    D1 and D2 with cylindrical shank in accordance with ISO 10889‑1. ISO 10889-5:2016
    is applicable to tool holders with cylindrical shank for machine tools with non-rotating
    tools, preferably for turning machines. For non-standardized tool holders with
    more than one rectangular seat, such as tool holders as shown in Figures 1 to
    3, it is advisable to apply the corresponding specifications of this part of ISO
    10889.
