abstract:
- language: en
  script: Latn
  content: ISO 19114:2003 provides a framework of procedures for determining and evaluating
    quality that is applicable to digital geographic datasets, consistent with the
    data quality principles defined in ISO 19113. It also establishes a framework
    for evaluating and reporting data quality results, either as part of data quality
    metadata only, or also as a quality evaluation report. ISO 19114:2003 is applicable
    to data producers when providing quality information on how well a dataset conforms
    to the product specification, and to data users attempting to determine whether
    or not the dataset contains data of sufficient quality to be fit for use in their
    particular applications. Although ISO 19114:2003 is applicable to all types of
    digital geographic data, its principles can be extended to many other forms of
    geographic data such as maps, charts and textual documents.
