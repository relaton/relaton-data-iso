abstract:
- language: en
  script: Latn
  content: This document establishes the specifications relative to family X (greases)
    for lubricants, industrial oils and related products of Class L (see ISO 6743-9).
    Those greases are mainly used for the lubrication of anti-friction bearings fitted
    on machines, vehicles, etc. This document is written in a general form so that
    its application can accommodate various climatic conditions throughout the world.
    It also stipulates the requirements for the lubricating grease at the time of
    the delivery. NOTE 1   This document is intended to be read in conjunction with
    ISO 6743-9. NOTE 2   Greases for gear applications are specified in ISO 12925-3.
