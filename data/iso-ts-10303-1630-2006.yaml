abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1630:2006 specifies the application module for AP210 production
    rule. ISO/TS 10303-1630:2006 deals with the representation of production rules,
    commonly used as design rules. This data includes support for rule creation, management,
    assignment to product data or features, assignment to product or requirement parameters.
    Complete use of this capability requires use of external definition for the expressions.
    Configuration management information and design change management information
    is provided. Guidance for mapping instance data to commercial production rule
    systems is provided. The following are within the scope of ISO/TS 10303-1630:2006:
    rules that define a constraint by relating two elements based upon characteristics
    of a design;production rules structure and semantics;rule definition;rule grouping;rule
    management.'
