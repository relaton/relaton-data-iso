abstract:
- language: en
  script: Latn
  content: 'This standard specifies the measurement of settlement of geotechnical
    structures/works or structures influenced by geotechnical works by means of hydraulic
    settlement systems. General rules of performance monitoring of the ground, or
    structures interacting with the ground, of geotechnical fills and of geotechnical
    works are presented in ISO 18674-1:2015. This document is applicable to: — monitoring
    of settlement acting onto, or within, geotechnical structures such as embankments,
    excavations, compensation grouting, tunnel lining, railways, roads and other civil
    structures; — checking geotechnical designs and adjustment of construction in
    connection with the Observational Design procedure; evaluating (subsoil) stability
    during or after construction.'
