abstract:
- language: en
  script: Latn
  content: 'This document specifies a system for the identification and presentation
    of information about freight containers. The identification system gives guidelines
    for general application, for example in documentation, control and communications
    (including automatic data processing systems), as well as for display on the containers
    themselves. It defines the methods of displaying identification and certain other
    data (including operational data) on containers by means of permanent marks. This
    document specifies: a container identification system, with an associated system
    for verifying the accuracy of its use of marks; a coding system for data on container
    size and type, with corresponding marks for their display; operational marks,
    both mandatory and optional; physical presentation of marks on the container.
    This document defines the terms “mandatory” and “optional” and provides guidelines
    for the use of the designated marks. The terms “mandatory” and “optional” do not
    refer to the requirements of any regulatory body. This document is applicable
    to all freight containers covered by ISO 668, the ISO 1496 series, ISO 8323 and
    is applicable to: containers other than those covered by the International Standards
    listed in Clause 2; container-related or detachable equipment, or both. NOTE 1       
    Containers marked according to previous editions of this document need not be
    re-marked. This document does not apply to temporary operational marks of any
    kind, permanent marks, data plates, etc. which can be required by intergovernmental
    agreements, national legislation or nongovernmental organizations. NOTE 2       
    Some of the major international conventions whose container-marking requirements
    are not covered in this document are as follows: International Convention for
    Safe Containers (1972, as amended) (CSC), International Maritime Organization
    (IMO); Customs Convention on Containers 1956 and 1972, related to temporary admission
    and transport under customs seal. Convention on Temporary Admission (Istanbul,
    26 June 1990), related to temporary admission. This document does not cover the
    display of technical data on tank containers (see ISO 1496-3), nor does it, in
    any way, include identification marks or safety signs for items of cargo which
    can be carried in freight containers.'
