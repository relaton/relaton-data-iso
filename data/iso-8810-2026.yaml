abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of di-tert-butyl
    peroxide (DTBP) and 2, 5-Dimethyl-2, 5-di (tert-butylperoxy) hexane (DBPH) in
    plastics by using gas chromatography. This document is applicable to the determination
    of the content of residual peroxides in plastics and their products, which use
    peroxides as a degradation agent or crosslinking agent during plastics processing,
    or as an additive during polymerization, thereby remaining in degraded polypropylene,
    crosslinked polyethylene, polystyrene and other plastics. NOTE            The
    applicability of this method to other peroxides is possible when the method is
    validated for each case.
