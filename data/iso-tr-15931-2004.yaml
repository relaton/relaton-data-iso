abstract:
- language: en
  script: Latn
  content: 'ISO/TR 15931:2004 is intended to achieve the following: to make the designation
    of cast irons and pig irons as simple and as understandable as possible, bearing
    in mind language barriers world-wide;to define cast iron and pig iron designations
    by a simple code consisting of relevant letters and numbers only;to ensure that
    the agreed system is user-friendly from the point of view of the casting designer,
    the manufacturer (founder) and the user;to ensure that the designation system
    clearly defines the materials described by standards and details all of the important
    attributes of mechanical properties, chemical composition and additional features
    that need to be described.'
