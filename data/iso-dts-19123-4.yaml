abstract:
- language: en
  script: Latn
  content: This document specifies fundamental models of tiling schemas that are suitable
    for binding tiled imagery and gridded data based on ISO 19163-1 and coverage models
    based on ISO 19123-1.Except grid coverage, the specified tiling schema may also
    apply to other coverage types, such as point clouds and general meshes, as long
    as these types are bound to a gridded space and the corresponding tiling schema
    is described in the gridded space for these data types.
