abstract:
- language: en
  script: Latn
  content: This document specifies requirements for classification of covered electrodes
    and deposited metal in the as-welded condition and in the post-weld heat-treated
    condition for manual metal arc welding of high-strength steels with a minimum
    yield strength greater than 500 MPa or a minimum tensile strength greater than
    570 MPa. This document is a combined specification providing a classification
    utilizing a system based on the yield strength and an average impact energy of
    47 J of the all-weld metal, or utilizing a system based on the tensile strength
    and an average impact energy of 27 J of the all-weld metal. Clauses, subclauses
    and tables which carry the suffix “System A” are applicable only to covered electrodes
    classified under the system based on the yield strength and an average impact
    energy of 47 J of the all-weld metal given in this document. Clauses, subclauses
    and tables which carry the suffix “System B” are applicable only to covered electrodes
    classified under the system based on the tensile strength and an average impact
    energy of 27 J of the all-weld metal given in this document. Subclauses and tables
    which do not have either the suffix “System A” or the suffix “System B” are applicable
    to all covered electrodes classified under this document.
