abstract:
- language: en
  script: Latn
  content: ISO 7731:2003 specifies the physical principles of design, ergonomic requirements
    and the corresponding test methods for danger signals for public and work areas
    in the signal reception area and gives guidelines for the design of the signals.
    It may also be applied to other appropriate situations. ISO 7731:2003 does not
    apply to verbal danger warnings (e.g. shouts, loudspeaker announcements). ISO
    9921 covers verbal danger signals. Special regulations such as those for a public
    disaster and public transport are not affected by this International Standard.
