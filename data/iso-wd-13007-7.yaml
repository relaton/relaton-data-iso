abstract:
- language: en
  script: Latn
  content: This part of ISO 13007 applies to all bonded or not-bonded sound-dampening
    materials that are used beneath ceramic tiling for internal and external tile
    installations on walls and floors. This ISO standard gives the terminology concerning
    the products and specifies the test methods and the values of performance requirements
    for bonded sound-dampening materials associated with tile adhesives. Further,
    this ISO specifies the evaluation of conformity and the classification and designation
    of all bonded sound-dampening materials beneath ceramic tiling. NOTE 1 Bonded
    sound-dampening materials may also be used beneath other types of tiles (natural
    and agglomerated stones etc.), where they do not adversely affect these materials.
