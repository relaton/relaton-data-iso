abstract:
- language: en
  script: Latn
  content: ISO 14229-5:2013 references ISO 14229-1 and ISO 14229-2 and specifies the
    implementation requirements of a common set of unified diagnostic services (UDS)
    on Internet Protocol (UDSonIP). ISO 14229-5:2013 does not include any redundant
    information of the documents as listed in the introduction. It focuses on additional
    requirements specific to the implementation of UDSonIP, and specific restrictions
    in the implementation of UDSonIP.
