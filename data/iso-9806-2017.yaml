abstract:
- language: en
  script: Latn
  content: ISO 9806:2017 specifies test methods for assessing the durability, reliability,
    safety and thermal performance of fluid heating solar collectors. The test methods
    are applicable for laboratory testing and for in situ testing. ISO 9806:2017 is
    applicable to all types of fluid heating solar collectors, air heating solar collectors,
    hybrid solar collectors co-generating heat and electric power, as well as to solar
    collectors using external power sources for normal operation and/or safety purposes.
    It does not cover electrical safety aspects or other specific properties directly
    related to electric power generation. ISO 9806:2017 is not applicable to those
    devices in which a thermal storage unit is an integral part to such an extent
    that the collection process cannot be separated from the storage process for making
    the collector thermal performance measurements.
