abstract:
- language: en
  script: Latn
  content: Specifies methods for the calculation of the operating power requirements
    on the driving pulley of a belt conveyor, and of the tensile forces exerted on
    the belt. Applies to belt conveyors with carrying idlers. Lays down the definitions,
    symbols and units etc. and defines the resistances to motion of belt conveyor,
    the driving force and power requirements and the capacity and cross-section of
    a conveyor with a smooth patternless belt.
