abstract:
- language: en
  script: Latn
  content: ISO 13579-2:2013 specifies a general methodology for measuring energy balance
    and calculating the efficiency of the process involving reheating furnaces for
    steel as designed by furnace manufacturers. This general methodology includes
    measurement methods, calculations (general calculation) and energy balance and
    efficiency calculation evaluation report. ISO 13579-2:2013 is not applicable to
    any efficiencies related to the process itself outside of reheating furnaces for
    steel.
