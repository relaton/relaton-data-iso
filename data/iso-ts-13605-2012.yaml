abstract:
- language: en
  script: Latn
  content: ISO/TS 13605:2012 sets out a wavelength dispersive X-ray fluorescence procedure
    for the determination of silicon, aluminium, iron, calcium, magnesium, sodium,
    potassium, titanium, manganese, phosphorus and sulfur. The method is applicable
    to coal ashes, coke ashes and boiler ashes having components within the concentration
    ranges specified in ISO/TS 13605:2012.
