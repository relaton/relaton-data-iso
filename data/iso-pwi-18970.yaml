abstract:
- language: en
  script: Latn
  content: This document specifies a test method for particle-free erosion corrosion
    of metallic materials in flowing liquids by a rotating disk with specimens attached
    on the periphery, including testing apparatus, specimen preparation, testing procedure,
    evaluation after test and test report. This document applies to the erosion corrosion
    testing of metallic specimens in single phase flowing liquids in the laboratory.
    Specimens with metallic or ceramic coatings can also be tested using this method.
    The test method can be used for ranking materials performance, selecting candidate
    materials and testing the effects of corrosion inhibitors and protective coatings.
