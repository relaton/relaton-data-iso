abstract:
- language: en
  script: Latn
  content: 'ISO 23553-1:2014 specifies safety, constructional and performance requirements
    and testing of automatic and semi-automatic valves for oil. It applies to automatic
    and semi-automatic valves which are: -normally closed; -used in combustion plants
    to interrupt the oil flow with or without delay on closing; -for use with oil
    types (e.g. middle distillate fuel oil, crude oil, heavy fuel oil or kerosene)
    without gasoline; -for use on burners or in appliances using oil; -directly or
    indirectly operated, electrically or by mechanical or hydraulic means; -fitted
    with or without closed-position indicator switches. ISO 23553-1:2014 covers type
    testing only.'
