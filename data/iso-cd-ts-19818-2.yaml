abstract:
- language: en
  script: Latn
  content: 'This document relates to ISO 19818-1. It describes a procedure to specify
    and select the appropriate protector against laser radiation for the eye and provides
    some examples. Any protective face protector is covered by the normative requirements
    for the frame of eye protectors, however, dedicated skin protectors are excluded
    from the scope. This document is intended to be used by: ― any person who selects
    laser eye protectors, for instance a laser safety officer or a laser safety advisor,
    or the responsible manager. ― any user of the laser product, so as to be able
    to make the correct choice of laser eye protection including when more than one
    laser product is in use, requiring different eye protectors. Manufacturers of
    laser products, manufacturers of laser eye protectors and the vendors of the laser
    product could find the information which is provided by this document useful.'
