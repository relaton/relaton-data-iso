abstract:
- language: en
  script: Latn
  content: This document specifies the test method for the determination of hexachlorobenzene
    (HCB) in pyrotechnic compositions by gas chromatography. The limit of detection
    depends on the substance to be determined, the equipment used, the quality of
    chemicals used for the extraction of the sample, and the clean-up of the extract.
    Under the conditions specified in this document, a limit of detection of 1 mg/kg
    (expressed as dry matter) can be achieved.
