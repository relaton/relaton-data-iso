abstract:
- language: en
  script: Latn
  content: ISO 24502:2010 specifies the age-related luminance contrast of any two
    lights of different colour seen by a person at any age, by taking into account
    the age-related change of spectral luminous efficiency of the eye. ISO 24502:2010
    provides a basic method of calculation that can be applied to the design of lighting,
    visual signs and displays. It applies to light, self-luminous or reflected, in
    visual signs and displays seen under moderately bright conditions called photopic
    vision and whose spectral radiance is known or measurable. It does not apply to
    light seen under darker conditions called mesopic or scotopic vision. ISO 24502:2010
    specifies the luminance contrast for people aged from 10 to 79 years who have
    had no medical treatment or surgery on their eyes that may affect their spectral
    luminous efficiency. ISO 24502:2010 does not apply to visual signs and displays
    seen by people with colour defects whose spectral luminous efficiency is different
    from those with normal colour vision, nor those seen by people with low vision.
