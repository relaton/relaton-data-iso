abstract:
- language: en
  script: Latn
  content: This document specifies a method for measuring workers’ exposure to noise
    in a working environment and calculating the noise exposure level. This document
    deals with A-weighted levels but is applicable also to C-weighted levels. Three
    different strategies for measurement are specified. The method is applicable for
    detailed noise exposure studies or epidemiological studies of hearing damage or
    other adverse effects. The measuring process requires observation and analysis
    of the noise exposure conditions so that the quality of the measurements can be
    controlled. This document provides methods for estimating the uncertainty of the
    results. This document is not intended for assessment of masking of oral communication
    or assessment of infrasound, ultrasound and non-auditory effects of noise. It
    does not apply to the measurement of the noise exposure of the ear when hearing
    protectors are worn. Results of the measurements performed in accordance with
    this document can provide useful information when defining priorities for noise
    control measures.
