abstract:
- language: en
  script: Latn
  content: 'ISO 3890-1|IDF 75-1:2009 describes general considerations and specifies
    extraction methods for the determination of residues of organochlorine pesticides
    in milk and milk products. A method for high-fat products is specified in an annex.
    Guidance is given on the conduct of analyses in the presence of polychlorinated
    biphenyls (PCBs) in another annex. The methods are applicable to: alpha-HCH; beta-HCH;
    gamma-HCH; aldrin/dieldrin; heptachlor and heptachlorepoxide; isomers of DDT,
    DDE, TDE; chlordane and oxychlordane; and endrin. Certain methods are applicable
    to delta-ketoendrin and HCB.'
