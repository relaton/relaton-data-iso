abstract:
- language: en
  script: Latn
  content: This document specifies procedures to measure the spirality or torque of
    woven and knitted garments after domestic laundering. The results obtained from
    different procedures might not be comparable. This document is not intended to
    measure the spirality of garments as manufactured, but rather the spirality after
    domestic laundering. NOTE       Some fabric constructions, such as denim, can
    have spirality intentionally introduced during manufacturing. Garments made of
    fabrics from circular knitting machines can have inherent nonverticality of wale
    alignment.
