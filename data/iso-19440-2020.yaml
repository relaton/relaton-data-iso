abstract:
- language: en
  script: Latn
  content: This document identifies and specifies constructs necessary for users that
    model enterprises in conformance with ISO 19439. This document focuses on, but
    is not restricted to, engineering and the integration of manufacturing and related
    services in the enterprise. The constructs enable the description of structure
    and functioning of an enterprise for use in configuring or implementing in different
    application domains. This document specifies an implementation framework in Clause
    6 to map model constructs into such domains.
