abstract:
- language: en
  script: Latn
  content: 'The scope of this Recommendation | International Standard is: ? an enterprise
    specification for the trading function; ? an information specification for the
    trading function; ? a computational specification for traders (i.e. objects providing
    the trading function); ? conformance requirements in terms of conformance points.
    It is not a goal of this Recommendation | International Standard to state how
    the trading function should be realized. Therefore this Recommendation | International
    Standard does not include an engineering specification. The field of application
    for this Recommendation | Intenational Standard is any ODP system in which it
    is required to introduce and discover services incrementally, dynamically and
    openly.'
