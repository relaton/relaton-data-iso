abstract:
- language: en
  script: Latn
  content: ISO/TS 17574:2017 provides guidelines for preparation and evaluation of
    security requirements specifications, referred to as Protection Profiles (PP)
    in ISO/IEC 15408 (all parts) and in ISO/IEC TR 15446. By Protection Profile (PP),
    it means a set of security requirements for a category of products or systems
    that meet specific needs. A typical example would be a PP for On-Board Equipment
    (OBE) to be used in an EFC system. However, the guidelines in this document are
    superseded if a Protection Profile already exists for the subsystem in consideration.
