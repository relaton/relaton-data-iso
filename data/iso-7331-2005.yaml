abstract:
- language: en
  script: Latn
  content: 'ISO 7331:2005 specifies the minimum requirements for safety in ski-poles
    for alpine skiing and gives test methods to check conformity with these requirements.
    It applies to ski-poles for alpine skiing in the following ranges of total length:
    group A, equal to or great er than 1 050 mm (adults'' poles); group B, less than
    1 050 mm but equal to or greater than 700 mm (junior poles); group C, equal to
    or less than 700 mm (children''s toy-poles).'
