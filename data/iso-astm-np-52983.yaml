abstract:
- language: en
  script: Latn
  content: This document specifies a thermogravimetric analysis (TGA) method for determining the solid content of photocurable ceramic slurry used in vat photopolymerization additive manufacturing. Using TGA, the solid content is determined by measuring the mass change of a ceramic slurry sample as a function of temperature under controlled thermal conditions. This enables differentiation between thermally stable inorganic residues and organic constituents that are combusted or volatilized. This document describes the principle of the method, as well as sampling, sample preparation, test procedure, calculation, and reporting of solid content. This document aims to evaluate the solid content by using TGA, which is an important parameter influencing various properties of photocurable ceramic slurry used in additive manufacturing, as specified in ISO/ASTM 52940. TGA of ceramic slurry also provides additional information for establishing appropriate temperature range for the debinding or sintering processes following additive manufacturing. Furthermore, it is applicable for evaluating the dispersion uniformity of ceramic powder in photocurable resins. This document does not specify acceptance criteria for solid content values, nor does it address process optimization, printing performance, dimensional accuracy, or end-use properties of ceramic parts. This document does not deal with safety aspects.
