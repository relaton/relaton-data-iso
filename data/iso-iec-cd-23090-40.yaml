abstract:
- language: en
  script: Latn
  content: This project specifies a set of tests and procedures designed to indicate
    whether encoders or decoders meet the normative requirements specified in ISO/IEC
    23090-38. It also provides accompanying reference software for ISO/IEC 23090-38
    as an electronic attachment. The use of this reference software is not required
    for making an implementation of an encoder or decoder in conformance to ISO/IEC
    23090-38. Requirements established in ISO/IEC 23090-38 take precedence over the
    behavior of the reference software.
