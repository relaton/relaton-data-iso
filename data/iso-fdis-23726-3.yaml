abstract:
- language: en
  script: Latn
  content: 'This document describes the Industrial Data Ontology (IDO), a Web Ontology
    Language (OWL) ontology. IDO is intended for industrial data and information,
    to build vocabularies and manage asset models that employ reference data libraries
    and exploit OWL DL. IDO is intended for use in all life cycle phases of industrial
    assets and processes. The following are within the scope of this document: - general
    overview of IDO and of the main principles, - normative definitions of IDO classes
    and relations, - informative examples of the use of IDO terminology in context,
    - re-usable representation patterns. The following are outside the Scope of this
    document: - specification of data modelling languages, such as RDF and OWL used
    in ontology development; and - specification of methods for reasoning with ontologies.'
