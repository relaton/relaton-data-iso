abstract:
- language: en
  script: Latn
  content: This document specifies how to uniquely identify the integral features
    of a part by an integral feature indicator with a unique alpha-numerical label
    and how indication in technical product documentation (TPD) is done, where needed
    to improve human readability. The proportions and dimensions of graphical symbols
    for a simplified indication of repeated features are also specified.
