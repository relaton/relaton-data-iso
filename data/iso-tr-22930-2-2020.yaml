abstract:
- language: en
  script: Latn
  content: The use of a continuous air monitor (CAM) is mainly motivated by the need
    to be alerted quickly and in the most accurate way possible with an acceptable
    false alarm rate when significant activity concentration value is exceeded, in
    order to take appropriate measures to reduce exposure of those involved. The performance
    of this CAM does not only depend on the metrological aspect characterized by the
    decision threshold, the limit of detection and the measurement uncertainties but
    also on its dynamic capacity characterized by its response time as well as on
    the minimum detectable activity concentration corresponding to an acceptable false
    alarm rate. The ideal performance is to have a minimum detectable activity concentration
    as low as possible associated with a very short response time, but unfortunately
    these two criteria are in opposition. It is therefore important that the CAM and
    the choice of the adjustment parameters and the alarm levels be in line with the
    radiation protection objectives. This document describes — the dynamic behaviour
    and the determination of the response time, — the determination of the characteristic
    limits (decision threshold, detection limit, limits of the coverage interval),
    and — a possible way to determine the minimum detectable activity concentration
    and the alarms setup. Finally the annexes of this document show actual examples
    of CAM data which illustrate how to quantify the CAM performance by determining
    the response time, the characteristics limits, the minimum detectable activity
    concentration and the alarms setup.
