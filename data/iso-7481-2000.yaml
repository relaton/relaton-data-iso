abstract:
- language: en
  script: Latn
  content: This International Standard specifies test methods for metric self-locking
    nuts with MJ threads intended for use in aerospace construction at maximum operating
    temperatures less than or equal to 425 °C. It describes the test device and the
    method for each test. It applies to self-locking nuts as defined above, provided
    that the relevant documents (dimensional standard, drawing, procurement specification,
    etc.) refer to this International Standard. This International Standard shall
    be used in conjunction with ISO 5858. NOTE This International Standard only specifies
    tests for ambient and elevated temperature applications. Tests for applications
    at less than ambient temperatures, for example cryogenic, shall be as agreed upon
    between seller and purchaser.
