abstract:
- language: en
  script: Latn
  content: ISO 22007-6:2014 specifies a modulated temperature method realizing the
    measurement of thermal conductivity. An input of temperature deviation is less
    than 1 K, and a double lock-in method is applied to amplify the small temperature
    modulation. ISO 22007-6:2014 specifies the method to determine the thermal conductivity
    in the range from 0,026 W/mK to 0,6 W/mK.
