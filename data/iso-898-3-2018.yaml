abstract:
- language: en
  script: Latn
  content: 'This document specifies mechanical and physical properties of flat washers,
    designed to be used in bolted joints in combination with bolts, screws, studs
    and nuts with a specified property class in accordance with ISO 898‑1 and ISO
    898‑2. NOTE 1 These types of washers can also be used with other fasteners such
    as screws forming their own mating thread. Washers that conform to the requirements
    of this document are evaluated at an ambient temperature range of 10 °C to 35
    °C. They might not retain the specified mechanical and physical properties at
    elevated temperatures and/or lower temperatures. NOTE 2 Washers conforming to
    the requirements of this document are used in applications ranging from −50 °C
    to +150 °C. Users are advised to consult an experienced fastener expert for temperatures
    outside this range and up to a maximum temperature of +300 °C when determining
    appropriate choices, or for critical applications. This document is applicable
    to the following flat captive and non-captive washers made of carbon steel or
    alloy steel, with thickness from 0,2 mm to 12 mm: — plain washers (with or without
    knurls, ribs or chamfers); — square washers; — square hole washers; — shaped plates.
    It does not specify requirements for the following properties: — corrosion resistance;
    — weldability.'
