abstract:
- language: en
  script: Latn
  content: This document specifies a method used for the determination of the temperature
    of deflection under load of specified plastics (including fibre-reinforced plastics
    in which the fibre length is, prior to processing, greater than 7,5 mm) under
    defined conditions. A number of different test conditions are defined, depending
    on the anticipated specimen dimensions. For additional information, see ISO 75-1:2020,
    Clause 1.
