abstract:
- language: en
  script: Latn
  content: ISO/TR 29662:2009 is not intended to be a comprehensive manual on flash
    point tests and the interpretation of test results, however it covers the key
    aspects of these subjects. The flash point test can be summarized as a procedure
    where a test portion is introduced into a temperature-controlled test cup and
    an ignition source is applied to the vapours produced by the test portion to determine
    if the vapour/air mixture is flammable and, if so, at what temperature.
