abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1726:2006 specifies the application module for Physical unit
    2D shape. The following are within the scope of ISO/TS 10303-1726:2006: generic
    analysis input; generic analysis output; shock analysis input; shock analysis
    output; design; vibration analysis input; vibration analysis output; electromagnetic
    compatibility analysis input; electromagnetic compatibility analysis output; thermal
    analysis input; thermal analysis output; extruded shape class; manhattan shape
    class; generic shape class; planar part shape; planar part keepout shape; items
    within the scope of application module Layered 2d shape, ISO/TS 10303-1693; items
    within the scope of application module Non feature shape element, ISO/TS 10303-1706;
    items within the scope of application module Physical unit shape with parameters,
    ISO/TS 10303-1730.'
