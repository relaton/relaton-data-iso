abstract:
- language: en
  script: Latn
  content: This document provides normative tables of machine performance levels required
    (MPLr) by common function and type for earth-moving machinery (EMM) as defined
    in ISO 6165. These MPLr can then be mapped or applied to safety control systems
    (SCS) used to control or that affect the functions defined in the table. The MPLr
    in this document are determined through the machine control system safety analysis
    (MCSSA) process outlined in ISO 19014-1. A brief explanation of how the levels
    were derived and the associated assumptions are contained herein. This document
    is not applicable to EMM manufactured before the date of its publication.
