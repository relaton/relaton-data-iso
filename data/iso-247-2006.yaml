abstract:
- language: en
  script: Latn
  content: 'ISO 247:2006 specifies two methods for the determination of ash from raw
    rubbers, compounded rubbers and vulcanizates. The methods are applicable to raw,
    compounded or vulcanized rubbers of the M, N, O, R and U families described in
    ISO 1629, except that: Method A is not intended to be used for the determination
    of ash from compounded or vulcanized rubbers containing chlorine, bromine or iodine.Method
    B is intended to be used for compounded or vulcanized rubbers containing chlorine,
    bromine or iodine. lt is not intended to be used for uncompounded rubbers.'
