abstract:
- language: en
  script: Latn
  content: This document gives guidelines for in-service system pressure tests of
    the reactor coolant circuit of light water reactors. This document specifies the
    test technique, the requirements for measuring equipment and additional devices,
    the preparation and performance of the test as well as the recording and documentation,
    for the purpose to ensure the reliability and comparability of tests. NOTE Data
    on (test) pressure, (test) temperature, scope of testing, rates of change of pressure
    and temperature, test schedule and inspection intervals can be obtained from the
    applicable national nuclear codes.
