abstract:
- language: en
  script: Latn
  content: The purpose of this standard is to determine the ability of the robot to
    travel around humans without affecting the human’s behaviour. The test is characterized
    with travelling time of robots and changing of walking speed of humans, which
    reflects intelligence functions and physical functions of the robot in the manner
    of a black box testing. The test is carried out for different configurated fields,
    where real humans are walking. The robot and its use shall conform with ISO 13482
    or safety of human shall be assured by other measures.
