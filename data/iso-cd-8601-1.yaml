abstract:
- language: en
  script: Latn
  content: This document specifies representations of dates of the Gregorian calendar
    and times based on the 24-hour clock, as well as composite elements of them, as
    character strings for use in information interchange. It is also applicable for
    representing times and time shifts based on Coordinated Universal Time (UTC).
    This document excludes the representation of date elements from non-Gregorian
    calendars or times not from the 24-hour clock. This document does not address
    character encoding of representations specified in this document.
