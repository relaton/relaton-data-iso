- language: en
  script: Latn
  content: This document defines terms on sustainability and circular economy used in the field of office equipment, addressing topics including, but not limited to, product, performance, operation and stakeholder. Therefore, this document includes not only terms directly associated with products and technologies, such as materials, parts, components, equipment, and cartridges, as well as terms specific to office equipment, but also the clear definitions of general terms used with specific meanings in this field.
