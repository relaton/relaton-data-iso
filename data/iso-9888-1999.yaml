abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for the evaluation in aqueous
    medium of the ultimate biodegradability and, as additional information, the primary
    biodegradability and the total elimination from water, of organic compounds at
    a given concentration by aerobic microorganisms. The conditions described in this
    International Standard normally correspond to optimal conditions for allowing
    the maximum value of biodegradation to occur with the chosen inoculum in the test
    time. These conditions may even be more favourable than in full-scale wastewater
    treatment plants, especially if their hydraulic retention time, sludge age or
    the adaptation of the activated sludge is not optimal. The method applies to organic
    compounds which are a) water-soluble at the concentration used under the test
    conditions and not expected to be transformed to insoluble metabolites if biodegradation
    and not elimination only shall be determined; b) nonvolatile, or which have a
    negligible vapour pressure under the test conditions; c) not lost by foaming from
    the test solution; d) not inhibitory to the test microorganisms at the concentration
    chosen for the test. Inhibitory effects can be determined using a suitable test
    method (e.g. see ISO 8192). If the test compound is toxic, the test concentration
    must be lowered, or a pre-exposed inoculum can be used. This International Standard
    is also applicable to the measurement of biodegradation and elimination of dissolved
    organic compounds in wastewater (also called "test compound" in the method). NOTE
    If more information is required to predict the behaviour of test compounds or
    wastewater in a treatment plant, a simulation test (e.g. the activated sludge
    simulation test ISO 11733) should be performed. For appropriate use of this method
    and for alternative biodegradation methods, see ISO 15462.
