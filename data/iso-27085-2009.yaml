abstract:
- language: en
  script: Latn
  content: 'ISO 27085:2009 specifies an inductively coupled plasma atomic emission
    spectroscopic (ICP-AES) method for the determination of: a) the minerals calcium,
    sodium, phosphorus, magnesium and potassium and the elements iron, zinc, copper,
    manganese, cobalt and molybdenum in animal feeding stuffs; b) the elements arsenic,
    lead and cadmium in minerals on their own, in premixtures or mixtures for use
    in animal feeding stuffs. The method detection limit for each element is dependent
    on the sample matrix as well as on the instrument. The method is not applicable
    for determination of low concentrations of elements. The limit of quantification
    is 3 mg/kg or lower.'
