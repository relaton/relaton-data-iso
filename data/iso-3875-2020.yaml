abstract:
- language: en
  script: Latn
  content: The document specifies, with reference to ISO 230-1 and ISO 230-2, geometric
    tests, machining tests and tests for accuracy and repeatability of positioning
    axes on general purpose and normal accuracy manually and numerically controlled
    (NC) external cylindrical centreless grinding machines. It also specifies the
    applicable tolerances corresponding to the above-mentioned tests. This document
    deals only with the verification of accuracy of the machine. It does not apply
    to the testing of the machine operation (vibrations, abnormal noise, stick-slip
    motion of components, etc.) nor to machine characteristics (such as speeds, feeds,
    etc.), which are generally checked before testing of machine accuracy. This document
    provides the terminology used for the principal components of the machine and
    the designation of the axes with reference to ISO 841. NOTE In addition to the
    terms used in the official ISO languages (English and French), this document gives
    the equivalent terms in the German, Italian, Japanese, and Persian languages.
    These are published under the responsibility of the national member bodies for
    Germany (DIN), Italy (UNI), Japan (JIS), and Iran (ISIRI). However, only the terms
    given in the official languages can be considered as ISO terms.
