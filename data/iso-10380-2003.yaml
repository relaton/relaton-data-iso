abstract:
- language: en
  script: Latn
  content: ISO 10380:2002 specifies the requirements for the design, manufacture and
    testing of corrugated metal hoses and hose assemblies for general purposes. It
    also specifies sizes from DN 4 to DN 300, pressures from PN 0,5 to PN 250, pressure
    derating factors for elevated temperatures, two methods of construction and three
    types of flexibility of hose assembly.
