abstract:
- language: en
  script: Latn
  content: ISO 21848:2005 describes the electrical loads that can affect electric
    and electronic systems and components of road vehicles for a supply voltage of
    42 V which may be used in a multiple voltage electrical system. In addition it
    specifies the tests and resulting requirements, test equipment accuracy being
    agreed upon between the vehicle manufacturer and the supplier. This International
    Standard also provides design guidance for the interaction of 42 V with other
    system voltages.
