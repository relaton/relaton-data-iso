abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and measures for —    
    surface planing machines, also called jointers, —     thickness planing machines,
    also called planers or single surface planers, and —     combined surface/thickness
    planing machines with fixed cutter block position, with an integrated feed in
    thickness planing mode, with or without demountable power feed device in planing
    mode, with manual loading and/or unloading of the workpiece, and capable of continuous
    production use, altogether referred to as “machines”. The machines are designed
    to cut solid wood and material with similar physical characteristics to wood (see
    ISO 19085-1:2021, 3.2). This document deals with all significant hazards, hazardous
    situations and events as listed in Annex A relevant to the machines when operated,
    adjusted and maintained as intended and under the conditions foreseen by the manufacturer.
    Reasonably foreseeable misuse has been considered too. Transport, assembly, dismantling,
    disabling and scrapping phases have also been taken into account. This document
    is also applicable to surface planing machines and combined surface/thickness
    planing machines fitted with an optional mortising device, whose hazards have
    been dealt with. This document does not apply to: a)       machines with more
    than one cutter block; b)       machines with a mortising unit driven by a separate
    motor; c)        machines where the cutter block is adjustable for depth of cut
    setting in thickness planing mode; d)       machines where the conversion from
    planing to thickness planing mode or vice versa is achieved by mounting or demounting
    parts/units; e)       machines where surface planing and thickness planing can
    be performed at the same time; f)         machines intended for use in potentially
    explosive atmosphere; g)       machines manufactured prior to the publication
    of this document.'
