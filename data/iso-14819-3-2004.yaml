abstract:
- language: en
  script: Latn
  content: ISO 14819-3:2004 primarily addresses the needs of RDS-TMC ALERT-C messages,
    which are already being implemented. However, the modular approach used here is
    intended to facilitate future extension of the location referencing rules to other
    traffic and travel messaging systems. The location referencing rules defined in
    ISO 14819-3:2004 address the specific requirements of Traffic Message Channel
    (TMC) systems, which use abbreviated coding formats to provide TTI messages over
    mobile bearers (e.g. GSM, DAB) or via exchange protocols like DATEX. In particular,
    the rules address the Radio Data System-Traffic Message Channel (RDS-TMC), a means
    of providing digitally-coded traffic and travel information to travellers using
    a silent data channel (RDS) on FM radio stations, based on the ALERT-C protocol.
