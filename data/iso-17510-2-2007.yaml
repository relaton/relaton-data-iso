abstract:
- language: en
  script: Latn
  content: ISO 17510-2:2007 applies to masks, their fixing and to the accessories
    used to connect a sleep apnoea breathing therapy equipment to the patient. It
    specifies requirements for masks and accessories, including any connecting element,
    that are required to connect the patient connection port of sleep apnoea breathing
    therapy equipment to a patient, and are used for the application of sleep apnoea
    breathing therapy, e.g. nasal masks, exhaust ports and headgear. ISO 17510-2:2007
    does not cover oral appliances.
