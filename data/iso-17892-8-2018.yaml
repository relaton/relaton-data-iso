abstract:
- language: en
  script: Latn
  content: ISO 17892-8:2018 specifies a method for unconsolidated undrained triaxial
    compression tests. ISO 17892-8:2018 is applicable to the laboratory determination
    of undrained triaxial shear strength under compression loading within the scope
    of geotechnical investigations. The cylindrical specimen, which can comprise undisturbed,
    re-compacted, remoulded or reconstituted soil, is subjected to an isotropic stress
    under undrained conditions and thereafter is sheared under undrained conditions.
    The test allows the determination of shear strength and stress-strain relationships
    in terms of total stresses. Non-standard procedures such as tests with the measurement
    of pore pressure or tests with filter drains are not covered in this document.
    NOTE This document fulfils the requirements of unconsolidated undrained triaxial
    compression tests for geotechnical investigation and testing in accordance with
    EN 1997‑1 and EN 1997‑2.
