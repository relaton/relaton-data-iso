abstract:
- language: en
  script: Latn
  content: 'This document specifies: a) the determination of mass gain; b) the surface
    inspection of products of zirconium and its alloys when corrosion is tested in
    water at 360 °C or in steam at or above 400 °C; c) the performance of tests in
    steam at 10,3 MPa. This document is applicable to wrought products, castings,
    powder metallurgy products and weld metals. This method has been widely used in
    the development of new alloys, heat-treating practices and for the evaluation
    of welding techniques. It is applicable for use in its entirety to the extent
    specified for a product acceptance test, rather than merely a means of assessing
    performance in service.'
