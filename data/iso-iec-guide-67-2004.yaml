abstract:
- language: en
  script: Latn
  content: ISO/IEC Guide 67:2004 gives guidance on product certification systems by
    identifying their various elements based on current practices. It is intended
    for use by product certification bodies and other interested parties wishing to
    understand, develop, establish or compare third-party product certification systems.
    ISO/IEC Guide 67:2004 is not intended to describe all existing forms of product
    certification. It does not address first- and second-party product conformity
    assessment.
