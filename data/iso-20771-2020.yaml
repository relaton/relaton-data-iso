abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the competences and qualifications
    of legal translators, revisers and reviewers, best translation practices and the
    translation process directly affecting the quality and delivery of legal translation
    services. In particular, it specifies the core processes, resources, confidentiality,
    professional development requirements, training and other aspects of the legal
    translation service provided by individual translators. Fulfilment of all the
    requirements set out in this document enables the individual legal translator
    to demonstrate conformity of their legal translation services to this document
    and their capability to maintain a level of quality in legal translation services
    that will meet the client's and other applicable specifications. The use of output
    from machine translation, even with post-editing, is outside the scope of this
    document. Consulting of a machine translation resource by a legal translator,
    does not constitute use of raw machine translation plus post-editing. This document
    does not apply to interpreting services.
