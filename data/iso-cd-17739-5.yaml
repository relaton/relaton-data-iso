abstract:
- language: en
  script: Latn
  content: The 17739 standard series define the infrastructure supported location-based
    services for improving the road safety for vulnerable road users (VRUs) and vehicles.
    These services are provided through status and/or intent sharing on nomadic devices.
    The 17739 standard series define the infrastructure supported location-based services
    for improving the road safety for vulnerable road users (VRUs) and vehicles. These
    services are provided through status and/or intent sharing on nomadic devices.
    This document as a part of theses series specifies functional requirements and
    test procedures of roadside infrastructure supported location-based safety services
    for advising the right of way to vehicles or VRUs with nomadic devices at an unsignalized
    roundabout through intent-customized information. A roundabout is generally installed
    in the road intersection where traffic volume is low so as to maximize safety
    and minimize traffic delay, and is operated based on the rule that entering traffic
    must yield to the circulating traffic. A typical four-legged roundabout, however,
    has 8 potential vehicular conflict points and 8 vehicle to pedestrian conflict
    points, and entering maneuver is not protected, which leads to a possible crash
    in the roundabout. Therefore, it is required for improving safety and efficiency
    of the roundabout to provide location-based services for road users using sensor-equipped
    roadside units (RSU) and nomadic devices which is capable of sharing status and/or
    intent, tracking moving objects in the area of interest, and providing intent-customized
    advice for each road user. Road users such as vehicles and VRUs with nomadic devices
    share their status and/or intent for safety at a roundabout without signals through
    networked communication, localized communication or hybrid communication. A sensor-equipped
    RSU collects updated information of moving objects such as vehicles, pedestrians
    and two-wheeled vehicles using either sensors or communication using nomadic devices.
    Based on the location and intent information of the objects, the RSU predicts
    their expected trajectories and provides an advisory right of way (intent-customized
    advice) at possible conflicts. The main contents of this document consist of data
    exchange procedures, functional requirements and test procedures on an advisory
    right of way at a roundabout. **Please see attachment for diagram**
