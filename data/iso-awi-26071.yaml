abstract:
- language: en
  script: Latn
  content: 'This document contains principles for the planning, manufacturing, and
    construction of on-site domestic wastewater systems (ODWS), using appropriate
    technologies in their entirety at any level of development. This document supplements
    and is intended to be used in conjunction with ISO 24521:2025 and ISO 24525:2021.
    This document provides assistance to relevant authorities, training organizations,
    certification bodies and other responsible entities for the development of regulations
    and manuals to plan, design, manufacture, construct, and install ODWS. This includes
    information and training materials addressed to planners, manufacturers, constructors,
    operators and users of ODWS. This document is applicable to both publicly and
    privately operated on-site domestic wastewater (black water and grey water) systems
    for one or more dwellings or other premises where wastewater is generated. The
    scope of this document includes the following: — principles for planning, manufacturing
    and construction of ODWS; — training and information aspects; — environment, sustainability,
    health and safety issues. The following are outside the scope of this document:
    — limits of effluent quality for wastewater discharged into the environment; —
    analytical methods; — stormwater runoff; — content of contracts or subcontracts.'
