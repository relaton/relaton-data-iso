abstract:
- language: en
  script: Latn
  content: 'This document identifies the architecture of a toll system environment
    in which a toll charger (TC) can act to support traffic management with the use
    of a tariff scheme. The scope of this document defines: — the architecture related
    to the scope; — a standard framework and data flow model; — an exchange of information
    between a TC and a road and traffic manager (RTM), e.g.: — level of service (LOS);
    — tariff scheme; — data which is needed to support traffic management (vehicle
    probe and traffic flow data). This document is a toolbox standard of application
    protocol data units (APDUs), which can be used for the assigned purpose. The detailed
    definitions of mandatory and optional elements in real implementation are outside
    the scope of this document. This document does not define communication stacks
    or timings. Data types and associated coding related to the data elements described
    in Clause 6 are defined in Annex A, using the abstract syntax notation one (ASN.1)
    according to ISO/IEC 8824-1. This document allows the implementer to define suitable
    protocol procedures such as basic interaction, protocol mechanism, and choice
    of transfer protocol.'
