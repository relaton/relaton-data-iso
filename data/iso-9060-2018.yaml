abstract:
- language: en
  script: Latn
  content: This document establishes a classification and specification of instruments
    for the measurement of hemispherical solar and direct solar radiation integrated
    over the spectral range from approximately 0,3 μm to about 3 μm to 4 μm. Instruments
    for the measurement of hemispherical solar radiation and direct solar radiation
    are classified according to the results obtained from indoor or outdoor performance
    tests. This document does not specify the test procedures.
