abstract:
- language: en
  script: Latn
  content: This document specifies guidance and examples for establishing, implementing
    and maintaining an earned value management system based on ISO 21508:2018. This
    document also provides practises for earned value management, as set forth in
    ISO 21508:2018. This document can be used by any organization. This document is
    aligned with and complements the information contained in ISO 21508:2018 which
    is the higher tier international standard and companion document for this document.
    Further guidance on project, programme and governance and other related guidance
    are set out in relevant standards.
