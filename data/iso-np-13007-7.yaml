abstract:
- language: en
  script: Latn
  content: This document applies to all bonded crack isolation membranes/matting that are used beneath ceramic tiling for internal and external tile installations on walls and floors. This ISO standard gives the terminology concerning the products and specifies the test methods and the values of performance requirements for bonded crack isolation products associated with tile adhesives. Cracking is limited to horizontal planar movement of the substrate. It should be noted that while crack isolation membranes are intended to minimize the potential for crack propagation from the substrate through the finished tile or stone installation, they may not always be 100% effective in preventing all defects in the finished cover. Furthermore, this document specifies the evaluation of conformity and the classification and designation of all bonded crack isolation products beneath ceramic tiling. NOTE 1 Bonded crack isolation products may also be used beneath other types of tiles (natural and agglomerated stones etc.), where they do not adversely affect these materials.
