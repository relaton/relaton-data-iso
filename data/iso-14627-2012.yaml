abstract:
- language: en
  script: Latn
  content: ISO 14627:2012 describes a test method that covers the determination of
    fracture resistance of silicon nitride bearing balls at room temperature by the
    indentation fracture (IF) method, as specified in ISO 26602. ISO 14627:2012 is
    intended for use with monolithic silicon nitride ceramics for bearing balls. It
    does not include other ceramic materials. ISO 14627:2012 is for material comparison
    and quality assurance.
