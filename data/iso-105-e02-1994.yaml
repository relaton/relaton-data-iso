abstract:
- language: en
  script: Latn
  content: A specimen of the textile in contact with one or two specified adjacent
    fabrics is immersed in sodium chloride solution, drained and placed between two
    plates under a specified pressure in a test device. The specimen and the adjacent
    fabric(s) are dried. The change in colour of the specimen and the staining of
    the adjacent fabric(s) are assessed with the grey scales.
