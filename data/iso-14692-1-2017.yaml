abstract:
- language: en
  script: Latn
  content: ISO 14692-1:2017 defines the applications, pressure rating methodology,
    the classification of the products according to application, type of joint and
    resin matrix and the limitations to both the materials of construction and the
    dimensions. It also lists the terms, definitions and symbols used and provides
    guidance in the use and interpretation of ISO 14692-2, ISO 14692-3 and ISO 14692-4.
    ISO 14692 (all parts) is applicable to GRP piping systems that 1) utilize joints
    that are capable of restraining axial thrust from internal pressure, temperature
    change and fluid hydrodynamic forces and 2) have a trapezoidal shape for its design
    envelope. It is primarily intended for offshore applications on both fixed and
    floating topsides facilities, but it can also be used for the specification, manufacture,
    testing and installation of GRP piping systems in other similar applications found
    onshore, e.g. produced-water, firewater systems and general industrial use. For
    floating installations, reference is made to the design, construction and certification
    standards for the hull or vessel, since these can allow alternative codes and
    standards for GRP piping associated with marine and/or ballast systems. However,
    it is recommended that ISO 14692 (all parts) be used for such applications to
    the maximum degree attainable. ISO 14692 (all parts) can also be used as the general
    basis for specification of pipe used for pump caissons, stilling tubes, I-tubes,
    seawater lift risers and other similar items.
