abstract:
- language: en
  script: Latn
  content: ISO 24234:2015 specifies the requirements and test methods for dental amalgam
    alloys that are suitable for the preparation of dental amalgam, together with
    the requirements and test methods for that dental amalgam and the requirements
    for packaging and marking (including those for dental mercury). It is applicable
    to dental amalgam alloys supplied in the form of a free-flowing powder in bulk,
    or a powder compressed to form a tablet, or a powder in a capsule (i.e. pre-capsulated).
