abstract:
- language: en
  script: Latn
  content: This document specifies the "Fast Service Announcement Protocol" (FSAP).
    FSAP is in support of locally advertised ITS services uniquely identified by an
    ITS application identifier (ITS-AID). This document specifies message formats
    and related basic protocol procedures by reference to ISO/TS 16460:2016, and further
    related protocol requirements for operation of FSAP in the context of an ITS station
    specified in ISO 21217:2014.
