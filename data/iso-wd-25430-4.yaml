abstract:
- language: en
  script: Latn
  content: This document specifies minimum quality attributes required for human liver
    organoids at the point of use, including structural, cellular, molecular, and
    functional characteristics relevant to liver-specific applications. This document
    is applicable to liver organoids derived from pluripotent stem cells (PSCs), intended
    for a wide range of liver-related research and non-clinical applications. This
    document does not address requirements for clinical-grade organoids or therapeutic
    applications.
