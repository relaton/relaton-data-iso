abstract:
- language: en
  script: Latn
  content: 'ISO 12213 specifies methods for the calculation of compression factors
    of natural gases, natural gases containing a synthetic admixture and similar mixtures
    at conditions under which the mixture can exist only as a gas. It is divided into
    three parts: this part, ISO 12213-2:2006, specifies a method for the calculation
    of compression factors when the detailed composition of the gas by mole fractions
    is known, together with the relevant pressures and temperatures. The method is
    applicable to pipeline quality gases within the ranges of pressure p and temperature
    T at which transmission and distribution operations normally take place, with
    an uncertainty of about +/- 0,1 %. It can be applied, with greater uncertainty,
    to wider ranges of gas composition, pressure and temperature.'
