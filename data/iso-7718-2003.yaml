abstract:
- language: en
  script: Latn
  content: ISO 7718:2003 specifies minimum requirements for dimensions and unobstructed
    space around main-deck passenger doors of future types of civil-passenger transport
    aircraft when they are intended to be compatible with the thousands of passenger
    boarding bridges and passenger transfer vehicles existing, or being planned, in
    airports worldwide. ISO 7718:2003 is not applicable to existing models of civil
    transport aircraft, or derivative models with the same fuselage, for which the
    aircraft mating section of passenger boarding bridges or passenger transfer vehicles
    should be made compatible according to ISO 16004.
