abstract:
- language: en
  script: Latn
  content: ISO 6383-1:2015 specifies a method of determining the tear resistance of
    plastic film or sheet less than 1 mm thick, in the form of standard trouser-shaped
    test specimens, tested under defined conditions of pre-treatment, temperature,
    humidity, and speed of testing. The method is applicable to film and sheeting
    of both flexible and rigid materials, provided that the material is not so rigid
    that brittle fracture occurs during the test, or so deformable, in an irreversible
    way, that the energy used in the deformation of the specimen legs is significant
    (i.e. is not negligible) with respect to the energy used in tearing. The method
    may not be suitable for determining the tear properties of cellular sheet and
    film.
