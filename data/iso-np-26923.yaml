abstract:
- language: en
  script: Latn
  content: 'This document provides guidance on the application of ISO 22379:2022, Security and resilience — Guidelines for hosting and organizing citywide or regional events, to the specific context of traditional festivals. This document identifies the clauses of ISO 22379 that are most applicable to traditional festivals and provides interpretation, adaptation, and supplementary recommendations tailored to the traditional festival scenario. The guidance covers the complete lifecycle of a traditional festival, including planning, operations, and post-event evaluation. This document focuses on (but is not limited to) the following aspects: — safety and security management (ISO 22379, Clause 4.5); — crowd and transport management; — coordination with public authorities (in accordance with applicable national and local laws and regulations); — protection of intangible cultural heritage and traditional practices; — community participation and volunteer management; — communication and information support. This document does not cover: — detailed technical specifications for venues, equipment, or facilities; — certification, accreditation, or conformity assessment requirements; — matters exclusively governed by national and local laws and regulations (such laws and regulations take precedence). Subsequent parts of the ISO 354 series may provide detailed guidance on specific topics such as accessible participation, digital tools, environmental sustainability, and crisis management for traditional festivals.'
