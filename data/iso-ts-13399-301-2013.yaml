abstract:
- language: en
  script: Latn
  content: 'ISO/TS 13399-301:2013 specifies a concept for the design of tool items,
    limited to any kind of taps and dies, together with the usage of the related properties
    and domains of values. ISO/TS 13399-301:2013 specifies a common way of designing
    simplified models that contain: definitions and identifications of the design
    features of thread-cutting taps, thread-forming taps and thread-cutting dies with
    solid cutting edges, with a link to the properties used; definitions and identifications
    of the internal structure of the 3D model that represents the features and properties
    of thread-cutting taps, thread-forming taps and thread-cutting dies with solid
    cutting edges.'
