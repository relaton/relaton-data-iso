abstract:
- language: en
  script: Latn
  content: This document specifies principles, common framework and general requirements
    for the life cycle management of utility tunnels. It is applicable to new, expanded,
    renewal and renovated urban underground utility tunnel projects. Through systematic
    life cycle management, it aims to achieve goals such as safety, basic function,
    efficiency optimization, cost control, carbon emission reduction, extended service
    life, digitalization, smartness, etc., which will ultimately enhance the resilience
    and sustainability of the community. The life cycle of a utility tunnel includes
    concept and planning, design, construction, operation and maintenance, rehabilitation
    and redevelopment, and decommissioning stages. This standard is applicable not
    only to the entire life cycle but also to one or multiple stages of the life cycle.
