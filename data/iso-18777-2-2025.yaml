abstract:
- language: en
  script: Latn
  content: This document specifies particular requirements for portable units which
    are part of a transportable liquid oxygen system and used to provide a controlled
    flow of oxygen for inhalation by the patient in the home-care environment. Portable
    units are intended to be used without professional supervision, carried by patients
    while moving around and during their off-site activities and refilled from a base
    unit via a transfilling device through the portable unit’s filling port connector.
    NOTE            Requirements that are common to both portable units and base units
    are specified in ISO 18777-1.
