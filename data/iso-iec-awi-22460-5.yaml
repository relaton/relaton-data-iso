abstract:
- language: en
  script: Latn
  content: This document outlines the test methods to validate the fundamental capabilities
    of the drone/unmanned aerial system (UAS) security module as a security container.
    The primary purpose of the tests is to verify whether the security module supports
    the specified data formats, provides necessary storage space, and possesses cryptographic
    functionalities in terms of integrity validation, authentication, data encryption,
    transport layer security (TLS), and digital signature.
