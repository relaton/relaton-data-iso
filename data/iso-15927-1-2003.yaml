abstract:
- language: en
  script: Latn
  content: 'ISO 15927-1:2003 specifies procedures for calculating and presenting the
    monthly means of those parameters of climatic data needed to assess some aspects
    of the thermal and moisture performance of buildings. Numerical values for any
    locations should be obtained from the meteorological service in the relevant country.
    ISO 15927-1:2003 covers the following single climate variables: air temperature;
    atmospheric humidity; wind speed; precipitation; solar radiation; longwave radiation.
    Meteorological instrumentation and methods of observation are not covered; these
    are specified by the World Meteorological Organisation (WMO).'
