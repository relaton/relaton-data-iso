abstract:
- language: en
  script: Latn
  content: This document specifies a method for testing the immunity of passenger
    cars and commercial vehicles to electrical disturbances from off-vehicle radiation
    sources, regardless of the vehicle propulsion system (e.g. spark ignition engine,
    diesel engine, electric motor). The electromagnetic disturbances considered are
    limited to continuous narrowband electromagnetic fields. While this document refers
    specifically to passenger cars and commercial vehicles, generalized as “vehicle(s)”,
    it can readily be applied to other types of vehicles. ISO 11451-1 specifies general
    test conditions, definitions, practical use, and basic principles of the test
    procedure. Function performance status classification guidelines for immunity
    to electromagnetic radiation from an off-vehicle radiation source are given in
    Annex A.
