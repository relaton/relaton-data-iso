abstract:
- language: en
  script: Latn
  content: Provides functional, dimensional, structural and environmental requirements
    for devices used to transport automobiles in wide-body aircraft. These devices
    are intended to be used in conjunction with pallets compatible with existing aircraft
    restraint systems or with pallets matching the width of automobiles to ensure
    maximum use of aircraft volume. The devices shall be easily convertible so that
    they can carry general cargo on return haul flights.
