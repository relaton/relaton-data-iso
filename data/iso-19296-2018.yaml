abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements for self-propelled mobile
    machines used in underground mining, as defined in 3.1. This document deals with
    hazards, hazardous situations and hazardous events (see Annex B) relevant to these
    machines when they are used as intended or under conditions of misuse reasonably
    foreseeable by the manufacturer. For utility/service/support machines, this document
    only includes provisions to address the risks associated with the mobility (movement
    of the whole machine from one location to another). Risks for the additional functions
    (e.g. scaling, concrete spraying, bolting, charging, drilling, attachments) are
    not covered in this document. This document specifies the appropriate technical
    measures for eliminating or sufficiently reducing risks arising from hazards,
    hazardous situations or hazardous events during commissioning, operation and maintenance.
    This document does not address: — the additional risks for machines operating
    in potentially explosive atmospheres; — air quality and engine emissions. This
    document is not applicable to: — machines constrained to operate by rails; — continuous
    miners, roadheaders, drill rigs, conveyors, long wall production equipment, tunnel
    boring machines (TBM), and mobile crushers.'
