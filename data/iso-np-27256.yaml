abstract:
- language: en
  script: Latn
  content: This document specifies the functional, performance and quality requirements
    for interior glazing of rail vehicles including type testing, routine testing,
    and inspection methods for rolling stock of main line railway system and urban
    guided transport. Determination of the size, shape, orientation and position of
    interior glazing is outside the scope of this document. This document does not
    specify requirements for the interfaces between the interior glazing and the vehicle.
    Accordingly, this document does not address issues relating to installation and
    structural integrity. This document does not apply to interior glazing with a
    surface less than 0,02 m 2 and also emergency device casings (e.g. cover sheets
    for emergency hammers, passenger alarm systems, etc). This document does not apply
    to materials other than glazing materials.
