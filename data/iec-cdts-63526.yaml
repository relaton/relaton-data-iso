abstract:
- language: en
  script: Latn
  content: 'The Technical Specification provides gap analysis on standards related
    to City Information Modelling and Urban Digital Twins. This Technical Specification:
    • defines concepts of City Information Modelling and Urban Digital Twins; • collects
    the case studies how cities are using City Information Modelling and Digital Twin
    technologies; • identifies the standards being used; • scopes out the requirements
    for new standards and for possible revision of existing standards; and provides
    recommendations for Standard Development Organizations (SDOs).'
