abstract:
- language: en
  script: Latn
  content: 'ISO 9296:2017 is applicable to information technology and telecommunications
    equipment. It specifies: a) for a batch of equipment, the method for determining
    the following values: - the declared mean A-weighted sound power level, LWA,m;
    - the declared mean A-weighted emission sound pressure level, LpA,m; - the statistical
    adder for verification, Kv; - the statistical upper limit A-weighted sound power
    level, LWA,c; b) how acoustical and product information is to be published electronically
    or in hard-copy format in technical documents or other product literature supplied
    to users by the manufacturer or declarer; c) the method for verifying the noise
    emission values that are declared by the manufacturer or declarer.'
