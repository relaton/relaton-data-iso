abstract:
- language: en
  script: Latn
  content: ISO 4628-10:2003 describes a method for assessing the amount of filiform
    corrosion developed from a scribed mark by measuring the length of the longest
    filament L and the most frequent length M of the filaments. Pictorial examples
    are provided in an annex to illustrate different ratings for the length of the
    longest filament L and the most frequent filament length M.
