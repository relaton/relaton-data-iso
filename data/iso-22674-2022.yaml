abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for metallic materials
    that are suitable for the fabrication of dental restorations and appliances. Included
    are metallic materials recommended for use either with or without a ceramic veneer,
    or recommended for both uses. Furthermore, this document specifies requirements
    for packaging and marking of the products and for the instructions for use of
    these materials, including products delivered for sale to a third party. This
    document does not apply to alloys for dental amalgam (see ISO 24234), dental brazing
    materials (see ISO 9333), or metallic materials for orthodontic appliances (e.g.
    wires, brackets, bands and screws). This document is not applicable to magnetic
    attachment, which are specified in ISO 13017.
