abstract:
- language: en
  script: Latn
  content: 'ISO 230-3:2007 defines three tests for the determination of thermal effects
    on machine tools: an environmental temperature variation error (ETVE) test, a
    test for thermal distortion caused by rotating spindles, and a test for thermal
    distortion caused by moving linear axes. The test for thermal distortion caused
    by moving linear axes is applicable to numerically controlled (NC) machines only
    and is designed to quantify the effects of thermal expansion and contraction as
    well as the rotational deformation of structure. For practical reasons, it is
    applicable to machines with linear axes up to 2 000 mm in length. If used for
    machines with axes longer than 2 000 mm, it will be necessary to choose a representative
    length of 2 000 mm in the normal range of each axis for the tests. The tests correspond
    to drift tests according to ISO/TR 16015 and define the evaluation and the detailed
    procedure for machine tools.'
