abstract:
- language: en
  script: Latn
  content: This document specifies crashworthiness requirements applicable to new
    designs of： — locomotives — driving vehicles operating in passenger and freight
    trains — passenger rail vehicles operating in passenger trains (such as trams,
    metros, mainline train) This document identifies common methods of providing structural
    passive safety that can be adapted to suit individual vehicle requirements. This
    document specifies the characteristics of reference obstacle models for use with
    the design collision scenarios. This document also specifies the requirements
    and methods for demonstrating that the structural passive safety objectives have
    been achieved by comparison with existing proven designs, numerical simulation,
    testing, or a combination of all these methods. Derailments and side impacts are
    outside the scope of this document.
