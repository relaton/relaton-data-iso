abstract:
- language: en
  script: Latn
  content: Contains guides concerning the procedure to be followed and the precautions
    to be observed for the taking, preparation and storage of samples with the view
    of assess their quality. Deals with the means of delivery, containers for taking
    samples, technical means for mixing and heating systems. Details the sampling
    of thermal-process and wet-process acids from large containers and mobile tanks
    and the safety measures. Has also been approved by the IUPAC.
