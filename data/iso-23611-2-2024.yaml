abstract:
- language: en
  script: Latn
  content: This document specifies a method for sampling, extracting and preserving
    collembolans and mites from field soils as a prerequisite for using these animals
    as bio-indicators (e.g. to assess the quality of a soil as a habitat for organisms).
    The sampling and extraction methods of this document are applicable to almost
    all types of soils. Exceptions can be soils from extreme climatic conditions (hard,
    frozen or flooded soils) and other matrices than soil, e.g. tree trunks, plants
    or lichens.
