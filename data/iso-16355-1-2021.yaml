abstract:
- language: en
  script: Latn
  content: This part of ISO 16355 describes the quality function deployment (QFD)
    process, its purpose, users, and tools. It does not provide requirements or guidelines
    for organizations to develop and systematically manage their policies, processes,
    and procedures in order to achieve specific objectives. Users of this part of
    ISO 16355 will include all organization functions necessary to assure customer
    satisfaction, including business planning, marketing, sales, research and development
    (R&D), engineering, information technology (IT), manufacturing, procurement, quality,
    production, service, packaging and logistics, support, testing, regulatory, and
    other phases in hardware, software, service, and system organizations.
