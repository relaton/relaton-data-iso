abstract:
- language: en
  script: Latn
  content: This document specifies the reference method for the testing of spectacle
    frames, ready-to-wear near-vision spectacles, sunglasses and spectacle frames
    used for eye and face protection for nickel release. The reference method supports
    the demonstration of conformity with the limit value for nickel release of 0,5
    µg·cm-2·week-1 set forth by European Regulation. The reference method involves
    the procedural steps shown in Figure 1 and described in Clause 4. This document
    applies to those parts of metal spectacle frames and those metal parts of combination
    spectacle frames that are intended to come into direct and prolonged contact with
    the skin of the wearer. This document also applies to those relevant metal parts
    of ready-to-wear near-vision spectacles, sunglasses and spectacle frames used
    for eye and face protection. NOTE The reference method for articles apart from
    spectacle frames, ready-to-wear near-vision spectacles, sunglasses and spectacle
    frames used for eye and face protection is specified in EN 1811.
