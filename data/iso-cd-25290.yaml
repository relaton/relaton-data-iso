abstract:
- language: en
  script: Latn
  content: This document specifies definitions, quality and authenticity requirements, test methods, transportation, labelling, storage and packaging of lyophilized royal jelly. This document is applicable to the lyophilized royal jelly made by vacuum freeze drying using fresh royal jelly as raw material. Its final presentation form can be obtained through processes such as crushing and sieving to obtain the desired specific uniform size of powder or particles.
