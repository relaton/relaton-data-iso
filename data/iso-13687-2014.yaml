abstract:
- language: en
  script: Latn
  content: ISO 13687:2014 establishes minimum requirements for commercial and non-commercial
    harbours for leisure boats and yachts to deliver services to the boating community,
    excluding the standardization of sports activities. The scope does not cover specifics
    of boat yards, dry stacks, dry-docking areas, dry storages, fuel stations, and
    nearby beaches. Compliance with ISO 13687:2014 does not guarantee total safety
    or total freedom of risk in case of abnormal weather conditions above windforce
    9 on the Beaufort scale and extreme sea conditions or rogue waves.
