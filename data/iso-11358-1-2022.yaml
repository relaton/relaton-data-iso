abstract:
- language: en
  script: Latn
  content: This document specifies general conditions for the analysis of polymers
    using thermogravimetric techniques. It is applicable to liquids or solids. Solid
    materials can be in the form of pellets, granules or powders. Fabricated shapes
    reduced to appropriate specimen size can also be analysed by this method. This
    document establishes methods for the investigation of physical effects and chemical
    reactions that are associated with changes of mass. This document can be used
    to determine the temperature(s) and rate(s) of decomposition of polymers, and
    to measure at the same time the amounts of volatile matter, additives and/or fillers
    they contain. This document is applicable to measurements in dynamic mode (mass
    change versus temperature or time under programmed temperature conditions) or
    isothermal mode (mass change versus time at constant temperature). This document
    is applicable to measurements at different testing atmospheres, such as separation
    of decomposition in an inert atmosphere from oxidative degradation.
