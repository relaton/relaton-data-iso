abstract:
- language: en
  script: Latn
  content: Specifies methods for the determination of up to 4 % (m/m) of cobalt, chromium,
    copper, iron, manganese and aluminium, up to 2 % (m/m) of silicon and from 0,05
    % (m/m) to 1 % (m/m) of vanadium in nickel alloys. Typical compositions of some
    nickel alloys are given in annex B. This part of ISO 7530 specifies the general
    requirements for analysis by flame atomic absorption, preparation and dissolution
    of the test sample, method of calculation and the procedures used for the evaluation
    of the repeatability and reproducibility of the individual methods.
