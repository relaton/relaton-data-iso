abstract:
- language: en
  script: Latn
  content: Electromelted magnesia is made from magnesite and other raw materials by
    melting in electric arc furnace to reach melting state and cooling.Sintered magnesia
    is made from magnesite, magnesite or magnesium hydroxide extracted from seawater
    by high temperature burning.In this process, because there is no specific standard
    for smelting, there are slight differences in the magnesia produced, and the slight
    differences will be magnified when applied to the product, thus affecting the
    product performance and quality.Therefore, no matter in fineness or granularity,
    it is urgent to formulate more detailed magnesia production standardsThus, the
    preparation of magnesite ore is rationalized and standardized, and the "world
    magnesia capital" is built. Only in this way can we ensure the healthy and coordinated
    development of the middle and lower reaches of Magnesite Industry Chain and create
    greater economic and social benefits.
