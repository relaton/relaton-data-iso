abstract:
- language: en
  script: Latn
  content: ISO 15708-4:2017 specifies guidelines for the qualification of the performance
    of a CT system with respect to various inspection tasks. It is applicable to industrial
    imaging (i.e. non-medical applications) and gives a consistent set of CT performance
    parameter definitions, including how those performance parameters relate to CT
    system specifications. ISO 15708-4:2017 deals with computed axial tomography and
    excludes other types of tomography such as translational tomography and tomosynthesis.
