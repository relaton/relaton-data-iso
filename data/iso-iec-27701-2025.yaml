abstract:
- language: en
  script: Latn
  content: This document specifies requirements for establishing, implementing, maintaining
    and continually improving a privacy information management system (PIMS). Guidance
    is also provided to assist in the implementation of the requirements in this document.
    This document is intended for personally identifiable information (PII) controllers
    and PII processors holding responsibility and accountability for PII processing.
    This document is applicable to all types and sizes of organizations, including
    public and private companies, government entities and not-for-profit organizations.
