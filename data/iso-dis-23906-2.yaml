abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of benzo[a]pyrene
    (B[a]P) in the total particulate matter of cigarette mainstream smoke with an
    intense smoking regime using gas chromatography/mass spectrometry (GC/MS) with
    cyclohexane as extraction solvent. This method is specified using ISO 20778 smoking
    parameters. An alternative method for the determination of B[a]P is specified
    in ISO 23906‑1, with a different clean-up using methanol solvent.
