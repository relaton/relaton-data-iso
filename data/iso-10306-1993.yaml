abstract:
- language: en
  script: Latn
  content: Specifies a method for the evaluation of the maturity of loose randomized
    cotton fibres by measuring the resistance to air flow of a plug of cotton fibres
    under two prescribed conditions. The method is applicable to cotton taken at random
    from bales. Laps and slivers or other sources of lint cotton may be tested, however
    results may differ if fibres are taken from bales.
