abstract:
- language: en
  script: Latn
  content: 'This document specifies a method for the determination of tear resistance
    based on the action of an active force applied to a notched test piece. The test
    can be carried out on: test pieces that have been conditioned in a standard atmosphere;
    or test pieces that have undergone pre-treatment, e.g. water immersion. The results
    obtained by this method cannot be compared with those obtained by methods involving
    constant rate of tear.'
