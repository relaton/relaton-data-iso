abstract:
- language: en
  script: Latn
  content: The standard is primarily intended for developers, engineers, technicians,
    and designers, but also generally for anyone responsible for the design and evaluation
    of surface properties. The purpose of this standard is to familiarize users with
    the biomimetic design of sustainable surfaces as an effective method for extending
    the lifespan of surface functional properties, while promoting the broader adoption
    of these methods in support of sustainable development.
