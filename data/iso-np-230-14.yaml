abstract:
- language: en
  script: Latn
  content: 'This document specifies simplified methods for the assessment of static
    stiffness and backlash of machine tools, intended for shop-floor applications.
    The methods described in this document are designed to: - provide indicative values
    of the mechanical behavior of the machine; - detect significant deviation such
    as abnormal compliance, looseness or damage; - support applications such as machine
    acceptance, maintenance diagnostics and process optimization; - assist in determining
    whether further investigation using reference methods (e.g., ISO 230-1) is required.
    The methods are based on low-force measurements using simple and portable equipment.
    This document applies to machine tools and their axis. The principles described
    may also be applicable to other elements of the machining system (e.g., tooling
    or workholding), as illustrated in informative annexes. This document is complementary
    to ISO 230-1 and does not replace reference methods for the determination of static
    compliance and hysteresis. This document does not cover: - metrology-grade determination
    of static compliance and hysteresis (see ISO 230-1); - dynamic stiffness, vibration
    analysis and chatter (see ISO 230-8); - geometric or thermal accuracy.'
