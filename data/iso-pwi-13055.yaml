abstract:
- language: en
  script: Latn
  content: The new work item provides guidance for organizations on how to continuously
    promote energy efficiency and conservation of steel plants, including specific
    procedures, perspectives to be considered, and methods for appropriately evaluating
    equipment that promotes energy efficiency and conservation (i.e. energy-saving
    equipment). It is expected that organizations will be able to voluntarily and
    continuously take proper actions to promote energy efficiency and conservation
    of the steel plants by regularly repeating the planning, implementation, and evaluation
    of energy efficiency and conservation measures and review for further improvements
    in the future, in line with this document. It is expected that these actions will
    lead to achieving CO2 emissions reduction of steel plants and eventually to sustainable
    steel production. The boundary of the energy efficiency and conservation measures
    that is covered by this document is an entire steel plant. This document is applicable
    to any steel plant, regardless of its manufacturing process, equipment configuration,
    size, geographic location, products, or the amount and type of energy used. This
    document is applicable to activities affecting energy consumption and energy intensity
    that are managed and controlled by the organization. However, the method for calculating
    energy consumption and energy intensity of the entire steel plant conforms to
    the ISO 14404 series (ISO 14404-1, ISO 14404-2, ISO 14404-3, ISO 14404-4). This
    means that when evaluating the energy consumption and energy intensity of the
    entire steel plant, not only the direct energy consumption from the steel plant
    but also the indirect energy consumption from intermediate products (purchased
    electricity, steam, etc.) and sold items (sold electricity, steam, by-product
    gas etc.) as defined in the ISO 14404 series are included. As the purpose of this
    document is to promote energy efficiency and conservation measures in steel plants,
    this document does not cover improvements in productivity or product quality.
    This document is not intended to be a prerequisite for obtaining third-party certification,
    nor does it specify any performance criteria.
