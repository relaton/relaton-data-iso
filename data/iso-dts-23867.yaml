abstract:
- language: en
  script: Latn
  content: This document introduces A-type ultrasonic pulse contact method that applies
    ultrasonic longitudinal wave technique to hardmetals. This document is applicable
    to the ultrasonic inspection for a hardmetal rod that has a circular end face
    with a diameter not less than 6,0 mm and a rod length of 40,0 mm to 380,0 mm,
    or a hardmetal product that has a non-circular testing area not smaller than the
    coverage area of probe (recommend not less than 12,0 mm in diameter) and a height
    of 10,0 mm to 380,0 mm. Within the detection range specified in this standard,
    the sound transmission energy is expressed by the probe driving voltage, and the
    range is 100,0 V to 200,0 V.
