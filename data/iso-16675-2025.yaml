abstract:
- language: en
  script: Latn
  content: This document specifies an aging method for phosphate ester turbine control
    fluids. These products fall into category HFDR as specified in ISO 6743-4 and
    into categories TSD, TGD and TCD as specified in ISO 6743-5. The amount of acid
    developed during the test is used to assess the level of anti-aging performance.
    This document is applicable to the anti-aging performance determination for phosphate
    ester turbine control fluids that are both new and in-service.
