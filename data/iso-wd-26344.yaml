abstract:
- language: en
  script: Latn
  content: This document specifies the appropriate technical measures to eliminate
    or reduce risks arising from significant hazards during setting, operation, troubleshooting,
    and maintenance of an IS machine as a glass forming machine. This document deals
    with all significant hazards, hazardous situations, or hazardous events, except
    for commissioning, installation, dismantling, and disposal, when it is used as
    intended and under conditions of misuse which are reasonably foreseeable by the
    manufacturer. It applies to the design and construction of IS machines, including
    the gob distributor and machine conveyor. This document does not deal with gob
    feeders (see EN 13042-1:2007+A1:2009) and handling machines for feeding (see EN
    13042-2:2004+A1:2009) which are self-standing machines used for the delivery of
    portions of melted glass to hollow glass forming machines like glass presses (see
    EN 13042 5:2003+A1:2009). This document does not deal with additional equipment
    for IS machines. This document is not applicable to the machinery or machinery
    components manufactured before the date of its publication.
