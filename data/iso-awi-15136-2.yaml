abstract:
- language: en
  script: Latn
  content: ISO 15136-2:2006 provides requirements for the design, design verification
    and validation, manufacturing and data control, performance ratings and repair
    of progressing cavity pump surface drive systems for use in the petroleum and
    natural gas industry. ISO 15136-2:2006 is applicable to those products meeting
    the definition of surface drive systems. Additionally, informative annexes provide
    information on brake system selection, installation, and operation; and sucker
    rod selection and use. Equipment not covered by ISO 15136-2:2006, unless integral
    by design, includes bottom drive systems, sucker rods, polished rod clamps, stuffing
    boxes, electrical controls, instrumentation, external power transmission devices,
    auxiliary equipment, such as belts, sheaves and equipment guards. These items
    might or might not be covered by other International Standards.
