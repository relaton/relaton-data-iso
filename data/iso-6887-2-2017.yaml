abstract:
- language: en
  script: Latn
  content: 'ISO 6887-2:2017 specifies rules for the preparation of meat and meat product
    samples and their suspension for microbiological examination when the samples
    require different preparation from the methods described in ISO 6887‑1. ISO 6887‑1
    defines the general rules for the preparation of the initial suspension and dilutions
    for microbiological examination. ISO 6887-2:2017 excludes preparation of samples
    for both enumeration and detection test methods where preparation details are
    specified in the relevant International Standards. ISO 6887-2:2017 is applicable
    to the following fresh, raw and processed meats, poultry and game and their products:
    - refrigerated or frozen; - cured or fermented; - minced or comminuted; - meat
    preparations; - mechanically separated meat; - cooked meats; - dried and smoked
    meats at various degrees of dehydration; - concentrated meat extracts; - excision
    and swab samples from carcasses. ISO 6887-2:2017 excludes the sampling of carcasses
    (see ISO 17604) and preparation of samples from the primary production stage (see
    ISO 6887‑6).'
