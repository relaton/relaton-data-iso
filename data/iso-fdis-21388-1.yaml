abstract:
- language: en
  script: Latn
  content: This document applies to hearing aid fitting management (HAFM) services
    offered by hearing aid professionals (HAP) when providing benefit for their clients.
    The provision of hearing aids relies on the knowledge and practices of a hearing
    aid professional, to ensure the proper fitting and adequate service in the interest
    of the client with hearing loss. This document specifies general processes of
    HAFM from the client profile to the follow-up through administering, organising
    and controlling hearing aid fitting through all stages. It also specifies important
    preconditions such as education, facilities and systems that are required to ensure
    proper services. The focus of this document is the services offered to the majority
    of adult clients with hearing impairment. It is recognized that certain populations
    with hearing loss such as children, persons with other disabilities or persons
    with implantable devices can require services outside the scope of this document.
    This document generally applies to air conduction hearing aids and for the most
    part also to bone conduction devices. Hearing loss can be a consequence of serious
    medical conditions. Hearing aid professionals are not in a position to diagnose
    or treat such conditions. When assisting clients seeking hearing rehabilitation
    without prior medical examination, hearing aid professionals are expected to be
    observant of symptoms of such conditions and refer to proper medical care. Further
    to the main body of the document, which specifies the HAFM requirements and processes,
    several informative annexes are provided. Appropriate education of hearing aid
    professionals is vital for exercising HAFM. Annex A defines the competencies required
    for the HAFM processes. Annex B offers a recommended curriculum for the education
    of hearing aid professionals. Annex C is an example of an appropriate fitting
    room. Annex D gives guidance on the referral of clients for medical or other specialist
    examination and treatment. Annex E is a recommendation for important information
    to be exchanged with the client during the process of HAFM. Annex F is a comprehensive
    terminology list offering definitions of the most current terms related to HAFM.
    It is the intention that these annexes be helpful to those who wish to deliver
    HAFM of the highest quality.
