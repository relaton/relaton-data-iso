abstract:
- language: en
  script: Latn
  content: This document gives guidance to organizations on developing policies and practices that are supportive of workers’ menstrual and menopausal health and experiences in the workplace. This document is applicable to any organization regardless of size or sector and can be adapted to individual business needs. This document does not apply to medical guidance or clinical options outside of the workplace. However, it does include reference to qualified sources where such information is available. This document does not apply to andropause.
