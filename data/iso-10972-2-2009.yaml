abstract:
- language: en
  script: Latn
  content: ISO 10972-2:2009 establishes requirements specific to the mechanisms of
    mobile cranes, in addition to the general requirements for cranes given in ISO
    10972-1. These additional requirements concern the arrangement, features and characteristics
    of the crane mechanisms, and the minimum requirements for certain mechanism components.
    Rules for the proof of competence calculation regarding different limit states
    (yield strength, fatigue, wear) are excluded from ISO 10972-2:2009.
