abstract:
- language: en
  script: Latn
  content: ISO 11986:2017 provides general procedures for the selection of methods,
    preparation of samples, and the conduct of testing for the uptake and release
    of preservatives from contact lenses. NOTE 1 Due to the manifest difficulties
    of reproducibility when coating contact lenses with mineral and organic deposits
    encountered during lens wear, these methods are only applicable to new and unused
    contact lenses. NOTE 2 Preservative depletion by a contact lens in the limited
    volume of a lens case could compromise disinfection performance. This document
    does not measure disinfection performance.
