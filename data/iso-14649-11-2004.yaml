abstract:
- language: en
  script: Latn
  content: 'ISO 14649-11:2004 specifies the technology-specific data elements needed
    as process data for milling. Together with the general process data described
    in ISO 14649-10, it describes the interface between a computerized numerical controller
    and the programming system (i.e. CAM system or shop floor programming system)
    for milling. It can be used for milling operations on all types of machines, be
    it milling machines, machining centres, or lathes with motorized tools capable
    of milling. The scope of ISO 14649-11:2004 does not include any other technologies,
    like turning, grinding, or EDM. These technologies will be described in further
    parts of ISO 14649. The subject of the milling_schema, which is described in ISO
    14649-11:2004, is the definition of technology-specific data types representing
    the machining process for milling and drilling. This includes both milling of
    freeform surfaces and milling of prismatic workpieces (also known as 2 1/2-D milling).
    Not included in this schema are the following: geometric items;representations;manufacturing
    features;executable objects;base classes which are common for all technologies.
    They are referenced from ISO 10303''s generic resources and ISO 14649-10. The
    description of process data is done using the EXPRESS language as defined in ISO
    10303-11. The encoding of the data is done using ISO 10303-21.'
