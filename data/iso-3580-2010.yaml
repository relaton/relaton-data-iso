abstract:
- language: en
  script: Latn
  content: ISO 3580:2010 specifies requirements for classification of covered electrodes,
    based on the all-weld metal in the heat-treated condition, for manual metal arc
    welding of ferritic and martensitic creep-resisting and low alloy elevated temperature
    steels. ISO 3580:2010 is a combined specification for classification utilizing
    a system based upon the chemical composition of the all-weld metal, with requirements
    for the yield strength and impact energy of the all-weld metal, or utilizing a
    system based upon the tensile strength and the chemical composition of the all-weld
    metal. Paragraphs and tables which carry the suffix letter “A” are applicable
    only to electrodes classified to the system based upon chemical composition, with
    requirements for the yield strength and impact energy of the all-weld metal under
    ISO 3580:2010. Paragraphs and tables which carry the suffix letter “B” are applicable
    only to electrodes classified to the system based upon the tensile strength and
    the chemical composition of all-weld metal under ISO 3580:2010. Paragraphs and
    tables which do not have either the suffix letter “A” or the suffix letter “B”
    are applicable to all covered electrodes classified under ISO 3580:2010. For comparison
    purposes, some tables include requirements for electrodes classified according
    to both systems, placing individual electrodes from the two systems, which are
    similar in composition and properties, on adjacent lines in the particular table.
    In a particular line of the table that is mandatory in one system, the symbol
    for the similar electrode from the other system is indicated in parentheses. By
    appropriate restriction of the formulation of a particular electrode, it is often,
    but not always, possible to produce an electrode that can be classified in both
    systems, in which case the electrode, and/or its packaging, may be marked with
    the classification in either or both systems.
