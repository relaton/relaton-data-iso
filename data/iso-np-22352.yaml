abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for organizations working with communities to develop, establish and support community emergency hubs that contribute to societal resilience to disruption. This document includes: — a framework of the aim, objectives and principles for community emergency hubs; — guidance on engaging communities in the development of community emergency hubs; — guidance on organizing, equipping and aligning community emergency hubs with community plans; — guidance on preparing volunteers to work to work safely, collaboratively and with appropriate leadership; — guidance on identifying community needs, coordinating offers of support, and providing other community support services; — guidance on activating, operating and closing community emergency hubs; — guidance on supporting community recovery following disruption. This document is applicable to any organization working with community members to strengthen societal resilience to disruption. This document does not specify requirements for emergency response organizations, emergency services or incident management activities.'
