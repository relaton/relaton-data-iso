abstract:
- language: en
  script: Latn
  content: This document provides an overview of the available facility management
    (FM) technologies. This document is applicable to facility managers, their teams
    and their stakeholders. It aligns specifically with ISO/TR 41013, the ISO 19650
    series and the ISO 41000 family of standards as part of an integrated framework
    to achieve FM best practice. This document outlines various long-term benefits
    and enhanced value that can be derived progressively by the operators, occupants
    and owners of facilities, worldwide, via the effective application of technology.
    This document includes, defines and categorises systems, equipment, methodologies
    and software applications that are available. This framework defines how facility
    managers can understand and integrate digital practice and technologies in the
    built environment.
