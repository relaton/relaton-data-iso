abstract:
- language: en
  script: Latn
  content: 'ISO 27892:2010 specifies a method for the measurement of rapid shutdown
    torque (destructive torque) of turbomolecular pumps in which gas momentum is produced
    by axial flow type blades and/or helical channels. The main forces leading to
    failure of turbomolecular pumps are torques around the rotational axis. Other
    insignificant forces and moments that can occur lie outside the scope of ISO 27892:2010.
    There are two kinds of failure: rapid shutdown by whole burst and softer crash
    of rotor. ISO 27892:2010 applies to both. The same measurement method can be used
    for turbomolecular pumps and molecular drag pumps.'
