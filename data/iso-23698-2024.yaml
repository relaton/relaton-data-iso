abstract:
- language: en
  script: Latn
  content: This document provides a procedure to characterize the sun protection factor
    (SPF), UVA protection factor (UVA-PF) and critical wavelength (CW) protection
    of sunscreen products without requiring biological responses. The test method
    is applicable for emulsions and single-phase products. The method has not been
    evaluated for use with powder forms sunscreen products. This document gives specifications
    to enable determination of the absolute spectral absorbance characteristics of
    a sunscreen product on skin to estimate sunburn and UVA protection. It is applicable
    to products that contain any component able to absorb, reflect or scatter ultraviolet
    (UV) rays and which are intended to be placed in contact with human skin.
