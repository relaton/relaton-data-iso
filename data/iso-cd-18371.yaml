- language: en
  script: Latn
  content: This document specifies the terms and definitions, classification and judgement
    methods of garment silhouettes. This document is applicable to the determination
    of the corresponding silhouettes of T-shirts, shirts, casual wear, coats, down
    jackets, suits, trousers, casual pants, jeans, skirts, dresses and other clothing
    categories. This document does not apply to the determination of the silhouette
