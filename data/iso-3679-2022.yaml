abstract:
- language: en
  script: Latn
  content: This document describes three procedures (A, B and C) covering determinations
    of flash no-flash and flash point. Rapid equilibrium procedures A and B are applicable
    to flash no-flash and flash point tests of paints, including water-borne paints,
    varnishes, binders for paints and varnishes, adhesives, solvents, petroleum products
    including aviation turbine, diesel and kerosene fuels, fatty acid methyl esters
    and related products over the temperature range –30 °C to 300 °C. The rapid equilibrium
    procedures are used to determine whether a product will or will not flash at a
    specified temperature (flash no-flash procedure A) or the flash point of a sample
    (procedure B). When used in conjunction with the flash detector (A.1.6), this
    document is also suitable to determine the flash point of fatty acid methyl esters
    (FAME). The validity of the precision is given in Table 2. Non-equilibrium procedure
    C is applicable to petroleum products including aviation turbine, diesel and kerosine
    fuels, and related petroleum products, over the temperature range –20 °C to 300 °C.
    The non-equilibrium procedure is automated to determine the flash point. Precision
    has been determined over the range 40 °C to 135 °C. For specifications and regulations,
    procedures A or B are routinely used (see 10.1.1).
