abstract:
- language: en
  script: Latn
  content: ISO 15819:2014 describes a method for the detection and quantification
    of N-nitrosodiethanolamine (NDELA) in cosmetics and raw materials used in cosmetics.
    This method is not applicable to the detection and/or quantification of nitrosamines
    other than NDELA nor to the detection and/or quantification of NDELA in products
    other than cosmetics or raw materials used in cosmetics. If a product has a possibility
    of either NDELA contamination from ingredients or NDELA formation by the composition
    of ingredients, the method is intended to be applied for quantitative determination
    of NDELA. Accordingly, the method does not apply to routine testing of cosmetic
    products. Because of the large variety of cosmetic products within this field
    of application, this method might need to be adapted for certain matrices (refer
    to ISO 12787).
