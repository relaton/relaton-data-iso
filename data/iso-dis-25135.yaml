abstract:
- language: en
  script: Latn
  content: This International Standard specifies a standardized Vehicle Motion Control
    (VMC) interface for an Automated Driving System (ADS) to request the desired motion
    of heavy commercial vehicle combinations (HCVCs) with typically a towing unit
    with at least one non-steered drive axle in use and one or more trailers. This
    standard is not including active steered trailer axles. This automation interface
    is for fully automated driving systems that require a Dedicated Vehicle (DV) with
    redundancy and vehicle safety. The vehicle and trailer units swept path is a responsibility
    of the ADS system to guarantee successful combination trajectories through the
    driving situation. The standardized interface ensures that in a reference coordinate
    system the motion can be requested by the ADS, and the ADS receives the status
    and capabilities of the requests from the VMC. The standard applies to heavy vehicles,
    including commercial vehicles, commercial vehicle combinations, buses and articulated
    buses as defined in ISO 3833 (trucks and trailers with a maximum weight above
    3.5 tonnes and buses and articulated buses with a maximum weight above 5 tonnes,
    according to ECE and EC vehicle classification, categories M3, N2, N3, O3 and
    O4).
