abstract:
- language: en
  script: Latn
  content: This document establishes high-level requirements for privacy by design
    to protect privacy throughout the lifecycle of a consumer product, including data
    processed by the consumer. This document does not contain specific requirements
    for the privacy assurances and commitments that organizations can offer consumers
    nor does it specify particular methodologies that an organization can adopt to
    design and-implement privacy controls, nor the technology that can be used to
    operate such controls.
