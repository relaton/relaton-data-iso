abstract:
- language: en
  script: Latn
  content: ISO 20332:2008 sets forth general conditions, requirements, methods and
    parameter values for performing proof-of-competence determinations of the steel
    structures of cranes based upon the limit state method. It is intended to be used
    together with the loads and load combinations of the applicable parts of ISO 8686.
    ISO 20332:2008 is general and covers cranes of all types. Other International
    Standards may give specific proof-of-competence requirements for particular crane
    types. It does not cover proof‑of‑competence calculations for components of accessories
    (e.g. hand rails, stairs, walkways, cabins), whose influence on the main structure
    nevertheless needs to be considered.
