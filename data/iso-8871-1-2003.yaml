abstract:
- language: en
  script: Latn
  content: ISO 8871-1:2003 defines procedures for classifying elastomeric parts for
    primary packs and medical devices used in direct contact with preparations for
    parenteral use, including both aqueous preparations and dry preparations which
    have to be dissolved before use. It specifies a series of comparative test methods
    for chemical evaluation by the determination of extractables in aqueous autoclavates
    and describes the various fields of application for elastomeric parts. Dimensions
    and functional characteristics are specified in the relevant International Standards.
    Required properties as specified in this part of ISO 8871 are regarded as minimum
    requirements. Elastomeric parts for empty syringes for single use are excluded
    from the scope of this part of ISO 8871 as they are not in contact with the injected
    preparation for a significant length of time. Compatibility studies with the intended
    preparation have to be performed before the approval for final use can be given;
    however, this part of ISO 8871 does not specify procedures for carrying out compatibility
    studies.
