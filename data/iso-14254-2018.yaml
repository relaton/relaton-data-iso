abstract:
- language: en
  script: Latn
  content: ISO 14254:2018 specifies a method for the determination of exchangeable
    acidity in barium chloride extracts of soil samples obtained according to ISO
    11260. The procedure described herein mainly concerns the determination of total
    exchangeable acidity by means of a fixed pH end point titration. Two additional
    and optional procedures are given, describing respectively, determinations of
    free H+ acidity and aluminium in the extracts. ISO 14254:2018 is applicable to
    all types of air dry soil samples.
