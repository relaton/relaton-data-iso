- language: en
  script: Latn
  content: ISO 10893-9:2011 specifies requirements for the automated ultrasonic testing
    of strip/plate used in the manufacture of welded tubes for the detection of laminar
    imperfections carried out in the pipe mill before or during pipe production. ISO
    10893-9:2011 can also be applicable to the testing of strips/plates used in the
