abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory test procedure for finding the effect
    of exposure to severe environmental conditions on the fastening system. This test
    procedure applies to a complete fastening assembly including embedded rail with
    mechanical fastenings. It is not applicable to embedded rail systems relying on
    adhesive components to secure the rail.
