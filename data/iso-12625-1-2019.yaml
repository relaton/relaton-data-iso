abstract:
- language: en
  script: Latn
  content: This document establishes general principles for the use of terms in the
    entire working field of tissue paper and tissue products. It permits the use of
    a common terminology in industry and commerce. It is expressly stated that ISO
    15755 applies for the detection of impurities and contraries in tissue paper and
    tissue products. For the determination of moisture content in tissue paper and
    tissue products, ISO 287 applies.
