abstract:
- language: en
  script: Latn
  content: This document provides guidance to stormwater management authorities and
    relevant stakeholders on both structural and non-structural stormwater management
    approaches. The guidance includes consideration of relevant policies, planning,
    design criteria and implementation processes for stormwater management, and performance
    evaluation. This document can be applied to new stormwater systems and to the
    extension or improvement of existing systems for both fully separated and combined
    storm and sanitary sewers. This document is applicable to stormwater sewer systems
    as well as combined sewer systems. This document is not applicable to sanitary
    sewer systems.
