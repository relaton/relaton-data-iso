abstract:
- language: en
  script: Latn
  content: This document specifies a procedure to determine the slip factor of faying
    surfaces in slip-resistant (friction) connections to be used in structural steelwork.
    The method is mainly applicable to uncoated and coated components made of steel
    with various surface treatments. This document applies mainly to carbon steels
    but can be used for other type of steels as appropriate.
