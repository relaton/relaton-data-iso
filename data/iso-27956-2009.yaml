abstract:
- language: en
  script: Latn
  content: ISO 27956:2009 applies to vehicle-relevant equipment for the securing of
    cargo in delivery vans with a gross vehicle mass up to 7,5 t. ISO 27956:2009 specifies
    minimum requirements and test methods for securing cargo in a reliable and roadworthy
    way, in order to protect occupants against injuries caused by shifting cargo.
    ISO 27956:2009 deals with N1 vehicles and N2 vehicles up to 7,5 t in accordance
    with ECE classification. For vehicles primarily designed for the transportation
    of cargo and derived from a passenger vehicle (M1), only the requirements concerning
    the partitioning system of ISO 27956:2009 apply.
