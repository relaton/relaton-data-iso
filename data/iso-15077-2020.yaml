abstract:
- language: en
  script: Latn
  content: This document specifies methods of operation and requirements related to
    manual (for example, hand-, finger-, foot-operated) controls as well as controls
    associated with virtual terminals intended for a seated operator. It applies to
    controls installed on agricultural tractors and self-propelled agricultural machinery.
    It also gives recommendations for the control actuating forces and torques, direction
    of motion and location of these manual controls. This document also specifies
    the minimum information relevant to manual controls to be provided in the operator's
    manual, for use as intended by the manufacturer.
