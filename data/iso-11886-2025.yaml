abstract:
- language: en
  script: Latn
  content: 'This document establishes content for commercial specifications for drilling
    machines and foundation machines. It explains concepts related to their applications,
    working methods, machine types, and main components of the machines. This document
    is applicable to: —     mobile drill rigs for civil and geotechnical engineering;
    —     foundation equipment including piling machines; —     diaphragm walling
    equipment; —     jetting, grouting and injection equipment; —     interchangeable
    auxiliary equipment. This document does not apply to: —     machines specifically
    designed for mining application (e.g. rock drilling, raise boring, jumbo machines);
    —     horizontal directional drilling (HDD) machines (covered by ISO 21467[1]).'
