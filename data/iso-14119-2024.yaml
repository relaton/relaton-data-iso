abstract:
- language: en
  script: Latn
  content: 'This document specifies principles for the design and selection (independent
    of the nature of the energy source) of interlocking devices associated with guards
    and provides guidance on measures to minimize the possibility of defeat of interlocking
    devices in a reasonably foreseeable manner. This document covers principles for
    the design, selection and application of the following: —     parts of the guards
    which actuate interlocking devices; —     trapped key interlocking devices and
    systems for machinery applications. NOTE            ISO 14120 specifies general
    requirements for the design and construction of guards provided primarily to protect
    persons from mechanical hazards. The processing of the signal from the interlocking
    device to stop the machine and prevent unexpected start up is covered in ISO 14118,
    ISO 13849-1 and IEC 62061.'
