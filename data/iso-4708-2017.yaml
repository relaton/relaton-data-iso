abstract:
- language: en
  script: Latn
  content: 'ISO 4708:2017 specifies test methods to determine the characteristics
    of agglomerated composition cork and rubbercork to be used as gaskets in the mechanical
    industry. The following characteristics are considered: - thickness, - apparent
    density, - tensile strength, - compressibility and recovery, - flexibility, -
    resistance to boiling water, - behaviour in fluids.'
