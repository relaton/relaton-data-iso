abstract:
- language: en
  script: Latn
  content: 'This Document defines the field of packaging machines. The packaging machines defined have been classified into the following families of machines: • Filling machines • Closing machines • Labelling, decorating and coding machines • Cleaning, disinfecting, sterilizing, cooling and drying machines • Fill and seal machines • Inspecting machines • Product handling machines • Form, fill and seal machines • Cartoning machines • Wrapping machines • Secondary packaging machines • Palletizing machines, depalletizing machines and ancillary equipment • Pallet wrapping machines • Strapping machines Machines that make rigid containers or packages but are not directly associated with machines that fill them with products, are not considered to be packaging machines and so are not defined in this Document.'
