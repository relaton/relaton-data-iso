abstract:
- language: en
  script: Latn
  content: This International Standard is intended to provide information to users
    to help facilitate selecting printer consumables that meet their requirements.
    It also provides a method for both consumers and regulators to receive relevant
    information regarding compatibility, performance, warranty, end of life, and environmental
    attributes. It will specify required elements to be included on a package, data
    sheet or delivered via a cloud service, either via a URL or a QR code. This International
    Standard applies to printer consumables that could be operated in a home, enterprise
    or office environment. Printer consumables requiring specially instructed operators
    for service or installation are not considered in this International Standard.
    This standard does not seek to dictate the specific customer experience or method
    of information delivery, only what elements should be available when claiming
    compliance to this standard.
