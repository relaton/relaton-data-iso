abstract:
- language: en
  script: Latn
  content: ISO 3691-6:2013 gives safety requirements and the means for their verification
    for self-propelled carriers designed for carrying burdens without lifting, as
    defined in ISO 5053, and/or personnel carriers, having three or more wheels, a
    maximum speed not exceeding 56 km/h and a load capacity not exceeding 5 000 kg.
    It is applicable to trucks equipped with a platform (which can be tilting) for
    the purpose of carrying materials or with a number of seats for the purpose of
    transporting passengers. It is not applicable to vehicles intended primarily for
    earth-moving or over-the-road hauling, driverless trucks, golf cars, or tractors
    with a drawbar pull up to and including 20 000 N equipped with a platform for
    the purpose of carrying materials.
