abstract:
- language: en
  script: Latn
  content: This document specifies general requirements and performance criteria for
    two-component, acrylic polymer-modified cementitious flexible waterproofing coatings.
    These coatings consist of selected polymers and cementitious powders and are designed
    for the waterproofing of masonry structures, tiles, marbles, and other construction
    materials. [It may also be used as a base waterproofing layer beneath tiles, marble,
    and granite.]
