abstract:
- language: en
  script: Latn
  content: This document specifies the properties and acceptable tolerances for bonded
    human-made mineral wool thermal insulating board for the overdeck insulation of
    roofs of buildings. The product is intended for roofs carrying foot traffic by
    maintenance personnel only. This document specifies the properties to be declared
    by the manufacturer at the time of delivery, as well as some test methods for
    the determination of these properties. This document provides limiting values
    for most of the properties. These limiting values are for specification purposes
    only. Design values can be derived from these by considering the environmental
    factors affecting the thermal performance of the product, the influence of the
    product properties on installation, and the effect of workmanship on the thermal
    performance. This document applies to board with or without a membrane for the
    insulation of the upper surface of roofs under roofing systems protected against
    water. The properties of a facing membrane are not described. When the board is
    supplied with a facing membrane, it is not intended to be waterproof. The board
    specified in this document is intended to be fixed to the roof surface.
