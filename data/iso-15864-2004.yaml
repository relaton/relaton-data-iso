abstract:
- language: en
  script: Latn
  content: ISO 15864:2004 provides the baseline standard on the subject of testing
    at the system, subsystem, and unit level for applicable unmanned spacecraft programs.
    It also provides the requirements for documentation associated with testing activities.
    The acceptance criteria, specifications or procedures, and other detail test requirements
    applicable to a particular program are defined in the applicable technical specifications
    and statement of work. When requirements have to be verified by measuring product
    performance and function under various simulated environments, the method is referred
    to as "Test." The requirements of ISO 15864:2004 may be tailored for each specific
    space program application.
