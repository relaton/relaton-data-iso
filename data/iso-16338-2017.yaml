abstract:
- language: en
  script: Latn
  content: ISO 16338:2017 specifies requirements for resistance spot and seam welding
    for aerospace applications. ISO 16338:2017 does not apply if resistance welding
    is simply an intermediate operation and does not affect the quality of the end
    product, for example when tacking basic parts prior to assembly with another process.
    Resistance welding of dissimilar material group combinations is not covered by
    this document. Safety and health issues and concerns are not covered by this document.
