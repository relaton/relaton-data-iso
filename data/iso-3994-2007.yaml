abstract:
- language: en
  script: Latn
  content: ISO 3994:2007 specifies the requirements for three types of helical-thermoplastic-reinforced
    thermoplastics hoses for suction and discharge of water, weak aqueous chemical
    solutions and abrasive solids and slurries, for use in the ambient temperature
    range from -10 °C to +55 °C. The three types of hose are for light-, medium- and
    heavy-duty applications. The types of hoses covered in the standard are not intended
    for use with flammable or combustible materials, nor with aromatic solvents. NOTE
    Hoses of a similar construction for suction and discharge for fire-fighting are
    specified in ISO 14557, Fire-fighting hoses — Rubber and plastics suction hoses
    and hose assemblies.
