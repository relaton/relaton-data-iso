abstract:
- language: en
  script: Latn
  content: ISO/TS 21033:2011 specifies an inductively coupled plasma optical emission
    spectroscopic (ICP-OES) method for the determination of trace element content
    in oils. Depending on the dilution solvent used, most types of vegetable oils
    can be analysed (crude, degummed, refined, bleached, deodorized and hardened oils)
    and nearly all types of lecithins and phosphatides. This procedure is only suitable
    when the elements are present in a solubilized form. Fine particles, such as bleaching
    earth, metal particles and rust, can result in poor recovery of the trace elements
    present as nebulization and atomization problems affect the ICP-OES analysis.
