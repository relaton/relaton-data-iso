abstract:
- language: en
  script: Latn
  content: ISO 21727:2016 specifies a method of measurement of short duration motion-picture
    sound that allows assessment of the subjective loudness and annoyance of the sound
    recording when replayed at the recommended replay level in rooms aligned with
    the characteristics of ISO 2969. The specified method of measurement assesses
    the entire duration of the sound recording, typically commercials and trailers
    that do not exceed 3 min in length, with suitable channel summation, frequency
    weighting and time integration. It does not specify a maximum recommended level
    for such material and is solely aimed at describing a measurement method. NOTE
    Typical recording and replay levels are discussed in Annex A.
