abstract:
- language: en
  script: Latn
  content: 'ISO 16992:2010 describes spare unit substitutive equipment (SUSE) for
    passenger car tyres, which is designed to enable users to continue their journey
    (with or without a stop) in a reasonably safe manner. ISO 16992:2010 is intended
    only to qualify the performance of extended mobility systems. Its specifications
    only apply to extended mobility systems that can permit the extended mobility
    of the vehicle. The specifications in ISO 16992:2010 apply from the moment the
    extended mobility system becomes effective, with the driver continuing to control
    of the vehicle (in terms of speed and direction) in an attempt to reach an appropriate
    place for servicing. The following are within the scope of ISO 16992:2010: the
    description of the various types of SUSE; the description and performance levels
    of complete extended mobility systems. The following are outside the scope of
    ISO 16992:2010: the vehicle to be equipped; the tyre while operating in inflated
    mode; the characteristics of the pressure survey device and of the warning function
    relative to the inflated mode or to the partially deflated mode due to slow pressure
    losses; the transitory phase, if any, before the equipment becomes effective;
    the inspection, assessment, and the servicing of the extended mobility system,
    after it has been activated in flat tyre running mode.'
