- language: en
  script: Latn
  content: ISO 105-X16:2016 specifies a method for determining the resistance of the
    colour of textiles to rubbing off and staining other materials where the singling
    out of areas smaller than possible to test with the apparatus described in ISO
    105‑X12 is required. Two tests may be made, one with a dry rubbing cloth and one
