abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1660:2006 specifies the application module for Datum difference
    based model. ISO/TS 10303-1660:2006 deals with the representation of the information
    needed to describe parameters for a physical unit, a template, a design, or a
    model where the characteristic is based on a datum difference. The support provided
    is for a linear displacement or angular displacement between datum. The data supported
    must be path independent. The following is within the scope of ISO/TS 10303-1660:2006:
    linear datum location differences.'
