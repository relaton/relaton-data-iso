abstract:
- language: en
  script: Latn
  content: ISO 4126-9:2008 covers the application and installations of safety devices
    such as safety valves, safety valves and bursting disc safety devices in combination,
    pilot-operated safety valves and controlled safety pressure-relief systems for
    the protection of pressure equipment. ISO 4126-6 covers the selection, application
    and installation of bursting disc safety devices. ISO 4126-9:2008 describes the
    normative requirements for applications and installations of safety devices to
    protect static pressure equipment. The information contained in ISO 4126-9:2008
    assumes single-phase flow of the fluid discharged from the safety device. ISO
    4126-10 provides guidance specific to two-phase flow conditions. Equipment connected
    together in a system by piping of adequate capacity, which is free from potential
    blockages and does not contain any valve that can isolate any part, can be considered
    to be a safety system for the application of pressure relief. ISO 4126-9:2008
    does not deal with other safety devices, such as safety related monitoring, control
    and regulation devices and other limiting devices allowed by some national regulations.
