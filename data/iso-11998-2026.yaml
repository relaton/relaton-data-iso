abstract:
- language: en
  script: Latn
  content: This document specifies an accelerated method for the determination of wet-scrub resistance. The determination of cleanability is not covered in the scope of this document. NOTE            The ability of coatings to withstand wear caused by repeated cleaning operations is an important consideration both from a practical point of view and when comparing and rating such coatings. Since wet-scrub resistance depends not only on the quality of a coating but also on the substrate, the method of application, the drying conditions and other factors, the results obtained are not directly transferable to actual practice. In this document, the evaluation of the coating is based on a defined substrate, a fixed application method, specified drying conditions and a defined method of wet scrubbing.
