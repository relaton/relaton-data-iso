abstract:
- language: en
  script: Latn
  content: This document specifies a method to determine the plasticity retention
    index (PRI) of raw natural rubber. The PRI is a measure of the resistance of raw
    natural rubber to thermal oxidation. A high resistance to thermal oxidation is
    shown as a high value of the index. PRI is not an absolute value and cannot give
    an absolute classification of plasticity number of different natural rubber after
    oxidation.
