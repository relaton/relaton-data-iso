abstract:
- language: en
  script: Latn
  content: 'This document defines: —    personalization interface: dedicated short-range
    communication (DSRC), —    physical systems: on-board equipment and the personalization
    equipment, —    DSRC-link requirements, —    EFC personalization functions according
    to ISO/TS 21719-1 when defined for the DSRC interface, and —    security data
    elements and mechanisms to be used over the DSRC interface. A protocol information
    conformance statement (PICS) proforma is provided in Annex B, and security computation
    examples are provided in Annex E. It is outside the scope of this document to
    define: —    conformance procedures and test specifications, —    setting-up of
    operating organizations (e.g. toll service provider, personalization agent, trusted
    third party), and —    legal issues. NOTE       Some of these issues are subject
    to separate standards prepared by ISO/TC 204, CEN/TC 278 or ETSI ERM.'
