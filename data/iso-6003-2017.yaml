abstract:
- language: en
  script: Latn
  content: ISO 6003:2017 specifies laboratory measurement methods for mass and polar
    moment of inertia of alpine skis. If laboratory measurement data are determined
    and published by the ski manufacturer or other institutions, standard measurement
    procedures can be used to ensure comparability. ISO 6003:2017 also specifies a
    tolerance range which can be met by the measurement data of all manufactured skis,
    if for the specific model length measurement data are published by the manufacturer
    of the ski. NOTE The appropriate ski length can be given with the published measurement
    data. ISO 6003:2017 is not the purpose of this document to evaluate the measurement
    data with regard to their influence on the quality of the ski.
