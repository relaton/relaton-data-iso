abstract:
- language: en
  script: Latn
  content: ISO 10893-10:2011 specifies requirements for automated full peripheral
    ultrasonic shear wave (generated by conventional or phased array technique) testing
    of seamless and welded [except submerged arc-welded (SAW)] steel tubes, for the
    detection of longitudinal and/or transverse imperfections. In the case of testing
    on longitudinal imperfections, Lamb wave testing can be applied at the discretion
    of the manufacturer. For seamless tubes, by agreement between the purchaser and
    manufacturer, testing principles of ISO 10893-10:2011 can be applied to detect
    imperfections having other orientations. ISO 10893-10:2011 is applicable to the
    inspection of tubes with an outside diameter greater than or equal to 10 mm, normally
    with an outside diameter-to-thickness ratio greater than or equal to 5. It can
    also be applicable to the testing of circular hollow sections.
