abstract:
- language: en
  script: Latn
  content: This document specifies procedures and test methods used to demonstrate
    the cleaning efficacy of washer-disinfectors (WD) and their accessories intended
    to be used for cleaning of reusable medical devices. NOTE 1   The requirements
    can be used for washer-disinfectors intended for use with other articles used
    in the context of medical, dental, laboratory, pharmaceutical and veterinary practice.
    NOTE 2   This document does not apply to the activities to be performed by the
    manufacturers of reusable medical devices.
