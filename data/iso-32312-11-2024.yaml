abstract:
- language: en
  script: Latn
  content: This document specifies the technical requirements to minimise the hazards
    listed in Clause 4 which can arise during the commissioning, operation and maintenance
    of container/pallet dollies and loose load trailers when carried out in accordance
    with the specifications given by the manufacturer or his authorised representative.
    It also takes into account some performance requirements recognised as essential
    by authorities, aircraft and ground support equipment (GSE) manufacturers as well
    as airlines and handling agencies. This document applies to container/pallet dollies
    using ball-mat, inverted cargo castors, or rollers and loose load trailers intended
    to be used for the transportation of baggage and cargo on airports (examples,
    see Annex A). This document does not apply to trailers of similar design as used
    on public roads, e.g., truck type trailers. This document does not establish requirements
    for noise and vibration. Noise and vibration are dealt with respectively in EN 1915-4
    and EN 1915-3. This document is not applicable to container/pallet dollies and
    loose load trailers which are manufactured before the date of publication by ISO
    of this document. NOTE            Certain measurements have been given in imperial
    units (in parentheses), following the metric measurements, since the containers/pallets
    to be handled are based mainly on the imperial system.
