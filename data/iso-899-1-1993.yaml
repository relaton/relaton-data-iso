abstract:
- language: en
  script: Latn
  content: Specifies a method for determining the tensile creep of plastics in the
    form of standard test specimens under specified conditions such as those of pretreatment,
    temperature and humidity. The method is suitable for use with rigid and semi-rigid
    non-reinforced, filled and fibre-reinforced plastics materials in the form of
    dumb-bell-shaped test specimens moulded directly or machined from sheets or moulded
    articles. It is intended to provide data for engineering-design and research and
    development purposes.
