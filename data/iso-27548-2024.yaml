abstract:
- language: en
  script: Latn
  content: This document specifies test methods to determine particle emissions (including
    ultrafine particles) and specified volatile organic compounds (including aldehydes)
    from desktop MEX-TRB/P processes often used in non-industrial environments such
    as school, homes and office spaces in an emission test chamber under specified
    test conditions. However, these tests do not necessarily accurately predict real-world
    results. This document specifies a conditioning method using an emission test
    chamber with controlled temperature, humidity, air exchange rate, air velocity,
    and procedures for monitoring, storage, analysis, calculation, and reporting of
    emission rates. This document is intended to cover desktop MEX-TRB/P machine which
    is typically sized for placement on a desktop, used in non-industrial places like
    school, home and office space. The primary purpose of this document is to quantify
    particle and chemical emission rates from desktop MEX-TRB/P machine. However,
    not all possible emissions are covered by this method. Many feedstocks can release
    hazardous emissions that are not measured by the chemical detectors prescribed
    in this document. It is the responsibility of the user to understand the material
    being extruded and the potential chemical emissions. An example is Poly Vinyl
    Chloride feedstocks that can potentially emit chlorinated compounds, which cannot
    be measured by the method described in this document.
