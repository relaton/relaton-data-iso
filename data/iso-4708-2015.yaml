abstract:
- language: en
  script: Latn
  content: 'ISO 4708:2015 spécifie les méthodes d''essai pour déterminer les caractéristiques
    de l''aggloméré composé de liège et du liège et caoutchouc destinés à la fabrication
    de joints pour industries mécaniques. Les caractéristiques suivantes sont prises
    en considération: - épaisseur, - masse volumique apparente, - résistance à la
    traction, - compressibilité et récupération, - flexibilité, - résistance à l''eau
    bouillante, - comportement dans les fluides.'
