abstract:
- language: en
  script: Latn
  content: This document specifies a method for designating test specimen axes in
    relation to product texture by means of an X-Y-Z orthogonal coordinate system.
    This document applies equally to unnotched and notched (or precracked) test specimens.
    This document is intended only for metallic materials with uniform texture that
    can be unambiguously determined. Test specimen orientation is decided before specimen
    machining, identified in accordance with the designation system specified in this
    document, and recorded.
