abstract:
- language: en
  script: Latn
  content: 'The rapid adoption of automated driving technology in public transportation
    systems underscores the critical importance of ensuring safety, particularly due
    to the presence of passengers on board. In anticipation of emergency situations,
    adequate preparation from both traffic and road perspectives is imperative. Establishing
    a comprehensive traffic infrastructure monitoring system is necessary to promptly
    respond to accidents or incidents as they occur, necessitating real-time monitoring
    of roads and traffic infrastructure. Furthermore, there is a need to develop procedures
    for emergency preparedness. This involves formulating response protocols for automated
    vehicles and public transport in emergency scenarios, ensuring their effective
    implementation. This work item confines its scope to vehicles pertinent to public
    transportation. The overarching development scope includes: Firstly, identifying
    the framework for the operation scheme of the emergency operation system and road-traffic
    infrastructure monitoring system. Secondly, classifying emergency procedures and
    services tailored for automated public transport and vehicles used for public
    purposes. Lastly, developing use cases for emergency services. Part 1 of the standard
    aims to establish a general framework, while Part 2 focuses on developing service
    requirements. The primary focus of Part 2 includes: Identifying emergency conditions
    and presenting emergency service scenarios. Defining service requirements specific
    to automated driving public transport, including performance requirements concerning
    infrastructure data and main service components for operation systems. Outlining
    procedures for handling emergency services and specifying performance requirements
    for information and data.'
