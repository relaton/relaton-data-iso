abstract:
- language: en
  script: Latn
  content: This document specifies principles and requirements at the organization
    level for the quantification and reporting of greenhouse gas (GHG) emissions and
    removals. It includes requirements for the design, development, management, reporting
    and verification of an organization's GHG inventory. The ISO 14064 series is GHG
    programme neutral. If a GHG programme is applicable, requirements of that GHG
    programme are additional to the requirements of the ISO 14064 series.
