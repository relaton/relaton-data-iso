- language: en
  script: Latn
  content: ISO 505:2017 specifies a method of test for the measurement of the propagation
    resistance of an initial tear in textile conveyor belts, either in full thickness
    or of the carcass only. This test is intended for application to textile belts
    in installations where there is a risk of longitudinal tearing.
