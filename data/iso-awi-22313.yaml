abstract:
- language: en
  script: Latn
  content: 'This document gives guidance and recommendations for applying the requirements
    of the business continuity management system (BCMS) given in ISO 22301. The guidance
    and recommendations are based on good international practice. This document is
    applicable to organizations that: a) implement, maintain and improve a BCMS; b)
    seek to ensure conformity with stated business continuity policy; c) need to be
    able to continue to deliver products and services at an acceptable predefined
    capacity during a disruption; d) seek to enhance their resilience through the
    effective application of the BCMS. The guidance and recommendations are applicable
    to all sizes and types of organizations, including large, medium and small organizations
    operating in industrial, commercial, public and not-for-profit sectors. The approach
    adopted depends on the organization''s operating environment and complexity.'
