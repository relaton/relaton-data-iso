abstract:
- language: en
  script: Latn
  content: ISO 15613:2004 specifies how a preliminary welding procedure specification
    is qualified based on pre-production welding tests. It is applicable to arc welding,
    gas welding, beam welding, resistance welding, stud welding and friction welding
    of metallic materials. The use of ISO 15613:2004 can be restricted by an application
    standard or specification.
