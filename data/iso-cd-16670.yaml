abstract:
- language: en
  script: Latn
  content: ISO 16670:2003 is intended to provide a cyclic test method as a basis for
    the derivation of parameters which are required in seismic design of timber structures.
    The method includes procedures to develop the envelope curves (backbone or skeleton
    curves, an example is given in Clause A.5.) for joints subjected to a cyclic displacement
    schedule which produces representative demands imposed on the joints by earthquakes.
    It does not include criteria for parameters which are, at times, stipulated in
    national standards or building codes. ISO 16670:2003 is intended for joints subjected
    to lateral load and is not applicable to joints subjected to withdrawal forces.
    ISO 16670:2003 is applicable to joints made with mechanical fasteners used in
    timber structures loaded under seismic action.
