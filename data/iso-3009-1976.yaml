abstract:
- language: en
  script: Latn
  content: Specifies methods of testing and assessing non load bearing, vertical glazed
    elements of construction which are intended either to provide, wholly or in part,
    separation between different areas in a building, or to form part of the external
    walls. It is applicable to glazed separating elements such as windows, walls of
    glass blocks and other light-transmitting assemblies.
