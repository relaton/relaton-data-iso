abstract:
- language: en
  script: Latn
  content: This document specifies electrical safety requirements for voltage class
    B electric circuits of electric propulsion systems and conductively connected
    auxiliary electric systems of electrically propelled road vehicles. It specifies
    electrical safety requirements for protection of persons against electric shock
    and thermal incidents. It does not provide comprehensive safety information for
    manufacturing, maintenance and repair personnel. NOTE 1   Electrical safety requirements
    for post-crash are described in ISO 6469-4. NOTE 2   Electrical safety requirements
    for conductive connections of electrically propelled road vehicles to an external
    electric power supply are described in ISO 17409. NOTE 3   Specific electrical
    safety requirements for magnetic field wireless power transfer between an external
    electric power supply and an electrically propelled vehicle are described in ISO 19363.
    NOTE 4   Electrical safety requirements for motorcycles and mopeds are described
    in the ISO 13063 series.
