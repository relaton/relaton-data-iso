abstract:
- language: en
  script: Latn
  content: This International Standard specifies the dimensions of inverse dovetail
    cutters and dovetail cutters with plain cylindrical shanks, flatted cylindrical
    shanks and threaded shanks. Inverse dovetail cutters and dovetail cutters have
    the same design characteristics. This International Standard applies to 45° and
    60° dovetail cutters and inverse dovetail cutters with diameters of d2 between
    16 mm and 31,5 mm.
