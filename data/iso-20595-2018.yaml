abstract:
- language: en
  script: Latn
  content: ISO 20595:2018 specifies a method for the determination of selected volatile
    organic compounds in water (see Table 1). This comprises among others volatile
    halogenated hydrocarbons as well as gasoline components (BTXE, TAME, MTBE and
    ETBE). The method is applicable to the determination of volatile organic compounds
    (see Table 1) in drinking water, groundwater, surface water and treated waste
    water in mass concentrations >0,1 µg/l. The lower application range depends on
    the individual compound, the amount of the blank value and the matrix.
