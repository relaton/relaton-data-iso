abstract:
- language: en
  script: Latn
  content: This document specifies the design, testing and labelling of trocar sleeves
    and trocar pins that are universally interchangeable and reusable. It also specifies
    the design, testing and labelling of endotherapy devices which are inserted through
    these trocar sleeves and are also universally interchangeable and reuseable. This
