abstract:
- language: en
  script: Latn
  content: This document specifies a test method for determining the resistance to
    water leakage and penetration of water-resistant clothing in an artificial rainfall
    using a manikin capable of marching motion. It determines the waterproof characteristic
    in practical use in a rainfall environment with the wearer moving. In addition
    to personal protective equipment and outdoor clothing, which require extreme conditions,
    it also applies to testing common waterproof or water-repellent products such
    as jackets, trousers, coats, and one- or two-piece suits. The test method described
    in this document uses manikin with normal adult male size, excluding other sizes
    (female, children).
