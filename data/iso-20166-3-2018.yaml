abstract:
- language: en
  script: Latn
  content: This document gives guidelines on the handling, documentation, storage
    and processing of formalin-fixed and paraffin-embedded (FFPE) tissue specimens
    intended for DNA examination during the pre-examination phase before a molecular
    assay is performed. This document is applicable to molecular in vitro diagnostic
    examinations including laboratory developed tests performed by medical laboratories
    and molecular pathology laboratories. It is also intended to be used by laboratory
    customers, in vitro diagnostics developers and manufacturers, biobanks, institutions
    and commercial organizations performing biomedical research, and regulatory authorities.
    NOTE International, national or regional regulations or requirements can also
    apply to specific topics covered in this document.
