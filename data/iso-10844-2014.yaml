abstract:
- language: en
  script: Latn
  content: ISO 10844:2014 specifies the essential characteristics of a test surface
    intended to be used for measuring vehicle and tyre or road noise emissions. The
    surface design given in ISO 10844:2014 produces consistent levels of tyre or road
    sound emission under a wide range of operating conditions including those appropriate
    to vehicle sound testing, minimizes inter-site variation, provides minor absorption
    of the vehicle sound sources, and is consistent with road-building practice.
