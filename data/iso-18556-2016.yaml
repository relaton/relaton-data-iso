abstract:
- language: en
  script: Latn
  content: ISO 18556:2016 specifies requirements and their test methods for metallic
    and non-metallic intraoral spatulas used to introduce and model filling materials
    into a tooth cavity, including single use disposable items. NOTE This includes
    instruments used for placement and contouring of non-metallic direct restorative
    materials. It also specifies requirements for their marking and labelling.
