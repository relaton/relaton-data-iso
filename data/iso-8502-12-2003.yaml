abstract:
- language: en
  script: Latn
  content: ISO 8502:2003 describes a field method for the determination, by drop titration,
    of soluble ferrous ions on steel surfaces before and/or after surface preparation.
    The method is intended mainly for use in the assessment of contaminants on a surface.
    It is easy for unskilled personnel to carry out and it is sufficiently accurate
    for most practical purposes.
