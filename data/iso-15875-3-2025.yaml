abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of fittings for crosslinked
    polyethylene (PE-X) piping systems intended to be used for hot and cold water
    installations within buildings for the conveyance of water, whether or not intended
    for human consumption (domestic systems) and for heating systems under design
    pressures and temperatures according to the class of application (see ISO 15875-1:—,
    Table 1). This document also specifies the test parameters for the test methods
    referred to herein. This document is applicable to fittings made from PE-X or
    other plastics or non-plastics materials, which are intended to be connected to
    pipes conforming to ISO 15875-2 for hot and cold water installations, whereby
    the joints conform to the requirements of ISO 15875-5. This document is applicable
    to fittings of the following types: —     mechanical fittings; —     electrofusion
    fittings;'
