abstract:
- language: en
  script: Latn
  content: ISO 21542:2011 specifies a range of requirements and recommendations for
    many of the elements of construction, assemblies, components and fittings which
    comprise the built environment. These requirements relate to the constructional
    aspects of access to buildings, to circulation within buildings, to egress from
    buildings in the normal course of events and evacuation in the event of an emergency.
    It also deals with aspects of accessibility management in buildings. ISO 21542:2011
    contains provisions with respect to features in the external environment directly
    concerned with access to a building or group of buildings from the edge of the
    relevant site boundary or between such groups of buildings within a common site.
    It does not deal with those elements of the external environment, such as public
    open spaces, whose function is self-contained and unrelated to the use of one
    specific building, nor does it deal with single family dwellings, other than those
    circulation spaces and fittings that are common to two or more such dwellings.
