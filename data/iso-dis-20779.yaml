abstract:
- language: en
  script: Latn
  content: This document specifies a method for the generation and collection of total
    particulate matter (TPM) present in the smoke from cigarettes using a routine
    analytical smoking machine with an intense smoking regime. It is not applicable
    to the determination of water or nicotine-free dry particulate matter when using
    the extraction procedure specified in ISO 4387:2000, 7.9.1 or the subsequent measurement
    of water specified in ISO 10362-1 or ISO 10362-2. NOTE The type of analytical
    smoking machine used could impact the mass of TPM collected on the smoke trap.
    This might be due to either incomplete collection or evaporation of water and
    other volatile compounds from the smoke trap.
