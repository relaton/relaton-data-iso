abstract:
- language: en
  script: Latn
  content: 'This document defines terms and preferred definitions relevant to proteins
    in biotechnology, including: — amino acids, peptides and proteins; — recombinant,
    engineered and synthetic proteins; — post‑translational and chemical modifications;
    — expression systems and bioprocessing concepts for protein production; — analytical
    characterization and quality attributes; — classes of protein products and their
    uses in biotechnology. It excludes terminology that is specific to nucleic acids,
    cells, tissues and organisms, except where directly related to protein technology.
    Statistical and metrological terms are out of scope, except where essential to
    define protein quality attributes.'
