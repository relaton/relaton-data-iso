abstract:
- language: en
  script: Latn
  content: 'ISO 12952-2:2010 specifies tests for assessing the ignitability of all
    bedding items when subjected to a match-flame equivalent. ISO 12952-2:2010 applies
    to bedding items, which can normally be placed on a mattress, for example: mattress
    covers; underlays; incontinence sheets and pads; sheets; blankets; electric blankets;
    quilts (duvets) and covers; pillows (whatever the filling) and bolsters; pillowcases.
    ISO 12952-2:2010 does not apply to mattresses, bed bases and mattress pads.'
