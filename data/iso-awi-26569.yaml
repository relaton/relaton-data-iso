abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements relating to the materials,
    construction, performance, packaging and product information for soothers. This
    document is applicable to products that resemble or function as a soother. Some
    soothers may be marketed with other functions. This standard is applicable to
    these products. This document does not apply to products designed for specialist
    clinical medical applications, e.g. those relating to Pierre-Robin Syndrome or
    premature babies. The standard is not applicable to feeding teats.
