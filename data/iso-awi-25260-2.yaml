abstract:
- language: en
  script: Latn
  content: ISO 3228:2013 specifies boundary dimensions and tolerances for cast and
    pressed housings for insert bearings for which boundary dimensions are given in
    ISO 9628. It applies to plummer block housings, flanged housings and take-up housings.
    The inclusion of relubrication features is optional, but when provided it is intended
    that they intersect the zone specified in ISO 9628 in such a way that lubricant
    satisfactorily feeds from the housing through this zone. The exact design of the
    relubrication features is not otherwise covered by ISO 3228:2013.
