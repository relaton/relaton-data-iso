abstract:
- language: en
  script: Latn
  content: This document specifies guidelines for the mechanical recycling of plastics waste. It includes the processing of post-consumer and post-industrial plastic waste using mechanical methods to produce recycled plastic materials. This document covers various aspects of the recycling process including —     compounding, —     extrusion and —     decontamination. The steps for preparation of plastic waste prior to entering the recycling process are described in ISO 15270-1, 6.2, and are therefore not included in this standard.
