abstract:
- language: en
  script: Latn
  content: This document provides requirements for the design, design verification
    and validation, quality control, functional evaluations and storage of submersible
    linear motor (SLM) systems. This document is applicable to components of submersible
    linear motors including stators, movers and motor lead extension cables. This
    document also specifies design validation performance rating requirements and
    functional evaluation for SLM. Equipment not covered by this document includes
    pumps and other fittings, power cables and drive systems.
