abstract:
- language: en
  script: Latn
  content: This document provides a set of properties for the description of learning resources from ISO 15836-1 and ISO 15836-2 using the framework provided in ISO/IEC 19788-1. This document specifies properties whose codomain is "literal" (as considered in early Dublin Core) and properties whose codomain is a resource class; the ISO 15836 series implicitly allowing both. This provides full interoperability at the time of expressing existing Dublin Core records with MLR, while allowing a linked data approach for the description of learning resources.
