abstract:
- language: en
  script: Latn
  content: 'ISO 11568-4:2007 specifies techniques for the protection of symmetric
    and asymmetric cryptographic keys in a retail financial services environment using
    asymmetric cryptosystems and the life-cycle management of the associated asymmetric
    keys. The techniques described in this part of ISO 11568 enable compliance with
    the principles described in ISO 11568-1. For the purposes of this document, the
    retail financial services environment is restricted to the interface between:
    a card-accepting device and an acquirer;an acquirer and a card issuer;an ICC and
    a card-accepting device.'
