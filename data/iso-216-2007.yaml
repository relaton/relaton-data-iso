abstract:
- language: en
  script: Latn
  content: ISO 216:2007 specifies the trimmed sizes of writing paper and certain classes
    of printed matter. It applies to trimmed sizes of paper for administrative, commercial
    and technical use, and also to certain classes of printed matter, such as forms,
    catalogues, etc. It does not necessarily apply to newspapers, published books,
    posters or other special items which may be the subject of separate International
    Standards. ISO 216:2007 also specifies the method for the indication of the machine
    direction for trimmed sheets.
