abstract:
- language: en
  script: Latn
  content: ISO 20685:2010 addresses protocols for the use of 3-D surface-scanning
    systems in the acquisition of human body shape data and measurements defined in
    ISO 7250-1 that can be extracted from 3-D scans. It does not apply to instruments
    that measure the location and/or motion of individual landmarks. While mainly
    concerned with whole-body scanners, it is also applicable to body-segment scanners
    (head scanners, hand scanners, foot scanners). The intended audience is those
    who use 3-D scanners to create 1-D anthropometric databases and the users of 1-D
    anthropometric data from 3-D scanners. Although not necessarily aimed at the designers
    and manufacturers of those systems, scanner designers and manufacturers will find
    it useful in meeting the needs of clients who build and use 1‑D anthropometric
    databases.
