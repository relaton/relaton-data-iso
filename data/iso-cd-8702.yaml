abstract:
- language: en
  script: Latn
  content: This proposal carries out effective supervision and inspection on the measures
    related to corrosion control in various elements (corrosion source, material,
    technology, design, research and development, manufacturing, construction and
    installation, storage and transportation, commissioning and acceptance, operation,
    maintenance and repair, life extension and scrapping) of corrosion control engineering,
    and eventually formulates a set of third-party supervision procedures which meet
    the requirements of integration, systematization, mutual coordination and optimization
    of the main life cycle. It is applicable to the technical supervision of all types
    of corrosion control engineering programme in the whole life cycle.
