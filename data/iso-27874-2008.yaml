abstract:
- language: en
  script: Latn
  content: ISO 27874:2008 specifies the requirements for electrodeposited gold and
    gold alloy coatings for electrical, electronic and other engineering applications
    on metallic and non-metallic substrates. It also specifies test methods for measuring
    the properties of the coatings. Although this International Standard does not
    specify the condition, finish or surface roughness of the basis material prior
    to electroplating, the appearance and serviceability of electroplated gold or
    gold alloy coatings depends on the condition of the basis material. It is essential
    that the purchaser specify the surface finish and roughness of the basis material
    in order to conform to the product requirements. This International Standard does
    not apply to coatings on threaded articles or to coatings on sheet or strip in
    non-fabricated form.
