abstract:
- language: en
  script: Latn
  content: This document gives guidance on the structural design of plastic underground
    arch-shaped, corrugated wall chambers conforming to ISO 4982 used in underground
    systems for retention, detention, transportation and storage of non-potable water
    (e.g. storm water) under various conditions of loading. These chambers are intended
    for buried underground use in landscape, pedestrian or vehicular traffic areas.
    The chambers, including integral components, are injection moulded or thermoformed
    thermoplastics, manufactured from polyethylene (PE) or polypropylene (PP), and
    are intended to be used as elements in a modular system where the manufacturer
    has clearly stated in the documentation how the components are assembled to create
    a complete retention, detention, transportation or storage system.
