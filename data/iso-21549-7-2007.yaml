abstract:
- language: en
  script: Latn
  content: ISO 21549-7:2007 describes and defines the medication data objects used
    within or referenced by patient held health data cards using UML, plain text and
    Abstract Syntax Notation (ASN.1). ISO 21549-7:2007 is applicable to situations
    in which such data are recorded on or transported by patient healthcards compliant
    with the physical dimensions of ID-1 cards defined by ISO 7810. ISO 21549-7:2007
    specifies the basic structure of the data contained within the medication data
    object, but does not specify or mandate particular data-sets for storage on devices.
    The purpose of ISO 21549-7:2007 is for cards to provide information to other health
    professionals and to the patient or its non-professional care giver. It may also
    be used to carry a new prescription from the prescriber to the dispenser/pharmacy
    in the design of its sets.
