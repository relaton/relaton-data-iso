abstract:
- language: en
  script: Latn
  content: This document specifies the laboratory test procedure to determine the
    moment necessary to rotate a rail, secured to a sleeper or other rail support
    by a rail fastening system, in a plane parallel to the base of the rail. The value
    obtained can be used in track stability calculations. This test procedure applies
    to a complete fastening assembly. It is not applicable to fastening systems for
    embedded rail.
