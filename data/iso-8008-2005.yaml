abstract:
- language: en
  script: Latn
  content: ISO 8008:2005 specifies an instrumental method for the determination of
    specific surface area of smelter-grade alumina by nitrogen adsorption by a single-
    or multi-point method. A multi-point method is recommended due to the higher accuracy
    obtained; if a single-point method is used, a lower result will be obtained. ISO
    8008:2005 is applicable to aluminas having a surface area between 50 m2/g and
    90 m2/g.
