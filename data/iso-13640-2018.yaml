abstract:
- language: en
  script: Latn
  content: This document specifies the procedures for producing substrates of mortar,
    glass and anodized aluminium used for testing sealants. The purpose of these requirements
    is to ensure the reproducibility of the standardized tests conducted on sealants
    through the precise definition of both the composition and the method of preparation
    of the test substrates. The substrates defined in this document are indicators
    of the sealant's performance and not substrates which reproduce the characteristics
    of the construction materials.
