abstract:
- language: en
  script: Latn
  content: ISO 17604:2003 specifies sampling methods for the detection and enumeration
    of microorganisms on the carcass surface of freshly slaughtered (red) meat animals.
    The microbiological sampling can be carried out as part of the process control
    (and to verify process control) in slaughter establishments for cattle, horses,
    pigs, sheep, goats and game raised in captivity, risk-based assurance systems
    for product safety, and surveillance programmes for the prevalence of pathogenic
    microorganisms. ISO 17604:2003 includes the use of destructive and non-destructive
    techniques depending on the reason for the sample collection. It does not consider
    the use of sampling plans.
