abstract:
- language: en
  script: Latn
  content: This document specifies considerations and requirements for handling, measuring,
    and storing ultra-low concentrations of target nucleic acid sequences, i.e., concentrations
    corresponding to copy numbers that are significantly affected by Poisson distribution.
    This document is applicable to nucleic acid amplification methods (qPCR, dPCR,
    isothermal amplification and NGS). This document can be used in molecular biology
    laboratories. It can also be used in laboratories following ISO/IEC 17025.
