- language: en
  script: Latn
  content: ISO 8664:2005 specifies the marking, dimensions, load ratings and reference
    speeds for existing series of agricultural tractor drive-wheel tyres with service
    description (load index and speed symbol). It applies to tyres of radial construction
    in the speed categories 30 km/h (speed symbol A6), 40 km/h (speed symbol A8),
    and 50 km/h (speed symbol B)
