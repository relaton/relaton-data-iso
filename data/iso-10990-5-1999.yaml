abstract:
- language: en
  script: Latn
  content: 1.1 This part of ISO 10990 specifies methods for use in performance testing
    of traps used on land to restrain mammals. The performance testing includes methods
    for evaluation of trauma, selectivity, capture efficiency and user safety. 1.2
    It is recognized that injury is only one component of animal welfare. However,
    there are insufficient data collected in a scientific manner on the additional
    components to allow for the complete assessment of animal welfare. Several areas
    of investigation are presented for evaluation in annex A. Selection of the data
    collection methodology is left to the investigator. However, it is assumed that
    such collection methods will follow accepted practices. It should also be understood
    that data collected in any, or all, of the suggested areas will probably not provide
    an absolute measure of welfare. Rather, the compilation of such data over time
    should provide a mechanism for comparing the relative animal welfare impacts of
    different restraint methods.
