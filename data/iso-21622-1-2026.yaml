abstract:
- language: en
  script: Latn
  content: This document defines the general considerations applicable to any type
    of remote monitoring and control system (RMCS) used in irrigation. The document
    also includes some specific clauses on RMCS that fully or partially incorporate
    controllers developed for irrigation. These controllers are specific hardware
    developments designed for specific irrigation monitoring and/or control requirements.
    An indication is given at the beginning of each section that clearly defines when
    it is specifically intended for controllers developed for irrigation.
