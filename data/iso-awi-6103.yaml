abstract:
- language: en
  script: Latn
  content: ISO 6103:2014 specifies the maximum permissible values of unbalances for bonded abrasive wheels with an outside diameter D ≥ 125 mm and maximum operating speed vs ≥ 16 m/s, in the as-delivered condition. It also specifies the method for measuring the unbalance and the practical method for testing whether a grinding wheel is acceptable or not. It is applicable to bonded abrasive wheels in the as-delivered condition. It is not applicable to diamond, cubic boron nitride or natural stone grinding wheels, or to centreless control wheels, lapping and disc wheels, ball wheels or glass grinding wheels.
