abstract:
- language: en
  script: Latn
  content: 'This standard specifies a method to assess the quality of data used in
    Monitoring, Reporting, and Verification (MRV) systems under compliance carbon
    markets, by providing dimensions and guidelines for evaluating MRV data quality,
    including completeness, timeliness, traceability, accuracy, and comparability.
    This standard is applicable to all stakeholders (such as regulated entities, verifiers,
    and regulatory authorities) in compliance carbon markets to ensure reliable and
    comparable MRV data. Note: MRV systems are already established by regulatory authorities
    in different countries and regions.'
