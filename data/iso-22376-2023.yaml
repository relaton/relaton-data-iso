abstract:
- language: en
  script: Latn
  content: This document defines the conditions necessary for the interoperable deployment
    of visible digital seals (VDSs). It describes the structure, possible forms of
    representation, production process and verification process applicable to VDSs,
    for any type of document or object to which they relate. This document does not
    establish requirements for users that issue and verify documents or for users
    that implement and deploy VDSs. This document does not apply to detailed response
    formatting functions (RFFs). These requirements and functions are defined by the
    trust service operator (TSO) and generally cover functionalities such as the security
    levels of certificates and governance rules to be applied to document issuers
    and trust service providers (TSPs) intervening in the VDS ecosystem. This document
    does not apply to the governance related to the operation of the VDS scheme. It
    is not intended to replace the specifications from Agence Nationale des Titres
    Sécurisés (ANTS), Bundesamt für Sicherheit in der Informationstechnik (BSI) and
    International Civil Aviation Organization (ICAO) documents.
