abstract:
- language: en
  script: Latn
  content: This International Standard specifies terminology and required information
    as a general framework for identifying and describing the main dimensions and
    features of feller-bunchers. It is applicable to tracked and wheeled feller-bunchers
    as defined in ISO 6814. NOTE The terminology and requirements given in this International
    Standard will not necessarily all apply to a specific machine. Machines may be
    characterized by the dimensions and features which are relevant to them.
