abstract:
- language: en
  script: Latn
  content: 'ISO 9073-11 describes test methods for measuring the quantity of test
    liquid (simulated urine) which runs down a nonwoven test piece when a specified
    mass of test liquid is poured on to the nonwoven test piece superimposed on a
    standard absorbent media and placed on an inclined plane. This test method is
    designed to compare run-off of nonwovens. It is not intended to simulate in-use
    conditions of finished products. Three alternative methods are described: Test
    I -- the basic method for testing hydrophilic nonwovens; Test III -- the repeated
    test, with the same test parameters as in I); Test III -- the modified method
    for testing hydrophobic nonwovens specifying another table inclination than in
    I).'
