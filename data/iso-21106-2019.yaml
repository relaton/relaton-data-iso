abstract:
- language: en
  script: Latn
  content: This document specifies a calculation method of recyclability and recoverability
    rates for rolling stock. The method defined in this document applies to the design
    of new rolling stock. However, it can be applied to other existing rolling stock
    depending on available information. If calculation of recyclability or recoverability
    is applied to separate parts and/or products used in rolling stock and a specific
    calculation standard or method exists for the part and/or product, such standard
    or method can be applied, if relevant. This calculation method is applicable regardless
    of any geographical concern. This calculation method is applicable to any stage
    of life cycle of rolling stock. The calculated recyclability and recoverability
    rates are valid at the point of delivering the rolling stock products or equipment.
    Future recycling technologies or predicted trends with respect to the recycling
    industry are excluded from any consideration for this calculation method. This
    calculation method considers the four main treatment processes, which are reuse,
    recycling, energy recovery and disposal (Figure 1). Process losses of recycling
    are treated in the disposal stage. The residue substances of the energy recovery
    stage (mostly ash and slag) and the residue of the incineration process of the
    disposal stage are most likely landfilled.
