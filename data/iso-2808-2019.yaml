abstract:
- language: en
  script: Latn
  content: This document describes methods for measuring the thickness of coatings
    applied to a substrate. Methods for determining wet-film thickness, dry-film thickness
    and the film thickness of uncured powder layers are described. For each method
    described, this document provides an overview of the field of application, existing
    standards and the precision. Information on measuring film thickness on rough
    surfaces is given in Annex B. Information on measuring film thickness on wooden
    substrates is given in Annex C.
