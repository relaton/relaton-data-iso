abstract:
- language: en
  script: Latn
  content: ISO 8503-5:2017 describes a field method for measuring the surface profile
    produced by any of the abrasive blast-cleaning procedures given in ISO 8504-2.
    The method uses replica tape and a suitable gauge for measuring, on site, the
    roughness of a surface before the application of paint or another protective coating.
    The method is applicable within the range of profile heights cited for a given
    grade (or thickness) of replica tape. The commercial grades currently available
    permit measurement of average peak-to-valley profiles of 20 µm to 115 µm. The
    method is valid for surfaces that have been cleaned with abrasives.
