abstract:
- language: en
  script: Latn
  content: 'To facilitate interoperability in a shared industrial environment, this document specifies the requirements for communication between two or more of the following: industrial mobile robot (IMR); IMR fleet manager (IMRFM); other machines, equipment, and applications in the shared industrial environment (e.g. machines tended by the IMRs; enterprise resource planning (ERP) tools; and building infrastructure such as lifts, alarm systems, automated doors). For the purposes of this document, “industrial environment” describes a workplace where the people are working-age adults and the public is restricted from access or not reasonably expected to be present. Further, “industrial” pertains to the production of goods and related services (e.g. manufacturing, laboratory, pharmaceutical, warehousing, distribution, logistics and other workplaces). The following applications are excluded from the scope of this document: entertainment, consumer, military, medical and use on public roads. This document is not safety-related; there are no safety requirements. Navigation requirements are excluded from the scope of this document.'
