abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for operating lights
    used in the dental office and intended for illuminating the oral cavity of patients.
    It also contains specifications on the instructions for use, marking and packaging.
    This document applies to operating lights, irrespective of the technology of the
    light source. This document excludes auxiliary light sources, for example, from
    dental handpieces and dental headlamps and also operating lights which are specifically
    designed for use in oral surgery.
