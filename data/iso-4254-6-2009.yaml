abstract:
- language: en
  script: Latn
  content: 'ISO 4254-6:2009, to be used together with ISO 4254-1, specifies the safety
    requirements and their verification for the design and construction of mounted,
    semi-mounted, trailed and self-propelled agricultural sprayers for use with pesticide
    products and liquid fertilizer application, designed for use by one operator only.
    In addition, it specifies the type of information on safe working practices (including
    residual risks) to be provided by the manufacturer. ISO 4254-6:2009 is not applicable
    to pedestrian‑controlled sprayers, knapsack sprayers, aerial sprayers or handheld
    spraying devices (e.g. spray guns). ISO 4254-6:2009, taken together with ISO 4254-1,
    deals with all the significant hazards, hazardous situations and events relevant
    to sprayers and liquid fertilizer distributors when they are used as intended
    and under the conditions foreseen by the manufacturer, excepting the hazards arising
    from: automatically actuated height adjustment systems; electrostatic phenomena;
    electromagnetic compatibility; the environment, other than noise; inhalation of
    spraying chemical products due to a lack of effective methods to maintain breathing
    air quality inside the cab; roll-over and tip-over of self-propelled machines
    with a ride-on driver; vibration (except the declaration); dust emission; burns;
    moving parts for power transmission except strength requirements for guards and
    barriers; safety and reliability of control systems; travelling function of self-propelled
    machines.'
