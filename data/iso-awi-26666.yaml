abstract:
- language: en
  script: Latn
  content: This proposed International Standard specifies design, installation and
    operational requirements for magnetic bearing-based rotor sails installed on coastal
    vessels. The document will cover requirements for system stability, vibration
    and noise control, electromagnetic exposure, monitoring and control functions
    and safety measures, in order to ensure reliable performance of magnetic bearing
    rotor sails under typical coastal operating conditions. The document will be applicable
    to rotor sails used as wind-assisted propulsion devices on small and medium-sized
    coastal vessels, including but not limited to passenger ships and coastal cargo
    vessels. It is intended for use by designers, manufacturers, system integrators,
    shipyards, shipowners, classification societies and regulators involved in the
    application of magnetic bearing rotor sails. The document will not specify detailed
    structural design criteria for the rotor sail tower or hull girder, nor will it
    give requirements for the overall ship propulsion arrangement. Such aspects are
    covered by other International Standards, classification rules and IMO instruments
