abstract:
- language: en
  script: Latn
  content: This standard describes the dimensions of hexagonal head bolts, with large
    tolerance normal shank and UNJF threads, in metallic material (alloy steel, CRES
    and titanium alloy, etc.), coated or uncoated. It is applicable to be used as
    a test bolt for torque-tension tests of self-locking nuts and threaded collars
    to determine locking torque, breakaway torque and preload.
