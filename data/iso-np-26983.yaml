abstract:
- language: en
  script: Latn
  content: This document specifies a governance framework for establishing and maintaining the trustworthiness of agents in distributed ledger technology (DLT) environments, including agent roles and relationships, trustworthiness levels, and a trust control structure with control criteria. This document applies to DLT systems involving autonomous, semi-autonomous, or human-directed agents acting as data providers, and to stakeholders responsible for their governance, operation, and compliance. This document does not specify particular DLT, cryptographic methods, consensus mechanisms, or the internal design of agents, and does not supersede applicable legal or regulatory requirements.
