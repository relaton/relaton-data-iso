abstract:
- language: en
  script: Latn
  content: ISO/TR 14073:2016 provides illustrative examples of how to apply ISO 14046,
    in order to assess the water footprint of products, processes and organizations
    based on life cycle assessment. The examples are presented to demonstrate particular
    aspects of the application of ISO 14046 and therefore do not present all of the
    details of an entire water footprint study report as required by ISO 14046. NOTE
    The examples are presented as different ways of applying ISO 14046 and do not
    preclude alternative ways of calculating the water footprint, provided they are
    in accordance with ISO 14046.
