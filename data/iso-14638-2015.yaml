abstract:
- language: en
  script: Latn
  content: ISO 14638:2014 is a fundamental ISO GPS standard. It explains the concept
    of Geometrical Product Specification (ISO GPS), and provides a framework to illustrate
    how current and future ISO GPS standards address the requirements of the ISO GPS
    system. The framework is intended to be of use to users of ISO GPS standards,
    by illustrating the extent of the scope of the different standards, and showing
    how they relate to each other. The framework is also used for structuring the
    development of standards for GPS by technical committee ISO/TC 213.
