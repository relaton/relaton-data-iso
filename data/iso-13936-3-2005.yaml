abstract:
- language: en
  script: Latn
  content: ISO 13936-3:2004 describes a method for the determination of the resistance
    offered by the yarns of a woven fabric to slippage while being held in a needle
    clamp under conditions of stress. ISO 13936-3:2004 provides a means to negate
    variations introduced by seam preparation or sewing thread variation that can
    have a marked influence on test results. ISO 13936-3:2004 is not applicable to
    stretch fabrics or for industrial fabric, e.g. beltings.
