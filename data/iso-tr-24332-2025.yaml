abstract:
- language: en
  script: Latn
  content: 'This document analyses challenges, considerations, and potential benefits
    of blockchain and distributed ledger technology (DLT) in relation to records management
    standards and related standards for systems that: —     create records that are
    required to be authoritative records; —     can be used as records systems; or
    —     can be used for records management, including records controls. The target
    audience of this document includes records managers and allied professionals,
    IT professionals and application developers, legal and compliance professionals,
    researchers, educators and other interested parties.'
