abstract:
- language: en
  script: Latn
  content: 'This document defines a framework for blockchain-enabled micro-credentials supporting workforce development, lifelong learning, and skills portability. It specifies: • DLT Trust and Governance Infrastructure for credential issuance, verification, and lifecycle management; • interoperability of Learning outcomes Credential Representation across platforms, sectors, and skills and occupation taxonomies (e.g. ESCO, O’NET, etc); • alignment with decentralized identity and verifiable credential standards (e.g. W3C Verifiable Credentials and DIDs); • semantic interoperability through linkage with reference models for lifecycle processes including issuance, update, revocation, expiry, and stacking of micro-credentials; • Audit trail DLT based of Learning process and records. Distributed Ledger Technologies can provide governance evidence infrastructures supporting transparency, auditability, accountability and trust across workforce credential ecosystems.'
