abstract:
- language: en
  script: Latn
  content: ISO 8362-4:2003 specifies the shape, dimensions and capacities of glass
    vials for injectable preparations. It also specifies the material from which such
    containers shall be made and the performance requirements for the containers.
    It applies to colourless or amber glass containers moulded from borosilicate or
    soda-lime glass, with or without an internal surface treatment, and intended to
    be used in the packaging, storage or transportation of products intended for injection.
