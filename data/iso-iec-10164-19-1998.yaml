abstract:
- language: en
  script: Latn
  content: 'This Recommendation | International Standard defines the management domain
    and management policy management function. This Management Function is a System
    Management function which may be used by an application process in a centralized
    or decentralized management environment to interact for the purpose of systems
    management, as defined by the OSI Management Framework, CCITT Rec. X.700 and ISO/IEC
    7498-4. This Recommendation | International Standard defines a function which
    consists of generic definitions and services. This function is positioned in the
    application layer of the OSI reference model (ITU-T Rec. X.200 | ISO/IEC 7498-1)
    and is defined according to the model provided by ISO/IEC 9545. The role of systems
    management functions is described by CCITT Rec. X.701 | ISO/IEC 10040. This Recommendation
    | International Standard: — identifies the set of requirements satisfied by the
    function; — provides a model for the behaviour of the management domain management
    objects; — provides a model for the behaviour of the management policy management
    objects; — specifies the management requirements of the function and how these
    are realized by specification of managed objects and their behaviour; — specifies
    the mapping of these services onto the CMIS services; — specifies the abstract
    syntax of the parameters of the MAPDUs that will be used to refer to managed objects
    and their characteristics; — provides a model, in accordance with the Management
    Information Model and the General Relationship Model, for information associated
    with management domains, policies, and jurisdictions and for the behaviour of
    managed objects through which that information is accessed and manipulated; —
    provides definitions of the information associated with management domains, policies,
    and jurisdictions, their representation and the operations which may be performed
    upon them in terms of managed object and management relationship templates. This
    Recommendation | International Standard does not: — define the nature of any implementation
    intended to provide the management domain and management policy management function;
    — specify the manner in which management is to be accomplished by the user of
    the management domain and management policy management function; — define the
    nature of any interactions which result in the use of the management domain and
    management policy management function; — specify the services necessary for the
    establishment, normal and abnormal release of a management association; — define
    the interactions which result by the simultaneous use of several management functions;
    — define connection establishment or authorization requirements for the use of
    this function or for any associated activity; — preclude the definition of further
    management domain, management policy, or management jurisdiction managed object
    classes.'
