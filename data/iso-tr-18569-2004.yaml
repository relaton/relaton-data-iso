abstract:
- language: en
  script: Latn
  content: ISO/TR 18569:2004 provides assistance to the designer or manufacturer of
    machinery and related equipment on the contents and how to apply the relevant
    Type A and Type B safety of machinery standards. It provides an overview which
    gives a general outline of the basic steps which can assist the manufacturer to
    declare conformity with the EU Machinery Directive and related standards or apply
    supporting standards in the case when specific Type C standards do not exist.
    It provides an outline of the various standards associated with machinery safety.
