abstract:
- language: en
  script: Latn
  content: 'ISO 15023-1:2017 establishes a system of designation for poly(vinyl alcohol)
    (PVAL) materials which may be used as the basis for specifications. The types
    of poly(vinyl alcohol) (PVAL) materials are differentiated from each other by
    a classification system based on the designatory properties: a) degree of hydrolysis,
    b) viscosity of aqueous solution under defined conditions and on information about
    basic polymer parameters, intended application and/or method of processing, important
    properties, additives, colorants, fillers and reinforcing materials. ISO 15023-1:2017
    is applicable to all poly(vinyl alcohol) (PVAL) materials with a degree of hydrolysis
    not less than 70 mol%. It applies to materials ready for normal use in the form
    of powder, granules or pellets and to materials unmodified or modified by colorants,
    additives, fillers, etc. It is not intended to imply that materials having the
    same designation give necessarily the same performance. This document does not
    provide engineering data, performance data or data on processing conditions which
    may be required to specify a material. If such additional properties are required,
    they are intended to be determined in accordance with the test methods specified
    in ISO 15023-2, if suitable. In order to designate a thermoplastic material to
    meet particular specifications, the requirements are given in data block 5 (see
    4.1).'
