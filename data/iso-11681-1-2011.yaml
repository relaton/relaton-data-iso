abstract:
- language: en
  script: Latn
  content: ISO 11681-1:2011 gives safety requirements and measures for their verification
    for the design and construction of portable, combustion-engine, hand-held chain-saws,
    intended to be used for forest work by only one operator, by persons with the
    right hand on the rear handle and left hand on the front handle having read and
    understood the safety requirements provided in the instruction handbook and using
    the appropriate personal protective equipment (PPE). Methods for the elimination
    or reduction of hazards arising from the use of these machines and the type of
    information on safe working practices to be provided by the manufacturer are specified.
    ISO 11681-1:2011 deals with all significant hazards, hazardous situations and
    hazardous events, with the exception of kickback and balance for machines with
    an engine displacement of more than 80 cm3, relevant to these machines when they
    are used as intended and under conditions of misuse which are reasonably foreseeable
    by the manufacturer.
