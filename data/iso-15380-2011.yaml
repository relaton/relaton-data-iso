abstract:
- language: en
  script: Latn
  content: ISO 15380:2011 specifies the requirements for environmentally acceptable
    hydraulic fluids. It is applicable to hydraulic systems, particularly hydraulic
    fluid power systems. The purpose of this International Standard is to provide
    guidance for suppliers and users of environmentally acceptable hydraulic fluids,
    and to advise manufacturers of hydraulic systems. ISO 15380:2011 stipulates the
    requirements for environmentally acceptable hydraulic fluids at the time of delivery.
    Classification of fluids used in hydraulic application is defined in ISO 6743-4.
    ISO 15380:2011 encompasses only four of the categories of environmentally acceptable
    fluids covered by ISO 6743-4. These categories are HETG, HEPG, HEES and HEPR.
