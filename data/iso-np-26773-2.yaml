abstract:
- language: en
  script: Latn
  content: This document specifies a general method for the rapid determination of
    water content of polyamide (PA) using Near-Infrared (NIR) spectroscopy, mainly
    involving relevant terms and definitions, the principle of the test, instrument
    requirements, sample selection, procedures for establishing, validating and maintaining
    calibration models, as well as the steps for sample measurement. This document
    is applicable to polyamides including but not limited to PA46, PA6, PA66, PA69,
    PA610, PA612, PA11, PA12, PA6T/66, PA6I/6T, PA6T/6I/66, PA6T/6I, PA6I/6T/66 and
    PA MXD6, as well as copolyamides and polyamide compounds. This document is suitable
    for use in research, quality control, specification testing and process control
    of PA.
