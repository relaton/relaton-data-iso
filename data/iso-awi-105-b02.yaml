abstract:
- language: en
  script: Latn
  content: ISO 105-B02:2014 specifies a method intended for determining the effect on the colour of textiles of all kinds and in all forms to the action of an artificial light source representative of natural daylight (D65). The method is also applicable to white (bleached or optically brightened) textiles. This method allows the use of two different sets of blue wool references. The results from the two different sets of references may not be identical.
