abstract:
- language: en
  script: Latn
  content: 'ISO 7764:2006 specifies a method for the preparation of predried test
    samples of natural iron ores, and iron ore concentrates and agglomerates, including
    sinter products, which are to be used for the determination of analytical values
    of constituents on a dry basis. The method is not applicable to the following
    types of ores: processed ores containing metallic iron (direct-reduced iron);natural
    or processed ores in which the mass fraction of sulfur is higher than 0,2 %;natural
    or processed ores in which the content of combined water is higher than 2,5 %
    by mass.'
