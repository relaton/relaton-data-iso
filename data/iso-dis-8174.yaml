abstract:
- language: en
  script: Latn
  content: This document specifies a gas chromatographic method for the determination
    of trace amounts of oxygenated compounds in ethylene and propylene (propene) for
    industrial use. This document is applicable to ethylene and propylene having methanol,
    dimethyl ether, methyl tert-butyl ether, acetaldehyde, ethanol, propan-2-ol, acetone,
    and butanone concentrations greater than 0,5 mL/m3.
