abstract:
- language: en
  script: Latn
  content: This document specifies a method for the assessment of the persistence
    of a flame applied to the edge of a wick of non-flammable material immersed in
    fire-resistant fluid. This test does not determine the behaviour of a spray of
    fire-resistant fluid. NOTE Such test methods are specified in ISO 15029-1 and
    ISO 15029-2. This document specifies one of four basic tests for determining flammability.
    This document does not apply to certain liquids such as HFAE and HFAS liquids.
