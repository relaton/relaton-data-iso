abstract:
- language: en
  script: Latn
  content: This document specifies a method to determine the turbidity point of petroleum
    products based on distillates from crude oil. This document also specifies how
    to convert the turbidity point to an aniline point equivalent. This document describes
    a procedure using automated or automatic apparatus suitable for transparent samples
    with an initial boiling point above ambient temperature.
