abstract:
- language: en
  script: Latn
  content: This document specifies laser cleaning methods for the preparation of steel
    surfaces before coating with paints and related products. It provides information
    on the effectiveness of the individual methods and their fields of application.
    It describes the equipment to be used and the procedure to be followed. ISO 8504
    series is applicable to new and corroded steel surfaces and to steel surfaces
    that are uncoated or have been previously coated with paints and related products.
