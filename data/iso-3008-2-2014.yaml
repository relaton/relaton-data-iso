abstract:
- language: en
  script: Latn
  content: ISO 3008-2:2014 specifies the method of the test for determining the fire
    resistance of the lift landing door assemblies which can be exposed to fire from
    the landing side. The procedure applies to all the types of lift landing door
    assemblies used as a means of access to the lifts in buildings and which are intended
    to provide a fire barrier to the spread of fire via the lift well. The procedure
    allows for the measurement of integrity and, if required, the measurement of radiation
    and thermal insulation. No requirements other than the verification that the specimen
    is operational are included for the mechanical conditioning before the test.
