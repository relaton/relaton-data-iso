abstract:
- language: en
  script: Latn
  content: ISO 3095:2005 specifies the conditions for obtaining reproducible and comparable
    measurement results of levels and spectra of noise emitted by all kinds of vehicles
    operating on rails or other types of fixed track, except for track maintenance
    vehicles in operation. It is applicable to type testing and periodic monitoring
    testing. The results may be used, for example, to characterize the noise emitted
    by these trains, to compare the noise emission of various vehicles on a particular
    track section, and to collect basic source data for trains. The test procedures
    specified in ISO 3095:2005 are of engineering grade (grade 2, with a precision
    of 2 dB), that is the preferred one for noise declaration purposes, as defined
    in ISO 12001. The procedures specified for accelerating and decelerating tests
    are of survey grade.
