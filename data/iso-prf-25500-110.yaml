abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for a request for the verification
    of a certificate with an identifier formatted in accordance with ISO 8000-115
    and the response to the request. The following are within the scope of this document:
     terms related to certificates and the data set used for verification  the syntax
    requirements for a request for data needed to verify a certificate with an identifier
    formatted in accordance with ISO 8000-115  the syntax requirements for the response
    to a request for data needed to verify a certificate with an identifier formatted
    in accordance with ISO 8000-115  the syntax requirements for the reply from requestor
    to identifier issuer for request for verification of data of a certificate with
    an identifier formatted in accordance with ISO 8000-115  the syntax requirements
    for reply to request for data of a certificate with an identifier formatted in
    accordance with ISO 8000-115  the application interface protocol for the requests
    and the responses to the requests for verification of identifier data The following
    are outside the scope of this document:  the methods used for the resolution
    of certificates by the entity that issued the identifier'
