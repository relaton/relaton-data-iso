abstract:
- language: en
  script: Latn
  content: This document specifies the combined test method for axial bending and
    AC withstand voltage of tubes with round section made of fiber-reinforced plastic
    materials for power operation (with a wall thickness ranging from 2.0 to 6.0 mm,
    a diameter ranging from 20.0 to 70.0 mm). This document defines the test procedures,
    parameter monitoring requirements, and damage assessment principles for the test.
    This test method adopts a combined test mode of three-point bending load superimposed
    with AC withstand voltage, to achieve real-time damage identification under the
    combined electromechanical effects. This document is applicable solely to the
    factory inspection, performance verification, and reliability evaluation of fiber-reinforced
    plastic tubes with round section. It does not apply to tubes made of non-fiber-reinforced
    composite materials or those with special cross-sectional shapes.
