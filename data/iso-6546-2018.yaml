abstract:
- language: en
  script: Latn
  content: This document specifies information for the field collection of traffic
    accident data that is necessary or may assist in the evaluation of occupant restraint
    systems in passenger cars and trucks. The specific occupant restraints covered
    are seat belts, head restraints, knee protection, airbag systems and child restraint
    systems. This document does not cover an assessment of the structural performance
    of the vehicle for which items such as crush, intrusion, and structural architecture
    may be necessary.
