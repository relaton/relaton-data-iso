abstract:
- language: en
  script: Latn
  content: This document specifies terms and definitions related to safety and performance
    requirements for the design, assembly, and testing of bicycles and sub-assemblies
    having maximum saddle height 635 mm or more. This document does not apply to specialized
    types of bicycle such as delivery bicycles, recumbent bicycles, tandems, BMX bicycles,
    and bicycles designed and equipped for use in severe applications such as sanctioned
    competition events, stunting, or aerobatic manoeuvres. NOTE      For bicycles
    with a maximum saddle height of 435 mm or less, see national regulations for ride-on
    toys, and with a maximum saddle height of more than 435 mm and less than 635 mm,
    see ISO 8098.
