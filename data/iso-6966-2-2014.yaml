abstract:
- language: en
  script: Latn
  content: ISO 6966-2:2014 specifies the minimum design requirements applicable to
    all aircraft ground support equipment (GSE) in order to ensure safety of staff
    operating or maintaining the equipment or in its vicinity, and protection of aircraft
    against interference or damage. ISO 6966-2:2014 does not apply to automotive vehicles
    or parts thereof approved for public vehicles, when used on aircraft ground support
    equipment for the purpose for which they are designed.
