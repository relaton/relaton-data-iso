abstract:
- language: en
  script: Latn
  content: ISO 15612:2004 gives the information necessary to explain the requirements
    referenced in ISO 15607 about qualification by adoption of a standard welding
    procedure, and establishes the conditions, limits and ranges of qualification
    necessary for the use of a standard welding procedure. This International Standard
    gives the manufacturer the possibility of using welding procedures based on welding
    procedure tests performed by other organisations. The use of ISO 15612:2004 can
    be restricted by an application standard or a specification.
