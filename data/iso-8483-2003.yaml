abstract:
- language: en
  script: Latn
  content: ISO 8483:2003 specifies methods of test for bolted flange joints for plastics
    piping systems made of glass-reinforced thermosetting plastics (GRP). This standard
    is only applicable to the joint, and covers methods of test to prove its design.
    It assumes that the joint either is or is not intended to be subject to the effects
    of hydrostatic end thrust. These test procedures are applicable to joints between
    pipes and fittings of all nominal sizes. The tests are applicable for evaluating
    joints intended for applications conveying liquids at temperatures specified in
    the referring specifications.
