abstract:
- language: en
  script: Latn
  content: This document specifies the technical delivery requirements for five groups
    of wrought ball and roller bearing steels as listed in Table 3, namely —     through-hardening
    bearing steels (steels with about 1 % C and 1 % to 2 % Cr), —     case-hardening
    bearing steels, —     induction-hardening bearing steels (unalloyed and alloyed),
    —     stainless bearing steels, and —     high-temperature bearing steels. This
    document is applicable to the products and heat-treatment conditions given in
    Table 1 and the surface conditions given in Table 2.
