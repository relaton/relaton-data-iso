abstract:
- language: en
  script: Latn
  content: 'This part of ISO 898 specifies mechanical and physical properties of nuts
    with coarse thread and fine pitch thread made of carbon steel and alloy steel
    when tested at an ambient temperature range of 10 °C to 35 °C. Nuts conforming
    to the requirements of this part of ISO 898 are evaluated at that ambient temperature
    range. It is possible that they do not retain the specified mechanical and physical
    properties at elevated and/or lower temperatures. NOTE 1 Nuts conforming to the
    requirements of this part of ISO 898 have been used in applications ranging from
    ?50 °C to +150 °C. It is the responsibility of users to consult an experienced
    fastener materials expert for temperatures outside the range of ?50 °C to +150
    °C and up to a maximum temperature of +300°C to determine appropriate choices
    for a given application. NOTE 2 Information for the selection and application
    of steels for use at lower and elevated temperatures is given for instance in
    EN 10269, ASTM F2281 and in ASTM A320/A320M. This part of ISO 898 is applicable
    to nuts: a) made of carbon steel or alloy steel; b) with coarse thread M5 ≤ D
    ≤ M39, and fine pitch thread M8×1 ≤ D ≤ M39×3; c) with triangular ISO metric thread
    according to ISO 68-1; d) with diameter/pitch combinations according to ISO 261
    and ISO 262; e) with specified property classes, including proof load; f) with
    different nut styles: thin nuts, regular nuts and high nuts; g) with minimum height
    m ≥ 0,45D; h) with a minimum outside diameter or width across flats s ≥ 1,45D
    (see Annex A); i) able to mate with bolts, screws and studs with property classes
    according to ISO 898-1. For hot dip galvanized nuts, see ISO 10684. This part
    of ISO 898 does not specify requirements for properties such as: — prevailing
    torque properties (see ISO 2320); — torque/clamp force properties (see ISO 16047
    for test method); — weldability; — corrosion resistance.'
