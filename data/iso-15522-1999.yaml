abstract:
- language: en
  script: Latn
  content: This International Standard specifies a method for assessing the potential
    toxicity of a test material to the growth of aerobic bacteria present in activated
    sludge. The inhibitory effect is restricted to those microorganisms capable of
    growth on the chosen organic test medium. This method gives information on inhibitory
    effects on the microorganisms over incubation periods up to 6 h. This method is
    applicable to water, wastewater and chemical substances which are soluble under
    the conditions of the test. Special care is needed with volatile or coloured materials
    and materials which form turbid suspensions or dispersions. NOTE 1 Results with
    volatile test material should be interpreted with caution and are likely to underestimate
    any inhibitory effect because of the difficulties in maintaining the initial concentration
    in the test flasks. NOTE 2 Coloured materials and materials of low water-solubility
    which form turbid suspensions or dispersions can be tested in many cases using
    colour/turbidity controls as blanks (see 9.4). NOTE 3 Inhibitory effects on activated
    sludge microorganisms of test materials for which this test is not applicable
    can be determined by using an inhibition test based on respirometric measurements
    (see ISO 8192).
