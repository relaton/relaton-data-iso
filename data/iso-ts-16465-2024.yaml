abstract:
- language: en
  script: Latn
  content: 'This document specifies two methods for the quantitative determination
    of phthalates in vegetable oils by gas chromatography-mass spectrometry (GC-MS):
    —     Part A for the determination of di-2-ethylhexyl phthalate (DEHP). —    
    Part B for the determination of eight phthalates: dimethyl phthalate (DMP), diethyl
    phthalate (DEP), di-isobutyl phthalate (DIBP), dibutyl phthalate (DBP), benzylbutyl
    phthalate (BBP), di-2-ethylhexyl phthalate (DEHP), di-isononyl phthalate (DINP),
    di-isodecyl phthalate (DIDP). Both methods are applicable for all vegetable oils,
    including crude, refined and virgin.'
