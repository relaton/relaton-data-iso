abstract:
- language: en
  script: Latn
  content: ISO 15004-1:2006 specifies fundamental requirements for non-invasive, active
    and non-active ophthalmic instruments. ISO 15004-1:2006 is also applicable to
    low-vision aids and tonometers, but not to other ophthalmic instruments which
    are used in contact with the globe of the eye. ISO 15004-1:2006 is not applicable
    to operation microscopes, endoscopes and devices intended for laser investigation
    or laser treatment of the eye.
