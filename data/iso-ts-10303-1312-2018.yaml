abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1312:2018-11 specifies the application module for Draughting
    element specialisations. The following are within the scope of ISO/TS 10303-1312:2018-11:
    items within the scope of application interpreted construct "Draughting elements",
    ISO 10303-506: the structures for representing single or composite dimensions;the
    structures for representing structured or unstructured dimensions;the structures
    for representing draughting callouts that might be directed by means of leaders,
    projection curves, or dimension curves. items within the scope of application
    module Draughting element, ISO/TS 10303-1310.'
