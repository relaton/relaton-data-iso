abstract:
- language: en
  script: Latn
  content: 'This document specifies water usage effectiveness (WUE) as a key performance
    indicator (KPI) for quantifying the water consumption of a data centre during
    the use phase of the data centre life cycle. WUE is a simple method for reporting
    the water intensity of the data centre operating. By reporting water consumption,
    it is possible to present the data centre''s resource effectiveness. This document:
    a) defines the WUE of a data centre; b) introduces WUE measurement categories;
    c) describes the relationship of this KPI to a data centre’s infrastructure, information
    technology equipment and information technology operations; d) defines the measurement,
    the calculation and the reporting of the parameter; and e) provides information
    on the correct interpretation of the WUE.'
