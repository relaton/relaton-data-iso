abstract:
- language: en
  script: Latn
  content: ISO 24450:2005 specifies requirements and dimensions for an internationally
    acceptable series of conical flasks and of flat-bottom and round-bottom flasks
    with wide neck for general laboratory purpose. The flasks are provided for direct
    use in laboratory, fitting together with other equipment for general laboratory
    purposes, and for further work up to other products. For narrow-necked boiling
    flasks, ISO 1773 applies. For boiling flasks with conical ground joints, see ISO
    4797.
