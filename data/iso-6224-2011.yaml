abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies the requirements for general-purpose
    textile-reinforced thermoplastics water-discharge hoses. Three types of hose are
    specified according to their operating duty requirements, i.e. their ambient and
    water temperature ranges: — ambient temperatures: −10 °C to +60 °C; — water temperature
    during operation: 0 °C to +60 °C. NOTE At water temperatures above 23 °C and particularly
    above 40 °C, the maximum working pressure will be reduced. These hoses are not
    intended to be used for conveyance of potable (drinking) water, for washing-machine
    inlets, as fire-fighting hoses, for special agricultural machines or as gardening
    hoses for the consumer market.'
