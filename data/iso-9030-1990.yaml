abstract:
- language: en
  script: Latn
  content: Specifies a method for the laboratory determination. The precision data
    of this procedure have only been determined for water contents up to 1 % (V/V).
    Includes principle, apparatus, reagents, sampling, procedure, expression of results,
    precision and test report. A centrifuge tube is shown in figure 1. The procedure
    for reading the volume of water and sediment is shown in figure 2. The precision
    of the method is shown in figure 3. The sample handling is described in annex
    A.
