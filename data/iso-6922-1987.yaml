abstract:
- language: en
  script: Latn
  content: Specifies a method for determining the bond strength of a butt joint when
    subjected to tensile force. The method is applicable to all types of adhesives.
    -A joint formed from two bar or rod adherends bonded by faces normal to their
    length is stressed to rupture by a tensile force. The test result is expressed
    as the arithmetic mean of the breaking force of five valid tests.
