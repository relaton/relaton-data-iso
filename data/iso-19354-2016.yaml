abstract:
- language: en
  script: Latn
  content: 'ISO 19354:2016 specifies the general requirements for marine cranes of
    metal construction. It is applicable to the following types of marine cranes:
    - deck cranes mounted on ships for handling cargo or containers in harbour or
    sheltered water conditions; - floating cranes or grab cranes mounted on barges
    or pontoons for operating in harbour conditions; - engine room cranes and provision
    cranes, etc. mounted on ships (including floating docks) for handling equipment
    and stores in harbour conditions. NOTE Marine cranes in other types can refer
    to this document. It is not applicable to the following: - minimum ambient operating
    temperatures below −20 °C; - maximum ambient operating temperatures above +45
    °C; - loads from accidents or collisions; - lifting operations below sea level;
    - transport, assembly, dismantling and decommissioning of cranes; - lifting accessories,
    i.e. any item between the crane and the load; - lifting operations involving more
    than one crane; - hand-powered cranes; - emergency rescue operations; - shore-side
    cargo handling cranes; - portable cranes on board; - lifting appliances for lifeboats,
    liferafts accommodation ladders, and pilot ladders; - launching appliances for
    survival craft and rescue boats; - gangways, accommodation and pilot ladders and
    their handling appliances.'
