abstract:
- language: en
  script: Latn
  content: ISO 7700-2:2011 specifies a method of checking the performance of moisture
    meters in service for measuring the moisture content of oilseeds. It is not applicable
    to either cases of pattern approval or for initial calibration of moisture meters.
    The results of the verification described in ISO 7700-2:2011 are used to evaluate
    whether to check fully or to repair the moisture meter.
