abstract:
- language: en
  script: Latn
  content: 'This document specifies a general information model for provenance of
    biological material. This document covers all steps of the biological material
    life cycle from acquisition, transport, and processing to storage and disposal.
    The requirements defined here are applicable to organizations, authorities and
    industries conducting or being involved in activities related to biological material,
    generating, collecting, analyzing, or storing data on biological material, manufacturing
    devices or software for the aforementioned tasks, or providing facilities for
    these tasks. This standard defines a provenance information model suitable for
    describing source material, from which the sample originates, and all steps in
    its life cycle. The biological material can be from multicellular organisms (e.g.,
    human, animal, fungus, and plant), microorganisms or environmental samples. NOTE:
    International, national, or regional regulations or requirements can also apply
    to specific topics covered in this document.'
