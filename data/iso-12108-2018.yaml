abstract:
- language: en
  script: Latn
  content: This document describes tests for determining the fatigue crack growth
    rate from the fatigue crack growth threshold stress-intensity factor range, ΔKth,
    to the onset of rapid, unstable fracture. This document is primarily intended
    for use in evaluating isotropic metallic materials under predominantly linear-elastic
    stress conditions and with force applied only perpendicular to the crack plane
    (mode I stress condition), and with a constant force ratio, R.
