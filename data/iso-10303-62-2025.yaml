abstract:
- language: en
  script: Latn
  content: 'This document specifies the integrated generic resource constructs for
    equivalence validation of product data. This document is concerned with comparing
    two sets of product data to determine their equivalence. This document focuses
    on detailed specifications for the representation of equivalence validation criterion
    together with the corresponding inspection requirement, equivalence assessment
    specification, and detailed result of annotated 3d model equivalence inspection.
      The following are within the scope of this document: representation of high-level
    data elements for managing equivalence validation related data; representation
    of general equivalence validation criteria for product data; representation of
    general equivalence validation criteria for product data associated with the corresponding
    validation inspection requirements; representation of general equivalence validation
    criteria for product data associated with the corresponding assessment specifications;
    representation of equivalence validation results for two sets of given product
    data; representation of equivalence validation criteria for annotated 3d model
    data coupled with the inspection requirements for the evaluation of criteria,
    and with the pertinent assessment specifications; NOTE 1   Equivalence validation
    criteria can be used for the representation of requirements on equivalence, declaration
    of equivalence, and assurance of equivalence of two sets of annotated 3d model
    data. The target shape model data are conformant to those defined in ISO 10303-42,
    or the application protocols based on ISO 10303-42; representation of equivalence
    validation results of the given two sets of annotated 3d model data. NOTE 2  
    Requirements of product data equivalence is application-context dependent. This
    document provides a means to select appropriate criteria together with required
    inspection requirements and thresholds. The following are outside the scope of
    this document: equivalence validation algorithm; detailed information relating
    to equivalence validation of product data other than annotated 3d model data;
    NOTE 3   Though general specifications for the representation of criteria, inspection
    requirements, assessment specifications, and inspection results of product data
    are given, detailed specifications are provided only for annotated 3d model data.
    data model to improve the equivalence of annotated 3d model data; process model
    to ensure the equivalence of product data.'
