abstract:
- language: en
  script: Latn
  content: This part of ISO 15360 specifies a method to estimate Stickies and Plastics
    in a wide variety of pulps including all recycled grades. It is not intended for
    the estimation of visible dirt and shives which is covered by the ISO 5350 series,
    or for visible contraries in recycled pulps, which is covered by ISO 15319 [1].
    This method will only capture those Stickies and Plastics which are retained on
    the screen of a given slit size. It should be noted that this will probably not
    be the total amount of Stickies and Plastics that are actually present in a given
    pulp sample.
