abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for part 1 a series of international
    standards under the general title Sustainable and traceable biogas. These standards
    establish a framework for assessing and ensuring the sustainability, traceability,
    and certification of biogas. The document applies to all production pathways of
    biogas, including but not limited to anaerobic digestion of organic feedstocks,
    and covers aspects related to sustainability management, performance assessment,
    traceability, certification, and biomethane certification registry schemes. This
    series consists of the following parts: Part 1: Requirements for biomethane certification
    registry schemes – Establishes requirements for biomethane certification registry
    schemes to authenticate and communicate sustainability attributes of biogas. Part
    2: Requirements for performance (related to sustainability aspects) – Establishes
    performance criteria for biogas production and use, addressing key sustainability
    indicators. Part 3: Requirements for traceability – Defines requirements for traceability
    systems to track and verify the origin and sustainability attributes of biogas.
    Part 4: Requirements for certification schemes – Specifies requirements for the
    development and operation of certification schemes ensuring compliance with sustainability
    and traceability requirements. Part 5: Requirements for biogas sustainability
    management systems – Specifies requirements for implementing and maintaining a
    sustainability management system in biogas production, ensuring compliance with
    defined sustainability criteria. This document applies to stakeholders involved
    in the biogas value chain, including producers, traders, certification bodies,
    regulators, and end-users. Attempt will be made to synergize this proposal and
    another related but distinctly different proposal on the development of “Voluntary
    Certification Guidelines for Biomethane”.'
