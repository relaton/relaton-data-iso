abstract:
- language: en
  script: Latn
  content: ISO 9772:2012 specifies a small-scale laboratory screening procedure for
    comparing the relative burning characteristics of horizontally oriented, small
    cellular plastic specimens, having a density less than 250 kg/m3, when exposed
    to an ignition source. This method of test is intended for quality assurance and
    limited product evaluation of cellular plastic materials under controlled laboratory
    conditions, and is not intended to assess the fire behaviour of e.g. building
    materials or furnishings under actual fire conditions. An optional classification
    system is described in an annex. It is intended for the pre-selection of cellular
    plastic materials for products, including the determination of the ranges of material
    parameters that give the same classification.
