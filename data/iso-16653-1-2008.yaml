abstract:
- language: en
  script: Latn
  content: ISO 16653-1:2008 specifies the safety requirements for mobile elevating
    work platforms (MEWPs) with guardrail systems. It is intended to be used in conjunction
    with ISO 16368. It is applicable to such MEWPs designed for applications requiring
    special access to specific work areas. These MEWPs can be either self-propelled
    or manually propelled and are used to elevate personnel to a level at which they
    can place, install or retrieve objects or material on a routine basis. To facilitate
    operator access to the work area, the retraction of a portion of the MEWP's work
    platform guardrail system(s) can be necessary. It is not applicable to powered
    industrial trucks used to pick and place stock or inventory.
