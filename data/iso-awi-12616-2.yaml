abstract:
- language: en
  script: Latn
  content: This document specifies requirements and recommendations related to workflows
    and roles in terminology management. It provides guidance to define workflows
    and roles necessary to manage terminology projects in high-complexity environments.
    It covers typical terminology management workflows and describes the central roles
    of such workflows with regard to related tasks and competences. This document
    is intended for terminologists working in or for organizations. It can also be
    used by developers of tools in support of terminology management workflows. This
    document does not specify provisions for low-complexity environments as part of
    non- terminological activities which are covered in ISO 12616-1.
