abstract:
- language: en
  script: Latn
  content: This document specifies the general principles for presenting views, sections
    and cuts applicable to various kinds of technical drawings (e.g. mechanical, electrical,
    architectural, civil engineering), following the orthographic projection methods
    specified in ISO 5456-2. Views and sections for shipbuilding technical drawings
    are discussed in ISO 128-15. Views and sections for 3D models are discussed in
    ISO 16792. Attention has also been given in this document to the requirements
    of reproduction, including microcopying in accordance with ISO 6428.
