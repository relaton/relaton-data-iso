abstract:
- language: en
  script: Latn
  content: This document provides requirements for the design, design verification,
    functional evaluation, manufacturing, storage, and transportation of dynamic monitoring
    systems by electromagnetic wave for production wells in the petroleum and natural
    gas industry. All the contents of this document are applicable to products that
    conform to the definition of production well dynamic monitoring system with electromagnetic
    wave, including downhole transmitters and downhole repeater demodulators. etc.
    This part of the standard includes normative annexes covering the structural composition,
    installation requirements, design verification, performance rating requirements,
    and functional evaluation of electromagnetic wave dynamic monitoring systems.
    In addition, this part of the document includes informative annexes providing
    information on testing equipment and components of the electromagnetic wave dynamic
    monitoring system. This document does not cover downhole sensors, centralizers,
    conductors, or accumulators. These items may or may not be covered by other international
    standards.
