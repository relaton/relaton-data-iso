abstract:
- language: en
  script: Latn
  content: 'This document defines the General Feature Model (GFM) as the metamodel
    for creating application schemas in the context of geo-information modelling.
    The GFM is explained and implemented as rules for creating and documenting application
    schemas, including principles for the definition of features. This document is
    applicable to: —     conceptual modelling of features and their properties from
    a universe of discourse; —     definition of application schemas; —     general
    rules for using a conceptual schema language for application schemas; —     rules
    for application schemas using UML as the conceptual schema language; —     transition
    from the concepts in the conceptual model to the data types in the application
    schema; —     integration of standardized schemas from other ISO geographic information
    standards with the application schema. This document does not apply to: —    
    choice of one particular conceptual schema language for application schemas; —    
    definition of any particular application schemas; —     representation of feature
    types and their properties in a feature catalogue; —     representation of metadata;
    —     rules for mapping one application schema to another; —     implementation
    of the application schema in a computer environment; —     computer system and
    application software design; —     programming.'
