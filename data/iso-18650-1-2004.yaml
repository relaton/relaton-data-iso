- language: en
  script: Latn
  content: ISO 18650-1:2004 establishes additional terminology to describe the functioning
    and the required and optional components for various types of concrete mixers.
    The content of commercial literature specifications for these types of machines
    is defined. ISO 18650-1:2004 applies to concrete mixers as defined in ISO 11375;
    truck mixers are excluded.
