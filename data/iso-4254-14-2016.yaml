abstract:
- language: en
  script: Latn
  content: 'ISO 4254-14:2016 intended to be used together with ISO 4254‑1, specifies
    the safety requirements and their verification for the design and construction
    of mounted, semi-mounted, trailed, and stationary bale wrapper for bales of agricultural
    harvesting products including wrappers which are combined or integrated with pick-up
    balers. It describes methods for the elimination or reduction of hazards arising
    from the intended use and reasonably foreseeable misuse of these machines by one
    person (the operator) in the course of normal operation and service. In addition,
    it specifies the type of information on safe working practices to be provided
    by the manufacturer. NOTE 1 Requirements for self-propelled bale wrappers may
    be added during the next revision of this part of ISO 4254. NOTE 2 Examples of
    these machines are given in Annex A. NOTE 3 Requirements for pick-up balers are
    specified in ISO 4254‑11. When requirements of this part of ISO 4254 are different
    from those which are stated in ISO 4254‑1, the requirements of this part of ISO
    4254 take precedence over the requirements of ISO 4254‑1 for machines that have
    been designed and built according to the requirements of this part of ISO 4254.
    This part of ISO 4254, taken together with ISO 4254‑1, deals with all the significant
    hazards (as listed in Table 1), hazardous situations, and events relevant to mounted,
    semi-mounted, and trailed bale wrappers including wrappers which are combined
    with pick-up balers when they are used as intended and under the conditions of
    misuse that are reasonably foreseeable by the manufacturer (see Clause 4). ISO
    4254-14:2016 is not applicable to the following: - non-mobile fixed bale wrappers;
    - tube/inline wrappers; - wrapping process that concerns only the circumferential
    part of the bale and that occurs in the bale chamber; - the integrity of safety
    related parts of control systems with regard to the specification of performance
    levels; - environmental hazards (except noise), road safety, and hazards related
    to moving parts for power transmission; - hazards related to maintenance or repairs
    carried out by professional service personnel. NOTE 4 Specific requirements related
    to road traffic regulations are not taken into account in this part of ISO 4254.
    ISO 4254-14:2016 is not applicable to machines manufactured before the date of
    its publication.'
