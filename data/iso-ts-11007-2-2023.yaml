abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the rust prevention
    characteristics of lubricating grease in the presence of a flow of an aqueous
    test fluid. This test method is used to assess the ability of a grease to prevent
    corrosion in rolling bearings operated in presence of water, synthetic sea water
    or any industrial aqueous pollutant, under wash out conditions.
