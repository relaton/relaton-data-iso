abstract:
- language: en
  script: Latn
  content: This document specifies methods for exposing specimen to alternating outdoor weathering supported with artificial radiation. This method utilizes natural outdoor exposure during daytime—under clear sky conditions as well as cloudy or rainy conditions—and is assisted by artificial radiation during nighttime. During nighttime exposure, inert mesh screens are installed on all four sides to prevent insect ingress while keeping the specimens open to the ambient air for maximum outdoor exposure. Consequently, no separate temperature control is applied. This document is applicable to all plastic materials intended for outdoor use, as well as to products and portions of products. The artificial and natural outdoor exposures and their practices applicable to this document are described in ISO 4892-1, ISO 4892-3 and ISO 877-1, ISO 877-2 and ISO 877-3, respectively.
