abstract:
- language: en
  script: Latn
  content: This document is applied for all types of blood banks which store or collect
    blood and loodcomponents for therapeutic purposes. This document can be used by
    blood banks in developing their quality management systems and assessing their
    own competence. It can also be used for confirming or recognizing the competence
    of blood banks by customers, peer assessment schemes, regulating authorities and
    accreditation bodies. Note National, International or Regional regulations and
    requirements could apply.
