abstract:
- language: en
  script: Latn
  content: 'ISO 18286:2008 specifies requirements for tolerances for hot-rolled stainless
    steel plates (quarto plates) made on a reversing mill with the following characteristics:
    nominal thickness, t, from 4 mm to 250 mm; and nominal width, w, equal to or greater
    than 600 mm. Tolerances for plate of width w less than 600 mm cut or slit from
    wider plate should be agreed upon between manufacturer and purchaser at the time
    of enquiry and order. ISO 18286:2008 is not applicable to round plates, custom-made
    plates, checker plate or bulb plate for flooring or wide flats, nor to continuous-process
    plates (plate made with coiling).'
