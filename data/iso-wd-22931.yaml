abstract:
- language: en
  script: Latn
  content: This standard specifies quality assurance (QA) and quality control (QC)
    requirements for entities that perform calibration of devices, manufacture devices
    and perform analysis of devices associated with quantifying time weighted average
    concentration activity of 222 Rn gas in indoor air. This standard does not define
    requirements associated with calibration, manufacturing or analysis of devices
    for activities associated with measuring 220 Rn and decay products of 222 Rn and
    220 Rn. This standard does not ensure nor take precedence over compliance with
    the applicable codes or regulations of any federal, state, provincial, territorial
    or local agency jurisdiction.
