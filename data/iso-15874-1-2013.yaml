abstract:
- language: en
  script: Latn
  content: ISO 15874-1:2013 specifies the general aspects of polypropylene (PP) piping
    systems intended to be used for hot and cold water installations within buildings
    for the conveyance of water whether or not intended for human consumption (domestic
    systems), and for heating systems, under design pressures and temperatures according
    to the class of application. It covers a range of service conditions (classes
    of application), design pressures and pipe dimension classes. It also specifies
    test parameters for test methods. In conjunction with the other parts of ISO 15874,
    ISO 15874-1:2013 is applicable to PP pipes, fittings, their joints and to joints
    with components of other plastics and non-plastics materials intended to be used
    for hot and cold water installations.
