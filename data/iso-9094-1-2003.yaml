abstract:
- language: en
  script: Latn
  content: ISO 9094-1:2003 defines procedures to achieve a practical degree of fire
    protection, specifies portable fire-fighting equipment and sets requirements for
    fixed fire-fighting systems. It applies to small craft of all types with a hull
    length not exceeding 15 m. For small craft with a hull length greater than 15
    m, ISO 9094-2 applies. Personal watercraft are excluded from the scope of ISO
    9094-1:2003.
