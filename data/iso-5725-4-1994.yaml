abstract:
- language: en
  script: Latn
  content: Provides basic methods for estimating the bias of a measurement method
    and the laboratory bias when a measurement method is applied. In order that the
    measurements are made in the same way, it is important that the measurement method
    has been standardized. Can be applied only if the accepted reference value can
    be established as a conventional true value, e.g. by measurement standards or
    suitable reference materials or by referring to a reference measurement method
    or by preparation of a known sample.
