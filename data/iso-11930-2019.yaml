abstract:
- language: en
  script: Latn
  content: 'This document specifies a procedure for the interpretation of data generated
    by the preservation efficacy test or by the microbiological risk assessment, or
    both, when evaluating the overall antimicrobial protection of a cosmetic product.
    It comprises: — a preservation efficacy test; — a procedure for evaluating the
    overall antimicrobial protection of a cosmetic product that is not considered
    low risk, based on a risk assessment described in ISO 29621. The preservation
    efficacy test is a reference method to evaluate the preservation of a cosmetic
    formulation. It is applicable to cosmetic products in the marketplace. This test
    does not apply to those cosmetic products for which the microbiological risk has
    been determined to be low according to Annex A and ISO 29621. This test is primarily
    designed for water-soluble or water-miscible cosmetic products and can be used
    with modification to test products in which water is the internal (discontinuous)
    phase. NOTE This test can be used as a guideline to establish a development method
    during the development cycle of cosmetic products. In this case, the test can
    be modified or extended, or both, for example, to make allowance for prior data
    and different variables (microbial strains, media, incubation conditions exposure
    time, etc.). Compliance criteria can be adapted to specific objectives. During
    the development stage of cosmetic products, other methods, where relevant, can
    be used to determine the preservation efficacy of formulations.'
