abstract:
- language: en
  script: Latn
  content: ISO 9514:2005 describes a method, carried out under standard conditions,
    for preparing and storing a sample of a multicomponent coating system and subsequently
    assessing its pot life by measuring a particular property/ies. The method can
    be carried out either as a pass/fail test by determining the particular property/ies
    after a specified period of time, or as determination of the pot life by repeating
    determinations at convenient intervals of time. This International Standard is
    not intended for in situ control of products during their application. It is intended
    to determine 'pot life' in the laboratory.
