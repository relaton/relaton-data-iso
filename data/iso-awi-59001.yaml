abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for establishing, implementing,
    maintaining and continually improving a circular economy management system that
    an organization can use to enhance its circularity performance. The document is
    intended for use by an organization seeking to integrate circular economy as a
    strategic priority. The circular economy management system will support the organization
    to use a systemic approach to contribute to the maintenance of a circular flow
    of resources in society by recovering, retaining or adding to their value, while
    contributing to sustainable development. The requirements set out in this document
    is generic and will provide value for the society, the environment, the organization
    itself and interested parties. The document will support an organisation to understand
    how its value network (e.g. suppliers and customers) will be affected by decisions
    taken by the organisation and give organizations within the value network a system
    of interconnected and interdependent decisions and activities. Consistent with
    the organization''s policy for a circular economy, the expected results of a circular
    economy management system include: • enhancement of the circularity performance.
    • a system for compliance obligations. • a system for achievement of environmental,
    social, and economic objectives. • increased long-term value creation. This document
    is applicable to any organization seeking to understand and commit or contribute
    to a circular economy. These organizations can be either private or public, acting
    individually or collectively, regardless of type or size, and located in any jurisdiction,
    or position within a specific value chain or value network. This document can
    be used in whole or in part to systematically improve management towards circularity.
    Claims of conformity to this International Standard, however, are not acceptable
    unless all its requirements are incorporated into an organization''s management
    system and fulfilled without exclusion.'
