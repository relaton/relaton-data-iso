abstract:
- language: en
  script: Latn
  content: This standard offers practical guidance on integrating health and wellbeing
    into community development efforts, with a specific focus on aligning with ISO
    37101's sustainability goals. It is designed to help local governments, organizations,
    and communities implement strategies focused on health, that promote wellbeing,
    physical, mental, social, and environmental health aspects. The scope of the standard
    covers the entire lifecycle of health and wellbeing management, from policy development
    to continuous improvement. It provides a framework for establishing health-promoting
    policies, ensuring that health considerations are embedded in community planning,
    governance, and urban design. By applying the standard, organizations and communities
    can develop strategies for creating environments that foster both mental and physical
    health, reduce health disparities, and improve the quality of life for all residents.
    This standard emphasizes the importance of urban planning and infrastructure,
    encouraging access to green spaces, recreational facilities, clean water, and
    safe environments, all of which are essential for health. Very significantly,
    it integrates with the 12 key areas of action outlined in ISO 37101, such as governance,
    education, and community infrastructure, ensuring that health and wellbeing are
    considered across all sectors of development. The standard provides guidance on
    planning and implementing initiatives tailored to local needs, using evidence-based
    approaches to tackle health challenges. Ultimately, the scope is about creating
    a holistic approach to health and wellbeing that aligns with sustainable development
    principles. By offering actionable steps for integration, monitoring, and evaluation,
    the standard empowers communities to create healthier, more resilient environments
    that support long-term wellbeing for current and future generations.
