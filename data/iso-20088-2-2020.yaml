abstract:
- language: en
  script: Latn
  content: This document describes a method for determining the resistance of Cryogenic
    Spill Protection (CSP) systems to vapour generated from a cryogenic liquid release
    where the liquid content is practically zero. It is applicable where CSP systems
    are installed on carbon steel. The test provided in this document is not applicable
    to high pressure cryogenic liquid releases that can be found in refrigeration
    circuits and in LNG streams immediately post-liquefaction.
