abstract:
- language: en
  script: Latn
  content: This document specifies procedure for determination of the stress-strain curve and the fracture strength of a free-standing ceramic coating by using four-point bending test at room temperature. This International Standard applies to thick quasi brittle coatings without any substrate. This test method can be used for material research, quality control, characterization and design data-generation purposes. NOTE Such materials can be used for thermal barrier coatings (TBCs) and can be elaborated by Atmospheric Plasma Spray (APS). The test method may also be used for any ceramic or composite material that exhibits dissymmetry between tensile and compressive behaviours.
