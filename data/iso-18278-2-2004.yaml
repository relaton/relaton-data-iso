abstract:
- language: en
  script: Latn
  content: ISO 18278-2:2004 specifies a laboratory test procedure for the determination
    of the acceptable welding current range and the assessment of electrode life using
    a multi-spot test with specific conditions. ISO 18278-2:2004 is applicable for
    the assessment of the weldability of uncoated and coated sheet steels of thicknesses
    up to 3 mm. The test procedure specified in this International Standard and the
    results obtained, apply only for the introduction of a new type or batch of material.
