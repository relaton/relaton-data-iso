abstract:
- language: en
  script: Latn
  content: ISO 4623-2:2003 describes a test procedure for assessing the protective
    action of coatings of paints or varnishes on aluminium against filiform corrosion
    arising from a scribe mark cut through the coating. It is only suitable for assessing
    the performance of the coating/substrate combination tested. It is not suitable
    for predicting the performance of the coating on different substrates.
