abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of gross alpha and
    gross beta activity concentration for alpha- and beta-emitting radionuclides using
    liquid scintillation counting (LSC). The method is applicable to all types of
    waters with a dry residue of less than 5 g/l and when no correction for colour
    quenching is necessary. Gross alpha and gross beta activity measurement is not
    intended to give an absolute determination of the activity concentration of all
    alpha- and beta-emitting radionuclides in a test sample, but is a screening analysis
    to ensure particular reference levels of specific alpha and beta emitters have
    not been exceeded. This type of determination is also known as gross alpha and
    beta index. Gross alpha and beta analysis is not expected to be as accurate nor
    as precise as specific radionuclide analysis after radiochemical separations.
    The method covers non-volatile radionuclides below 80 °C, since some gaseous or
    volatile radionuclides (e.g. radon and radioiodine) can be lost during the source
    preparation. The method is applicable to test samples of drinking water, rain
    water, surface and ground water as well as cooling water, industrial water, domestic
    and industrial waste water after proper sampling and test sample preparation (filtration
    when necessary and taking into account the amount of dissolved material in the
    water). The method described in this document is applicable in the event of an
    emergency situation, because the results can be obtained in less than 4 h by directly
    measuring water test samples without any treatment. It is the laboratory's responsibility
    to ensure the suitability of this test method for the water samples tested.
