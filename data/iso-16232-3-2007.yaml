abstract:
- language: en
  script: Latn
  content: ISO 16232-3:2007 describes the principles of extraction of contaminants
    from a component by pressure rinsing. It is preferably applied to components of
    which the surface to be examined is accessible by a jet of test liquid. This method
    can be employed on its own or in association with other methods of extraction
    described in the ISO 16232 series. Unless otherwise specified, ISO 16232-3:2007
    deals with particulate contamination only. It does not, therefore, cover appearance
    defects or contamination by liquid or gaseous materials. It covers the amount
    and the nature of residual particles resulting from manufacturing processes and
    from the environment.
