abstract:
- language: en
  script: Latn
  content: ISO 11418-7:2016 specifies the design, dimensions, material and requirements
    of screw-neck vials for pharmaceutical preparations. Screw-neck vials are applicable
    to primary packs used in direct contact with a drug. It applies to colourless
    or amber glass vials made from borosilicate or soda-lime-silica glass, made from
    glass tubing and intended to be used in the packaging, storage or transportation
    of pharmaceutical products. NOTE The potency, purity, stability and safety of
    a drug during its manufacture and storage can be strongly affected by the nature
    and performance of the primary pack.
