abstract:
- language: en
  script: Latn
  content: 'This specifies a method for determining whether an analytical system for
    biomethane composition analysis is fit for a defined purpose. It can be used:
    a) to determine a range for each specified component over which the errors and
    uncertainties in measured composition do not exceed a predefined measurement requirement,
    using specified calibration gas(es); b) to determine errors and uncertainties
    in a measured composition over a pre-defined range for each analyte, using specified
    calibration gas(es). It is assumed that the analytical system is applied to compositions
    that vary over the typical ranges found within biomethane. Examples specific to
    gas chromatography, spectroscopy and spectrometry are provided throughout the
    document.'
