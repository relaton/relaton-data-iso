abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for interior engineering design of
    rail vehicles to minimize the risk of death and injury to their occupants in the
    event of a collision or derailment. This document includes design and testing
    criteria for: - Heavy rail locomotives and passenger rolling stock - Light rail
    and metro vehicles - Trams and tram-trains The requirements apply to passenger
    areas. Staff areas (driver’s cab, crew compartments and catering facilities) are
    excluded. Specific requirements are set out for seats and tables, with guidance
    on the design of other interior features and equipment.'
