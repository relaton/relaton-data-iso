abstract:
- language: en
  script: Latn
  content: 'This part of ISO 10303 specifies the abstract test suite to be used in
    the conformance testing of implementations of ISO 10303-204. The following are
    within the scope of this part of ISO 10303: — the specification of the test purposes
    associated with ISO 10303-204; — the verdict criteria to be applied during conformance
    testing of an implementation of ISO 10303-204 using ISO 10303-21 or ISO 10303-22;
    — the abstract test cases to be used as the basis for the executable test cases
    for conformance testing. The following are outside the scope of this part of ISO
    10303: — the creation of executable test cases; — testing other than conformance
    testing; — other implementation methods.'
