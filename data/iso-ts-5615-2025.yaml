abstract:
- language: en
  script: Latn
  content: This document reviews the structural changes that have been precipitated
    by the COVID-19 pandemic in Remote Connected Care and Mobile Health (RCC-MH).
    The impact of the COVID-19 pandemic on care settings such as home and community
    care, acute care and outpatient care are reviewed discussing how well these healthcare
    environments were prepared to address the encountered connectivity challenges
    from a standards point of view. The current standards landscape is reviewed and
    gaps are identified leading to recommendations for future standards work.
