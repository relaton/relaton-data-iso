abstract:
- language: en
  script: Latn
  content: 'This document specifies formats for redundant encoding and packaging of
    live segmented media (REaP). This document specifies: a)       formats for Interchangeable
    Live Media Ingest and stream announcement; b)       format and segmentation strategy
    to generate interchangeable segments; c)        formats for generating interchangeable
    media presentation descriptions or playlists; d)       formats for efficient cloud
    storage access and archiving of live segmented media. e)       a protocol for
    communicating media descriptor files and fragmented media between encoders and
    packagers. REaP enables the following: 1)       failover support and rejoining
    of distributed components in the workflow (see Annex E); 2)       workflows for
    live with dynamic ad insertion (DAI) with a decisioning system. 3)       workflows
    with digital rights management (DRM) and content protection. 4)       Mixing file
    and live inputs. This document specifies additional constraint to formats defined
    in ISO/IEC 14496-12, ISO/IEC 23009-1, ISO/IEC 23000-19 and IETF RFC 8216.'
