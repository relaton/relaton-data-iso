abstract:
- language: en
  script: Latn
  content: 'ISO 10328:2005 specifies procedures for static and cyclic strength tests
    on lower-limb prostheses where, with one exception, compound loadings are produced
    by the application of a single test force. The compound loads in the test sample
    relate to the peak values of the components of loading which normally occur at
    different instants during the stance phase of walking. The tests described in
    ISO 10328:2005 comprise: principal static and cyclic tests for all components;a
    separate static test in torsion for all components;separate static and cyclic
    tests on ankle-foot devices and foot units for all ankle-foot devices as single
    components including ankle units or ankle attachments and all foot units as single
    components;a separate static ultimate strength test in maximum knee flexion on
    knee joints and associated parts for all knee units or knee-shin-assemblies and
    adjacent components that normally provide the flexion stop on a complete prosthesis;separate
    static and cyclic tests on knee locks for all mechanisms which lock the knee joint
    in the extended position of the knee unit or knee-shin-assembly. The tests described
    in this ISO 10328:2005 apply to specific types of ankle-disarticulation prostheses,
    to transtibial (below-knee), knee-disarticulation and transfemoral (above-knee)
    prostheses and to the distal (lower) part of hip-disarticulation and hemi-pelvectomy
    prostheses.'
