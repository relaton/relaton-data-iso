abstract:
- language: en
  script: Latn
  content: This document specifies a method of measuring the burning velocity (BV) of lower burning refrigerants (</= 10 cm/s) for use with other standards that utilize the BV for determining the safety classification of refrigerants (e.g. ISO 817 [2]) or that use the BV in establishing requirements on the use of slow burning refrigerants (e.g. ISO 817:2024 [2], 6.1.3.3).
