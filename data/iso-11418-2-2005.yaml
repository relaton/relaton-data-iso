abstract:
- language: en
  script: Latn
  content: ISO 11418-2:2005 specifies the design, dimensions, material and requirements
    of screw-neck glass bottles for pharmaceutical preparations in liquid form (syrups).
    Screw-neck glass bottles are applicable to primary packs used in direct contact
    with a drug. ISO 11418-2:2005 is applicable to screw-neck glass bottles used in
    pharmacy. Together with the corresponding closure systems, they serve for packaging
    of pharmaceutical preparations which are not intended for parenteral use.
