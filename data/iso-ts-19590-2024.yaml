abstract:
- language: en
  script: Latn
  content: This document specifies parameters, conditions and considerations for the
    reliable detection, characterization and quantification of nano-objects in aqueous
    suspension by spICP-MS. Particle number concentration, particle mass, particle
    mass concentration, particle spherical equivalent diameter, and number-based size
    distribution are considered the main measurands, but the technique also allows
    for determination of the dissolved element mass fraction in the sample. This document
    provides general guidelines and procedures related to spICP-MS application, and
    specifies minimal reporting requirements.
