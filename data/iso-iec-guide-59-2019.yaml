abstract:
- language: en
  script: Latn
  content: 'This document provides recommended standardization practices that are
    intended to support the application of the following: — the WTO TBT Committee
    decision on principles for the development of international standards, guides
    and recommendations (G/TBT/9, 13 November 2000); — the WTO TBT Agreement''s Code
    of Good Practice for the Preparation, Adoption and Application of Standards (Annex
    3 of the 1995 WTO TBT Agreement). This document is intended to be used by the
    national members of ISO and IEC, hereafter referred to as national bodies.'
