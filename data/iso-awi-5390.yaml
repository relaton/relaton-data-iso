  script: Latn
  content: Gives a classification of various types of compressors and some definitions. a list of equivalent English and French terms relating to some of the types is given in an annex, together with explanatory diagramms. Applies to compressors defined as machines for the displacement and compression of gaseous media for any pressure values, with the exeption of fans and vacuum pumps.
