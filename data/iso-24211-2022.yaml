abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the amount of
    selected carbonyl compounds (formaldehyde and acetaldehyde) as their 2,4-dinitrophenylhydrazones
    in vapour product emissions using reversed phase liquid chromatography coupled
    with ultraviolet or diode array detector (LC-UV or LC-DAD). This document does
    not include the analysis of other carbonyl compounds, such as acrolein and crotonaldehyde,
    due to previous work indicated issues associated with stability of these compounds
    in the e-liquid solutions that were used to evaluate method performance[4].
