abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1642:2014-08 specifies the application module for Assembly
    module usage view. The following are within the scope of ISO/TS 10303-1642:2014-08:
    the representation of the information needed to describe the interface definition
    of the assembly. This view may be used for the purpose of electrical and mechanical
    simulation and verification of performance when applied in the next level of assembly.
    The usage view may be treated as a requirement definition by a design organization
    with links established to relevant design details in an unpublished model maintained
    by that design organization. Flexibility is provided for the design organization
    to provide varying levels of details with respect to models including connector
    model fidelity. The usage view is a predefined model of a subset of documentation
    classified as interface control documententation. Shape properties may be provided
    to support various life cycle activities. terminal identification and location;terminal
    pin mapping identification;terminal shape properties;terminal functional properties;product
    external shape properties.'
