abstract:
- language: en
  script: Latn
  content: This document specifies safety requirements and test methods for cribs
    (including cradles, suspended cribs and bedside sleepers) for domestic and non-domestic
    use. The requirements apply to cribs with a maximum internal length of crib base
    of 900 mm which are intended to provide sleeping accommodation for infants, until
    they are able to sit unaided or pull or push themselves up on their hands and
    knees. This document does not apply to electrical safety. It does not apply to
    cribs used for medical purposes or used in hospitals.
