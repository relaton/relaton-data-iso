abstract:
- language: en
  script: Latn
  content: This International Standard provides methods for _ determining the composition
    of a calibration gas mixture by comparison with appropriate reference gas mixtures,
    _ calculating the uncertainty of the composition of a calibration gas mixture
    in relation to the known uncertainty of the composition of the reference gas mixtures
    with which it was compared, _ checking the composition attributed to a calibration
    gas mixture by comparison with appropriate reference gas mixtures, _ comparing
    the composition of several calibration gas mixtures, e.g. for the purpose of comparing
    different methods of gas mixture preparation, or for testing consistency among
    gas mixtures of closely related composition. NOTE In principle, the method described
    in this document is also applicable to the analysis of (largely) unknown samples
    instead of prospective calibration gas mixtures (i.e. gas mixtures which are intended
    for use as calibration gas mixtures). Such applications, however, require appropriate
    care and consideration of additional uncertainty components, for example concerning
    the effect of matrix differences between the reference gases used for calibration
    and the analysed sample.
