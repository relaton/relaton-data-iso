abstract:
- language: en
  script: Latn
  content: Intended for use by any person, concerned with the safety of textile machinery,
    for example textile machinery designers, manufacturers, users, system integrators
    and safety experts. Applicable to all textile machinery, plant and related equipment
    intended to be used in the textile industry for processing and finishing. Not
    applicable to machinery, plant and related equipment used for the manufacture
    of continous filaments, household and industrial textile goods, making-up of garments
    and machinery for laundering and drycleaning.
