abstract:
- language: en
  script: Latn
  content: This document specifies the minimum values for expected strength as a function
    of time and temperature in the form of reference lines, for use in calculations
    on crosslinked polyethylene (PE-X) pipes and crosslinked medium density polyethylene
    (PE-MDX) pipes. NOTE 1 This document is applicable for pipes with the minimum
    level of crosslinking after production in accordance with Clause 4. NOTE 2 The
    density range for medium density polyethylene is 926 kg/m3 to 940 kg/m3 in accordance
    with ISO 17855-1:2014[2].
