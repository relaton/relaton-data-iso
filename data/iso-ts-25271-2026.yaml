abstract:
- language: en
  script: Latn
  content: 'This document specifies the interface architecture of industrial digital twin systems, which is structured around three key elements: the digital twin, the physical twin and the interface that links them. Together, these elements form the essential framework of an industrial digital twin. The following are within the scope of this document: Defining the elements of industrial digital twin systems that embody a distinct architecture. Analysing the interactions among the three core elements of industrial digital twin systems Identifying the characteristics that distinguish industrial digital twin systems from related concepts or technologies Examining typical use cases that implement the three-element interface architecture The following is outside the scope of this document: Detailed applications of industrial digital twin systems'
