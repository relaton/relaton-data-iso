abstract:
- language: en
  script: Latn
  content: La présente norme internationale définit un bus d'entrées/sorties pour
    interconnecter des ordinateurs et des appareils périphériques. Elle définit les
    extensions apportées à l'ISO 9316:1989 -- Interface système pour petits ordinateurs
    que l'on réfère ici par SCSI-1. Elle fournit aussi une normalisation plus complète
    du jeu de commandes défini auparavant. Elle inclut les spécifications nécessaires
    des caractéristiques mécaniques, électriques et fonctionnelles de l'interface
    afin de permettre l'interopérabilité des appareils conformes. La présente norme
    internationale est référencée ici comme SCSI-2. Le terme SCSI est utilisé partout
    où il n'est pas nécessaire de faire une distinction entre les deux versions.
