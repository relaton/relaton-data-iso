abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements and provides guidance for establishing,
    implementing, maintaining and continually improving information and data quality
    within the context of an organization. The ISO 8000 MSS addresses all operational
    aspects of information and data management, including: — all processes that generate,
    obtain, confirm, transform, retain, retrieve, disseminate and dispose of data;
    — all processes that plan, control, assure and improve data quality; — all kinds
    of data, including but not limited to master data, transaction data and industrial
    data. The MSS places these aspects in the context of the harmonized ISO approach
    to management systems. This document is applicable to any organization, regardless
    of size, type and nature, that manages data of any kind.'
