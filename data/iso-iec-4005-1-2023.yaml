abstract:
- language: en
  script: Latn
  content: 'This document describes a communication model and requirements for unmanned
    aircraft area network (UAAN), which is a wireless distributed communication network
    for units related with UA services in level II. It describes: —     the communication
    structure and operation; —     the purpose of the three types of communication
    and related services; —     the interoperation of the three types of communication;
    —     the interworking with upper layers.'
