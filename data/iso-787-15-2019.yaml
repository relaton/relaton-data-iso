abstract:
- language: en
  script: Latn
  content: This document describes a general method of test for comparing the resistance
    to light of samples of similar types of coloured pigments (agreed reference pigment
    and test sample). Two methods of exposure are described in this document. In method
    A, the material is exposed under glass to natural light. In method B, the material
    is exposed to direct artificial light.
