abstract:
- language: en
  script: Latn
  content: This document specifies minimum requirements for light-weight protectors
    designed to provide protection for the eyes or eyes and face from biological hazards,
    such as pathogenic micro-organisms in human or other animal bodily fluids that
    can deposit onto the face or eyes. NOTE 1        Typical scenarios for use include
    healthcare, retail and transport settings. This document specifies requirements
    for both single-use (disposable) and re-usable (disinfectable) products or components.
    This document applies to all afocal (plano) and prescription lensed protectors
    and their components. This document does not cover the respiratory equipment required
    for protection against aerosols, which can be used in conjunction with these eye
    protectors, and for which other standards apply. This document does not apply
    to —     protectors intended for protection from specific hazards, e.g. mechanical
    hazards, harmful artificial optical radiation, dusts, molten metals, heat, flame,
    hot solids, harmful gases, vapours (refer to ISO 16321-1 to ISO 16321-3), —    
    protectors specifically for sports (refer to the ISO 18527 series), —     protectors
    for lasers (refer to ISO 19818-1), and —     respiratory protection against aerosols
    (refer to ISO/TS 16975-4). NOTE 2        Guidance related to the specific selection,
    use and maintenance is provided in Annex A. NOTE 3        Where eye and face protection
    is incorporated in protective equipment, such as a hood, full face respirators,
    powered air purifying respirators (PAPR) hoods and headtops, the relevant requirements
    of this document apply to the components providing eye and face protection.
