abstract:
- language: en
  script: Latn
  content: This document specifies requirements for high chromium white cast iron
    grit, as supplied for blast-cleaning processes. It specifies ranges of particle
    sizes, together with corresponding grade designations. Values are specified for
    hardness, density, defect/structural requirements, metallographic structure and
    chemical composition. The requirements specified in this document apply to abrasives
    supplied in the new condition only. They do not apply to abrasives either during
    or after use. High chromium white cast iron grits are used in both static and
    site blasting equipment. They are most often selected where there is a possibility
    for the recovery and re-use of the abrasive. NOTE 1 Although this document has
    been developed for preparation of steelwork, these materials are predominantly
    used for non-ferrous substrates. The properties specified will generally be appropriate
    for use when preparing other material surfaces, or components, using blast-cleaning
    techniques, and can be used for applications where no subsequent coating is applied.
    NOTE 2 Whenever dissimilar metals are used together, galvanic corrosion can occur.
