abstract:
- language: en
  script: Latn
  content: This part of ISO 1268 specifies a pultrusion-moulding method for preparing
    reinforced plastics test plates to be used for the preparation of test specimens
    to determine the mechanical and physical properties of the laminate. The method
    is applicable to laminates made from thermosetting or thermoplastic resins reinforced
    with glass, carbon or aramid fibres alone or in combination and in any form suitable
    for the pultrusion process (continuous rovings, tows, mats, fabrics or combinations
    of these). This part of ISO 1268 is intended to be read in conjunction with ISO
    1268-1.
