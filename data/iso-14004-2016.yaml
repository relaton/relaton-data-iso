abstract:
- language: en
  script: Latn
  content: 'ISO 14004:2016 provides guidance for an organization on the establishment,
    implementation, maintenance and improvement of a robust, credible and reliable
    environmental management system. The guidance provided is intended for an organization
    seeking to manage its environmental responsibilities in a systematic manner that
    contributes to the environmental pillar of sustainability. This International
    Standard helps an organization achieve the intended outcomes of its environmental
    management system, which provides value for the environment, the organization
    itself and interested parties. Consistent with the organization''s environmental
    policy, the intended outcomes of an environmental management system include: -
    enhancement of environmental performance; - fulfilment of compliance obligations;
    - achievement of environmental objectives. The guidance in this International
    Standard can help an organization to enhance its environmental performance, and
    enables the elements of the environmental management system to be integrated into
    its core business process. NOTE While the environmental management system is not
    intended to manage occupational health and safety issues, these can be included
    when an organization seeks to implement an integrated environmental and occupational
    health and safety management system. ISO 14004:2016 is applicable to any organization,
    regardless of size, type and nature, and applies to the environmental aspects
    of its activities, products and services that the organization determines it can
    either control or influence, considering a life cycle perspective. The guidance
    in this International Standard can be used in whole or in part to systematically
    improve environmental management. It serves to provide additional explanation
    of the concepts and requirements. While the guidance in this International Standard
    is consistent with the ISO 14001 environmental management system model, it is
    not intended to provide interpretations of the requirements of ISO 14001.'
