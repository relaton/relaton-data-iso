abstract:
- language: en
  script: Latn
  content: ISO/TS 17477:2003 provides a guideline on minimum requirements for acceptance
    tests by using practical test methods for the two-dimensional CO2-laser beam machines
    for welding and cutting, fixing a workpiece on the platen, by using moving optics.
    It is not applicable to the machines that use an articulated robot. ISO/TS 17477:2003
    does not cover hazard protection devices that shall be used with laser machining
    equipment such as the devices for discharging chips and particles that are generated
    during welding and cutting.
