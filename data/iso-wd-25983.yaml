abstract:
- language: en
  script: Latn
  content: This International Standard specifies the terms and definitions, classification
    and marking, technical requirements, test methods, inspection rules, signs, packaging,
    transportation and storage of bamboo winding composite pipes. It is applicable
    to bamboo winding composite pipe with a nominal diameter of 150 mm - 3,000 mm,
    pressure level not greater than 1.6 MPa, ring stiffness class of 5000 N/m2 - 20
    000 N/m2, operating ambient temperature of -40°C - 80°C, with a maximum temperature
    not exceeding 90°C for the transmitted medium, for hydraulic, municipal, industrial
    water supply and drainage works applications.
