abstract:
- language: en
  script: Latn
  content: ISO 12151-1:2010 specifies the general and dimensional requirements for
    the design and performance of hose fittings with O-ring face seal ends in accordance
    with ISO 8434-3, made of carbon steel, for nominal hose inside diameters of 6,3
    mm to 38 mm inclusive, in accordance with ISO 4397. Materials other than carbon
    steel can be supplied as agreed between the manufacturer and user. These hose
    fittings are used in hydraulic fluid power systems with hose that meets the requirements
    of the respective hose standards and in general applications with suitable hose.
