abstract:
- language: en
  script: Latn
  content: ISO 26945:2008 specifies electroplated coatings of tin-cobalt alloy of
    approximate composition 75 % (mass fraction) to 80 % (mass fraction) tin, remainder
    cobalt, as a substitute for decorative chromium coating of 0,1 µm to 0,3 µm thickness.
    Hardness and wear resistance properties of the coatings obtained are not equivalent
    to those of chromium coatings, but similar to those of tin-nickel alloy coatings.
    Tin-cobalt alloy coatings can be applied by rack or barrel plating processes.
    ISO 26945:2008 does not specify requirements for the surface condition of the
    basis metal prior to electroplating.
