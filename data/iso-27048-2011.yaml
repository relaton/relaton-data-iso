abstract:
- language: en
  script: Latn
  content: 'ISO 27048:2011 specifies the minimum requirements for the evaluation of
    data from the monitoring of workers occupationally exposed to the risk of internal
    contamination by radioactive substances. It presents procedures and assumptions
    for the standardised interpretation of monitoring data, in order to achieve acceptable
    levels of reliability. Those procedures allow the quantification of exposures
    for the documentation of compliance with regulations and radiation protection
    programmes. Limits are set for the applicability of the procedures in respect
    of the dose levels above which more sophisticated methods will have to be applied.
    ISO 27048:2011 addresses the following: procedures for dose assessment based on
    reference levels for routine and special monitoring programmes; assumptions for
    the selection of dose-critical parameter values; criteria for determining the
    significance of monitoring results; interpretation of workplace monitoring results;
    uncertainties arising from sampling, measurement techniques and working conditions;
    the special topics of interpretation of multiple data arising from different measurement
    methods at different times, handling data below the decision threshold, rogue
    data, and calculation of doses to the embryo/foetus and infant; reporting/documentation;
    quality assurance. It is not applicable to the following: dosimetry for litigation
    cases; modelling for the improvement of internal dosimetry; the potential influence
    of decorporation measures (e.g. administration of chelating agents); the investigation
    of the causes or implications of an exposure; dosimetry for contaminated wounds.'
