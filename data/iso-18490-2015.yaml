abstract:
- language: en
  script: Latn
  content: ISO 18490:2015 specifies the form of the optotype, the quality requirements
    for the chart, the test procedure, and the acceptance level for near vision acuity
    of NDT personnel. It also addresses the qualification requirements for personnel
    permitted to carry out the test. ISO 18490:2015 only addresses near vision acuity
    under defined conditions similar to those encountered during routine NDT inspection.
    It does not address an individual's overall visual acuity and users are advised
    to consider the need for a general eye examination by specialist medical personnel
    to ensure general vision acuity is appropriate for job function. ISO 18490:2015
    does not address colour vision requirements.
