abstract:
- language: en
  script: Latn
  content: ISO 13140-1:2016 specifies the test suite structure (TSS) and test purposes
    (TP) to evaluate the conformity of on-board units (OBU) and roadside equipment
    (RSE) to ISO 13141. It provides a basis for conformance tests for dedicated short-range
    communication (DSRC) equipment (on-board units and roadside units) to enable interoperability
    between different equipment supplied by different manufacturers.
