abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for test equipment to be used
    to: — test biological indicators for steam, ethylene oxide gas and dry heat sterilization
    processes for conformity to the requirements given in ISO 11138 series; — test
    chemical indicators for steam, ethylene oxide gas, dry heat and vaporized hydrogen
    peroxide sterilization processes for conformity to the requirements given in ISO
    11140‑1:2014. This document also provides informative methods useful in characterizing
    the performance of biological and chemical indicators for intended use and for
    routine quality control testing. This document does not specify requirements for
    test equipment for processes specifically for testing chemical and biological
    indicators intended to monitor isolator and room biodecontamination processes
    at atmospheric pressure. ISO 11138‑2:2017, ISO 11138‑3:2017, ISO 11138‑4:2017
    and ISO 11140‑1:2014 require the use of resistometers specified in this document,
    and these resistometers are used in conjunction with the test methods specified
    in the appropriate parts of ISO 11138 series and ISO 11140 series. Resistometers
    for low temperature steam and formaldehyde indicators are not included in this
    document. Test methods using laboratory apparatus for low temperature steam and
    formaldehyde are included in ISO 11138‑5:2017. Test equipment for testing Type
    2 (e.g. Bowie Dick) chemical indicators are specified in ISO 11140‑3:2007, ISO
    11140‑4:2007, and ISO 11140‑5:2007.'
