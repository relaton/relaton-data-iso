abstract:
- language: en
  script: Latn
  content: ISO 24276:2006 specifies how to use the standards for sampling strategies
    (EN/TS 21568), nucleic acid extraction (ISO 21571), qualitative nucleic acid analysis
    (ISO 21569) and quantitative nucleic acid analysis (ISO 21570), and their relationship
    in the analysis of genetically modified organisms in foodstuffs, and contains
    general definitions, requirements and guidelines for laboratory set-up, method
    validation requirements, description of methods and test reports. It has been
    established for food matrices, but could also be applied to other matrices (e.g.
    seeds, feed and plant samples from the environment).
