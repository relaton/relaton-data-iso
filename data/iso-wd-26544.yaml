abstract:
- language: en
  script: Latn
  content: This standard defines a classification of bicycle usage conditions and
    provide a method of identifying bicycles and components for use within this system.
    This classification gives a uniform set of usage definitions within the bicycle
    industry and it includes a set of graphical indicators to provide retailers and
    consumers with an indication of the intended use of a particular bicycle or aftermarket
    components.
