abstract:
- language: en
  script: Latn
  content: 'ISO 10211:2017 sets out the specifications for a three-dimensional and
    a two-dimensional geometrical model of a thermal bridge for the numerical calculation
    of - heat flows, in order to assess the overall heat loss from a building or part
    of it, and - minimum surface temperatures, in order to assess the risk of surface
    condensation. These specifications include the geometrical boundaries and subdivisions
    of the model, the thermal boundary conditions, and the thermal values and relationships
    to be used. ISO 10211:2017 is based upon the following assumptions: - all physical
    properties are independent of temperature; - there are no heat sources within
    the building element. ISO 10211:2017 can also be used for the derivation of linear
    and point thermal transmittances and of surface temperature factors. NOTE Table
    1 in the Introduction shows the relative position of ISO 10211:2017 within the
    set of EPB standards in the context of the modular structure as set out in ISO
    52000-1.'
