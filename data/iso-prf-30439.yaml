abstract:
- language: en
  script: Latn
  content: The scope will include an explanation of the value and importance of privacy
    in Human Resource Management (HRM) data policies, processes, and practices. It
    will include definitions of HRM data privacy, indications of legal implications
    for HRM data privacy, and provide guidance for data privacy at the various stages
    of HRM data policies, processes, and practices such as the creation, storage,
    usage, and removal of HRM data. It will also discuss the various roles and responsibilities
    within HRM data privacy and provide recommendations for data privacy practices.
    The moral principles of data practices is not within scope.
