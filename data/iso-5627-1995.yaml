abstract:
- language: en
  script: Latn
  content: Cancels and replaces the first edition (1984). Specifies a method of measuring
    the smoothness of paper and board, called the Bekk method. Especially recommended
    for smooth paper and boards. However for very smooth samples, measurement times
    may be impractically long. Not recommended for materials greater than 0,5 mm thick
    or very permeable papers and board, since the amount of air passing through the
    test piece can influence the result. Not recommended for newsprint and not suitable
    for rough papers and boards.
