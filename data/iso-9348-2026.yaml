abstract:
- language: en
  script: Latn
  content: This document specifies the digital measurement method for the determination
    of the anti-contamination of fabrics. This method is applicable to woven fabrics
    which have or have not been given an anti-contamination to particulate matter
    finish. It is especially suitable for measuring apparel fabrics. It is not intended
    for use in fabrics that react to UV light or allow particulate matter to penetrate
    into the structure of the fabric. It is not applied to fabrics for personal protective
    equipment. NOTE 1        Particulate matter (PM) is solid particles suspended
    in ambient air defined in ISO 16890-1. NOTE 2        In woven fabrics, particulate
    matter (PM) adheres to the fabric surface due to electrostatic or surface properties.
    In knitted and nonwoven fabrics, PM penetrates into the fabric structure, following
    a different mechanism. The conditions and procedures outlined in this test method
    are designed to ensure reproducibility and precision specifically when applied
    to woven fabrics.
