abstract:
- language: en
  script: Latn
  content: This document specifies a noise test code for determining, efficiently
    and under standardized conditions, the common noise emission characteristics of
    portable, hand-held, combustion engine powered forest and garden machines, and
    specific requirements for chain-saws, brush-cutters, grass-trimmers, edgers, pole-mounted
    powered pruners, hedge-trimmers and garden blowers/vacuums/knapsack mist blowers.
    Noise emission characteristics include the A-weighted emission sound pressure
    level at the operator position and the A-weighted sound power level. Noise test
    codes as described in this document enable the manufacturer to verify the effort
    regarding low noise design.
