abstract:
- language: en
  script: Latn
  content: 'This part of ISO 28598 provides attributes sampling procedures and single
    sampling plans for successive independent inspections of the same lot conducted
    by the supplier, customer and/or a third party. This part of ISO 28598 addresses:
    - supplier inspection (final inspection, product certification upon supplier''s
    request); - customer inspection (incoming inspection, surveillance, acceptance
    sampling); - third party inspection. This part of ISO 28598 may also be applicable
    when only one inspection is needed. A catalogue of single sampling plans is given,
    indexed by the normative quality limits (NQLs). This part of ISO 28598 provides
    sampling procedures for: - finished product; - components and discrete items;
    - operations; - discrete items and the processes that produce them; - data and
    records. Attributes sampling procedures are provided for inspection of an isolated
    lot or a continuing series of lots of a discrete product. These procedures are
    applicable when a normative quality limit (NQL) is given and expressed in terms
    of percent nonconforming or nonconformities per 100 items. This part of ISO 28598
    provides a co-ordinated system of supplier, customer and third party acceptance
    sampling procedures. It is also applicable to the case where a supplier individually,
    or on agreement with a customer, in a contract, specifies a lot quality criterion
    expressed in terms of an NQL. In either case, it provides a coherent methodology
    for designating lots as satisfactory or unsatisfactory for shipment and proposed
    use.'
