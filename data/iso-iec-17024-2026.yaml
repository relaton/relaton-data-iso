abstract:
- language: en
  script: Latn
  content: This document specifies principles and requirements for a body operating
    certification of persons and includes the development and maintenance of a scheme
    for certification of persons. NOTE 1        For the purposes of this document,
    the term "certification body" is used in place of the full term " body operating
    certification of persons", and the term "certification scheme" is used in place
    of the full term “scheme for certification of persons”. NOTE 2        Annex A
    contains principles for certification of persons.
