abstract:
- language: en
  script: Latn
  content: 'ISO 10256-1:2016 is part of ISO 10256 specifies general requirements for
    head, face, neck and body protectors (hereafter referred to as protectors) for
    use in ice hockey. ISO 10256-1:2016 is intended only for protectors used for ice
    hockey. Requirements are given for the following: a) terms and definitions; b)
    innocuousness; c) ergonomics; d) test report; e) permanent markings; f) information
    for users. In the ISO 10256 series, collateral standards specify performance requirements
    for protectors for use in ice hockey and are intended to be read in conjunction
    with ISO 10256-1:2016. NOTE 1 The requirements of a clause take precedence over
    a figure. NOTE 2 The intent is to reduce the risk of injury to an ice hockey player
    without compromising the form or appeal of the game. These standards presume that
    the rules of play for ice hockey will be followed by players and enforced by officials.'
