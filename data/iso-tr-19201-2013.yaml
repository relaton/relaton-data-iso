abstract:
- language: en
  script: Latn
  content: ISO/TR 19201:2013 provides guidance for selecting appropriate vibration
    standards for specific machine types, and thus selecting the appropriate vibration
    measurement and evaluation method. Synopses are given of ISO 10816 (evaluation
    of machine vibration on non-rotating parts) and ISO 7919 (evaluation of machine
    vibration on rotating parts), together with further International Standards related
    to machinery. ISO/TR 19201:2013 provides an overview of the relevant International
    Standards, giving a summary of their scopes. It also provides a theoretical, analytical
    basis for establishing whether vibration measurements should be carried out on
    non-rotating parts, rotating shafts or both for those machines where no previous
    experience exists. It is not intended to supersede established manufacturers'
    or users' practical experience with specific machine types since there can be
    specific features associated with a particular machine which lead to a different
    selection of the most relevant measurement procedure. The aim of ISO/TR 19201:2013
    is not to equip the reader with all the technical details provided in the International
    Standards necessary to carry out a measurement or evaluation task on a particular
    machine; rather it guides the reader to the appropriate International Standards.
    It is these International Standards that provide the necessary details; and then,
    with suitable training, the reader is in a position to carry out the measurement
    or evaluation task.
