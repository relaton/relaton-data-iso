abstract:
- language: en
  script: Latn
  content: This document specifies the technical requirements for injection/falloff
    testing in coalbed methane wells, covering test design, equipment configuration,
    operating procedures, data interpretation, and well test report preparation. It
    is applicable to testing during drilling or after completion of coalbed methane
    wells, with the aim of obtaining key reservoir parameters including permeability,
    formation pressure, skin factor, and radius of investigation.
