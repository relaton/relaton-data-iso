abstract:
- language: en
  script: Latn
  content: This document specifies the terms and definitions for abalone seed production and sea-based farming, and sets out the technical requirements for seed production and raft culture. This document applies primarily to the seed production and sea-based farming of Pacific abalone (Haliotis discus hannai) and hybrid abalone (H. discus hannai (♀) × H. fulgens (♂)); the culture of other abalone species may be carried out with reference to this document.
