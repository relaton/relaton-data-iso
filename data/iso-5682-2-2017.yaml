abstract:
- language: en
  script: Latn
  content: ISO 5682-2:2017 is applicable for sprayers intended to apply liquid over
    a horizontal surface. ISO 5682-2:2017 specifies test methods to assess sprayed
    liquid horizontal transverse distribution. Methods are based on sprayed liquid
    volume measurement, nozzle flow rate measurement or nozzle tip pressure measurement.
    ISO 5682-2:2017 does not cover aerial sprayers. Hydraulic sprayers use a range
    of design features to deliver and control spray. The test methods provided in
    this document are all useful but don't give the same information. They are complementary.
    Some test methods are not suitable for all sprayer types. Applicable test methods
    are described in an informative annex.
