abstract:
- language: en
  script: Latn
  content: This document specifies equipment requirements, the execution of and reporting
    on the Ménard pressuremeter test. This document describes the procedure for conducting
    a Ménard pressuremeter test in natural grounds, treated or untreated fills, either
    on land or off-shore. The pressuremeter tests results of this document are suited
    to a quantitative determination of ground strength and deformation parameters.
    They can yield lithological information in conjunction with measuring while drilling
    performed when creating the borehole (according to ISO 22476-15). They can also
    be combined with direct investigation (e.g. sampling according to ISO 22475-1)
    or compared with other in situ tests (see EN 1997-2).
