abstract:
- language: en
  script: Latn
  content: The primary purpose of ISO 16757 is the provision of data structures for
    electronic product catalogues to transmit building services product data automatically
    into models of building services software applications. This includes a meta model
    for the specification of product classes and their properties and a meta model
    for the product data which is exchanged in product catalogues. Product data has
    to follow the specifications for their product groups. ISO 16757-1:2015 specifies
    the underlying concepts, a generic model specifying the available modelling elements
    and their relationships, and a framework for the specification of the Content
    Parts by describing the elements which are to be provided by these Parts.
