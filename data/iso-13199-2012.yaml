abstract:
- language: en
  script: Latn
  content: ISO 13199:2012 specifies the principle, the essential performance criteria
    and quality assurance/quality control (QA/QC) procedures of an automatic method
    for measuring total volatile organic compound (TVOC) content in waste gases of
    stationary sources, using a non-dispersive infrared absorption (NDIR) analyser
    equipped with a catalytic converter which oxidizes VOC to carbon dioxide. This
    method is suitable for the measurement of TVOC emissions from non-combustion processes.
    This method allows continuous monitoring with permanently installed measuring
    systems, as well as intermittent measurements of TVOC emissions. The method has
    been tested on field operation for painting and printing processes, where TVOC
    concentrations in the waste gases were from about 70 mg/m3 to 600 mg/m3.
