abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of ammonia in tobacco
    and tobacco products using ion chromatographic analysis. It is applicable to tobacco,
    processed tobaccos, smokeless tobacco products and cigarette filler. The ammonia
    calibration range specified in the method is from 0,100 μg/ml to 10,0 μg/ml. This
    range correlates to 10 µg/g to 1 000 µg/g ammonia in tobacco. Samples with higher
    levels of ammonia can be diluted prior to analysis to bring the samples within
    the calibration range.
