abstract:
- language: en
  script: Latn
  content: 'This document presents a reference model for specifying requirements for
    VR/AR/MR-based systems integration. It identifies integration technologies enabling
    visual, immersive, and interactive application systems and provides a data model
    supporting the development of VR/AR/MR-based applications across systems integration
    domains. This work will: • Define a reference model for systems integration in
    the development of VR/AR/MR-based information services • Specify scene graph representations
    for VR/AR/MR systems integration • Specify semantic information processing for
    VR/AR/MR systems integration • Define integration interfaces including semantic
    information, for VR/AR/MR systems integration • Provide use cases for integrating
    VR/AR/MR technologies with domain-specific systems and information such as education
    and healthcare Device hardware technologies for VR/AR/MR systems integration are
    excluded from this document.'
