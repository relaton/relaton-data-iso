abstract:
- language: en
  script: Latn
  content: This document specifies techniques of radiographic testing of fusion-welded
    joints in metallic materials using industrial radiographic film techniques with
    the object of enabling satisfactory and repeatable results. The techniques are
    based on generally recognized practice and fundamental theory of the subject.
    It applies to the joints of plates and pipes in metallic materials. Besides its
    conventional meaning, “pipe” as used in this document covers other cylindrical
    bodies, such as tubes, penstocks, boiler drums and pressure vessels. This document
    does not specify acceptance levels for any of the indications found on the radiographs.
    The ISO 10675 series provides information on acceptance levels for weld evaluation.
    If contracting parties apply lower test criteria, it is possible that the quality
    achieved will be significantly lower than when this document is strictly applied.
