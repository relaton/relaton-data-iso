abstract:
- language: en
  script: Latn
  content: This document gives guidance on the sample preparation of milk and milk products for physical and chemical analysis, including analysis by applying instrumental methods. This document specifies the (sub)sampling, and sample preparation steps carried out after sampling according to ISO 707 | IDF 50 and prior to method-specific sample preparations, e.g. as with analytical methods. NOTE Analysis on volatile substances, minor components or allergens can require additional precautionary measures in sample preparation in order to avoid loss of or contamination with one or more target analytes.
