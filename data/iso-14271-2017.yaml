abstract:
- language: en
  script: Latn
  content: ISO 14271:2017 specifies the procedures for the hardness testing of etched
    cross-sections of resistance spot, projection, and seam welds. The aim of the
    hardness tests is to determine the Vickers hardness, in the low-force or microhardness
    range, of the weld nugget, the heat affected zone, and parent material in ferrous
    or non-ferrous metals for welds made in sheets of thickness 0,5 mm to 6 mm.
