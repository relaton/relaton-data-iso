abstract:
- language: en
  script: Latn
  content: ISO 5667-19:2004 provides guidance for the sampling of sediments in marine
    areas for analyses of their physical and chemical properties for monitoring purposes
    and environmental assessments. It encompasses sampling strategy, requirements
    for sampling devices, observations made and information obtained during sampling,
    handling sediment samples, and packaging and storage of sediment samples. ISO
    5667-19:2004 does not provide guidelines for data treatment and analysis. ISO
    5667-19:2004 is not intended to give guidance for sampling of freshwater sediments.
