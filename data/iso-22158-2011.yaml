abstract:
- language: en
  script: Latn
  content: ISO 22158:2011 specifies the minimum communication requirements for water
    meters which have the capability to exchange or provide data by means of an electronic
    interface. ISO 22158:2011 only specifies the interface conditions present at the
    electrical and electronic connections of water meters and does not prescribe any
    specific equipment such as transponders and inductive pads, which might be connected
    to the water meter for automatic meter reading or remote meter reading purposes.
