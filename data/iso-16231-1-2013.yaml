abstract:
- language: en
  script: Latn
  content: ISO 16231-1:2013 specifies principles for the assessment of stability with
    respect to the design and construction of self-propelled ride-on machines used
    in agriculture and the hazard of rolling over or tipping over, or both when the
    machine is used as intended and under the conditions foreseeable by the manufacturer.
    In addition, it specifies the type of information on safe working practices (including
    residual risks) to be provided by the manufacturer. ISO 16231-1:2013 is not applicable
    to ? machines with an unladen mass lower than 400 kg; ? machines covered by other
    machine specific standards dealing with the protection against rollover and tip-over
    (e.g. agricultural tractors, forestry tractors); ? hazards associated with road
    transport operations; ? free fall events; ? rollover as a result of impact collisions.
    ISO 16231-1:2013 is not applicable to machines manufactured before the date of
    its publication.
