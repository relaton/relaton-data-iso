abstract:
- language: en
  script: Latn
  content: ISO 20301:2014 describes general characteristics of machine-readable cards
    used in the field of healthcare. This International Standard is designed to confirm
    the identities of both the healthcare application provider and the healthcare
    cardholder in order that information can be exchanged by using cards issued for
    healthcare service. This International Standard focuses on the machine-readable
    cards of ID-1 type defined in ISO/IEC 7810 that are issued for healthcare services
    provided in a service area that crosses the national borders of two or more countries/areas.
    This International Standard applies directly or refers to existing ISO standards
    for the physical characteristics and recording techniques. Security issues follow
    the requirements of each healthcare card system. In addition, this International
    Standard regulates the visual information written on the card.
