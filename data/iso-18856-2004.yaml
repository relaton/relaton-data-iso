abstract:
- language: en
  script: Latn
  content: ISO 18856:2004 specifies a method for the determination of phthalates in
    water after solid phase extraction and gas chromatography/mass spectrometry. This
    method is applicable to the determination of phthalates in ground water, surface
    water, wastewater and drinking water in mass concentrations ranging from above
    0,02 microgram per litre up to 0,150 microgram per litre, depending on the individual
    substance and the value of the blank. The applicability of this method to other
    phthalates not specified is not excluded, but it is necessary to determine its
    applicability in each case.
