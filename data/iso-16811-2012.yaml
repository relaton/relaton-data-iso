abstract:
- language: en
  script: Latn
  content: ISO 16811:2012 specifies the general rules for setting the timebase range
    and sensitivity (i.e. gain adjustment) of a manually operated ultrasonic flaw
    detector with A-scan display in order that reproducible measurements may be made
    of the location and echo height of a reflector. ISO 16811:2012 is applicable to
    techniques employing a single contact probe with either a single or twin transducers,
    but excludes the immersion technique and techniques employing more than one probe.
