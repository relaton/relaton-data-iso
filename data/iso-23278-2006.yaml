abstract:
- language: en
  script: Latn
  content: ISO 23278:2006 specifies acceptance levels for indications from imperfections
    in ferromagnetic steel welds detected by magnetic particle testing. The acceptance
    levels in ISO 23278:2006 are primarily intended for use during manufacture examination,
    but where appropriate they can be used for in-service inspection. These acceptance
    levels can be related to welding standards, application standards, specifications
    or codes.
