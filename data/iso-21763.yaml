abstract:
- language: en
  script: Latn
  content: This standard is to be guidelines for the smart manufacturing technologies
    that can be applied for smart plants in iron and steel industries and also guidelines
    for their basic requirements suggested for smart manufacturing technologies in
    the application outlines. This standard can be the reference guidelines for the
    iron and steel industry to formulate such as smart factory upgrading plans, and
    productivity or product quality improvement, and can be used by iron and steel
    manufacturing enterprises, smart manufacturing technologies vendors for iron and
    steel industries, and public sectors relating to the iron and steel industries,
    for any steel plants regardless of its manufacturing process routes, equipment
    configurations, their sizes, geographic location, or products it makes. This standard,
    however, shall not be used for any kind of evaluations nor grade-ratings for steel
    plants/companies.
