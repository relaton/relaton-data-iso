abstract:
- language: en
  script: Latn
  content: This document provides guidelines to organizations for establishing general
    and specific strategies to prevent and reduce crime and the fear of crime at new
    or existing residential facilities, in single or multiple units. This document
    builds on the concepts and processes described in ISO 22341, in the context of
    residential facilities. It provides recommendations on countermeasures and actions
    to address crime and security risks to people and property, in dwellings and their
    immediate surroundings, by implementing crime prevention through environmental
    design (CPTED) strategies in an effective and efficient manner. Within this document,
    the term “security” is used in a broad manner to include all crime, safety and
    security-specific applications. Therefore, this document is applicable to public
    and private organizations, regardless of type, size or nature. This document applies
    to organizations responsible for the residential facility including a real estate
    company, developer or landlord.
