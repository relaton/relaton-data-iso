abstract:
- language: en
  script: Latn
  content: This document specifies the methodology of modeling human thermal sensation based on skin temperature in a moderate thermal environment, including data preparation for modeling, the method of modeling and model evaluation for human thermal sensation based on the skin temperature. It is intended for use in the design of new indoor and vehicle interior thermal environment, or the assessment of existing ones where thermal comfort is desirable and on the condition of no sweating for occupant, but where moderate deviations from thermal comfort occur.
