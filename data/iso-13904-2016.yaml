abstract:
- language: en
  script: Latn
  content: ISO 13904:2016 specifies a method for determination of the total and free
    tryptophan (Trp) content in feeding stuffs (e.g. complete and complementary feeds,
    supplementary feeds, raw materials, ingredients, and concentrates) and determination
    of free tryptophan in commercial pure substances and premixtures containing more
    than 2 % of tryptophan. It does not distinguish between D- and L-forms.
