abstract:
- language: en
  script: Latn
  content: 'This standard describes the requirements to be satisfied by domain-specific
    reference architectures that address entities of interest such as software, systems,
    enterprises, missions, systems of systems, families of systems, products (goods
    or services), product lines, service lines, technologies and business domains.
    The proposed standard will be universally applicable to — organizations seeking
    sustained success through the implementation of architecture practices, — organizations
    and interested parties seeking to improve communication through a common understanding
    of the vocabulary and concepts used in reference architectures, — organizations
    performing conformity assessments against the requirements of reference- architecture-related
    standards and specifications, — organizations that serve as certification authorities
    that will benefit from the use of reference architectures, — organizations that
    need to mandate use of reference architectures, — providers of reference architectures,
    guidelines, training, education, evaluation or recommendations in architecture
    practice, — developers of reference-architecture standards, reference models,
    and related tools/technologies, — users of reference architectures. The application
    areas of this standard include, but are not limited to, the following: artificial
    intelligence (AI), machine learning (ML), Internet of Things (IoT), cloud computing,
    big data, smart cities, smart manufacturing, cybersecurity, digital twin, telecommunications,
    aerospace, defense, banking, finance, insurance, energy, automotive, logistics,
    hospitality, healthcare, supply chain, transportation, manufacturing, agriculture,
    production, and infrastructure. The proposed deliverable is part of the ISO 42000
    architecture standards (e.g., 42010, 42020, 42030).'
