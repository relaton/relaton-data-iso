abstract:
- language: en
  script: Latn
  content: ISO 12242:2012 specifies requirements and recommendations for ultrasonic
    liquid flowmeters, which utilize the transit time of ultrasonic signals to measure
    the flow of single-phase homogenous liquids in closed conduits. There are no limits
    on the minimum or maximum sizes of the meter. ISO 12242:2012 specifies performance,
    calibration and output characteristics of ultrasonic meters (USMs) for liquid
    flow measurement and deals with installation conditions. It covers installation
    with and without a dedicated proving (calibration) system. It covers both in-line
    and clamp-on transducers (used in configurations in which the beam is non-refracted
    and in those in which it is refracted). Included are both meters incorporating
    meter bodies and meters with field-mounted transducers.
