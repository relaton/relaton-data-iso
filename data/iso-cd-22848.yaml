abstract:
- language: en
  script: Latn
  content: This document specifies a test method for determining the stress corrosion crack (SCC) growth rate of steels and alloys under static-load conditions in high-temperature water, such as the simulated water environment of light water reactors. The crack length of the specimen is monitored by a potential drop method (PDM) during the test in an autoclave. The test method is applicable to stainless steels, nickel base alloys, low alloy steels, carbon steels and other alloys.
