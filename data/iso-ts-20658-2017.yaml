abstract:
- language: en
  script: Latn
  content: ISO/TS 20658:2017 specifies requirements and good practice recommendations
    for the collection, transport, receipt and handling of samples intended for medical
    laboratory examinations. ISO/TS 20658:2017 is applicable to medical laboratories
    and other medical services involved in laboratory pre-examination processes that
    include the examination request, patient preparation and identification, sample
    collection, transport, receipt and storage. It may also be applicable to some
    biobanks. ISO/TS 20658:2017 does not apply to blood and blood products intended
    for transfusion.
