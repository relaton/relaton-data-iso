abstract:
- language: en
  script: Latn
  content: 'This document describes the tread test method for building photovoltaic
    glass modules, which is to determine the tread ability of the glass PV module
    integrated with profiled steel sheet during installation or maintenance. The content
    includes but is not limited to terms and definitions, general requirements, test
    equipment, test methods, pass or fail criteria and report. A series of reliability
    tests are carried out according to the test requirements of IEC 61215 and IEC
    61730, including: visual inspection, initial steady state, power test under STC
    conditions, insulation test, wet leakage test and EL detection, treat test+ DH1000,
    treat test+TC200, treat test+ the dynamic mechanical load test+TC50+HF10, and
    other reliability tests to determine the tread effecting for the glass photovoltaic
    modules.'
