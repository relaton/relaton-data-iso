abstract:
- language: en
  script: Latn
  content: ISO 22398:2013 recommends good practice and guidelines for an organization
    to plan, conduct, and improve its exercise projects which may be organized within
    an exercise programme. It is applicable to all organizations regardless of type,
    size or nature, whether private or public. The guidance can be adapted to the
    needs, objectives, resources, and constraints of the organization. It is intended
    for use by anyone with responsibility for ensuring the competence of the organization's
    personnel, particularly the leadership of the organization, and those responsible
    for managing exercise programmes and exercise projects.
