abstract:
- language: en
  script: Latn
  content: This proposal specifies a method for performing the secondary work embrittlement
    test and the determination of Secondary Work Embrittlement Temperature (SWET)
    of metallic sheets and/or strips for stamping. This document is applicable to
    sheets and coils of steels and/or Al-Mg light alloys, having thicknesses from
    0,45 mm to 2,50 mm. The test includes the preparation of cup samples with specific
    geometric sizes by deep drawing process. Then, these cup samples are cooled at
    various low temperature and impacted by using drop-weight test equipment (Recommended
    impact energy 98J for steel materials and 49J for Al-Mg light alloys respectively).
    The highest temperature at which no less than 2 cups of the total 8 cups fracture
    in a brittle manner is determined as Secondary Work Embrittlement Temperature,
    SWET.
