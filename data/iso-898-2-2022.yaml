abstract:
- language: en
  script: Latn
  content: 'This document specifies the mechanical and physical properties of nuts
    made of non-alloy steel or alloy steel, when tested at the ambient temperature
    range of 10 °C to 35 °C. This document applies to nuts: —    with ISO metric thread
    (see ISO 68-1), —    with diameter/pitch combinations according to ISO 261 and
    ISO 262, —    with coarse pitch thread M5 to M39, and fine pitch thread M8×1 to
    M39×3, —    with thread tolerances according to ISO 965-1, ISO 965-2 or ISO 965-5,
    —    with specified property classes 04, 05, 5, 6, 8, 10 and 12 including proof
    load, —    of three different nut styles (see 5.1): regular nuts (style 1), high
    nuts (style 2) and thin nuts (style 0), —    with a minimum outside diameter or
    width across flats s ≥ 1,45D, —    able to mate with bolts, screws and studs with
    property classes in accordance with ISO 898-1 (see Annex B), and —    intended
    to be used in applications ranging from –50 °C to +150 °C, or up to +300 °C. WARNING
    — Nuts conforming to the requirements of this document are tested at the ambient
    temperature range of 10 °C to 35 °C and are used in applications ranging from
    –50 °C to +150 °C; however, these nuts are also used outside this range and up
    to +300 °C for specific applications. It is possible that they do not retain the
    specified mechanical and physical properties at lower and/or elevated temperatures.
    Therefore, it is the responsibility of the user to determine the appropriate choices
    based on the service environment conditions of the assembly (see also 7.1). For
    additional specifications applicable to hot dip galvanized nuts, see ISO 10684.
    For nuts designed for particular applications, see ISO/TR 16224. This document
    does not specify requirements for functional properties such as: —    prevailing
    torque properties (see ISO 2320), —    torque/clamp force properties (see ISO 16047
    for test method), —    weldability, or —    corrosion resistance.'
