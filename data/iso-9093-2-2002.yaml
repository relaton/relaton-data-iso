abstract:
- language: en
  script: Latn
  content: ISO 9093-2:2002 specifies requirements for the manufacture and installation
    of non-metallic through-hull fittings and/or assemblies comprising through-hull
    fittings, seacocks, hose fittings and/or drain plugs and components attached thereto,
    used in small craft of up to 24 m length of hull. ISO 9093-2:2002 is not applicable
    to engine exhaust fittings and sail drive through-hull connections.
