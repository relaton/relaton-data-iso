abstract:
- language: en
  script: Latn
  content: 'This document gives guidance on practices of earned value management in
    project, programme and portfolio management. It is applicable to any type of organization,
    including public or private, and any size or sector, as well as any type of project,
    or programme or portfolio in terms of complexity, size or duration. This document
    provides the following: descriptions of the purpose and benefits of earned value
    management; integration and relationship with project, programme and portfolio
    management; overview of the processes and process descriptions; basic needs for
    an earned value management system; use of an earned value management system. This
    document does not provide guidance on the use of specific processes, methods or
    tools in the practice of earned value management. Annex A describes an integrated
    baseline review. It is contained in an annex since it is used by government organizations
    and their contractors but is not used by most organizations, most of the time.'
