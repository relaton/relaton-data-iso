abstract:
- language: en
  script: Latn
  content: 'This document specifies the technical requirements for the lean application
    layer for MOST, a synchronous time-division-multiplexing network. The lean application
    layer includes a specification of the services available to control the configuration
    and behaviour of the network management. The lean application layer covers the
    definition of: —    node kinds, —    node addressing, —    data transport, —   
    network configuration, —    lean network services interface, —    network management,
    including connection management, —    diagnosis, and —    timing definitions.'
