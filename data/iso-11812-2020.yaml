abstract:
- language: en
  script: Latn
  content: This document specifies watertightness, draining time and sill heights
    requirements for watertight and quick-draining recesses and cockpits in small
    craft of up to 24 m load line length (see Reference [1]). Recesses located in
    elevated parts of the craft are covered by this document. This document does not
    specify requirements for the size, the shape and the location of recesses or cockpits.
    It only considers draining by gravity, and not by pumping or other methods. It
    only considers normal operation of the craft, but unattended craft recess issues
    are out of scope. This document does not guarantee that the water contained in
    a watertight or quick-draining recess or cockpit will not affect the stability
    and buoyancy of the craft, which are covered by ISO 12217-1, ISO 12217-2 and ISO
    12217-3.
