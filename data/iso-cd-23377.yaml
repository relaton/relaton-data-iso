abstract:
- language: en
  script: Latn
  content: 'This document specifies a method to determine the total content of the
    following bisphenols: — Bisphenol A — Bisphenol B — Bisphenol F — Bisphenol S
    This test method is applicable to the footwear materials textiles, polymers, and
    paperboards. For leather ISO/DIS 11936 shall be applied. This method requires
    the use of liquid chromatography (LC) with triple quadrupole mass spectrometer
    (MSMS). NOTE 1 This method can also be used for other bisphenols if they are validated
    by the laboratory.'
