abstract:
- language: en
  script: Latn
  content: Wheelchair seating assessment is an evaluation of a person and an individual’s environment that includes gathering subjective and objective data for the purposes of selecting the most appropriate wheelchair seating, and positioning accessories, to support or improve wellbeing, function, and mobility of the wheelchair occupant. This document outlines components of a minimum data set for wheelchair seating assessment obtained by gathering subjective and objective data from and of the occupant, and directs the reader to comprehensive assessment tools and resources available, including specialty ones. This document covers the assessment processes related to the selection and prescription of seating components, including seat cushions, back supports, head supports, and other postural support devices that meet the occupant’s tissue integrity, positioning, and functionality needs. This document does not cover the assessment for, nor the selection of, the wheelchair base to, or of. which the seating system is a component, though it is acknowledged that seating is not likely to be used independently from the wheelchair frame with which it is interfaced.
