abstract:
- language: en
  script: Latn
  content: ISO/TR 13570-2:2014 lists the typical values and recommended limits of
    the dimensions obtained from measurements taken in accordance with ISO 7176‑5.
    ISO/TR 13570-2:2014 lists the typical values and recommended limits of the important
    wheelchair dimensions (ready for occupation and folded or dismantled), space for
    pivoting or reversing between limiting walls and some dimensions worthwhile to
    estimate usability of the wheelchair as well as determination of the mass of the
    wheelchair. It is intended for use of prescribers, clinicians, wheelchair occupants
    or manufacturers. ISO/TR 13570-2:2014 lists the typical values and recommended
    limits of the dimensions when the wheelchair is occupied and some operating areas
    when performing special tasks encountered in every day's life. ISO/TR 13570-2:2014
    lists the typical values and recommended limits of the technical dimensions critical
    to the performance of the wheelchair. ISO/TR 13570-2:2014 applies to manual wheelchairs
    and electrically powered wheelchairs (including scooters).
