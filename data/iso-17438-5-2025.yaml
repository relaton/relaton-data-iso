abstract:
- language: en
  script: Latn
  content: 'This document defines detailed use cases, requirements and message specifications
    for supporting central ITS station based indoor positioning to provide indoor
    navigation functionality between a personal/vehicle (P/V) ITS station and the
    central ITS station. This document is only applicable to the core flow for the
    central ITS station based indoor positioning. The following issues which are adjunctive
    but essential for commercial navigation services are beyond the scope of this
    document: —    authorized and authenticated access of users and services, including
    security; —    payment; —    preparation of indoor data which are necessary for
    indoor navigation; —    low-level communication protocols required to transfer
    and share data from and to a roadside ITS station or a central ITS station; —   
    other issues dependent on implementation of an instance of indoor navigation.'
