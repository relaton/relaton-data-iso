abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the elements
    aluminium, antimony, arsenic, barium, beryllium, bismuth, boron, cadmium, caesium,
    calcium, cerium, chromium, cobalt, copper, dysprosium, erbium, gadolinium, gallium,
    germanium, gold, hafnium, holmium, indium, iridium, iron, lanthanum, lead, lithium,
    lutetium, magnesium, manganese, mercury, molybdenum, neodymium, nickel, palladium,
    phosphorus, platinum, potassium, praseodymium, rubidium, rhenium, rhodium, ruthenium,
    samarium, scandium, selenium, silver, sodium, strontium, terbium, tellurium, thorium,
    thallium, thulium, tin, titanium, tungsten, uranium and its isotopes, vanadium,
    yttrium, ytterbium, zinc and zirconium in water (e.g. drinking water, surface
    water, ground water, waste water and eluates). Taking into account the specific
    and additionally occurring interferences, these elements can be determined in
    water and digests of water and sludge (e.g. digests of water as described in ISO 15587-1
    or ISO 15587-2). The working range depends on the matrix and the interferences
    encountered. In drinking water and relatively unpolluted waters, the limit of
    quantification (LOQ) lies between 0,002 µg/l and 1,0 µg/l for most elements (see
    Table 1). The working range typically covers concentrations between several ng/l
    and mg/l depending on the element and specified requirements. The quantification
    limits of most elements are affected by blank contamination and depend predominantly
    on the laboratory air-handling facilities available on the purity of reagents
    and the cleanliness of glassware. The lower limit of quantification is higher
    in cases where the determination suffers from interferences (see Clause 5) or
    memory effects (see ISO 17294-1). Elements other than those mentioned in the scope
    can also be determined according to this document provided that the user of the
    document is able to validate the method appropriately (e.g. interferences, sensitivity,
    repeatability, recovery).
