abstract:
- language: en
  script: Latn
  content: This Technical Report establishes a list of critical chemical substances
    potentially present in footwear and footwear components. This Technical Report
    describes the critical chemical substances, their potential risks, the materials
    in which they can be found and the test method(s) which can be used to quantify
    them. It does not include requirements; it is the responsibility of the user of
    this Technical Report to fix his/her level of acceptance, for instance using a
    defined concentration or detection limit or quantification limit. NOTE The proposed
    test methods indicate the state of the art. Some substances do not include a test
    method, as no test method is available at the time of publication of this Technical
    Report. If possible, it is intended to include a test method in a revision of
    this Technical Report. This Technical Report applies to any kind of footwear and
    footwear components.
