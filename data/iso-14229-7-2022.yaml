abstract:
- language: en
  script: Latn
  content: 'This document specifies an application profile for the implementation
    of unified diagnostic services (UDS) local interconnect network (LIN) in road
    vehicles (UDSonLIN). UDSonLIN references ISO 14229‑1 and ISO 14229‑2 and specifies
    implementation requirements of the diagnostic services to be used for diagnostic
    communication on Local Interconnect Network. This document includes: —    additional
    requirements specific to the implementation of UDS on local interconnect network;
    and —    specific restrictions in the implementation of UDS on local interconnect
    network.'
