abstract:
- language: en
  script: Latn
  content: 'ISO 16741:2015 specifies the information to be recorded in farmed crustacean
    supply chains in order to establish the traceability of products originating from
    farm raised crustaceans. It specifies how farmed crustacean products traded are
    to be identified and the information to be generated and held on those products
    by each of the food businesses that physically trade them through the distribution
    chains. It is specific to the distribution for human consumption of crustacean
    and their products, from farm through to retailers or caterers. The types of business
    identified in ISO 16741:2015 for farmed crustacean distribution chains are the
    following: a) farming 1) broodstock collection 2) hatcheries and nurseries 3)
    crustacean farm 4) harvesting; b) processors; c) traders and wholesalers; d) retailers
    and caterers; e) logistics including materials brought from other domains; f)
    feed production.'
