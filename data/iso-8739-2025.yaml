abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of parallel grooved pins with
    pilot point and full-length diamond grooves (with closed-end at the insertion
    side), in steel and stainless steel, and with nominal diameter 1 mm to 25 mm.
    These grooved pins are designed to fulfil the main following function: locking
    together two or more parts, with the easiest installation (due to the pilot point)
    and a highest level of pull-out resistance (due to the elastic fit behaviour of
    the pin). The general requirements (including functional principles for grooved
    pins and assembly) are specified in ISO 13669.'
