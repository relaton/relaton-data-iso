abstract:
- language: en
  script: Latn
  content: 'This document specifies the characteristics of valves made from unplasticized
    polyamide (PA-U) in accordance with ISO 16486-1, intended to be buried and used
    for the supply of gaseous fuels. NOTE 1        For the purpose of this document
    the term gaseous fuels include for example natural gas, methane, butane, propane,
    hydrogen, manufactured gas, biogas, and mixtures of these gases. Additional information
    about the suitability for 100 % hydrogen and its admixtures with natural gas is
    given by ISO 16486-1:2023, Annex C and Annex D. It is applicable to isolating
    unidirectional and bi-directional valves with spigot ends or electrofusion sockets
    intended to be fused with PA-U pipes conforming to ISO 16486-2 and PA-U fittings
    conforming to ISO 16486-3. This document also specifies the test parameters for
    the test methods it describes. In conjunction with ISO 16486-1, ISO 16486-2, ISO
    16486-3 and ISO 16486-5, this document is applicable to PA-U valves and their
    joints and to joints with components of PA-U and other materials intended to be
    used under the following conditions: a)       a maximum operating pressure (MOP)
    of up to and including 18 bar1), or limited to 16 bar under regional CEN requirements,
    at a reference temperature of 20 °C for design purposes; NOTE 2        For the
    purpose of this document and the references to ISO 8233, MOP is considered to
    be nominal pressure. b)       an operating temperature of −20 °C to 40 °C; NOTE
    3        For operating temperatures between 20 °C and 40 °C, derating coefficients
    are specified in ISO 16486-5. This document covers valves for pipes with a nominal
    outside diameter, dn, ≤400 mm.'
