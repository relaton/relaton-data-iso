abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for identifying errors in the unbalance measuring process of a rotor including all factors similar to errors in their effect on the balancing precision, assessing the identified errors, and taking errors into account in preparation and realization of the balancing process and in the evaluation of the residual unbalance. For the main typical errors this document lists the methods for their reduction in Annex A.
