abstract:
- language: en
  script: Latn
  content: ISO/ASTM 52701:2013 provides guidance on determining the performance characteristics
    of dosimeters and dosimetry systems used in radiation processing. ISO/ASTM 52701:2013
    describes the influence quantities that might affect the performance of dosimeters
    and dosimetry systems and that should be considered during dosimeter/dosimetry
    system characterization. Users of ISO/ASTM 52701:2013 are directed to existing
    standards and literature for procedures to determine the effects from individual
    influence quantities and from combinations of more than one influence quantity.
    Guidance is provided regarding the roles of the manufacturers, suppliers, and
    users in the characterization of dosimeters and dosimetry systems.
