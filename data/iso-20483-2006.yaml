abstract:
- language: en
  script: Latn
  content: ISO 20483:2006 specifies a method for the determination of the nitrogen
    content of cereals, pulses and derived products, according to the Kjeldahl method,
    and a method for calculating the crude protein content. The method does not distinguish
    between protein nitrogen and non-protein nitrogen. If it is important to determine
    the non-protein nitrogen content, an appropriate method can be applied.
