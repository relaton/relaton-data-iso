abstract:
- language: en
  script: Latn
  content: This document provides guidance on creating a mutually beneficial environment
    that encourages everyone to be connected with the objectives, purpose and values
    of the organization, and for the organization to support its people in a manner
    which provides quality work and opportunities for development and professional
    fulfilment. Organizations can use the guidance to determine what is practical
    or material to the organization’s internal and external context regardless of
    its size, type, structure, nature or complexity, whether in the public, private
    or voluntary sector. The document applies to anyone who works for or on behalf
    of an organization. The guidance contained in this document is not intended to
    infringe upon national labour laws, established collective agreements or collective
    bargaining.
