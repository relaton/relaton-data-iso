abstract:
- language: en
  script: Latn
  content: ISO 20421-2:2017 specifies operational requirements for large transportable
    vacuum-insulated cryogenic vessels. These operational requirements include putting
    into service, filling, withdrawal, transport within the location, storage, maintenance,
    periodic inspection and emergency procedures. For the transport of these vessels
    by public road, rail, waterway, sea and air, additional requirements can apply;
    these are defined in specific regulations.
