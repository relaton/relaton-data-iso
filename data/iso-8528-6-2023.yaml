abstract:
- language: en
  script: Latn
  content: This document specifies the test methods to be used for characterizing
    an entire generating set. It applies to alternating current (AC) generating sets
    driven by reciprocating internal combustion (RIC) engines for land and marine
    use, excluding generating sets used on aircraft or to propel land vehicles and
    locomotives. This document also provides simulation methods as an alternative
    method for assessing the generating set capability to meet the requirements defined
    in ISO 8528-5. For some specific applications (e.g., essential hospital supplies,
    high-rise buildings, operation in parallel with the grid), supplementary requirements
    can be necessary. The provisions of this document are intended as a basis for
    establishing any supplementary requirements. For AC generating sets driven by
    other reciprocating-type prime movers (e.g., steam engines), this document is
    intended as a basis for establishing these requirements. NOTE          Existing
    test methods for the engine (ISO 3046-1 and ISO 3046-3) and generator (IEC 60034-2)
    are applicable for those components. The generating set manufacturer is responsible
    for specifying these characteristics and the tests to be performed to verify them.
