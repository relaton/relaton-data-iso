abstract:
- language: en
  script: Latn
  content: This document defines two performance levels for welded joints, namely
    Basic Demand and Critical Demand, for longitudinal tensile strength of weld metals,
    impact toughness of weld metals and heat affected zones (HAZ) to suit the level
    of seismic performance specifications required for welded steel structures. This
    document supplements the provisions of the standards or codes for welding procedure
    qualification in the application of new steel materials, welding consumables,
    or complex joints, for welds that require the performance of Basic or Critical
    Demands as specified by the engineer in the contract.
