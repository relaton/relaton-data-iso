abstract:
- language: en
  script: Latn
  content: This document specifies the general procedure to be followed in determining
    the dynamic viscosity of unpigmented coating materials, such as paints, varnishes
    and related products, as well as binders at a shear rate range between 9 000 s−1
    and 12 000 s−1. It describes an absolute viscosity measurement with cone-plate
    measuring geometry at high shear rates. The measured value gives information about
    the resistance offered by the material to brushing, spraying and roller coating
    during application. The method specified in this document is suitable for all
    paints and varnishes whether they are Newtonian in behaviour or not. For materials
    containing dispersions of large particles, the measuring geometry is expected
    to be adapted.
