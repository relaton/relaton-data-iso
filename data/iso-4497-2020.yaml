abstract:
- language: en
  script: Latn
  content: This document specifies a method of determining the particle size distribution
    of metallic powders by dry sieving into size fractions. The method is applicable
    to dry, unlubricated metallic powders, but not applicable to powders in which
    the morphology differs markedly from being equiaxial, for example flake-type powders.
    The method is not applicable to metallic powders having a particle size wholly
    or mostly under 45 µm.
