abstract:
- language: en
  script: Latn
  content: ISO 5707:2007 specifies the minimum performance and information requirements
    and certain dimensional requirements for satisfactory functioning of milking machines,
    for milking and cleaning. It also specifies minimum requirements for materials,
    design, manufacture and installation. ISO 5707:2007 is applicable to milking machines
    for milking cows, water buffaloes, sheep and goats where animals are milked with
    pulsation created by vacuum, and where milk is, at least partly, transported with
    the help of air flow. Some clauses are not applicable to all types of milking
    machines. The qualitative requirements also apply to installations for milking
    other mammals used for milk production.
