abstract:
- language: en
  script: Latn
  content: This proposal specifies a quality evaluation system of silica bricks used
    for coke oven. The valuation system consists of three dimensions, which are raw
    materials, manufacturing technique and general properties, should be evaluated
    respectively according to each stipulated scale. Only when all three dimensions
    are up to standard, can silica bricks for coke oven be graded as A/B/C/D rank.
    Silica bricks used for other high temperature furnaces could also use this evaluation
    standard as reference.
