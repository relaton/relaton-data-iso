abstract:
- language: en
  script: Latn
  content: La présente Norme internationale fournit les exigences pour les garnitures
    d'étanchéité et les bouchons de support pour utilisation dans les industries du
    pétrole et du gaz naturel. L'application de la présente Norme internationale est
    limitée aux seuls produits conformes à la définition de garniture d'étanchéité
    ou de bouchon de support utilisés par les industries du pétrole et du gaz naturel,
    pour les opérations dans le puits. La présente Norme internationale couvre uniquement
    les applications à l'intérieur d'un conduit. L'installation et la maintenance
    de ces équipements sont en dehors du domaine de la présente Norme internationale.
