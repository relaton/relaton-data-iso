abstract:
- language: en
  script: Latn
  content: ISO 26304:2008 specifies requirements for classification of solid wire
    electrodes, tubular cored electrodes, and electrode/flux combinations (all-weld
    metal deposits) in the as-welded condition and in the post weld heat-treated condition
    for submerged arc welding of high strength steels with a minimum yield strength
    greater than 500 MPa or a minimum tensile strength greater than 570 MPa. One flux
    can be tested and classified with different electrodes. One electrode can be tested
    and classified with different fluxes. The solid wire electrode is also classified
    separately based on its chemical composition. ISO 26304:2008 is a combined specification
    providing for classification utilizing a system based upon the yield strength
    and average impact energy of 47 J for all-weld metal, or utilizing a system based
    upon the tensile strength and average impact energy of 27 J for all-weld metal.
