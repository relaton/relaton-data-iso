abstract:
- language: en
  script: Latn
  content: 'ISO 18564:2016 specifies all the information necessary for carrying out
    efficiently and under standardised conditions the noise emission values of self-propelled
    forestry machinery. It is applicable to fellers, bunchers, delimbers, forwarders,
    log loaders, skidders, processors, harvesters, mulchers and multi-function versions
    of these machine types, as defined in ISO 6814. Noise emission characteristics
    include A-weighted emission sound pressure values at the operator''s station and
    the A-weighted sound power value. The determination of these quantities is necessary
    for the following: - manufacturers to declare the noise emitted; - comparing the
    noise emitted by machines in the family concerned; - purposes of noise control
    at the source at the design stage. NOTE For low-noise design, noise emission values
    in frequency bands are useful and the basic International Standards ISO 3744 and
    ISO 11201 can be used for determining noise emission quantities in frequency bands.'
