abstract:
- language: en
  script: Latn
  content: The relative spectral transmittance of rigid endoscopes is essential for
    evaluating how the optical components affect color reproduction and imaging performance.
    This document specifies a test method for determining the relative spectral transmittance
    in the visible light range of rigid endoscopes with optical image-transmitting
    systems consisting of lenses or fiber bundles (hereinafter referred to as "endoscope").
    The method is limited to optical assessment only, including the illumination and
    imaging paths, and this document does not apply to any opto-electronic elements.
