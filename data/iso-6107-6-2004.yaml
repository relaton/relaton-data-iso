abstract:
- language: en
  script: Latn
  content: ISO 6107-6:2004 defines terms used in certain fields of water quality characterization.
    In addition to the terms and definitions in the three official ISO languages (English,
    French and Russian), ISO 6107-6:2004 gives the equivalent terms and their definitions
    in the German language; these are published under the responsibility of the member
    bodies of Germany (DIN), Austria (ON) and Switzerland (SNV). However, only the
    terms and definitions given in the official languages can be considered as ISO
    terms and definitions.
