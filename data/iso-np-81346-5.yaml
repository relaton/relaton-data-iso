abstract:
- language: en
  script: Latn
  content: This part of the ISO/IEC 81346 International Standard, published jointly by IEC and ISO, provides rules and guidelines for the classification, designation, and representation of relations between objects. This document defines classes of relations, their definitions, and their codes. The defined classes and codes are intended to support the consistent identification, interpretation, and reuse of relational information by enabling the association of relevant metadata with relations. Based on these principles, rules and guidelines are given for the formulation of unambiguous reference designations for relations associated with any object. The reference designation identifies a relation for the purpose of assigning, modifying, retrieving, and exchanging information associated with that relation. A relation is treated as an identifiable information object that can be referenced and associated with metadata. The reference designation of a relation is derived from the reference designations of the participating objects. The principles are general and are applicable to all technical areas (for example mechanical engineering, electrical engineering, construction engineering, chemical engineering, and software engineering). They can be used for systems based on different technologies or for systems combining several technologies.
