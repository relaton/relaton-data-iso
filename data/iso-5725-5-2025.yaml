abstract:
- language: en
  script: Latn
  content: This document describes the use of robust methods for analysing the results
    of precision experiments without using outlier tests to exclude data from the
    calculations, and in particular, the detailed use of several such methods. The
    robust methods described in this document allow the data to be analysed in such
    a way that it is not required to make decisions about outliers that affect the
    results of the calculations.
