abstract:
- language: en
  script: Latn
  content: 'This document specifies the key considerations for organizations that
    are establishing appropriate roles and responsibilities for data quality management.
    The following are within the scope of this document: —    implementing roles and
    responsibilities for data quality management; —    providing documentary evidence
    of this implementation; —    a framework for roles and responsibilities; —   
    a functional model of roles and responsibilities; —    example deployment scenarios
    for the framework of roles and responsibilities; —    comparison with the processes
    specified by ISO 8000‑61. The following are outside the scope of this document:
    —    process reference models for data quality management (ISO 8000‑61 specifies
    a process reference model for data quality management); —    methods for data
    quality evaluation and certification; —    models for assessing the maturity of
    data quality management (ISO 8000‑62 and ISO 8000‑64 specify approaches to assessing
    the maturity of data quality management). This document can be used in conjunction
    with or independently of standards for quality management systems.'
