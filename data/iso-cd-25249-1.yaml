abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for external and internal corrosion
    protection systems for primary offshore wind farm structures. It is applicable
    for concrete and steel structures and appurtenances which are part of the foundation,
    tower and nacelle structures of an offshore wind farm structure. This document
    provides the requirements for the development of an overall corrosion control
    strategy which will typically include metallization and paint systems, cathodic
    protection and corrosion allowances. The strategy shall include, as a minimum:
    - a methodology to evaluate the corrosivity of the buried parts of the offshore
    wind structures - a guidance on how to evaluate the corrosion environment immersed
    and in the atmospheric area as well as internally in structures/structural parts
    - possible corrosion protection strategies combining cathodic protection, coating
    and corrosion allowance taking site environmental conditions and design as well
    as service life into account - a guidance on how to link the above with structural
    design, as well as operation and maintenance activities linking the actual integrity
    with the design For secondary hot dip galvanised steel structures reference is
    made to ISO 1461.'
