abstract:
- language: en
  script: Latn
  content: 'The purpose is to give some indications of the way in which accuracy data
    can be used in various practical situations by: giving a standard method of calculating
    the repeatability limit, the reproducibility limit and other limits, providing
    a way of checking the acceptability of test results obtained under repeatability
    or reproducibility conditions, describing how to assess the stability of results
    within a laboratory over a period of time, describing how to assess whether a
    given laboratory is able to use a given standard measurement method in a satisfactory
    way, describing how to compare alternative measurement methods.'
