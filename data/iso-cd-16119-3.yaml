abstract:
- language: en
  script: Latn
  content: This part of ISO 16119 specifies general requirements for the design and
    performance of sprayers, as defined in ISO 5681, with regard to minimizing the
    potential risk of environmental contamination during use, including misuse foreseeable
    by the manufacturer. It also specifies the requirements for identification of
    the sprayer and certain of its components, and the minimum content of the instruction
    handbook. It is intended to be used with each of the other parts of ISO 16119,
    which give requirements specific to particular types of sprayers (see Annex A).
    This part of ISO 16119 is applicable to all types of sprayers used in agriculture,
    horticulture, forestry and other areas, except knapsack sprayers. It does not
    cover safety aspects (see ISO 4254 6). • Scope out liquid fertilizer application
    • Adding Part 5 - Aerial sprayers • Instruction handbook content • Annex A, table
    with techniques needs to be updated. • Additional standards for application equipment
    listed in Annex A and covered by mandate M435 and M471 of the EC shall be developed.
