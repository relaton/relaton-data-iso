abstract:
- language: en
  script: Latn
  content: This Iinternational Standard specifies a method of obtaining a representative
    sample from a lot of paper or board, including solid and corrugated fibreboard
    (see ISO 4046:1978), for testing to determine whether or not its average quality
    complies with set specifications. It defines the conditions which apply when sampling
    is carried out to resolve disputes between buyer and seller relating to a defined
    lot of paper or board, which has been or is being delivered. NOTE If less than
    50 % of the lot is available for sampling, then sampling in terms of this International
    Standard will be invalid in the absence of agreement to the contrary. The method
    is unsuitable for determining the variability within a lot. In cases where International
    Standards make reference to sampling according to this standard but where such
    sampling is impossible, impractical or inappropriate, and where no dispute is
    involved, guidance is given in normative annex A.
