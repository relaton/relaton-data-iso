abstract:
- language: en
  script: Latn
  content: This document specifies test methods for clamp-in tubeless tyre valves.
    These methods are defined to determine the minimum level of performance requested.
    This document applies to the tyre valve assembled on the rim hole with diameter
    of 11,3 mm for passenger cars or for light duty vehicles. This document does not
    include tyre pressure monitoring system (TPMS) valves.
