abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and describes aspects for the lifecycle
    management of metal feedstock materials for powder based additive manufacturing
    processes. These aspects include but are not limited to: —     powder properties;
    —     powder lifecycle; —     test methods; —     powder quality assurance. This
    document supplements ISO/ASTM 52907, which primarily focuses on requirements for
    virgin powder. This document covers on powder life cycle management, and therefore
    focuses on control of virgin and used powders. This document can be used by manufacturers
    of metal powders, purchasers of powder feedstock for additive manufacturing, those
    responsible for the quality assurance of additively manufactured parts and suppliers
    of measurement and testing equipment for characterizing metal powders for use
    in powder-based additive manufacturing processes.'
