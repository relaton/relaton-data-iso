abstract:
- language: en
  script: Latn
  content: ISO 10848 (all parts) specifies measurement methods to characterize the
    flanking transmission of one or several building components. This document considers
    only laboratory measurements. The measured quantities can be used to compare different
    products, or to express a requirement, or as input data for prediction methods,
    such as ISO 12354‑1 and ISO 12354‑2. However, the measured quantities Dn,f, Ln,f
    and Lne0,f only represent the performance with the dimensions for the test specimens
    described in this document. ISO 10848-2:2017 is referred to in ISO 10848‑1:2017,
    4.5 as being a supporting part of the frame document. It applies to Type B elements
    as defined in ISO 10848‑1, such as suspended ceilings, access floors, light uninterrupted
    façades or floating floors. The transmission from one room to another can occur
    simultaneously through the test element and via the plenum (if any). For measurements
    made according to this document, the total sound transmission is determined and
    it is not possible to separate the two kinds of transmission.
