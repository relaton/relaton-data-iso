abstract:
- language: en
  script: Latn
  content: ISO 17450-1:2011 provides a model for geometrical specification and verification
    and defines the corresponding concepts. It also explains the mathematical basis
    of the concepts associated with the model and defines general terms for geometrical
    features of workpieces. ISO 17450-1:2011 defines the fundamental concepts for
    the GPS system in order to provide nonambiguous GPS language to be used in design,
    manufacturing and verification, to identify features, characteristics and rules
    to provide the basis for specifications, to provide a complete symbology language
    to indicate GPS specifications, to provide simplified symbology by defining default
    rules, and to provide consistent rules for verification.
