abstract:
- language: en
  script: Latn
  content: This document establishes methods for determining the composition of groups
    of persons whose anthropometric characteristics are to be representative of the
    intended user population of any specific object under test. This document is applicable
    to the testing of anthropometric aspects of industrial products and designs having
    direct contact with the human body or dependent on human body measurements, such
    as machinery, work equipment, personal protective equipment (PPE), consumer goods,
    working spaces, architectural details or transportation equipment. This document
    is also applicable to the testing of such safety aspects of products that are
    dependent on human body measurements. It does not deal with other aspects of the
    task or other requirements, such as perception of information (except geometrical
    arrangement of the viewing targets) and the use of controls (except their geometrical
    placement). Although this document deals with selecting test persons from an anthropometric
    perspective, similar general principles can be applied for other test variables,
    e.g. biomechanical aspects.
