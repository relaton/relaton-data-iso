abstract:
- language: en
  script: Latn
  content: This part of ISO 4254, when used with ISO 4254-1, specifies the safety
    requirements and their verification for the design and construction of large flail
    mowers used exclusively in agricultural field applications and which have the
    rear part that can be opened for these particular field use operations. These
    machines may be equipped with adjustable material discharge gates or deflectors
    located on the rear of the mower. It describes methods for the elimination or
    reduction of hazards arising from the intended use and reasonably foreseeable
    misuse of these machines by one person (the operator), in the course, of normal
    operation and service. In addition, it specifies the type of information on safe
    working practices to be provided by the manufacturer.
