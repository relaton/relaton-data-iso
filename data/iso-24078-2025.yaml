abstract:
- language: en
  script: Latn
  content: 'This document establishes the terms, definitions, symbols and abbreviations
    used in the fields related to hydrogen in energy systems. This document is not
    applicable to the following fields: —     biological methanation, —     reactors
    for hydrogen production from other sources, —     road, maritime and aviation
    transport, —     aeronautics and space. Note              These fields are foreseen
    to be covered in future editions of this document. This document does not apply
    to carbon capture, storage and utilisation, as well as services.'
