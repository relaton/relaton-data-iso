abstract:
- language: en
  script: Latn
  content: ISO 18582-1:2016 provides the basis for the preparation of a reference
    dictionary of standardized product properties for the area of fluid power, and
    for the provision of this reference dictionary and its entire contents in electronic
    form. ISO 18582-1:2016, based on ISO 13584‑42 and ISO/IEC Guide 77‑2, specifies
    a reference dictionary of standardized product properties for the area of fluid
    power. NOTE The properties are determined on the basis of standardized attributes.
    To ensure optimum unambiguity, the standardized properties are classified into
    definition classes, forming a so-called standardized "reference hierarchy".
