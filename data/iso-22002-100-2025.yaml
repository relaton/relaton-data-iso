abstract:
- language: en
  script: Latn
  content: This document specifies the common requirements for establishing, implementing
    and maintaining prerequisite programmes (PRPs) throughout the food, feed and packaging
    supply chain to assist in controlling food safety hazards with a food safety management
    system (FSMS). This document is applicable to all organizations, regardless of
    size or complexity, that are involved in activities across the food, feed and
    packaging supply chain and that wish to implement PRPs (see Figure 1). Exclusions
    to requirements can be supported by a sufficient justification that ensures that
    the exclusion does not adversely impact food safety.
