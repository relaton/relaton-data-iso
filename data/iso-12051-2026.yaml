abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for pipe and integral joints of higher level of impact resistant PVC-M for the conveyance of water and waste water under pressure. The pipes are intended for installation below and above ground where they are not exposed to direct sunlight. This document also specifies the test parameters for the test methods in this document. This document is applicable to extruded PVC-M pipes without a socket and pipes with a socket (integral or not), intended to be used for the following purposes: water mains and services buried in the ground; conveyance of water above ground for both outside and inside buildings; buried and above-ground drainage and sewerage under pressure. This document is applicable to piping systems intended for the supply of water under pressure up to and including 25 °C (cold water) intended for human consumption and for general purposes as well as for waste water under pressure. This document specifies pipes for the conveyance of water and waste water up to and including 45 °C. For temperatures between 25 °C and 45 °C, Figure A.1 applies. NOTE 1        The producer and the end-user can come to agreement on the possibilities of use for temperatures above 45 °C on a case-by-case basis This document specifies a range of pipe sizes and pressure classes, and gives requirements concerning colours. NOTE 2        It is the responsibility of the purchaser or specifier to make the appropriate selections concerning pipe sizes, pressure classes and colours, taking into account their particular requirements and any relevant national regulations and installation practices or codes.'
