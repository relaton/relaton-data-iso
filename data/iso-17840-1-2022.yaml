abstract:
- language: en
  script: Latn
  content: This document defines the contents and the layout of the rescue sheet providing
    necessary and useful information about a vehicle involved in an accident to support
    the rescue team extricating the occupants as fast and as safe as possible. This
    document is applicable to passenger cars and light commercial vehicles according
    to ISO 3833. The identification of the vehicle and of the model through a database
    using the license plate, the VIN number, an automatic emergency call system (e.g.
    eCall) or other identifiers (e.g. bar code or QR code) is not covered by this
    document. The rescue process or the process of handling the rescue sheets is not
    covered by this document. This document does not cover information related to
    education and training for rescue teams.
