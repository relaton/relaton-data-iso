abstract:
- language: en
  script: Latn
  content: ISO 17632:2004 specifies requirements for classification of tubular cored
    electrodes with or without a gas shield for metal arc welding of non-alloy and
    fine grain steels in the as-welded condition or in the post weld heat treated
    condition with a minimum yield strength of up to 500 MPa or a minimum tensile
    strength of up to 570 MPa. One tubular cored electrode can be tested and classified
    with different shielding gases, if any. ISO 17632:2004 is a combined specification
    providing classification utilizing a system based upon the yield strength and
    the average impact energy of 47 J of all-weld metal, or utilizing a system based
    upon the tensile strength and the average impact energy of 27 J of all-weld metal.
