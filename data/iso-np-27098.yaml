abstract:
- language: en
  script: Latn
  content: This document specifies requirements and guidelines for organizations of all types (regardless of size and type) on biodiversity measurement, data collection, data management, monitoring and assessment. It applies to any ecosystem, whether terrestrial or aquatic (freshwater or marine), and covers all levels of biological organization from genes to ecosystems. This document applies to government agencies, research institutions, conservation organizations, businesses and other organizations, private or public, that are involved in biodiversity-related activities or that directly or indirectly impact or depend on biodiversity. This also includes private land owners and managers and, Indigenous Peoples and Local Communities (IPLC). By stating principles and minimal requirement it guides users in the process of planning, designing, implementing and reporting on biodiversity-related measurement, monitoring and assessment activities. This document also gives guidance on the systematic collection, management and application of data during these processes to improve the effectiveness of biodiversity management.
