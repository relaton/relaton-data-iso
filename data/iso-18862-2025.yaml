abstract:
- language: en
  script: Latn
  content: This document specifies methods for the determination of acrylamide in
    coffee and coffee products by extraction with water, clean-up by solid-phase extraction
    (SPE) and determination by high-performance liquid chromatography with tandem
    mass spectrometric detection (HPLC-MS/MS) and gas chromatography with mass spectrometric
    detection (GC-MS) after derivatization. The methods were validated in a validation
    study for roasted coffee, soluble coffee, coffee substitutes and coffee products
    with ranges from 53 μg/kg to 612,1 μg/kg.
