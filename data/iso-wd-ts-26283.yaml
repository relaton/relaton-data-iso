abstract:
- language: en
  script: Latn
  content: The document specifies a laboratory test method for measurement and evaluation
    of reaction loads exerted on operators by externally powered handheld tightening
    tools. The tightening tools covered can be powered by pneumatic, hydraulic, or
    electric (cable or battery) means. The tightening tools are used for installing
    torque on threaded fasteners. Vibration emissions caused by tightening tools are
    not covered in this document. Further, tightening tools intended for use with
    reaction bars (e.g. high torque tools) are not covered in this document. The document
    provides instructions on how reaction loads should be measured, evaluated and
    reported.
