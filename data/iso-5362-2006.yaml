abstract:
- language: en
  script: Latn
  content: ISO 5362:2006 specifies requirements for antistatic and non-antistatic
    reservoir bags for use with anaesthetic apparatus or lung-ventilator breathing
    systems. It includes requirements for the design of the neck, size designation,
    distension and, where relevant, for electrical resistance. ISO 5362:2006 includes
    requirements for both single-use and reusable bags. Reusable bags are intended
    to comply with the requirements of ISO 5362:2006 for the recommended product life.
    ISO 5362:2006 is not applicable to special-purpose bags, for example bellows and
    self-expanding bags. Bags for use with anaesthetic gas scavenging systems are
    not considered to be anaesthetic reservoir bags and are thus outside the scope
    of ISO 5362:2006.
