abstract:
- language: en
  script: Latn
  content: '1.1 This document gives a methodology for improving the safety of existing
    passenger and goods passenger lifts with the aim of reaching an equivalent level
    of safety to that of a newly installed lifts by the application of today’s state-of-the-art
    for safety. 1.1 This document gives a methodology for improving the safety of
    existing passenger and goods passenger lifts with the aim of reaching an equivalent
    level of safety to that of a newly installed lifts by the application of today’s
    state-of-the-art for safety. This document prioritizes improvements of safety
    based on objective hazard analysis but does not define a methodology for achieving
    full compliance to current standards for new installations. NOTE Due to situations
    such as the building design, etc. it may not be possible in all cases to reach
    today’s state-of-the-art for safety. This document applies to permanently installed
    passenger or goods passenger lifts, with traction, positive or hydraulic drive
    serving defined landing levels, having a car designed for the transportation of
    persons or persons and goods and moving along guide rails inclined not more than
    15° to the vertical. This document includes the improvement of safety of existing
    lifts for: a) passengers; b) maintenance and inspection personnel; c) persons
    outside the well, machinery space(s) and the pulley room(s) (but in their immediate
    vicinity); d) any other authorized persons. 1.2 This document is not applicable
    to: e) lifts with drive systems others than those mentioned above; f) lifting
    appliances such as paternosters, mine lifts, theatre lifts, appliances with automatic
    caging, skips, lifts and hoists for building and public works sites, ships’ hoists,
    platforms for exploration or drilling at sea, construction and maintenance appliances;
    g) installations where the inclination of the guide rails to the vertical exceeds
    15°; h) lifting appliances with a rated speed lower than or equal to 0,15 m/s;
    i) safety during transport, installation, repairs and dismantling of lifts. However,
    this document can usefully be taken as a reference basis. 1.3 This document does
    not cover a) Improvement of safety for specific items like vandalism, seismic
    conditions, fire issues, etc. b) Improvement of accessibility'
