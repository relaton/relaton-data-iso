abstract:
- language: en
  script: Latn
  content: 'This document gives the safety requirements and measures for stationary
    multi-blade rip sawing machines manually loaded and/or unloaded, hereinafter referred
    to as "machines", designed to cut solid wood and material with similar physical
    characteristics to wood. It deals with all significant hazards, hazardous situations
    and events as listed in Clause 4 relevant to machines, when operated, adjusted
    and maintained as intended and under the conditions foreseen by the manufacturer
    including reasonably foreseeable misuse. Also, transport, assembly, dismantling,
    disabling and scrapping phases are taken into account. NOTE For relevant but not
    significant hazards, e.g. sharp edges of the machine frame, see ISO 12100:2010.
    This document does not deal with specific hazards related to the combination of
    single machines with any other machine as part of a line. It is not applicable
    to machines: — with all saw blades spindles mounted below the workpiece support/level
    only; — intended for use in potentially explosive atmosphere; — manufactured prior
    to its publication.'
