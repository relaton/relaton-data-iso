abstract:
- language: en
  script: Latn
  content: 'This document specifies tools for communication between a purchaser and
    a supplier of welding consumables within quality systems, such as those based
    upon ISO 9001. This document, together with an applicable welding consumable standard
    (ISO or other), provides a method for preparing the specific details needed for
    welding consumable procurement which consists of: a)       the welding consumable
    classification (selected from the applicable welding consumable standard); b)      
    the lot classification (selected from Clause 4); c)        the testing schedule
    (selected from Clause 5). Selection of the specific welding consumable classification,
    lot classification, and testing schedule depends upon the requirements of the
    application for which the welding consumable is being procured. This document
    does not apply to non-consumable electrodes or shielding gases.'
