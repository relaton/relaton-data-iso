abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for three types of rubber or
    plastics inlet hoses and hose assemblies for washing-machines and dishwashers
    connected to the domestic water supply at a pressure not exceeding 1 MPa (10 bar).
    This document is applicable to the following types of hose: —    type 1: rubber
    hoses for unheated water supply (maximum temperature 70 °C); —    type 2: rubber
    hoses for heated water supply (maximum temperature 90 °C); —    type 3: plastics
    hoses for unheated water supply (maximum temperature 60 °C). NOTE       National
    requirements for hose fittings and hoses conveying drinking water can apply.'
