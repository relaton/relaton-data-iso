abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the management of information
    related to response resources for a public health emergency (PHE) response, from
    the perspective of information and communication technology (ICT). This document
    provides: —    an overview of response resource information management; —    requirements
    for managing response resource information including: —   information collection;
    —   information storage; —   information disposal; —   information distribution.
    The requirements in this document can only be effectively applied, if information
    exchange described in Clause 5 is supported at both municipal and national levels.'
