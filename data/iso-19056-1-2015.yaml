abstract:
- language: en
  script: Latn
  content: ISO 19056-1:2015 specifies procedures for the measurement of image brightness
    and uniformity for bright field light microscopy. These measurements for image
    brightness and uniformity are defined in image planes or intermediate image planes
    only, when these planes are suitable for detection by electronic imaging devices.
    ISO 19056-1:2015 defines how image brightness and uniformity are measured and
    how this information is provided to the user. NOTE The scope is intentionally
    limited to electronic imaging devices and (intermediate) image planes. The visual
    observation by means of eyepieces would require a different measurement procedure
    and hence result in unambiguities in the description of measurement procedures.
    Nevertheless, this part of ISO 19056 will give useful estimates for the image
    brightness with visual observation as in this case, an eyepiece is used to observe
    an intermediate image plane (which is under the scope of this part of ISO 19056).
