abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety, constructional, and performance and testing requirements for gas filters for burners and appliances burning one or more gaseous fuels. This document applies to gas filters with declared maximum inlet pressures up to and including 500 kPa and of nominal connection sizes up to and including DN 250, for use in gas control train of gas burners or in appliances using gaseous fuels such as natural, manufactured or liquefied petroleum gas (LPG). It is not applicable to corrosive and waste gases. This document is not applicable to: — gas filters that are connected directly to mains pipe-work or to a container that maintains a standard distribution pressure.'
