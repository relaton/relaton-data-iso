abstract:
- language: en
  script: Latn
  content: This document specifies performance criteria for immunochemical methods
    for the detection and/or quantification of a specific protein or protein(s) of
    interest [POI(s)] in a specified matrix. The methods discussed are applicable
    to the analysis of proteins from a variety of sample types. Some uses for these
    methods include, but are not limited to, analysing proteins involved in crop and
    food production, food processing, food marketing, food safety, biotechnology or
    disease indexing.
