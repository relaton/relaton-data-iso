abstract:
- language: en
  script: Latn
  content: This document specifies the quality and safety requirements and test methods
    of Plantago asiatica and Plantago depressa seed, which is derived from the seed
    of Plantago asiatica L. and Plantago depress Willd. (Fam. Plantaginaceae). This
    document is applicable to Plantago asiatica and Plantago depressa seed that are
    sold and used as natural medicines in international trade, including Chinese Materia
    Medica (whole medicinal material) and decoction pieces derived from this plant.
