abstract:
- language: en
  script: Latn
  content: 'This standard specifies the technical requirement and test methods for
    air compressors including centrifugal air compressors, positive displacement compressors,
    etc. This standard describes requirement and test method to assist in evaluating
    the performance of aire compressor. It covers the following: 1. General requirement
    and test method 2. Operating and mechanical properties requirement and test method
    3. Electrical characteristics requirement and test method 4. Environment adaptability
    5. Durability requirement and test method'
