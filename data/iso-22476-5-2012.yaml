abstract:
- language: en
  script: Latn
  content: ISO 22476-5:2012 specifies the equipment requirements, execution of and
    reporting on flexible dilatometer tests. ISO 22476-5:2012 is applicable to tests
    in ground stiff enough not to be adversely affected by the drilling operation.
    ISO 22476-5:2012 is applicable to four procedures for conducting a test with the
    flexible dilatometer. ISO 22476-5:2012 applies to tests performed up to 1 800
    m depth. Testing can be conducted either on land or off-shore.
