abstract:
- language: en
  script: Latn
  content: ISO 14855-1:2005 specifies a method for the determination of the ultimate
    aerobic biodegradability of plastics, based on organic compounds, under controlled
    composting conditions by measurement of the amount of carbon dioxide evolved and
    the degree of disintegration of the plastic at the end of the test. This method
    is designed to simulate typical aerobic composting conditions for the organic
    fraction of solid mixed municipal waste. The test material is exposed to an inoculum
    which is derived from compost. The composting takes place in an environment wherein
    temperature, aeration and humidity are closely monitored and controlled. The test
    method is designed to yield the percentage conversion of the carbon in the test
    material to evolved carbon dioxide as well as the rate of conversion. Also specified
    is a variant of the method, using a mineral bed (vermiculite) inoculated with
    thermophilic microorganisms obtained from compost with a specific activation phase,
    instead of mature compost. This variant is designed to yield the percentage of
    carbon in the test substance converted to carbon dioxide and the rate of conversion.
