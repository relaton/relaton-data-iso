abstract:
- language: en
  script: Latn
  content: 'This document specifies two test methods for determining the refractive
    index of plastics, namely: —    Method A: a refractometric method for measuring
    the refractive index of moulded parts, cast or extruded sheet or film, by means
    of a refractometer. It is applicable not only to isotropic transparent, translucent,
    coloured or opaque materials but also to anisotropic materials. —    Method B:
    an immersion method (making use of the Becke line phenomenon) for determining
    the refractive index of powdered or granulated transparent materials by means
    of a microscope. Monochromatic light, in general, is used to avoid dispersion
    effects. NOTE      The refractive index is a fundamental property which can be
    used for checking purity and composition, for the identification of materials
    and for the design of optical parts. The change in refractive index with temperature
    can give an indication of transition points of materials.'
