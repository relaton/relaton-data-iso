abstract:
- language: en
  script: Latn
  content: This document describes procedures for calibrating and determining the
    response of dosemeters and dose-rate meters in terms of the operational quantities
    for radiation protection purposes defined by the International Commission on Radiation
    Units and Measurements (ICRU). However, as noted in ICRU 56, the ambient dose
    equivalent, H*(10), used for area monitoring, and the personal dose equivalent,
    Hp(10), as used for individual monitoring, of strongly penetrating radiation,
    are not appropriate quantities for any beta radiation, even that which penetrates
    10 mm of tissue (Emax > 2 MeV). This document is a guide for those who calibrate
    protection-level dosemeters and dose-rate meters with beta-reference radiation
    and determine their response as a function of beta-particle energy and angle of
    incidence. Such measurements can represent part of a type test during the course
    of which the effect of other influence quantities on the response is examined.
    This document does not cover the in-situ calibration of fixed, installed area
    dosemeters. The term “dosemeter” is used as a generic term denoting any dose or
    dose-rate meter for individual or area monitoring. In addition to the description
    of calibration procedures, this document includes recommendations for appropriate
    phantoms and the way to determine appropriate conversion coefficients. Guidance
    is provided on the statement of measurement uncertainties and the preparation
    of calibration records and certificates.
