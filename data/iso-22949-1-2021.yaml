abstract:
- language: en
  script: Latn
  content: This document specifies general requirements for DNA sequencing method
    performance in the detection and identification of animal species in food and
    feed products. Performance requirements are limited to Sanger and next generation
    sequencing (NGS), including second and third generation sequencing, for analysis
    of single species products and multispecies products. This document is applicable
    to DNA sequences for mammals, birds, fish, molluscs, crustaceans, amphibians,
    reptiles and insects, and to the validation of the applicable methods. Methods
    for DNA species quantification are not considered under the scope of this document.
