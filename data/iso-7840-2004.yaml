abstract:
- language: en
  script: Latn
  content: ISO 7840:2004 specifies general requirements and physical tests for fire-resistant
    hoses for conveying petrol and diesel oil, designed for a working pressure not
    exceeding 0,34 MPa for hoses with nominal bore up to and including 10 mm and 0,25
    MPa for hoses with larger bore in craft of hull length up to 24 m. ISO 7840:2004
    applies to hoses for small craft with permanently installed fuel systems. It does
    not apply to hoses entirely within the splash well at the stern of the craft connected
    directly to an outboard engine.
