abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and test methods for activity toys
    for indoor and outdoor domestic family use intended for children under 14 years
    to play on or in. Products covered by this document include swings, slides, see-saws,
    carousels, rocking toys, climbing frames, toddler swing seats and other products
    often intended to bear the mass of one or more children. Products not included
    within the scope of this document are: a)       fitness and sporting equipment
    unless attached to the activity toy; b)       equipment intended for use in schools,
    daycare centres, kindergartens, public playgrounds, restaurants, shopping centres
    and similar public places; c)        juvenile care products such as, but not limited
    to, infant swings, playpens/enclosures, beds or furniture including picnic tables,
    cradle rockers and products specifically designed for therapeutic use; d)      
    pools with maximum depth of water over 400 mm measured, between the overflow level
    and the deepest point within the pool. Inflatable activity toys are included in
    the scope of this document. However, a powered blower used to continuously inflate
    the toy is not covered by this document. Such equipment is considered to be a
    household appliance and is covered by requirements given in IEC 60335-2-80.[5]'
