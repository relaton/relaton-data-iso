abstract:
- language: en
  script: Latn
  content: 'This document specifies/describes test methods and procedures to evaluate
    the cover lens component used to protect the display surface by characterizing
    the strength of the cover lens, taking into account two of the major sources of
    breakage: • surface strength • edge strength The test results are limited to evaluating
    the strength as a component, of the cover lens alone. The strength evaluation
    of a fully assembled display within the vehicle cabin is out of scope of this
    document. This is because the overall strength an assembled display cover lens
    may depend on multiple variables and components of the display system. The structural
    features supporting the cover lens and installation into the vehicle cabin are
    very influential and dependent on each vehicle design. This document does not
    cover the evaluation of strength of finished display product and is therefore
    not suitable to be uniquely used as proxy to quantify the display susceptibility
    to impact test. NOTE: The actual display product strength required to survive
    an impact test is largely dependent on the construction, supporting structure,
    its deformation while in use as installed into a vehicle. The strength evaluation
    results obtained by the test procedure described in this document may not directly
    correlate to the durability of a final display product as installed in the cabin
    compartment. Cover lens components are exposed to manufacturer-specific production
    processing damage, which may create surface flaws impacting strength. Thus, informative
    material is provided in a supplementary annex for convenience.'
