abstract:
- language: en
  script: Latn
  content: ISO 6506-2:2017 specifies methods of direct and indirect verification of
    testing machines used for determining Brinell hardness in accordance with ISO
    6506‑1 and also specifies when these two types of verification have to be performed.
    The direct verification involves checking that individual machine performance
    parameters fall within specified limits whereas the indirect verification utilizes
    hardness measurements of reference blocks, calibrated in accordance with ISO 6506‑3,
    to check the machine's overall performance. If a testing machine is also to be
    used for other methods of hardness testing, it has to be verified independently
    for each method. ISO 6506-2:2017 is applicable to both fixed location and portable
    hardness testing machines. For machines that are incapable of satisfying the specified
    force-time profile, the direct verification of force and testing cycle can be
    modified by the use of Annex B.
