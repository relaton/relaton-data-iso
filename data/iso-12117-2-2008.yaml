abstract:
- language: en
  script: Latn
  content: ISO 12117-2:2008 establishes a consistent and reproducible means of evaluating
    the load-carrying characteristics of roll-over protective structures (ROPS) for
    excavators under static loading, and prescribes performance requirements of a
    representative specimen under such loading. ROPS are to be used where the risk
    of roll-over exists. ISO 12117-2:2008 applies to ROPS of hydraulic excavators
    as defined in ISO 6165 with a mass of over 6 t and less than 50 t. It also applies
    to ROPS for excavator-based or derivated excavators used in object or material
    handling, demolition or with attachments such as in log-handling and forestry
    applications. It does not apply to excavators with elevating cab risers.
