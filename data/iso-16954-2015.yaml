abstract:
- language: en
  script: Latn
  content: ISO 16954:2015 provides type test methods for evaluating the effectiveness
    of treatment methods intended to prevent or inhibit the formation of biofilm or
    to remove biofilm present in dental unit procedural water delivery systems under
    laboratory conditions. It does not apply to devices intended to deliver sterile
    procedural water or sterile solution. It also does not apply to lines, tubing,
    or hoses that deliver compressed air within the dental unit. It does not establish
    specific upper limits for bacterial contamination or describe test methods to
    be used in clinical situations. It also does not establish test methods for evaluating
    any deleterious side effects potentially caused by treatment methods. The test
    methods provided in ISO 16954:2015 can be used to test other dental equipment
    that delivers non-sterile water to the oral cavity.
