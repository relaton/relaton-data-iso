abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the bending length of
    a nonwoven. A formula is given for calculating the flexural rigidity of the nonwoven
    material from the bending length. The method is not applicable to combination-type
    materials (composites or laminates) in which there can be a natural twist. NOTE           
    This document describes a test method specific to nonwovens.
