abstract:
- language: en
  script: Latn
  content: This document specifies switch and crossing rails that carry railway wheels
    as specified in ISO 5003. These are used in conjunction with flat bottom (vignole)
    railway rails. After switch and crossing rails are produced, in order to be ready
    for railway track use, secondary processing (forging, grinding and heat treatment
    etc.) is carried out. This document does not include secondary processing. Secondary
    processing is specified in other standards or through agreements between manufacturer
    and purchaser. Sixteen pearlitic steel grades are specified, covering a hardness
    range of 200 HBW to 440 HBW, and include non-heat-treated carbon manganese steels,
    non-heat-treated alloy steels, heat-treated carbon manganese and heat-treated
    low
