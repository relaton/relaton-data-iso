abstract:
- language: en
  script: Latn
  content: ISO 12764:2017 a) describes the use of vortex shedding flow meters for
    liquids, gases, and steam, including a glossary and a set of engineering equations
    used for specifying performance, b) provides technical information to assist the
    user in selecting, specifying and applying vortex shedding flowmeters, including
    influence effects, c) describes typical construction and provides recommendations
    for inspection, certification, and material traceability, d) describes availability
    of diagnostics associated with vortex shedding flowmeters, e) provides calibration
    guidance, f) does not apply to insertion type vortex shedding flowmeters, g) applies
    only to closed conduits running full, h) applies only to fluid flow that is steady
    or varies only slowly with time, and i) applies to fluids considered to be single-phase.
