abstract:
- language: en
  script: Latn
  content: ISO 29941:2010 specifies a test method to determine the release of N-nitrosamines
    from condoms made from natural rubber latex. The method can also be used for other
    products such as probe covers, prophylactic dams, female condoms and condoms made
    from synthetic materials, although there was no experience of testing such products
    at the time of publication.
