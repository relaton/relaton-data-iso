abstract:
- language: en
  script: Latn
  content: This document specifies the determination of total luminous transmittance
    and total luminous reflectance on clear, translucent or opaque plastics. Specimen
    shapes include moulded plaque or discs, films and sheets. Fluorescent plastics
    and chromatic colour plastics are not covered by this document. NOTE The scope
    of ISO 13468-1 shows that ISO 13468-1 covers planar transparent and substantially
    colourless plastics. The method in this document provide the way to trap diffused
    light and covers to measure translucent and opaque plastics.
