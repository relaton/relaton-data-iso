abstract:
- language: en
  script: Latn
  content: IWA 9:2011 provides a framework for managing sustainable development in
    a business district, including the evaluation, comparison and improvement of its
    performance. It also identifies and describes factors to be considered when developing
    and evaluating the economic, environmental and social performance of new and existing
    business districts. IWA 9:2011 can also be used to compare or assess the performance
    of business districts regarding the provisions described within it. IWA 9:2011
    does not set benchmarks or expected levels of performance regarding the impacts
    of business districts. IWA 9:2011 is intended to be used in conjunction with,
    and in accordance with the principles set out in, ISO 15392, ISO 26000 and the
    standards on environmental management prepared by ISO/TC 207.
