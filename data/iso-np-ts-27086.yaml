abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for the application of Artificial Intelligence (AI) techniques to semantic data for tourism destinations structured in accordance with ISO 20525 (Tourism and related services – Semantics applied to tourism destinations). It covers two major application areas, (i) the consumption of this type of semantic data by AI systems, including recommender systems, conversational agents, search and retrieval engines, and decision-support tools, and (ii) the generation or enrichment of this type of semantic data by AI-based processes, including natural language processing (NLP), machine learning (ML), and generative AI. These processes can be used to create, annotate, validate or enhance tourism content in conformance with the semantic structures defined in ISO 20525. This document includes guidelines and recommendations for ensuring the quality, consistency and traceability of AI-processed semantic tourism destinations data, specifically: ● Semantic data consumption guidelines to ensure the correctness of the information supplied by AI systems. ● Interoperability recommendations for AI systems that exchange semantic tourism destinations data across platforms and organizations. ● Human oversight and governance considerations for AI-generated semantic tourism destinations data. ● Guidelines to preserve the integrity of the tourism destinations ontological model when consuming or generating data. ● Considerations to ensure the transparency and explainability of AI decisions based on semantic tourism destinations data. The following is outside the scope of this document: ● The semantic data structures and ontological model for tourism destinations defined in ISO 20525. ● Requirements for establishing, implementing, maintaining, and continually improving Artificial Intelligence Management Systems (AIMS), addressed in ISO/IEC 42001. ● Guidance on risk management related to AI, addressed in ISO/IEC 23894. ● Personal data protection and privacy in tourism systems. ● Tourism AI applications that do not interact with semantic data structured in accordance with ISO 20525.'
