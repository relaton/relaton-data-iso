abstract:
- language: en
  script: Latn
  content: This document specifies an atomic absorption spectrometric method for the
    determination of the copper content of rubbers. The method is applicable to raw
    rubber and rubber products having copper contents above 1 ppm. Copper contents
    below this limit can be determined, provided that suitable adjustments are made
    to either the mass of the test portion or to the concentrations of the solutions
    used, or both. The use of the standard additions method can lower the bottom limit
    of detection.
