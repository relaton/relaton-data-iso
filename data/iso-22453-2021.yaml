abstract:
- language: en
  script: Latn
  content: This document specifies methods of information exchange between waste handlers
    and recyclers for rare earth elements (REEs) contained in industrial waste and
    end-of-life (EOL) products. This document facilitates the efficient recycling
    of REEs so that dependency on mining can be reduced by promotion of REE recycling.
    This document also includes a generic life cycle of the REE recycling process.
