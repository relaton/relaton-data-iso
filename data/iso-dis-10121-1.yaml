abstract:
- language: en
  script: Latn
  content: 'ISO 10121-1:2014 aims to provide an objective laboratory test method,
    a suggested apparatus, normative test sections and normative tests for evaluation
    of three different solid gas-phase air cleaning media (GPACM) or GPACM configurations
    for use in gas-phase air cleaning devices intended for general filtration applications.
    ISO 10121-1:2014 is specifically intended for challenge testing and not for general
    material evaluation or pore system characterization. The three different types
    of GPACM identified in ISO 10121-1:2014 are GPACM-LF (particles of different shape
    and size intended for e.g. Loose Fill applications), GPACM-FL (FLat sheet fabric
    intended for e.g. flat one layer, pleated or bag type devices) and GPACM-TS (three
    dimensional structures that are many times thicker than flat sheet and e.g. used
    as finished elements in a device). The tests are conducted in an air stream and
    the GPACM configurations are challenged with test gases under steady-state conditions.
    Since elevated gas challenge concentrations (relative to general ventilation applications)
    are used, test data should be used to compare GPACM within the same configuration
    and not for the purpose of predicting performance in a real situation. It is also
    not implied that different GPACM configurations can be directly compared. The
    primary intention is to be able to compare like GPACM configurations to like,
    not between GPACM configurations. Testing of complete devices is described in
    ISO 10121‑2. To ensure objectivity for test equipment suppliers, no specific design
    of the test apparatus is defined: an example is illustrated in an annex. Instead
    normative demands for media sample holder design, apparatus properties and validation
    tests are specified.'
