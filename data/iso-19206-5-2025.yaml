abstract:
- language: en
  script: Latn
  content: 'This document specifies performance requirements for surrogate targets
    used to assess the system detection and activation performance of active safety
    systems. This document specifies the properties of an omni-directional multi-purpose
    powered two-wheeler (PTW) target for assessment of interaction in a variety of
    traffic scenarios. This document specifies the properties of a PTW target (PTWT)
    representing a powered two-wheeler in terms of size, shape, reflection properties,
    etc. for testing purposes. This document addresses the detection requirements
    for a PTWT in terms of sensing technologies commonly in use at the time of publication
    of this document, and where possible, anticipated future sensing technologies.
    It also addresses methodologies to verify the target response properties to these
    sensors, as well as performance requirements for the target carrier. The PTWTs
    specified in this document reflect two-wheeled vehicles corresponding to UN Category
    L31) and to UN Category L12), with the restrictions that the vehicle is not intended
    for human propulsion (for example, pedalling) and its two wheels are inline. This
    document also addresses requirements for motion and positioning during test for
    PTWT including target carrier system. This document does not address the test
    procedures in terms of speeds, positions or timing of events. Performance criteria
    for the active safety system are also not addressed. 1)  The vehicle categories
    are defined in Consolidated Resolution on the Construction of Vehicles (R.E.3):
    https://www.unece.org/trans/main/wp29/wp29wgs/wp29gen/wp29resolutions.html . 2) 
    See https://www.unece.org/trans/main/wp29/wp29wgs/wp29gen/wp29resolutions.html
    .'
