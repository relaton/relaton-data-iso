abstract:
- language: en
  script: Latn
  content: 'This document provides a description of a set of common technologies and
    techniques used in conjunction with cloud computing. These include: — virtual
    machines (VMs) and hypervisors; — containers and container management systems
    (CMSs); — serverless computing; — microservices architecture; — automation; —
    platform as a service systems and architecture; — storage services; — security,
    scalability and networking as applied to the above cloud computing technologies.'
