abstract:
- language: en
  script: Latn
  content: ISO 14085-1:2015 specifies a test sequence for evaluation of characteristics
    of the hydraulic fluid filter elements under standard conditions. ISO 14085-1:2015
    is not intended to qualify a filter element under replicate conditions of service;
    this can only be done by a specific test protocol developed for the purpose, including
    actual conditions of use, for example the operating fluid or contamination. The
    tests data resulting from application of this part of ISO 14085 can be used to
    compare the performance of aerospace hydraulic filter elements.
