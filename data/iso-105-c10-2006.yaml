abstract:
- language: en
  script: Latn
  content: ISO 105-C10:2006 specifies five methods intended for determining the resistance
    of the colour of textiles of all kinds and in all forms to washing procedures,
    from mild to severe, used for normal household articles. ISO 105-C10:2006 is designed
    to determine the effect of washing only on the colour fastness of the textile.
    It is not intended to reflect the result of the comprehensive laundering procedure.
