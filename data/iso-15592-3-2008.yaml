abstract:
- language: en
  script: Latn
  content: ISO 15592-3:2008 specifies methods for the determination of total particulate
    matter and preparation for the subsequent determination of nicotine-free dry particulate
    matter present in the smoke from articles made from fine-cut tobacco, generated
    and collected using a routine analytical smoking machine. ISO 15592-3:2008 specifies
    the method for the classification of unknown wrappers by comparison of fine-cut
    smoking articles made using them with those made using a standard wrapper. ISO
    15592-3:2008 specifies the method of making of fine-cut tobacco smoking articles
    using specified wrappers both with and without attached filters, and the method
    of determination of the yield of a fine-cut smoking article made using a loose
    filter and tobacco inserted into a wrapper.
