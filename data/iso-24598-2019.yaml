abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for classification of solid wire
    electrodes, tubular cored electrodes and electrode/flux combinations (all-weld
    metal deposits) for submerged arc welding of creep resisting and low-alloy elevated-temperature
    application steels. One electrode can be tested and classified with different
    fluxes. The solid wire electrode is also classified separately based on its chemical
    composition. This document is a combined specification providing a classification
    system based on either: — the chemical composition of the solid wire electrode
    and all-weld metal deposit; or — the tensile strength of the all-weld metal deposit
    and the chemical composition of the solid wire electrode and all-weld metal deposit
    obtained with the electrode/flux combination. Clauses, subclauses and tables which
    carry the suffix letter "A" are applicable only to solid wire electrodes, tubular
    cored electrodes and all-weld metal deposits classified in accordance with the
    system based upon chemical composition. Clauses, subclauses and tables which carry
    the suffix letter "B" are applicable only to solid wire electrodes, tubular cored
    electrodes and all-weld metal deposits classified in accordance with the system
    based upon the tensile strength of all-weld metal deposits and the chemical composition
    of solid wire electrodes and all-weld metal deposits. Clauses, subclauses and
    tables which do not have either the suffix letter "A" or the suffix letter "B"
    are applicable to all solid wire electrodes, tubular cored electrodes and electrode/flux
    combinations classified under this document.'
