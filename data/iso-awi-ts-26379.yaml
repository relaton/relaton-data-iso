abstract:
- language: en
  script: Latn
  content: 'This Technical Specification defines a descriptor-driven method to evaluate
    shape fidelity between a physical item and its digital twin (DTw) representation.
    It specifies: - Required terminology, data models, and computation steps for using
    3D shape descriptors to quantify 3D shape similarity. - Taxonomy of descriptor
    classes. - Conformance requirements for metric calculation and reporting. Out
    of scope: Predictive simulation results (CFD/FEM) and non-geometric fidelity scoring
    such as motion or performance.'
