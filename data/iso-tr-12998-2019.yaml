abstract:
- language: en
  script: Latn
  content: 'This document gives recommendations for test specimens and procedures
    for performing constant load amplitude fatigue tests on single- and multi-joint
    sheet specimens in the thickness range from 0,5 mm to 6 mm at room temperature
    and a relative humidity of max. 80 %. NOTE The thickness range for advanced high
    strength steels (AHSS) and ultra high strength steels (UHSS) is generally below
    3,0 mm. Greater thicknesses apply for aluminium alloys, for example. This document
    covers: — testing of joints to evaluate materials; — evaluation of the influence
    of joint type and joint size on the test results; — evaluation of the influence
    of load type and load mode on the test results; — testing of component-like specimens
    to evaluate their structural performance. Depending on the specimen used, it is
    possible from the results to evaluate the fatigue behaviour of joints under shear-,
    peel-, normal-tension and combinations of loads and that of the tested specimen.
    The results of fatigue testing obtained with component like specimens are suitable
    for deriving criteria for the selection of materials and thickness combinations
    for structures and components subjected to cyclic loading. This statement is especially
    relevant for results obtained with specimens with boundary conditions, i.e. a
    local stiffness, similar to that of the structure in question. The results of
    fatigue testing are suitable for direct application to a design only when the
    loading conditions in service and the stiffness of the design in the joint area
    are similar. This document does not apply to civil engineering applications such
    as metal building and steel construction which are covered by other applicable
    standards.'
