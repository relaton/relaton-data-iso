abstract:
- language: en
  script: Latn
  content: ISO 11452-10:2009 specifies a conducted voltage test method and procedure
    for determining the immunity of electronic components of passenger cars and commercial
    vehicles, regardless of the propulsion system (e.g. spark-ignition engine, diesel
    engine, electric motor). The method is applied to each individual device under
    test (DUT) lead and is applicable to all power and output leads, as well as low
    frequency analogue leads. The method is particularly useful in evaluating DUTs
    with acoustic or visible display functions. The disturbances considered in ISO
    11452-10:2009 are limited to continuous narrowband electric voltage waveforms.
