abstract:
- language: en
  script: Latn
  content: ISO 10381-6:2009 provides guidance on the collection, handling and storage
    of soil for subsequent testing under aerobic conditions in the laboratory. The
    recommendations in this document are not applicable to the handling of soil where
    anaerobic conditions are to be maintained throughout. ISO 10381-6:2009 is mainly
    applicable to temperate soils. Soils collected from extreme climates (e.g. permafrost,
    tropical soils) may require special handling.
