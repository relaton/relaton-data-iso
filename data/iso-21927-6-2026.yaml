abstract:
- language: en
  script: Latn
  content: This document applies to pressure differential system kits and components,
    positioned on the market and intended to operate as part of a pressure differential
    system. The purpose of a pressure differential system is to prevent protected
    spaces from smoke spread by using pressure difference and airflow. This document
    specifies characteristics and test methods for components and kits for pressure
    differential systems to produce and control the required pressure differential
    and airflow between protected and unprotected space.
