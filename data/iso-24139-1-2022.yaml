abstract:
- language: en
  script: Latn
  content: This document specifies the technical delivery conditions regarding design,
    geometric dimensions, materials, manufacturing procedures, inspection methods,
    non-destructive testing (NDT), marking, package and storage for corrosion resistant
    alloy (CRA) clad bends for use in pipeline transportation systems for the petroleum
    and natural gas industries. This document is applicable to CRA clad bends for
    use in transportation or process pipelines transporting corrosive media-containing
    single-phase or multi-phase fluid such as oil, gas and water for the petroleum
    and natural gas industries. It can also be used as reference in other fields.
    Two technical delivery conditions classes for clad bends are designated. Class
    B provides a standard quality level for clad bends and Class S provides technical
    requirements for sour-service conditions. It is the responsibility of the purchaser
    to specify the appropriated class, based upon the intended use and design requirements.
