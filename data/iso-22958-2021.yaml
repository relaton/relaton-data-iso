abstract:
- language: en
  script: Latn
  content: This document specifies a test for measuring the resistance of fabrics
    to the penetration of water by impact. It can be used to predict the probable
    rain penetration resistance of textile fabrics. This document is applicable to
    any textile fabric, whether or not it has been given a water-resistant or water-repellent
    finish. It is especially suitable for measuring apparel fabrics. Testing at different
    intensities of water impact gives a complete picture of the penetration resistance
    of a single fabric or combination of fabrics. The test is particularly suitable
    when measuring highly water-resistant fabrics with low amounts of water penetration.
