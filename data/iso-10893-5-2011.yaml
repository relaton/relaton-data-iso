abstract:
- language: en
  script: Latn
  content: ISO 10893-5:2011 specifies requirements for magnetic particle inspection
    of seamless and welded ferromagnetic steel tubes for the detection of surface
    imperfections on the tube body and the end/bevel face at the ends. For the tube
    body, it specifies requirements for the detection of surface imperfections on
    all or part of the outside surface of tubes. However, by agreement between the
    purchaser and manufacturer, it can be applicable to the inside surface over a
    limited length from the ends of tubes, dependent on the tube diameter. In addition,
    ISO 10893-5:2011 can be used, as appropriate, to locate the position of external
    surface imperfections detected by another non-destructive testing method (e.g.
    ultrasonic) prior to dressing of the tube surface, and to ensure complete removal
    of the imperfection after dressing is complete. For the end/bevel face at the
    ends of plain-end and beveled-end tubes, ISO 10893-5:2010 specifies requirements
    for the detection of laminar imperfections which can interfere with subsequent
    fabrication and inspection operations (e.g. welding and ultrasonic inspection
    of the welds). ISO 10893-5:2011 is applicable to the detection of imperfections,
    other than laminar imperfections, on the end/bevel face. In this case, magnetization
    is applied in the direction essentially perpendicular to the orientation of the
    particular imperfections being detected. It can also be applicable to the testing
    of hollow sections.
