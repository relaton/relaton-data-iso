abstract:
- language: en
  script: Latn
  content: This document specifies Product Category Rules (PCR) to determine the partial
    Carbon Footprint of a Product (CFP) to support the evaluation of the environmental
    impact of machine tools. This PCR is based on ISO 14067, which is based on the
    ISO standards ISO 14040 and ISO 14044 for life cycle assessment. This document
    considers the impact category “Climate Change” and the life cycle phases from
    cradle to gate. It is intended to describe the determination of the CFP of subsequent
    life cycle phases (in particular transportation from gate to customer, commissioning,
    use and end of life) in further parts. This document is applicable to the entire
    product category of machine tools for metal cutting and metal forming, regardless
    of the technology. It can be used for other product categories that fulfil equivalent
    functions, e.g. processing other materials than metal, e. g. wood, when cutting
    or forming. PCR complement the underlying standards by providing specific rules,
    requirements and guidelines for the development of Environmental Product Declarations
    (EPDs) for one or more specific product categories. PCRs enable different users
    to achieve consistent results when evaluating products of the same product category.
    Environmental Product Declarations (EPDs) are voluntary documents that allow a
    company or organization to provide transparent, consistent and verifiable information
    on the environmental impact of its products (goods or services).
