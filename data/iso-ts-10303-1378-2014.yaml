abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1378:2014-02 specifies the application module for Cfd results.
    The following are within the scope of ISO/TS 10303-1378:2014-02: digital data
    on structured and unstructured grids describing steady or unsteady fluid dynamics
    flowfields; data at any point in the analysis activity; data regarding the exchange
    of energy by molecular transport including convection, conduction, and advection;
    rotating flowfields (e.g., turbomachinery); Newtonian transport laws;'
