abstract:
- language: en
  script: Latn
  content: This document specifies the use of the Karl Fischer method for the determination
    of water in the total particulate matter (TPM) of the mainstream smoke with a
    smoking regime according to ISO 3308 (standard smoking regime). The smoking of
    cigarettes and the collection of TPM are carried out in accordance with ISO 4387.
    However, the method is also applicable to the determination of water in TPM obtained
    by non-standard smoking. NOTE ISO 4387 specifies the use of gas chromatography
    for the determination of water in TPM solutions (see also ISO 10362-1). In countries
    not in a position to use the gaschromatographic method, the determination of water
    in TPM can be performed by the method described in this document and an appropriate note
    made in the expression of the results.
