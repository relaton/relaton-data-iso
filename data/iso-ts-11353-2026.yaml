abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the detection of nano-objects
    release, irrespective of its causes, from surgical masks, surgical respirator
    masks and barrier face coverings [reusable (regardless of washing characteristics)
    and disposable types] containing nano-objects, irrespective of the type of production
    technology. In addition, this document also provides the sampling procedures and
    qualitative characterization methods for released nano-objects. This document
    can be used to show the possible exposure due to release, which relates to human
    health and safety.
