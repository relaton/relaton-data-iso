abstract:
- language: en
  script: Latn
  content: This document specifies methods for measuring the image information content
    and metrics of digital cameras for image-based analysis. Metrics are based on
    the spatial frequency response (SFR) and noise power spectrum (NPS) of the camera
    system. Derived metrics include noise equivalent quanta (NEQ), ideal observer
    signal-to-noise ratio (SNRi), edge location sigma (σE), and information capacity.
    The metrics are applicable to the measurement of minimally processed output images
    of both monochrome and colour cameras. The results of the measurement methods
    specified in this document are used to characterize image information properties
    for object detectability and do not represent image quality for perceptual interpretation
    of images. Spatial signal processing that can be applied to raw data for generating
    minimally processed images, which the metrics in this document are applicable
    to, includes demosaicing and spatially uniform linear processing. Non-linearly
    processed images are out of the scope of this document.
