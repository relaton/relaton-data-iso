abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and provides guidance for a management
    system for educational organizations (EOMS) when such an organization: a)      
    needs to demonstrate its ability to support the acquisition and development of
    competence through teaching, learning or research; b)       aims to enhance satisfaction
    of learners, other beneficiaries and staff through the effective application of
    its EOMS, including processes for improvement of the system and assurance of conformity
    to the requirements of learners and other beneficiaries. All requirements of this
    document are generic and intended to be applicable to any educational organization
    that uses a curriculum to support the development of competence through teaching,
    learning, training or research, regardless of the type, size or method of delivery.
    This document can be applied to educational organizations within larger organizations
    whose core business is not education, such as professional training departments.
    This document also provides guidance for the use of a EOMS. This document does
    not apply to organizations that only produce or manufacture educational products.'
