abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the pour point
    of petroleum products. A separate procedure suitable for the determination of
    the lower pour point of fuel oils, heavy lubricant base stock, and products containing
    residual fuel components is also described. The procedure described in this document
    is not suitable for crude oils. NOTE There is equipment available that uses an
    automated procedure similar to the one described in this document. However, the
    precision thereof has not been established[1]. [1] ISO develops an automated test
    method standard.
