abstract:
- language: en
  script: Latn
  content: This document specifies the determination of the antiviral activity of
    materials that contain photocatalytic materials or have photocatalytic films on
    the surface, by measuring the infectivity of titre of virus after irradiation
    of ultraviolet light using the virus that can infect animal cells. Due to the
    individual sensitivities, the results of one test virus might not be applicable
    for other viruses. This document is intended for use with different kinds of semiconducting
    photocatalytic materials used in construction materials, in flat sheet, board,
    or plate shape that are the basic forms of materials for various applications.
    It does not include powder, granular, or porous photocatalytic materials. This
    document is applicable to photocatalytic materials produced for antiviral applications.
    Other types of performance of photocatalytic materials, i.e. antibacterial activity,
    antifungal activity, decomposition of water contaminants, self-cleaning, antifogging,
    and air purification, are not determined by this test method. The values expressed
    in this International Standard are in accordance with the International System
    of Units (SI).
