abstract:
- language: en
  script: Latn
  content: 'This document specifies the method for the evaluation of Commercial Sterility
    by streaking method. It is applicable specifically to products intended for human
    consumption and product for feeding animals which are heat-processed, sold in
    hermetically sealed containers, and ambient stable, such as food types listed
    in Annex C. This document is not applicable to product kept in refrigerated conditions,
    nor to products that are microbiologically stable due to the addition of preservatives.
    NOTE This method has been validated in an interlaboratory study for the following
    food categories: — category 1]; — category 2];'
