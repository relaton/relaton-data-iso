abstract:
- language: en
  script: Latn
  content: This document specifies general requirements for cabins and control stations
    from which cranes, as defined in ISO 4306 1, are operated. It also specifies requirements
    for control devices respectively control actuators and their arrangement in a
    control station. Specific requirements for particular types of cranes are given
    in the other parts of ISO 25822. This document does not specify requirements for
    elevating cabins and elevating control stations
