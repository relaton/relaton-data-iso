abstract:
- language: en
  script: Latn
  content: This document specifies a thermal pre-ageing procedure for leather to obtain
    indications about the tendency to the formation of hexavalent chromium under specified
    conditions and the determination of hexavalent chromium according to ISO 17075‑1
    or ISO 17075‑2. This thermal pre-ageing procedure does not simulate any real condition
    in leather production or use. It is applicable to all types of chromium tanned
    leather.
