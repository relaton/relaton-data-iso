abstract:
- language: en
  script: Latn
  content: 'ISO 22825:2006 specifies the approach to be followed when developing procedures
    for the ultrasonic testing of the following welds: welds in austenitic stainless
    steels;welds in nickel-based alloys;welds in duplex steels;dissimilar metal welds.
    The purposes of the testing can be very different, e.g.: for the assessment of
    quality level (manufacturing);for the detection of specific indications induced
    in service. Acceptance levels are not included in ISO 22825:2006, but can be applied
    in accordance with the scope of the testing. The requirements of ISO 22825:2006
    are applicable to both manual and mechanized testing.'
