abstract:
- language: en
  script: Latn
  content: This document specifies a framework for the generation process of tyre
    model parameter sets, including a classification of the data sources and methods
    used. This document focuses on the process of generating the tyre model parameter
    sets covering the definition of required input data for certain standard applications.
    This document enables a structured exchange between tyre model users and tyre
    model providers by defining a fitting report for the tyre model parameter set.
    The exchanged information shall ensure that the tyre model parameter sets are
    suitable for the intended range of applications, and enable the model providers
    to ensure that all relevant model features are parameterized for the intended
    operating conditions and based on suitable input data by increasing transparency
    and traceability.
