abstract:
- language: en
  script: Latn
  content: This document specifies the capabilities and responsibilities required
    for the qualification of the AM operators on the field of the additive manufacturing
    technologies dealing with metallic parts production, specifically for the employment
    of DED-LB/M. This document specifies criteria for the theoretical and practical
    assessment of personnel operating DED-LB/M machines. The activities and procedures
    foreseen to be performed by the DED-LB/M operator are also part of this document.
    This document is intended to provide an outline for qualification of AM machine
    operators in general industrial applications.
