abstract:
- language: en
  script: Latn
  content: This document specifies a comparative method for determining the flow characteristic
    of a fused thermosetting coating powder down a plane inclined at a set angle to
    the horizontal. The aim of the test method described in this document gives an
    indication of the degree of melt flow that can occur during the curing of the
    coating powder. This characteristic contributes to the surface appearance and
    to the degree of coverage over sharp edges. The test is a comparative method for
    checking for batch to batch variation in the behaviour of a given coating powder.
    Correlation between the results from coating powders of differing composition
    is not to be expected. This method is not suitable for coating powders which have
    gel times of less than 1 min at the test temperature when characterised according
    to ISO 8130‑6. This method is also not suitable for textured powders.
