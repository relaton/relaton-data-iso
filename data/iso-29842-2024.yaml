abstract:
- language: en
  script: Latn
  content: This document specifies a method for the application of balanced incomplete
    block designs to sensory descriptive and hedonic tests. This document is applicable
    when the number of test samples exceeds the number of evaluations that an assessor
    can perform reliably in a single session. This document also specifies the fundamental
    characteristics of balanced incomplete block designs and establishes guidelines
    for their application in sensory evaluation.
