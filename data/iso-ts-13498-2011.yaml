abstract:
- language: en
  script: Latn
  content: ISO/TS 13498:2011 establishes a method to determine the torsional yield
    strength and maximum torque of the implant body/connecting part joints of endosseous
    dental implant systems. This test is most appropriate for evaluating new types
    of joints and connecting parts, as well as new materials. ISO/TS 13498:2011 provides
    a protocol for torsional loading of an implant body/connecting part joint. It
    is not applicable for predicting the in vivo performance of an endosseous dental
    implant system and it is not derived from observations of clinical failure.
