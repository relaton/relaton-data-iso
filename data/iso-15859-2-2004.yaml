abstract:
- language: en
  script: Latn
  content: 'ISO 15859-2:2004 specifies limits for the composition of hydrogen and
    establishes the sampling and test requirements applicable for the verification
    of the hydrogen composition. ISO 15859-2:2004 is applicable to hydrogen used in
    both flight hardware and ground facilities, systems and equipment, of the following
    types and grades: Type I, gaseous (Grade A: fuel, Grade F: fuel) and Type II,
    liquid (Grade A: fuel, Grade F: fuel). ISO 15859-2:2004 is applicable to influents
    only to the extent specified. ISO 15859-2:2004 is applicable to any sampling operation
    required to ensure that, when the fluid enters the launch vehicle or spacecraft,
    the fluid composition complies with the limits provided hereafter or with any
    technical specification agreed to for a particular use.'
