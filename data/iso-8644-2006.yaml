abstract:
- language: en
  script: Latn
  content: 'ISO 8644:2006 specified methods for determining the performance of light-alloy
    road wheels for motorcycles under normal road use. It is applicable to wheels
    for motorcycles with two or three wheels (including motorcycles equipped with
    side-cars) as defined in ISO 3833, of the following types: unit construction light-alloy
    wheels; andcomposite construction light-alloy wheels.'
