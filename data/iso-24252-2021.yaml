abstract:
- language: en
  script: Latn
  content: 'This document applies for systems for biogas production by anaerobic digestion,
    biogas conditioning, biogas upgrading and biogas utilization from a safety, environmental,
    performance and functionality perspective, during the design, manufacturing, installation,
    construction, testing, commissioning, acceptance, operation, regular inspection
    and maintenance phases. The following topics are excluded from this document:
    —    boilers, burners, furnaces and lighting in case these are not specifically
    applied for locally produced biogas; —    gas fuelled engines for vehicles and
    ships; —    the public gas grid; —    specifications to determine biomethane quality;
    —    transportation of compressed or liquefied biogas; —    transportation of
    biomass or digestate; —    assessment and determination whether biomass is sourced
    sustainably or not. An informative explanation of the scope is included in Annex A.'
