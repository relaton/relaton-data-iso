abstract:
- language: en
  script: Latn
  content: ISO 4302:2016 specifies the assessment of wind loads on cranes. It establishes
    general methods for calculating wind loads (for in-service and out-of-service
    conditions), which are included in the load combinations stated in ISO 8686-1
    and used for proofs of competence such as those given in ISO 20332 for the structural
    components of cranes. It provides a simplified method of calculation and assumes
    that - the wind may blow horizontally from any direction, - the wind blows at
    a constant speed, - there is a static reaction to the wind load applied to the
    crane structure. It includes built-in allowances for the effects of gusting (fluctuation
    in wind speed) and for dynamic response. It gives guidance on when to secure the
    crane for out-of-service conditions.
