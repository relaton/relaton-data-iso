abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for the use of treated wastewater (TWW)
    and treated greywater (TGW) for the irrigation of golf courses and other outdoor
    sports fields. This document covers aspects for the irrigation of turfgrass in
    golf courses and other sports fields, including: —    public health aspects; —   
    agronomic aspects. Additionally, this document provides guidance for the recovery
    and treatment of water from swimming pool operations for the irrigation of sports
    fields. NOTE           This document is not intended to be used for certification
    purposes.'
