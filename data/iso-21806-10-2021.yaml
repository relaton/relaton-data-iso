abstract:
- language: en
  script: Latn
  content: This document specifies the 150-Mbit/s coaxial physical layer for MOST
    (MOST150 cPHY), a synchronous time-division-multiplexing network. This document
    specifies the applicable constraints and defines interfaces and parameters, suitable
    for the development of products based on MOST150 cPHY. Such products include coaxial
    links, coaxial receivers, coaxial transmitters, electrical to coaxial converters,
    and coaxial to electrical converters. This document also establishes basic measurement
    techniques and actual parameter values for MOST150 cPHY.
