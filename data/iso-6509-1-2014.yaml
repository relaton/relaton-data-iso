abstract:
- language: en
  script: Latn
  content: ISO 6509-1:2014 specifies a method for the determination of dezincification
    depth of copper alloys with zinc exposed to fresh, saline waters or drinking water.
    The method is intended for copper alloys with a mass fraction of zinc more than
    15 %. ISO 6509-1:2014 describes only the test methodology and does not set out
    criteria for acceptability of materials for a specific application. Acceptance
    criteria are described in ISO 6509‑2.
