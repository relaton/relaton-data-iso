abstract:
- language: en
  script: Latn
  content: This document specifies the minimum quality requirements and test methods
    for Ophiopogon japonicus root tuber(the dried root tuber of Ophiopogon japonicus
    (L. f.) Ker-Gawl). This document applies to Ophiopogon japonicus root tuber sold
    and used as Chinese materia medica (whole medicinal materials) and decoction pieces
    derived from these plants. This document does not apply to the processed Ophiopogon
    japonicus root tuber, including products traditionally processed with different
    methods, and its processing methods.
