abstract:
- language: en
  script: Latn
  content: 'This document, in addition to ISO 16092-1, specifies technical safety
    requirements and measures to be adopted by persons undertaking the design, manufacture
    and supply of the following groups of mechanical presses and mechanical press
    production systems: — Group 1: Presses with a part revolution clutch(es); — Group
    2: Presses with a servo drive system (Mechanical servo presses). NOTE 1 Requirements
    in this document are essentially applicable to both groups of the mechanical press.
    If a requirement applies to only one group, then the group is specified. NOTE
    2 Other types of motorized drive systems provide similar functionalities to what
    is commonly called "servo drives" or "servo motors", and as such their use is
    considered the same within the terms used in this document (e.g. variable frequency
    drive systems). The presses covered by this document range in size from small
    high-speed machines with a single operator producing small workpieces to large
    relatively slow-speed machines with several operators and large complex workpieces.
    This document deals with all significant hazards relevant to mechanical presses
    and ancillary devices (e.g. moving die cushions, work-piece ejectors, feeding
    and transfer systems) which are integral to the machine, when they are used as
    intended and under the conditions of misuse which are reasonably foreseeable by
    the manufacturer (see Clause 4). All phases of the machine life cycle as described
    in ISO 12100:2010, 5.4 have been taken into consideration. NOTE 2 All significant
    hazards means those identified or associated with presses at the time of the publication
    of this document. In addition to machines not covered by ISO 16092-1:2017, this
    document does not cover machines which: a) transmit energy to impart press slide
    motion by using hydraulic or pneumatic means; b) have two or more slides moving
    in different angular orientations from each other; NOTE 3 This document applies
    to presses which have two or more slides moving in the same angular orientations,
    e.g. a press which has inner and outer slides. c) transmit energy to impart press
    slide motion by using a linear motor mechanism(s).'
