abstract:
- language: en
  script: Latn
  content: This document, based on ISO/TS 19468, specifies a platform-specific method
    for implementing data exchange among centres based on simple object access protocol
    (SOAP), supporting the EN 16157 series (DATEX II) for Push/Pull data delivery
    and service request/feedback collaborative intelligent transport system (ITS)
    services. This document defines the message rules and procedures for communication
    between transport information and control systems using XML (Profile B). This
    document clarifies how to package end-application messages and relevant data.
    The payload data definition used in specific end-applications and the exact structure
    of the content payload delivered in the messages are beyond the scope of this
    document. Rules and procedures for exchanging data-packets in lower communication
    layers are also out of the scope of this document. These functionalities can be
    implemented using generic protocols defined in the industry standards. However,
    this document does define how to use these protocols.
