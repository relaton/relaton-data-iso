abstract:
- language: en
  script: Latn
  content: This document provides requirements and guidelines for the characterization
    of native species of plants, algae and fungi and the products derived from them,
    which have been collected, harvested or processed. This document aims to enable
    the establishment of minimum quality and safety requirements considering sustainable
    management of biodiversity. This document also covers the protection of biodiversity
    along all steps of the value chain of the products derived from native species 
    through the application of a biodiversity management plan. This document does
    not apply to native animal species, timber and wood products.
