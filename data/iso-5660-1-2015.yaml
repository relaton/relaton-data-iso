abstract:
- language: en
  script: Latn
  content: ISO 5660-1:2015 specifies a method for assessing the heat release rate
    and dynamic smoke production rate of specimens exposed in the horizontal orientation
    to controlled levels of irradiance with an external igniter. The heat release
    rate is determined by measurement of the oxygen consumption derived from the oxygen
    concentration and the flow rate in the combustion product stream. The time to
    ignition (sustained flaming) is also measured in this test. The dynamic smoke
    production rate is calculated from measurement of the attenuation of a laser light
    beam by the combustion product stream. Smoke obscuration is recorded for the entire
    test, regardless of whether the specimen is flaming or not.
