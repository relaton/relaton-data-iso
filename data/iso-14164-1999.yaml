abstract:
- language: en
  script: Latn
  content: This International Standard describes the operating principles and the
    most important performance characteristics of automated flow-measuring systems
    for determining the volume flowrate in the ducts of stationary sources. Procedures
    to determine the performance characteristics of automated volume flow-measuring
    systems are also contained in this International Standard. The performance characteristics
    are general and not limited to specific measurement principles or instrument systems.
    NOTE Commercial systems which use the operating principles described and meet
    the requirements of this International Standard are readily available.
