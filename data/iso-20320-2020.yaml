abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and test methods for ergonomics,
    innocuousness, comfort/sizing, restraint, ability to limit wrist extension and
    attenuate impact force on the palm as well as provisions for marking and instructions
    supplied by the manufacturer for wrist protectors for all users of snowboard equipment.
    It does not apply to protectors used in roller sports, alpine skiing, or other
    sports. This document does not address protection for the forearm due to axial
    forces caused by an impact on the fingers or fist. Moreover, this document does
    not address protection against palmar flexion (terminal flexion) caused by an
    impact on the dorsal side of the hand.
