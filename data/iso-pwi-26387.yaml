abstract:
- language: en
  script: Latn
  content: This standard specifies two total leak testing methods for spacecraft,
    including helium mass Spectrometer vacuum leak testing method and helium mass
    Spectrometer accumulation leak testing method. The standard specifies the general
    requirements, application objects, system composition, leak testing processes,
    and document’s requirements. The standard applies to the leak testing of spacecraft
    component, subsystem and system level products. The detection of a test gas using
    mass spectrometers is far and away the most sensitive leak detection method and
    the one most widely used in industry. The mass spectrometer leak detector(MSLD)
    developed for this purpose make possible quantitative measurement of leak rates
    in a range extending across many powers of ten whereby the lower limit 10-13 Pa·m3/s,
    thus making it possible to demonstrate the inherent gas permeability of solids
    where helium is used as the test gas. It is actually possible in principle to
    detect all gases using mass spectrometry. Of all the available options, the use
    of helium as a tracer gas has proved to be especially practical. The detection
    of helium using the mass spectrometer is absolutely unequivocal. Helium is chemically
    inert, non-explosive, non-toxic, is present in normal air in a concentration of
    only 5 ppm and is quite economical. A mass spectrometer will operate only in a
    vacuum. Due to the minimum vacuum level of 1×10-2 Pa, a high vacuum will be required.
    Turbomolecular pumps and suitable roughing pumps are used in modern leak detectors.
    Associated with the individual component groups are the required electrical- and
    electronic supply systems and software which, via a microprocessor, allow for
    the greatest possible degree of automation in the operating sequence, including
    all adjustment and calibration routines and measured value display.
