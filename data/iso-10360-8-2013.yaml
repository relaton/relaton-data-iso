abstract:
- language: en
  script: Latn
  content: ISO 10360-8:2013 specifies the acceptance tests for verifying the performance
    of a CMM (coordinate measuring machine) when measuring lengths as stated by the
    manufacturer. It also specifies the reverification tests that enable the user
    to periodically reverify the performance of the CMM. The acceptance and reverification
    tests are applicable only to Cartesian CMMs with optical distance sensors. While
    it does not explicitly apply to non-Cartesian CMMs, the parties may apply ISO
    10360-8:2013 to non-Cartesian CMMs by mutual agreement. It is not intended to
    be applicable to CMMs whose measuring volume is significantly smaller than the
    size of the test sphere. However, the principle, artefacts and procedure of the
    test described are useful for the acceptance and reverification tests of those
    CMMs ? either as it is or with modifying the parameters such as the size of the
    test artefacts and the number of measurements. ISO 10360-8:2013 specifies performance
    requirements that can be assigned by the manufacturer or the user of the CMM,
    the manner of execution of the acceptance and reverification tests to demonstrate
    the stated requirements, rules for verifying conformance, and applications for
    which the acceptance and reverification tests can be used.
