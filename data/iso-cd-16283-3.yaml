abstract:
- language: en
  script: Latn
  content: ISO 16283-3:2016 specifies procedures to determine the airborne sound insulation
    of façade elements (element methods) and whole façades (global methods) using
    sound pressure measurements. These procedures are intended for room volumes in
    the range from 10 m3 to 250 m3 in the frequency range from 50 Hz to 5 000 Hz.
    The test results can be used to quantify, assess, and compare the airborne sound
    insulation in unfurnished or furnished rooms where the sound field can or cannot
    approximate to a diffuse field. The measured airborne sound insulation is frequency-dependent
    and can be converted into a single number quantity to characterize the acoustic
    performance using the rating procedures in ISO 717-1.
