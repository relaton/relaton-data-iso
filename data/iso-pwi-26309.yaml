abstract:
- language: en
  script: Latn
  content: This standard specifies the monitoring requirements, and methodologies
    for krypton-85 in the gaseous effluent of nuclear power plants. This standard
    specifies instruments and equipment, reagents and materials, analytical procedures,
    and calculation of results for measuring krypton 85 gas in nuclear power plants
    by liquid scintillation spectrometer counting method. This standard is not applicable
    to environmental sample.
