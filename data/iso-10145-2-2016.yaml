abstract:
- language: en
  script: Latn
  content: 'ISO 10145-2:2016 specifies the general dimensions of end mills with brazed
    helical hardmetal tips, with 7/24 taper shank. The following two types of end
    mills with 7/24 taper shank are specified: - end mills with 7/24 taper shank for
    manual changing; - end mills with 7/24 taper shank for automatic tool changers.
    ISO 10145-2:2016 applies to right-hand and left-hand end mills, irrespective of
    helix angle and number of flutes.'
