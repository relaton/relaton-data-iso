abstract:
- language: en
  script: Latn
  content: This document provides guidance and requirements for risk assessment and
    implementation of prevention and protection measures relating to additive manufacturing
    with metallic powders. The risks covered by this document concern all sub-processes
    composing the manufacturing process, including the management of waste. This document
    does not specify requirements for the design of machinery and equipment used for
    additive manufacturing.
