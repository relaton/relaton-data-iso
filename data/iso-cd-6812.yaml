abstract:
- language: en
  script: Latn
  content: This document specifies the main design dimensions and basic requirements
    concerning the Roll on/Roll off ship-to-shore connection. This document applies
    to Ro/Ro terminals and ship ramps used for Ro/Ro ships with straight bow/stern
    ramps. It does not apply to Ro/Ro terminals used for specialised ferry services,
    such as  train ferries, and ships that have no ramp of their own.
