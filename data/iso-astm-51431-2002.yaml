abstract:
- language: en
  script: Latn
  content: ISO/ASTM 51431 describes dosimetric procedures to be followed in facility
    characterization, process qualification and routine processing for electron beam
    and bremsstrahlung irradiation facilities for food processing in order to ensure
    that the product receives an acceptable range of absorbed doses. Other procedures
    related to facility characterization, process qualification and routine product
    processing that may influence and be used to monitor absorbed doses in the product
    are also discussed. The electron energy range covered in this practice is from
    0,3 MeV to 10 MeV. Such electrons can be generated in continuous or pulse modes.
    The maximum electron energy of bremsstrahlung facilities covered in this practice
    is 10 MeV. A photon beam can be generated by inserting a bremsstrahlung converter
    in the electron beam path.
