abstract:
- language: en
  script: Latn
  content: This document specifies a framework for data interoperability of data systems,
    such as databases, data management systems, web interfaces, API, etc. that manage
    stem cell data. It is applicable to all human stem cell types. This document does
    not apply to other animal stem cells or plant stem cells. This document specifies
    considerations and requirements of stem cell data for data interoperability, such
    as cell characteristics, applied technologies, ethical requirements, and data
    sharing, analysis, and accessibility. This document describes an interoperable
    framework for stem cell data, which can be used for existing systems or existing
    architectures. The intended audiences for this document are data generators, implementors
    of IT infrastructure to handle the data, data providers and data consumers.
