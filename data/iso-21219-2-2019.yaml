abstract:
- language: en
  script: Latn
  content: This document specifies rules for the creation and extending of TPEG application
    UML models. The rules are intended to ensure that TPEG application UML models
    can be interpreted unambiguously for conversion to physical format representations.
    TPEG application UML models that are defined according to these rules can be used
    for automatic generation of TPEG standards and for automatic generation of TPEG
    application physical format descriptions. This document also specifies the preferred
    structure of TPEG application specifications. The TPEG abstract data types and
    the set of TPEG tables of common use are specified in the annexes.
