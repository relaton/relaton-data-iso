abstract:
- language: en
  script: Latn
  content: ISO 7867-1:2005 establishes the size designation, the dimensional calculation
    and the markings of the metric series of tyres primarily intended for use on agricultural
    tractors and machines. Tyre and rim coordination is also given. ISO 7867-1:2005
    applies to bias-belted, diagonal and radial tyres mounted an 5° tapered rims,
    as specified in ISO 4251-3. Only established rim diameters and widths within the
    ranges in Tables 1 and 2 are recommended. ISO 7867-1:2005 also applies to different
    concepts and types of tyres and rims; in this case, however, appropriate rim/section
    ratios K1 and coefficients K2, a and b will be established and added. Dimensions
    of existing rims are specified in ISO 4251-3.
