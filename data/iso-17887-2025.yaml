abstract:
- language: en
  script: Latn
  content: This document specifies ways in which rare earths can be traced as they
    move through the supply chain between the separated products to rare earth permanent
    magnets, or otherwise to be further processed. The documented traceability information
    is applicable to purchasers, suppliers, and users of rare earth permanent magnets
    to identify parties in the supply chain who have processed a given shipment of
    rare earth material, the location of that rare earth material as it passes between
    supply chain nodes. The documented traceability information is also applicable
    to supply chain actors and end users who use this information to check the validity
    of any claims made on the rare earth permanent magnets concerning sustainability,
    environmental impact, or recycled material content.
