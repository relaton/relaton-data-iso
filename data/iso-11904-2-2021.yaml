abstract:
- language: en
  script: Latn
  content: This document specifies basic framework measurement methods for sound immission
    from sound sources placed close to the ear. These measurements are carried out
    with a manikin, equipped with ear simulators including microphones. The measured
    values are subsequently converted into corresponding free-field or diffuse-field
    levels. The results are given as free-field related or diffuse-field related equivalent
    continuous A-weighted sound pressure levels. The technique is denoted the manikin
    technique. This document is applicable to exposure to sound from sources close
    to the ear, for example during equipment tests or at the workplace to sound from
    earphones or hearing protectors with audio communication facilities. This document
    is applicable in the frequency range from 20 Hz to 10 kHz. For frequencies above
    10 kHz, ISO 11904-1 can be used.
