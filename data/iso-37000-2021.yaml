abstract:
- language: en
  script: Latn
  content: This document gives guidance on the governance of organizations. It provides
    principles and key aspects of practices to guide governing bodies and governing
    groups on how to meet their responsibilities so that the organizations they govern
    can fulfil their purpose. It is also intended for stakeholders involved in, or
    impacted by, the organization and its governance. It is applicable to all organizations
    regardless of type, size, location, structure or purpose.
