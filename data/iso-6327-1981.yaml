abstract:
- language: en
  script: Latn
  content: Describes hygrometers which determine the water content of a gas by detecting
    water vapour condensation occurring on a cooled surface or by checking the stability
    of the condensation on this surface. The hygrometers considered here may be used
    for determining water vapour pressure, without requiring calibration, in a system
    operating under total pressures greater than or equal to atmospheric pressure.
