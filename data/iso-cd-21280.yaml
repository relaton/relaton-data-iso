abstract:
- language: en
  script: Latn
  content: This document applies to air-to-air air conditioners and heat pumps. This
    document deals with test methods, test conditions, required measurement and calculation
    methods for determining capacity ratings and seasonal performance factors for
    heating and cooling including native control evaluation while minimizing the discrepancy
    between rating seasonal efficiency and average field performance. This document
    provides specific requirements for load-based testing and/or CVP (standard loading,
    required measurements, calculations, and controls).
