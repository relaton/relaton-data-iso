abstract:
- language: en
  script: Latn
  content: This document specifies rules for presentation of aspheric surfaces and
    surfaces with low order symmetry such as cylinders and toroids in the ISO 10110
    series, which standardizes drawing indications for optical elements and systems.
    It also specifies sign conventions and coordinate systems. This document does
    not apply to off-axis aspheric and discontinuous surfaces such as Fresnel surfaces
    or gratings. NOTE For off-axis aspheric and non-symmetric surfaces, see ISO 10110-19.
    This document does not specify the method by which conformity with the specifications
    is tested.
