abstract:
- language: en
  script: Latn
  content: ISO/IEC 30122-3:2017 contains requirements and recommendations concerning
    multilingual voice commands and internationalization. ISO/IEC 30122-3:2017 specifies
    the linguistic requirements and recommendations for translation and localization
    of spoken words or phrases for voice commands. ISO/IEC 30122-3:2017 also includes
    how to determine the correct words or phrases for voice commands based on the
    various linguistic needs. ISO/IEC 30122-3:2017 does not include technical issues.
