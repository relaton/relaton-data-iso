abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and guidelines for: the design parameters
    to be provided to the heating, ventilation and air conditioning (HVAC) unit manufacturer
    by the rolling stock manufacturer (“Customer”) and the railway operator, the test
    and inspection items, requirements and methods used by the HVAC unit manufacturer
    to verify that the HVAC unit conforms with the design parameters. This document
    is applicable to HVAC units for the passenger area and driver’s cabs in urban
    (metro, tramway), suburban, regional and main line vehicles.'
