abstract:
- language: en
  script: Latn
  content: This document is a collection of specific examples of qualitative nucleic
    acid based methods for the detection of genetically modified organisms (GMOs)
    and derived products by analysing the nucleic acids extracted from the sample
    under study. The main focus is on polymerase chain reaction (PCR) based amplification
    methods. This methods have been established for DNA analysis of food matrices,
    but could also be applied to other matrices (e.g. seeds, feed and plant samples
    from the environment).
