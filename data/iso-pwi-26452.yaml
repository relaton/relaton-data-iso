abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the traceability of copper, encompassing
    the supply chain from mining and concentration, to smelting and electrolytic refining.
    It is applicable to artisanal mining, small scale mining and large scale mining
    in all copper supply regions of the world. It is intended to serve as a basis
    for a certification scheme for traceability of copper.
