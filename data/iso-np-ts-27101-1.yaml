abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the recording, linkage, and maintenance of metadata and provenance information associated with next-generation sequencing (NGS) datasets used in the context of plant disease diagnostics and monitoring. The requirements defined in this document apply to metadata and provenance describing plant material and plant material units, sampling context and handling, declared analytical intent, generation of NGS datasets, laboratory and computational processing history, and traceability and linkage across storage, transfer, and exchange. This document is applicable to NGS datasets generated from plant material for the detection and characterization of biological sequences derived from plant-associated organisms, irrespective of the sequencing platform, library preparation method, or bioinformatic implementation used. This document does not specify requirements for NGS analytical or bioinformatic methods, quality evaluation or performance thresholds, interpretation of NGS analytical outputs, diagnostic confirmation, or regulatory, phytosanitary, or certification decision-making. NGS datasets generated in the context of monitoring, surveillance, or research activities are within the scope of this document only with respect to metadata and provenance documentation, and are outside the scope of this document when used as arbiters for regulatory or phytosanitary decisions.
