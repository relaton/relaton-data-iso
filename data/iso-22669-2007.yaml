abstract:
- language: en
  script: Latn
  content: ISO 22669:2007 defines the space link extension (SLE) return-all-frames
    (RAF) service in conformance with ISO 15396:1998. The RAF service is an SLE transfer
    service that delivers to a mission user all telemetry frames from one space link
    physical channel. ISO 22669:2007 defines, in an abstract manner, the RAF service
    in terms of the operations necessary to provide the service;the parameter data
    associated with each operation;the behaviors that result from the invocation of
    each operation; andthe relationship between, and the valid sequence of, the operations
    and resulting behaviors. It does not specify individual implementations or products;the
    implementation of entities or interfaces within real systems;the methods or technologies
    required to acquire telemetry frames from signals received from a spacecraft;the
    methods or technologies required to provide a suitable environment for communications;
    orthe management activities required to schedule, configure, and control the RAF
    service.
