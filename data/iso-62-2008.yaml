abstract:
- language: en
  script: Latn
  content: ISO 62:2008 describes a procedure for determining the moisture absorption
    properties in the “through-the-thickness” direction of flat or curved-form solid
    plastics. It also describes procedures for determining the amount of water absorbed
    by plastic specimens of defined dimensions, when immersed in water or when subjected
    to humid air under controlled conditions. The “through-the-thickness” moisture
    diffusion coefficient can be determined for single-phase material by assuming
    Fickian diffusion behaviour with constant moisture absorption properties through
    the thickness of the test specimen. This model is valid for homogeneous materials
    and for reinforced polymer-matrix composites tested below their glass transition
    temperature. However, some two-phase matrices such as hardened epoxies may require
    a multi-phase absorption model which is not covered by this International Standard.
    The results obtained using the methods described in this International Standard
    are applicable to most plastics but are not applicable to cellular plastics, granulates
    or powders, which can show additional absorption and capillary effects. Plastics
    exposed to moisture under controlled conditions for defined periods of time provide
    relative comparisons between them.
