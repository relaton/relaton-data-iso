abstract:
- language: en
  script: Latn
  content: This document forms Part 2 of the 23793 series which addresses the type3
    road shoulder stop (MRM-SS) of minimal risk manoeuvre (MRM). • This document contains
    the scope for MRM-SS, basic functions and operational principles, control strategy,
    reactions on failure and performance evaluation test methods. • The scope of MRM-SS
    described in this document covers minimum requirements and test procedures for
    ADS executing a MRM-SS, from initiation to termination, which aims to achieve
    an MRC. Specific safety requirements for robust system design, such as what is
    specified in ISO 26262 and ISO 21448, need to be considered when applying MRM
    described in this document, but those safety related standards are not within
    the scope of this standard. • The scope does not include methods for detecting
    ADS failures and the decision-making process to initiate an MRM-SS.
