abstract:
- language: en
  script: Latn
  content: 'This document specifies two methods for digestion of soil, treated biowaste,
    sludge and waste by the use of an aqua regia digestion. Digestion with aqua regia
    will not necessarily accomplish total decomposition of the sample. The extracted
    analyte concentrations may not necessarily reflect the total content in the sample
    but represent the aqua regia soluble metals under the condition of this test procedure.
    It is generally agreed that for environmental analysis purposes, the results are
    fit for the intended purpose to protect the environment. This document is applicable
    for the following elements: Aluminium (Al), antimony (Sb), arsenic (As), barium
    (Ba), beryllium (Be), boron (B), cadmium (Cd), calcium (Ca), chromium (Cr), cobalt
    (Co), copper (Cu), iron (Fe), lead (Pb), magnesium (Mg), manganese (Mn), mercury
    (Hg), molybdenum (Mo), nickel (Ni), phosphorus (P), potassium (K), selenium (Se),
    silver (Ag), sodium (Na), strontium (Sr), sulfur (S), tellurium (Te), thallium
    (Tl), tin (Sn), titanium (Ti), vanadium (V), and zinc (Zn). This document can
    also be applied for the digestion of other elements, provided the user has verified
    the applicability.'
