abstract:
- language: en
  script: Latn
  content: 'This document specifies a methodology for describing and managing interactions
    and a format for digital communication between actors in any use case associated
    with the management of an asset during all life cycle stages. It provides: —    
    a methodology that describes an interaction framework for a use case; —     an
    appropriate way to map responsibilities and interactions that provides a process
    context for information flow; —     a format in which the interaction framework
    is specified and executed. This document is intended to promote secure, verifiable,
    traceable and high-quality digital IDM communication between actors during all
    phases of the life cycle of assets, facilitate interoperability between software
    applications used, and to provide a basis for data- and process-driven information
    exchange and traceability of communication.'
