abstract:
- language: en
  script: Latn
  content: The method described in this Technical Specification is applicable to the
    determination of selected plant-treatment agents and some of their main degradation
    products (metabolites) in drinking water, with a validated reporting limit of
    about (see examples in Table 1). The method may be extended to include additional
    substances and ground water, provided the method is validated for each individual
    case. The selection of the plant-treatment agents and main degradation products
    in Table 1 and Table A.2 has been made according to the knowledge at the time
    of the interlaboratory trial (1992). Data for some other substances are given
    in annex A.
