abstract:
- language: en
  script: Latn
  content: This document specifies the terminology, classification and test methods
    that are used for the inspection of batches of unmounted polished colourless diamonds
    with single mass smaller than or equal to 0,25 ct (carat). While the inspection
    of a batch is made one diamond at a time, the use of this document is not to be
    claimed for one single diamond only nor for fancy coloured diamonds, nor for synthetic
    diamonds, nor for treated diamonds, neither for assembled stones.
