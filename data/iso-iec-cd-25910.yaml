abstract:
- language: en
  script: Latn
  content: 'The scope of this standard for a unique coding scheme of data elements
    are all AIDC applications with ASC data identifiers in which a keyboard and WEB
    compatible syntax is required. The scope of this standard is not limited to a
    subset of data identifiers nor to specific application sectors. The definition
    of a keyboard-compatible syntax enables to mark and to identify codes carrying
    data elements applied with ANS MH 10.8.2 Data Identifiers so that they can be
    captured, trans mitted and processed safely and easily in open systems wherever
    keyboard interfaces are used and transmission to the Internet. This ensures uniqueness
    and data accuracy for applications of automatic identification and for traceability.
    The basis for the keyboard compatible data constructs are the data identifiers
    according to ANSI MH10.8.2 and their character sets and the control characters
    defined by this standard, i.e. the characters “.”(Dot) and “ˆ” (accent circumflex).
    This standard defines the flag character for the ASC-Data Identifier syntax and
    the separator between different, concatenated data elements. The character parameters
    are defined in such a way that any code constructed according to this standard
    can be used uniquely in cross-business and cross-country supply chains from the
    labeler to the user, e.g. in industries, distribution, healthcare, etc. The typical
    features of a keyboard compatible syntax are: a) the unique keyboard and Internet
    compatible flag character for encoded data with ASC data identifiers; b) the unique
    keyboard and Internet compatible separator character. The data elements in connection
    with this standard are provided with Data Identifiers according to ISO/IEC15418,
    Part ANSI MH10.2. To ensure compatibility, the relevant ISO/IEC standards for
    data structures for automatic identification and the Internet are used. The standard
    can be used anywhere where automatic identification applies in a system-independent
    environment using keyboard interfaces and/or Internet interfaces. The scope of
    the application is cross-industry and transnational. This standard provides increased
    system compatibility and associated system security by eliminating the need for
    customization of data entry ports through keyboard interfaces.'
