abstract:
- language: en
  script: Latn
  content: The objective of this document is to conduct a neutral salt spray test
    in accordance with ISO 9227. The test is a proven method for assessing the corrosion
    protection of coatings of components such as bolts. For this reason, two coating
    variants were chosen for conducting the tests on hexagon bolts with a size of
    M6 × 50. The bolts were examined at specified points in time and the time of occurrence
    of grey veil, white rust and red rust was documented. The corrosivity of the salt
    spray was determined by means of two methods and also documented in an evaluation
    form. These two methods are the assessment of the mass loss of an uncoated steel
    panel as specified in ISO 9227 as well as the determination of the time until
    appearance of red rust on hot-dip galvanized steel panels in accordance with ISO
    4042 and ISO 10683. The processing steps are specified in detail in a manual that
    was provided to the test participants. If followed precisely, these instructions
    allow for a comparative analysis of the results from the individual labs and make
    it possible to determine the reproducibility of the salt spray test. Another objective
    is to compare the two methods used to determine the corrosivity of the salt spray
    in order to establish the suitability of these methods by comparing the corrosion
    assessment results obtained for the bolts. In addition, the normative operating
    parameters (temperature in the test cabinet, collection rate, pH and density or
    NaCl concentration of the solution collected) were documented for every inspection
    date in order to ascertain whether there is any correlation with the results of
    the corrosion assessment performed on the bolts.
