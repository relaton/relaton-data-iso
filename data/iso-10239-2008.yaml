abstract:
- language: en
  script: Latn
  content: ISO 10239:2008 covers permanently installed liquefied petroleum gas (LPG)
    systems and LPG burning appliances on small craft of hull length up to 24 m, except
    for systems used on LPG-fuelled propulsion engines or LPG-driven generators. ISO
    10239:2008 does not cover appliances with directly attached gas cylinders, such
    as portable self-contained camping stoves and portable gas lamps.
