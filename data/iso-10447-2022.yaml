abstract:
- language: en
  script: Latn
  content: 'This document specifies the procedures and recommended tooling to be used
    for peel and chisel testing of resistance spot and embossed projection welds.
    This document applies to welds made in two or more sheets in the thickness range
    of 0,5 mm to 3,0 mm. The aim of these tests is to determine: —    weld size and
    failure mode when welds are destructively tested; —    verification of welds by
    non-destructive chisel tests. NOTE      The preferred method of peel testing seam
    welds (mechanized peel testing) is covered in ISO 14270.'
