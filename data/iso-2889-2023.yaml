abstract:
- language: en
  script: Latn
  content: This document sets forth performance-based criteria and recommendations
    for the design and use of systems for sampling of airborne radioactive materials
    in the effluent air from the ducts and stacks of nuclear facilities. The requirements
    and recommendations of this document are aimed at sampling that is conducted for
    regulatory compliance and system control. If existing air-sampling systems are
    not designed to the performance requirements and recommendations of this document,
    an evaluation of the performance of the system is advised. If deficiencies are
    discovered, a determination of whether or not a retrofit is needed and practicable
    is recommended. It can be impossible to meet the requirements of this document
    in all conditions with a sampling system designed for normal operations only.
    Under off-normal conditions, the criteria or recommendations of this document
    still apply. However, for accident conditions, special accident air sampling systems
    or measurements can be used. This document does not address outdoor air sampling,
    radon measurements, or the surveillance of airborne radioactive substances in
    the workplace of nuclear facilities. NOTE            Reference [1] addresses the
    instrumentation that is frequently used in nuclear air monitoring. Reference [5]
    addresses air sampling in the workplace of nuclear facilities. References [6]
    and [7] describe the performance characteristics of air monitors.
