abstract:
- language: en
  script: Latn
  content: ISO 12800:2017 gives guidelines on the determination of the specific surface
    area of as-fabricated uranium dioxide powder by volumetric or gravimetric determination
    of the amount of nitrogen adsorbed on the powder, and can be applied to other
    similar materials, e.g. U3O8, UO2-PuO2 powders, and other bodies with similar
    surface areas, e.g. powder granules or green pellets, provided that the conditions
    described are fulfilled. Modifications using other adsorbing gases are included.
    The method is relevant as long as the expected value is in the range between 1
    m2/g and 10 m2/g.
