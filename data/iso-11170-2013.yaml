abstract:
- language: en
  script: Latn
  content: ISO 11170:2013 defines a sequence of tests for verifying filter elements.
    It can be used to check their hydraulic, mechanical and separation characteristics.
    ISO 11170:2013 is not intended to qualify a filter for a particular duty or replicate
    conditions of service. This can only be done by a specific test protocol developed
    for the purpose, including actual conditions of use (e.g. the operating fluid).
    The procedure in ISO 11170:2013 is applicable to individual fluids or types of
    fluids that have similar chemistry.
