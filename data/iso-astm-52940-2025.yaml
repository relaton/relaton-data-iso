abstract:
- language: en
  script: Latn
  content: This document specifies the characterization of ceramic slurry for use
    as feedstock in vat photopolymerization additive manufacturing (AM) processes.
    The characterization includes the composition and properties of the slurry, such
    as solids content, dynamic viscosity, particle size distribution, chemical composition,
    and solid dispersion stability. This document also provides available methods
    on sampling and preparing slurry samples for testing. This document does not deal
    with safety aspects.
