abstract:
- language: en
  script: Latn
  content: ISO 8325:2004 specifies methods for measuring the dimensional characteristics,
    neck strength and surface roughness of dental rotary instruments, such as burs,
    cutters, polishers, diamond and abrasive instruments. ISO 8325:2004 does not provide
    test methods for the characteristics of materials used for dental rotary instruments.
    NOTE For testing of these characteristics, see the respective product standards.
    ISO 8325:2004 is not applicable to dental root-canal instruments (see ISO 3630-1).
