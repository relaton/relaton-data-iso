abstract:
- language: en
  script: Latn
  content: This document defines a data set of ink value combinations that can be
    used to characterize seven-colour process printing. This data set is not optimized
    for any printing process or application area but is robust enough for all general
    applications. While it is primarily aimed at process colour printing with CMYKOGV
    inks, it can also be used with any combination of six chromatic inks similar to
    the defined set and a dark ink. This document is an addition to the other ISO 12642
    data sets where there is a need to characterize an extended set of printing inks.
