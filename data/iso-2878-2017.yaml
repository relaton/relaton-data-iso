abstract:
- language: en
  script: Latn
  content: 'ISO 2878:2017 specifies a method of test to determine the electrical resistance
    of antistatic and conductive products manufactured wholly or in part from rubber
    whose electrical resistance measured between defined points, when new, does not
    exceed 3 × 108 Ω and whose conductivity is derived from the addition of carbon
    black and/or other appropriate substances to the bulk of the material. NOTE Highly
    conductive mixes cannot be made in this way. ISO 2878:2017 specifies the electrode
    configuration for basic geometries, but it is intended that reference be made
    to relevant product specifications for requirements for specific products. It
    does not apply to: a) products the relevant surfaces of which are composed of
    mixtures of insulating and conductive areas; b) products with a substantial surface
    area of insulating material, except for footwear (which does not normally have
    a conductive or antistatic upper).'
