abstract:
- language: en
  script: Latn
  content: This document includes the creation of optimized data for medical additive
    manufacturing (MAM). These data are generated from static modalities, such as
    magnetic resonance imaging (MRI), computed tomography (CT). This document addresses
    improved medical image data, and medical image data acquisition processing and
    optimization approaches for accurate solid medical models, based on real human
    and animal data. Solid medical models are generally created from stacked 2D images
    output from medical imaging systems. The accuracy of the final model depends on
    the resolution and accuracy of the original image data. The main factors influencing
    accuracy are the resolution of the image, the amount of image noise, the contrast
    between the tissues of interest and artefacts inherent in the imaging system.
