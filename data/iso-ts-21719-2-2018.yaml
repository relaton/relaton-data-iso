abstract:
- language: en
  script: Latn
  content: 'ISO/TS 21719-2:2018 specifies - personalization interface: dedicated short-range
    communication (DSRC), - physical systems: on-board equipment and the personalization
    equipment, - DSRC-link requirements, - EFC personalization functions according
    to ISO/TS 21719-1 when defined for the DSRC interface, and - security data elements
    and mechanisms to be used over the DSRC interface. Protcol information conformance
    statement (PICS) proforma is provided in Annex B, whereas security computation
    examples are provided in Annex E.'
