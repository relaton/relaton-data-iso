abstract:
- language: en
  script: Latn
  content: ISO 10775:2013 specifies a method for the determination of traces of cadmium
    in all types of paper, board and pulp, including products containing recycled
    fibre, that can be wet-combusted in nitric acid as specified in ISO 10775:2013.
    The lower limit of the determination depends on the equipment used and is normally
    about 10 μg/kg. Cadmium present in pigments and fillers that do not dissolve in
    nitric acid under the conditions of this test may not be determined quantitatively.
