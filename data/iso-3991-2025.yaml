abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and their verification
    for the design and construction of robotic feed systems (RFS) (see Annex A), which
    distribute feed and perform at least one of the following functions without the
    need of human interaction: —     storing of feed; —     loading of mobile feed
    unit (MFU); —     mixing; —     travelling; —     cleaning (residual feed); —    
    pushing feed. Additionally, it provides the type of information, to be provided
    by the manufacturer, on safe working practices (including information about residual
    risks). This document is for feeding livestock (e.g. cows, sheep, pigs). This
    document does not apply to: —     systems designed to be used at a fixed location
    and that discharge feed at a remote location (e.g. chain conveyor feed systems,
    belt conveyor feed systems or liquid feed systems); —     tractors; —     systems
    designed for field application. This document deals with all the significant hazards,
    hazardous situations and events relevant to RFS, see Annex B, when they are used
    as intended and under the conditions of misuse, which are reasonably foreseeable,
    by the manufacturer as listed in Clause 4, except for the hazards arising from:
    —     internal combustion engines of RFS; —     requirements for the connections
    to the main electric power supply; —     RFS with interchangeable equipment; —    
    emission of airborne noise. NOTE 1        Hazards related to internal combustion
    engines of robotic feed systems (e.g. exhaust emissions in buildings) will be
    considered in separate standards NOTE 2        The main electric power supply
    is subject to national regulations or codes NOTE 3        Sudden loud noises may
    cause farm animals to become startled. It is advised to consider this with the
    design of the RFS. Environmental aspects (except noise) have not been considered
    in this document. This document is not applicable to feed systems manufactured
    before the date of its publication.'
