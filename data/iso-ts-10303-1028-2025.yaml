abstract:
- language: en
  script: Latn
  content: 'This document specifies the application module Universally unique identification
    assignment. The following are within the scope of this document: -        items
    within the scope of application module Identification assignment, ISO/TS 10303-1021;
    -        assignment of a universally unique identifier to product or activity
    data; -        assignment of a relationship between universally unique identifiers;
    -        assignment of a context for a universally unique identifier; -       
    assignment of provenance to a chain of relationships between universally unique
    identifiers. The following are outside the scope of this document: -        assignment
    of universally unique identifiers that are not either name-based or random.'
