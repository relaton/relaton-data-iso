abstract:
- language: en
  script: Latn
  content: ISO/IEC 29341-6-12:2008(E) defines a service type which provides programmatic
    control and status information for air fans used in Heating Ventilation and Air-Conditioning
    applications. The series of ISO/IEC 29341 publications defines an architecture
    for pervasive peer-to-peer network connectivity of intelligent appliances, wireless
    devices and PCs. It is designed to bring easy to use, flexible, standards-based
    connectivity to ad-hoc or unmanaged networks whether in the home, in a small business,
    public spaces or attached to the Internet.
