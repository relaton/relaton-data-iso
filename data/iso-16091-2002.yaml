abstract:
- language: en
  script: Latn
  content: ISO 16091:2002 describes the set of management requirements needed to identify
    and provide logistic support, so the customer can operate and maintain a product
    in its operational environment for the expected lifetime. These requirements also
    aim, throughout the product life cycle, at implementing everything pertinent to
    the control of the risks considered as critical regarding the operational objectives.
    The management requirements are applicable to those activities necessary to design,
    develop, deliver, deploy and manage an organized and structured set of materials
    and software, services, processes and information dedicated to support the system
    throughout its life cycle. ISO 16091:2002 specifies management, studies, production
    activities, information management processes and tasks to meet the customer's
    need for logistic support. When viewed from the perspective of a specific programme
    or project context, the requirements defined in ISO 16091:2002 should be tailored
    to match the genuine requirements of a particular profile and circumstances of
    a programme or project.
