abstract:
- language: en
  script: Latn
  content: This document specifies the apparatus, condition, sample, procedure and
    data processing of measuring bubbles and inclusions in infrared optical materials.
    It is applicable to the determination of bubbles and inclusions in infrared optical
    materials, such as infrared optical glass, infrared crystals and infrared ceramics,
    which are opaque to visible wavelengths and whose transmission optical spectra
    are beyond 0,78 µm.
