abstract:
- language: en
  script: Latn
  content: ISO 15193:2009 specifies requirements for the content of a reference measurement
    procedure for in vitro diagnostic medical devices and medical laboratories. ISO
    15193:2009 applies to reference measurement procedures providing values of differential
    or rational quantities. Annex A provides information on nominal properties and
    ordinal quantities. ISO 15193:2009 is valid for any person, body or institution
    involved in one of the various branches of laboratory medicine whose intention
    is to write a document to serve as a reference measurement procedure.
