abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the manual and
    automated closed cup flash point of combustible liquids having flash points between
    –30,0 °C to 75,0 °C. However, the precision given for this method is only valid
    for flash points in the range −8,5 °C to 75,0 °C. This document is not applicable
    to water-borne paints. NOTE 1   Water borne paints can be tested using ISO 3679[1].
    NOTE 2   See 9.1 for the importance of this test in avoiding loss of volatile
    materials. NOTE 3   Liquids containing halogenated compounds can give anomalous
    results. NOTE 4   The thermometer specified for the manual apparatus limits the
    upper test temperature to 70,0 °C. NOTE 5   See 13.1 for more specific information
    related to precision.
