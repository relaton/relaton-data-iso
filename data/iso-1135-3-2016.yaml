abstract:
- language: en
  script: Latn
  content: ISO 1135-3:2016 specifies requirements for types of blood-taking sets for
    medical use in order to ensure functional interchangeability of transfusion equipment.
    It is applicable to sterilized blood-taking sets intended for single use only.
    ISO 1135-3:2016 also aims to provide a) specifications relating to the quality
    and performance of materials used in transfusion equipment, and b) a unified presentation
    of terms for such equipment. In some countries, the national pharmacopoeia or
    other national regulations are legally binding and take precedence over ISO 1135-3:2016.
