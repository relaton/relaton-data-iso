abstract:
- language: en
  script: Latn
  content: ISO 13779-2:2008 specifies requirements for ceramic hydroxyapatite coatings
    applied to metallic or non-metallic surgical implants. ISO 13779-2:2008 does not
    cover coatings made from glasses, glass ceramics, alpha- and beta-calcium orthophosphate
    or other forms of calcium phosphate, nor does it cover coatings in which the hydroxyapatite
    is present in a powder form.
