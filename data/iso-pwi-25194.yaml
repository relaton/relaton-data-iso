abstract:
- language: en
  script: Latn
  content: This document speifies process system, monitoring system, technical requirements,
    test methods, inspection rules, nameplate, instruction manual and product certificate,
    packaging, transport and storage, installation and maintenance of the substations
    components used in district heating and cooling supply network. This document
    is applicable to prefabricated modular substations components used in heating
    and cooling supply network with the rated heat load be 0,01 MW～3,0 MW, continuous
    operation with treated water at various temperatures up to 140℃ and maximum internal
    pressure 2,5 MPa.
