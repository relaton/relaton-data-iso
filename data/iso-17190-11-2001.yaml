abstract:
- language: en
  script: Latn
  content: This part of ISO 17190 specifies a method for determining the content of
    respirable particles in polyacrylate (PA) superabsorbent powders. NOTE Commercial
    polyacrylate superabsorbent powders consist of particles averaging 400 μm to 800
    μm in diameter, which are much larger than the maximum size for respirable particles
    of approximately 10 μm. Due to the production process, very low amounts of respirable
    particles may be present in commercial superabsorbent powders.
