abstract:
- language: en
  script: Latn
  content: 'ISO 16001:2017 specifies general requirements and describes methods for
    evaluating and testing the performance of object detection systems (ODSs) and
    visibility aids (VAs) used on earth-moving machines. It covers the following aspects:
    - detection or visibility or both of objects including people in the detection
    zone; - visual, audible, or both warnings to the operator and if appropriate to
    the persons in the detection zone; - operational reliability of the system; -
    compatibility and environmental specifications of the system. It is applicable
    to machines as defined in ISO 6165. An ODS, VA or both can be used to augment
    the operator''s direct vision (see ISO 5006) or indirect vision using mirrors
    (see ISO 14401). In addition, an ODS, VA or both can be used to provide additional
    means of object detection or view, for example, where ergonomic considerations
    limit the effectiveness of direct vision and to avoid repeated turning of the
    head and upper body.'
