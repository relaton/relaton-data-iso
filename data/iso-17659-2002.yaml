abstract:
- language: en
  script: Latn
  content: This International Standard describes by pictorial representation most
    of the more common terms, in English, French and German, for types of joints,
    joint preparation and welds. This International Standard can be used on its own
    or in conjunction with other similar standards. NOTE 1 The figures in this International
    Standard are only sketches that have been drawn to illustrate the typical characteristic
    features of different types of joint. The figures are not necessarily as they
    should be portrayed on design or technical drawings (e.g. in accordance with ISO
    2553). NOTE 2 In addition to terms given in two of the three official ISO languages
    (English and French), this International Standard gives the equivalent terms in
    the German language; these are published under the responsibility of the member
    body for Germany (DIN). However, only the terms and definitions given in the official
    languages can be considered as ISO terms and definitions.
