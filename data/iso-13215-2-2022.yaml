abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and methods for judging the risk
    of installation misuse of child restraint systems (CRS) with the help of assigned
    evaluation panels. The methods described can be used regardless of type of installation
    of the CRS, e.g. with vehicle seat belts, ISOFIX/LATCH and different types of
    anti-rotation devices. The installation can include the evaluation of the interface
    between the child and the CRS, e.g. a harness or an impact shield. This document
    is intended for technical assessment. It can be applied separately or in conjunction
    with the MMEA evaluation, described in ISO 13215-3.
