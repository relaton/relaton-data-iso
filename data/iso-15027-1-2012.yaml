abstract:
- language: en
  script: Latn
  content: ISO 15027-1:2012 specifies performance and safety requirements for constant
    wear immersion suits for work and leisure activities to protect the body of a
    user against the effects of cold water immersion, such as cold shock and hypothermia.
    It is applicable for dry and wet constant wear immersion suits. Abandonment suits
    are not covered by ISO 15027-1:2012. Requirements for abandonment suits are given
    in ISO 15027-2. Test methods for immersion suits are given in ISO 15027-3.
