abstract:
- language: en
  script: Latn
  content: 'This document specifies the structure and conformance conditions of the
    Measurement Analysis Instrument Markup Language (MaiML), an XML format used with
    measurement and analysis instruments and software for research and development
    or industrial applications. MaiML is used for the following purposes: a) recording
    acquired measurement and analysis data, measurement and analysis processes, sample
    information, pretreatment processes, and logs; b) exchanging acquired measurement
    and analysis data between different systems; and c) describing information concerning
    the design of and instructions for measurement and analysis processes. This document
    applies to the acquisition, recording, and exchange, as digital data, of measurement
    and analysis data, sample information, and measurement and analysis conditions
    from measurement and analysis instruments, their control computers, or analysis
    computers. MaiML provides a common structure that reduces dependence on instrument-specific
    formats and supports verification and reuse across different systems. This document
    does not specify the following: a) implementation of operational infrastructures,
    including search systems, data catalogues, and access control; b) complete definitions
    of unified cross-domain terminology, common vocabularies, and ontologies; c) complete
    definitions of control specifications, communication specifications, and instrument-specific
    data formats for individual instruments; or d) complete standardization of specialized
    data items and data formats for individual measurement and analysis methods. Data
    formats specific to individual instruments or measurement and analysis methods
    are not uniformly embedded within the core MaiML structure. Instead, MaiML uses
    device-specific or method-specific specifications defined outside MaiML. Where
    necessary, the actual data are retained as external files or similar resources
    and linked accordingly. This document specifies a common structure for describing
    the identification, reference relationships, and provenance of such external resources
    using information concerning URIs, UUIDs, hashes, and formats. Except for the
    terminology required by this document, terminology, common vocabularies, and ontologies
    refer to existing International Standards, domain-specific standards, or managed
    external definitions. This document enables identification and reference of such
    external definitions using namespaces.'
