abstract:
- language: en
  script: Latn
  content: This document specifies one of the methods for evaluating the habitat function
    of soils and determining effects of soil contaminants and substances on the reproduction
    of Folsomia candida Willem by dermal and alimentary uptake. This document also
    provides information on how to use this method for testing substances under temperate
    conditions. The chronic test described is applicable to soils and soil materials
    of unknown quality, e.g. from contaminated sites, amended soils, soils after remediation,
    industrial, agricultural or other sites of concern and waste materials. The method
    is not applicable to volatile substances, i.e. substances for which H (Henry's
    constant) or the air/water partition coefficient is greater than 1, or for which
    the vapour pressure exceeds 300 Pa at 25 °C.
