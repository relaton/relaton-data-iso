abstract:
- language: en
  script: Latn
  content: This document specifies a gas chromatography and a mass spectrometry method
    of detecting the presence of argon in metal powder produced components, consolidated
    by hot isostatic pressing. This document specifies the calibration and functionality
    test for the equipment covered. It also specifies methods for sampling, sample
    preparation and sample test procedure of PM HIP components to detect argon presence.
    Components produced by additive manufacturing are not covered in this document.
