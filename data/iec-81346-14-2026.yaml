abstract:
- language: en
  script: Latn
  content: This document, published jointly by IEC and ISO, provides, in combination
    with IEC 81346‑1 and IEC 81346‑2, rules and recommendations on the structuring
    of systems and the information on systems of manufacturing systems. It also provides
    additional classification schemes to those of IEC 81346‑2 for use in reference
    designations within manufacturing systems. It is published as a double logo standard.
    The structuring principles and the classes of objects are intended to provide
    a clear identification and localization of the objects, and for use in their labelling
    in the manufacturing plant, for their designation in technical documents and for
    the designation of the technical documents as well. The requirements in this document
    apply for processing, transportation and storage of products, as well as for systems
    to support the manufacturing process such as electrical systems, management systems
    and waste disposal systems. This document applies to different areas within the
    manufacturing industry such as light industry, electrical and optical industry,
    chemical industry, material industry and heavy industry. This document is not
    applicable for designations related to product individuals (e.g. inventory number,
    serial number) nor to the products manufactured. This document is also a horizontal
    publication intended for use by technical committees in preparation of publications
    related to reference designations in accordance with the principles laid down
    in IEC Guide 108.
