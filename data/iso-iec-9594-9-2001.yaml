- language: en
  script: Latn
  content: ISO/IEC 9594-9:2001 specifies a shadow service which DSAs may use to replicate
    Directory information. The service allows Directory information to be replicated
    among DSAs to improve service to Directory users, and provides for the automatic
    updating of this information.
