abstract:
- language: en
  script: Latn
  content: 'This document specifies the minimum requirements necessary to maintain
    the authenticity, integrity and readability of documents managed by an electronic
    document management system. Clarifying the methods and procedures for appropriately
    handling electronic documents promotes the usability of the documents, in both
    a legal and business context. This document expresses a general business process
    as a document handling process. The document handling processes include receiving,
    processing and delivering the documents as follows: —    approving the receipt
    of a document in a manner that is appropriate for a work process; —    storing
    the formal document in the work process environment; —    delivery of the document
    to another organization. This document establishes the controls for execution
    of the work processes while maintaining the authenticity and integrity of the
    document received. This document establishes the policies for the storage of documents
    used as part of the work process. It also details the controls for performing
    the receipt and conversion process appropriately.'
