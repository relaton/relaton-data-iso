abstract:
- language: en
  script: Latn
  content: 'This Technical Specification will define principles, terminology, test
    setups, and test methods for the mechanical strength and durability testing of
    prosthetic sockets, with initial focus on transtibial prosthetic sockets. The
    document will provide guidance for: ● Shape, composition, fabrication and use
    of mock residual limbs for mechanical testing ● Requirements for test specimens
    and interface components ● Test sample coordinate systems and alignment ● Static
    and fatigue loading conditions ● Preliminary guidance for acceptance criteria
    and reporting This document will not define user-specific clinical prescriptions,
    component selection, or manufacturing processes nor will it be limited to one
    line of inquiry on the best type of testing protocol. It is intended as a Technical
    Specification due to the ongoing state of technical development and research in
    this area.'
