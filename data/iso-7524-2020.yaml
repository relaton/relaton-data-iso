abstract:
- language: en
  script: Latn
  content: This document specifies an infrared absorption method after combustion
    in an induction furnace for the determination of the carbon content in ferronickels
    in the range of 0,004 % to 2,5 %. The method is applicable to normal production
    operations. It uses commercially available equipment, which is calibrated using
    steel and/or ferronickel certified reference materials (CRMs).
