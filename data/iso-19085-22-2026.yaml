abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and measures for single
    blade automatic and semi-automatic up-cutting cross-cut sawing machines, capable
    of continuous production use, hereinafter referred to also as “machines”. The
    machines are designed to cut solid wood, material with similar physical characteristics
    to wood, and: aluminium profiles also filled or composed with plastic or foam
    or rubber based insulating materials; composite materials, with core consisting
    of, for example, polyurethane or mineral material, laminated with light alloy;
    polymer‐matrix composite materials and reinforced with thermoplastic or thermoset
    or elastomeric materials; fibreglass; composite bars made from the materials listed
    above. This document deals with all significant hazards, hazardous situations
    or hazardous events, listed in Annex A, relevant to the machines, when it is used
    as intended and under conditions of misuse which are reasonably foreseeable by
    the manufacturer. This document is also applicable to the other life cycle phases
    of the machines: transport, assembly, adjustment, maintenance, dismantling and
    scrapping. Any workpiece positioning equipment fitted to the machine is included
    in this document. This document does not deal with any hazards related to single
    machine being used in combination with any other machine as part of a line. This
    document does not apply to: machines designed for cross cutting logs; machines
    intended for use in potentially explosive atmosphere; machines manufactured prior
    to publication of this document.'
