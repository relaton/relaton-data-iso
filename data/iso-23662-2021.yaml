abstract:
- language: en
  script: Latn
  content: The document specifies the definitions and technical criteria to be fulfilled
    for foods and food ingredients to be suitable for vegetarians (including ovo-lacto-,
    ovo- and lacto-vegetarians) or vegans as well as for food labelling and claims.
    It is applicable to business-to-business communication (B2B), to the food trade,
    and to food labelling and claims. The definitions and technical criteria apply
    only post-harvest/collecting. It does not apply to human safety, environmental
    safety, socio-economic considerations (e.g. fair trade, animal welfare), religious
    beliefs and the characteristics of packaging materials.
