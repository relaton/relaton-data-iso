abstract:
- language: en
  script: Latn
  content: 'ISO 7396-2:2007 specifies requirements for the design, installation, function,
    performance, documentation, testing and commissioning of anaesthetic gas scavenging
    disposal systems, to ensure patient safety and to minimize exposure of the operator
    and other persons to anaesthetic gases and vapours. It includes requirements for
    the power device, pipeline system, performance, non-interchangeability between
    key components and avoidance of cross connections between anaesthetic gas scavenging
    (AGS) disposal systems and medical gas and vacuum pipeline systems. ISO 7396-2:2007
    is applicable only to those disposal systems intended to be connected via AGSS
    terminal units compliant with ISO 9170-2 to AGSS receiving systems compliant with
    ISO 8835-3. ISO 7396-2:2007 also applies to: extensions of existing AGSS disposal
    systems;modifications of existing AGSS disposal systems;modifications or replacement
    of power devices.'
