abstract:
- language: en
  script: Latn
  content: ISO 11490:2015 specifies a gravimetric method for the determination of
    palladium in palladium jewellery alloys, preferably within the range of fineness
    stated in ISO 9202. These alloys may contain silver, indium, gallium, copper,
    cobalt, nickel, tin, and ruthenium. Coprecipitated elements have to be determined
    by a suitable method and a correction applied.
