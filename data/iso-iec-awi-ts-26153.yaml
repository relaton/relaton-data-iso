abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines and minimum requirement for evaluating
    the ink bottle yield of colour inkjet printers and multifunction devices that
    utilize continuous ink supply systems (CISS). This document is applicable to devices
    capable of semicontinuous colour printing on A4-size media using the ISO/IEC 24712
    standard test suite and ink bottles available for purchase. It only applies to
    drop-on-demand printing systems utilizing liquid ink. The following devices and
    conditions are excluded from the scope of this document: - Printers with a minimum
    supported media size of A3 or larger, - Printers with a maximum supported media
    size smaller than A4, such as photo-only printers, - Ink bottles used for initial
    printer setup or priming, which are not representative of refill usage. This guideline
    is intended to support consistent and transparent reporting of ink yield for CISS
    printer models. However, due to the diverse mechanisms of Continuous Ink Supply
    Systems (CISS) and the potential difficulty in achieving common high-precision
    yield measurement methods compared to cartridge-based systems—especially when
    ink is replenished manually—this guideline does not prescribe a single measurement
    method. Instead, it defines a set of fundamental principles for conducting yield
    evaluations.'
