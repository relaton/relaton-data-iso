abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements on design and construction of
    bulk spreaders and sprayers, trailer spreaders and towed spreaders with speed
    related spreading for winter service. This document also deals with information
    about the minimum content required for operating manuals. The document is valid
    for machines which are used to spread the following spreading agents: — not pre-wetted
    and pre-wetted spreading agents; — abrasive spreading agents; — liquid spreading
    agents (brine). This document is not applicable to: — requirements for registration
    and approval; — requirements made by automobile manufacturers; — requirements
    on safety'
