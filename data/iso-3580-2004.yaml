abstract:
- language: en
  script: Latn
  content: ISO 3580:2004 specifies requirements for classification of covered electrodes,
    based on the all-weld metal in the heat-treated condition, for manual metal arc
    welding of ferritic and martensitic creep-resisting and low alloy elevated temperature
    steels. This International Standard is a combined specification for classification
    utilizing a system based upon the chemical composition of the all-weld metal,
    with requirements for the yield strength and the average impact energy of 47 J
    of all-weld metal, or utilizing a system based upon the tensile strength and the
    chemical composition of all-weld metal.
