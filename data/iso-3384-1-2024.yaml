abstract:
- language: en
  script: Latn
  content: 'This document specifies two procedures for determining the decrease in
    counterforce exerted by a test piece of vulcanized or thermoplastic rubber which
    has been compressed to a constant deformation and maintained thus at a predetermined
    test temperature. The counterforce can be determined either by means of a continuous-measurement
    system or by a discontinuous-measurement one. Two test methods are specified,
    method A and method B. In method A the compression and all measurements of counterforce
    are made at test temperature and in method B the compression and all measurements
    of counterforce are made at standard laboratory temperature. Method A and method B
    do not give the same results, as in method B the shrinkage of the material from
    the test temperature to standard laboratory temperature is included in the result.
    Two forms of test piece are specified in this document: cylindrical test pieces
    and rings. Comparison of results is valid only when made on test pieces of similar
    size and shape. The use of ring test pieces is particularly suitable for the determination
    of stress relaxation in liquid environments. This document deals only with testing
    at constant ambient or elevated temperature. Testing at temperatures below standard
    laboratory temperature is not specified. The methods have been used for low‑temperature
    testing, but their reliability under these conditions is not proven.'
