abstract:
- language: en
  script: Latn
  content: 'The requirements in this standard govern the application of explicit algebraic
    formula sets to the calculation of flame spread. This standard is an implementation
    of the general requirements provided in ISO 16730 for the case of fire dynamics
    calculations involving sets of explicit algebraic formulas. This standard is arranged
    in the form of a template, where specific information relevant to algebraic flame
    spread formulas is provided to satisfy the following types of general requirements:
    a) Description of physical phenomena addressed by the calculation method b) Documentation
    of the calculation procedure and its scientific basis c) Input parameters for
    the calculation method d) Limitations of the calculation method e) Domain of applicability
    of the calculation method 1.4 Examples of sets of algebraic formulas meeting all
    the requirements of this standard will be provided in separate Annexes to this
    standard. Currently, there are two informative annex containing algebraic equations
    for calculating the impact of flame spread rate on heat release rate of combustible
    objects, surrounding objects, and enclosure linings.'
