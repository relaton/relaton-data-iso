abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the dynamic Young's modulus
    of rectangular cross-section bars and circular cross-section specimens of refractories
    by impulse excitation of vibration at elevated temperature. The dynamic Young's
    modulus is determined using the resonant frequency of the specimen in its flexural
    mode of vibration. This document does not address the safety issues associated
    with its use. It is responsibility of the users of this standard to establish
    appropriate safety and health practices.
