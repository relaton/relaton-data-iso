abstract:
- language: en
  script: Latn
  content: This document provides requirements and recommendations related to the
    concepts required to associate pharmaceutical products or groups of pharmaceutical
    products with an appropriate set of PhPID(s) in accordance with ISO 11616. Pharmaceutical
    product identifiers and the related elements are intended to represent pharmaceutical
    products as defined within a medicinal product by a medicines regulatory authority.
    While the ISO standards on IDMP can be applied to off-label usage of medicinal
    products, such applications are currently outside of the scope of this document.
    Reference to ISO 11238, ISO 11239, ISO 11240, ISO 11615, HL7 V3 messaging standards
    (HL7 Reference Information Model (RIM)[8], HL7 Common Product Model (CPM)[9] and
    HL7 V3 Structured Product Labelling (SPL)[10], and HL7 FHIR[11] can be applied
    for pharmaceutical product information in the context of this document.
