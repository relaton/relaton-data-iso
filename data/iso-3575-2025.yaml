abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for steel sheet, in coils and
    cut lengths, metallic-coated by the continuous hot-dip process, with zinc and
    zinc-iron alloy coatings. The product is intended for applications requiring corrosion
    resistance, formability and paintability. The steel sheet is produced in a number
    of designations, coating masses, surface treatments and coating conditions designed
    to be compatible with differing application requirements. This document does not
    cover steel designated as structural quality, which are covered in ISO 4998.[1]
