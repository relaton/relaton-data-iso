abstract:
- language: en
  script: Latn
  content: This part of ISO 834 specifies a test method for determining the fire resistance
    of various elements of construction when subjected to standard fire exposure conditions.
    The test data thus obtained will permit subsequent classification on the basis
    of the duration for which the performance of the tested elements under these conditions
    satisfies specified criteria.
