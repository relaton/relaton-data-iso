abstract:
- language: en
  script: Latn
  content: ISO 13091-2:2003 specifies methods and procedures for analysing and interpreting
    vibrotactile perception thresholds and threshold shifts. Procedures for describing
    statistically significant changes in vibrotactile perception thresholds are recommended.
    ISO 13091-2:2003 is applicable to vibrotactile perception thresholds determined
    at the fingertips according to the provisions of ISO 13091-1. Values for the vibrotactile
    perception thresholds of healthy persons, applicable to thresholds determined
    according to the provisions of ISO 13091-1, are given in Annex A. The implications
    of observed changes in vibrotactile perception thresholds are considered in Annex
    B.
