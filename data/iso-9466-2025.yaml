abstract:
- language: en
  script: Latn
  content: This document establishes the performance requirements and acceptance criteria
    for coating material used for passenger rolling stock, locomotives and components.
    This document also provides guidance on the coating application processes, product
    selection, surface preparation, coating application, verification and inspection
    methods, repairs, refurbishment (refresh, etc.), and tests to measure the minimum
    performance for the final product. This document applies to all types of coating
    materials (liquid, powder, etc.) used on —     railway vehicle bodies, and —    
    on-board equipment and constituent parts.
