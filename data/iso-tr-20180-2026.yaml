abstract:
- language: en
  script: Latn
  content: 'This document provides information on how to address product quality data interchange based on risk assessment for consumer product safety in e-commerce. This document: analyses e-commerce supply chain context; analyses product risk assessment in e-commerce; gives use cases on risk-based product quality data for interchange; presents the general process for product quality data interchange among e-commerce stakeholders.'
