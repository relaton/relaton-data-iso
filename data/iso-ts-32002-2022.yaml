abstract:
- language: en
  script: Latn
  content: 'This document specifies how to extend the ISO 32000-2 specification by
    adding support for the following: —    use of the NIST P-curve family of elliptical
    curves for digital signatures; —    use of the Brainpool family of elliptical
    curves for digital signatures; —    use of Edwards Curve (EdDSA) Ed448 and Ed25519
    families of elliptical curves for digital signatures. This document does not specify
    the following: —    specific processes for converting paper or electronic documents
    to the PDF file format; —    specific technical design, user interface implementation,
    or operational details of rendering; —    specific physical methods of storing
    these documents such as media and storage conditions; —    methods for validating
    the conformance of PDF files or PDF processors; —    required computer hardware
    and/or operating system.'
