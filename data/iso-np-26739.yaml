abstract:
- language: en
  script: Latn
  content: This document specifies surface qualities of plastics moulded parts which
    are manufactured by injection moulding, injection embossing, transfer moulding,
    compression moulding or rotational moulding of thermoplastic elastomers and thermosetting
    plastics. This document is also applicable to other plastics processing techniques
    if this has been agreed between the contracting parties. The specifications for
    surface quality refer on the one hand to the surface geometry and on the other
    hand they refer to the visual appearance, which is susceptible to change due to
    external influences (e.g. light). NOTE 1 Hygroscopic materials (such as PA) and
    opaque materials require separate specifications. NOTE 2 The surface quality of
    plastics moulded parts depends on the roughness of draft angles/minimum draft
    angles, without which damage-free demoulding of the surface is not possible.
