abstract:
- language: en
  script: Latn
  content: ISO 1458 specifies requirements for nickel electrodeposited coatings that
    are applied to iron and steel, to zinc alloys, to copper or copper alloys, and
    to aluminium and aluminium alloys to provide an attractive appearance and corrosion
    resistance. In addition, it specifies requirements for copper plus nickel coatings
    applied to iron and steel, and to zinc alloys. Coating designations that differ
    in thickness and type are specified and guidance is given in selecting the coating
    appropriate to the service conditions to which the coated product will be exposed.
    ISO 1458 does not specify the surface condition required by the base metal prior
    to the coating process, and is not applicable to coatings on sheet strip or wire
    in the non-fabricated form nor to threaded fasteners or coil springs.
