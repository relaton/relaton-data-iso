abstract:
- language: en
  script: Latn
  content: This document specifies a molecular absorption spectrophotometric method
    for the determination of titanium content in nickel alloys. The method is applicable
    to titanium contents between 0,3 % (mass fraction) and 5,0 % (mass fraction).
    Molybdenum, if present in the alloy, can cause a high bias in the reported titanium
    value to the extent of 0,001 % Ti for every 1,0 % Mo. NOTE 1 Evidence exists that
    extension of this method is possible for titanium contents down to 0,05 % (mass
    fraction). NOTE 2 Modifications in the general method allow the determination
    of titanium in alloys containing tungsten and/or tantalum.
