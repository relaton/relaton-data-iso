abstract:
- language: en
  script: Latn
  content: ISO 9698:2010 specifies the conditions for the determination of tritium
    activity concentration in samples of environmental water or of tritiated water
    using liquid scintillation counting. The choice of the analytical procedure, either
    with or without distillation of the water sample prior to determination, depends
    on the aim of the measurement and the sample characteristics. Direct measurement
    of a raw water sample using liquid scintillation counting has to consider the
    potential presence of other beta emitter radionuclides. To avoid interference
    with these radionuclides when they are detected, the quantification of tritium
    will be performed following the sample treatment by distillation. Three distillation
    procedures are described. The method is not applicable to the analysis of organically
    bound tritium; its determination requires additional chemical processing (such
    as chemical oxidation or combustion). With suitable technical conditions, the
    detection limit may be as low as 1 Bq l-1. Tritium activity concentrations below
    106 Bq l-1 can be determined without any sample dilution. A prior enrichment step
    can significantly lower the limit of detection.
