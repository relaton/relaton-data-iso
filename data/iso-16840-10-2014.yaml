abstract:
- language: en
  script: Latn
  content: ISO 16840-10:2014 specifies requirements and test methods to assess the
    resistance to ignition by smouldering cigarette equivalent of non-integrated components
    of a wheelchair intended to protect tissue integrity. The test measures only the
    resistance to ignition by smouldering cigarette equivalent of the items tested
    and not the ignitability of the complete wheelchair. It gives an indication, but
    cannot guarantee, the ignition behaviour of the assembled non-integrated devices
    of a complete wheelchair. This part of ISO 16840 does not apply to resistance
    to ignition of structural parts of a wheelchair, nor does it cover postural support
    devices. This part of ISO 16840 does not cover changes in resistance to ignition
    as a result of regular washing or use. This part of ISO 16840 allows for the separate
    testing of removable non-integrated components of a wheelchair which are normally
    used in the horizontal plane (e.g. a seat cushion) from those normally used in
    the vertical plane (e.g. a back support). This part of ISO 16840 describes testing
    an assembly of the composite of materials as used in the removable non-integrated
    component. The results of this part of ISO 16840 do not give any indication of
    the resistance to ignition of any of the separate individual materials of the
    test sample. NOTE 1 The intent of this part of ISO 16840 is primarily to cover
    removable cushions whose described purpose is that of protecting skin tissue against
    pressure, shear, and maceration related damage. NOTE 2 The requirements of this
    part of ISO 16840 have been set at a basic minimal level and are less severe than
    mandatory requirements in some countries. Where practical, it is advisable that
    manufacturers use materials with superior resistance to ignition. The manufacturer
    is required to make the case as to why ISO 7176?16 could not be employed rather
    than this part of ISO 16840. NOTE 3 Requirements for the control of risks from
    sources of fire created by electrical and electronic components are included in
    ISO 7176?14
