abstract:
- language: en
  script: Latn
  content: This document specifies a formalism for the calculation of the illuminant
    metamerism of solid surface colours. It cannot be applied to colours of effect
    coatings without metrical adaptation. This document only covers the phenomenon
    of metamerism for change of illuminant, which has the greatest meaning in practical
    application. In the case of chromaticity coordinates of a pair of samples under
    reference conditions that do not exactly match, recommendations are given on which
    correction measures are to be taken. Regarding the reproduction of colours, the
    metamerism index is used as a measure of quality in order to specify tolerances
    for colour differences between a colour sample and a colour match under different
    illumination conditions. The quantification of the illuminant metamerism of pairs
    of samples is formally performed by a colour difference assessment, for which
    tolerances that are common for the evaluation of residual colour differences can
    be used. NOTE In the colorimetric literature and textbooks, the term geometric
    metamerism is sometimes used for the case that two colours appear to be the same
    under a specific geometry for visual assessment and selected standard observer
    and standard illuminant pair, but is perceived as two different colours at changed
    observation geometry. The term geometric metamerism is different to metamerism
    described in this document.
