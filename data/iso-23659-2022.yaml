abstract:
- language: en
  script: Latn
  content: 'This document specifies safety requirements for the design, construction,
    inspection and maintenance of trampoline parks and their components. This document
    also specifies minimum operational requirements to ensure an appropriate level
    of safety and service when used for recreational, training or educational purposes.
    This document is applicable to trampoline parks and trampoline park areas within
    multi activity parks. This also includes landing areas such as airbags and foam
    pits. This document is intended for use by trampoline park manufacturers, installers,
    operators, inspectors and enforcement bodies. This document does not cover: a)
    general building regulations; b) fire regulations; c) planning regulations; d)
    water testing; e) food and drink provision; f) non-trampoline activities e.g.
    artificial climbing, parkour, obstacle courses and miscellaneous future activities;
    g) chemical composition of components; h) outdoor trampoline parks; i) equipment
    and procedures covered by the referenced documents listed in Clause2; j) general
    aspects of work safety.'
