abstract:
- language: en
  script: Latn
  content: This document gives safety requirements and the means for their verification
    specific to the design and construction of powered material-collecting systems
    used in agriculture, gardening and area maintenance (such as landscaping). It
    is applicable to mounted, semi-mounted or trailed machines manufactured after
    the date of its publication. This document specifies means for eliminating or
    reducing mechanical hazards when the material-collecting system is used as intended.
    It does not deal with environmental hazards, road safety, electromagnetic compatibility,
    power take-off (PTO), PTO drive shaft guarding or control requirements. This document
    is not applicable to machines within the scope of ISO 5395-2 or ISO 5395-3.
