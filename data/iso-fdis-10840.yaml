abstract:
- language: en
  script: Latn
  content: 'This document  provides specifications and guidance for the use of standard
    fire testing for plastics and the products in the following aspects: — selection
    of appropriate tests that reflect realistic end-use conditions; — grouping of
    the reaction-to-fire characteristics that any given test or tests can measure;
    — assessment of tests as to their relevance in areas such as material characterisation,
    quality control, pre-selection, end-product testing, environmental profiling and
    design for the environment (DfE); — definition of potential problems that can
    arise when plastics are tested in standard fire tests. This document does not
    include specifications for the development or design of new fire tests for plastics.'
