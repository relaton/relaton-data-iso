abstract:
- language: en
  script: Latn
  content: This document provides guidance on the work of genetic diversity assessment based on whole-genome data. This document provides workflow and analysis method for loci at the whole-genome level and heterozygous loci on the genome. This document is applicable to the genetic diversity assessment for the purpose of protection, research, conservation, reproduction and cultivation of higher animals and plants. This document is not applicable to the genetic diversity assessment for human and microbials.
