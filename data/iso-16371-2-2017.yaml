abstract:
- language: en
  script: Latn
  content: ISO 16371-2:2017 specifies fundamental techniques of computed radiography
    with the aim of enabling satisfactory and repeatable results to be obtained economically.
    The techniques are based on the fundamental theory of the subject and tests measurements.
    ISO 16371-2:2017 specifies the general rules for industrial computed X-rays and
    gamma radiography for flaw detection purposes, using storage phosphor imaging
    plates (IP). It is based on the general principles for radiographic examination
    of metallic materials on the basis of films, as specified in ISO 5579. The basic
    set-up of radiation source, detector and the corresponding geometry are intended
    to be applied in accordance with ISO 5579 and corresponding product standards
    such as ISO 17636 for welding and EN 12681 for foundry. ISO 16371-2:2017 does
    not lay down acceptance criteria of the imperfections. Computed radiography (CR)
    systems provide a digital grey value image which can be viewed and evaluated on
    basis of a computer only. This practice describes the recommended procedure for
    detector selection and radiographic practice. Selection of computer, software,
    monitor, printer and viewing conditions are important but not the main focus of
    ISO 16371-2:2017. The procedure it specifies provides the minimum requirements
    and practice to permit the exposure and acquisition of digital radiographs with
    a sensitivity of imperfection detection equivalent to film radiography and as
    specified in ISO 5579. Some application standards, e.g. EN 16407, can require
    different and less stringent practice conditions.
