abstract:
- language: en
  script: Latn
  content: ISO 5776:2016 specifies symbols for use in copy preparation and proof correction
    in alphabetic languages and in logographic languages. It is applicable to texts
    submitted for correction, whatever their nature or presentation (manuscripts,
    typescripts, printer's proofs, etc.), and for marking up copy for all methods
    of composition. Symbols for the correction of mathematical texts and colour illustrations
    are not included.
