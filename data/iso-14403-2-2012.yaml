abstract:
- language: en
  script: Latn
  content: ISO 14403-2:2012 specifies methods for the determination of cyanide in
    various types of water (such as ground, drinking, surface, leachate, and waste
    water) with cyanide concentrations usually from 2 µg/l to 500 µg/l expressed as
    cyanide ions in the undiluted sample. The range of application can be changed
    by varying the operation conditions, e.g. by diluting the original sample or changing
    the pathlength of the flow cell. In this method, a suitable mass concentration
    range from10 µg/l to 100 µg/l is described. Seawater can be analysed with possible
    changes in sensitivity and adaptation of the reagent and calibration solutions
    to the salinity of the samples.
