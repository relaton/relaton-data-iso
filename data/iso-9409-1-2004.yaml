abstract:
- language: en
  script: Latn
  content: ISO 9409-1:2004 defines the main dimensions, designation and marking for
    a circular plate as mechanical interface. It is intended to ensure the exchangeability
    and to keep the orientation of hand-mounted end effectors. It does not define
    other requirements of the end effector coupling device. It does not contain any
    correlation of load-carrying ranges, as it is expected that the appropriate interface
    is selected depending on the application and the load-carrying capacity of the
    robot.
