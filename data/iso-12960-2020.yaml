abstract:
- language: en
  script: Latn
  content: This document specifies methods for screening the resistance of geotextile
    and geotextile-related products to liquids while not subjecting them to external
    mechanical stress. It is applicable to all geotextiles and geotextile-related
    products. Method A applies particularly to polyamides and method B to polyesters
    and polyamides. The test results are intended to be interpreted in the context
    of site conditions. This document is intended to be used in conjunction with ISO/TS
    13434. NOTE This document only considers conditions where the specimens are fully
    immersed in the liquids. Though outside the scope of this document, the test conditions
    can be modified to accommodate particular applications, e.g. gaseous media. This
    document does not preclude use for test specimens that are pre-treated by some
    method, e.g. by weathering, aqueous extraction conditions or installation damage.
