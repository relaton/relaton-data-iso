abstract:
- language: en
  script: Latn
  content: This document specifies requirements and test methods for assessing the
    resistance to cutting of gaiters by hand-held chainsaws and other properties.
    It includes a requirement and a test method for assessing the strength of underfoot
    straps of gaiters. This document is applicable to gaiters used in conjunction
    with safety footwear with a steel toecap conforming to ISO 20345 design "C" or
    "D". These gaiters are designed to be used only in association with a defined
    model of footwear and tested together. NOTE These products are intended, but are
    not limited, to be used in combination with a defined model of orthopaedic footwear.
    This document does not apply to gaiters intended for use in situations where there
    is a significant risk of tripping, such as tree climbing or in forests.
