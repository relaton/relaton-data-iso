abstract:
- language: en
  script: Latn
  content: This part of ISO 3019 specifies sizes and dimensions and establishes an
    identification code for the two- and fourbolt mounting flanges and the shaft ends
    of positive-displacement, rotary hydraulic fluid power pumps and motors. It is
    applicable to cylindrical keyed shaft ends with an external thread, as well as
    to those without a thread, to conical keyed shaft ends with an external thread
    and to 30° involute spline shaft ends. NOTE Involute spline is in accordance with
    SAE J744 [1].
