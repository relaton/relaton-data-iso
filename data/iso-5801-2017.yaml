abstract:
- language: en
  script: Latn
  content: ISO 5801:2017 specifies procedures for the determination of the performance
    of fans of all types except those designed solely for air circulation, e.g. ceiling
    fans and table fans. Testing of jet fans is described in ISO 13350. ISO 5801:2017
    provides estimates of uncertainty of measurement and rules for the conversion,
    within specified limits, of test results for changes in speed, gas handled and,
    in the case of model tests, size are given.
