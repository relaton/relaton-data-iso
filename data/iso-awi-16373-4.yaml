abstract:
- language: en
  script: Latn
  content: This document specifies a method for identification and quantification
    of certain dyestuffs in methanol extracts of textile and textile products using
    liquid chromatography (LC). The document is applicable to all types of textile
    products consisting of natural or man-made dyed fibres, e.g. fibres of animal
    origin, cellulose-based fibres, polyesters, polyamides, acetates, triacetates,
    polyacrylics, viscose and other dyeable fibres. The method is not applicable to
    fibres made of elastane and elastodiene, but is applicable for blended fabrics
    containing these fibres. This is a conventional procedure; modified extraction
    conditions lead to deviating results.
