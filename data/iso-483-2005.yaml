abstract:
- language: en
  script: Latn
  content: ISO 483:2005 establishes guidelines for the construction and use of enclosures
    with volumes less than 200 dm3, in order to obtain atmospheres of constant relative
    humidity at given temperatures, using saturated aqueous salt solutions, glycerol/water
    solutions or sulfuric acid/water solutions, for conditioning and testing plastics.
    It specifies the procedures to be followed to maintain the relative humidities
    of the conditioning and testing atmospheres within the required tolerances, at
    the temperatures specified by particular International Standards. The procedures
    described are intended for conditioning small quantities of materials prior to
    test, and for such tests as may be carried out entirely within a small enclosure,
    e.g. electrical tests. The guidelines described do not apply to enclosures requiring
    frequent opening.
