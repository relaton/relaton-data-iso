abstract:
- language: en
  script: Latn
  content: 'This document provides statistical methodologies to estimate false match
    rates (FMRs) from small biometric sample sets. This document intends to: —    
    lay out a methodology for biometric performance estimation based on extrapolation
    using extreme value statistical models; —     provide statistical methodologies
    to estimate FMRs of biometric verification systems; —     be applicable to systems
    that include algorithms that produce likelihood dissimilarity or similarity scores;
    NOTE            Throughout the document, if not otherwise specified, scores refer
    to similarity scores. —     specify the methodology for data recording and result
    reporting; —     introduce metrics for the estimated biometric performance. The
    following are not within the scope of this document. —     Estimation of false
    positive identification rates for one-to-many implementations. —     Estimation
    of false accept rates for verification transactions.'
