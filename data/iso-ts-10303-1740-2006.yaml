abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1740:2006 specifies the application module for Requirement
    decomposition. The following are within the scope of ISO/TS 10303-1740:2006: design
    related requirements; shape and non-shape based constraints; generic categories
    for enterprise classification of requirements; requirement decomposition; predefined
    relationships between requirements; requirement decomposition with logical relationships
    between the components; items within the scope of application module Conductivity
    material aspects, ISO/TS 10303-1756; items within the scope of application module
    Elemental geometric shape, ISO/TS 10303-1004; items within the scope of application
    module Functional specification, ISO/TS 10303-1679; items within the scope of
    application module Production rule, ISO/TS 10303-1739; items within the scope
    of application module Requirement view definition, ISO/TS 10303-1141.'
