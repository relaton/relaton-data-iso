abstract:
- language: en
  script: Latn
  content: 'ISO 15753:2016 describes two methods for the determination of 15 polycyclic
    aromatic hydrocarbons (PAHs) in animal and vegetable fats and oils: - a general
    method; - a specific method for coconut oil and vegetable oils with short-chain
    fatty acids. These methods are not quantitative for the very volatile compounds
    such as naphthalene, acenaphthene and fluorene. Due to interferences provided
    by the matrix itself, palm oil and olive pomace oil cannot be analysed using this
    method. The quantification limit is 0,2 µg/kg for almost all compounds analysed,
    except for fluoranthene and benzo(g,h,i)perylene, where the quantification limit
    is 0,3 µg/kg, and indeno(1,2,3-c,d)pyrene, where the quantification limit is 1,0
    µg/kg. NOTE The results for olive pomace oil in Annex B show that this method
    is not applicable to this type of oil. The precision data determined are very
    poor. Milk and milk products (or fat coming from milk and milk products) are excluded
    from the scope of this International Standard.'
