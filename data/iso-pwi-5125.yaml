abstract:
- language: en
  script: Latn
  content: This standard specifies a test method for the determination of the continuously
    closed cup flash point of chemicals, lube oils, aviation turbine fuel, diesel
    fuel, diesel/biodiesel blends and related products that are homogeneous and liquid
    at or near ambient temperature and at temperatures required to perform the test,
    having flash points in the range of 35 °C to 225 °C. Flash point determinations
    below 35 °C and above 225 °C may be performed, but the precision has not been
    determined
