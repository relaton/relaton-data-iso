- language: en
  script: Latn
  content: ISO 14708-3:2017 is applicable to active implantable medical devices intended
    for electrical stimulation of the central or peripheral nervous system. The tests
    that are specified in this document are type tests and are to be carried out on
    a sample of a device to assess device behavioural responses, and are not intended
