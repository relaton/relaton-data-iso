abstract:
- language: en
  script: Latn
  content: This document specifies test methods and the environmental conditions for
    evaluating the performance of reciprocating positive displacement pumps and centrifugal
    pumps designed for crop protection equipment. This document is applicable when
    defining the performance of stand-alone pumps or pumps that are installed on a
    sprayer. Some of the tests indicated in this document are suited only for specific
    pump types. It is not applicable to pesticide metering pumps for injection systems.
