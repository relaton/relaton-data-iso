abstract:
- language: en
  script: Latn
  content: ISO 3272-1:2003 specifies reduction ratios, enlargement ratios, sizes of
    enlargement and the resulting image sizes for recording on 35 mm unperforated
    microfilm technical drawings and other drawing office documents, such as architects'
    plans, calculation notes, specifications, vocabularies and parts lists. ISO 3272-1:2003
    applies to the microfilming of documents no larger than A0 with dark lines and
    characters on a light background, preferably prepared in accordance with ISO 5457
    and ISO 6428. It may also apply to sizes other than those specified in ISO 5457,
    provided they are no larger than 912 mm x 1 230 mm and can be accommodated within
    a single frame of 35 mm microfilm, as specified in ISO 3272-1:2003. ISO 3272-1:2003
    does not apply to images created by a COM device.
