abstract:
- language: en
  script: Latn
  content: This document establishes a system of designation for polyetheretherketone
    (PEEK) moulding and extrusion materials which can be used as the basis for specifications.
    Polyetheretherketone polymer chains are composed of phenylene rings linked in
    (1,4) position by a sequence of two ether groups followed by one ketone group.
    The grades of PEEK plastics are differentiated from each other by a classification
    system based on appropriate levels of the designatory properties a) melt viscosity
    or melt volume-flow rate; b) tensile modulus; c) tensile strength; and on information
    about the intended application and/or method of processing, important properties,
    additives, colorants, fillers and reinforcing materials. The designation system
    is applicable to all polyetheretherketones. It applies to materials ready for
    normal use in the form of powder, granules or pellets, unmodified or modified
    by colourants, fillers, reinforcements or other additives. It is not intended
    to imply that materials having the same designation necessarily give the same
    performance. This document does not provide engineering data, performance data
    or data on processing conditions which can be required to specify a material for
    a particular application and/or method of processing. If such additional properties
    are required, they are intended to be determined in accordance with the test methods
    specified in ISO 23153-2, if suitable. In order to specify a thermoplastic material
    for a particular application or to ensure reproducible processing, additional
    requirements are given in data block 5 (see 4.1).
