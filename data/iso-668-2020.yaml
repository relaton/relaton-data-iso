abstract:
- language: en
  script: Latn
  content: This document establishes a classification of series 1 freight containers
    based on external dimensions, and specifies the associated ratings and, where
    appropriate, the minimum internal and door opening dimensions for certain types
    of containers. These containers are intended for intercontinental traffic. This
    document summarizes the external and some of the internal dimensions of series
    1 containers. The dimensions of each type of container are defined in the appropriate
    part of ISO 1496, which is the authoritative document for internal container dimensions.
