abstract:
- language: en
  script: Latn
  content: ISO 16620-1:2015 specifies the general principles and the calculation methods
    for determining the amount of biobased content in plastic products. These calculation
    methods are based on the carbon mass or mass of each constituent present in the
    plastic products. ISO 16620-1:2015 is applicable to plastic products and plastic
    materials, polymer resins, monomers, or additives, which are made from biobased
    or fossil-based constituents.
