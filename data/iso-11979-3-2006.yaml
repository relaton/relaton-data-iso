abstract:
- language: en
  script: Latn
  content: ISO 11979-3:2006 specifies requirements and test methods for certain mechanical
    properties of intraocular lenses (IOLs). It is applicable to all types of IOLs
    intended for implantation in the anterior segment of the human eye, excluding
    corneal implants, provided that the test method is appropriate to the particular
    IOL design.
