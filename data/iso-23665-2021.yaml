abstract:
- language: en
  script: Latn
  content: 'This document describes the procedures for training personnel who will
    be involved in the operation of unmanned aircraft systems (UAS). This document
    defines: a) knowledge, skill, attitude and qualification criteria that are needed
    for UAS pilots and training organizations that provides training to trainees of
    UAS remote pilots and other personnel involved in UAS operations; b) training
    curriculum and contents for specific learning courses; c) qualification and confirmation
    criteria for the training organizations; d) general procedures for providing training
    of UAS personnel. The requirements for a specific course as described in the annexes
    can be more restrictive in some cases.'
