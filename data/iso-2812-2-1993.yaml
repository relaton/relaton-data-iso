abstract:
- language: en
  script: Latn
  content: The principle of the method is immersing a coated test panel in water and
    evaluating the effects of immersion by criteria agreed in advance between the
    interested parties, these criteria usually being of a subjective nature. The method
    gives an indication of the results likely to be obtained when painted articles
    are stored under conditions where prolonged condensation but not an extremely
    corrosive atmosphere may be produced. Applies to a single-coat film or multi-coat
    system of paints.
