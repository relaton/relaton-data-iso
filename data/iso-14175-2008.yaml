abstract:
- language: en
  script: Latn
  content: 'ISO 14175:2008 specifies requirements for the classification of gases
    and gas mixtures used in fusion welding and allied processes including, but not
    limited to: tungsten arc welding (Process 141); gas-shielded metal arc welding
    (Process 13); plasma arc welding (Process 15); plasma arc cutting (Process 83);
    laser welding (Process 52); laser cutting (Process 84); arc braze welding (Process
    972). Process numbers are in accordance with ISO 4063. The purpose of ISO 14175:2008
    is to classify and designate shielding, backing, process and assist gases in accordance
    with their chemical properties and metallurgical behaviour as the basis for correct
    selection by the user and to simplify the possible qualification procedures.'
