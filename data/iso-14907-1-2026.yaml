abstract:
- language: en
  script: Latn
  content: 'This document specifies the test procedures for roadside equipment (RSE and on-board equipment (OBE for electronic fee collection (EFC) with regard to conformance to standards and requirements for type approval and acceptance testing. The scope of this document is restricted to systems operating within the radio emission, electromagnetic compatibility (EMC) regulations, traffic, and other regulations of the regions in which they are operated. This document identifies a set of suitable parameters and provides test procedures to enable the proof of a complete EFC system, as well as components of an EFC system, e.g. OBE, related to the defined requirements of an application. The defined parameter and tests are assigned to the following groups of parameters: functionality; quality; referenced pre-tests. This document describes procedures, methods and tools, and a test plan which shows the relation between all tests and the sequence of these tests. It lists all tests that are required to measure the performance of EFC equipment. It describes which EFC equipment is covered by the test procedures; the values of the parameters to be tested are not included. It also describes how the tests are intended to be performed, and which tools and prerequisites are necessary before this series of tests can be undertaken. It is assumed that the security of the system is inherent in the communications and EFC functionality tests, therefore they are not addressed in this document. All tests in this document provide instructions on how to evaluate the test results. This document defines only the tests and test procedures, not the benchmark values against which they are intended to be measured. The test procedures defined in this document can be used as input, e.g. by scheme owners, for prototype testing, type approvals, tests of installations and periodic inspections. Related to a conceptual model of an EFC system, this document relates only to the equipment of the user and the service provider. EFC systems for DSRC consist, in principle, of a group of technical components, which in combination fulfil the functions required for the collection of fees by electronic automatic means. These components comprise all, or most, of the following: OBE within a vehicle; OBE containing the communications and computing sub-functions; optional integrated circuit card which can carry electronic money, service rights, and other secured information; communication between OBE and RSE based on DSRC; equipment for the fee collection at the RSE containing the communications and computing sub-functions; equipment for the enforcement at the roadside; central equipment for the administration and operation of the system. The scope of this document relates solely to OBE and RSE and the DSRC interface between OBE and RSE including its functions to perform the fee collection. All the equipment used for enforcement (e.g. detection, classification, localization, and registration) and central equipment are outside the scope of this document.'
