abstract:
- language: en
  script: Latn
  content: 'ISO 1641-3:2011 specifies the general dimensions and designation of the
    following milling cutters with 7/24 taper shanks: - end mills, flat-ended or ball-nosed
    - normal series and long series (manual changers); - slot drills - short series
    and normal series (manual changers); - end mills, flat-ended - normal series and
    long series (automatic changers). Tool shanks with 7/24 taper for manual tool
    changers are in accordance with ISO 297. Tool shanks with 7/24 taper for automatic
    tool changers are in accordance with ISO 7388-1 and ISO 7388-2.'
