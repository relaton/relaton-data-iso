abstract:
- language: en
  script: Latn
  content: This standard specifies the dimensions, material, construction, finishperformance
    requirements, test methods, naming, marking, transportation and storage of the
    packaging steel drums for uranium ore concentrate. The packaging steel drum recommended
    by this standard is suitably applied to dry UOC, and the net weight of UOC is
    no more 450 kg. This standard is applicable to the packaging steel drums for uranium
    ore concentrate (hereinafter referred to as packaging steel drum).
