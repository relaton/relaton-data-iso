abstract:
- language: en
  script: Latn
  content: This document specifies the requirement for design, construction and inspection
    necessary to control thermal cracking due to heat of hydration of cement as well
    as autogenous shrinkage in reinforced or non-reinforced mass concrete structures,
    such as dams, walls, slabs, columns, beams, tunnels, piers, and so on. It covers
    the traditional mass concrete of structures such as dams, thermally controlled
    concrete of structures such as high-rise building foundations or bridges, and
    concrete of prefabricated structures or elements.
