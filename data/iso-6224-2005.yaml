abstract:
- language: en
  script: Latn
  content: ISO 6224:2005 specifies the requirements for three types of general-purpose
    textile-reinforced thermoplastic water-discharge hose with an operating temperature
    range of -10 °C to +60 °C and a maximum working pressure of 25 bar. These hoses
    are not intended to be used for conveyance of potable (drinking) water, for washing-machine
    inlets, as firefighting hoses, for special agricultural machines or as gardening
    hoses for the consumer market.
