abstract:
- language: en
  script: Latn
  content: ISO 11609:2010 specifies requirements for the physical and chemical properties
    of dentifrices and provides guidelines for suitable test methods. It also specifies
    requirements for the marking, labelling and packaging of dentifrices. ISO 11609:2010
    applies to dentifrices, including toothpastes, destined to be used by the public
    on a daily basis with a toothbrush to promote oral hygiene.
