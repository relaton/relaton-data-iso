abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1623:2006 specifies the application module for AP210 laminate
    assembly design. ISO/TS 10303-1623:2006 deals with the representation of laminate
    assembly design. This data provides information sufficient to allow communication
    of the relative vertical arrangement of laminates in an interconnect product,
    and required interconnections among the materials assembled. Vertical assembly
    structure that varies over the x y plane of the substrate is supported. The geometric
    pattern design details to be applied to a laminate are not covered in ISO/TS 10303-1623:2006.
    Configuration management information and design change management information
    is provided. ISO/TS 10303-1623:2006 does not provide for the description of the
    cloth that forms many dielectric materials used in laminates. The following are
    within the scope of ISO/TS 10303-1623:2006: sequence of application of an embedded
    component;sequence of material buildup or lamination;support for embedded component
    location;laminate terminals;configuration management data;design change management
    data.'
