abstract:
- language: en
  script: Latn
  content: This document provides guidance to manage cork oak forests in a sustainable
    way. This document provides orientation for protecting cork oak forest while allowing
    appropriate use of the resources. It describes practices mainly focused on cork
    production while promoting cork oak forest regeneration, multiple benefits and
    mitigating global change. This document also points out practices to avoid or
    that are forbidden. The information given in this document can be also used for
    assessing future development of cork oak forests under different management scenarios
    as a guidance on how trade-offs between different forest functions should be dealt
    with.
