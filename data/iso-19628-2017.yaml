abstract:
- language: en
  script: Latn
  content: 'ISO 19628:2017 describes two methods for the determination of the specific
    heat capacity of ceramic matrix composites with continuous reinforcements (1D,
    2D, 3D). Unidirectional (1D), bi-directional (2D) and tridirectional (XD, with
    2 < x ≤ 3). The two methods are: - method A: drop calorimetry; - method B: differential
    scanning calorimetry. They are applicable from ambient temperature up to a maximum
    temperature, depending on the method: method A can be used up to 2 250 K, while
    method B is limited to 1 900 K. NOTE Method A is limited to the determination
    of an average value of the specific heat capacity over a given temperature range
    and can give a larger spread of results.'
