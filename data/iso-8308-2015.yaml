abstract:
- language: en
  script: Latn
  content: 'ISO 8308:2015 specifies two methods for the determination of transmission
    of liquids through hose and tubing walls. Both methods are applicable to rubber
    and plastics hose and tubing, and comprise: - method A, for all hose and tubing
    sizes and constructions: a practical comparative test, simulating working conditions;
    - method B, for hose and tubing up to 16 mm inside diameter.'
