abstract:
- language: en
  script: Latn
  content: This standard specifies a method for determining the tensile lap-shear
    strength of bonded assemblies by standard specimen prepared with liquid or paste
    adhesives using adherends made of fibre-reinforced plastics under defined pre-treatment
    and test conditions. NOTE 1 The results obtained with this test method are suitable
    for developmental and comparison only. The parameters obtained are not suitable
    for calculations that are required for the design of adhesively bonded joints
    in structural connections. Measurement results will be reproducible only if identical
    specimen types are used. NOTE 2 This method can be applied to hybrid joints between
    adherends made from fibre-reinforced plastics and other materials.
