abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1708:2010-03 specifies the application module for Packaged
    connector model. The following are within the scope of ISO/TS 10303-1708:2010-03:
    the connector physical model;the mating connector relationship;the connector terminal
    visible to the external world when the connector is permanently assembled into
    a unit; the connector terminal intended to be hard attached to an interconnect
    substrate or wire; the relationship between connector terminals that establishes
    the connector function.'
