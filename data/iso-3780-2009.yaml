abstract:
- language: en
  script: Latn
  content: ISO 3780:2009 specifies the content and structure of an identifier in order
    to establish, on a world-wide basis, the identification of road vehicle manufacturers.
    The world manufacturer identifier (WMI) constitutes the first section of the vehicle
    identification number (VIN) described in ISO 3779. ISO 3780:2009 applies to motor
    vehicles, towed vehicles, motorcycles and mopeds as defined in ISO 3833.
