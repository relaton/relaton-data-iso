abstract:
- language: en
  script: Latn
  content: This standard provides a verification method using industry recognized
    human factor techniques to assess automated and autonomous control systems (L1
    - L5 ISO 7334) which are used to replace or enhance operator performance. These
    comprise the indeterminate safety control systems developed and evaluated using
    ISO 6135. This document applies to earth-moving machinery (EMM) as defined in
    ISO 6165 and can be applied to other off-road machinery.
