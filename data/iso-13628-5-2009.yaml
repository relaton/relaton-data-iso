abstract:
- language: en
  script: Latn
  content: 'ISO 13628-5:2009 specifies requirements and gives recommendations for
    the design, material selection, manufacture, design verification, testing, installation
    and operation of umbilicals and associated ancillary equipment for the petroleum
    and natural gas industries. Ancillary equipment does not include top side hardware.
    Topside hardware refers to any hardware that is not permanently attached to the
    umbilical, above the topside hang-off termination. ISO 13628-5:2009 applies to
    umbilicals containing components, such as electrical cables, optical fibres, thermoplastic
    hoses and metallic tubes, either alone or in combination; and to umbilicals for
    static or dynamic service, with surface-surface, surface-subsea and subsea-subsea
    routings . ISO 13628-5:2009 does not apply to the associated component connectors,
    unless they affect the performance of the umbilical or that of its ancillary equipment.
    ISO 13628-5:2009 applies only to tubes with the following dimensions: wall thickness,
    t  6 mm, internal diameter, ID  50,8 mm (2 in). Tubular products greater than
    these dimensions can be regarded as pipe/linepipe and it is expected that they
    be designed and manufactured according to a recognised pipeline/linepipe standard.
    ISO 13628-5:2009 does not apply to a tube or hose rated lower than 7 MPa (1 015
    psi), or to electric cable voltage ratings above standard rated voltages = 3,6/6(7,2)
    kV rms, where U0, U and Um are as defined in IEC 60502-1 and IEC 60502-2.'
