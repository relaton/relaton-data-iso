abstract:
- language: en
  script: Latn
  content: ISO 1825:2010 specifies the dimensions and construction of, and requirements
    for, four types of hose and hose assembly for use in all operations associated
    with the ground fuelling and defuelling of aircraft. All four types are designed
    for use with petroleum fuels having an aromatic-hydrocarbon content not exceeding
    30 % by volume; operation within the temperature range of -30 °C to +65 °C and
    such that they will be undamaged by climatic conditions of -40 °C to +70 °C when
    stored in static conditions; operation at up to 2,0 MPa (20 bar) maximum working
    pressure, including surges of pressure which the hose can be subjected to in service.
