abstract:
- language: en
  script: Latn
  content: 'This document gives the safety requirements and measures for table band
    saws and band resaws, with manual loading and/or unloading and suitable for continuous
    production use, hereinafter referred to as “machines”. The machines are designed
    to cut solid wood and material with similar physical characteristics to wood.
    It deals with all significant hazards, hazardous situations and events, listed
    in Annex A, relevant to the machines, when operated, adjusted and maintained as
    intended and under the conditions foreseen by the manufacturer; reasonably foreseeable
    misuse has been considered too. Also, transport, assembly, dismantling, disabling
    and scrapping phases have been taken into account. It is also applicable to machines
    fitted with one or more of the following devices/additional working units, whose
    hazards have been dealt with: a) device to tilt the table; b) device to tilt the
    saw unit. This document does not apply to: 1)    machines driven by combustion
    engines or power take offs (PTO); 2)    log band sawing machines; NOTE Log band
    sawing machines are covered by EN 1807-2:2013. 3)    horizontal band saws and
    band resaws; 4)    machines designed for cross-cutting of firewood. This document
    does not deal with hazards related to the combination of a single machine being
    used with any other machine (as part of a line). This document is not applicable
    to machines intended for use in potentially explosive atmospheres or to machines
    manufactured prior to the date of its publication.'
