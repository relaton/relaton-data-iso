abstract:
- language: en
  script: Latn
  content: This document specifies the general requirements of herbal decoction apparatus
    with design pressures less than 0,1MPa. It includes both hermetic and non-hermetic
    decoction apparatus. This document is applicable to herbal decoction apparatus
    for individual herbal formula prescriptions and for commercial use as well as
    private use. It also applies to the decocting part of the integrated apparatus
    of decoction and package.
