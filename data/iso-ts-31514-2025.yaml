abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and recommendations for establishing
    a traceability system for food in cold chain logistics, which enables integrated
    functions such as collecting traceability information, managing traceability information
    and implementing traceability. This document is applicable to the management processes
    by supporting food traceability whereas cold chain logistics service providers
    are needed, covering transportation, warehousing, loading and unloading and other
    related points in cold chain logistics links towards the end customers.
