abstract:
- language: en
  script: Latn
  content: This document provides general principles, requirements and recommendations
    for the assessment of stability of fibre-reinforced composite materials for service
    in equipment used in oil and gas production environments. This document describes
    the procedures for comparative testing of composite materials consisting of polymers
    (thermoplastics and thermosets) and re-enforcing materials e.g. glass, carbon,
    aramid and metals as continuous fibres or woven fabric used in equipment for oil
    and gas production. Testing and characterization of neat resins and fibre products
    are beyond the scope of this document. The equipment considered includes, but
    is not limited to, non-metallic pipelines, piping, liners and downhole tool components.
    Blistering by rapid gas decompression, coatings and compounded particulate- and
    short fibre-reinforced composites are excluded from the scope of this document.
