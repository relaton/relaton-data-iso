abstract:
- language: en
  script: Latn
  content: ISO 18436-8:2013 specifies the requirements for qualification and assessment
    of personnel who perform machinery condition monitoring and diagnostics using
    ultrasound. A certificate or declaration of conformity to ISO 18436-8:2013 provides
    recognition of the qualifications and competence of individuals to perform ultrasound
    measurements and analysis for machinery condition monitoring using ultrasound
    equipment. It is possible that this procedure is not applicable to specialized
    equipment or other specific situations. ISO 18436-8:2013 specifies a three-category
    classification programme that is based on the technical areas delineated herein,
    consistent with ISO 18436-1 and ISO 18436-3.
