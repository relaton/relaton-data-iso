abstract:
- language: en
  script: Latn
  content: 'This document specifies performance requirements for electrofusion control
    unit (ECU) for use with polyethylene (PE) electrofusion fittings conforming to
    ISO 4437-3,[1]ISO 4427-3[2] and ISO 15494.[3] NOTE 1        Electrofusion fittings
    conforming to other documents, e.g. EN 1555-3[4] and EN 12201-3,[5] can also be
    within the scope of this document. The system designed to manage the transfer
    of data collected during the fusion process is out of the scope of this document.
    NOTE 2        Data format and retrieval system are specified in ISO 12176-5. NOTE
    3        Parameters for the electrofusion cycle are defined in ISO 13950 and ISO
    12176-5. Data for traceability purposes are given in ISO 12176-3, ISO 12176-4
    and ISO 12176-5. Electrical safety is out of the scope of this document. NOTE
    4        The manufacturer of ECU is informed that different safety regulations
    are in force in different countries or regional area, e.g.: U.S.A., Europe, etc.
    ECU designed for only one brand of fittings is out of the scope of this document.
    Excluding any of the requirements specified in this document is not acceptable
    when an organization claims conformity to this document.'
