abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and measures for circular
    saw benches with or without sliding table or demountable power feed unit or both
    and capable of continuous production use, also known as “table saws” (in the USA),
    hereinafter referred to also as “machines”. The machines are designed to cut solid
    wood and material with similar physical characteristics to wood (see ISO 19085-1:2021,
    3.2). This document deals with all significant hazards, hazardous situations and
    events as listed in Annex A relevant to the machines when operated, adjusted and
    maintained as intended and under the conditions foreseen by the manufacturer;
    reasonably foreseeable misuse has been considered too. Transport, assembly, dismantling,
    disabling and scrapping phases have also been taken into account. This document
    is also applicable to machines fitted with one or more of the following devices
    or working units, whose hazards have been dealt with: —     device for the main
    saw blade and scoring saw blade to be raised and lowered through the table; —    
    device to tilt the main saw blade and scoring saw blade for angled cutting; —    
    device for scoring; —     device for grooving with milling tool with a width not
    exceeding 20 mm in one pass; —     demountable power feed unit; —     additional
    manually operated sliding table; —     powered workpiece clamping device. This
    document does not apply to: a)       machines intended for outdoor use on building
    sites; NOTE            Building site saws (contractor saws) are covered by the
    requirements of ISO 19085-10:2018. b)       handheld woodworking machines including
    any adaptation permitting their use in a different mode, i.e. bench mounting;
    c)        machines intended for use in a potentially explosive atmosphere; d)      
    machines manufactured prior to the publication of this document.'
