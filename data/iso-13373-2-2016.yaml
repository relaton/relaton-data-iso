abstract:
- language: en
  script: Latn
  content: 'ISO 13373-2:2016 recommends procedures for processing and presenting vibration
    data and analyzing vibration signatures for the purpose of monitoring the vibration
    condition of rotating machinery, and performing diagnostics as appropriate. Different
    techniques are described for different applications. Signal enhancement techniques
    and analysis methods used for the investigation of particular machine dynamic
    phenomena are included. Many of these techniques can be applied to other machine
    types, including reciprocating machines. Example formats for the parameters that
    are commonly plotted for evaluation and diagnostic purposes are also given. ISO
    13373-2:2016 is divided essentially into two basic approaches when analysing vibration
    signals: the time domain and the frequency domain. Some approaches to the refinement
    of diagnostic results, by changing the operational conditions, are also covered.
    ISO 13373-2:2016 includes only the most commonly used techniques for the vibration
    condition monitoring, analysis and diagnostics of machines. There are many other
    techniques used to determine the behaviour of machines that apply to more in‑depth
    vibration analysis and diagnostic investigations beyond the normal follow‑on to
    machinery condition monitoring. A detailed description of these techniques is
    beyond the scope of ISO 13373-2:2016, but some of these more advanced special
    purpose techniques are listed in Clause 5 for additional information. For specific
    machine types and sizes, the ISO 7919 and ISO 10816 series provide guidance for
    the application of broadband vibration magnitudes for condition monitoring, and
    other documents such as VDI 3839 provide additional information about machinery‑specific
    problems that can be detected when conducting vibration diagnostics.'
