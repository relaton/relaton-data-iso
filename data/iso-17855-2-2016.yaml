abstract:
- language: en
  script: Latn
  content: ISO 17855-2:2016 specifies the methods of preparation of test specimens
    and the test methods to be used in determining the properties of polyethylene
    (PE) moulding and extrusion materials. Requirements for handling test material
    and for conditioning both the test material before moulding and the specimens
    before testing are given. Procedures and conditions for the preparation of test
    specimens and procedures for measuring properties of the materials from which
    these specimens are made are also given. Properties and test methods that are
    suitable and necessary to characterize PE moulding and extrusion materials are
    listed. The properties have been selected from the general test methods in ISO
    10350‑1. Other test methods in wide use for or of particular significance to these
    moulding and extrusion materials are also included in this part of ISO 17855,
    as are the designatory properties specified in ISO 17855‑1. In order to obtain
    reproducible and comparable test results, it is necessary to use the methods of
    preparation and conditioning, the specimen dimensions and the test procedures
    specified herein. Values determined will not necessarily be identical to those
    obtained using specimens of different dimensions or prepared using different procedures.
