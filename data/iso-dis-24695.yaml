abstract:
- language: en
  script: Latn
  content: 'This document describes technical measures to be carried out at crossings
    and parallelisms of buried metal pipelines influenced by HVDC systems. It provides
    guidance on how the design, construction, operation, maintenance, and decommissioning
    phases of HVDC systems affect buried metal pipelines. Electrical interference
    conditions (AC and DC) to pipeline systems are described, and acceptable levels
    of interference are discussed. Minimum separation distances are recommended. The
    following aspects are not covered in this document: -Contractual responsibilities
    -Personnel safety'
