abstract:
- language: en
  script: Latn
  content: This document describes a method for the determination of rare earth distribution
    in praseodymium-neodymium metals and compounds by Inductively Coupled Plasma Atomic
    Emission Spectroscopy (ICP-AES). The praseodymium-neodymium compounds including
    praseodymium-neodymium Oxides, Carbonates and Oxalates. The determination ranges
    are shown in Table 1. Table 1 — Concentration range of each rare earth Rare earth
    distribution Range of concentration (%) Rare earth distribution Range of concentration
    (%) Y2O3/REO 0.03-0.40 Tb4O7/REO 0.03-0.40 La2O3/REO 0.03-0.40 Dy2O3/REO 0.03-0.40
    CeO2/REO 0.03-0.40 Ho2O3/REO 0.03-0.40 Pr6O11/REO 10.0– 35.0 Er2O3/REO 0.03-0.40
    Nd2O3/REO 60.0– 90.0 Tm2O3/REO 0.03-0.40 Sm2O3/REO 0.03-0.40 Yb2O3/REO 0.03-0.40
    Eu2O3/REO 0.03-0.40 Lu2O3/REO 0.03-0.40 Gd2O3/REO 0.03-0.40 - -
