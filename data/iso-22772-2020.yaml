abstract:
- language: en
  script: Latn
  content: This document provides requirements for launch system designers or interface
    designers regarding interfaces between LV and EGSE, which is used to support on-line
    processing. It defines electrical interface types, design requirements, environment
    requirements, verification methods (analyses and tests), and interface check operation
    requirements. This document is intended to minimize design costs and reduce risks
    from errors resulting from miscommunication. It does not limit LV or EGSE organizational
    requirements to specify a unique interface.
