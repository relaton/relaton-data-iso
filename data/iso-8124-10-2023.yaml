abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the maximum amount and, in some
    cases, the maximum concentration of certain substances and mixtures used in experimental
    sets for chemistry and related activities. These substances and mixtures are:
    —     those classified as dangerous by the Globally Harmonized System of Classification
    and Labelling of Chemicals (GHS);[3] —     substances and mixtures which in excessive
    amounts could harm the health of the children using them and which are not classified
    as dangerous by the GHS; —     any other chemical substance(s) and mixture(s)
    delivered with the experimental set. This document applies to experimental sets
    for chemistry and related activities, including chemistry sets, crystal-growing
    sets, carbon-dioxide-generating experimental sets and supplementary sets. This
    document also specifies requirements for marking, a contents list, instructions
    for use, eye protection and the equipment intended for carrying out the experiments.
    This document does not apply to combined sets, for example a combination of a
    chemistry set and a crystal-growing set. Requirements for certain other chemical
    toys are given in ISO 8124-11. See Clause A.1.'
