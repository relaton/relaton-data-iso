- language: en
  script: Latn
  content: ISO 8536-13:2016 specifies requirements for non-sterile, single-use graduated
    flow regulators used as subcomponents in sterilized infusion sets for single use
    to control the flow of intravenous infusion solutions with fluid contact under
    gravity feed conditions. In some countries, the national pharmacopoeia or other
    national regulations are legally binding and take precedence over ISO 8536-13:2016.
