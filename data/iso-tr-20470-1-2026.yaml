abstract:
- language: en
  script: Latn
  content: 'This document describes the basic characteristics of fluoroethylene vinyl
    ether copolymer (FEVE) type fluoropolymer topcoats and their coating systems.
    Information on the weathering performance of the fluoropolymer topcoats and associated
    coating systems for over 30 years is also provided.[1]],[[4]]-[[12] This document
    covers: weathering data of FT (FEVE fluoropolymer topcoat); chemical analysis
    of outdoor exposed coated panels focusing on the paint surface and their cross-sections.
    This document does not include FEVE type waterborne fluoropolymer topcoats and
    their coating systems.'
