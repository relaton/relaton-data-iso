abstract:
- language: en
  script: Latn
  content: 'This document specifies dimensions for receivers with taper and flange
    contact surfaces for hollow taper shanks (HSK) in accordance with ISO 12164-1
    to be applied on machine tools (e.g. for turning, drilling, milling, grinding
    and combinations of them). This document specifies three types of receivers: —    
    type A for automatic tool change; —     type C for manual tool change only, via
    radial holes in both the receiver and the tool shank; —     type E for automatic
    tool change. NOTE 1        The receivers of types A, C and E fit the HSK shanks
    of types A, AB, C, CB and EB (according to ISO 12164-1). NOTE 2        HSK shanks
    of types A, AB and EB can also be changed manually.'
