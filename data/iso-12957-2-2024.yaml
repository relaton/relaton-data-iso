abstract:
- language: en
  script: Latn
  content: This document specifies a method to determine the friction characteristics
    of geosynthetics (geotextiles and geotextile-related products, geosynthetic barriers)
    in contact with soils or another geosynthetic, at low normal stress, using an
    inclining plane apparatus. This test method is primarily intended as a performance
    test to be used with site specific soils but is also used as an index test with
    standard sand. It is also possible to measure the displacement of the interface
    over time (creep phenomenon) without necessarily reaching the slippage failure.
    Test data obtained for geogrids tested with a rigid support are not necessarily
    realistic as the results depend on the friction support.
