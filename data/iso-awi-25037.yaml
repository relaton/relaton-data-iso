abstract:
- language: en
  script: Latn
  content: 'This document sets out the requirements for supervised adventure challenge
    facilities irrespective of height above the ground utilizing collective safety
    systems that are used for intergenerational recreation where the participant is
    not placed in a harness or other safety device and has free will of movement.
    This document includes requirements for design, construction, operation, inspection
    and maintenance of adventure challenge facilities. This document outlines the
    requirements for the materials used in the manufacture of components, systems,
    and collective fall protection, their structural integrity, their ability to meet
    their intended use and the design loads that can be presented during reasonably
    foreseeable misuse. This document outlines the requirements for fall and impact
    protection systems designed to dissipate the energy and limit the velocity and
    acceleration of falling persons or impacting objects. This standard is not applicable
    to: High Ropes where harnesses and safety devices are used as in EN 15567. Playgrounds
    such as EN 1176 series, ASTM F1487, CSA Z614, SS457, AS4685 series. Equipment
    that is mechanically driven as in EN 13814, amusement rides and devices Parkour
    equipment as in EN 16899 Outdoor fitness equipment as in EN 16630 or ASTM F3101'
