abstract:
- language: en
  script: Latn
  content: This document specifies a method to predict and quantify misuse of child
    restraint systems (CRS) called Misuse Mode and Effect Analysis (MMEA). Such misuse
    can degrade the performance of CRSs. As a predictive method it is intended to
    be applied by CRS manufacturers at an early stage, before the CRS is put into
    use by consumers. Being predictive implies the possibility of incompleteness and
    errors. Such errors can be reduced if the proposed method is supported by field
    studies (for example, according to ISO 13215-1) and panel method evaluation (for
    example, according to ISO 13215-2).
