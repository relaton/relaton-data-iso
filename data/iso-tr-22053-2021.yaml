abstract:
- language: en
  script: Latn
  content: This document provides guidance for the design and integration of a safeguarding
    supportive system (SSS) which is intended to include a mode selection as part
    of an SRP/CS or to add a layer of personnel authentication and authorization to
    an IMS designed according to ISO 11161. This document is meant to be used in conjunction
    with ISO 11161. This document is applicable to the SSS but does not address personnel
    qualification and competency.
