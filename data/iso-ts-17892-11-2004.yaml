abstract:
- language: en
  script: Latn
  content: ISO/TS 17892-11:2004 is intended for use in earthworks and foundation engineering.
    It specifies laboratory test methods to establish the coefficient of permeability
    of water through water-saturated soils. In the proposed laboratory tests soil
    specimens are subjected to a flow of water passing through the specimen. The water
    pressure conditions and volume of water passing through the specimens are measured
    for evaluation of the permeability. The results obtained serve to calculate groundwater
    flow and to assess the permeability of man-made impervious layers and filter layers.
