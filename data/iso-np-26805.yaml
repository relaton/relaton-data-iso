abstract:
- language: en
  script: Latn
  content: This document specifies the technical requirements to ensure consistent
    reporting on the general provisions, experimental equipment, testing procedure,
    record, and data processing of triaxial-based strength and deformation test for
    hydrate-bearing sediments. The document is applicable to the laboratory determination
    of shear strength and long-term strength of artificial hydrate-bearing sand/clay
    specimens during shear and creep process within the range of geotechnical investigations
    as well as geo-disaster control. The cylindrical specimen, which can involve remoulded,
    reconstituted, undisturbed, and heterogeneous hydrate-bearing sediments, is consolidated
    and thereafter sheared under drained/undrained conditions. The one-step and multi-step
    loading creep tests are subjected to an isotropic stress under the same conditions.
    The test allows the identification of stress-strain relationships, creep strain,
    shear strength, and long-term strength in terms of total stresses.
