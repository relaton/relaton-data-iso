abstract:
- language: en
  script: Latn
  content: ISO 9117-2:2010 specifies a test method for determining, under standard
    conditions, whether a single‑coat film or a multi-coat system of paints or related
    materials, after a specified drying period, is sufficiently dry to resist damage
    when two painted surfaces or one painted surface and another surface are placed
    in contact under pressure. The method is intended to simulate the conditions when
    painted articles are stacked upon each other.
