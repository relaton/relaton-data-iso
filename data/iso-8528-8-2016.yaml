abstract:
- language: en
  script: Latn
  content: 'ISO 8528-8:2016 defines design requirements, minimum performances and
    type tests for low-power generating sets driven by reciprocating internal combustion
    engines for land and marine use (domestic, recreational and industrial application),
    excluding generating sets used on aircraft. It concerns mainly low-power generating
    sets driven by reciprocating internal combustion engines for the generation of
    single or multiphase alternating current or direct current up to 500 V. The generating
    sets are standard manufactured sets. In this part of ISO 8528, "low-power" is
    taken to mean rated power of a magnitude up to approximately 10 kW/50 Hz, 12 kW/60
    Hz. Low-power generating sets, for the purpose of this International Standard,
    are determined by the following special features: - the users normally are laymen
    (for further details, see 3.1); - the complete generating set is usually transportable
    or mobile; - the electrical output is connected by means of plugs, sockets and
    screwed terminal except for extra low voltages; - the generating set is ready
    for use without any additional installation work by the user. Generating sets
    for special applications or of higher rated power conforming to the above special
    features may, by agreement between manufacturer and customer, be tested in accordance
    with this part of ISO 8528. If supplementary stipulations are required for certain
    applications, this is to be done taking this part of ISO 8528 as a basis. ISO
    8528-8:2016 deals with the special requirements of design and test which are observed
    in addition to the definitions and requirements laid down in ISO 8528-1, ISO 8528-2,
    ISO 8528-3, ISO 8528-4, ISO 8528-5 and ISO 8528-6, where applicable. ISO 8528-8:2016
    does not deal with safety requirements in order to protect the user from dangers
    which are laid down in ISO 8528‑13. NOTE This International Standard does not
    apply to arc welding equipment (IEC 60974 series).'
