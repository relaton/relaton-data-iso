abstract:
- language: en
  script: Latn
  content: 'This document applies to campsites located in natural or developed areas,
    designed and managed for the purpose of accommodating tents, recreational vehicles,
    or camping houses used for accommodating guests. This document outlines considerations
    for the facilities, amenities, services, and management practices necessary to
    ensure a quality camping experience for all guests. The scope of this document
    includes requirements and recommendations related to the following areas: - Campsite
    layout and design - Sanitation and other important facilities - Sustainability
    - Accessibility - Safety and Security The document is intended to be used by campsite
    owners, operators, and regulators to ensure that campsites meet basic safety and
    environmental requirements, while providing a quality camping experience for guests.'
