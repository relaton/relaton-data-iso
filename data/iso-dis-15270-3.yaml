abstract:
- language: en
  script: Latn
  content: This document specifies the terms, definitions, methodologies, and calculations
    that are required for the physical recycling and recovery of plastic waste. The
    document also defines the different types of physical recycling technologies used
    in the recovery and recycling of plastics waste sourced from post-industrial and
    post-consumer waste streams. The general requirements, process stages from “input
    “to “output” that should be considered in evaluating different types of physical
    recycling methodologies are described in the document which may be useful for
    any plastics waste processor or recycler. Further, this document gives guidance
    on the general process and quality requirements to be considered at all stages
    of the recovery process and provides general recommendations for inclusion in
    material standards, test standards and product specifications. This document provides
    guidelines for all types, technologies of physical recycling, currently in practice
    which are characterized by processes that include the selective dissolution, delamination,
    extraction or precipitation of plastic waste without intentional changes to its
    chemical structure. The process stages, requirements, recommendations, and terminology
    presented in this document are intended to be of general applicability.
