abstract:
- language: en
  script: Latn
  content: ISO 105-E03:2010 specifies a method for determining the resistance of the
    colour of textiles of all kinds and in all forms to the action of active chlorine
    in concentrations such as are used to disinfect swimming-pool water (break-point
    chlorination). Three alternative test conditions are specified. The active chlorine
    concentrations of 50 mg/l and 100 mg/l are intended for swimwear. The active chlorine
    concentration of 20 mg/l is intended for accessories such as beach robes and towels.
