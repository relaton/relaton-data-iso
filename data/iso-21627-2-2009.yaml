abstract:
- language: en
  script: Latn
  content: ISO 21627-2:2009 specifies a method for the determination of easily saponifiable
    chlorine in epoxy resins. The easily saponifiable chlorine content is the quantity
    of easily saponifiable chlorine in a given quantity of epoxy resin. The values
    obtained are indicative of the concentration of easily saponifiable chlorine in
    chlorohydrin groups in the resin.
