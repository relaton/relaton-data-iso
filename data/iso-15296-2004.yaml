abstract:
- language: en
  script: Latn
  content: ISO 15296:2004 is a compilation of the terms, with their respective definitions,
    most frequently encountered in the various published EN or ISO standards or in
    the professional, technical or commercial literature. ISO 15296:2004 is intended
    to improve the understanding over the major language boundaries of the terms commonly
    used in the gas welding equipment industry. ISO 15296:2004 is intended to state
    the official definition in the standards as well as the recent evolution of the
    meaning of the technical terms used in the gas welding equipment industry.
