abstract:
- language: en
  script: Latn
  content: 'This document specifies the minimum requirements for airworthiness approval
    of air cargo pallets, nets and containers, generally designated as air cargo unit
    load devices (ULD). This document is intended to provide a uniform technical reference
    for air cargo unit load devices approval. As a prerequisite, it is presupposed
    that the applicable general civil aviation requirements and the aircraft manufacturer’s
    approved Weight and Balance Manual are followed. This document defines the minimum
    performance requirements and test parameters for air cargo unit load devices requiring
    approval of airworthiness for installation in an approved aircraft cargo compartment
    and restraint system that complies with the cargo restraint and occupant protection
    requirements of CCAR 25, EASA CS-25 or 14 CFR Part 25, except for the 9,0 g forward
    ultimate inertia force of § 25.561 (b) (3) (ii). This document applies to airworthiness
    approved air cargo unit load devices intended for carriage on board civil transport
    category airplanes type certificated under CCAR 25, EASA CS-25 or 14 CFR Part 25,
    or equivalent. This document exclusively applies to unit load devices airworthiness
    approval and testing parameters. It does not apply to aircraft design or aircraft
    operating requirements, which are provided by the approved Weight and Balance
    Manual for each aircraft type. Other aspects that do not directly pertain to air
    cargo unit load devices airworthiness approval and testing are not covered by
    this document, e.g.: —     ULD design specifications; —     ULD in service damage
    limits; —     ULD restraint malfunction limitations; —     ULD test methods; —    
    ULD load distribution models; —     ULD maximum allowable contours; —     ULD
    CG (centre for gravity) location control means; —     ULD pressure equalization
    methods; —     ULD utilization guidelines. NOTE            The requirements for
    cargo covers are not defined in this document, except insofar as net restraint
    is incorporated therein.'
