abstract:
- language: en
  script: Latn
  content: 'This international standard specifies the requirements and the methods
    of test for vertical escape ladders of offshore platforms to ensure that the crew
    can safely evacuate from the platforms in case of emergency when the platform
    is standing. This standard is applicable to the design, manufacture and acceptance
    of escape ladders for various offshore platforms. The purpose of this standard
    is to ensure the safety and inter-changeability of this kind of vertical escape
    ladders. These vertical escape ladders can be used for escape setting in case
    of emergency of offshore platforms. The main contents of this standard are: 1.
    Scope; 2. Normative references; 3. Type; 4. Dimension definition; 5. Dimensions;
    6. Technical requirements; 7. Manufacturing quality; 8 Test; 9. Inspection; 10
    Marking, storage and maintenance.'
