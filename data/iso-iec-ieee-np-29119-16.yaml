abstract:
- language: en
  script: Latn
  content: This document defines an ontology for software testing. The ontology specifies the concepts, definitions, and relationships that constitute the domain of software testing, represented in both UML class diagrams and the W3C OWL 2 Web Ontology Language. The ontology is aligned with the terminology and conceptual models defined in the ISO/IEC 29119 series, the ISO/IEC 42119 series, ISO/IEC 20246, and ISO/IEC/IEEE 23612. The definitions of terms used in those standards are incorporated into the ontology as annotations, enabling the ontology to represent both the conceptual structure and the terminology of the software testing domain. This document is applicable to all parties involved in software testing, including tool developers, AI system developers, and standards development organizations.
