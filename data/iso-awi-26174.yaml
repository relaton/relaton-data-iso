abstract:
- language: en
  script: Latn
  content: This document specifies a reference architecture for Web3.0, including
    the user view and functional view involved in the Web3.0 reference architecture.
    It is applicable to guide related organizations to build Web3.0 systems and guide
    Web3.0 organizations to provide Web3.0 services. From the perspective of Web3.0
    technology, this document is divided into basic layer, core layer, interaction
    layer, user layer and cross-layer functions. According to the subdivision of functions
    at each layer, the Web3.0 function view is constructed. From the perspective of
    Web3.0 application, it is divided into related parties, service providers, service
    providers, technology providers and end users, and the Web3.0 user view is constructed.
