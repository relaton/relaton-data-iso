abstract:
- language: en
  script: Latn
  content: ISO 10426-1:2009 specifies requirements and gives recommendations for six
    classes of well cements, including their chemical and physical requirements and
    procedures for physical testing. ISO 10426-1:2009 is applicable to well cement
    classes A, B, C and D, which are the products obtained by grinding Portland cement
    clinker and, if needed, calcium sulfate as an interground additive. Processing
    additives can be used in the manufacture of cement of these classes. Suitable
    set-modifying agents can be interground or blended during manufacture of class
    D cement. ISO 10426-1:2009 is also applicable to well cement classes G and H,
    which are the products obtained by grinding clinker with no additives other than
    one or more forms of calcium sulfate, water or chemical additives as required
    for chromium (VI) reduction.
