abstract:
- language: en
  script: Latn
  content: ISO 8459:2009 includes data elements that are exchanged or are potentially
    exchanged among bibliographic systems. Those data elements that are not exchanged
    or not likely to be exchanged are ignored as they do not need standardization.
    Data elements being handled by transport protocols are not included, only those
    related to application level protocols. NOTE The French version of this International
    Standard does not contain synonyms for the data elements which explains the difference
    in length between the two versions.
