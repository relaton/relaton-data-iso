abstract:
- language: en
  script: Latn
  content: This part of ISO 14837 gives guidelines for the measurement and evaluation
    of performance of mitigation measures against vibration and ground-borne noise
    from rail transport systems. It provides guidance on measurement metrics, measurement
    sites and the evaluation of measured data. In general terms, this document provides
    guidance on evaluation of performance of a mitigation measure through comparison
    of an unmitigated and mitigated situation. The main quantity to evaluate is the
    difference in vibration levels with and without the mitigation measure installed.
