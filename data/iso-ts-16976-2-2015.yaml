abstract:
- language: en
  script: Latn
  content: 'ISO/TS 16976-2:2015 is one part of a series of Technical Specifications
    that provide information on factors related to human anthropometry, physiology,
    ergonomics, and performance for the preparation of standards for design, testing,
    and use of respiratory protective devices. It contains information related to
    anthropometry. In particular, information is given for: ? anthropometric measurement
    methods; ? anthropometric data for head, face, and neck dimensions; ? anthropometric
    data for torso dimensions; ? human test panels; ? models of headforms.'
