abstract:
- language: en
  script: Latn
  content: 'Specifies a method for testing engines as defined in ISO 3833:1977. Applies
    to the evaluation of their performance with a view, in particular, to presenting
    curves of power and specific fuel consumption at full load as a function of engine
    rotational speed. Concerns internal combustion engines used for propulsion of
    motorcycles and included in one of the following categories: reciprocating internal
    combustion engines (spark-ignition) but excluding free piston engines, or rotary
    piston engines.'
