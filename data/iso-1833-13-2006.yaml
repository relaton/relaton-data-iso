abstract:
- language: en
  script: Latn
  content: ISO 1833-13:2006 specifies a method, using carbon disulfide/acetone, to
    determine the percentage of chlorofibre, after removal of non-fibrous matter,
    in textiles made of mixtures of certain chlorofibres, whether after-chlorinated
    or not, and wool, animal hair, silk, cotton, viscose, cupro, modal, polyamide,
    polyester, acrylic and glass fibres. When the wool or silk content of a mixture
    exceeds 25 %, the method described in ISO 1833-4 should be used. When the polyamide
    content of a mixture exceeds 25 %, the method described in ISO 1833-7 should be
    used.
