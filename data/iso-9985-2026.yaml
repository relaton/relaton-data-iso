abstract:
- language: en
  script: Latn
  content: This document establishes a system for the transliteration of Armenian
    characters into Latin characters, in accordance with the principles of stringent
    conversion in order to permit international information exchange, particularly
    by electronic means. This document can be used anyone with a clear understanding
    of the system, and is certain that it can be applied without ambiguity. This document
    focuses on the unambiguous written conversion. The correct pronunciation of the
    original text is out of the scope of this document.
