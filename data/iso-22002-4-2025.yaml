abstract:
- language: en
  script: Latn
  content: This document specifies, in conjunction with ISO 22002-100, requirements
    for establishing, implementing and maintaining prerequisite programmes (PRPs)
    to control food safety hazards in the manufacture of food and feed packaging.
    This document is applicable to all organizations, regardless of size or complexity.
    This document does not apply to other parts of the food supply chain. Exclusions
    to requirements can be supported by a sufficient justification that ensures that
    the exclusion does not adversely impact food safety.
