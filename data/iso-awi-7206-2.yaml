abstract:
- language: en
  script: Latn
  content: 'ISO 7206-2:2011 specifies requirements for the articulating surfaces of
    those types of total and partial hip joint prostheses that provide a joint replacement
    of ball and socket configuration, as follows: sphericity and surface finish requirements
    for metallic and ceramic femoral prostheses for partial hip joint replacement
    that are in accordance with classification a) of ISO 7206-1; sphericity and surface
    finish requirements for bipolar heads with plastics inner surfaces which articulate
    on femoral components that are in accordance with classification a) of ISO 7206-1
    and with metallic or ceramic outer surfaces which articulate on the biological
    acetabulum; sphericity and surface finish requirements and dimensional tolerances
    for plastics acetabular components that are in accordance with classification
    b) of ISO 7206-1; sphericity and surface finish requirements and dimensional tolerances
    for metallic or ceramic femoral components of total hip joint prostheses that
    are in accordance with classification c) of ISO 7206-1, designed to articulate
    on plastics acetabular components.'
