abstract:
- language: en
  script: Latn
  content: ISO 14692-2:2017 gives requirements for the qualification and manufacture
    of GRP piping and fittings in order to enable the purchase of GRP components with
    known and consistent properties from any source. It is applicable to qualification
    procedures, preferred dimensions, quality programmes, component marking and documentation.
    ISO 14692-2:2017 is intended to be read in conjunction with ISO 14692‑1.
