abstract:
- language: en
  script: Latn
  content: 'This document establishes equipment, procedural and reporting requirements
    and recommendations on cone and piezocone penetration tests. NOTE       This document
    fulfils the requirements for cone and piezocone penetration tests as part of geotechnical
    investigation and testing according to the EN 1997 series. This document specifies
    the following features: a)    type of cone penetration test; b)    cone penetrometer
    class according to Table 2; c)    test categories according to Table 3; d)   
    penetration length or penetration depth; e)    elevation of the ground surface
    or the underwater ground surface at the location of the cone penetration test
    with reference to a datum; f)     location of the cone penetration test relative
    to a reproducible fixed location reference point; g)    pore pressure dissipation
    tests. This document covers onshore and nearshore cone penetration test (CPT).
    For requirements for offshore CPT, see ISO 19901-8.'
