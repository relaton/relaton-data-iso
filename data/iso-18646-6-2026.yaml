abstract:
- language: en
  script: Latn
  content: This document specifies performance index and related test methods to evaluate
    the assistance and enhancement performance of lower-limb wearable robots by using
    an anthropomorphic test dummy robot (ATDR). This document applies to wearable
    robots that are operated by being attached to lower limbs regardless of the purpose
    of use or the driving method (powered/non-powered, electric/hydraulic). This document
    does not apply to lower-limb wearable robots that operate based on biosignals
    such as electromyography.
