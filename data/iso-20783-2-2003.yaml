abstract:
- language: en
  script: Latn
  content: ISO 20783-2:2003 specifies three test methods to assess the stability of
    emulsions within the category HFB, as defined in ISO 6743-4. Method A describes
    a method for the determination of stability during storage at ambient temperature
    [(20 ± 2) °C] and is applicable to HFB and HFB.LT fluids. Method B describes a
    method for the determination of stability during storage at medium temperature
    [(70 ± 2) °C] and is again applicable to HFB and HFB.LT fluids. Method C describes
    a method for the determination of stability during storage at low temperature
    [(-10 ± 2) °C] and is applicable only to HFB.LT fluids.
