abstract:
- language: en
  script: Latn
  content: This part of ISO 9355 applies to the design of displays and control actuators
    on machinery. It specifies general principles for human interaction with displays
    and control actuators, to minimize operator errors and to ensure an efficient
    interaction between the operator and the equipment. It is particularly important
    to observe these principles when an operator error may lead to injury or damage
    to health.
