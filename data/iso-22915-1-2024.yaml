abstract:
- language: en
  script: Latn
  content: 'The ISO 22915 series deals with the safety of industrial trucks, as defined
    in ISO 5053-1, relative to their stability and the verification of that stability.
    This document specifies basic test criteria and requirements for verifying the
    stability of industrial trucks, hereafter referred to as "trucks". It is applicable
    to the following truck types and special conditions: a)       counterbalanced
    trucks with mast as specified in ISO 22915-2; b)       reach and straddle trucks
    as specified in ISO 22915-3; c)        pallet stackers, double stackers, and order-picking
    trucks with operator position elevating up to and including 1 200 mm lift height
    as specified in ISO 22915-4; d)       single-side-loading trucks as specified
    in ISO 22915-5; e)       bidirectional and multidirectional trucks as specified
    in ISO 22915-7; f)         additional stability test for trucks operating in special
    conditions of stacking with the mast tilted forward as specified in ISO 22915-8;
    g)       counterbalanced trucks with mast handling freight containers of 6 m (20 ft)
    length and longer as specified in ISO 22915-9; h)       additional stability test
    for trucks operating in special conditions with the load substantially laterally
    displaced by powered devices as specified in ISO 22915-10; i)         industrial
    variable-reach trucks as specified in ISO 22915-11; j)         industrial variable-reach
    trucks handling freight containers of 6 m (20 ft) length and longer as specified
    in ISO 22915-12; k)       rough-terrain trucks with mast as specified in ISO 22915-13;
    l)         rough-terrain variable-reach trucks as specified in ISO 22915-14; m)    
    counterbalanced trucks with articulated steering as specified in ISO 22915-15;
    n)       pedestrian-propelled trucks as specified in ISO 22915-16; o)       towing
    tractors, burden and personnel carriers as specified in ISO 22915-17; p)      
    additional stability test for trucks operating in the special condition of offset
    load, offset determined by utilization as specified in ISO 22915-20; q)      
    order-picking trucks with operator position elevating above 1 200 mm as specified
    in ISO 22915-21; r)        lateral- and front-stacking trucks with and without
    elevating operator position as specified in ISO 22915-22; s)        slewing variable-reach
    rough-terrain trucks as specified in ISO 22915-24. It is also applicable to trucks
    operating under the same conditions when equipped with load-handling attachments
    and low-lift trucks with lift height up to and including 500 mm. This document
    does not apply to the following: —     trucks handling suspended loads which can
    swing freely.'
