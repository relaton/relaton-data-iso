abstract:
- language: en
  script: Latn
  content: This document gives requirements specific to tower cranes for limiting
    and indicating devices. It is applicable to tower cranes as defined in ISO 4306‑3.
    It is not applicable to end stops such as buffers used to stop trolleying, travelling
    or luffing movements, nor to erection, dismantling operations or the changing
    of a crane's configuration. NOTE General requirements for the devices are given
    in ISO 10245‑1.
