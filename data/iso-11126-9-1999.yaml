abstract:
- language: en
  script: Latn
  content: 'This part of ISO 11126 specifies requirements for staurolite abrasives,
    as supplied for blast-cleaning processes. It specifies ranges of particle sizes
    and values for apparent density, Mohs hardness, moisture content, conductivity
    of aqueous extract and water-soluble chlorides. The requirements specified in
    this part of ISO 11126 apply to abrasives supplied in the "new" condition only.
    They do not apply to abrasives either during or after use. Test methods for non-metallic
    blast-cleaning abrasives are given in the various parts of ISO 11127. NOTE 1 Information
    on commonly referenced national standards for non-metallic abrasives is given
    in annex A. NOTE 2 Although this part of ISO 11126 has been developed specifically
    to meet requirements for preparation of steelwork, the properties specified will
    generally be appropriate for use when preparing other material surfaces, or components,
    using blast-cleaning techniques. These techniques are described in ISO 8504-2:1992.
    Preparation of steel substrates before application of paints and related products
    — Surface preparation methods — Part 2: Abrasive blast-cleaning.'
