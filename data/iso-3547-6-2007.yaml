abstract:
- language: en
  script: Latn
  content: ISO 3547-6:2007 specifies, following ISO 12301, the checking of the inside
    diameter of wrapped bushes and describes the necessary checking methods and measuring
    equipment. Wrapped bushes in the free condition are flexible, but after insertion
    they adapt largely to the shape of the housing bore due to the interference between
    the outside diameter of the bush and the housing bore.
