abstract:
- language: en
  script: Latn
  content: 'ISO 9241-112:2017 establishes ergonomic design principles for interactive
    systems related to the software-controlled presentation of information by user
    interfaces. It applies to the three main modalities (visual, auditory, tactile/haptic)
    typically used in information and communication technology. These principles apply
    to the perception and understanding of presented information. These principles
    are applicable in the analysis, design, and evaluation of interactive systems.
    This document also provides recommendations corresponding to the principles. The
    recommendations for each of the principles are not exhaustive and are not necessarily
    independent from one another. While this document is applicable to all types of
    interactive systems, it does not cover the specifics of particular application
    domains. This document also applies to outputs from interactive systems (such
    as printed documents, e.g. invoices). The guidance in this document for presenting
    information is aimed at helping the user to accomplish tasks. This guidance is
    not aimed at the presentation of information for other reasons (e.g. corporate
    branding or advertising). It is intended for the following types of users: - user
    interface designers, who will apply the guidance during the development process;
    - developers, who will apply the guidance during design and implementation of
    system functionality; - evaluators, who are responsible for ensuring that products
    meet the recommendations; - designers of user interface development tools and
    style guides to be used by user interface designers; - project managers, who are
    responsible for managing development processes; - buyers, who will reference this
    document during product procurement.'
