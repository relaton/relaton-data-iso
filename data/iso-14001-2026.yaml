abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for an environmental management
    system that an organization can use to enhance its environmental performance.
    It is intended for use by an organization seeking to manage its environmental
    responsibilities in a systematic manner that contributes to the environmental
    pillar of sustainability. This document helps an organization to achieve the intended
    outcomes of its environmental management system, which provide value for the environment,
    the organization itself and interested parties. The intended outcomes of an environmental
    management system include: enhancing environmental performance; meeting compliance
    obligations; achieving environmental objectives. This document is applicable to
    any organization, regardless of size, type or nature, and applies to the environmental
    aspects of its activities, products and services that the organization determines
    it can either control or influence considering a life cycle perspective. This
    document does not state specific environmental performance criteria. This document
    can be used in whole or in part to systematically improve environmental management.
    Claims of conformity to this document, however, are not acceptable unless all
    its requirements are incorporated into an organization’s environmental management
    system and fulfilled without exclusion.'
