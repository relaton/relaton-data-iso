abstract:
- language: en
  script: Latn
  content: This document specifies a method to measure the dynamic contact angle with
    an optical method. The dynamic advancing and the dynamic receding contact angles
    are determined. By using the measurement specified in this document, the wetting
    and dewetting properties can be characterized. The morphological and chemical
    homogeneity of interfaces can also be determined.
