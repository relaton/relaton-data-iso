- language: en
  script: Latn
  content: This document specifies test categories, test specimens and test procedures
    to evaluate material susceptibility to and potential risk of hydrogen assisted
    failure of high-strength steel components. It does not apply to corrosion-resistant
    stainless steel and its components. Embrittlement of components due to compressed
