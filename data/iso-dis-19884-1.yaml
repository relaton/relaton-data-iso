abstract:
- language: en
  script: Latn
  content: 'Click or tap here to enter text. This document specifies the requirements
    for the design, manufacture and testing of pressure vessels to meet the performance
    criteria at the time of installation for the stationary storage of gaseous hydrogen.
    Fabricated of seamless metallic or welded construction (Type 1) or of composite
    construction (Types 2, 3, 4 and 5) regardless of reinforcement (metallic or non-metallic).
    This document is not applicable to pressure vessels used for: a) solid storage
    matrix for hydrogen, b) liquid hydrogen or, c) hybrid cryogenic high-pressure
    hydrogen storage applications. This document is not applicable to closures, valves,
    fittings, plugs or external piping.'
