abstract:
- language: en
  script: Latn
  content: IS0 9018:2003 specifies the sizes of test pieces and test specimens and
    the procedure for carrying out tensile tests in order to determine the tensile
    strength and the location of fracture of welded joints with transverse stressed
    fillet welds. It applies to metallic materials with welded cruciform and lapped
    joints on plates. Information concerning evaluation of test results is not included
    in this International Standard.
