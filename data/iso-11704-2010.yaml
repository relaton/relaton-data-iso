abstract:
- language: en
  script: Latn
  content: ISO 11704:2010 specifies a method for the determination of gross alpha
    and gross beta activity in waters for radionuclides which are not volatile at
    80 °C. Radon isotopes and their decay products of short half life are not included
    in the determination. The method is applicable to raw and potable waters with
    a dry residue less than 5 g/l and when no correction for colour quenching is necessary.
