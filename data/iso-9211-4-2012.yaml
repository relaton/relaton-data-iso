abstract:
- language: en
  script: Latn
  content: ISO 9211 describes surface treatments of components and substrates, excluding
    ophthalmic optics (spectacles), by the application of optical coatings and gives
    a standard form for their specification. It defines the general characteristics
    and the test and measurement methods wherever necessary, but it is not intended
    to define the process method. ISO 9211-4:2012 describes specific test procedures
    for coating environmental durability tests that are identified in ISO 9211-3 but
    not described in other normative references. They are typically performed in sequence
    with other environmental durability tests, as shown in ISO 9211-3:2008, Annex
    A.
