abstract:
- language: en
  script: Latn
  content: Specifies test methods for the assessment of the local effects of an implant
    material on living tissue, at both the macroscopic and microscopic level. The
    local effects are evaluated by a comparison of the tissue response caused by a
    test specimen to that caused by materials used in medical devices whose clinical
    acceptability has been established. The test methods for local effects after implantation
    are used to assess subchronic effects (short-term, up to 12 weeks), or chronic
    effects (long-term, longer than 12 weeks).
