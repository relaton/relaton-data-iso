- language: en
  script: Latn
  content: This part of ISO 11748 gives guidelines for the structure and content of
    the documentation agreement established between partners in the development of
    on-board electronic control systems used in road vehicles. The documentation agreement
    describes the exchange of documents between the partners and is specific to a
    given development. This part of ISO 11748 provides a framework for any such agreement.
