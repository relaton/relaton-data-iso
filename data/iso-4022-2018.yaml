abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the fluid permeability
    of permeable sintered metal materials in which the porosity is deliberately continuous
    or interconnecting, testing being carried out under such conditions that the fluid
    permeability can be expressed in terms of viscous and inertia permeability coefficients
    (see Annex A). This document does not apply to very long hollow cylindrical test
    pieces of small diameter, in which the pressure drop of the fluid in passing along
    the bore of the cylinder might not be negligible compared with the pressure drop
    of the fluid passing through the wall thickness (see A.5).
