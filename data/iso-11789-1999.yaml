abstract:
- language: en
  script: Latn
  content: This International Standard specifies mechanical safety requirements and
    test methods applicable to walk-behind powered edgers that employ rigid cutting
    means with a blade tip circle not more than 305 mm in diameter, and where the
    plane of the blade tip circle is designed to operate at not more than 15° from
    the vertical. This International Standard applies to hand-held portable and powered
    edgers employing a rigid cutting element with a blade tip circle not more than
    305 mm in diameter. This International Standard also includes test methods for
    noise and vibration. This International Standard does not cover edgers with cutting
    means of non-metallic filament line or freely pivoting non-metallic cutters. This
    International Standard does not cover accessories or attachments that alter the
    function of the machine. The electrical aspects of electrically powered edgers
    are not covered by this International Standard. For the electrical requirements
    applicable to electrically driven machines, reference should be made to IEC 60335-1.
    NOTE — For motion control requirements related to self-propelled machines, reference
    should be made to ISO 5395.
