abstract:
- language: en
  script: Latn
  content: This document specifies data models and parameters, which can be mapped
    to communication systems such as SAE J1939/21 or EN 50325-4 (CANopen). The parameters
    are intended for the usage between body application units (BAU), applicable telematics
    gateway unit (TGU), and optionally for in-vehicle gateway unit (IGU) as well as
    fleet management unit (FMU) installed in commercial on-road, off-highway, and
    off-road vehicles. Body applications include tail-lifts, vehicle-mounted cranes,
    tippers, refuse collecting equipment, fire-fighting equipment, containers, and
    refrigerators, but are not limited to them.
