abstract:
- language: en
  script: Latn
  content: ISO 15841:2006 specifies requirements and test methods for wires to be
    used in fixed and removable orthodontic appliances. It includes preformed orthodontic
    archwires but excludes springs and other preformed components. ISO 15841:2006
    gives detailed requirements concerning the presentation of the physical and mechanical
    properties of orthodontic wires, the test methods by which they can be determined,
    packaging, and labelling information.
