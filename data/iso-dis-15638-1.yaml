abstract:
- language: en
  script: Latn
  content: 'ISO 15638-1:2012 provides the following for cooperative telematics applications
    for regulated commercial freight vehicles: A framework for the provision of cooperative
    telematics application services for regulated commercial freight vehicles; A description
    of the concept of operation, regulatory aspects and options and the role models;
    A conceptual architecture using an on-board platform and wireless communications
    to a regulator or his agent; References for the key documents on which the architecture
    is based; Details of the architecture of the facilities layer; A taxonomy of the
    organisation of generic procedures; Common terminology for the ISO 15638 family
    of standards. ISO 15638-1:2012 is based on a (multiple) service provider oriented
    approach.'
