abstract:
- language: en
  script: Latn
  content: This proposal is intended to provide ethical recommendations and guidelines
    for the application of artificial intelligence (AI) technology in education and
    learning services. It addresses general ethical principles, integrated framework,
    key factors, essential actions for applying AI technology in education and learning
    services This proposal does not cover AI technologies or other information technology
    recommendations and guidelines that are defined or addressed by other standards.
    This proposal is applicable to all organizations providing education and learning
    services, including commercial entities, public services, and not-for-profit organizations.
