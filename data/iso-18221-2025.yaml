abstract:
- language: en
  script: Latn
  content: This document specifies the minimum information to be provided to the user
    by the manufacturers of microscopes with digital displays regarding imaging performance.
    It further specifies terms and definitions for describing the optical performance
    of the digital imaging path of microscopy systems including the observation of
    the image on digital displays. This standard does not apply to confocal microscopes.
    NOTE            Terms and definitions for the direct visual observation with eyepieces
    are specified in ISO 8039 and ISO 10934.
