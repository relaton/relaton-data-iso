abstract:
- language: en
  script: Latn
  content: This document specifies the procedure for measuring the capacity of a high-speed
    or medium-speed engine to generate vibration and the determination of the frequency
    limits of validity of the information quoted. The method described in this document
    is not suitable for low-speed engines. This document describes an engineering
    and not a precision method. Whether the tests are carried out on the test bed
    or on site will be agreed between the user and the manufacturer. This document
    is applicable to high-speed and medium-speed reciprocating internal combustion
    engines for land, rail traction and marine use; this document is not applicable
    to engines used to propel agricultural tractors, road vehicles and aircraft. This
    document can also be applied to engines used to propel road-construction and earth-moving
    machines, industrial trucks and for other applications with engines where no suitable
    International Standard exists.
