abstract:
- language: en
  script: Latn
  content: 'This International Standard describes the principles of, and general requirements
    for, two gravimetric methods for the determination of the potential hydrocarbon
    liquid content of natural gas, or similar gas, at a given pressure and temperature.
    Two methods are specified in this International Standard to determine the amount
    of condensate in a sample gas: _ Method A: a manual weighing method; _ Method
    B: an indirect automatic weighing method based on the indication of the pressure
    difference caused by the accumulation of condensate in a vertical tube. The manual
    weighing method is a reference method for the indirect automatic method (Method
    B). The indirect automatic method (Method B) is suitable for semi-continuous control.
    NOTE Unless otherwise specified, gas volumes are in cubic metres at 273,15 K and
    101,325 kPa.'
