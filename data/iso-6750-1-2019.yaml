abstract:
- language: en
  script: Latn
  content: This document specifies the contents of operator's manuals for earth-moving
    machinery as defined in ISO 6165, and gives guidance on how to structure such
    operator's manuals. It is intended to assist manufacturers of the machinery in
    the drafting and presentation of these manuals. Manuals intended for use by service
    technicians are not within the scope of this document. NOTE 1 Annex A provides
    basic information items to be included in the operator's manual. NOTE 2 Annex
    B provides guidance on the presentation and format of hardcopy operator's manuals.
    NOTE 3 Annex C provides recommendations on the electronic means of communication
    that can be used to convey the contents of operator's manuals.
