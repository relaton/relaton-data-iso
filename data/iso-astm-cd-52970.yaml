abstract:
- language: en
  script: Latn
  content: This document specifies the uniform structure of the machine log file for
    PBF-LB/M machine operations, aimed at facilitating further processing. It is confined
    to the data provided by a PBF-LB/M machine during or after the production process.
    Data from additional monitoring systems like Melt Pool Monitoring or thermographic
    cameras is excluded. The primary considerations applicable to machine log capturing,
    provision via Internet of Things (IoT) interfaces, and structure are described.
    Furthermore, the minimum necessary machine data and a standard structure for the
    output are given. This document is intended for users and providers of additive
    manufacturing systems, Quality Assurance (QA), and associated software systems.
    It is applicable wherever PBF-LB/M processes are used. While specific details
    directly relate to PBF-LB/M, generalized machine log requirements can be related
    to any AM process.
