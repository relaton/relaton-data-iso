abstract:
- language: en
  script: Latn
  content: 'This document sets out the minimum service level and equipment requirements
    and the safety of the occupants for bareboats offered for static* charter on inland,
    coastal and/or offshore waters. It is applicable to any individual or organization
    which offers a bareboat for static* charter. This document: — excludes boats that
    are intended to make voyages while on charter; — does not establish the construction
    requirements for static bareboats and equipment provided; — does not standardize
    associated sport or water-based recreational activities. *Static charter – boats
    that are offered for waterside accommodation only and are not intended to be moved
    from their mooring by the charterer.'
