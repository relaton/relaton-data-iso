abstract:
- language: en
  script: Latn
  content: ISO 23771:2015 provides technical information on the design of textile
    machinery with reduced noise emissions. Textile machines with a significant noise
    hazard are defined in ISO 11111 (all parts). ISO 23771:2015 supports the technical
    designer with the development of low-noise textile machinery. For this purpose,
    the significant sources of noise of the individual types of textile machines and
    suitable noise control measures are described.
