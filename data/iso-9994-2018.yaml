abstract:
- language: en
  script: Latn
  content: This document specifies requirements for lighters to ensure a reasonable
    degree of safety for normal use or reasonably foreseeable misuse of such lighters
    by users. This document applies to all flame-producing products commonly known
    as cigarette lighters, cigar lighters and pipe lighters. It does not apply to
    matches and flame-producing products intended solely for igniting materials other
    than cigarettes, cigars, and pipes.
