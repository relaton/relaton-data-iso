abstract:
- language: en
  script: Latn
  content: ISO 26825:2008 gives requirements for labels which the user attaches to
    syringes so that the contents can be identified just before use during anaesthesia.
    It covers the colour, size, design and general properties of the label and the
    typographical characteristics of the wording for the drug name. ISO 26825:2008
    does not give requirements for labels applied to a syringe or cartridge by the
    drug manufacturer.
