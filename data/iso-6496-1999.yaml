abstract:
- language: en
  script: Latn
  content: 'This International Standard specifies a method for the determination of
    the moisture and other volatile matter content of animal feeding stuffs. The method
    is applicable to animal feeding stuffs with the exception of: a) milk products;
    b) mineral substances; c) mixtures containing a considerable amount of milk products
    or mineral substances, for example milk replacers; d) animal feeding stuffs containing
    humectants (e.g. propylene glycol); e) the following simple animal feeding stuffs:
    animal and vegetable fats and oils (for which method A specified in ISO 662 [1]
    is applicable); oilseeds (for which a method is specified in ISO 665 [2]); oilseed
    residues (for which a method is specified in ISO 771 [3]); cereals, except maize,
    and cereal products (for which a method is specified in ISO 712 [4]); maize (for
    which the reference method specified in ISO 6540 [5] is applicable)'
