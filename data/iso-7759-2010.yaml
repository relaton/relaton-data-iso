abstract:
- language: en
  script: Latn
  content: ISO 7759:2010 specifies a method for the measurement of the reflectance
    characteristics of high-gloss anodized aluminium surfaces. The method described
    is also suitable for the measurement of the reflectance characteristics of other
    high-gloss metal surfaces. The method is not suitable for diffuse-finish metal
    surfaces and does not measure colour.
