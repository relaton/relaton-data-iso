abstract:
- language: en
  script: Latn
  content: Specifies methods of determining distortion in optical systems for the
    purposes of quality evaluation. Applies to optical imaging systems in the optical
    spectral range from 100 nm to 15 000 nm which, by their design, aim at a rotationally
    symmetric image geometry. Applicable to electrooptical imaging systems provided
    that adequate rotational symmetry of the image is guaranteed. Does not apply,
    therefore, to anamorphic and fibre optic systems.
