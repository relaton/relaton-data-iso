abstract:
- language: en
  script: Latn
  content: This document specifies uniform methods for the testing and performance
    evaluation of metallic tube connections, stud ends for ports and flange connections
    for use in hydraulic fluid power applications. This document does not apply to
    the testing of hydraulic quick-action couplings, which is covered by ISO 18869.
    Tests outlined in this document are independent of each other and document the
    method to follow for each test. See the appropriate component International Standard
    for indications of which tests to conduct and for performance criteria. For qualification
    of the connector, the minimum number of samples specified in this document is
    tested, unless otherwise specified in the relevant connector standard or as agreed
    upon by the manufacturer and the user.
