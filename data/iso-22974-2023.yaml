abstract:
- language: en
  script: Latn
  content: This document specifies requirements and gives recommendations on the integrity
    assessment of pipelines of various applications as part of pipeline systems. This
    document is mainly applicable to onshore pipeline systems, connecting wells, production
    plants, process plants, refineries and storage facilities, including any section
    of a pipeline constructed within the boundaries of such facilities for connection
    purpose, according to ISO 19345-1. The principles can also be used for offshore
    pipelines where applicable and practical. This document applies to rigid, steel
    pipelines. It is not applicable for flexible pipelines or those constructed from
    other materials, such as glass-reinforced plastics. This document does not cover
    all conditions which might be related to pipeline integrity. A competent pipeline
    integrity engineer can evaluate whether additional requirements are necessary.
    This document does not cover the assessment of pipeline defect(s) found during
    fabrication/construction or installation, which would need to be done in accordance
    with the applicable standards of design, construction, material procurement and
    welding process applicable at that time. However, this document can be applied
    to the ongoing monitoring and assessment of known flaws from the time of construction.
