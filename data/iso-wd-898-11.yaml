abstract:
- language: en
  script: Latn
  content: 'This document specifies the mechanical and physical properties of bolts,
    screws and studs with nominal diameters above 39 mm and up to 100 mm, made of
    alloy steel. Fasteners (the term used when bolts, screws and studs are considered
    all together) conforming to the requirements of this document are tested at the
    ambient temperature range of 10°C to 35°C. It is possible that they do not retain
    the specified mechanical and physical properties at elevated and/or lower temperatures.
    WARNING Fasteners conforming to the requirements of this document are used in
    applications ranging from -50°C to +150°C, however these fasteners are also used
    outside this range and up to +300°C. It is the responsibility of the user to determine
    the appropriate choice for its specific applications, and consulting an experienced
    fastener material expert is recommended outside the range of -50°C to +150°C (several
    factors need to be taken into account, e.g. steel composition, duration of exposure
    at elevated or lower temperature, the effect of the temperature on the fastener
    mechanical properties and clamped parts). NOTE Information for the selection and
    application of steels for use at lower and elevated temperatures is given for
    example in EN 10269, ASTM F2281 and ASTM A320/A320M. This document applies to
    bolts, screws and studs with full loadability and with: — triangular ISO metric
    thread in accordance with ISO 68-1, — diameter/pitch combinations in accordance
    with ISO 261, — coarse pitch thread for M42 to M68, — fine pitch thread for M42x3
    to M100x6, — thread tolerances in accordance with ISO 965-1, -2 or -4. For hot
    dip galvanized fasteners, additional requirements are specified in ISO 10684.
    This document does not specify requirements for functional properties such as:
    — torque/clamp force properties (see ISO 16047 for test method), — resistance
    to shear stress, — corrosion resistance (see e.g. ISO 4042, ISO 10683 and ISO
    10684), — fatigue resistance, or — weldability.'
