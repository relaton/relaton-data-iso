abstract:
- language: en
  script: Latn
  content: This document specifies the data output formats for the specular microscope.
    The data are usually sent from the specular microscope to either an ophthalmic
    information system (OIS) or a hospital information system (HIS). This document
    addresses text-based analysis reporting of the specular microscope measured and
    analysed data such as the central corneal thickness, the density of endothelial
    cells per 1 mm2, the coefficient variant, and the ratio of endothelial cells with
    a hexagonal shape.
