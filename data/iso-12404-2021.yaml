abstract:
- language: en
  script: Latn
  content: This document provides guidance on the selection and application of screening
    methods for assessing soil quality and waste characterization, including distribution
    of target parameters in soil and soil‑like material. The aim of this document
    is to set up criteria as to when the different kind of screening methods can be
    applied for the analysis of a certain parameter in soil, including soil‑like material,
    and waste, and which steps are required to prove their suitability. This document
    does not recommend any particular screening method but confirms the principles
    of their selection and application.
