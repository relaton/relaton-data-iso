abstract:
- language: en
  script: Latn
  content: 'This document, intended to be used together with ISO 4254-1, specifies
    the safety requirements and their verification for the design and construction
    of — trailed forage loader wagons, — trailed forage cutter-loader wagons, — trailed
    forage transport wagons, — silage and forage body intended to be affixed to a
    carrier vehicle, — trailers with a load push/push-off device, slats or alternating
    moving floor which is intended for the use by only one person (operator). In addition,
    it specifies the type of information on safe working practices including residual
    risks to be provided by the manufacturer. This document is not applicable to:
    — self-propelled forage loader wagons, self-propelled forage cutter loader wagons
    and self-propelled forage transport wagons, — trailers with a tipping body, balanced
    or semi-mounted, used in agriculture.'
