abstract:
- language: en
  script: Latn
  content: This part of the ISO-22056 applies only to lubrication filter elements
    for applications that experiences flow fluctuations such as transmission lubrication
    and Constant Speed Drive generators (CSD)/Integrated Drive Generators (IDG) lubrication.
    This part of ISO 22056 specifies a method for determining the resistance of a
    filter element to flow fatigue caused by varying flow through the filter in various
    stages of the filter contaminant loading process. The filter is subjected to a
    uniform varying flow rate for a specified number of cycles, at a number of predetermined
    differential pressures. Although the number of cycles and differential pressure
    conditions used in this part of ISO 22056 is meant to simulate possible service
    conditions, this part of ISO 22056 is not intended to qualify a filter element
    under replicate conditions of service; this can only be done by a specific test
    protocol developed for the purpose, including actual conditions of use, for example
    the operating lubricant, contamination, and exact cyclic flow conditions. This
    part of ISO 22056 procedure describes the laboratory conditions for the test and
    will need to be augmented by system level testing including actual conditions
    of use, for example the stress caused by cyclic differential pressures induced
    by a variable flow rate The test data resulting from application of this part
    of ISO 22056 can be used to compare the performance of aerospace lubricant filter
    elements.
