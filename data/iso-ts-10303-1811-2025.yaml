abstract:
- language: en
  script: Latn
  content: 'This document specifies the application module for Product and manufacturing
    information with nominal 3D models. The following are within the scope of this
    document: identification of nominal 3D models of parts; items within the scope
    of application module Advanced boundary representation, ISO/TS 10303-1514; items
    within the scope of application module Construction geometry, ISO/TS 10303-1131;
    items within the scope of application module Document assignment, ISO/TS 10303-1122;
    items within the scope of application module Manifold subsurface, ISO/TS 10303-1702;
    items within the scope of application module Manifold surface, ISO/TS 10303-1509;
    items within the scope of application module Part view definition, ISO/TS 10303-1023;
    items within the scope of application module Shape property assignment, ISO/TS
    10303-1032.'
