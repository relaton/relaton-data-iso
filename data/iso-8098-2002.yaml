abstract:
- language: en
  script: Latn
  content: This International Standard specifies safety and performance requirements
    and test methods for the design, assembly and testing of bicycles for young children
    of from about four to eight years of age and these bicycles' sub-assemblies. It
    also provides guidelines for instructions on the use and care of the bicycles.
    This International Standard is applicable to bicycles with a maximum saddle height
    of more than 435 mm and less than 635 mm propelled by a transmitted drive to the
    rear wheel. It is not applicable to special bicycles intended for stunting (e.g.
    BMX bicycles).
