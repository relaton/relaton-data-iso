abstract:
- language: en
  script: Latn
  content: ISO 374-1:2016 specifies the requirements for protective gloves intended
    to protect the user against dangerous chemicals and defines terms to be used.
    NOTE If other protection features have to be covered, e.g. mechanical risks, thermal
    risks, electrostatic dissipation etc., the appropriate specific performance standard
    is to be used in addition. Further information on protective gloves standards
    can be found in the EN 420.
