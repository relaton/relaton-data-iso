abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the bulk density,
    apparent porosity and true porosity of dense shaped refractory products. Shaped
    refractories are those which have fixed geometry and dimensions when delivered
    to the user. This document is accordingly applicable to standard shape refractory
    bricks, but also special shapes refractory products and pre-cast products. This
    document is also applicable to unshaped refractories (see ISO 1927-6) after preparation
    of test specimens according to ISO 1927-5. NOTE            For shaped insulating
    refractory products, the bulk density and true porosity are determined in accordance
    with ISO 5016.
