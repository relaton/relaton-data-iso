abstract:
- language: en
  script: Latn
  content: ISO 22634-1:2017 specifies a method for the determination of benzo[a]pyrene
    (B[a]P) in the total particulate matter of cigarette mainstream smoke using gas
    chromatography/mass spectrometry (GC/MS) with methanol as extraction solvent.
    This method was validated using ISO 3308 smoking parameters and is technically
    compatible with other smoking regimes. An alternative method for the determination
    of B[a]P is specified in ISO 22634‑2 with a different clean-up using cyclohexane
    solvent and a reduced analytical run.
