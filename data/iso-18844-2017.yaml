abstract:
- language: en
  script: Latn
  content: ISO 18844:2017 specifies the definition of image flare for digital cameras,
    test patterns, measurement conditions, and methods, so as to enable the comparison
    of the results of measurement. The methods of measurement are designed to enable
    the assessment of the performance of digital cameras by using image data output
    by the digital cameras. ISO 18844:2017 does not specify the aim values or the
    allowable range of value for the image flare.
