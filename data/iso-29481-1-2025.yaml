abstract:
- language: en
  script: Latn
  content: 'This document prescribes: —     how to document a use case with an associated
    business context and exchange requirements; —     a methodology to identify and
    specify the information exchanges required at identified times during the life
    cycle of assets. This document presents the information delivery manual (IDM)
    in natural language terms to facilitate interoperability between software applications
    used during all phases of the life cycle of assets (both buildings and infrastructure).
    It promotes digital collaboration between actors within the identified business
    context and provides a basis for accurate, reliable, repeatable and high-quality
    information exchange. The information delivery manual (IDM) methodology specified
    in this document can be applied to any information management trigger event to
    identify the details of the information required to be exchanged.'
