abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for devices which either limit or indicate, or limit and indicate the loads, motions, performance and environment of jib cranes. The general requirements for limiting and indicating devices for cranes are given in ISO 10245-1. This document applies to jib cranes (except for cantilever crane) as defined in ISO 4306-4. This document does not apply to the mobile, tower, railway, floating and offshore cranes defined in ISO 4306-1.
