abstract:
- language: en
  script: Latn
  content: ISO 376:2011 specifies a method for the calibration of force-proving instruments
    used for the static verification of uniaxial testing machines (e.g. tension/compression
    testing machines) and describes a procedure for the classification of these instruments.
    It is applicable to force-proving instruments in which the force is determined
    by measuring the elastic deformation of a loaded member or a quantity which is
    proportional to it.
