abstract:
- language: en
  script: Latn
  content: 'This document specifies dimensions for receivers with taper and flange
    contact surfaces for hollow taper shanks (HSK) according to ISO 12164-3 to be
    applied to machine tools (turning and combinations of turning and milling machines).
    This document specifies two types of receivers: —     type T for automatic tool
    change; —     type U for manual tool change only, via radial holes in both the
    receiver and the tool shank. NOTE 1        The receivers of types T and U fit
    the HSK shanks T, TA and U (according to ISO 12164-3). The receivers also fit
    the HSK shanks A, AB, C and CB according to ISO 12164-1. NOTE 2        HSK types
    A, AB, C, CB, T and TA can also be changed manually.'
