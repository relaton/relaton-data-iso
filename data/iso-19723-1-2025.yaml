abstract:
- language: en
  script: Latn
  content: This document specifies the minimum safety requirements applicable to liquefied
    natural gas (LNG) on-board fuel system intended for use on the types of motor
    vehicles defined in ISO 3833. This document is applicable to vehicles (mono-fuel,
    bi-fuel or dual-fuel applications) using LNG according to the ISO 15403 series.
    It is applicable to original-production and converted vehicles. All matters relating
    to the skills of installers and converters have been excluded from this document.
    This document is only applicable to the components in the LNG system which is
    an assembly of components (tanks, valves, flexible fuel lines, etc., see Annex B)
    and connecting parts (fuel lines, fittings, etc.) fitted on motor vehicles using
    LNG in their propulsion system and related components up to and including the
    vaporizer. Other parts downstream from the vaporizer are considered as compressed
    natural gas (CNG) components covered by the ISO 15501 series.
