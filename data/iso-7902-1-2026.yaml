abstract:
- language: en
  script: Latn
  content: This document specifies a calculation procedure for oil-lubricated hydrodynamic
    plain bearings, with complete separation of the shaft and bearing sliding surfaces
    by a film of lubricant, used for designing plain bearings that are reliable in
    operation. It deals with circular cylindrical bearings having angular spans, Ω,
    of 360°, 180°, 150°, 120°, and 90°, the arc segment being loaded centrally. Their
    clearance geometry is constant except for negligible deformations resulting from
    lubricant film pressure and temperature. The calculation procedure serves to provide
    dimensions and optimize plain bearings in turbines, generators, electric motors,
    gear units, rolling mills, pumps, and other machines. It is limited to steady-state
    operation, i.e. under continuously driven operating conditions, with the magnitude
    and direction of loading as well as the angular speeds of all rotating parts constant.
    It can also be applied if a full plain bearing is subjected to a constant force
    rotating at any speed. Dynamic loadings (i.e. those whose magnitude and direction
    vary with time), such as those that can result from vibration effects and instabilities
    of rapid-running rotors, are not taken into account. NOTE            Equivalent
    calculation procedures exist that enable operating conditions to be estimated
    and checked against acceptable conditions. The use of them is equally admissible.
