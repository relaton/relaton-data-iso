abstract:
- language: en
  script: Latn
  content: This document specifies performance requirements and test methods for neck laceration protectors for use in ice hockey. This document is applicable to neck laceration protectors worn by ice hockey players, including goalkeepers, and referees. This document does not address protection of the neck from the impact of pucks, sticks or other objects.
