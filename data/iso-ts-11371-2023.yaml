abstract:
- language: en
  script: Latn
  content: 'This document provides guidelines for the laboratory refining of various
    pulps intended for paper production including: —    Harmonization of terms and
    parameters for the simulation of industrial refining processes by laboratory refiners;
    —    Treatment of pulp samples in a (semi) continuous operation in contrast to
    the batch operation of laboratory beating equipment such as the PFI mill; —   
    Evaluation of fibres for papermaking, in particular chemical market pulps, under
    close-to-reality conditions in terms of refining intensity and refining energy
    consumption. This document only considers refiners operating at low stock concentration,
    i.e. 3 % to 5 %.'
