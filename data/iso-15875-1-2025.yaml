abstract:
- language: en
  script: Latn
  content: This document specifies the general aspects of crosslinked polyethylene
    (PE-X) piping systems intended to be used for hot and cold water installations
    within buildings for the conveyance of water, whether or not intended for human
    consumption (domestic systems), and for heating systems, under design pressures
    and temperatures according to the class of application (see Table 1). This document
    also specifies the basis for the test parameters for the test methods referred
    to in the ISO 15875 series. This document covers a range of service conditions
    (application classes), design pressures and pipe dimension classes. The ISO 15875
    series does not apply to values of design temperature (TD), maximum temperature
    (Tmax) and malfunction temperature (Tmal), as well as service times in excess
    of those defined in Table 1.
