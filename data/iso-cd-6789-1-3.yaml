abstract:
- language: en
  script: Latn
  content: This document specifies the conformance testing and marking requirements
    for hand torque tools used for controlled tightening of screws and nuts. It also
    specifies the minimum requirements for a manufacturer’s declaration of conformance
    for hand torque tools. This document applies to hand torque tools which are classified
    as indicating torque tools (Type I) and setting torque tools (Type II). NOTE         
    Hand torque tools covered by this document are those identified in ISO 1703:2018
    by reference numbers 7 1 00 01 0 to 7 1 00 14 0 inclusive.  Torque limiting hand
    torque tools do not yet have reference numbers and will not do so until the next
    revision of ISO 1703 This document does not specify requirements of calibration
    certificates for hand torque tools. These are described in ISO 6789‑2. This document
    does not specify requirements for verifying the performance of hand torque tools.
    These are described in ISO 6789-3.
