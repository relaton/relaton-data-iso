abstract:
- language: en
  script: Latn
  content: ISO 17228:2015 specifies various ageing procedures to obtain an indication
    of the changes that could occur when leather is exposed to a certain environment
    for a prolonged time. Over time, the surface colour of leather and the leather
    itself change due to ageing and to the action of the surroundings on the leather.
    The test conditions to be used depend on the type of leather and its intended
    use. This procedure can also be used to age specimens for the test of dimensional
    change according to ISO 17130.
