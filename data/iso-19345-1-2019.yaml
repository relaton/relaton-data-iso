abstract:
- language: en
  script: Latn
  content: 1.1 This document specifies requirements and gives recommendations on the
    management of integrity of a pipeline system throughout its life cycle which includes
    design, construction, commissioning, operation, maintenance and abandonment. 1.2
    This document is applicable to onshore pipeline systems used in transportation
    in the petroleum and natural gas industries, connecting wells, production plants,
    process plants, refineries and storage facilities, including any section of a
    pipeline constructed within the boundaries of such facilities for connection purposes.
    The extent of pipeline systems covered by this document is illustrated in Figure
    1. This document does not deal specifically with the integrity of non-pipe elements.
    The pipeline segment between the wellsite and the gathering station, treatment
    plant or process plant (between Facilities 1 and 2 in Figure 1) is included in
    this document, though many mandatory elements of this document are not practical
    due to characteristics such as diameter, operating parameters, etc. 1.3 This document
    applies to rigid, steel pipelines. It is not applicable for flexible pipelines
    or those constructed from other materials, such as glass-reinforced plastics.
    1.4 This document does not cover all conditions nor engineers' competency which
    might be related to pipeline integrity. The user can evaluate whether additional
    requirements are necessary. 1.5 This document is used for integrity management,
    which is initiated at the design and construction stage of the pipeline. Where
    requirements of a design and construction standard (e.g. ISO 13623) are different,
    the provisions of this document will enhance the design and construction from
    an integrity perspective.
