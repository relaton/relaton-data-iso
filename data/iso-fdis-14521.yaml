abstract:
- language: en
  script: Latn
  content: This document specifies formulae for calculating the load capacity of cylindrical
    worm gears and covers load ratings associated with wear, pitting, worm deflection,
    tooth breakage and temperature. Scuffing and other failure modes are not covered
    by this document. The load rating and design procedures are only valid for tooth
    surface sliding velocities, , less than or equal to 25 m/s and contact ratios
    greater than 2,1. For wear, load rating and design procedures are only valid for
    tooth surface sliding velocities which are above 0,1 m/s. The rules and recommendations
    for the dimensioning, lubricants or materials selected by this document only apply
    to centre distances of 50 mm and larger. For centre distances below 50 mm, method
    A applies. The choice of appropriate methods of calculation requires knowledge
    and experience. This document is intended for use by experienced gear designers
    who can make informed judgements concerning factors. It is not intended for use
    by engineers who lack the necessary experience. See 4.7. WARNING — The geometry
    of worm gears is complex, therefore the user of this document is encouraged to
    make sure that a valid working geometry has been established.
