abstract:
- language: en
  script: Latn
  content: 'ISO 2063:2005 applies to thermal-sprayed metallic coatings for the protection
    of iron and steel against corrosion by applying zinc or aluminium or their alloys
    to uncoated surfaces to be protected. This International Standard deals with characteristic
    properties and gives test methods for coatings obtained by the spraying of zinc
    and aluminium and their alloys for the general purpose of corrosion protection.
    It gives firstly the definition, classification and symbols for these coatings
    in relation to their thickness. It then deals with the preparation of surfaces,
    application of coatings and their characteristic properties: namely, thickness,
    appearance and adhesion. Finally ISO 2063:2005 gives test methods for checking
    these properties.'
