abstract:
- language: en
  script: Latn
  content: 'This document defines a set of compression methods for coding one or more
    images of bi-level, continuous-tone greyscale, or continuous-tone colour, or multichannel
    digital samples. This document: —    specifies decoding processes for converting
    compressed image data to reconstructed image data; —    specifies a codestream
    syntax containing information for interpreting the compressed image data; —   
    provides guidance on encoding processes for converting source image data to compressed
    image data.'
