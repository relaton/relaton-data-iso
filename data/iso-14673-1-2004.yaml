abstract:
- language: en
  script: Latn
  content: 'ISO 14673-1|IDF 189-1:2004 specifies a method for the determination of
    the nitrate and nitrite contents of milk and milk products by cadmium reduction
    and spectrometry. The method is applicable to: whole and partly skimmed and skimmed
    dried milk; hard, semi-hard and soft cheeses; processed cheese; whey cheese, caseins
    and caseinates and dried whey. The method may be performed using automatic equipment,
    in particular by segmented flow analysis (SFA) or flow injection analysis (FIA),
    thus reducing cadmium contamination in laboratory work places and waste water.'
