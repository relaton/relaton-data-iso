abstract:
- language: en
  script: Latn
  content: This document specifies polymers commonly used in manufacturing dental
    instruments. It is applicable to polymers used to manufacture either an entire
    instrument or part of an instrument. It is applicable to single-use and reusable
    dental instruments, whether they are connected to a power-driven system or not.
    This document does not apply to oral appliances and devices (e.g. splints, mouthpieces,
    crowns, bridges, implants), to instruments used long-term in the mouth of the
    patient or to devices and instruments not made of polymers. This document contains
    a selection of polymers suitable for use in the manufacture of dental instruments.
