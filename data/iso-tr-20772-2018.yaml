abstract:
- language: en
  script: Latn
  content: This document describes visible solar radiation with wavelengths close
    to the UV range, its transmission to, within and the effects on the human eye.
    The wavelengths concerned are from 380 nm to 500 nm, covering the colours of violet,
    indigo and blue — often referred to as the "blue wavelengths". It also explains
    the filtering effects and measurement of spectacle lenses and sunglasses, thereby
    providing background information to understand the transmittance requirements
    related to filtering effects of lenses and filters in the available spectacle
    lens and sunglass standards. This document does not address the issues of protection
    from artificial sources of radiation. This document is intended to be of benefit
    to any future interest in ISO standardization related to transmission of solar
    radiation with wavelengths near to and greater than 380 nm. The Bibliography provides
    a source of relevant useful references.
