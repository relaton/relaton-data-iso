abstract:
- language: en
  script: Latn
  content: ISO 19932-2:2013 specifies test methods for the verification of requirements
    of ISO 19932-1:2013 for knapsack sprayers carried on the back or shoulder of the
    operator for use with plant protection products. It is applicable to lever-operated
    knapsack sprayers, knapsack compression sprayers and knapsack sprayers driven
    by an engine or electric motor using hydraulic pressure atomisation of the spray
    liquid, with a nominal volume of more than 3 l for their intended use primarily
    in agriculture and horticulture. It does not apply to knapsack mistblowers according
    to ISO 28139.
