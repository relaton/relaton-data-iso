abstract:
- language: en
  script: Latn
  content: 'This document specifies the maximum electrical resistance of the following:
    —     antistatic endless V-ribbed belts; —     joined V-belts; —     single V-belts,
    including wide section belts and hexagonal belts. This document also specifies
    the corresponding production control and individual proof methods of measurements.
    This document applies to new belts intended to be used in an explosive atmosphere
    or in situations where there is a fire risk. The test is intended to ensure that
    the belt is sufficiently conductive to dissipate charges of electricity which
    can form on it in service.'
