abstract:
- language: en
  script: Latn
  content: This document provides a framework for classifying and assessing the safety
    level of road infrastructure. It sets out principles and general criteria to evaluate
    roadway and roadside conditions that affect the likelihood and severity of traffic
    crashes. The classification considers physical road characteristics, traffic and
    operating conditions, visibility and user perception factors, roadside and operational
    features, and other elements relevant to road safety performance. The framework
    applies to various types of roads and contexts, including urban, suburban, rural,
    and high-speed environments, and may be used for existing road facilities as well
    as planned infrastructure projects. It supports road authorities and related stakeholders
    in identifying safety risks, prioritizing improvements, and monitoring infrastructure
    safety performance over time. This document does not prescribe design requirements
    or operational standards, but may complement existing road safety audit practices,
    design guidelines, and performance management systems by providing a consistent
    method for evaluating and comparing road safety levels across different roadway
    environments.
