abstract:
- language: en
  script: Latn
  content: This standard addresses mid-sized small satellites and related verification
    of assurance / quality terms and metrics. This standard defines a unique class
    small satellite, the Launch Unit, or LaunchU. This standard puts emphasis on the
    properties of a LaunchU related to achieving maximum interchangeability between
    launch vehicles. Normative control of the LaunchU design, qualification, and acceptance
    testing is generally applied from other small satellite specific standards.
