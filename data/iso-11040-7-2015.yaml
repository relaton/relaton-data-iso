abstract:
- language: en
  script: Latn
  content: ISO 11040-7:2015 specifies the packaging system that is used to deliver
    sterilized subassembled syringes ready for filling in tubs and nests. Downstream
    processes (processes after filling such as in house/outside transport, reprocessing)
    can result in specific requirements on the packaging system used to deliver sterilized
    subassembled syringes ready for filling. However, these requirements are not within
    the scope of ISO 11040-7:2015.
