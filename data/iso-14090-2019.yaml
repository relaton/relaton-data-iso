abstract:
- language: en
  script: Latn
  content: This document specifies principles, requirements and guidelines for adaptation
    to climate change. This includes the integration of adaptation within or across
    organizations, understanding impacts and uncertainties and how these can be used
    to inform decisions. This document is applicable to any organization, regardless
    of size, type and nature, e.g. local, regional, international, business units,
    conglomerates, industrial sectors, natural resource management units. This document
    can support the development of sector-, aspect- or element-specific climate change
    adaptation standards.
