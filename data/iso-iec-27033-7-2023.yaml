abstract:
- language: en
  script: Latn
  content: This document aims to identify security risks of network virtualization
    and proposes guidelines for the implementation of network virtualization security.
    Overall, this document intends to considerably aid the comprehensive definition
    and implementation of security for any organization’s virtualization environments.
    It is aimed at users and implementers who are responsible for the implementation
    and maintenance of the technical controls required to provide secure virtualization
    environments.
