abstract:
- language: en
  script: Latn
  content: ISO 16649-1:2018 specifies a horizontal method for the enumeration of β-glucuronidase-positive
    Escherichia coli by colony-count technique after resuscitation using membranes
    and incubation at 44 °C on a solid medium containing a chromogenic ingredient
    for detection of the enzyme β-glucuronidase[9][10][13][14][17][18][19][20]. It
    is applicable to - products intended for human consumption, - products intended
    for feeding animals, - environmental samples in the area of food production and
    food handling, and - samples from the primary production stage such as animal
    faeces, dust, and swabs.
