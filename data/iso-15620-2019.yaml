abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the friction welding of components
    manufactured from metals. It specifies requirements particular to rotational friction
    welding related to welding knowledge, quality requirements, welding procedure
    specification, welding procedure approval and welding personnel. This document
    is appropriate where a contract, an application standard or a regulatory requirement
    requires the demonstration of the manufacturer's capability to produce welded
    constructions of a specified quality. It has been prepared in a comprehensive
    manner to be used as a reference in contracts. The requirements given can be adopted
    in full or some can be deleted, if not relevant to the construction concerned.
