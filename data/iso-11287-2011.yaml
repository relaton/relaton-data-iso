abstract:
- language: en
  script: Latn
  content: ISO 11287:2011 specifies the parts of a named plant that are suitable for
    making green tea for consumption as a beverage and the chemical requirements for
    green tea that are used to indicate that tea from that source has been produced
    in accordance with good production practice. ISO 11287:2011 also specifies the
    packing and marking requirements for green tea in containers. ISO 11287:2011 is
    not applicable to green tea subject to further processing such as decaffeination
    and further roasting.
