abstract:
- language: en
  script: Latn
  content: ISO 14595:2003 has been developed to facilitate international exchange
    and compatibility of analysis data in electron probe microanalysis (EPMA). It
    gives guidance on evaluating and selecting reference materials (RMs), on evaluating
    the extent of heterogeneity and stability of RMs and it gives recommendations
    for the determination of the chemical composition of RMs for production as EPMA
    certified reference materials. ISO 14595:2003 gives recommendations for single-phase
    certified reference materials (CRMs) used in electron probe microanalysis (EPMA).
    It also provides guidance on the use of CRMs for the microanalysis of flat, polished
    specimens. It does not cover organic or biological materials.
