abstract:
- language: en
  script: Latn
  content: This Technical Report applies to all forms of silver-gelatin microfilm,
    whether in roll, aperture card, jacket or microfiche format. It describes the
    equipment and procedures necessary to identify and monitor deterioration. This
    information serves to identify the extent and nature of the problem and will ultimately
    provide a sound basis for any remedial action that may be required.
