abstract:
- language: en
  script: Latn
  content: This document specifies nominal boundary dimensions, geometrical product
    specifications (GPS) and tolerance values for finished steel cylindrical rollers
    for rolling bearings. The maximum roller diameter is 40 mm. Annexes A and B give
    the sorting principles for roller diameter and roller length tolerances and gauges,
