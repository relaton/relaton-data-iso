abstract:
- language: en
  script: Latn
  content: This document specifies requirements for biobanking of human intestinal
    organoids (HIOs) and intestinal cancer organoids (HICOs), including the requirements
    for the collection of biological source materials and associated data, establishment,
    characterization, quality control (QC), maintenance, preservation, storage, thawing,
    disposal, distribution, and transport. This document is applicable to biobanking
    of HIO and HICO used for research and development in the life sciences. This document
    does not apply to HIO and HICO for the purpose of in vivo application in humans,
    clinical applications or therapeutic use. International, national or regional
    regulations or requirements or multiple of them can also apply to specific topics
    covered in this document. NOTE International, national or regional regulations
    or requirements or multiple of them can also apply to specific topics covered
    in this document.
