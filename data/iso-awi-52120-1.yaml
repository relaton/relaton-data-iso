abstract:
- language: en
  script: Latn
  content: 'This document specifies: —    a structured list of control, building automation and technical building management functions which contribute to the energy performance of buildings; functions have been categorized and structured according to building disciplines and building automation and control (BAC); —    a method to define minimum requirements or any specification regarding the control, building automation and technical building management functions contributing to energy efficiency of a building to be implemented in building of different complexities; —    a factor-based method to get a first estimation of the effect of these functions on typical buildings types and use profiles; —    detailed methods to assess the effect of these functions on a given building.'
