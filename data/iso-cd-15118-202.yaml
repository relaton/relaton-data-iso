abstract:
- language: en
  script: Latn
  content: This document specifies the Extensible SECC Discovery Protocol (ESDP) as
    well as the Event Notification Protocol (ENP) that are intended to be used in
    conjunction with other protocols as defined in ISO 15118-2 and ISO 15118-20 as
    well as documents from other organizations such as DIN or SAE (e.g. DIN/TS 70121
    or SAE J2847/2). These protocols can be used in addition to the existing SECC
    Discovery Protocol defined by the aforementioned documents. They offer additional
    functionality that makes the digital communication for EV charging more robust
    and allows to better determine the reason of failures. In this document, the scope
    is limited to the already existing communication protocols. Thus, it is only an
    addition to already existing communication protocols. Basic requirements regarding
    for example IP communication, or the Vehicle-To-Grid Transport Protocol (V2GTP)
    are not needed, as they are already specified in the respective document of the
    used communication protocol.
