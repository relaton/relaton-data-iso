abstract:
- language: en
  script: Latn
  content: This document specifies the Vehicle-to-grid Transport Protocol (V2GTP), the Extensible SECC Discovery Protocol (ESDP), the Event Notification Protocol (ENP) as well as the conformance test plan that are intended to be used in conjunction with other protocols as defined in ISO 15118-2 and ISO 15118-20 as well as documents from other organizations such as DIN or SAE (e.g. DIN/TS 70121 or SAE J2847/2). These protocols can be used in addition to the existing SECC Discovery Protocol defined by the aforementioned documents. They offer additional functionality that makes the digital communication for EV charging more robust and allows to better determine the reason of failures. In this document, the scope is limited to the already existing communication protocols. Thus, it is only an addition to already existing communication protocols. Basic requirements e.g. regarding IP communication are not considered, as they are already specified in the respective document of the used communication protocol.
