abstract:
- language: en
  script: Latn
  content: This document specifies the requirements, materials, design parameters,
    performance characteristics, and test methods for Panchakarma equipment known
    as Droni, used for therapeutic procedures in Ayurveda. It covers aspects related
    to dimensions (including precise measurements of all components of droni), construction
    techniques, structural stability, ergonomic design safety standards, surface finish,
    hygiene , durability, drainage mechanism and ease of maintenence. This document
    applies to Droni made of wood, metal, polymeric materials, or composite constructions
    used in clinical, institutional, and professional Panchakarma practice settings,
    as well as research setups. It is intended to serve as a standardized reference
    for use across institutions and countries adopting Ayurveda-based therapeutic
    practices.. It does not apply to general-purpose massage tables or equipment not
    intended for Ayurveda therapeutic procedures.
