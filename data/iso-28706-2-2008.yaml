abstract:
- language: en
  script: Latn
  content: ISO 28706-2:2008 describes a test method for the determination of the resistance
    of flat surfaces of vitreous and porcelain enamels to boiling acids, boiling neutral
    liquids and/or their vapours. The method allows the determination of the resistance
    of vitreous and porcelain enamels to the liquid and vapour phases of the corrosive
    medium simultaneously.
