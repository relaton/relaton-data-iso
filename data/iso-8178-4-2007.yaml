abstract:
- language: en
  script: Latn
  content: ISO 8178-4:2007 specifies the test cycles for the measurement and the evaluation
    of gaseous and particulate exhaust emissions from reciprocating internal combustion
    (RIC) engines coupled to a dynamometer. With certain restrictions, this part of
    ISO 8178 can also be used for measurements at site. The tests are carried out
    under steady-state operation using test cycles which are representative of given
    applications. ISO 8178-4:2007 is applicable to RIC engines for mobile, transportable
    and stationary use, excluding engines for motor vehicles primarily designed for
    road use. It may be applied to engines used, e.g. for earth-moving machines, generating
    sets and for other applications.
