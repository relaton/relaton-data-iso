abstract:
- language: en
  script: Latn
  content: ISO 3506-4:2009 specifies the mechanical properties of tapping screws made
    of austenitic, martensitic and ferritic steel grades of corrosion-resistant stainless
    steels, when tested over an ambient temperature range of 10 °C to 35 °C. Properties
    vary at higher or lower temperatures. It applies to tapping screws with threads
    from ST2,2 up to and including ST8, in accordance with ISO 1478. It does not apply
    to screws with special properties such as weldability.
