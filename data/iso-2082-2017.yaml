abstract:
- language: en
  script: Latn
  content: ISO 2082:2017 specifies the requirements of electroplated coatings of cadmium
    with supplementary treatments on iron and steel. It includes information that
    is to be supplied by the purchaser to the electroplater, and describes coating
    requirements, including those for heat treatment before and after electroplating.
    It is not applicable to coatings applied - to sheet, strip or wire in the non-fabricated
    form, - to close-coiled springs, or - for purposes other than protective, intrinsic
    lubricity, ductility, electrical conductivity and low contact resistance use.
    ISO 2082:2017 does not specify requirements for the surface condition of the basis
    metal prior to electrodeposition with cadmium. The coating thickness that can
    be applied to threaded components can be limited by dimensional requirements,
    including class or fit. Additional information on corrosion resistance, rinsing
    and drying, processing parts in bulk and dyeing of chromate conversion coatings
    is given in Annex C.
