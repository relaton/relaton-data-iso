abstract:
- language: en
  script: Latn
  content: ISO 12500-1:2007 specifies the test layout and test procedures required
    for testing coalescing filters used in compressed-air systems to determine their
    effectiveness in removing oil aerosols. ISO 12500-1:2007 provides the means to
    indicate performance characteristics of the pressure drop and the capability of
    removing oil aerosols. ISO 12500-1:2007 defines one method of presenting filter
    performance as outlet oil aerosol concentration stated in milligrams per cubic
    metre from results obtained under standard rating parameters.
