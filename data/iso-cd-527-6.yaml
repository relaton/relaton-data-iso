abstract:
- language: en
  script: Latn
  content: This document specifies measurement method of strain distribution for randomly
    oriented chopped strand- or fibre- reinforced plastic composites, based upon the
    general principles given in ISO 527-4. The methods are used to evaluate the inherent
    dispersion of strain properties and investigate the in-plane statistical material
    properties of the test specimens. The main purpose distinguished from the existing
    standards is to understand strain distribution due to randomly orientation of
    chopped fibre, while ISO 527-4 is sufficient for evaluating only the macroscopic
    elastic modulus.
