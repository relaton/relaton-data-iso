abstract:
- language: en
  script: Latn
  content: This document specifies the general requirements, based on ISO 11074 and
    ISO/IEC 17025, for all steps in the planning (desk study and area reconnaissance)
    of the sampling and the preparation of samples for testing. It includes the selection
    of the sampling strategy, the outline of the sampling plan, the presentation of
    general sampling methods and equipment, as well as the methodology of the pre-treatment
    of samples adapted to the measurements of the activity of radionuclides in soil
    including granular materials of mineral origin which contain NORM or artificial
    radionuclides, such as sludge, sediment, construction debris, solid waste of different
    type and materials from technologically enhanced naturally occurring radioactive
    materials (mining, coal combustion, phosphate fertilizer production etc.). For
    simplification, the term “soil” used in this document covers the set of elements
    mentioned above. This document is addressed to the people responsible for determining
    the radioactivity present in soil for the purpose of radiation protection. It
    is applicable to soil from gardens, farmland, urban, or industrial sites, as well
    as soil not affected by human activities. This document is applicable to all laboratories
    regardless of the number of personnel or the range of the testing performed. When
    a laboratory does not undertake one or more of the activities covered by this
    document, such as planning, sampling, test or calibration, the corresponding requirements
    do not apply. NOTE      The term “laboratory” is applicable to all identified
    entities (individuals, organizations, etc.) performing planning, sampling, test
    and calibration.
