abstract:
- language: en
  script: Latn
  content: ISO 14313:2007 specifies requirements and provides recommendations for
    the design, manufacturing, testing and documentation of ball, check, gate and
    plug valves for application in pipeline systems meeting the requirements of ISO
    13623 for the petroleum and natural gas industries. ISO 14313:2007 is not applicable
    to subsea pipeline valves, as they are covered by a separate International Standard
    (ISO 14723). ISO 14313:2007 is not applicable to valves for pressure ratings exceeding
    PN 420 (Class 2 500).
