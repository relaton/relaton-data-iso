abstract:
- language: en
  script: Latn
  content: 'This document specifies an AfA concept registry service, in particular:
    —     requirements on registries; —     requirements on concept submissions; —    
    a data format (in JSON) for the exchange of registry entries (AfA concept records)
    between registry servers; —     a set of RESTful operations for AfA concept registry
    servers to allow for the manipulation of AfA concept registry entries by external
    clients other than server-internal web interfaces.'
