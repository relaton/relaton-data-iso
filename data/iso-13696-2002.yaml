abstract:
- language: en
  script: Latn
  content: ISO 13696:2002 specifies procedures for the determination of the total
    scattering by coated and uncoated optical surfaces. Procedures are given for measuring
    the contributions of the forward scattering and backward scattering to the total
    scattering of an optical component. ISO 13696:2002 applies to coated and uncoated
    optical components with optical surfaces that have a radius of curvature of more
    than 10 m. The wavelength range includes the ultraviolet, the visible and the
    infrared spectral regions.
