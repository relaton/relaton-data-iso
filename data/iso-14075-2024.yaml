abstract:
- language: en
  script: Latn
  content: This document establishes principles and framework, specifies requirements
    and gives guidance for the social life cycle assessment (S-LCA) of a product.
    The framework supports addressing the United Nations (UN) Sustainable Development
    Goals (SDG) and reaching the targets by identifying the enabling aspects from
    the inhibiting ones (with detrimental contributions). The document provides goal
    and scope definition, inventory analysis, impact assessment, interpretation and
    reporting of the S-LCA of a product.
