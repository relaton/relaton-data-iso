abstract:
- language: en
  script: Latn
  content: ISO 17034:2016 specifies general requirements for the competence and consistent
    operation of reference material producers. ISO 17034:2016 sets out the requirements
    in accordance with which reference materials are produced. It is intended to be
    used as part of the general quality assurance procedures of the reference material
    producer. ISO 17034:2016 covers the production of all reference materials, including
    certified reference materials.
