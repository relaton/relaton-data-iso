abstract:
- language: en
  script: Latn
  content: This part of ISO 10440 covers the minimum requirements for helical, spiral
    and straight-lobe, oil-free rotary compressors used for applications up to 0,20
    MPa in refinery services. It is applicable to air (and other inert gas) compressors
    that are in continuous duty on process units. This part of ISO 10440 is not applicable
    to oil injected rotary compressors. NOTE A bullet (?) at the beginning of a clause
    or sub-clause indicates that either a decision is required or further information
    is to be provided by the purchaser. This information should be indicated on the
    data sheets; otherwise it should be stated in the quotation request or in the
    order.
