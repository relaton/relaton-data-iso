abstract:
- language: en
  script: Latn
  content: This International Standard defines the basic gesture commands for text
    editing with pen-based systems and defines the user actions required to have the
    system execute these commands. The feedback to the user when a gesture command
    has been correctly recognized is also defined. This International Standard does
    not define the user actions necessary for the input of characters.
