abstract:
- language: en
  script: Latn
  content: This document gives guidance on the evaluation, development and improvement
    of organizational quality culture to help an organization to achieve sustained
    success. This document takes into account the fundamental concepts and quality
    management principles, with specific focus on people engagement and leadership.
    The recommendations in this document are generic and are intended to be applicable
    to any organization, regardless of its size, industry, location, maturity or the
    products and services it provides. NOTE   This document provides example tools
    for the evaluation of organizational quality culture by self-assessment to determine
    quality culture maturity and potential for improvement
