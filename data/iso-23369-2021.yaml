abstract:
- language: en
  script: Latn
  content: 'This document specifies: a) A multi-pass filtration performance test under
    cyclic flow conditions with continuous contaminant injection for hydraulic fluid
    power filter elements. b) A procedure for determining the contaminant capacity,
    particulate removal and differential pressure characteristics. c) A test currently
    applicable to hydraulic fluid power filter elements that exhibit an average filtration
    ratio greater than or equal to 75 for particle sizes ≤25 µm(c), and a final test
    system reservoir gravimetric level of less than 200 mg/L. It is necessary to determine
    by validation the range of flow rates and the lower particle size limit that can
    be used in test facilities. d) A test using ISO12103-1 A3 medium test dust contaminant
    and a test fluid. This document provides a test procedure that yields reproducible
    test data for appraising the filtration performance of a hydraulic fluid power
    filter element without influence of electrostatic charge. This document is applicable
    to three test conditions: 1)    Base upstream gravimetric level of 3 mg/L. 2)   
    Base upstream gravimetric level of 10 mg/L. 3)    Base upstream gravimetric level
    of 15 mg/L.'
