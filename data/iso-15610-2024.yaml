abstract:
- language: en
  script: Latn
  content: 'This document specifies how a welding procedure can be qualified by using
    tested welding consumable data. It expands on the requirements given in ISO 15607.
    In addition, it gives the range of qualification. Application of this document
    is limited to parent material groups 1.1, 8.1, 21, 22.1 and 22.2 in accordance
    with ISO/TR 15608, which produce acceptable microstructures and properties in
    the heat-affected zone which do not deteriorate significantly in service. This
    document is limited to: —     butt welds and fillet welds in material of thicknesses
    t ≤ 40 mm (groups 1.1 and 8.1) and t ≤ 20 mm (groups 21, 22.1 and 22.2); —    
    fillet welds with throat thickness a ≥ 1 mm. This document is not applicable when
    any of the following is specified for the welded joint: a)       hardness; b)      
    impact properties; c)        preheating; d)       controlled heat input; e)      
    interpass temperature; f)         post-weld heat treatment. The use of this document
    can also be restricted by an application standard, specification or other documents.'
