abstract:
- language: en
  script: Latn
  content: This document specifies requirements for almandite garnet abrasives, as
    supplied for blast-cleaning. It specifies ranges of particle sizes and values
    for apparent density, Mohs hardness, moisture content, conductivity of aqueous
    extract and water-soluble chlorides. The requirements specified in this document
    apply to abrasives supplied in the new condition only. They do not apply to abrasives
    either during or after use. Test methods for non-metallic blast-cleaning abrasives
    are given in the various parts of the ISO 11127 series. NOTE            Although
    this document has been developed specifically to meet requirements for preparation
    of steelwork, the properties specified are generally appropriate for use when
    preparing other material surfaces, or components, using blast- cleaning techniques.
    These techniques are described in ISO 8504-2.[1]
