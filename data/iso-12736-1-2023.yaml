abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the validation of wet thermal
    insulation systems applied to pipelines and subsea equipment in the oil and gas
    industry. This document is applicable to wet thermal insulation systems submerged
    in seawater. This document is not applicable to: —     maintenance works on existing
    installed wet thermal insulation systems; —     qualification for anti-corrosion
    coating; —     thermal insulation in the annulus of a steel pipe-in-pipe system.'
