abstract:
- language: en
  script: Latn
  content: ISO 22826:2005 specifies the requirements for hardness testing of transverse
    sections of narrow laser and electron beam welded joints in metallic materials.
    It covers Vickers and Knoop hardness tests in accordance with ISO 6507-1 and ISO
    4545, respectively, with test forces of 0,098 N to just under 98 N (HV 0,01 to
    just under HV 10) for the Vickers hardness test and test forces up to and including
    9,8 N (just under HK 1) for the Knoop hardness test. It is applicable to welds
    made with or without filler wire. It may not be applicable to the testing of wider
    hybrid laser/arc welds.
