abstract:
- language: en
  script: Latn
  content: 'This document applies to the following equipment related to melting and
    pouring in foundry machinery: a) cupola furnaces; b) cupola furnace chargers;
    c) ladles; d) ladle heaters; e) pouring machines; f) automatic transfer systems
    for molten metal. This document deals with foreseeable significant hazards, hazardous
    situations and events relevant to melting and pouring equipment when used as intended
    and under conditions of misuse which are reasonably foreseeable by the manufacturer.
    It provides the requirements to be met by the manufacturer to ensure the safety
    of persons and property during the lifecycle phases according to ISO 12100:2010,
    5.4, as well as in the event of foreseeable failures or malfunctions that can
    occur in the equipment. The foreseeable significant hazards are listed in Clause
    5 and include: — mechanical hazards, movement of machinery and workpieces, inadequacy
    of the mechanical strength; — electrical hazards, electric shock and ignition;
    — explosion, fire and exothermic reactions; — contact with hot parts, gases and
    flames; — noise and vibration; — spattering, splashing and leakage of molten metal;
    — ejection of liquid or gaseous materials; — thermal radiation and conduction;
    — harmful substances, poisoning and air pollution.'
