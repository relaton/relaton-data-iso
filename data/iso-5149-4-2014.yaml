abstract:
- language: en
  script: Latn
  content: ISO 5149-4:2014 specifies requirements for safety and environmental aspects
    in relation to operation, maintenance and repair of refrigerating systems and
    the recovery, reuse and disposal of all types of refrigerant, refrigerant oil,
    heat transfer fluid, refrigerating system and part thereof. These requirements
    are intended to minimize risks of injury to persons and damage to property and
    the environment resulting from improper handling of the refrigerants or from contaminants
    leading to system breakdown and resultant emission of the refrigerant.
