abstract:
- language: en
  script: Latn
  content: Specification of a method for determining the apparent density or the bulk
    density of rigid, semi-rigid or flexible cellular plastics and rubbers. If the
    material to be tested includes skins formed during moulding, the apparent overall
    density or the apparent core density may be determined. Each test piece shall
    be of a shape, that its volume can be easily calculated.
