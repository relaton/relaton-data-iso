abstract:
- language: en
  script: Latn
  content: ISO 11469:2016 specifies a system of uniform marking of products that have
    been fabricated from plastics materials. Provision for the process or processes
    to be used for marking is outside the scope of this International Standard. NOTE
    1 Precise details of the marking, e.g. the minimum size of the item to be marked,
    the size of the lettering, the appropriate location of the marking, are subject
    to agreement between the manufacturer and the user. The marking system is intended
    to help identify plastics products for subsequent decisions concerning handling,
    waste recovery or disposal. Generic identification of the plastics is provided
    by the symbols and abbreviated terms given in ISO 1043‑1, ISO 1043‑2, ISO 1043‑3
    and ISO 1043‑4. NOTE 2 If more detailed information for material identification
    is needed, additional marking of plastics products can be applied as defined in
    the appropriate product standard. ISO 11469:2016 is not intended to supplant,
    replace or in any way interfere with the requirements for labelling specified
    in product standards or legislation.
