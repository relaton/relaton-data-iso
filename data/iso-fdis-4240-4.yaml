abstract:
- language: en
  script: Latn
  content: This document describes a test method and procedure for the remediation
    of oil-contaminated soil using fine bubble technology. It details the process
    of washing the soil with fine bubbles and measuring the oil content before and
    after the washing process. The scope of this document includes the necessary steps
    and considerations for conducting effective soil washing using fine bubbles, as
    well as the methodologies for quantifying the efficiency of oil removal from the
    soil.
