abstract:
- language: en
  script: Latn
  content: This document specifies a test method for evaluating the dynamic flow properties
    of fine ceramic powders through image analysis of powder movement and avalanche
    behavior in a rotating drum. The method involves rotating a transparent drum containing
    ceramic powder at a constant speed and capturing sequential images of powder movement
    and repeated avalanche events. The acquired images are analyzed to quantify avalanche
    energy, slope angle, and linearity, enabling statistical evaluation of dynamic
    flow behavior, stability, and variability. Note 1 This method provides quantitative
    information on the consistency and fluctuations of powder flow through repeated
    avalanche measurements. Note 2 This method is particularly useful for evaluating
    the flow behavior of ceramic powders under dynamic conditions relevant to powder
    feeding, mixing, and handling processes.
