abstract:
- language: en
  script: Latn
  content: This document specifies a method for the quantitative determination of
    calcium (Ca), copper (Cu), iron (Fe), magnesium (Mg), manganese (Mn), phosphorus
    (P), potassium (K), sodium (Na), zinc (Zn), chromium (Cr), molybdenum (Mo) and
    selenium (Se) using inductively coupled plasma and mass spectrometry (ICP-MS).
    The method is applicable for the determination of all 12 elements in infant formula
    and adult nutritional products. The method is also applicable for milk, milk powder,
    whey powder, butter and cheese excluding the determination of Cr, because all
    Cr results were below the quantification limit and reproducibility could not be
    determined in these matrices[1]. The present method is an extension of ISO 20649
    | IDF 235 (AOAC 2011.19[2]) which was validated only for Cr, Mo and Se in infant
    formula and adult nutritional products.
