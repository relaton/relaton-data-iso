abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and test methods for the substances
    and materials used in chemical toys (sets) other than experimental sets. These
    substances and mixtures are: — those classified as dangerous by the Globally Harmonized
    System of Classification and Labelling of Chemicals (GHS)[1]; — substances and
    mixtures which in excessive amounts could harm the health of the children using
    them and which are not classified as dangerous by the GHS; and — any other chemical
    substance(s) and mixture(s) delivered with the chemical toy. Additionally, requirements
    are specified for markings, warnings, safety rules, contents lists, instructions
    for use and first aid information. This document applies to: — plaster of Paris
    (gypsum) moulding sets; — oven-hardening plasticised PVC modelling clay sets;
    — polystyrene granules sets; — embedding sets; — adhesives, paints, lacquers,
    varnishes, thinners and cleaning agents (solvents) supplied or recommended in
    model sets.'
