abstract:
- language: en
  script: Latn
  content: 'The document takes a multiple agency as well as a citizen-centric viewpoint.
    It provides guidance on: — smart city ecosystem privacy protection; — how standards
    can be used at a global level and at an organizational level for the benefit of
    citizens; and — processes for smart city ecosystem privacy protection. This document
    is applicable to all types and sizes of organizations, including public and private
    companies, government entities, and not-for-profit organizations that provide
    services in smart city environments.'
