abstract:
- language: en
  script: Latn
  content: ISO 13438:2004 specifies a screening test method for determining the resistance
    of geotextiles and geotextile-related products to oxidation. The test is applicable
    to polypropylene- and polyethylene-based products. The data are suitable for screening
    purposes but not for deriving performance data such as lifetime unless supported
    by further evidence.
