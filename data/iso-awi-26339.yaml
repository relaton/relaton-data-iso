abstract:
- language: en
  script: Latn
  content: This document specifies a spinning drop method for measuring the interfacial
    tension between surfactant-based chemical flooding system and oil, especially
    for interfacial tension less than 10^-2 mN/m. This document is applicable to surfactant-polymer
    (SP), alkali/salt-surfactant (AS), and alkali/salt-surfactant-polymer (ASP) flooding
    systems. This document includes sections on principles, reagents and materials,
    instruments, procedures.
