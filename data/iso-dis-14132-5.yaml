abstract:
- language: en
  script: Latn
  content: This document gives terms and definitions for night vision devices such
    as binoculars, monoculars, goggles, telescopic sights and front attachments that
    are used under extremely low light conditions, at night or in dark rooms, for
    observation activities, search and rescue actions, performing urgent repairs in
    the dark, night‑time surveillance and security, night hunting and fishing (where
    legal), night driving and exploring dark spaces like caves or tunnels. This document
    does not cover thermal imaging technology. The definitions can be changed, if
    required, by introducing derivative attributes into them, revealing the meanings
    of the terms used, showing the objects covered by the scope of the notion being
    defined. These changes shall not upset the scope and contents of the notions defined.
