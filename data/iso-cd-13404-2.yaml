abstract:
- language: en
  script: Latn
  content: This document specifies the uses and functions of upper limb orthoses.
    It classifies and describes the devices and their components. It permits the systematic
    classification and description of both the finished orthosis and the components
    from which it is assembled in a manner that clearly explains their principal characteristics.
    This document is intended for practitioners prescribing and/or providing upper
    limb orthoses, for manufacturers describing their products, and for those researching
    and reporting on orthotic use. This document does not specify the materials or
    the manufacturing methods used for their fabrication.
