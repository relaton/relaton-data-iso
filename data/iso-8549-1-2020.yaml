abstract:
- language: en
  script: Latn
  content: This document defines general terms used to describe external limb prostheses
    and orthoses, and the personnel involved in the practice of prosthetics and orthotics.
    NOTE 1 The complete range of levels of limb amputation are listed and defined
    in ISO 8549-2. The complete range of classes of orthoses are listed and defined
    in ISO 8549-3. This document does not apply to breast, ocular or other external
    prostheses used to replace other parts of the human body, nor to dental prostheses
    or orthoses. NOTE 2 For the purposes of this document, the abbreviated term 'prosthetics'
    and its derivatives only apply to external limb prosthetics. The abbreviated term
    'orthotics' and its derivatives only apply to external orthotics.
