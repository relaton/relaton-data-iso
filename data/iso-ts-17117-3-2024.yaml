abstract:
- language: en
  script: Latn
  content: The document defines the progression of implementation of terminology capability
    in information systems. This document does not specify requirements for any specific
    terminological resource. It is intended to provide a basis for conformance criteria
    for terminological resources capabilities in specific use cases. This document
    does not cover in detail the software being used, though the capabilities of that
    software are included and impact the level of maturity reached. This document
    is applicable to terminological resources of all types, terminologies, classifications,
    value sets, code systems, and value domains.
