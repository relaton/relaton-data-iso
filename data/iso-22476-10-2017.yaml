abstract:
- language: en
  script: Latn
  content: ISO 22476-10 specifies the equipment, execution and reporting requirements
    of the weight sounding test. NOTE ISO 22476-10 fulfils the requirements for the
    weight sounding test as part of the geotechnical investigation and testing according
    to EN 1997?1 and EN 1997?2. ISO 22476-10 specifies the procedure for conducting
    a test with the weight sounding device in natural soils, made ground, and fill
    either on land or on water. ISO 22476-10 is applicable to the determination of
    the resistance of soil to the static load or the static load and the specified
    turning of the sounding point. ISO 22476-10 gives guidelines for the use of the
    weight sounding test to give a continuous soil profile and an indication of the
    layer sequence. The use includes the estimation of the density of cohesionless
    soils and the depth to very dense ground layers indicating the length of end-bearing
    piles.
