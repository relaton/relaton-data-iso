abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the mass concentration
    (μg/g) of tyre and road wear particles (TRWP) in soil or sediment environmental
    samples. This document establishes principles for soil or sediment sample collection,
    the generation of pyrolysis fragments from the sample, and the quantification
    of the generated polymer fragments. This document is applicable to the environmental
    samples from soil or sediment. This document is not applicable to the environmental
    samples from ambient air and ambient water.
