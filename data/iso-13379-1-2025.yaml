abstract:
- language: en
  script: Latn
  content: This document a)       establishes common concepts for condition monitoring
    and diagnostics of machine systems, simplifying communication between the users
    and manufacturers of condition monitoring and diagnostics systems; b)       establishes
    technical characteristics and describes principles for condition monitoring and
    diagnostics of machine systems; c)        gives guidance on developing condition
    monitoring and diagnostics systems; and d)       gives guidance on selecting an
    appropriate diagnostic approach in the particular application. This document is
    applicable to any machine system whose state can be described by measuring or
    observing its operational parameters (or inputs) and responses (or outputs).
