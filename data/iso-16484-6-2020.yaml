abstract:
- language: en
  script: Latn
  content: 'This standard provides a comprehensive set of procedures for verifying
    the correct implementation of each capability claimed on a BACnet PICS including:
    (a) support of each claimed BACnet service, either as an initiator, executor,
    or both, (b) support of each claimed BACnet object-type, including both required
    properties and each claimed optional property, (c) support of the BACnet network
    layer protocol, (d) support of each claimed data link option, and (e) support
    of all claimed special functionality.'
