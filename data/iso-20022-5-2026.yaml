abstract:
- language: en
  script: Latn
  content: This document defines a scalable, methodical process to ensure business
    concept model interoperability and logical model alignment and reverse engineering.
    This document provides guidance on conceptual interoperability and reverse engineering
    to explain how to extract relevant information from existing IndustryMessageSet,
    proprietary MessageSet or business model in order to prepare the submission to
    the ISO 20022 Registration Authority of equivalent, ISO 20022 conformant BusinessTransactions,
    BusinessComponents (including BusinessElements and Constraints) and MessageSets.
    This document describes the activities of ISO 20022 conceptual interoperability
    and reverse engineering from the point of view of the user who wants to verify
    that the business functionality, covered by their own IndustryMessageSet, proprietary
    MessageSets or business model, is covered by ISO 20022 conformant BusinessTransactions,
    BusinessComponents (including BusinessElements and Constraints) and MessageSets.
