abstract:
- language: en
  script: Latn
  content: ISO 10845-1:2010 describes processes, methods and procedures for the establishment
    within an organization of a procurement system that is fair, equitable, transparent,
    competitive and cost-effective. ISO 10845-1:2010 describes generic procurement
    processes around which an employer can develop its procurement system, establishes
    basic requirements for the conduct of an employer's employees, agents, board members
    and office bearers when engaging in procurement, establishes the framework for
    the development of an employer's procurement policy, including any secondary procurement
    policy, and establishes generic methods and procedures for procurements, including
    those pertaining to disposals.
