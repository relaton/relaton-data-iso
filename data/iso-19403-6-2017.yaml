abstract:
- language: en
  script: Latn
  content: ISO 19403-6:2017 specifies a method to measure the dynamic contact angle
    with an optical method. The advancing and the receding angles are determined.
    By means of this defined measurement, the wetting and dewetting properties can
    be characterized. It can also be concluded on the morphological and chemical homogeneity
    of interfaces.
