abstract:
- language: en
  script: Latn
  content: ISO 17075-1:2017 specifies a method for determining chromium(VI) in solutions
    leached from leather under defined conditions. The method described is suitable
    to quantify the chromium(VI) content in leathers down to 3 mg/kg. ISO 17075-1:2017
    is applicable to all leather types. The results obtained from this method are
    strictly dependent on the extraction conditions. Results obtained by using other
    extraction procedures (extraction solution, pH, extraction time, etc.) are not
    comparable with the results produced by the procedure described in this document.
    If a leather sample is tested with both this document and ISO 17075-2, the results
    obtained with ISO 17075-2 are considered as the reference. The advantage of the
    method described in ISO 17075-2 is that there are no interferences from the colour
    of the extract. Nevertheless, interlaboratory trials do not show significant differences
    (see Annex C) and the results are comparable between both methods.
