abstract:
- language: en
  script: Latn
  content: ISO 17353:2004 specifies a method for the identification and quantification
    of monobutyltin, dibutyltin, tributyltin, tetrabutyltin, monooctyltin, dioctyltin,
    triphenyltin, tricyclohexyltin compounds and/or cations in drinking water, surface
    water and wastewater containing not more than 2 g/l of suspended material. The
    working range is 10 ng/l to 1 000 ng/l. The respective anions are not determined.
    This method can also be applicable to other compounds such as monomethyltin, dimethyltin,
    monophenyltin and diphenyltin compounds and/or cations. ISO 17353:2004 is also
    applicable to marine water.
