abstract:
- language: en
  script: Latn
  content: Applicable to interworking units concerned with operating in the Open Systems
    Interconnection (OSI) Local Area Network environment. Specifies a combination
    of OSI standards that collectively provide a MAC relay function. Specifies requirements
    that are dependent on the type of subnetwork. Applicable to an interworking unit
    which is attached to a Token Ring LAN subnetwork and is relaying to another LAN
    subnetwork, not necessarily of the same type.
