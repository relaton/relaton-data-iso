abstract:
- language: en
  script: Latn
  content: 'This document establishes a set of process descriptions for the governance
    and management of a collection of architectures and the architecting of entities.
    This document establishes a set of process descriptions for the conceptualization,
    evaluation and elaboration of an architecture and the architecting of an entity.
    This document also establishes an enablement process description that provides
    support to these other architecture processes. These processes are associated
    with the architecture practice applicable to various entities such as enterprises,
    business components, capability areas, mission areas, missions, systems, systems
    of systems, families of systems, infrastructure, products, services, product lines,
    hardware, software applications and technologies. These processes are intended
    for: – participants in architecting and engineering efforts; – organizations and
    projects adopting architecture practice in their architecting and engineering
    efforts; – developers of architectures, architecture designs, solution designs,
    architecture descriptions, reference architectures, reference architecture descriptions
    and reference models; – stakeholders using architectures as the baseline for their
    activities; – providers of architecture-related standards, guidelines, training,
    education and evaluation instruments used for assessment of architecture practices
    and architecting work products; – developers of architecture description languages,
    architecture modelling languages, architecture frameworks, architecture development
    and modelling methodologies, and architecture-related tools and technologies.
    The application areas of this document include, but are not limited to, the following:
    artificial intelligence (AI), machine learning (ML), Internet of Things (IoT),
    cloud computing, big data, smart cities, smart manufacturing, cybersecurity, digital
    twin, telecommunications, aerospace, defense, banking, finance, insurance, energy,
    automotive, hospitality, healthcare, supply chain, transportation, manufacturing,
    agriculture, production, and infrastructure. This document addresses generic architecture-related
    terms and definitions and does not address domain-specific terms and definitions.
    This document does not address concepts and principles related to architecture
    competencies.'
