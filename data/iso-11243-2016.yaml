abstract:
- language: en
  script: Latn
  content: ISO 11243:2016 specifies safety and performance requirements for the design
    and testing of luggage carriers intended for mounting (with or without tool) above
    and adjacent to the wheels of cycles and lays down guide lines for instructions
    on the use and care of such luggage carriers. It does not apply to removable luggage
    (for example, handlebar bags or baskets that are not permanently attached). Toy
    carrier intended to be mounted on bicycles for young children in the scope of
    ISO 8098 are not covered by ISO 11243:2016.
