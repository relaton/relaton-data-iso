abstract:
- language: en
  script: Latn
  content: ISO 10254:2016 defines the terms relating to air cargo and aircraft ground
    equipment, as used in the other International Standards in these areas. NOTE The
    term "weight" is used throughout ISO 10254:2016 instead of the correct technical
    term "mass", in order to conform to current commercial usage. The terms and abridged
    definitions of ISO 10254:2016 are primarily intended to provide uniform understanding
    of the International Standards prepared by TC20/SC9. However, it is intended that
    they be used in any other documents, manuals and standards in the areas of air
    cargo and airport ground equipment. More detailed definitions are provided when
    needed in the "Terms and definitions" clause of the specific International Standards
    prepared by TC20/SC9. The terms are listed in alphabetic sequence in the English
    language version. An index allows the identification of terms from their French
    or German expressions.
