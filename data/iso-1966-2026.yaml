abstract:
- language: en
  script: Latn
  content: This document specifies the design requirements (and tests) for the crimping of insulated and non-insulated joints to general purpose electrical cables for aircraft, with conductors of copper, copper alloy, aluminium or aluminium alloy, in locations in which the stabilized conductor temperature does not exceed the values specified for the relevant type of cable, i.e. 105 °C, 190 °C or 260 °C. This document specifies the type of cable to use for the joints (see 4.1). The document also contains recommendations relating to the inspection of such connections and the tools used to perform the crimping operation. Because satisfactory crimping is dependent upon the maintenance and setting of tools, it also contains recommendations for tests to confirm their serviceability. NOTE            Testing of crimped joints to assess their suitability for aircraft shows that certain environmental conditions, for example vibration, have no significant effect on the performance of the joints. Therefore, such tests are not provided in this document.
