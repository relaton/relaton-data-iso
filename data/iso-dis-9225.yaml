abstract:
- language: en
  script: Latn
  content: ISO 9225:2012 specifies methods for measuring the parameters needed for
    corrosivity estimation used for classification of the corrosivity of atmospheres
    in ISO 9223. ISO 9225:2012 specifies methods for the measurement of environmental
    parameters for normative corrosivity estimation based on calculated first-year
    corrosion rates of standard metals, and informative corrosivity estimation based
    on characterization of the exposure environment. It does not describe the usual
    analytical techniques for the measured parameters since this depends on the available
    analytical techniques used in laboratories. Specific methods for deposition measurement
    of SO2 and Cl- deposition rates and conversional factors for comparison of different
    measuring methods are given.
