abstract:
- language: en
  script: Latn
  content: This document describes minimum requirements for small spacecraft. This
    document covers different categories of small spacecraft – so-called mini-, micro-,
    nano-, pico- and femto-, as well as CubeSat, spacecraft. Therefore, for the sake
    of convenience, the term “small spacecraft” is used throughout this document as
    a generic term. This document can be applied by small spacecraft developers, as
    well as dispenser providers and launch operators.
