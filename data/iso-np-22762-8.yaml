abstract:
- language: en
  script: Latn
  content: 'This document specifies the test methods for determining the mechanical
    characteristics of large size elastomeric seismic protection isolators subjected
    to dynamic velocity loading representative of seismic actions. The isolators covered
    by this document consist of multilayered vulcanized rubber sheets and reinforcing
    steel plates, as defined in ISO 22762 1. The test methods include the application
    of horizontal dynamic loading, with or without simultaneous vertical loading,
    in order to evaluate: — shear properties under dynamic velocities; — vertical
    load bearing performance under dynamic conditions; — large deformation behaviour;
    — ultimate shear properties, including breaking, buckling, and roll out displacement.
    These methods are intended for test pieces of dimensions representative of isolators
    used in actual structures (hereafter “large size isolators”). The tests are applicable
    to isolators used in buildings, bridges and other structures requiring evaluation
    under seismic level dynamic loading. This document is intended to be used in conjunction
    with ISO 22762 1, which specifies general test methods for elastomeric isolators,
    and with ISO 22762 2, ISO 22762 3, or ISO 22762 which specify design related requirements
    for isolators used in bridges and buildings, respectively. This document does
    not specify the design requirements of isolators, nor the criteria for their acceptance
    in specific structural applications. These matters are specified in ISO 22762
    2, ISO 22762 3, and ISO 22762-6.'
