abstract:
- language: en
  script: Latn
  content: ISO 8835-2:2007 specifies requirements for anaesthetic breathing systems
    that are supplied either assembled by the manufacturer or for assembly by the
    user in accordance with the manufacturer's instructions. ISO 8835-2:2007 also
    covers circle absorber assemblies, exhaust valves, inspiratory and expiratory
    valves and, in some designs, those parts of an anaesthetic breathing system that
    are incorporated within an inhalation anaesthetic system, including the expiratory
    gas pathway of an anaesthetic ventilator.
