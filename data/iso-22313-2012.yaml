abstract:
- language: en
  script: Latn
  content: 'ISO 22313:2012 for business continuity management systems provides guidance
    based on good international practice for planning, establishing, implementing,
    operating, monitoring, reviewing, maintaining and continually improving a documented
    management system that enables organizations to prepare for, respond to and recover
    from disruptive incidents when they arise. It is not the intent of ISO 22313:2012
    to imply uniformity in the structure of a BCMS but for an organization to design
    a BCMS that is appropriate to its needs and that meets the requirements of its
    interested parties. These needs are shaped by legal, regulatory, organizational
    and industry requirements, the products and services, the processes employed,
    the environment in which it operates, the size and structure of the organization
    and the requirements of its interested parties. ISO 22313 is generic and applicable
    to all sizes and types of organizations, including large, medium and small organizations
    operating in industrial, commercial, public and not-for-profit sectors that wish
    to: establish, implement, maintain and improve a BCMS; ensure conformance with
    the organization''s business continuity policy; or make a self-determination and
    self-declaration of compliance with this International Standard.'
