abstract:
- language: en
  script: Latn
  content: ISO 21482:2007 specifies the symbol to warn of the presence of a dangerous
    level of ionizing radiation from a high-level sealed radioactive source that can
    cause death or serious injury if handled carelessly. This symbol is not intended
    to replace the basic ionizing radiation symbol (ISO 361), but to supplement it
    by providing further information on the danger associated with the source and
    the necessity for untrained or uninformed members of the public to stay away from
    it. This symbol is recommended for use with International Atomic Energy Agency
    (IAEA) Category 1, 2, and 3 sealed radioactive sources. These sources are defined
    by the IAEA as having the ability to cause death or serious injuries.
