abstract:
- language: en
  script: Latn
  content: ISO 11073-91064:2009 specifies the common conventions required for the
    cart-to-host as well as cart-to-cart interchange of specific patient data (demographic,
    recording, ...), ECG signal data, ECG measurement and ECG interpretation results.
    ISO 11073-91064:2009 specifies the content and structure of the information that
    is to be interchanged between digital ECG carts and computer ECG management systems,
    as well as other computer systems where ECG data can be stored.
