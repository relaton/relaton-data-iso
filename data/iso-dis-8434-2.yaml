abstract:
- language: en
  script: Latn
  content: ISO 8434-2:2007 specifies general and dimensional requirements for the
    design and performance of 37° flared connectors that are suitable for use with
    ferrous and non-ferrous tubes with outside diameters from 6 mm to 50,8 mm, inclusive.
    These connectors are for use in fluid power and general applications within the
    limits of pressure and temperature specified. They are intended for the connection
    of tubes and hose fittings to ports in accordance with ISO 6149‑1, ISO 1179‑1,
    ISO 9974‑1 and ISO 11926‑1. (See ISO 12151‑5 for related hose fitting specification.)
    ISO 8434-2:2007 also specifies a performance and qualification test for 37° flared
    connectors.
