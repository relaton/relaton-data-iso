abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the following grades of wrought
    tool steels: a) non-alloy cold-work tool steels; b) alloy cold-work tool steels;
    c) alloy hot-work tool steels; d) high-speed tool steels. If not stated otherwise,
    this document applies to all types of hot-rolled, forged, cold-drawn or cold-rolled
    products or products produced by powder metallurgy, which are supplied in one
    of the surface and heat-treatment conditions given in 6.2 and Table 1. NOTE Tables
    2, 4, 6 and 8 cover only those steels which have gained certain international
    importance, which does not mean, however, that they are available in all industrial
    countries. In addition, a number of other steels for tools are specified in regional,
    national or company standards. Where the heat resistance of the tools is of particular
    importance, as for example in the case of tools for hot forming glass, the material
    selection is based on ISO 4955.'
