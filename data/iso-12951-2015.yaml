abstract:
- language: en
  script: Latn
  content: 'ISO 12951:2015 specifies four methods of test of textile floor coverings
    (with or without an underlay, see Clause 9) using the Lisson Tretrad machine.
    - test A: determination of mass loss of textile floor coverings, also used to
    assess fibre bind of synthetic pile carpets; - test B: determination of stair
    nosing appearance change of textile floor coverings; - test C: determination of
    fibre bind on synthetic loop pile carpets; - test D: determination of fibre bind
    (hairiness) on needled floor coverings and floor coverings without pile.'
