abstract:
- language: en
  script: Latn
  content: This document provides an overview of measurement procedures for biological
    sample analysis using electron microscopy. This is exemplified by synthetic nanoscale
    biological materials that have undergone a series of inter-laboratory comparisons
    and is offered as the first metrologically traceable biological reference material
    for the characterisation of biological and patient biopsy specimen using electron
    microscopy. An emphasis is also made on the use of the materials of this type
    for the internal calibration, calibration assessment and performance optimization
    of electron microscopes for biological sample imaging and analysis.
