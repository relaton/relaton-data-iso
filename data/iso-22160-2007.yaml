abstract:
- language: en
  script: Latn
  content: ISO 22160|IDF 209:2007 specifies a method for the determination of the
    alkaline phosphatase activity in pasteurized whole milk, semi-skimmed milk, skimmed
    milk, cream and flavoured milks using a chemiluminescent (EPAS) method. The method
    is applicable to milk and milk-based drinks from cows, sheep, buffalo and goats.
    The method is also suitable for any liquid-based sample if diluted in such a way
    that the diluted alkaline phosphatase activity has less than 7 000 milliunits
    per litre.
