abstract:
- language: en
  script: Latn
  content: 'ISO 18446:2016 defines extensions to the SLE API in terms of: a) the FSP-specific
    functionality provided by API components; b) the FSP-specific interfaces provided
    by API components; and c) the externally visible behavior associated with the
    FSP interfaces exported by the components. It does not specify: a) individual
    implementations or products; b) the internal design of the components; and c)
    the technology used for communications. ISO 18446:2016 defines only interfaces
    and behavior that must be provided by implementations supporting the Forward Space
    Packet service in addition to the specification in reference [5].'
