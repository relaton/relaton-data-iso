abstract:
- language: en
  script: Latn
  content: This document specifies a cone procedure for determining an uncompacted
    bulk density of crushed coal up to −45 mm nominal top size, as it is handled in
    industrial practices. It focuses on the uncompacted bulk density of coal resulting
    from flowing the material into a measuring container (box) in the absence of compacting
    forces. The determination of the bulk density of coal charged into coke ovens
    is a typical example. This document also provides a method for determining the
    bulk density of dry powdered coal at −63 micrometres for boiler or utility application.
    It does not cover the determination of bulk density of coal in storage piles.
