abstract:
- language: en
  script: Latn
  content: This document specifies the general functional and performance requirements
    for motion capture (MOCAP) systems for Humanoid Animation (HAnim) supporting virtual
    reality (VR) applications. This document is applicable to the development and
    testing of human motion capture (MOCAP) systems for virtual reality applications
    in film, television, games, and medicine. The general requirement includes optical-based
    and wearable-based approaches.
