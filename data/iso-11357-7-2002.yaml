- language: en
  script: Latn
  content: This part of ISO 11357 specifies two methods, isothermal and non-isothermal,
    for studying the crystallization kinetics of partially crystalline polymers using
    differential scanning calorimetry (DSC). It is only applicable to melted polymers.
