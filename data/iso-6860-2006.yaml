abstract:
- language: en
  script: Latn
  content: ISO 6860:2006 describes an empirical test procedure for assessing the resistance
    of a coating of paint, varnish or related product to cracking and/or detachment
    from a metal substrate when subjected to bending around a conical mandrel under
    standard conditions. For a multi-coat system, each coat may be tested separately
    or the complete system may be tested.
