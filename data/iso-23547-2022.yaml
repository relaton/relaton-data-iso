abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of solid, liquid or gas sources
    of gamma emitting radionuclides used as reference measurement standards for the
    calibration of gamma-ray spectrometers. These reference measurement standards
    are traceable to national measurement standards. This document does not describe
    the procedures involved in the use of these reference measurement standards for
    the calibration of gamma-ray spectrometers. Such procedures are specified in ISO 20042
    and other documents. This document specifies recommended reference radiations
    for the calibration of gamma-ray spectrometers. This document covers, but is not
    restricted to, gamma emitters which emit photons in the energy range of 60 keV
    to 1 836 keV. These reference radiations are realized in the form of point sources
    or adequately extended sources specified in terms of activity which are traceable
    to national standards. Liquid standards that are intended to be used for preparing
    extended standards by the laboratories are also within the scope of this document.
    Reference materials (RMs) produced in accordance with ISO 17034 are out of scope
    of this document.
