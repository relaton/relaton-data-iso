abstract:
- language: en
  script: Latn
  content: ISO 8820-2:2014 gives guidance for the choice and application of automotive
    fuse-links which are defined in the other parts of the ISO 8820 series. It describes
    the various parameters which have to be taken into account when selecting fuse-links.
    Fuse-links according to ISO 8820 are intended for electrical cable protection.
    If these types of fuse-links are to be used for electrical component protection,
    it should be agreed between customer and supplier. ISO 8820-2:2014 is intended
    to be used in conjunction with the other parts of ISO 8820.
