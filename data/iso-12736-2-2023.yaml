abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for project specific product and
    process qualification of wet thermal insulation systems applied to pipelines in
    a factory setting and subsea equipment in the oil and gas industries. This document
    is not applicable to: —     pre-fabricated insulation; —     thermal insulation
    in the annulus of a steel pipe-in-pipe system; —     maintenance works on existing
    installed wet thermal insulation systems; —     project qualification of anticorrosion
    coatings or the requirements for application thereof.'
