abstract:
- language: en
  script: Latn
  content: This document specifies the system of colour coding for flow rate identification
    of nozzles used on sprayers. It is applicable to hydraulic energy nozzles such
    as flat and cone nozzles used for the application of crop protection products.
    This document is not applicable to adjustable nozzles. It allows for flow recognition
    on small parts in order to avoid any confusion under normal conditions of use.
