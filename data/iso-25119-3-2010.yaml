abstract:
- language: en
  script: Latn
  content: ISO 25119-3:2010 provides general principles for the series development,
    hardware and software of safety-related parts of control systems (SRP/CS) on tractors
    used in agriculture and forestry, and on self-propelled ride-on machines and mounted,
    semi-mounted and trailed machines used in agriculture. It can also be applied
    to municipal equipment (e.g. street‑sweeping machines). It specifies the characteristics
    and categories required of SRP/CS for carrying out their safety functions. ISO
    25119-3:2010 is applicable to the safety-related parts of electrical/electronic/programmable
    electronic systems (E/E/PES). As these relate to mechatronic systems, it does
    not specify which safety functions or categories are to be used in a particular
    case. It is not applicable to non-E/E/PES systems (e.g. hydraulic, mechanic or
    pneumatic).
