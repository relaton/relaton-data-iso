abstract:
- language: en
  script: Latn
  content: 'This document establishes procedures for the analysis of failures that
    occur during the acceptance testing or operation of launch pad and integration
    site facilities, systems and equipment. The procedures define the processes for
    investigating, analysing and identifying the probable causes of failures, and
    for developing corrective actions to preclude future failures. This document provides:
    —     rules for investigating, analysing and identifying the causes of failures;
    —     sufficient information so that corrective action can be implemented to prevent
    failure recurrence; —     a uniform method for maintaining records of the findings
    of all failure causes so as to provide information for other failure investigations.
    This document applies to launch pad and integration sites used for the launch
    of launch vehicle with spacecraft for public and commercial purposes.'
