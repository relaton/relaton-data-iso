abstract:
- language: en
  script: Latn
  content: ISO 13041-2:2008 specifies, with reference to ISO 230-1 and ISO 230-7,
    the geometric tests on general purpose numerically controlled (NC) turning machines
    and tuning centres with vertical workholding spindles, as well as the corresponding
    applicable tolerances. ISO 13041-2:2008 explains different concepts or configurations
    and common features of NC turning machines and turning centres with vertical workholding
    spindles. It also provides a terminology and designation of controlled axes.
