abstract:
- language: en
  script: Latn
  content: ISO 23537-2:2016 specifies the fabric and material properties as well as
    provisions for labelling of adult sized sleeping bags for use in sports and leisure
    time activities. Thermal and dimensional requirements are specified in ISO 23537‑1.
    ISO 23537-2:2016 does not apply to sleeping bags intended for specific purpose
    such as military use and extreme climate zone expedition. It does not apply to
    sleeping bags for children or babies. NOTE No prediction model exists for the
    determination of the limiting temperatures based on the thermal resistance of
    the sleeping bag for children and babies. Moreover, such a model for testing cannot
    be developed because the necessary controlled sleep trials with children or babies
    in climatic chambers are, out of ethical reasons, not permitted.
