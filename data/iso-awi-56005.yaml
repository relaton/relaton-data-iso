abstract:
- language: en
  script: Latn
  content: 'Efficient management of IP is key to support the process of innovation, is essential for organizations'' growth and protection, and is their engine for competitiveness. This document proposes guidelines for supporting the role of IP within innovation management. It aims to address the following issues concerning IP management at strategic and operational levels: — Creating an IP strategy to support innovation in an organization; — Establishing systematic IP management within the innovation processes; — Applying consistent IP tools and methods in support of efficient IP management. This document can be used for any type of innovation activities and initiatives.'
