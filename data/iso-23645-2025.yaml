abstract:
- language: en
  script: Latn
  content: 'This document specifies safety requirements and test methods for baby
    walking frames into which a child is placed, and which are intended to be used
    from when the child is able to sit up unaided (around six months), until the child
    is able to walk independently or weighs more than 12 kg. This document does not
    apply to: —     baby walking frames: —    for therapeutic and curative purposes;
    —    that rely on inflatable parts to support the child; —     toys (e.g. ride
    on toys and push-along toys usually intended for children able to walk unaided).
    If a baby walking frame has several functions or can be converted into another
    function, then the relevant International Standards apply to it. For example,
    if a baby walking frame is equipped with toys, the requirements of the ISO 8124
    series apply to the toys.'
