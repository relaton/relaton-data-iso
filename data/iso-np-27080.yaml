abstract:
- language: en
  script: Latn
  content: This document specifies the measurement methods for noise of large uncrewed vertical take-off and landing (VTOL) aircraft, and is applicable to the noise testing of large uncrewed aircraft with vertical take-off and landing capability (with a Maximum Take-Off Mass (MTOM) greater than 150 kg, level V according to ISO 21895), including multi-rotor, compound wing and tiltrotor aircraft. The methods specified in this documnet include the outdoor environmental measurement of aircraft noise and the aeroacoustic wind tunnel measurement.
