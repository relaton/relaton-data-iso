abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of fatty acid methyl
    esters (FAMEs) derived by transesterification or esterification from fats, oils,
    and fatty acids by capillary gas chromatography (GLC). FAMEs from C4 to C24 can
    be separated using this document including saturated FAMEs, cis- and trans-monounsaturated
    FAMEs, and cis- and trans-polyunsaturated FAMEs. This document is applicable to
    crude, refined, partially hydrogenated or fully hydrogenated fats, oils and fatty
    acids derived from animal and vegetable sources, and fats extracted from foodstuff.
    This document does not apply to milk and milk products (or fat coming from milk
    and milk products) or products supplemented with conjugated linoleic acid (CLA).
    This document does not apply to di-, tri-, polymerized, hydroxylated and oxidized
    fatty acids, and fats and oils. A method for the determination of the composition
    of FAMEs expressed by area % in liquid vegetable oils is proposed in Annex E.
