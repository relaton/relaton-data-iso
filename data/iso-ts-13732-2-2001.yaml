abstract:
- language: en
  script: Latn
  content: This part of ISO/TS 13732 presents principles and methods for predicting
    the thermal sensation and degree of discomfort for people where parts of the body
    are in contact with solid surfaces at moderate surface temperatures (approximately
    10 °C to 40 °C). It deals with the thermal sensation for contacts of the hand,
    foot and for the sitting position on the floor.
