abstract:
- language: en
  script: Latn
  content: ISO 8178-5:2008 specifies fuels whose use is recommended for performing
    the exhaust emission test cycles given in ISO 8178-4 and ISO 8178-11. It is applicable
    to reciprocating internal combustion engines for mobile, transportable and stationary
    installations excluding engines for motor vehicles primarily designed for road
    use. It may be applied to engines used, e.g. earth-moving machines and generating
    sets, and for other applications.
