abstract:
- language: en
  script: Latn
  content: This document aims to provide guidelines for quantifying the Carbon Footprint
    of Products (CFP) for cement products based on life cycle thinking, with the goal
    of promoting environmental improvement within the cement-related industries. Specifically,
    this document covers the principles, requirements, and reporting related to the
    quantification of CFP for cement products, as well as carbon offsetting and the
    communication of CFP or partial CFP information as a single impact category. Additionally,
    this document describes Product Category Rules (PCR) for cement products, defining
    specific rules, requirements, and guidelines to reduce uncertainty.
