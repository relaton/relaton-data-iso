abstract:
- language: en
  script: Latn
  content: This document specifies the geometries and dimensions of projections for
    embossed projection welding. Tools to make the projections are also included in
    Annex B. The projections are used on hot-rolled, cold-rolled, uncoated and coated
    steels, stainless steels and nickel alloys for conventional welding quality up
    to 3 mm thickness, as single projections, in multiples or as a group of multiples.
    Any solid projections are not included in this document.
