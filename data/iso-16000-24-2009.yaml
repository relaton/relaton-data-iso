abstract:
- language: en
  script: Latn
  content: ISO 16000-24:2009 specifies a general laboratory test method for evaluating
    the reduction in concentration of volatile organic compounds (VOCs) (except formaldehyde)
    by sorptive building materials. This method applies to boards, wallpapers, carpets,
    paint products, and other building materials. The sorption of VOCs (except formaldehyde)
    can be brought about by adsorption, absorption and chemisorption. The performance
    of the material, with respect to its ability to reduce the concentration of VOCs
    (except formaldehyde) in indoor air, is evaluated by measuring sorption flux and
    saturation mass per area. The former directly indicates material performance with
    respect to VOC reduction at a point in time; the latter relates to the ability
    to maintain that performance. Formaldehyde has been excluded from ISO 16000-24:2009
    because it is difficult to obtain as a stable standard in air. ISO 16000-24:2009
    is based on the test chamber method specified in ISO 16000-9. Sampling, transport
    and storage of materials to be tested, and preparation of test specimens are described
    in ISO 16000-11. Air sampling and analytical methods for the determination of
    carbonyl compounds (except formaldehyde) are described in ISO 16000-3, and those
    of VOCs are described in ISO 16000-6 and ISO 16017-1.
