abstract:
- language: en
  script: Latn
  content: This document specifies a testing method designed for assessing the cleaning
    of household mould by using ultrafine bubble water. The process was thoroughly
    established using both ‘microscopic examination’ and ‘culturing and counting techniques’
    to evaluate the performance of the mould removal in domestic settings. It is applicable
    for a thorough assessment of the efficacy of household mould cleaning procedures.
    This method ensures a comprehensive evaluation of mould remediation efforts.　
