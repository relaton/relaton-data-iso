abstract:
- language: en
  script: Latn
  content: The document specifies an overall read range performance indicator and
    its associated measurement methods for radio frequency identification (RFID) enabled
    tyres described in ISO 20911 and tagged in ISO 20909. The ultra high frequency
    (UHF) RFID band used covers 860 to 930 MHz. Methods applying to passenger cars,
    light commercial and truck vehicles classes of tyres as defined in subclause 4.1.
    Methods described have not been investigated for tyres beyond tyre classes defined
    in subclause 4.1.
