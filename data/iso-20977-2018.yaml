abstract:
- language: en
  script: Latn
  content: This document specifies two methods for the determination of the particle
    size distribution of liming materials. Method A (the dry sieving method) is applicable
    to all liming materials except wet and paste-like products. Method A is not applicable
    if blinding, caking, electrostatic charges or agglomeration occur after drying.
    Method B (the wet sieving method) is applicable to products which are susceptible
    to blinding, caking, electrostatic charges or agglomeration after drying. Method
    B can be used to determine the primary particle size distribution of granulated
    products. Method B is not applicable to burnt lime and liming materials containing
    water-soluble constituents.
