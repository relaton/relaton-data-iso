abstract:
- language: en
  script: Latn
  content: ISO 23273-2:2006 specifies the essential requirements for fuel cell vehicles
    (FCV) with respect to the protection of persons and the environment inside and
    outside the vehicle against hydrogen related hazards. It applies only to such
    FCV where compressed hydrogen is used as fuel for the fuel cell system. ISO 23273-2:2006
    does not apply to manufacturing, maintenance and repair. The requirements of ISO
    23273-2:2006 address both normal operating (fault free) and single fault conditions
    of the vehicles.
