abstract:
- language: en
  script: Latn
  content: ISO 18275:2011 specifies requirements for classification of covered electrodes
    and deposited metal in the as-welded condition and in the post-weld heat-treated
    condition for manual metal arc welding of high-strength steels with a minimum
    yield strength greater than 500 MPa or a minimum tensile strength greater than
    570 MPa. ISO 18275:2011 is a combined specification providing a classification
    utilizing a system based upon the yield strength and an average impact energy
    of 47 J of the all-weld metal, or utilizing a system based upon the tensile strength
    and an average impact energy of 27 J of the all-weld metal. Subclauses and tables
    which carry the suffix letter "A" are applicable only to covered electrodes classified
    under the system based upon the yield strength and an average impact energy of
    47 J of the all-weld metal given in ISO 18275:2011. Subclauses and tables which
    carry the suffix letter "B" are applicable only to covered electrodes classified
    under the system based upon the tensile strength and an average impact energy
    of 27 J of the all-weld metal given in ISO 18275:2011. Subclauses and tables which
    do not have either the suffix letter "A" or the suffix letter "B" are applicable
    to all covered electrodes classified under ISO 18275:2011.
