abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements and performance test procedures
    for monostatic heterodyne continuous-wave (CW) Doppler lidar techniques and presents
    their advantages and limitations. The term "Doppler lidar" used in this document
    applies solely to monostatic heterodyne CW lidar systems retrieving wind measurements
    from the scattering of laser light by aerosols in the atmosphere. Performances
    and limits are described based on standard atmospheric conditions. This document
    describes the determination of the line-of-sight wind velocity (radial wind velocity).
    NOTE Derivation of wind vector from individual line-of-sight measurements is not
    described in this document since it is highly specific to a particular wind lidar
    configuration. One example of the retrieval of the wind vector can be found in
    ISO 28902-2:2017, Annex B. This document does not address the retrieval of the
    wind vector. This document can be used for the following application areas: —
    meteorological briefing for e.g. aviation, airport safety, marine applications,
    oil platforms; — wind power production, e.g. site assessment, power curve determination;
    — routine measurements of wind profiles at meteorological stations; — air pollution
    dispersion monitoring; — industrial risk management (direct data monitoring or
    by assimilation into micro-scale flow models); — exchange processes (greenhouse
    gas emissions). This document can be used by manufacturers of monostatic CW Doppler
    wind lidars as well as bodies testing and certifying their conformity. This document
    also provides recommendations for users to make adequate use of these instruments.'
