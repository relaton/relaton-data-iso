abstract:
- language: en
  script: Latn
  content: This document specifies the general rules for setting the time-base range
    and sensitivity (i.e. gain adjustment) of a manually operated ultrasonic instrument
    with A-scan display in order that reproducible determinations can be made of the
    location and echo height of a reflector. This document is applicable to contact
    techniques employing a single probe with either a single transducer or dual transducers.
    This document does not apply to the immersion technique and techniques employing
    more than one probe.
