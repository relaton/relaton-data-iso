abstract:
- language: en
  script: Latn
  content: ISO 15877-1:2003 specifies the general aspects of chlorinated poly(vinyl
    chloride) (PVC-C) piping systems intended to be used for hot and cold water installations,
    within buildings, for the conveyance of water which may or may not be intended
    for human consumption (domestic systems) or for heating systems, under design
    pressures and temperatures appropriate to the class of application. It covers
    a range of service conditions (classes of application), design pressures and pipe
    dimension classes. It also specifies the test parameters for the test methods
    referred to in the standard. In conjunction with the other parts of ISO 15877,
    it is applicable to PVC-C pipes, fittings and their joints, including joints with
    components of other plastics and non-plastics materials intended to be used for
    hot and cold water installations.
