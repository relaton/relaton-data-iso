abstract:
- language: en
  script: Latn
  content: This standard specifies a method to measure, compute and present specification
    parameters and characterization data for cameras and image sensors used for machine
    vision applications. The standard does not define what nature of data should be
    disclosed. This standard is intended to provide a concise definition and clear
    description of the measurement process and to benefit the vision industry by providing
    fast, comprehensive and consistent access to specification information for cameras
    and sensors. It wi ll be particularly beneficial for those who wish to compare
    cameras or who wish to calculate system performance based on the performance specifications
    of an image sensor or a camera.
