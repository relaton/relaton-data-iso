abstract:
- language: en
  script: Latn
  content: 'This document defines the architecture of electronic fee collection (EFC)
    system environments, in which a customer with one contract may use a vehicle in
    a variety of toll domains with a different toll charger for each domain. EFC systems
    conforming to this document can be used for various purposes including road (network)
    tolling, area tolling, collecting fees for the usage of bridges, tunnels, ferries,
    for access or for parking. From a technical point of view the considered toll
    systems may identify vehicles subject to tolling by means of electronic equipment
    on-board in a vehicle or by other means (e.g. automatic number plate recognition,
    ANPR). From a process point of view the architectural description focuses on toll
    determination, toll charging, and the associated enforcement measures. The actual
    collection of the toll, i.e. collecting payments, is outside of the scope of this
    document. The architecture in this document is defined with no more details than
    required for an overall overview, a common language, an identification of the
    need for and interactions among other standards, and the drafting of these standards.
    This document as a whole provides: — the enterprise view on the architecture,
    which is concerned with the purpose, scope and policies governing the activities
    of the specified system within the organization of which it is a part; — the terms
    and definitions for common use in an EFC environment; — a decomposition of the
    EFC systems environment into its main enterprise objects; — the roles and responsibilities
    of the main actors. This document does not impose that all roles perform all indicated
    responsibilities. It should also be clear that the responsibilities of a role
    may be shared between two or more actors. Mandating the performance of certain
    responsibilities is the task of standards derived from this architecture; — identification
    of the provided services by means of action diagrams that underline the needed
    standardised exchanges; — identification of the interoperability interfaces for
    EFC systems, in specialised standards (specified or to be specified).'
