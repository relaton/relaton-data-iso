abstract:
- language: en
  script: Latn
  content: ISO 24254:2007 specifies the requirements of lubricating engine oils (hereinafter
    referred to as “four-stroke engine oils”) to be used in four-stroke cycle spark
    ignition gasoline engines employing a common sump containing the lubricating oil
    for both the engine and associated drivetrain (transmission, clutch, starter)
    of motorcycles, motor scooters, all-terrain vehicles (ATVs) and related equipment.
    Classification of four-stroke engine oils is defined in ISO 6743-15. The performance
    requirements of four-stroke engine oils classified in all of the categories covered
    by ISO 6743-15, EMA and EMB, are embraced in this specification. ISO 24254:2007
    specifies the performance classification of four-stroke cycle gasoline engine
    oils, based on physical and chemical properties, and three friction performance
    indices, which are derived from the frictional properties of the lubricant, according
    to the JASO T904 test procedure.
