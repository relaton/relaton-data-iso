abstract:
- language: en
  script: Latn
  content: 'ISO/IEC 15459-2:2015 specifies the procedural requirements to maintain
    identities and outlines the obligations of the Registration Authority and Issuing
    Agencies. ISO/IEC 15459-2:2015 excludes those entities where ISO has designated
    Maintenance Agencies or Registration Authorities to provide identity and/or identifier
    schemes. It does not apply to: freight containers, because their unique coding
    is specified in ISO 6346, Freight containers - Coding, identification and marking;
    vehicles, because their unique identification is specified in ISO 3779, Road vehicles
    - Vehicle identification number (VIN) - Content and structure; car radios, because
    their unique identification is specified in ISO 10486, Passenger cars - Car radio
    identification number (CRIN). The exclusion also applies to ISO 2108, Information
    and documentation - International standard book number (ISBN), and ISO 3297, Information
    and documentation - International standard serial number (ISSN).'
