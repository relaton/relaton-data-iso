abstract:
- language: en
  script: Latn
  content: 'This document describes the general safety requirements and guidance for
    the electrical high-power interface (HPI) in the ISO 23316 series. The following
    topics are not within the scope of this document: —     service, maintenance,
    and related diagnostics; —     functional safety; —     control strategies for
    high power supply systems (PS) and load consumption systems; —     application-specific
    strategies and operational modes; —     component design; —     energy storage
    systems, e. g. supercapacitors or batteries; —     multiple electrical power supplies
    to a common DC-link.'
