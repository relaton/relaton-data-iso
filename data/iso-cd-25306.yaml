abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory test method for determining in a closed
    system the degree and rate of the aerobic biodegradation level of plastic materials,
    including those containing formulation additives. Biodegradation is determined
    by measuring the CO2 evolved from plastic materials when exposed in an aqueous
    medium to an inoculum from activated sludge under laboratory conditions. If an
    unadapted activated sludge is used as the inoculum, the test simulates the biodegradation
    processes which occur in a natural aqueous environment; if a mixed or pre-exposed
    inoculum is used, the method can be used to investigate the potential biodegradability
    of a test material. The conditions described in this document might not always
    correspond to the optimum conditions for the maximum degree of biodegradation,
    however this test method is designed to give an indication of the potential biodegradability
    of plastic materials. NOTE    This document addresses plastic materials but can
    also be used for other materials (e.g. natural and/or synthetical polymers, copolymers
    or mixtures thereof; plastic materials which contain additives such as plasticizers,
    colorants or other compounds; water-soluble polymers).
