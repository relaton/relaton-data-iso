abstract:
- language: en
  script: Latn
  content: This document specifies the general procedure for fibre furnish analysis
    of paper, board and pulps. It is applicable to all kinds of pulps and to most
    papers and boards, including those containing more than one kind of fibre, taking
    into account different pulping processes. This method is less suitable for heavily
    impregnated or highly coloured papers and boards, which cannot be dispersed or
    decoloured without affecting the structure or the staining reactions of the fibres.
