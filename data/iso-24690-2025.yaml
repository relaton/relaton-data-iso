abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the long-term pressure
    endurance of glass-reinforced thermosetting plastics (GRP) pipes, based on the
    residual failure strength of test pieces after ageing for a specified time at
    specified internal pressure and temperature. The internal environment is specified
    in the referring standard. The external environment can be air or water.
