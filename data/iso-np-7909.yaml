abstract:
- language: en
  script: Latn
  content: This International Standard applies to displays of optotypes by clinical
    visual acuity assessment systems that use recognition of high-contrast optotypes
    and that are designed for general use including optotypes printed on opaque media,
    those intended for transillumination, electronically generated or projected displays.
    It does not apply to systems designed for specialized testing of visual acuity,
    e.g. legal certifications of blindness, low vision or low contrast charts.
