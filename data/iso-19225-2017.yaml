abstract:
- language: en
  script: Latn
  content: ISO 19225:2017 specifies safety requirements to minimize the hazards listed
    in Clause 4 that can occur during the assembly, use, maintenance, repair, decommissioning,
    disassembly and disposal of shearer loaders and plough systems when used as intended
    and under conditions of misuse which are reasonably foreseeable by the manufacturer,
    in underground mining. ISO 19225:2017 does not cover any hazards resulting from
    explosive atmospheres. Requirements for explosive atmospheres can be found in
    ISO/IEC 80079‑38. ISO 19225:2017 is not applicable to machines that are manufactured
    before the date of its publication.
