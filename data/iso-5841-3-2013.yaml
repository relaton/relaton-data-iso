abstract:
- language: en
  script: Latn
  content: ISO 5841-3:2013 specifies a connector assembly to be used to connect implantable
    pacemaker leads to implantable pacemaker pulse generators. Essential dimensions
    and performance requirements related to connector fit are specified, together
    with appropriate test methods. ISO 5841-3:2013 is applicable only to the form
    and fit of the connector assembly. ISO 5841-3:2013 supplements ISO 14708‑2 only
    for those pacemaker components which are claimed by their labelling to be fitted
    with an IS-1 connector assembly part.
