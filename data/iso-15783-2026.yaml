abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for seal-less rotodynamic pumps
    that are driven with permanent magnet coupling (magnet drive pumps) or with canned
    motor, and which are mainly used in chemical processes, water treatment and petrochemical
    industries. Their use can be dictated by space, noise, environment or safety regulations.
    Seal-less pumps are pumps where an inner rotor is completely contained in a pressure
    vessel holding the pumped fluid. The pressure vessel or primary containment device
    is sealed by static seals such as gaskets or O-rings. Pumps normally conform to
    recognized standard specifications (e.g. ISO 5199, explosion protection, electromagnetic
    compatibility), except where special requirements are specified herein. This document
    includes design features concerned with installation, maintenance and operational
    safety of the pumps, and defines those items to be agreed upon between the purchaser
    and manufacturer/supplier. Where conformity to this document has been requested
    and calls for a specific design feature, alternative designs can be offered providing
    that they satisfy the intent of this document and they are described in detail.
    Pumps which do not conform with all requirements of this document can also be
    offered providing that the deviations are fully identified and described. Whenever
    documents include contradictory requirements, they are applied in the following
    sequence of priority: purchase order (or inquiry, if no order placed), see Annexes C
    and D; data sheet (see Annex A) or technical sheet or specification; this document;
    other standards.'
