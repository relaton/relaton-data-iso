abstract:
- language: en
  script: Latn
  content: Defines single-number quantities for the impact sound insulation in buildings
    and of floors. Gives rules for determining these quantities from the results of
    measurements carried out in one-third-octave bands in accordance with ISO 140-6
    and ISO 140-7, and in octave bands in accordance with ISO-140-7 for field measurements
    only. It also contains quantities for the impact sound reduction of floor coverings.
