abstract:
- language: en
  script: Latn
  content: ISO 16355-1:2015 describes the quality function deployment (QFD) process,
    its purpose, users, and tools. It is not a management system standard. It does
    not provide requirements or guidelines for organizations to develop and systematically
    manage their policies, processes, and procedures in order to achieve specific
    objectives. Users of ISO 16355-1:2015 will include all organization functions
    necessary to assure customer satisfaction, including business planning, marketing,
    sales, research and development (R&D), engineering, information technology (IT),
    manufacturing, procurement, quality, production, service, packaging and logistics,
    support, testing, regulatory, and other phases in hardware, software, service,
    and system organizations.
