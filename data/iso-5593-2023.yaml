abstract:
- language: en
  script: Latn
  content: 'This document defines terms applied in the field of rolling bearings and
    their technology. This document includes terms related to all types of rolling
    bearings wherein the principal degree of freedom is continuous rotation around
    an axis enabled by an ordered set of rolling elements between two circular raceways
    such that loads can be transmitted between them in a particular range of either
    radial or axial directions, or both. This document also includes accessories to
    these products. The following types of terms are not included: —    terms specified
    in ISO 76, ISO 281 and ISO 1132-1; —    terms which are narrowly applied in only
    one specialized rolling bearing International Standard.'
