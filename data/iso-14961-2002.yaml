abstract:
- language: en
  script: Latn
  content: ISO 14961:2002 specifies the requirements for a parameter value language
    (PVL) specification for space data and information transfer systems. It establishes
    a standard keyword value type language for naming and expressing data values and
    provides an overview and formal syntax specification of the PVL. Two versions
    of PVL are defined, the basic version (CCSD0006) and an extended character set
    version (CCSD0008). The specifications in this ISO 14961:2002 are applicable to
    all space-related science and engineering data exchanges where a keyword value
    language is desired.
