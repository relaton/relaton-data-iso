abstract:
- language: en
  script: Latn
  content: 'This document defines a three-dimensional H-point machine for use in the determination of the actual H-point and torso angle of a seat, for the purpose of comparing these measurements to the manufacturer''s seating reference point and design torso angle. The three-dimensional H-point machine is intended to be used as a checking device for one designated seat position at a time and is not a device which measures or indicates an occupant''s capabilities or comfort. This document is applicable to any motor vehicle where: the distance, vertically measured, between the operator heel point and the seating reference point is less than 550 mm, the torso angle is greater than 5° rearward of vertical or where the attitude of the thigh centreline as indicated by the thigh bar is greater than 5° above the horizontal.'
