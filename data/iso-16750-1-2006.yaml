abstract:
- language: en
  script: Latn
  content: ISO 16750-1:2006 applies to electric and electronic systems/components
    for vehicles. It describes the potential environmental stresses and specifies
    tests and requirements recommended for the specific mounting location on/in the
    vehicle. ISO 16750-1:2006 contains definitions and general notes. Electromagnetic
    compatibility (EMC) is not covered by ISO 16750.
