abstract:
- language: en
  script: Latn
  content: This document specifies the classification, designs, requirements and test
    methods of the offshore gangway system (hereinafter referred to as "gangway system").
    This document is applicable to the gangway systems used on ships and offshore
    installations. a) ship to ship; b) ship to offshore floating installation; c)
    ship to fixed offshore installation; d) ship to dock; and e) offshore floating
    installation to ship.
