abstract:
- language: en
  script: Latn
  content: 'This standard specifies requirements and standardized procedures for the
    interpretation, design, construction, installation, and performance verification
    of Shaft Power Limitation (SHaPoLi) systems installed on ships, in order to ensure
    consistent implementation and reliable compliance with international energy efficiency
    regulations. This document applies to independent monitoring and alarm-type SHaPoLi
    systems that do not directly intervene in the engine control system. It covers
    the following aspects of SHaPoLi systems: — Interpretation and calculation procedures
    for shaft power limitation; — Design and construction requirements for SHaPoLi
    equipment; — Installation requirements to ensure safety, reproducibility, and
    interoperability; — Functional performance tests, including limitation accuracy
    and response verification; — Reliability and durability tests under representative
    operating conditions; — Procedures for verification and certification in accordance
    with IMO regulatory frameworks. This document is applicable to SHaPoLi systems
    intended for ships of 400 gross tonnage and above engaged in international voyages.
    This document does not cover: — SHaPoLi systems designed to directly control or
    limit engine output by integration with the engine control system, — detailed
    engineering design methods of propulsion machinery and auxiliary equipment, —
    regulatory calculation methods already prescribed in IMO conventions and guidelines.'
