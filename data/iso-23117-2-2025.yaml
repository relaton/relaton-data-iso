abstract:
- language: en
  script: Latn
  content: This document specifies field measurements of spray deposition to determine
    the quantity and distribution of spray in a plane surface area in the transverse
    direction to the flight direction, treated by specific Unmanned Agricultural Aerial
    Sprayer (UAAS) with downward directed application. These field measurements can
    be used to determine the effective swath width of UAAS. This document is not appropriate
    for evaluating spray deposition within a crop canopy (three-dimensional deposition).
    It is not appropriate for those spraying systems which rely on the presence of
    a crop canopy for efficient spray deposition (for example directed spraying, electrostatic
    charged spraying, very fine sprays).
