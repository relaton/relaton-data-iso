abstract:
- language: en
  script: Latn
  content: ISO 51205:2009 applies to the procedures for preparation, testing, and
    using the ceric-cerous sulfate dosimetry system to determine absorbed dose (in
    terms of absorbed dose to water) in materials irradiated by photons (gamma radiation
    or X-radiation/bremsstrahlung) or high-energy electrons. The system consists of
    a dosimeter and appropriate analytical instrumentation. The system is classified
    as a reference–standard dosimetry system but can also be used as a transfer–standard
    dosimeter or a routine dosimeter.
