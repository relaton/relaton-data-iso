abstract:
- language: en
  script: Latn
  content: 'This document specifies: the overall description of the modelling approach;
    the overall description of the ISO 20022 Repository (hereby referred to as Repository)
    contents; a high-level description of the input to be accepted by the Registration
    Authority to feed/modify the Repository’s DataDictionary and BusinessProcessCatalogue;
    a high-level description of the Repository output to be made publicly available
    by the Registration Authority. BusinessTransactions and MessageSets Conforming
    with ISO 20022 series can be used for electronic data interchange amongst any
    industry participants (financial and others), independently of any specific communication
    network. Network-dependent rules, such as message acknowledgement and message
    protection, are beyond the scope of the ISO 20022 series.'
