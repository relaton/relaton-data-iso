abstract:
- language: en
  script: Latn
  content: "​​This standard specifies the icing wind tunnel test methods for anti-icing
    and de-icing systems of large fixed-wing uncrewed aircraft, applicable to the
    Category VI large fixed-wing UAVs as defined in ISO 21895:2020. It covers the
    selection of test conditions, model design, data acquisition, and the evaluation
    methods for anti-icing and de-icing capabilities related to the intake lip, wings,
    and empennage of large fixed-wing uncrewed aircraft.​"
