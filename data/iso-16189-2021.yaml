abstract:
- language: en
  script: Latn
  content: This document specifies a method to determine the amounts of dimethylformamide
    (DMF) in footwear and footwear components containing polyurethane (PU) coated
    material. NOTE 1   In the footwear industry, when PU is injected (reaction moulded),
    this process does not require the use of DMF. For PU coated material, the use
    of DMF is possible. NOTE 2   Several abbreviations can be used for dimethylformamide
    DMF, DMFa, DMFo. This document uses DMF. ISO/TR 16178:2021, Table 1 defines which
    materials are concerned by this determination.
