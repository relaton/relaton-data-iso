abstract:
- language: en
  script: Latn
  content: ISO 11143:2008 specifies requirements and test methods for amalgam separators
    used in connection with dental equipment in the dental treatment centre. It specifies
    the efficiency of the amalgam separators in terms of the level of retention of
    amalgam based on a laboratory test and the test procedure for determining this
    efficiency. It also includes requirements for the safe functioning of the amalgam
    separator, for marking, instructions for use, operation and maintenance. All tests
    described in ISO 11143:2008 are type tests.
