abstract:
- language: en
  script: Latn
  content: ISO 14104:2014 specifies procedures and requirements for the detection
    and classification of localized overheating on ground surfaces by chemical etch
    methods. The process described in ISO 14104:2014 is typically used on ground surfaces;
    however, it is also useful for the detection of surface anomalies resultING from
    post-heat treatment machining such as hard turning, milling, and edge breaking
    (deburring) processes. Surface metallurgical anomalies caused by carburization
    or decarburization are also readily detectable with this process.
