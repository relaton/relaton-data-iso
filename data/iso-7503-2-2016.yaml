abstract:
- language: en
  script: Latn
  content: ISO 7503 (all parts) and ISO 8769 are addressed to the people responsible
    for measuring the radioactivity present on solid surfaces. ISO 7503-2:2016 applies
    to the evaluation of contamination on surfaces in terms of activity per unit area
    by an indirect method of measurement. ISO 7503-2:2016 is applicable to well-defined
    surfaces, such as those of equipment and facilities, containers of radioactive
    materials, sealed sources and buildings or land. ISO 7503-2:2016 can be used for
    laboratory and equipment/installation control and for remediation and monitoring
    activities to comply with release criteria. ISO 7503-2:2016 also refers to institutions/authorities
    controlling nuclear material transports or material/equipment clearance according
    to national legislation guideline values or international convention limits. ISO
    7503-2:2016 does not apply to contamination of the skin, clothing or loose material,
    such as gravel. NOTE Direct evaluation of surface contamination from alpha-emitters,
    beta-emitters and photon emitters is dealt with in ISO 7503-1. The calibration
    of instruments for the evaluation of radioactive surface contaminations is dealt
    with in ISO 7503-3.
