abstract:
- language: en
  script: Latn
  content: ISO 1136:2015 specifies a method for the determination of the mean diameter
    of wool fibres, using an apparatus which passes a current of air through a bundle
    of fibres. This International Standard is applicable to clean, unmedullated wool
    fibres dispersed in a uniform, open state. It provides a method particularly suitable
    for combed slivers. The dichloromethane extractable matter content of the specimen
    must not exceed 1,0 %. It is applicable to oil-combed slivers after cleaning with
    an organic solvent. The method described in this International Standard is less
    accurate for lambswool and for wool which is appreciably medullated (see Annex
    D) and heavily dyed wool.
