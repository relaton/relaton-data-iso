abstract:
- language: en
  script: Latn
  content: This document provides guidance for information security controls, based
    on ISO/IEC 27002, applicable to the provision and use of cloud services.  This
    document provides： —  additional guidance for relevant controls specified in ISO/IEC
    27002:2022; —  additional controls with guidance that specifically relate to cloud
    services. This document provides controls and guidance for CSCs and CSPs. This
    document is considered to be a horizontal document as it provides a foundation
    and a common understanding of security regarding the provision and use of cloud
    services.  This document applies to all types of cloud deployment models including
    the private cloud. When applying this document to the private cloud, the controls
    and guidance of this document are applicable, although adjustments can be necessary
    to adapt to the relationships and abilities of an organization’s internal departments.”
