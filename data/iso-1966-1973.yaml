abstract:
- language: en
  script: Latn
  content: Describes the design requirements and tests for the crimping of insulated
    and non-insulated terminations to general purpose cables, with conductors of copper,
    copper alloy, aluminium or aluminium alloy, in locations in which the stabilized
    conductor temperature does not exceed the values specified for the relevant type,
    i. e. 105 °C, 190 °C or 260 °C. The type of cable with which the terminations
    are intended to be made has to be declared.
