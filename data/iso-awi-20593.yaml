abstract:
- language: en
  script: Latn
  content: ISO/TS 20593:2017 specifies a method for the determination of the airborne
    concentration (μg/m3), mass concentration (μg/g) and mass fraction (%) of tyre
    and road wear particles (TRWP) in ambient particulate matter (PM) samples. ISO/TS
    20593:2017 establishes principles for air sample collection, the generation of
    pyrolysis fragments from the sample, and the quantification of the generated polymer
    fragments. The quantified polymer mass is used to calculate the fraction of tyre
    tread in PM and concentration of tyre tread in air. These quantities are expressed
    on a TRWP basis, which includes the mass of tyre tread and mass of road wear encrustations,
    and can also be expressed on a tyre rubber polymer or tyre tread basis. Air sample
    collection is on quartz fibre filters with size-selective input in a range of
    PM2,5 or PM10. The method is suitable for the determination of TRWP in indoor
    or outdoor atmospheres.
