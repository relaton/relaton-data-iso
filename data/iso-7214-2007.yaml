abstract:
- language: en
  script: Latn
  content: ISO 7214:2007 specifies methods for testing flexible and semi-rigid cellular
    plastics made from polyethylene. Cellular plastics containing copolymers of ethylene
    or blends of polymers with polyethylene may also be tested by the procedures of
    this International Standard provided these materials have characteristics similar
    to polyethylene or copolymers of ethylene. The tests are divided into mandatory
    tests suitable for characterization of cellular polyethylene regardless of end
    use, and optional tests for the determination of properties that are relevant
    to certain uses only.
