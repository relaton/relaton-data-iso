abstract:
- language: en
  script: Latn
  content: This document specifies the compositional ranges of a series of filler
    metals used for brazing. The filler metals are divided into seven classes, related
    to their composition but not necessarily to the major element present. NOTE 1       
    For the major element(s) present, see Annex A. In the case of composite products,
    such as flux-coated rods, pastes or plastics tapes, this document covers only
    the filler metal that forms parts of such products. The melting temperatures given
    in the tables are only approximate, as they necessarily vary within the compositional
    range of the filler metal. Therefore, they are given only for information. Technical
    delivery conditions are given for brazing filler metals and products containing
    brazing filler metals with other constituents such as flux and/or binders. NOTE 2       
    For some applications, such as precious metal jewellery, aerospace and dental,
    filler metals other than those included in this document are often used. These
    are covered by other International Standards to which reference can be made.
