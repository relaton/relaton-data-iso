abstract:
- language: en
  script: Latn
  content: ISO 14183:2005 specifies a high-performance liquid chromatographic (HPLC)
    method for the determination of the monensin, narasin and salinomycin contents
    of animal feeding stuffs, supplements (dry and liquid) and mineral premixtures.
    The method is not applicable to drug premixes (pharmaceutical products). Lasalocid
    and semduramicin cannot be determined by this method. The limit of quantitation
    is approximately 1 mg/kg, 2 mg/kg and 2 mg/kg for monensin, salinomycin and narasin,
    respectively. A lower limit of quantitation can be achievable but this is to be
    validated by the user.
