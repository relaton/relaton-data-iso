abstract:
- language: en
  script: Latn
  content: This document applies to the basic safety and essential performance of
    a humidifier, also hereafter referred to as ME equipment, in combination with
    its accessories, the combination also hereafter referred to as ME system. This
    document is also applicable to those accessories intended by their manufacturer
    to be connected to a humidifier where the characteristics of those accessories
    can affect the basic safety or essential performance of the humidifier. EXAMPLE 1          
    Heated breathing tubes (heated-wire breathing tubes) or ME equipment intended
    to control these heated breathing tubes (heated breathing tube controllers). NOTE 2       
    Heated breathing tubes and their controllers are ME equipment and are subject
    to the requirements of IEC 60601‑1. NOTE 3        ISO 5367 specifies other safety
    and performance requirements for breathing tubes. This document includes requirements
    for the different medical uses of humidification, such as invasive ventilation,
    non-invasive ventilation, nasal high-flow therapy, and obstructive sleep apnoea
    therapy, as well as humidification therapy for tracheostomy patients. NOTE 4       
    A humidifier can be integrated into other equipment. When this is the case, the
    requirements of the other equipment also apply to the humidifier. EXAMPLE 2          
    Heated humidifier incorporated into a critical care ventilator where ISO 80601‑2-12
    also applies. EXAMPLE 3           Heated humidifier incorporated into a homecare
    ventilator for dependent patients where ISO 80601‑2‑72 also applies. EXAMPLE 4          
    Heated humidifier incorporated into sleep apnoea therapy equipment where ISO 80601‑2‑70
    also applies. EXAMPLE 5           Heated humidifier incorporated into ventilatory
    support equipment where either ISO 80601-2-79 or ISO 80601-2-80 also apply. EXAMPLE 6          
    Heated humidifier incorporated into respiratory high-flow therapy equipment where
    ISO 80601‑2‑90 also applies. This document also includes requirements for an active HME
    (heat and moisture exchanger), ME equipment which actively adds heat and moisture
    to increase the humidity level of the gas delivered from the HME to the patient.
    This document is not applicable to a passive HME, which returns a portion of the
    expired moisture and heat of the patient to the respiratory tract during inspiration
    without adding heat or moisture. NOTE 5        ISO 9360‑1 and ISO 9360‑2 specify
    safety and performance requirements for a passive HME. NOTE 6        If a clause
    or subclause is specifically intended to be applicable to ME equipment only, or
    to ME systems only, the title and content of that clause or subclause will say
    so. If that is not the case, the clause or subclause applies both to ME equipment
    and to ME systems, as relevant. Hazards inherent in the intended physiological
    function of ME equipment or ME systems within the scope of this document are not
    covered by specific requirements in this document except in IEC 60601‑1:2005+AMD1:2012+AMD2:2020,
    7.2.13 and 8.4.1. NOTE 7        Additional information can be found in IEC 60601‑1:2005+AMD1:2012+AMD2:2020,
    4.2. This document does not specify the requirements for cold pass-over or cold
    bubble-through humidification devices, the requirements for which are given in
    ISO 20789. This document is not applicable to equipment commonly referred to as
    “room humidifiers” or humidifiers used in heating, ventilation and air conditioning
    systems, or humidifiers incorporated into infant incubators to humidify the chamber
    air (i.e., are not directly connected to the patient). This document is not applicable
    to nebulizers used for the delivery of a drug to patients. NOTE 8        ISO 27427
    specifies the safety and performance requirements for nebulizers.
