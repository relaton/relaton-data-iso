abstract:
- language: en
  script: Latn
  content: This standard proposal outlines artificial intelligence (AI) concepts,
    applications, and implications, as well as benefits, risks, governance framework,
    and scope for use by organizations within the context of project, programme, and
    portfolio management (P3M). This proposed standard is intended to supplement the
    other TC 258 standards and is in direct alignment with standards prepared by ISO/TC
    258. This document provides guidance for organizations on what to consider when
    adopting or looking to improve on existing AI technologies that directly support
    P3M. This proposed standard is applicable to any organization, including public,
    private, and charitable, as well as to any type of project, regardless of purpose,
    delivery approaches, project or programme lifecycle model used, complexity, size,
    cost, or duration. This document also provides (P3M) practitioners (including
    top-level management, project managers, PMO’s, etc.) with AI-related guidance
    and consideration in the areas of security, privacy, transparency, and bias, as
    well as related data governance, ethical and risk considerations.
