abstract:
- language: en
  script: Latn
  content: ISO/ASTM 52628:2013 describes the basic requirements that apply when making
    absorbed dose measurements in accordance with the ASTM E61 series of dosimetry
    standards. In addition, it provides guidance on the selection of dosimetry systems
    and directs the user to other standards that provide specific information on individual
    dosimetry systems, calibration methods, uncertainty estimation and radiation processing
    applications. ISO/ASTM 52628:2013 applies to dosimetry for radiation processing
    applications using electrons or photons (gamma- or X-radiation). ISO/ASTM 52628:2013
    addresses the minimum requirements of a measurement management system, but does
    not include general quality system requirements.
