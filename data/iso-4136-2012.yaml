abstract:
- language: en
  script: Latn
  content: ISO 4136:2012 specifies the sizes of test specimen and the procedure for
    carrying out transverse tensile tests in order to determine the tensile strength
    and the location of fracture of a welded butt joint. ISO 4136:2012 applies to
    metallic materials in all forms of product with joints made by any fusion welding
    process. Unless otherwise specified for specific points in ISO 4136:2012, the
    general principles of ISO 6892-1 and ISO 6892-2 apply.
