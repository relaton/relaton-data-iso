abstract:
- language: en
  script: Latn
  content: This document specifies a test method for determining the purities and
    organic impurities of low carbon aliphatic amines by gas chromatography. This
    document is applicable to monoethylamine, diethylamine, triethylamine, isopropylamine,
    diisopropylamine, n-propylamine, di-n-propylamine, tri-n-propylamine, n-butylamine,
    di-n-butylamine, tri-n-butylamine, diisobutylamine, monobutylamine and di-sec-butylaminethe
    manufactured by amination of the corresponding alcohols, and isopropylamine, diisopropylamine,
    monobutylamine and di-sec-butylamine manufactured by ammoniation and hydrogenation
    of ketones. The limit of quantitation for impurities is 0.01% (mass fraction).
