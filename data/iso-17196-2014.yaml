abstract:
- language: en
  script: Latn
  content: ISO 17196:2014 specifies a procedure of test for methanol, CO, CO2, methyl
    formate, ethyl methyl ether, and hydrocarbons up to C4, in DME used as fuel by
    the gas chromatography method. This procedure is applicable to determine the amount
    of methanol, CO, CO2, methyl formate, ethyl methyl ether, and hydrocarbons up
    to C4, up to the value specified in ISO 16861. NOTE The precision of this method
    has been studied for a limited set of samples and content levels by a limited
    number of labs. It allows establishment of a quality specification of DME but
    cannot be considered as a full precision determination in line with the usual
    statistical methodology as in ISO 4259.
