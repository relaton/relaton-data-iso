abstract:
- language: en
  script: Latn
  content: 'This document specifies rules for the preparation of samples of milk and
    milk products and their suspensions for microbiological examination when the samples
    require a different preparation from the general methods specified in ISO 6887-1.
    This document excludes the preparation of samples for both enumeration and detection
    test methods where preparation details are specified in the relevant International
    Standards. This document is intended to be used in conjunction with ISO 6887-1.
    This document is applicable to: a) milk and liquid milk products; b) dehydrated
    milk products; c) cheese and cheese products; d) casein and caseinates; e) butter;
    f) milk-based ice-cream; g) milk-based custard, desserts and sweet cream; h) fermented
    milks, yogurt, probiotics milk products and sour cream; i) dehydrated milk-based
    infant foods, with or without probiotics.'
