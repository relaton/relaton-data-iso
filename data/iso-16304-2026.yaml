abstract:
- language: en
  script: Latn
  content: 'This document provides requirements and guidance on the provision, arrangement, operation, management, use and design of port waste reception facilities (PRFs). In doing so, it provides a method for addressing ship-generated waste, cargo residues and operational residues at ports when the waste and residues are offloaded from the ship. This document addresses principles and issues on: the development of a port waste management strategy; the design and operation of PRF; PWMP development, implementation and compliance; and PRF management and accountability. This document is designed to be used by ports and terminals with existing PRFs that aim to refine their systems. It can also be used by new ports and terminals that are developing PRFs. This document has been designed to be used by ports and terminals of any size. It does not give specifics on the size or location of a PRF in each port, but provides a list of principles to be considered and applied to any size of type of port or terminal (e.g. marina, fishing port, container terminal, oil terminal, roll on/roll off terminal, cruise terminal, ferry terminal, bulk or general cargo terminal, ship repair or recycling facility, and offshore terminal). NOTE            For inland ports and marinas and those ports that have entered regional arrangements for the provision of a PRF for inland operated vessels, refer to ISO 24146-2.'
