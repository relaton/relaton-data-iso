abstract:
- language: en
  script: Latn
  content: This document comprehensively examines information grounded in International
    Standards applicable to uncrewed aircraft system (UAS) traffic management (UTM)
    systems and the operational frameworks for UTM systems across various countries.
    It systematically catalogues the current entities involved in UTM systems, including
    the actors, services, functions and data. Additionally, it delineates the safety,
    security and quality specifications for these services, focusing on data management
    and referring, where appropriate, to standards developed by other standard development
    organizations (SDOs).
