abstract:
- language: en
  script: Latn
  content: This document specifies the preparation of test pieces and specimens for
    all-weld metal tests in steel, nickel and nickel alloys. The test pieces and specimens
    are used to determine the mechanical properties of all-weld metal where required
    by consumable classification standards or for other purposes, in arc welding of
    steel, nickel and nickel alloys. This document is not applicable to single- or
    two-run welding or fillet welding. For these cases, ISO 15792‑2 and ISO 15792‑3
    apply.
