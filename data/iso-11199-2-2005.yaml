abstract:
- language: en
  script: Latn
  content: ISO 11199-2:2005 specifies requirements and methods of testing the static
    stability braking capabilities, static strength and fatigue of rollators being
    used as walking aids with wheels, manipulated by the hands, without accessories,
    unless specified in the particular test procedure. ISO 11199-2:2005 also gives
    requirements relating to safety, ergonomics, performance, and information supplied
    by the manufacturer including marking and labelling. The requirements and tests
    are based on every-day usage of rollators as walking aids, for a maximum user
    mass as specified by the manufacturer. ISO 11199-2:2005 includes rollators specified
    for a user mass of no less than 35 kg. ISO 11199-2:2005 is not applicable to rollators
    with horizontal forearm supports, classified as walking tables, for which ISO
    11199-3 is applicable.
