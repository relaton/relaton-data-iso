abstract:
- language: en
  script: Latn
  content: This document specifies a detection method for (cannabidiolic acid (CBDA),
    cannabidiol (CBD), cannabinol (CBN), Δ9-tetrahydrocannabinol (THC), tetrahydrocannabinolic
    acid (THCA)) in hemp seed oil based on high performance liquid chromatography
    with ultraviolet detection (HPLC-UV). The application range runs from 5,0 mg/100
    g (limit of quantification) to 500 mg/100 g expressed in hemp seed oil as consumed.
