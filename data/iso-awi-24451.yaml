abstract:
- language: en
  script: Latn
  content: This document specifies a procedure for the qualitative evaluation of the
    adhesion of carbon coatings and other hard coatings with up to 10 µm thickness,
    using a diamond indenter used for Rockwell hardness testing to produce an indentation.
    The indentations are generated with a Rockwell hardness tester. Amorphous carbon
    coatings according to ISO 20523 as well as coating systems, where a carbon based
    coating is the essential part, are considered. This document does not apply to
    ceramic hard coatings. The procedure described in this document also allows to
    detect cohesive failure.
