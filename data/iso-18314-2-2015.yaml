abstract:
- language: en
  script: Latn
  content: ISO 18314-2:2015 specifies the Saunderson correction for different measurement
    geometries and the solutions of the Kubelka-Munk equation for hiding and transparent
    layers. It also specifies methods for the calculations of the tinting strength
    including the residual colour difference with different criteria and of the hiding
    power. The procedures for preparing the samples for these measurements are not
    part of this part of ISO 18314. They are agreed between the contracting parties
    or are described in other national or International Standards.
