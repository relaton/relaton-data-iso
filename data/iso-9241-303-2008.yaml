abstract:
- language: en
  script: Latn
  content: 'ISO 9241-303:2008 establishes image-quality requirements, as well as providing
    guidelines, for electronic visual displays. These are given in the form of generic
    — independent of technology, task and environment — performance specifications
    and recommendations that will ensure effective and comfortable viewing conditions
    for users with normal or adjusted‑to‑normal eyesight. ISO 9241-303:2008 does not
    address issues of accessibility for people with disabilities. However, it does
    take into account aspects of the eyesight of older people and could be of value
    to people dealing with issues of visual impairment in certain cases: the specification
    of essential characteristics for normal viewing can be used to gauge the severity
    of different visual abnormalities so that appropriate solutions can be identified.'
