abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for a request for the verification
    and a request for data of an Authoritative Legal Entity Identifier (ALEI) formatted
    in accordance with ISO 8000-116 and the response to the request. The following
    are within the scope of this document: — terms related to authoritative legal
    entity identifiers and the data set used for verification — the syntax requirements
    for a request for the verification of an Authoritative Legal Entity Identifier
    (ALEI) formatted in accordance with ISO 8000-116 — the syntax requirements for
    the response to a request for the verification of an Authoritative Legal Entity
    Identifier (ALEI) formatted in accordance with ISO 8000-116 — the application
    interface protocol for the request for the verification of an Authoritative Legal
    Entity Identifier and response to a request for the verification of an Authoritative
    Legal Entity Identifier (ALEI) formatted in accordance with ISO 8000-116 — the
    syntax requirements for a request for data of an Authoritative Legal Entity Identifier
    (ALEI) formatted in accordance with ISO 8000-116 — the syntax requirements for
    the response to a request for data of an Authoritative Legal Entity Identifier
    (ALEI) formatted in accordance with ISO 8000-116 — the application interface protocol
    for the request for data of an Authoritative Legal Entity Identifier (ALEI) formatted
    in accordance with ISO 8000-116 and the response to a request for data of an Authoritative
    Legal Entity Identifier (ALEI) formatted in accordance with ISO 8000-116 The following
    are outside the scope of this document: — the methods used for the resolution
    of authoritative legal entity identifiers by the registrar that issued the ALEI'
