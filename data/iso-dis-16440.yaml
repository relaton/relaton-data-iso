abstract:
- language: en
  script: Latn
  content: ISO 16440:2016 specifies requirements, including corrosion protection,
    for the design, fabrication, installation and maintenance of steel-cased pipelines
    for pipeline transportation systems in the petroleum and natural gas industries
    in accordance with ISO 13623. NOTE 1 Steel casings can be used for mechanical
    protection of pipelines at crossings, such as at roads and railways and the installation
    of a casing at a highway, railway, or other crossing can be required by the permitting
    agency or pipeline operator. NOTE 2 This document does not imply that utilization
    of casings is mandatory or necessary. NOTE 3 This document does not imply that
    cased crossings, whether electrically isolated or electrically shorted, contribute
    to corrosion of a carrier pipe within a cased crossing. However, cased crossings
    can adversely affect the integrity of the carrier pipe by shielding cathodic protection
    (CP) current to the carrier pipe or reducing the CP effectiveness on the carrier
    pipe in the vicinity of the casing. Their use is not recommended unless required
    by load considerations, unstable soil conditions, or when their use is dictated
    by sound engineering practices.
