abstract:
- language: en
  script: Latn
  content: Recognizing the dissimilarity of various language standards, the objective
    of this Technical Report is to provide guidelines for the preparation of conformity
    clauses for processors and conformity clauses for programs in language standards,
    together with an annex containing a checklist to aid in this preparation. It was
    not considered practical to provide model statements that would be suitable for
    inclusion in all language standards. Therefore, examples have been given to illustrate
    the type of issues that should be addressed and it is anticipated that these will
    be adapted, where appropriate, for inclusion in a particular language standard.
    It should be borne in mind when reading this document that not all concepts will
    be applicable to all languages. As examples, language standards do not all specify
    subsets or permit extensions, and elements that are fully specified by one language
    standard may be dependent on the processor in another.
