abstract:
- language: en
  script: Latn
  content: This part of ISO 15792 specifies the preparation of test piece and specimens.
    The purpose is to determine mechanical properties of all-weld metal where required
    by the consumable classification standard or for other purposes, in arc welding
    of steel, nickel and nickel alloys. This part of ISO 15792 is not applicable to
    single- or two-pass welding or fillet welding. For these cases, ISO 15792-2 and
    ISO 15792-3 apply.
