abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements and recommendations for the site-specific
    assessment of mobile floating units for use in the petroleum and natural gas industries.
    It addresses the installed phase, at a specific site, of manned non-evacuated,
    manned evacuated and unmanned mobile floating units. This document addresses mobile
    floating units that are monohull (e.g. ship-shaped vessels or barges); column-stabilized,
    commonly referred to as semi-submersibles; or other hull forms (e.g. cylindrical/conical
    shaped). It is not applicable to tension leg platforms. Stationkeeping can be
    provided by a mooring system, a thruster assisted mooring system, or dynamic positioning.
    The function of the unit can be broad, including drilling, floatel, tender assist,
    etc. In situations where hydrocarbons are being produced, there can be additional
    requirements. This document does not address all site considerations, and certain
    specific locations can require additional assessment. This document is applicable
    only to mobile floating units that are structurally sound and adequately maintained,
    which is normally demonstrated through holding a valid RCS classification certificate.
    This document does not address design, transportation to and from site, or installation
    and removal from site. This document sets out the requirements for site-specific
    assessments, but generally relies on other documents to supply the details of
    how the assessments are to be undertaken. In general: — ISO 19901‑7 is referenced
    for the assessment of the stationkeeping system; — ISO 19904‑1 is referenced to
    determine the effects of the metocean actions on the unit; — ISO 19906 is referenced
    for arctic and cold regions; — the hull structure and air gap are assessed by
    use of a comparison between the site-specific metocean conditions and its design
    conditions, as set out in the RCS approved operations manual; — ISO 13624‑1 and
    ISO/TR 13624‑2[1] are referenced for the assessment of the marine drilling riser
    of mobile floating drilling units. Equivalent alternative methodologies can be
    used; — IMCA M 220 is referenced for developing an activity specific operating
    guidelines. Agreed alternative methodologies can be used. NOTE RCS rules and the
    IMO MODU code[13] provide guidance for design and general operation of mobile
    floating units.'
