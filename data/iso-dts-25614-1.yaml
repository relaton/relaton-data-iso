abstract:
- language: en
  script: Latn
  content: Define the data and operating functions required to orchestrate the use
    of spaces (spots, bays) for road vehicles to stop (stand) for the purpose of loading
    or unloading goods and passengers. The data and functions defined support space
    definition and vehicle requirements (demand), space-to-vehicle matching, scheduling,
    reservation, delays, rescheduling, cancellation, and queueing-in-motion. This
    is inclusive of all levels of vehicle automation—i.e., both uncrewed and crewed
    vehicles. It will be inclusive of any space that may be in demand for shared loading
    and unloading, curb-sides, parking lots, and both indoor and outdoor facilities,
    and of all spaces that admit shared use by more than one vehicle as described.
