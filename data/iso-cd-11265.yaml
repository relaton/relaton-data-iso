abstract:
- language: en
  script: Latn
  content: This document specifies an instrumental method for the routine determination
    of the specific electrical conductivity in an aqueous extract of soil, sludge,
    biowaste or waste. The determination is carried out to obtain an indication of
    the content of water-soluble electrolytes in a sample. This document is applicable
    to all types of air-dried samples of soil, sludge, biowaste and waste.
