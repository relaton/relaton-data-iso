abstract:
- language: en
  script: Latn
  content: This document specifies general requirements for (semi-)automated storage
    and retrieval equipment for biobanking, including their design, customization
    and installation, (semi-)automated storage and retrieval functions, performance,
    personnel, facility environment, operation and maintenance. This document specifies
    consumable and software systems for (semi-)automated storage and retrieval equipment
    for biobanking.  This document is applicable to manufacturers of (semi-)automated
    storage and retrieval equipment, as well as to biobanks that use or operate such
    equipment. This document is applicable to manufactures of consumables of (semi-)automated
    storage and retrieval equipment.
