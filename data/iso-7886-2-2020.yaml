abstract:
- language: en
  script: Latn
  content: This document specifies requirements for sterile single-use hypodermic
    syringes of nominal capacity 1 ml and above, made of plastic materials and intended
    for use with power-driven syringe pumps. This document does not apply to syringes
    with auto-disable syringe features (ISO 7886-3[2]), syringes for use with insulin
    (ISO 8537[3]), single-use syringes made of glass, syringes prefilled with the
    injection by the manufacturer and syringes supplied with the injection as a kit
    for filling by a pharmacist. It does not address compatibility with injection
    fluids.
