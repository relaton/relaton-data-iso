abstract:
- language: en
  script: Latn
  content: ISO/IEC 29341-13-11:2008(E) offers a user interface for administration
    of access control on security-aware UPnP devices. The series of ISO/IEC 29341
    publications defines an architecture for pervasive peer-to-peer network connectivity
    of intelligent appliances, wireless devices and PCs. It is designed to bring easy
    to use, flexible, standards-based connectivity to ad-hoc or unmanaged networks
    whether in the home, in a small business, public spaces or attached to the Internet.
