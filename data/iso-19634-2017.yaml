abstract:
- language: en
  script: Latn
  content: ISO 19634:2017 defines the symbols to be used to represent physical, mechanical
    and thermal characteristics, as determined by methods described in relevant ISO
    publications, for ceramic matrix composites. It is aimed at avoiding confusion
    in reporting measurements and characteristics of products. Where possible, the
    definitions are in accordance with the relevant parts of ISO 80000. In addition,
    the symbols used in undertaking measurements of these characteristics are also
    defined.
