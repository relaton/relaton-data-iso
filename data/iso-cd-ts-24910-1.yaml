abstract:
- language: en
  script: Latn
  content: This document specifies a real-time polymerase chain reaction (real-time
    PCR) method for the qualitative detection of chickpea-specific DNA derived from
    food. PCR amplification reactions in which sufficient amounts of DNA are extracted
    from the relevant substrate can be used to detect the genetic material of chickpeas.
    The target sequence is a partial fragment of the chickpea chloroplast import apparatus
    2-like gene in chromosome Ca7 (GenBank accession number CP039337.1). The provided
    PCR assay for this target has an absolute detection limit of 5 copies per reaction,
    with ≥ 95% reproducibility at this concentration (LOD95%).
