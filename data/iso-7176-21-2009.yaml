abstract:
- language: en
  script: Latn
  content: ISO 7176-21:2009 specifies requirements and test methods for electromagnetic
    emissions and for electromagnetic immunity of electrically powered wheelchairs
    and scooters with a maximum speed of not more than 15 km/h intended for indoor
    and/or outdoor use by people with disabilities. It is also applicable to manual
    wheelchairs with an add-on power kit. It is not applicable to vehicles designed
    to carry more than one person. ISO 7176-21:2009 also specifies requirements and
    test methods for the electromagnetic compatibility of battery chargers intended
    for use with electrically powered wheelchairs and scooters.
