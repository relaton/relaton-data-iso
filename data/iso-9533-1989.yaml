abstract:
- language: en
  script: Latn
  content: Outlines the procedures and sets the criteria necessary to evaluate the
    audible performance of alarms mounted on earth-moving machines intended to warn
    personnel of the potential hazard of the machine moving under its own power, either
    forward or in reverse. The tests are carried out on a stationary machine. Applies
    to earth-moving machinery as defined in ISO 6165.
