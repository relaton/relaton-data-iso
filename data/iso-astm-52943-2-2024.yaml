abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the additive manufacturing of
    metallic parts with directed energy deposition (DED) in the aerospace industry.
    Within the application scope of this document, wire is used as feedstock, and
    arc processes (gas-shielded metal arc processes (MIG/MAG/GMAW), tungsten inert
    gas processes (TIG/GTAW), plasma arc processes (PAW)) are used as the main energy
    source. This document is to be used in conjunction with the engineering documents,
    if required by the engineering authority. This document does not address health
    and safety issues.
