abstract:
- language: en
  script: Latn
  content: 'This document defines the design, safety and operation characteristics
    of liquid hydrogen land vehicle (LHLV) refuelling connectors. LHLV refuelling
    connectors consist of the following components, as applicable: — receptacle and
    protective cap (mounted on vehicle); — nozzle (station side); This document is
    applicable to refuelling connectors which have a maximum fuelling pressure up
    to 1,5 MPa(g) and maximum flow rates up to 300 g/s. This document is not applicable
    to refuelling connectors dispensing gaseous or cryo-compressed hydrogen.'
