abstract:
- language: en
  script: Latn
  content: This document specifies minimum performance and information requirements
    for monitoring devices of bulk milk cooling tanks as part of milking and milk
    cooling machinery installations in agricultural operations. It also specifies
    the minimum requirements for materials, design and installation. The purpose of
    this document is to contribute to a high-quality milk production by monitoring,
    collecting data and providing alarms with respect to defined parameters of the
    milk cooling, storage and cleaning processes.
