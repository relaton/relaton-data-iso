abstract:
- language: en
  script: Latn
  content: 'ISO 8835-7:2011 specifies safety and performance requirements for anaesthetic
    systems and components that: · can function in the absence of a supply of compressed
    medical gases or mains electricity; · can withstand a challenging environment,
    including high temperatures, humidity, shocks and vibration, and dust; · allow
    local servicing and maintenance; · may be suitable for use with flammable anaesthetic
    agents.'
