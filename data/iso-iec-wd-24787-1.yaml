abstract:
- language: en
  script: Latn
  content: This document provides requirements and general principles and specifications
    for a biometric comparison methodology suitable for the on-card environment. This
    document establishes —    architectures of biometric comparison using an ICC,
    —    on-card biometric comparison, both in sensor-off-card systems and as part
    of biometric system-on-card, and —    security policies for on-card biometric
    comparison. This document does not establish —    requirements for off-card biometric
    comparison, —    requirements for biometric system-on-card (defined in the ISO/IEC 17839
    series), —    work-sharing on-card biometric comparison (defined in ISO/IEC 24787-2),
    or —    modality-specific requirements for storage and comparison.
