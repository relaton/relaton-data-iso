abstract:
- language: en
  script: Latn
  content: This International Standard specifies the requirements for flexible rubber
    hoses and hose assemblies used for the transfer of metered quantities of liquified
    petroleum gases (LPGs) from dispensing equipment to motor vehicles. The hoses
    and hose assemblies specified in this International Standard are intended for
    use "wet", i.e. permanently filled with liquid, in the temperature range from
    - 40 °C to + 60 °C. The maximum working pressure is 20 bar (2 MPa).
