abstract:
- language: en
  script: Latn
  content: This document specifies the requirements and test methods for mobile dental
    units and dental patient chairs that is intended to be used within a permanent
    healthcare facility regardless of whether they are or not electrically powered.
    This document also specifies the requirements for the instructions for use, for
    the technical description, for marking and for packaging. Operator's stools, stationary
    dental equipment, other types of mobile dental equipment, portable dental equipment
    and operating lights are not in the scope of this document.
