abstract:
- language: en
  script: Latn
  content: 'This document defines the technical and safety requirements applicable
    to gangway systems used in all railway vehicles such as tram, tram trains, coaches,
    metro, suburban, main line and high speed trains that carry passengers. A gangway
    system gives comfortable passage from one vehicle to the other and consists of
    a flexible component which allows relative movement between vehicles. It also
    defines: —the requirements for the safety for passengers and/or staff in the gangway
    while the train is running; —the assessment methods as well as pass/fail criteria
    for gangways installed on vehicles.'
