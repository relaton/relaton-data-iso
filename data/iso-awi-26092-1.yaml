abstract:
- language: en
  script: Latn
  content: This document specifies the technical and safety requirements applicable
    to gangway systems used in main line railway system and urban guided transport
    vehicles that are designed to allow passengers or staff to move between adjacent
    vehicles. It also specifies the requirements for the safety for passengers and
    staff in the gangway while the train is running, the assessment methods as well
    as pass/fail criteria for gangways installed on vehicles. NOTE Some requirements
    in this document may not be applicable for gangways designed for use by staff
    only. This document is not intended to specify requirements for articulation systems
    which can be an integral part of gangway systems. This document is not applicable
    for types of rubber tube gangways. Information about these types of gangway systems
    are given in Annex A and Annex B.
