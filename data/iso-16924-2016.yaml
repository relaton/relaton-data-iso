abstract:
- language: en
  script: Latn
  content: 'ISO 16924:2016 specifies the design, construction, operation, maintenance
    and inspection of stations for fuelling liquefied natural gas (LNG) to vehicles,
    including equipment, safety and control devices. ISO 16924:2016 also specifies
    the design, construction, operation, maintenance and inspection of fuelling stations
    for using LNG as an onsite source for fuelling CNG to vehicles (LCNG fuelling
    stations), including safety and control devices of the station and specific LCNG
    fuelling station equipment. NOTE Specific CNG equipment is dealt with in ISO 16923.
    ISO 16924:2016 is applicable to fuelling stations receiving LNG and other liquefied
    methane-rich gases that comply with local applicable gas composition regulation
    or with the gas quality requirements of ISO 13686. ISO 16924:2016 includes all
    equipment from the LNG storage tank filling connection up to the fuelling nozzle
    on the vehicle. The LNG storage tank filling connection itself and the vehicle
    fuelling nozzle are not covered in this document. ISO 16924:2016 includes fuelling
    stations having the following characteristics: - private access; - public access
    (self-service or assisted); - metered dispensing and non metered dispensing; -
    fuelling stations with fixed LNG storage; - fuelling stations with mobile LNG
    storage; - movable fuelling stations; - mobile fuelling stations; - multi-fuel
    stations.'
