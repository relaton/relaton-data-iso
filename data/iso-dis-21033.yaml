abstract:
- language: en
  script: Latn
  content: ISO 21033:2016 specifies an inductively coupled plasma optical emission
    spectroscopic method (ICP-OES) for the determination of the trace element content
    in oils. Depending on the dilution solvent used, most types of vegetable oils
    can be analysed (crude, degummed, refined, bleached, deodorized and hardened oils)
    and nearly all types of lecithins and phosphatides. Milk and milk products (or
    fat coming from milk and milk products) are excluded from the scope of this International
    Standard. This method is only suitable when the elements are present in a solubilized
    form. Fine particles, such as bleaching earth, metal particles and rust, can result
    in poor recovery of the trace elements present as nebulization and atomization
    problems affect the ICP-OES analysis. NOTE The only suitable non-ashing direct
    method for samples containing fine particles is graphite furnace atomic absorption
    spectrometry.
