abstract:
- language: en
  script: Latn
  content: ISO 2376:2010 specifies test methods for the determination of the electric
    breakdown potential of anodic oxidation coatings on aluminium and its alloys,
    on flat or near-flat surfaces and on round wire. The methods are applicable to
    anodic oxidation coatings used primarily as electrical insulators. The methods
    are not applicable to coatings in the vicinity of cut edges, the edges of holes,
    or sharp changes of angle on, for example, extruded shapes.
