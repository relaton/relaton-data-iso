abstract:
- language: en
  script: Latn
  content: 'This Technical Specification establishes a harmonized methodological framework for estimating the “gate to gate” footprints of products of Carbon Dioxide Enhanced Oil Recovery (CO₂ EOR) projects. It defines the system boundary of the EOR system and methodological requirements necessary, in accordance with the principles and terminology of ISO 14040, ISO 14044:2006, and ISO 14067:2018. The framework standardizes estimation of emissions across all relevant life cycle stages, including: — Definition of the CO2-EOR system boundary (ISO 14044:2006 3.32) — Estimation of the partial carbon footprints of inputs (ISO 14044:2006 3.21) — Allocation of emissions to co-products (ISO 14044:2006 3.17) This document applies to: — Onshore and offshore CO₂ EOR operations — Industrial, natural, and anthropogenic CO₂ supply sources — Miscible and immiscible CO₂ EOR technologies This Technical Specification does not: — Establish performance thresholds — Prescribe mitigation strategies — Evaluate commercial or regulatory compliance Instead, it provides a methodological basis for consistent emissions estimation.'
