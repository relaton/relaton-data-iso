abstract:
- language: en
  script: Latn
  content: ISO 21572:2004 provides general guidelines and performance criteria for
    methods for the detection and/or quantitation of specific proteins derived from
    genetically modified (GM) plant material in a specified matrix. These general
    guidelines address existing antibody based methods. Methods other than those described
    in annex A may also detect the protein. The same criteria as outlined in this
    standard generally apply.
