abstract:
- language: en
  script: Latn
  content: ISO 1206:2018 specifies the boundary dimensions and normal class tolerance
    values for needle roller bearings with machined rings. ISO 1206:2018 specifies
    dimensional and geometrical characteristics, and limit deviations from nominal
    sizes. These specifications apply to complete needle roller bearings and to bearings
    without inner ring. Recommended values for the tolerances for shaft raceways for
    needle roller bearings without inner ring are given in Annex A.
