abstract:
- language: en
  script: Latn
  content: 'ISO 25745-1:2012 specifies: a) methods of measuring actual energy consumption
    of lifts, escalators and moving walks on a single unit basis; b) methods of carrying
    out periodic energy verification checks on lifts, escalators and moving walks
    in operation. ISO 25745-1:2012 only considers the energy performance during the
    operational portion of the life cycle of the lifts, escalators or moving walks.'
