- language: en
  script: Latn
  content: 'ISO 15746-2:2017 defines: - activity models to describe the dynamic aspects
    of the APC-O modules; - information exchange requirements of the dynamic aspects
    of the APC-O modules; - workflows and lifecycles of APC-O elements; - service
    definitions to support the following information exchanges between: · Level 3
    and APC-O components; · Level 2 and APC-O components; · APC-O components within
    one or more APC-O systems.'
