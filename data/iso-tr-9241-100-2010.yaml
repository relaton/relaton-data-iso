abstract:
- language: en
  script: Latn
  content: ISO 9241-100:2010 enables users of standards related to software ergonomics
    to identify ergonomics standards particularly relevant to software development,
    gain an overview on the content of software-ergonomics standards, understand the
    role of software-ergonomics standards in specifying user requirements as well
    as designing and evaluating user interfaces and understand the relationship between
    the various standards. The software-ergonomics standards are applicable to all
    those software components of an interactive system affecting usability, including
    application software (including web-based applications), operating systems, embedded
    software, software development tools and assistive technologies.
