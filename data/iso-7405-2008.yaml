abstract:
- language: en
  script: Latn
  content: ISO 7405:2008 specifies test methods for the evaluation of biological effects
    of medical devices used in dentistry. It includes testing of pharmacological agents
    that are an integral part of the device under test. ISO 7405:2008 does not cover
    testing of materials and devices that do not come into direct or indirect contact
    with the patient's body.
