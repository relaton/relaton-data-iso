abstract:
- language: en
  script: Latn
  content: The proposed work item describes the methodology to perform the evaluation
    of the personal radon exposure. The standard aims to be applied to those situations
    where radon exposure must be considered as a planned exposure situation. Once
    the personal radon exposure is calculated, it is described how to perform an evaluation
    of the effective dose due to radon exposure in order to compare the result with
    the legal requirements that apply at workplaces.
