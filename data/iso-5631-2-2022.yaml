abstract:
- language: en
  script: Latn
  content: This document specifies a method for measuring the colour of paper and
    board by the diffuse reflectance method with the elimination of specular gloss.
    It can be used to determine the colour of papers or boards that contain fluorescent
    whitening agents, provided the UV content of the illumination on the test piece
    has been previously adjusted to give the calibrated colorimetric value corresponding
    to CIE standard illuminant D65, using a fluorescent reference standard with an
    assigned CIE whiteness (D65/10°) value provided by an authorized laboratory, as
    described in ISO 11475. This document is not applicable to coloured papers or
    boards that incorporate fluorescent dyes or pigments.
