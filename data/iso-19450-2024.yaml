abstract:
- language: en
  script: Latn
  content: This document specifies Object-Process Methodology (OPM) with detail sufficient
    for enabling practitioners to utilise the concepts, semantics, and syntax of OPM
    as a modelling paradigm and language for producing conceptual models at various
    extents of detail, and for enabling tool vendors to provide application modelling
    products to aid those practitioners. While this document presents some examples
    for the use of OPM to improve clarity, it does not attempt to provide a complete
    reference for all the possible applications of OPM.
