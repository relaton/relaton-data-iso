abstract:
- language: en
  script: Latn
  content: ISO 2219:2010 specifies the requirements for factory-made products of expanded
    cork, which are used for the thermal insulation of buildings. The products are
    made with granulated cork agglomerated without additional binders and are delivered
    as boards without facings. ISO 2219:2010 describes product characteristics and
    includes procedures for testing, evaluation of conformity, marking, labelling
    and packaging. Products covered in ISO 2219:2010 are also used in prefabricated
    thermal insulation systems and composite panels; the performance of systems incorporating
    these products is not covered. ISO 2219:2010 does not specify the required level
    of a given property to be achieved by a product to demonstrate fitness for purpose
    in a particular application. The levels required for a given application are to
    be found in regulations or non-conflicting standards. Products with a declared
    thermal resistance lower than 0,25 m2×K/W, at 10 °C, or a declared thermal conductivity
    greater than 0,060 W/(m×K), at 10 °C, are not covered in ISO 2219:2010.
