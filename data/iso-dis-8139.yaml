abstract:
- language: en
  script: Latn
  content: This document specifies the mounting dimensions required for interchangeability
    of rod-end spherical eyes of pneumatic cylinders. The rod-end spherical eyes have
    been designed specifically for use with 1 000 kPa [10 bar[1]] series cylinders
    manufactured in accordance with ISO 6432 and ISO 15552, but this does not limit
    their application. The spherical bearing end eyes are used on piston rods of pneumatic
    cylinders for mechanically transmitting the cylinder force under oscillatory rotational
    and tilting movements. The design of the rod-end spherical eyes is based on the
    maximum forces resulting from the specified internal diameter of the cylinders
    and pressure according to ISO 6432, ISO 15552 and ISO 21287. [1] 1 bar = 100 kPa
    = 105 Pa; 1 Pa = 1 N/m2.
