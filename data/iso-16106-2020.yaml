abstract:
- language: en
  script: Latn
  content: 'This document gives guidance on the application of a quality management
    system in the manufacture, measuring and monitoring of design type approved dangerous
    goods packaging, intermediate bulk containers (IBCs) and large packaging. This
    document does not include guidance specific to other management systems, such
    as those for environmental management, occupational health and safety management,
    or financial management. It is applicable to an organization that: a) needs to
    demonstrate its ability to consistently provide products and services that meet
    customer and applicable statutory and regulatory requirements; and b) aims to
    enhance customer satisfaction through the effective application of the system,
    including processes for improvement of the system and the assurance of conformity
    to customer and applicable statutory and regulatory requirements. All the guidance
    in this document is generic and intended to be applicable to any organization,
    regardless of its type or size, or the products and services it provides. NOTE
    In this document, the terms "product" or "service" only apply to products and
    services intended for, or required by, a customer. It does not apply to design
    type testing, for which reference is made to 6.1.5, 6.3.5, 6.5.6 and 6.6.5 of
    the UN Model Regulations[27].'
