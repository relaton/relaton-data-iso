abstract:
- language: en
  script: Latn
  content: 'This document establishes a framework and specifies electronic fee collection
    (EFC) functions for the personalization process of on-board equipment (OBE) used
    for EFC. The personalization process takes place within the domain of the entity
    that is responsible for the application in the OBE. This document is applicable
    to the EFC interface, e.g. using dedicated short-range communication or integrated
    circuit(s) card, between the personalization equipment (PE) and OBE as shown in
    Figure 1. This document does not cover the following: whether the personalization
    functionality resides completely in the PE or whether this functionality instead
    resides in a central system, where the PE is more or less “transparent”; the exact
    application command or message structures for the EFC personalization functionality
    (these are dependent on the communication media and are described in subsequent
    parts of the ISO 21719 series); the test procedures for evaluation of an implementation
    for conformity to the requirements in this document; setting-up of operating organizations
    (e.g. toll service provider, personalization agent, trusted third party). NOTE           
    Some of the issues listed above are subject to separate documents prepared by
    ISO/TC 204, CEN/TC 278 and the European Telecommunications Standards Institute
    – Electromagnetic compatibility and Radio Spectrum Matters (ETSI ERM).'
