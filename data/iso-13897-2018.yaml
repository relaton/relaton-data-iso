abstract:
- language: en
  script: Latn
  content: ISO 13897:2018 specifies the requirements for reusable mixing-capsules
    intended to contain dental amalgam alloy powder and dental mercury when these
    are mixed to produce dental amalgam, and the test methods used to determine conformity
    to these requirements. NOTE ISO 7488 specifies requirements for mixing machines.
    The requirements for mixing-capsule are not dealt with in ISO 7488, although the
    mixing-capsule is an essential part of the mixing machine.
