abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory test procedure for determining the
    electrical resistance, in wet conditions, between the running rails provided by
    a fastening system fitted to a steel or concrete sleeper, bearer or element of
    ballastless track. It is also applicable to embedded rail. This test procedure
    applies to a complete fastening assembly. It is relevant to signalling currents,
    not to traction currents. A reference procedure and an alternative procedure are
    included.
