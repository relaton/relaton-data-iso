abstract:
- language: en
  script: Latn
  content: ISO 7885:2010 gives dimensional and performance requirements for sterile
    injection needles for single use which are used in dental cartridge syringes complying
    with ISO 9997 for injection of dental local anaesthetics. It further specifies
    requirements with respect to their packaging, labelling and colour coding. It
    does not cover needles for special applications or techniques. Only the materials
    used for the construction of the needle tubing are specified.
