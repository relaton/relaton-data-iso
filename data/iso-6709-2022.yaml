abstract:
- language: en
  script: Latn
  content: This document specifies the representation of latitude and longitude and
    optionally height or depth compatible with previous editions of ISO 6709. This
    document also supports the representations of other coordinate types and time
    that can be associated with those coordinates as defined through one or more coordinate
    reference systems (CRS). This document describes a text string of coordinates,
    suitable for electronic data exchange, for one point, including reference system
    identification to ensure that the coordinates unambiguously represent the position
    of that point. Files containing multiple points with a single common reference
    system identification are out of scope. This document also describes a simpler
    text string structure for coordinate representation of a point location that is
    more suitable for human readability.
