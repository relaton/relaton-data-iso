abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and measures for manually
    loaded and unloaded —     single-end tenoning machines with a manual feed sliding
    table, —     single-end tenoning machines with a mechanical feed sliding table,
    —     single-end tenoning-profiling machines with mechanical feed, —     double-end
    tenoning-profiling machines with mechanical feed, also designed to be automatically
    either loaded or unloaded, or both, and —     angular systems for tenoning and
    profiling with mechanical feed with maximum workpiece height capacity of 200 mm
    for single-end machines and 500 mm for double-end machines, capable of continuous
    production use, altogether referred to as “machines”. This document deals with
    all significant hazards, hazardous situations and events as listed in Annex A,
    relevant to machines, when operated, adjusted and maintained as intended and under
    the conditions foreseen by the manufacturer including reasonably foreseeable misuse.
    Also, transport, assembly, dismantling, disabling and scrapping phases have been
    taken into account. The machines are designed to process in one pass one end or
    two sides, either opposite or perpendicular to each other, of workpieces made
    of a)       solid wood, and b)       materials with similar physical characteristics
    to wood (see ISO 19085-1:2021, 3.2); and c)        only the machines with mechanical
    feed, made of d)       fibre-cement, e)       rock wool and glass wool, f)        
    gypsum, g)       plasterboard, h)       matrix engineered mineral boards, silicate
    boards and sulfate boards, i)         composite materials with core consisting
    of polyurethane or mineral material laminated with light alloy, j)         polymer-matrix
    composite materials and reinforced thermoplastic, thermoset and elastomeric materials,
    k)       aluminium light alloy profiles, and l)         composite boards made
    from the materials listed above. This document is also applicable to machines
    fitted with one or more of the following devices or additional working units,
    whose hazards have been dealt with: —     sanding units; —     fixed or movable
    workpiece support; —     automatic tool changing; —     automatic workpiece returner;
    —     glass bead saw unit; —     hinge recessing unit; —     boring unit; —    
    dynamic processing unit; —     sawing unit installed out of the integral enclosure,
    between machine halves in double-end machines; —     foiling unit; —     coating
    unit; —     grooving unit with a milling tool installed out of the integral enclosure,
    between machine halves; —     brushing unit; —     gluing unit; —     sealing
    unit; —     dowels inserting unit; —     tongues inserting unit; —     inkjet
    marking unit; —     laser marking unit; —     labelling unit; —     workpiece
    back-up device (device that is either anti-chipping or anti-splintering, or both);
    —     quick tool changing system; —     post-formed edge pre-cutting unit; —    
    additional workpiece support (at either infeed or outfeed, or both); —     parallel
    infeed device on single-end machines; —     transversal infeed device on single-end
    machines; —     intermediate workpiece support on double-end machines; —     automatic
    infeed device; —     feed chain with dogs. This document does not deal with any
    hazards related to: a)       systems for automatic loading and unloading of the
    workpiece to a single machine other than automatic workpiece returner; b)      
    single machine being used in combination with any other machine (as part of a
    line); c)        use of tools, other than saw blades or boring tools or milling
    tools for grooving, installed between machine halves and out of the integral enclosure
    in double-end machines; d)       use of tools protruding out of the integral enclosure;
    e)       chemical characteristics of all materials listed in 1.3 c) to i) and
    their dust. This document is not applicable to machines intended for use in potentially
    explosive atmosphere nor to machines manufactured prior to its publication.'
