abstract:
- language: en
  script: Latn
  content: This document specifies the test methods to evaluate the accuracy of the
    restorative appliances, such as inlay and crown, through the clinical workflow
    (scanning (input) to final restorations (outcome)) using a chairside CAD/CAM system.
    The test methods described in this standard are limited only to the chairside
    CAD/CAM system using a one-visit treatment workflow, not to indirect dental restorations.
    These test methods do not include restorative appliances fabricated using additive
    manufacturing methods.
