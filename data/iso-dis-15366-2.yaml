abstract:
- language: en
  script: Latn
  content: ISO 15366-2:2014 describes procedures to chemically separate and purify uranium and plutonium in dissolved solutions of irradiated light water reactor fuels and in samples of high active liquid waste of spent fuel reprocessing plants, prior to their isotopic analysis by e.g. mass spectrometric method or alpha spectrometry. ISO 15366-2:2014 describes a slightly different separation technique from ISO 15366-1, based on the same chemistry, using smaller columns, different support material and special purification steps, applicable to samples containing plutonium and uranium amounts in the nanogram range and below. The detection limits were found to be 500 pg plutonium and 500 pg uranium.
