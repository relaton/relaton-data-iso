abstract:
- language: en
  script: Latn
  content: This document specifies a method for the determination of the carbon footprint
    for Eco-Routing Platforms and suggests a Newtonian Physics of Driving methodology
    where minimizing energy is combined with the well-known routing criteria minimum
    distance and minimum duration. This leads to eco-innovation for fleets and smart
    city applications helping them to quantify the savings achieved by eco-routing
    issued as carbon credits in mobile and nomadic devices. The carbon footprint determination
    is implemented by extracting trip data and speed profiles from the global navigation
    satellite system (GNSS) receiver of the nomadic or mobile device and by calculating
    the deviation of the mechanical energy contributions relative to a given reference
    world-wide harmonized light duty vehicles test procedure (WLTP) driving cycle
    in [%].
