abstract:
- language: en
  script: Latn
  content: This document provides a standardized methodology for valuing health data
    to support its objective utilization, exchange, and transaction. It defines a
    stepwise model that considers various factors such as unit medical procedure unit
    cost, institution size, examination fees, data management costs, data quality,
    scarcity, effectiveness, distribution fees and statutory tax.
