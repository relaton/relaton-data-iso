abstract:
- language: en
  script: Latn
  content: ISO 10191:2010 specifies test methods for verifying the capabilities of
    tyres for passenger cars. Of the test methods presented, it is possible that only
    some will be required depending on the type of tyre to be tested. The tests are
    carried out in a laboratory under controlled conditions. ISO 10191:2010 includes
    a strength test for assessing the capability of the tyre structure, with respect
    to braking energy, in the tread area. A second test, the bead unseating test,
    assesses the resistance of the tyre to bead unseating. It applies to tubeless
    tyres only. A third test, the endurance test, assesses the resistance of the tyre
    with respect to service at full load and moderate speed over long distances. The
    fourth test, the high speed test, assesses the capability of the tyre according
    to its speed category. The test methods presented in ISO 10191:2010 are not intended
    for gradation of tyre performance or quality levels. This International Standard
    applies to all passenger car tyres.
