abstract:
- language: en
  script: Latn
  content: ISO 22829:2017 specifies additional requirements to those given in ISO
    5826 for single-phase inverter transformers with connected rectifier for DC welding.
    This document applies to transformers, primarily used in welding guns, operating
    at 1 000 Hz with a rated input voltage of 500 V or more. The requirements of ISO
    5826 shall be followed unless amended by this document.
