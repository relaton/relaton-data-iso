abstract:
- language: en
  script: Latn
  content: ISO 7216:2015 specifies a method for measuring the A-weighted sound pressure
    level of the noise emitted by agricultural and forestry tractors while the vehicle
    is in motion. The conditions specified for the operation of the agricultural and
    forestry tractors during the measurements are defined to provide a realistic and
    repeatable assessment of the maximum noise emitted when it is in motion. ISO 7216:2015
    is applicable to agricultural and forestry tractors, fitted with elastic tyres
    or rubber tracks. It is not applicable to special forestry machinery, for example,
    forwarders, skidders, etc., as defined in ISO 6814 and agricultural and forestry
    tractors, fitted with steel tracks. NOTE The test method calls for an acoustical
    environment which can only be obtained in an extensive open space.
