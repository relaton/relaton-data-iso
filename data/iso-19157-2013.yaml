abstract:
- language: en
  script: Latn
  content: "\uFEFFISO 19157:2013 establishes the principles for describing the quality
    of geographic data. It - defines components for describing data quality; - specifies
    components and content structure of a register for data quality measures; - describes
    general procedures for evaluating the quality of geographic data; - establishes
    principles for reporting data quality. ISO 19157:2013 also defines a set of data
    quality measures for use in evaluating and reporting data quality. It is applicable
    to data producers providing quality information to describe and assess how well
    a data set conforms to its product specification and to data users attempting
    to determine whether or not specific geographic data are of sufficient quality
    for their particular application. ISO 19157:2013 does not attempt to define minimum
    acceptable levels of quality for geographic data."
