abstract:
- language: en
  script: Latn
  content: 'ISO 14442:2006 provides procedures, not covered by the methods described
    in ISO 8692 and ISO 10253, for testing difficult substances for inhibition of
    algal growth. The main subjects covered by ISO 14442:2006 are the methods for
    preparing the test substance for testing and the procedures needed to carry out
    an appropriate test. The following test substances are covered by this guideline:
    poorly soluble pure organic compounds; poorly soluble mixtures of organic substances;
    poorly soluble inorganic materials; volatile substances; waste waters and environmental
    samples containing water and sediments; coloured and/or turbid samples; compounds
    of heavy metals. The following methods of addition are covered: direct; dispersion;
    water-soluble and water-accommodated fractions. Some guidelines related to the
    analytical procedures and to the interpretation of the results have been included.'
