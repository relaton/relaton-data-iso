abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the specification and qualification
    of welding procedures for the friction stir welding (FSW) of aluminium. In this
    document, the term "aluminium" refers to aluminium and its alloys. This document
    does not apply to friction stir spot welding which is covered by the ISO 18785
    series. NOTE Service requirements, materials or manufacturing conditions can require
    more comprehensive testing than is specified in this document.
