abstract:
- language: en
  script: Latn
  content: This document specifies a test method for evaluating the bacterial reduction activity of single-use wet wipes on hard surfaces. The wet wipes covered by this document are made from substrates such as non-woven fabrics, woven fabrics, or knitted fabrics and are intended for daily use in households and not for medical applications. They are intended for single use and are not reusable. The test method simulates the everyday action of gently wiping a hard surface by hand. The key principle of the test method is to mechanically reproduce this hand-wiping action under standardized and reproducible conditions.
