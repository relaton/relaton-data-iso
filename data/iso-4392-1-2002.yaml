abstract:
- language: en
  script: Latn
  content: This part of ISO 4392 describes a method of determining the low speed characteristics
    of positive displacement rotary fluid power motors, of either fixed or variable
    displacement types. The method involves testing at slow speeds which may generate
    frequencies having a significant influence upon the steady continuous torque output
    of the motor and affect the system to which the motor would be connected.
