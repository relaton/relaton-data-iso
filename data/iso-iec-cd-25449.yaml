abstract:
- language: en
  script: Latn
  content: This specification defines the requirements for the Ultracode 2023 symbology.
    It specifies the complete symbol characteristics including the data character
    encodation process, rules for error correction codeword encoding and codeword
    block truncation, the graphical symbol formats and symbol dimensions, and colour
    usage in the symbol construction and information encodation. A reference decode
    algorithm is given, as well as consideration of user-selectable application parameters.
    Specific print and display colour symbol quality methods for Ultracode are discussed
    as an extension of ISO/IEC 15415, Information technology – Automatic identification
    and data capture techniques – Bar code symbol print quality test specification
    – Two-dimensional symbols. Methods for assessment of colour quality are given,
    along with additional considerations for the measurement of colour bar code print
    quality in Ultracode beyond the scope of ISO/IEC 15415.
