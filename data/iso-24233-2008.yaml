abstract:
- language: en
  script: Latn
  content: ISO 24233:2007 presents a tool specification sheet for diecasting dies,
    for use both when requesting (at the tendering stage) and when ordering the tools.
    The sheet specifies the data necessary for material acquisition, equipment and
    the structural design of diecasting dies, including the tool surfaces, as well
    as information relating to machine‑specific data, types of operation and warranty.
    ISO 24233:2007 is not applicable to compression moulds or injection moulds.
