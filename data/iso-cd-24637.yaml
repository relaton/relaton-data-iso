abstract:
- language: en
  script: Latn
  content: ISO 24637:2009 provides specific requirements for the content of equipment-level
    electromagnetic interference (EMI) test report documentation to ensure that sufficient
    data is provided for subsequent integration analysis of complex space systems.
    Emphasis is placed on necessary test report augmentation to include additional
    test data reporting when specifically needed to document any EMI test limit failures
    for spaceflight hardware. The requirements presented in ISO 24637:2009 apply only
    to EMI test reports at the equipment level. These requirements are particularly
    important when an EMI test limit non-conformance waiver is requested for spaceflight
    equipment in lieu of re-design.
