abstract:
- language: en
  script: Latn
  content: This document defines a taxonomy of eligible investment categories for
    designation as green debt instruments, including bonds and loans. This document
    categorizes economic sectors and establishes criteria for determining the eligibility
    of projects, assets and supporting expenditures. It provides guidance on adaptation
    by sector in Annex A. It provides examples of thresholds and exclusions in Annex B.
