abstract:
- language: en
  script: Latn
  content: ISO 18645:2016 specifies the requirements for testing methods, sampling
    and preparation of test sample, marking and labelling, as well as package, transport,
    and storage of water soluble fertilizers. ISO 18645:2016 is applicable to water
    soluble fertilizers which are completely soluble in water and are suitable for
    fertigation and sprinkling irrigation, as well as for foliar application (foliar
    feeding).
