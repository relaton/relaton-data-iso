abstract:
- language: en
  script: Latn
  content: ISO 11148-12:2012 specifies safety requirements for hand-held non-electric
    power tools (hereinafter "circular, oscillating and reciprocating saws") intended
    for sawing. The circular, oscillating and reciprocating saws can be powered by
    compressed air, hydraulic fluid or internal combustion engines and are intended
    to be used by one operator and supported by the operator's hand or hands, with
    or without a suspension, e.g. a balancer. ISO 11148-12:2012 is applicable to circular
    saws, circular knives, oscillating saws having a saw blade with a radius of 50
    mm or less or a diamond cutting-off blade with a radius of 100 mm or less, oscillating
    knives (including windshield knives) and reciprocating saws, including jig saws
    and power hack saws. ISO 11148-12:2012 is not applicable to special requirements
    and modifications of circular, oscillating and reciprocating saws for the purpose
    of mounting them in fixtures. ISO 11148-12:2012 deals with all significant hazards,
    hazardous situations or hazardous events relevant to circular, oscillating and
    reciprocating saws when they are used as intended and under conditions of misuse
    which are reasonably foreseeable by the manufacturer, with the exception of the
    use of circular, oscillating and reciprocating saws in potentially explosive atmospheres.
