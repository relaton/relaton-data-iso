abstract:
- language: en
  script: Latn
  content: ISO/TS 17892-8:2004 specifies the test method for the determination of
    the compressive strength of a cylindrical, water-saturated specimen of undisturbed
    or remoulded cohesive soil when first subjected to an isotropic stress without
    allowing any drainage from the specimen, and thereafter sheared under undrained
    conditions within the scope of the geotechnical investigations according to prEN
    1997-1 and -2. NOTE "Water-saturated" refers to the in-situ condition. The material
    tested need not necessarily be saturated at all stages during the laboratory testing.
