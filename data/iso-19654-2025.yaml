abstract:
- language: en
  script: Latn
  content: 'This method gives a standardized procedure for the conditioning operation
    when selecting a conditioning product at laboratory scale and also for the production
    of flocculated thickened sludge for subsequent dewatering tests. This document
    provides a method for laboratory chemical conditioning of sludge. The method applies
    to sludges and suspensions from: —     storm water handling; —     urban wastewater
    collecting systems; —     urban wastewater treatment plants; —     industrial
    wastewater that has been treated similarly to urban wastewater; —     water supply
    plants. This document is applicable to all sludge that can have similar environmental
    or health impacts, or both, with exclusion of hazardous sludge from industry and
    dredged sludge.'
