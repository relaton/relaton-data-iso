abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the protection of iron and steel
    surfaces against corrosion by applying thermal-sprayed metallic coatings of zinc,
    aluminium or their alloys. In this document, requirements for the planning of
    the corrosion protection system and for the constructive design of the component
    to be protected are specified, where thermal spraying is intended to be the process
    for the deposition of the metallic corrosion protection. Some field-related basic
    terms are defined and instructions for corrosion behaviour of the zinc and aluminium
    materials under different environment conditions are provided. Characteristic
    properties of the coating, e.g. coating thickness, minimum adhesive strength and
    surface appearance, are specified and test procedures for thermal-sprayed corrosion
    protection coatings of zinc, aluminium or their alloys are determined. This document
    is valid for applying thermal-sprayed zinc and aluminium protection coatings against
    corrosion in the temperature range between −50 °C to +200 °C, taking into consideration
    the service conditions of any sealants used. Heat-resistant protective coatings
    of aluminium are covered by ISO 17834 and are not in the scope of this document.
    Other corrosion protection processes, e.g. hot-dip galvanizing (galvanic coating),
    sherardizing, electroplating or selection and deposition of organic coatings/paints
    are not in the scope of this document. Requirements for the manufacturing of thermal-sprayed
    coatings are specified in ISO 2063-2.
