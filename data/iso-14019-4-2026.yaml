abstract:
- language: en
  script: Latn
  content: This document specifies principles and requirements for the competence,
    consistent operation and impartiality of bodies performing validation/verification
    of declared sustainability information. This document is an application of ISO/IEC 17029,
    which contains general principles and requirements for the competence, consistent
    operation and impartiality of bodies performing validation/verification as conformity
    assessment activities. This document includes specific requirements related to
    bodies performing validation/verification of declared sustainability information
    in addition to the requirements of ISO/IEC 17029. Any programme requirements related
    to bodies are additional to the requirements of this document.
