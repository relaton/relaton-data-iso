abstract:
- language: en
  script: Latn
  content: ISO/TS 13140-2:2011 specifies the abstract test suite (ATS) to evaluate
    the conformity of on-board equipment (OBE) and roadside equipment (RSE) to ISO/TS
    13141:2010. It provides a basis for conformance tests for dedicated short range
    communication (DSRC) equipment (on-board equipment and roadside equipment) to
    enable interoperability between different equipment supplied by different manufacturers.
