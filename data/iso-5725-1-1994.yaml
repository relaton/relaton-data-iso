abstract:
- language: en
  script: Latn
  content: The purpose is to outline the general principles to be understood when
    assessing accuracy (trueness and precision) of measurement methods and results,
    and in applications, and to establish practical estimations of the various measures
    by experiment. Is concerned exclusively with measurement methods which yield measurements
    on a continuous scale and give a single value as the test result. May be applied
    to a very wide range of materials, including liquids, powders and solid objects,
    manufactured or naturally occurring, provided that due consideration is given
    to any heterogeneity of the material.
