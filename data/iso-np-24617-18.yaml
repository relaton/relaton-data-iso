abstract:
- language: en
  script: Latn
  content: This document extends the ISO 24617 series of ISO international standards
    for the semantic annotation of language resources. It specifies a schematic framework
    for constructing linguistic data on motions enacted in dynamic space. To this
    end, it first introduces the notion of a minimal embedding space as a dynamic
    space in which motions and their trajectories are activated over time. It then
    specifies how each type of motion is conditioned by its embedding space and how
    each dynamic path is configured by an associated embedding space as it extends
    in time. As a supplementary part of ISO 24617-12:2020 Spatial information, this
    document focuses on annotating motions, embedded in dynamic space, and iteratively
    extending their dynamic paths as they progress. The proposed annotation scheme
    adopts the Abstract Meaning Representation (AMR+), enriched with discourse-contextual
    constraints over semantic ambiguities, plurality, or determinacy, to represent
    the annotation of dynamic information triggered by motions activated in dynamic
    space.
