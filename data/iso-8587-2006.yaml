abstract:
- language: en
  script: Latn
  content: 'ISO 8587:2006 describes a method for sensory evaluation with the aim of
    placing a series of test samples in rank order. This method allows for assessing
    differences among several samples based on the intensity of a single attribute,
    of several attributes or of an overall impression. It is used to find if differences
    exist, but cannot determine the degree of difference that exists between samples.
    ISO 8587:2006 is suited for the following cases: a) evaluation of assessors''
    performance (training assessors, determining perception thresholds of individuals
    or groups); b) product assessment (pre-sorting of samples, determination of the
    influence on intensity levels of one or more parameters and determination of the
    order of preference in a global hedonic test).'
