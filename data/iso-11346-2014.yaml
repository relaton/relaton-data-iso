abstract:
- language: en
  script: Latn
  content: 'ISO 11346:2014 specifies the principles and procedures for estimating
    the thermal endurance of rubbers from the results of exposure to elevated temperatures
    for long periods. Two approaches are specified: one using the Arrhenius relation;
    the other using the WLF equation. In ISO 11346:2014, the estimation of thermal
    endurance is based solely on the change in selected properties resulting from
    periods of exposure to elevated temperatures. The various properties of rubbers
    change at different rates on thermal ageing, hence comparisons between different
    rubbers can only be made using the same properties.'
