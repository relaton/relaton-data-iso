abstract:
- language: en
  script: Latn
  content: This part of ISO 8579 specifies the instructions and standardized conditions
    necessary for the determination of the airborne sound emission of gear units and
    gearmotors. It also specifies the allowed measurement methods, together with the
    operating and mounting conditions used for the test. This part of ISO 8579 has
    the aim of ensuring, with its use, the reproducibility of the determination of
    the airborne sound emission characteristics within specified limits determined
    by the grade of accuracy of the basic measurement method used. The sound measurement
    methods allowed by this part of ISO 8579 are engineering methods (grade 2) and
    survey methods (grade 3).
