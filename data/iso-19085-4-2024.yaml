abstract:
- language: en
  script: Latn
  content: 'This document specifies the safety requirements and measures for manually
    loaded and unloaded vertical panel circular sawing machines (defined in 3.1) capable
    of continuous production use, with hand feed or integrated feed, hereinafter referred
    to also as “machines”. This document deals with all significant hazards, hazardous
    situations and events, as listed in Annex A, relevant to the machines, when operated,
    adjusted and maintained as intended and under the conditions foreseen by the manufacturer,
    including reasonably foreseeable misuse. Transport, assembly, dismantling, disabling
    and scrapping phases are also taken into account. This document is also applicable
    to machines fitted with one or more of the following devices/additional working
    units, whose hazards have been dealt with: —     an integrated feed device; —    
    a device for scoring; —     an angle cutting device; —     a middle support device;
    —     programmable end stops for parallel vertical cuts; —     a device for grooving
    with a milling tool with a cutting width not exceeding 27 mm; —     a panel pusher;
    —     a panel lowering device; —     stop devices for workpiece during horizontal
    cuts. The machines are designed for cutting panels consisting of: a)       solid
    wood; b)       material with similar physical characteristics to wood (see ISO 19085-1:2021,
    3.2); c)        composite materials with core consisting, for example, of polyurethane
    or mineral material laminated with light alloy; d)       polymer-matrix composite
    materials and reinforced thermoplastic/thermoset/elastomeric materials; e)      
    gypsum boards, gypsum bounded fibreboards; f)         honeycomb aluminium boards;
    g)       matrix engineered mineral boards, silicate boards; h)       aluminium
    light alloy plates; i)         composite boards made from the materials listed
    above. This document does not apply to machines —     with pressure beam and saw
    unit mounted behind the workpiece support, —     where the guide rails on which
    the saw unit moves vertically are fixed on the machine frame and the horizontal
    cut can only be made by manually feeding the panel, —     designed to cut in vertical
    direction only, —     automatically performing two or more cutting cycles in sequence,
    —     intended for use in potentially explosive atmosphere, and —     manufactured
    prior to the publication of this document.'
