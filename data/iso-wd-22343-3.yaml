abstract:
- language: en
  script: Latn
  content: This document specifies requirements for a hostile vehicle mitigation scheme
    for the planning of access control in connection with the deployment of tested
    vehicle security barriers, while taking their urban compatibility into consideration.
    This document is applicable to all manufacturers, test houses and procurers of
    VSBs and other end-users, such as site-owners, specifiers and inspectors, municipalities
    or event organizers, where VSBs are used to protect people in any public or private
    location from the impact of vehicle attacks. This document is not applicable for
    providing guidance on design and the operational suitability of a VSB or other
    impact test methods.
