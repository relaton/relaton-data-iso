abstract:
- language: en
  script: Latn
  content: This document specifies the bending test methods on beam specimens for measuring the flexural strengths of sprayed concrete, respectively applied to conventional sprayed concrete and fiber reinforced sprayed concrete. The reinforcing fibers can be metallic fibers, synthetic or other fibers, or a combination of fiber types. This document covers the measurement and determination of flexural strength parameters such as first peak strength, ultimate strength, and residual strength of sprayed concrete specimens under controlled loading conditions.
