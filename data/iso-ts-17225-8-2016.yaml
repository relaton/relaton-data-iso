abstract:
- language: en
  script: Latn
  content: 'ISO/TS 17225-8:2016 determines the fuel quality classes and specifications
    of graded densified solid biofuels produced from thermally treated biomass for
    non-industrial and industrial use. This document covers pellets and briquettes
    produced from the following raw materials (see ISO 17225‑1:2014, Table 1): - 1.1
    Forest, plantation and other virgin wood; - 1.2 By-products and residues from
    wood processing industry; - 1.3.1 Chemically untreated used wood; - 2. Herbaceous
    biomass; - 3. Fruit biomass; - 4. Aquatic biomass. Subcategories of the above
    stated raw materials are included. ISO/TS 17225-8:2016 does not consider products,
    which are marketed as charcoal or as charcoal products. For these products, ISO
    17225‑1:2014, Table 14 shall apply. NOTE 1 For thermally treated powder, ISO 17225‑1:2014,
    Table 15 or Table 16 may be used for specification. NOTE 2 Health, safety and
    environmental issues for solid biofuels are important and need special attention;
    however, they are outside the scope of this document.'
