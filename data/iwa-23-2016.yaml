abstract:
- language: en
  script: Latn
  content: 'IWA 23:2016 is a consensus document developed by the workshop participants
    and observers in response to the need for standardization and harmonization of
    pitch spacing dimension, initial device classification and terminology of relevance.
    IWA 23:2016 will serve as a guideline and is applicable to various interested
    parties and stakeholders in the microfluidics community. IWA 23:2016: - specifies
    geometrical standards in relation to pitch connector dimensions of microfluidic
    devices, - specifies an initial device classification rules, and - defines terms
    of relevance.'
