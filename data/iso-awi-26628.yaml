abstract:
- language: en
  script: Latn
  content: This standard specifies test methods to evaluate plant protection product
    use reduction, accuracy, and deposition performance of targeted spray application
    systems for horizontal boom sprayers when applying plant protection products once
    a target has been successfully detected. This standard applies to targeted application
    equipment using onboard sensors for real time application, or non-real time application
    using a prescription map generated by various remote sensing technologies. This
    standard only applies to test vehicular horizontal boom sprayers for targeted
    part boom and targeted spot applications and not to other types of application
    equipment e.g. portable, air blast or aircraft spraying equipment, or application
    techniques e.g. band spraying, spreaders/granular products
