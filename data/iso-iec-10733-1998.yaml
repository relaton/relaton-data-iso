abstract:
- language: en
  script: Latn
  content: 'This Recommendation | International Standard provides the specification
    of management information within an Open System related to those operations of
    the OSI Network Layer. Specifics on how Network layer management is accomplished
    is beyond the scope of this Recommendation | International Standard. Network Layer
    management information is defined by specifying: ? the managed object class definition
    of Network Layer Managed Objects following guidelines put forth by the Structure
    of Management Information (see Recommendations X.720-X.724 and ISO/IEC 10165);
    ? the relationship of the Managed Objects and attributes to both the operation
    of the layer and to other objects and attributes of the layer; and ? the action
    type operations on the attributes of Network Layer Managed Objects that are available
    to OSI Systems Management. Annexes D, E, F and G, which are integral parts of
    this Recommendation | International Standard, provide ICS proformas associated
    with Network Layer management information.'
