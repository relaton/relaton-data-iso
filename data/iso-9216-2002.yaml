abstract:
- language: en
  script: Latn
  content: ISO 9216:2002 specifies the characteristics of nuts, hexagonal, slotted/castellated,
    of reduced height and reduced width across flats, in alloy steel and cadmium plated
    (classification 900 MPa/235 °C) or in corrosion-resistant steel and passivated
    (classification 900 MPa/450 °C). ISO 9216:2002 is applicable to nuts used with
    ISO 9219 bolts, ISO 9217 and ISO 9218 washers, and ISO 1234 split pins in the
    assembly of ISO 7939 pulleys. ISO 9216:2002 is also applicable to nuts in the
    assembly of airframe rolling bearings or spherical bearings.
