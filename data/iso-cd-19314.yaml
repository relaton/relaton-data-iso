abstract:
- language: en
  script: Latn
  content: This document specifies the print through test principle, instruments and
    materials, sample preparation, test procedures, results and test reports. This
    document is applicable for the test of print through. Four evaluation methods
    can be used for representation of the result. When print through phenomenon is
    to be evaluated, any one of the first three methods can be used. If more information
    includes the factors causing the print through phenomenon are needed to be figure
    out, the fourth method can be used.
