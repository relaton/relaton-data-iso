abstract:
- language: en
  script: Latn
  content: This document specifies a method of test for evaluating the appearance
    of apparel and other textile end products after one or several domestic washing
    and drying treatments. The appearance evaluated includes colour change, pilling,
    fuzzing, matting appearance of fabrics, smoothness appearance of flat fabric and
    seams, and the retention of pressed-in creases in garments and other textile products,
    damage of components ? buttons, press fasteners, slide fasteners, etc. This document
    is applicable to any washable textile end product of any fabric construction.
    Techniques for seaming and creasing are not included since the purpose is to evaluate
    textile end products as they are supplied from the manufacturer or as ready-to-use.
    Techniques for seaming and creasing are controlled by fabric properties. This
    method has been developed primarily for use with domestic washing machines of
    Type B as defined in ISO 6330, but it can be used with any type of machine defined
    in ISO 6330. It is recognized that prints and patterns can mask the wrinkled appearance
    present in textile end products. The rating process is, however, based on the
    visual appearance of specimens including such effects.
