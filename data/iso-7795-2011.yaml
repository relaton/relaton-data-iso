abstract:
- language: en
  script: Latn
  content: ISO 7795:2011 specifies test methods for determining the mounting and fastening
    characteristics of screws that are intended for fastening ski binding to cross-country
    skis. The requirements for ski-binding screws are specified in ISO 7794. The results
    of the test methods specified in ISO 7795:2011 characterize only the properties
    of the screw. The results do not specify the actual mounting and fastening characteristics
    of different ski models, this information being specified in ISO 9119.
