abstract:
- language: en
  script: Latn
  content: ISO 8769:2010 specifies the characteristics of reference sources of radioactive
    surface contamination, traceable to national measurement standards, for the calibration
    of surface contamination monitors. ISO 8769:2010 relates to alpha-emitters, beta-emitters
    and photon emitters of maximum photon energy not greater than 1,5 MeV. It does
    not describe the procedures involved in the use of these reference sources for
    the calibration of surface contamination monitors. ISO 8769:2010 specifies also
    reference radiation for the calibration of surface contamination monitors, which
    takes the form of adequately characterized large area sources specified, without
    exception, in terms of surface emission rates, the evaluation of these quantities
    being traceable to national standards.
