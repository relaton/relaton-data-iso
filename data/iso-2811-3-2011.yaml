- language: en
  script: Latn
  content: ISO 2811-3:2011 specifies a method for determining the density of paints,
    varnishes and related products using an oscillator. The method is suitable for
    all materials, including paste-like coatings. If a pressure-resistant type of
    apparatus is used, the method is also applicable to aerosols.
