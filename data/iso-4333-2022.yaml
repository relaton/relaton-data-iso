abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the determination of reduction
    activity of textile products against specific proteins which shows antigen-antibody
    reaction. This document only specifies the reduction activity against those proteins
    on the surface of textile products. It does not specify a testing method to evaluate
    the allergenic reaction against human beings. Specific proteins which show antigen-antibody
    reaction are proteins derived from pollen, mite and other sources. Other specific
    proteins can be used after appropriate validation described in this document.
    Enzyme-linked immunosorbent assay is used to quantify the amount of those proteins
    in this document. This document is applicable to textile products include woven,
    knitted and nonwoven fabrics, fibres, yarns, braids, etc.
