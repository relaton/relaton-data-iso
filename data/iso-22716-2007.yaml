abstract:
- language: en
  script: Latn
  content: ISO 22716:2007 gives guidelines for the production, control, storage and
    shipment of cosmetic products. These guidelines cover the quality aspects of the
    product, but as a whole do not cover safety aspects for the personnel engaged
    in the plant, nor do they cover aspects of protection of the environment. The
    guidelines in ISO 22716:2007 are not applicable to research and development activities
    and distribution of finished products.
