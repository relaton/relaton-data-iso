abstract:
- language: en
  script: Latn
  content: 'ISO/TS 21219-5:2015 establishes a method of conveying data for a wide
    range of applications that require the efficient transmission of point to multi-point
    data over potentially unreliable broadcast channels. It is also suitable for point-to-point
    and multicast applications and may easily be encapsulated in Internet Protocol.
    ISO/TS 21219-5:2015 describes the basic capabilities of the generation 2 TPEG
    (TPEG2) for providing a multiplex of TPEG Services and applications. Together
    with the definitions of the general TPEG UML modelling rules and the particular
    physical TPEG representations for TPEG- binary streams (TISA: TPEG UML Conversion
    Rules) and tpegML files (TISA Specification: TPEG UML Conversion Rules), it replaces
    the former documents TPEG-INV and TPEG-SSF.'
