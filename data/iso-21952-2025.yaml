abstract:
- language: en
  script: Latn
  content: This document specifies requirements for classification of wire electrodes,
    wires and rods for gas shielded metal arc welding and tungsten inert-gas welding
    of creep-resisting steels, and for their deposits in the as-welded or post-weld
    heat-treated condition. One wire electrode can be tested and classified with different
    shielding gases. This document is a combined specification providing for classification
    utilizing a system based upon the chemical composition of wire electrodes, wires
    and rods with requirements for yield strength and average impact energy of 47 J
    of all-weld metal, or utilizing a system based upon the tensile strength of the
    all-weld metal deposits and the chemical composition of wire electrodes, wires
    and rods. a)       Clauses, subclauses and tables which carry the suffix “system
    A” are applicable only to wire electrodes, wires, rods and deposits classified
    in accordance with the system based upon the chemical composition with requirements
    for yield strength and the average impact energy of 47 J of all-weld metal deposits
    under this document. b)       Clauses, subclauses and tables which carry the suffix
    “system B” are applicable only to wire electrodes, wires, rods and deposits classified
    in accordance with the system based upon the tensile strength of all‑weld metal
    deposits and the chemical composition of wire electrodes, wires and rods under
    this document. c)        Clauses, subclauses and tables which do not have either
    the suffix “system A” or the “system B” are applicable to all wire electrodes,
    wires, rods and deposits classified under this document.
