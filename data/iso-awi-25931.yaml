abstract:
- language: en
  script: Latn
  content: This document specifies the definitions and performance indicators of berthing
    and unberthing data elements for ships of various types and sizes operating in
    ports waters. It ensures that key data elements describing ship position, motion,
    and surrounding environment are consistently defined and evaluated. This document
    provides a unified framework for capturing and evaluating berthing and unberthing
    data elements, supporting their consistent use across manned, remotely controlled,
    and autonomous ships. It can be applied by ship designers, system and equipment
    manufacturers, ship operators, port authorities, classification societies, and
    other organizations involved in the design, deployment, testing, and verification
    of berthing and unberthing capabilities. This document does not prescribe operational
    procedures, control strategies, or decision-making criteria. It is intended solely
    to define data elements and their performance indicators, enabling designers and
    operators to select and apply the data according to specific operational requirements.
