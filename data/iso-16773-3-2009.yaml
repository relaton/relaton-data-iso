abstract:
- language: en
  script: Latn
  content: ISO 16773-3:2009 specifies a procedure for the evaluation of the experimental
    set-up used for carrying out EIS on high-impedance coated samples. For this purpose,
    dummy cells are used to simulate high-impedance coated samples. On the basis of
    the equivalent circuits described, ISO 16773-3 gives guidelines for the use of
    dummy cells to increase confidence in the test protocol, including making measurements,
    curve fitting and data presentation.
