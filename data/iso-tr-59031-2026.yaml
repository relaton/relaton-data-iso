abstract:
- language: en
  script: Latn
  content: This document provides an analysis of various case studies for the implementation
    of specific aspects of the circular economy in organizations, regardless of their
    status. This document specifically focuses on performance-based approaches such
    as functional economy, service economy, product-as-a-service (PaaS) and other
    performance-based approaches. This document mainly describes a selection of use
    cases of operational implementation of such performance-based approaches as observed
    in different organizations. It stresses the challenging context faced by concerned
    organizations in changing their economic and business models. This document depicts
    cultural, organizational and industrial changes induced by the move of business
    models toward a performance-based approach. It emphasizes to what extent the total
    economic value can increase and how this is converted into revenue streams for
    the concerned organizations. This document does not apply to the implementation
    of any circular economy domain of actions (circular design, recycling; responsible
    purchase policy, etc.), but focuses on the systemic level of development of economic
    models based on the commercialization of various performance aspects.
