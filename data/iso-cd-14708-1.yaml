abstract:
- language: en
  script: Latn
  content: ISO 14708-1:2014 specifies requirements that are generally applicable to
    active implantable medical devices. The tests that are specified in ISO 14708
    are type tests and are to be carried out on samples of an active implantable medical
    device to show compliance. ISO 14708-1:2014 is applicable not only to active implantable
    medical devices that are electrically powered but also to those powered by other
    energy sources (for example by gas pressure or by springs). ISO 14708-1:2014 is
    also applicable to some non-implantable parts and accessories of the active implantable
    medical devices.
