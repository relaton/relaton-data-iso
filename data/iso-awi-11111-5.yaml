abstract:
- language: en
  script: Latn
  content: This part of ISO 11111 is intended to be used in conjunction with ISO 11111-1. It specifies significant hazards and corresponding safety requirements and/or measures for preparatory machinery to weaving and knitting. By taking into account the scope of ISO 11111-1 as far as is relevant, this part of ISO 11111 is applicable to all machinery, plant and related equipment intended to be used for warping, beaming, sizing, size preparation and storage of warp beams, as specified in Clause 5. This part of ISO 11111 is complemented by the type C standards ISO 9902 1 and ISO 9902 2 with respect to noise emission measurement and ISO 23771 with respect to measures for the reduction of noise emissions.
