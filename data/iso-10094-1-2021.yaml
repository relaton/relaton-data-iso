abstract:
- language: en
  script: Latn
  content: 'This document specifies which characteristics of electro-pneumatic continuous
    pressure control valves are to be included in the supplier''s literature. In accordance
    with ISO 5598, these control valves include: —    electrically modulated pneumatic
    proportional pressure valves, —    proportional pressure control valves without
    electronic pressure feedback, and —    proportional pressure control valves with
    electronic pressure feedback. This document is limited to the characterization
    of components with an exhaust port to the atmosphere. NOTE 1   The characteristics
    of non-electrically modulated pneumatic pressure control valves are specified
    in ISO 6953‑1. NOTE 2   The characteristics of electro-pneumatic continuous flow
    control valves are specified in ISO 10041‑1.'
