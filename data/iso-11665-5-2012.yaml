abstract:
- language: en
  script: Latn
  content: ISO 11665-5:2012 describes continuous measurement methods for radon-222.
    It gives indications for continuous measuring of the temporal variations of radon
    activity concentration in open or confined atmospheres. ISO 11665-5:2012 is intended
    for assessing temporal changes in radon activity concentration in the environment,
    in public buildings, in homes and in work places, as a function of influence quantities
    such as ventilation and/or meteorological conditions.
