abstract:
- language: en
  script: Latn
  content: This document establishes a framework for a trustworthy environment for
    information processing and communication that protects integrity along the supply
    chain of physical and related electronic documents, products, software and services
    life cycle to mitigate product fraud and counterfeit goods, by using object identification
    techniques. This document gives guidelines to establish a framework for ensuring
    trust, interoperability and interoperation via secure and reliable electronically
    signed encoded data set (ESEDS) schemes for multi-actor applications which are
    even applicable in multi-sector environment. This document does not interfere
    with existing traceability and identification and authentication systems but is
    able to support interoperations between them by introducing an ESEDS scheme.
