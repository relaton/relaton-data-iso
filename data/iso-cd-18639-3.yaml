abstract:
- language: en
  script: Latn
  content: ISO 18639-3:2018 specifies test methods and minimum performance requirements
    for protective clothing for firefighters while engaged in rescue activities. Clothing
    related to specific rescue activities are documented in individual subclauses,
    see 6.2.1 or 6.2.2. NOTE For further guidance see ISO 18639‑1. Subclauses of this
    document cover general clothing design, the minimum performance level of the materials
    used and the methods of test for determining this performance level. ISO 18639-3:2018
    does not cover special clothing for use in other high risk situations such as
    firefighting. ISO 18639-3:2018 does not cover protection for the head, hands and
    feet or protection against other hazards, e.g. chemical, biological, radiation
    and electrical hazards, except for limited, accidental exposure to some chemicals
    and contaminated blood or other body fluids.
