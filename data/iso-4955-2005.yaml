abstract:
- language: en
  script: Latn
  content: ISO 4955:2005 specifies requirements for the grades of wrought steels which
    are usually employed for products for which the resistance to the effects of hot
    gases and the products of combustion at temperatures in the region above 550 °C
    is the main requirement. ISO 4955:2005 is applicable to flat products, bars, sections,
    wire and rod, and forgings.
