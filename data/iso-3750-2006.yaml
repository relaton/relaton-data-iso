- language: en
  script: Latn
  content: ISO 3750:2006 specifies a flame atomic absorption spectrometric method
    for the determination of magnesium in zinc alloys. It is applicable to the products
    specified in ISO 301 and ISO 752. It is suitable for the determination of magnesium
    contents (mass fractions) between 0,002 % and 0,08 %.
