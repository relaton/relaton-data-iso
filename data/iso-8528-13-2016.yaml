abstract:
- language: en
  script: Latn
  content: ISO 8528-13:2016 specifies the safety requirements for reciprocating internal
    combustion (RIC) engine driven generating sets up to 1 000 V consisting of an
    RIC engine, an alternating current (AC) generator including the additional equipment
    required for operating, e.g. controlgear, switchgear, auxiliary equipment. It
    is applicable to generating sets for land and marine use (domestic, recreational
    and industrial application). It is not applicable to generating sets used on board
    of seagoing vessels and mobile offshore units as well as on aircraft or to propel
    road vehicles and locomotives. NOTE This part of ISO 8528 does not apply to arc
    welding equipment (IEC 60974 series). The special requirements needed to cover
    operation in potentially explosive atmospheres are not covered in this part of
    ISO 8528. The hazards relevant to RIC engine driven generating sets are identified
    in Annex A. ISO 8528-13:2016 deals with the special requirements of test and safety
    design which should be observed in addition to the definitions and requirements
    in ISO 8528-1, ISO 8528-2, ISO 8528-3, ISO 8528-4, ISO 8528-5 and ISO 8528-6,
    where applicable. It specifies safety requirements in order to protect the user
    from danger.
