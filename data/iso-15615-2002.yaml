abstract:
- language: en
  script: Latn
  content: This standard lays down the general specifications, requirements and tests
    of devices located on the high-pressure side of acetylene manifold systems as
    defined in EN ISO 14114. The standard does not cover the high-pressure piping,
    flexible hoses and the regulator. NOTE The terms "upstream" and "downstream" refer
    to the normal direction of gas flow in the device.
