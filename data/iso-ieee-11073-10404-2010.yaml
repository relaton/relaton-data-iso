abstract:
- language: en
  script: Latn
  content: ISO/IEEE 11073-10404:2010 establishes a normative definition of communication
    between personal telehealth pulse oximeter devices and computer engines (e.g.,
    cell phones, personal computers, personal health appliances, set top boxes) in
    a manner that enables plug-and-play (PnP) interoperability. It leverages appropriate
    portions of existing standards including ISO/IEEE 11073 terminology, information
    models, application profile standards and transport standards. It specifies the
    use of specific term codes, formats and behaviours in telehealth environments
    restricting optionality in base frameworks in favour of interoperability. ISO/IEEE
    11073-10404:2010 defines a common core of communication functionality for personal
    telehealth pulse oximeters and addresses a need for an openly defined, independent
    standard for controlling information exchange to and from personal health devices
    and computer engines.
