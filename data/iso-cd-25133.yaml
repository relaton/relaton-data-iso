abstract:
- language: en
  script: Latn
  content: This document specifies the method of gas chromatographic determination
    of 5 chlorophenols (2-chlorophenol; 2,4-dichlorophenol; 2,4,6-trichlorophenol;
    2,3,4,6-tetrachlorophenol; pentachlorophenol) in water samples. NOTE 1 Other chlorophenols
    that is not specified in scope, it can be applied after confirming the validate.
    This document describes a liquid/solid extraction method using immersive solid
    phase extraction samplers. After sampling, retained organic compounds are released
    by thermal desorption (TD) and automatically transferred to a gas chromatography-mass
    spectrometry (GC-MS) system for analysis. This method is applicable to determination
    of chlorophenols in surface water, ground water and drinking water
