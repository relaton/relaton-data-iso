abstract:
- language: en
  script: Latn
  content: This document specifies minimum requirements and test methods for the terrestrial
    part or leaves of Epimedium brevicornu Maxim., Epimedium sagittatum (Sieb.et Zucc.)
    Maxim., Epimedium pubescens Maxim. and Epimedium koreanum Nakai. which are derived
    from wild and cultivated Epimedium Herb. This document applies to Epimedium Herb
    that are sold and used as natural medicines in international trade, including
    Chinese materia medica (whole medicinal materials) and decoction pieces derived
    from this plant.
