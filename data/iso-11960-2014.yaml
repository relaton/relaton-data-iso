abstract:
- language: en
  script: Latn
  content: 'ISO 11960:2014 specifies the technical delivery conditions for steel pipes
    (casing, tubing and pup joints), coupling stock, coupling material and accessory
    material and establishes requirements for three Product Specification Levels (PSL-1,
    PSL-2, PSL-3). The requirements for PSL-1 are the basis of ISO 11960:2014. The
    requirements that define different levels of standard technical requirements for
    PSL-2 and PSL-3, for all Grades except H-40, L-80 9Cr and C110, are contained
    in Annex H. By agreement between the purchaser and manufacturer, ISO 11960:2014
    can also be applied to other plain-end pipe sizes and wall thicknesses. ISO 11960:2014
    is applicable to the following connections in accordance with API Spec 5B: short
    round thread casing (SC); long round thread casing (LC); buttress thread casing
    (BC); non-upset tubing (NU); external upset tubing (EU); integral tubing (IJ).
    ISO 11960:2014 can also be applied to tubulars with connections not covered by
    ISO/API standards. The four groups of products to which ISO 11960:2014 is applicable
    include the following grades of pipe: Group 1: All casing and tubing in Grades
    H, J, K, N and R; Group 2: All casing and tubing in Grades C, L, M and T; Group
    3: All casing and tubing in Grade P; Group 4: All casing in Grade Q. Casing sizes
    larger than Label 1: 4-1/2 but smaller than Label 1: 10-3/4 can be specified by
    the purchaser to be used in tubing service.'
