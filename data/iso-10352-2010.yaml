abstract:
- language: en
  script: Latn
  content: ISO 10352:2010 specifies a method for the determination of the mass per
    unit area of sheet moulding compound and preimpregnated unidirectional sheet,
    tape, fabric and mats. Unless stated to the contrary in the relevant material
    specification, it is applicable to prepregs in which any type of reinforcement
    (aramid, carbon, glass, etc.) and any type of matrix (thermosetting or thermoplastic)
    has been used.
