abstract:
- language: en
  script: Latn
  content: 'ISO 17245:2015 specifies the method for high temperature corrosion testing
    of metallic materials by immersing in molten salt or other liquids which are under
    static conditions and exposing them to high temperature in a controlled gas environment
    to evaluate their corrosion resistance. Two options are considered: a) using a
    stagnant inert gas environment, and b) using a flowing reactive gas environment.
    ISO 17245:2015 does not cover methods where test pieces are fully or partially
    embedded in a corrosive powder made up of salt, ash, and/or other solids, or cases
    in which a surface deposit is applied to the specimens. These methods are covered
    in ISO 17248 and ISO 17224, respectively. ISO 17245:2015 is not applicable to
    the situation of test pieces in relative movement to their surrounding corrosive
    liquid.'
