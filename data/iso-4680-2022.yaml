abstract:
- language: en
  script: Latn
  content: The document specifies a method for undertaking uniaxial constant load
    testing of the susceptibility of a metal, or an alloy, to stress corrosion cracking
    (SCC) in high-purity water environments at high temperature (above the boiling
    point of water at normal pressures) and pressure. The test method is particularly
    applicable to simulated primary water environments of light water reactors (LWRs).
    The test method enables assessment of the relative resistance to SCC of a material
    in different environments and the comparative resistance of different materials
    (using the same environment, specimen dimensions and loading). The terms “metal”
    and “alloy”, as used in the document, include weld metals and weld heat affected
    zones.
