abstract:
- language: en
  script: Latn
  content: This document provides the main factors and the integrated working framework
    that need to be considered by stakeholders involved in the seismic protection
    of museum collections. It specifies requirements such as seismic performance indicators,
    seismic response analysis, seismic risk assessment, safety design, seismic protection
    measures, seismic risk treatment and seismic effectiveness evaluation for cultural
    heritage artefacts. This document is applicable to, but not limited to, the seismic
    protection of cultural heritage artefacts in exhibition and storage within buildings,
    as well as exhibition/storage cabinets, cases, and units. It is not applicable
    to the seismic protection of those buildings holding collections.
