abstract:
- language: en
  script: Latn
  content: This document specifies a method to evaluate the general thermal comfort
    of people in a space and the degree of discomfort (thermal dissatisfaction) of
    people exposed to moderate thermal environments. It defines the analytical determination
    and interpretation of thermal comfort using calculation of predicted mean vote
    (PMV) and predicted percentage of dissatisfied (PPD) and local thermal comfort
    criteria, giving the environmental conditions considered acceptable for general
    thermal comfort as well as those representing local discomfort. It is applicable
    to healthy men and women exposed to indoor environments where thermal comfort
    is desirable, but where moderate deviations from thermal comfort occur, in the
    design of new environments or the assessment of existing ones. Although developed
    specifically for the work environment, this document is applicable to other kinds
    of environment as well.
