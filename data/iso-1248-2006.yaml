abstract:
- language: en
  script: Latn
  content: ISO 1248:2006 specifies the requirements and the corresponding methods
    of test for all manufactured and natural iron oxide pigments, in dry form, suitable
    for general use. These pigments are identified by Colour Index Nos. red 101 and
    102, yellow 42 and 43, brown 6 and 7, and black 11, and includes rapid-dispersion
    pigments. ISO 1248:2006 does not cover micaceous iron oxide pigments, transparent
    iron oxide pigments, granular grey iron oxide or magnetic iron oxide pigments
    other than those of Colour Index Pigment black 11.
