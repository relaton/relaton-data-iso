abstract:
- language: en
  script: Latn
  content: This standard defines the procedures for the design of vertical mine shaft
    permanent lining systems and establishes the requirements for sizing the lining
    to resist applied ground pressure and/or hydrostatic loading. The standard is
    not intended to cover temporary shaft support. This standard covers the design
    of shaft linings and rehabilitation of shaft linings. Shaft linings are typically
    made of concrete, reinforced concrete, cast iron, steel, sprayed concrete (shotcrete),
    compressible materials or composite materials.
