abstract:
- language: en
  script: Latn
  content: ISO 17962:2015 specifies various means of minimizing the environmental
    effects of fan exhaust from pneumatic systems for vacuum-style sowing agricultural
    field equipment used for sowing coated seeds. It is applicable to vacuum-style
    sowing systems where "dust off" (fugitive) material from seed coatings can mix
    with fan (blower) intake air and be exhausted into the atmosphere. ISO 17962:2015
    is not applicable to - conveyance systems between a central tank and remote meters
    where the air is exhausted at the remote meters, and - conveyance systems where
    the meter is at a central tank and the air is exhaust at a ground engaging opening
    device. The design principles in this International Standard are not applicable
    to pneumatic equipment for sowing which was manufactured before the date of its
    publication. NOTE National or local requirements can apply which could be more
    stringent.
