abstract:
- language: en
  script: Latn
  content: ISO 18740:2016 applies to any fixed (constant) speed, liquid cooled, packaged
    centrifugal air compressor which incorporates a centrifugal compression element
    of any type driven by an electric motor. It defines and describes acceptance tests
    for electrically driven packaged air compressors of standard types which are constructed
    to specifications determined by the manufacturer and which are sold against performance
    data published in the manufacturer's sales documentation. NOTE Items supplied
    shipped loose for installation at site are not considered to be a part of the
    compressor package. Such compressors are designed to draw in atmospheric air from
    their immediate surroundings and the performance data offered by the manufacturer
    usually relates to a normal ambient air inlet pressure.
