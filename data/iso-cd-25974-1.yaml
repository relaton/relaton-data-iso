abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for the safety monitoring and
    risk alert systems of electric vehicle(EV) batteries, which are received via Nomadic
    & Mobile Devices. This document includes the technical requirements necessary
    for the description of use cases and the various safety monitoring and alert types
    for detecting abnormal battery conditions (e.g., temperature alerts, charging
    issues, voltage imbalance). It also defines the dataset requirements for battery
    monitoring, including key data items (e.g., battery temperature, charge status,
    charge cycle, and deterioration cell number) and the collection intervals. Battery
    design requirements, battery certification requirements, battery abuse test methods,
    thermal runaway test procedures, or mandatory battery safety thresholds within
    the scope of relevant EV battery and vehicle safety standards are excluded.
