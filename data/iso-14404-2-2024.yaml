abstract:
- language: en
  script: Latn
  content: This document specifies calculation methods to evaluate the total annual
    carbon dioxide (CO2) emissions, and the emission factor of CO2 per unit of steel
    production of the entire steel production process. This document applies to plants
    that produce mainly carbon steel. It can be used by companies using EAF to manufacture
    steel. It includes boundary definition, material and energy flow definition, and
    emission factor of CO2. Besides direct source import to the boundary, upstream
    and credit concept is applied to exhibit the plant CO2 intensity. This document
    supports steel producers to establish CO2 emissions attributable to a site. Conversion
    to energy consumption and to consumption efficiency can be obtained using Annex A.
