abstract:
- language: en
  script: Latn
  content: ISO 24370:2005 specifies a test method for determining the fracture toughness
    of monolithic ceramic materials at room temperature by the chevron-notched beam
    (CNB) method. ISO 24370:2005 is applicable to monolithic ceramics and whisker-
    or particulate-reinforced ceramics that are regarded as macroscopically homogeneous.
    It is not applicable to continuous-fibre reinforced ceramic composites. ISO 24370:2005
    is usually applicable to ceramic materials with a fracture toughness less than
    about 12 megapascal(square root metre). The test method is applicable to materials
    with a flat crack-growth resistance curve and may be applicable to materials with
    a rising crack-growth resistance curve (R-curve).
