abstract:
- language: en
  script: Latn
  content: This document specifies basic requirements for pneumatic part-turn valve
    actuators, both double acting and single acting, used for on-off and modulating
    control duties. It includes guidelines, recommendations and methods for enclosure
    and corrosion protection, control and testing. It does not apply to pneumatic
    actuators which are integral parts of control valves and to pneumatic actuators
    designed for permanent immersion in fresh or sea water. Other requirements, or
    conditions of use, different from those indicated in this document, are expected
    to be subject to negotiations, between the purchaser and the manufacturer/supplier,
    prior to order.
