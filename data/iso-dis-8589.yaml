abstract:
- language: en
  script: Latn
  content: ISO 8589 provides general guidance for the design of test rooms intended
    for the sensory analysis of products. It describes the requirements to set up
    a test room comprising a testing area, a preparation area, and an office, specifying
    those that are essential or those that are merely desirable. ISO 8589 is not specific
    for any product or test type. Although many of the general principles are similar,
    ISO 8589 does not address test facilities for the specialized examination of products
    in inspection or in-plant quality-control applications.
