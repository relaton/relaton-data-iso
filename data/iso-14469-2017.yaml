abstract:
- language: en
  script: Latn
  content: 'ISO 14469:2017 specifies CNG refuelling nozzles and receptacles constructed
    entirely of new and unused parts and materials, for road vehicles powered by compressed
    natural gas. A CNG refuelling connector consists of, as applicable, the receptacle
    and its protective cap (mounted on the vehicle) and the nozzle. ISO 14469:2017
    is applicable only to such devices designed for a service pressure of 20 MPa (200
    bar) and 25 MPa (250 bar), to those using CNG according to ISO 15403‑1 and ISO
    15403‑2 and having standardized mating components, and to connectors that prevent
    natural gas vehicles from being fuelled by dispensers with service pressures higher
    than that of the vehicle, while allowing them to be fuelled by dispensers with
    service pressures less than or equal to the vehicle fuel system service pressure.
    ISO 14469:2017 refers to service pressures of 20 MPa and 25 MPa for: - size 1:
    B200 and B250; - size 2: C200 and C250.'
