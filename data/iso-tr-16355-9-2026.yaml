abstract:
- language: en
  script: Latn
  content: This document applies the various details and case studies from ISO 16355-1
    through ISO/TR 16355-8 to a unified case study based on public information available
    from a food and beverage case study.[1] By reframing the different case studies
    into a single story, the relationships and information flows of QFD are more easily
    followed. This document briefly explains how the methods and tools of QFD and
    associated methods might work in this food and beverage study. Detailed steps
    are found in the ISO 16355 series as referenced in this document and readers are
    able to use these when implementing QFD. Users of this document include all organization
    functions necessary to assure customer satisfaction, including business planning,
    marketing, sales, research and development (R&D), engineering, information technology
    (IT), manufacturing, procurement, quality, production, service, packaging and
    logistics, support, testing, regulatory, and other phases in hardware, software,
    service, and system organizations.
