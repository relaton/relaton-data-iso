abstract:
- language: en
  script: Latn
  content: ISO 7391-2:2006 specifies the methods of preparation of test specimens
    and the test methods to be used in determining the properties of polycarbonate
    moulding and extrusion materials. Requirements for handling test material and
    for conditioning both the test material before moulding and the specimens before
    testing are given. Procedures and conditions for the preparation of test specimens
    and procedures for measuring properties of the materials from which these specimens
    are made are given. Properties and test methods which are suitable and necessary
    to characterize polycarbonate moulding and extrusion materials are listed. The
    properties have been selected from the general test methods in ISO 10350-1. Other
    test methods in wide use for or of particular significance to these moulding and
    extrusion materials are also included in this part of ISO 7391, as are the designatory
    properties specified in Part 1.
