abstract:
- language: en
  script: Latn
  content: ISO 16565:2013 specifies the methods to be used to determine the content
    of 5 ethylidenenorbornene (ENB) or dicyclopentadiene (DCPD) in ethylene-propylene-diene
    (EPDM) terpolymers in the 0,1 % to 10 % range. ENB and DCPD are dienes introduced
    into ethylene-propylene rubbers to generate specific cure properties. Since high
    precision for diene content determination is important, a Fourier transform infrared
    spectroscopic (FT IR) method is utilized.
