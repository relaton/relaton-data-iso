abstract:
- language: en
  script: Latn
  content: This document specifies requirements for calculating the carbon footprint
    specific to finfish product category rules (CFP?PCR). This methodology builds
    on the requirements of International Standards for life cycle assessment (LCA)
    and products' carbon footprints. This document is applicable to the calculation
    and communication of finfish products' carbon footprints from fishing and/or cultivation
    of feed ingredients to the consumption of finfish products. It is applicable to
    the carbon footprints of products from both fisheries and aquaculture value chains.
    This document used alone does not apply to specifying a product's overall environmental
    or sustainability characteristics.
