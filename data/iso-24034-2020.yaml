abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the classification of solid wire
    electrodes, solid wires and rods for fusion welding of titanium and titanium alloys.
    The classification is based on their chemical composition. The compositions of
    solid wire electrodes for metal inert gas (MIG) welding are the same as solid
    wire electrodes, solid wires and rods for tungsten inert gas (TIG) arc welding,
    plasma arc welding, laser beam welding, and other fusion welding processes.
