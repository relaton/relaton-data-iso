abstract:
- language: en
  script: Latn
  content: 'ISO 14932:2012 specifies four methods for the determination of the content
    of the following groups of organic peroxides used as rubber vulcanizing agents.
    There are three titration methods and one using capillary gas-chromatography as
    given below. Titration method A for group a) peroxyketals: DTBPC: 1,1-Di(tert-butylperoxy)cyclohexane;
    DBPMC: 1,1-Di(tert-butylperoxy)-2-methylcyclohexane; DBPTC: 1,1-Di(tert-butylperoxy)-3,3,5-trimethylcylcohexane;
    DBPB: 2,2-Di(tert-butylperoxy)butane; BPV: Butyl-4,4-di(tert-butylperoxy)valerate.
    Titration method B for group b) diacylperoxides: Dibenzoyl peroxide; Di(2,4-dichlorobenzoyl)
    peroxide; Di(4-methylbenzoyl) peroxide. Titration method C for group c) diaralkyl
    and alkyl-aralkyl peroxides: Di(tert-butylperoxyisopropyl)benzene; Dicumyl peroxide;
    tert-Butyl cumyl peroxide. Capillary gas-chromatography for dialkyl peroxides:
    2,5-Dimethyl-2,5-di(tert-butylperoxy)hexane.'
