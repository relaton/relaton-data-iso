abstract:
- language: en
  script: Latn
  content: 'ISO 12500-3:2009 provides a guide for choosing an appropriate method of
    determining the solid particulate removal efficiency rating by particle size of
    filters used in compressed air systems. ISO 12500-3:2009 specifies the layouts
    and procedures for testing these filters. Measurement methods are recommended
    based on the size range of the particulates that the filter being tested has been
    designed to remove. The test is performed as a “type-test” on filters as being
    representative of a range. The following two particle diameter size ranges are
    identified in ISO 12500-3:2009: a fine filter range, 0,01 < 5,0 μm, and a coarse
    filter range, ≥ 5,0 ≤ 40 μm.'
