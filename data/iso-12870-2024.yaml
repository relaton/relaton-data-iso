abstract:
- language: en
  script: Latn
  content: 'This document specifies fundamental requirements and their test methods
    for unglazed spectacle frames designed for use with prescription lenses. It is
    applicable to spectacle frames at the point of sale by the manufacturer or supplier
    to the retailer. This document is applicable to: —     all mass-produced spectacle
    frame types, including rimless mounts, semi-rimless mounts and folding spectacle
    frames; —     spectacle frames made with additive manufacturing, for example,
    3D printing; —     spectacle frames made from natural organic materials; —    
    the frame or mount of clip-ons designed specifically for attachment to particular
    models of spectacle frame, but not to their lenses or filters to which ISO 16034
    or ISO 12312-1 apply; —     prescription inserts designed for attachment to particular
    models of, for example, eye protector, sunglass or diving mask. Parts of this
    document are applicable to custom-made frames – see 3.1.3 and Table 1. NOTE           
    See Annex A for recommendations on the design of spectacle frames and terms to
    be used when describing metal frames. This document is not applicable to spectacle
    frames used in eye protection, where ISO 16321-1 applies, or to sunglasses with
    afocal filters, where ISO 12312-1 applies.'
