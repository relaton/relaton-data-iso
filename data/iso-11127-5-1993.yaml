abstract:
- language: en
  script: Latn
  content: The procedure includes weighing a test portion of approximately 100 g into
    a container, placing the container with the test portion in an oven previously
    adjusted to 110 °C, leaving for at least 1 h, transferring the container to a
    desiccator, allowing to cool to room temperature, reweighing the container with
    the dried test portion, determining the mass of the dried test portion. Annex
    A gives information on the international standards series for non-metallic blast-cleaning
    abrasives ISO 11126 and ISO 11127.
