abstract:
- language: en
  script: Latn
  content: This standard specifies the methods for determination of yttrium, gadolinium,
    neodymium, cerium, lanthanum, and praseodymium among rare earth elements in magnesium
    and magnesium alloys according to the inductively coupled plasma atomic emission
    spectrometric analysis (hereafter, referred to as the "ICP atomic emission spectrometric
    analysis"). This method meets the contents of these elements in the magnesium
    alloys recently developed, part of which have been designated in the related material
    standards.
