abstract:
- language: en
  script: Latn
  content: ISO 15536-1:2005 establishes the general requirements for the design and
    development of computer manikins, body templates and manikin systems. It addresses
    their anthropometric and biomechanical properties, taking into account their usability
    and restrictions for structural complexity and functional versatility, and is
    also intended as a guide for the selection of manikins and manikin systems and
    for the evaluation of their accuracy and usability for the specified use. It specifies
    the documentation of the characteristics of manikins and manikin systems and their
    intended use, for the guidance of their users. It provides means for ensuring
    that computer manikins and body templates for the design of work space are appropriately
    accurate and reliable in their anthropometric and biomechanical aspects. It aims
    to ensure that users of manikins are able to choose an appropriate manikin system
    for particular design tasks and use it in an appropriate way. It sets requirements
    only on the static accuracy of the manikin, but provides recommendations on the
    other factors that can influence the accuracy of the analyses and determinations
    performed using them.
