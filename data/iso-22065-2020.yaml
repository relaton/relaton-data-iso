abstract:
- language: en
  script: Latn
  content: 'This document specifies performance requirements and test methods under
    prescribed laboratory conditions for the evaluation of pumped samplers used in
    conjunction with an air sampling pump and of procedures using these samplers for
    the determination of gases and vapours in workplace atmospheres. This document
    addresses requirements for method developers and/or manufacturers. NOTE 1 For
    the purposes of this document, a manufacturer can be any commercial or non-commercial
    entity. NOTE 2 For the sampling of semi-volatile compounds which can appear as
    a mixture of vapours and airborne particles in workplace atmospheres see EN 13936.
    This document is applicable to pumped samplers and measuring procedures using
    these samplers in which sampling and analysis are carried out in separate stages.
    This document is not applicable to: — pumped samplers which are used for the direct
    determination of concentrations, for example, length-of-stain detector tubes;
    — samplers which rely on sorption into a liquid, and subsequent analysis of the
    solution (bubblers).'
