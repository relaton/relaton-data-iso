abstract:
- language: en
  script: Latn
  content: 'This document gives the safety requirements and measures for four-sided
    moulding machines, capable of continuous production use, with a maximum working
    width of 350 mm and a maximum speed of the integrated workpiece feed of 200 m/min,
    hereinafter referred to as “machines”, designed to cut solid wood and materials
    with similar physical characteristics to wood (see ISO 19085-1:2021, 3.2). It
    deals with all significant hazards, hazardous situations and events, listed in
    Annex A, relevant to the machines, when operated, adjusted and maintained as intended
    and under the conditions foreseen by the manufacturer; reasonably foreseeable
    misuse has been considered too. Also, transport, assembly, dismantling, disabling
    and scrapping phases are taken into account. It is also applicable to machines
    fitted with one or more of the following devices / additional working units, whose
    hazards have been dealt with: —    universal spindle; —    glass bead saw unit;
    —    fixed or movable workpiece support; —    quick tool changing system; —   
    laser marking unit; —    automatic workpiece returner; —    in-feed hopper; —   
    loading magazine; —    unloading table. This document does not deal with any hazards
    related to: a) in-feed devices other than in-feed hopper and loading magazine;
    NOTE 1      For mechanical in-feed devices which also prevent access to the in-feed
    opening, see 6.6.4. b) out-feed devices other than unloading table, except for
    hazards related to ejection from the machine due to climb cutting; c) out-feed
    of workpieces on machines with feed speed higher than 60 m/min; NOTE 2      Machines
    with feed speed higher than 60 m/min are usually combined with mechanical unloading
    and workpiece transfer systems. d) machines being used in combination with any
    other machine (as part of a line). It is not applicable to machines intended for
    use in potentially explosive atmosphere and to machines manufactured prior to
    its publication.'
