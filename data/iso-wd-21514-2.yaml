abstract:
- language: en
  script: Latn
  content: This document proposes the development of an ISO international standard
    for requirements for establishing, developing, implementing, evaluating, maintaining
    and continually improving project, programme and portfolio management and related
    governance (“the project environment”) within the context of an organization.
    The ISO standard will help organizations to govern, manage and support projects,
    programmes or portfolios responsibly in pursuing its objectives and to meet applicable
    obligations and specific requirements related to interested parties and expectations,
    giving them confidence and providing evidence through conformity assessment (e.g.,
    for certification). This document will focus on what needs to be achieved, not
    how to achieve it, so it will provide a management framework that serves as an
    umbrella for all types of projects, programmes and portfolios. What will be certified
    are not the individual projects, programmes and portfolios, but the organization's
    ability to manage and govern the project environment for the successful realization
    of their projects, programmes and portfolios. The scope of the new standard is
    expected to align with the related ISO/TC 258 21500 series of standards, such
    as it adapts from those guidance-based standards the various concepts that are
    considered to be essential requirements, as applicable. Given the scope’s general
    alignment to the ISO 21500 series, it gives users the flexibility to apply either
    the guidance in the current standards or the requirements in this proposed standard,
    as applicable to their organization. The ISO standard is intended to be applicable
    to all organizations (including temporary organisations, like joint ventures),
    regardless of type, size and nature of activity, and whether in the public, private
    or not-for-profit sectors that manage projects, programmes and portfolios.
