abstract:
- language: en
  script: Latn
  content: ISO 9680:2007 specifies requirements and test methods for operating lights
    used in the dental office and intended for illuminating the oral cavity of patients.
    It also contains specifications on manufacturers' instructions, marking and packaging.
    ISO 9680:2007 applies to operating lights that are intended to be permanently
    fixed to the ceiling, or to the wall or to the floor.
