abstract:
- language: en
  script: Latn
  content: This document specifies a method for determining the non-volatile-matter
    content by mass of paints, varnishes, binders for paints and varnishes, polymer
    dispersions and condensation resins such as phenolic resins (resols, novolak solutions
    etc.). The method is also applicable to formulated dispersions containing fillers,
    pigments and other auxiliaries (e.g. thickeners, film-forming agents). NOTE 1
    The non-volatile-matter content of a product is not an absolute quantity but depends
    upon the temperature and period of heating used for the determination. Consequently,
    when using this method, only relative and not true values for non-volatile-matter
    content are obtained owing to solvent retention, thermal decomposition and evaporation
    of low molecular mass constituents. The method is therefore primarily intended
    for testing different batches of the same type of product. NOTE 2 This method
    is suitable for synthetic rubber lattices, provided heating for a specific period
    of time is considered appropriate (ISO 124 specifies heating until the loss in
    mass of a 2 g test portion following successive periods of heating is less than
    0,5 mg). NOTE 3 In-house methods for determining non-volatile matter often include
    drying with infrared or microwave radiation. Standardization of such methods is
    not possible, since they are not generally applicable. Several polymer compositions
    tend to decompose during such treatment and therefore give incorrect results.
