abstract:
- language: en
  script: Latn
  content: This document defines terms relating to corrosion that are widely used
    in modern science and technology. In addition, some definitions are supplemented
    with short explanations. Throughout the document, International Union of Pure
    and Applied Chemistry rules for electrode potential signs are applied. The term
    “metal” is also used to include alloys and other metallic materials. Terms and
    definitions related to the inorganic surface treatment of metals are given in
    ISO 2080.
