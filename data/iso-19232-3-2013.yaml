abstract:
- language: en
  script: Latn
  content: ISO 19232-3:2013 specifies the minimum image quality values to ensure a
    uniform radiographic quality. It applies to the two types of image quality indicator
    as detailed in ISO 19232-1 for wire-type IQI and ISO 19232-2 for step/hole-type
    IQI and for the two techniques described in ISO 5579. Values are specified for
    the two classes of radiographic technique specified in ISO 5579.
