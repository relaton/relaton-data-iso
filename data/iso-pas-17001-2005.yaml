abstract:
- language: en
  script: Latn
  content: ISO/PAS 17001:2005 contains principles and requirements for the element
    of impartiality as it relates to standards for conformity assessment. It is an
    internal tool for use in the ISO/IEC standards development process by ISO/CASCO
    working groups when considering the element of impartiality in preparation of
    their documents. ISO/PAS 17001:2005 is not a stand-alone normative document to
    be used directly in conformity assessment activities.
