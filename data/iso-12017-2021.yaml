abstract:
- language: en
  script: Latn
  content: This document specifies the test methods for quality control of poly(methyl
    methacrylate) (PMMA) extruded double- and triple-skin flat sheets, obtained from
    colourless and coloured transparent, translucent and opaque grades of materials.
    The minimum sheet width is 600 mm. The main applications of these sheets are in
    building and agriculture (greenhouses).
