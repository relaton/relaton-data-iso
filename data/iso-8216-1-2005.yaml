abstract:
- language: en
  script: Latn
  content: ISO 8216-1:2005 establishes the detailed classification of marine fuels
    within class F (Petroleum fuels). It is intended to be read in conjunction with
    ISO 8216-99. All fuels for marine applications may be used for many similar but
    differing purposes in ships. Many marine fuels, being based on crude oil residue,
    defy specific definition but nevertheless can be categorized within the scope
    of ISO 8216-1:2005.
