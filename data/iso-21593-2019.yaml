abstract:
- language: en
  script: Latn
  content: This document specifies the design, minimum safety, functional and marking
    requirements, as well as the interface types and dimensions and testing procedures
    for dry-disconnect/connect couplings for LNG hose bunkering systems intended for
    use on LNG bunkering ships, tank trucks and shore-based facilities and other bunkering
    infrastructures. It is not applicable to hydraulically operated quick connect/disconnect
    couplers (QCDC) used for hard loading arms, which is covered in ISO 16904. Based
    on the technology used in industrial manufacturing at the time of development
    of this document, it is applicable to sizes of couplings ranging from DN 25 to
    DN 200.
