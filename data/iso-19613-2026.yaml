abstract:
- language: en
  script: Latn
  content: This document specifies a method for measurement of the viscosity of a ceramic slurry using a rotational viscometer. The method only involves rotations with a monotonic angle variation. This document does not apply to measurements using an oscillating rotation. Ceramic slurry is used in ceramic processes such as dip coating, spray coating, screen printing, slip casting, tape casting, spray drying and polishing. This document does not apply to dispersion of fillers in molten thermoplastic polymers.
