abstract:
- language: en
  script: Latn
  content: The purpose of this document is to provide a uniform standard for monorail
    beams and padeyes when these structures are designed and constructed in offshore
    projects. This document specifies the design and material requirements for mechanical
    handling including monorail beams and padeyes during operations of offshore facilities.
    This document specifies the standard shapes and dimensions of monorail beams and
    padeyes and provides material requirements for these bulk materials. This document
    is applicable to the structures of monorail beams and padeyes for topside systems
    for fixed or floating offshore projects.
