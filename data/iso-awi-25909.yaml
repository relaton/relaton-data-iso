abstract:
- language: en
  script: Latn
  content: This document specifies the interface specifications for multi-copter uncrewed
    aircraft docking system, which applies to maximum take-off mass (MTOM) level I
    through IV according to ISO 21895. It includes physical connection, data exchange,
    communication protocols, and security requirements This document is applicable
    to the design and manufacture of efficient connections and compatibility between
    docking systems and UAs from different manufacturers. It does not cover the functional
    and performance requirements of the docking system itself.
