abstract:
- language: en
  script: Latn
  content: 'This document stipulates measures as well as requirements in respect to
    performance and safety for winches that are used in agriculture and forestry for
    logging and skidding work. It applies to permanently mounted and removable winches
    and their components, which are mounted on mobile and self-propelled forestry
    machines as defined in ISO 6814:2009, as well as to winches for forestry mounted
    on agricultural tractors that are used for forestry work. The document also applies
    to capstan winches and winches using driving sheaves or driving pulleys for forestry.
    It does not apply to winches: —      that are used for hoisting or lifting operations;
    —      that are used in draglines; —      that are used in in yarders, unless
    winches according to 5.17; —      designed for traction aid purposes; —      using
    operating and control voltages > 42 V; —      that are used with log splitters
    according to EN 609-1. It applies exclusively to winches that are used for dragging
    loads on horizontal and inclined ground during logging operations or which are
    used to support tree felling work. The significant hazards included in this document
    are identified in Annex A. This document is not applicable to winches manufactured
    before the date of its publication.'
