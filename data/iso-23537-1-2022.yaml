abstract:
- language: en
  script: Latn
  content: This document specifies the requirements, test methods and other provisions
    for the labelling of adult sized sleeping bags for use in sports and leisure time
    activities at a limit temperature ≥ ‐20 °C regarding thermal characteristics,
    dimensions and mass. This document describes a method for the assessment of performance
    in steady‐state conditions of a sleeping bag with regard to the protection against
    cold. NOTE 1    Sleeping bags without homogeneous fillings designed to provide
    local extra insulation in certain parts pose issues with the calibration and/or
    test procedure. Ongoing work continues to provide suitable means of establishing
    temperature ratings. This document does not apply to sleeping bags intended for
    specific purpose such as military use and extreme climate zone expedition. It
    does not apply to sleeping bags for children or babies. NOTE 2    No prediction
    model exists for the determination of the limiting temperatures based on the thermal
    resistance of the sleeping bag for children and babies. Moreover, such a model
    for testing cannot be developed because the necessary controlled sleep trials
    with children or babies in climatic chambers are, out of ethical reasons, not
    possible.
