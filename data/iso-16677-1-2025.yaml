abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the biobanking of animal germplasm,
    e.g. semen, embryos, oocytes, gonads and related tissue, including reception,
    preparation, quality control, storage and distribution. This document is applicable
    to animal species for food and agriculture. This document is applicable to all
    organizations performing biobanking of animal biological material and associated
    data, such as public or private gene banks and germplasm livestock collections
    centres. NOTE            International, national or regional regulations or requirements,
    or combinations of them, can also apply to specific topics covered in this document.
