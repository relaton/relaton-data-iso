abstract:
- language: en
  script: Latn
  content: This document establishes requirements and recommendations for the operation
    of the anaerobic digestion of sludge in order to support safe and sufficient operation
    of anaerobic digestion facilities to produce to produce sufficient biogas and
    control by-products qualities. In particular, conditions to optimize mixing within
    the reactor and appropriate control systems management for safe and reliable operation
    are described in this document. Performance of the processes in terms of biogas
    and digestate production are presented depending on type of technologies available
    on the market. Blending sludge with waste (co-substrate) and mixing the sludge
    with organic wastes to increase digester loading are also considered. This document
    is applicable to decision-makers and operators in charge of an anaerobic digestion
    system.
