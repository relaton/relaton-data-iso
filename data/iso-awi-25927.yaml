abstract:
- language: en
  script: Latn
  content: 'This document specifies a process for generating test scenarios for collision
    avoidance of Maritime Autonomous Surface Ships (MASS, covering remote operation
    and autonomous navigation modes), including general processes, core elements and
    evaluation indicators, to provide a unified basis for the verification of MASS
    collision avoidance functions. This framework is applicable to collision avoidance
    tests in both simulation and real-ship environments, covering open waters and
    restricted waters (e.g., ports, narrow channels), and includes typical encounter
    situations conforming to the 1972 Convention on the International Regulations
    for Preventing Collisions at Sea (COLREGs) such as head-on, crossing, and overtaking.
    It supports the verification of navigation sensor data interaction and collision
    avoidance decision-making functions. This document clarifies the parameterization
    method of scenario elements and optional sampling methods, aiming to achieve comprehensive
    evaluation of collision avoidance system functions and performance with a small
    number of samples. This document does not specify detailed technical performance
    indicators of MASS or technical parameters of individual sensors, but only serves
    as a foundational guiding standard for collision avoidance test scenario generation.
    NOTE 1: The core elements in this document are extracted based on the Operational
    Design Domain (ODD) of MASS, following the principle of "ODD boundaries - parameterized
    modeling - scenario adaptation"; ODD definition and division refer to CCS Rules
    for MASS.'
