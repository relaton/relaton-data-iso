abstract:
- language: en
  script: Latn
  content: ISO 3327:2009 specifies a method for the determination of the transverse rupture strength of hardmetals. This method is applicable to hardmetals of negligible ductility. If it is used for hardmetals showing significant plastic deformation before breaking, incorrect results may be obtained. In such cases, the method may be used for comparison purposes only.
