abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the preparation of fused beads
    for the chemical analysis of silicon carbide containing samples using X-ray fluorescence
    (XRF). The test methods described in this document are for silicon carbide and
    silicon carbide materials; however, the principles described can be applied to
    other reduced materials such as boron carbide, boron nitride, ferroalloys, sialons
    and silicon nitride using the modifications given in Annex A. Fused cast beads
    of the samples prepared in accordance with this document are analysed in accordance
    with ISO 12677.
