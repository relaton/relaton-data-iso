abstract:
- language: en
  script: Latn
  content: 'ISO 3758:2012 establishes a system of graphic symbols, intended for use
    in the marking of textile articles, and for providing information on the most
    severe treatment that does not cause irreversible damage to the article during
    the textile care process, and specifies the use of these symbols in care labelling.
    The following domestic treatments are covered: washing, bleaching, drying and
    ironing. Professional textile care treatments in dry and wet cleaning, but excluding
    industrial laundering, are also covered. However, it is recognized that information
    imparted by the domestic symbols will also be of assistance to the professional
    cleaner and launderer. ISO 3758:2012 applies to all textile articles in the form
    in which they are supplied to the end user.'
