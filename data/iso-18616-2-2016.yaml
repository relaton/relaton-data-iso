abstract:
- language: en
  script: Latn
  content: ISO 18616-2:2016 specifies the test methods for handling and managing reusable,
    rigid plastic distribution boxes. These boxes are based on the modular area 600
    mm × 400 mm, 600 mm × 500 mm, 550 mm × 366 mm and subdivisions of them. ISO 18616-2:2016
    is designed for general purpose applications in a returnable transport system.
    For automotive industry application, ISO 19709‑1, ISO/TS 19709-2 and ISO/TS 19709-3
    can be referenced.
