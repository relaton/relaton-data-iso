abstract:
- language: en
  script: Latn
  content: ISO 12151-5:2007 specifies the general and dimensional requirements for
    the design and performance of 37° flared hose fittings in accordance with ISO
    8434-2, made of carbon steel, for nominal hose sizes of 6,3 mm through 51 mm inclusive
    in accordance with ISO 4397. These hose fittings are for use in hydraulic fluid
    power systems with hose that meets the requirements of the respective hose standards
    and in general applications with suitable hose.
