abstract:
- language: en
  script: Latn
  content: ISO 7539-6:2002 covers procedures for designing, preparing and using pre-cracked
    specimens for investigating susceptibility to stress corrosion. It gives recommendations
    for the design, preparation and use of pre-cracked specimens for investigating
    susceptibility to stress corrosion. The term "metal" as used in this part of ISO
    7539 includes alloys. Because of the need to confine plasticity at the crack tip,
    pre-cracked specimens are not suitable for the evaluation of thin products such
    as sheet or wire and are generally used for thicker products including plate bar
    and forgings. They can also be used for parts joined by welding.
