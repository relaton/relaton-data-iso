abstract:
- language: en
  script: Latn
  content: This document specifies the position of laboratory test specimens within
    a piece of leather and the method of labelling and marking the laboratory test
    specimens for future identification. In addition, this document specifies the
    design of press knives for cutting test pieces and the preparation of test pieces.
    It is applicable to all types of leather derived from mammals, irrespective of
    the tanning used. It is not applicable to leathers derived from birds, fish, reptiles
    or furs.
