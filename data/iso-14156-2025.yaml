abstract:
- language: en
  script: Latn
  content: This document specifies methods for the extraction or separation of a representative
    part of the fat, containing lipids and liposoluble compounds, from milk and milk
    products. The method is applicable to the methods described in ISO 12078 | IDF
    159, ISO 15884 | IDF 182, ISO 15885 | IDF 184 and ISO 18252 | IDF 200. NOTE           
    Free fatty acids are not part of extracted fat as described in methods for the
    fat determination in milk, condensed milk, dried milk products, cream and fermented
    milk.
