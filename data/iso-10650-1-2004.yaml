abstract:
- language: en
  script: Latn
  content: ISO 10650-1:2004 specifies requirements and test methods for powered polymerization
    activators in the blue wavelength region intended for chair-side use in polymerization
    of dental polymer-based materials. ISO 10650-1:2004 applies to powered tungsten-halogen
    lamps and rechargeable battery-powered tungsten-halogen polymerization activators.
    ISO 10650-1:2004 is not applicable to powered polymerization activators used in
    laboratory fabrication of indirect restorations, veneers, dentures or other oral
    dental appliances. ISO 10650-1:2004 takes priority over IEC 60601-1:1988 where
    specified in the individual clauses of this International Standard.
