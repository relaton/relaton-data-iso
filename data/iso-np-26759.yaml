abstract:
- language: en
  script: Latn
  content: This document specifies the technical requirements for the design, manufacturing
    and inspection of installation platforms for membrane-type cargo containment systems
    of liquefied natural gas (LNG) carriers, including aspects of layout, retractable
    functions, load-bearing capacity, structural safety, and components. This document
    is applicable to installation platforms for membrane-type cargo containment systems
    (Type A, Type B, and their derivatives) used in various LNG carriers, LNG bunkering
    vessels, and LNG fuel tanks for LNG-powered vessels.
