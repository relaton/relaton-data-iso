abstract:
- language: en
  script: Latn
  content: 'This document specifies the electrostatic discharge (ESD) test methods
    necessary to evaluate electronic modules intended for vehicle use. It applies
    to discharges in the following cases: —     ESD in assembly; —     ESD caused
    by service staff; —     ESD caused by occupants. This document describes test
    procedures for evaluating both electronic modules on the bench and complete vehicles.
    This document applies to all types of road vehicles regardless of the propulsion
    system (e.g. spark-ignition engine, diesel engine, electric motor). The test for
    electronic modules on the bench described in this document applies to any DUT
    (powered by an unshielded power system, DUT powered by a shielded power system,
    self-powered DUT, etc.). This document does not apply to pyrotechnic modules.'
