abstract:
- language: en
  script: Latn
  content: 'This document defines a framework for the extensible registration of information — an
    approach used to manage an information register. This framework specifies the
    following requirements of an information register: capability requirements that
    an information register uses to manage register content; governance requirements
    that define a set of processes and rules used in the establishment, management,
    operation, content publication and use of an information register. The following
    considerations are out of scope of this document: implementation details for the
    realization of an information register; content and related definitions that are
    managed within an information register.'
