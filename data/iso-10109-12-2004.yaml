abstract:
- language: en
  script: Latn
  content: ISO 10109-12:2004 details the general conditions of transport that are
    not under the control of the manufacturer, from manufacturers to customers for
    optical instruments and instruments with optical components. It deals with the
    requirements to be met by commercial packaging of instruments during transport
    from manufacturers to customers in order that the optical, mechanical, chemical
    and electrical properties or the performance be unaffected. Transport from the
    manufacturer to the customer, as defined by ISO 10109-12:2004, comprises all steps
    and procedures the instrument may be subject to during transport from the moment
    it leaves the place of manufacture until it reaches its final destination (end
    user), including transport by parcel services, road, rail, sea or air etc. (all
    of which are beyond the control of the manufacturer) and including all intermediate
    steps such as e.g. loading, unloading, packing or unpacking. It does not apply
    to the transport of instruments while they are in use by customers.
