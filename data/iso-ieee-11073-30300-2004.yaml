abstract:
- language: en
  script: Latn
  content: ISO/IEEE 11073-30300:2004 defines an IrDA-based transport profile for medical
    device communication that uses short-range infrared, as a companion standard to
    ISO/IEEE 11073-30200, which specifies a cable-connected physical layer. ISO/IEEE
    11073-30300:2004 also supports use cases consistent with industry practice for
    handheld personal digital assistants (PDAs) and network APs that support IrDA-infrared
    communication.
