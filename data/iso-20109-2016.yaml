abstract:
- language: en
  script: Latn
  content: ISO 20109:2016 specifies requirements for equipment used for simultaneous
    interpreting. Accessibility requirements are defined in Annex A. Requirements
    for booths furniture are defined in Annex B. Requirements on the system operation
    are defined in Annex C. In conjunction with either ISO 2603 or ISO 4043, ISO 20108
    and this document provide the relevant requirements both for the quality and transmission
    of sound and image provided to interpreters and for the equipment needed in the
    booths.
