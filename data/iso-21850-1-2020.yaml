abstract:
- language: en
  script: Latn
  content: This document specifies stainless steel commonly used in manufacturing
    dental instruments. It is applicable to stainless steel materials used to manufacture
    either an entire instrument or a part of the instrument. It is applicable to single-use
    and reusable dental instruments, whether it is or it is not connected to a power-driven
    system. This document is not applicable to devices and instruments used long-term
    in the mouth of the patient (e.g. crown, bridges, implants) or to devices and
    instruments not made of stainless steel. It contains a current selection of stainless
    steels suitable for use in the manufacture of dental instruments.
