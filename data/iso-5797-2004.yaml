abstract:
- language: en
  script: Latn
  content: ISO 5797:2004 provides requirements for windows and side scuttles for fire-resistant
    constructions for installation in A class and B class divisions as defined in
    FTP Code, Part 3 (IMO Res. A 754 (18)). It lays down the requirements for the
    construction of glass panes and frames, as well as the testing and marking of
    such windows and side scuttles.
