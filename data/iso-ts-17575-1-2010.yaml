abstract:
- language: en
  script: Latn
  content: 'ISO/TS 17575‑1:2010 defines the format and semantic of the data exchange
    between a Front End (OBE plus optional proxy) and corresponding Back Ends in autonomous
    toll regimes. ISO/TS 17575‑1:2010 deals with the definition of the data elements
    used to report charging details from the Front End to the CE and to receive data
    which can be used to re-configure the ongoing process of gathering charge relevant
    information in the Front End. The data defined in ISO/TS 17575‑1:2010 is used
    to generate charge reports that contain information about the road usage of a
    vehicle for certain time intervals. The contents of these charge reports might
    vary between toll regimes. A toll regime comprises a set of rules for charging,
    including the charged network, the charging principles, the liable vehicles and
    a definition of the required contents of the charge report. The data defined in
    ISO/TS 17575‑1:2010 are exchanged using an open definition of a communication
    stack as defined in ISO/TS 17575‑2. The definitions in ISO/TS 17575‑1:2010 comprise:
    reporting data, i.e. data for transferring road usage data from Front End to Back
    End, including a response from the Back End towards the Front End; contract data,
    i.e. data for identifying contractually essential entities; road usage data, i.e.
    data for reporting the amount of road usage; account data for managing a payment
    account; versioning data; compliance checking data, i.e. data imported from ISO/TS
    12813, which are required in Compliance Checking Communications.'
