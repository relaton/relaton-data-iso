abstract:
- language: en
  script: Latn
  content: ISO 15616-2:2003 is applicable to the measurement of the precision of the
    manipulation system, the positioning accuracy, the repeatability of positioning
    and the trajectory exactness for the acceptance testing of CO2-laser beam machines
    for high quality welding and cutting in two operation directions in accordance
    with ISO 15616-1:2003. This International Standard specifies testing procedure
    and equipment and establishes a classification system for the motion system related
    to the required precision for the application being used.
