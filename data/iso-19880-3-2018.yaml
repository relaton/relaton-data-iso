abstract:
- language: en
  script: Latn
  content: 'This document provides the requirements and test methods for the safety
    performance of high pressure gas valves that are used in gaseous hydrogen stations
    of up to the H70 designation. This document covers the following gas valves: -
    check valve; - excess flow valve; - flow control valve; - hose breakaway device;
    - manual valve; - pressure safety valve; - shut-off valve.'
