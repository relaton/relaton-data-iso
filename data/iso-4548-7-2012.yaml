abstract:
- language: en
  script: Latn
  content: ISO 4548.7:2012 specifies a method of testing the constructional integrity
    of full-flow lubricating oil filters to withstand engine vibrations. This test
    is intended for application to spin-on type filters and detachable filters with
    disposable elements with a maximum flow rate of 100 l/min. This test method is
    intended for test parts made from materials that do not experience mechanical
    property changes within the temperature range experienced in service. The test
    may be applied to other filters if thought applicable by agreement between the
    filter manufacturer and the purchaser.
