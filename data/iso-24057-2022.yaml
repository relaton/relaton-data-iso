abstract:
- language: en
  script: Latn
  content: This document specifies requirements for equipment, survey procedure, data
    analysis and reporting of array measurement of microtremors which is one of the
    non-destructive testing methods with an array of sensors deployed on the ground
    surface. This document applies to the array measurement of microtremors to estimate
    a 1D shear wave velocity profile. This document specifically describes array measurement
    of microtremors using vertical ground vibration to estimate an S-wave velocity
    profile by processing microtremor records based on the fundamental mode of Rayleigh
    waves.
