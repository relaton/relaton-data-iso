abstract:
- language: en
  script: Latn
  content: 'ISO 12217-3:2013 specifies methods for evaluating the stability and buoyancy
    of intact (i.e. undamaged) boats. The flotation characteristics of craft vulnerable
    to swamping are also encompassed. The evaluation of stability and buoyancy properties
    using ISO 12217-3:2013 will enable the boat to be assigned to a design category
    (C or D) appropriate to its design and maximum load. ISO 12217-3:2013 is applicable
    to boats of hull length less than 6 m, whether propelled by human or mechanical
    power, except habitable sailing multihulls. Boats of hull length less than 6 m
    which are fitted with a full deck and quick-draining cockpit(s) complying with
    ISO 11812 may alternatively be assessed using ISO 12217-1 or ISO 12217-2 (for
    non-sailing and sailing boats, respectively), in which case higher design categories
    may be assigned. In relation to habitable multihulls, ISO 12217-3:2013 includes
    assessment of vulnerability to inversion, definition of viable means of escape
    and requirements for inverted flotation. ISO 12217-3:2013 excludes: inflatable
    and rigid-inflatable boats covered by ISO 6185, except for references made in
    ISO 6185 to specific clauses of ISO 12217; personal watercraft covered by ISO
    13590 and other similar powered craft; aquatic toys; canoes and kayaks; gondolas
    and pedalos; sailing surfboards; surfboards, including powered surfboards; hydrofoils,
    foil stabilized boats and hovercraft when not operating in the displacement mode
    (displacement mode means that the boat is not only supported by hydrostatic forces);
    and submersibles. It does not include or evaluate the effects on stability of
    towing, fishing, dredging or lifting operations, which need to be separately considered
    if appropriate.'
