abstract:
- language: en
  script: Latn
  content: This document establishes a general methodology for information exchange
    supporting the interoperability of circular economy related information, based
    on the use of a product circularity data sheet (PCDS). This document specifies
    requirements for completing a PCDS by an organization, regardless of its type,
    size and nature, when acquiring or supplying products in order to permit the exchange
    of circular economy related information about those products, without disclosing
    confidential business information. This document also specifies requirements for
    the reporting format to be used when creating a PCDS template, based on the selection
    and use of various product circularity statements, according to the characteristics
    of the product. In addition, this document gives guidance on managing and sharing
    a PCDS, as well as guidance on creating a PCDS template.
