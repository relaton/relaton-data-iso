abstract:
- language: en
  script: Latn
  content: ISO 14451-7:2013 specifies the types and order of tests to be applied to
    the seatbelt pretensioners and sets out the associated acceptance criteria and
    means of categorization. ISO 14451-7:2013 applies to type tests. ISO 14451-7:2013
    is not applicable to articles containing military explosives or commercial blasting
    agents except for black powder or flash composition.
