abstract:
- language: en
  script: Latn
  content: 'ISO 3493:2014 defines the most commonly used terms relating to vanilla.
    It is applicable to the following species of vanilla plants: Vanilla fragrans
    (Salisbury) Ames, syn. Vanilla planifolia Andrews, commercially known under various
    names associated with the geographical origin, such as Bourbon, Indonesia and
    Mexico; Vanilla tahitensis J.W. Moore; certain forms obtained from seeds, possibly
    hybrids, of Vanilla fragrans (Salisbury) Ames. It is not applicable to Vanilla
    pompona Schiede (Antilles vanilla).'
