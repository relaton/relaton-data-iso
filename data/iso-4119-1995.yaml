abstract:
- language: en
  script: Latn
  content: Cancels and replaces the first edition (1978). Specifies a method for determining
    the stock concentration of aqueous pulp suspensions. Used in laboratory procedures
    for the determination of other pulp properties and is referred to in a range of
    other ISO standards where pulp suspensions are involved. Not intended for determining
    the saleable mass of slush pulps. In principle, applicable to all kinds of aqueous
    pulp suspensions.
