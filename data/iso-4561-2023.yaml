abstract:
- language: en
  script: Latn
  content: 'This document establishes the classification, by quality, of raw parquet
    elements intended for the manufacture of strips for different types of parquet
    floorings of the following wood species: —    oak (Quercus sp.), —    beech (Fagus
    sylvatica sp.), —    birch (Betula sp.), —    maple (Acer sp.), —    fir (Abies
    sp.), and —    spruce (Picea sp.).'
