abstract:
- language: en
  script: Latn
  content: This document, in conjunction with ISO 11299‑1, specifies requirements
    and test methods for close-fit lining systems intended to be used for the renovation
    of gas supply networks. It applies to pipes and fittings, as manufactured, as
    well as to the installed lining system. It is applicable to polyethylene (PE)
    pipe of either solid wall single layer or co-extruded layer construction, which
    is reduced in the factory or on site to provide a close-fitting independent or
    interactive pressure pipe liner, as well as associated fittings and joints for
    the construction of the lining system. This document is not applicable for coated
    PE pipes having a peelable, contiguous, thermoplastics additional layer on the
    outside of the pipes. It is applicable to PE pipes, fittings and assemblies intended
    to be used at an operating temperature of 20 °C as the reference temperature.
    NOTE For other operating temperatures, guidance is given in ISO 4437‑5:2014.
