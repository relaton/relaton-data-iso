abstract:
- language: en
  script: Latn
  content: Specifies the strength requirements to be met by mechanical coupling devices.
    Applies to trailers or caravans of categories 01 and 02 in the case of ball couplings
    in accordance with ISO 1103 and a static load in accordance with ISO/TR 4114.
    The values adopted in ISO 8704 are derived from road tests. These tests revealed
    the existence of forces as depicted in the distribution diagram in figure 0.1.
