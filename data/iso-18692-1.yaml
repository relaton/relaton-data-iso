abstract:
- language: en
  script: Latn
  content: This document specifies the main characteristics and test methods of new
    fibre ropes used for offshore station keeping. Fibre ropes for stationkeeping
    can be manufactured from different rope core material. This document provides
    general requirements applicable to all materials. The subsequent parts of the
    ISO 18692 series provide the specific requirements for each (rope core) material
    that are not addressed within this document.
