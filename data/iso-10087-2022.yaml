abstract:
- language: en
  script: Latn
  content: 'This document establishes a coding system to achieve identification of
    any small craft in terms of: a) identification code of the country of the manufacturer
    of the craft; b) identification code of the manufacturer; c) serial number; d)
    month and year of manufacture; e) model year. This document is applicable to small
    craft of all types and materials, of hull length, LH, up to 24 m.'
