abstract:
- language: en
  script: Latn
  content: 'This document specifies particular requirements for safety, construction
    and materials of household gas surface cooking appliances. For general requirements
    for safety, construction and materials of gas hobs, see ISO/TS 21364-1:2021. This
    document covers the following: —    surface cooking appliances: —    hobs; —   
    surface grills; —    griddles; being built-in, part of a cooking appliance or
    table top; —    hobs accessories. It does not cover surface cooking appliances
    intended for outdoor use and/or commercial use as well as electrical heated elements
    as part of the appliance. It also does not cover appliances with automatic burner
    control systems. NOTE 1    For requirements of electrical safety refer to the
    IEC 60335 standard series. NOTE 2    Attention is drawn to the fact that —    
    for appliances intended to be used in vehicles or on board of ships or aircrafts,
    additional requirements could be necessary; —     in many countries additional
    requirements are specified by the national health authorities, the national water
    supply authorities and similar authorities. This document does not cover requirements
    relating to gas cylinders, their pressure regulators and their connections. This
    document does not cover requirements for gas installation.'
