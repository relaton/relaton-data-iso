abstract:
- language: en
  script: Latn
  content: This document specifies performance and design requirements for air quality
    control systems for operator enclosures and their monitoring devices. The design
    specifications are universal in their application and do not contemplate specific
    mining environments. They are intended to meet identified parameters of both pressurization
    and respirable particulate and carbon dioxide concentrations. This document also
    specifies test methods to assess such parameters and provides operational and
    maintenance instructions. Recommendations are made for operational integration
    of the air quality control system. Gases and vapours that can be a hazard in the
    work environment outside of the operator enclosure are excluded from this document.
