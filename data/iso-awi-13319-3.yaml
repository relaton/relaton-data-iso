abstract:
- language: en
  script: Latn
  content: This document specifies the method and procedure for measuring particle
    size distribution and concentration of particles dispersed in an electrolyte using
    resistive pulse sensing (RPS) with fixed geometry apertures. This method is applicable
    to particles in the size range of approximately 15 nm to 2000 nm, and to particle
    number concentrations in the range of approximately 1×10⁶ to 1×10¹² particles
    per millilitre.
