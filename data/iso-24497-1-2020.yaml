abstract:
- language: en
  script: Latn
  content: 'This document specifies terms and definitions for non-destructive testing
    (NDT) by the technique of metal magnetic memory (MMM) as well as general requirements
    for application of this technique of the magnetic testing method. The terms specified
    in this document are mandatory for application in all types of documentation and
    literature of non-destructive testing, using the metal magnetic memory technique.
    This NDT technique has the following objectives: — determination of the heterogeneity
    of the magneto-mechanical state of ferromagnetic objects, detection of defect
    concentration and boundaries of metal microstructure heterogeneity; — determination
    of locations with magnetic stray field aberrations for further microstructural
    analysis and/or non-destructive testing and evaluation; — early diagnostics of
    fatigue damage of the inspected object and evaluation of its structural life time;
    — quick sorting of new and used inspection objects by their magnetic heterogeneity
    for further testing; — efficiency improvement of non-destructive testing by combining
    metal magnetic memory testing with other NDT methods or techniques (ultrasonic
    testing, x-ray, etc.) by fast detection of the most probable defect locations;
    — quality control of welded joints of various types and their embodiment (including
    contact and spot welding). See ISO 24497-2 for details of this application.'
