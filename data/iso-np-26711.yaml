abstract:
- language: en
  script: Latn
  content: The document specifies principles and requirements for the use of protective
    products for the conservation of cultural heritage objects, with particular attention
    to outdoor atmospheric conditions. It provides methodologies for the assessment
    of the performance of protective products applied on stone and other inorganic
    porous materials both in laboratory and on-site. It provides measurements of several
    parameters for the assessment of the durability of the protective products performance
    over time in real conditions as well as in laboratory conditions by accelerated
    ageing test.
