abstract:
- language: en
  script: Latn
  content: ISO 9038:2013 specifies a pass/fail procedure, at temperatures up to 100
    °C, to determine whether or not a liquid product, that would be classified as
    "flammable" by virtue of its flash point, has the ability to sustain combustion
    at the temperature or temperatures specified in the appropriate regulations. The
    procedure is applicable to paints (including water-borne paints), varnishes, paint
    binders, solvents, petroleum or related products and adhesives, which have a flash
    point. It is not applicable to painted surfaces in respect of assessing their
    potential fire hazards.
