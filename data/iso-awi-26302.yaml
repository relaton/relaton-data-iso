abstract:
- language: en
  script: Latn
  content: This document specifies general non-clinical requirements and tests to
    demonstrate basic safety and essential performance of durable and temporary ventricular
    assist devices (VADs) and total artificial hearts (TAHs). Recommendations for
    additional design considerations and characterization testing are also provided.
    Left, right, and biventricular support systems and adult and paediatric usage
    are considered. Extracorporeal Membrane Oxygenation (ECMO) Systems, cardiopulmonary
    bypass, intra-aortic balloon pumps (IABP), and other balloon-based therapies are
    excluded from this standard.
