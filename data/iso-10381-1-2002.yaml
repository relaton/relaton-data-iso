abstract:
- language: en
  script: Latn
  content: ISO 10381-1:2002 sets out the general principles to be applied in the design
    of sampling programmes for the purpose of characterizing and controlling soil
    quality and identifying sources and effects of contamination of soil and related
    material, with emphasis on procedures required to locate points from which samples
    may be taken for examination or at which instruments may be installed for in situ
    measurement including statistical implications,procedures for determining how
    much sample to collect and whether to combine samples,methods of collecting samples,methods
    for containing, storing and transporting samples to prevent deterioration/contamination.
