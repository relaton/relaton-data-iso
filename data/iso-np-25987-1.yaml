abstract:
- language: en
  script: Latn
  content: 'This document defines the role, role architecture, functional models,
    and typical scenarios within the advanced air mobility service management and
    is applicable to both intra-city and inter-city operations. The following are
    within the scope of this document: a) Basic roles, operational layer roles, and
    service layer roles in the advanced air mobility servicemanagement; b) Role architecture,
    along with the duties and responsibilities of all stakeholders involved inadvanced
    air mobility service management; c) Typical scenarios for providing advanced air
    mobility services.'
