abstract:
- language: en
  script: Latn
  content: This document is applicable to cookstoves used primarily for cooking or
    water heating in domestic, small-scale enterprise, and institutional applications,
    typically with firepower less than 20 kW and cooking vessel volume less than 150
    l, excluding cookstoves used primarily for space heating. For solar cookstoves,
    the provisions of this document are applicable only for evaluating cooking power,
    safety, and durability. Solar cookstoves have zero on-site emissions, and their
    cooking power can be determined according to ASAE S 580.1. This document does
    not cover electric stoves. Safety evaluation of electric stoves can be found in
    IEC 60335-2-6[62]. This document specifies laboratory measurement and evaluation
    methods for a) particulate and gaseous air pollutant emissions, b) energy efficiency,
    c) safety, and d) durability of cookstoves. This document does not include evaluation
    of off-gassing from manufacturing oils, coatings, adhesives, and other materials
    (which can be found in ISO 10377 and ISO 14159). This document does not include
    evaluation of safety for cookstoves designed to burn a liquid and/or gaseous fuel,
    such as LPG (liquefied petroleum gas), alcohol, plant oil, kerosene, etc. Safety
    evaluation of gas-fuelled cookstoves can be found in ISO 23550 and ISO 23551 (all
    parts). This document does not include durability evaluation of rechargeable batteries
    in fan-assisted cookstoves. This document provides a standard test sequence to
    establish international comparability in measurement of cookstove emissions and
    efficiency. Guidelines for reporting results from the laboratory measurement and
    evaluation methods are described. For cookstoves used in applications covered
    by additional requirements (e.g., local air quality and safety regulations), additional
    test conditions and special evaluation methods may apply.
