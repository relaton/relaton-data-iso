abstract:
- language: en
  script: Latn
  content: This document specifies procedures for assessing the resistance of paint
    systems when a cut in the form of a right-angle lattice pattern (cross-cut) or
    in the form of an X (X-cut) is made into the paint, penetrating through to the
    substrate. This document is only applicable if the cross-cut or X-cut test method
    is specified, together with the rating from the appropriate rating scale. This
    document also specifies suitable equipment and defines inspection areas, sampling
    plans and acceptance/rejection criteria. It does not specify ratings for particular
    coating systems.
