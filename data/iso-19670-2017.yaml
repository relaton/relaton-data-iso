abstract:
- language: en
  script: Latn
  content: ISO 19670:2017 specifies general requirements, analytical methods, sampling
    and preparation of test sample, marking and labelling, packaging, transport and
    storage for solid urea aldehyde slow release fertilizer. ISO 19670:2017 applies
    to pure solid urea aldehyde slow release fertilizer, i.e. urea formaldehyde (UF),
    methylene urea (MU), crotonylidene diurea (CDU), isobutylidene diurea (IBDU).
    This document does not apply to mixtures of nitrogenous fertilizers containing
    solid urea aldehyde slow release fertilizer.
