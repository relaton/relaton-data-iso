abstract:
- language: en
  script: Latn
  content: 'This Technical Specification has been prepared with the following purposes:
    to facilitate the application of ISO 6743-8 and to specify the characteristics
    to be taken into account when establishing specifications for a given application;
    to enable these characteristics to serve as a basis for discussion between the
    end user and the supplier. This Technical Specification does not cover specific
    requirements which should be examined separately with a view to a common agreement
    between the end user and the product supplier. This Technical Specification does
    not cover the health, safety, disposal and environment areas which should be delft
    with separately, according to the regulations or laws in force in each country.'
