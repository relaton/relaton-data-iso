abstract:
- language: en
  script: Latn
  content: This international standard specifies the comprehensive energy-saving effect
    evaluation method for wind propulsion system, seeking to cover all relevant indicators
    for the assessment of wind-propulsion energy-saving performance. It proposes to
    establish definitions and a unified calculation framework, and to provide calculation
    formulas based on global and specific routes including 10 indicators for power
    saving potential, power saving potential ratio, annual fuel savings, annual CO₂
    emission reductions, and fuel equivalent energy. For different needs at the stages
    of scheme selection, optimization, and regulatory development, the standard—by
    reference to ITTC 7.5-02-03-01.9—offers tiered methods for parameter acquisition.
