abstract:
- language: en
  script: Latn
  content: This document specifies the principles, instruments, materials, experimental
    conditions and the sampling and composition analysis steps required for testing
    mineral composition using the X-ray diffraction method, as well as the method
    and precision requirements for calculating shale brittleness index based on mineral
    composition. This document is applicable to reservoir quality evaluation and sweet
    spot identification in shale gas production.
