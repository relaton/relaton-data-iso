abstract:
- language: en
  script: Latn
  content: This document specifies the boundary dimensions and preferred dimensions
    to be used for drawn cup needle roller bearings without inner ring as well as
    the minimum chamfer dimension limits. This document also specifies the closed
    end thickness dimensions for bearings with one closed end. In addition, this document
    specifies dimensional tolerances for the needle roller complement bore diameter
    and tolerances for the drawn cup width.
