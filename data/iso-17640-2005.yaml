abstract:
- language: en
  script: Latn
  content: ISO 17640:2005 specifies methods for manual ultrasonic testing of fusion-welded
    joints in metallic materials, greater than or equal to 8 mm thick, which exhibit
    low ultrasonic attenuation (especially that due to scatter). It is primarily intended
    for full penetration welded joints where both the welded and parent materials
    are ferritic. It specifies four testing levels (A, B, C and D), each corresponding
    to a different probability of detection of imperfections.
