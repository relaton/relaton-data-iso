abstract:
- language: en
  script: Latn
  content: 'This document specifies the requirements for a request for the verification
    of localization data and the reply where the data is formatted in accordance with
    ISO 8000-114 and where the identifiers are formatted in accordance with ISO 8000-115.
    The following are within the scope of this document: • terms related to localization
    and the data set used for verification • the syntax requirements for a request
    for the verification of localization data formatted in accordance with ISO 8000-114
    where the identifier is formatted in accordance with ISO 8000-115 • the syntax
    requirements for a response to the verification of localization data formatted
    in accordance with ISO 8000-114 where the identifier is formatted in accordance
    with ISO 8000-115 • the application interface protocol for a request for the verification
    of localization data and response to a request for the verification of localization
    data where the identifiers are formatted in accordance with ISO 8000-115 and the
    data exchanged is formatted in accordance with ISO 8000-114 • the methods used
    to capture the data required to determine the location of manufacturer or provision
    of services The following are outside the scope of this document: • the methods
    used for the resolution of ISO 8000-115 identifier to the ISO 8000-114 data set'
