abstract:
- language: en
  script: Latn
  content: ISO 9693-1:2012 specifies test methods for determining the compatibility
    of metallic and ceramic materials used for dental restorations by testing the
    composite structure. The requirements given in ISO 9693-1:2012 are applicable
    to metallic materials and ceramics when used in combination, and are not applicable
    to either metallic materials or ceramics when used alone.
