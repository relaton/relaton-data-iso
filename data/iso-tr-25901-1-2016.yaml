abstract:
- language: en
  script: Latn
  content: 'ISO/TR 25901-1:2016 contains general terms and definitions applicable
    to welding and allied processes. It does not contain terms and definitions related
    to specific processes or particular aspects of welding and allied processes that
    are covered in other parts of this Technical Report (see Foreword) or in other
    ISO standards. In the main body of this part of ISO/TR 25901, terms are arranged
    in a systematic order. Annex A provides an index in which all terms are listed
    alphabetically with reference to the appropriate subclause. In addition, it provides
    French translations, covering two of the three official ISO languages (English,
    French and Russian). German translations are also provided; these are published
    under the responsibility of the member body for Germany (DIN), and are given for
    information only. NOTE 1 Only the terms given in the official languages (English,
    French and Russian) are to be considered as ISO terms and definitions. NOTE 2
    All these terms and definitions are also available on the ISO Online Browsing
    Platform (OBP): https://www.iso.org/obp/ui/'
