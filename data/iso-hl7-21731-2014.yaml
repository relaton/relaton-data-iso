abstract:
- language: en
  script: Latn
  content: The Health Level Seven (HL7) Reference Information Model (RIM) is a static
    model of health and health care information as viewed within the scope of HL7
    standards development activities. It is the combined consensus view of information
    from the perspective of the HL7 working group and the HL7 international affiliates.
    The RIM is the ultimate source from which all HL7 version 3.0 protocol specification
    standards draw their information-related content. In the context of ISO TC215
    – Health Informatics, the RIM provides a reference model that has been and will
    likely continue to be used in developing further health informatics specifications.
