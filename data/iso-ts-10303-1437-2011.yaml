  script: Latn
  content: 'ISO/TS 10303-1437:2011-10 specifies the application module for Schedule.
    The following are within the scope of ISO/TS 10303-1437:2011-10: facility to assign
    activity information to schedule management data; facility to assign activity
    method information to schedule management data; facility to assign condition evaluation
    information to schedule management data; facility to assign event information
    to schedule management data; facility to assign justification information to schedule
    management data; facility to assign process property information to schedule management
    data; facility to assign resource information to schedule management data; facility
    to assign scheme information to schedule management data; facility to assign state
    information to schedule management data; facility to assign task information to
    schedule management data.'
