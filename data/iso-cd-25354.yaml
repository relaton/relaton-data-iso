abstract:
- language: en
  script: Latn
  content: 'This document specifies the test method and performance metrics to evaluate
    the behaviour of a vehicle equipped with door open warning system during several
    accident scenarios. These potential accidents occur when a door is about to be
    opened and there is a risk of collision due to the vehicle door opening. This
    document applies to category M1 and N1 vehicles equipped with a door open warning
    system. Note: Depending on accidentology, only a part of the scenarios can be
    used for an evaluation of performance.'
