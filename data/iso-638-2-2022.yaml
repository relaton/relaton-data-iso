abstract:
- language: en
  script: Latn
  content: This document specifies an oven-drying method for the determination of
    the dry matter content in suspensions of cellulosic nanomaterials. The procedure
    is applicable to cellulosic nanomaterial suspensions which do not contain any
    appreciable quantities of materials other than water that are volatile at the
    temperature of 105 °C ± 2 °C. It is used, for example, in the case of cellulosic
    nanomaterial suspensions samples taken for chemical and physical tests in the
    laboratory, when a concurrent determination of dry matter content is required.
    NOTE      This document determines the total dry matter content of the sample,
    including any dissolved solids. If only the cellulosic material content free of
    dissolved solids is desired, dissolved solids are removed prior to measuring the
    dry matter content, e.g. by washing or dialysis, taking care to retain all cellulosic
    material.
