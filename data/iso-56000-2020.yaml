abstract:
- language: en
  script: Latn
  content: '1.1 This document provides the vocabulary, fundamental concepts and principles
    of innovation management and its systematic implementation. It is applicable to:
    a) organizations implementing an innovation management system or performing innovation
    management assessments; b) organizations that need to improve their ability to
    effectively manage innovation activities; c) users, customers and other relevant
    interested parties (e.g. suppliers, partners, funding organizations, investors,
    universities and public authorities) seeking confidence in the innovation capabilities
    of an organization; d) organizations and interested parties seeking to improve
    communication through a common understanding of the vocabulary used in innovation
    management; e) providers of training in, assessment of, or consultancy for, innovation
    management and innovation management systems; f) developers of innovation management
    and related standards. 1.2 This document is intended to be applicable to: a) all
    types of organizations, regardless of type, sector, maturity-level or size; b)
    all types of innovations, e.g. product, service, process, model and method, ranging
    from incremental to radical; c) all types of approaches, e.g. internal and open
    innovation, user-, market-, technology- and design-driven innovation activities.
    This document specifies the terms and definitions applicable to all innovation
    management and innovation management system standards developed by ISO/TC 279.'
