abstract:
- language: en
  script: Latn
  content: This document specifies requirements for mutual recognition arrangements
    (MRAs) and gives guidance on how to initiate developments on MRAs between environmental
    product declaration (EPD) and footprint communication programme operators. It
    addresses administrative and operational duties, through evaluation of such programmes,
    and how to externally communicate the results of the cooperation as well as plans
    for future related activities. This document is primarily applicable to MRAs but
    can also be a basis for bilateral agreements.
