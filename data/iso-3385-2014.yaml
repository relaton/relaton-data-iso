abstract:
- language: en
  script: Latn
  content: ISO 3385:2014 specifies a method for the determination of loss in thickness
    and loss in hardness of flexible cellular materials intended for use in load-bearing
    applications such as upholstery. It provides a means of assessing the service
    performance of flexible cellular materials based on rubber latex or polyurethane
    used in load-bearing upholstery. The method is applicable both to standard size
    test pieces cut from slabstock material and to shaped components. The measured
    loss in thickness and loss in hardness are related to, but are not necessarily
    the same as, the losses likely to occur in service. ISO 3385:2014 is not intended
    to function as a detailed engineering design specification for fatigue apparatus.
