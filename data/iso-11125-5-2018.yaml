abstract:
- language: en
  script: Latn
  content: This document specifies test methods for the determination of the percentage
    of defective particles and of the microstructure of metallic blast-cleaning abrasives.
    This is one of a number of parts of ISO 11125 dealing with the sampling and testing
    of metallic abrasives for blast-cleaning. The types of metallic abrasive and requirements
    on each are contained in the various parts of ISO 11124. The ISO 11124 and ISO
    11125 series have been drafted as a coherent set of International Standards on
    metallic blast-cleaning abrasives. Information on all parts of both series is
    given in Annex A.
