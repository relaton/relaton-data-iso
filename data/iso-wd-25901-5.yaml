abstract:
- language: en
  script: Latn
  content: This document contains terms and definitions applicable to laser welding.
    It is intended to be referenced in other documents dealing with this subject.
    In cases where such documents provide terms and definitions differing from those
    contained herein, the terms and definitions given in those documents apply. In
    the main body of this document, terms are arranged in a systematic order. Annex
    A to C provide indexes in which all terms are listed alphabetically in English,
    French and German, with reference to the appropriate subclauses and translations
    of the terms in the other two languages. NOTE Only the terms given in the official
    languages (English, French and Russian) are to be considered as ISO terms and
    definitions. German terms are published under the responsibility of the member
    body for Germany (DIN), and are given for information only.
