abstract:
- language: en
  script: Latn
  content: ISO 639-4:2010 gives the general principles of language coding using the
    codes that are specified in the other parts of ISO 639 and their combination with
    other codes. It also lays down guidelines for the use of any combination of the
    parts of ISO 639. The terminology and general descriptions of ISO 639-4 are intended
    to replace corresponding text of other parts of ISO 639 as relevant in future
    revisions. Relevant metadata for the description of linguistic entities are given,
    as a framework for databases of linguistic data to support the ISO 639 series.
