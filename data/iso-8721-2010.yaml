abstract:
- language: en
  script: Latn
  content: ISO 8721:2010 defines performance criteria for an optical data channel
    used in impact tests on road vehicles, when numerical time and space data are
    taken from images to analyse impact test results. The objective of ISO 8721:2010
    is to facilitate comparison between results obtained by different laboratories
    by specifying minimum quality criteria.
