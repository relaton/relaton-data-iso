abstract:
- language: en
  script: Latn
  content: This International Standard specifies a test method for the accelerated
    determination of the resistance of porcelain enamel coatings on aluminium and
    aluminium alloys to spalling as a result of exposure to moisture or weathering.
    Because spalling is caused by the lack of adhesion between the coating and the
    base metal, the spall test is a test of adhesion. The greater the extent of spalling
    in this test, the greater the likelihood that the article will spall in service.
