abstract:
- language: en
  script: Latn
  content: This document defines terms related to the air filtration industry. This
    document is applicable to particulate matter and gas phase air filters and air
    cleaners used for the general ventilation of inhabited enclosed spaces. It is
    also applicable to air inlet filters for static or seaborne rotary machines, cleanable
    filters, UV-C germicidal devices, and stand-alone electrically-powered air cleaners.
    It is not applicable to cabin filters for road vehicles or air inlet filters for
    mobile internal combustion engines for which separate arrangements exist. Dust
    separators for the purpose of air pollution control are also excluded.
