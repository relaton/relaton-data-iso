abstract:
- language: en
  script: Latn
  content: ISO/IEC 30134-5:2017 specifies the IT Equipment Utilization for servers
    (ITEUsv) as a Key Performance Indicator (KPI) to quantify the utilization of servers
    in a data centre. ISO/IEC 30134-5:2017 is intended as a KPI for improving the
    aggregate energy efficiency of servers in a given data centre.  ITEUsv utilizes
    only CPU utilization of servers in a data centre. Servers where the majority of
    computation is provided by auxiliary processing accelerators (APAs) are out of
    scope. ISO/IEC 30134-5:2017 a) describes the purposes of ITEUsv, b) defines ITEUsv
    in a conceptual manner, c) describes how to use ITEUsv, and d) describes reporting
    of ITEUsv.
