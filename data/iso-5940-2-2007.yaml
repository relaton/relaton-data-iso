abstract:
- language: en
  script: Latn
  content: ISO 5940-2:2007 specifies a method to determine the softening point of
    pitches by the Mettler method, within the range of 50 °C to 180 °C. It can be
    used for other organic materials that are used as binder and impregnating agents,
    where they have a Mettler softening point within the range of 50 °C to 150 °C.
