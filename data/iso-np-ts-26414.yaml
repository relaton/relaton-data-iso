abstract:
- language: en
  script: Latn
  content: 'This document specifies requirements for the design, construction, upgrading,
    and infrastructure of biobank facilities to ensure optimal preservation, safety,
    traceability, and compliance with biosafety and security standards. It applies
    to all types of biobanks (human, animal, plant, microbial, and environmental)
    and includes additional requirements for therapeutic and industrial biobanks as
    well as automated facilities. NOTE: National, regional, or international regulations
    may also apply.'
