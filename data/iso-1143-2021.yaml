abstract:
- language: en
  script: Latn
  content: This document specifies the method for rotating bar bending fatigue testing
    of metallic materials. The tests are conducted at room temperature or elevated
    temperature in air, the specimen being rotated. Fatigue tests on notched specimens
    are not covered by this document, since the shape and size of notched specimens
    have not been standardized. However, fatigue test procedures described in this
    document can be applied to fatigue tests of notched specimens.
