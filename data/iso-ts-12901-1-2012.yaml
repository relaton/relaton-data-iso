abstract:
- language: en
  script: Latn
  content: ISO/TS 12901:2012 provides guidance on occupational health and safety measures
    relating to engineered nanomaterials, including the use of engineering controls
    and appropriate personal protective equipment, guidance on dealing with spills
    and accidental releases, and guidance on appropriate handling of these materials
    during disposal. ISO/TS 12901:2012 is intended for use by competent personnel,
    such as health and safety managers, production managers, environmental managers,
    industrial/occupational hygienists and others with responsibility for the safe
    operation of facilities engaged in production, handling, processing and disposal
    of engineered nanomaterials. ISO/TS 12901:2012 is applicable to engineered materials
    that consist of nano-objects such as nanoparticles, nanofibres, nanotubes and
    nanowires, as well as aggregates and agglomerates of these materials (NOAA).
