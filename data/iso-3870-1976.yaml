abstract:
- language: en
  script: Latn
  content: Describes fixed and automatic take-up devices. Contains recommendations
    for adjustment values which are valid for the most commonly used belts. Tabulates
    various types of take-up devices with relation to conveyor lengths from 0 to 12
    m up to 150 to 300 m. For belts with a fabric carcase whose length exceeds 300
    m and belts with a metal carcase of any length, the manufacturer should justify
    the chosen adjustment.
