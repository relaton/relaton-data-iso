abstract:
- language: en
  script: Latn
  content: ISO 877-3:2018 specifies a method for exposing plastics to concentrated
    solar radiation using reflecting concentrators to accelerate the weathering processes.
    The purpose is to assess property changes produced after specified stages of such
    exposures. The reflecting concentrators used in these exposures are sometimes
    referred to as "Fresnel reflectors" because in cross-section the array of mirrors
    used to concentrate the solar radiation resembles the cross-section of a Fresnel
    lens. General guidance concerning the scope of the ISO 877 series is given in
    ISO 877‑1. NOTE Additional information about solar concentrating exposures, including
    a partial list of standards in which they are specified, is given in the Bibliography.
