abstract:
- language: en
  script: Latn
  content: This document specifies a test method for the determination of the biodegradability
    of the hydrolysate of textile materials obtained after accelerated hydrolysis
    under controlled composting conditions by measurement of the amount of evolved
    carbon dioxide with a gas chromatography. This test method can be applied to petroleum-based
    man-made biodegradable textile materials which are manufactured from polyethylene
    terephthalate succinate, polycaprolactone, polypropylene carbonate, polybuthylene
    succinate or copolymer using them.
