abstract:
- language: en
  script: Latn
  content: ISO 6935-1:2007 specifies technical requirements for plain bars to be used
    as reinforcement in concrete. ISO 6935-1:2007 covers nine steel grades not intended
    for welding which are B240A-P, B240B-P, B240C-P, B240D-P, B300A-P, B300B-P, B300C-P,
    B300D-P and B420D-P, and one steel grade intended for welding which is B420DWP.
    The production process is at the discretion of the manufacturer. It also applies
    to plain bars supplied in coil form. The requirements of ISO 6935-1:2007 apply
    to straightened product. The steel grades are designated with steel names allocated
    in accordance with ISO/TS 4949:2003. ISO 6935-1:2007 covers products delivered
    in straight lengths. Plain bars produced from finished products, such as plates
    and railway rails, are excluded.
