abstract:
- language: en
  script: Latn
  content: ISO 24473:2008 specifies a series of test methods that simulate a real
    scale fire on a test object or group of objects under well-ventilated conditions.
    A range of different fire sizes can be studied according to the scale of the equipment
    available. The method is intended to evaluate the contribution to fire growth
    provided by an object or group of objects using a specified ignition source. A
    test performed in accordance with the method specified in ISO 24473:2008 provides
    data for all stages of a fire.
