abstract:
- language: en
  script: Latn
  content: 'This document specifies a classification and terminology of assistive
    products, especially produced or generally available, for persons to optimize
    functioning and reduce disability. Assistive products used by a person to optimize
    functioning and reduce disability, but which require the assistance of another
    person for their operation, are included in the classification. The following
    items are specifically excluded from this document: —    items used for the installation
    of assistive products; —    solutions obtained by combinations of assistive products
    that are individually classified in this document; —    medicines; —    assistive
    products and instruments used exclusively by healthcare professionals or by teachers;
    —    non-technical solutions, such as personal assistance, guide dogs or lip-reading;
    —    implanted devices; —    financial support.'
