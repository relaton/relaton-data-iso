abstract:
- language: en
  script: Latn
  content: This proposal to develop a standard method for the enhanced recovery, isolation,
    detection and enumeration of Acinetobacter spp. in environmental aquatic niches
    including agricultural, wastewater effluents, recreational, ground- and well waters.
    The standardized method is specific for each water type in a specified sample
    volume e.g., 500 mL of clean water (drinking, recreational, ground- and well water)
    and 0.1 to 100 mL turbid (agricultural and wastewater effluent). The sample will
    be membrane filtered (0.45 μm). The filter will be placed on Acinetobacter selective
    growth media and incubated under aerobic and microaerophilic conditions at 30
    and 37°C for 18- 24 hours. An inter-laboratory ring-trial will be conducted where
    each participating country (minimum five) laboratories will simulate a known number
    of A. baumannii reference strain cells in various environmental water sources.
    In this stage of ring-trial, raw drinking and post-treated wastewater will be
    used for the assessment of optimal temperature incubation conditions for enhanced
    recovery from each substrate. The results will then be analyzed and based on the
    statistical findings, the optimum sampling and growth conditions will be described
    for each water type.
