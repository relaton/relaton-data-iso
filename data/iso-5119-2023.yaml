abstract:
- language: en
  script: Latn
  content: This specification details a test method for static O-ring seals in elastomeric
    materials which are subject to pressurized gas media at low temperatures. It gives
    guidance on the design of test equipment, standard test parameters, and reporting
    criteria. It does not specify performance criteria that should be agreed upon
    between supplier and customer. The test procedure may be used to test seals of
    alternate size and design or using alternative media but such deviations shall
    be detailed separately on the report form and the results shall not be used to
    determine the minimum operating temperature of seals of any other configuration
    than that tested.
