abstract:
- language: en
  script: Latn
  content: 'This document is applicable to low pressure die casting machines: a) vertical
    low pressure die casting machines; b) horizontal low pressure die casting machines;
    This document applies to low pressure die casting cells, namely low pressure die
    casting machines (LPDC), and their interfaces with the following ancillary equipment:
    a) dies; b) baking die devices; c) die installation devices; d) furnace replacement
    devices; e) fume/gas/water collection devices; f) filter storage separation and
    transmission devices; g) robots and matched ancillary devices; h) extractors and
    conveyor devices. This ancillary equipment itself is not covered. The additional
    risks caused by the materials being cast are not covered. This document deals
    with foreseeable significant hazards, hazardous situations and events relevant
    to low pressure die casting machines when used as intended and under conditions
    of misuse which are reasonably foreseeable by the manufacturer. It provides the
    requirements to be met by the manufacturer to ensure the safety of persons and
    property during the life cycle phases according to ISO 12100:2010, 5.4, as well
    as in the event of foreseeable failures or malfunctions that can occur in the
    equipment.'
