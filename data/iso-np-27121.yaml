abstract:
- language: en
  script: Latn
  content: This technical specification provides guidelines to determine net CO2 emissions of cement products manufactured from cement plants specifically equipped with CCUS facilities. CCUS facilities in cement plants use a portion of the emitted CO2 to produce thermodynamically stable mineral carbonates, achieved through the application of mineral carbonation technology. This document applies only to CCUS activities within cement plants and does not consider CCUS facilities in other industries or the geological storage of CO2.
