abstract:
- language: en
  script: Latn
  content: This document gives guidelines for monitoring hazards within a facility
    as a part of an overall emergency management and continuity programme by establishing
    the process for hazard monitoring at facilities with identified hazards. It includes
    recommendations on how to develop and operate systems for the purpose of monitoring
    facilities with identified hazards. It covers the entire process of monitoring
    facilities. This document is generic and applicable to any organization. The application
    depends on the operating environment, the complexity of the organization and the
    type of identified hazards.
