- language: en
  script: Latn
  content: ISO 7176‑9:2009 specifies requirements and test methods to determine the
    effects of rain, dust, condensation and the effects of changes of temperature
    on the basic functioning of electrically powered wheelchairs, including scooters,
    intended to carry one person, with a maximum speed not exceeding 15 km/h. ISO
    7176‑9:2009 does not include requirements for resistance to corrosion.
