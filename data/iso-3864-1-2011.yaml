abstract:
- language: en
  script: Latn
  content: ISO 3864-1:2011 establishes the safety identification colours and design
    principles for safety signs and safety markings to be used in workplaces and in
    public areas for the purpose of accident prevention, fire protection, health hazard
    information and emergency evacuation. It also establishes the basic principles
    to be applied when developing standards containing safety signs. ISO 3864-1:2011
    is applicable to all locations where safety issues related to people need to be
    addressed. However, it is not applicable to the signalling used for guiding rail,
    road, river, maritime and air traffic and, generally speaking, to those sectors
    subject to a regulation which may differ.
