abstract:
- language: en
  script: Latn
  content: This International Standard is intended for organizations seeking to address
    waste and resources related environmental aspects, environmental conditions, and
    the associated risks and opportunities within an environmental management system
    according to ISO 14001. It is intended to apply to a broad range of potential
    users, including organizations implementing and maintaining an environmental management
    system; organizations providing environmental consultancy, training and support
    organizations; and in accreditation or in standardization in the area of conformity
    assessment. The guidelines in this International Standard are intended to be flexible
    as they can be applied to the waste and resource management of an organization
    irrespective of its size, nature and complexity, as well as the types of waste
    and resources used in their operations. It is applicable to all types of waste
    and resource management and considers a life-cycle perspective. Throughout this
    International Standard, specific topics will be provided in conformity with ISO
    14002-1:2019 and consistent with other guidelines within the ISO 14002 series
    in order to assist understanding and facilitate implementation.
