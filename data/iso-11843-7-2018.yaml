abstract:
- language: en
  script: Latn
  content: Background noise exists ubiquitously in analytical instruments, whether
    or not a sample is applied to the instrument. This document is concerned with
    mathematical methodologies for estimating the minimum detectable value in case
    that the most predominant source of measurement uncertainty is background noise.
    The minimum detectable value can directly and mathematically be derived from the
    stochastic characteristics of the background noise. This document specifies basic
    methods to — extract the stochastic properties of the background noise, — use
    the stochastic properties to estimate the standard deviation (SD) or coefficient
    of variation (CV) of the response variable, and — calculate the minimum detectable
    value based on the SD or CV obtained above. The methods described in this document
    are useful for checking the detection of a certain substance by various types
    of measurement equipment in which the background noise of the instrumental output
    predominates over the other sources of measurement uncertainty. Feasible choices
    are visible and ultraviolet absorption spectrometry, atomic absorption spectrometry,
    atomic fluorescence spectrometry, luminescence spectrometry, liquid chromatography
    and gas chromatography.
