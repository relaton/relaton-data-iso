abstract:
- language: en
  script: Latn
  content: ISO 9241-304:2008 provides guidance for assessing the visual ergonomics
    of display technologies with user performance test methods (as opposed to the
    optical test methods given in ISO 9241-305). Its use will help to ensure that,
    for a given context of use, a display meets minimum visual ergonomics requirements.
    It covers only visual attributes and does not address the ergonomics or usability
    of the whole product that houses a visual display. The main users of ISO 9241-304:2008
    will be those who procure displays or who need to measure display performance
    during product development. Its application assumes a background in behavioural
    science.
