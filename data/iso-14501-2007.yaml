abstract:
- language: en
  script: Latn
  content: ISO 14501│IDF 171:2007 specifies a method for the determination of aflatoxin
    M1 content in milk and milk powder. The limit of detection is 0,08 µg/kg for whole
    milk powder, i.e. 0,008 µg/l for reconstituted liquid milk. The method is also
    applicable to low fat milk, skimmed milk, low fat milk powder, and skimmed milk
    powder.
