abstract:
- language: en
  script: Latn
  content: This document specifies the SAE J1939-based application layer, the payload
    of messages, and parameter groups for electronically controlled braking systems,
    including anti-lock braking systems (ABS), vehicle dynamics control systems (VDC),
    and running gears equipment, to ensure the interchange of digital information
    between road vehicles with a maximum authorized total mass greater than 3 500 kg
    and their towed vehicles, including communication between towed vehicles. Conformance
    and interoperability test plans are not part of this document.
