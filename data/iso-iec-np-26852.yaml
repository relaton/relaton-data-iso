abstract:
- language: en
  script: Latn
  content: This document outlines a unified architecture modeling semantic of model-based systems and software engineering, proposes specific semantics to formalize heterogeneous architecture modelling language, and aims to guide the practice of semantic integration in the entire model-based systems and software engineering process. This document is applicable to the demanders, suppliers, maintainers, and independent evaluators of model-based systems and software engineering tool venders, aiming to facilitate a better integration of model-based tools in the entire system lifecycle. Through the proposed semantics, it supports model integration of existing modeling languages (such as UML, SysML, UPDM, BPMN, OPM, etc.), and provides extensibility to customize domain-specific modeling languages according to specific scenarios. Through the semantics, it also supports data interaction and tool integration among different tools.
