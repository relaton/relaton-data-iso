abstract:
- language: en
  script: Latn
  content: ISO 10667-2:2011 establishes requirements and guidance for the service
    provider in working with a client to carry out the assessment of an individual,
    group or organization for work-related purposes and to deliver quality assessment
    services. ISO 10667-2:2011 also contains guidance for the service provider in
    the delivery and use of assessment methods and procedures that can be carried
    out for various work-related purposes made by or affecting individuals, groups
    or organizations.
