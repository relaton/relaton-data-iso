abstract:
- language: en
  script: Latn
  content: 'This document provides the criteria for stable on-orbit operation of the
    spacecraft''s AOCS. It addresses the factors affecting the spacecraft''s on-orbit
    stability by specifying principles and requirements for establishing the spacecraft
    AOCS''s capability for stable on-orbit operation, which include: —     principles
    for judging data validity and the requisite procedures for handling such data;
    —     anomaly detection; —     management of software and hardware failures; —    
    safety boundary checks; —     activation protocols for emergency survival modes.
    This document also establishes the functional interface between on-orbit autonomy
    and ground-based maintenance operations, ensuring that the spacecraft maintains
    its intended attitude and orbit. This document is applicable to the attitude and
    orbit control systems of various types of spacecraft.'
