abstract:
- language: en
  script: Latn
  content: This part of 82079 International Standard provides specific provisions
    for complex systems. This document considers the preparation of information for
    use of complex systems in the relevant phases of the system life cycle. This part
    of the 82079 International Standard is to be used in conjunction with IEC/IEEE
    82079 1:2019. Complex systems in the sense of this standard are an assembly of
    linked parts, components and subsystems which are linked together for a specific
    purpose. Information for use for complex systems is usually developed during the
    construction, testing and commissioning phase.
