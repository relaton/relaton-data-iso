abstract:
- language: en
  script: Latn
  content: ISO 16053:2004 specifies a natural weathering test for exterior wood coating
    systems mainly intended for decoration and protection of planed and sawn wood.
    The test provides a means of evaluating the performance of a wood coating system
    during outdoor exposure. It forms the basis for the performance specification
    given by ENV 927-2.
