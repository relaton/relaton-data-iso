abstract:
- language: en
  script: Latn
  content: ISO 128-33:2018 lays down general rules for marking, designation, placing
    and orientation of views, sections and cuts, and the position of text in relation
    to figures on construction drawings. For all general rules, reference is made
    to the relevant parts of the ISO 128 series. As regards relative positions of
    views, the method using reference arrows according to ISO 128‑30 is used.
