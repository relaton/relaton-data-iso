abstract:
- language: en
  script: Latn
  content: This document includes technical requirements which are related to automotive
    repair and maintenance information (RMI) systems in order to standardize access
    to RMI for independent operators. This document specifies the minimum set of technical
    requirements related to a vehicle manufacturer's RMI system. These requirements
    will reflect the deriving needs from the use cases as specified in ISO 18541‑1.
    Furthermore, this document defines requirements for granting access to security-related
    RMI in Annex A following the SERMI scheme. This document is applicable to light
    passenger and commercial vehicles as defined in regulation (EC) 715/2007 Article
    2 [15].
