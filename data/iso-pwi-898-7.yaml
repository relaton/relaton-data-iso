abstract:
- language: en
  script: Latn
  content: Applies to bolts and screws of property classes 8.8 to 12.9 in accordance with ISO 898-1 with thread less than M3 for which no breaking and proof loads are indicated in ISO 898-1, as well as to short bolts and screws with nominal diameters 3 mm to 10 mm which cannot be subjected to a tensile test. The minimum breaking torques are not valid for hexagon socket set screws.
