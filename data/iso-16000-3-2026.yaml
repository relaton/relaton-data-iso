abstract:
- language: en
  script: Latn
  content: 'This document specifies a sampling method to determine the quantity of formaldehyde (HCHO) in the air with the range of approximately 1 µg/m3 to 1 mg/m3 in a time-weighted average (TWA) sample, for long-term (1 h to 24 h) and short-term (5 min to 60 min) sampling. This method involves the collection of compounds from air on to adsorbent cartridges coated with 2,4-dinitrophenylhydrazine (DNPH) and subsequent analysis of the hydrazones formed by high performance liquid chromatography (HPLC) with detection by ultraviolet absorption  [7] [8]. This document can also be applied for the determination of at least 12 other aromatic as well as saturated and unsaturated aliphatic carbonyl compounds (aldehydes and ketones), with modification, such as: —     acetaldehyde; —     acetone; —     benzaldehyde; —     butyraldehyde; —     capronaldehyde; —     2,5-dimethylbenzaldehyde; —     formaldehyde; —     isovaleraldehyde; —     propionaldehyde; —     m-tolualdehyde; —     o-tolualdehyde; —     p-tolualdehyde; —     valeraldehyde. This document does not apply to longer chained or unsaturated carbonyl compounds such as acrolein. An alternative sampling method using sorbent tubes and analysis by thermal desorption using gas chromatography with mass spectrometry (GC-MS) is given in Annex A.'
