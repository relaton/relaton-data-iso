abstract:
- language: en
  script: Latn
  content: ISO 16332:2018 specifies a fuel/water separator comparison test under defined
    and simplified laboratory conditions. This test is intended for pressure side
    fuel/water separators as well as for suction side fuel/water separators. Pressure
    side fuel/water separators are tested with fine droplets and suction side filters
    are tested with coarse droplets using the same test rig layout. The rated flow
    (in litres per hour) is intended for the range between 50 l/h and 1 500 l/h. By
    agreement between customer and fuel/water separator manufacturer, and with some
    modifications, the procedures can be used for fuel/water separators with higher
    or lower flow rates.
