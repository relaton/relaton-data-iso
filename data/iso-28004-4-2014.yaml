abstract:
- language: en
  script: Latn
  content: ISO 28004-4:2014 provides additional guidance for organizations adopting
    ISO 28000 that also wish to incorporate the Best Practices identified in ISO 28001
    as a management objective on their international supply chains. The Best Practices
    in ISO 28001 both help organizations establish and document levels of security
    within an international supply chain and facilitate validation in national Authorized
    Economic Operator (AEO) programmes that are designed in accordance with the World
    Customs Organization (WCO) Framework of Standards. ISO 28004-4:2014 is not designed
    as a standalone document. The main body of ISO 28004-1 provides significant guidance
    pertaining to required inputs, processes, outputs and other elements required
    by ISO 28000. ISO 28004-4:2014 provides additional specific guidance on implementing
    ISO 28000 if compliance with ISO 28001 is a management objective.
