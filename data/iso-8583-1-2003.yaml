abstract:
- language: en
  script: Latn
  content: ISO 8583-1:2003 specifies a common interface by which financial transaction
    card originated messages may be interchanged between acquirers and card issuers.
    It specifies message structure, format and content, data elements and values for
    data elements. The method by which settlement takes place is not within the scope
    of this part of ISO 8583.
