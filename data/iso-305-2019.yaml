abstract:
- language: en
  script: Latn
  content: 'This document specifies two methods for the determination of the thermal
    stability of products and compounds based on vinyl chloride homopolymers and copolymers
    (referred to simply as PVC in the following text) by the extent of the discoloration
    that occurs when they are exposed, in the form of sheet, to elevated temperatures.
    The two methods are: — Method A: Oil-bath method; — Method B: Oven method. These
    methods are particularly applicable to the determination of the resistance of
    PVC to degradation by heat, as assessed by the change in colour after different
    times of heating under standardized conditions. The results are comparative only,
    and can be unsatisfactory when coloured PVC materials are tested. The stability
    times given by the two methods might not be similar and cannot be used for direct-comparison
    purposes.'
