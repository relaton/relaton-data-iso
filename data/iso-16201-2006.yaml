abstract:
- language: en
  script: Latn
  content: ISO 16201:2006 specifies functional and technical requirements and test
    methods for environmental control systems intended for use to alleviate or compensate
    for a disability. Such systems are also known as electronic aids to daily living.
    The aim of ISO 16201:2006 is to provide safety requirements and recommendations
    for manufacturers of such environmental control systems. Target devices are not
    covered by ISO 16201:2006. Technical requirements for items of equipment connected
    within the system are to be covered by their own specific standards, e.g. adjustable
    beds.
