abstract:
- language: en
  script: Latn
  content: This document specifies basic requirements for the design and implementation
    of traceability systems within the cocoa supply chain for sustainably produced
    cocoa beans and cocoa products derived from sustainably produced cocoa beans that
    conform to ISO 34101‑2 and either ISO 34101‑1 or ISO 34101‑4:2019, Annex A or
    B, as described in the Introduction. This document also specifies administrative
    requirements for a mass balance system whereby cocoa conforming to this document
    can be used together with nonconforming cocoa and which provides the necessary
    traceability within a manufacturing process. This document specifies requirements
    for traceability of sustainably produced cocoa from an organization that is sustainably
    producing cocoa beans to the point of exit from the manufacturer of the final
    retail product. This document does not apply to a credit system.
