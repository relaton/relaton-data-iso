abstract:
- language: en
  script: Latn
  content: 'This part of ISO/IEC 7816 specifies the power, signal structures, and
    the structure for the answer to reset between an integrated circuit(s) card with
    synchronous transmission and an interface device such as a terminal. The specifications
    in ISO/IEC 7816-3 apply where appropriate, unless otherwise stated here. It also
    covers signal rates, operating conditions, and communication with the integrated
    circuit(s) card. This part of ISO/IEC 7816 specifies two types of synchronous
    cards: type 1 and type 2.'
