abstract:
- language: en
  script: Latn
  content: ISO 2584:2016 specifies the dimensions of metric series cylindrical cutters
    with plain bore and key drive, intended for fitting to cutter arbors. It is applicable
    to solid cutters and also to interlocking cutters. Solid cutters are made either
    with straight teeth or with helicoidal teeth angled to the right or left; interlocking
    cutters are always made with straight or helicodial teeth angled to the left and
    right alternately. The range of outside diameters of these cutters is taken from
    ISO 523.
