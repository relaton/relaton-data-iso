abstract:
- language: en
  script: Latn
  content: 'ISO 16358-1:2013 specifies the testing and calculating methods for seasonal
    performance factor of equipment covered by ISO 5151, ISO 13253 and ISO 15042.
    ISO 16358-1:2013 also specifies the seasonal performance test conditions and the
    corresponding test procedures for determining the seasonal performance factor
    of equipment, as specified above, under mandatory test conditions and is intended
    for use only in marking, comparison, and certification purposes. For the purposes
    of ISO 16358-1:2013, the rating conditions are those specified under T1 in the
    reference standards above. The procedures in ISO 16358-1:2013 may be used for
    other temperature conditions. ISO 16358-1:2013 does not apply to the testing and
    rating of: water-source heat pumps or water-cooled air conditioners; portable
    units having a condenser exhaust duct; individual assemblies not constituting
    a complete refrigeration system; or equipment using the absorption refrigeration
    cycle.'
