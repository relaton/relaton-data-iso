abstract:
- language: en
  script: Latn
  content: This document specifies the methods for acquiring and processing particle
    colour images, as well as particle characterization based on particle colour images.
    The purpose of this document is to utilise the colour information for particle
    identification, classification, and particle size and shape characterization.
    The accurate measurement of particle colour is not covered. This document is applicable
    to the measurement of particle size, shape, and colour information using optical
    colour imaging devices such as imaging particle size and shape analysers, microscopes,
    scanners, or cameras. This document is only applicable to the extraction and classification
    of particles from the digital colour images based on RGB three channel data or
    those that can be converted into RGB three channel data. This document specifies
    equipment for the acquisition of colour images using the static imaging method.
    If the equipment is based on the dynamic imaging method, it should meet the requirements
    of both ISO 13322-2 and this document for colour image analysis methods.
