abstract:
- language: en
  script: Latn
  content: This document specifies guidance and requirements for the design and implementation of
    an energy data collection plan for an organization to demonstrate, improve and maintain
    its energy performance as well as its energy related GHG emission. This document
    provides a framework for both the novice and expert that can be used to support
    those organizations who have implemented or are implementing ISO 50001. The energy
    data collection plan defines a measurement system for monitoring and analyzing
    the energy performance as well as the energy related GHG emission of an organization.
    This document applies to all types of energy, and energy uses including buildings,
    equipment, processes, systems, transportation and facilities of all sizes, complexity
    and types. This document ensures measurements are reliable, accurate, and appropriate
    to cost-effectively meet the organization’s needs.
