abstract:
- language: en
  script: Latn
  content: 'This document defines the design, safety and operation characteristics of cryo-compressed hydrogen (CcH2) land vehicle refuelling connectors. CcH2 land vehicle refuelling connectors consist of the following components, as applicable: ▪ receptacle and protective cap (mounted on vehicle); ▪ nozzle. This document is applicable to refuelling connectors which have nominal working pressures or hydrogen service levels up to 35 MPa.'
