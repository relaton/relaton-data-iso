abstract:
- language: en
  script: Latn
  content: This document specifies the requirements for organizations to establish and implement project, programme and portfolio management and related governance. The requirements are relevant to any organization, regardless of sector, type, size or the products and services provided. The sector, type and size and any other relevant considerations can be considered as to when and how the requirements are implemented. This document can be applied at different levels within an organization, ranging from the entire organization to specific divisions, subdivisions, or locations. Organizations can implement the requirements for projects, programmes and portfolios either singularly or in any combination used by the organization. Where projects, programmes or portfolios involve multiple organizations, the requirements can be applied by the participating organizations individually or collectively, as appropriate to their roles and responsibilities. The requirements in this document refer to organization-level requirements for project, programme and portfolio management practices and related governance, not for project- or programme-specific deliverables, outputs or outcomes. The document does not address requirements management over the life cycle of an individual project or programme, and it does not cover life cycle models, methods or tools. While this document does not specify requirements for developing organizational strategy, organizational objectives or business cases, it specifies requirements for aligning projects, programmes and portfolios with them.
