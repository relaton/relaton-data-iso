abstract:
- language: en
  script: Latn
  content: 'This document provides principles and guidelines for smart water management
    relating to drinking water, wastewater, stormwater systems and services. The following
    are within the scope of this document: —     principles and guidelines for design
    of smart water management system; —     principles and guidelines for operation
    and maintenance of smart water management systems; —     principles and guidelines
    for governance of smart water management system. This document applies to all
    sizes of public or private water utilities that want to design, develop, implement,
    operate and/or maintain smart water management systems.'
