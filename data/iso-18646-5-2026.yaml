abstract:
- language: en
  script: Latn
  content: This document describes methods for specifying and evaluating the locomotion performance of legged robots. The tests listed in this document are mainly used to evaluate the complete machine. They can be also used for sample test, qualification test or check-and-accept test. This document is not intended for the verification or validation of safety requirements.
