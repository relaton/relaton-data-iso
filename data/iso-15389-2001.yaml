abstract:
- language: en
  script: Latn
  content: This International Standard defines the general criteria for the development
    of flight-to-ground umbilical systems used by a space system. The criteria specified
    herein is limited to the service arms or equivalent mechanisms, umbilical carriers
    and plates, couplings, connectors, withdrawal and retract devices, handling mechanisms
    and control systems for mechanisms.
