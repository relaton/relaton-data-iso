abstract:
- language: en
  script: Latn
  content: This document defines requirements and gives recommendations for the chemical
    composition, electrochemical properties, physical tolerances and test and inspection
    procedures for cast galvanic anodes of aluminium, magnesium and zinc-based alloys
    for cathodic protection in seawater, saline sediment and brackish water. Information
    on salinity ranges can be found in Annex A. The requirements and recommendations
    of this document can be applied to any available anode shape for cast anodes,
    e.g. trapezoid, circular, half-spherical cross sections, bracelet type. Whilst
    other metals, such as soft iron, can be used as galvanic anode material to protect
    more noble metals than iron and steel, these are not covered in this document.
