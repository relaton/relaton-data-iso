abstract:
- language: en
  script: Latn
  content: This international standard specifies the test to be used to measure the
    percentage of diameter recovery of cylindrical cork stoppers after compression.
    It applies to all types of cylindrical cork stoppers, intended to be inserted
    completely into the bottleneck, with their superior end at the level of the head
    of the bottle or intended to be partially inserted into the bottle and held in
    place on top by a suitable device (string, clip, 'muselet' or similar), to withstand
    the pressure of the liquid inside, as defined in ISO 633 (natural cork stoppers,
    whether or not colmated, agglomerated cork stoppers, 1+1, 0+1, 0+2, 0+3 cork stoppers,
    micro-agglomerated cork stoppers without expansion aids, micro-agglomerated cork
    stoppers with expansion aids) semi-manufactured, semi-finished or finished ready-for-use.
    It doesn’t apply to cork stopper after bottling.
