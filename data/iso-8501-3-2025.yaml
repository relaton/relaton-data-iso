abstract:
- language: en
  script: Latn
  content: This document provides requirements to identify visible imperfections and
    defines three preparation grades for welds, edges and surfaces of steel to assist
    in achieving efficient corrosion protection. Such imperfections can be visible
    before or can become visible after an abrasive blast cleaning process. NOTE      
    Although this document has been developed specifically for preparation of steel,
    the defined preparation grades will generally be appropriate for use when preparing
    other metal surfaces e.g. aluminium, castings, if agreed.
