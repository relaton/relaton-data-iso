abstract:
- language: en
  script: Latn
  content: ISO TS 19104:2008 is applicable to international communication in the field
    of geographic information. It provides the guidelines for collection and maintenance
    of terminology in the field of geographic information. It establishes criteria
    for selection of concepts to be included in other standards concerning geographic
    information, which are developed by ISO/TC 211, specifies the structure of the
    terminological record, and describes the principles for definition writing. ISO
    TS 19104:2008 also lays down the guidelines for maintenance of a Terminology Repository.
