abstract:
- language: en
  script: Latn
  content: 'This document defines the procedures for noise control of primarily open
    plants and the requirements on equipment suppliers for reporting and testing of
    noise. It is applicable to the following: —     specification of procedures for
    noise control during engineering of a new plant and modification/extension of
    existing plants (construction and commissioning noise procedures are outside the
    scope of this document); —     definition of responsibilities of parties involved,
    viz. “end-user”, “engineering contractor” and “equipment supplier”; —     description
    of general procedures to arrive at noise requirements for individual equipment,
    based on overall noise requirements for the plant. Input to purchase specifications
    is presented in Annex A. A schematic flowchart, reviewing the noise control process,
    is presented in Annex B and a summary of action items is presented in Annex C.
    An example of an equipment noise data sheet is presented in Annex E.'
