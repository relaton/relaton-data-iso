abstract:
- language: en
  script: Latn
  content: 'This document establishes a system of designation for polycarbonate (PC)
    moulding and extrusion materials, which can be used as the basis for specifications.
    The types of polycarbonate plastic are differentiated from each other by a classification
    system based on appropriate levels of the designatory properties: a) melt volume-flow
    rate; b) Charpy notched impact strength; and on information about the intended
    application and/or method of processing, important properties, additives, colorants,
    fillers and reinforcing materials. This document is applicable to all polycarbonate
    homopolymers and copolymers. It applies to unmodified materials ready for normal
    use and materials modified, for example, by colorants, additives, fillers, reinforcing
    materials, and polymer modifiers. It is not intended to imply that materials having
    the same designation give necessarily the same performance. This document does
    not provide engineering data, performance data or data on processing conditions
    which can be required to specify a material. If such additional properties are
    required, they are intended to be determined in accordance with the test methods
    specified ISO 21305-2, if suitable. In order to designate a thermoplastic material
    to meet particular specifications, the requirements are given in data block 5
    (see 4.6).'
