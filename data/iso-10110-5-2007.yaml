abstract:
- language: en
  script: Latn
  content: ISO 10110-5:2007 forms part of the ISO 10110 series which specifies the
    presentation of design and functional requirements for optical elements and systems
    in technical drawings used for manufacturing and inspection. ISO 10110-5:2007
    specifies rules for indicating the tolerance for surface form and applies to surfaces
    of both spherical and aspheric form.
