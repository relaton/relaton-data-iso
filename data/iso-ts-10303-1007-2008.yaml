abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1007:2008 specifies the application module for General surface
    appearance. The following are within the scope of ISO/TS 10303-1007:2008: specification
    of visual attributes which may be assigned to curves belonging to surfaces; selection
    of specific curve types for wireframe-like presentation of surfaces; specification
    of a mechanism of colour to surfaces; items within the scope of application module
    Curve appearance, ISO/TS 10303-1003.'
