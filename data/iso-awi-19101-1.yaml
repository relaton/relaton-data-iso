abstract:
- language: en
  script: Latn
  content: ISO 19101-1:2014 defines the reference model for standardization in the
    field of geographic information. This reference model describes the notion of
    interoperability and sets forth the fundamentals by which this standardization
    takes place. Although structured in the context of information technology and
    information technology standards, ISO 19101-1:2014 is independent of any application
    development method or technology implementation approach.
