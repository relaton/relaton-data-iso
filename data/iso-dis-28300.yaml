abstract:
- language: en
  script: Latn
  content: ISO 28300:2008 covers the normal and emergency vapour venting requirements
    for aboveground liquid petroleum or petroleum products storage tanks and aboveground
    and underground refrigerated storage tanks designed as atmospheric storage tanks
    or low-pressure storage tanks. Discussed in ISO 28300:2008 are the causes of overpressure
    and vacuum; determination of venting requirements; means of venting; selection,
    and installation of venting devices; and testing and marking of relief devices.
    ISO 28300:2008 is intended for tanks containing petroleum and petroleum products
    but it can also be applied to tanks containing other liquids; however, it is necessary
    to use sound engineering analysis and judgment whenever ISO 28300:2008 is applied
    to other liquids. ISO 28300:2008 does not apply to external floating-roof tanks.
