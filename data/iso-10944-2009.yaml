abstract:
- language: en
  script: Latn
  content: ISO 10944:2009, together with ISO 15004-1, specifies minimum requirements
    and test methods for synoptophores (also called major amblyoscopes or synoptometers)
    used to test, measure, train and develop the patient's binocular vision and to
    measure horizontal, vertical and cyclo deviation in different positions of gaze.
    ISO 10944:2009 takes precedence over ISO 15004-1, if differences exist.
