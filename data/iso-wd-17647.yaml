abstract:
- language: en
  script: Latn
  content: This proposal specifies a liquid chromatography tandem mass spectrometry
    (LC-MS/MS) method for the qualitative detection of specific peptides derived from
    meat and meat products. It can be applied to the detection of bovine (Bos taurus,
    Bos mutus, Bos indicus, Bison), pig (Sus scrofa), sheep (Ovis aries, Capra hircus),
    chicken (Gallus), duck (Anas platyrhynchos, Cairina moschata), horse (Equus caballus),
    soy (Glycine soja, Glycine max), pea (Pisum sativum), and peanut (Arachis hypogaea,
    Arachis duranensis) materials.
