abstract:
- language: en
  script: Latn
  content: ISO 11210:2014 specifies a gravimetric method for the determination of
    platinum in platinum jewellery alloys, preferably within the range of fineness
    stated in ISO 9202. These alloys can contain palladium, iridium, rhodium, copper,
    cobalt, gold, ruthenium, gallium, chromium, indium, and less than 5 % tungsten.
    Some modifications are indicated where palladium, iridium, rhodium, gold, or ruthenium
    are present.
