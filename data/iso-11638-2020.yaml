abstract:
- language: en
  script: Latn
  content: This document specifies the characteristics of heterogeneous poly(vinyl
    chloride) flooring on foam, based on poly(vinyl chloride), and supplied in roll
    form or tile and plank. Such products can contain a transparent, non PVC factory
    finish. To encourage the consumer to make an informed choice, this document includes
    a classification system, based on intensity of use, which shows where these floor
    coverings can be expected to give satisfactory service. It also specifies requirements
    for marking.
