abstract:
- language: en
  script: Latn
  content: Specifies a method of determining the liquid flow-rate by measuring the
    mass of liquid delivered into a weighing tank in a known time intervall. Deals
    in particular with the measuring apparatus, the procedure, the method for calculating
    the flow-rate and the uncertainties associated with the measurement. Does not
    cover the cases of corrosive or toxic liquids.
