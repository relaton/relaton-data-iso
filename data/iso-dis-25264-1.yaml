abstract:
- language: en
  script: Latn
  content: 'This document defines the roles, role architecture, function models, and
    typical scenarios of a photovoltaic power supply management system for highway
    mobility services. The following are within the scope of this documents: a) The
    basic role model, operational layer role model, and service layer role model of
    the photovoltaic power supply management system for mobility; b) The role architecture
    of various stakeholders involved in providing photovoltaic power supply management
    services, along with their respective duties and responsibilities; c) Typical
    scenarios for providing photovoltaic power supply services.'
