abstract:
- language: en
  script: Latn
  content: ISO 24631-2:2009 provides the means of evaluating the conformance with
    ISO 11784 and ISO 11785 of RFID (radiofrequency identification) transceivers used
    in the individual identification of animals. It also specifies the procedure for
    applying for a transceiver test approval and the associated rights and obligations
    of the parties involved. ISO 24631:2009 includes a wireless synchronization test
    applicable to mobile transceivers; it contains no provision however for evaluating
    the wired synchronization of stationary transceivers.
