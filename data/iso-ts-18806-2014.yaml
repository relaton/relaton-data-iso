abstract:
- language: en
  script: Latn
  content: ISO/TS 18806:2014 specifies two methods (high temperature combustion and
    bomb combustion) for the determination of chlorine in solid mineral fuels. It
    is applicable to hard coals, brown coals, coke, and tailings. The chlorine in
    the digestion solution can be determined using different methods, e.g. an ion-selective
    electrode, coulometric or potentiometric titration, spectrophotometry, or ion
    chromatography. In this Technical Specification, the ion chromatographic separation
    with conductivity detection is described. The method is applicable to determine
    the chlorine content higher than 0,005 per cent mass fraction.
