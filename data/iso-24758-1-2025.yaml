abstract:
- language: en
  script: Latn
  content: 'This document specifies evaluation methods for determining the content
    of reactive oxygen species (ROS) used in the FB-facilitated advanced oxidation
    for pollution abatement in the wastewater treatment process. The probe based kinetic
    model is applicable to systems that generate ROS in substantial quantities, rather
    than at physiological concentrations, and is applicable to short-lived ROS. However,
    it is not applicable to long-lived ROS, such as ozone (O3) and hydrogen peroxide
    (H2O2). The probe based kinetic model method specifies: —     cumulative concentration
    of different types of ROS during the reaction process; —     concentration of
    different types of ROS at each time point during the reaction process. This method
    does not define the mechanisms of ROS generation, nor the correlation between
    bubble size and ROS production.'
