abstract:
- language: en
  script: Latn
  content: 'ISO 17422:2002 provides a structure for inclusion of environmental aspects
    in standards for plastics products. It proposes an approach which is directed
    at minimizing any adverse environmental impact without detracting from the primary
    purpose of ensuring adequate fitness for use of the products under consideration.
    The guidance provided by this International Standard is intended primarily for
    use by standards writers. Over and above its primary purpose, however, the standard
    provides guidance of value to those involved in design work and other activities
    where environmental aspects of plastics are being considered. NOTE This International
    Standard is intended to promote the following practices: the use of techniques
    for identifying and assessing the environmental impact of technical provisions
    in standards, and for minimizing their adverse effects;the adoption of good practices
    such as:procedures for pollution avoidance,material and energy conservation in
    the light of the intended use (and foreseeable misuse) of the product,safe use
    of hazardous substances,avoidance of technically unjustifiable restrictive practices,promotion
    of performance criteria rather than exclusion clauses such as are based, for example,
    only on chemical composition criteria;the adoption of a balanced approach in standards
    development to issues such as environmental impact, product function and performance,
    health and safety, and other regulatory requirements;the regular review and revision
    of existing standards in the light of technical innovations, permitting improvement
    in the environmental impact of products and processes;the application of life
    cycle analytical approaches wherever applicable and technically justifiable.'
