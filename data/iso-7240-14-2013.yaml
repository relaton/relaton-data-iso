abstract:
- language: en
  script: Latn
  content: ISO 7240-14:2013 specifies the design, installation, commissioning, and
    service requirements for a fire detection and alarm system (FDAS), which is primarily
    intended to provide early detection of fire and notification within one or more
    specified indoor or outdoor areas for the protection of lives. The FDAS includes
    automatic detection of a fire and manual initiation of a fire alarm, with audible
    and visual warning to people within the detection area. ISO 7240-14:2013 also
    specifies requirements for FDAS capable of providing signals to audible warning
    systems in accordance with ISO 7240-19, to initiate the operation of ancillary
    technical services, such as fixed fire extinguishing systems, and to other precautions
    and actions. The protection of property is outside the scope of ISO 7240-14:2013.
    However, the requirements specified herein may be used as recommendations for
    property protection.
