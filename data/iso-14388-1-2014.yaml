abstract:
- language: en
  script: Latn
  content: ISO 14388-1:2014 provides a general introduction to acid sulfate soils
    and the approaches that can be used to measure the various components of this
    special group of soils and their potential to produce acidity. It provides a compilation
    of the test methods, identification and definitions of the symbols, terms, and
    acronyms used in this series of ISO 14388. While part of the decision-making process
    can involve the analysis of prepared wet or dry samples, ISO 14388-1:2014 specifically
    outlines the procedures that are involved for preparing and analysing dried samples.
    ISO 14388-1:2014 also provides a procedure for pre-treating acid sulfate soil
    following sampling, prior to their analysis as dried sample using appropriate
    methods of test. The procedure includes the handling of samples before delivery
    to the laboratory, and the drying, grinding, and storage of samples. The standard
    also provides a procedure for archiving a sample after analysis. ISO 14388-1:2014
    provides an acid-base accounting method to calculate the net acid-producing potential
    of acid sulfate soil materials by individually assessing the acid-producing capacity
    due to oxidation of inorganic sulfides, the existing acidity, and the effective
    acid-consuming capacity using results obtained in ISO 14388-2 and ISO 14388-3.
