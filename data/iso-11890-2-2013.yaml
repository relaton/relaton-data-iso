abstract:
- language: en
  script: Latn
  content: ISO 11890-2:2013 is one of a series of standards dealing with the sampling
    and testing of paints, varnishes and related products. It specifies a method for
    the determination of the volatile organic compound (VOC) content of paints, varnishes
    and their raw materials. This part is preferred if the expected VOC content is
    greater than 0,1 % by mass and less than about 15 % by mass. When the VOC content
    is greater than about 15 % by mass, the less complicated method given in ISO 11890‑1
    may be used. This method assumes that the volatile matter is either water or organic.
    However, other volatile inorganic compounds can be present and might need to be
    quantified by another suitable method and allowed for in the calculations.
