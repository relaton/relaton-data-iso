abstract:
- language: en
  script: Latn
  content: 'This document specifies guidelines for the representation and visualization
    of smart cities. This document: describes the concepts of a smart city, smart
    city object and smart city data, describes categories of data associated with
    smart cities,provides guidance for representation of smart cities, describes guidance
    for visualization of smart cities, provides guidance in selecting the appropriate
    representation and visualization technique for different categories of smart city
    data using standards, and provides use cases for applying standards to the representation
    and visualization of smart cities.'
