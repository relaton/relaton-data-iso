abstract:
- language: en
  script: Latn
  content: This document specifies the laboratory test procedure for determining the
    clamping force exerted by the fastening system on the foot of the rail by measuring
    the force to separate the rail foot from its immediate support. When required,
    the procedure is also used to determine the uplift stiffness of the fastening
    system. It is applicable to systems with and without baseplates on all types of
    sleepers, bearers or elements of ballastless track. The test does not determine
    the security of the fastening components fixed into the sleeper or other fastening
    system support. This test procedure applies to a complete fastening assembly.
    It is not applicable to fastening systems for embedded rail or other fastening
    systems which do not act on the foot of the rail.
