abstract:
- language: en
  script: Latn
  content: This document specifies linear Gaussian filters for the filtration of surface
    profiles. It defines, in particular, how to separate large- and small-scale lateral
    components of surface profiles. The concept presented for closed profiles are
    applicable to the case of roundness filtration. Where appropriate, these concept
    can be extended to generalized closed profiles, especially for surface profiles
    with re-entrant features. Implementation details are given in Annex A for open
    profiles and Annex B for closed profiles.
