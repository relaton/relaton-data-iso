abstract:
- language: en
  script: Latn
  content: ISO 13263:2010 specifies a method for testing the impact resistance of
    fittings by dropping them on to a rigid surface. For a fitting with seal-retaining
    components, such as seal-retaining caps or rings, the method includes assessment
    of the watertightness of the fittings when the fixing elements show disturbance
    as a result of the test. It is applicable to fittings made from thermoplastics
    materials intended to be used for buried and above-ground applications.
