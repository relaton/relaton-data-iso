abstract:
- language: en
  script: Latn
  content: ISO 11916-1:2013 specifies the measurement of explosive and related nitrocompounds
    in soils and soil materials. ISO 11916-1:2013 is intended for the trace analysis
    of explosives and related compounds by high-performance liquid chromatography
    (HPLC) using an ultraviolet (UV) detector. Under the conditions specified in ISO
    11916-1:2013, concentrations as low as 0,1 mg/kg to 1 mg/kg dry matter can be
    determined, depending on the substance. Similar compounds, in particular various
    nitroaromatics, by-products and degradation products of explosive compounds may
    be analysed using this method. However, the applicability should be checked on
    a case-by-case basis.
