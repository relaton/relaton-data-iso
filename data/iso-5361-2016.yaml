abstract:
- language: en
  script: Latn
  content: ISO 5361:2016 provides essential performance and safety requirements for
    oro-tracheal and naso-tracheal tubes and tracheal tube connectors. Tracheal tubes
    with walls reinforced with metal or nylon, tracheal tubes with shoulders, tapered
    tracheal tubes, tracheal tubes with means for suctioning, monitoring or delivery
    of drugs or other gases, and the many other types of tracheal tubes devised for
    specialized applications are included in this International Standard, as many
    specialized tracheal tubes are now commonly used, and all share similar essential
    requirements as defined in this International Standard. Endobronchial (including
    tracheobronchial) tubes, tracheostomy tubes, and supralaryngeal airways are excluded
    from the scope of ISO 5361:2016. Tracheal tubes intended for use with flammable
    anaesthetic gases or agents, lasers, or electrosurgical equipment are outside
    the scope of ISO 5361:2016.
