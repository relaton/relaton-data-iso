abstract:
- language: en
  script: Latn
  content: ISO 13628-7:2005 gives requirements and recommendations for the design,
    analysis, materials, fabrication, testing and operation of subsea completion/workover
    (C/WO) riser systems run from a floating vessel. It is applicable to all new C/WO
    riser systems and may be applied to modifications, operation of existing systems
    and reuse at different locations and with different floating vessels. ISO 13628-7:2005
    is intended to serve as a common reference for designers, manufacturers and operators/users,
    thereby reducing the need for company specifications. ISO 13628-7:2005 is limited
    to risers, manufactured from low alloy carbon steels. Risers fabricated from special
    materials such as titanium, composite materials and flexible pipes are beyond
    the scope of ISO 13628-7:2005. Specific equipment covered by ISO 13628-7:2005
    include riser joints, connectors; workover control systems; surface flow trees,
    surface tree tension frames, lower workover riser packages, lubricator valves,
    retainer valves, subsea test trees, shear subs, tubing hanger orientation systems,
    swivels, annulus circulation hoses, riser spiders, umbilical clamps, handling
    and test tools, tree cap running tools. Associated equipment not covered by ISO
    13628-7:2005 include tubing hangers, internal and external tree caps, tubing hanger
    running tools, surface coiled tubing units, surface wireline units, surface tree
    kill and production jumpers.
