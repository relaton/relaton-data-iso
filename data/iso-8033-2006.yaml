abstract:
- language: en
  script: Latn
  content: 'Adequate adhesion between the various components of a hose is essential
    if it is to perform satisfactorily in service. ISO 8033:2006 specifies methods
    for the determination of the adhesion between lining and reinforcement, between
    cover and reinforcement, between reinforcement layers, between cover and outer
    lamination (thin layer of material outside the cover for protection) and between
    lining and inner lamination (thin layer of material inside the lining to reduce
    permeation of fluid into the lining). It covers all bore sizes and the following
    types of hose construction: woven textile fabric;braided textile fabric;knitted
    textile fabric;circular-woven textile fabric;textile spiral;textile cord;wire
    braid;wire spiral;hoses containing a supporting helix.'
