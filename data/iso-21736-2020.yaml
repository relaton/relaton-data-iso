abstract:
- language: en
  script: Latn
  content: This document specifies the principle, equipment, test pieces, procedures,
    result expression and test report of test methods for thermal shock resistance
    of refractories. Three test methods are included in this document. Each one is
    applicable to a different product type and their test results are not comparable.
    The test method, the test temperature and the test condition are intended to be
    negotiated by corresponding parties. This document does not purport to address
    all of the safety concerns, if any, associated with its use. It is the responsibility
    of the user to establish appropriate safety and health practices and determine
    the applicability of regulatory limitations prior to use.
