abstract:
- language: en
  script: Latn
  content: 'ISO/TS 10303-1352:2006 specifies the application module for Catalog data
    information and shape representation. The following are within the scope of ISO/TS
    10303-1352:2006: representation of catalog product data definition; supporting
    of catalog product stucture; possibility of variants and options for product representations;
    products classification and products specification associated control; product
    dimensions; price lists based on products identification and associated characteristics;
    product configuration based on diferent characteristics; multi-language support;
    approval status of the products; effectivity for data validation; documents definition
    and assignment; product identified by its manufacturing configuration; product
    geometry including advanced boundary representation, faceted boundary representation,
    manifold surfaces with topology, geometrically bounded surface, geometrically
    bounded wireframe 2d and 3d geometry, wireframe with topology, and constructive
    solid geometry; product geometric validation properties, for the assessment of
    the quality of conversions that occur in a transfer of geometric data; surface
    conditions; geometric tolerance.'
