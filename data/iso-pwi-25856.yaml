abstract:
- language: en
  script: Latn
  content: This document specifies a method for evaluating the composition of new
    and aged grease (oil content, thickener, filler, diverse pollutants) by thermogravimetric
    analysis. The method has been developed with a view of the determination of lubricating
    grease composition (base oil and thickener content) and of the pollution in service
    by inorganic matter (diverse pollutants, wear metals), after subtraction of the
    inorganic matter content of the new grease. The final result of the test allow
    to express the mass fractions of oil, thickener and residue.
