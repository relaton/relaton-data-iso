abstract:
- language: en
  script: Latn
  content: This document provides an analysis of the use of licence plate number (LPN)
    information and automatic number plate recognition (ANPR) technologies in electronic
    fee collection (EFC), through the description of the legal, technical and functional
    contexts of LPN-based EFC. It also provides an associated gap analysis of the
    EFC standards to identify actions to support standardized use of the identified
    technologies, and a roadmap to address the identified gaps. The gap analysis in
    this document is based on use cases, relevant regulations, standards and best
    practices in the field of EFC, based on the European electronic toll service (EETS)[27]
    model. Examples of licence plate number (LPN)-based tolling schemes are given
    in Annex A.
