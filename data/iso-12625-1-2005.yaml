abstract:
- language: en
  script: Latn
  content: ISO 12625-1:2005 establishes general principles for the use of terms in
    the entire working field of tissue paper and tissue products. It permits the use
    of a common terminology in industry and commerce. It is expressly stated that
    the detection of impurities and contraries in tissue paper and tissue products
    should be applied according to ISO 15755. For the determination of moisture content
    in tissue paper and tissue products, ISO 287 should be applied. In addition to
    terms in English and French (two of the three official ISO languages), ISO 12625-1:2005
    gives the equivalent terms in German; these are published under the responsibility
    of the member body for Germany (DIN). However, only the terms and definitions
    given in the official languages can be considered as ISO terms and definitions.
