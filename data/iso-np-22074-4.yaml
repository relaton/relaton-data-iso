abstract:
- language: en
  script: Latn
  content: This document specifies a laboratory test procedure for applying repeated
    load cycles which generate displacement cycles representative of the displacements
    caused by traffic on railway track. It is used for assessing the long-term performance
    of rail fastening systems. This document is applicable to surface mounted rail
    on sleepers, bearers and slab track and embedded rail. This test procedure applies
    to a complete fastening assembly.
