abstract:
- language: en
  script: Latn
  content: 'Within the context of digital technology platforms as defined in ISO/IEC
    TS 5928, this document provides: —     a description of the concepts of the platform
    capabilities type as it appears in various cloud service categories; —     a description
    of the specific cloud service category of platform as a service (PaaS); —    
    descriptions of common technology platform architectures, development approaches,
    and life cycles of elements of technology platform services, including a high-level
    description of the popular cloud native computing concept; —     recommendations
    for cloud services that include platform capabilities, including but not limited
    to PaaS.'
