name: Crawler

on:
  push:
    branches: [ data-v2 ]
    tags: [ v* ]
  pull_request:
  schedule:
  - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Force re-ingestion of every record (ignore Last-Modified)
        required: false
        default: false
        type: boolean

jobs:
  crawl:
    uses: relaton/support/.github/workflows/crawler.yml@main
    with:
      args: ${{ inputs.force_refresh && 'iso-open-data-all' || '' }}
    secrets:
      args: ${{ secrets.GITHUB_TOKEN }}
